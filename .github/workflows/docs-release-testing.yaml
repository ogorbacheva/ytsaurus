name: Docs manual Upload [to testing only]

on:
  workflow_dispatch:
    inputs:
      storage_profile:
        description: Storage profile for the revision upload
        required: true
        type: choice
        default: legacy-ytsaurus
        options:
          - legacy-ytsaurus
          - configured

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      src-root: "./yt/docs"
      build-root: "./_docs-build"
      lint-root: "./_docs-lint"
      revision: "${{ github.sha }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install diplodoc
        run: |
          npm install -g @diplodoc/cli
          npm install -g @diplodoc/algolia-extension
        shell: bash

      - name: Build doc md2html
        id: build-md2html
        env:
          index-name: "ytsaurus-docs"
        run: |
          yfm -i ${{ env.src-root }} -o ${{ env.lint-root }} --extensions "$(npm root -g)/@diplodoc/algolia-extension" --index-name ${{ env.index-name }}-${{ env.revision }} --api-key ${{ secrets.ALGOLIA_API_KEY }} --app-id ${{ secrets.ALGOLIA_APP_ID }}  2>&1 | tee './build-html.log'

          echo "exitcode=$?" >> $GITHUB_OUTPUT
        shell: bash


      - name: Build md2md
        id: build-md2md
        run: |
          yfm -i ${{ env.src-root }} -o ${{ env.build-root }} --output-format md --add-map-file --allow-custom-resources 2>&1 | tee './build-md.log'

          echo "exitcode=$?" >> $GITHUB_OUTPUT
        shell: bash

      - name: Save inputs
        run: |
          mkdir -p ./inputs
          echo ${{ env.revision }} > ./inputs/revision
          echo ${{ github.event.number }} > ./inputs/pr-number
        shell: bash

      - name: Upload inputs
        uses: actions/upload-artifact@v4
        with:
          name: inputs
          path: inputs/
          include-hidden-files: true
          retention-days: 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-md
          include-hidden-files: true
          path: ${{ env.build-root }}
          retention-days: 1

      - name: Upload build html doc
        uses: actions/upload-artifact@v4
        with:
          name: build-output-html
          path: ${{ env.lint-root }}
          retention-days: 1

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log-html
          path: ./build-html.log
          retention-days: 1

      - name: Exit
        run: |
          exitcode=${{ steps.build-md2html.outputs.exitcode }}

          if [ "$exitcode" -eq 0 ]; then
              echo "Build exited successfully."
          else
            echo "Build exited with an error. Exit code: $exitcode"
            exit $exitcode
          fi
        shell: bash

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      STORAGE_BUCKET_BASE: ${{ inputs.storage_profile == 'legacy-ytsaurus' && vars.DIPLODOC_YTSAURUS_STORAGE_BUCKET || vars.DIPLODOC_STORAGE_BUCKET }}
      STORAGE_ENDPOINT: ${{ inputs.storage_profile == 'legacy-ytsaurus' && vars.DIPLODOC_YTSAURUS_STORAGE_ENDPOINT || vars.DIPLODOC_STORAGE_ENDPOINT }}
      STORAGE_REGION: ${{ inputs.storage_profile == 'legacy-ytsaurus' && vars.DIPLODOC_YTSAURUS_STORAGE_REGION || vars.DIPLODOC_STORAGE_REGION }}
      STORAGE_ACCESS_KEY_ID: ${{ inputs.storage_profile == 'legacy-ytsaurus' && secrets.DIPLODOC_YTSAURUS_ACCESS_KEY_ID || secrets.DIPLODOC_ACCESS_KEY_ID }}
      STORAGE_SECRET_ACCESS_KEY: ${{ inputs.storage_profile == 'legacy-ytsaurus' && secrets.DIPLODOC_YTSAURUS_SECRET_ACCESS_KEY || secrets.DIPLODOC_SECRET_ACCESS_KEY }}
    steps:
      - name: Validate storage profile
        run: |
          if [[ -z "${STORAGE_BUCKET_BASE}" || -z "${STORAGE_ENDPOINT}" || -z "${STORAGE_REGION}" ]]; then
            echo "::error::Variables are not configured for storage profile '${{ inputs.storage_profile }}'."
            exit 1
          fi
          if [[ -z "${STORAGE_ACCESS_KEY_ID}" || -z "${STORAGE_SECRET_ACCESS_KEY}" ]]; then
            echo "::error::Secrets are not configured for storage profile '${{ inputs.storage_profile }}'."
            exit 1
          fi
        shell: bash
      - name: Show docs revision
        run: |
          echo "Revision: "${{ github.sha }}
          echo "Storage profile: "${{ inputs.storage_profile }}
          echo "Storage bucket: "${STORAGE_BUCKET_BASE}
      - name: Upload to testing
        uses: diplodoc-platform/docs-upload-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          storage-endpoint: ${{ env.STORAGE_ENDPOINT }}
          storage-region: ${{ env.STORAGE_REGION }}
          storage-bucket: ${{ env.STORAGE_BUCKET_BASE }}
          storage-access-key-id: ${{ env.STORAGE_ACCESS_KEY_ID }}
          storage-secret-access-key: ${{ env.STORAGE_SECRET_ACCESS_KEY }}
      - name: Verify uploaded revision and assets
        env:
          AWS_ACCESS_KEY_ID: ${{ env.STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.STORAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.STORAGE_REGION }}
        run: |
          for object in \
            .yfm \
            _assets/style/feedback-position.css
          do
            echo "Verify ${object}"
            aws s3api head-object \
              --region "${STORAGE_REGION}" \
              --bucket "${STORAGE_BUCKET_BASE}-stable" \
              --key "rev/${GITHUB_SHA}/${object}"
          done
        shell: bash
