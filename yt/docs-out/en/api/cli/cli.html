        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section contains information about the YTsaurus command line: &lt;a href=\"en/api/cli/cli.html#description\"&gt;description&lt;/a&gt;, &lt;a href=\"api/cli/install.html\"&gt;installation methods&lt;/a&gt;, and &lt;a href=\"api/cli/examples.html\"&gt;use cases&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"description\"&gt;&lt;a href=\"en/api/cli/cli.html#description\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Description&lt;/span&gt;&lt;/a&gt;Description&lt;/h2&gt;\n&lt;p&gt;The YTsaurus CLI (Command Line Interface) is the most convenient way to interact with the YTsaurus system from the console. The CLI fully implements the features of all the &lt;a href=\"api/commands.html\"&gt;commands&lt;/a&gt; supported by YTsaurus. The name of the command is specified as the first argument followed by its options. To get help on the CLI, just run the command:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt --&lt;span class=\"hljs-built_in\"&gt;help&lt;/span&gt;\nyt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; --&lt;span class=\"hljs-built_in\"&gt;help&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"9\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-9\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-9\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-9.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;To work with a cluster, you need to get an access token and put it in the &lt;code&gt;~/.yt/token&lt;/code&gt; file or the &lt;code&gt;YT_TOKEN&lt;/code&gt; environment variable.&lt;/p&gt;\n&lt;p&gt;For more information about the tokens and authentication, see the &lt;a href=\"user-guide/storage/auth.html\"&gt;Authentication&lt;/a&gt; section.&lt;/p&gt;\n&lt;p&gt;In addition to the access token, you need to specify the cluster to work with. To do this, you can specify the proxy server name in the &lt;code&gt;YT_PROXY&lt;/code&gt; environment variable: &lt;code&gt;export YT_PROXY=&amp;lt;cluster-name&amp;gt;&lt;/code&gt; or pass the proxy server name to each command individually via the &lt;code&gt;proxy&lt;/code&gt; option, such as &lt;code&gt;--proxy &amp;lt;cluster-name&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Below are some features of the CLI:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;All underscores in command and option names were replaced by hyphens.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;input_table_paths&lt;/code&gt; and &lt;code&gt;output_table_paths&lt;/code&gt; are specified via the &lt;code&gt;--src&lt;/code&gt; and &lt;code&gt;--dst&lt;/code&gt; options.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;To specify multiple columns for sort or reduce, pass the &lt;code&gt;sort-by&lt;/code&gt; or &lt;code&gt;reduce-by&lt;/code&gt; option several times, for example, &lt;code&gt;--sort-by a --sort-by b&lt;/code&gt; will sort by composite key &lt;code&gt;a b&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;If you write &lt;code&gt;--sort-by a,b&lt;/code&gt;, sorting by one column named &lt;code&gt;a,b&lt;/code&gt; will be performed.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;The &lt;code&gt;write&lt;/code&gt; command writes data chunk-by-chunk and under the transaction.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;There is a &lt;code&gt;find&lt;/code&gt; command (implemented on top of get) which partially replicates the unix find utility.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;By default, the &lt;code&gt;list&lt;/code&gt; command (without specifying the &lt;code&gt;--format&lt;/code&gt; parameter) just enters a list of node elements, each on a separate string. It also has the &lt;code&gt;-l&lt;/code&gt; option that will enter useful information about the nodes along with their names.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;By default, any files uploaded into YTsaurus are uploaded without the executable flag. If you want to upload a binary file that will run in a job, you must specify the &lt;code&gt;--executable&lt;/code&gt; option when uploading or set the &lt;code&gt;/@executable=true&lt;/code&gt; attribute after uploading.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"user-guide/storage/formats.html\"&gt;The formats of the data&lt;/a&gt; received at the command input and appearing at the command output can be specified through the following environment variables:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;YT_ARGUMENTS_FORMAT&lt;/code&gt;: Manages the format for the values of the options of the &lt;code&gt;--spec&lt;/code&gt;, &lt;code&gt;--attributes&lt;/code&gt; type. The default value is &lt;code&gt;yson&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;YT_STRUCTURED_DATA_FORMAT&lt;/code&gt;: Manages the format of the get/set command. The default value is &lt;code&gt;yson&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;YT_TABULAR_DATA_FORMAT&lt;/code&gt;: Manages the format of reading/writing tables, as well as starting operation jobs. There is no default value, the variable value must be set explicitly or the &lt;code&gt;--format&lt;/code&gt; option must be specified.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;There is a method to create aliases for commands. Aliases are specified in the &lt;code&gt;~/.yt/aliases&lt;/code&gt; file in &lt;code&gt;name=opts&lt;/code&gt; format. Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;mkdir&lt;/span&gt;=create map_node\n&lt;span class=\"hljs-built_in\"&gt;ls&lt;/span&gt;=list\n&lt;span class=\"hljs-built_in\"&gt;rm&lt;/span&gt;=remove\n&lt;span class=\"hljs-built_in\"&gt;mv&lt;/span&gt;=move\n&lt;span class=\"hljs-built_in\"&gt;cp&lt;/span&gt;=copy\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"94\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-94\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-94\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-94.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Auto-completion of binary file commands and paths for bash is supported.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/api/cli/cli.md","sourcePath":"en/api/cli/cli.md"},"headings":[{"title":"Description","href":"en/api/cli/cli.html#description","level":2}],"title":"Overview"},"router":{"pathname":"en/api/cli/cli","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
