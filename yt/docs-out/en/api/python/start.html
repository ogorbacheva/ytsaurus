            {"data":{"leading":false,"html":"&lt;h2 id=\"python-api\"&gt;&lt;a href=\"en/api/python/start.html#python-api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Python API&lt;/span&gt;&lt;/a&gt;Python API&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Before you start, install the Python client from the pip repository using the command:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;pip install ytsaurus-client\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"11\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-11\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-11\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-11.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;What becomes available after installing the package:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The Python yt library.&lt;/li&gt;\n&lt;li&gt;The CLI binary &lt;a href=\"api/cli/cli.html\"&gt;yt&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"install\"&gt;&lt;a href=\"en/api/python/start.html#install\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Installation&lt;/span&gt;&lt;/a&gt;Installation&lt;/h3&gt;\n&lt;h4 id=\"yson-libraries\"&gt;&lt;a href=\"en/api/python/start.html#yson-libraries\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YSON libraries&lt;/span&gt;&lt;/a&gt;YSON libraries&lt;/h4&gt;\n&lt;p&gt;To use the YSON format to work with tables, you need C++ bindings installed as a separate package. Installing &lt;a href=\"api/python/userdoc.html#yson_bindings\"&gt;YSON bindings&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;pip install ytsaurus-yson\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"38\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-38\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-38\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-38.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;It is currently impossible to install YSON bindings on Windows.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;For Apple M1 platform users&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;There are currently no YSON bindings built for the Apple platform. You can use &lt;a href=\"https://en.wikipedia.org/wiki/Rosetta_(software)\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Rosetta 2&lt;/a&gt; as a temporary solution and install the Python version for the x86_64 architecture.&lt;/p&gt;\n&lt;p&gt;Learn more &lt;a href=\"https://stackoverflow.com/questions/71691598/how-to-run-python-as-x86-with-rosetta2-on-arm-macos-machine\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;here&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;To learn more about YSON, see &lt;a href=\"api/python/userdoc.html#formats\"&gt;Formats&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;To find out the version of the installed Python wrapper, print the &lt;code&gt;yt.VERSION&lt;/code&gt; variable or call the &lt;code&gt;yt --version&lt;/code&gt; command.&lt;/p&gt;\n&lt;p&gt;If you encounter a problem, check the &lt;a href=\"en/api/python/start.html#faq\"&gt;FAQ&lt;/a&gt; section. If the problem persists, write to the &lt;a href=\"https://t.me/ytsaurus_ru\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;chat&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/yt/wrapper\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Library source code&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;We do not recommend installing the library and its dependent packages in different ways at the same time. This can lead to problems that are difficult to diagnose.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"userdoc\"&gt;&lt;a href=\"en/api/python/start.html#userdoc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;User documentation&lt;/span&gt;&lt;/a&gt;User documentation&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#common\"&gt;General&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#agreements\"&gt;Agreements used in the code&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#client\"&gt;Client&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#threadsafety\"&gt;Thread safety&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#gevent\"&gt;Asynchronous client based on gevent&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#configuration\"&gt;Configuration&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#configuration_common\"&gt;Shared config&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#configuration_logging\"&gt;Logging setup&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#configuration_token\"&gt;Token setup&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#configuration_retries\"&gt;Setting up retries&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#errors\"&gt;Errors&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#formats\"&gt;Formats&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#ypath\"&gt;YPath&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#commands\"&gt;Teams&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#cypress_commands\"&gt;Working with Cypress&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#file_commands\"&gt;Working with files&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#table_commands\"&gt;Working with tables&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#dataclass\"&gt;Data classes&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;[Schemas]&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#tablepath_class\"&gt;TablePath&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#table_commands\"&gt;Teams&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#parallel_read\"&gt;Parallel table reading&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#parallel_write\"&gt;Parallel table writing&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#transaction_commands\"&gt;Working with transactions and locks&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#run_operation_commands\"&gt;Running operations&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#spec_builder\"&gt;SpecBuilder&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#operation_and_job_commands\"&gt;Working with operations and jobs&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#operation_class\"&gt;Operation&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#operations_tracker_class\"&gt;OperationsTracker&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#operations_tracker_pool_class\"&gt;OperationsTrackerPool&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#acl_commands\"&gt;Working with access permissions&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#dyntables_commands\"&gt;Working with dynamic tables&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#etc_commands\"&gt;Other commands&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#python_operations\"&gt;Python objects as operations&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#python_operations_intro\"&gt;General information&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#prepare_operation\"&gt;Preparing an operation from a job&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#python_decorators\"&gt;Decorators&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#pickling\"&gt;Pickling functions and environments&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#pickling_description\"&gt;General structure&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#pickling_advises\"&gt;Link to a post with tips&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#porto_layers\"&gt;Porto layers&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#tmpfs_in_jobs\"&gt;tmpfs in jobs&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#python_jobs_statistics\"&gt;Statistics in jobs&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#python_operations_untyped\"&gt;Untyped Python operations&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#python_decorators_untyped\"&gt;Decorators&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#python_formats\"&gt;Formats&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#structured_data\"&gt;Structured data representation&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#control_attributes\"&gt;Control attributes&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#other_formats\"&gt;Other formats&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#other\"&gt;Other&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#grpc\"&gt;gRPC&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#yson_bindings\"&gt;YSON bindings&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#legacy\"&gt;Deprecated&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#python3_strings\"&gt;Python3 and byte strings&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"pydoc\"&gt;&lt;a href=\"en/api/python/start.html#pydoc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Help&lt;/span&gt;&lt;/a&gt;Help&lt;/h3&gt;\n&lt;p&gt;The most up-to-date help on specific functions and their parameters is in the code.&lt;/p&gt;\n&lt;p&gt;To view a description of functions and classes in the interpreter, proceed as follows:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;python\n&amp;gt;&amp;gt;&amp;gt; import yt.wrapper as yt\n&amp;gt;&amp;gt;&amp;gt; &lt;span class=\"hljs-built_in\"&gt;help&lt;/span&gt;(yt.run_sort)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"394\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-394\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-394\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-394.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"examples\"&gt;&lt;a href=\"en/api/python/start.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#base\"&gt;Basic level&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#read_write\"&gt;Reading and writing tables&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#table_schema\"&gt;Table schemas&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#simple_map\"&gt;Simple map&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#sort_and_reduce\"&gt;Sorting a table and a simple reduce operation&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#reduce_multiple_output\"&gt;Reduce with multiple input tables&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#reduce_multiple_input_output\"&gt;Reduce with multiple input and output tables&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#map_reduce\"&gt;mapreduce&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#map_reduce_multiple_intermediate_streams\"&gt;MapReduce with multiple intermediate tables&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#job_decorators\"&gt;Decorators for job classes&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#files\"&gt;Working with files on the client and in operations&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#grep\"&gt;Grep&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#advanced\"&gt;Advanced level&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#batch_queries\"&gt;Batch queries&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#rpc\"&gt;RPC&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#misc\"&gt;Miscellaneous&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#dataclass\"&gt;Data classes&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#table_switches\"&gt;Context and managing writes to output tables&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#spec_builder\"&gt;Spec builders&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#gevent\"&gt;Using gevent&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#untyped_tutorial\"&gt;Untyped API&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#read_write_untyped\"&gt;Reading and writing tables&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#simple_map_untyped\"&gt;Simple map&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#sort_and_reduce_untyped\"&gt;Sorting a table and a simple reduce operation&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#reduce_multiple_output_untyped\"&gt;Reduce with multiple input tables&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#reduce_multiple_input_output_untyped\"&gt;Reduce with multiple input and output tables&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#map_reduce_untyped\"&gt;MapReduce operation&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#job_decorators_untyped\"&gt;Decorators for job classes and functions&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#table_switches_untyped\"&gt;Table switches and context&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#yson_string_proxy\"&gt;Working with strings in Python3&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n\n&lt;h3 id=\"faq\"&gt;&lt;a href=\"en/api/python/start.html#faq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FAQ&lt;/span&gt;&lt;/a&gt;FAQ&lt;/h3&gt;\n&lt;p&gt;This section contains answers to a number of frequently asked questions about the Python API. Answers to other frequently asked questions are in the &lt;a href=\"faq/index.html\"&gt;FAQ&lt;/a&gt; section.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Q: I installed the package via pypi, but I get the &lt;code&gt;yt: command not found&lt;/code&gt; error.&lt;/strong&gt;&lt;br /&gt;\nA: Try running the&lt;br /&gt;\n&lt;code&gt;pip install ytsaurus-client --force-reinstall&lt;/code&gt; command&lt;br /&gt;\n, the log will most likely display a warning like &lt;code&gt;The script yt is installed in '...' which isn't on your PATH&lt;/code&gt;. To solve the problem, you need to add the specified path to the PATH environment variable. To do this, run the following command:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;echo 'export PATH=\"$PATH:&amp;lt;specified path&amp;gt;\"' &amp;gt;&amp;gt; ~/.bashrc\nsource ~/.bashrc\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"568\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-568\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-568\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-568.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Depending on the shell, the file may have a different name. The most common name on Mac is &lt;code&gt;~/.zshrc&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Q: Reading with retry ends with an error because of timeout.&lt;/strong&gt;&lt;br /&gt;\nA: Most likely there are too many chunks in the table, you need to enlarge them. Use &lt;code&gt;yt merge --src table --dst table --spec \"{combine_chunks=true}\"&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Q: The operation ends with a YSON error (for example: &lt;code&gt;YsonError: Premature end of stream&lt;/code&gt;) and the web interface displays a YSON parsing error.&lt;/strong&gt;&lt;br /&gt;\nA: The operation most likely writes to &lt;code&gt;stdout&lt;/code&gt;. This is prohibited from being done explicitly in Python via &lt;code&gt;print, sys.stdout.write()&lt;/code&gt; if the operation is not marked as &lt;code&gt;raw_io&lt;/code&gt;, but it can be done by a third-party program, such as an archiver.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Q: The Python library writes too much to stderr, how do I increase the level of logging?&lt;/strong&gt;&lt;br /&gt;\nA: You can increase the level by setting the &lt;code&gt;YT_LOG_LEVEL=\"ERROR\"&lt;/code&gt; environment variable or by setting up the YTsaurus logger: &lt;code&gt;logging.getLogger(\"Yt\").setLevel(logging.ERROR)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Q:  I start an operation on Mac OS X, but jobs end with errors like &lt;code&gt;ImportError: ./tmpfs/modules/_ctypes.so: invalid ELF header&lt;/code&gt;.&lt;/strong&gt;&lt;br /&gt;\nA: Since the Python wrapper takes all Python operation dependencies with it to the cluster, binary .so and .pyc files arrive there too, which then cannot be loaded. Use a porto layer with your local environment and enable filtering of these files so that they do not end up on the cluster. For more information, see the &lt;a href=\"api/python/userdoc.html#porto_layers\"&gt;section&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Q: Jobs end with the &lt;code&gt;Invalid table index N: expected integer in range [A,B]&lt;/code&gt; error.&lt;/strong&gt;&lt;br /&gt;\nA: The message means that you output a table index in the records and there is no corresponding table. This most often means that you have several input tables and one output table. The &lt;code&gt;@table_index&lt;/code&gt; fields appear in the input records by default. To disable them, you can change the format: &lt;code&gt;yt.config[\"tabular_data_format\"] = yt.YsonFormat(process_table_index=None)&lt;/code&gt;. To learn more about the format, see the &lt;a href=\"api/python/userdoc.html#python_formats\"&gt;section&lt;/a&gt;. As an alternative, explicitly indicate in the specification (example for a map operation): &lt;code&gt;{\"mapper\": {\"enable_input_table_index\": False}}&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Q: The (ReadTimeout, HTTPConnectionPool(....): Read timed out.) error appears after the operation is completed.&lt;/strong&gt;&lt;br /&gt;\nThe message means that the operation stderr could not be downloaded due to network problems and even repeated queries didn't help. In that case, you should use the &lt;code&gt;ignore_stderr_if_download_failed&lt;/code&gt; option which enables you to ignore stderr if you can't download it. We recommend using this option when writing production processes.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Q: I get the &lt;code&gt;Yson bindings required&lt;/code&gt; error.&lt;/strong&gt;&lt;br /&gt;\nThis means that YSON was selected as the input (output) format and bindings could not be imported in the job. To learn more about YSON and bindings, see the &lt;a href=\"api/python/userdoc.html#yson\"&gt;section&lt;/a&gt;. You need to install the bindings package and check that YSON bindings are not filtered out using &lt;code&gt;module_filter&lt;/code&gt;. This is a dynamic yson_lib.so library that can easily be accidentally filtered out when filtering out all .so files. In addition, so that &lt;code&gt;yt_yson_bindings&lt;/code&gt; that came in modules are not deleted, write &lt;code&gt;config[\"pickling\"][\"ignore_yson_bindings_for_incompatible_platforms\"] = False&lt;/code&gt; in the configuration file.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/api/python/start.md","sourcePath":"en/api/python/start.md"},"headings":[{"title":"Python API","href":"en/api/python/start.html#python-api","level":2,"items":[{"title":"Installation","href":"en/api/python/start.html#install","level":3,"items":[{"title":"YSON libraries","href":"en/api/python/start.html#yson-libraries","level":4}]},{"title":"User documentation","href":"en/api/python/start.html#userdoc","level":3},{"title":"Help","href":"en/api/python/start.html#pydoc","level":3},{"title":"Examples","href":"en/api/python/start.html#examples","level":3},{"title":"FAQ","href":"en/api/python/start.html#faq","level":3}]}],"title":""},"router":{"pathname":"en/api/python/start","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
