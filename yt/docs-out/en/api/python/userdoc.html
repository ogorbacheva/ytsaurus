n specification (the specified parameter has the highest priority when generating a specification). For example, you can specify the desired amount of data per job: &lt;code&gt;yt.run_map(my_mapper, \"//tmp/in\", \"//tmp/out\", spec={\"data_weight_per_job\": 1024 * 1024})&lt;/code&gt; (but in this particular case, it's more appropriate to use a &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.MapSpecBuilder.data_size_per_job\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;builder method&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;All the required specification parameters exist as individual options. Such parameters include the input and output table paths and the command (for operations with the custom code). For the sort, reduce, map_reduce, join_reduce operations, the &lt;code&gt;sort_by&lt;/code&gt;, &lt;code&gt;reduce_by&lt;/code&gt;, and &lt;code&gt;join_by&lt;/code&gt; parameters are specified as individual options.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;source_table&lt;/code&gt; and &lt;code&gt;destination_table&lt;/code&gt; parameters can accept as their input both a table path and a list of paths to tables, and correctly handle both cases, depending on whether the operation expects a table path or a set of table paths at the given point. Both the strings and &lt;a href=\"en/api/python/userdoc.html#tablepath_class\"&gt;TablePath&lt;/a&gt; objects are accepted as table paths.&lt;/p&gt;\n&lt;p&gt;Some of the included parameters have to be modified fairly regularly. This includes &lt;code&gt;job_io&lt;/code&gt; and its &lt;code&gt;table_writer&lt;/code&gt; part. These parameters will be added to the appropriate parts of the specification. If the operation includes multiple steps, then the parameters specified in &lt;code&gt;job_io&lt;/code&gt; will propagate to all the steps. For all the operations that have the &lt;code&gt;job_count&lt;/code&gt; parameter in the specification, this parameter is defined as a separate option.&lt;/p&gt;\n&lt;p&gt;For all the operations that include the custom code, a separate option is created for &lt;code&gt;memory_limit&lt;/code&gt;, as well as the &lt;code&gt;format&lt;/code&gt;, &lt;code&gt;input_format&lt;/code&gt;, and &lt;code&gt;output_format&lt;/code&gt; parameters that enable you to specify the &lt;a href=\"user-guide/storage/formats.html\"&gt;input and output data format&lt;/a&gt;. There are the &lt;code&gt;yt_files&lt;/code&gt; and &lt;code&gt;local_files&lt;/code&gt; parameters (and the &lt;code&gt;files&lt;/code&gt; alias) enabling you to set the file paths in Cypress and the paths to local files (respectively) that will be passed to the job environment.&lt;/p&gt;\n&lt;p&gt;For the map_reduce operation, all the parameters of the custom script described in the previous paragraph are copied separately for mapper, reducer, and reduce-combiner.&lt;/p&gt;\n&lt;p&gt;As the &lt;code&gt;binary&lt;/code&gt;, you can pass both the &lt;a href=\"user-guide/data-processing/operations/overview.html\"&gt;run command&lt;/a&gt; (as a string) and a callable Python object. The operations that access callable objects as &lt;code&gt;binary&lt;/code&gt; are referred to as &lt;a href=\"en/api/python/userdoc.html#python_operations\"&gt;Python operations&lt;/a&gt;. If a run command is passed as &lt;code&gt;binary&lt;/code&gt;, the &lt;a href=\"en/api/python/userdoc.html#python_formats\"&gt;format&lt;/a&gt; parameter is mandatory. However, the format is optional in the case of a callable object.&lt;/p&gt;\n&lt;p&gt;Any operation writing data to destination_table has the option that skips deleting the existing table but appends data to it. For this purpose, as destination_table, you can specify a &lt;a href=\"en/api/python/userdoc.html#tablepath_class\"&gt;TablePath object&lt;/a&gt; with &lt;code&gt;append=True&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;When running a &lt;code&gt;map_reduce&lt;/code&gt; operation with multiple input tables, keep in mind that the YTsaurus client can add table switches to input records. As a result, the switches might end up in the output stream (if you pass this data to the output stream as is, such as a mapper from some &lt;code&gt;yield row&lt;/code&gt;). This might result in the error of writing the record to a non-existing table. To avoid this situation, you should either disable the table index using the &lt;code&gt;enable_input_table_index&lt;/code&gt; option or manually delete the table index before writing data to the output stream: &lt;code&gt;del row[\"@table_index\"]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;For the &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_map_reduce\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_map_reduce&lt;/a&gt; function, all the options specific to a given job exist in three copies: for the mapper, reducer, and reduce_combiner. That is, the function has the options &lt;code&gt;map_local_files&lt;/code&gt;, &lt;code&gt;reduce_local_files&lt;/code&gt;, &lt;code&gt;reduce_combiner_local_files&lt;/code&gt;, etc. For a full list of options, see &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_map_reduce\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;pydoc&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"operation_and_job_commands\"&gt;&lt;a href=\"en/api/python/userdoc.html#operation_and_job_commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with operations and jobs&lt;/span&gt;&lt;/a&gt;Working with operations and jobs&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.get_operation_state\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get_operation_state&lt;/a&gt;: Returns the state of the current operation. The object returned is a class that has a single  &lt;code&gt;name&lt;/code&gt; field and the &lt;code&gt;is_finished, is_running, is_unsuccessfully_finished&lt;/code&gt; methods.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.abort_operation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;abort_operation&lt;/a&gt;: Abort the operation without saving its result.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.suspend_operation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;suspend_operation&lt;/a&gt;: Suspend the operation.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.resume_operation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;resume_operation&lt;/a&gt;: Resume the suspended operation.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.complete_operation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;complete_operation&lt;/a&gt;: Complete the operation with the current result.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;When running an operation with the &lt;code&gt;sync=False&lt;/code&gt; flag, it's more convenient to use the &lt;code&gt;abort, suspend, resume, complete&lt;/code&gt; methods from the &lt;code&gt;Operation&lt;/code&gt; class than the above methods (see the &lt;a href=\"en/api/python/userdoc.html#operation_class\"&gt;Operation&lt;/a&gt; section).&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_job_shell\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_job_shell&lt;/a&gt;: Run a job-shell for the job. The easiest way to use this function is with its analogous command in &lt;a href=\"api/cli/examples.html\"&gt;CLI&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"operation_and_job_info_commands\"&gt;&lt;a href=\"en/api/python/userdoc.html#operation_and_job_info_commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Getting information about jobs and operations&lt;/span&gt;&lt;/a&gt;Getting information about jobs and operations&lt;/h4&gt;\n&lt;p&gt;This operation has a fairly non-trivial life cycle, and at certain points in time the information about the operation can be obtained from various sources:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Cypress (contains information about the running operations that haven't been archived yet)&lt;/li&gt;\n&lt;li&gt;The Orchid of the controller agent (includes all current information about the running operations)&lt;/li&gt;\n&lt;li&gt;Operation archive (includes information about completed operations)&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Because you can get information about an operation from different sources (and not only the list of sources can change, but also the structure of each source), there exist the following methods that can collect information about an operation from the listed sources anytime.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operation_commands.get_operation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get_operation&lt;/a&gt;: Get information about the operation based on its ID. A &lt;code&gt;dict&lt;/code&gt; is returned with fields similar to the fields in the &lt;a href=\"api/commands.html#get_operation\"&gt;get_operation&lt;/a&gt; response.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operation_commands.list_operations\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;list_operations&lt;/a&gt;: Get information about a set of operations based on filters. The meaning of the fields is similar to &lt;code&gt;get_operation&lt;/code&gt;. For a list of filters, see &lt;a href=\"api/commands.html#list_operations\"&gt;Commands&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operation_commands.iterate_operations\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;iterate_operations&lt;/a&gt;: Get an iterator for a set of operations. This function is similar to &lt;code&gt;list_operations&lt;/code&gt;, but it doesn't set restrictions on the number of requested operations.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;An example is to output the types of the three latest operations run by &lt;code&gt;username&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; datetime &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; datetime\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\nresult = yt.list_operations(\n    user=&lt;span class=\"hljs-string\"&gt;\"username\"&lt;/span&gt;,\n    cursor_time=datetime.utcnow(),\n    cursor_direction=&lt;span class=\"hljs-string\"&gt;\"past\"&lt;/span&gt;,\n    limit=&lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;,\n)\n&lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;([op[&lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;] &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; op &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; result[&lt;span class=\"hljs-string\"&gt;\"operations\"&lt;/span&gt;]])\n&lt;span class=\"hljs-comment\"&gt;## Output: ['sort', 'sort', 'sort']&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1670\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1670\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1670\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1670.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Another example is to find all the executing operations run in the user ephemeral pools:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; op &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; client.iterate_operations(state=&lt;span class=\"hljs-string\"&gt;\"running\"&lt;/span&gt;):\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"$\"&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; op.get(&lt;span class=\"hljs-string\"&gt;\"pool\"&lt;/span&gt;):\n        &lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;(op[&lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt;], op[&lt;span class=\"hljs-string\"&gt;\"start_time\"&lt;/span&gt;])\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1674\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1674\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1674\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1674.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The information about the operation's job is available in the scheduler and in the archive. The following methods enable you to get information about jobs.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operation_commands.get_job\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get_job&lt;/a&gt;: Get information about the job. A &lt;code&gt;dict&lt;/code&gt; is returned with fields similar to the fields in the &lt;a href=\"api/commands.html#get_job\"&gt;get_job&lt;/a&gt; response.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operation_commands.list_jobs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;list_jobs&lt;/a&gt;: Get information about the set of jobs for the operation. The meaning of fields in the response is similar to that in &lt;code&gt;get_job&lt;/code&gt;. For a list of filters, see &lt;a href=\"api/commands.html#list_jobs\"&gt;Commands&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operation_commands.get_job_stderr\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get_job_stderr&lt;/a&gt;: Get the stderr of the job.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operation_commands.get_job_input\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get_job_input&lt;/a&gt;: Get the job's full input&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operation_commands.get_job_input_paths\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get_job_input_paths&lt;/a&gt;: Get the list of input tables (with row ranges) for the job.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.get_job_spec\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get_job_spec&lt;/a&gt;: Get the specification of the job.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;When you call functions described in this section from inside themselves, they can access the master servers, the scheduler, and the cluster nodes (note that accesses to the master servers and to the scheduler aren't scalable), so you shouldn't use them too often.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;For debugging of failed jobs, it's convenient to use the &lt;a href=\"user-guide/problems/jobstatistics.html\"&gt;job tool&lt;/a&gt;. This utility enables you to prepare the environment similar to the job environment and run it with the same input data.&lt;/p&gt;\n&lt;h4 id=\"operation_class\"&gt;&lt;a href=\"en/api/python/userdoc.html#operation_class\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Operation&lt;/span&gt;&lt;/a&gt;Operation&lt;/h4&gt;\n&lt;p&gt;The object of this class is returned by the operation run commands (&lt;code&gt;run_*&lt;/code&gt;). It provides a &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operation_commands.Operation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;small API&lt;/a&gt; to work with the already running or completed operations.&lt;/p&gt;\n&lt;h4 id=\"operations_tracker_class\"&gt;&lt;a href=\"en/api/python/userdoc.html#operations_tracker_class\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;OperationsTracker&lt;/span&gt;&lt;/a&gt;OperationsTracker&lt;/h4&gt;\n&lt;p&gt;To handle several operations CONVENIENTLY, you can use &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operations_tracker.OperationsTracker\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;OperationsTracker&lt;/a&gt;. You can also use it for working with operations running on different clusters. OperationsTracker has the following interface:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operations_tracker.OperationsTrackerBase.add\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;add&lt;/a&gt;: Add an &lt;code&gt;Operation&lt;/code&gt; object to the set of tracked objects&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operations_tracker.OperationsTracker.add_by_id\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;add_by_id&lt;/a&gt;: Add the operation to the set of tracked operations using its ID&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operations_tracker.OperationsTrackerBase.wait_all\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;wait_all&lt;/a&gt;: Wait until all the operations are completed&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operations_tracker.OperationsTrackerBase.abort_all\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;abort_all&lt;/a&gt;: Abort all the tracked operations&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; yt.OperationsTracker() &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; tracker:\n    op1 = yt.run_map(&lt;span class=\"hljs-string\"&gt;\"sleep 10; cat\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/table1\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/table1_out\"&lt;/span&gt;, sync=&lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;)\n    op2 = yt.run_map(&lt;span class=\"hljs-string\"&gt;\"sleep 10; cat\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/table2\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/table2_out\"&lt;/span&gt;, sync=&lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;)\n    tracker.add(op1)\n    tracker.add(op2)\n    tracker.abort_all()\n    tracker.add(yt.run_map(&lt;span class=\"hljs-string\"&gt;\"true\"&lt;/span&gt;, table, TEST_DIR + &lt;span class=\"hljs-string\"&gt;\"/out\"&lt;/span&gt;, sync=&lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;))\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1760\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1760\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1760\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1760.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;When exiting the &lt;code&gt;with&lt;/code&gt; block, the tracker will wait until all the operations are completed. If an exception occurs, all the running operations are aborted.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Using the tracker without &lt;code&gt;with&lt;/code&gt; is deprecated and we don't recommend it.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"operations_tracker_pool_class\"&gt;&lt;a href=\"en/api/python/userdoc.html#operations_tracker_pool_class\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;OperationsTrackerPool&lt;/span&gt;&lt;/a&gt;OperationsTrackerPool&lt;/h4&gt;\n&lt;p&gt;The &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operations_tracker.OperationsTrackerPool\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;OperationsTrackerPool&lt;/a&gt; class is similar to &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operations_tracker.OperationsTracker\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;OperationsTracker&lt;/a&gt;, but it additionally guarantees that there won't be more than &lt;code&gt;pool_size&lt;/code&gt; operations running in parallel. As the input, the methods of the class accept one or more spec builders (see the appropriate &lt;a href=\"en/api/python/userdoc.html#spec_builder\"&gt;section&lt;/a&gt;).&lt;br /&gt;\nThis class creates a background thread that gradually runs all the operations from the queue, maintaining the guarantees for the number of concurrently running operations.&lt;br /&gt;\nInterface:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operations_tracker.OperationsTrackerPool.add\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;add&lt;/a&gt;: Accepts a spec builder as the input and adds it to the run queue&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operations_tracker.OperationsTrackerPool.map\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;map&lt;/a&gt;: Accepts a list of all the spec builders as its input. The other parameters have the same meaning as the add method.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"acl_commands\"&gt;&lt;a href=\"en/api/python/userdoc.html#acl_commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with access rights&lt;/span&gt;&lt;/a&gt;Working with access rights&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.check_permission\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;check_permission&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.add_member\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;add_member&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.remove_member\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;remove_member&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Examples:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.create(&lt;span class=\"hljs-string\"&gt;\"user\"&lt;/span&gt;, attributes={&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"tester\"&lt;/span&gt;})\nyt.check_permission(&lt;span class=\"hljs-string\"&gt;\"tester\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"read\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//sys\"&lt;/span&gt;)\n&lt;span class=\"hljs-comment\"&gt;## Output: {\"action\": \"allow\", ...}&lt;/span&gt;\nyt.create(&lt;span class=\"hljs-string\"&gt;\"group\"&lt;/span&gt;, attributes={&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"test_group\"&lt;/span&gt;})\nyt.add_member(&lt;span class=\"hljs-string\"&gt;\"tester\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"test_group\"&lt;/span&gt;)\nyt.get_attribute(&lt;span class=\"hljs-string\"&gt;\"//sys/groups/testers\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"members\"&lt;/span&gt;)\n&lt;span class=\"hljs-comment\"&gt;## Output: [\"tester\"]&lt;/span&gt;\nyt.remove_member(&lt;span class=\"hljs-string\"&gt;\"tester\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"test_group\"&lt;/span&gt;)\nyt.get_attribute(&lt;span class=\"hljs-string\"&gt;\"//sys/groups/testers\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"members\"&lt;/span&gt;)\n&lt;span class=\"hljs-comment\"&gt;## Output: []&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1815\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1815\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1815\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1815.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"dyntables_commands\"&gt;&lt;a href=\"en/api/python/userdoc.html#dyntables_commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with dynamic tables&lt;/span&gt;&lt;/a&gt;Working with dynamic tables&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Dynamic tables&lt;/a&gt; implement an interface both for point reads and for key-based data writes with transaction support and a native SQL dialect.&lt;/p&gt;\n&lt;p&gt;The list of commands to access the content of dynamic tables.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.insert_rows\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;insert_rows&lt;/a&gt;: &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html#insert_rows\"&gt;Insert&lt;/a&gt; rows to a dynamic table&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.lookup_rows\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;lookup_rows&lt;/a&gt;: &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html#chtenie-stroki\"&gt;Select&lt;/a&gt; the rows with the specified keys&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.delete_rows\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;delete_rows&lt;/a&gt;: &lt;a href=\"../../../user-guide/dynamic-tables//sorted-dynamic-tables.md#udalenie-stroki\"&gt;Delete&lt;/a&gt; the rows with the specified keys.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.select_rows\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;select_rows&lt;/a&gt;: &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html#vypolnenie-zaprosa\"&gt;Select&lt;/a&gt; the rows that match the query written in the &lt;a href=\"user-guide/dynamic-tables/dyn-query-language.html\"&gt;SQL dialect&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.lock_rows\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;lock_rows&lt;/a&gt;: &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html#blokirovka-stroki\"&gt;Lock&lt;/a&gt; the rows with the given keys&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.trim_rows\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;trim_rows&lt;/a&gt;: &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables#trim\"&gt;Delete&lt;/a&gt; the specified number of rows from the other table&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Commands related to &lt;a href=\"user-guide/dynamic-tables/overview.html#mount_table\"&gt;mounting&lt;/a&gt; of tables.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.mount_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;mount_table&lt;/a&gt;: Mount a dynamic table&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.unmount_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;unmount_table&lt;/a&gt;: Unmount a dynamic table&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.remount_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;remount_table&lt;/a&gt;: Remount a dynamic table&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Commands related to &lt;a href=\"user-guide/dynamic-tables/resharding.html\"&gt;sharding&lt;/a&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.reshard_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;reshard_table&lt;/a&gt;: Reshard the table using the specified pivot keys.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.reshard_table_automatic\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;reshard_table_automatic&lt;/a&gt;: Reshard the mounted tablets based on the tablet balancer configuration.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Other commands.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.freeze_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;freeze_table&lt;/a&gt;: &lt;a href=\"user-guide/dynamic-tables/overview.html#zamorozka\"&gt;Freeze&lt;/a&gt; the table&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.unfreeze_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;unfreeze_table&lt;/a&gt;: &lt;a href=\"user-guide/dynamic-tables/overview.html#zamorozka\"&gt;Unfreeze&lt;/a&gt; the table&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.balance_tablet_cells\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;balance_tablet_cells&lt;/a&gt;: Spread the tablets evenly across &lt;a href=\"user-guide/dynamic-tables/overview.html#tablet_cells\"&gt;tablet cells&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.get_tablet_infos\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get_tablet_infos&lt;/a&gt;: Get the &lt;a href=\"user-guide/dynamic-tables/overview.html#tablets\"&gt;tablet&lt;/a&gt;'s attributes&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.get_tablet_errors\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get_tablet_errors&lt;/a&gt;: Get the errors that occurred on the &lt;a href=\"user-guide/dynamic-tables/overview.html#tablets\"&gt;tablet&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.alter_table_replica\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;alter_table_replica&lt;/a&gt;: &lt;a href=\"user-guide/dynamic-tables/replicated-dynamic-tables.html#nastrojki-replik\"&gt;Change attributes&lt;/a&gt; of a replica of the &lt;a href=\"user-guide/dynamic-tables/replicated-dynamic-tables.html\"&gt;replicated table&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"etc_commands\"&gt;&lt;a href=\"en/api/python/userdoc.html#etc_commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Other commands&lt;/span&gt;&lt;/a&gt;Other commands&lt;/h3&gt;\n&lt;h4 id=\"converting-tables\"&gt;&lt;a href=\"en/api/python/userdoc.html#converting-tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Converting tables&lt;/span&gt;&lt;/a&gt;Converting tables&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Transform.&lt;/strong&gt; Occasionally, you might need to transform your table to a new compression codec, erasure codec, or a &lt;a href=\"user-guide/storage/chunks.html\"&gt;new chunk format&lt;/a&gt;. Such tasks are solved by the &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.transform\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;transform&lt;/a&gt; function.&lt;/p&gt;\n&lt;p&gt;This function starts the &lt;code&gt;merge&lt;/code&gt; operation on the input table, compressing the data based on the specified parameters. If the &lt;code&gt;check_codecs&lt;/code&gt; option is set to &lt;code&gt;True&lt;/code&gt;, the function checks whether the data has already been compressed, and if yes, then the operation is not run. If the &lt;code&gt;optimize_for&lt;/code&gt; option is specified, the operation always runs (the &lt;code&gt;check_codecs&lt;/code&gt; option is ignored). This is because there is no option to check which format table chunks have.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Shuffle.&lt;/strong&gt; To randomly shuffle the table rows, use the &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.shuffle_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;shuffle_table&lt;/a&gt; function.&lt;br /&gt;\nThe function runs the &lt;code&gt;map_reduce&lt;/code&gt; operation that sorts the table by the added column with a random number.&lt;/p&gt;\n&lt;h2 id=\"python_operations\"&gt;&lt;a href=\"en/api/python/userdoc.html#python_operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Python objects as operations&lt;/span&gt;&lt;/a&gt;Python objects as operations&lt;/h2&gt;\n&lt;h3 id=\"python_operations_intro\"&gt;&lt;a href=\"en/api/python/userdoc.html#python_operations_intro\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Overview&lt;/span&gt;&lt;/a&gt;Overview&lt;/h3&gt;\n&lt;p&gt;To run the operation, you need to define a special &lt;code&gt;yt.wrapper.TypedJob&lt;/code&gt; subclass and pass the object of this class to the operation run &lt;a href=\"en/api/python/userdoc.html#run_operation_commands\"&gt;function&lt;/a&gt; (or specify it in the applicable field of the &lt;a href=\"en/api/python/userdoc.html#spec_builders\"&gt;SpecBuilder&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;Make sure to define, in the job class, the &lt;code&gt;__call__(self, row)&lt;/code&gt; method (for the mapper) or &lt;code&gt;__call__(self, rows)&lt;/code&gt; method (for the reducer). As input, this method accepts table rows (in the case of a reducer, a single call (&lt;code&gt;__call__&lt;/code&gt;) corresponds to a set of rows with the same key). It has to return (&lt;strong&gt;by using &lt;code&gt;yield&lt;/code&gt;&lt;/strong&gt;) the rows that need to be written to the output table. If there are multiple output tables, use the wrapper class &lt;code&gt;yt.wrapper.OutputRow&lt;/code&gt;, whose constructor accepts the row written and the &lt;code&gt;table_index&lt;/code&gt; as a named parameter (see the &lt;a href=\"api/python/examples.html#table_switches\"&gt;example&lt;/a&gt; in the tutorial).&lt;/p&gt;\n&lt;p&gt;In addition, you can define the following methods:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;start(self)&lt;/code&gt;: Called exactly once before processing the job records.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;finish(self)&lt;/code&gt;: Called once after processing the job records.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Just as &lt;code&gt;__call__&lt;/code&gt;, these methods can generate new records using &lt;code&gt;yield&lt;/code&gt;. This allows you to perform buffering or some data accumulation processes. These methods aren't called for operations that are labeled with &lt;code&gt;@yt.aggregator&lt;/code&gt; and receive the entire input.&lt;/p&gt;\n&lt;p&gt;You can also define the &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.prepare_operation.TypedJob.prepare_operation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;.prepare_operation(self, context, preparer)&lt;/a&gt; method. which is used to specify row types for input and output tables, as well as to modify the operation specification. For more information, see the &lt;a href=\"en/api/python/userdoc.html#prepare_operation\"&gt;Preparing an operation from a job&lt;/a&gt; section and check out the examples:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#prepare_operation\"&gt;{#T}&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#grep\"&gt;{#T}&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"prepare_operation\"&gt;&lt;a href=\"en/api/python/userdoc.html#prepare_operation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Preparing an operation from a job&lt;/span&gt;&lt;/a&gt;Preparing an operation from a job&lt;/h3&gt;\n&lt;p&gt;To specify the input and output string types in the job class, you can use the hint type: &lt;a href=\"api/python/examples.html#simple_map\"&gt;one&lt;/a&gt;, &lt;a href=\"api/python/examples.html#multiple_input_reduce\"&gt;two&lt;/a&gt;, &lt;a href=\"api/python/examples.html#multiple_input_multiple_output_reduce\"&gt;three&lt;/a&gt;, and &lt;a href=\"api/python/examples.html#map_reduce_multiple_intermediate_streams\"&gt;four&lt;/a&gt;) or override the method &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.prepare_operation.TypedJob.prepare_operation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;&lt;code&gt;.prepare_operation(self, context, preparer)&lt;/code&gt;&lt;/a&gt;. The types are specified using the methods of the &lt;code&gt;preparer&lt;/code&gt; object of the &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.prepare_operation.OperationPreparer\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;&lt;code&gt;OperationPreparer&lt;/code&gt;&lt;/a&gt; type. Useful methods:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.prepare_operation.OperationPreparer.inputs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;&lt;code&gt;inputs&lt;/code&gt;&lt;/a&gt;: Enables you to specify the input row type for multiple input tables (it must be a class with the decorator &lt;a href=\"en/api/python/userdoc.html#dataclass\"&gt;&lt;code&gt;@yt.wrapper.yt_dataclass&lt;/code&gt;&lt;/a&gt;), a list of names for the columns that the job needs, as well as the renamings for the columns.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.prepare_operation.OperationPreparer.outputs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;&lt;code&gt;outputs&lt;/code&gt;&lt;/a&gt;: Enables you to specify the output row type for multiple output tables (it must be a class with the decorator &lt;a href=\"en/api/python/userdoc.html#dataclass\"&gt;&lt;code&gt;@yt.wrapper.yt_dataclass&lt;/code&gt;&lt;/a&gt;) and the schema that you want to output for these tables (by default, the schema is output from the data class).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;input&lt;/code&gt; and &lt;code&gt;output&lt;/code&gt; are the counterparts of corresponding methods that accept a single index.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;The &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.prepare_operation.OperationPreparationContext\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;&lt;code&gt;context&lt;/code&gt;&lt;/a&gt; object enables you to get information about the input and output streams: their number, schemas, and paths to tables.&lt;/p&gt;\n&lt;p&gt;See the examples in the tutorial: &lt;a href=\"api/python/examples.html#prepare_operation\"&gt;one&lt;/a&gt; and &lt;a href=\"api/python/examples.html#grep\"&gt;two&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;If you run MapReduce with multiple intermediate streams, you also need to override the &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.prepare_operation.TypedJob.get_intermediate_stream_count\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;.get_intermediate_stream_count(self)&lt;/a&gt; method, returning the number of intermediate streams from it. See &lt;a href=\"api/python/examples.html#map_reduce_multiple_intermediate_streams\"&gt;example&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"python_decorators\"&gt;&lt;a href=\"en/api/python/userdoc.html#python_decorators\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Decorators&lt;/span&gt;&lt;/a&gt;Decorators&lt;/h3&gt;\n&lt;p&gt;You can mark functions or job classes with special decorators that change the expected interface of interaction with jobs.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.py_wrapper.aggregator\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;aggregator&lt;/a&gt; is a decorator that allows you to indicate that a given mapper is an aggregator, that is, it accepts a row iterator as input rather than a single row.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.py_wrapper.raw\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;raw&lt;/a&gt; is a decorator that allows you to specify that the function accepts a stream of raw data as input rather than parsed records.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.py_wrapper.raw_io\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;raw_io&lt;/a&gt; is a decorator that allows you to indicate that the function will take records (rows) from &lt;code&gt;stdin&lt;/code&gt; and write them to &lt;code&gt;stdout&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.py_wrapper.reduce_aggregator\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;reduce_aggregator&lt;/a&gt; is a decorator that enables you to specify that the reducer is an aggregator that accepts a generator of pairs where each pair is (a key, and records with this key) as input, rather than an iterator of records with a single key.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.py_wrapper.with_context\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;with_context&lt;/a&gt; is a decorator that enables you to request a context for the function. This context will include control attributes requested when running the operation.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Keep in mind that the decorator is implemented by setting an attribute on a function. That's why, for example, you cannot declare a function with the decorator and then make &lt;code&gt;functools.partial&lt;/code&gt; on it. If you want to pass certain parameters to a function directly at function call, it makes sense to create a class with a decorator (see the last example below).&lt;/p&gt;\n&lt;p&gt;You can find examples in the &lt;a href=\"api/python/examples.html#job_decorators\"&gt;tutorial&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"pickling\"&gt;&lt;a href=\"en/api/python/userdoc.html#pickling\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Pickling functions and environments&lt;/span&gt;&lt;/a&gt;Pickling functions and environments&lt;/h3&gt;\n&lt;h4 id=\"pickling_description\"&gt;&lt;a href=\"en/api/python/userdoc.html#pickling_description\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General structure&lt;/span&gt;&lt;/a&gt;General structure&lt;/h4&gt;\n&lt;p&gt;Here is a sequence of actions that occur when you run an operation that is a Python function:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The library uses the &lt;a href=\"https://github.com/uqfoundation/dill\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;dill&lt;/a&gt; module to transform the executed object (class or function) into a stream of bytes&lt;/li&gt;\n&lt;li&gt;The local runtime environment for the function is set up. This environment is transmitted into a job on the cluster and then used to start up your function properly.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;After that, a special code from the &lt;code&gt;_py_runner.py&lt;/code&gt; module is executed on the cluster. Locally, it unpacks all the dependencies in each job, transforms the function from a set of bytes to a Python object, and starts it up properly, reading data from stdin.&lt;/p&gt;\n&lt;h4 id=\"pickling_advises\"&gt;&lt;a href=\"en/api/python/userdoc.html#pickling_advises\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Link to the post with tips&lt;/span&gt;&lt;/a&gt;Link to the post with tips&lt;/h4&gt;\n&lt;p&gt;{% cut \"Examples of module filtering \" %}&lt;br /&gt;\nHere's an example of how to filter out transmission of .so and .pyc files but continue to transmit the yt module (by the way, the same thing enables you to run scripts on Mac OS X):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.config[&lt;span class=\"hljs-string\"&gt;\"pickling\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"module_filter\"&lt;/span&gt;] = &lt;span class=\"hljs-keyword\"&gt;lambda&lt;/span&gt; module: &lt;span class=\"hljs-built_in\"&gt;hasattr&lt;/span&gt;(module, &lt;span class=\"hljs-string\"&gt;\"__file__\"&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;and&lt;/span&gt; \\\n    &lt;span class=\"hljs-keyword\"&gt;not&lt;/span&gt; module.__file__.endswith(&lt;span class=\"hljs-string\"&gt;\".so\"&lt;/span&gt;)\nyt.config[&lt;span class=\"hljs-string\"&gt;\"pickling\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"force_using_py_instead_of_pyc\"&lt;/span&gt;] = &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;## When working in the client, you can specify it in the config:&lt;/span&gt;\nclient = yt.wrapper.client.Yt(config={&lt;span class=\"hljs-string\"&gt;\"pickling\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"module_filter\"&lt;/span&gt;: &lt;span class=\"hljs-keyword\"&gt;lambda&lt;/span&gt; ...}})\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2088\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2088\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2088\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2088.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You can also write your dependency resolution function based on the &lt;a href=\"http://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.py_wrapper.create_modules_archive_default\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;default implementation from here&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;my_create_modules_archive&lt;/span&gt;():\n    ...\n\nyt.config[&lt;span class=\"hljs-string\"&gt;\"pickling\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"create_modules_archive_function\"&lt;/span&gt;] = my_create_modules_archive\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2092\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2092\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2092\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2092.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If you are using binary modules that are dynamically linked with other libraries that are missing in the cluster, it makes sense to add them to the cluster manually (be sure to set the &lt;code&gt;LD_LIBRARY_PATH&lt;/code&gt;) environment variable or build dynamic libraries for your Python modules automatically. At each build, an &lt;code&gt;ldd&lt;/code&gt; is invoked for each &lt;code&gt;.so&lt;/code&gt; and the found dependencies are packed.&lt;br /&gt;\nHere's how it's enabled:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.config[&lt;span class=\"hljs-string\"&gt;\"pickling\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"dynamic_libraries\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"enable_auto_collection\"&lt;/span&gt;] = &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2096\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2096\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2096\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2096.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You can also specify a filter if you do not need to add any libraries Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.config[&lt;span class=\"hljs-string\"&gt;\"pickling\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"dynamic_libraries\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"library_filter\"&lt;/span&gt;] = &lt;span class=\"hljs-keyword\"&gt;lambda&lt;/span&gt; lib: &lt;span class=\"hljs-keyword\"&gt;not&lt;/span&gt; lib.startswith(&lt;span class=\"hljs-string\"&gt;\"/lib\"&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2100\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2100\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2100\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2100.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;By default, we recommend filtering out the libraries that are in the &lt;code&gt;/lib&lt;/code&gt;, &lt;code&gt;/lib64&lt;/code&gt; directories because these directories host various system libraries (for example, &lt;code&gt;libcgroup&lt;/code&gt;) and using them on the cluster might result in some strange errors. To filter the libraries, you can use the function from the example above.&lt;/p&gt;\n&lt;p&gt;Boilerplate filters for different cases:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;If you see the error: &lt;code&gt;AttributeError: 'module' object has no attribute 'openssl_md_meth_names'&lt;/code&gt;, filter out hashlib:&lt;code&gt;yt.config[\"pickling\"][\"module_filter\"] = lambda module: \"hashlib\" not in getattr(module, \"__name__\", \"\") &lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;If you run Anaconda, you have to filter out hashlib (see the filter example above), as well as the .so libraries. To filter out .so libraries, you can use the following filter:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.config[&lt;span class=\"hljs-string\"&gt;\"pickling\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"module_filter\"&lt;/span&gt;] = (\n    &lt;span class=\"hljs-keyword\"&gt;lambda&lt;/span&gt; module: &lt;span class=\"hljs-built_in\"&gt;hasattr&lt;/span&gt;(module, &lt;span class=\"hljs-string\"&gt;\"__file__\"&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;and&lt;/span&gt;\n    &lt;span class=\"hljs-keyword\"&gt;not&lt;/span&gt; module.__file__.endswith(&lt;span class=\"hljs-string\"&gt;\".so\"&lt;/span&gt;)\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2117\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2117\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2117\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2117.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;This filter also filters out YSON &lt;a href=\"en/api/python/userdoc.html#yson\"&gt;bindings&lt;/a&gt;. If you use YSON, it makes sense to add the library to exceptions:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.config[&lt;span class=\"hljs-string\"&gt;\"pickling\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"module_filter\"&lt;/span&gt;] = (\n    &lt;span class=\"hljs-keyword\"&gt;lambda&lt;/span&gt; module: &lt;span class=\"hljs-built_in\"&gt;hasattr&lt;/span&gt;(module, &lt;span class=\"hljs-string\"&gt;\"__file__\"&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;and&lt;/span&gt;\n    (&lt;span class=\"hljs-keyword\"&gt;not&lt;/span&gt; module.__file__.endswith(&lt;span class=\"hljs-string\"&gt;\".so\"&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;or&lt;/span&gt; module.__file__.endswith(&lt;span class=\"hljs-string\"&gt;\"yson_lib.so\"&lt;/span&gt;)\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2126\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2126\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2126\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2126.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;You execute your program using updated python2.7 and get the following error: &lt;code&gt;ImportError: No module named urllib3&lt;/code&gt; or &lt;code&gt;ImportError: cannot import name _compare_digest&lt;/code&gt;, or you can't import the &lt;code&gt;hmac&lt;/code&gt; module&lt;/p&gt;\n&lt;p&gt;To solve this problem, you need to filter out hmac from the modules that you take with you (it imports from the module the method missing from python2.7.3 installed on the cluster).&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.config[&lt;span class=\"hljs-string\"&gt;\"pickling\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"module_filter\"&lt;/span&gt;] = ... &lt;span class=\"hljs-keyword\"&gt;and&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;getattr&lt;/span&gt;(module, &lt;span class=\"hljs-string\"&gt;\"__name__\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"\"&lt;/span&gt;) != &lt;span class=\"hljs-string\"&gt;\"hmac\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2137\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2137\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2137\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2137.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Automatic filtering of the .pyc and .so files is also supported in cases when the Python version or the OS version differ between the cluster and the client. The option should be enabled in the config first:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.config[&lt;span class=\"hljs-string\"&gt;\"pickling\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"enable_modules_compatibility_filter\"&lt;/span&gt;] = &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2143\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2143\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2143\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2143.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;When running a Python  function in a job, all the modules present in the dependencies are unpacked and imported, including those of your main module. That's why all the business logic needs to be hidden within &lt;code&gt;__main__&lt;/code&gt;; a proper implementation should look like this:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;Mapper&lt;/span&gt;(yt.TypedJob):\n    ...\n\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; __name__ == &lt;span class=\"hljs-string\"&gt;\"__main__\"&lt;/span&gt;:\n    yt.run_map(mapper, ...)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2147\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2147\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2147\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2147.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;/p&gt;\n&lt;h3 id=\"porto_layers\"&gt;&lt;a href=\"en/api/python/userdoc.html#porto_layers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Porto layers&lt;/span&gt;&lt;/a&gt;Porto layers&lt;/h3&gt;\n&lt;p&gt;When running an operation, you can specify which &lt;a href=\"user-guide/data-processing/layers/layer-paths.html\"&gt;file system image&lt;/a&gt; needs to be prepared before running your jobs.&lt;br /&gt;\nThere is a certain set of &lt;a href=\"user-guide/data-processing/layers/layer-paths.html#gotovye-sloi-v-kiparise\"&gt;ready-to-use layers&lt;/a&gt; available at &lt;code&gt;//porto_layers&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;One way you can specify a path to the proper layer using the parameter &lt;code&gt;layer_paths&lt;/code&gt; in the job spec is:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;spec_builder = ReduceSpecBuilder() \\\n    .begin_reducer() \\\n        .command(reducer) \\\n        .layer_paths([&lt;span class=\"hljs-string\"&gt;\"//porto_layers/ubuntu-precise-base.tar.xz\"&lt;/span&gt;]) \\\n    .end_reducer() \\\n    ...\nyt.run_operation(spec_builder)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2160\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2160\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2160\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2160.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"tmpfs_in_jobs\"&gt;&lt;a href=\"en/api/python/userdoc.html#tmpfs_in_jobs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;tmpfs in jobs&lt;/span&gt;&lt;/a&gt;tmpfs in jobs&lt;/h3&gt;\n&lt;p&gt;Supporting tmpfs in jobs includes two parts:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;For Python operations, tmpfs is enabled by default: it is mounted to a special tmpfs directory and the module archive is unpacked into it. Additional memory needed for tmpfs is added to the limit specified by the user. The behavior is regulated by the options: &lt;code&gt;pickling/enable_tmpfs_archive&lt;/code&gt; and &lt;code&gt;pickling/add_tmpfs_archive_size_to_memory_limit&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;There is an option to automatically enable tmpfs for all the job's files: this option is called &lt;code&gt;mount_sandbox_in_tmpfs/enable&lt;/code&gt; and is disabled by default. If you enable this option, the specs for your operations will specify &lt;code&gt;tmpfs_path=\".\"&lt;/code&gt; and also set &lt;code&gt;tmpfs_size&lt;/code&gt; equal to the total file size. tmpfs_size will also be added to &lt;code&gt;memory_limit&lt;/code&gt;. Node that if you're using table files, the system can't find out the size of the disk after formatting, so you need to specify the size in the &lt;code&gt;disk_size&lt;/code&gt; attribute of the path. You can also request additional tmpfs space if your job generates some files at runtime. For this, specify the appropriate number of bytes in the &lt;code&gt;mount_sandbox_in_tmpfs/additional_tmpfs_size&lt;/code&gt; option.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"python_jobs_statistics\"&gt;&lt;a href=\"en/api/python/userdoc.html#python_jobs_statistics\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Statistics in jobs&lt;/span&gt;&lt;/a&gt;Statistics in jobs&lt;/h3&gt;\n&lt;p&gt;As the job is running, the user can export their own statistics (for example, measure the execution time for certain steps in the job). The library provides the following functions:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.user_statistics.write_statistics\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;write_statistics&lt;/a&gt;: Writes a dict with the collected statistics to an appropriate file descriptor. The function must be called from within the job.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The &lt;code&gt;Operation&lt;/code&gt; class also has the &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operation_commands.Operation.get_job_statistics\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get_job_statistics&lt;/a&gt; method for quick access to the operation statistics.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;WriteStatistics&lt;/span&gt;(yt.wrapper.TypedJob):\n    &lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;__call__&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;self, row: Row&lt;/span&gt;) -&amp;gt; Row:\n        yt.write_statistics({&lt;span class=\"hljs-string\"&gt;\"row_count\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;})\n        &lt;span class=\"hljs-keyword\"&gt;yield&lt;/span&gt; row\n\nyt.write_table_structured(table, [Row(x=&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;)])\nop = yt.run_map(WriteStatistics(), table, table, sync=&lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;)\nop.wait()\n&lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;(op.get_job_statistics()[&lt;span class=\"hljs-string\"&gt;\"custom\"&lt;/span&gt;])\n&lt;span class=\"hljs-comment\"&gt;## Output: {\"row_count\": {\"$\": {\"completed\": {\"map\": {\"count\": 1, \"max\": 1, \"sum\": 1, \"min\": 1}}}}}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2198\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2198\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2198\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2198.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"python_operations_untyped\"&gt;&lt;a href=\"en/api/python/userdoc.html#python_operations_untyped\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Untyped Python operations&lt;/span&gt;&lt;/a&gt;Untyped Python operations&lt;/h2&gt;\n&lt;p&gt;Non-typed jobs are also supported aside from typed jobs.&lt;br /&gt;\nInstead of the &lt;code&gt;TypedJob&lt;/code&gt; class, a Python function or any callable object is used as a custom job. The function accepts a record (in case of the mapper) and the key plus the record iterator (in case of the reducer). In the latter case, the key is a &lt;code&gt;dict&lt;/code&gt;-like object where only key columns are populated. The function must be a generator that uses &lt;code&gt;yield&lt;/code&gt; to generate records that will be written to the output table.&lt;/p&gt;\n&lt;p&gt;Example of a filtering mapper:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;mapper&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;row&lt;/span&gt;):\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; row.get(&lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;) == &lt;span class=\"hljs-string\"&gt;\"job_started\"&lt;/span&gt;:\n        &lt;span class=\"hljs-keyword\"&gt;yield&lt;/span&gt; row\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2208\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2208\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2208\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2208.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Example of a reducer summing across the value column:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;reducer&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;key, rows&lt;/span&gt;):\n    row = &lt;span class=\"hljs-built_in\"&gt;dict&lt;/span&gt;(key.iteritems())\n    row[&lt;span class=\"hljs-string\"&gt;\"sum\"&lt;/span&gt;] = &lt;span class=\"hljs-built_in\"&gt;sum&lt;/span&gt;((row[&lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;] &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; row &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; rows))\n    &lt;span class=\"hljs-keyword\"&gt;yield&lt;/span&gt; row\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2212\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2212\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2212\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2212.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"python_decorators_untyped\"&gt;&lt;a href=\"en/api/python/userdoc.html#python_decorators_untyped\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Decorators&lt;/span&gt;&lt;/a&gt;Decorators&lt;/h3&gt;\n&lt;p&gt;In the non-typed API, the meaning of some decorators slightly changes compared to the &lt;a href=\"en/api/python/userdoc.html#python_decorators\"&gt;typed&lt;/a&gt; API.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.py_wrapper.reduce_aggregator\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;reduce_aggregator&lt;/a&gt;: Instead of accepting a single pair (key, and records), the reducer will accept a pair iterator where each pair is (key, and records with this key).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Keep in mind that the decorator is implemented by setting an attribute on a function. That's why, for example, you cannot declare a function with the decorator and then make &lt;code&gt;functools.partial&lt;/code&gt; on it. If you want to pass certain parameters to a function directly at function call, it makes sense to create a class with a decorator (see the last example below).&lt;/p&gt;\n&lt;p&gt;You can find examples in the &lt;a href=\"api/python/examples.html#job_decorators_untyped\"&gt;tutorial&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"python_formats\"&gt;&lt;a href=\"en/api/python/userdoc.html#python_formats\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Formats&lt;/span&gt;&lt;/a&gt;Formats&lt;/h3&gt;\n&lt;p&gt;By default, you do not have to specify formats when running Python operations.&lt;/p&gt;\n&lt;p&gt;YTsaurus stores structured data, and there's no predefined textual representation for this data: all the jobs run in streaming mode, and the user needs to explicitly specify the format in which its script expects to see the data in the input stream. By contrast, when accessing data from a Python function, you also get the data in the structured format. You can establish a mapping between the structured data format in YTsaurus and in Python. In this case, the intermediate format used to transmit data to the job isn't as critical.&lt;/p&gt;\n&lt;p&gt;Keep in mind that there is no perfect one-to-one correspondence between the structured data in YTsaurus and dicts in Python. That's why, in this case, there are some peculiarities (see below).&lt;/p&gt;\n&lt;h4 id=\"structured_data\"&gt;&lt;a href=\"en/api/python/userdoc.html#structured_data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Structured data representation&lt;/span&gt;&lt;/a&gt;Structured data representation&lt;/h4&gt;\n&lt;p&gt;The following key peculiarities exist in representing structured data in Python:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Objects in table records in YTsaurus can have &lt;a href=\"user-guide/storage/attributes.html\"&gt;attributes&lt;/a&gt; (this only applies to columns of the \"any\" type). To represent them, the library provides &lt;a href=\"http://pydoc.ytsaurus.tech/yt.yson.html#module-yt.yson.yson_types\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;special types&lt;/a&gt; that are inherited from standard Python  types, but a
