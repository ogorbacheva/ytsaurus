dditionally they also have the &lt;code&gt;attributes&lt;/code&gt; field. Because creating custom objects is an expensive procedure, by default, such an object is created only if it has attributes. To regulate this behavior, there is the option: &lt;code&gt;always_create_attributes&lt;/code&gt;. YSON types are compared as follows: first the values of the elementary types, then the attributes. If the attributes aren't equal (for example, if one object has attributes, and another object doesn't), the objects are considered non-equal. This should be kept in mind when comparing with elementary types in Python: to avoid dependence on the presence of object attributes, you should explicitly convert the object to the elementary type.&lt;/p&gt;\n&lt;p&gt;Explanatory example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.yson &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yson\ns = yson.YsonString(&lt;span class=\"hljs-string\"&gt;b\"a\"&lt;/span&gt;)\ns == &lt;span class=\"hljs-string\"&gt;b\"a\"&lt;/span&gt; &lt;span class=\"hljs-comment\"&gt;# True&lt;/span&gt;\ns.attributes[&lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;] = &lt;span class=\"hljs-string\"&gt;\"c\"&lt;/span&gt;\ns == &lt;span class=\"hljs-string\"&gt;b\"a\"&lt;/span&gt; &lt;span class=\"hljs-comment\"&gt;# False&lt;/span&gt;\n\n&lt;span class=\"hljs-built_in\"&gt;bytes&lt;/span&gt;(s) == &lt;span class=\"hljs-string\"&gt;b\"a\"&lt;/span&gt; &lt;span class=\"hljs-comment\"&gt;# True&lt;/span&gt;\n\nother_s = yson.YsonString(&lt;span class=\"hljs-string\"&gt;b\"a\"&lt;/span&gt;)\nother_s == s &lt;span class=\"hljs-comment\"&gt;# False&lt;/span&gt;\n\nother_s.attributes[&lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;] = &lt;span class=\"hljs-string\"&gt;\"c\"&lt;/span&gt;\nother_s == s &lt;span class=\"hljs-comment\"&gt;# True&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2258\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2258\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2258\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2258.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;The YSON format uses two integer types: &lt;a href=\"user-guide/storage/yson.html\"&gt;int64 and uint64&lt;/a&gt;. On the other hand, from the data model viewpoint, Python has a single data type with no limits imposed. For this reason, when reading data, a non-signed type is represented as YsonUint64, while a signed type is represented as a regular int type. When writing an int, the behavior is automatic: numbers in the range [-2^63, 2^63) are represented as signed, while numbers in the range [2^63, 2^64) are represented as non-signed. However, you can always specify the type explicitly by creating an explicit Yson object.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Unicode strings. As all the strings are byte strings in YTsaurus, the Python's  Unicode strings are UTF-8-encoded as byte strings. When reading data in Python 3, an attempt is made to decode byte strings using a utf-8 decoder. If this doesn't work, a special &lt;a href=\"https://pydoc.ytsaurus.tech/yt.yson.html#yt.yson.yson_types.YsonStringProxy\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YsonStringProxy&lt;/a&gt; object is returned. For more information, see the appropriate&lt;a href=\"en/api/python/userdoc.html#python3_strings\"&gt;section&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;When writing data, YsonFormat correctly distinguishes between Python types and YSON types.&lt;/p&gt;\n&lt;h4 id=\"control_attributes\"&gt;&lt;a href=\"en/api/python/userdoc.html#control_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Control attributes&lt;/span&gt;&lt;/a&gt;Control attributes&lt;/h4&gt;\n&lt;p&gt;Apart from a stream of records, when reading data from a table (or from within a job), you can request various &lt;a href=\"user-guide/storage/io-configuration.html#control_attributes\"&gt;control attributes&lt;/a&gt;. Working with control attributes is format-dependent: for example, most control attributes can't be represented in formats different from Yamr, JSON, or YSON.&lt;/p&gt;\n&lt;p&gt;Yamr format in Python API correctly supports parsing of the row_index and table_index attributes that will be represented as the tableIndex and recordIndex fields and Record-type objects.&lt;/p&gt;\n&lt;p&gt;In JSON format, the control attributes aren't processed in any special way. When requesting them, you have to process the control records within the stream.&lt;/p&gt;\n&lt;p&gt;YSON format has several modes for automated processing of control attributes. Selection of the mode is controlled by a &lt;code&gt;control_attributes_mode&lt;/code&gt; option that can take on the following values &lt;strong&gt;(important: for historical reasons, for the option to run correctly, you also need to set process_table_index=None when creating a format. By default, process_table_index is True, which enforces control_attributes_mode=row_fields)&lt;/strong&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;iterator&lt;/code&gt;(default): When parsing the stream, the format will output a record iterator. To get the control attributes from a job, you need to use the context.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;row_fields&lt;/code&gt;: The requested control attributes will be added as fields to each record. For example, if you request row _index, then each record will have the &lt;code&gt;@row_index&lt;/code&gt; field with the ID of this record.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;none&lt;/code&gt;: No special processing will be done for the control attributes: the client will get a stream of records where the entity-type records will have control attributes.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Examples of switching between output tables with &lt;code&gt;table_index&lt;/code&gt; at &lt;code&gt;control_attributes_mode&lt;/code&gt; equal to &lt;code&gt;iterator&lt;/code&gt; and &lt;code&gt;row_fields&lt;/code&gt;. &lt;a href=\"api/python/examples.html#table_switches_untyped\"&gt;Here&lt;/a&gt; you can find an example of how to get an index of the current table in the reducer using &lt;code&gt;context&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"other_formats\"&gt;&lt;a href=\"en/api/python/userdoc.html#other_formats\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Other formats&lt;/span&gt;&lt;/a&gt;Other formats&lt;/h4&gt;\n&lt;p&gt;By default, the library serializes data into &lt;a href=\"user-guide/storage/formats.html#yson\"&gt;YSON format&lt;/a&gt; because this format provides a proper and unambiguous representation for any data stored in YTsaurus tables. To handle YSON format efficiently in Python, you need the &lt;a href=\"en/api/python/userdoc.html#yson_bindings\"&gt;native library&lt;/a&gt;. If you don't add this library to the cluster, you will get a runtime error in your job (we didn't add a fallback to the Python's YSON library because it's very slow and inefficient). In this situation, you can switch over to the &lt;a href=\"user-guide/storage/formats.html#json\"&gt;JSON format&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Most other formats are text-based (that is, numbers have the same format as strings), so you will lose data typing.&lt;/p&gt;\n&lt;p&gt;If you use the formats different from YSON and Yamr, you will always get a &lt;code&gt;dict&lt;/code&gt; of records. For example, there will be no automatic record conversion from JSON to YSON.&lt;/p&gt;\n&lt;h2 id=\"other\"&gt;&lt;a href=\"en/api/python/userdoc.html#other\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Other&lt;/span&gt;&lt;/a&gt;Other&lt;/h2&gt;\n&lt;h3 id=\"grpc\"&gt;&lt;a href=\"en/api/python/userdoc.html#grpc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;gRPC&lt;/span&gt;&lt;/a&gt;gRPC&lt;/h3&gt;\n&lt;p&gt;RPC proxy with gRPC transport isn't supported. If you can't install a binary package with RPC bindings, you can use gRPC on your own.&lt;/p&gt;\n\n&lt;h3 id=\"yson\"&gt;&lt;a href=\"en/api/python/userdoc.html#yson\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YSON&lt;/span&gt;&lt;/a&gt;YSON&lt;/h3&gt;\n&lt;p&gt;Together with the library to work with YTsaurus clusters,  we also supply a library for &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON format&lt;/a&gt;. The library is available in the &lt;code&gt;yt.yson&lt;/code&gt; module and implements the standard &lt;code&gt;load&lt;/code&gt;, &lt;code&gt;loads&lt;/code&gt;, &lt;code&gt;dump&lt;/code&gt;, and &lt;code&gt;dumps&lt;/code&gt; functions. In addition, it provides access to &lt;a href=\"en/api/python/userdoc.html#structured_data\"&gt;Yson types&lt;/a&gt;. The library also implements the following generally useful functions:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.yson.html#yt.yson.convert.to_yson_type\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;to_yson_type&lt;/a&gt;: Creating a YSON type from a Python object.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.yson.html#yt.yson.convert.json_to_yson\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;json_to_yson&lt;/a&gt;: Recursively converts a Python object from the JSON representation to a YSON representation. Learn more about the nuances of structured data representation in YTsaurus in &lt;a href=\"user-guide/storage/formats.html#json\"&gt;JSON format&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.yson.html#yt.yson.convert.yson_to_json\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yson_to_json&lt;/a&gt;: Recursively converts a Python object from YSON to JSON.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"yson_bindings\"&gt;&lt;a href=\"en/api/python/userdoc.html#yson_bindings\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YSON bindings&lt;/span&gt;&lt;/a&gt;YSON bindings&lt;/h4&gt;\n&lt;p&gt;The yson library has two implementations: written in pure Python, and written as C++ bindings.&lt;br /&gt;\nThe YSON's native parser and writer written in Python are very slow and can only be used with small amounts of data.&lt;br /&gt;\n&lt;strong&gt;Important&lt;/strong&gt;: For example, you won't be able to run operations or read tables in YSON format&lt;/p&gt;\n&lt;p&gt;C++ bindings are delivered as Debian and pip packages.&lt;/p&gt;\n&lt;p&gt;The packages are built as a universal .so library with libcxx compiled into it: that's why they should work in any Debian-based system.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/api/python/userdoc.md","sourcePath":"en/api/python/userdoc.md"},"headings":[{"title":"General information","href":"en/api/python/userdoc.html#common","level":2,"items":[{"title":"Conventions","href":"en/api/python/userdoc.html#agreements","level":3},{"title":"Client and
