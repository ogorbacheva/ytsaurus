ard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"773\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-773\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-773\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-773.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"file_commands\"&gt;&lt;a href=\"en/api/python/userdoc.html#file_commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with files&lt;/span&gt;&lt;/a&gt;Working with files&lt;/h3&gt;\n&lt;p&gt;For more information about files in Cypress, see the &lt;a href=\"user-guide/storage/files.html\"&gt;section&lt;/a&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.read_file\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;read_file&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;Read a file from Cypress to a local machine. Returns the &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.response_stream.ResponseStream\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ResponseStream&lt;/a&gt; object, which is a line iterator that has the following additional methods:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.response_stream.ResponseStream.read\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;read&lt;/a&gt;: Read &lt;code&gt;length&lt;/code&gt; bytes from the stream. If &lt;code&gt;length==None&lt;/code&gt;, read the data to the end of the stream.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.response_stream.ResponseStream.readline\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;readline&lt;/a&gt;: Read a line (including \"\\n\").&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.response_stream.ResponseStream.chunk_iter\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;chunk_iter&lt;/a&gt;: An iterator by response chunks.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The command supports retries (enabled by default). To enable/disable or increase the number of retries, use the &lt;code&gt;read_retries&lt;/code&gt; configuration option (see &lt;code&gt;read_table&lt;/code&gt;). To enable read retries, use the &lt;code&gt;YT_RETRY_READ=1&lt;/code&gt; variable.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.write_file\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;write_file&lt;/a&gt;&lt;br /&gt;\nWrite a file to Cypress. The command accepts a stream from which it reads data. The command supports retries. To set up retries, use the &lt;code&gt;write_retries&lt;/code&gt; configuration option (more in &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.write_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;write_table&lt;/a&gt;). There is the &lt;code&gt;is_stream_compressed&lt;/code&gt; parameter that says that the stream data has already been compressed, and you can transmit it without compressing.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Files can be transmitted as arguments of an operation. In that case, they are written to the root of the directory where your jobs will be run. For more information, see the &lt;a href=\"en/api/python/userdoc.html#run_operation_commands\"&gt;section&lt;/a&gt; and the &lt;a href=\"api/python/examples.html#files\"&gt;example&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.get_file_from_cache\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get_file_from_cache&lt;/a&gt;&lt;br /&gt;\nReturns a path to the cached file based on the specified md5 sum.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.put_file_to_cache\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;put_file_to_cache&lt;/a&gt;&lt;br /&gt;\nUpload the file existing at the given Cypress path to the cache. Note that the file should be uploaded to Cypress with a special option that enables md5 calculation.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"table_commands\"&gt;&lt;a href=\"en/api/python/userdoc.html#table_commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with tables&lt;/span&gt;&lt;/a&gt;Working with tables&lt;/h3&gt;\n&lt;p&gt;For more information about tables, see &lt;a href=\"user-guide/storage/static-tables.html\"&gt;Static tables&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"dataclass\"&gt;&lt;a href=\"en/api/python/userdoc.html#dataclass\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data classes&lt;/span&gt;&lt;/a&gt;Data classes&lt;/h4&gt;\n&lt;p&gt;The main method used to represent table rows is to use classes with fields annotated by types (similar to &lt;a href=\"https://docs.python.org/3/library/dataclasses.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;dataclasses&lt;/a&gt;). With this approach, you can effectively (de)serialize data, avoid errors, and work with complex types (structures, lists, and others) more conveniently. To define a data class, use the &lt;code&gt;yt_dataclass&lt;/code&gt; decorator. For example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-meta\"&gt;@yt.yt_dataclass&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;Row&lt;/span&gt;:\n    &lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;: &lt;span class=\"hljs-built_in\"&gt;int&lt;/span&gt;\n    name: &lt;span class=\"hljs-built_in\"&gt;str&lt;/span&gt;\n    robot: &lt;span class=\"hljs-built_in\"&gt;bool&lt;/span&gt; = &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"844\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-844\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-844\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-844.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The field type comes after the colon. This might be a regular Python type or a type from the &lt;a href=\"https://docs.python.org/3/library/typing.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;typing&lt;/a&gt; module or a special type such as &lt;code&gt;OtherColumns&lt;/code&gt;. For more information, see &lt;a href=\"api/python/dataclass.html#types\"&gt;Data classes&lt;/a&gt;. You can create objects of this class as follows: &lt;code&gt;row = Row(id=123, name=\"foo\")&lt;/code&gt;. For all the fields without default values (such as &lt;code&gt;robot: bool = False&lt;/code&gt;), you need to pass relevant fields to the constructor. Otherwise, it will throw an exception.&lt;/p&gt;\n&lt;p&gt;The data classes support inheritance. For more information, see &lt;a href=\"api/python/dataclass.html\"&gt;Data classes&lt;/a&gt;. See also the &lt;a href=\"api/python/examples.html#dataclass\"&gt;example&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"table_schema\"&gt;&lt;a href=\"en/api/python/userdoc.html#table_schema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Schemas&lt;/span&gt;&lt;/a&gt;Schemas&lt;/h4&gt;\n&lt;p&gt;Each table in YTsaurus has a &lt;a href=\"user-guide/storage/static-schema.html\"&gt;schema&lt;/a&gt;. The Python  API has a dedicated &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.schema.html#yt.wrapper.schema.table_schema.TableSchema\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TableSchema&lt;/a&gt; class. The primary way to create a schema is from a &lt;a href=\"en/api/python/userdoc.html#dataclass\"&gt;data class&lt;/a&gt;: &lt;code&gt;schema = TableSchema.from_row_type(Row)&lt;/code&gt;. In particular, this happens automatically when writing a table. However, sometimes you need to build a schema manually. To do this easily, use a builder interface. For example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.type_info.typing &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; ti\n\nschema = yt.schema.TableSchema() \\\n    .add_column(&lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt;, ti.Int64, sort_order=&lt;span class=\"hljs-string\"&gt;\"ascending\"&lt;/span&gt;) \\\n    .add_column(&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;, ti.Utf8) \\\n    .add_column(&lt;span class=\"hljs-string\"&gt;\"clicks\"&lt;/span&gt;, ti.&lt;span class=\"hljs-type\"&gt;List&lt;/span&gt;[\n        ti.Struct[\n            &lt;span class=\"hljs-string\"&gt;\"url\"&lt;/span&gt;: ti.String,\n            &lt;span class=\"hljs-string\"&gt;\"ts\"&lt;/span&gt;: ti.&lt;span class=\"hljs-type\"&gt;Optional&lt;/span&gt;[ti.Timestamp],\n        ]\n    ])\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"857\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-857\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-857\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-857.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The column type should be a type from the &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/yt/type_info\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;type_info&lt;/a&gt; library.&lt;br /&gt;\nComposite types (&lt;code&gt;Optional&lt;/code&gt;, &lt;code&gt;List&lt;/code&gt;, &lt;code&gt;Struct&lt;/code&gt;, &lt;code&gt;Tuple&lt;/code&gt;, etc.) are set up using square brackets.&lt;/p&gt;\n&lt;p&gt;You can specify a schema when creating or writing to (an empty) table (in the &lt;code&gt;schema&lt;/code&gt; attribute of the &lt;a href=\"en/api/python/userdoc.html#tablepath_class\"&gt;TablePath&lt;/a&gt; class). To get a table schema, use:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;schema = TableSchema.from_yson_type(yt.get(&lt;span class=\"hljs-string\"&gt;\"//path/to/table/@schema\"&lt;/span&gt;))\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"864\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-864\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-864\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-864.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"tablepath_class\"&gt;&lt;a href=\"en/api/python/userdoc.html#tablepath_class\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TablePath&lt;/span&gt;&lt;/a&gt;TablePath&lt;/h4&gt;\n&lt;p&gt;All the commands used with tables (including operations), are not only accepting string as the input and output tables, but also the &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.ypath.TablePath\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TablePath&lt;/a&gt; class (where appropriate). This class represents a path to a table with certain modifiers (a wrapper on &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPath&lt;/a&gt; for tables). Its constructor accepts:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;name&lt;/code&gt;: Path to a table in Cypress.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;append&lt;/code&gt;: Append records to the table instead of overwriting it.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;sorted_by&lt;/code&gt;: Set of columns by which the table should be sorted when written to.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;columns&lt;/code&gt;: List of selected columns.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;lower_key, upper_key, exact_key&lt;/code&gt;: Lower/upper/exact read boundary defined by a key. Used with sorted tables only.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;start_index, end_index, exact_index&lt;/code&gt;: Lower/upper/exact read boundary defined by row indexes.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ranges&lt;/code&gt;: Specify an arbitrary set of ranges to be read.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;schema&lt;/code&gt;: A &lt;a href=\"en/api/python/userdoc.html#table_schema\"&gt;table schema&lt;/a&gt;; it makes sense when creating a table or writing to an empty or non-existing table.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;attributes&lt;/code&gt;: Set any additional attributes.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ranges are semi-intervals (that is, they do not include the upper boundary). Note that some modifiers make sense only when you read data from a table (all the attributes related to ranges or columns), and some modifiers can only be used when writing to tables (append, sorted_by). As &lt;code&gt;name&lt;/code&gt;, you can pass a string with ypath modifiers and ypath attributes, they will be read correctly and put to the &lt;code&gt;attributes&lt;/code&gt; field. In the &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.ypath.TablePath\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TablePath&lt;/a&gt; object, the &lt;code&gt;attributes&lt;/code&gt; field is both readable and writable.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-meta\"&gt;@yt.yt_dataclass&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;Row&lt;/span&gt;:\n    x: &lt;span class=\"hljs-built_in\"&gt;str&lt;/span&gt;\n\ntable = &lt;span class=\"hljs-string\"&gt;\"//tmp/some-table\"&lt;/span&gt;\nyt.write_table_structured(table, Row, [Row(x=&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;), Row(x=&lt;span class=\"hljs-string\"&gt;\"c\"&lt;/span&gt;), Row(x=&lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;)])\nyt.run_sort(table, sort_by=[&lt;span class=\"hljs-string\"&gt;\"x\"&lt;/span&gt;])\nranged_path = yt.TablePath(table, lower_key=&lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;)\n&lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(yt.read_table_structured(ranged_path, Row))\n&lt;span class=\"hljs-comment\"&gt;## Output: [Row(x='b'), Row(x='c')]&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"924\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-924\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-924\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-924.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"table_commands1\"&gt;&lt;a id=\"table_commands\" href=\"en/api/python/userdoc.html#table_commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Commands&lt;/span&gt;&lt;/a&gt;Commands&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.create_temp_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;create_temp_table&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;Creates a temporary table in the &lt;code&gt;path&lt;/code&gt; directory with the &lt;code&gt;prefix&lt;/code&gt;. If &lt;code&gt;path&lt;/code&gt; is omitted, the directory will be taken from the config: &lt;code&gt;config[\"remote_temp_tables_directory\"]&lt;/code&gt;. For convenience, there's a wrapper that supports with_statement and accepts the same parameters as it.&lt;br /&gt;\nExample:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; yt.TempTable(&lt;span class=\"hljs-string\"&gt;\"//home/user\"&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; table1:\n    &lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; yt.TempTable(&lt;span class=\"hljs-string\"&gt;\"//home/user\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"my\"&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; table2:\n        yt.write_table_structured(table1, Row, [Row(x=&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;)])\n        yt.run_map(..., table1, table2, ...)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"936\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-936\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-936\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-936.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.write_table_structured\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;write_table_structured&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;It writes the rows of &lt;code&gt;row_type&lt;/code&gt; (it must be a &lt;a href=\"en/api/python/userdoc.html#dataclass\"&gt;&lt;code&gt;yt_dataclass&lt;/code&gt;&lt;/a&gt;) from &lt;code&gt;input_stream&lt;/code&gt; to the &lt;code&gt;table&lt;/code&gt;.&lt;br /&gt;\nIf the table is missing, first it is created together with a schema.     The command supports retries. You can set up retries using the &lt;code&gt;write_retries&lt;/code&gt; config option.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Writing with retries consumes more memory than regular writing because the write operation buffers the rows written into chunks before writing&lt;br /&gt;\n(if a chunk fails to be written, a retry occurs). The default size of each chunk is 520 MB (see the &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/49f99ef8659f108f94d2d086f5f1dacfddb6b553/yt/python/yt/wrapper/default_config.py#L535\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;configuration option&lt;/a&gt;).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;With the &lt;code&gt;table_writer&lt;/code&gt; options, you can specify a number of system &lt;a href=\"user-guide/storage/io-configuration.html\"&gt;write parameters&lt;/a&gt;. To write raw or compressed data, use the &lt;code&gt;write_table&lt;/code&gt; function.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-meta\"&gt;@yt.yt_dataclass&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;Row&lt;/span&gt;:\n    &lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;: &lt;span class=\"hljs-built_in\"&gt;str&lt;/span&gt;\n    ts: &lt;span class=\"hljs-built_in\"&gt;int&lt;/span&gt;\n\nyt.write_table_structured(&lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt;, Row, [Row(&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;, ts=&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;)])\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"961\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-961\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-961\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-961.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;When writing to an empty or non-existing table, the schema is created automatically.&lt;br /&gt;\nIn more complex cases, you might need to build the schema manually. For more information, see &lt;a href=\"en/api/python/userdoc.html#table_schema\"&gt;this section&lt;/a&gt; and the &lt;a href=\"api/python/examples.html#table_schema\"&gt;example&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.read_table_structured\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;read_table_structured&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;Read the table as a sequence of rows of &lt;code&gt;row_type&lt;/code&gt; (it must belong to &lt;a href=\"en/api/python/userdoc.html#dataclass\"&gt;&lt;code&gt;yt_dataclass&lt;/code&gt;&lt;/a&gt;).&lt;br /&gt;\nThe command supports retries (enabled by default). You can set up retries using the &lt;code&gt;read_retries&lt;/code&gt; configuration option.&lt;br /&gt;\nThe &lt;code&gt;table_reader&lt;/code&gt; (dict) option enables you to specify a number of system &lt;a href=\"user-guide/storage/io-configuration.html#table_reader\"&gt;read parameters&lt;/a&gt;.&lt;br /&gt;\nThe &lt;code&gt;unordered&lt;/code&gt; (bool) option enables you to request unordered reading. In that case, the data might be read faster, but the read order isn't guaranteed.&lt;br /&gt;\nYou can use the &lt;code&gt;response_parameters&lt;/code&gt; (dict) option to pass a dict. This dict will be appended with special read command parameters (currently, there are two such parameters: &lt;code&gt;start_row_index&lt;/code&gt; and &lt;code&gt;approximate_row_count&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;The iterator returned supports the &lt;code&gt;.with_context()&lt;/code&gt; method that returns an iterator on the &lt;code&gt;(row, ctx)&lt;/code&gt; pairs. The second item enables you to get the indexes of the current row and range using the &lt;code&gt;ctx.get_row_index()&lt;/code&gt; and &lt;code&gt;ctx.get_range_index()&lt;/code&gt; methods (a similar iterator inside the job  also enables you to get the table index: &lt;code&gt;ctx.get_table_index()&lt;/code&gt;). See examples in the tutorial showing the context in &lt;a href=\"api/python/examples.html#read_write\"&gt;regular reading&lt;/a&gt; and &lt;a href=\"api/python/examples.html#table_switches\"&gt;inside operations&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;A few more words about reading with retries: in the event of retries, a transaction is created in the current context and a snapshot lock is taken on the table. The lock holds until the whole data stream is read or &lt;code&gt;.close()&lt;/code&gt; is called on the stream or iterator. This behavior can result in different errors. For example, the following code &lt;strong&gt;won't&lt;/strong&gt; work: because of the nested read transaction you won't be able to commit the transaction that has been explicitly created within the code (the nested read transaction hasn't been completed because &lt;code&gt;read_table_structured&lt;/code&gt; created an iterator that hasn't been used).&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; Transaction():\n    write_table_structured(table, Row, rows)\n    read_table_structured(table, Row)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"979\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-979\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-979\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-979.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Examples:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-meta\"&gt;@yt.yt_dataclass&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;Row&lt;/span&gt;:\n    &lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;: &lt;span class=\"hljs-built_in\"&gt;str&lt;/span&gt;\n    ts: &lt;span class=\"hljs-built_in\"&gt;int&lt;/span&gt;\n\nyt.write_table_structured(&lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt;, Row, [Row(&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;, ts=&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;)])\n&lt;span class=\"hljs-keyword\"&gt;assert&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(yt.read_table_structured(&lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt;, Row) == [Row(&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;, ts=&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;)])\n\nranges = [\n    {&lt;span class=\"hljs-string\"&gt;\"lower_limit\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;: [&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;]}, &lt;span class=\"hljs-string\"&gt;\"upper_limit\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;: [&lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;]}},\n    {&lt;span class=\"hljs-string\"&gt;\"lower_limit\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;: [&lt;span class=\"hljs-string\"&gt;\"x\"&lt;/span&gt;]}, &lt;span class=\"hljs-string\"&gt;\"upper_limit\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;: [&lt;span class=\"hljs-string\"&gt;\"y\"&lt;/span&gt;]}},\n]\npath = yt.TablePath(&lt;span class=\"hljs-string\"&gt;\"//other/table\"&lt;/span&gt;, columns=[&lt;span class=\"hljs-string\"&gt;\"time\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;], ranges=ranges)\nrows = yt.read_table_structured(path, Row)\n&lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; row, ctx &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; rows.with_context():\n    &lt;span class=\"hljs-comment\"&gt;# ctx.get_row_index() – index of row in table.&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;# ctx.get_range_index() – index of range from requested ranges.&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;# ...&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"985\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-985\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-985\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-985.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Alias functions for working with tables:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.row_count\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;row_count&lt;/a&gt;: Returns the number of records in the table.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.is_empty\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;is_empty&lt;/a&gt;: Checks whether the table is empty.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.is_sorted\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;is_sorted&lt;/a&gt;: Checks whether the table is sorted.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Examples:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.write_table_structured(&lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;, Row, [Row(&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;, ts=&lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;), Row(&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;, ts=&lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;)])\n\n&lt;span class=\"hljs-built_in\"&gt;sum&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; row &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; yt.read_table_structured(&lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;, Row):\n    &lt;span class=\"hljs-built_in\"&gt;sum&lt;/span&gt; += row.ts\n&lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;sum&lt;/span&gt;)  &lt;span class=\"hljs-comment\"&gt;# Output: 5&lt;/span&gt;\n\nyt.is_empty(&lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;)  &lt;span class=\"hljs-comment\"&gt;# Output: False&lt;/span&gt;\nyt.row_count(&lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;)  &lt;span class=\"hljs-comment\"&gt;# Output: 2&lt;/span&gt;\nyt.is_sorted(&lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;) &lt;span class=\"hljs-comment\"&gt;# Output: False&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1009\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1009\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1009\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1009.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.write_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;write_table&lt;/a&gt;&lt;br /&gt;\nA non-typed analog of &lt;code&gt;write_table_structured&lt;/code&gt;, &lt;strong&gt;should be avoided&lt;/strong&gt;.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Info&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Writes rows from &lt;code&gt;input_stream&lt;/code&gt; to the &lt;code&gt;table&lt;/code&gt;.&lt;br /&gt;\nIf the table is missing, it is created first. You can set up retries using the &lt;code&gt;write_retries&lt;/code&gt; config option.&lt;br /&gt;\nLearn the &lt;a href=\"api/python/examples.html#read_write_untyped\"&gt;example&lt;/a&gt; in the dedicated section.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Writing with retries consumes more memory than regular writing because the write operation buffers the rows written into chunks before writing&lt;br /&gt;\n(if a chunk fails to be written, then a retry is made). The default size of each chunk is 520 MB (see the &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/49f99ef8659f108f94d2d086f5f1dacfddb6b553/yt/python/yt/wrapper/default_config.py#L535\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;configuration option&lt;/a&gt;).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;With the &lt;code&gt;table_writer&lt;/code&gt; options, you can specify a number of system &lt;a href=\"user-guide/storage/io-configuration.html\"&gt;write parameters&lt;/a&gt;. There is also the &lt;code&gt;is_stream_compressed&lt;/code&gt; parameter that says that the stream data has already been compressed, and you can transmit them without prior compression. Keep in mind that when transmitting compressed data, you need to specify &lt;code&gt;Content-Encoding&lt;/code&gt; using the configuration: &lt;code&gt;config[\"proxy\"][\"content_encoding\"] = \"gzip\"&lt;/code&gt;, as well as set the &lt;code&gt;raw=True&lt;/code&gt; option. The &lt;code&gt;raw&lt;/code&gt; option regulates in which format the data is expected. If &lt;code&gt;raw=False&lt;/code&gt;, an iterator by Python structures is expected. If &lt;code&gt;raw=True&lt;/code&gt;, then a string is expected (or a string iterator) or a stream with the data in the &lt;code&gt;format&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Examples:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.write_table(&lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt;, ({&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;: i, &lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;: i * i} &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; i &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; xrange(&lt;span class=\"hljs-number\"&gt;100&lt;/span&gt;)))\nyt.write_table(&lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt;, &lt;span class=\"hljs-built_in\"&gt;open&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"my_file.json\"&lt;/span&gt;), &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"json\"&lt;/span&gt;, raw=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\nyt.write_table(&lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"a=1\\na=2\\n\"&lt;/span&gt;, &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"dsv\"&lt;/span&gt;, raw=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1039\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1039\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1039\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1039.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;To write a table with a schema, you need to create it separately first.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;  schema = [\n      {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"string\"&lt;/span&gt;},\n      {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"timestamp\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"int64\"&lt;/span&gt;},\n      {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"some_json_info\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"any\"&lt;/span&gt;},\n  ]\n  yt.create(&lt;span class=\"hljs-string\"&gt;\"table\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt;, attributes={&lt;span class=\"hljs-string\"&gt;\"schema\"&lt;/span&gt;: schema})\n  yt.write_table(&lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt;, rows)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1043\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1043\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1043\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1043.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.read_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;read_table&lt;/a&gt;&lt;br /&gt;\nA non-typed analog of &lt;code&gt;read_table_structured&lt;/code&gt;, &lt;strong&gt;should be avoided&lt;/strong&gt;.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Info&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Reads the table using the specified format. The value returned depends on the &lt;code&gt;raw&lt;/code&gt; option. If &lt;code&gt;raw=False&lt;/code&gt; (default value), an iterator by a list of records is returned. One record is a &lt;code&gt;dict&lt;/code&gt; or &lt;code&gt;Record&lt;/code&gt; (in the case of the &lt;code&gt;yamr&lt;/code&gt; format). If &lt;code&gt;raw=True&lt;/code&gt;, a stream-like object is returned from which you can read data in the &lt;code&gt;format&lt;/code&gt;.&lt;br /&gt;\nThe command supports retries (enabled by default). You can set up retries using the &lt;code&gt;read_retries&lt;/code&gt; configuration option.&lt;/p&gt;\n&lt;p&gt;When retries are enabled, reading is slower because of the need to parse the stream as you need to count the number of previously read rows.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;table_reader&lt;/code&gt; (dict) option enables you to specify a number of system &lt;a href=\"user-guide/storage/io-configuration.html#table_reader\"&gt;read parameters&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;With the &lt;code&gt;control_attributes&lt;/code&gt; (dict) option, you can request a number of &lt;a href=\"user-guide/storage/io-configuration.html#control_attributes\"&gt;control attributes&lt;/a&gt; when reading data.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;unordered&lt;/code&gt; (bool) option enables you to request unordered reading. In that case, the data might be read faster, but the read order isn't guaranteed.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;response_parameters&lt;/code&gt; (dict) option enables you to send a dict to it. This dict will be appended by special read command parameters (in the current implementation, the two parameters are: start_row_index and approximate_row_count).&lt;/p&gt;\n&lt;p&gt;See the &lt;a href=\"user-guide/storage/examples.html#read_write_untyped\"&gt;example&lt;/a&gt; in the dedicated section.&lt;/p&gt;\n&lt;p&gt;A few more words about reading with retries: in this case, a transaction is created in the current context and a snapshot lock is taken on the table. This lock holds until you've read the entire data stream or call &lt;code&gt;.close()&lt;/code&gt; on the stream or the iterator returned. Such a behavior can result in errors. For example, the following code &lt;strong&gt;won't&lt;/strong&gt; work: because of the nested read transaction, you won't be able to commit the transaction explicitly created within the code (the nested read transaction hasn't been completed because &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.read_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;read_table&lt;/a&gt; created an iterator that hasn't been used).&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; Transaction():\n    write_table(table, rows)\n    read_table(table, &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"yson\"&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1080\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1080\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1080\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1080.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Reading with retries usually works slower than without them because you need to parse a stream of records.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"parallel_read\"&gt;&lt;a href=\"en/api/python/userdoc.html#parallel_read\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Parallel reading of tables and files&lt;/span&gt;&lt;/a&gt;Parallel reading of tables and files&lt;/h4&gt;\n&lt;p&gt;The table is broken down into smaller ranges, assuming that the data is evenly distributed across rows. Each range is considered a separate stream. When you enable retries, the entire range, rather than individual table rows, will be retried. This approach enables you to skip data parsing and streamline the reading process.&lt;br /&gt;\nThe files are simply split into chunks of the specified size and read in parallel.&lt;/p&gt;\n&lt;p&gt;The configuration of parallel reading are stored in the &lt;code&gt;read_parallel&lt;/code&gt; configuration section that includes the following keys:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;enable&lt;/code&gt;: Enable parallel reading.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_thread_count&lt;/code&gt;: Maximum number of threads.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;data_size_per_thread&lt;/code&gt;: Amount of data loaded by each data thread.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Specifics of parallel reading of data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Requesting control attributes is not supported.&lt;/li&gt;\n&lt;li&gt;Table rows with limits set by keys aren't supported.&lt;/li&gt;\n&lt;li&gt;Parallel reading might be ineffective on tables that substantially vary in row sizes.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Acceleration example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ &lt;span class=\"hljs-keyword\"&gt;time&lt;/span&gt; yt read-table //sys/scheduler/event_log.2[:#1000000] --proxy cluster-name --format yson &amp;gt; /dev/null\n\nreal    1m46.608s\nuser    1m39.228s\nsys     0m4.216s\n\n$ &lt;span class=\"hljs-keyword\"&gt;time&lt;/span&gt; yt read-table //sys/scheduler/event_log.2[:#1000000] --proxy cluster-name --format yson --config &lt;span class=\"hljs-string\"&gt;\"{read_parallel={enable=%true;max_thread_count=50;}}\"&lt;/span&gt; &amp;gt; /dev/null\n\nreal    0m14.463s\nuser    0m12.312s\nsys     0m4.304s\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1144\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1144\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1144\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1144.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Measuring the speed&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ &lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_PROXY=cluster-name\n$ yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; //sys/scheduler/event_log.2[:#20000000] --format json --config &lt;span class=\"hljs-string\"&gt;\"{read_parallel={enable=%true;max_thread_count=50;}}\"&lt;/span&gt; &amp;gt; scheduler_log_json\n$ yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; //sys/scheduler/event_log.2[:#20000000] --format yson --config &lt;span class=\"hljs-string\"&gt;\"{read_parallel={enable=%true;max_thread_count=50;}}\"&lt;/span&gt; &amp;gt; scheduler_log_yson\n\n$ &lt;span class=\"hljs-built_in\"&gt;ls&lt;/span&gt; -lah\ntotal 153G\ndrwxrwxr-x 2 user group 4.0K Sep 29 21:23 .\ndrwxrwxr-x 7 user group 4.0K Sep 28 15:20 ..\n-rw-r--r-- 1 user group  51G Sep 29 21:25 scheduler_log_json\n-rw-r--r-- 1 user group  51G Sep 29 21:22 scheduler_log_yson\n-rw-r--r-- 1 user group  51G Sep 29 21:20 test_file\n\n$ &lt;span class=\"hljs-keyword\"&gt;time&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; scheduler_log_yson | yt write-table //tmp/test_yson --format yson\nreal    36m51.653s\nuser    31m34.416s\nsys     1m5.256s\n\n$ &lt;span class=\"hljs-keyword\"&gt;time&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; scheduler_log_json | yt write-table //tmp/test_json --format json\nreal    88m38.745s\nuser    21m7.188s\nsys     1m1.400s\n\n$ &lt;span class=\"hljs-keyword\"&gt;time&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; test_file | yt write-file //tmp/test_file\nreal    35m50.723s\nuser    17m31.232s\nsys     1m39.132s\n\n$ &lt;span class=\"hljs-keyword\"&gt;time&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; scheduler_log_yson | yt write-table //tmp/test_yson --format yson --config &lt;span class=\"hljs-string\"&gt;\"{write_parallel={enable=%true;max_thread_count=30;}}\"&lt;/span&gt;\nreal    13m37.545s\nuser    37m20.516s\nsys     4m16.436s\n\n$ &lt;span class=\"hljs-keyword\"&gt;time&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; scheduler_log_json | yt write-table //tmp/test_json --format json --config &lt;span class=\"hljs-string\"&gt;\"{write_parallel={enable=%true;max_thread_count=30;}}\"&lt;/span&gt;\nreal    3m53.308s\nuser    23m21.152s\nsys     2m57.400s\n\n$ &lt;span class=\"hljs-keyword\"&gt;time&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; test_file | yt write-file //tmp/test_file --config &lt;span class=\"hljs-string\"&gt;\"{write_parallel={enable=%true;max_thread_count=30;}}\"&lt;/span&gt;\nreal    1m49.368s\nuser    18m30.904s\nsys     1m40.660s\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1150\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1150\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1150\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1150.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"parallel_write\"&gt;&lt;a href=\"en/api/python/userdoc.html#parallel_write\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Parallel writing of tables and files&lt;/span&gt;&lt;/a&gt;Parallel writing of tables and files&lt;/h4&gt;\n&lt;p&gt;To use this option, do the following:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Set &lt;code&gt;zlib_fork_safe&lt;/code&gt; if you run python2.&lt;/li&gt;\n&lt;li&gt;Enable the following option in the config file: &lt;code&gt;config[\"write_parallel\"][\"enable\"] = True&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;After that, the standard commands &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.write_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;write_table&lt;/a&gt; and &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.write_file\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;write_file&lt;/a&gt; will work in multithreading mode.&lt;/p&gt;\n&lt;p&gt;Now, the client configuration includes a new &lt;code&gt;write_parallel&lt;/code&gt; section with the following keys:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;enable&lt;/code&gt; (False by default) enables the option to write to tables and files in YTsaurus in parallel.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_thread_count&lt;/code&gt; (10 by default): The maximum number of threads the data is written to in parallel.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;unordered&lt;/code&gt; (False by default): Enables you to write rows to a table in an arbitrary order, streamlining the writing process.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;concatenate_size&lt;/code&gt; (20 by default): a limit on the number of tables or files that the concatenate command receives as input.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"how-it-works\"&gt;&lt;a href=\"en/api/python/userdoc.html#how-it-works\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How it works&lt;/span&gt;&lt;/a&gt;How it works&lt;/h4&gt;\n&lt;p&gt;The entire process of parallel writing looks like this:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The input thread is split into rows, and the rows are grouped into chunks whose size is regulated by the &lt;code&gt;/write_retries/chunk_size&lt;/code&gt; configuration option (the default value is 512 MB).&lt;/li&gt;\n&lt;li&gt;The chunks are delivered to ThreadPool.&lt;/li&gt;\n&lt;li&gt;The threads receive a group of rows to be written as input, compress this data, and upload it to to a temporary table or file on the server.&lt;/li&gt;\n&lt;li&gt;The main thread accumulates temporary tables and files that have already been written to.&lt;/li&gt;\n&lt;li&gt;As soon as the amount of written tables or files becomes equal to &lt;code&gt;/write_parallel/concatenate_size&lt;/code&gt;, the data is merged.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"limitations\"&gt;&lt;a href=\"en/api/python/userdoc.html#limitations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Limitations&lt;/span&gt;&lt;/a&gt;Limitations&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Parallel writing is unavailable when a thread of compressed data is delivered as input.&lt;/li&gt;\n&lt;li&gt;If the path to the output table has the &lt;code&gt;sorted_by&lt;/code&gt; attribute, parallel writing will also be unavailable.&lt;/li&gt;\n&lt;li&gt;Parallel writing won't be effective in Python2 unless you install &lt;code&gt;zlib_fork_safe&lt;/code&gt; (this is because of GIL).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;ol start=\"4\" style=\"--hier-list-start:3\"&gt;\n&lt;li&gt;Parallel writing won't be effective if the parser used for your format is slow (for example, in the event of &lt;a href=\"user-guide/storage/formats.html#schemaful_dsv\"&gt;schemaful_dsv&lt;/a&gt;).&lt;/li&gt;\n&lt;li&gt;Because the input thread is split into chunks for parallel uploading to the cluster, the custom script will consume the memory proportionally to &lt;code&gt;max_thread_count * chunk_size&lt;/code&gt; (in practice, the multiplier is about 2).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;strong&gt;Q: Why is multithreaded writing many times faster for JSON vs. YSON, but is the other way around for singlethreaded writing?&lt;/strong&gt;&lt;br /&gt;\n&lt;strong&gt;A:&lt;/strong&gt; There are two reasons:&lt;br /&gt;\nYou need to break down the input thread into rows. In JSON, you can do this easily by splitting by &lt;code&gt;\\n&lt;/code&gt;. Doing this in YSON requires much more effort. As this operation is single-threaded, it becomes a weak spot and locks the entire writing process.&lt;/p&gt;\n&lt;h3 id=\"transaction_commands\"&gt;&lt;a href=\"en/api/python/userdoc.html#transaction_commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with transactions and locks&lt;/span&gt;&lt;/a&gt;Working with transactions and locks&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.transaction.Transaction\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Transaction&lt;/a&gt;: &lt;strong&gt;Single-thread&lt;/strong&gt; wrapper class for creating, committing, or aborting transactions. It supports the syntax of context manager (the &lt;code&gt;with&lt;/code&gt; statement), that is, if the transaction exits the scope successfully, the transaction is committed; otherwise, it is aborted. All the commands in the scope run within the specified transaction. You can create nested scopes. The &lt;code&gt;ping&lt;/code&gt; parameter (the default value is &lt;code&gt;True&lt;/code&gt;) in the builder is responsible for running a pinging thread. If there is no ping, the operation will be forcibly aborted on timeout expiry.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Examples:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; yt.Transaction():\n    yt.write_table_structured(table, [Row(x=&lt;span class=\"hljs-number\"&gt;5&lt;/span&gt;)])  &lt;span class=\"hljs-comment\"&gt;# the data will be written within the transaction&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;# Once it exits the with, the transaction is committed.&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; yt.Transaction():\n    yt.write_table_structured(table, [Row(x=&lt;span class=\"hljs-number\"&gt;6&lt;/span&gt;)])\n    &lt;span class=\"hljs-keyword\"&gt;raise&lt;/span&gt; RuntimeError(&lt;span class=\"hljs-string\"&gt;\"Something went wrong\"&lt;/span&gt;)\n    &lt;span class=\"hljs-comment\"&gt;# The exception will abort the transaction and no one will see the changes&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;## Nested transactions&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; yt.Transaction():\n    yt.lock(&lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;, waitable=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;, wait_for=&lt;span class=\"hljs-number\"&gt;60000&lt;/span&gt;)\n    &lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; yt.Transaction():\n        yt.&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//home/table/@attr\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1280\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1280\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1280\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1280.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If the pinging thread fails when trying to ping the transaction, it calls &lt;code&gt;thread.interrupt_main()&lt;/code&gt;. You can change this behavior using the option &lt;code&gt;config[\"ping_failed_mode\"]&lt;/code&gt;.&lt;br /&gt;\nAvailable options:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;pass&lt;/code&gt;: Do nothing&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;call_function&lt;/code&gt;: Calls the function specified in the &lt;code&gt;ping_failed_function&lt;/code&gt; field of the config&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;interrupt_main&lt;/code&gt;: Throw the &lt;code&gt;KeyboardInterrupt&lt;/code&gt; exception in the main thread&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;send_signal&lt;/code&gt;: Send the &lt;code&gt;SIGUSR1&lt;/code&gt; signal to the process.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;terminate_process&lt;/code&gt;: Terminate the process.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;You can also manage transactions at a lower level (unlike with the &lt;code&gt;Transaction&lt;/code&gt; context manager, the commands won't automatically be called under the given transaction).&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.start_transaction\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;start_transaction&lt;/a&gt;: Create a new transaction with the specified timeout.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.abort_transaction\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;abort_transaction&lt;/a&gt;: Abort the transaction with the specified ID.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.commit_transaction\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;commit_transaction&lt;/a&gt;: Commit the transaction with the specified ID.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.ping_transaction\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ping_transaction&lt;/a&gt;: Ping the transaction to extend its TTL.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;These functions produce the &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.errors.YtResponseError\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtResponseError&lt;/a&gt; exception with &lt;code&gt;.is_resolve_error() == True&lt;/code&gt; when the transaction is not found.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.lock\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;lock&lt;/a&gt;: Acquires a lock on the specified node within the current transaction. In the event of a waitable lock and the specified &lt;code&gt;wait_for&lt;/code&gt;, it waits for the lock to be taken within &lt;code&gt;wait_for&lt;/code&gt; milliseconds. If the lock isn't taken within this time, it returns an exception.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.unlock\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;unlock&lt;/a&gt;: Removes all the &lt;a href=\"user-guide/storage/transactions.html#implicit_locks\"&gt;explicit&lt;/a&gt; locks on the node acquired by the current transaction. This includes already acquired locks as well as enqueued locks. If there are no locks, it has no effect. When the unlocking is impossible (because the locked node version includes changes compared to the original version), it returns an exception.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;When the transaction is completed (either successfully or not), all the locks taken by it are released. This means that you only have to &lt;code&gt;unlock&lt;/code&gt; when you need to release a node without completing the transaction.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"run_operation_commands\"&gt;&lt;a href=\"en/api/python/userdoc.html#run_operation_commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Running operations&lt;/span&gt;&lt;/a&gt;Running operations&lt;/h3&gt;\n&lt;p&gt;To learn about the operations available for table data, see the &lt;a href=\"user-guide/data-processing/operations/overview.html\"&gt;section&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;All the functions that run operations start with the &lt;code&gt;run_&lt;/code&gt; prefix. These functions often have numerous parameters. Next, we will describe the parameters that are shared by all the operation run functions, as well as the parameter selection logic. For a full list of parameters for each specific function, see &lt;a href=\"http://pydoc.ytsaurus.tech/yt.wrapper.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;pydoc&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Operation run commands&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_erase\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_erase&lt;/a&gt;: &lt;a href=\"user-guide/data-processing/operations/erase.html\"&gt;The operation that deletes data from a table&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_merge\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_merge&lt;/a&gt;: &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;The operation to merge/process data in the table without running the custom code&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_sort\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_sort&lt;/a&gt;: &lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;Data sorting operation&lt;/a&gt;. If the destination table is omitted, inplace sorting of the table is performed.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_map_reduce\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_map_reduce&lt;/a&gt;: &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce operation&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_map\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_map&lt;/a&gt;: &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map operation&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_reduce\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_reduce&lt;/a&gt;: &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce operation&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_join_reduce\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_join_reduce&lt;/a&gt;: &lt;a href=\"user-guide/data-processing/operations/reduce.html#foreign_tables\"&gt;JoinReduce operation&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_operation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_operation&lt;/a&gt;: Runs the operation.&lt;br /&gt;\nBy default, the command starts the operation as it is. The &lt;code&gt;enable_optimizations&lt;/code&gt; option enables the &lt;code&gt;treat_unexisting_as_empty&lt;/code&gt;, &lt;code&gt;run_map_reduce_if_source_is_not_sorted&lt;/code&gt;, &lt;code&gt;run_merge_instead_of_sort_if_input_tables_are_sorted&lt;/code&gt; optimizations if they are enabled in the config&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_remote_copy\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_remote_copy&lt;/a&gt;: &lt;a href=\"user-guide/data-processing/operations/remote-copy.html\"&gt;RemoteCopy operation&lt;/a&gt;&lt;br /&gt;\nCoping the table from one YTsaurus cluster to another.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"spec_builder\"&gt;&lt;a href=\"en/api/python/userdoc.html#spec_builder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SpecBuilder&lt;/span&gt;&lt;/a&gt;SpecBuilder&lt;/h4&gt;\n&lt;p&gt;We recommend using &lt;a href=\"en/api/python/userdoc.html#spec_builder\"&gt;spec builders&lt;/a&gt; to specify the operation's runtime parameters.&lt;/p&gt;\n&lt;p&gt;The following classes are provided for populating the operation specifications:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.MapSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MapSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.ReduceSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ReduceSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.MapReduceSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MapReduceSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.JoinReduceSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;JoinReduceSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.MergeSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MergeSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.SortSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;SortSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.RemoteCopySpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;RemoteCopySpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.EraseSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;EraseSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.VanillaSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;VanillaSpecBuilder&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The names of the methods correspond to option names in the specification listed &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;here&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;The builders used to populate the specification for an operation with custom jobs provide the &lt;code&gt;begin_mapper&lt;/code&gt;, &lt;code&gt;begin_reducer&lt;/code&gt;,  and &lt;code&gt;begin_reduce_combiner&lt;/code&gt; methods. Similarly, there are the &lt;code&gt;begin_job_io&lt;/code&gt;, &lt;code&gt;begin_map_job_io&lt;/code&gt;, &lt;code&gt;begin_sort_job_io&lt;/code&gt;, &lt;code&gt;begin_reduce_job_io&lt;/code&gt;, &lt;code&gt;begin_partition_job_io&lt;/code&gt;, &lt;code&gt;begin_merge_job_io&lt;/code&gt; methods in the appropriate spec builders.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\n\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; __name__ == &lt;span class=\"hljs-string\"&gt;\"__main__\"&lt;/span&gt;:\n    spec_builder = yt.spec_builders.MapSpecBuilder() \\\n        .input_table_paths(&lt;span class=\"hljs-string\"&gt;\"//tmp/input_table\"&lt;/span&gt;) \\\n        .output_table_paths(&lt;span class=\"hljs-string\"&gt;\"//tmp/output_table\"&lt;/span&gt;) \\\n        .begin_mapper() \\\n            .command(&lt;span class=\"hljs-string\"&gt;\"cat\"&lt;/span&gt;) \\\n            .&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(yt.YsonFormat()) \\\n        .end_mapper()\n\n    yt.run_operation(spec_builder)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1485\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1485\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1485\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1485.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Another two types of spec builders are provided for convenience:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Spec builders for filling out &lt;a href=\"user-guide/storage/io-configuration.html\"&gt;I/O parameters&lt;/a&gt;:\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.PartitionJobIOSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;PartitionJobIOSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.SortJobIOSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;SortJobIOSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.MergeJobIOSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MergeJobIOSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.ReduceJobIOSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ReduceJobIOSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.MapJobIOSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MapJobIOSpecBuilder&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Spec builders for filling out the specification of a custom job:\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.MapperSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MapperSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.ReducerSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ReducerSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.ReduceCombinerSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ReduceCombinerSpecBuilder&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;see the &lt;a href=\"api/python/examples.html#spec_builder\"&gt;example in the tutorial&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"other-parameters-of-the-operation-run-commands\"&gt;&lt;a href=\"en/api/python/userdoc.html#other-parameters-of-the-operation-run-commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Other parameters of the operation run commands.&lt;/span&gt;&lt;/a&gt;Other parameters of the operation run commands.&lt;/h4&gt;\n&lt;p&gt;The &lt;code&gt;sync&lt;/code&gt; parameter is shared by all the operation run functions (&lt;code&gt;True&lt;/code&gt; by default). If &lt;code&gt;sync=True&lt;/code&gt;, when the function is called, the operation completion will be awaited synchronously. If &lt;code&gt;sync=False&lt;/code&gt;, the &lt;a href=\"en/api/python/userdoc.html#operation_class\"&gt;Operation&lt;/a&gt; object will be returned to the client.&lt;/p&gt;\n&lt;p&gt;If the relevant parameter is missing in the appropriate spec builder, you can use the &lt;code&gt;spec&lt;/code&gt; parameter of the &lt;code&gt;dict&lt;/code&gt; type that enables you to explicitly set arbitrary options for the operatio
