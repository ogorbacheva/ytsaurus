            {"data":{"leading":false,"html":"&lt;h2 id=\"common\"&gt;&lt;a href=\"en/api/python/userdoc.html#common\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General information&lt;/span&gt;&lt;/a&gt;General information&lt;/h2&gt;\n&lt;h3 id=\"agreements\"&gt;&lt;a href=\"en/api/python/userdoc.html#agreements\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Conventions&lt;/span&gt;&lt;/a&gt;Conventions&lt;/h3&gt;\n&lt;p&gt;Options of system commands have the default value of &lt;code&gt;None&lt;/code&gt;. This means that the option value won't be transmitted at the command execution, and the system will use the default value.&lt;/p&gt;\n&lt;p&gt;For the &lt;code&gt;format&lt;/code&gt; option, the default value of &lt;code&gt;None&lt;/code&gt; usually has another meaning. The command must return a parsed Python structure or expect a Python structure as input. If the &lt;code&gt;format&lt;/code&gt; option isn't specified, the command must return an unparsed result or expect unparsed input.&lt;/p&gt;\n&lt;p&gt;All timeouts or time periods are accepted in milliseconds by default. In some cases, &lt;code&gt;datetime.timedelta&lt;/code&gt; can be used as time interchangeably with milliseconds.&lt;/p&gt;\n&lt;p&gt;All the functions have the &lt;code&gt;client&lt;/code&gt; object as the last option. This behavior is implementation-specific. We do not recommend using this feature on your own.&lt;/p&gt;\n&lt;p&gt;For brevity, in the below examples, we assume that &lt;code&gt;import yt.wrapper as yt&lt;/code&gt; has already been performed.&lt;/p&gt;\n&lt;h3 id=\"client\"&gt;&lt;a href=\"en/api/python/userdoc.html#client\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Client and global client&lt;/span&gt;&lt;/a&gt;Client and global client&lt;/h3&gt;\n&lt;p&gt;The functions and clauses are available from the yt.wrapper global environment of the module library and can change its global status. For example, they save the current transaction there. By changing yt.config, you're also changing the global configuration. If you want to have an option to work from several independent (that is, differently configured) clients, use the &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtClient&lt;/a&gt; class. This class provides almost all the functions from the &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt.wrapper&lt;/a&gt; module: you can call &lt;code&gt;client.run_map&lt;/code&gt;, &lt;code&gt;client.read_table_structured&lt;/code&gt;, &lt;code&gt;with client.Transaction()&lt;/code&gt;, and so on. Note that the &lt;code&gt;YT_PROXY&lt;/code&gt;, &lt;code&gt;YT_TOKEN&lt;/code&gt;, and other environment variables only set the configuration of the global client. That is, they affect only &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#module-yt.wrapper.config\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt.wrapper.config&lt;/a&gt;, but not the configuration of explicitly created &lt;code&gt;YtClient&lt;/code&gt; instances.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; YtClient\nclient = YtClient(proxy=&amp;lt;cluster-name&amp;gt;, config={&lt;span class=\"hljs-string\"&gt;\"backend\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"rpc\"&lt;/span&gt;})\n&lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;(client.&lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"/\"&lt;/span&gt;))\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"27\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-27\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-27\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-27.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Note that the library is not thread-safe: in order to work from different threads, you need to create a client instance on each thread.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"commandparams\"&gt;&lt;a href=\"en/api/python/userdoc.html#commandparams\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Command parameters&lt;/span&gt;&lt;/a&gt;Command parameters&lt;/h4&gt;\n&lt;p&gt;You can transmit a specified set of parameters to all the requests set up through the client (for example, &lt;code&gt;trace_id&lt;/code&gt;). To do this, you can use the special &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html?highlight=create_client_with#yt.wrapper.client.create_client_with_command_params\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;create_client_with_command_params&lt;/a&gt; method that enables you to specify an arbitrary set of options to be transmitted to all the API calls.&lt;/p&gt;\n&lt;h4 id=\"threadsafety\"&gt;&lt;a href=\"en/api/python/userdoc.html#threadsafety\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Thread safety&lt;/span&gt;&lt;/a&gt;Thread safety&lt;/h4&gt;\n&lt;p&gt;This tip remains valid if you are using multiprocessing, even if you aren't using threading. One of the reasons is that if you have already set up a request for the cluster in your main process, a connection pool to this cluster has already been initiated within the global client. So, when the processes fork, they're going to use the same sockets when communicating with the cluster. This might result in various issues.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;When using a native driver, use fork + exec (via &lt;code&gt;Popen&lt;/code&gt;), avoiding even &lt;code&gt;multiprocessing&lt;/code&gt;, because the driver service threads aren't preserved at fork, and the driver becomes incapable of executing requests. You should also avoid overusing clients after forks, because they might have a non-trivial state that poorly survives forks.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gevent\"&gt;&lt;a href=\"en/api/python/userdoc.html#gevent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asynchronous client based on gevent&lt;/span&gt;&lt;/a&gt;Asynchronous client based on gevent&lt;/h4&gt;\n&lt;p&gt;If &lt;code&gt;gevent&lt;/code&gt; is present in your code, you can use &lt;code&gt;yt.wrapper&lt;/code&gt; in the asynchronous mode. This functionality hasn't been covered by tests yet, but should be operable in simple scenarios. Key points:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Before getting started, run monkey patching to replace blocking network calls.&lt;/li&gt;\n&lt;li&gt;Create an independent &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtClient&lt;/a&gt; inside each &lt;a href=\"https://pypi.org/project/greenlet/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;greenlet&lt;/a&gt;. This is important. If you neglect this point, you will get errors.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;You can find an example in this &lt;a href=\"api/python/examples.html#gevent\"&gt;section&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"configuration\"&gt;&lt;a href=\"en/api/python/userdoc.html#configuration\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Configuring&lt;/span&gt;&lt;/a&gt;Configuring&lt;/h3&gt;\n&lt;p&gt;The library supports rich configuration options determining its behavior in different scenarios. For example, you can change the path in Cypress where your temporary tables will be created by default: &lt;code&gt;yt.config[\"remote_temp_tables_directory\"] = \"//home/my_home_dir/tmp\"&lt;/code&gt;.&lt;br /&gt;\nTo learn about options and their detailed descriptions, see the &lt;a href=\"http://pydoc.ytsaurus.tech/_modules/yt/wrapper/default_config.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;code&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;The library is configured via one of the following methods:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Updating the &lt;code&gt;yt.config&lt;/code&gt; object: &lt;code&gt;yt.config[\"proxy\"][\"url\"] = \"&amp;lt;cluster_name&amp;gt;\"&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Calling the function &lt;code&gt;yt.update_config&lt;/code&gt;: &lt;code&gt;yt.update_config({\"proxy\": {\"url\": \"&amp;lt;cluster_name&amp;gt;\"}})&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Setting an environment variable: &lt;code&gt;export YT_CONFIG_PATCHES='{url=\"&amp;lt;cluster_name&amp;gt;\"}'&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Using the file whose path is stored in the &lt;code&gt;YT_CONFIG_PATH&lt;/code&gt; environment variable, the default value is &lt;code&gt;~/.yt/config&lt;/code&gt;. The file should be in the &lt;a href=\"user-guide/storage/formats.html#yson\"&gt;YSON&lt;/a&gt; format  (using the  &lt;code&gt;YT_CONFIG_FORMAT&lt;/code&gt; environment variable, you can change this behavior; the YSON and JSON  formats are supported). Sample file contents: &lt;code&gt;{proxy={url=\"&amp;lt;cluster_name&amp;gt;\"}}&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;You can change some configuration options using environment variables. Such variables are: &lt;code&gt;YT_TOKEN&lt;/code&gt;, &lt;code&gt;YT_PROXY&lt;/code&gt;, &lt;code&gt;YT_PREFIX&lt;/code&gt;. And also options for setting up the logging options (that are separate from the config): &lt;code&gt;YT_LOG_LEVEL&lt;/code&gt; and &lt;code&gt;YT_LOG_PATTERN&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;When using &lt;a href=\"api/cli/cli.html\"&gt;CLI&lt;/a&gt;, you can pass the configuration patch using the &lt;code&gt;--config&lt;/code&gt; option.&lt;/p&gt;\n&lt;p&gt;Note that the library configuration doesn't affect the client configuration: by default, a config with the default values will be used when you're creating a client. To pass a config based on environment variables to the client: &lt;code&gt;client = yt.YtClient(..., config=yt.default_config.get_config_from_env())&lt;/code&gt;. You can also update an existing config with values from the environment variables using the &lt;code&gt;update_config_from_env(config)&lt;/code&gt; function.&lt;/p&gt;\n&lt;p&gt;Keep an eye on the priority order. When you import the library, the configurations transmitted through &lt;code&gt;YT_CONFIG_PATCHES&lt;/code&gt; are applied. This environment variable expects list_fragment: you can pass multiple configurations separated by a semicolon. These patches are applied last-to-first. Then, the values of the options specified by specific environment variables are applied. For example, this can be done using &lt;code&gt;YT_PROXY&lt;/code&gt;. Only after that, the configurations explicitly specified in the code (or passed in the &lt;code&gt;--config&lt;/code&gt; option) are applied.&lt;/p&gt;\n&lt;p&gt;When the config is applied, all the dict nodes are merged rather than overwritten.&lt;/p&gt;\n&lt;p&gt;Setting up a global configuration to work with a cluster in your home directory.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.config[&lt;span class=\"hljs-string\"&gt;\"prefix\"&lt;/span&gt;] = &lt;span class=\"hljs-string\"&gt;\"//home/username/\"&lt;/span&gt;\nyt.config[&lt;span class=\"hljs-string\"&gt;\"proxy\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"url\"&lt;/span&gt;] = &lt;span class=\"hljs-string\"&gt;\"cluster-name\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"130\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-130\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-130\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-130.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Creating a client that will create more and more new tables with the &lt;code&gt;brotli_3&lt;/code&gt; codec.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;client = yt.YtClient(proxy=&amp;lt;cluster-name&amp;gt;, config={&lt;span class=\"hljs-string\"&gt;\"create_table_attributes\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"compression_codec\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"brotli_3\"&lt;/span&gt;}})\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"134\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-134\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-134\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-134.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Setting up a global client to collect the archives of dependencies in Python operations using a local directory that is different from &lt;code&gt;/tmp&lt;/code&gt;. Then creating a client with an additional max_row_weight setting of 128 MB.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;my_config = yt.default_config.get_config_from_env()\nmy_config[&lt;span class=\"hljs-string\"&gt;\"local_temp_directory\"&lt;/span&gt;] = &lt;span class=\"hljs-string\"&gt;\"/home/ignat/tmp\"&lt;/span&gt;\nmy_config[&lt;span class=\"hljs-string\"&gt;\"table_writer\"&lt;/span&gt;] = {&lt;span class=\"hljs-string\"&gt;\"max_row_weight\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;128&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;1024&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;1024&lt;/span&gt;}\nclient = yt.YtClient(config=my_config)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"138\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-138\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-138\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-138.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"configuration_common\"&gt;&lt;a href=\"en/api/python/userdoc.html#configuration_common\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Shared config&lt;/span&gt;&lt;/a&gt;Shared config&lt;/h4&gt;\n&lt;h4 id=\"configuration_profiles\"&gt;&lt;a href=\"en/api/python/userdoc.html#configuration_profiles\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Profiles&lt;/span&gt;&lt;/a&gt;Profiles&lt;/h4&gt;\n&lt;p&gt;In the configuration file, you can specify multiple profiles for working with YTsaurus. A profile is a set of settings with a common name. Profiles can be hepful:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;In different usage scenarios of a single cluster (e.g., you can have a profile for lengthy processes and a profile for quick one-off operations).&lt;/li&gt;\n&lt;li&gt;To specify default settings for working with different clusters.&lt;/li&gt;\n&lt;li&gt;To give a short and fitting name to a cluster.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;To use profiles, enable the second format version: &lt;code&gt;config_version=2&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;A configuration file in the second version has the following structure:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;profiles&lt;/code&gt;: A dict where a key is a profile name and a value is a profile configuration in standard &lt;a href=\"api/python/userdoc.html#configuration\"&gt;format&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;default_profile&lt;/code&gt;: A string that contains the name of the default profile.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;config_version&lt;/code&gt;: A number, version of the configuration file format. Profiles are supported only in the second version. By default, the first version is used.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example of a configuration with profiles in YSON format:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{\n    \"default_profile\"=\"dev\";\n    \"profiles\"={\n        \"main\"={\n            \"token_path\"=\"/etc/token\";\n            \"proxy\"={\n                \"url\"=\"cluster-url\";\n            };\n            \"prefix\"=\"//main\";\n        };\n        \"dev\"={\n            \"token_path\"=\"/etc/token-dev\";\n            \"proxy\"={\n                \"url\"=\"cluster-url\";\n            };\n            \"prefix\"=\"//dev\";\n            \"pool\"=\"dev\";\n        };\n        \"external\"={\n            \"token_path\"=\"/etc/token-external\";\n            \"proxy\"={\n                \"url\"=\"external-url\";\n            };\n        };\n    };\n    \"config_version\"=2;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"191\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-191\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-191\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-191.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You can specify a profile in several ways:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Via the &lt;code&gt;YT_CONFIG_PROFILE&lt;/code&gt; environment variable.&lt;/li&gt;\n&lt;li&gt;In the python sdk &lt;code&gt;client = yt.YtClient(..., config=yt.default_config.get_config_from_env(profile=\"my_profile\"))&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;The &lt;code&gt;default_profile&lt;/code&gt; key value is used by default.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"configuration_logging\"&gt;&lt;a href=\"en/api/python/userdoc.html#configuration_logging\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Logging setup&lt;/span&gt;&lt;/a&gt;Logging setup&lt;/h4&gt;\n&lt;p&gt;This is how logging works in ytsaurus-client and all the tools that use this library. There is a special logger implemented in the &lt;code&gt;yt.logger&lt;/code&gt; module both as a global &lt;code&gt;LOGGER&lt;/code&gt; variable and as aliases that enable logging at the module level.&lt;/p&gt;\n&lt;p&gt;To change the logging settings, update the &lt;code&gt;LOGGER&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The initial logger setup (when loading the module) is regulated by the &lt;code&gt;YT_LOG_LEVEL&lt;/code&gt;, &lt;code&gt;YT_LOG_PATTERN&lt;/code&gt;, and &lt;code&gt;YT_LOG_PATH&lt;/code&gt; environment variables.&lt;br /&gt;\nThe &lt;code&gt;YT_LOG_LEVEL&lt;/code&gt; variable regulates the logging level and accepts one of the following values: &lt;code&gt;DEBUG&lt;/code&gt;, &lt;code&gt;INFO&lt;/code&gt;, &lt;code&gt;WARNING&lt;/code&gt;, &lt;code&gt;ERROR&lt;/code&gt;. The &lt;code&gt;YT_LOG_PATTERN&lt;/code&gt; variable regulates the formatting of log messages and accepts the logger's format string. For more information, see the Python &lt;a href=\"https://docs.python.org/3/library/logging.html#logging.Formatter\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;documentation&lt;/a&gt;. You can use the &lt;code&gt;YT_LOG_PATH&lt;/code&gt; environment variable to specify the path to the log file.&lt;/p&gt;\n&lt;p&gt;By default, the logging level is INFO, and log messages are written to stderr.&lt;/p&gt;\n&lt;h4 id=\"configuration_token\"&gt;&lt;a href=\"en/api/python/userdoc.html#configuration_token\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Token setup&lt;/span&gt;&lt;/a&gt;Token setup&lt;/h4&gt;\n&lt;p&gt;You can retrieve the token from the following places (listed in priority order).&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;From the &lt;code&gt;config[\"token\"]&lt;/code&gt;option that gets to the global configuration from the &lt;code&gt;YT_TOKEN&lt;/code&gt; environment variable.&lt;/li&gt;\n&lt;li&gt;From the file specified in &lt;code&gt;config[\"token_path\"]&lt;/code&gt;; the default value of this option is &lt;code&gt;~/.yt/token&lt;/code&gt;. This option can also be overridden using the &lt;code&gt;YT_TOKEN_PATH&lt;/code&gt; environment variable (the environment variable only applies to the global client configuration; for details, see the &lt;a href=\"en/api/python/userdoc.html#configuration\"&gt; section&lt;/a&gt;).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"configuration_retries\"&gt;&lt;a href=\"en/api/python/userdoc.html#configuration_retries\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Setting up configuration retries&lt;/span&gt;&lt;/a&gt;Setting up configuration retries&lt;/h4&gt;\n&lt;p&gt;Commands in YTsaurus are classified into light and heavy (to get the system's view on the list of commands, see &lt;a href=\"api/commands.html\"&gt;Commands&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;Light commands are commands like &lt;code&gt;create, remove, set, list, get, ping&lt;/code&gt;, and other similar ones. Before each request, the client also accesses a special proxy to get a list of commands that it supports. We recommend retrying such commands when errors or timeouts occur. You can set up the retry parameters in the &lt;code&gt;proxy/retries&lt;/code&gt; configuration section.&lt;/p&gt;\n&lt;p&gt;There are two categories of heavy requests.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Reading from and writing to tables or files (that is, read_table, write_table, read_blob_table, and other requests). The retries for such commands are set up in the &lt;code&gt;read_retries&lt;/code&gt; and &lt;code&gt;write_retries&lt;/code&gt; sections (for read requests and write requests, respectively).&lt;/li&gt;\n&lt;li&gt;Reading from and writing to dynamic tables (that is, with heavy queries, such a select_rows, lookup_rows, insert_rows, and others). For such commands, the retries are set up individually in the &lt;code&gt;dynamic_table_retries&lt;/code&gt; section (the regular options read_retries and write_retries won't work because when reading static tables, 60-second intervals between retries are considered normal, but that's inappropriate for dynamic tables where low latency is critical).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The above-mentioned retries affect the processes of data uploads or exports from the cluster in the case of network faults, chunk unavailability, and other issues. Below is a description of actions that are initiated inside the cluster (running a MapReduce operation or a batch request).&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The &lt;code&gt;start_operation_retries&lt;/code&gt; section regulates the retries of the operation start command, that is, instead of dealing with network issues, here we handle the errors like \"concurrent operation limit exceeded,\" when many operations are running and the scheduler won't start new ones. In case of such errors, the client makes retries with big sleep intervals to allow enough time for some operations to complete.&lt;/li&gt;\n&lt;li&gt;The &lt;code&gt;concatenate_retries&lt;/code&gt; section regulates the retries of the concatenate command (see &lt;a href=\"api/python/start.html\"&gt;API&lt;/a&gt;). This isn't a light command because it may access different master cells and spend a long time there. That's why you can't use the retry settings for light commands in this case.&lt;/li&gt;\n&lt;li&gt;The &lt;code&gt;batch_requests_retries&lt;/code&gt; section regulates the retries made from inside a batch request (see the description of the &lt;code&gt;execute_batch&lt;/code&gt;) command. The client retries the requests that failed with such errors as the \"request rate limit exceeded\". That is, the client sends a batch of requests, of which some have completed and some have failed with the \"request queue size per user exceeded\" errors. In this case, the requests are delivered again with a new batch. This section regulates the policy of such retries.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"errors\"&gt;&lt;a href=\"en/api/python/userdoc.html#errors\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Errors&lt;/span&gt;&lt;/a&gt;Errors&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.html#yt.common.YtError\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtError&lt;/a&gt;: The parent class of all the errors in the library. It has the following fields:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;code&lt;/code&gt; (int type): HTTP error code  (see the &lt;a href=\"api/error-codes.html\"&gt;section&lt;/a&gt;). If omitted, it's equal to 1.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;inner_errors&lt;/code&gt; (the list type): Errors that preceded the given error when executing the request (the proxy accessed the driver, an error occurred inside the driver: this error will be added to &lt;code&gt;inner_errors&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;attributes&lt;/code&gt; (the dict type): Attributes of a generic error (for example, the request date).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The following errors describe more specific issues.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.errors.YtOperationFailedError\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtOperationFailedError&lt;/a&gt;: The operation has failed. This error stores the following information in the &lt;code&gt;attributes&lt;/code&gt; field.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;id&lt;/code&gt;: Operation ID.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;url&lt;/code&gt;: Operation URL.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;stderrs&lt;/code&gt;: List of dicts with details about the jobs that failed or jobs with stderr. This dict has the &lt;code&gt;host&lt;/code&gt; field; it can also have the &lt;code&gt;stderr&lt;/code&gt; and &lt;code&gt;error&lt;/code&gt; fields, depending on whether the job had a stderr or had failed.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;state&lt;/code&gt;: Operation status (for example, &lt;code&gt;failed&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;To print the stderr output when an operation fails, you need to process the exception and explicitly print error messages. Otherwise, you will see them truncated in backtrace. You can use the non-public decorator &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operation_commands.add_failed_operation_stderrs_to_error_message\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;add_failed_operation_stderrs_to_error_message&lt;/a&gt; (though it might be renamed in the future) that intercepts the &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.errors.YtOperationFailedError\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtOperationFailedError&lt;/a&gt; exception and enriches its message about the stderr error.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.errors.YtResponseError\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtResponseError&lt;/a&gt;: The command (that is, the request to YTsaurus) has failed. This class has the &lt;code&gt;error&lt;/code&gt; field that stores the structured response describing the error cause.&lt;br /&gt;\nIt provides the following useful methods:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.html#yt.common.YtResponseError.is_resolve_error\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;is_resolve_error&lt;/a&gt; (for example, it returns&lt;code&gt;True&lt;/code&gt; on an attempt to commit a non-existing transaction or request a non-existing node).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.html#yt.common.YtResponseError.is_access_denied\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;is_access_denied&lt;/a&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.html#yt.common.YtResponseError.is_concurrent_transaction_lock_conflict\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;is_concurrent_transaction_lock_conflict&lt;/a&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.html#yt.common.YtResponseError.is_request_queue_size_limit_exceeded\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;is_request_queue_size_limit_exceeded&lt;/a&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.html#yt.common.YtResponseError.is_chunk_unavailable\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;is_chunk_unavailable&lt;/a&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.html#yt.common.YtResponseError.is_request_timed_out\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;is_request_timed_out&lt;/a&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.html#yt.common.YtResponseError.is_concurrent_operations_limit_reached\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;is_concurrent_operations_limit_reached&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Other subclasses of &lt;code&gt;YtError&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.errors.YtHttpResponseError\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtHttpResponseError&lt;/a&gt;: Subclass of &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.errors.YtResponseError\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtResponseError&lt;/a&gt;, it includes the &lt;code&gt;headers&lt;/code&gt; field.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.errors.YtProxyUnavailable\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtProxyUnavailable&lt;/a&gt;: The proxy is currently unavailable - for example, it's overwhelmed with requests.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.errors.YtTokenError\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtTokenError&lt;/a&gt;: An invalid token has been passed.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.errors.YtFormatError\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtFormatError&lt;/a&gt;: The format is invalid.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.errors.YtIncorrectResponse\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtIncorrectResponse&lt;/a&gt;: An invalid response has been received from the proxy (for example, JSON is invalid).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.errors.YtTimeoutError\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtTimeoutError&lt;/a&gt;: The operation has been terminated by a timeout.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;You can look up a full list of subclasses in the code.&lt;/p&gt;\n&lt;h3 id=\"formats\"&gt;&lt;a href=\"en/api/python/userdoc.html#formats\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Formats&lt;/span&gt;&lt;/a&gt;Formats&lt;/h3&gt;\n&lt;p&gt;To learn more about the formats, see the &lt;a href=\"user-guide/storage/formats.html\"&gt;section&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;There is a separate class for each format:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.format.YsonFormat\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YsonFormat&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.format.JsonFormat\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;JsonFormat&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.format.DsvFormat\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;DsvFormat&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.format.SchemafulDsvFormat\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;SchemafulDsvFormat&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.format.YamrFormat\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YamrFormat&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;In the constructor, these classes accept the parameters that are specific for the given formats. If the format option isn't explicitly available in the constructor, you can pass it in the &lt;code&gt;attributes&lt;/code&gt; option that accepts a &lt;code&gt;dict&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Moreover, each class has a set of methods for serialization or deserialization of records from the stream:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.format.Format.load_row\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;load_row&lt;/a&gt;: Reads a single row from the stream. Some formats (for example, Yson) do not support loading a single record. That's why, when you use &lt;code&gt;load_rows&lt;/code&gt; on them, they will throw an exception.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.format.Format.load_rows\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;load_rows&lt;/a&gt;: Reads all the records from the stream, processes the table switches, and returns a record iterator. If &lt;code&gt;raw==True&lt;/code&gt;, the method returns rows without parsing them. This method is a generator.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.format.Format.dumps_row\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;dump_row&lt;/a&gt;: Writes a single record to the stream.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.format.Format.dumps_rows\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;dump_rows&lt;/a&gt;: Writes a set of records to the stream. It adds table switches to the output stream.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;There is also the &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.format.create_format\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;create_format&lt;/a&gt; function that creates a format based on the specified name and a given set of attributes. The format name can also include attributes in YSON format: you can create a format as follows: &lt;code&gt;create_format(\"&amp;lt;columns=[columnA;columnB]&amp;gt;schemaful_dsv\")&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;You can use the &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.format.create_table_switch\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;create_table_switch&lt;/a&gt; function to create a record that functions as a switch to the table with the specified index.&lt;/p&gt;\n&lt;p&gt;The functions &lt;code&gt;read_table, write_table, select_rows, lookup_rows, insert_rows, delete_rows&lt;/code&gt; have the &lt;code&gt;raw&lt;/code&gt; parameter that enables you to get/send records in an unparsed format (as strings). If you set &lt;code&gt;raw&lt;/code&gt; to &lt;code&gt;False&lt;/code&gt;, this means that the records will be deserialized to &lt;code&gt;dict&lt;/code&gt; at reading and serialized from &lt;code&gt;dict&lt;/code&gt; at writing.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.write_table(&lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;, [&lt;span class=\"hljs-string\"&gt;b\"x=value\\n\"&lt;/span&gt;], &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=yt.DsvFormat(), raw=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n&lt;span class=\"hljs-keyword\"&gt;assert&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(yt.read_table(&lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;, &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=yt.DsvFormat(), raw=&lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;)) == [{&lt;span class=\"hljs-string\"&gt;\"x\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;}]  &lt;span class=\"hljs-comment\"&gt;# Ok&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"497\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-497\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-497\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-497.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;A similar option exists for operations. By default, this operation deserializes records from the format specified at operation startup. If you want the operation to accept unparsed strings as input, use the &lt;code&gt;raw&lt;/code&gt; decorator and specify the format when running the operation:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-meta\"&gt;@yt.raw&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;mapper&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;rec&lt;/span&gt;):\n    ...\n\nyt.run_map(...., &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=yt.JsonFormat())\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"501\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-501\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-501\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-501.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;To use YSON format to work with tables (operations, table read/write), additionally install the package with YSON C++ bindings (see &lt;a href=\"en/api/python/userdoc.html#yson_bindings\"&gt;yson bindings&lt;/a&gt;). Otherwise, you will see the \"Yson bindings required\" exception.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Specifics of using JSON format: the JSON module is written in Python, that's why it's very slow. The library tries to use different modules that support bindings written in faster languages such as ujson. To enable it, use the &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.format.JsonFormat\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;enable_ujson&lt;/a&gt; parameter: &lt;code&gt;JsonFormat(..., enable_ujson=True)&lt;/code&gt;. The ujson package is disabled by default because in certain cases its default behavior is faulty:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; ujson\ns = &lt;span class=\"hljs-string\"&gt;'{\"a\": 48538100000000000000.0}'&lt;/span&gt;\nujson.loads(s)\n{&lt;span class=\"hljs-string\"&gt;u'a'&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;1.1644611852580897e+19&lt;/span&gt;}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"515\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-515\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-515\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-515.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If you have read the ujson documentation, and you are sure you that your input data will be deserialized correctly, then parse using this module.&lt;/p&gt;\n&lt;h3 id=\"ypath\"&gt;&lt;a href=\"en/api/python/userdoc.html#ypath\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YPath&lt;/span&gt;&lt;/a&gt;YPath&lt;/h3&gt;\n&lt;p&gt;Paths in YTsaurus are represented by &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPath&lt;/a&gt;. In code, this is enabled by the &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.ypath.YPath\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YPath&lt;/a&gt; class and its subclasses, &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.ypath.TablePath\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TablePath&lt;/a&gt; and &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.ypath.FilePath\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;FilePath&lt;/a&gt;. Among the constructors of the last two classes, you can specify relevant YPath attributes, for example, &lt;code&gt;schema&lt;/code&gt;, &lt;code&gt;start_index&lt;/code&gt;, &lt;code&gt;end_index&lt;/code&gt; (for &lt;code&gt;TablePath&lt;/code&gt;) and &lt;code&gt;append&lt;/code&gt; and &lt;code&gt;executable&lt;/code&gt; (for &lt;code&gt;FilePath&lt;/code&gt;). To learn more about &lt;code&gt;TablePath&lt;/code&gt;, see the &lt;a href=\"en/api/python/userdoc.html#tablepath_class\"&gt;section&lt;/a&gt;.&lt;br /&gt;\nUse these classes for working with paths in your code instead of formatting YPath literals manually.&lt;/p&gt;\n&lt;p&gt;There are other useful functions in &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#module-yt.wrapper.ypath\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YPath&lt;/a&gt; modules, here are some of them:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.ypath.ypath_join\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ypath_join&lt;/a&gt; joins several paths into one path (a counterpart of &lt;code&gt;os.path.join&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.ypath.ypath_split\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ypath_split&lt;/a&gt;: Returns the &lt;code&gt;(head, tail)&lt;/code&gt; pair, where &lt;code&gt;tail&lt;/code&gt; is the trailing path component and&lt;code&gt;head&lt;/code&gt; is the remaining path (a counterpart of &lt;code&gt;os.path.split&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.ypath.ypath_dirname\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ypath_dirname&lt;/a&gt;: Returns the path without the trailing component (a counterpart of &lt;code&gt;os.path.dirname&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.ypath.escape_ypath_literal\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;escape_ypath_literal&lt;/a&gt;: Escapes the string so that it can be used as a YPath component.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"python3_strings\"&gt;&lt;a href=\"en/api/python/userdoc.html#python3_strings\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Python3 and byte strings&lt;/span&gt;&lt;/a&gt;Python3 and byte strings&lt;/h3&gt;\n&lt;p&gt;In YTsaurus, all the strings are byte strings. However, in Python, regular strings are Unicode-based. That's why the following feature for structured data (dicts) has been introduced in Python 3. When writing to and reading from tables in &lt;code&gt;raw&lt;/code&gt; mode, the library uses binary strings both for input and output.&lt;br /&gt;\nIn non-&lt;code&gt;raw&lt;/code&gt; mode, the following logic is enabled.&lt;/p&gt;\n&lt;p&gt;When read, strings are automatically utf8-encoded, including dict keys (to select a different encoding, use the &lt;code&gt;encoding&lt;/code&gt; parameter in the format, see below). If a byte string is read, a special &lt;a href=\"https://pydoc.ytsaurus.tech/yt.yson.html#yt.yson.yson_types.YsonStringProxy\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YsonStringProxy&lt;/a&gt; object is returned. If you try to treat such an object as a string, you will get a typical error: &lt;a href=\"https://pydoc.ytsaurus.tech/yt.yson.html#yt.yson.yson_types.NotUnicodeError\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;NotUnicodeError&lt;/a&gt;. You can call two functions on such an object: &lt;a href=\"https://pydoc.ytsaurus.tech/yt.yson.html#yt.yson.yson_types.is_unicode\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt.yson.is_unicode&lt;/a&gt; and &lt;a href=\"https://pydoc.ytsaurus.tech/yt.yson.html#yt.yson.yson_types.get_bytes\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt.yson.get_bytes&lt;/a&gt;. The first function will return &lt;code&gt;False&lt;/code&gt; for &lt;code&gt;YsonStringProxy&lt;/code&gt;, and the second function will return raw bytes that couldn't be decoded. You can call the same functions on regular strings, and for them &lt;code&gt;is_unicode&lt;/code&gt; will return &lt;code&gt;True&lt;/code&gt; as expected. When calling &lt;code&gt;get_bytes&lt;/code&gt; on regular strings, as the second argument, you can specify the encoding (&lt;code&gt;utf-8&lt;/code&gt; by default) and get &lt;code&gt;s.encode(encoding)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Here's the assumed scenario for mixed, regular, and byte structures when reading tables or running operations:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-comment\"&gt;## if you simply need bytes&lt;/span&gt;\nb = yt.yson.get_bytes(s)\n\n&lt;span class=\"hljs-comment\"&gt;## if you need to do respond differently to byte strings and regular strings&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; yt.yson.is_unicode(s):\n    &lt;span class=\"hljs-comment\"&gt;# Process a regular string&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;else&lt;/span&gt;:\n    b = yt.yson.get_bytes(s)\n    &lt;span class=\"hljs-comment\"&gt;# Process a byte string&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"562\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-562\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-562\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-562.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;When writing data, you can both leave the &lt;code&gt;YsonStringProxy&lt;/code&gt;  object as it is (it will be automatically converted to a byte string) or return a byte string or Unicode string. Unicode strings will be encoded in UTF-8 (or other encoding).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Note that&lt;/strong&gt; you can't mix &lt;code&gt;bytes&lt;/code&gt; and &lt;code&gt;str&lt;/code&gt; in dict keys. When &lt;code&gt;encoding != None&lt;/code&gt;, the only way to specify a byte key is to use the &lt;a href=\"https://pydoc.ytsaurus.tech/yt.yson.html#yt.yson.yson_types.make_byte_key\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt.yson.make_byte_key&lt;/a&gt; function. The reason is that in Python 3, the strings &lt;code&gt;\"a\"&lt;/code&gt; and &lt;code&gt;b\"a\"&lt;/code&gt; are not equal. It is unacceptable for a dict in the format &lt;code&gt;{\"a\": 1, b\"a\": 1}&lt;/code&gt; to be sent to the system implicitly, converted to a string with two identical &lt;code&gt;a&lt;/code&gt; keys.&lt;/p&gt;\n&lt;p&gt;If needed, you can disable the decoding logic or select another encoding. Use the &lt;code&gt;encoding&lt;/code&gt; parameter when creating a format in this case. If the &lt;code&gt;encoding&lt;/code&gt; parameter is specified and is &lt;code&gt;None&lt;/code&gt;, the library works with the records where all the rows are expected to be binary rows (both keys and values, both on write and on read). If you attempt to serialize a dict that includes Unicode strings with &lt;code&gt;encoding=None&lt;/code&gt;, in most cases, you'll see an error.&lt;/p&gt;\n&lt;p&gt;If the &lt;code&gt;encoding&lt;/code&gt; parameter is specified and is not &lt;code&gt;None&lt;/code&gt;, the library handles Unicode strings, but expects the specified encoding from all data (instead of UTF-8 used by default).&lt;/p&gt;\n&lt;p&gt;An example of use with comments is &lt;a href=\"api/python/examples.html#yson_string_proxy\"&gt;in a separate section&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"batch-requests\"&gt;&lt;a href=\"en/api/python/userdoc.html#batch-requests\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batch requests&lt;/span&gt;&lt;/a&gt;Batch requests&lt;/h3&gt;\n&lt;p&gt;Low-level API:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.execute_batch\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;execute_batch&lt;/a&gt;: Accepts a set of request descriptions in the list format and returns a set of results. A simple wrapper for the &lt;a href=\"api/commands.html#execute_batch\"&gt;API command&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;High level API:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.batch_helpers.create_batch_client\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;create_batch_client&lt;/a&gt;: Creates a batch client. This function is available both on the client side and globally. The batch client has as its methods all the API functions supported in the batch requests.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.batch_apply\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;batch_apply&lt;/a&gt;: This method enables you to apply a function to a dataset, in batch mode. Returns a list of results.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;client = yt.YtClient(&lt;span class=\"hljs-string\"&gt;\"cluster-name\"&lt;/span&gt;)\n\nbatch_client = client.create_batch_client()\nlist_rsp = batch_client.&lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"/\"&lt;/span&gt;)\nexists_rsp = batch_client.exists(&lt;span class=\"hljs-string\"&gt;\"/\"&lt;/span&gt;)\nbatch_client.commit_batch()\n\n&lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;(list_rsp.get_result())\n&lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;(exists_rsp.get_result())\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"609\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-609\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-609\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-609.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;For more information about batch requests, see the &lt;a href=\"user-guide/storage/batch-requests.html\"&gt;tutorial&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Specifics of working with the batch client:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;The &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.create_batch_client\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;create_batch_client&lt;/a&gt; method and the client configuration have the &lt;code&gt;max_batch_size&lt;/code&gt; parameter with a default value of 100. When the &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.batch_client.BatchClient.commit_batch\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;commit_batch&lt;/a&gt; method is called on the client side, the requests are broken down into parts, &lt;code&gt;max_batch_size&lt;/code&gt; each, and are executed in a step-by-step manner. This is because of natural restrictions on the request size.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;All the requests are sent with the client transaction from which the batch-client has been constructed. If the client is used inside a transaction, all its requests are executed in the context of this transaction. The batch client behaves similarly.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;By default, you can handle all the errors that arise in requests by looking at &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.batch_response.BatchResponse\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;BatchResponse&lt;/a&gt; returned by the batch client methods.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;client = yt.YtClient(&lt;span class=\"hljs-string\"&gt;\"cluster-name\"&lt;/span&gt;)\nbatch_client = client.create_batch_client()\nlist_rsp = batch_client.&lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//some/node\"&lt;/span&gt;)\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; list_rsp.is_ok():\n    &lt;span class=\"hljs-comment\"&gt;# ...&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;else&lt;/span&gt;:\n    error = yt.YtResponseError(list_rsp.get_error())\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; error.is_resolve_error():\n        &lt;span class=\"hljs-comment\"&gt;# Handle the situation when the node for which the list has been created doesn't exist&lt;/span&gt;\n        &lt;span class=\"hljs-comment\"&gt;# ...&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"634\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-634\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-634\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-634.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.create_batch_client\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;create_batch_client&lt;/a&gt; method has the &lt;code&gt;raise_errors&lt;/code&gt; parameter that you can set to &lt;code&gt;True&lt;/code&gt;. Then, if at least one request fails, the &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.batch_execution.YtBatchRequestFailedError\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtBatchRequestFailedError&lt;/a&gt; exception will be thrown with all the errors. Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;client = yt.YtClient(&lt;span class=\"hljs-string\"&gt;\"cluster-name\"&lt;/span&gt;)\nbatch_client = client.create_batch_client(raise_errors=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\nlist_rsp = batch_client.&lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//some/node\"&lt;/span&gt;)\n&lt;span class=\"hljs-keyword\"&gt;try&lt;/span&gt;:\n    batch_client.commit_batch()\n&lt;span class=\"hljs-keyword\"&gt;except&lt;/span&gt; yt.YtBatchRequestFailedError &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; err:\n   &lt;span class=\"hljs-comment\"&gt;# Print the error message&lt;/span&gt;\n   &lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt; err.inner_errors[&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"message\"&lt;/span&gt;]  &lt;span class=\"hljs-comment\"&gt;# \"Error resolving path //some/node\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"640\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-640\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-640\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-640.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"commands\"&gt;&lt;a href=\"en/api/python/userdoc.html#commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Commands&lt;/span&gt;&lt;/a&gt;Commands&lt;/h2&gt;\n&lt;p&gt;The yt library allows running the commands in the system using the Python API. The public part of the library includes only the methods that are in &lt;code&gt;yt/wrapper/__init__.py&lt;/code&gt; and &lt;code&gt;yt/yson/__init__.py&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Some command options are shared by command classes. For more information, see &lt;a href=\"api/commands.html\"&gt;Commands&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"cypress_commands\"&gt;&lt;a href=\"en/api/python/userdoc.html#cypress_commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with Cypress&lt;/span&gt;&lt;/a&gt;Working with Cypress&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.get\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get&lt;/a&gt;: Get the value of the Cypress node. &lt;a href=\"user-guide/storage/cypress-example.html#get\"&gt;Read more&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.set\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;set&lt;/a&gt;: Write a value to the Cypress node. &lt;a href=\"user-guide/storage/cypress-example.html#set\"&gt;Read more&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.create\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;create&lt;/a&gt;: Create an empty Cypress node of the &lt;code&gt;type&lt;/code&gt; and with &lt;code&gt;attributes&lt;/code&gt;. &lt;a href=\"user-guide/storage/cypress-example.html#create\"&gt;Read more&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.exists\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;exists&lt;/a&gt;: Check whether the Cypress node exists. &lt;a href=\"user-guide/storage/cypress-example.html#exists\"&gt;Read more&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.remove\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;remove&lt;/a&gt;: Delete the Cypress node. &lt;a href=\"user-guide/storage/cypress-example.html#remove\"&gt;Read more&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.list\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;list&lt;/a&gt;: Get a list of children for the &lt;code&gt;path&lt;/code&gt; node. The &lt;code&gt;absolute&lt;/code&gt; option enables the output of absolute paths instead of relative paths. &lt;a href=\"user-guide/storage/cypress-example.html#list\"&gt;Read more&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Examples:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.create(&lt;span class=\"hljs-string\"&gt;\"table\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;, attributes={&lt;span class=\"hljs-string\"&gt;\"mykey\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"myvalue\"&lt;/span&gt;}) &lt;span class=\"hljs-comment\"&gt;# Output: &amp;lt;id of the created object&amp;gt;&lt;/span&gt;\nyt.get(&lt;span class=\"hljs-string\"&gt;\"//home/table/@mykey\"&lt;/span&gt;)  &lt;span class=\"hljs-comment\"&gt;# Output: \"myvalue\"&lt;/span&gt;\nyt.create(&lt;span class=\"hljs-string\"&gt;\"map_node\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//home/dir\"&lt;/span&gt;) &lt;span class=\"hljs-comment\"&gt;# Output: &amp;lt;id of the created object&amp;gt;&lt;/span&gt;\nyt.exists(&lt;span class=\"hljs-string\"&gt;\"//home/dir\"&lt;/span&gt;)  &lt;span class=\"hljs-comment\"&gt;# Output: True&lt;/span&gt;\n\nyt.&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//home/string_node\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"abcde\"&lt;/span&gt;)\nyt.get(&lt;span class=\"hljs-string\"&gt;\"//home/string_node\"&lt;/span&gt;)  &lt;span class=\"hljs-comment\"&gt;# Output: \"abcde\"&lt;/span&gt;\nyt.get(&lt;span class=\"hljs-string\"&gt;\"//home/string_node\"&lt;/span&gt;, &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"json\"&lt;/span&gt;)  &lt;span class=\"hljs-comment\"&gt;# Output: '\"abcde\"'&lt;/span&gt;\n\nyt.&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//home/string_node/@mykey\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;)  &lt;span class=\"hljs-comment\"&gt;# Set the attribute&lt;/span&gt;\nyt.get(&lt;span class=\"hljs-string\"&gt;\"//home/string_node/@mykey\"&lt;/span&gt;)  &lt;span class=\"hljs-comment\"&gt;# Output: \"value\"&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;## Create a document and use it as a dictonary&lt;/span&gt;\nyt.create(&lt;span class=\"hljs-string\"&gt;\"document\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//home/doc\"&lt;/span&gt;)\nyt.&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//home/doc\"&lt;/span&gt;, {&lt;span class=\"hljs-string\"&gt;\"number\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;7&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"vegetable\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"tomato\"&lt;/span&gt;})\nyt.get(&lt;span class=\"hljs-string\"&gt;\"//home/doc\"&lt;/span&gt;)  &lt;span class=\"hljs-comment\"&gt;# Output: [7L, \"tomato\"]&lt;/span&gt;\nyt.&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//home/doc/vegetable\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"cabbage\"&lt;/span&gt;)\nyt.get(&lt;span class=\"hljs-string\"&gt;\"//home/doc\"&lt;/span&gt;)  &lt;span class=\"hljs-comment\"&gt;# Output: [7L, \"cabbage\"]&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;## Create a document and append number and a string to it&lt;/span&gt;\nyt.create(&lt;span class=\"hljs-string\"&gt;\"document\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//home/doc-list\"&lt;/span&gt;)\nyt.&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//home/doc-list\"&lt;/span&gt;, [])\nyt.&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//home/doc-list/end\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;7&lt;/span&gt;)\nyt.&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//home/doc-list/end\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"cabbage\"&lt;/span&gt;)\nyt.get(&lt;span class=\"hljs-string\"&gt;\"//home/doc-list\"&lt;/span&gt;)  &lt;span class=\"hljs-comment\"&gt;# Output: [7L, \"cabbage\"]&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"688\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-688\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-688\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-688.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.copy\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;copy&lt;/a&gt; and &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.move\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;move&lt;/a&gt;: Copy/move the Cypress node. To learn more about the option value, see &lt;a href=\"user-guide/storage/cypress-example.html#copy_move\"&gt;section&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.link\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;link&lt;/a&gt;: create a symlink to a Cypress node. &lt;a href=\"user-guide/storage/cypress-example.html#link\"&gt;Read more&lt;/a&gt;.&lt;br /&gt;\nTo learn where the symlink points, read the value from the &lt;code&gt;@path&lt;/code&gt; attribute. To access a &lt;code&gt;link&lt;/code&gt; object, add &lt;code&gt;&amp;amp;&lt;/code&gt; at the end of the path.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Examples:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.create(&lt;span class=\"hljs-string\"&gt;\"table\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;)\nyt.copy(&lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/test/path/table\"&lt;/span&gt;)\n&lt;span class=\"hljs-comment\"&gt;## error&lt;/span&gt;\nyt.copy(&lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/test/path/table\"&lt;/span&gt;, recursive=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\nyt.get(&lt;span class=\"hljs-string\"&gt;\"//home/table/@account\"&lt;/span&gt;)\n&lt;span class=\"hljs-comment\"&gt;## Output: sys&lt;/span&gt;\nyt.get(&lt;span class=\"hljs-string\"&gt;\"//tmp/test/path/table/@account\"&lt;/span&gt;)\n&lt;span class=\"hljs-comment\"&gt;## Output: tmp&lt;/span&gt;\n\nyt.move(&lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/test/path/table\"&lt;/span&gt;)\n&lt;span class=\"hljs-comment\"&gt;## error&lt;/span&gt;\nyt.move(&lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/test/path/table\"&lt;/span&gt;, force=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\nyt.get(&lt;span class=\"hljs-string\"&gt;\"//tmp/test/path/table/@account\"&lt;/span&gt;)\n&lt;span class=\"hljs-comment\"&gt;## Output: sys&lt;/span&gt;\n\nyt.link(&lt;span class=\"hljs-string\"&gt;\"//tmp/test/path/table\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;)\nyt.get(&lt;span class=\"hljs-string\"&gt;\"//home/table/@path\"&lt;/span&gt;)\n&lt;span class=\"hljs-comment\"&gt;##Output: \"/tmp/test/path/table\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"704\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-704\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-704\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-704.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;An alias function for creating a directory.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.mkdir\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;mkdir&lt;/a&gt;: Creates a directory, that is, a node of the &lt;code&gt;map_node&lt;/code&gt; type.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Alias functions for working with attributes&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.get_attribute\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get_attribute&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.has_attribute\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;has_attribute&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.set_attribute\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;set_attribute&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.remove_attribute\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;remove_attribute&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Note that these functions do not support access to nested attributes by design.&lt;br /&gt;\nTo access nested attributes, use regular Cypress verbs and navigation using &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPath&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Merging files/tables:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.concatenate\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;concatenate&lt;/a&gt;: Merges chunks from tables or files.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Other commands:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.find_free_subpath\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;find_free_subpath&lt;/a&gt;: Searches a free node whose path begins with &lt;code&gt;path&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.search\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;search&lt;/a&gt;: Recursively traverses a subtree growing from the root node. By default, it outputs the absolute paths of all the nodes of the subtree. There's also a number of filters that allow you to select specific records. The &lt;code&gt;attributes&lt;/code&gt; option specifies a list of attributes that must be retrieved with each node. The retrieved attributes are available in the &lt;code&gt;.attributes&lt;/code&gt; field on the returned paths.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; table &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; yt.search(\n    &lt;span class=\"hljs-string\"&gt;\"//home\"&lt;/span&gt;,\n    node_type=[&lt;span class=\"hljs-string\"&gt;\"table\"&lt;/span&gt;],\n    object_filter=&lt;span class=\"hljs-keyword\"&gt;lambda&lt;/span&gt; obj: obj.attributes.get(&lt;span class=\"hljs-string\"&gt;\"account\"&lt;/span&gt;) == &lt;span class=\"hljs-string\"&gt;\"dev\"&lt;/span&gt;,\n    attributes=[&lt;span class=\"hljs-string\"&gt;\"account\"&lt;/span&gt;],\n):\n    &lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;(table)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipbo
