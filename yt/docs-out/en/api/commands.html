        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section lists all the commands available in the YTsaurus system API and includes a full description of their options.&lt;/p&gt;\n&lt;h2 id=\"structure\"&gt;&lt;a href=\"en/api/commands.html#structure\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Structure&lt;/span&gt;&lt;/a&gt;Structure&lt;/h2&gt;\n&lt;p&gt;To put it simply, each command has the following structure:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Command name (string).&lt;/li&gt;\n&lt;li&gt;Description of the input and output formats (a &lt;a href=\"user-guide/storage/data-types.html#yson\"&gt;YSON string&lt;/a&gt; with attributes).&lt;/li&gt;\n&lt;li&gt;Parameters of executed action (a YSON structure).&lt;/li&gt;\n&lt;li&gt;Input and output data streams.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Each command also defines the type of its input and output data. Below all the possible options for the input and output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;No data (&lt;code&gt;null&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;The data is a &lt;code&gt;binary&lt;/code&gt; stream. For example, &lt;a href=\"user-guide/storage/files.html\"&gt;file&lt;/a&gt; contents.&lt;/li&gt;\n&lt;li&gt;The data is &lt;a href=\"user-guide/storage/formats.html#structured_data\"&gt;structured&lt;/a&gt; (&lt;code&gt;structured&lt;/code&gt;). For example, regular &lt;a href=\"user-guide/storage/cypress.html\"&gt;Cypress&lt;/a&gt; nodes.&lt;/li&gt;\n&lt;li&gt;The data is a &lt;code&gt;tabular&lt;/code&gt; stream. For example, &lt;a href=\"user-guide/storage/objects.html#tables\"&gt;table&lt;/a&gt; contents.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;In addition to that, each command can be:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Mutating or not (whether it changes anything in the metastate or not).&lt;/li&gt;\n&lt;li&gt;Light or heavy (light commands only transmit command parameters within a query, but heavy commands write or read the data stream).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"formats\"&gt;&lt;a href=\"en/api/commands.html#formats\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Formats&lt;/span&gt;&lt;/a&gt;Formats&lt;/h3&gt;\n&lt;p&gt;If your command works with structured or tabular data, you need to specify a &lt;a href=\"user-guide/storage/formats.html\"&gt;format&lt;/a&gt; for it. For the input stream, use the &lt;code&gt;input_format&lt;/code&gt; parameter, and for the output stream, use the &lt;code&gt;output_format&lt;/code&gt; parameter, respectively.&lt;/p&gt;\n&lt;p&gt;For structured data formats, &lt;code&gt;YSON&lt;/code&gt; (default) and &lt;code&gt;JSON&lt;/code&gt; formats are supported. For tabular data, there exist many &lt;a href=\"user-guide/storage/formats.html\"&gt;formats&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"retry\"&gt;&lt;a href=\"en/api/commands.html#retry\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Retries&lt;/span&gt;&lt;/a&gt;Retries&lt;/h3&gt;\n&lt;p&gt;A command retry is an option to repeat the query in the event of transient (intermittent) errors. It is expected that the response to a query retry would be indistinguishable from the response to the original query, as if there were no transient errors. It doesn't mean, however, that the response to a retry will be totally identical to the original query response (that is, only standard isolation is guaranteed).&lt;/p&gt;\n&lt;p&gt;Availability of retry options and the mechanism of retries depends on the command properties.&lt;/p&gt;\n&lt;h4 id=\"light\"&gt;&lt;a href=\"en/api/commands.html#light\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Light commands&lt;/span&gt;&lt;/a&gt;Light commands&lt;/h4&gt;\n&lt;p&gt;For non-mutating light commands, you can repeat the original query.&lt;/p&gt;\n&lt;p&gt;The mutating light commands change the system status. That's why you need to hint the system that such a query has already been made. To do this, before executing the command, generate the &lt;code&gt;mutation_id&lt;/code&gt; for the command. This is a standard GUID that consists of four 32-bit numbers in the HEX format separated by a dash (&lt;code&gt;-&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Specify the &lt;code&gt;mutation_id&lt;/code&gt; generated both in the parameters of both the original query and in the retries.  In addition, you need to add, to the original query, the &lt;code&gt;retry&lt;/code&gt; parameter with the value of &lt;code&gt;false&lt;/code&gt;. To the retried queries, add the &lt;code&gt;retry&lt;/code&gt; parameter with the value of &lt;code&gt;true&lt;/code&gt;. Some light mutating commands do not support retries (an example is &lt;code&gt;concatenate&lt;/code&gt;). If you need to retry such commands, you can use transactions.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;code&gt;mutation_id&lt;/code&gt; are usually kept for 5-10 minutes.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"hard\"&gt;&lt;a href=\"en/api/commands.html#hard\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Heavy commands&lt;/span&gt;&lt;/a&gt;Heavy commands&lt;/h4&gt;\n&lt;p&gt;You can't retry heavy commands However, you can implement a retry mechanism by using transactions.&lt;/p&gt;\n&lt;h2 id=\"transactions\"&gt;&lt;a href=\"en/api/commands.html#transactions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Transactions&lt;/span&gt;&lt;/a&gt;Transactions&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"user-guide/storage/transactions.html\"&gt;Transactions&lt;/a&gt; are an integral Cypress property. Many commands that interact with Cypress this way or another, are transactional. Each command or group of commands has a separate indication of whether it is transactional or not. Transactional commands support the following parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;em&gt;null-transaction-id&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Current transaction ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ping_ancestor_transactions&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to ping all the parent transactions while running the operation.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"other-query-parameters\"&gt;&lt;a href=\"en/api/commands.html#other-query-parameters\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Other query parameters&lt;/span&gt;&lt;/a&gt;Other query parameters&lt;/h2&gt;\n&lt;p&gt;You can also specify prerequisites for your queries. Moreover, for light non-mutating queries, you can also specify where to read the data from. For more information, see &lt;a href=\"api/query-parameters.html\"&gt;Query parameters&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"working-with-transactions\"&gt;&lt;a href=\"en/api/commands.html#working-with-transactions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with transactions&lt;/span&gt;&lt;/a&gt;Working with transactions&lt;/h2&gt;\n&lt;p&gt;For more information about transactions, see the &lt;a href=\"user-guide/storage/transactions.html\"&gt;Transactions&lt;/a&gt; article.&lt;/p&gt;\n&lt;h3 id=\"start_tx\"&gt;&lt;a href=\"en/api/commands.html#start_tx\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;start_tx&lt;/span&gt;&lt;/a&gt;start_tx&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Begin a new transaction in the context of the current transaction.&lt;/li&gt;\n&lt;li&gt;The new transaction is a nested (internal) transaction for the given one.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;em&gt;null-transaction-id&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;ID of the current transaction (it will become a parent transaction for the transaction created by the command).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ping_ancestor_transactions&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to ping, when running the operation, all the parent transactions (to extend their TTL).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;15000&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Transaction TTL since the last extension (in ms).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;deadline&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;missing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Transaction execution deadline (in UTC).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;missing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Enables you to set attributes for the created transaction.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;master&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Enables you to set the transaction type: &lt;code&gt;master&lt;/code&gt; or &lt;code&gt;tablet&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: ID of the new transaction.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"transaction_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"0-54b-1-36223d20\"&lt;/span&gt; }\nOUTPUT &lt;span class=\"hljs-string\"&gt;\"0-54c-1-bb49086d\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"339\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-339\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-339\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-339.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"ping_tx\"&gt;&lt;a href=\"en/api/commands.html#ping_tx\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ping_tx&lt;/span&gt;&lt;/a&gt;ping_tx&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Update the transaction.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Detailed description.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;ping_tx&lt;/code&gt; pings the transaction on the server (including all the parent transactions if &lt;code&gt;ping_ancestors&lt;/code&gt;is specified). This way you can extend the TTL for the transaction.&lt;/li&gt;\n&lt;li&gt;If the transaction started at the time &lt;code&gt;s&lt;/code&gt; with the timeout (TTL) of &lt;code&gt;t&lt;/code&gt;, then the transaction will complete at &lt;code&gt;s+t&lt;/code&gt; by default.&lt;/li&gt;\n&lt;li&gt;If you ping the transaction at the time &lt;code&gt;r&lt;/code&gt; (&lt;code&gt;s &amp;lt; r &amp;lt; s + t&lt;/code&gt;), it will be extended until &lt;code&gt;r + t&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Parent transaction ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ping_ancestor_transactions&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to ping all the parent transactions while running the operation.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"transaction_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"0-54b-1-36223d20\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"450\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-450\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-450\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-450.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"commit_tx\"&gt;&lt;a href=\"en/api/commands.html#commit_tx\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;commit_tx&lt;/span&gt;&lt;/a&gt;commit_tx&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Complete the transaction successfully.&lt;/li&gt;\n&lt;li&gt;While there are some incompleted internal transactions, the outer transaction can't complete.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Transaction ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ping_ancestor_transactions&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to ping all the parent transactions while running the operation.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"transaction_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"0-54b-1-36223d20\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"546\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-546\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-546\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-546.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"abort_tx\"&gt;&lt;a href=\"en/api/commands.html#abort_tx\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;abort_tx&lt;/span&gt;&lt;/a&gt;abort_tx&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Abort the transaction.&lt;/li&gt;\n&lt;li&gt;All the active internal transactions are aborted as well.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Transaction ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ping_ancestor_transactions&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to ping all the parent transactions while running the operation.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Forcibly aborts the transaction even if this may result in consistency loss (in case of a tablet transaction and a &lt;a href=\"https://en.wikipedia.org/wiki/Two-phase_commit_protocol\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;two-phase commit&lt;/a&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"transaction_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"0-54b-1-36223d20\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"656\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-656\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-656\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-656.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"working-with-cypress\"&gt;&lt;a href=\"en/api/commands.html#working-with-cypress\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with Cypress&lt;/span&gt;&lt;/a&gt;Working with Cypress&lt;/h2&gt;\n&lt;p&gt;For more information about the metainformation tree, see &lt;a href=\"user-guide/storage/cypress.html\"&gt;Cypress&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;All the commands used to work with Cypress are transactional.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"create\"&gt;&lt;a href=\"en/api/commands.html#create\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;create&lt;/span&gt;&lt;/a&gt;create&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Create a node of a specified type in Cypress.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the node in Cypress. At default settings, the &lt;em&gt;path&lt;/em&gt; should not exist.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/objects.html\"&gt;Node type&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;recursive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to create intermediate nodes recursively.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;{}&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Enables you to set attributes for the created node.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ignore_existing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;If the created node exists already, it is not recreated. In particular, the transmitted attributes are ignored. Moreover, both the existing and created nodes must have the same type, otherwise the query will return an error.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;lock_existing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Set an &lt;a href=\"user-guide/storage/transactions.html#locks\"&gt;exclusive lock&lt;/a&gt; on the specified node even if it already exists. This parameter is only used together with &lt;code&gt;ignore_existing&lt;/code&gt;. If the lock couldn't be set, the command fails.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;If the specified node already exists, it is deleted and replaced with a new one. In this situation, the existing node can be of any type. When the node is recreated, its ID changes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: ID of the created node.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Examples:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt; ; &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"table\"&lt;/span&gt; }\nOUTPUT &lt;span class=\"hljs-string\"&gt;\"0-4-191-6c07cd58\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"838\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-838\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-838\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-838.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"user\"&lt;/span&gt; ; attributes = { name = &lt;span class=\"hljs-string\"&gt;'kulichek-robot'&lt;/span&gt; } }\nOUTPUT &lt;span class=\"hljs-string\"&gt;\"7727-417b1-1f5-d4f116ca\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"839\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-839\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-839\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-839.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/document\"&lt;/span&gt; ; &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"document\"&lt;/span&gt; ; attributes = { value = {} } }\nOUTPUT &lt;span class=\"hljs-string\"&gt;\"7727-417b1-1f5-d4f116ca\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"840\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-840\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-840\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-840.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"remove\"&gt;&lt;a href=\"en/api/commands.html#remove\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;remove&lt;/span&gt;&lt;/a&gt;remove&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Delete the Cypress node.&lt;/li&gt;\n&lt;li&gt;Deletes the node successfully, even if a non-empty subtree is growing from it.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the node in Cypress. The path &lt;em&gt;must&lt;/em&gt; exist.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;recursive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Enables you to delete the entire subtree in the case when the deleted node is a composite type.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Enables you to treat the command as successfully executed if the deleted node is missing.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"950\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-950\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-950\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-950.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"set\"&gt;&lt;a href=\"en/api/commands.html#set\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;set&lt;/span&gt;&lt;/a&gt;set&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Write new content into the Cypress node.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the node in Cypress. If &lt;code&gt;recursive == false&lt;/code&gt;, then the path &lt;em&gt;must&lt;/em&gt; exist (except, probably, the last token).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;recursive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Create all non-existent intermediate nodes on the path.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Enables you to modify any Cypress node instead of only attributes and documents.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: Node content.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/node\"&lt;/span&gt; }\nINPUT {\n    &lt;span class=\"hljs-string\"&gt;\"my_integer\"&lt;/span&gt; = 4 ;\n    &lt;span class=\"hljs-string\"&gt;\"my_double\"&lt;/span&gt; = 2.718281828 ;\n    &lt;span class=\"hljs-string\"&gt;\"map\"&lt;/span&gt; = { &lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt; = 1 ; &lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt; = 2 } ;\n    &lt;span class=\"hljs-string\"&gt;\"list\"&lt;/span&gt; = [ 1, 2, 3 ]\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1060\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1060\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1060\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1060.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"multiset_attributes\"&gt;&lt;a href=\"en/api/commands.html#multiset_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;multiset_attributes&lt;/span&gt;&lt;/a&gt;multiset_attributes&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Set several attributes at the specified path (if the attributes exist already, they are overwritten).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to attributes of a node in Cypress. The path &lt;em&gt;must&lt;/em&gt; exist.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: A map node that contains new attribute values.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/node/@\"&lt;/span&gt; }\nINPUT {\n    &lt;span class=\"hljs-string\"&gt;\"attribute1\"&lt;/span&gt; = 4 ;\n    &lt;span class=\"hljs-string\"&gt;\"attribute2\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"attribute2 value\"&lt;/span&gt;;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1142\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1142\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1142\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1142.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"get\"&gt;&lt;a href=\"en/api/commands.html#get\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;get&lt;/span&gt;&lt;/a&gt;get&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Non-mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Get the content of the Cypress node.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the node in Cypress. The path &lt;em&gt;must&lt;/em&gt; exist.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;[]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A list of attributes that need to be obtained along with each node.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;max_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;missing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Sets a limit on the number of children that will be issued in the case of virtual composite nodes (for regular map nodes, this option doesn't make sense).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ignore_opaque&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ignore the &lt;code&gt;opaque&lt;/code&gt; attribute when executing a query (never use this option without explicit advice from YTsaurus developers).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: Node content.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/node\"&lt;/span&gt; }\nOUTPUT {\n    &lt;span class=\"hljs-string\"&gt;\"my_integer\"&lt;/span&gt; = 4 ;\n    &lt;span class=\"hljs-string\"&gt;\"my_double\"&lt;/span&gt; = 2.718281828 ;\n    &lt;span class=\"hljs-string\"&gt;\"map\"&lt;/span&gt; = { &lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt; = 1 ; &lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt; = 2 } ;\n    &lt;span class=\"hljs-string\"&gt;\"list\"&lt;/span&gt; = [ 1, 2, 3 ]\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1266\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1266\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1266\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1266.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"list\"&gt;&lt;a href=\"en/api/commands.html#list\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;list&lt;/span&gt;&lt;/a&gt;list&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Non-mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Get a list of descendants for the Cypress node.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the node in Cypress. The path &lt;em&gt;must&lt;/em&gt; exist.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;[]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A list of attributes that need to be obtained along with each node.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;max_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;missing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Limits the number of descendants output.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;structured&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Value: A list of the node's descendants.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/node\"&lt;/span&gt; }\nOUTPUT [\n    &lt;span class=\"hljs-string\"&gt;\"home\"&lt;/span&gt; ;\n    &lt;span class=\"hljs-string\"&gt;\"sys\"&lt;/span&gt; ;\n    &lt;span class=\"hljs-string\"&gt;\"statbox\"&lt;/span&gt; ;\n    &lt;span class=\"hljs-string\"&gt;\"tmp\"&lt;/span&gt;\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1376\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1376\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1376\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1376.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"lock\"&gt;&lt;a href=\"en/api/commands.html#lock\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;lock&lt;/span&gt;&lt;/a&gt;lock&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Set a lock on the Cypress node.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the node in Cypress. The path &lt;em&gt;must&lt;/em&gt; exist.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;mode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;exclusive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Lock type (snapshot, shared, exclusive).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;waitable&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;In case of a conflict, it's doesn't fail but is enqueued. You can find out whether the lock was actually set using the &lt;code&gt;state&lt;/code&gt; attribute of the lock object. See &lt;a href=\"user-guide/storage/transactions.html#locking_queue\"&gt;Transactions&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;child_key&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;The key in the dictionary on which the lock is taken (for the &lt;code&gt;shared&lt;/code&gt; type only).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;attribute_key&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;The name of the attribute on which the lock is taken (for the &lt;code&gt;shared&lt;/code&gt; type only).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Be sure to specify the transaction ID for this command.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: ID of the created lock and ID of the branched node.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/node\"&lt;/span&gt; }\nOUTPUT {\nOUTPUT   &lt;span class=\"hljs-string\"&gt;\"lock_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"0-1-3fe00c8-353e9ba4\"&lt;/span&gt;;\nOUTPUT   &lt;span class=\"hljs-string\"&gt;\"node_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"0-1-3fe012f-9ad48d90\"&lt;/span&gt;;\nOUTPUT }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1524\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1524\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1524\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1524.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"unlock\"&gt;&lt;a href=\"en/api/commands.html#unlock\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;unlock&lt;/span&gt;&lt;/a&gt;unlock&lt;/h3&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Locks are automatically removed at the end of the transaction. Do not use the &lt;code&gt;unlock&lt;/code&gt; command unless absolutely needed. See &lt;a href=\"user-guide/storage/transactions.html#lock_operations\"&gt;Transactions&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Release all the locks set for the selected transaction on the Cypress node.&lt;/li&gt;\n&lt;li&gt;You can only release explicit locks.&lt;/li&gt;\n&lt;li&gt;This command releases both already taken and enqueued locks.&lt;/li&gt;\n&lt;li&gt;If the node is not locked, the command is considered successful.&lt;/li&gt;\n&lt;li&gt;If the locked node version includes any changes compared to the original version, the unlock fails.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the node in Cypress. The path &lt;em&gt;must&lt;/em&gt; exist.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Be sure to specify the transaction ID for this command.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/node\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1641\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1641\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1641\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1641.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"copy\"&gt;&lt;a href=\"en/api/commands.html#copy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;copy&lt;/span&gt;&lt;/a&gt;copy&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Copy the Cypress node to the new address.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;source_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the source node in Cypress. The path &lt;em&gt;must&lt;/em&gt; exist.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;destination_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path where the copy will be created. The path &lt;em&gt;must not&lt;/em&gt; exist.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;recursive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to create the skipped levels (map nodes) at the destination path.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ignore_existing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;If the node already exists at &lt;code&gt;destination_path&lt;/code&gt;, do nothing  (you can't use this parameter together with &lt;code&gt;force = %true&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;lock_existing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Set an &lt;a href=\"user-guide/storage/transactions.html#locks\"&gt;exclusive lock&lt;/a&gt; on the node at &lt;code&gt;destination_path&lt;/code&gt;, even if it already exists. This parameter is only used together with &lt;code&gt;ignore_existing&lt;/code&gt;. If the command fails to set a lock, it returns an error.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Allows you to specify an existing node to be replaced, as the destination path.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;preserve_account&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to keep the accounts of the source nodes or use the account at the destination path.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;preserve_expiration_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to copy the &lt;a href=\"user-guide/storage/cypress.html#TTL\"&gt;&lt;code&gt;expiration_time&lt;/code&gt;&lt;/a&gt; attribute or leave it empty.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;preserve_expiration_timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to copy the &lt;a href=\"user-guide/storage/cypress.html#TTL\"&gt;&lt;code&gt;expiration_timeout&lt;/code&gt;&lt;/a&gt; attribute or leave it empty.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: ID of the created node.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARA lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;source_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the source node in Cypress. The path &lt;em&gt;must&lt;/em&gt; exist.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;destination_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;A new path in Cypress. The path &lt;em&gt;must not&lt;/em&gt; exist.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;recursive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to create the skipped levels (map nodes) at the destination path.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Allows you to specify an existing node to be replaced, as the destination path.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;preserve_account&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to keep the accounts of the source nodes or use the account at the destination path.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;preserve_expiration_timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to copy the &lt;a href=\"user-guide/storage/cypress.html#TTL\"&gt;&lt;code&gt;expiration_timeout&lt;/code&gt;&lt;/a&gt; attribute or leave it empty.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"source_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/from\"&lt;/span&gt; ;\n    &lt;span class=\"hljs-string\"&gt;\"destination_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/to\"&lt;/span&gt; ;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1982\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1982\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1982\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1982.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"link\"&gt;&lt;a href=\"en/api/commands.html#link\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;link&lt;/span&gt;&lt;/a&gt;link&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Create a symbolic link to the object at the new path.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;link_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path where the link will be created. The path &lt;em&gt;must not&lt;/em&gt; exist.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;target_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the source node in Cypress. The path &lt;em&gt;must&lt;/em&gt; exist.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;missing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Attributes of the node created as a result of the command.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;recursive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to create intermediate nodes recursively.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ignore_existing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Enables you to avoids operation failure if the node already exists and is a link. The call will return an error if the node exists but is not a link.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;lock_existing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Set an exclusive lock on the specified node even if it already exists. It's only used together with the &lt;code&gt;ignore_existing&lt;/code&gt; parameter.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Recreate the link if the path where the link is created already exists.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: ID of the created node.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"target_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/from\"&lt;/span&gt; ;\n    &lt;span class=\"hljs-string\"&gt;\"link_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/to\"&lt;/span&gt; ;\n}\nOUTPUT &lt;span class=\"hljs-string\"&gt;\"0-4-191-6c07cd58\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2148\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2148\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2148\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2148.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"exists\"&gt;&lt;a href=\"en/api/commands.html#exists\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;exists&lt;/span&gt;&lt;/a&gt;exists&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Non-mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Checks what are the node exists.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the source node in Cypress.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: &lt;code&gt;true&lt;/code&gt; or &lt;code&gt;false&lt;/code&gt; string.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/my_table/@_format\"&lt;/span&gt; ;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2230\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2230\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2230\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2230.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"concatenate\"&gt;&lt;a href=\"en/api/commands.html#concatenate\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;concatenate&lt;/span&gt;&lt;/a&gt;concatenate&lt;/h3&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Merge the set of files or tables (in the order in which their paths are listed).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;em&gt;null-transaction-id&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Current transaction ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ping_ancestor_transactions&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to ping all the parent transactions while running the operation.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;source_paths&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;The list of paths to input files or tables in Cypress. The paths &lt;em&gt;must&lt;/em&gt; exist and all items at the paths should either be files or tables.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;destination_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to a file or table in Cypress. The path &lt;em&gt;must&lt;/em&gt; exist.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"source_paths\"&lt;/span&gt; = [&lt;span class=\"hljs-string\"&gt;\"//tmp/file1\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"//tmp/file2\"&lt;/span&gt;];\n    &lt;span class=\"hljs-string\"&gt;\"destination_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/file\"&lt;/span&gt;;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2346\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2346\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2346\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2346.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"access-control\"&gt;&lt;a href=\"en/api/commands.html#access-control\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Access control&lt;/span&gt;&lt;/a&gt;Access control&lt;/h2&gt;\n&lt;p&gt;For more information about access permissions, see &lt;a href=\"user-guide/storage/access-control.html\"&gt;Access control&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;This set of commands is not transactional.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"add_member\"&gt;&lt;a href=\"en/api/commands.html#add_member\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;add_member&lt;/span&gt;&lt;/a&gt;add_member&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Add to a group a user or another group.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;member&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;The name of the user or group that needs to be added to the group.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;group&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;The name of the group into which you are adding a user or another group.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"group\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"admins\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"member\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"devs\"&lt;/span&gt;;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2453\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2453\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2453\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2453.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"remove_member\"&gt;&lt;a href=\"en/api/commands.html#remove_memb
