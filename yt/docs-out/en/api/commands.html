/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Operation ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"operation_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"33ab3f-bf1df917-b35fe9ed-c70a4bf4\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"7893\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-7893\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-7893\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-7893.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"suspend_operation\"&gt;&lt;a href=\"en/api/commands.html#suspend_operation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;suspend_operation&lt;/span&gt;&lt;/a&gt;suspend_operation&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Suspend the operation.&lt;/li&gt;\n&lt;li&gt;This command is executed instantly. After that, no more jobs are started for the operation, and the running jobs are optionally aborted.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Operation ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;abort_running_jobs&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to abort the running operation jobs.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"operation_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"33ab3f-bf1df917-b35fe9ed-c70a4bf4\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"7989\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-7989\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-7989\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-7989.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"resume_operation\"&gt;&lt;a href=\"en/api/commands.html#resume_operation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;resume_operation&lt;/span&gt;&lt;/a&gt;resume_operation&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Resume the suspended operation.&lt;/li&gt;\n&lt;li&gt;This command is executed instantly.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Operation ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"operation_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"33ab3f-bf1df917-b35fe9ed-c70a4bf4\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"8071\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-8071\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-8071\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-8071.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"update_operation_parameters\"&gt;&lt;a href=\"en/api/commands.html#update_operation_parameters\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;update_operation_parameters&lt;/span&gt;&lt;/a&gt;update_operation_parameters&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Update the parameters of a running operation.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Operation ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parameters&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Dictionary with the operation parameters.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;parameters[owners]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;(deprecated, will be removed) List of new owners of the operation.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;parameters[acl]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;New ACL of the operation (it overlaps the base ACL).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;parameters[pool]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Name of the pool to which the operation has to be switched over in all its trees.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;parameters[weight]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;New weight of the operation in all the trees.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;parameters[scheduling_options_per_pool_tree]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Dictionary &lt;code&gt;{tree name: scheduler settings for this tree}&lt;/code&gt;. The settings are described below. To learn more about the scheduler, see &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;Scheduler and pools&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;parameters[options_per_job_shell]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Dictionary &lt;code&gt;{Job Shell name: settings for this Job Shell}&lt;/code&gt;. The settings are described below.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Scheduler settings for the tree:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;weight&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Weight of the operation in the tree.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;pool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Pool of the operation in the tree.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;resource_limits&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Dictionary &lt;code&gt;{ resource name: limit}&lt;/code&gt;. Resource limits in the tree.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Job Shell settings:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;owners&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Subjects (users or groups) who will have access to the Job Shell.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {&lt;span class=\"hljs-string\"&gt;\"operation_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"33ab3f-bf1df917-b35fe9ed-c70a4bf4\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"parameters\"&lt;/span&gt; = {&lt;span class=\"hljs-string\"&gt;\"pool\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"username\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"scheduling_options_per_pool_tree\"&lt;/span&gt; = {&lt;span class=\"hljs-string\"&gt;\"default\"&lt;/span&gt; = {&lt;span class=\"hljs-string\"&gt;\"weight\"&lt;/span&gt; = 2; &lt;span class=\"hljs-string\"&gt;\"resource_limits\"&lt;/span&gt; = { &lt;span class=\"hljs-string\"&gt;\"user_slots\"&lt;/span&gt; = 1; &lt;span class=\"hljs-string\"&gt;\"cpu\"&lt;/span&gt; = 0.5; &lt;span class=\"hljs-string\"&gt;\"network\"&lt;/span&gt; = 10; &lt;span class=\"hljs-string\"&gt;\"memory\"&lt;/span&gt; = 1000000000}}}}}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"8348\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-8348\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-8348\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-8348.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"working-with-jobs\"&gt;&lt;a href=\"en/api/commands.html#working-with-jobs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with jobs&lt;/span&gt;&lt;/a&gt;Working with jobs&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;All the commands used to work with jobs are non-&lt;a href=\"en/api/commands.html#transactions\"&gt;transactional&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;The table describes the &lt;code&gt;TJob&lt;/code&gt; type, which contains information about the job returned by the &lt;code&gt;get_job&lt;/code&gt; and &lt;code&gt;list_jobs&lt;/code&gt; commands:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Field&lt;/th&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_id&lt;/code&gt;/&lt;code&gt;id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;String representation of the job ID (for example, &lt;code&gt;d6bf44e17-8c200aed-41103e8-4958aff3&lt;/code&gt;). The field name depends on the command: &lt;code&gt;job_id&lt;/code&gt; for &lt;code&gt;get_job&lt;/code&gt; and &lt;code&gt;id&lt;/code&gt; for &lt;code&gt;list_jobs&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;String representation of the operation ID (for example, &lt;code&gt;2cb654e4-9ab04944-4110384-100d7ed&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;allocation_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;String representation of the ID of the allocation used to execute the job (for example, &lt;code&gt;2cb654e4-9ab04944-4110384-d7ed&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Job type (for example, &lt;code&gt;vanilla&lt;/code&gt;, &lt;code&gt;map&lt;/code&gt;, &lt;code&gt;partition_reduce&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;state&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Current job state (for example, &lt;code&gt;running&lt;/code&gt;, &lt;code&gt;failed&lt;/code&gt;, &lt;code&gt;completed&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;controller_state&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Job state according to the controller.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;archive_state&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Job state according to the node.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;address&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Address of the exec node (host:port) that ran the job. If the node has multiple addresses, the value matches the default address.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;addresses&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Map containing the addresses of the exec node that ran the job. Used when the exec node can have multiple addresses.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;task_name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Name of the task the job belonged to.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;start_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ISO 8601 string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Job start time.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;finish_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ISO 8601 string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Job end time.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;has_spec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Flag indicating whether the job specification was archived.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;has_competitors&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Flag indicating whether the job is speculative or has speculative competitors.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;has_probing_competitors&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Flag indicating whether the job is a probe or has probe competitors.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_competition_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;For speculative jobs, matches the ID of the competitor job.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;probing_job_competition_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;For probes, matches the ID of the competitor job.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;pool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Name of the &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;pool&lt;/a&gt; where the job was run.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;pool_tree&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Name of the &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;pool tree&lt;/a&gt; where the job was run.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;progress&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;float in [0,1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Evaluation of the share of work executed by the job by the current moment.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;stderr_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Size of the saved stderr of the job (you can get stderr using the &lt;a href=\"en/api/commands.html#get_job_stderr\"&gt;&lt;code&gt;get_job_stderr&lt;/code&gt;&lt;/a&gt; command).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;fail_context_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Size of the saved fail_context of the job (you can get fail_context using the &lt;a href=\"en/api/commands.html#get_fail_context\"&gt;&lt;code&gt;get_fail_context&lt;/code&gt;&lt;/a&gt; command).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;error&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Error that interrupted the job.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;statistics&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Job statistics.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;brief_statistics&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Summarized job statistics.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;exec_attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Metainformation about the job's initiation on the exec node.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;monitoring_descriptor&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;ID used by the monitoring system to store information about the job.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_cookie&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Unique job index within the operation that serves as an implementation detail of the operation controller. In vanilla operations, it can be used to group workers: if a job is interrupted, the new job launched to replace it will have the same &lt;code&gt;job_cookie&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_incarnation&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;ID of the gang operation incarnation.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;interruption_info&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Information about the reasons for the job's interruption.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;archive_features&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Information about the job's archived attributes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;core_infos&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;List of metainformation about the job's saved core dumps.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;events&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;List of job state transition events.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;is_stale&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether the information about the job is outdated (if &lt;code&gt;%true&lt;/code&gt;, some fields might need update). Information about the job is considered outdated if it hasn't been updated for a long time. The information in the job archive is updated by the node running the job and the operation controller. The update process is asynchronous. If the node and the controller restart at the same time for some reason (for example, as a result of an update), the information about the final job state (&lt;code&gt;completed&lt;/code&gt;, &lt;code&gt;failed&lt;/code&gt;, or &lt;code&gt;aborted&lt;/code&gt;) might not end up in the archive, resulting in this job always returning as stale. Despite the &lt;code&gt;running&lt;/code&gt; status, such jobs likely haven't been running for a long time and should be ignored.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"get_job\"&gt;&lt;a href=\"en/api/commands.html#get_job\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;get_job&lt;/span&gt;&lt;/a&gt;get_job&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Non-mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Getting information about a job. The command can run both for running and completed jobs (if information about the jobs was saved).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;GUID&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Operation ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;GUID&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Job ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;List of job attributes that need to be returned in the response.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;The &lt;code&gt;attributes&lt;/code&gt; parameter is a subset of &lt;code&gt;TJob&lt;/code&gt; objects. If it's &lt;code&gt;Null&lt;/code&gt;, all job attributes are returned; otherwise, the user receives only the attributes specified in &lt;code&gt;attributes&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Job description (&lt;code&gt;TJob&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"operation_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"e13c5406-e5dd6f5d-3fe03e8-fe05f0d3\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"job_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"f11ae559-a0375703-3fe0384-8f1\"&lt;/span&gt;}\nOUTPUT {\n      &lt;span class=\"hljs-string\"&gt;\"operation_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"e13c5406-e5dd6f5d-3fe03e8-fe05f0d3\"&lt;/span&gt;;\n      &lt;span class=\"hljs-string\"&gt;\"job_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"f11ae559-a0375703-3fe0384-8f1\"&lt;/span&gt;;\n      &lt;span class=\"hljs-string\"&gt;\"state\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"completed\"&lt;/span&gt;;\n      &lt;span class=\"hljs-string\"&gt;\"start_time\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"2018-02-06T09:37:02.858492Z\"&lt;/span&gt;;\n      &lt;span class=\"hljs-string\"&gt;\"finish_time\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"2018-02-06T09:42:19.185525Z\"&lt;/span&gt;;\n      &lt;span class=\"hljs-string\"&gt;\"address\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"hostname.net:9012\"&lt;/span&gt;;\n      &lt;span class=\"hljs-string\"&gt;\"statistics\"&lt;/span&gt; = {\n          &lt;span class=\"hljs-string\"&gt;\"data\"&lt;/span&gt; = {\n               ...\n          };\n      };\n      &lt;span class=\"hljs-string\"&gt;\"events\"&lt;/span&gt; = [\n          ...\n      ];\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"8880\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-8880\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-8880\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-8880.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"list_jobs\"&gt;&lt;a href=\"en/api/commands.html#list_jobs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;list_jobs&lt;/span&gt;&lt;/a&gt;list_jobs&lt;/h3&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;This command can create significant load on the cluster. Do not use it in your workflow without a prior approval by the administrator.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Command properties: &lt;strong&gt;Non-mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Get all the jobs that match the filters for a given operation.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;GUID&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Operation ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type (job_type)&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;EJobType&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;When you specify the parameter, the response will only include the jobs with the specified &lt;code&gt;job_type&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;state (job_state)&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;EJobState&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;When you specify the parameter, the response will only include the jobs with the specified &lt;code&gt;job_state&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;address&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;If this parameter is specified, the response will only include the jobs with an address that starts with &lt;code&gt;address&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;with_stderr&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;At &lt;code&gt;Null&lt;/code&gt;, all the jobs are returned. At &lt;code&gt;True&lt;/code&gt;, only the jobs with a non-null &lt;code&gt;stderr&lt;/code&gt; are returned. At &lt;code&gt;False&lt;/code&gt;, only the jobs with a null &lt;code&gt;stderr&lt;/code&gt; are returned.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;with_fail_context&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;At &lt;code&gt;Null&lt;/code&gt;, all the jobs are returned. At &lt;code&gt;True&lt;/code&gt;, only the jobs that have a saved &lt;code&gt;fail_context&lt;/code&gt; are returned. At &lt;code&gt;False&lt;/code&gt;, only the jobs that do not have &lt;code&gt;fail_context&lt;/code&gt; are returned.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;with_spec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;At &lt;code&gt;Null&lt;/code&gt;, all the jobs are returned. At &lt;code&gt;True&lt;/code&gt;, only the jobs that have a saved specification are returned. At &lt;code&gt;False&lt;/code&gt;, only the jobs that do not have a specification are returned.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;with_competitors&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;At &lt;code&gt;Null&lt;/code&gt;, all the jobs are returned. At &lt;code&gt;True&lt;/code&gt;, only the jobs for which speculative copies were run along with those copies are returned. At &lt;code&gt;False&lt;/code&gt;, only the jobs that do not have speculative copies are returned.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_competition_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;GUID&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;When you specify the parameter, the response will include the job with the &lt;code&gt;job_competition_id&lt;/code&gt; and all of its speculative copies (if any).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;with_monitoring_descriptor&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;At &lt;code&gt;Null&lt;/code&gt;, all the jobs are returned. At &lt;code&gt;True&lt;/code&gt;, only the jobs that have &lt;code&gt;monitoring_descriptor&lt;/code&gt; are returned. At &lt;code&gt;False&lt;/code&gt;, only the jobs that do not have &lt;code&gt;monitoring_descriptor&lt;/code&gt; are returned.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;with_interruption_info&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;At &lt;code&gt;Null&lt;/code&gt;, all the jobs are returned. At &lt;code&gt;True&lt;/code&gt;, only the jobs that have &lt;code&gt;interruption_info&lt;/code&gt; are returned. At &lt;code&gt;False&lt;/code&gt;, only the jobs that do not have &lt;code&gt;interruption_info&lt;/code&gt; are returned.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;task_name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;When you specify the parameter, the response will only include the jobs with the specified &lt;code&gt;task_name&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_incarnation&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;When you specify the parameter, the response will only include the jobs belonging to the requested incarnation.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ISO 8601 string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Bottom limit for the time interval for operation selection (based on the time when the operation began).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;to_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ISO 8601 string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Upper limit for the time interval for operation selection (based on the time when the operation began for running jobs and based on the time the operation ended for completed jobs).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;continuation_token&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;String used for pagination (see below).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;sort_field&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;{none,type,state,start_time,finish_time,address,duration,progress,id}&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;none&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Sort fields.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;sort_order&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;{ascending,descending}&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ascending&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Sorting order.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;1000&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Limit on the number of returned jobs.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;offset&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Offset by the given number of jobs.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;List of job attributes that need to be returned in the response.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;The &lt;code&gt;job_type&lt;/code&gt;, &lt;code&gt;job_state&lt;/code&gt;, &lt;code&gt;address&lt;/code&gt;, &lt;code&gt;with_stderr&lt;/code&gt;, &lt;code&gt;with_fail_context&lt;/code&gt;, &lt;code&gt;with_competitors&lt;/code&gt;, &lt;code&gt;with_spec&lt;/code&gt;, &lt;code&gt;with_monitoring_descriptor&lt;/code&gt;, and &lt;code&gt;with_interruption_info&lt;/code&gt; parameters define the job &lt;em&gt;filter&lt;/em&gt;. The response will only include the jobs that meet the filtering criteria.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;sort_field&lt;/code&gt; and&lt;code&gt;sort_order&lt;/code&gt; define the order of jobs in the response. In this case, the &lt;code&gt;limit&lt;/code&gt; and &lt;code&gt;offset&lt;/code&gt; parameters define the slice (subset) of jobs in the response: the first &lt;code&gt;offset&lt;/code&gt; jobs are skipped, and then &lt;code&gt;limit&lt;/code&gt; of the remaining jobs is selected.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;attributes&lt;/code&gt; parameter is a list of &lt;code&gt;TJob&lt;/code&gt; objects. If it's &lt;code&gt;Null&lt;/code&gt;, default attributes are returned; otherwise, the user receives only the attributes specified in &lt;code&gt;attributes&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;jobs&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&amp;lt;TJob&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;List of jobs.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;controller_agent_job_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Number of jobs in the response that the operation controller stores information about.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;archive_job_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Number of jobs in the response that the archive stores information about.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type_counts&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&amp;lt;string, int&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Map indicating the number of jobs of various types that match all specified filters (except the filter by type).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;state_counts&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&amp;lt;string, int&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Map indicating the number of jobs with various states that match all specified filters (except the filter by state).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;errors&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&amp;lt;map&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;List of errors.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;continuation_token&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;String used for pagination. It encodes the request parameters along with the index from which the job list should continue. You can pass it in the &lt;code&gt;continuation_token&lt;/code&gt; parameter.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"operation_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"4505e8eb-28fa88e2-3fe03e8-c6fcd8fa\"&lt;/span&gt;; }\nOUTPUT {\n      &lt;span class=\"hljs-string\"&gt;\"jobs\"&lt;/span&gt; = [\n          {\n              &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"55aff293-7ef14284-3fe0384-3e07\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"map\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"state\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"failed\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"address\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"hostname.net:9012\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"start_time\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"2018-05-05T00:41:27.433832Z\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"finish_time\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"2018-05-05T00:49:04.288196Z\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"fail_context_size\"&lt;/span&gt; = 973230u;\n              &lt;span class=\"hljs-string\"&gt;\"error\"&lt;/span&gt; = {\n                  &lt;span class=\"hljs-string\"&gt;\"code\"&lt;/span&gt; = 1205;\n                  &lt;span class=\"hljs-string\"&gt;\"message\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"User job failed\"&lt;/span&gt;;\n                  ...\n              };\n              ...\n          };\n          ...\n          {\n              &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"69ae20a7-887b25ab-3fe0384-3cff\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"map\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"state\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"running\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"address\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"hostname.net:9012\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"start_time\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"2018-05-07T13:04:03.339873Z\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"progress\"&lt;/span&gt; = 0.;\n              &lt;span class=\"hljs-string\"&gt;\"brief_statistics\"&lt;/span&gt; = &amp;lt;\n                  &lt;span class=\"hljs-string\"&gt;\"timestamp\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"2018-05-07T13:04:08.431740Z\"&lt;/span&gt;;\n              &amp;gt; {\n                  &lt;span class=\"hljs-string\"&gt;\"processed_input_compressed_data_size\"&lt;/span&gt; = 0;\n                  &lt;span class=\"hljs-string\"&gt;\"processed_input_data_weight\"&lt;/span&gt; = 0;\n                  &lt;span class=\"hljs-string\"&gt;\"processed_output_uncompressed_data_size\"&lt;/span&gt; = 0;\n                  &lt;span class=\"hljs-string\"&gt;\"processed_output_compressed_data_size\"&lt;/span&gt; = 0;\n                  &lt;span class=\"hljs-string\"&gt;\"processed_input_uncompressed_data_size\"&lt;/span&gt; = 0;\n                  &lt;span class=\"hljs-string\"&gt;\"processed_input_row_count\"&lt;/span&gt; = 0;\n              };\n          };\n      ];\n      &lt;span class=\"hljs-string\"&gt;\"cypress_job_count\"&lt;/span&gt; = 200;\n      &lt;span class=\"hljs-string\"&gt;\"scheduler_job_count\"&lt;/span&gt; = 208;\n      &lt;span class=\"hljs-string\"&gt;\"archive_job_count\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n      &lt;span class=\"hljs-string\"&gt;\"type_counts\"&lt;/span&gt; = {\n          &lt;span class=\"hljs-string\"&gt;\"map\"&lt;/span&gt; = 408;\n      };\n      &lt;span class=\"hljs-string\"&gt;\"state_counts\"&lt;/span&gt; = {\n          &lt;span class=\"hljs-string\"&gt;\"running\"&lt;/span&gt; = 208;\n          &lt;span class=\"hljs-string\"&gt;\"failed\"&lt;/span&gt; = 200;\n      };\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"9416\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-9416\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-9416\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-9416.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"abandon_job\"&gt;&lt;a href=\"en/api/commands.html#abandon_job\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;abandon_job&lt;/span&gt;&lt;/a&gt;abandon _id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Operation ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Job ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;binary&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: &lt;code&gt;Fail context&lt;/code&gt; of the job.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"operation_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"33ab3f-bf1df917-b35fe9ed-c70a4bf4\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"job_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"1225d-1f2fb8c4-f1075d39-5fb7cdff\"&lt;/span&gt;}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"9853\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-9853\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-9853\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-9853.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"get_job_stderr\"&gt;&lt;a href=\"en/api/commands.html#get_job_stderr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;get_job_stderr&lt;/span&gt;&lt;/a&gt;get_job_stderr&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Non-mutating&lt;/strong&gt;, &lt;strong&gt;Heavy&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Get the stderr of the job. The command is used with failed jobs.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Operation ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Job ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;offset&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Offset from the beginning in bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Maximum size in bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;binary&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: The stderr of the job.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"operation_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"33ab3f-bf1df917-b35fe9ed-c70a4bf4\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"job_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"1225d-1f2fb8c4-f1075d39-5fb7cdff\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"offset\"&lt;/span&gt; = 500; &lt;span class=\"hljs-string\"&gt;\"limit\"&lt;/span&gt; = 100 }\nOUTPUT {\nOUTPUT   &lt;span class=\"hljs-string\"&gt;\"total_size\"&lt;/span&gt; = 1000;\nOUTPUT   &lt;span class=\"hljs-string\"&gt;\"end_offset\"&lt;/span&gt; = 600;\nOUTPUT }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"9977\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-9977\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-9977\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-9977.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"other\"&gt;&lt;a href=\"en/api/commands.html#other\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Other&lt;/span&gt;&lt;/a&gt;Other&lt;/h2&gt;\n&lt;h3 id=\"parse_ypath\"&gt;&lt;a href=\"en/api/commands.html#parse_ypath\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;parse_ypath&lt;/span&gt;&lt;/a&gt;parse_ypath&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Non-mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Perform parsing of the passed &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPath&lt;/a&gt; by putting all IDs of the complex YPath into attributes.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;The path that needs to be parsed.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/table[#1:#2]\"&lt;/span&gt; }\nOUTPUT { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"&amp;lt;ranges=[{lower_limit={row_index=1};upper_limit={row_index=2}}]&amp;gt;//tmp/table\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"10057\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-10057\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-10057\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-10057.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"execute_batch\"&gt;&lt;a href=\"en/api/commands.html#execute_batch\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;execute_batch&lt;/span&gt;&lt;/a&gt;execute_batch&lt;/h3&gt;\n&lt;p&gt;Command properties:  &lt;strong&gt;Mutating if the set includes mutating commands&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Use a single query to execute the set of commands passed in the parameters.&lt;/li&gt;\n&lt;li&gt;The command can (and will be) executed in parallel. It means that if a set includes both writing to and reading from the node, the reading result can either be the older value or the updated one.&lt;/li&gt;\n&lt;li&gt;The set can only include light commands.&lt;/li&gt;\n&lt;li&gt;The set can only include commands with the input type of &lt;code&gt;null&lt;/code&gt; or &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;The set can only include commands with the output type of &lt;code&gt;null&lt;/code&gt; or &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;requests&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Description of executed queries.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;concurrency&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;50&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A numeric parameter that sets the maximum number of commands running on the cluster in parallel. Use this parameter to avoid exhausting your request rate limit.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;The queries executed are listed in the &lt;code&gt;requests&lt;/code&gt; parameter, which is a list.&lt;/li&gt;\n&lt;li&gt;Each element in this list is a dictionary including the following fields:&lt;/li&gt;\n&lt;/ul&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;command&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Command name.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parameters&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Dictionary with the command parameters.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;input&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Input for the query (for the commands with the &lt;code&gt;structured&lt;/code&gt; input type, for example, &lt;code&gt;set&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;The output produces a list of the same length as at the input.&lt;/li&gt;\n&lt;li&gt;Each list item describes the result of a single query execution. This is a dictionary of the following format:&lt;/li&gt;\n&lt;/ul&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;error&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;Error that arose during the query execution (if any).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;output&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;Output for the query (for the successful commands with the &lt;code&gt;structured&lt;/code&gt; input type, for example, &lt;code&gt;get&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"requests\"&lt;/span&gt; = [\n      {\n        &lt;span class=\"hljs-string\"&gt;\"command\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"set\"&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"parameters\"&lt;/span&gt; = {&lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/a\"&lt;/span&gt;};\n        &lt;span class=\"hljs-string\"&gt;\"input\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"value_a\"&lt;/span&gt;;\n      };\n      {\n        &lt;span class=\"hljs-string\"&gt;\"command\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"get\"&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"parameters\"&lt;/span&gt; = {&lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/b\"&lt;/span&gt;};\n      };\n      {\n        &lt;span class=\"hljs-string\"&gt;\"command\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"get\"&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"parameters\"&lt;/span&gt; = {&lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//nonexisting\"&lt;/span&gt;};\n      };\n    ];\n}\nOUTPUT [\n    { };\n    { output = &lt;span class=\"hljs-string\"&gt;\"value_b\"&lt;/span&gt;; };\n    { error = {...} };\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"10289\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-10289\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-10289\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-10289.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"get_supported_features\"&gt;&lt;a href=\"en/api/commands.html#get_supported_features\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;get_supported_features&lt;/span&gt;&lt;/a&gt;get_supported_features&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Non-mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Returns a dictionary with the &lt;code&gt;features&lt;/code&gt; field describing elementary data types, compression codecs, erasure codecs, and other features supported by the cluster.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;No&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;structured&lt;/code&gt;. The &lt;code&gt;features&lt;/code&gt; key in the response includes a dictionary with the following fields.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Key&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Value type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;primitive_types&lt;/td&gt;\n&lt;td&gt;list of rows&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/data-types.html#schema_primitive\"&gt;Primitive types&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;erasure_codecs&lt;/td&gt;\n&lt;td&gt;list of rows&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/replication.html\"&gt;Erasure codecs&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;compression_codecs&lt;/td&gt;\n&lt;td&gt;list of rows&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/compression.html\"&gt;Compression codecs&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { }\nOUTPUT {\n    &lt;span class=\"hljs-string\"&gt;\"features\"&lt;/span&gt; = {\n      &lt;span class=\"hljs-string\"&gt;\"primitive_types\"&lt;/span&gt; = [&lt;span class=\"hljs-string\"&gt;\"int8\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"int16\"&lt;/span&gt;; ... ];\n      &lt;span class=\"hljs-string\"&gt;\"erasure_codecs\"&lt;/span&gt; = [&lt;span class=\"hljs-string\"&gt;\"none\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"isa_lrc_12_2_2\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"isa_reed_solomon_6_3\"&lt;/span&gt;; ... ];\n      &lt;span class=\"hljs-string\"&gt;\"compression_codecs\"&lt;/span&gt; = [&lt;span class=\"hljs-string\"&gt;\"none\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"snappy\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"brotli_1\"&lt;/span&gt;; ... ];\n    };\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"10389\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-10389\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-10389\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-10389.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"generate_timestamp\"&gt;&lt;a href=\"en/api/commands.html#generate_timestamp\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;generate_timestamp&lt;/span&gt;&lt;/a&gt;generate_timestamp&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Non-mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Generates a monotonous timestamp.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;No&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;structured&lt;/code&gt;. The &lt;code&gt;timestamp&lt;/code&gt; key in the response stores a &lt;code&gt;uint64&lt;/code&gt; value.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { }\nOUTPUT {\n    &lt;span class=\"hljs-string\"&gt;\"timestamp\"&lt;/span&gt; = 1723665447133469427u;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"10439\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-10439\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-10439\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-10439.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/api/commands.md","sourcePath":"en/api/commands.md"},"headings":[{"title":"Structure","href":"en/api/commands.html#structure","level":2,"items":[{"title":"Formats","href":"en/api/commands.html#formats","level":3},{"title":"Retries","href":"en/api/commands.html#retry","level":3,"items":[{"title":"Light commands","href":"en/api/commands.html#light","level":4},{"title":"Heavy commands","href":"en/api/commands.html#hard","level":4}]}]},{"title":"Transactions","href":"en/api/commands.html#transactions","level":2},{"title":"Other query parameters","href":"en/api/commands.html#other-query-parameters","level":2},{"title":"Working with transactions","href":"en/api/commands.html#working-with-transactions","level":2,"items":[{"title":"start_tx","href":"en/api/commands.html#start_tx","level":3},{"title":"ping_tx","href":"en/api/commands.html#ping_tx","level":3},{"title":"commit_tx","href":"en/api/commands.html#commit_tx","level":3},{"title":"abort_tx","href":"en/api/commands.html#abort_tx","level":3}]},{"title":"Working with Cypress","href":"en/api/commands.html#working-with-cypress","level":2,"items":[{"title":"create","href":"en/api/commands.html#create","level":3},{"title":"remove","href":"en/api/commands.html#remove","level":3},{"title":"set","href":"en/api/commands.html#set","level":3},{"title":"multiset_attributes","href":"en/api/commands.html#multiset_attributes","level":3},{"title":"get","href":"en/api/commands.html#get","level":3},{"title":"list","href":"en/api/commands.html#list","level":3},{"title":"lock","href":"en/api/commands.html#lock","level":3},{"title":"unlock","href":"en/api/commands.html#unlock","level":3},{"title":"copy","href":"en/api/commands.html#copy","level":3},{"title":"move","href":"en/api/commands.html#move"
