ts.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;uniform&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Uniformly reshard tablets based on an integer key column.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;enable_slicing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Use sampling to increase granularity (for a more precise splitting into tablets) when pivot keys are selected automatically. This might help if you have many entries on one key and few entries on another key.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;slicing_accuracy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0.05&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Tolerance acceptable for uniform regarding into a given number of tablets.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//home/user/table\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"schema\"&lt;/span&gt; = [{&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;; &lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"int64\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"sort_order\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"ascending\"&lt;/span&gt;}; {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;; &lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"string\"&lt;/span&gt;}]; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"5105\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-5105\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-5105\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-5105.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"reshard_table_automatic\"&gt;&lt;a href=\"en/api/commands.html#reshard_table_automatic\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;reshard_table_automatic&lt;/span&gt;&lt;/a&gt;reshard_table_automatic&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Scope: &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html\"&gt;Sorted&lt;/a&gt; dynamic tables.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Forces an iteration of a &lt;a href=\"user-guide/dynamic-tables/resharding.html\"&gt;background tablet balancer&lt;/a&gt;, that is, reshards the tablets that go beyond the &lt;code&gt;min_tablet_size&lt;/code&gt;–&lt;code&gt;max_tablet_size&lt;/code&gt; interval.&lt;/li&gt;\n&lt;li&gt;In contrast to &lt;code&gt;reshard_table&lt;/code&gt;, it can work with mounted tables. In the process of its operation, it can amount tablets.&lt;/li&gt;\n&lt;li&gt;It's started asynchronously by default, but if you specify &lt;code&gt;keep_actions&lt;/code&gt;, it returns a list of IDs that you can use to track the progress. Most APIs do it automatically when passed the &lt;code&gt;sync=True&lt;/code&gt; flag.&lt;/li&gt;\n&lt;li&gt;The command does not support replicated tables (you can use it independently on different replicas, however).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Table path.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;keep_actions&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;If set to &lt;code&gt;true&lt;/code&gt;, respond with a list of IDs to track the progress.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: A list of &lt;code&gt;tablet_action_id&lt;/code&gt; if &lt;code&gt;keep_actions=True&lt;/code&gt;. Otherwise, it returns an empty list.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//home/user/table\"&lt;/span&gt;; }\nOUTPUT [\n    &lt;span class=\"hljs-string\"&gt;\"11-22-33-44\"&lt;/span&gt;;\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"5219\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-5219\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-5219\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-5219.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"alter_table\"&gt;&lt;a href=\"en/api/commands.html#alter_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;alter_table&lt;/span&gt;&lt;/a&gt;alter_table&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Scope: &lt;a href=\"user-guide/storage/static-tables.html\"&gt;Static&lt;/a&gt; and &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;dynamic tables&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Changes the scheme and other table settings (both static and dynamic).&lt;/li&gt;\n&lt;li&gt;You can usually use &lt;code&gt;alter_table&lt;/code&gt; to change the settings that require complex joint validation. The attributes are used to change the recommended settings that only affect new data.&lt;/li&gt;\n&lt;li&gt;Changing the schema involves &lt;a href=\"user-guide/storage/static-schema.html\"&gt;various validation checks&lt;/a&gt; because the system has to make sure that the existing data matches the schema.&lt;/li&gt;\n&lt;li&gt;You can change a static table to a dynamic table, but not vice versa.&lt;/li&gt;\n&lt;li&gt;You can change the schema of a dynamic table, as well as &lt;code&gt;upstream_replica_id&lt;/code&gt;, only if the table is unmounted.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Table path.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;schema&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;If specified, it sets a new schema for the table.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;dynamic&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;If specified, it changes a static table to a dynamic table. This setting can only be changed outside a transaction.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;upstream_replica_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;If specified, it changes the ID of the replica object on the metacluster. For more information, see &lt;a href=\"user-guide/dynamic-tables/replicated-dynamic-tables.html\"&gt;Replicated dynamic tables&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//home/user/table\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"schema\"&lt;/span&gt; = [{&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;; &lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"int64\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"sort_order\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"ascending\"&lt;/span&gt;}; {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;; &lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"string\"&lt;/span&gt;}]; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"5361\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-5361\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-5361\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-5361.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"alter_table_replica\"&gt;&lt;a href=\"en/api/commands.html#alter_table_replica\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;alter_table_replica&lt;/span&gt;&lt;/a&gt;alter_table_replica&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Scope: &lt;a href=\"user-guide/dynamic-tables/replicated-dynamic-tables.html\"&gt;Replicated&lt;/a&gt; dynamic tables.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Changes the replica's properties: enables/disables it or changes its mode.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;replica_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Replica ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;enabled&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;Doesn't change the enabled/disabled status of the replica&lt;/td&gt;\n&lt;td&gt;If set to &lt;code&gt;true&lt;/code&gt;, enables the table. If set to &lt;code&gt;false&lt;/code&gt;, disables the table.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;mode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;Doesn't change the replica's mode&lt;/td&gt;\n&lt;td&gt;Changes the replica mode &lt;code&gt;sync&lt;/code&gt;/&lt;code&gt;async&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"replica_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"730e-8611b-3ff02c5-f647333f\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"enabled\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"5469\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-5469\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-5469\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-5469.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"get_table_columnar_statistics\"&gt;&lt;a href=\"en/api/commands.html#get_table_columnar_statistics\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;get_table_columnar_statistics&lt;/span&gt;&lt;/a&gt;get_table_columnar_statistics&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Non-mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Scope: &lt;a href=\"user-guide/storage/static-tables.html\"&gt;Static&lt;/a&gt; and &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;dynamic&lt;/a&gt; tables.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Get statistics on the set of columns in the given set of tables (taken completely or partially, by ranges).&lt;/li&gt;\n&lt;li&gt;The statistics includes:\n&lt;ul&gt;\n&lt;li&gt;The total &lt;code&gt;data_weight&lt;/code&gt; for each of the requested columns.&lt;/li&gt;\n&lt;li&gt;The total &lt;code&gt;data_weight&lt;/code&gt; for all the old chunks (that the metainformation about each column hasn't been saved to because the chunk has been generated before column-by-column statistics were supported).&lt;/li&gt;\n&lt;li&gt;The total weight of all the timestamps of rows in a dynamic table.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;The paths should always include the &lt;code&gt;column selectors&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;The command can be nested in a transaction.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;paths&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;A list of paths to tables in Cypress. The tables &lt;em&gt;must&lt;/em&gt; exist. The paths &lt;em&gt;must&lt;/em&gt; include &lt;code&gt;column selectors&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Values: Column-by-column statistics for the requested columns.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"paths\"&lt;/span&gt; = [&lt;span class=\"hljs-string\"&gt;\"//tmp/table1{a,b,c}\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"//tmp/table2{a,b,c}\"&lt;/span&gt;];\n    &lt;span class=\"hljs-string\"&gt;\"transaction_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"1234-abcd-abcd-7890\"&lt;/span&gt;\n}\nOUTPUT {\n    &lt;span class=\"hljs-string\"&gt;\"column_data_weights\"&lt;/span&gt; = {\n        &lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt; = 8124;\n        &lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt; = 124241241;\n        &lt;span class=\"hljs-string\"&gt;\"c\"&lt;/span&gt; = 3121414;\n    };\n    &lt;span class=\"hljs-string\"&gt;\"legacy_chunks_data_weight\"&lt;/span&gt; = 100242;\n    &lt;span class=\"hljs-string\"&gt;\"timestamp_total_weight\"&lt;/span&gt; = 50056;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"5586\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-5586\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-5586\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-5586.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"running-operations\"&gt;&lt;a href=\"en/api/commands.html#running-operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Running operations&lt;/span&gt;&lt;/a&gt;Running operations&lt;/h2&gt;\n&lt;p&gt;For more information about running data processing operations, see &lt;a href=\"user-guide/data-processing/operations/overview.html\"&gt;Data processing&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;All the operations are run asynchronously, the specified commands only launch them. To find out whether the operation is complete or not, request the &lt;a href=\"user-guide/data-processing/operations/overview.html#status\"&gt;operation status&lt;/a&gt; using the &lt;code&gt;get_operation&lt;/code&gt; command.&lt;br /&gt;\nAll the commands used to work with operations are also transactional. It means that everything you do with tables in an operation will be executed within the specified transaction when you run the operation.  The node responsible for the operation (&lt;code&gt;//sys/operations/&amp;lt;OP_ID&amp;gt;&lt;/code&gt;) is updated by the &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;scheduler&lt;/a&gt;outside of any transactions.&lt;/p&gt;\n&lt;h3 id=\"start_operation\"&gt;&lt;a href=\"en/api/commands.html#start_operation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;start_operation&lt;/span&gt;&lt;/a&gt;start_operation&lt;/h3&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The HTTP API supports this operation from version v4 onward. Earlier versions of the API use commands with the same names to run operations, such as &lt;code&gt;map&lt;/code&gt;, &lt;code&gt;reduce&lt;/code&gt;, &lt;code&gt;sort&lt;/code&gt;, and so on.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Run the operation of the specified type.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Operation type (can be one of these: &lt;code&gt;map&lt;/code&gt;, &lt;code&gt;reduce&lt;/code&gt;, &lt;code&gt;map_reduce&lt;/code&gt;, &lt;code&gt;remote-copy&lt;/code&gt;, &lt;code&gt;erase&lt;/code&gt;, &lt;code&gt;sort&lt;/code&gt;, &lt;code&gt;merge&lt;/code&gt;, &lt;code&gt;vanilla&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Operation specification. For more information, see &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Setting up operations&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: ID of the running operation.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {  &lt;span class=\"hljs-string\"&gt;\"operation_type\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"map_reduce\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"spec\"&lt;/span&gt; = {\n        &lt;span class=\"hljs-string\"&gt;\"input_table_paths\"&lt;/span&gt; = [ &lt;span class=\"hljs-string\"&gt;\"//tmp/table_in\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/table_in\"&lt;/span&gt; ] ;\n        &lt;span class=\"hljs-string\"&gt;\"output_table_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/table_out\"&lt;/span&gt;\n    }\n}\nOUTPUT &lt;span class=\"hljs-string\"&gt;\"37878b-ba919c15-cdc97f3a-8a983ece\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"5701\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-5701\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-5701\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-5701.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"merge\"&gt;&lt;a href=\"en/api/commands.html#merge\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;merge&lt;/span&gt;&lt;/a&gt;merge&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/st    &lt;/div&gt;\n&lt;h3 id=\"remote-copy\"&gt;&lt;a href=\"en/api/commands.html#remote-copy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;remote-copy&lt;/span&gt;&lt;/a&gt;remote-copy&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Copy the source tables from the specified cluster.&lt;/li&gt;\n&lt;li&gt;Detailed description of all &lt;a href=\"user-guide/data-processing/operations/remote-copy.html\"&gt;specification parameters&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Operation specification (see the relevant fields below).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;spec[input_table_paths]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;List of input tables.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;spec[output_table_paths]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;List of output tables.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;spec[cluster_name]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Cluster with the source tables.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: ID of the running operation.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"spec\"&lt;/span&gt; = {\n      &lt;span class=\"hljs-string\"&gt;\"input_table_paths\"&lt;/span&gt; = [ &lt;span class=\"hljs-string\"&gt;\"//tmp/table_in\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/table_in\"&lt;/span&gt; ] ;\n      &lt;span class=\"hljs-string\"&gt;\"output_table_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/table_out\"&lt;/span&gt; ;\n      &lt;span class=\"hljs-string\"&gt;\"cluster_name\"&lt;/span&gt; = &amp;lt;cluster-name&amp;gt;;\n    }\n}\nOUTPUT &lt;span class=\"hljs-string\"&gt;\"37878b-ba919c15-cdc97f3a-8a983ece\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6632\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6632\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6632\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6632.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"working-with-operations\"&gt;&lt;a href=\"en/api/commands.html#working-with-operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with operations&lt;/span&gt;&lt;/a&gt;Working with operations&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;All the commands used to work with the operations are non-&lt;a href=\"en/api/commands.html#transactions\"&gt;transactional&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;The table describes the &lt;code&gt;TOperation&lt;/code&gt; type, which contains information about the operation returned by the &lt;code&gt;get_operation&lt;/code&gt; and &lt;code&gt;list_operations&lt;/code&gt; commands:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Field&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;String representation of the operation ID (for example, &lt;code&gt;d840bb39-3d893e5b-3fe03e8-f009b1fb&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Operation type (for example, &lt;code&gt;map&lt;/code&gt;, &lt;code&gt;reduce&lt;/code&gt;, &lt;code&gt;map_reduce&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;state&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Current operation state (for example, &lt;code&gt;completed&lt;/code&gt;, &lt;code&gt;running&lt;/code&gt;,&lt;code&gt;failed&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;authenticated_user&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;User that ran the operation.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;start_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ISO 8601 string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Start time.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;finish_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ISO 8601 string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;End time (if the operation completed).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;brief_progress&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Summarized statistics on jobs.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;progress&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Full statistics on jobs.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;brief_spec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Part of the specification with light fields.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;provided_spec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Specification given by the user when starting the operation.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;full_spec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Specification where all the fields omitted by the user are populated by defaults.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;unrecognized_spec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Specification fields that were entered by the user but not recognized by the scheduler.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;experiment_assignment_names&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Names of the experiments applied to the operation.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;experiment_assignments&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Descriptions of the experiments applied to the operation.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Specification given by the user when starting the operation, with the experiments applied.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;controller_agent_address&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Address of the controller agent (host:port) responsible for the operation.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;events&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&amp;lt;map&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;List of state change events that occurred during the operation.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;alerts&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&amp;lt;string, map&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Alerts set up for the operation at the moment.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;alert_events&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&amp;lt;map&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;List of alert start and end events that occurred during the operation.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;result&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A map with an &lt;code&gt;error&lt;/code&gt; field that can include an error if the operation failed.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;committed&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether the operation results were committed.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;suspended&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether the operation is currently suspended.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;scheduling_attributes_per_pool_tree&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&amp;lt;string, map&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Map with information about the operation's execution across different trees.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;task_names&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Names of the tasks comprising the operation.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;controller_features&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Set of quantitative characteristics that can be used to analyze experiments applied to operations.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"list_operations\"&gt;&lt;a href=\"en/api/commands.html#list_operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;list_operations&lt;/span&gt;&lt;/a&gt;list_operations&lt;/h3&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;This command can create a significant load against the cluster. Do not use it in your workflow without a prior approval by the administrator.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Command properties: &lt;strong&gt;Non-mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Get a list of operations that match the filters.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;List of operation attributes that need to be returned in the response.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ISO 8601 string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Bottom limit for the time interval for operation selection (by the time when the operation began).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;to_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ISO 8601 string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Top limit for the time interval for operation selection (by the time when the operation began).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;cursor_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ISO 8601 string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Time beginning from which a list of operation should be returned.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;cursor_direction&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;{past, future}&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;past&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Time direction used to list the operations.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Username to filter for.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;state&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Operation state used to filter data.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Type of filtering operation.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;filter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Substring that &lt;code&gt;filter_factors&lt;/code&gt; should include. &lt;code&gt;filter_factors&lt;/code&gt; is a concatenation of various operation attributes, such as &lt;code&gt;id&lt;/code&gt;, &lt;code&gt;type&lt;/code&gt;, &lt;code&gt;authenticated_user&lt;/code&gt;, &lt;code&gt;state&lt;/code&gt;, &lt;code&gt;input_table_paths&lt;/code&gt;, &lt;code&gt;output_table_paths&lt;/code&gt;, &lt;code&gt;experiments&lt;/code&gt;, &lt;code&gt;annotations&lt;/code&gt;, &lt;code&gt;runtime_parameters&lt;/code&gt;, &lt;code&gt;pool&lt;/code&gt;, and &lt;code&gt;title&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;pool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Pool used for filtering.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;pool_tree&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Pool tree used for filtering.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;with_failed_jobs&lt;/code&gt;&lt;/td&g 1s\" begin=\"visibileAnimation-7498.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"list_operation_events\"&gt;&lt;a href=\"en/api/commands.html#list_operation_events\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;list_operation_events&lt;/span&gt;&lt;/a&gt;list_operation_events&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Non-mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Get operation events.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;GUID&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Operation ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;event_type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Event type. If the value is empty, it returns events of all types.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;list&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;The list of the &lt;code&gt;TOperationEvent&lt;/code&gt; operation events.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;code&gt;TOperationEvent&lt;/code&gt; is a structure that contains information about an operation event. The following event types are supported:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;incarnation_started&lt;/code&gt; — start of a new incarnation of a gang operation.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;All events, irrespective of their type, have the following fields:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Field&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;timestamp&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ISO 8601 string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Event time.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Event type.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Other fields depend on the event type.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;incarnation_started&lt;/code&gt;:&lt;/li&gt;\n&lt;/ul&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;incarnation&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Incarnation identifier.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;incarnation_switch_reason&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Incarnation switch reason. The empty value refers to an incarnation at the operation start.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;incarnation_switch_info&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;{}&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Additional information about the incarnation switch reason.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"operation_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"33ab3f-bf1df917-b35fe9ed-c70a4bf4\"&lt;/span&gt; }\nOUTPUT {\n    [\n        {\n            &lt;span class=\"hljs-string\"&gt;\"timestamp\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"2025-07-03T08:01:41.497318Z\"&lt;/span&gt;;\n            &lt;span class=\"hljs-string\"&gt;\"event_type\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"incarnation_started\"&lt;/span&gt;;\n            &lt;span class=\"hljs-string\"&gt;\"incarnation\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"d31999cc-7ee0f616-ecb005cb-b0ec2d45\"&lt;/span&gt;;\n            &lt;span class=\"hljs-string\"&gt;\"incarnation_switch_info\"&lt;/span&gt; = {};\n        };\n    ]\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"7739\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-7739\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-7739\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-7739.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"abort_operation\"&gt;&lt;a href=\"en/api/commands.html#abort_operation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;abort_operation&lt;/span&gt;&lt;/a&gt;abort_operation&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Abort the operation.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Operation ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"operation_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"33ab3f-bf1df917-b35fe9ed-c70a4bf4\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre
