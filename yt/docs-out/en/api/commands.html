er\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;remove_member&lt;/span&gt;&lt;/a&gt;remove_member&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Add to a group a user or another group.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;member&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;The name of the user or group that needs to be deleted from the group.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;group&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;The name of the group that you are deleting a user or another group from.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"group\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"admins\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"member\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"devs\"&lt;/span&gt;;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2544\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2544\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2544\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2544.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"check_permission\"&gt;&lt;a href=\"en/api/commands.html#check_permission\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;check_permission&lt;/span&gt;&lt;/a&gt;check_permission&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Non-mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Check if a user has a certain permission to access a certain Cypress node.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the node in Cypress.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;The name of the user that you are checking the permission for.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;permission&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;The name of the permission checked.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;columns&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;The list of columns the access to which should be checked.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//sys/accounts/statbox\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"permission\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"use\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"user\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"bob\"&lt;/span&gt;;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2663\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2663\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2663\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2663.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"files\"&gt;&lt;a href=\"en/api/commands.html#files\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with files&lt;/span&gt;&lt;/a&gt;Working with files&lt;/h2&gt;\n&lt;p&gt;For more information about files, see the &lt;a href=\"user-guide/storage/files.html\"&gt;Files&lt;/a&gt; article.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;All the commands used to work with files are transactional.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"write_file\"&gt;&lt;a href=\"en/api/commands.html#write_file\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;write_file&lt;/span&gt;&lt;/a&gt;write_file&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Heavy&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Synonyms (supported, but not recommended).&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;upload.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Upload the content to the file.&lt;/li&gt;\n&lt;li&gt;The file must exist.&lt;/li&gt;\n&lt;li&gt;If the file &lt;code&gt;path&lt;/code&gt; includes the &lt;code&gt;append=%true&lt;/code&gt; attribute, the data is appended to the file; otherwise, the file is overwritten.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;em&gt;null-transaction-id&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Current transaction ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ping_ancestor_transactions&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to ping all the parent transactions while running the operation.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to a file in Cypress. The path &lt;em&gt;must&lt;/em&gt; exist.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;compute_md5&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to calculate the MD5 sum for the file written; if both &lt;code&gt;compute_md5=%true&lt;/code&gt; and &lt;code&gt;append=%true&lt;/code&gt;, but the file does not have the &lt;code&gt;md5&lt;/code&gt; attribute (that is, previously it was written without &lt;code&gt;compute_md5=%true&lt;/code&gt;), an error will occur.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;binary&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: File content.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {&lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/file\"&lt;/span&gt;}\nINPUT this is sample file content\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2823\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2823\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2823\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2823.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"read_file\"&gt;&lt;a href=\"en/api/commands.html#read_file\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;read_file&lt;/span&gt;&lt;/a&gt;read_file&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Non-mutating&lt;/strong&gt;, &lt;strong&gt;Heavy&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Synonyms (supported, but not recommended).&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;download.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Get the content of the Cypress node.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;em&gt;null-transaction-id&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Current transaction ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ping_ancestor_transactions&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to ping all the parent transactions while running the operation.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to a file in Cypress. The path &lt;em&gt;must&lt;/em&gt; exist.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;offset&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;0&lt;/td&gt;\n&lt;td&gt;The position starting from which the data should be read.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;length&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;The length of the data to be read; by default, the file is read to the end.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;binary&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: File content.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/file\"&lt;/span&gt; }\nOUTPUT this is sample file content\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2971\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2971\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2971\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2971.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"file_cache\"&gt;&lt;a href=\"en/api/commands.html#file_cache\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with file cache&lt;/span&gt;&lt;/a&gt;Working with file cache&lt;/h2&gt;\n&lt;p&gt;To learn more about the file cache, see the &lt;a href=\"user-guide/storage/file-cache.html\"&gt;File cache&lt;/a&gt; section.&lt;/p&gt;\n&lt;h3 id=\"put_file_to_cache\"&gt;&lt;a href=\"en/api/commands.html#put_file_to_cache\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;put_file_to_cache&lt;/span&gt;&lt;/a&gt;put_file_to_cache&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Add the file to the cache.&lt;/li&gt;\n&lt;li&gt;Checks that, at the provided path, there's a file with the MD5 hash given in the command options.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the file in Cypress.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;md5&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Expected MD5 hash for the file.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;cache_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the file cache.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: Path to the cached file.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/file\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"md5\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"a3dcb4d229de6fde0db5686dee47145d\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"cache_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/yt_wrapper/file_storage/new_cache\"&lt;/span&gt;;\n}\nOUTPUT &lt;span class=\"hljs-string\"&gt;\"//tmp/yt_wrapper/file_storage/new_cache/5d/a3dcb4d229de6fde0db5686dee47145d\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3092\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3092\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3092\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3092.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"get_file_from_cache\"&gt;&lt;a href=\"en/api/commands.html#get_file_from_cache\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;get_file_from_cache&lt;/span&gt;&lt;/a&gt;get_file_from_cache&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Non-mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Get a path to the cached file.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;md5&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;MD5 hash for the file.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;cache_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the file cache.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: Path to the cached file.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"md5\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"a3dcb4d229de6fde0db5686dee47145d\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"cache_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/yt_wrapper/file_storage/new_cache\"&lt;/span&gt;;\n}\nOUTPUT &lt;span class=\"hljs-string\"&gt;\"//tmp/yt_wrapper/file_storage/new_cache/5d/a3dcb4d229de6fde0db5686dee47145d\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3188\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3188\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3188\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3188.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"tables\"&gt;&lt;a href=\"en/api/commands.html#tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with tables&lt;/span&gt;&lt;/a&gt;Working with tables&lt;/h2&gt;\n&lt;p&gt;To learn more about static tables, see the &lt;a href=\"user-guide/storage/static-tables.html\"&gt;Static tables&lt;/a&gt; section.&lt;/p&gt;\n&lt;p&gt;To learn more about dynamic tables, see the &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Dynamic tables&lt;/a&gt; section.&lt;/p&gt;\n&lt;h3 id=\"write_table\"&gt;&lt;a href=\"en/api/commands.html#write_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;write_table&lt;/span&gt;&lt;/a&gt;write_table&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Heavy&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Scope: &lt;a href=\"user-guide/storage/static-tables.html\"&gt;Static tables&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Synonyms (supported, but not recommended).&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;write.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Add new entries to a static table.&lt;/li&gt;\n&lt;li&gt;The table must exist.&lt;/li&gt;\n&lt;li&gt;If the table &lt;code&gt;path&lt;/code&gt; includes the &lt;code&gt;append=%true&lt;/code&gt; attribute, the entries are appended to the table; otherwise, the table is overwritten.&lt;/li&gt;\n&lt;li&gt;If the table &lt;code&gt;path&lt;/code&gt; includes the &lt;code&gt;sorted_by&lt;/code&gt; attribute, the system checks that the data is sorted by the specified set of keys and the resulting table is labeled as sorted. You can write sorted data (when the &lt;code&gt;sorted_by&lt;/code&gt; attribute is specified) only if any new key is greater than or equal to any old key.&lt;/li&gt;\n&lt;li&gt;You can write unsorted data (when the &lt;code&gt;sorted_by&lt;/code&gt; attribute is not specified) to any table, but the table's sort flag will be removed.&lt;/li&gt;\n&lt;li&gt;The command can be nested in a &lt;a href=\"en/api/commands.html#transactions\"&gt;transaction&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to a table in Cypress. The path &lt;em&gt;must&lt;/em&gt; exist.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;table_writer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;From the driver configuration&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/io-configuration.html\"&gt;Table write options&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;tabular&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: Table content.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/node\"&lt;/span&gt; ;\n    &lt;span class=\"hljs-string\"&gt;\"table_writer\"&lt;/span&gt; = { &lt;span class=\"hljs-string\"&gt;\"codec_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"gzip\"&lt;/span&gt; };\n}\nINPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 1; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = 1.125; };\nINPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 2; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = 2.000; };\nINPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 3; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = 3.850; };\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3331\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3331\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3331\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3331.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"read_table\"&gt;&lt;a href=\"en/api/commands.html#read_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;read_table&lt;/span&gt;&lt;/a&gt;read_table&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Non-mutating&lt;/strong&gt;, &lt;strong&gt;Heavy&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Scope: &lt;a href=\"user-guide/storage/static-tables.html\"&gt;Static&lt;/a&gt; and &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;dynamic&lt;/a&gt; tables.&lt;/p&gt;\n&lt;p&gt;Synonyms (supported, but not recommended).&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;read.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Retrieve entries from a Cypress table.&lt;/li&gt;\n&lt;li&gt;The command can be nested in a &lt;a href=\"en/api/commands.html#transactions\"&gt;transaction&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to a table in Cypress. The path &lt;em&gt;must&lt;/em&gt; exist.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;table_reader&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;From the driver configuration&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/io-configuration.html#table_reader\"&gt;Table's read options&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;control_attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;From the driver configuration&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/io-configuration.html#control_attributes\"&gt;Configuration of the control read attributes&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;unordered&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to read data in parallel, regardless of the entry order.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;tabular&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: Table content.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/node\"&lt;/span&gt; }\nOUTPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 1; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = 1.125; };\nOUTPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 2; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = 2.000; };\nOUTPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 3; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = 3.850; };\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3473\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3473\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3473\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3473.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"read_blob_table\"&gt;&lt;a href=\"en/api/commands.html#read_blob_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;read_blob_table&lt;/span&gt;&lt;/a&gt;read_blob_table&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Non-mutating&lt;/strong&gt;, &lt;strong&gt;Heavy&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Scope: Static &lt;a href=\"user-guide/storage/blobtables.html\"&gt;tables with binary data&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Get a binary data stream from a specific column in a Cypress table.&lt;/li&gt;\n&lt;li&gt;The command can be nested in a transaction.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to a table in Cypress. The path &lt;em&gt;must&lt;/em&gt; exist.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;table_reader&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;From the driver config file&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/io-configuration.html\"&gt;Table's read options&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;part_index_column_name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;part_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Name of the column that stores BLOB indexes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data_column_name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;data&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Name of the column that stores data.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;binary&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: Contents of a data column in the table.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/node\"&lt;/span&gt; }\nOUTPUT &lt;span class=\"hljs-string\"&gt;\"Hello world\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3605\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3605\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3605\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3605.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"select_rows\"&gt;&lt;a href=\"en/api/commands.html#select_rows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;select_rows&lt;/span&gt;&lt;/a&gt;select_rows&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Non-mutating&lt;/strong&gt;, &lt;strong&gt;Heavy&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Scope: &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Dynamic tables&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Execute an SQL-like query for a dynamic table in accordance with the &lt;a href=\"user-guide/dynamic-tables/dyn-query-language.html\"&gt;supported features&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;The transaction can be executed against a data snapshot with a specified timestamp.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;query&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Query string.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;timestamp&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;sync last committed&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Which timestamp the query should run against.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;tabular&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: Set of rows with the result.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"query\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"key, value from [//tmp/sometable]\"&lt;/span&gt; }\nOUTPUT { &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt; = 1; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"hello\"&lt;/span&gt;; };\nOUTPUT { &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt; = 2; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"world; };\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3709\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3709\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3709\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3709.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"insert_rows\"&gt;&lt;a href=\"en/api/commands.html#insert_rows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;insert_rows&lt;/span&gt;&lt;/a&gt;insert_rows&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Heavy&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Scope: &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Dynamic tables&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Write rows to a dynamic table.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the dynamic table.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;update&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;If set to &lt;code&gt;false&lt;/code&gt;, the columns missing in the input data will be written with the value of &lt;code&gt;Null&lt;/code&gt; (overwriting the current value in the table). If set to &lt;code&gt;true&lt;/code&gt;, such columns will preserve their previous value in the table.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;aggregate&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;If set to &lt;code&gt;false&lt;/code&gt;, the &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html#aggr_columns\"&gt;aggregating columns&lt;/a&gt; will be overwritten by the new value. If set to &lt;code&gt;true&lt;/code&gt;, such columns will apply the delta from the source data.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;atomicity&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;full&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Supported values: &lt;code&gt;none&lt;/code&gt; and &lt;code&gt;full&lt;/code&gt;. If set to &lt;code&gt;none&lt;/code&gt;, writing will occur on each tablet, independent of the others. If set to &lt;code&gt;full&lt;/code&gt;, either all of the passed rows will be written, or nothing. &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html\"&gt;Read more&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;require-sync-replica&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The option makes sense only in case of replication. If set to &lt;code&gt;true&lt;/code&gt;, inserting will occur only if the table has a synchronous replica. If set to &lt;code&gt;false&lt;/code&gt;, a synchronous replica is not required.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;tabular&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: Table content.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//home/user/table\"&lt;/span&gt; }\nINPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 1; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = 1.125; };\nINPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 2; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = 2.000; };\nINPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 3; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = 3.850; };\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3850\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3850\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3850\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3850.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"delete_rows\"&gt;&lt;a href=\"en/api/commands.html#delete_rows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;delete_rows&lt;/span&gt;&lt;/a&gt;delete_rows&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Heavy&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Scope: &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Dynamic tables&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Delete all rows with the specified keys from the dynamic table.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the dynamic table.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;tabular&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: Set of rows with the keys.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/sometable\"&lt;/span&gt; }\nINPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 1; };\nINPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 2; };\nINPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 3; };\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3935\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3935\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3935\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3935.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"lock_rows\"&gt;&lt;a href=\"en/api/commands.html#lock_rows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;lock_rows&lt;/span&gt;&lt;/a&gt;lock_rows&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Heavy&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Scope: &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Dynamic tables&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Lock writing to the rows in the dynamic table while the current transaction is running.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the dynamic table.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;locks&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;List of the involved &lt;code&gt;lock groups&lt;/code&gt; from the table schema.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;lock_type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;shared strong&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Lock types: &lt;code&gt;shared weak&lt;/code&gt;, &lt;code&gt;shared strong&lt;/code&gt;, &lt;code&gt;exclusive&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;A shared lock can be taken from multiple different transactions at the same time. An exclusive lock can be taken from a single transaction that usually updates this row.&lt;/p&gt;\n&lt;p&gt;When using read locks (in contrast to write locks), one row can be locked by multiple transactions. That's why, when there is a continuous stream of transactions that take a shared lock on a certain row, the row becomes locked permanently, and you won't be able to update it. This effect is referred to as &lt;code&gt;write starvation&lt;/code&gt;. However this is never the case for write-write conflicts because they have an &lt;code&gt;exclusive lock&lt;/code&gt; that is released every time a write transaction is complete.&lt;/p&gt;\n&lt;p&gt;To alleviate the effect of &lt;code&gt;write starvation&lt;/code&gt;, you can decrease isolation of shared locks. For this, you can specify the &lt;code&gt;weak&lt;/code&gt; or &lt;code&gt;strong&lt;/code&gt; lock mode. The distinction of the &lt;code&gt;weak&lt;/code&gt; mode is that when the transaction is complete, the timestamps until which the rows were locked by shared locks, aren't saved. The practical implication is that a write operation isn't locked if nested in a transaction that overlaps with the current transaction in time but completes later. However, if the write transaction completes earlier, the transaction with a shared lock isn't applied. In the &lt;code&gt;weak&lt;/code&gt; mode, the shared lock becomes asymmetric.&lt;/p&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;tabular&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: Set of rows with the keys.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"lookup_rows\"&gt;&lt;a href=\"en/api/commands.html#lookup_rows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;lookup_rows&lt;/span&gt;&lt;/a&gt;lookup_rows&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Non-mutating&lt;/strong&gt;, &lt;strong&gt;Heavy&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Scope: &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Dynamic tables&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Select the rows with the specified keys from the table.&lt;/li&gt;\n&lt;li&gt;The command can be executed against a data snapshot with a specified timestamp.&lt;/li&gt;\n&lt;li&gt;It is guaranteed that the relative order of rows retrieved in the response will be the same as the order of keys in the query.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the dynamic table. The path should be simple (without columns, ranges, etc.)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;column_names&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Which columns to include in the response.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;keep_missing_rows&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to include the rows corresponding to the non-found keys. If set to &lt;code&gt;true&lt;/code&gt;, the corresponding positions will include &lt;code&gt;#&lt;/code&gt; (entity).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;timestamp&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;sync last committed&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Which timestamp the query should run against.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;tabular&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: Set of rows with the keys.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;tabular&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Value: A set of rows with the specified keys and queried columns.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/sometable\"&lt;/span&gt; }\nINPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 1; };\nINPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 2; };\nINPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 3; };\nOUTPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 1; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = 1.125; };\nOUTPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 2; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = 2.000; };\nOUTPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 3; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = 3.850; };\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"4185\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-4185\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-4185\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-4185.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"trim_rows\"&gt;&lt;a href=\"en/api/commands.html#trim_rows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;trim_rows&lt;/span&gt;&lt;/a&gt;trim_rows&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Heavy&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Scope: &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables.html\"&gt;Ordered&lt;/a&gt; dynamic tables.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Remove rows from the beginning of the tablet of an ordered dynamic table . After that, the deleted data can no longer be read by the &lt;code&gt;select_rows&lt;/code&gt; command. Numbering of other rows is unchanged in this case.&lt;/li&gt;\n&lt;li&gt;The command is executed outside of transactions.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the dynamic table.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Index of the truncated tablet.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;trimmed_row_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Number of deleted rows.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//home/user/table\"&lt;/span&gt;; tablet_index = 10; trimmed_row_count = 43 }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"4298\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-4298\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-4298\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-4298.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"mount_table\"&gt;&lt;a href=\"en/api/commands.html#mount_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;mount_table&lt;/span&gt;&lt;/a&gt;mount_table&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Scope: &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Dynamic tables&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Mounts the tablets of the dynamic table.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the dynamic table.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;first_tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Index of the first mounted tablet.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;last_tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tablet_count - 1&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Index of the last mounted tablet.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;cell_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;If specified, the tablets are mounted to the specified cell. Otherwise, the system selects suitable cells (in most cases, you should delegate this choice to the system).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;freeze&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;If set to &lt;code&gt;true&lt;/code&gt;, the tablets are mounted to a frozen state. See also the description of the &lt;a href=\"en/api/commands.html#freeze_table\"&gt;freeze_table&lt;/a&gt; command.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//home/user/table\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"4434\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-4434\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-4434\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-4434.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"unmount_table\"&gt;&lt;a href=\"en/api/commands.html#unmount_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;unmount_table&lt;/span&gt;&lt;/a&gt;unmount_table&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Scope: &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Dynamic tables&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Unmounts the tablets of the dynamic table.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the dynamic table.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;first_tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Index of the first unmounted tablet.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;last_tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tablet_count - 1&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Index of the last unmounted tablet.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Forcibly unmount the tablets. Using this flag poses a risk of data loss, that's why you need YTsaurus admin rights to use it.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//home/user/table\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"first_tablet_index\"&lt;/span&gt; = 10; &lt;span class=\"hljs-string\"&gt;\"last_tablet_index\"&lt;/span&gt; = 20; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"4556\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-4556\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-4556\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-4556.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"remount_table\"&gt;&lt;a href=\"en/api/commands.html#remount_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;remount_table&lt;/span&gt;&lt;/a&gt;remount_table&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Scope: &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Dynamic tables&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Enables you to update certain settings of dynamic tables without unmounting them.&lt;/li&gt;\n&lt;li&gt;When remounted like that, the table remains accessible for reading and writing.&lt;/li&gt;\n&lt;li&gt;The settings are taken from the table attributes and eventually reach the node where the tablets are processed.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the dynamic table.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;first_tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Index of the first remounted tablet.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;last_tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tablet_count - 1&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Index of the last remounted tablet.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//home/user/table\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"4674\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-4674\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-4674\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-4674.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"freeze_table\"&gt;&lt;a href=\"en/api/commands.html#freeze_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;freeze_table&lt;/span&gt;&lt;/a&gt;freeze_table&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Scope: &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Dynamic tables&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Changes the tablets of the dynamic table to a frozen state, flushing all the data to the disk. You can read data in this state, but you can't write new entries. However, all the other written data exist in chunks and are available to map-reduce operations, for example (even without using the &lt;code&gt;enable_dynamic_store_read&lt;/code&gt; option).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the dynamic table.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;first_tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Index of the first frozen tablet.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;last_tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tablet_count - 1&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Index of the last frozen tablet.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//home/user/table\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"4782\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-4782\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-4782\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-4782.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"unfreeze_table\"&gt;&lt;a href=\"en/api/commands.html#unfreeze_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;unfreeze_table&lt;/span&gt;&lt;/a&gt;unfreeze_table&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Scope: &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Dynamic tables&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Unfreezes a table that was frozed (for example, by a &lt;code&gt;freeze_table&lt;/code&gt; command), making the table write-accessible.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Path to the dynamic table.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;first_tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Index of the first unfrozen tablet.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;last_tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tablet_count - 1&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Index of the last unfrozen tablet.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Input data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Output data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Type: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//home/user/table\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"4890\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-4890\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-4890\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-4890.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"reshard_table\"&gt;&lt;a href=\"en/api/commands.html#reshard_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;reshard_table&lt;/span&gt;&lt;/a&gt;reshard_table&lt;/h3&gt;\n&lt;p&gt;Command properties: &lt;strong&gt;Mutating&lt;/strong&gt;, &lt;strong&gt;Light&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Scope: &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Dynamic tables&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Reshards the dynamic table (that is, changes the set of its tablets).&lt;/li&gt;\n&lt;li&gt;The resharded tablets must be unmounted.&lt;/li&gt;\n&lt;li&gt;Be sure to specify &lt;code&gt;tablet_count&lt;/code&gt; for an ordered table. For a sorted table, you can specify both &lt;code&gt;tablet_count&lt;/code&gt; and &lt;code&gt;pivot_keys&lt;/code&gt;. The resharded tablets are replaced by a set of new tablets.&lt;/li&gt;\n&lt;li&gt;In the case of a sorted table:\n&lt;ul&gt;\n&lt;li&gt;When passing &lt;code&gt;pivot_keys&lt;/code&gt;, the first key in &lt;code&gt;pivot_keys&lt;/code&gt; must match the first key of the first resharded tablet. The number of &lt;code&gt;pivot_keys&lt;/code&gt; is equal to the number of new tablets that the resharded tablets are split into.&lt;/li&gt;\n&lt;li&gt;When passing &lt;code&gt;tablet_count&lt;/code&gt;, the system will select pivot keys based on the data available in the table as evenly as possible. If the table isn't large enough, you might get less tablets then requested as a result. At default settings, your resulting tablets can't be smaller than about 200 MB each. For smaller slicing, use the option&lt;code&gt;enable_slicing&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;If the first key column of the table has an integer type, then along with &lt;code&gt;tablet_count&lt;/code&gt;, you can use &lt;code&gt;uniform=True&lt;/code&gt;. In this case, uniform values from the range of the appropriate type will be selected as pivot keys. &lt;code&gt;0, 2^64/n, 2^64\\*2/n, ...&lt;/code&gt; for an unsigned 64-bit type and &lt;code&gt;-2^63, -2^63 + 2^64/n, -2^63 + 2^64\\*2/n, ...&lt;/code&gt; for a signed 64-bit type.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;For an ordered table, &lt;code&gt;table_count&lt;/code&gt; specifies the number of new tablets that the sharded tablets are split into. In this case, if the resulting tablets are higher in numbers than the old ones, new empty tablets are created. If the resulting tablets are smaller in numbers, the corresponding number of source trailing tablets are merged into a single tablet in their natural order.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Required&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Table path.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;first_tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Index of the first resharded tablet.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;last_tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tablet_count - 1&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Index of the last resharded tablet.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;pivot_keys&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Pivot keys for the new tablets (for a sorted table).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;tablet_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Number of new table
