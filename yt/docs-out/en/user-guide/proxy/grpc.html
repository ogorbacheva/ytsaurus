            {"data":{"leading":false,"html":"&lt;p&gt;You can communicate with a YTsaurus cluster via the gRPC protocol.&lt;/p&gt;\n&lt;p&gt;Advantages:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Full support for dynamic tables, you can work with transactions.&lt;/li&gt;\n&lt;li&gt;Support for all basic commands for working with Cypress.&lt;/li&gt;\n&lt;li&gt;gRPC is an industry standard for communicating with the service and it is easy to install it via pip or deb packages. Documentation is also available on the internet.&lt;br /&gt;\nDisadvantages:&lt;/li&gt;\n&lt;li&gt;The protocol is more low-level. More complicated work with tabular data, you need to serialize/deserialize rows manually.&lt;/li&gt;\n&lt;li&gt;There is currently no integration with off-the-shelf YTsaurus HTTP clients (C++ or Python).&lt;/li&gt;\n&lt;li&gt;Creating a full-fledged user-friendly client library on top of the API is a complicated and time-consuming task. For some languages (C++, Python, and Java), we have partially solved it.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;gRPC queries serve YTsaurus &lt;a href=\"user-guide/proxy/rpc.html\"&gt;RPC proxies&lt;/a&gt;. As follows from the proxy name (RPC), the server expects a &lt;a href=\"https://developers.google.com/protocol-buffers/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;protobuf&lt;/a&gt; from the client. The server will also respond with a message. Each YTsaurus command, such as \"create a node in Cypress\" or \"write rows\", is represented as a pair of messages (with TReq and TRsp prefixes for a query and a response respectively). Example: &lt;code&gt;TReqCreateNode, TRspCreateNode&lt;/code&gt;: Create a node in Cypress. You can view the messages and their descriptions in the proto file.&lt;/p&gt;\n&lt;h2 id=\"installing-and-compiling-proto-messages\"&gt;&lt;a href=\"en/user-guide/proxy/grpc.html#installing-and-compiling-proto-messages\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Installing and compiling proto messages&lt;/span&gt;&lt;/a&gt;Installing and compiling proto messages&lt;/h2&gt;\n&lt;p&gt;You can install compiled messages via pip: &lt;code&gt;pip install ytsaurus-proto&lt;/code&gt;. You also need to install gRPC and protobuf of the following versions (newer versions are also allowed, but functionality has not been tested on newer packages):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;protobuf&amp;gt;=3.2.1\ngrpcio==1.2.0rc1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"47\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-47\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-47\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-47.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"en/user-guide/proxy/grpc.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h2&gt;\n&lt;p&gt;A short example of a get query to Cypress via gRPC:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt_proto.yt.client.api.rpc_proxy.proto.api_service_pb2 &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; api_service_pb2\n\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.yson &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yson\n\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\n\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; grpc\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; random\n\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; __name__ == &lt;span class=\"hljs-string\"&gt;\"__main__\"&lt;/span&gt;:\n    &lt;span class=\"hljs-comment\"&gt;# We will query the cluster&lt;/span&gt;\n    yt.config[&lt;span class=\"hljs-string\"&gt;\"proxy\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"url\"&lt;/span&gt;] = &lt;span class=\"hljs-string\"&gt;\"cluster-name\"&lt;/span&gt;\n\n    &lt;span class=\"hljs-comment\"&gt;# Getting a list of gRPC proxies, the \"discover_proxies\" command is available from the fourth version of the API.&lt;/span&gt;\n    yt.config[&lt;span class=\"hljs-string\"&gt;\"api_version\"&lt;/span&gt;] = &lt;span class=\"hljs-string\"&gt;\"v4\"&lt;/span&gt;\n    proxies = yt.driver.make_formatted_request(&lt;span class=\"hljs-string\"&gt;\"discover_proxies\"&lt;/span&gt;, {&lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"grpc\"&lt;/span&gt;}, &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=&lt;span class=\"hljs-literal\"&gt;None&lt;/span&gt;)[&lt;span class=\"hljs-string\"&gt;\"proxies\"&lt;/span&gt;]\n\n    &lt;span class=\"hljs-comment\"&gt;# Creating a gRPC connection to an arbitrary proxy from the list.&lt;/span&gt;\n    channel = grpc.insecure_channel(&lt;span class=\"hljs-built_in\"&gt;str&lt;/span&gt;(random.choice(proxies)))\n\n    &lt;span class=\"hljs-comment\"&gt;# Filling in the proto message, making a get on the path //home/username.&lt;/span&gt;\n    get_req = api_service_pb2.TReqGetNode(path=&lt;span class=\"hljs-string\"&gt;\"//home/username\"&lt;/span&gt;)\n\n    &lt;span class=\"hljs-comment\"&gt;# Transmitting the minimum version of the protocol (learn more about this below) and the access token.&lt;/span&gt;\n    metadata = [\n        (&lt;span class=\"hljs-string\"&gt;\"yt-protocol-version\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"1.0\"&lt;/span&gt;),\n        (&lt;span class=\"hljs-string\"&gt;\"yt-auth-token\"&lt;/span&gt;, yt._get_token())\n    ]\n\n    &lt;span class=\"hljs-comment\"&gt;# Initiating a unary-unary query (that is, one message from the client (the query) and one message from the server (the response)).&lt;/span&gt;\n    unary = channel.unary_unary(\n        &lt;span class=\"hljs-string\"&gt;\"/ApiService/GetNode\"&lt;/span&gt;,\n        request_serializer=api_service_pb2.TReqGetNode.SerializeToString,\n        response_deserializer=api_service_pb2.TRspGetNode.FromString)\n\n    &lt;span class=\"hljs-comment\"&gt;# Making a query.&lt;/span&gt;\n    _, call = unary.with_call(get_req, metadata=metadata)\n\n    &lt;span class=\"hljs-comment\"&gt;# Typing a response.&lt;/span&gt;\n    &lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt; yson.loads(call.result().value)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"54\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-54\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-54\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-54.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"message-versioning-and-protocol-version\"&gt;&lt;a href=\"en/user-guide/proxy/grpc.html#message-versioning-and-protocol-version\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Message versioning and protocol version&lt;/span&gt;&lt;/a&gt;Message versioning and protocol version&lt;/h2&gt;\n&lt;p&gt;The client must pass &lt;code&gt;yt-protocol-version&lt;/code&gt; in the headers of each query. This field is a row of the \"Major.Minor\" form. When receiving a gRPC query, the server checks the following:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The Major version of the client and the server must match exactly.&lt;/li&gt;\n&lt;li&gt;The Minor version of the server must be greater than or equal to the Minor version of the client.&lt;br /&gt;\nIf the conditions are not met, an error will occur.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;The Major version may change in case of major protocol changes and such changes will be rare. Backward compatibility is supported within a single Major version: old clients will work with new versions of the server.&lt;/p&gt;\n&lt;p&gt;The Minor version can change when a package with compiled proto files is rebuilt (for example, when optional fields are added to proto messages). The client is responsible for specifying the correct version of the protocol. Let's say there is an optional parameter in the message:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;// Since 1.42\noptional int64 some_important_value = 42;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"79\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-79\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-79\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-79.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;As you can see from the comment, this parameter appeared in the server version \"1.42\". If you are using this parameter as a client, you need to specify &lt;code&gt;yt-protocol-version = \"1.42\"&lt;/code&gt;, otherwise the old server may simply ignore this parameter.&lt;/p&gt;\n&lt;h2 id=\"grpc-protocol-in-ytsaurus\"&gt;&lt;a href=\"en/user-guide/proxy/grpc.html#grpc-protocol-in-ytsaurus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;gRPC protocol in YTsaurus&lt;/span&gt;&lt;/a&gt;gRPC protocol in YTsaurus&lt;/h2&gt;\n&lt;p&gt;YTsaurus uses the gRPC protocol as follows:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;In YTsaurus, gRPC descriptions of services in proto files are not used.&lt;/li&gt;\n&lt;li&gt;In YTsaurus, an arbitrary blob of binary data (the so called attachment, learn more about this below) can be added to the proto message.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;These differences do not require modification of the gRPC code, you can use an ordinary stock client.&lt;/p&gt;\n&lt;h3 id=\"attachment-in-grpc\"&gt;&lt;a href=\"en/user-guide/proxy/grpc.html#attachment-in-grpc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Attachment in gRPC&lt;/span&gt;&lt;/a&gt;Attachment in gRPC&lt;/h3&gt;\n&lt;p&gt;To transfer binary data (such as rows to be inserted into a dynamic table), YTsaurus adds support for so called attachments.&lt;/p&gt;\n&lt;p&gt;Attachment is a block of binary data attached to a single message. It can be used both in the query (such as rows to be inserted) and in the response. There may be multiple attachments in the response and the query.&lt;/p&gt;\n&lt;p&gt;For a formal description, let's turn to the &lt;a href=\"https://github.com/grpc/grpc/blob/master/doc/PROTOCOL-HTTP2.md\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;description&lt;/a&gt; of gRPC over HTTP/2 and consider an example of the query and response.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Query&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;HEADERS (flags = END_HEADERS)\n:method = POST\n:scheme = http\n:path = /google.pubsub.v2.PublisherService/CreateTopic\n:authority = pubsub.googleapis.com\ngrpc-timeout = 1S\ncontent-type = application/grpc+proto\ngrpc-encoding = gzip\nauthorization = Bearer y235.wef315yfh138vh31hv93hv8h3v\n\nDATA (flags = END_STREAM)\n&amp;lt;Length-Prefixed Message&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"119\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-119\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-119\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-119.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;strong&gt;Response&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;HEADERS (flags = END_HEADERS)\n:status = 200\ngrpc-encoding = gzip\ncontent-type = application/grpc+proto\n\nDATA\n&amp;lt;Length-Prefixed Message&amp;gt;\n\nHEADERS (flags = END_STREAM, END_HEADERS)\ngrpc-status = 0 # OK\ntrace-proto-bin = jher831yy13JHy3hc\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"123\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-123\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-123\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-123.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Both the query and the response contain various metainformation (&lt;code&gt;grpc-encoding&lt;/code&gt;, &lt;code&gt;content-type&lt;/code&gt;, &lt;code&gt;grpc-status&lt;/code&gt;, and others). The data section marked as &lt;code&gt;DATA &amp;lt;Length-Prefixed Message&amp;gt;&lt;/code&gt; is described in the &lt;a href=\"https://en.wikipedia.org/wiki/Augmented_Backus%E2%80%93Naur_form\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ABNF&lt;/a&gt; notation.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Length-Prefixed-Message → Compressed-Flag Message-Length Message\nCompressed-Flag → 0 / 1 # encoded as 1 byte unsigned integer\nMessage-Length → {length of Message} # encoded as 4 byte unsigned integer\nMessage → *{binary octet}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"127\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-127\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-127\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-127.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;This is the compression flag (it takes one byte, in case of the YTsaurus RPC proxy, it must always be 0) followed by the message length encoded by four bytes and the message as an arbitrary byte sequence of &lt;code&gt;Message-Length&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;YTsaurus specifies the Message, now it is not an arbitrary byte sequence. The message is described as follows:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Message → SerializedProtoMessage *Length-Prefixed-Attachment\nLength-Prefixed-Attachment → Attachment-Length [Attachment]\nAttachment-Length → {length of Attachment} # encoded as 4 byte unsigned integer, can be 0xFFFFFFFF if Attachment is omitted\nAttachment → *{binary octet}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"134\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-134\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-134\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-134.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;First comes the &lt;code&gt;SerializedProtoMessage&lt;/code&gt; part that is a serialized proto message. This is followed by the number of (possibly zero) attachments. Each attachment is a length (&lt;code&gt;Attachment-Length&lt;/code&gt; encoded by four bytes) + an arbitrary byte sequence of &lt;code&gt;Attachment-Length&lt;/code&gt;.&lt;br /&gt;\nNote that if there are no attachments, the protocol is completely identical to the stock gRPC protocol.&lt;/p&gt;\n&lt;p&gt;The system cannot distinguish where &lt;code&gt;SerializedProtoMessage&lt;/code&gt; ends. To do this, enter a special key in the metadata in the header: &lt;code&gt;yt-message-body-size&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Thus, the system reads &lt;code&gt;yt-message-body-size&lt;/code&gt; bytes, turns them into a proto message, and considers the remaining bytes until the end of the stream as attachments. If the &lt;code&gt;yt-message-body-size&lt;/code&gt; header is not specified, the entire stream is considered a serialized proto message for compatibility purposes.&lt;/p&gt;\n&lt;h2 id=\"wire-format\"&gt;&lt;a href=\"en/user-guide/proxy/grpc.html#wire-format\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Wire format&lt;/span&gt;&lt;/a&gt;Wire format&lt;/h2&gt;\n&lt;p&gt;YTsaurus uses a wire format to transmit rows, serialized rows are transmitted to attachments. The partitioning of a serialized row stream into attachments is arbitrary, consider several consecutive attachments as a single byte stream.&lt;/p&gt;\n&lt;p&gt;Each query that can accept or return rows has a &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/yt/yt_proto/yt/client/api/rpc_proxy/proto/api_service.proto\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;rowset descriptor&lt;/a&gt;. It describes how rows should be deserialized or serialized. This section describes how an unversioned rowset (&lt;code&gt;RK_UNVERSIONED&lt;/code&gt;) is arranged. If you want to use the &lt;code&gt;RK_VERSIONED&lt;/code&gt; type, write to &lt;a href=\"mailto:community@ytsaurus.tech\"&gt;ytsaurus@&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Use the familiar ABNF notation (endianness - little) for description:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;UnversionedRowset → RowCount *UnversionedRow\nRowCount → {row count} # encoded as 8 byte unsigned integer\nUnversionedRow → ValueCount *UnversionedValue\nValueCount → {value count} # encoded as 8 byte unsigned integer\nUnversionedValue → ValueIndex ValueType AggregateFlag Length Content\nValueIndex → {index of column to which value belong, should match `columns` field in TColumnDescriptor} # encoded as 2 byte unsigned integer\nValueType → 0x02 {Null} / 0x03 {Int64} / 0x04 {Uint64} / 0x05 {Double} / 0x06 {Boolean} / 0x10 {String} / 0x11 {Any} # encoded as unsigned byte\nAggregateFlag → {is value aggregate?} # encoded as unsigned byte\nLength → {length of Content} # encoded as 4 byte unsigned integer\nContent → *{binary octet} # must be 8-byte aligned!\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"156\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-156\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-156\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-156.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Thus, the minimum &lt;code&gt;Content&lt;/code&gt; length can be 8 bytes (for all values except String and Any).&lt;/p&gt;\n&lt;p&gt;Let's consider the &lt;code&gt;{\"a\": 1, \"b\": {\"x\": \"y\"}}&lt;/code&gt; dict as an example. This is one row (&lt;code&gt;UnversionedRow&lt;/code&gt; in the terms above) consisting of two &lt;code&gt;UnversionedValue&lt;/code&gt; — one (key &lt;code&gt;a&lt;/code&gt;) of the &lt;code&gt;int64&lt;/code&gt; type and the other (key &lt;code&gt;b&lt;/code&gt;) of the &lt;code&gt;any&lt;/code&gt; type.&lt;/p&gt;\n&lt;p&gt;Column names are not passed in rows. They are passed in &lt;code&gt;TColumnDescriptor&lt;/code&gt; in the proto message and the rows contain only their &lt;code&gt;ValueIndex&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;An example of implementing this format in Python is available &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/yt/wire_format\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;here&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/proxy/grpc.md","sourcePath":"en/user-guide/proxy/grpc.md"},"headings":[{"title":"Installing and compiling proto messages","href":"en/user-guide/proxy/grpc.html#installing-and-compiling-proto-messages","level":2},{"title":"Examples","href":"en/user-guide/proxy/grpc.html#examples","level":2},{"title":"Message versioning and protocol version","href":"en/user-guide/proxy/grpc.html#message-versioning-and-protocol-version","level":2},{"title":"gRPC protocol in YTsaurus","href":"en/user-guide/proxy/grpc.html#grpc-protocol-in-ytsaurus","level":2,"items":[{"title":"Attachment in gRPC","href":"en/user-guide/proxy/grpc.html#attachment-in-grpc","level":3}]},{"title":"Wire format","href":"en/user-guide/proxy/grpc.html#wire-format","level":2}],"title":"gRPC proxy"},"router":{"pathname":"en/user-guide/proxy/grpc","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
