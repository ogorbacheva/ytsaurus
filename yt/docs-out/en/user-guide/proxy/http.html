        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section demonstrates how to work with YTsaurus via the HTTP proxy using the example of running the &lt;a href=\"https://en.wikipedia.org/wiki/Word_count\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Word Count&lt;/a&gt; task.&lt;/p&gt;\n&lt;p&gt;You can find a full description of all YTsaurus commands in the &lt;a href=\"api/commands.html\"&gt;Commands&lt;/a&gt; section.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;To understand the material presented in this section, you need to know the &lt;a href=\"https://en.wikipedia.org/wiki/HTTP\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;HTTP protocol&lt;/a&gt; structure, the principles of working via HTTP, and the basics of &lt;a href=\"user-guide/storage/cypress.html\"&gt;data storage&lt;/a&gt; in the YTsaurus system.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"prepare\"&gt;&lt;a href=\"en/user-guide/proxy/http.html#prepare\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Setup&lt;/span&gt;&lt;/a&gt;Setup&lt;/h2&gt;\n&lt;p&gt;The Word Count example is a typical task for any &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt; system. The general schema is as follows:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;A &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt; operation is performed on the source text, producing a pair &lt;code&gt;(word, 1)&lt;/code&gt; for each word.&lt;/li&gt;\n&lt;li&gt;The result is sorted by the first coordinate.&lt;/li&gt;\n&lt;li&gt;A &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt; operation that summarizes the second coordinate is performed on the first coordinate. The result is a set of pairs (&lt;code&gt;word, number of word mentions)&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Further, the &lt;a href=\"https://en.wikipedia.org/wiki/CURL\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;curl&lt;/a&gt; utility is used to work over HTTP. The environment variables listed below were set for convenience.&lt;/p&gt;\n&lt;p&gt;Setting the environment variables:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ &lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_PROXY=cluster-name\n$ &lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_TOKEN=`&lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; ~/.yt/token`\n$ &lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_HOME=//tmp/yt_examples\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"45\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-45\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-45\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-45.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;To make the examples clearer, irrelevant and duplicate information has been removed from them.&lt;/p&gt;\n&lt;h2 id=\"upload\"&gt;&lt;a href=\"en/user-guide/proxy/http.html#upload\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Uploading data&lt;/span&gt;&lt;/a&gt;Uploading data&lt;/h2&gt;\n&lt;p&gt;Data in the YTsaurus system is stored in &lt;a href=\"user-guide/storage/static-tables.html\"&gt;tables&lt;/a&gt;, so you need to create a table. The table contains two columns: row number and row contents. Use the &lt;a href=\"api/commands.html#create\"&gt;create&lt;/a&gt; command to create a table.&lt;/p&gt;\n&lt;p&gt;Creating a directory and a table:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Creating a working directory&lt;/span&gt;\n$ curl -v -X POST &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/api/v3/create?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;&amp;amp;type=map_node\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt;\n&amp;gt; POST /api/v3/create?path=//tmp/yt_examples&amp;amp;&lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt;=map_node HTTP/1.1\n\n&amp;lt; HTTP/1.1 200 OK\n&lt;span class=\"hljs-string\"&gt;\"0-3c35f-12f-8c397340\"&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Creating a table for source data&lt;/span&gt;\n$ curl -v -X POST &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/api/v3/create?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/input&amp;amp;type=table\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt;\n&amp;gt; POST /api/v3/create?path=//tmp/yt_examples/input&amp;amp;&lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt;=table HTTP/1.1\n\n&amp;lt; HTTP/1.1 200 OK\n&lt;span class=\"hljs-string\"&gt;\"0-6a7-191-8075d1f7\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"58\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-58\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-58\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-58.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;As a result of the command execution, IDs (GUIDs) of created objects in Cypress are returned in response: &lt;code&gt;0-3c35f-12f-8c397340&lt;/code&gt; and &lt;code&gt;0-6a7-191-8075d1f7&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;You need to upload the data into the table. To do this, use the &lt;a href=\"api/commands.html#write_table\"&gt;write_table&lt;/a&gt; command. The tab-separated format is used as the data format:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The table rows are separated by a line advance ( &lt;code&gt;\\n&lt;/code&gt; ).&lt;/li&gt;\n&lt;li&gt;The columns are separated by a tab ( &lt;code&gt;\\t&lt;/code&gt; ).&lt;/li&gt;\n&lt;li&gt;The column name and its contents are separated by an equal sign.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;For example, a row: &lt;code&gt;lineno=1\\tsize=6\\tvalue=foobar&lt;/code&gt; describes a row with the &lt;em&gt;lineno&lt;/em&gt;, &lt;em&gt;size&lt;/em&gt;, and &lt;em&gt;value&lt;/em&gt; columns with the &lt;em&gt;1&lt;/em&gt;, &lt;em&gt;6&lt;/em&gt;, and &lt;em&gt;foobar&lt;/em&gt; values, respectively. Tab characters are escaped.&lt;/p&gt;\n&lt;p&gt;Uploading data to the table:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Downloading the text&lt;/span&gt;\n$ wget -O - http://lib.ru/BULGAKOW/whtguard.txt | iconv -f cp1251 -t utf-8 &amp;gt; source.txt\n\n&lt;span class=\"hljs-comment\"&gt;# Reformatting and uploading the text&lt;/span&gt;\n$ &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; source.txt | perl -e &lt;span class=\"hljs-string\"&gt;'\n    $n = 0;\n    while(&amp;lt;&amp;gt;) {\n      $n++; chomp; s/\\t/\\\\t/g; print \"lineno=$n\\ttext=$_\\n\";\n    }\n  '&lt;/span&gt; &amp;gt; source.tsv\n\n$ HEAVY_YT_PROXY=$(curl -s -H &lt;span class=\"hljs-string\"&gt;\"Accept: text/plain\"&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/hosts\"&lt;/span&gt; | &lt;span class=\"hljs-built_in\"&gt;head&lt;/span&gt; -n1)\n$ curl -v -L -X PUT &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$HEAVY_YT_PROXY&lt;/span&gt;/api/v3/write_table?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/input\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Content-Type: text/tab-separated-values\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Transfer-Encoding: chunked\"&lt;/span&gt; \\\n    -T source.tsv\n&amp;gt; PUT /api/v3/write_table?path=//tmp/yt_examples/input HTTP/1.1\n&amp;gt; Expect: 100-&lt;span class=\"hljs-built_in\"&gt;continue&lt;/span&gt;\n\n&amp;lt; HTTP/1.1 100 Continue\n&amp;lt; HTTP/1.1 200 OK\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"88\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-88\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-88\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-88.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Note that the input data format is also explicitly specified in this query: \"text/tab-separated-values\".&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;When creating a client, the user needs to occasionally query a list of heavy proxies using the &lt;code&gt;/hosts&lt;/code&gt; query. A list of heavy proxies ordered by priority is returned in the response. The proxy priority is determined dynamically and depends on its load (CPU+I/O). A good strategy is to re-query the &lt;code&gt;/hosts&lt;/code&gt; list every minute or every few queries and change the current proxy to which queries are made.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Getting a list of heavy proxies:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ curl -v -X GET &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/hosts\"&lt;/span&gt;\n&amp;gt; GET /hosts HTTP/1.1\n\n&amp;lt; HTTP/1.1 200 OK\n&amp;lt; Content-Type: application/json\n&amp;lt;\n[&lt;span class=\"hljs-string\"&gt;\"n0008-sas.cluster-name\"&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;\"n0025-sas.cluster-name\"&lt;/span&gt;,...]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"112\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-112\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-112\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-112.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;To make sure that the data is written, look at the table attributes.&lt;/p&gt;\n&lt;p&gt;Getting the table attributes:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ curl -v -X GET &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/api/v3/get?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/input/@\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt;\n&amp;gt; GET /api/v3/get?path=//tmp/yt_examples/input/@ HTTP/1.1\n\n&amp;lt; HTTP/1.1 200 OK\n{\n  ...\n  &lt;span class=\"hljs-string\"&gt;\"uncompressed_data_size\"&lt;/span&gt; : 993253,\n  &lt;span class=\"hljs-string\"&gt;\"compressed_size\"&lt;/span&gt; : 542240,\n  &lt;span class=\"hljs-string\"&gt;\"compression_ratio\"&lt;/span&gt; : 0.54592334480741566693,\n  &lt;span class=\"hljs-string\"&gt;\"row_count\"&lt;/span&gt; : 8488,\n  &lt;span class=\"hljs-string\"&gt;\"sorted\"&lt;/span&gt; : &lt;span class=\"hljs-string\"&gt;\"false\"&lt;/span&gt;,\n  ...\n  &lt;span class=\"hljs-string\"&gt;\"channels\"&lt;/span&gt; : [ [&lt;span class=\"hljs-string\"&gt;\"lineno\"&lt;/span&gt;], [&lt;span class=\"hljs-string\"&gt;\"text\"&lt;/span&gt;] ]\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"119\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-119\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-119\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-119.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Don't be frightened by null values. null does not mean that there is no relevant data. It means that the given key contains a node of a special type (such as a table or a file) or that the data is lazily computable and needs to be explicitly accessed (the case above).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;To upload, for example, JSON, you need to add a bit more options. For more information, see &lt;a href=\"user-guide/storage/formats.html#json\"&gt;Formats&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Uploading data in JSON format:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; test.json\n{ &lt;span class=\"hljs-string\"&gt;\"color\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"red\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"#f00\"&lt;/span&gt; }\n{ &lt;span class=\"hljs-string\"&gt;\"color\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"red\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"#f00\"&lt;/span&gt; }\n\n$ curl -X POST &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/api/v3/create?path=//tmp/test-json&amp;amp;type=table\"&lt;/span&gt; \\\n       -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; \\\n       -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt;\n\n$ curl -L -X PUT &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$HEAVY_YT_PROXY&lt;/span&gt;/api/v3/write_table?path=//tmp/test-json&amp;amp;encode_utf8=false\"&lt;/span&gt;\n          -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt;\n          -H &lt;span class=\"hljs-string\"&gt;\"Content-Type: application/json\"&lt;/span&gt;\n          -H &lt;span class=\"hljs-string\"&gt;\"Transfer-Encoding: chunked\"&lt;/span&gt;\n          -H &lt;span class=\"hljs-string\"&gt;\"X-YT-Header-Format: &amp;lt;format=text&amp;gt;yson\"&lt;/span&gt;\n          -H &lt;span class=\"hljs-string\"&gt;\"X-YT-Input-Format: &amp;lt;encode_utf8=%false&amp;gt;json\"&lt;/span&gt;\n          -T test.json\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"143\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-143\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-143\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-143.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"uploading-files\"&gt;&lt;a href=\"en/user-guide/proxy/http.html#uploading-files\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Uploading files&lt;/span&gt;&lt;/a&gt;Uploading files&lt;/h2&gt;\n&lt;p&gt;To run a &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt; or &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt; operation, you will need to upload a script that must be executed into the system. The script for this task is placed on &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/python-misc/http_proxy.py\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitHub&lt;/a&gt; (however, it is locally saved to &lt;code&gt;exec.py&lt;/code&gt; ). The &lt;a href=\"api/commands.html#write_table\"&gt;write_file&lt;/a&gt; command is used to upload files to the YTsaurus system. Before uploading, create a node of the \"file\" type, similar to creating the table at the previous step.&lt;/p&gt;\n&lt;p&gt;Uploading files:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ curl -v -X POST &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/api/v3/create?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/exec.py&amp;amp;type=file\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt;\n&amp;gt; POST /api/v3/create?path=//tmp/yt_examples/exec.py&amp;amp;&lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt;=file HTTP/1.1\n\n&amp;lt; HTTP/1.1 200 OK\n&lt;span class=\"hljs-string\"&gt;\"0-efd-190-88fec34\"&lt;/span&gt;\n\n$ curl -v -L -X PUT &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/api/v3/write_file?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/exec.py\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Transfer-Encoding: chunked\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt; \\\n    -T exec.py\n&amp;gt; PUT /api/v3/write_file?path=//tmp/yt_examples/exec.py HTTP/1.1\n&amp;gt; Expect: 100-&lt;span class=\"hljs-built_in\"&gt;continue&lt;/span&gt;\n\n&amp;lt; HTTP/1.1 100 Continue\n&amp;lt; HTTP/1.1 200 OK\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"153\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-153\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-153\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-153.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;For a file to have execution permissions, the &lt;em&gt;executable&lt;/em&gt; attribute must be set for it.&lt;/p&gt;\n&lt;p&gt;Setting attributes:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ curl -v -L -X PUT &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/api/v3/set?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/exec.py/@executable\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Content-Type: application/json\"&lt;/span&gt; \\\n    --data-binary &lt;span class=\"hljs-string\"&gt;'\"true\"'&lt;/span&gt;\n&amp;gt; PUT /api/v3/set?path=//tmp/yt_examples/exec.py/@executable HTTP/1.1\n\n&amp;lt; HTTP/1.1 200 OK\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"160\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-160\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-160\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-160.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;To check whether the uploaded file is correct, you can read it.&lt;/p&gt;\n&lt;p&gt;Reading the uploaded file:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ curl -v -L -X GET &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_HEAVY_PROXY&lt;/span&gt;/api/v3/read_file?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/exec.py\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt;\n&amp;gt; GET /api/v3/read_file?path=//tmp/yt_examples/exec.py HTTP/1.1\n\n&amp;lt; HTTP/1.1 200 OK\n&lt;span class=\"hljs-comment\"&gt;#!/usr/bin/python&lt;/span&gt;\n\nimport re\nimport sys\nimport itertools\nimport operator\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"167\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-167\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-167\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-167.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If you need to read a range of bytes from a file, you can use the additional &lt;em&gt;offset&lt;/em&gt; and &lt;em&gt;length&lt;/em&gt; parameters of the &lt;em&gt;read_file&lt;/em&gt; command. The parameters are passed through the &lt;code&gt;X-YT-Parameters&lt;/code&gt; header for variety.&lt;/p&gt;\n&lt;p&gt;Reading a range of bytes from a file:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ curl -v -L -X GET &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_HEAVY_PROXY&lt;/span&gt;/api/v3/read_file\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"X-YT-Parameters: {\\\"path\\\": \\\"&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/exec.py\\\", \\\"offset\\\": 11, \\\"length\\\": 6}\"&lt;/span&gt;\n&amp;gt; GET /api/v3/read_file HTTP/1.1\n\n&amp;lt; HTTP/1.1 200 OK\npython\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"174\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-174\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-174\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-174.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"launch_map\"&gt;&lt;a href=\"en/user-guide/proxy/http.html#launch_map\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Running a Map operation&lt;/span&gt;&lt;/a&gt;Running a Map operation&lt;/h2&gt;\n&lt;p&gt;In the YTsaurus system, to run a Map operation, there is a &lt;a href=\"api/commands.html#map\"&gt;command&lt;/a&gt; with the same name. An important thing to consider is the requirement that an output table must exist &lt;strong&gt;before&lt;/strong&gt; an operation is started. You can also create a table using the &lt;a href=\"api/commands.html#create\"&gt;create&lt;/a&gt; command.&lt;/p&gt;\n&lt;p&gt;Creating an output table:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ curl -v -X POST &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/api/v3/create?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/output_map&amp;amp;type=table\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt;\n&amp;gt; POST /api/v3/create?path=//tmp/yt_examples/output_map&amp;amp;&lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt;=table HTTP/1.1\n\n&amp;lt; HTTP/1.1 200 OK\n&lt;span class=\"hljs-string\"&gt;\"0-843-191-ae506abe\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"184\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-184\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-184\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-184.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Now you can run the Map operation. Pay attention to its specification: you can see that running the map command requires a structured set of arguments. In the HTTP interface of the system, you can encode arguments through a query string (which happened in the examples above, see the &lt;em&gt;path&lt;/em&gt; and &lt;em&gt;type&lt;/em&gt; arguments), as well as in the query body for POST queries. The example describes the specification for running in JSON format.&lt;/p&gt;\n&lt;p&gt;Running a Map operation:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; &amp;lt;&amp;lt;&lt;span class=\"hljs-string\"&gt;END | curl -v -X POST \"http://$YT_PROXY/api/v3/map\" \\\n    -H \"Accept: application/json\" -H \"Authorization: OAuth $YT_TOKEN\" \\\n    -H \"Content-Type: application/json\" \\\n    --data-binary @-\n{\n  \"spec\" : {\n    \"mapper\" : {\n      \"command\" : \"python exec.py map\",\n      \"file_paths\" : [ \"$YT_HOME/exec.py\" ],\n      \"format\" : \"dsv\"\n    },\n    \"input_table_paths\" : [ \"$YT_HOME/input\" ],\n    \"output_table_paths\" : [ \"$YT_HOME/output_map\" ]\n  }\n}\nEND&lt;/span&gt;\n&amp;gt; POST /api/v3/map HTTP/1.1\n\n&amp;lt; HTTP/1.1 200 OK\n&lt;span class=\"hljs-string\"&gt;\"381eb9-8eee9ec2-70a8370d-ea39f666\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"191\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-191\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-191\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-191.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Unlike the &lt;code&gt;set&lt;/code&gt; and &lt;code&gt;write_file&lt;/code&gt; operations, the returned GUID of the operation is needed to keep track of the operation status. A successful response from the HTTP interface about running the operation indicates that the operation was started, but not that it was completed correctly.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;You can view the operation status in the web interface or by calling &lt;code&gt;get_operation&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Viewing the operation status:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ curl -v -X GET &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/api/v3/get_operation?operation_id=381eb9-8eee9ec2-70a8370d-ea39f666\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt;\n&amp;gt; GET /api/v3/get_operation?operation_id=381eb9-8eee9ec2-70a8370d-ea39f666 HTTP/1.1\n\n&amp;lt; HTTP/1.1 200 OK\n{\n  &lt;span class=\"hljs-string\"&gt;\"operation_type\"&lt;/span&gt; : &lt;span class=\"hljs-string\"&gt;\"map\"&lt;/span&gt;,\n  &lt;span class=\"hljs-string\"&gt;\"progress\"&lt;/span&gt; : {\n    &lt;span class=\"hljs-string\"&gt;\"jobs\"&lt;/span&gt; : { &lt;span class=\"hljs-string\"&gt;\"total\"&lt;/span&gt; : 1, &lt;span class=\"hljs-string\"&gt;\"pending\"&lt;/span&gt; : 0, &lt;span class=\"hljs-string\"&gt;\"running\"&lt;/span&gt; : 0, &lt;span class=\"hljs-string\"&gt;\"completed\"&lt;/span&gt; : 1, &lt;span class=\"hljs-string\"&gt;\"failed\"&lt;/span&gt; : 0 },\n    &lt;span class=\"hljs-string\"&gt;\"chunks\"&lt;/span&gt; : { &lt;span class=\"hljs-string\"&gt;\"total\"&lt;/span&gt; : 1,&lt;span class=\"hljs-string\"&gt;\"running\"&lt;/span&gt; : 0, &lt;span class=\"hljs-string\"&gt;\"completed\"&lt;/span&gt; : 1, &lt;span class=\"hljs-string\"&gt;\"pending\"&lt;/span&gt; : 0, &lt;span class=\"hljs-string\"&gt;\"failed\"&lt;/span&gt; : 0 },\n    ...\n  },\n  &lt;span class=\"hljs-string\"&gt;\"state\"&lt;/span&gt; : &lt;span class=\"hljs-string\"&gt;\"completed\"&lt;/span&gt;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"208\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-208\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-208\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-208.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;To make sure that the operation was completed correctly, you can read its result.&lt;/p&gt;\n&lt;p&gt;Reading data:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ curl -v -L -X GET &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_HEAVY_PROXY&lt;/span&gt;/api/v3/read_table?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/output_map\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: text/tab-separated-values\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt; \\\n  | &lt;span class=\"hljs-built_in\"&gt;head&lt;/span&gt;\n&amp;gt; GET /api/v3/read?path=//tmp/yt_examples/output_map HTTP/1.1\n\n\n&amp;lt; HTTP/1.1 202 Accepted\nword=html count=1\nword=&lt;span class=\"hljs-built_in\"&gt;head&lt;/span&gt; count=1\nword=title  count=1\nword=михаил count=1\nword=булгаков count=1\nword=белая  count=1\nword=гвардия  count=1\nword=title  count=1\nword=&lt;span class=\"hljs-built_in\"&gt;head&lt;/span&gt; count=1\nword=body count=1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"215\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-215\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-215\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-215.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"launch_sort\"&gt;&lt;a href=\"en/user-guide/proxy/http.html#launch_sort\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Running sorting&lt;/span&gt;&lt;/a&gt;Running sorting&lt;/h2&gt;\n&lt;p&gt;To run sorting, use the &lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;sort&lt;/a&gt; command which is a bit like &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt; and &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt; in its input specification.&lt;/p&gt;\n&lt;p&gt;Running sorting:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Creating an output table&lt;/span&gt;\n$ curl -v -X POST &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/api/v3/create?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/output_sort&amp;amp;type=table\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt;\n&amp;gt; POST /api/v3/create?path=//tmp/yt_examples/output_map&amp;amp;&lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt;=table HTTP/1.1\n\n&amp;lt; HTTP/1.1 200 OK\n&lt;span class=\"hljs-string\"&gt;\"0-95d-191-8901298a\"&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Running sorting&lt;/span&gt;\n$ &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; &amp;lt;&amp;lt;&lt;span class=\"hljs-string\"&gt;END | curl -v -X POST \"http://$YT_PROXY/api/v3/sort\" \\\n    -H \"Accept: application/json\" -H \"Authorization: OAuth $YT_TOKEN\" \\\n    -H \"Content-Type: application/json\" \\\n    --data-binary @-\n{\n  \"spec\" : {\n    \"input_table_paths\" : [ \"$YT_HOME/output_map\" ],\n    \"output_table_path\" : \"$YT_HOME/output_sort\",\n    \"sort_by\" : [ \"word\" ]\n  }\n}\nEND&lt;/span&gt;\n&amp;gt; POST /api/v3/sort HTTP/1.1\n\n&amp;lt; HTTP/1.1 200 OK\n&lt;span class=\"hljs-string\"&gt;\"640310-da8d54f1-6eded631-31c91e76\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"225\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-225\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-225\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-225.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You can monitor the operation execution process in the web interface.&lt;/p&gt;\n&lt;h2 id=\"launch_reduce\"&gt;&lt;a href=\"en/user-guide/proxy/http.html#launch_reduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Running a Reduce operation&lt;/span&gt;&lt;/a&gt;Running a Reduce operation&lt;/h2&gt;\n&lt;p&gt;The Reduce operation is started using the &lt;a href=\"api/commands.html#reduce\"&gt;command&lt;/a&gt; with the same name.&lt;/p&gt;\n&lt;p&gt;Running a Reduce operation:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Creating an output table&lt;/span&gt;\n$ curl -v -X POST &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/api/v3/create?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/output_reduce&amp;amp;type=table\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt;\n&amp;gt; POST /api/v3/create?path=//tmp/yt_examples/output_reduce&amp;amp;&lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt;=table HTTP/1.1\n\n&amp;lt; HTTP/1.1 200 OK\n&lt;span class=\"hljs-string\"&gt;\"0-95f-191-ba3a4055\"&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Running reduce&lt;/span&gt;\n$ &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; &amp;lt;&amp;lt;&lt;span class=\"hljs-string\"&gt;END | curl -v -X POST \"http://$YT_PROXY/api/v3/reduce\" \\\n    -H \"Accept: application/json\" -H \"Authorization: OAuth $YT_TOKEN\" \\\n    -H \"Content-Type: application/json\" \\\n    --data-binary @-\n{\n  \"spec\" : {\n    \"reducer\" : {\n      \"command\" : \"python exec.py reduce\",\n      \"file_paths\" : [ \"$YT_HOME/exec.py\" ],\n      \"format\" : \"dsv\"\n    },\n    \"input_table_paths\" : [ \"$YT_HOME/output_sort\" ],\n    \"output_table_paths\" : [ \"$YT_HOME/output_reduce\" ],\n    \"sort_by\" : [ \"word\" ],\n    \"reduce_by\" : [ \"word\" ]\n  }\n}\nEND&lt;/span&gt;\n&amp;gt; POST /api/v3/reduce HTTP/1.1\n\n&amp;lt; HTTP/1.1 200 OK\n&lt;span class=\"hljs-string\"&gt;\"658ad8-edf7650f-182e4fd0-a1a0fd03\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"238\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-238\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-238\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-238.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"read_results\"&gt;&lt;a href=\"en/user-guide/proxy/http.html#read_results\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reading the result&lt;/span&gt;&lt;/a&gt;Reading the result&lt;/h2&gt;\n&lt;p&gt;After you complete the operation, you will get calculated statistics on the frequency of word usage in \"The White Guard\".&lt;br /&gt;\nLet's look at its result.&lt;/p&gt;\n&lt;p&gt;Reading the result:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ curl -v -L -X GET &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_HEAVY_PROXY&lt;/span&gt;/api/v3/read_table?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/output_reduce\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: text/tab-separated-values\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt; \\\n  | &lt;span class=\"hljs-built_in\"&gt;head&lt;/span&gt;\n&amp;gt; GET /api/v3/read_table?path=//tmp/yt_examples/output_reduce HTTP/1.1\n\n&amp;lt; HTTP/1.1 200 OK\ncount=1 word=0\ncount=1 word=04\ncount=1 word=05\ncount=4 word=1\ncount=2 word=10\ncount=4 word=11\ncount=4 word=12\ncount=4 word=13\ncount=3 word=14\ncount=2 word=15\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"248\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-248\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-248\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-248.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/proxy/http.md","sourcePath":"en/user-guide/proxy/http.md"},"headings":[{"title":"Setup","href":"en/user-guide/proxy/http.html#prepare","level":2},{"title":"Uploading data","href":"en/user-guide/proxy/http.html#upload","level":2},{"title":"Uploading files","href":"en/user-guide/proxy/http.html#uploading-files","level":2},{"title":"Running a Map operation","href":"en/user-guide/proxy/http.html#launch_map","level":2},{"title":"Running sorting","href":"en/user-guide/proxy/http.html#launch_sort","level":2},{"title":"Running a Reduce operation","href":"en/user-guide/proxy/http.html#launch_reduce","level":2},{"title":"Reading the result","href":"en/user-guide/proxy/http.html#read_results","level":2}],"title":"HTTP proxy"},"router":{"pathname":"en/user-guide/proxy/http","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
