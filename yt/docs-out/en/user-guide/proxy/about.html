        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section contains information about the different interfaces for working with the YTsaurus system: &lt;a href=\"en/user-guide/proxy/about.html#http_proxy\"&gt;HTTP&lt;/a&gt; and &lt;a href=\"en/user-guide/proxy/about.html#rpc_proxy\"&gt;RPC&lt;/a&gt; proxies.&lt;/p&gt;\n&lt;h2 id=\"http_proxy\"&gt;&lt;a href=\"en/user-guide/proxy/about.html#http_proxy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HTTP proxy&lt;/span&gt;&lt;/a&gt;HTTP proxy&lt;/h2&gt;\n&lt;p&gt;&lt;strong&gt;HTTP proxy&lt;/strong&gt; is a universal language-agnostic interface to work with YTsaurus.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The low-level HTTP API is not a good choice for writing simple and reliable application code. Using it will require you to correctly log queries and label their correlation IDs, balance the load on the proxy, acquire additional explicit locks on tables, handle errors, repeat actions in some cases, and so on.&lt;/p&gt;\n&lt;p&gt;We strongly recommend using our supported SDKs for your language (for example, for &lt;a href=\"api/python/start.html\"&gt;Python&lt;/a&gt; or &lt;a href=\"api/cpp/description.html\"&gt;С++&lt;/a&gt;) that already address these issues.&lt;/p&gt;\n&lt;p&gt;To work in the console, you should use the &lt;a href=\"api/cli/cli.html\"&gt;CLI&lt;/a&gt; instead of sending direct HTTP requests.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Each HTTP proxy is assigned a certain role that specifies which kind of load the proxy will handle.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Cypress requests (e.g. &lt;code&gt;get&lt;/code&gt;, &lt;code&gt;set&lt;/code&gt;, &lt;code&gt;create&lt;/code&gt;) are relatively light and processed by control HTTP proxies, the &lt;code&gt;control&lt;/code&gt; proxy role.&lt;/li&gt;\n&lt;li&gt;Read or write requests (for example, &lt;code&gt;read-table&lt;/code&gt;, &lt;code&gt;write-table&lt;/code&gt;) can potentially transfer a significantly larger amount of data, resulting in a bigger load on YTsaurus cluster nodes. Such queries are therefore processed by so-called heavy proxies (data proxies), the &lt;code&gt;data&lt;/code&gt; role.&lt;/li&gt;\n&lt;li&gt;Individual processes can use their own roles so that their load does not interfere with other processes.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Client SDKs typically hide role-related operations. The only thing you may need to do is to specify the role in the client configuration if you need a non-standard role for heavy queries. However, when working directly with HTTP, light and heavy queries should be sent to different hosts. If you send a heavy query via a light HTTP proxy, the server will return an error. For more information, see &lt;a href=\"user-guide/proxy/http-reference.html#hosts\"&gt;List of heavy proxies&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;To get examples of how to interract with YTsaurus via the HTTP interface, check the &lt;a href=\"user-guide/proxy/http.html\"&gt;HTTP proxy&lt;/a&gt; section.&lt;/p&gt;\n&lt;p&gt;For reference information about the HTTP proxy, see &lt;a href=\"user-guide/proxy/http-reference.html\"&gt;HTTP proxy reference&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"rpc_proxy\"&gt;&lt;a href=\"en/user-guide/proxy/about.html#rpc_proxy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RPC proxy&lt;/span&gt;&lt;/a&gt;RPC proxy&lt;/h2&gt;\n&lt;p&gt;&lt;strong&gt;RPC proxy&lt;/strong&gt; is a special interface for interacting with YTsaurus via the RPC protocol. The RPC proxy is accessed via TCP, port 9013. What basically distinguishes the RPC proxy from the HTTP proxy:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Higher query processing speed achieved due to the following features:\n&lt;ul&gt;\n&lt;li&gt;Work with the RPC proxy is performed using a special internal protocol that is better suited for working with a large number of concurrent queries.&lt;/li&gt;\n&lt;li&gt;In the RPC proxy, a query is sent in native YTsaurus format and does not require additional time and resources for conversion.&lt;/li&gt;\n&lt;li&gt;The ability to maintain compatibility at the user code level with changes in the protocol of interaction of components within a YTsaurus cluster.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Like HTTP proxies, all RPC proxies are divided into roles. The role is specified in connection configuration and allows to balance the user load. The default rpc proxy role is &lt;code&gt;default&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The following programming languages are supported:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"user-guide/proxy/rpc.html#c_plus_plus\"&gt;C++&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/proxy/rpc.html#java\"&gt;Java&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/proxy/rpc.html#python\"&gt;Python&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Examples are available for each programming language.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/proxy/about.md","sourcePath":"en/user-guide/proxy/about.md"},"headings":[{"title":"HTTP proxy","href":"en/user-guide/proxy/about.html#http_proxy","level":2},{"title":"RPC proxy","href":"en/user-guide/proxy/about.html#rpc_proxy","level":2}],"title":"Proxy"},"router":{"pathname":"en/user-guide/proxy/about","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
