        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;The YTsaurus web interface allows to upload small Microsoft Excel spreadsheets into static YTsaurus tables and export data from strict-schema static tables as Microsoft Excel spreadsheets.&lt;/p&gt;\n&lt;h2 id=\"upload-to-a-new-table\"&gt;&lt;a href=\"en/user-guide/excel.html#upload-to-a-new-table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Upload to a new table&lt;/span&gt;&lt;/a&gt;Upload to a new table&lt;/h2&gt;\n&lt;p&gt;To upload data and create a YTsaurus table at the same time, use the &lt;strong&gt;Create object&lt;/strong&gt; menu on the directory page.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/excel_upload_create.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;p&gt;Be sure to set the &lt;strong&gt;Column names&lt;/strong&gt; and the &lt;strong&gt;Types&lt;/strong&gt; toggles to the correct values in the upload menu.&lt;/p&gt;\n&lt;p&gt;With enabled &lt;strong&gt;Column names&lt;/strong&gt;, column names are displayed in the first row of an Excel spreadsheet. If a spreadsheet doesn't have a header row, the Excel column names, such as A, B, C, and so on, are used as column names in the YTsaurus table.&lt;/p&gt;\n&lt;p&gt;With enabled &lt;strong&gt;Types&lt;/strong&gt;, there's a row with types. The row with types must follow the row with column names (if present). Types are defined in the &lt;code&gt;type&lt;/code&gt; format (see &lt;a href=\"en/user-guide/excel.html#type-mapping\"&gt;type mapping&lt;/a&gt;).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;If no types are specified, all columns use &lt;code&gt;any&lt;/code&gt; as their type.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"images/excel_upload.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;h2 id=\"uploading-into-an-existing-table\"&gt;&lt;a href=\"en/user-guide/excel.html#uploading-into-an-existing-table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Uploading into an existing table&lt;/span&gt;&lt;/a&gt;Uploading into an existing table&lt;/h2&gt;\n&lt;p&gt;To upload data into an existing YTsaurus table, click the &lt;strong&gt;Upload&lt;/strong&gt; button on the table page.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/excel_upload_existing.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The Excel spreadsheet must include columns from the YTsaurus table schema. Additional columns in the Excel spreadsheet are ignored.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Use the &lt;strong&gt;Append&lt;/strong&gt; toggle in the upload menu to choose the upload mode. The on state corresponds to rows being appended at the end of the YTsaurus table, the off state means that the table will be overwritten.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/excel_upload_append.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;h2 id=\"upload-limitations\"&gt;&lt;a href=\"en/user-guide/excel.html#upload-limitations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Upload limitations&lt;/span&gt;&lt;/a&gt;Upload limitations&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Only the first sheet of an Excel workbook is uploaded.&lt;/li&gt;\n&lt;li&gt;Maximum number of rows is &lt;code&gt;1,048,576&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Maximum number of columns is &lt;code&gt;16,384&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Maximum input file size is 50 MB.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"downloading\"&gt;&lt;a href=\"en/user-guide/excel.html#downloading\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Downloading&lt;/span&gt;&lt;/a&gt;Downloading&lt;/h2&gt;\n&lt;p&gt;The interface provides a way to specify the required row and column subset.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/excel_download.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;p&gt;The first row of the output contains column names, while the second one their types.&lt;/p&gt;\n&lt;h3 id=\"limitations\"&gt;&lt;a href=\"en/user-guide/excel.html#limitations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Limitations&lt;/span&gt;&lt;/a&gt;Limitations&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;Strict-schema static tables.&lt;/li&gt;\n&lt;li&gt;Maximum number of rows is &lt;code&gt;1,048,574&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Maximum number of columns is &lt;code&gt;16,384&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Maximum output file size is 50 MB.&lt;/li&gt;\n&lt;li&gt;Maximum string length in a cell is &lt;code&gt;32,767&lt;/code&gt;; Strings longer than &lt;code&gt;32,767&lt;/code&gt; are truncated.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"type-mapping\"&gt;&lt;a href=\"en/user-guide/excel.html#type-mapping\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Type mapping&lt;/span&gt;&lt;/a&gt;Type mapping&lt;/h3&gt;\n&lt;p&gt;Microsoft Excel supports &lt;a href=\"http://johnatten.com/2011/10/03/microsoft-excel-basics-part-ii-data-types-in-excel/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;4 data types&lt;/a&gt;: &lt;code&gt;Logical&lt;/code&gt;, &lt;code&gt;Number&lt;/code&gt;, &lt;code&gt;Text&lt;/code&gt;, and &lt;code&gt;Error&lt;/code&gt;.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;YTsaurus data type description&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Representation in &lt;code&gt;type&lt;/code&gt;&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Representation in &lt;code&gt;type_v3&lt;/code&gt;&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Representation in Excel&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;An integer within the range &lt;code&gt;[-2^63, 2^63-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/user-guide/excel.html#number*\"&gt;Number*&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;An integer within the range &lt;code&gt;[-2^31, 2^31-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int32&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int32&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Number&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;An integer within the range &lt;code&gt;[-2^15, 2^15-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int16&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int16&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Number&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;An integer within the range &lt;code&gt;[-2^7, 2^7-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Number&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;An integer within the range &lt;code&gt;[0, 2^64-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/user-guide/excel.html#number*\"&gt;Number*&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;An integer within the range &lt;code&gt;[0, 2^32-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint32&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint32&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Number&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;An integer within the range &lt;code&gt;[0, 2^16-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint16&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint16&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Number&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;An integer within the range &lt;code&gt;[0, 2^8-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Number&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;A 4-byte real number&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;float&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;float&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/user-guide/excel.html#number*\"&gt;Number*&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;An 8-byte real number&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;double&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;double&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/user-guide/excel.html#number*\"&gt;Number*&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Standard &lt;code&gt;true/false&lt;/code&gt; Boolean&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;boolean&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt; (different from &lt;code&gt;type&lt;/code&gt;)&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Logical&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;A random sequence of bytes&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/user-guide/excel.html#text*\"&gt;Text*&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;A valid UTF-8 sequence&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;utf8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;utf8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/user-guide/excel.html#text*\"&gt;Text*&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;An integer within the range &lt;code&gt;[0, 49673 - 1]&lt;/code&gt;&lt;br /&gt; that represents the number of days since the Unix epoch,&lt;br /&gt; with a representable date range of &lt;code&gt;[1970-01-01, 2105-12-31]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;date&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;date&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/user-guide/excel.html#number**\"&gt;Number**&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;An integer within the range &lt;code&gt;[0, 49673 * 86400 - 1]&lt;/code&gt;&lt;br /&gt; that represents the number of seconds since the Unix epoch,&lt;br /&gt; with a representable time range of&lt;br /&gt;&lt;code&gt;[1970-01-01T00:00:00Z, 2105-12-31T23:59:59Z]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;datetime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;datetime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/user-guide/excel.html#number**\"&gt;Number**&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;An integer within the range &lt;code&gt;[0, 49673 * 86400 * 10^6 - 1]&lt;/code&gt;&lt;br /&gt; that represents the number of microseconds since the Unix epoch,&lt;br /&gt; with a representable time range of&lt;br /&gt;&lt;code&gt;[1970-01-01T00:00:00Z, 2105-12-31T23:59:59.999999Z]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;timestamp&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;timestamp&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/user-guide/excel.html#number***\"&gt;Number***&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;An integer within the range &lt;br /&gt;&lt;code&gt;[-49673 * 86400 * 10^6 + 1, 49673 * 86400 * 10^6 - 1]&lt;/code&gt;&lt;br /&gt; that represents the number of microseconds between two timestamps&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;interval&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;interval&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/user-guide/excel.html#number*\"&gt;Number*&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;An arbitrary YSON structure&lt;br /&gt; that is represented as a byte sequence&lt;br /&gt; and can't have a &lt;code&gt;required=%true&lt;/code&gt; attribute&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;any&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;yson&lt;/code&gt; (different from &lt;code&gt;type&lt;/code&gt;)&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/user-guide/excel.html#text**\"&gt;Text**&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"number*\"&gt;&lt;a href=\"en/user-guide/excel.html#number*\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Number*&lt;/span&gt;&lt;/a&gt;Number*&lt;/h4&gt;\n&lt;p&gt;&lt;code&gt;Number&lt;/code&gt; is a Double-Precision Floating Point value.&lt;/p&gt;\n&lt;p&gt;The number can have only &lt;a href=\"https://stackoverflow.com/questions/38522197/converting-the-text-data-to-a-int64-format-in-excel\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;15 digits&lt;/a&gt;. When entering &lt;code&gt;99999999999999999&lt;/code&gt; (&lt;code&gt;10^17-1&lt;/code&gt;), the cell displays &lt;code&gt;99999999999999900&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Numbers exceeding this limit are exported as strings.&lt;/p&gt;\n&lt;h4 id=\"number**\"&gt;&lt;a href=\"en/user-guide/excel.html#number**\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Number**&lt;/span&gt;&lt;/a&gt;Number**&lt;/h4&gt;\n&lt;p&gt;The value from the YTsaurus table is written to an Excel table cell as the &lt;code&gt;Number&lt;/code&gt; type, without loss of accuracy. The &lt;code&gt;date&lt;/code&gt; and &lt;code&gt;datetime&lt;/code&gt; types are exported as &lt;code&gt;Number&lt;/code&gt; with special display formats and appear in Excel as:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;date&lt;/code&gt; — &lt;code&gt;2020-12-05&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;datetime&lt;/code&gt; — &lt;code&gt;2000-12-10 10:22:17&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"number***\"&gt;&lt;a href=\"en/user-guide/excel.html#number***\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Number***&lt;/span&gt;&lt;/a&gt;Number***&lt;/h4&gt;\n&lt;p&gt;The value can't fit in &lt;code&gt;Number&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;Timestamp&lt;/code&gt; in milliseconds is exported as &lt;code&gt;Number&lt;/code&gt; with special display formats (&lt;code&gt;1969-12-30 00:00:00&lt;/code&gt;). For smaller units, it comes out as a string in the following format: &lt;code&gt;2006-01-02T15:04:05.999999Z&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"text*\"&gt;&lt;a href=\"en/user-guide/excel.html#text*\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Text*&lt;/span&gt;&lt;/a&gt;Text*&lt;/h4&gt;\n&lt;p&gt;&lt;code&gt;Text&lt;/code&gt; is a string type. Maximum strings length in a cell is &lt;code&gt;32,768&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;In YTsaurus, a string may be longer: up to &lt;code&gt;128 * 10^6&lt;/code&gt;. Long strings are truncated.&lt;/p&gt;\n&lt;h4 id=\"text**\"&gt;&lt;a href=\"en/user-guide/excel.html#text**\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Text**&lt;/span&gt;&lt;/a&gt;Text**&lt;/h4&gt;\n&lt;p&gt;Values are serialized as &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON&lt;/a&gt;. Long strings are truncated like in &lt;code&gt;Text*&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"missing-values\"&gt;&lt;a href=\"en/user-guide/excel.html#missing-values\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Missing values&lt;/span&gt;&lt;/a&gt;Missing values&lt;/h3&gt;\n&lt;p&gt;For missing values of &lt;code&gt;optional&lt;/code&gt; types, an empty string is added to the cell.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/excel.md","sourcePath":"en/user-guide/excel.md"},"headings":[{"title":"Upload to a new table","href":"en/user-guide/excel.html#upload-to-a-new-table","level":2},{"title":"Uploading into an existing table","href":"en/user-guide/excel.html#uploading-into-an-existing-table","level":2},{"title":"Upload limitations","href":"en/user-guide/excel.html#upload-limitations","level":2},{"title":"Downloading","href":"en/user-guide/excel.html#downloading","level":2,"items":[{"title":"Limitations","href":"en/user-guide/excel.html#limitations","level":3},{"title":"Type mapping","href":"en/user-guide/excel.html#type-mapping","level":3,"items":[{"title":"Number*","href":"en/user-guide/excel.html#number*","level":4},{"title":"Number**","href":"en/user-guide/excel.html#number**","level":4},{"title":"Number***","href":"en/user-guide/excel.html#number***","level":4},{"title":"Text*","href":"en/user-guide/excel.html#text*","level":4},{"title":"Text**","href":"en/user-guide/excel.html#text**","level":4}]},{"title":"Missing values","href":"en/user-guide/excel.html#missing-values","level":3}]}],"title":"Working with Microsoft Excel tables"},"router":{"pathname":"en/user-guide/excel","depth":3,"base":"../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
