        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"introduction\"&gt;&lt;a href=\"en/user-guide/query-tracker/system-python-udf.html#introduction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Introduction&lt;/span&gt;&lt;/a&gt;Introduction&lt;/h2&gt;\n&lt;p&gt;Sometimes it can be difficult to describe data processing tasks using only a declarative language like SQL. You may find it more convenient to use an imperative language as well. For this purpose, YQL supports the creation and use of user-defined functions (UDFs).&lt;/p&gt;\n&lt;h2 id=\"python-udf\"&gt;&lt;a href=\"en/user-guide/query-tracker/system-python-udf.html#python-udf\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Python UDF&lt;/span&gt;&lt;/a&gt;Python UDF&lt;/h2&gt;\n&lt;p&gt;With the Python UDF feature, you can define and use Python functions inside a query.&lt;/p&gt;\n&lt;h2 id=\"how-to-use\"&gt;&lt;a href=\"en/user-guide/query-tracker/system-python-udf.html#how-to-use\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How to use&lt;/span&gt;&lt;/a&gt;How to use&lt;/h2&gt;\n&lt;p&gt;To use a Python UDF in a YQL query, follow these steps:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Define your function in a Python script and include this script as a string in your query. This function will be called as a UDF.&lt;/li&gt;\n&lt;li&gt;In your query, declare the function name and its signature (input and output data types).&lt;/li&gt;\n&lt;li&gt;Call the function in the query body and pass the necessary arguments to it.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Each of these steps is explained in detail below.&lt;/p&gt;\n&lt;h3 id=\"write-python-script\"&gt;&lt;a href=\"en/user-guide/query-tracker/system-python-udf.html#write-python-script\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Write Python script&lt;/span&gt;&lt;/a&gt;Write Python script&lt;/h3&gt;\n&lt;p&gt;You can add your script as:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Regular string literal. For example, &lt;code&gt;$script = \"def foo(): return 'bar'\"&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Multi-line string literal (YQL extension). You must enclose this literal in the &lt;code&gt;@@&lt;/code&gt; characters, which are similar to triple quotes in Python. The &lt;code&gt;#py&lt;/code&gt; comment enables Python syntax highlighting in the YQL editor:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$script = @@#py\ndef foo():\n    return b'bar'\n@@\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"54\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-54\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-54\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-54.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Named file attached to the query. You can include the file content in your query by using the &lt;a href=\"yql/builtins/basic.html#file-content-path\"&gt;FileContent&lt;/a&gt; function. For example, &lt;code&gt;$script = FileContent(\"foo.py\")&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"declare-function-name-and-signature\"&gt;&lt;a href=\"en/user-guide/query-tracker/system-python-udf.html#declare-function-name-and-signature\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Declare function name and signature&lt;/span&gt;&lt;/a&gt;Declare function name and signature&lt;/h3&gt;\n&lt;p&gt;Since Python is a dynamically typed language and YQL is statically typed, you need to define the types in advance. The name and signature of the function called from the Python script must be known before executing a YQL query. If the types you declare in the function signature do not match the actual data that the function returns, you get a runtime error.&lt;/p&gt;\n&lt;p&gt;Example of declaring a function name and signature:&lt;br /&gt;\n&lt;code&gt;$f = SystemPython3_8::foo(Callable&amp;lt;()-&amp;gt;String&amp;gt;, $script);&lt;/code&gt;. In this example:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;$f&lt;/code&gt; and &lt;code&gt;$script&lt;/code&gt;: &lt;a href=\"yql/syntax/expressions.html#named-nodes\"&gt;Named YQL expressions&lt;/a&gt;.\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;$f&lt;/code&gt;: Ready-to-use function.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;$script&lt;/code&gt;: Python script mentioned in the previous section.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;SystemPython3_8::&lt;/code&gt;: Fixed prefix for declaring a Python function. &lt;code&gt;System&lt;/code&gt; means that Python will be taken from the environment at runtime. &lt;code&gt;3_8&lt;/code&gt; indicates the Python version to be used.\n&lt;ul&gt;\n&lt;li&gt;As of the time of writing this article, versions &lt;code&gt;3_8&lt;/code&gt; – &lt;code&gt;3_12&lt;/code&gt; are available.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;foo&lt;/code&gt;: Name of the function to be called, defined in the &lt;code&gt;$script&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Callable&amp;lt;()-&amp;gt;String&amp;gt;&lt;/code&gt;: Function signature description. The empty brackets indicate that the function doesn't accept any arguments. &lt;code&gt;String&lt;/code&gt; after the arrow means that the function returns a string. Example of a function signature with arguments: &lt;code&gt;Callable&amp;lt;(String, Uint32)-&amp;gt;Double&amp;gt;&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"use-udf-in-your-query\"&gt;&lt;a href=\"en/user-guide/query-tracker/system-python-udf.html#use-udf-in-your-query\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Use UDF in your query&lt;/span&gt;&lt;/a&gt;Use UDF in your query&lt;/h3&gt;\n&lt;p&gt;You can call the function obtained after declaring the signature in the same way as any other built-in YQL function. For example, &lt;code&gt;$f()&lt;/code&gt; or &lt;code&gt;$udf(\"test\", 123)&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"data-types\"&gt;&lt;a href=\"en/user-guide/query-tracker/system-python-udf.html#data-types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data types&lt;/span&gt;&lt;/a&gt;Data types&lt;/h2&gt;\n&lt;p&gt;To find out which data types are allowed in the function signature, see the &lt;a href=\"yql/types/index.html\"&gt;YQL data types&lt;/a&gt; section.&lt;/p&gt;\n&lt;h3 id=\"containers\"&gt;&lt;a href=\"en/user-guide/query-tracker/system-python-udf.html#containers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Containers&lt;/span&gt;&lt;/a&gt;Containers&lt;/h3&gt;\n&lt;p&gt;Containers are converted into Python objects according to the following rules:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Name&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Signature declaration&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Signature example&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Representation in Python&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;List&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;List&amp;lt;Type&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;List&amp;lt;Int32&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list-like object&lt;/code&gt; &lt;a href=\"en/user-guide/query-tracker/system-python-udf.html#python-container-wrappers\"&gt;(learn more)&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Dictionary&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Dict&amp;lt;KeyType,ValueType&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Dict&amp;lt;String,Int32&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;dict-like object&lt;/code&gt; &lt;a href=\"en/user-guide/query-tracker/system-python-udf.html#python-container-wrappers\"&gt;(learn more)&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tuple&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Tuple&amp;lt;Type1,...,TypeN&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Tuple&amp;lt;Int32,Int32&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tuple&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Structure&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Struct&amp;lt;Name1:Type1,...,NameN:TypeN&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Struct&amp;lt;Name:String,Age:Int32&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;StructSequence&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Stream&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Stream&amp;lt;Type&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Stream&amp;lt;Int32&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;generator&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Variant on tuple&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Variant&amp;lt;Type1,Type2&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Variant&amp;lt;Int32,String&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tuple with index and object&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Variant on structure&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Variant&amp;lt;Name1:Type1,Name2:Type2&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Variant&amp;lt;value:Int32,error:String&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tuple with field name and object&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;You can nest containers into each other. For example, &lt;code&gt;List&amp;lt;Tuple&amp;lt;Int32,Int32&amp;gt;&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"python-container-wrappers\"&gt;&lt;a href=\"en/user-guide/query-tracker/system-python-udf.html#python-container-wrappers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Specifics of objects for lists and dictionaries passed to functions&lt;/span&gt;&lt;/a&gt;Specifics of objects for lists and dictionaries passed to functions&lt;/h3&gt;\n&lt;p&gt;When you use &lt;code&gt;List&lt;/code&gt; and &lt;code&gt;Dict&lt;/code&gt;, the read-only &lt;code&gt;yql.TList&lt;/code&gt; and &lt;code&gt;yql.TDict&lt;/code&gt; objects are passed to the function arguments.&lt;/p&gt;\n&lt;p&gt;The object's specifics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;They are read-only. This means that you can't make any changes to these objects without copying them because another part of the current query may use the same object. For example, a neighboring function.&lt;/li&gt;\n&lt;li&gt;At the cost of potentially slow copying, you can get a real list object from them by iterating for partial copying. For dictionaries, you also need to call &lt;code&gt;iteritems()&lt;/code&gt;. By setting the &lt;code&gt;_yql_lazy_input&lt;/code&gt; attribute value to False on the function itself, you can enable automatic copying of lists and dictionaries to \"list\" and \"dict\". This mechanism works recursively for nested containers.&lt;/li&gt;\n&lt;li&gt;To get the number of elements, you can call &lt;code&gt;len(my_arg)&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;To get the latest set of available methods, call &lt;code&gt;dir(my_arg)&lt;/code&gt;. &lt;a href=\"en/user-guide/query-tracker/system-python-udf.html#tlist-methods\"&gt;Example&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The &lt;code&gt;yql.TList&lt;/code&gt; methods:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;has_fast_len()&lt;/code&gt;: Indicates whether you can get the list length quickly. If False is returned, the list is \"lazy\".&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;has_items()&lt;/code&gt;: Checks whether the list is empty.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;reversed()&lt;/code&gt;: Returns a reversed copy of the list.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;skip(n)&lt;/code&gt; and &lt;code&gt;take(n)&lt;/code&gt;: Similar to &lt;code&gt;[n:]&lt;/code&gt; and &lt;code&gt;[:n]&lt;/code&gt; slices, respectively.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;to_index_dict()&lt;/code&gt;: Returns a dictionary with element numbers as keys. This allows you to access these elements by their indices.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example with the &lt;code&gt;_yql_lazy_input&lt;/code&gt; attribute:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$u = SystemPython3_8::list_func(Callable&amp;lt;(List&amp;lt;Int32&amp;gt;)-&amp;gt;Int32&amp;gt;, @@#py\ndef list_func(lst):\n  return lst.count(1)\nlist_func._yql_lazy_input = False\n@@);\nSELECT $u(AsList(1,2,3));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"315\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-315\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-315\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-315.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"environment\"&gt;&lt;a href=\"en/user-guide/query-tracker/system-python-udf.html#environment\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Changing the environment&lt;/span&gt;&lt;/a&gt;Changing the environment&lt;/h2&gt;\n&lt;h3 id=\"interaction-with-python-from-the-environment\"&gt;&lt;a href=\"en/user-guide/query-tracker/system-python-udf.html#interaction-with-python-from-the-environment\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Interaction with Python from the environment&lt;/span&gt;&lt;/a&gt;Interaction with Python from the environment&lt;/h3&gt;\n&lt;p&gt;The &lt;code&gt;SystemPython&lt;/code&gt; UDF is called in a separate operation within a custom script.&lt;/p&gt;\n&lt;p&gt;The interaction with Python is done via the dynamic &lt;code&gt;libpython3.N.so&lt;/code&gt; library, which is linked at runtime. If you replace this library in the environment, it will change the Python used and available libraries.&lt;/p&gt;\n&lt;p&gt;To change the environment from a YQL operation, use the &lt;code&gt;yt.DockerImage&lt;/code&gt; and &lt;a href=\"yql/syntax/pragma/yt.html#ytlayerpaths\"&gt;yt.LayerPaths&lt;/a&gt; pragmas.&lt;/p&gt;\n&lt;p&gt;They will affect the corresponding user script parameters described in the &lt;a href=\"user-guide/data-processing/operations/operations-options.html#user_script_options\"&gt;Operation options - User script options&lt;/a&gt; section.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Default environment&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The default environment used for jobs is configured by the cluster administrator. It may not include the required Python version.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Example of using the TensorFlow library with &lt;code&gt;pragma yt.DockerImage&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;pragma yt.DockerImage = \"docker.io/tensorflow/tensorflow:2.16.1\";\n\n$script = @@#py\nimport sys\nimport tensorflow\n\ndef foo():\n    return \"Python version: \" + sys.version + \".\\nTensorflow version: \" + tensorflow.__version__\n@@;\n\n$udf = SystemPython3_11::foo(Callable&amp;lt;()-&amp;gt;String&amp;gt;, $script);\nSELECT $udf();\n-- Python version: 3.11.0rc1 (main, Aug 12 2022, 10:02:14) [GCC 11.2.0].\n-- Tensorflow version: 2.16.1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"347\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-347\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-347\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-347.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"specifics\"&gt;&lt;a href=\"en/user-guide/query-tracker/system-python-udf.html#specifics\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Specifics&lt;/span&gt;&lt;/a&gt;Specifics&lt;/h2&gt;\n&lt;p&gt;When using UDFs, the standard output (stdout) is used for system purposes. Therefore, you must not use it.&lt;/p&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"en/user-guide/query-tracker/system-python-udf.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h2&gt;\n&lt;h3 id=\"hello-world\"&gt;&lt;a href=\"en/user-guide/query-tracker/system-python-udf.html#hello-world\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hello World&lt;/span&gt;&lt;/a&gt;Hello World&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$script = @@#py\ndef hello(name):\n    return b'Hello, %s!' % name\n@@;\n\n$udf = SystemPython3_8::hello(Callable&amp;lt;(String)-&amp;gt;String&amp;gt;, $script);\n\nSELECT $udf(\"world\"); -- \"Hello, world!\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"360\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-360\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-360\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-360.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"string-and-number-concatenation\"&gt;&lt;a href=\"en/user-guide/query-tracker/system-python-udf.html#string-and-number-concatenation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;String and number concatenation&lt;/span&gt;&lt;/a&gt;String and number concatenation&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$script = @@#py\ndef concat(a, b):\n    return a.decode(\"utf-8\") + str(b)\n@@;\n$concat = SystemPython3_8::concat(Callable&amp;lt;(String?, Int64?)-&amp;gt;String&amp;gt;, $script);\n\nSELECT $concat(name, age) FROM `//tmp/sample`;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"364\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-364\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-364\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-364.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"tlist-methods\"&gt;&lt;a href=\"en/user-guide/query-tracker/system-python-udf.html#tlist-methods\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Retrieving the latest list of  methods&lt;/span&gt;&lt;/a&gt;Retrieving the latest list of &lt;code&gt;yql.TList&lt;/code&gt; methods&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$u = SystemPython3_8::get_dir(Callable&amp;lt;(List&amp;lt;Int32&amp;gt;)-&amp;gt;List&amp;lt;String&amp;gt;&amp;gt;, @@#py\ndef get_dir(lst):\n  return dir(lst)\n@@);\nSELECT $u(AsList());\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"368\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-368\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-368\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-368.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"inferencing-llama\"&gt;&lt;a href=\"en/user-guide/query-tracker/system-python-udf.html#inferencing-llama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Inferencing Llama&lt;/span&gt;&lt;/a&gt;Inferencing Llama&lt;/h3&gt;\n&lt;p&gt;You need an appropriate environment that you can get using the following Dockerfile:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs dockerfile\"&gt;&lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ollama/ollama:&lt;span class=\"hljs-number\"&gt;0.3&lt;/span&gt;.&lt;span class=\"hljs-number\"&gt;9&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;RUN&lt;/span&gt;&lt;span class=\"language-bash\"&gt; apt install -y python3.11 libpython3.11 python3-pip&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;RUN&lt;/span&gt;&lt;span class=\"language-bash\"&gt; python3.11 -m pip install ollama&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"375\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-375\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-375\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-375.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Use the specified image to call Llama from Python:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;pragma yt.DockerImage = \"my.docker.registry/ollama/ollama:0.3.9-with-python3.11-2\";\npragma yt.DefaultMemoryLimit = \"30G\";\npragma yt.OperationSpec = \"{max_failed_job_count=1;mapper={cpu_limit=64}}\";\n\n$script = @@#py\nfrom ollama import Client\nimport subprocess\n\ndef infer_llama(prompt):\n    proc = subprocess.Popen([\"/bin/ollama\", \"serve\"], stdout=subprocess.DEVNULL)\n    client = Client(host='http://localhost:11434')\n    client.pull('llama3.1')\n    response = client.chat(model='llama3.1', messages=[\n        {\n            'role': 'user',\n            'content': str(prompt),\n        },\n    ])\n    proc.kill()\n    return response['message']['content']\n@@;\n$infer_llama = SystemPython3_11::infer_llama(Callable&amp;lt;(String?)-&amp;gt;String&amp;gt;, $script);\n\nselect $infer_llama(\"Why is the sky blue?\");\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"379\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-379\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-379\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-379.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"faq\"&gt;&lt;a href=\"en/user-guide/query-tracker/system-python-udf.html#faq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FAQ&lt;/span&gt;&lt;/a&gt;FAQ&lt;/h2&gt;\n&lt;h3 id=\"i-get-the-error-or\"&gt;&lt;a href=\"en/user-guide/query-tracker/system-python-udf.html#i-get-the-error-or\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;I get the error  or &lt;/span&gt;&lt;/a&gt;I get the error &lt;code&gt;Module not loaded for script type: SystemPython3_8&lt;/code&gt; or &lt;code&gt;Module SystemPython3_8 is not registered&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;This indicates that the cluster doesn't support this functionality. The cluster must have QueryTracker and YqlAgents with an image version no older than &lt;a href=\"https://github.com/ytsaurus/ytsaurus/releases/tag/docker%2Fquery-tracker%2F0.0.8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YTsaurus QueryTracker 0.0.8&lt;/a&gt;. Ask your cluster administrators to update these components.&lt;/p&gt;\n&lt;h3 id=\"i-get-the-error\"&gt;&lt;a href=\"en/user-guide/query-tracker/system-python-udf.html#i-get-the-error\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;I get the error &lt;/span&gt;&lt;/a&gt;I get the error &lt;code&gt;libpython3.8.so.1.0: cannot open shared object file: No such file or directory&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;This indicates that the environment of the job that is executing the function is missing the dynamic library &lt;code&gt;libpython3.8.so.1.0&lt;/code&gt;. Make sure that you're using the same Python version that is used in the job environment. &lt;a href=\"en/user-guide/query-tracker/system-python-udf.html#environment\"&gt;Read more&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;If you're using the &lt;a href=\"yql/syntax/pragma/yt.html#ytdockerimage\"&gt;yt.DockerImage&lt;/a&gt; pragma, make sure that the cluster supports this method of changing the environment. &lt;a href=\"admin-guide/prepare-spec.html#job-environment\"&gt;Read more&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"},{"property":"og:title","content":"Python UDF in YQL"},{"property":"og:description","content":"Python UDF is a feature that allows you to define and use Python functions inside a YQL query."},{"property":"og:type","content":"article"},{"property":"og:url","content":"https://ytsaurus.tech/docs/ru/user-guide/query-tracker/system-python-udf"},{"property":"article:section","content":"QT"},{"property":"article:tag","content":"UDF"},{"property":"article:tag","content":"Python"},{"property":"article:modified_time","content":"2024-09-24T20:00:00+03:00"},{"property":"article:published_time","content":"2024-09-13T20:00:00+03:00"},{"property":"article:author","content":"Alexander Gaev"}],"vcsPath":"en/user-guide/query-tracker/system-python-udf.md","sourcePath":"en/user-guide/query-tracker/system-python-udf.md"},"headings":[{"title":"Introduction","href":"en/user-guide/query-tracker/system-python-udf.html#introduction","level":2},{"title":"Python UDF","href":"en/user-guide/query-tracker/system-python-udf.html#python-udf","level":2},{"title":"How to use","href":"en/user-guide/query-tracker/system-python-udf.html#how-to-use","level":2,"items":[{"title":"Write Python script","href":"en/user-guide/query-tracker/system-python-udf.html#write-python-script","level":3},{"title":"Declare function name and signature","href":"en/user-guide/query-tracker/system-python-udf.html#declare-function-name-and-signature","level":3},{"title":"Use UDF in your query","href":"en/user-guide/query-tracker/system-python-udf.html#use-udf-in-your-query","level":3}]},{"title":"Data types","href":"en/user-guide/query-tracker/system-python-udf.html#data-types","level":2,"items":[{"title":"Containers","href":"en/user-guide/query-tracker/system-python-udf.html#containers","level":3},{"title":"Specifics of objects for lists and dictionaries passed to functions","href":"en/user-guide/query-tracker/system-python-udf.html#python-container-wrappers","level":3}]},{"title":"Changing the environment","href":"en/user-guide/query-tracker/system-python-udf.html#environment","level":2,"items":[{"title":"Interaction with Python from the environment","href":"en/user-guide/query-tracker/system-python-udf.html#interaction-with-python-from-the-environment","level":3}]},{"title":"Specifics","href":"en/user-guide/query-tracker/system-python-udf.html#specifics","level":2},{"title":"Examples","href":"en/user-guide/query-tracker/system-python-udf.html#examples","level":2,"items":[{"title":"Hello World","href":"en/user-guide/query-tracker/system-python-udf.html#hello-world","level":3},{"title":"String and number concatenation","href":"en/user-guide/query-tracker/system-python-udf.html#string-and-number-concatenation","level":3},{"title":"Retrieving the latest list of yql.TList methods","href":"en/user-guide/query-tracker/system-python-udf.html#tlist-methods","level":3},{"title":"Inferencing Llama","href":"en/user-guide/query-tracker/system-python-udf.html#inferencing-llama","level":3}]},{"title":"FAQ","href":"en/user-guide/query-tracker/system-python-udf.html#faq","level":2,"items":[{"title":"I get the error Module not loaded for script type: SystemPython3_8 or Module SystemPython3_8 is not registered","href":"en/user-guide/query-tracker/system-python-udf.html#i-get-the-error-or","level":3},{"title":"I get the error libpython3.8.so.1.0: cannot open shared object file: No such file or directory","href":"en/user-guide/query-tracker/system-python-udf.html#i-get-the-error","level":3}]}],"title":"Python user-defined functions (UDFs) in YQL"},"router":{"pathname":"en/user-guide/query-tracker/system-python-udf","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
