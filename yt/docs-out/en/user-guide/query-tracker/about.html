            {"data":{"leading":false,"html":"&lt;h2 id=\"introduction\"&gt;&lt;a href=\"en/user-guide/query-tracker/about.html#introduction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Introduction&lt;/span&gt;&lt;/a&gt;Introduction&lt;/h2&gt;\n&lt;p&gt;Query Tracker is a YTsaurus component that allows working with the system using human-readable queries in SQL-like languages. The user sends queries to Query Tracker, they are executed by the engine, and the execution result is returned to the user.&lt;/p&gt;\n&lt;p&gt;With Query Tracker, you can:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Send ad hoc queries for execution.&lt;/li&gt;\n&lt;li&gt;Track query execution.&lt;/li&gt;\n&lt;li&gt;Save query results.&lt;/li&gt;\n&lt;li&gt;View query history.&lt;/li&gt;\n&lt;li&gt;Share queries with others.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;See the &lt;a href=\"en/user-guide/query-tracker/about.html#example\"&gt;example of working with Query Tracker&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Queries are defined by engine and text. The engine controls the execution of the query. The query text is engine-specific.&lt;/p&gt;\n&lt;p&gt;In this way, you can process data using different languages and runtime environments whilst honoring the guarantees and performance targets.&lt;/p&gt;\n&lt;h2 id=\"engines\"&gt;&lt;a href=\"en/user-guide/query-tracker/about.html#engines\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Engines&lt;/span&gt;&lt;/a&gt;Engines&lt;/h2&gt;\n&lt;p&gt;Currently supported execution engines include:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"user-guide/dynamic-tables/dyn-query-language.html\"&gt;YT QL&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;A query language built in YT. Only supports dynamic tables.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/index.html\"&gt;YQL&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;Executes the query on YQL agents, which break the query into individual YT operations (map, reduce, ...), start them, then retrieve and return the result.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/data-processing/chyt/about-chyt.html\"&gt;CHYT&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;Executes the query on a clique.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/data-processing/spyt/overview.html\"&gt;SPYT&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;Executes the query on the Spark cluster.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"api\"&gt;&lt;a href=\"en/user-guide/query-tracker/about.html#api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;API&lt;/span&gt;&lt;/a&gt;API&lt;/h2&gt;\n&lt;p&gt;All operations accept the optional &lt;code&gt;query_tracker_stage&lt;/code&gt; parameter that can be used to select the Query Tracker installation where you want your queries to be run. The default value is &lt;code&gt;production&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"start-query\"&gt;&lt;a href=\"en/user-guide/query-tracker/about.html#start-query\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;start_query&lt;/span&gt;&lt;/a&gt;start_query&lt;/h3&gt;\n&lt;p&gt;Sends the query for execution. Returns the query ID.&lt;/p&gt;\n&lt;p&gt;Required parameters:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;engine&lt;/code&gt;: Query execution engine. Supported values are &lt;code&gt;ql&lt;/code&gt;, &lt;code&gt;yql&lt;/code&gt;, &lt;code&gt;chyt&lt;/code&gt;, and &lt;code&gt;spyt&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;query&lt;/code&gt;: Query text.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Optional parameters:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;files&lt;/code&gt;: List of files for the query in YSON format.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;settings&lt;/code&gt;: Additional query parameters in YSON format.\n&lt;ul&gt;\n&lt;li&gt;In &lt;a href=\"user-guide/data-processing/chyt/about-chyt.html\"&gt;CHYT&lt;/a&gt;, you must set a clique alias using the &lt;code&gt;clique&lt;/code&gt; parameter. Default value is the public clique.&lt;/li&gt;\n&lt;li&gt;In &lt;a href=\"user-guide/data-processing/spyt/overview.html\"&gt;SPYT&lt;/a&gt;, you must set the housekeeping directory of an existing Spark cluster using the &lt;code&gt;discovery_path&lt;/code&gt; parameter.&lt;/li&gt;\n&lt;li&gt;In &lt;a href=\"yql/index.html\"&gt;YQL&lt;/a&gt;, you can run queries in different modes using the &lt;code&gt;execution_mode&lt;/code&gt; parameter. Acceptable values are &lt;code&gt;run&lt;/code&gt;, &lt;code&gt;validate&lt;/code&gt;, and &lt;code&gt;optimize&lt;/code&gt;. The default value is &lt;code&gt;run&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;draft&lt;/code&gt;: Used to mark draft queries. These queries are terminated automatically without execution.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;annotations&lt;/code&gt;: Arbitrary annotations to the query. They can make it easier to search for queries. Specified in YSON format.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;access_control_objects&lt;/code&gt;: List of objects at &lt;code&gt;//sys/access_control_object_namespaces/queries/&lt;/code&gt; that controls access to the query for other users.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example: &lt;code&gt;start_query(engine=\"yql\", query=\"SELECT * FROM my_table\", access_control_objects=[\"my_aco\"])&lt;/code&gt;&lt;/p&gt;\n&lt;h3 id=\"abort-query\"&gt;&lt;a href=\"en/user-guide/query-tracker/about.html#abort-query\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;abort_query&lt;/span&gt;&lt;/a&gt;abort_query&lt;/h3&gt;\n&lt;p&gt;Aborts query execution. Doesn't return anything.&lt;/p&gt;\n&lt;p&gt;Required parameters:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;query_id&lt;/code&gt;: Query ID.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Optional parameters:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;message&lt;/code&gt;: Abort message.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example: &lt;code&gt;abort_query(query_id=\"my_query_id\")&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"get-query-result\"&gt;&lt;a href=\"en/user-guide/query-tracker/about.html#get-query-result\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;get_query_result&lt;/span&gt;&lt;/a&gt;get_query_result&lt;/h3&gt;\n&lt;p&gt;Returns meta information about query execution results.&lt;/p&gt;\n&lt;p&gt;Required parameters:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;query_id&lt;/code&gt;: Query ID.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;result_index&lt;/code&gt;: Result ID.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example: &lt;code&gt;get_query_result(query_id=\"my_query_id\", result_index=0)&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"read-query-result\"&gt;&lt;a href=\"en/user-guide/query-tracker/about.html#read-query-result\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;read_query_result&lt;/span&gt;&lt;/a&gt;read_query_result&lt;/h3&gt;\n&lt;p&gt;Returns the query results.&lt;/p&gt;\n&lt;p&gt;Required parameters:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;query_id&lt;/code&gt;: Query ID.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;result_index&lt;/code&gt;: Result ID.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Optional parameters:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;columns&lt;/code&gt;: List of columns to read.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;lower_row_index&lt;/code&gt;: First row from which to start reading the results.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;upper_row_index&lt;/code&gt;: Last row at which to stop reading the results.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example: &lt;code&gt;read_query_result(query_id=\"my_query_id\", result_index=0)&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"get-query\"&gt;&lt;a href=\"en/user-guide/query-tracker/about.html#get-query\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;get_query&lt;/span&gt;&lt;/a&gt;get_query&lt;/h3&gt;\n&lt;p&gt;Returns information about the query.&lt;/p&gt;\n&lt;p&gt;Required parameters:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;query_id&lt;/code&gt;: Query ID.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Optional parameters:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;attributes&lt;/code&gt;: Filters the returned attributes.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;timestamp&lt;/code&gt;: Returned query information will be consistent with the system as at the specified point in time.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example: &lt;code&gt;get_query(query_id=\"my_query_id\")&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"list-queries\"&gt;&lt;a href=\"en/user-guide/query-tracker/about.html#list-queries\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;list_queries&lt;/span&gt;&lt;/a&gt;list_queries&lt;/h3&gt;\n&lt;p&gt;Gets a list of queries that match the set filters.&lt;/p&gt;\n&lt;p&gt;Optional parameters:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;from_time&lt;/code&gt;: Lower threshold for the query start time.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;to_time&lt;/code&gt;: Upper threshold for the query start time.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;cursor_direction&lt;/code&gt;: Direction in which to sort queries by start time.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;cursor_time&lt;/code&gt;: Cursor stop time. Only applicable if &lt;code&gt;cursor_direction&lt;/code&gt; is specified.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;user_filter&lt;/code&gt;: Filter by query creator.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;state_filter&lt;/code&gt;: Filter by query state.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;engine_filter&lt;/code&gt;: Filter by query engine.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;substr_filter&lt;/code&gt;: Filter by query ID, annotations, and &lt;a href=\"en/user-guide/query-tracker/about.html#access-control\"&gt;access control object&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;limit&lt;/code&gt;: Number of items to return. The default value is 100.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;attributes&lt;/code&gt;: Filters the returned attributes.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example: &lt;code&gt;list_queries()&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"alter-query\"&gt;&lt;a href=\"en/user-guide/query-tracker/about.html#alter-query\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;alter_query&lt;/span&gt;&lt;/a&gt;alter_query&lt;/h3&gt;\n&lt;p&gt;Modifies the query. Doesn't return anything.&lt;/p&gt;\n&lt;p&gt;Required parameters:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;query_id&lt;/code&gt;: Query ID.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Optional parameters:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;annotations&lt;/code&gt;: New annotations for the query.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;access_control_objects&lt;/code&gt;: New access control object list for the query.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example: &lt;code&gt;alter_query(query_id=\"my_query_id\", access_control_object=[\"my_new_aco\"])&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"access-control\"&gt;&lt;a href=\"en/user-guide/query-tracker/about.html#access-control\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Access control&lt;/span&gt;&lt;/a&gt;Access control&lt;/h2&gt;\n&lt;p&gt;To manage access to queries and their results, the query includes a list of &lt;code&gt;access_control_objects&lt;/code&gt; strings that point to &lt;code&gt;//sys/access_control_object_namespaces/queries/[access_control_object]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;An Access Control Object (ACO) is an object with the &lt;code&gt;@principal_acl&lt;/code&gt; attribute. It sets access rules in the same manner as &lt;code&gt;@acl&lt;/code&gt; does for Cypress nodes. For more information, see &lt;a href=\"user-guide/storage/access-control.html\"&gt;Access control&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;You can create an ACO through the user interface or by calling the &lt;a href=\"user-guide/storage/cypress-example.html#create\"&gt;create&lt;/a&gt; command:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;yt create access_control_object --attr '{namespace=queries;name=my_aco}'&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;All APIs use ACOs to verify access:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Use&lt;/code&gt; grants access to the query.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Read&lt;/code&gt; grants access to the query results.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Administer&lt;/code&gt; grants the permission to modify and stop the query.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Detailed information on each API method:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;start_query&lt;/code&gt; checks whether the passed ACO exists.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;alter_query&lt;/code&gt; checks whether the query ACO grants the &lt;code&gt;Administer&lt;/code&gt; permission to the user and whether the passed ACO exists.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;get_query&lt;/code&gt; checks whether the query ACO grants the &lt;code&gt;Use&lt;/code&gt; permission to the user.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;list_queries&lt;/code&gt; checks whether the query ACO grants the &lt;code&gt;Use&lt;/code&gt; permission to the user.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;get_query_result&lt;/code&gt; checks whether the query ACO grants the &lt;code&gt;Read&lt;/code&gt; permission to the user.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;read_query_result&lt;/code&gt; checks whether the query ACO grants the &lt;code&gt;Read&lt;/code&gt; permission to the user.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;abort_query&lt;/code&gt; checks whether the query ACO grants the &lt;code&gt;Administer&lt;/code&gt; permission to the user.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;A few things to keep in mind:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The query creator always has access to their queries.&lt;/li&gt;\n&lt;li&gt;If a query has multiple ACOs, you only need to have access to one of them to get access to the query.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;For convenience, \"ytsaurus-k8s-operator\" creates the following ACOs:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;nobody&lt;/code&gt;. Doesn't grant any permissions.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;everyone&lt;/code&gt;. Grants &lt;code&gt;Use&lt;/code&gt; and &lt;code&gt;Read&lt;/code&gt; permissions to all users.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;everyone-use&lt;/code&gt;. Grants &lt;code&gt;Use&lt;/code&gt; permissions to all users.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;everyone-share&lt;/code&gt;. The same as \"everyone\", but is not returned in &lt;code&gt;list_queries&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"example\"&gt;&lt;a href=\"en/user-guide/query-tracker/about.html#example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h2&gt;\n&lt;p&gt;A typical usage scenario for Query Tracker is as follows:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Sending a query for execution.\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;start_query(engine=\"yql\", query=\"SELECT * from //home/me/my_table\", access_control_objects=[\"my_team_aco\"])&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Getting a list of our available queries.\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;list_queries()&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Getting information about our query.\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;get_query(query_id=\"my_query_id\")&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Waiting for the query to complete.\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;get_query(query_id=\"my_query_id\").state == \"completed\"&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Getting meta information about the results (result size, table schema).\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;get_query_result(query_id=\"my_query_id\", result_index=0)&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Reading the result.\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;read_query_result(query_id=\"my_query_id\", result_index=0)&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Changing the ACO of the query to make it accessible to everyone.\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;alter_query(query_id=\"my_query_id\", access_control_objects=[\"everyone\"])&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/query-tracker/about.md","sourcePath":"en/user-guide/query-tracker/about.md"},"headings":[{"title":"Introduction","href":"en/user-guide/query-tracker/about.html#introduction","level":2},{"title":"Engines","href":"en/user-guide/query-tracker/about.html#engines","level":2},{"title":"API","href":"en/user-guide/query-tracker/about.html#api","level":2,"items":[{"title":"start_query","href":"en/user-guide/query-tracker/about.html#start-query","level":3},{"title":"abort_query","href":"en/user-guide/query-tracker/about.html#abort-query","level":3},{"title":"get_query_result","href":"en/user-guide/query-tracker/about.html#get-query-result","level":3},{"title":"read_query_result","href":"en/user-guide/query-tracker/about.html#read-query-result","level":3},{"title":"get_query","href":"en/user-guide/query-tracker/about.html#get-query","level":3},{"title":"list_queries","href":"en/user-guide/query-tracker/about.html#list-queries","level":3},{"title":"alter_query","href":"en/user-guide/query-tracker/about.html#alter-query","level":3}]},{"title":"Access control","href":"en/user-guide/query-tracker/about.html#access-control","level":2},{"title":"Example","href":"en/user-guide/query-tracker/about.html#example","level":2}],"title":"Query Tracker"},"router":{"pathname":"en/user-guide/query-tracker/about","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":
