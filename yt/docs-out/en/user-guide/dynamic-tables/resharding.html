        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section describes ways of sharding dynamic tables. A description of the automatic sharding algorithm is given.&lt;/p&gt;\n&lt;p&gt;Dynamic tables are divided into &lt;a href=\"user-guide/dynamic-tables/overview.html#tablets\"&gt;tablets&lt;/a&gt; (shards), which are the unit of concurrency.&lt;/p&gt;\n&lt;h4 id=\"sorted-tables\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/resharding.html#sorted-tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sorted tables&lt;/span&gt;&lt;/a&gt;Sorted tables&lt;/h4&gt;\n&lt;p&gt;Each tablet of a &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html\"&gt;sorted table&lt;/a&gt; is responsible for a certain range of keys. Tablet boundary keys (also called pivot keys) are available in the &lt;code&gt;pivot_keys&lt;/code&gt; table attribute. A tablet with the &lt;em&gt;k&lt;/em&gt; index is responsible for the keys between the &lt;em&gt;k&lt;/em&gt; boundary key (inclusive) and &lt;em&gt;k&lt;/em&gt;+1 boundary key (not inclusive).&lt;/p&gt;\n&lt;p&gt;Each boundary key consists of a certain prefix of the table's key columns. For example, for a table with three key columns of the types int64, string, and double, the acceptable boundary keys could be &lt;code&gt;[]&lt;/code&gt;, &lt;code&gt;[10]&lt;/code&gt;, &lt;code&gt;[50; foo]&lt;/code&gt;, &lt;code&gt;[100; bar; 1.234]&lt;/code&gt;. The boundary keys of tablets must be strictly ascending. The first boundary key must be empty.&lt;/p&gt;\n&lt;p&gt;When resharding a sorted table, you can either specify the desired boundary keys explicitly or pass the &lt;code&gt;tablet_count&lt;/code&gt; parameter. In the latter case, the system will attempt to split the table evenly into the required number of tablets.&lt;/p&gt;\n&lt;h4 id=\"ordered-tables\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/resharding.html#ordered-tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ordered tables&lt;/span&gt;&lt;/a&gt;Ordered tables&lt;/h4&gt;\n&lt;p&gt;Each tablet of an &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables.html\"&gt;ordered table&lt;/a&gt; is an independent queue. To reshard an ordered table, you must specify the desired number of tablets. For more information, see &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables.html\"&gt;Sharding ordered tables&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"replicated-tables\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/resharding.html#replicated-tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Replicated tables&lt;/span&gt;&lt;/a&gt;Replicated tables&lt;/h4&gt;\n&lt;p&gt;Physically, each tablet of a &lt;a href=\"user-guide/dynamic-tables/replicated-dynamic-tables.html\"&gt;replicated table&lt;/a&gt; is a queue and stores the replication log. Despite this, the sharding logic is the same as for regular tables.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Each tablet of a sorted replicated table is responsible for a particular key range and stores the replication log of keys from that range.&lt;/li&gt;\n&lt;li&gt;Each tablet of an ordered replicated table is an independent queue. For the tablets of a replicated table and the replicas to match, use the &lt;a href=\"user-guide/dynamic-tables/replicated-dynamic-tables#sohranenie-indeksa-tableta-pri-replikacii-uporyadochennoj-tablicy\"&gt;preserve_tablet_index&lt;/a&gt; attribute.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The sharding of a sorted replicated table doesn't have to match the sharding of replicas. Different replicas of the same table can also be sharded in different ways.&lt;/p&gt;\n&lt;p&gt;You can't reshard a non-empty replicated table. To do that, you must recreate the table with the required boundary keys.&lt;/p&gt;\n&lt;h2 id=\"manual-sharding\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/resharding.html#manual-sharding\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manual sharding&lt;/span&gt;&lt;/a&gt;Manual sharding&lt;/h2&gt;\n&lt;p&gt;Use the &lt;a href=\"api/commands.html#reshard_table\"&gt;reshard-table&lt;/a&gt; command to reshard a table. Before running the command, the table must be unmounted.&lt;/p&gt;\n&lt;div class=\"yfm-tabs\" data-diplodoc-group=\"defaultTabsGroup-wuzoqepv\" data-diplodoc-variant=\"regular\"&gt;\n&lt;div class=\"yfm-tab-list\" role=\"tablist\"&gt;\n&lt;div data-diplodoc-id=\"cli\" data-diplodoc-key=\"cli\" class=\"yfm-tab yfm-tab-group active\" role=\"tab\" tabindex=\"0\" data-diplodoc-is-active=\"true\"&gt;CLI&lt;/div&gt;\n&lt;div data-diplodoc-id=\"python\" data-diplodoc-key=\"python\" class=\"yfm-tab yfm-tab-group\" role=\"tab\" tabindex=\"-1\" data-diplodoc-is-active=\"false\"&gt;Python&lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"jns73nxd\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"CLI\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt unmount-table //path --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Reshard with tablet count&lt;/span&gt;\nyt reshard-table //path --tablet-count 10 --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# --enable-slicing is used to pick pivots more precisely in case of small tables&lt;/span&gt;\nyt reshard-table //path --tablet-count 100 --enable-slicing --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# Reshard with pivot keys&lt;/span&gt;\nyt reshard-table //path &lt;span class=\"hljs-string\"&gt;'[]'&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'[10;foo]'&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'[20]'&lt;/span&gt; --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt;\n\nyt mount-table //path --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"64\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-64\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-64\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-64.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"m7ru1tx0\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"Python\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.unmount_table(&lt;span class=\"hljs-string\"&gt;\"//path\"&lt;/span&gt;, sync=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n\n&lt;span class=\"hljs-comment\"&gt;# Reshard with tablet count&lt;/span&gt;\nyt.reshard_table(&lt;span class=\"hljs-string\"&gt;\"//path\"&lt;/span&gt;, tablet_count=&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;, sync=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n\n&lt;span class=\"hljs-comment\"&gt;# enable_slicing is used to pick pivots more precisely in case of small tables&lt;/span&gt;\nyt.reshard_table(&lt;span class=\"hljs-string\"&gt;\"//path\"&lt;/span&gt;, tablet_count=&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;, enable_slicing=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;, sync=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n\n&lt;span class=\"hljs-comment\"&gt;# Reshard with pivot keys&lt;/span&gt;\nyt.reshard_table(&lt;span class=\"hljs-string\"&gt;\"//path\"&lt;/span&gt;, [[], [&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"foo\"&lt;/span&gt;], [&lt;span class=\"hljs-number\"&gt;20&lt;/span&gt;]], sync=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n\nyt.mount_table(&lt;span class=\"hljs-string\"&gt;\"//path\"&lt;/span&gt;, sync=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"67\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-67\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-67\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-67.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;About the \"sync\" parameter&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The \"unmount-table\", \"reshard-table\", and \"mount-table\" commands are asynchronous, so we recommend waiting until execution is complete when using them. For that, you can use the &lt;code&gt;--sync&lt;/code&gt; flag or the &lt;code&gt;sync=True&lt;/code&gt; parameter. In practice, \"unmount-table\" can take a long time to execute, so waiting is required for this command. Typically, \"reshard-table\" and \"mount-table\" are completed instantly, so waiting can be omitted for manual runs, but with scripts it's recommended to use sync.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;When the &lt;code&gt;tablet_count&lt;/code&gt; parameter is specified, the system attempts to automatically select appropriate boundary keys. If the table is relatively small (less than 200 MB per tablet), there may be fewer total tablets than requested. In this case, we recommend using the &lt;a href=\"api/commands.html#reshard_table\"&gt;enable_slicing&lt;/a&gt; option to refine the boundary key search.&lt;/p&gt;\n&lt;p&gt;You can find out the number of tablets via the &lt;code&gt;@tablet_count&lt;/code&gt; attribute.&lt;/p&gt;\n&lt;h2 id=\"hash\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/resharding.html#hash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sharding by hash&lt;/span&gt;&lt;/a&gt;Sharding by hash&lt;/h2&gt;\n&lt;p&gt;To distribute the load evenly, you can use the standard approach: prepend an auxiliary key column that contains the hash of the part of the key to perform sharding for (for example, the hash from the first column). The resulting table will have its keys evenly distributed in the [0, 2&lt;sup&gt;64&lt;/sup&gt; – 1] range.&lt;/p&gt;\n&lt;p&gt;To split it into &lt;em&gt;k&lt;/em&gt; tablets, simply split the [0, 2&lt;sup&gt;64&lt;/sup&gt;-1] range into &lt;em&gt;k&lt;/em&gt; parts. To do this, you can use the \"reshard-table\" command with the &lt;code&gt;--uniform&lt;/code&gt; flag: when &lt;code&gt;tablet_count&lt;/code&gt; is specified, the system will set the boundary keys [], [2&lt;sup&gt;64&lt;/sup&gt; / &lt;em&gt;k&lt;/em&gt;], [2&lt;sup&gt;64&lt;/sup&gt; * 2 / &lt;em&gt;k&lt;/em&gt;], and so on.&lt;/p&gt;\n&lt;p&gt;The value of the key column can be calculated on the client side and transmitted when writing to the table, but computed columns can be used as an alternative.&lt;/p&gt;\n&lt;h3 id=\"expression\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/resharding.html#expression\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Computed columns&lt;/span&gt;&lt;/a&gt;Computed columns&lt;/h3&gt;\n&lt;p&gt;The YTsaurus system supports the feature that automatically calculates the value of a key column using a formula. You must specify this formula in the schema of this column in the &lt;code&gt;expression&lt;/code&gt; field. The key column can only depend on non-calculated key columns. When writing a row or searching for a row by key, the computed columns must be skipped.&lt;/p&gt;\n&lt;p&gt;For even distribution, better specify &lt;code&gt;\"expression\" = \"farm_hash(key)\"&lt;/code&gt; where &lt;code&gt;key&lt;/code&gt; is the prefix of the source key (&lt;code&gt;farm_hash&lt;/code&gt; is a built-in function that calculates &lt;a href=\"https://code.google.com/p/farmhash\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;FarmHash&lt;/a&gt; from arguments).&lt;/p&gt;\n&lt;p&gt;When using automatically computed columns, consider that the &lt;code&gt;select_rows&lt;/code&gt; operation infers the range of affected keys out of the predicate to optimize performance. If some of the values of the computed columns are not specified explicitly in the predicate, YTsaurus will try to supplement the condition with the value of the computed columns. In the current implementation, the result will be successful if those columns on which the calculated one depends are defined in the predicate by an equality or using the &lt;code&gt;IN&lt;/code&gt; operator. Calculation of the explicitly specified values of the computed columns in the range output does not take place.&lt;/p&gt;\n&lt;h4 id=\"example-of-using-compucolumns\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/resharding.html#example-of-using-compucolumns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example of using compucolumns&lt;/span&gt;&lt;/a&gt;Example of using compucolumns&lt;/h4&gt;\n&lt;p&gt;Let's assume there is a table with &lt;code&gt;hash, key, value&lt;/code&gt; columns, &lt;code&gt;hash&lt;/code&gt; and &lt;code&gt;key&lt;/code&gt; are key columns, and the &lt;code&gt;expression = \"farm_hash(key)\"&lt;/code&gt; formula is specified in the schema for &lt;code&gt;hash&lt;/code&gt;. Then for insert, delete, and read operations by key, you only need to specify &lt;code&gt;key&lt;/code&gt; and &lt;code&gt;value&lt;/code&gt;. In order for the &lt;code&gt;select_rows&lt;/code&gt; operation to work efficiently, &lt;code&gt;key&lt;/code&gt; must be exactly specified in the predicate so that the YTsaurus system can calculate which &lt;code&gt;hash&lt;/code&gt; values to consider. For example, you can specify &lt;code&gt;WHERE key = key_value&lt;/code&gt; or &lt;code&gt;WHERE key IN (key_value1, key_value2)&lt;/code&gt; in the query.&lt;/p&gt;\n&lt;p&gt;If you specify &lt;code&gt;WHERE key &amp;gt; key_lower_bound and key &amp;lt; key_upper_bound&lt;/code&gt;, the range for &lt;code&gt;hash&lt;/code&gt; cannot be inferred. In some cases, enumeration of  the values of the computed columns is possible. Enumeration occurs in the following cases:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The expression of the computed column is &lt;code&gt;expression = \"f(key / divisor)\"&lt;/code&gt;  where &lt;code&gt;key&lt;/code&gt; and &lt;code&gt;divisor&lt;/code&gt; are integers. In this case, all such &lt;code&gt;key&lt;/code&gt; values are enumerated and they generate different &lt;code&gt;expression&lt;/code&gt; values. This behavior is generalized in case there are multiple computed columns and multiple &lt;code&gt;key&lt;/code&gt; occurrences with different divisors.&lt;/li&gt;\n&lt;li&gt;The expression is &lt;code&gt;expression = \"f(key) % mod\"&lt;/code&gt;. In this case, the &lt;code&gt;expression&lt;/code&gt; values within the &lt;code&gt;mod&lt;/code&gt; value are enumerated, and the &lt;code&gt;null&lt;/code&gt; value is also included in the enumeration.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;If both enumeration methods can be applied, the one that generates the least number of values is chosen. The total number of keys generated by the enumeration is limited by the &lt;code&gt;range_expansion_limit&lt;/code&gt; parameter.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/dynamic-tables/resharding.md","sourcePath":"en/user-guide/dynamic-tables/resharding.md"},"headings":[{"title":"Manual sharding","href":"en/user-guide/dynamic-tables/resharding.html#manual-sharding","level":2},{"title":"Sharding by hash","href":"en/user-guide/dynamic-tables/resharding.html#hash","level":2,"items":[{"title":"Computed columns","href":"en/user-guide/dynamic-tables/resharding.html#expression","level":3,"items":[{"title":"Example of using compucolumns","href":"en/user-guide/dynamic-tables/resharding.html#example-of-using-compucolumns","level":4}]}]}],"title":"Sharding"},"router":{"pathname":"en/user-guide/dynamic-tables/resharding","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
