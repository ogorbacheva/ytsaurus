        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section describes an example of creating a simple web service using dynamic tables.&lt;/p&gt;\n&lt;p&gt;Backend for a small comment storage and display service will be built within the example. You can consider it to be a simplified analog of &lt;a href=\"https://www.reddit.com\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Reddit&lt;/a&gt;.&lt;br /&gt;\nFor this purpose, an HTTP-based stateless service will be developed on top of a consistent, fault-tolerant, and scalable repository of topics, comments, and likes.&lt;/p&gt;\n&lt;p&gt;Technologies and tools used:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Service source code in Python 3.4 and higher.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/dynamic-tables/replicated-dynamic-tables.html\"&gt;Replicated dynamic YTsaurus tables&lt;/a&gt; in synchronous replication mode will be used as a repository. Work with dynamic tables is implemented via the RPC proxy.&lt;/li&gt;\n&lt;li&gt;The &lt;a href=\"http://flask.pocoo.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Flask&lt;/a&gt; framework will be used as the basis for the HTTP API.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;This example does not stipulate the development of the following components: authorization, rate limiting, and service monitorings.&lt;br /&gt;\nThe described example is intended primarily as an introduction to the use and capabilities of dynamic YTsaurus tables, not for the development of production high-load web services in Python.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Click &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/examples/comment_service\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;here&lt;/a&gt; to download code examples.&lt;/p&gt;\n&lt;h2 id=\"designing\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#designing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Designing&lt;/span&gt;&lt;/a&gt;Designing&lt;/h2&gt;\n&lt;p&gt;Service requirements:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;All comments stored in the service must relate to one of the topics.&lt;/li&gt;\n&lt;li&gt;Comments within a topic must be organized as a tree. Each comment, except for the root comment of the topic, must have one parent.&lt;/li&gt;\n&lt;li&gt;Each comment must be characterized by the &lt;code&gt;parent_path&lt;/code&gt; string. It is the path from the ancestor IDs of a given comment in the tree.&lt;/li&gt;\n&lt;li&gt;The username, number of views, and creation time must be stored for each comment.&lt;/li&gt;\n&lt;li&gt;The API must enable you to:\n&lt;ul&gt;\n&lt;li&gt;Create, edit, and delete comments.&lt;/li&gt;\n&lt;li&gt;Select all topic comments or a subtree of comments within a topic.&lt;/li&gt;\n&lt;li&gt;Select the most recent comments by a given user.&lt;/li&gt;\n&lt;li&gt;Select the most recently added topics.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Expected characteristics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Up to 50,000 comments within a topic.&lt;/li&gt;\n&lt;li&gt;A typical comment is no more than tens of thousands of characters.&lt;/li&gt;\n&lt;li&gt;The service must be horizontally scalable by load (RPS) and data volume.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"api\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;API methods&lt;/span&gt;&lt;/a&gt;API methods&lt;/h3&gt;\n&lt;p&gt;In case of POST requests, the request parameters are passed in the request body as a JSON document. In GET requests — as an URL. In all cases, the request result or error comes in the response body as a JSON document. Possible HTTP response codes:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;HTTP code&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;200&lt;/td&gt;\n&lt;td&gt;The GET/POST request was successfully complete.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;201&lt;/td&gt;\n&lt;td&gt;The value was successfully added.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;400&lt;/td&gt;\n&lt;td&gt;Incorrect request. For example, some mandatory parameters were not set.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;404&lt;/td&gt;\n&lt;td&gt;The object or objects for a specified criterion were not found. For example, an attempt to add a comment to a non-existing topic.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;409&lt;/td&gt;\n&lt;td&gt;Conflict when making changes to a dynamic table.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;503&lt;/td&gt;\n&lt;td&gt;The service is currently unable to process the request. For example, the meta-cluster is updated and/or the dynamic tables were unmounted.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;524&lt;/td&gt;\n&lt;td&gt;Timeout exceeded when working with dynamic tables.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;In case of any error with 4xx and 5xx codes, a JSON document in the &lt;code&gt;{\"error\" : \"message\"}&lt;/code&gt; form comes in the response body.&lt;/p&gt;\n&lt;p&gt;Writing data — adding, editing, deleting comments — will be implemented via &lt;code&gt;POST&lt;/code&gt;, reading — via &lt;code&gt;GET&lt;/code&gt;. &lt;code&gt;guid&lt;/code&gt; is used as a comment ID: this approach will ensure an even load on dynamic table shards.&lt;/p&gt;\n&lt;h4 id=\"call_signatures\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#call_signatures\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Call signatures&lt;/span&gt;&lt;/a&gt;Call signatures&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;POST: /post_comment&lt;/code&gt;: Adding a comment.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Parameter name&lt;/th&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Required parameter&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;topic_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;guid&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;If the topic ID is not specified, a new topic is created.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parent_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;Path to the parent comment. Can be specified if &lt;code&gt;topic_id&lt;/code&gt; is not specified.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;content&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Comment content.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Username.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If successful, code 201 and a document in the &lt;code&gt;{\"comment_id\" : \"&amp;lt;guid&amp;gt;\", \"new_topic\" : True | False} &lt;/code&gt; form are returned.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;POST: /edit_comment&lt;/code&gt;: Editing a comment.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Parameter name&lt;/th&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Required parameter&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;topic_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;guid&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Topic ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parent_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Comment path.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;content&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;New comment content.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;If successful, code 200 and an empty document are returned.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;POST: /delete_comment&lt;/code&gt;: Deleting a comment. The comment is not actually deleted from the database in order not not to violate the tree comment structure. Instead, a special flag is set in the comment parameters and it means that the comment was deleted, after which the comment can no longer be edited.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Parameter name&lt;/th&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Required parameter&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;topic_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;guid&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Topic ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parent_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Comment path.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;If successful, code 200 and an empty document are returned.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;GET: /topic_comments&lt;/code&gt;: Getting a comment in the topic. A view counter is stored for each comment and it is incremented by one each time a topic comment is requested.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Parameter name&lt;/th&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Required parameter&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;topic_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;guid&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Topic ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parent_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;The path to the root comment can be specified if only a subtree of comments for a specified topic is to be obtained.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;If successful, code 200 and a document with a list of the following comments are returned:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n  &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"comment_id\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"&amp;lt;id&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"parent_id\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"&amp;lt;id&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"content\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"&amp;lt;large_text&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"user\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"&amp;lt;user_name&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"view_count\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"&amp;lt;N&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"update_time\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"&amp;lt;UTC_time&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"deleted\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"True|False\"&lt;/span&gt;\n  &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"comment_id\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&amp;lt;id&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"parent_id\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&amp;lt;id&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"content\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&amp;lt;large_text&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"user\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&amp;lt;user_name&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"view_count\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &amp;lt;N&amp;gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"update_time\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&amp;lt;UTC_time&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"deleted\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; True|False&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"467\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-467\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-467\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-467.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Returned comments are sorted by &lt;code&gt;parent_path&lt;/code&gt;, so the responses to the comment come immediately after it and are ordered by creation time.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;GET: /last_user_comments&lt;/code&gt;: Get a list of user comments sorted in reverse chronological order. It is assumed that there will be a page in the service web interface where the user can view all their comments.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Parameter name&lt;/th&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Required parameter&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Username.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;Limiting the number of returned comments.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;UTC_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;Return only those comments with &lt;code&gt;update_time&lt;/code&gt; greater than  this parameter. The &lt;code&gt;from_time&lt;/code&gt; parameter is specifically used instead of &lt;code&gt;offset&lt;/code&gt;, because the YTsaurus query language does not support the &lt;code&gt;OFFSET&lt;/code&gt; keyword in queries.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;If successful, code 200 and a document with a list of the following comments are returned:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"comment_id\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&amp;lt;id&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"topic_id\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&amp;lt;id&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"content\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&amp;lt;large_text&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"user\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &amp;lt;user_name&amp;gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"view_count\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &amp;lt;N&amp;gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"update_time\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &amp;lt;UTC_time&amp;gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"543\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-543\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-543\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-543.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;GET: /last_topics&lt;/code&gt;: Get the topics in which comments have recently been updated. A topic is a root comment. It is assumed that this request will be used by the homepage of the service and the list will be shared by all users. Pagination support is required.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Parameter name&lt;/th&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Required parameter&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;Limit on the number of returned topics.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;UTC_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;Return only those comments with &lt;code&gt;update_time&lt;/code&gt; greater than  this parameter. The &lt;code&gt;from_time&lt;/code&gt; parameter is specifically used instead of &lt;code&gt;offset&lt;/code&gt;, because the YTsaurus query language does not support the &lt;code&gt;OFFSET&lt;/code&gt; keyword in queries.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;If successful, code 200 and a document with a list of the following comments are returned:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"topic_id\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&amp;lt;id&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"content\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&amp;lt;large_text&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"user\"&lt;/span&gt; = &amp;lt;user_name&amp;gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"view_count\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &amp;lt;N&amp;gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"update_time\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &amp;lt;UTC_time&amp;gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"600\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-600\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-600\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-600.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"tables_description\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#tables_description\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Description of data tables&lt;/span&gt;&lt;/a&gt;Description of data tables&lt;/h3&gt;\n&lt;p&gt;You need to define a required set of tables and their schema. When designing the schema, consider the features and limitations of dynamic tables:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Each dynamic table has a unique primary key. You can use the primary key to obtain writes by calling the &lt;code&gt;lookup&lt;/code&gt; command.&lt;/li&gt;\n&lt;li&gt;Dynamic tables support transactions, including those between different tables in the &lt;code&gt;snapshot isolation&lt;/code&gt; model.&lt;/li&gt;\n&lt;li&gt;Dynamic tables do not support secondary indexes. Efficient searching or filtering is only possible by the prefix of the primary key using the range output mechanism. Otherwise the request may result in full scan of the table.&lt;/li&gt;\n&lt;li&gt;Horizontal scaling of dynamic tables is performed through sharding. A table shard in the system is called a &lt;code&gt;tablet&lt;/code&gt;. It is specified by a continuous range of primary key values. For sharding to be effective, reading and writing must be evenly distributed across the tablets.&lt;/li&gt;\n&lt;li&gt;Secondary indexes can be emulated by creating additional tables by the corresponding primary key. In this case, the master table and the index table must be written to within the same transaction.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The main table needed to store content — &lt;code&gt;topic_comments&lt;/code&gt; — is needed. Read queries to such a table will be generally limited to a single topic, so we recommend making the topic ID the first key component. You can output consecutive integers as the topic ID or generate them based on the current time. However, this will mean that when new topics are created, they will be given very close numbers, and since new comments are more likely to appear in new topics, the entire writing load will be on one tablet.&lt;br /&gt;\nTherefore, to ensure that the tablets are loaded evenly when the table is scaled, a randomly generated guid is used as the topic ID. The numbers of comments in creation order are used as the IDs i the topic — this can create close keys, but if the size of the topics is not too large, sharding by topic guid should be sufficient.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;parent_path&lt;/code&gt; key column also stores the path to the comment in the topic: for the root comment — its id, and &lt;code&gt;parent_path&lt;/code&gt; of each subsequent comment is derived from &lt;code&gt;parent_path&lt;/code&gt; of its parent by adding &lt;code&gt;/&lt;/code&gt; and the parent ID to it. For example, &lt;code&gt;parent_path&lt;/code&gt; of the comment with the &lt;code&gt;#id1&lt;/code&gt; ID written in response to the root comment with the &lt;code&gt;0&lt;/code&gt; ID is written as &lt;code&gt;0/#id1&lt;/code&gt;. This path arrangement enables you to quickly filter comments in the subtree when calling the &lt;code&gt;topic_comments&lt;/code&gt; method: if &lt;code&gt;parent_path&lt;/code&gt; of the root comment in the subtree is the &lt;code&gt;S&lt;/code&gt; string, &lt;code&gt;parent_path&lt;/code&gt; of its child will have the &lt;code&gt;S/#id1/.../#idN&lt;/code&gt; form. It will contain &lt;code&gt;S&lt;/code&gt; as a prefix. Therefore, if you lexicographically order the comments in the topic by &lt;code&gt;parent_path&lt;/code&gt;, any subtree will correspond to a continuous block of comments starting from the root comment of the subtree. Thus, assigning &lt;code&gt;parent_path&lt;/code&gt; as a key column enables you to avoid performing full scan of the table to select comments in the subtree.&lt;/p&gt;\n&lt;p&gt;The ID of the parent comment is additionally stored for each comment. This is needed to assemble comments into a tree when displaying them. Besides that, the &lt;code&gt;topic_comments&lt;/code&gt; table stores a comment view counter, for which an aggregation column mechanism is used. This mechanism enables you to increment and decrement the value of a column without reading its previous version.&lt;/p&gt;\n&lt;h4 id=\"the-table\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#the-table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;The  table&lt;/span&gt;&lt;/a&gt;The &lt;code&gt;topic_comments&lt;/code&gt; table&lt;/h4&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Column name&lt;/th&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Key column&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;topic_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;guid&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Topic guid.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parent_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Comment path.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;comment_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;Comment ID. Its sequence number when adding to the topic.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parent_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;ID of the comment, in response to which this comment was written. Matches &lt;code&gt;comment_id&lt;/code&gt; for root comments.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;Username of the user who left the comment.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;create_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;Comment creation time in POSIX Time.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;update_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;The time when the comment was last updated in POSIX Time.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;content&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;Text of the comment.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;views_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;Number of views, aggregation column.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;deleted&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;boolean&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;The flag that the comment was deleted.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;To select writes in the &lt;code&gt;/last_user_comments&lt;/code&gt; call, the &lt;code&gt;topic_comments&lt;/code&gt; table is not suitable. User comments may be located in different topics, which means that a full scan of the table is required to execute such a query. YTsaurus does not support secondary indexes, so they also cannot be used.&lt;/p&gt;\n&lt;p&gt;Therefore, a second, auxiliary &lt;code&gt;user_comments&lt;/code&gt; table is required where the username is used as the first primary key component. For reasons of even load balancing in future sharding of the table, add a computed column to the beginning of the key — hash &lt;code&gt;user_name&lt;/code&gt;. The farm_hash function specified in the &lt;code&gt;expression&lt;/code&gt; field in the table schema (see table creation code) is used for hashing.&lt;/p&gt;\n&lt;h4 id=\"the-table1\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#the-table1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;The  table&lt;/span&gt;&lt;/a&gt;The &lt;code&gt;user_comments&lt;/code&gt; table&lt;/h4&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Column name&lt;/th&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Key column&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;hash(user_name)&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Computed column.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Username of the user who left the comment.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;topic_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Topic guid.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parent_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Comment path.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;update_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;The time when the comment was last updated in POSIX Time.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;You need to decide how to process the &lt;code&gt;/last_topics&lt;/code&gt; call efficiently. A simple way is to query the &lt;code&gt;topic_comments&lt;/code&gt; table with grouping by &lt;code&gt;topic_id&lt;/code&gt;. But this approach requires re-running full scan of the largest table. Therefore, it makes sense to create another small &lt;code&gt;topics&lt;/code&gt; table where &lt;code&gt;topic_id&lt;/code&gt; will store the last update time of the topic, i.e. any of its comments.&lt;/p&gt;\n&lt;p&gt;Although this entire table will be viewed, it is much smaller. This will enable you to apply a number of optimizations. For example, upload the entire table into memory or increase the query concurrency by increasing the number of tablets. Moreover, the response to such a query can be cached, because it will be the same for all users. This table will also store the number of comments in the topic so that when a new comment is added, its ID can be obtained.&lt;/p&gt;\n&lt;h4 id=\"the-table2\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#the-table2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;The  table&lt;/span&gt;&lt;/a&gt;The &lt;code&gt;topic&lt;/code&gt; table&lt;/h4&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Column name&lt;/th&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Key column&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;topic_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Topic guid.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;update_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;The time when the comment was last updated in the topic.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;comment_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;Number of comments in the topic, including deleted comments.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"tables_preparation\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#tables_preparation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Creating and mounting tables&lt;/span&gt;&lt;/a&gt;Creating and mounting tables&lt;/h2&gt;\n&lt;p&gt;This example uses synchronous replication with one synchronous and one asynchronous replica and automatic replica mode switching. This mode provides the strictest consistency guarantees as with unreplicated dynamic tables and does not require manual replica mode switching.&lt;/p&gt;\n&lt;p&gt;Creating a replicated table includes the following steps:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Creating a special &lt;code&gt;replicated_table&lt;/code&gt; object on the meta-cluster.&lt;/li&gt;\n&lt;li&gt;Creating replica tables on other clusters and their corresponding &lt;code&gt;table_replica&lt;/code&gt; objects on the meta-cluster.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;All tables must be created with the same schema. The &lt;code&gt;ssd_blobs&lt;/code&gt; medium is used to store data. The choice of an SSD medium is driven by the required timings and meta cluster write flow. All replicas will first be created in&lt;code&gt;async&lt;/code&gt; mode. After the tables are mounted, the synchronous replica will be selected automatically.&lt;/p&gt;\n&lt;p&gt;The actions described above can be performed either via the CLI — via the &lt;code&gt;yt create&lt;/code&gt; and &lt;code&gt;yt set&lt;/code&gt; commands — or via Python wrapper.&lt;/p&gt;\n&lt;p&gt;For this example, a script was written to create the required tables. This script reads the required parameters in the command line arguments. This enables you to use the script both production and testing environments. Script parameters:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;meta_cluster&lt;/code&gt;: A cluster with a replicated table.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;replica_clusters&lt;/code&gt;: Clusters with replicas.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;path&lt;/code&gt;: Path to the project working directory.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;force&lt;/code&gt;: A flag used to re-create tables if they already exist. Without it, no changes will be made.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example of running the script after building it via &lt;code&gt;ya make&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;./create_tables --path //path/to/directory/ --meta_cluster &amp;lt;meta_cluster_name&amp;gt; --replica_clusters &amp;lt;replica1-cluster-name&amp;gt; &amp;lt;replica2-cluster-name&amp;gt; --force\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1033\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1033\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1033\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1033.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"service-quotas\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#service-quotas\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Service quotas&lt;/span&gt;&lt;/a&gt;Service quotas&lt;/h2&gt;\n&lt;p&gt;Create a dedicated tablet_cell_bundle and an account with an SSD quota. To ensure fault-tolerance of the service, you should have 3 clusters: a meta-cluster and 2 replica clusters. But for training purposes, you can perform all operations on a single cluster. It will act as a meta-cluster and two replicas (synchronous and asynchronous).&lt;/p&gt;\n&lt;h2 id=\"development\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#development\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Developing service code&lt;/span&gt;&lt;/a&gt;Developing service code&lt;/h2&gt;\n&lt;h3 id=\"installing-the-required-packages\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#installing-the-required-packages\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Installing the required packages&lt;/span&gt;&lt;/a&gt;Installing the required packages&lt;/h3&gt;\n&lt;p&gt;Install &lt;a href=\"http://flask.pocoo.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Flask&lt;/a&gt; and &lt;a href=\"https://wtforms.readthedocs.io\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;WTForms&lt;/a&gt;. WTForms will be used to validate parameters.&lt;/p&gt;\n&lt;p&gt;Installation commands:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;sudo&lt;/span&gt; pip install flask\n&lt;span class=\"hljs-built_in\"&gt;sudo&lt;/span&gt; pip install wtforms\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1052\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1052\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1052\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1052.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"defining-the-required-functions\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#defining-the-required-functions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Defining the required functions&lt;/span&gt;&lt;/a&gt;Defining the required functions&lt;/h3&gt;\n&lt;p&gt;Environment variables will be used to pass parameters to the program. This approach will then enable the application to be easily moved from the testing environment to the production environment.&lt;/p&gt;\n&lt;p&gt;The required environment variables:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;CLUSTER&lt;/code&gt;: The name of the cluster on which replicated tables are stored.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;TABLE_PATH&lt;/code&gt;: Path to the directory with tables.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Setting the required environment variables:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; CLUSTER=&amp;lt;cluster-name&amp;gt;\n&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; TABLE_PATH=//path/to/directory\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1077\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1077\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1077\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1077.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Create a function to add comment information to all tables. It can also be used when editing comments and when adding a comment for an example.&lt;/p&gt;\n&lt;h3 id=\"implementing-the-call\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#implementing-the-call\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Implementing the  call&lt;/span&gt;&lt;/a&gt;Implementing the &lt;code&gt;find_comment&lt;/code&gt; call&lt;/h3&gt;\n&lt;p&gt;T function to search for comments in the table takes the &lt;code&gt;topic_id&lt;/code&gt; and &lt;code&gt;parent_path&lt;/code&gt; values as arguments. This enables you to quickly find a comment using the &lt;code&gt;lookup_rows&lt;/code&gt; method, because the values of all key columns of the &lt;code&gt;topic_comments&lt;/code&gt; table are known.&lt;/p&gt;\n&lt;p&gt;An example of getting information about the recently added comments:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-comment\"&gt;# -*- coding: utf-8 -*-&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; json\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; os\n\n\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;find_comment&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;topic_id, parent_path, client, table_path&lt;/span&gt;):\n    &lt;span class=\"hljs-comment\"&gt;# In lookup_rows you need to pass the values of all key columns&lt;/span&gt;\n    &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(client.lookup_rows(\n        &lt;span class=\"hljs-string\"&gt;\"{}/topic_comments\"&lt;/span&gt;.&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(table_path),\n        [{&lt;span class=\"hljs-string\"&gt;\"topic_id\"&lt;/span&gt;: topic_id, &lt;span class=\"hljs-string\"&gt;\"parent_path\"&lt;/span&gt;: parent_path}],\n    ))\n\n\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;main&lt;/span&gt;():\n    table_path = os.environ[&lt;span class=\"hljs-string\"&gt;\"TABLE_PATH\"&lt;/span&gt;]\n    &amp;lt;cluster-name&amp;gt; = os.environ[&lt;span class=\"hljs-string\"&gt;\"CLUSTER\"&lt;/span&gt;]\n    client = yt.YtClient(cluster_name, config={&lt;span class=\"hljs-string\"&gt;\"backend\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"rpc\"&lt;/span&gt;})\n\n    comment_info = find_comment(\n        topic_id=&lt;span class=\"hljs-string\"&gt;\"1dd64501-4131025-562332a3-40507acc\"&lt;/span&gt;,\n        parent_path=&lt;span class=\"hljs-string\"&gt;\"0\"&lt;/span&gt;,\n        client=client, table_path=table_path,\n    )\n    &lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;(json.dumps(comment_info, indent=&lt;span class=\"hljs-number\"&gt;4&lt;/span&gt;))\n\n\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; __name__ == &lt;span class=\"hljs-string\"&gt;\"__main__\"&lt;/span&gt;:\n    main()\n\n&lt;span class=\"hljs-string\"&gt;\"\"\"\nProgram output:\n\n[\n    {\n        \"update_time\": 100000,\n        \"views_count\": 0,\n        \"parent_id\": 0,\n        \"deleted\": false,\n        \"comment_id\": 0,\n        \"creation_time\": 100000,\n        \"content\": \"Some comment text\",\n        \"parent_path\": \"0\",\n        \"user\": \"abc\",\n        \"topic_id\": \"1dd64501-4131025-562332a3-40507acc\"\n    }\n]\n\"\"\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1090\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1090\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1090\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1090.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"implementing-the-call1\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#implementing-the-call1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Implementing the  call&lt;/span&gt;&lt;/a&gt;Implementing the &lt;code&gt;post_comment&lt;/code&gt; call&lt;/h3&gt;\n&lt;p&gt;The first implementation of the &lt;code&gt;post_comment&lt;/code&gt; call is a function that takes all parameters as arguments and returns a JSON string as a response. The dynamic table queries are gathered into a single transaction. Added exception processing when accessing the YTsaurus system.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-comment\"&gt;# -*- coding: utf-8 -*-&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; os\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; json\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; time\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; datetime &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; datetime\n\n\n&lt;span class=\"hljs-comment\"&gt;# Auxiliary function to get the number of comments in a topic from the topic_id table&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# If the specified topic can't be found in the table, returns None&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;get_topic_size&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;client, table_path, topic_id&lt;/span&gt;):\n    topic_info = &lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(client.lookup_rows(\n        &lt;span class=\"hljs-string\"&gt;\"{}/topics\"&lt;/span&gt;.&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(table_path), [{&lt;span class=\"hljs-string\"&gt;\"topic_id\"&lt;/span&gt;: topic_id}],\n    ))\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;not&lt;/span&gt; topic_info:\n        &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;None&lt;/span&gt;\n    &lt;span class=\"hljs-keyword\"&gt;assert&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;len&lt;/span&gt;(topic_info) == &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;)\n    &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; topic_info[&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"comment_count\"&lt;/span&gt;]\n\n\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;post_comment&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;client, table_path, user, content, topic_id=&lt;span class=\"hljs-literal\"&gt;None&lt;/span&gt;, parent_id=&lt;span class=\"hljs-literal\"&gt;None&lt;/span&gt;&lt;/span&gt;):\n    &lt;span class=\"hljs-comment\"&gt;# Handle the YtResponseError exception that occurs if the operation fails&lt;/span&gt;\n    &lt;span class=\"hljs-keyword\"&gt;try&lt;/span&gt;:\n        &lt;span class=\"hljs-comment\"&gt;# Adding a comment involves executing several queries of different types,&lt;/span&gt;\n        &lt;span class=\"hljs-comment\"&gt;# so they need to be assembled into a single transaction to ensure atomicity&lt;/span&gt;\n        &lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; client.Transaction(&lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"tablet\"&lt;/span&gt;):\n            new_topic = &lt;span class=\"hljs-keyword\"&gt;not&lt;/span&gt; topic_id\n            &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; new_topic:\n                topic_id = yt.common.generate_uuid()\n                comment_id = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n                parent_id = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n                parent_path = &lt;span class=\"hljs-string\"&gt;\"0\"&lt;/span&gt;\n            &lt;span class=\"hljs-keyword\"&gt;else&lt;/span&gt;:\n                &lt;span class=\"hljs-comment\"&gt;# The comment_id field is assigned the comment's order in the topic as its value&lt;/span&gt;\n                &lt;span class=\"hljs-comment\"&gt;# This number matches the current size of the topic&lt;/span&gt;\n                comment_id = get_topic_size(topic_id)\n                &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;not&lt;/span&gt; comment_id:\n                    &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; json.dumps({&lt;span class=\"hljs-string\"&gt;\"error\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"There is no topic with id {}\"&lt;/span&gt;.&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(topic_id)})\n\n                parent_info = find_comment(topic_id, parent_path, client, table_path)\n                &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;not&lt;/span&gt; parent_info:\n                    &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; json.dumps({&lt;span class=\"hljs-string\"&gt;\"error\"&lt;/span&gt; : &lt;span class=\"hljs-string\"&gt;\"There is no comment {} in topic {}\"&lt;/span&gt;.&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(parent_id, topic_id)})\n                parent_id = parent_info[&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"comment_id\"&lt;/span&gt;]\n                parent_path = &lt;span class=\"hljs-string\"&gt;\"{}/{}\"&lt;/span&gt;.&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(parent_path, comment_id)\n\n            creation_time = &lt;span class=\"hljs-built_in\"&gt;int&lt;/span&gt;(time.mktime(datetime.now().timetuple()))\n            insert_comments([{\n                &lt;span class=\"hljs-string\"&gt;\"topic_id\"&lt;/span&gt;: topic_id,\n                &lt;span class=\"hljs-string\"&gt;\"comment_id\"&lt;/span&gt;: comment_id,\n                &lt;span class=\"hljs-string\"&gt;\"parent_id\"&lt;/span&gt;: parent_id,\n                &lt;span class=\"hljs-string\"&gt;\"parent_path\"&lt;/span&gt;: parent_path,\n                &lt;span class=\"hljs-string\"&gt;\"user\"&lt;/span&gt;: user,\n                &lt;span class=\"hljs-string\"&gt;\"creation_time\"&lt;/span&gt;: creation_time,\n                &lt;span class=\"hljs-string\"&gt;\"update_time\"&lt;/span&gt;: creation_time,\n                &lt;span class=\"hljs-string\"&gt;\"content\"&lt;/span&gt;: content,\n                &lt;span class=\"hljs-string\"&gt;\"views_count\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;,\n                &lt;span class=\"hljs-string\"&gt;\"deleted\"&lt;/span&gt;: &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;,\n            }], client, table_path)\n\n            result = {&lt;span class=\"hljs-string\"&gt;\"comment_id\"&lt;/span&gt; : comment_id, &lt;span class=\"hljs-string\"&gt;\"new_topic\"&lt;/span&gt; : new_topic, &lt;span class=\"hljs-string\"&gt;\"parent_path\"&lt;/span&gt;: parent_path}\n            &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; new_topic:\n                result[&lt;span class=\"hljs-string\"&gt;\"topic_id\"&lt;/span&gt;] = topic_id\n            &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; json.dumps(result)\n    &lt;span class=\"hljs-keyword\"&gt;except&lt;/span&gt; yt.YtResponseError &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; error:\n        &lt;span class=\"hljs-comment\"&gt;# yt.YtResponseError defines the __str__ method, which returns a detailed error message&lt;/span&gt;\n        json.dumps({&lt;span class=\"hljs-string\"&gt;\"error\"&lt;/span&gt; : &lt;span class=\"hljs-built_in\"&gt;str&lt;/span&gt;(error)})\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1097\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1097\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1097\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1097.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"implementing-the-call2\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#implementing-the-call2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Implementing the  call&lt;/span&gt;&lt;/a&gt;Implementing the &lt;code&gt;user_comments&lt;/code&gt; call&lt;/h3&gt;\n&lt;p&gt;The function includes only one &lt;code&gt;select_rows&lt;/code&gt; query. &lt;code&gt;user_comments&lt;/code&gt; is used as the main table, because it is sorted by the &lt;code&gt;user&lt;/code&gt; field and is most effective for retrieving comments of a specified user. An additional &lt;code&gt;topic_comments&lt;/code&gt; table is connected to this table using &lt;code&gt;JOIN&lt;/code&gt; to get full information about the comments. In the &lt;code&gt;ON&lt;/code&gt; section, &lt;code&gt;topic_id&lt;/code&gt; and &lt;code&gt;parent_path&lt;/code&gt; must be specified explicitly so that the data from the additional table can be retrieved efficiently by key. The &lt;code&gt;WHERE&lt;/code&gt; and &lt;code&gt;LIMIT&lt;/code&gt; sections are used to set the required filters and the &lt;code&gt;ORDER BY&lt;/code&gt; section is used to specify the order in which the most recent comments must return first.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-comment\"&gt;# -*- coding: utf-8 -*-&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; os\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; json\n\n\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;get_last_user_comments&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;client, table_path, user, limit=&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;, from_time=&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;&lt;/span&gt;):\n    &lt;span class=\"hljs-keyword\"&gt;try&lt;/span&gt;:\n        &lt;span class=\"hljs-comment\"&gt;# user_comments is used as the main table that enables you to filter writes by the user field&lt;/span&gt;\n        &lt;span class=\"hljs-comment\"&gt;# An additional topic_comments table is connected via join&lt;/span&gt;\n        &lt;span class=\"hljs-comment\"&gt;# and it enables you to get full information about the omment&lt;/span&gt;\n        comments_info = &lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(client.select_rows(\n            &lt;span class=\"hljs-string\"&gt;\"\"\"\n            topic_comments.topic_id as topic_id,\n            topic_comments.comment_id as comment_id,\n            topic_comments.content as content,\n            topic_comments.user as user,\n            topic_comments.views_count as views_count,\n            topic_comments.update_time as update_time\n            from [{0}/user_comments] as user_comments join [{0}/topic_comments] as topic_comments\n            on (user_comments.topic_id, user_comments.parent_path) =\n            (topic_comments.topic_id, topic_comments.parent_path)\n            where user_comments.user = '{1}' and user_comments.update_time &amp;gt;= {2}\n            order by user_comments.update_time desc\n            limit {3}\"\"\"&lt;/span&gt;.&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(table_path, user, from_time, limit)\n        ))\n        &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; json.dumps(comments_info, indent=&lt;span class=\"hljs-number\"&gt;4&lt;/span&gt;)\n    &lt;span class=\"hljs-keyword\"&gt;except&lt;/span&gt; yt.YtResponseError &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; error:\n        &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; json.dumps({&lt;span class=\"hljs-string\"&gt;\"error\"&lt;/span&gt; : &lt;span class=\"hljs-built_in\"&gt;str&lt;/span&gt;(error)})\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1104\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1104\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1104\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1104.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Running the application. The application is created via &lt;a href=\"http://flask.pocoo.org/docs/1.0/blueprints/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Blueprint application factory&lt;/a&gt;. A special &lt;code&gt;Flask.g&lt;/code&gt; object where the application context is configured is used to pass the &lt;code&gt;client&lt;/code&gt; and &lt;code&gt;table_path&lt;/code&gt; parameters. The connection settings are passed via the &lt;code&gt;HOST&lt;/code&gt; and &lt;code&gt;PORT&lt;/code&gt; environment variables. http://127.0.0.1:5000/ is used by default. Logging is also configured: one message is written to the &lt;code&gt;comment_service.log&lt;/code&gt; file at the start of the query and another one at the end of the query. The YTsaurus system debug logs are redirected to the &lt;code&gt;driver.log&lt;/code&gt; file.&lt;/p&gt;\n&lt;p&gt;A separate YTsaurus client must be created for each query so that it is possible to process queries concurrently in the future. An individual driver version is created for each client, which wastes additional resources. To avoid this problem, one common driver object is created at application initialization and then this object is connected to each created client by specifying the corresponding option in the client.&lt;/p&gt;\n&lt;p&gt;WTForms forms are used to validate query parameters. For each method, you need to create a separate class form that specifies the query parameters, their type, and other issues.&lt;/p&gt;\n&lt;p&gt;It is assumed that the code is saved in the &lt;code&gt;run_application.py&lt;/code&gt; file.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; CLUSTER=&amp;lt;cluster-name&amp;gt;\n&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; TABLE_PATH=//path/to/directory\n&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; HOST=127.0.0.1\n&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; PORT=5000\npython run_application.py\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1117\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1117\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1117\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1117.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Query examples&lt;/span&gt;&lt;/a&gt;Query examples&lt;/h2&gt;\n&lt;p&gt;Use &lt;code&gt;curl&lt;/code&gt; to send queries, use the &lt;code&gt;jq&lt;/code&gt; utility to format JSON output.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Listing 22 — Installing utilities&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;sudo&lt;/span&gt; apt-get install curl\n&lt;span class=\"hljs-built_in\"&gt;sudo&lt;/span&gt; apt-get install jq\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1129\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1129\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1129\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1129.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Listing 23 — Creating topics with multiple comments&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# First topic:&lt;/span&gt;\ncurl - s - X\nPOST - d\n&lt;span class=\"hljs-string\"&gt;'user=abc&amp;amp;content=comment1'&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'http://127.0.0.1:5000/post_comment/'&lt;/span&gt; | jq.\n{\n  &lt;span class=\"hljs-string\"&gt;\"comment_id\"&lt;/span&gt;: 0,\n  &lt;span class=\"hljs-string\"&gt;\"new_topic\"&lt;/span&gt;: &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;,\n  &lt;span class=\"hljs-string\"&gt;\"parent_path\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"0\"&lt;/span&gt;,\n  &lt;span class=\"hljs-string\"&gt;\"topic_id\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"d178dfb1-b721a596-4358abc9-ed93ae6b\"&lt;/span&gt;\n}\n\n\ncurl - s - X\nPOST - d\n&lt;span class=\"hljs-string\"&gt;'user=abc&amp;amp;content=comment2&amp;amp;topic_id=d178dfb1-b721a596-4358abc9-ed93ae6b&amp;amp;parent_path=0'&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'http://127.0.0.1:5000/post_comment/'&lt;/span&gt; | jq.\n{\n  &lt;span class=\"hljs-string\"&gt;\"comment_id\"&lt;/span&gt;: 1,\n  &lt;span class=\"hljs-string\"&gt;\"new_topic\"&lt;/span&gt;: &lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;,\n  &lt;span class=\"hljs-string\"&gt;\"parent_path\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"0/1\"&lt;/span&gt;\n}\n\n\ncurl - s - X\nPOST - d\n&lt;span class=\"hljs-string\"&gt;'user=def&amp;amp;content=comment3&amp;amp;topic_id=d178dfb1-b721a596-4358abc9-ed93ae6b&amp;amp;parent_path=0'&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'http://127.0.0.1:5000/post_comment/'&lt;/span&gt; | jq.\n{\n  &lt;span class=\"hljs-string\"&gt;\"comment_id\"&lt;/span&gt;: 2,\n  &lt;span class=\"hljs-string\"&gt;\"new_topic\"&lt;/span&gt;: &lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;,\n  &lt;span class=\"hljs-string\"&gt;\"parent_path\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"0/2\"&lt;/span&gt;\n}\n\n\n&lt;span class=\"hljs-comment\"&gt;# Second topic:&lt;/span&gt;\ncurl - s - X\nPOST - d\n&lt;span class=\"hljs-string\"&gt;'user=def&amp;amp;content=comment4'&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'http://127.0.0.1:5000/post_comment/'&lt;/span&gt; | jq.\n{\n  &lt;span class=\"hljs-string\"&gt;\"comment_id\"&lt;/span&gt;: 0,\n  &lt;span class=\"hljs-string\"&gt;\"new_topic\"&lt;/span&gt;: &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;,\n  &lt;span class=\"hljs-string\"&gt;\"parent_path\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"0\"&lt;/span&gt;,\n  &lt;span class=\"hljs-string\"&gt;\"topic_id\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"d9de3eac-fa020dab-4299d3b5-cb5fd5b8\"&lt;/span&gt;\n}\n\n\ncurl - s - X\nPOST - d\n&lt;span class=\"hljs-string\"&gt;'user=abc&amp;amp;content=comment5&amp;amp;topic_id=d9de3eac-fa020dab-4299d3b5-cb5fd5b8&amp;amp;parent_path=0'&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'http://127.0.0.1:5000/post_comment/'&lt;/span&gt; | jq.\n{\n  &lt;span class=\"hljs-string\"&gt;\"comment_id\"&lt;/span&gt;: 1,\n  &lt;span class=\"hljs-string\"&gt;\"new_topic\"&lt;/span&gt;: &lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;,\n  &lt;span class=\"hljs-string\"&gt;\"parent_path\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"0/1\"&lt;/span&gt;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1137\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1137\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1137\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1137.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Listing 24 — Editing a comment&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Editing the second comment&lt;/span&gt;\ncurl - s - X\nPOST - d\n&lt;span class=\"hljs-string\"&gt;'topic_id=d178dfb1-b721a596-4358abc9-ed93ae6b&amp;amp;content=new_comment2&amp;amp;parent_path=0/1'&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'http://127.0.0.1:5000/edit_comment/'&lt;/span&gt; | jq.\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1145\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1145\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1145\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1145.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Listing 25 — Deleting a comment&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Deleting the fourth comment (a root one in the second topic). The fifth comment will not be deleted.&lt;/span&gt;\ncurl - s - X\nPOST - d\n&lt;span class=\"hljs-string\"&gt;'topic_id=d9de3eac-fa020dab-4299d3b5-cb5fd5b8&amp;amp;parent_path=0'&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'http://127.0.0.1:5000/delete_comment/'&lt;/span&gt; | jq.\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1153\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1153\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1153\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1153.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Listing 26 — Outputting comments&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Outputting the last two comments made by user abc&lt;/span&gt;\ncurl - s - H @ headers\n&lt;span class=\"hljs-string\"&gt;'http://127.0.0.1:5000/user_comments/?user=abc&amp;amp;limit=2'&lt;/span&gt; | jq.\n[\n  {\n    &lt;span class=\"hljs-string\"&gt;\"comment_id\"&lt;/span&gt;: 1,\n    &lt;span class=\"hljs-string\"&gt;\"content\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"new_comment2\"&lt;/span&gt;,\n    &lt;span class=\"hljs-string\"&gt;\"topic_id\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"d178dfb1-b721a596-4358abc9-ed93ae6b\"&lt;/span&gt;,\n    &lt;span class=\"hljs-string\"&gt;\"update_time\"&lt;/span&gt;: 1564581207,\n    &lt;span class=\"hljs-string\"&gt;\"user\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"abc\"&lt;/span&gt;,\n    &lt;span class=\"hljs-string\"&gt;\"views_count\"&lt;/span&gt;: 0\n  },\n  {\n    &lt;span class=\"hljs-string\"&gt;\"comment_id\"&lt;/span&gt;: 1,\n    &lt;span class=\"hljs-string\"&gt;\"content\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"comment5\"&lt;/span&gt;,\n    &lt;span class=\"hljs-string\"&gt;\"topic_id\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"d9de3eac-fa020dab-4299d3b5-cb5fd5b8\"&lt;/span&gt;,\n    &lt;span class=\"hljs-string\"&gt;\"update_time\"&lt;/span&gt;: 1564581173,\n    &lt;span class=\"hljs-string\"&gt;\"user\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"abc\"&lt;/span&gt;,\n    &lt;span class=\"hljs-string\"&gt;\"views_count\"&lt;/span&gt;: 0\n  }\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1161\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1161\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1161\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1161.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Listing 27 — Outputting a comment subtree&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Outputting all comments in the first topic within the subtree of the second comment (which includes only this comment)&lt;/span&gt;\ncurl - s - H @ headers\n&lt;span class=\"hljs-string\"&gt;'http://127.0.0.1:5000/topic_comments/?topic_id=d178dfb1-b721a596-4358abc9-ed93ae6b&amp;amp;parent_path=0/1'&lt;/span&gt; | jq.\n[\n  {\n    &lt;span class=\"hljs-string\"&gt;\"comment_id\"&lt;/span&gt;: 1,\n    &lt;span class=\"hljs-string\"&gt;\"content\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"new_comment2\"&lt;/span&gt;,\n    &lt;span class=\"hljs-string\"&gt;\"creation_time\"&lt;/span&gt;: 1564581113,\n    &lt;span class=\"hljs-string\"&gt;\"deleted\"&lt;/span&gt;: &lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;,\n    &lt;span class=\"hljs-string\"&gt;\"parent_id\"&lt;/span&gt;: 0,\n    &lt;span class=\"hljs-string\"&gt;\"update_time\"&lt;/span&gt;: 1564581207,\n    &lt;span class=\"hljs-string\"&gt;\"user\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"abc\"&lt;/span&gt;,\n    &lt;span class=\"hljs-string\"&gt;\"views_count\"&lt;/span&gt;: 1\n  }\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16
