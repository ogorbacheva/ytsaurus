Color\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-30\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-30\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-30.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;/div&gt;\n&lt;div id=\"0syn46o7\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"Web interface\"&gt;\n&lt;ul&gt;\n&lt;li&gt;To allow read access and prohibit data write, select &lt;code&gt;Freeze&lt;/code&gt; in the table context menu.&lt;/li&gt;\n&lt;li&gt;To copy a table, select &lt;code&gt;Copy&lt;/code&gt; in the context menu and specify the name of the new table.&lt;/li&gt;\n&lt;li&gt;To allow data write, select &lt;code&gt;Unfreeze&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;\n&lt;div id=\"ae2d74xz\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"MapReduce\"&gt;\n&lt;p&gt;If you need to give data read and write access when copying a table, dump the contents of the dynamic table into the static table and back again. To do this, use the script described in the &lt;a href=\"user-guide/dynamic-tables/mapreduce.html\"&gt;MapReduce for dynamic tables&lt;/a&gt; section.&lt;/p&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/dynamic-tables/tutorials/backup-table.md","sourcePath":"en/user-guide/dynamic-tables/tutorials/backup-table.md"},"headings":[],"title":"Creating a dynamic table backup"},"router":{"pathname":"en/user-guide/dynamic-tables/tutorials/backup-table","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"se
