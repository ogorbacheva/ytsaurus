            {"data":{"leading":false,"html":"&lt;h4 id=\"sticky-transaction\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/faq.html#sticky-transaction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When working with dynamic tables from the Python API or C++ API, I get the \"Sticky transaction 1935-3cb03-4040001-e8723e5a is not found\" error. What should I do?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When working with dynamic tables from the Python API or C++ API, I get the \"Sticky transaction 1935-3cb03-4040001-e8723e5a is not found\" error. What should I do?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The answer depends on how the transactions are used. If a master transaction is used, then this is a pointless action and you must set the query outside the transaction. To do this, you can either create a separate client or explicitly specify that the query must be run under a null transaction (&lt;code&gt;with client.Transaction(transaction_id=\"0-0-0-0\"): ...&lt;/code&gt;).&lt;br /&gt;\nFull use of tablet transactions in Python API is only possible via RPC-proxy (&lt;code&gt;yt.config['backend'] = 'rpc'&lt;/code&gt;). Use of tablet transactions over HTTP is currently not supported.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"tablet-memory\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/faq.html#tablet-memory\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When writing to a dynamic table, the \"Node is out of tablet memory; all writes disabled\" or \"Active store is overflown, all writes disabled\" error occurs. What does it mean and how should I deal with it?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When writing to a dynamic table, the \"Node is out of tablet memory; all writes disabled\" or \"Active store is overflown, all writes disabled\" error occurs. What does it mean and how should I deal with it?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;**A:**The error occurs when the cluster node runs out of memory to store data not written to the disk. The input data stream is too large and the cluster node has no time to compress and write data to the disk. Queries with such errors must be repeated, possibly with an increasing delay. If this is a recurring error, this may mean (except in off-nominal situations) that individual tablets are overloaded with writes or that the cluster's capacity is not sufficient to cope with this load. Increasing the number of tablets can also help (the &lt;code&gt;reshard-table&lt;/code&gt; command).&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"overlapping-stores\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/faq.html#overlapping-stores\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: What does \"Too many overlapping stores\" mean? What should I do?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: What does \"Too many overlapping stores\" mean? What should I do?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; This error is an indication that tablet structure is such that the dynamic store coverage of the key range being serviced by the tablet is too dense. Dense coverage with stores leads to degradation of read performance, so in this situation a protection mechanism is activated that prevents new data from being written. The background compaction and partitioning processes should gradually normalize the tablet structure. If this does not happen, the cluster may be failing to cope with the load.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"block-size-limit\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/faq.html#block-size-limit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When querying a dynamic table, I get the \"Maximum block size limit violated\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When querying a dynamic table, I get the \"Maximum block size limit violated\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The query involves a dynamic table once converted from a static table. The &lt;code&gt;block_size&lt;/code&gt; parameter was not specified. If you receive an error like this, make sure you follow all the instructions from the &lt;a href=\"en/user-guide/dynamic-tables/mapreduce.html\"&gt;section&lt;/a&gt; about converting a static table into a dynamic table. If block size is large, you need to increase &lt;code&gt;max_unversioned_block_size&lt;/code&gt; to 32 MB and re-mount the table. This can happen, if the table's cells store large binary data that are stored in a single block in their entirety.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"overlapping-stores-tablet\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/faq.html#overlapping-stores-tablet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When querying a dynamic table, I get the \"Too many overlapping stores in tablet\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When querying a dynamic table, I get the \"Too many overlapping stores in tablet\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Most likely, the tablet can't cope with the write flow and new chunks don't have time to compact. Check that the table was sharded for a sufficient number of tablets. When writing data to an empty table, disable auto-sharding, because small tablets will be combined into one.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"active-store-overflown\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/faq.html#active-store-overflown\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When querying a dynamic table, I get the \"Active store is overflown, all writes disabled\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When querying a dynamic table, I get the \"Active store is overflown, all writes disabled\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The tablet can't cope with the write flow — it doesn't have time to dump the data to the disk or it can't do it for some reason. Check for errors in the &lt;code&gt;@tablet_errors&lt;/code&gt; table attribute and if there are none, check sharding as above.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"too-many-stores\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/faq.html#too-many-stores\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When querying a dynamic table, I get the \"Too many stores in tablet, all writes disabled\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When querying a dynamic table, I get the \"Too many stores in tablet, all writes disabled\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The tablet is too large. Get the table to have more tablets. Note that &lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html\"&gt;auto-sharding&lt;/a&gt; limits the number of tablets to the number of cells multiplied by the value of the &lt;code&gt;tablet_balancer_config/tablet_to_cell_ratio&lt;/code&gt; parameter.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"tablet-not-known\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/faq.html#tablet-not-known\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When querying a dynamic table, I get the error \"Tablet ... is not known\".&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When querying a dynamic table, I get the error \"Tablet ... is not known\".&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The client sent a query to a cluster node no longer serving the tablet. This usually occurs as a result of automatic balancing of tablets or restarting of cluster nodes. You need to resend the query to make the error disappear after a cache update or to disable balancing.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"service-not-known\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/faq.html#service-not-known\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When querying a dynamic table, I get the \"Service is not known\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When querying a dynamic table, I get the \"Service is not known\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The client sent a query to a cluster node no longer serving the cell tablet. This usually happens when cells are rebalanced. You need to resend the query to make the error disappear after a cache update.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"chunk-data-not-preloaded\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/faq.html#chunk-data-not-preloaded\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When querying a dynamic table, I get the \"Chunk data is not preloaded yet\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When querying a dynamic table, I get the \"Chunk data is not preloaded yet\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The message is specific to a table with the &lt;code&gt;in_memory_mode&lt;/code&gt; parameter at other than &lt;code&gt;none&lt;/code&gt;. Such a table is always in memory in a mounted state. In order to read from such a table, all data must be loaded into memory. If the table was recently mounted, the tablet was moved to a different cell, or the YTsaurus process restarted, the data is no longer in memory, which will generate this type of error. You need to wait for the background process to load data into memory.&lt;/p&gt;\n&lt;p&gt;Tablets can move to other cells as a result of &lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html\"&gt;automatic sharding&lt;/a&gt;. You can see these moves on the \"Tablet balancer moves\" graph on the bundle's page. If you want, you can set a different schedule for automatic sharding. Your new schedule must allow the table to continue sustaining your load.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"too-many-timestamps\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/faq.html#too-many-timestamps\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: In tablet_errors, I see the \"Too many write timestamps in a versioned row\" or \"Too many delete timestamps in a versioned row\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: In tablet_errors, I see the \"Too many write timestamps in a versioned row\" or \"Too many delete timestamps in a versioned row\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Sorted dynamic tables store many versions of the same value at the same time. In lookup format, each key can have no more than 2^16 versions. A simple solution is to use a column format (&lt;code&gt;@optimize_for = scan&lt;/code&gt;). In reality, such a large number of versions is not necessary and they occur as a result of misconfiguration or a programming error. For example, when specifying &lt;code&gt;atomicity=none&lt;/code&gt;, you can update the same table key with great frequency (in this mode, there is no row locking and transactions with overlapping time ranges can update the same key). This is not recommended. If writing a large number of versions results from a product need, such as frequent delta writes in aggregation columns, set the &lt;code&gt;@merge_rows_on_flush=%true&lt;/code&gt; table attribute and correctly &lt;a href=\"en/user-guide/dynamic-tables/sorted-dynamic-tables.html#remove_old_data\"&gt;configure TTL deletion&lt;/a&gt; so that only a small number of actually needed versions are written to the chunk in a flush.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"excessive-input\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/faq.html#excessive-input\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When querying Select Rows, I get the \"Query terminated prematurely due to excessive input; consider rewriting your query or changing input limit\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When querying Select Rows, I get the \"Query terminated prematurely due to excessive input; consider rewriting your query or changing input limit\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; This error occurs if too much data is read during query execution.&lt;/p&gt;\n&lt;p&gt;Check the following:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The primary key prefix of the table must be specified in the &lt;code&gt;WHERE&lt;/code&gt; query section. If this hasn't been done, &lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#input_data_cut\"&gt;input data cutting off&lt;/a&gt; can't be performed, and the query can't be executed efficiently (it will run as a full scan).&lt;/li&gt;\n&lt;li&gt;If the query contains &lt;code&gt;JOIN&lt;/code&gt;, make sure it's executed &lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#joins\"&gt;using an index&lt;/a&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;You need to manually rewrite the query to make sure it runs efficiently. To debug the query, you can use the &lt;a href=\"en/user-guide/dynamic-tables/dyn-query-language.html#explain_query\"&gt;explain&lt;/a&gt; command.&lt;br /&gt;\nYou can temporarily fix the error by increasing &lt;code&gt;input_row_limit&lt;/code&gt;, but this won't fully resolve your issue.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"maximum-expression-depth\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/faq.html#maximum-expression-depth\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When querying Select Rows, I get the \"Maximum expression depth exceeded\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When querying Select Rows, I get the \"Maximum expression depth exceeded\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; This error occurs if the expression tree depth is too large. This usually happens when writing expressions like&lt;br /&gt;\n&lt;code&gt;FROM [...] WHERE (id1=\"a\" AND id2=\"b\") OR (id1=\"c\" AND id2=\"d\") OR ... &amp;lt;a few thousand conditions&amp;gt;&lt;/code&gt;&lt;br /&gt;\nInstead, you need to set them in the form &lt;code&gt;FROM [...] WHERE (id1, id2) IN ((\"a\", \"b\"), (\"c\", \"b\"), ...)&lt;/code&gt;&lt;br /&gt;\nThere are a few problems with the first option. The problem is that queries are compiled into machine code. Machine code for queries is cached so that query structure not including constants serves as the key.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;In the first case, as the number of conditions increases, query structure will constantly change. There will be code generation for each query.&lt;/li&gt;\n&lt;li&gt;The first query will generate a very large amount of code.&lt;/li&gt;\n&lt;li&gt;Compiling the query will be very slow.&lt;/li&gt;\n&lt;li&gt;The first case will work simply by checking all the conditions. No transformation into a more complex algorithm is envisaged.&lt;/li&gt;\n&lt;li&gt;Besides that, if the columns are key, read ranges are displayed for them so that only the relevant data can be read. The read range output algorithm will work more optimally for the IN variant.&lt;/li&gt;\n&lt;li&gt;In case of IN, checking the condition will perform search in the hash table.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"value-too-long\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/faq.html#value-too-long\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When working with a dynamic table, I get the \"Value is too long\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When working with a dynamic table, I get the \"Value is too long\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; There are quite strict limits on the size of values in dynamic tables. Single value (table cell) size must not exceed 16 MB, while the length of an entire row should stay under 128 and 512 MB taking into account all versions. There can be a maximum of 1024 values in a row, taking all versions into account. There is also a limit on the number of rows per query, which defaults to 100,000 rows per transaction when inserting, 1 million rows for selects, and 5 million for a lookup. Please note that operation may become unstable in the vicinity of the threshold values. If you are over limit, you need to change data storage in a dynamic table and not store such long rows.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"clear-replicated-table-cli\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/faq.html#clear-replicated-table-cli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I clear a replicated table using a CLI?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I clear a replicated table using a CLI?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; You can't clear a replicated table atomically, but you can clear individual replicas using the &lt;a href=\"en/user-guide/data-processing/operations/erase.html\"&gt;Erase&lt;/a&gt; operation. To do this, you need to &lt;a href=\"en/user-guide/dynamic-tables/bulk-insert.html\"&gt;enable&lt;/a&gt; bulk insert for the entire cluster by setting:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;//sys/@config/tablet_manager/enable_bulk_insert&lt;/code&gt; to &lt;code&gt;%true&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;//sys/controller_agents/config/enable_bulk_insert_for_everyone&lt;/code&gt; to &lt;code&gt;%true&lt;/code&gt; (note the missing &lt;code&gt;@&lt;/code&gt; symbol)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If the last specified node doesn't exist, create it using the following command:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt create document //sys/controller_agents/config --attributes &lt;span class=\"hljs-string\"&gt;'{value={}}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"172\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-172\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-172\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-172.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"timed-out-blocked-row\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/faq.html#timed-out-blocked-row\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When reading from a dynamic table, I get the \"Timed out waiting on blocked row\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When reading from a dynamic table, I get the \"Timed out waiting on blocked row\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; This error occurs due to read-write conflicts – you attempt to read by a key used by a concurrent transaction. The system must wait for the result of that transaction to ensure the required level of isolation between transactions.&lt;/p&gt;\n&lt;p&gt;If you don't require strict consistency, you can &lt;a href=\"en/user-guide/dynamic-tables/sorted-dynamic-tables#chtenie-stroki\"&gt;weaken&lt;/a&gt; the isolation level for the reading transaction.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"row-lock-conflict\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/faq.html#row-lock-conflict\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When writing to a dynamic table, I get the \"Row lock conflict due to concurrent ... write\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When writing to a dynamic table, I get the \"Row lock conflict due to concurrent ... write\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; This error occurs due to write conflicts – you're trying to write to a row that is locked by a concurrent transaction (this can be a write operation or an explicit lock). In some cases, the system may indicate the conflicting transaction. For example, for write-write conflicts, the error attributes include the transaction ID.&lt;/p&gt;\n&lt;p&gt;In general, to eliminate conflicts caused by writing to the same key from multiple sources, you need to revise your logic for writing to dynamic tables.&lt;/p&gt;\n&lt;p&gt;In some scenarios, weakening &lt;a href=\"en/user-guide/dynamic-tables/transactions#conflicts\"&gt;guarantees&lt;/a&gt; may help. For example, you can use &lt;code&gt;atomicity=none&lt;/code&gt; mode or shared write lock mode. Before you weaken the guarantees, be sure to read the documentation to find out whether the side effects can impact you.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"no-working-replicas\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/faq.html#no-working-replicas\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When reading from a dynamic table, I get the \"No working in-sync replicas found for table\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When reading from a dynamic table, I get the \"No working in-sync replicas found for table\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; This error occurs when reading from a replicated or chaotic table if there is no replica to read from. The replica must meet the following criteria:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;It must contain fairly recent data. If a timestamp is specified when reading, the replica must contain data up to that timestamp. If a timestamp is not specified, reads must be made from an &lt;em&gt;actually synchronous&lt;/em&gt; replica: a one that has &lt;code&gt;mode=sync&lt;/code&gt; and definitely contains older data. For more information, see &lt;a href=\"en/user-guide/dynamic-tables/replicated-dynamic-tables#garantii\"&gt;guarantees of replicated dynamic tables&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;It must be a working replica. If the client has recently got an error from a replica, next time it will try to access a different replica. The replicas you cannot read data from are listed in the &lt;code&gt;banned_replicas&lt;/code&gt; attribute of the error in question.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"chunk-view-cannot-be-remote-copied\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/faq.html#chunk-view-cannot-be-remote-copied\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: When attempting to execute RemoteCopy, I get the \"Chunk view cannot be copied to remote cluster\" error.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: When attempting to execute RemoteCopy, I get the \"Chunk view cannot be copied to remote cluster\" error.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; To ensure cost efficiency, some operations on a dynamic table, such as resharding, may create chunk views — wrappers for chunks. Currently, RemoteCopy can only copy regular chunks, not chunk views.&lt;br /&gt;\nTo remove chunk views from a table, perform a special forced compaction by setting the &lt;code&gt;forced_chunk_view_compaction_revision&lt;/code&gt; attribute to 1, and then execute &lt;code&gt;remount-table&lt;/code&gt;. For more information, see &lt;a href=\"en/user-guide/dynamic-tables/compaction#forced_compaction\"&gt;Forced compaction&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/dynamic-tables/faq.md","sourcePath":"en/user-guide/dynamic-tables/faq.md"},"headings":[],"title":"FAQ"},"router":{"pathname":"en/user-guide/dynamic-tables/faq","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
