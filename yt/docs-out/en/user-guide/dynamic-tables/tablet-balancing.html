            {"data":{"leading":false,"html":"&lt;p&gt;Sharding and balancing help ensure even load distribution across the cluster. This includes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Table sharding.&lt;/li&gt;\n&lt;li&gt;Redistributing tablets between &lt;a href=\"user-guide/dynamic-tables/concepts.html#tablet_cells\"&gt;tablet cells&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Sharding is needed for the table tablets to become approximately of the same size, while redistribution between tablet cells helps ensure that tablet cells have an approximately even amount of data and/or load. Even data distribution is especially important for in-memory tables (with &lt;code&gt;@in_memory_mode&lt;/code&gt; other than &lt;code&gt;none&lt;/code&gt;), because cluster memory is a rather limited resource and a poor distribution can overload some cluster nodes. Load distribution, on the other hand, is essential for cases where the load on table keys is uneven, or if a certain type of load is a limited resource in your bundle.&lt;/p&gt;\n&lt;p&gt;You can configure balancing both on a per-table basis and for each &lt;a href=\"user-guide/dynamic-tables/concepts.html#tablet_cell_bundles\"&gt;tablet cell bundle&lt;/a&gt;. You can also configure balancing for groups of tables. Table configuration has a higher priority than group configuration, which in turn has a higher priority than bundle configuration.&lt;/p&gt;\n&lt;p&gt;The system has two types of balancers: the legacy balancer, which lives in the master process and supports only balancing by tablet size and a limited number of options, and the standalone balancer that also supports balancing by load. The external balancer is not currently supported in opensource.&lt;/p&gt;\n&lt;h2 id=\"balancing-strategies\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#balancing-strategies\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Balancing strategies&lt;/span&gt;&lt;/a&gt;Balancing strategies&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Resharding by size&lt;/strong&gt;. To evenly distribute table tablets across tablet cells, each tablet needs to be of a reasonable size. Large tablets are split into several smaller ones, and small tablets are combined with the neighboring ones.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Resharding by parameter and size&lt;/strong&gt; (available only for clusters with a standalone balancer). To evenly balance the table by parameter, all table tablets need to be of approximately the same size and have approximately the same load. Tablets with a higher load or of a larger size are resharded, and smaller tablets with a smaller load are combined with the neighboring ones.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Balancing between tablet cells&lt;/strong&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;In-memory tables&lt;/strong&gt;. In-memory tables are balanced by minimizing the load on the most loaded cell (for tables with hunks, this is done on their non-hunk part). Only the total node memory usage across all tables is taken into account, the tablet distribution within each individual table is not optimized.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Disk tables&lt;/strong&gt;. Disk tables are balanced by the number of table tablets by the bundle's tablet cells.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Parameterized balancing between nodes&lt;/strong&gt; (aka balancing by load, available only for clusters with a standalone balancer). Minimizes the dispersion of the selected metric by node and, to a lesser extent, by cell. Per-table distribution is not taken into account, all tablets are considered equivalent.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"quick-start\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#quick-start\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Quick start for parameterized balancing&lt;/span&gt;&lt;/a&gt;Quick start for parameterized balancing&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Available only for clusters with a standalone balancer.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;If the bundle doesn't have parameterized balancing enabled and dedicated balancing groups set up, all you need to do is create a group with the desired settings and put the tables into that group.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;To verify whether these instructions apply to you, make sure that the bundle config doesn't contain a list of groups (the &lt;code&gt;//sys/tablet_cell_bundles/&amp;lt;bundle_name&amp;gt;/@tablet_balancer_config&lt;/code&gt; map doesn't include the &lt;code&gt;groups&lt;/code&gt; field).&lt;/li&gt;\n&lt;li&gt;Select a metric for balancing the tables. For the meta cluster, if writes to replicated tables are evenly distributed across their tablets, we recommend balancing the load based on the number of tablets &lt;code&gt;(metric = \"1\")&lt;/code&gt;. The list of available metrics is provided in the &lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#parameterized\"&gt;section on parameterized balancing configuration&lt;/a&gt;. You can add metrics using the + operator in the formula. If the bundle contains groups of tables with varying types of load, you may want to balance them using different metrics. To do that, create multiple groups with custom settings. For more information, see the &lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#group\"&gt;section on table groups&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;For large balancing groups with more than 50,000 tablets, you may need to adjust the &lt;code&gt;max_action_count&lt;/code&gt; parameter, which specifies the number of movements per balancing iteration. For more information, see the section on &lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#parameterized\"&gt;parameterized balancing configuration&lt;/a&gt;. If you enable parameterized balancing for the entire bundle, you can view the total number of tablets across all tables on the bundle page.&lt;/li&gt;\n&lt;li&gt;Create a &lt;code&gt;default&lt;/code&gt; &lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#system-groups\"&gt;group&lt;/a&gt; with the desired config for parameterized balancing and enter the desired metric in the creation command. If needed, use a similar approach to set the &lt;code&gt;max_action_count&lt;/code&gt; parameter.\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;yt set //sys/tablet_cell_bundles/&amp;lt;bundle_name&amp;gt;/@tablet_balancer_config/groups\n'{default = {parameterized = {metric = \"&amp;lt;metric_formula&amp;gt;\"}}}'\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"92\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-92\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-92\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-92.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;Enable parameterized balancing for the desired tables.\n&lt;ul&gt;\n&lt;li&gt;To enable it for the entire bundle:&lt;br /&gt;\n&lt;code&gt;yt set //sys/tablet_cell_bundles/&amp;lt;bundle_name&amp;gt;/@tablet_balancer_config/enable_parameterized_by_default %true&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;To enable it only for specific tables, enable parameterized balancing for each table individually:&lt;br /&gt;\n&lt;code&gt;yt set //path/to/table/@tablet_balancer_config/enable_parameterized %true&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;You can monitor the balancer's actions on the bundle page: go to Monitoring → Maintenance.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"balancing-configuration\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#balancing-configuration\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Balancing configuration&lt;/span&gt;&lt;/a&gt;Balancing configuration&lt;/h2&gt;\n&lt;h3 id=\"group\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#group\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Table groups&lt;/span&gt;&lt;/a&gt;Table groups&lt;/h3&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Available only for clusters with a standalone balancer.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;To make configuration easier, the service supports balancing groups. Their configs are located in the &lt;code&gt;groups&lt;/code&gt; field in the bundle config. If this parameter doesn't exist (it isn't created automatically), you need to create it. Inside the group, all tables are balanced together.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Creating a balancing group with certain values&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;You need to create an empty map in the &lt;code&gt;groups&lt;/code&gt; field along with configs for balancing groups, subconfigs, and so on&lt;br /&gt;\n&lt;code&gt;yt set //sys/tablet_cell_bundles/&amp;lt;bundle_name&amp;gt;/@tablet_balancer_config/groups '{}'&lt;/code&gt;&lt;br /&gt;\n, or create a group with the desired configuration right away&lt;br /&gt;\n&lt;code&gt;yt set //sys/tablet_cell_bundles/&amp;lt;bundle_name&amp;gt;/@tablet_balancer_config/groups '{alpha={parameterized={max_action_count=5}; schedule=\"minutes % 45 == 0\"}}'&lt;/code&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;To put a table into a group named &lt;code&gt;alpha&lt;/code&gt;, set the &lt;code&gt;group&lt;/code&gt; field of the &lt;code&gt;@tablet_balancer_config&lt;/code&gt; attribute to &lt;code&gt;alpha&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"group-configuration-parameters\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#group-configuration-parameters\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Group configuration parameters&lt;/span&gt;&lt;/a&gt;Group configuration parameters&lt;/h4&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Name&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;type&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;legacy&lt;/code&gt; / &lt;code&gt;parameterized&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;legacy&lt;/code&gt; for &lt;code&gt;legacy&lt;/code&gt; and &lt;code&gt;legacy_in_memory&lt;/code&gt; groups, &lt;code&gt;parameterized&lt;/code&gt; for other group types&lt;/td&gt;\n&lt;td&gt;Balancing type. &lt;code&gt;legacy&lt;/code&gt; can't be set for new groups&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;parameterized&lt;/td&gt;\n&lt;td&gt;yson&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Parameterized balancing configuration. Learn more in the section on parameterized balancing configuration&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;schedule&lt;/td&gt;\n&lt;td&gt;Arithmetic formula that includes &lt;code&gt;minutes&lt;/code&gt;, &lt;code&gt;hours&lt;/code&gt;, and numeric values&lt;/td&gt;\n&lt;td&gt;If the value is set, it is taken from the bundle's config. Otherwise, it depends on the cluster configuration&lt;/td&gt;\n&lt;td&gt;Balancing schedule. Once the formula value becomes true, this triggers the resharding of all the group's tables, and after that (usually within 10 minutes), movement between cells. See the examples in the &lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#schedule\"&gt;Schedule&lt;/a&gt; section&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_move&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;%true&lt;/td&gt;\n&lt;td&gt;Enables movement between tablet cells. Balancing type depends on the group&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_reshard&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;%true&lt;/td&gt;\n&lt;td&gt;Enables automatic resharding. Balancing type depends on the group&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sample group configuration&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;This is not a recommendation. The example only lists possible options with random values.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-string\"&gt;\"in_memory_stable\"&lt;/span&gt; = {\n    &lt;span class=\"hljs-string\"&gt;\"enable_move\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"enable_reshard\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"schedule\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"minutes % 30 == 5\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"parameterized\"&lt;/span&gt; = {\n        &lt;span class=\"hljs-string\"&gt;\"max_action_count\"&lt;/span&gt; = 100;\n        &lt;span class=\"hljs-string\"&gt;\"metric\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"double([/statistics/memory_size])\"&lt;/span&gt;;\n    };\n};\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"252\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-252\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-252\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-252.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"system-groups\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#system-groups\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;System groups&lt;/span&gt;&lt;/a&gt;System groups&lt;/h4&gt;\n&lt;p&gt;From the balancer's point of view, system groups exist by default even if &lt;code&gt;@tablet_balancer_config/groups&lt;/code&gt; doesn't explicitly list their configs. The default values for these groups are taken from the above table. All system groups are listed below:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;legacy&lt;/code&gt;: Balancing between the tablet cells of disk tables.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;legacy_in_memory&lt;/code&gt;: Balancing between the tablet cells of in-memory tables.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;default&lt;/code&gt;: Includes all tables with enabled parameterized balancing where the group isn't explicitly indicated.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Tables are put into the first and second groups automatically if the group type and parameterized balancing for them are not indicated. Tables are put into the &lt;code&gt;default&lt;/code&gt; group if:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The &lt;code&gt;default&lt;/code&gt; group is explicitly indicated for the table.&lt;/li&gt;\n&lt;li&gt;The group isn't explicitly indicated but &lt;code&gt;enable_parameterized=true&lt;/code&gt; is set in the balancing config.&lt;/li&gt;\n&lt;li&gt;The group isn't explicitly indicated, and parameterized balancing is enabled for the bundle by default (&lt;code&gt;enable_parameterized_by_default=%true&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If the bundle's config indicates the default group name for in-memory table balancing (the &lt;code&gt;default_in_memory_group&lt;/code&gt; attribute), the in-memory tables that were supposed to be put into the &lt;code&gt;default&lt;/code&gt; category are put into the group specified in the config instead.&lt;/p&gt;\n&lt;h3 id=\"per-table-settings\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#per-table-settings\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Per-table settings&lt;/span&gt;&lt;/a&gt;Per-table settings&lt;/h3&gt;\n&lt;p&gt;A list of available table settings (&lt;code&gt;//path/to/table/@tablet_balancer_config&lt;/code&gt;) is given in the table:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Name&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_auto_reshard&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;%true&lt;/td&gt;\n&lt;td&gt;Enables/disables resharding&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_auto_tablet_move&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;%true&lt;/td&gt;\n&lt;td&gt;Enables/disables moving table tablets between cells&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;min_tablet_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Minimum tablet size for resharding by size&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;desired_tablet_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Desired tablet size for resharding by size&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_tablet_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Maximum tablet size for resharding by size&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;desired_tablet_count&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;The desired number of tablets for resharding&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;min_tablet_count&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;The minimum number of tablets for resharding by size, &lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#reshard-config\"&gt;see note in text&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;group*&lt;/td&gt;\n&lt;td&gt;str&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Puts the table into a balancing group, see more in &lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#group\"&gt;Table groups&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_parameterized*&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Enables/disables moving tablets by load&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;* — Available only for clusters with a standalone balancer.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sample table configuration&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;This is not a recommendation. The example only lists possible options with random values.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;{\n    &lt;span class=\"hljs-string\"&gt;\"enable_auto_reshard\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"enable_auto_tablet_move\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"group\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"writes\"&lt;/span&gt;;\n\n&lt;span class=\"hljs-comment\"&gt;# use the rest wisely&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"enable_verbose_logging\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"enable_parameterized\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"desired_tablet_count\"&lt;/span&gt; = 100;\n    &lt;span class=\"hljs-string\"&gt;\"min_tablet_count\"&lt;/span&gt; = 5;\n    &lt;span class=\"hljs-string\"&gt;\"min_tablet_size\"&lt;/span&gt; = 1000;\n    &lt;span class=\"hljs-string\"&gt;\"desired_tablet_size\"&lt;/span&gt; = 5000;\n    &lt;span class=\"hljs-string\"&gt;\"max_tablet_size\"&lt;/span&gt; = 10000;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"471\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-471\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-471\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-471.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h3 id=\"per-bundle-settings\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#per-bundle-settings\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Per-bundle settings&lt;/span&gt;&lt;/a&gt;Per-bundle settings&lt;/h3&gt;\n&lt;p&gt;The settings are specified in &lt;code&gt;//sys/tablet_cell_bundles/&amp;lt;bundle_name&amp;gt;/@tablet_balancer_config&lt;/code&gt;.&lt;br /&gt;\nIf the bundle and the table have conflicting settings, the table settings have a higher priority and will be used for balancing.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Name&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;min_tablet_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;128 MB&lt;/td&gt;\n&lt;td&gt;Minimum disk table tablet size&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;desired_tablet_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;10 GB&lt;/td&gt;\n&lt;td&gt;Desired disk table tablet size&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_tablet_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;20 GB&lt;/td&gt;\n&lt;td&gt;Maximum disk table tablet size&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;min_in_memory_tablet_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;512 MB&lt;/td&gt;\n&lt;td&gt;Minimum in-memory table tablet size&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;desired_in_memory_tablet_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;1 GB&lt;/td&gt;\n&lt;td&gt;Desired in-memory table tablet size&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_in_memory_tablet_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;2 GB&lt;/td&gt;\n&lt;td&gt;Maximum in-memory table tablet size&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_tablet_size_balancer&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;%true&lt;/td&gt;\n&lt;td&gt;Enables/disables resharding by size&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_in_memory_cell_balancer&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;%true&lt;/td&gt;\n&lt;td&gt;Enables/disables in-memory table tablet balancing between tablet cells&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_cell_balancer&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;%false&lt;/td&gt;\n&lt;td&gt;Enables/disables disk table tablet balancing between tablet cells&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tablet_to_cell_ratio&lt;/td&gt;\n&lt;td&gt;double&lt;/td&gt;\n&lt;td&gt;5.&lt;/td&gt;\n&lt;td&gt;Resharding by size limits the number of tablets in a table to the number of tablet cells multiplied by the value of this parameter&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_parameterized_by_default*&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;%false&lt;/td&gt;\n&lt;td&gt;Puts tables with no explicit &lt;code&gt;group&lt;/code&gt; indication into the &lt;code&gt;default&lt;/code&gt; group for parameterized balancing&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;groups*&lt;/td&gt;\n&lt;td&gt;dictionary&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Balancing group configs&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;default_in_memory_group*&lt;/td&gt;\n&lt;td&gt;str&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Default group name for in-memory tables for parametrized balancing&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;* — Available only for clusters with a standalone balancer.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sample bundle configuration&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;This is not a recommendation. The example only lists possible options with random values.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;{\n    &lt;span class=\"hljs-string\"&gt;\"enable_cell_balancer\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"enable_in_memory_cell_balancer\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"enable_tablet_size_balancer\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"min_tablet_size\"&lt;/span&gt; = 500;\n    &lt;span class=\"hljs-string\"&gt;\"desired_tablet_size\"&lt;/span&gt; = 1000;\n    &lt;span class=\"hljs-string\"&gt;\"max_tablet_size\"&lt;/span&gt; = 2000;\n    &lt;span class=\"hljs-string\"&gt;\"min_in_memory_tablet_size\"&lt;/span&gt; = 50;\n    &lt;span class=\"hljs-string\"&gt;\"desired_in_memory_tablet_size\"&lt;/span&gt; = 100;\n    &lt;span class=\"hljs-string\"&gt;\"max_in_memory_tablet_size\"&lt;/span&gt; = 1000;\n    &lt;span class=\"hljs-string\"&gt;\"hard_in_memory_cell_balance_threshold\"&lt;/span&gt; = 0.15;\n    &lt;span class=\"hljs-string\"&gt;\"soft_in_memory_cell_balance_threshold\"&lt;/span&gt; = 0.05;\n    &lt;span class=\"hljs-string\"&gt;\"tablet_balancer_schedule\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"(hours * 60 + minutes) % 80 == 10\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"tablet_to_cell_ratio\"&lt;/span&gt; = 5.;\n    &lt;span class=\"hljs-string\"&gt;\"enable_verbose_logging\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"enable_parameterized_by_default\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"groups\"&lt;/span&gt; = {\n        &lt;span class=\"hljs-string\"&gt;\"in_memory_stable\"&lt;/span&gt; = {\n            &lt;span class=\"hljs-comment\"&gt;# ... parameterized balancing only&lt;/span&gt;\n        };\n        &lt;span class=\"hljs-string\"&gt;\"legacy\"&lt;/span&gt; = {\n            &lt;span class=\"hljs-comment\"&gt;# ...&lt;/span&gt;\n        };\n        &lt;span class=\"hljs-string\"&gt;\"default\"&lt;/span&gt; = {\n            &lt;span class=\"hljs-comment\"&gt;# ... parameterized balancing only&lt;/span&gt;\n        };\n        &lt;span class=\"hljs-string\"&gt;\"legacy_in_memory\"&lt;/span&gt; = {\n            &lt;span class=\"hljs-comment\"&gt;# ...&lt;/span&gt;\n        };\n    };\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"700\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-700\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-700\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-700.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h3 id=\"parameterized\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#parameterized\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Parameterized balancing configuration&lt;/span&gt;&lt;/a&gt;Parameterized balancing configuration&lt;/h3&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Available only for clusters with a standalone balancer.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Name&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;metric&lt;/td&gt;\n&lt;td&gt;str&lt;/td&gt;\n&lt;td&gt;write data weight&lt;/td&gt;\n&lt;td&gt;Balancing metric (parameter)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_action_count&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Maximum number of tablets to be moved in one iteration&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_reshard&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Enables the resharding algorithm by parameter and size instead of resharding by size&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;per_table_uniform&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Enables the movement balancing algorithm, which among other functions aims to ensure an even distribution of tables across nodes and cells. Recommended for groups of no more than 50 tables&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;The metric for parameterized balancing is set by an arithmetic formula using per-table metrics. The metric must be positive for any given tablet. For the correct operation of the balancing algorithm, the metric size must be in direct ratio to the tablet load. The formula may include tablet size metrics. Each of the load metrics can have one of the following two suffixes: &lt;code&gt;_10m_rate&lt;/code&gt; or &lt;code&gt;_1h_rate&lt;/code&gt;, which are calculated as the exponential decay of requests within 10 minutes and 1 hour, respectively. In the table, all metrics are given for the 10-minute window.&lt;/p&gt;\n&lt;p&gt;Below you will find per-table metrics that can prove useful.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Write data weight&lt;br /&gt;\n&lt;code&gt;double([/performance_counters/dynamic_row_write_data_weight_10m_rate])&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Amount of data read by lookup requests&lt;br /&gt;\n&lt;code&gt;double([/performance_counters/dynamic_row_lookup_data_weight_10m_rate]) + double([/performance_counters/static_chunk_row_lookup_data_weight_10m_rate])&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Amount of data read by select requests&lt;br /&gt;\n&lt;code&gt;double([/performance_counters/dynamic_row_read_data_weight_10m_rate]) + double([/performance_counters/static_chunk_row_read_data_weight_10m_rate])&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Uncompressed size&lt;br /&gt;\n&lt;code&gt;double([/statistics/uncompressed_data_size])&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Compressed size&lt;br /&gt;\n&lt;code&gt;double([/statistics/compressed_data_size])&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Memory size (the amount of data occupied by an in-memory table, equal to either compressed or uncompressed size depending on &lt;code&gt;in_memory_mode&lt;/code&gt;)&lt;br /&gt;\n&lt;code&gt;double([/statistics/memory_size])&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;CPU time consumed by lookup requests&lt;br /&gt;\n&lt;code&gt;double([/performance_counters/lookup_cpu_time_10m_rate])&lt;/code&gt; |&lt;/li&gt;\n&lt;li&gt;Number of tablets (can be used if tablets need to be distributed equally across nodes without taking the load into account)&lt;br /&gt;\n&lt;code&gt;1&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;You may need to set the &lt;code&gt;max_action_count&lt;/code&gt; parameter, which represents the number of movements per balancing iteration. This parameter determines how many tablets will be inaccessible during balancing. If your bundle is fairly large or, for some reason, the default values don't suit your needs, you can apply the following principle to estimate an initial value for this parameter:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;For bundles of up to 100 tablet nodes: No less than the number of nodes and no less than 10.&lt;/li&gt;\n&lt;li&gt;For groups of up to 100 tablets: 10.&lt;/li&gt;\n&lt;li&gt;For groups of up to 1000 tablets: 50.&lt;/li&gt;\n&lt;li&gt;For groups of up to 10,000 tablets: 100.&lt;/li&gt;\n&lt;li&gt;For groups of up to 50,000 tablets: 250.&lt;/li&gt;\n&lt;li&gt;For groups of up to 100,000 tablets: 500.&lt;br /&gt;\nIf all the bundle tables use parameterized balancing and there is only one parameterized balancing group, then the total number of tablets across all tables is displayed on the bundle page.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"resharding-configuration\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#resharding-configuration\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Resharding configuration&lt;/span&gt;&lt;/a&gt;Resharding configuration&lt;/h3&gt;\n&lt;h4 id=\"reshard-config\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#reshard-config\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Resharding by size&lt;/span&gt;&lt;/a&gt;Resharding by size&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;If the &lt;code&gt;desired_tablet_count&lt;/code&gt; parameter is specified in the table settings, the balancer will attempt to shard the table by the specified number of tablets.&lt;/li&gt;\n&lt;li&gt;Otherwise, if all three parameters (&lt;code&gt;min_tablet_size&lt;/code&gt;, &lt;code&gt;desired_tablet_size&lt;/code&gt;, &lt;code&gt;max_tablet_size&lt;/code&gt;) are specified in the table settings and their values are valid (i.e. &lt;code&gt;min_tablet_size &amp;lt; desired_tablet_size &amp;lt; max_tablet_size&lt;/code&gt; is true), the specified parameter values will be used.&lt;/li&gt;\n&lt;li&gt;Otherwise, the bundle's tablet cell settings will be used.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;If all three tablet size parameters (min, desired, and max) are explicitly indicated, the following recommendation needs to be observed for the algorithm to work correctly: &lt;code&gt;max&lt;/code&gt; / &lt;code&gt;min&lt;/code&gt; must be equal to at least 2.5 or, better yet, 3. With smaller ratios, the algorithm won't be able to reshard the table to the optimal size and will continually change the size of tablets, interfering with your work.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;The automatic sharding algorithm is as follows: the background process monitors the mounted tablets and as soon as it detects a tablet smaller than &lt;code&gt;min_tablet_size&lt;/code&gt; or larger than &lt;code&gt;max_tablet_size&lt;/code&gt;, it tries to bring it to &lt;code&gt;desired_tablet_size&lt;/code&gt;, possibly affecting adjacent tablets. If the &lt;code&gt;desired_tablet_count&lt;/code&gt; parameter is specified, the custom table size settings will be ignored and values will be calculated based on table size and &lt;code&gt;desired_tablet_count&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;If the &lt;code&gt;min_tablet_count&lt;/code&gt; parameter is set, the balancer won't combine tablets if the resulting number of tablets is below the limit. However, this option doesn't guarantee that the balancer will reduce the size of tablets if their current number is too little: if you use it, you need to manually pre-shard the table to the desired number of tablets.&lt;/p&gt;\n&lt;h4 id=\"parameterized-reshard-config\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#parameterized-reshard-config\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Resharding by size and parameter&lt;/span&gt;&lt;/a&gt;Resharding by size and parameter&lt;/h4&gt;\n&lt;p&gt;This type of resharding is intended for collaborative work with parameterized balancing. Both algorithms use the same metric (parameter) that is specified in the balancing group's config. To enable this type of resharding, you need to specify the desired number of tablets (&lt;code&gt;desired_tablet_count&lt;/code&gt;) in the table's config. Without this value, the algorithm can't predict the desired parameter values for each tablet's metric. You also need to set the &lt;code&gt;enable_reshard&lt;/code&gt; flag value to &lt;code&gt;%true&lt;/code&gt; in the group's parameterized balancing config.&lt;/p&gt;\n&lt;p&gt;The algorithm is similar to that for the resharding by size, except for the conditions at which the tablets are split and combined. When the algorithm detects a tablet that doesn't meet at least one of the min/max size or parameter requirements, this tablet is either split or combined with the neighboring tablets to bring it to the required size and parameter values if possible. The above-mentioned limits are calculated based on the desired number of table tablets.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Unlike resharding by size, this type of resharding doesn't take the &lt;code&gt;min_tablet_count&lt;/code&gt; parameter into account, which means that the number of tablets in the table can drop down below the specified value.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"shutdown\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#shutdown\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Disabling&lt;/span&gt;&lt;/a&gt;Disabling&lt;/h3&gt;\n&lt;p&gt;To disable a certain type of lock, set the value of the corresponding attribute to &lt;code&gt;%false&lt;/code&gt; (see the table below). You need to specify this value in the following configs:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;For bundles: &lt;code&gt;//sys/tablet_cell_bundles/&amp;lt;bundle&amp;gt;/@tablet_balancer_config/&amp;lt;attribute&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;For groups: &lt;code&gt;//sys/tablet_cell_bundles/&amp;lt;bundle&amp;gt;/@tablet_balancer_config/groups/&amp;lt;group&amp;gt;/&amp;lt;attribute&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;For tables: &lt;code&gt;//path/to/table/@tablet_balancer_config/&amp;lt;attribute&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Balancing type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Bundle&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Group&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Table&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;i class=\"yfm yfm-term_title\" term-key=\":in-memory-move\" role=\"button\" aria-describedby=\":in-memory-move_element\" tabindex=\"0\" id=\"pu04u0px\"&gt;in-memory move&lt;/i&gt;&lt;/td&gt;\n&lt;td&gt;enable_in_memory_cell_balancer&lt;/td&gt;\n&lt;td&gt;enable_move&lt;/td&gt;\n&lt;td&gt;enable_auto_tablet_move&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;i class=\"yfm yfm-term_title\" term-key=\":ordinary-move\" role=\"button\" aria-describedby=\":ordinary-move_element\" tabindex=\"0\" id=\"nkog7ycr\"&gt;ordinary move&lt;/i&gt;&lt;/td&gt;\n&lt;td&gt;enable_cell_balancer&lt;/td&gt;\n&lt;td&gt;enable_move&lt;/td&gt;\n&lt;td&gt;enable_auto_tablet_move&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;i class=\"yfm yfm-term_title\" term-key=\":parameterized-move\" role=\"button\" aria-describedby=\":parameterized-move_element\" tabindex=\"0\" id=\"yvya8q8d\"&gt;parameterized move&lt;/i&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;enable_move&lt;/td&gt;\n&lt;td&gt;enable_auto_tablet_move&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;i class=\"yfm yfm-term_title\" term-key=\":reshard\" role=\"button\" aria-describedby=\":reshard_element\" tabindex=\"0\" id=\"3w42gkmp\"&gt;reshard&lt;/i&gt;&lt;/td&gt;\n&lt;td&gt;enable_tablet_size_balancer&lt;/td&gt;\n&lt;td&gt;enable_reshard&lt;/td&gt;\n&lt;td&gt;enable_auto_reshard&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;i class=\"yfm yfm-term_title\" term-key=\":parameterized-reshard\" role=\"button\" aria-describedby=\":parameterized-reshard_element\" tabindex=\"0\" id=\"yhtlmhpi\"&gt;parameterized reshard&lt;/i&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;enable_reshard&lt;/td&gt;\n&lt;td&gt;enable_auto_reshard&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"schedule\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#schedule\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Automatic sharding schedule&lt;/span&gt;&lt;/a&gt;Automatic sharding schedule&lt;/h3&gt;\n&lt;p&gt;Sharding will inevitably unmount some of the tablets. To make the process more predictable, you can set up the balancer schedule. The setting can be per-cluster, per-bundle, and per-group.&lt;/p&gt;\n&lt;p&gt;The bundle schedule is located in the &lt;code&gt;//sys/tablet_cell_bundles//@tablet_balancer_config/tablet_balancer_schedule&lt;/code&gt; attribute. The group schedule is located in the &lt;code&gt;schedule&lt;/code&gt; attribute of the &lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#group\"&gt;group's&lt;/a&gt; config.&lt;/p&gt;\n&lt;p&gt;Any arithmetic formula from the &lt;code&gt;hours&lt;/code&gt; and &lt;code&gt;minutes&lt;/code&gt; integer variables can be specified as a format. The balancing of the bundle's tables will only occur when the formula value is true (i.e. different from zero).&lt;/p&gt;\n&lt;p&gt;The background balancing process runs once every few minutes, so you should expect that the tablets can be in the unmounted state for 10 minutes after the formula becomes true.&lt;/p&gt;\n&lt;p&gt;Examples:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;minutes % 20 == 0&lt;/code&gt;: Balancing at the 0th, 20th, and 40th minute of each hour.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;hours % 2 == 0 &amp;amp;&amp;amp; minutes == 30&lt;/code&gt;: Balancing at 00:30, 02:30, ...&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If no attribute value is specified for the bundle, the default value for the cluster is used. Example of a cluster-level balancing setup is given in the table below:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Cluster&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Schedule&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;first-cluster&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;(hours * 60 + minutes) % 40 == 0&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;second-cluster&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;(hours * 60 + minutes) % 40 == 10&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;third-cluster&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;(hours * 60 + minutes) % 40 == 20&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"details\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#details\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Implementation details&lt;/span&gt;&lt;/a&gt;Implementation details&lt;/h2&gt;\n&lt;h3 id=\"movement-balancing\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#movement-balancing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Movement balancing&lt;/span&gt;&lt;/a&gt;Movement balancing&lt;/h3&gt;\n&lt;h4 id=\"parameterized-balancing\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#parameterized-balancing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Parameterized balancing&lt;/span&gt;&lt;/a&gt;Parameterized balancing&lt;/h4&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Per-table distribution is not taken into account, all the group's tablets are considered equivalent.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Balancing is applied to tables in &lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#system-groups\"&gt;groups&lt;/a&gt; &lt;strong&gt;other than&lt;/strong&gt; &lt;code&gt;legacy_in_memory&lt;/code&gt; and &lt;code&gt;legacy&lt;/code&gt;.&lt;/p&gt;\n&lt;h5 id=\"algorithm-overview\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#algorithm-overview\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Algorithm overview&lt;/span&gt;&lt;/a&gt;Algorithm overview&lt;/h5&gt;\n&lt;p&gt;The algorithm calculates the &lt;code&gt;metric&lt;/code&gt; for each tablet and then, depending on the tablet distribution by cells and nodes, the metrics for cells and nodes are calculated as the sum of metrics of the tablets that they host, followed by step-by-step minimization&lt;br /&gt;\n&lt;span class=\"yfm-latex\" data-content=\"%5Csum_%7Bnode%7D%7BNodeMetric%5E2%7D%20%2B%20%5Csum_%7Bcell%7D%7BCellMetric%5E2%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;&lt;/p&gt;\n&lt;p&gt;In one parameterized balancing step, a tablet can be moved from one cell to another.&lt;/p&gt;\n&lt;p&gt;The algorithm won't run if tablet distribution by cells and nodes is adequate.&lt;/p&gt;\n&lt;h4 id=\"balancing-between-disk-tablet-cells\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#balancing-between-disk-tablet-cells\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Balancing between disk tablet cells&lt;/span&gt;&lt;/a&gt;Balancing between disk tablet cells&lt;/h4&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The tablet size isn't taken into account, all the table's tablets are considered equivalent.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Balancing &lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#system-groups\"&gt;group&lt;/a&gt;: &lt;code&gt;legacy&lt;/code&gt;&lt;/p&gt;\n&lt;h5 id=\"algorithm-overview1\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#algorithm-overview1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Algorithm overview&lt;/span&gt;&lt;/a&gt;Algorithm overview&lt;/h5&gt;\n&lt;p&gt;Tablets are evenly distributed across bundle cells independently for each table. If the bundle has empty cells, the tablets are distributed so that each cell contains approximately the same number of tablets.&lt;/p&gt;\n&lt;h4 id=\"balancing-between-in-memory-tablet-cells\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#balancing-between-in-memory-tablet-cells\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Balancing between in-memory tablet cells&lt;/span&gt;&lt;/a&gt;Balancing between in-memory tablet cells&lt;/h4&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Per-table distribution is not taken into account, all the group's tablets are considered equivalent.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Balancing &lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#system-groups\"&gt;group&lt;/a&gt;: &lt;code&gt;legacy_in_memory&lt;/code&gt;&lt;/p&gt;\n&lt;h5 id=\"algorithm-overview2\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#algorithm-overview2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Algorithm overview&lt;/span&gt;&lt;/a&gt;Algorithm overview&lt;/h5&gt;\n&lt;p&gt;Tablets are evenly distributed across bundle cells by &lt;code&gt;memory_size&lt;/code&gt;. Per-table distribution is not taken into account.&lt;/p&gt;\n&lt;h3 id=\"sharding\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#sharding\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sharding&lt;/span&gt;&lt;/a&gt;Sharding&lt;/h3&gt;\n&lt;h4 id=\"resharding-by-size\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#resharding-by-size\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Resharding by size&lt;/span&gt;&lt;/a&gt;Resharding by size&lt;/h4&gt;\n&lt;p&gt;Performed by splitting and combining neighboring tablets. Each table is resharded independently.&lt;/p&gt;\n&lt;h5 id=\"algorithm-overview3\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#algorithm-overview3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Algorithm overview&lt;/span&gt;&lt;/a&gt;Algorithm overview&lt;/h5&gt;\n&lt;p&gt;The algorithm splits large tablets and combines neighboring tablets independently in each table. A tablet is considered too large if its size exceeds &lt;code&gt;max_tablet_size&lt;/code&gt;. In this case, it can be split into several smaller tablets separately or together with the neighboring tablets so that the size of new tablets is approximately equal to &lt;code&gt;desired_tablet_size&lt;/code&gt;. Tablets smaller than &lt;code&gt;min_tablet_size&lt;/code&gt; are combined.&lt;/p&gt;\n&lt;p&gt;If &lt;code&gt;min_tablet_count&lt;/code&gt; is specified for the table, and the number of tablets is less than the specified value, they won't be combined even if they are smaller than &lt;code&gt;min_tablet_size&lt;/code&gt;. The parameter doesn't affect &lt;code&gt;min/desired/max tablet_size&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;If &lt;code&gt;desired_tablet_count&lt;/code&gt; is specified for the table, the limits are calculated as follows:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;desired_tablet_size = table_size / desired_tablet_count&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;min_tablet_size = desired_tablet_size / 1.9&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_tablet_size = desired_tablet_size * 1.9&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;For the algorithm to work properly, &lt;strong&gt;max_tablet_size / min_tablet_size &amp;gt; 2&lt;/strong&gt; needs to be true. Otherwise, the balancer will repeatedly perform useless actions that will hamper the table operation. Other configuration recommendations can be found in the &lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#reshard-config\"&gt;relevant section&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"resharding-by-size-and-metric\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#resharding-by-size-and-metric\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Resharding by size and metric&lt;/span&gt;&lt;/a&gt;Resharding by size and metric&lt;/h4&gt;\n&lt;p&gt;Resharding by size and metric is performed by splitting and combining neighboring tablets. Tables are resharded independently, except for the stage when planned actions are sorted by relevance.&lt;/p&gt;\n&lt;h5 id=\"algorithm-overview4\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#algorithm-overview4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Algorithm overview&lt;/span&gt;&lt;/a&gt;Algorithm overview&lt;/h5&gt;\n&lt;p&gt;The algorithm requires &lt;code&gt;desired_tablet_count&lt;/code&gt;. This value is used in each table to calculate the following values:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;desired_tablet_size = table_size / desired_tablet_count&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;min_tablet_size = desired_tablet_size / 1.9&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_tablet_size = desired_tablet_size * 1.9&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;desired_tablet_metric = table_metric / desired_tablet_count&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;min_tablet_metric = desired_tablet_metric / 1.9&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_tablet_metric = desired_tablet_metric * 1.9&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The algorithm splits large tablets and combines neighboring tablets. A tablet is considered too large if its size exceeds &lt;code&gt;max_tablet_size&lt;/code&gt; or its metric exceeds &lt;code&gt;max_tablet_metric&lt;/code&gt;. In this case, the tablet can be split into several smaller tablets so that the size of new tablets fits the specified limits. The algorithm will split a large tablet even if its value for the remaining parameter is smaller than the desired one. Tablets are combined if they are smaller than &lt;code&gt;min_tablet_size&lt;/code&gt; or &lt;code&gt;min_tablet_metric&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;If table resharding creates too many actions, exceeding the maximum number of actions per iteration, all planned reshards of this group are sorted by revelance, and only the most useful ones are performed. Other configuration recommendations can be found in the &lt;a href=\"en/user-guide/dynamic-tables/tablet-balancing.html#parameterized-reshard-config\"&gt;relevant section&lt;/a&gt;.&lt;/p&gt;\n&lt;dfn class=\"yfm yfm-term_dfn\" id=\":in-memory-move_element\" role=\"dialog\"&gt;&lt;p&gt;In-memory table balancing between tablet cells.&lt;/p&gt;\n&lt;/dfn&gt;&lt;dfn class=\"yfm yfm-term_dfn\" id=\":ordinary-move_element\" role=\"dialog\"&gt;&lt;p&gt;Disk table balancing between tablet cells.&lt;/p&gt;\n&lt;/dfn&gt;&lt;dfn class=\"yfm yfm-term_dfn\" id=\":parameterized-move_element\" role=\"dialog\"&gt;&lt;p&gt;Table balancing by load.&lt;/p&gt;\n&lt;/dfn&gt;&lt;dfn class=\"yfm yfm-term_dfn\" id=\":reshard_element\" role=\"dialog\"&gt;&lt;p&gt;Resharding by size.&lt;/p&gt;\n&lt;/dfn&gt;&lt;dfn class=\"yfm yfm-term_dfn\" id=\":parameterized-reshard_element\" role=\"dialog\"&gt;&lt;p&gt;Resharding by size and load.&lt;/p&gt;\n&lt;/dfn&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/dynamic-tables/tablet-balancing.md","sourcePath":"en/user-guide/dynamic-tables/tablet-balancing.md"},"headings":[{"title":"Balancing strategies","href":"en/user-guide/dynamic-tables/tablet-balancing.html#balancing-strategies","level":2},{"title":"Quick start for parameterized balancing","href":"en/user-guide/dynamic-tables/tablet-balancing.html#quick-start","level":2},{"title":"Balancing configuration","href":"en/user-guide/dynamic-tables/tablet-balancing.html#balancing-configuration","level":2,"items":[{"title":"Table groups","href":"en/user-guide/dynamic-tables/tablet-balancing.html#group","level":3,"items":[{"title":"Group configuration parameters","href":"en/user-guide/dynamic-tables/tablet-balancing.html#group-configuration-parameters","level":4},{"title":"System groups","href":"en/user-guide/dynamic-tables/tablet-balancing.html#system-groups","level":4}]},{"title":"Per-table settings","href":"en/user-guide/dynamic-tables/tablet-balancing.html#per-table-settings","level":3},{"title":"Per-bundle settings","href":"en/user-guide/dynamic-tables/tablet-balancing.html#per-bundle-settings","level":3},{"title":"Parameterized balancing configuration","href":"en/user-guide/dynamic-tables/tablet-balancing.html#parameterized","level":3},{"title":"Resharding configuration","href":"en/user-guide/dynamic-tables/tablet-balancing.html#resharding-configuration","level":3,"items":[{"title":"Resharding by size","href":"en/user-guide/dynamic-tables/tablet-balancing.html#reshard-config","level":4},{"title":"Resharding by size and parameter","href":"en/user-guide/dynamic-tables/tablet-balancing.html#parameterized-reshard-config","level":4}]},{"title":"Disabling","href":"en/user-guide/dynamic-tables/tablet-balancing.html#shutdown","level":3},{"title":"Automatic sharding schedule","href":"en/user-guide/dynamic-tables/tablet-balancing.html#schedule","level":3}]},{"title":"Implementation details","href":"en/user-guide/dynamic-tables/tablet-balancing.html#details","level":2,"items":[{"title":"Movement balancing","href":"en/user-guide/dynamic-tables/tablet-balancing.html#movement-balancing","level":3,"items":[{"title":"Parameterized balancing","href":"en/user-guide/dynamic-tables/tablet-balancing.html#parameterized-balancing","level":4,"items":[{"title":"Algorithm overview","href":"en/user-guide/dynamic-tables/tablet-balancing.html#algorithm-overview","level":5}]},{"title":"Balancing between disk tablet cells","href":"en/user-guide/dynamic-tables/tablet-balancing.html#balancing-between-disk-tablet-cells","level":4,"items":[{"title":"Algorithm overview","href":"en/user-guide/dynamic-tables/tablet-balancing.html#algorithm-over
