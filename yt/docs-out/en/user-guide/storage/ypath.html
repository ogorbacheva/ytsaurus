            {"data":{"leading":false,"html":"&lt;p&gt;This section contains information about YPath, a language that describes paths to objects in the YTsaurus system.&lt;/p&gt;\n&lt;p&gt;YPath is a language for describing paths that identify objects in the YTsaurus system. The language enables you to refer to nodes and specify annotations that may be useful when performing operations on nodes, such as writing to a table. You can use annotations to determine whether new data will be added to the end of the table or whether the table will be completely overwritten.&lt;/p&gt;\n&lt;p&gt;For example:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;//home/user/table&lt;/code&gt;: The path to &lt;code&gt;table&lt;/code&gt; in the user's home folder.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;#0-25-3ec012f-406daf5c/@type&lt;/code&gt;: The path to the &lt;code&gt;type&lt;/code&gt; attribute of the object with the &lt;code&gt;0-25-3ec012f-406daf5c&lt;/code&gt; ID.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;//home/user/table[#10:#20]&lt;/code&gt;: Rows 10 through 19 of &lt;code&gt;table&lt;/code&gt; in the user's home folder.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;There are several types of YPath. In the simplest case, YPath looks like a filesystem-like path, starting with a double slash &lt;code&gt;//&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"simple_ypath\"&gt;&lt;a href=\"en/user-guide/storage/ypath.html#simple_ypath\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Simple YPath&lt;/span&gt;&lt;/a&gt;Simple YPath&lt;/h2&gt;\n&lt;h3 id=\"simple_ypath_lexis\"&gt;&lt;a href=\"en/user-guide/storage/ypath.html#simple_ypath_lexis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Lexis&lt;/span&gt;&lt;/a&gt;Lexis&lt;/h3&gt;\n&lt;p&gt;The string that encodes simple YPath is split into the following &lt;strong&gt;tokens&lt;/strong&gt;:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Special characters&lt;/strong&gt;: Forward slash (&lt;code&gt;/&lt;/code&gt;), at sign (&lt;code&gt;@&lt;/code&gt;), ampersand (&lt;code&gt;&amp;amp;&lt;/code&gt;), and asterisk (&lt;code&gt;*&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Literals&lt;/strong&gt;: The maximum non-empty sequence of non-special characters. Literals allow escaping of the &lt;code&gt;\\&amp;lt;escape-sequence&amp;gt;&lt;/code&gt; form where &lt;code&gt;&amp;lt;escape-sequence&amp;gt;&lt;/code&gt; can be one of the characters: &lt;code&gt;\\&lt;/code&gt;, &lt;code&gt;/&lt;/code&gt;, &lt;code&gt;@&lt;/code&gt;, &lt;code&gt;&amp;amp;&lt;/code&gt;, &lt;code&gt;*&lt;/code&gt;, &lt;code&gt;[&lt;/code&gt;, or &lt;code&gt;{&lt;/code&gt;. Literals also allow an expression of the &lt;code&gt;x&amp;lt;hex1&amp;gt;&amp;lt;hex2&amp;gt;&lt;/code&gt; form where &lt;code&gt;&amp;lt;hex1&amp;gt;&lt;/code&gt; and &lt;code&gt;&amp;lt;hex2&amp;gt;&lt;/code&gt; are hexadecimal digits.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"simple_ypath_syntax\"&gt;&lt;a href=\"en/user-guide/storage/ypath.html#simple_ypath_syntax\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Syntax and semantics&lt;/span&gt;&lt;/a&gt;Syntax and semantics&lt;/h3&gt;\n&lt;p&gt;YPath is structured as &lt;code&gt;&amp;lt;root-designator&amp;gt;&amp;lt;relative-path&amp;gt;&lt;/code&gt;. Here &lt;code&gt;&amp;lt;root-designator&amp;gt;&lt;/code&gt; can be of two types:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Cypress root&lt;/strong&gt;: &lt;code&gt;/&lt;/code&gt; token.&lt;br /&gt;\nExample: &lt;code&gt;//home/user&lt;/code&gt;. Here &lt;code&gt;&amp;lt;root-designator&amp;gt;&lt;/code&gt; is &lt;code&gt;/&lt;/code&gt; and &lt;code&gt;&amp;lt;relative-path&amp;gt;&lt;/code&gt; is &lt;code&gt;/home/user&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Object root&lt;/strong&gt;: A token literal that encodes a string of an &lt;code&gt;#&amp;lt;id&amp;gt;&lt;/code&gt; form.&lt;br /&gt;\nExample: &lt;code&gt;#1-2-3-4/@type&lt;/code&gt;. Here &lt;code&gt;&amp;lt;root-designator&amp;gt;&lt;/code&gt; is &lt;code&gt;#1-2-3-4&lt;/code&gt; and &lt;code&gt;&amp;lt;relative-path&amp;gt;&lt;/code&gt; is &lt;code&gt;/@type&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Thus, &lt;code&gt;&amp;lt;root-designator&amp;gt;&lt;/code&gt; defines a starting point to which &lt;code&gt;&amp;lt;relative-path&amp;gt;&lt;/code&gt; applies. The latter is disassembled sequentially from left to right, resulting in tree movement steps of the following types:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Transition to descendant&lt;/strong&gt;: A sequence of a &lt;code&gt;/&lt;/code&gt; token and a literal.&lt;br /&gt;\nThis step type applies to dicts and lists. In case of a dict, the literal must contain the descendant name. Example: &lt;code&gt;/child&lt;/code&gt;: Transition to a descendant named &lt;code&gt;child&lt;/code&gt;.&lt;br /&gt;\nIn case of a list, the literal must contain an integer in the decimal system — the descendant number. Descendants in the list are numbered from zero. Negative numbers that enumerate descendants from the end of the list are also allowed. Example: &lt;code&gt;/1&lt;/code&gt; is transition to the second descendant in the list, &lt;code&gt;/-1&lt;/code&gt; is transition to the last descendant in the list.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Transition to attribute&lt;/strong&gt;: A sequence of &lt;code&gt;/@&lt;/code&gt; tokens and a literal.&lt;br /&gt;\nThis type of step is applicable at any point in the path and means transition to an attribute with the given name. Example: &lt;code&gt;/@attr&lt;/code&gt;: Transition to an attribute named &lt;code&gt;attr&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In YPath, a relative path starts with a slash. Thus, the slash serves not as a separator as in the case of file systems, but as a start of a command to traverse the metainformation tree. Consequently, the usual string concatenation is sufficient to merge two YPaths.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"simple_ypath_examples\"&gt;&lt;a href=\"en/user-guide/storage/ypath.html#simple_ypath_examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;% Cypress root\n/\n\n% The root directory has a home node, it has a user node.\n//home/user\n\n% Initial element in the //home/user/list list\n//home/user/list/0\n\n% Last element in the //home/user/list list\n//home/user/list/-1\n\n% The attr attribute of the //home/user node\n//home/user/@attr\n\n% The object with ID 1-2-a-b\n#1-2-a-b\n\n% The child descendant of the object with ID 1-2-a-b\n#1-2-a-b/child\n\n% The attr attribute of the object with ID 1-2-a-b\n#1-2-a-b/@attr\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"96\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-96\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-96\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-96.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"simple_ypath_behavior\"&gt;&lt;a href=\"en/user-guide/storage/ypath.html#simple_ypath_behavior\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Behavior specifics&lt;/span&gt;&lt;/a&gt;Behavior specifics&lt;/h3&gt;\n&lt;p&gt;In addition to the above rules, there are some special agreements. Most of them are due to the fact that YPath can identify not only existing metainformation entities, but also new ones created at the moment of execution of the command the argument of which is this YPath.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Specify all descendants&lt;/strong&gt;: You can use the &lt;code&gt;remove_node&lt;/code&gt; command to remove all descendants of a dict or list. To do this, use the &lt;code&gt;*&lt;/code&gt; token instead of the name.&lt;br /&gt;\nExample:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;% Clear the user's home folder\nyt remove //home/user/*\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"108\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-108\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-108\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-108.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Specify all attributes&lt;/strong&gt;: &lt;code&gt;/@&lt;/code&gt; is a YPath form that designates all attributes of an object. It can be used with read (&lt;code&gt;get_node&lt;/code&gt;, &lt;code&gt;list_nodes&lt;/code&gt;) commands to access the full collection of all attributes of an object.&lt;/p&gt;\n&lt;p&gt;Examples:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;% Get the values of all attributes of the user's home folder\nyt get //home/user/@\n\n% Get the names of all attributes of the user's home folder\nyt list //home/user/@\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"117\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-117\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-117\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-117.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The full collection of all attributes can also be &lt;em&gt;modified&lt;/em&gt; via the &lt;code&gt;set_node&lt;/code&gt; command. However, one should be warned that doing so will remove all attributes not mentioned in the value being set.&lt;/p&gt;\n&lt;p&gt;Examples:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;% Remove all attributes\nyt set //home/user/@ '{}'\n\n% Set two attributes and remove all other existing attributes\nyt set //home/user/@ '{attr1=value1; attr2=value2}'\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"124\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-124\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-124\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-124.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;This way of modifying attributes should not be used when working with Cypress (as opposed to an abstract YSON document) because it may lead to an inadvertent removal of system attributes of a node. Instead, individual attributes should be set.&lt;/p&gt;\n&lt;p&gt;Examples:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;% Set one attribute, do nothing with other attributes\nyt set //home/user/@attr value\n\n% Set the nested attribute\nyt set //home/user/@attr/some/key value\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"131\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-131\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-131\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-131.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Specify insertion position in the list&lt;/strong&gt;: Use commands that create new nodes (for example, &lt;code&gt;set_node&lt;/code&gt;) to specify the position of the node to be created in the list in relation to existing ones. To do this, use the special &lt;code&gt;begin&lt;/code&gt; (beginning of the list), &lt;code&gt;end&lt;/code&gt; (end of the list), &lt;code&gt;before:&amp;lt;index&amp;gt;&lt;/code&gt; (position before the descendant with the &lt;code&gt;&amp;lt;index&amp;gt;&lt;/code&gt; number), and &lt;code&gt;after:&amp;lt;index&amp;gt;&lt;/code&gt; (position after the descendant with the &lt;code&gt;&amp;lt;index&amp;gt;&lt;/code&gt; number) strings. Examples:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;% Add the \"value\" element to the end of the //home/user/list list\nyt set //home/user/list/end value\n\n% Insert the \"value\" element at the beginning of the //home/user/list list\nyt set //home/user/list/before:0 value\n% Or\nyt set //home/user/list/begin value\n\n% Insert the \"value\" element before the second element in the //home/user/list list\nyt set //home/user/list/before:2 value\n\n% Insert the \"value\" element after the fifth element in the //home/user/list list\nyt set //home/user/list/after:5 value\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"137\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-137\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-137\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-137.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Disable redirection&lt;/strong&gt;: The &lt;code&gt;&amp;amp;&lt;/code&gt; token can be used to suppress redirections via a &lt;a href=\"user-guide/storage/links.html\"&gt;symbolic link&lt;/a&gt;.&lt;br /&gt;\nExamples:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;% Find the ID of the link object itself, not the object the link points to\nyt get //home/user/link&amp;amp;/@id\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"143\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-143\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-143\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-143.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"rich_ypath\"&gt;&lt;a href=\"en/user-guide/storage/ypath.html#rich_ypath\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rich YPath&lt;/span&gt;&lt;/a&gt;Rich YPath&lt;/h2&gt;\n&lt;p&gt;&lt;strong&gt;Rich&lt;/strong&gt; YPath is an YPath extended with additional annotations. These annotations can be specified in two ways: either as &lt;strong&gt;attributes&lt;/strong&gt; (key-value pairs) or &lt;strong&gt;syntactically&lt;/strong&gt; by adding special prefixes and suffixes to a simple YPath, which turns it into the &lt;code&gt;&amp;lt;prefix&amp;gt;&amp;lt;simple-ypath&amp;gt;&amp;lt;suffix&amp;gt;&lt;/code&gt; string.&lt;/p&gt;\n&lt;p&gt;If there is no &lt;code&gt;&amp;lt;prefix&amp;gt;&lt;/code&gt; and &lt;code&gt;&amp;lt;suffix&amp;gt;&lt;/code&gt;, rich  YPath can have, for example, the following form:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;\n  append = %true;\n  compression_codec = lz4;\n&amp;gt;\n//home/user/table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"155\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-155\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-155\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-155.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;This path points to the user's home folder and has two attributes.&lt;/p&gt;\n&lt;p&gt;An arbitrary set of attributes can be specified on any path. Their exact meaning depends on how this path is used in the application. For example, when writing to a table, it is natural to support the &lt;code&gt;append&lt;/code&gt; attribute. For input tables of some mapreduce operations, you can specify the &lt;code&gt;foreign&lt;/code&gt; flag, which means that this table is secondary (a reference table), so the system needs to perform join of a special form.&lt;/p&gt;\n&lt;p&gt;Attributes whose names are unknown to the system are ignored by the system, but still may be interpreted by the application.&lt;/p&gt;\n&lt;p&gt;The path prefix and suffix enable you to encode attributes in a more compact form. Both of these parts use &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON&lt;/a&gt;. Learn more about them:&lt;/p&gt;\n&lt;h3 id=\"rich_ypath_prefix\"&gt;&lt;a href=\"en/user-guide/storage/ypath.html#rich_ypath_prefix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Prefix&lt;/span&gt;&lt;/a&gt;Prefix&lt;/h3&gt;\n&lt;p&gt;The &lt;code&gt;&amp;lt;prefix&amp;gt;&lt;/code&gt; part is either empty or sets attributes as a map-fragment in &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON&lt;/a&gt; format.&lt;br /&gt;\nExample: &lt;code&gt;&amp;lt;append=%true&amp;gt;//home/user/table&lt;/code&gt; sets the path to the table in the user's home folder and also passes the additional &lt;code&gt;append&lt;/code&gt; attribute to us.&lt;/p&gt;\n&lt;p&gt;In addition to this attribute map, there is a shorthand to specify &lt;code&gt;cluster&lt;/code&gt; attribute: &lt;code&gt;my-cluster://path/to/object&lt;/code&gt;. This shorthand is equivalent to specifying &lt;code&gt;cluster&lt;/code&gt; manually in the attribute map: &lt;code&gt;&amp;lt;cluster=\"my-cluster\"&amp;gt;//path/to/object&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;If both &lt;code&gt;cluster&lt;/code&gt; attribute and this shorthand are used, the shorthand has the preference.&lt;/p&gt;\n&lt;p&gt;The main purpose of the prefix is to make it easier to pass attributes when using commands from the console.&lt;/p&gt;\n&lt;h3 id=\"rich_ypath_suffix\"&gt;&lt;a href=\"en/user-guide/storage/ypath.html#rich_ypath_suffix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Suffix&lt;/span&gt;&lt;/a&gt;Suffix&lt;/h3&gt;\n&lt;p&gt;The &lt;code&gt;&amp;lt;suffix&amp;gt;&lt;/code&gt;part is either empty or indicates columns and/or ranges of rows in the referenced table.&lt;/p&gt;\n&lt;p&gt;The column selection modifier, if any, is always specified first, followed by the row selection modifier, if there is one.&lt;/p&gt;\n&lt;p&gt;The &lt;strong&gt;column selection modifier&lt;/strong&gt; is a comma-separated set of column names, specified in curly brackets. Each name is represented by a YSON string.&lt;/p&gt;\n&lt;p&gt;Examples of column selection modifiers: &lt;code&gt;{a}&lt;/code&gt;, &lt;code&gt;{a,b}&lt;/code&gt;, and &lt;code&gt;{}&lt;/code&gt; .&lt;/p&gt;\n&lt;p&gt;The formal grammar of column selection modifiers:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;column-selector&amp;gt; = '{' { &amp;lt;column-selector-item&amp;gt; ',' } [ &amp;lt;column-selector-item&amp;gt; ] '}'\n&amp;lt;column-selector-item&amp;gt; = &amp;lt;string&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"201\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-201\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-201\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-201.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The &lt;strong&gt;row selection modifier&lt;/strong&gt; is a comma-separated set of table row ranges, specified in square brackets. Each range is a pair of lower- and upper-range boundaries separated by a colon. Either or both boundaries may be missing. In that case, the range extends without a boundary on that side.&lt;br /&gt;\nThe boundary can either be a number with the &lt;code&gt;#&lt;/code&gt; symbol appended to the left (in this case, it is the row number in the table) or a list of values (in this case, it is a boundary on the values of the key columns by which the table is sorted). The specified list can be shorter than the number of fields by which the table is sorted. If the list of columns contains just one element, that element does not have to be enclosed in parentheses. That element, however, must be a valid YSON value of scalar type: &lt;code&gt;int64&lt;/code&gt;, &lt;code&gt;uint64&lt;/code&gt;, &lt;code&gt;string&lt;/code&gt;, &lt;code&gt;double&lt;/code&gt;, or &lt;code&gt;bool&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;For information about the modifier semantics, see &lt;a href=\"en/user-guide/storage/ypath.html#key_selectors\"&gt;this section&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Examples of row selection modifiers: &lt;code&gt;[:]&lt;/code&gt;, &lt;code&gt;[#10:#100]&lt;/code&gt;, &lt;code&gt;[a:m]&lt;/code&gt;, &lt;code&gt;[(abc,8):(xyz,5)]&lt;/code&gt;, &lt;code&gt;[:5.0,10.0:]&lt;/code&gt;, &lt;code&gt;[#10]&lt;/code&gt;, &lt;code&gt;[a,#100,#1:#2]&lt;/code&gt;, and &lt;code&gt;[100u:200u]&lt;/code&gt;. In the latter case, the data contains unsigned numbers.&lt;/p&gt;\n&lt;p&gt;The formal grammar of row selection modifiers:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;row-selector&amp;gt; = '[' { &amp;lt;row-range&amp;gt; ',' } [ &amp;lt;row-range&amp;gt; ] ']'\n\n&amp;lt;row-range&amp;gt; = &amp;lt;row-index-range-selector&amp;gt; | &amp;lt;row-key-range-selector&amp;gt; | &amp;lt;row-index&amp;gt; | &amp;lt;row-composite-key&amp;gt; | ''\n\n&amp;lt;row-index-range-selector&amp;gt; = [ &amp;lt;row-index&amp;gt; ] ':' [ &amp;lt;row-index&amp;gt; ]\n\n&amp;lt;row-index&amp;gt; = '#' &amp;lt;int64&amp;gt;\n\n&amp;lt;row-key-range-selector&amp;gt; = [ &amp;lt;row-composite-key&amp;gt; ] ':' [ &amp;lt;row-composite-key&amp;gt; ]\n\n&amp;lt;row-composite-key&amp;gt; = &amp;lt;row-key&amp;gt; | &amp;lt;row-key-tuple&amp;gt;\n\n&amp;lt;row-key-tuple&amp;gt; = '(' { &amp;lt;row-key&amp;gt; ',' } [ &amp;lt;row-key&amp;gt; ] ')'\n\n&amp;lt;row-key&amp;gt; = &amp;lt;string&amp;gt; | &amp;lt;int64&amp;gt; | &amp;lt;uint64&amp;gt; | &amp;lt;bool&amp;gt; | &amp;lt;double&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"214\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-214\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-214\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-214.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"rich_ypath_examples\"&gt;&lt;a href=\"en/user-guide/storage/ypath.html#rich_ypath_examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h3&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Rich paths oftentimes need to be enclosed in single quotes to be parsed by the shell properly.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;% Read the entire '//home/user/table' table\nyt read '//home/user/table'\n\n% Read all rows of the '//home/user/table' table without selecting any columns\nyt read '//home/user/table{}'\n\n% Read column 'a'\nyt read '//home/user/table{a}'\n\n% Read columns 'a' and 'b'\nyt read '//home/user/table{a,b}'\n\n% Read the first 100 rows of the '//home/user/table' table and select all columns\nyt read '//home/user/table[#0:#100]'\n\n% Read all rows, skipping the first 100\nyt read '//home/user/table[#100:]'\n\n% Read row 100 (counting from 0)\nyt read '//home/user/table[#100]'\n\n% Read rows with the 'abc' key (or the first key coordinate)\nyt read '//home/user/table[\"abc\":\"abc\\x00\"]'\n\n% The query above can also be expressed in a more concise way:\nyt read '//home/user/table[\"abc\"]'\n\n% Read rows with keys no smaller than '(a,1)'\nyt read '//home/user/table[(a,1):]'\n\n% Read rows with the first two key components equal to 'a' and '1', respectively\nyt read '//home/user/table[(a,1)]'\n\n% Read rows where the first key is 'a' and the second key starts with 'b'. If the second key is 'b', then the third key must be no smaller than '1'.\nyt read '//home/user/table[(a,b,1):(a,c)]'\n\n% Read rows where the first key starts with 'a' and rows where the first key is 'b' and the second is smaller than '1'.\nyt read '//home/user/table[a:(b,1)]'\n\n% Read rows where the first key starts with 'a', rows where the first key is 'b' and the second is smaller than '1', and rows where the first key is 'b', the second is '1', and the third has a negative value of the double type. Select columns 'ab', 'ac'\nyt read '//home/user/table{ab,ac}[a:(b,1,0.0)]'\n\n% Convert table1 with columns a,b,c,d to table2 with columns a,b,c and sort by fields a,b\nyt sort --src '//home/users/table1{a,b,c}' --dst //home/users/table2 --sort-by a --sort-by b --spec '{schema_inference_mode = from_output}'\n\n% Convert table1 with columns a,b,c,d to table2 with columns a,b,c\nyt merge --src '//home/users/table1{a,b,c}' --dst //home/users/table2 --spec '{schema_inference_mode = from_output}'\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"228\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-228\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-228\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-228.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"ypath_canonical_form\"&gt;&lt;a href=\"en/user-guide/storage/ypath.html#ypath_canonical_form\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YPath canonical form&lt;/span&gt;&lt;/a&gt;YPath canonical form&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"en/user-guide/storage/ypath.html#rich_ypath\"&gt;Rich YPath&lt;/a&gt; can be brought into &lt;strong&gt;canonical form&lt;/strong&gt;. In canonical form, there is no prefix and suffix. Instead, all auxiliary information is explicitly put in the attributes assigned to the &lt;a href=\"en/user-guide/storage/ypath.html#simple_ypath\"&gt;simple YPath&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Example: after canonicalizing the &lt;code&gt;&amp;lt;append=true&amp;gt;//home/user/table[#10:#20]&lt;/code&gt; path, you get the following YSON structure:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;\n  append = true;\n  ranges = [\n    {\n      lower_limit = {row_index = 10};\n      upper_limit = {row_index = 20}\n    }\n  ]\n&amp;gt;\n\"//home/user/table\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"238\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-238\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-238\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-238.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Internally, the YTsaurus system prefers to work with the canonical form of paths. Canonical form is larger, so the system allows to use the more convenient form with a prefix and suffix in the input paths:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;append=true&amp;gt;//home/user/table[#10:#20]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"242\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-242\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-242\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-242.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Prefix: &lt;code&gt;&amp;lt;append=true&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Suffix: &lt;code&gt;[#10:#20]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;This will be converted to a more verbose string inside the system:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;  ranges = [\n    {\n      lower_limit = {row_index = 10};\n      upper_limit = {row_index = 20}\n    }\n  ]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"252\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-252\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-252\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-252.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The &lt;code&gt;parse_ypath&lt;/code&gt; driver &lt;a href=\"api/commands.html#parse_ypath\"&gt;command&lt;/a&gt; canonicalizes a rich YPath.&lt;/p&gt;\n&lt;h2 id=\"known_attributes\"&gt;&lt;a href=\"en/user-guide/storage/ypath.html#known_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Supported attributes&lt;/span&gt;&lt;/a&gt;Supported attributes&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"en/user-guide/storage/ypath.html#rich_ypath\"&gt;Rich YPath&lt;/a&gt; can be annotated with arbitrary attributes, allowing for expansion. The table contains a list of attributes recognized by the system.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Attribute&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;append&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Recognized by the data write commands (&lt;code&gt;write_table&lt;/code&gt; and &lt;code&gt;write_file&lt;/code&gt;) and means that new data is added to the end of the existing data, but does not overwrite it. It is also recognized on the output paths of tables in the specifications of all scheduler operations and has similar semantics.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;sorted_by&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Recognized by the table data write command (&lt;code&gt;write_table&lt;/code&gt;). By specifying this attribute, the user promises that the written data is ordered by the specified set of columns. The system checks this property. The keys must go in non-descending order. When new data is being written, it is also checked that the first key to be written is no smaller than the last existing one. The attribute is also recognized by the system on the output paths of tables in the specifications of all scheduler operations and has similar semantics. In the latter case, it is also additionally required that the ranges of keys generated by different jobs have no intersections on the inner point. Intersections on the boundaries are allowed.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ranges&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;ReadRange&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Recognized by the data read commands (&lt;code&gt;read_table&lt;/code&gt; and &lt;code&gt;read_file&lt;/code&gt;) and specifies a list of ranges for reading. If it is missing, the entire dataset is read. It is also recognized on the input paths of tables in the specifications of all scheduler operations. A description of the &lt;code&gt;ReadRange&lt;/code&gt; dict structure is given in the table below.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;columns&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Recognized by the table data read command (&lt;code&gt;read_table&lt;/code&gt;) and specifies a list of names of readable columns. If it is missing, all columns are read. It is also recognized on the input paths of tables in the specifications of all scheduler operations.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;optimize_for&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Sets the storage format for the created table. The attribute can be specified with the &lt;code&gt;write_table&lt;/code&gt; command and on the output paths of operations. This attribute &lt;strong&gt;is not compatible&lt;/strong&gt; with &lt;code&gt;&amp;lt;append=true&amp;gt;&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;compression_codec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Sets the compression format for the created table. The attribute can be specified with the &lt;code&gt;write_file&lt;/code&gt; and &lt;code&gt;write_table&lt;/code&gt; commands and on the output paths of operations. This attribute &lt;strong&gt;is not compatible&lt;/strong&gt; with &lt;code&gt;&amp;lt;append=true&amp;gt;&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;erasure_codec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Enables erasure coding for the created table. The attribute can be specified with the &lt;code&gt;write_file&lt;/code&gt; and &lt;code&gt;write_table&lt;/code&gt; commands and on the output paths of operations. This attribute &lt;strong&gt;is not compatible&lt;/strong&gt; with &lt;code&gt;&amp;lt;append=true&amp;gt;&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;schema&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;yson-list&lt;/code&gt; with a valid schema&lt;/td&gt;\n&lt;td&gt;Validates data with respect to the specified schema and places this schema on the table at the end of the operation. The attribute can be specified with the &lt;code&gt;write_table&lt;/code&gt; command and on the output paths of operations. This attribute &lt;strong&gt;is not compatible&lt;/strong&gt; with &lt;code&gt;&amp;lt;append=true&amp;gt;&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt; of the id form&lt;/td&gt;\n&lt;td&gt;Specifies to the scheduler under which transaction the input table should be accessed if this attribute is specified on it.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;rename_columns&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;yson-map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Recognized on the input paths of tables. Renames the column names according to the mapping before feeding the table to the input of the operation. This attribute &lt;strong&gt;is not compatible&lt;/strong&gt; with &lt;code&gt;teleport&lt;/code&gt; tables.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;cluster&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Recognized on the input paths of tables. Makes the scheduler to treat the table as a remote table from another cluster.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;The &lt;code&gt;ranges&lt;/code&gt; attribute specifies which ranges of table rows should be read. The specified ranges will be read sequentially, in the order in which they are specified in the attribute. If the ranges overlap, the output will be repeated.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Attribute&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;lower_limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ReadLimit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Lower read limit&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;upper_limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ReadLimit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Upper read limit&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;exact&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ReadLimit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Exact read limit value (cannot be specified with lower_limit or upper_limit)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;All limit types except for &lt;code&gt;key_bound&lt;/code&gt; are inclusive in the &lt;code&gt;lower_limit&lt;/code&gt; attribute and exclusive in the &lt;code&gt;upper_limit&lt;/code&gt; attribute. Whether a &lt;code&gt;key_bound&lt;/code&gt; limit is inclusive or exclusive is specified explicitly within the key bound itself. Learn more in the section on &lt;a href=\"en/user-guide/storage/ypath.html#key_selectors\"&gt;slices by key&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;ReadLimit&lt;/code&gt; describes a separate read limit. Limits can be defined using one of the six &lt;strong&gt;selectors&lt;/strong&gt;: key, key bound, row index, chunk index, tablet index, or byte offset. You can specify multiple selectors for a single limit. In this case, they all apply together, reinforcing each other.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Attribute&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;key&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;List of values that form the key (for sorted tables only) Learn more in &lt;a href=\"en/user-guide/storage/ypath.html#key_selectors\"&gt;this section&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;key_bound&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Inclusive or exclusive key prefix limit. Cannot be used with exact limits. Learn more in &lt;a href=\"en/user-guide/storage/ypath.html#key_selectors\"&gt;this section&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;row_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Row number (for tables only)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;offset&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Byte offset (for files only)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Chunk index&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Tablet index (for ordered dynamic tables only)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;YPath attributes on the paths of &lt;strong&gt;files&lt;/strong&gt; supported by the YTsaurus system&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Attribute&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;file_name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Recognized when ordering a file in the &lt;code&gt;sandbox&lt;/code&gt; of the job. The attribute specifies the relative path on which to place the file.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;executable&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Recognized when ordering a file in the &lt;code&gt;sandbox&lt;/code&gt; of the job. The attribute tells the system to set an executable bit on the ordered file.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;bypass_artifact_cache&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Recognized when ordering a file in the &lt;code&gt;sandbox&lt;/code&gt; of the job. The attribute enables direct file download to the &lt;code&gt;sandbox&lt;/code&gt; of the job, bypassing the file cache on the node.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;format&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Recognized when ordering a table file in the &lt;code&gt;sandbox&lt;/code&gt; of the job. The attribute specifies the format in which the table should be formatted when it is downloaded to the &lt;code&gt;sandbox&lt;/code&gt; of the job.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"key_selectors\"&gt;&lt;a href=\"en/user-guide/storage/ypath.html#key_selectors\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sorted table slices by key&lt;/span&gt;&lt;/a&gt;Sorted table slices by key&lt;/h2&gt;\n&lt;p&gt;The system supports two types of selectors based on key column values. These selectors appear similar but differ in behavior. The first type is historically older and is implemented by the &lt;code&gt;key&lt;/code&gt; selector. You can also specify it in the &lt;a href=\"en/user-guide/storage/ypath.html#rich_ypath_suffix\"&gt;YPath suffix&lt;/a&gt;. The second type is newer and is implemented by the &lt;code&gt;key_bound&lt;/code&gt; selector. It is only available via the &lt;code&gt;ranges&lt;/code&gt; attribute in the YPath prefix.&lt;/p&gt;\n&lt;p&gt;For new applications, we recommend using the &lt;code&gt;key_bound&lt;/code&gt; selector because of its more transparent behavior and greater flexibility in use, even though it is more verbose.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;As a reminder, YTsaurus defines a linear order for all possible values that may occur in a table. Specifically, int64, uint64, double, and boolean values are ordered naturally within their respective types, while string values are ordered lexicographically. Two values of different data types are compared according to the implementation-defined rules for how the types themselves are compared. For example, any int64 is less than any uint64, and any null is less than any non-null (&lt;code&gt;#&lt;/code&gt;) value.&lt;/p&gt;\n&lt;p&gt;Because of this, you should always pay attention to the respective data types when comparing values. Specifically, unsigned integers must be specified with the suffix &lt;code&gt;u&lt;/code&gt;, and fractions should have a decimal point.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"selector\"&gt;&lt;a href=\"en/user-guide/storage/ypath.html#selector\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt; selector&lt;/span&gt;&lt;/a&gt;&lt;code&gt;key&lt;/code&gt; selector&lt;/h3&gt;\n&lt;p&gt;The &lt;code&gt;key&lt;/code&gt; selector can only be used for sorted tables where all key columns are sorted in ascending order. The &lt;code&gt;key&lt;/code&gt; selector's type is a list of values, with its behavior defined as follows.&lt;/p&gt;\n&lt;p&gt;Let's examine various tuples consisting of YTsaurus type system values. We will define a linear lexicographic order for these tuples. For example, as follows:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;[] &amp;lt; [\"a\"] &amp;lt; [\"a\"; 3] &amp;lt; [\"a\"; 4] &amp;lt; [\"b\"] &amp;lt; [\"b\"; 2]&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Using this order, we can compare two tuples of any length. The comparison result is determined by the first differing tuple components, provided they exist. If not, the shorter tuple is considered smaller.&lt;/p&gt;\n&lt;p&gt;If the &lt;code&gt;key&lt;/code&gt; selector is specified as part of the &lt;code&gt;lower_limit&lt;/code&gt; attribute (or as a lower limit preceding the colon in a row selection modifier within the YPath suffix), it only returns those rows where the &lt;strong&gt;full&lt;/strong&gt; key, represented as a tuple, is greater than or equal to the &lt;code&gt;key&lt;/code&gt; tuple based on the comparison logic described above. This means that the definition of the &lt;code&gt;key&lt;/code&gt; selector remains valid even if it includes a tuple with fewer or more values than the number of key columns in the table.&lt;/p&gt;\n&lt;p&gt;If the &lt;code&gt;key&lt;/code&gt; selector is specified as part of the &lt;code&gt;upper_limit&lt;/code&gt; attribute (or as an upper limit following the colon in a row selection modifier within the YPath suffix), it only returns those rows where the &lt;strong&gt;full&lt;/strong&gt; key, represented as a tuple, is &lt;strong&gt;strictly&lt;/strong&gt; smaller than the &lt;code&gt;key&lt;/code&gt; tuple.&lt;/p&gt;\n&lt;p&gt;If the &lt;code&gt;key&lt;/code&gt; selector is specified as part of the &lt;code&gt;exact&lt;/code&gt; attribute (or as the only limit in a colonless row selection modifier within the YPath suffix), it only returns those rows where the full key contains the &lt;code&gt;key&lt;/code&gt; tuple as its prefix.&lt;/p&gt;\n&lt;h4 id=\"examples\"&gt;&lt;a href=\"en/user-guide/storage/ypath.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n&lt;p&gt;Suppose the &lt;code&gt;//tmp/t&lt;/code&gt; table has two key columns and contains the following keys:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[\"a\"; 1];\n[\"a\"; 3];\n[\"a\"; 5];\n[\"b\"; 2];\n[\"b\"; 4];\n[\"c\"; 0];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"658\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-658\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-658\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-658.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The &lt;code&gt;//tmp/t[(b):]&lt;/code&gt; slice, also expressed as &lt;code&gt;&amp;lt;ranges = [{lower_limit = {key = [b]}}]&amp;gt;//tmp/t&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[\"b\"; 2];\n[\"b\"; 4];\n[\"c\"; 0];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"662\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-662\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-662\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-662.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The &lt;code&gt;//tmp/t[(b, 2, 56):]&lt;/code&gt; slice (note that a key within a slice can have more values than there are key columns present in the table):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[\"b\"; 4];\n[\"c\"; 0];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"666\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-666\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-666\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-666.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The &lt;code&gt;//tmp/t[:(c, 0)]&lt;/code&gt; slice:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[\"a\"; 1];\n[\"a\"; 3];\n[\"a\"; 5];\n[\"b\"; 2];\n[\"b\"; 4];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"670\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-670\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-670\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-670.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The &lt;code&gt;//tmp/t[(b)]&lt;/code&gt; slice:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[\"b\"; 2];\n[\"b\"; 4];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"674\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-674\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-674\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-674.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Obtaining an exclusive lower limit or an inclusive upper limit using the &lt;code&gt;key&lt;/code&gt; selector requires specifying the tuple's successor according to the linear comparison rules defined for the tuples above, rather than the tuple itself. Doing so can often be challenging. For this reason, the service introduced the &lt;code&gt;key_bound&lt;/code&gt; selector, which is detailed in the following section.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"selector1\"&gt;&lt;a href=\"en/user-guide/storage/ypath.html#selector1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt; selector&lt;/span&gt;&lt;/a&gt;&lt;code&gt;key_bound&lt;/code&gt; selector&lt;/h3&gt;\n&lt;p&gt;The &lt;code&gt;key_bound&lt;/code&gt; selector is available for use in sorted tables where key columns may be sorted in both descending and ascending order. The value of the &lt;code&gt;key_bound&lt;/code&gt; selector is a list containing two values. The first one specifies the &lt;strong&gt;relation&lt;/strong&gt;, which is represented by one of the four strings — &lt;code&gt;\"&amp;gt;\", \"&amp;gt;=\", \"&amp;lt;\", \"&amp;lt;=\"&lt;/code&gt;, — while the second one is a list of values that defines the key &lt;strong&gt;prefix&lt;/strong&gt;. The &lt;code&gt;&amp;gt;&lt;/code&gt; and &lt;code&gt;&amp;gt;=&lt;/code&gt; relational operators can only occur in the &lt;code&gt;lower_limit&lt;/code&gt; attribute, while &lt;code&gt;&amp;lt;&lt;/code&gt; and &lt;code&gt;&amp;lt;=&lt;/code&gt; only occur in &lt;code&gt;upper_limit&lt;/code&gt;. The &lt;code&gt;exact&lt;/code&gt; attribute does not allow &lt;code&gt;key_bound&lt;/code&gt; selectors.&lt;/p&gt;\n&lt;p&gt;Examples of &lt;code&gt;key_bound&lt;/code&gt; selectors:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;[\"&amp;gt;\"; [\"a\"; 3]]&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;[\"&amp;lt;=\"; [\"b\"]]&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;[\"&amp;gt;=\"; []]&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Let's examine the semantics of this selector. Consider a table with &lt;code&gt;N&lt;/code&gt; key columns and a key bound. Suppose that the length of the key bound prefix is &lt;code&gt;K&lt;/code&gt;. To apply the key bound to this table, &lt;code&gt;K&lt;/code&gt; must be between 0 and &lt;code&gt;N&lt;/code&gt;. Attempting to specify a longer prefix in the key bound will result in an error.&lt;/p&gt;\n&lt;p&gt;To determine if a row with a specific key matches the selector, we need to extract a prefix of length &lt;code&gt;K&lt;/code&gt; from that key and perform a lexicographic comparison of the resulting value against the key bound prefix. If the result of the comparison matches the specified relation, the selector returns the row, otherwise it does not.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;If a key column's &lt;code&gt;sort_order = descending&lt;/code&gt;, the results of all comparisons involving the corresponding key tuple components are inverted. For instance, in this case, the relations &lt;code&gt;5u &amp;lt; 2u&lt;/code&gt; and &lt;code&gt;\"foo\" &amp;lt; #&lt;/code&gt; are true.&lt;/p&gt;\n&lt;p&gt;Also note that the behavior of the &lt;code&gt;key_bound&lt;/code&gt; selector only defines the comparison of tuples of the same length (represented as &lt;code&gt;K&lt;/code&gt;), so defining the comparison of tuples of different lengths with sorting in descending order is not necessary.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Specifically, according to the definition above, the selectors &lt;code&gt;[\"&amp;gt;=\"; []]&lt;/code&gt; and &lt;code&gt;[\"&amp;lt;=\"; []]&lt;/code&gt; match any row because the tuple &lt;code&gt;[]&lt;/code&gt; corresponds to a key prefix of length 0, while the selectors &lt;code&gt;[\"&amp;gt;\"; []]&lt;/code&gt; and &lt;code&gt;[\"&amp;lt;\"; []]&lt;/code&gt; do not match any rows.&lt;/p&gt;\n&lt;h4 id=\"examples1\"&gt;&lt;a href=\"en/user-guide/storage/ypath.html#examples1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n&lt;p&gt;Let's examine the &lt;code&gt;//tmp/t&lt;/code&gt; table with the keys from the example above:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[\"a\"; 1];\n[\"a\"; 3];\n[\"a\"; 5];\n[\"b\"; 2];\n[\"b\"; 4];\n[\"c\"; 0];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"739\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-739\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-739\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-739.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The &lt;code&gt;&amp;lt;ranges = [{lower_limit = {key_bound = [\"&amp;gt;\"; [\"a\"; 3]]}}]&amp;gt;//tmp/t&lt;/code&gt; slice:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[\"a\"; 5];\n[\"b\"; 2];\n[\"b\"; 4];\n[\"c\"; 0];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"743\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-743\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-743\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-743.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The &lt;code&gt;&amp;lt;ranges = [{upper_limit = {key_bound = [\"&amp;lt;=\"; [\"b\"]]}}]&amp;gt;//tmp/t&lt;/code&gt; slice:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[\"a\"; 1];\n[\"a\"; 3];\n[\"a\"; 5];\n[\"b\"; 2];\n[\"b\"; 4];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"747\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-747\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-747\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-747.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Note that although the tuple &lt;code&gt;[\"b\"; 2]&lt;/code&gt; is lexicographically greater than the tuple &lt;code&gt;[\"b\"]&lt;/code&gt;, truncating the key &lt;code&gt;[\"b\"; 2]&lt;/code&gt; to a length of 1 transforms it into the tuple &lt;code&gt;[\"b\"]&lt;/code&gt;, allowing it to match the key bound &lt;code&gt;[“&amp;lt;=”; [“b”]]&lt;/code&gt;. This behavior of the &lt;code&gt;key_bound&lt;/code&gt; selector differs from that of the &lt;code&gt;key&lt;/code&gt; selector, providing the former with greater flexibility, since specifying a similar slice using the &lt;code&gt;key&lt;/code&gt; selector is a non-trivial task.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;The &lt;code&gt;&amp;lt;ranges = [{lower_limits = {key_bound = [\"&amp;gt;=\"; [\"b\"; 2; 56]]}}]&amp;gt;//tmp/t&lt;/code&gt; slice is not valid, and attempting to use it results in the error: &lt;code&gt;Key bound length must not exceed schema key prefix length&lt;/code&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/storage/ypath.md","sourcePath":"en/user-guide/storage/ypath.md"},"headings":[{"title":"Simple YPath","href":"en/user-guide/storage/ypath.html#simple_ypath","level":2,"items":[{"title":"Lexis","href":"en/user-guide/storage/ypath.html#simple_ypath_lexis","level":3},{"title":"Syntax and semantics","href":"en/user-guide/storage/ypath.html#simple_ypath_syntax","level":3},{"title":"Examples","href":"en/user-guide/storage/ypath.html#simple_ypath_examples","level":3},{"title":"Behavior specifics","href":"en/user-guide/storage/ypath.html#simple_ypath_behavior","level":3}]},{"title":"Rich YPath","href":"en/user-guide/storage/ypath.html#rich_ypath","level":2,"items":[{"title":"Prefix","href":"en/user-guide/storage/ypath.html#rich_ypath_prefix","level":3},{"title":"Suffix","href":"en/user-guide/storage/ypath.html#rich_ypath_suffix","level":3},{"title":"Examples","href":"en/user-guide/storage/ypath.html#rich_ypath_examples","level":3}]},{"title":"YPath canonical form","href":"en/user-guide/storage/ypath.html#ypath_canonical_form","level":2},{"title":"Supported attributes","href":"en/user-guide/storage/ypath.html#known_attributes","level":2},{"title":"Sorted table slices by key","href":"en/user-guide/storage/ypath.html#key_selectors","level":2,"items":[{"title":"key selector","href":"en/user-guide/storage/ypath.html#
