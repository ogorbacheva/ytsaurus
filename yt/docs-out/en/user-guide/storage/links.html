        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section provides information on &lt;a href=\"https://en.wikipedia.org/wiki/Symbolic_link\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;symbolic links&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"common\"&gt;&lt;a href=\"en/user-guide/storage/links.html#common\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General information&lt;/span&gt;&lt;/a&gt;General information&lt;/h2&gt;\n&lt;p&gt;The system supports &lt;code&gt;soft links&lt;/code&gt; in &lt;a href=\"user-guide/storage/cypress.html\"&gt;Cypress&lt;/a&gt;. This link is a node of type &lt;code&gt;link&lt;/code&gt; referencing another &lt;code&gt;target&lt;/code&gt; object.&lt;br /&gt;\nThe path to it is specified at link creation time. While the address is being computed for the operation, all attempts to access the link node are automatically redirected to the target object.&lt;/p&gt;\n&lt;p&gt;A link to a target object depends on its path.&lt;br /&gt;\nIf a target path is deleted or moved, the link will break. You will see an error message saying &lt;code&gt;Link target does not exist&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;A link node does not take up space on disk. Its &lt;code&gt;resource_usage/disk_space&lt;/code&gt; attribute is equal to 0. Therefore, creating links cannot cause you to exceed your disk quota.&lt;br /&gt;\nHowever, each link is actually a separate &lt;code&gt;node&lt;/code&gt;, so it's possible to exceed your account's limit on the number of &lt;code&gt;nodes&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"create\"&gt;&lt;a href=\"en/user-guide/storage/links.html#create\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Creating&lt;/span&gt;&lt;/a&gt;Creating&lt;/h2&gt;\n&lt;p&gt;You can create a symbolic link with the &lt;code&gt;link&lt;/code&gt; &lt;a href=\"api/commands.html#link\"&gt;command&lt;/a&gt;. Use the path to the target node and the path to the link node in that order as arguments:&lt;/p&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;link&lt;/span&gt; //tmp/target_table //tmp/target_table_link\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"24\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-24\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-24\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-24.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;A link may reference arbitrary nodes and objects.&lt;br /&gt;\nSuch as the &lt;code&gt;//tmp&lt;/code&gt; subtree in the home directory:&lt;/p&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;link&lt;/span&gt; //tmp //home/username/my_own_tmp\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"31\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-31\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-31\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-31.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Relative links are not supported.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"redirects\"&gt;&lt;a href=\"en/user-guide/storage/links.html#redirects\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Redirects&lt;/span&gt;&lt;/a&gt;Redirects&lt;/h2&gt;\n&lt;p&gt;Automatic redirects from a link node to a target object have a number of exceptions:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The &lt;code&gt;remove&lt;/code&gt;, &lt;code&gt;create&lt;/code&gt;, and &lt;code&gt;link&lt;/code&gt; commands for the target path are processed in the link node. When deleting &lt;code&gt;//tmp/target_table_link&lt;/code&gt;, for example, a user will not damage &lt;code&gt;//tmp/target_table&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;The &lt;code&gt;move&lt;/code&gt; command will affect the target node invalidating the link node.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;You can also disable redirection by appending the &lt;code&gt;&amp;amp;&lt;/code&gt; (ampersand) marker to the end of the link name.&lt;br /&gt;\nThis will help you explore the attributes of a link node, for example, rather than those of a target object.&lt;br /&gt;\nThus, to retrieve the target object path, run &lt;code&gt;yt get //tmp/target_table_link&amp;amp;/@&lt;/code&gt;. You will get the path through the &lt;code&gt;target_path&lt;/code&gt; attribute.&lt;/p&gt;\n&lt;h2 id=\"attributes\"&gt;&lt;a href=\"en/user-guide/storage/links.html#attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;System attributes&lt;/span&gt;&lt;/a&gt;System attributes&lt;/h2&gt;\n&lt;p&gt;In addition to &lt;a href=\"user-guide/storage/attributes.html\"&gt;attributes&lt;/a&gt; common to all nodes, link nodes also have the following properties:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Name&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Value&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;target_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Path to the object referenced by a link.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;broken&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt; if a link references a non-existent object, &lt;code&gt;false&lt;/code&gt; otherwise.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/storage/links.md","sourcePath":"en/user-guide/storage/links.md"},"headings":[{"title":"General information","href":"en/user-guide/storage/links.html#common","level":2},{"title":"Creating","href":"en/user-guide/storage/links.html#create","level":2},{"title":"Redirects","href":"en/user-guide/storage/links.html#redirects","level":2},{"title":"System attributes","href":"en/user-guide/storage/links.html#attributes","level":2}],"title":"Symbolic links"},"router":{"pathname":"en/user-guide/storage/links","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
