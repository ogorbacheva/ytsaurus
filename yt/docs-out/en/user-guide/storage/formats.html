            {"data":{"leading":false,"html":"&lt;p&gt;This section describes the data types and table data representation formats supported by YTsaurus.&lt;/p&gt;\n&lt;h2 id=\"data_types\"&gt;&lt;a href=\"en/user-guide/storage/formats.html#data_types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data types&lt;/span&gt;&lt;/a&gt;Data types&lt;/h2&gt;\n&lt;p&gt;The YTsaurus system stores data of the following types:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/user-guide/storage/formats.html#structured_data\"&gt;Structured data&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/user-guide/storage/formats.html#table_data\"&gt;Table data&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/user-guide/storage/formats.html#binary_data\"&gt;Binary data&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Different formats enable users to work with different types of data.&lt;/p&gt;\n&lt;h3 id=\"structured_data\"&gt;&lt;a href=\"en/user-guide/storage/formats.html#structured_data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Structured data&lt;/span&gt;&lt;/a&gt;Structured data&lt;/h3&gt;\n&lt;p&gt;Structured data is a node tree with attributes, where nodes correspond to &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON types&lt;/a&gt; (map, list, primitive types) with attributes.&lt;br /&gt;\nStructured data can be obtained using the &lt;a href=\"api/commands.html#get\"&gt;&lt;code&gt;get&lt;/code&gt;&lt;/a&gt; command.&lt;/p&gt;\n&lt;p&gt;Supported formats: &lt;code&gt;json&lt;/code&gt;, &lt;code&gt;yson&lt;/code&gt;, &lt;code&gt;yaml&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Example: &lt;a href=\"user-guide/storage/cypress.html\"&gt;Cypress&lt;/a&gt; nodes, their attributes.&lt;/p&gt;\n&lt;h3 id=\"table_data\"&gt;&lt;a href=\"en/user-guide/storage/formats.html#table_data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Table data&lt;/span&gt;&lt;/a&gt;Table data&lt;/h3&gt;\n&lt;p&gt;Table data is a sequence of rows where each row is logically a key-value pair, the key being a string, and the value is structured data.&lt;/p&gt;\n&lt;p&gt;Supported formats: &lt;code&gt;json&lt;/code&gt;, &lt;code&gt;yson&lt;/code&gt;, &lt;code&gt;dsv&lt;/code&gt;, &lt;code&gt;schemaful_dsv&lt;/code&gt;, &lt;code&gt;protobuf&lt;/code&gt;, &lt;code&gt;arrow&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Examples: Input and output data in operations, input data of the &lt;a href=\"api/commands.html#write_table\"&gt;&lt;code&gt;write_table&lt;/code&gt;&lt;/a&gt; command, output data of the &lt;a href=\"api/commands.html#read_table\"&gt;&lt;code&gt;read_table&lt;/code&gt;&lt;/a&gt; command.&lt;/p&gt;\n&lt;h3 id=\"binary_data\"&gt;&lt;a href=\"en/user-guide/storage/formats.html#binary_data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Binary data&lt;/span&gt;&lt;/a&gt;Binary data&lt;/h3&gt;\n&lt;p&gt;Binary data is a sequence of bytes. For example, files store binary data.&lt;/p&gt;\n&lt;p&gt;Supported formats: Cannot set a format. Representation only as a byte array.&lt;/p&gt;\n&lt;p&gt;Examples: Input data of the &lt;a href=\"api/commands.html#write_file\"&gt;&lt;code&gt;upload&lt;/code&gt;&lt;/a&gt; command and output data of the &lt;a href=\"api/commands.html#read_file\"&gt;&lt;code&gt;download&lt;/code&gt;&lt;/a&gt; command.&lt;/p&gt;\n&lt;h2 id=\"table_formats\"&gt;&lt;a href=\"en/user-guide/storage/formats.html#table_formats\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Table data representation formats&lt;/span&gt;&lt;/a&gt;Table data representation formats&lt;/h2&gt;\n&lt;p&gt;YTsaurus supports several data formats, which determine in what form data is transmitted to or received from the system.&lt;br /&gt;\nA format must be specified for all &lt;a href=\"api/cli/cli.html\"&gt;&lt;code&gt;yt&lt;/code&gt; utility&lt;/a&gt; commands that return or accept data.&lt;/p&gt;\n&lt;p&gt;Reading a table in DSV format:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; //some/table --format dsv\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"74\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-74\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-74\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-74.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;YTsaurus supports the following data representation formats:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/user-guide/storage/formats.html#yson\"&gt;YSON&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/user-guide/storage/formats.html#json\"&gt;JSON&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/user-guide/storage/formats.html#dsv\"&gt;DSV (TSKV)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/user-guide/storage/formats.html#schemaful_dsv\"&gt;SCHEMAFUL_DSV&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"example\"&gt;&lt;a href=\"en/user-guide/storage/formats.html#example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h2&gt;\n&lt;p&gt;The table used in the examples:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th style=\"text-align:left\"&gt;name&lt;/th&gt;\n&lt;th style=\"text-align:center\"&gt;uid&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;Elena&lt;/td&gt;\n&lt;td style=\"text-align:center\"&gt;95792365232151958&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;Denis&lt;/td&gt;\n&lt;td style=\"text-align:center\"&gt;78086244452810046&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;Mikhail&lt;/td&gt;\n&lt;td style=\"text-align:center\"&gt;70609792906901286&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;Ilya&lt;/td&gt;\n&lt;td style=\"text-align:center\"&gt;15696008603902587&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;Oxana&lt;/td&gt;\n&lt;td style=\"text-align:center\"&gt;76840674253209974&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;Alexey&lt;/td&gt;\n&lt;td style=\"text-align:center\"&gt;15943558469181404&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;Roman&lt;/td&gt;\n&lt;td style=\"text-align:center\"&gt;37865805882228106&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;Anna&lt;/td&gt;\n&lt;td style=\"text-align:center\"&gt;35039450424270744&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;Nikolai&lt;/td&gt;\n&lt;td style=\"text-align:center\"&gt;45320538587295288&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;Karina&lt;/td&gt;\n&lt;td style=\"text-align:center\"&gt;20364947097122776&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"yson\"&gt;&lt;a href=\"en/user-guide/storage/formats.html#yson\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YSON&lt;/span&gt;&lt;/a&gt;YSON&lt;/h2&gt;\n&lt;p&gt;The YSON format is the main format in YTsaurus: it is used to store table data, Cypress node attributes, and many other objects. YSON is largely similar to JSON, but the former has node attributes and supports binary data.&lt;br /&gt;\nFor a detailed specification, see the &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON&lt;/a&gt; section.&lt;/p&gt;\n&lt;p&gt;To read a table in YSON format:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; --proxy &amp;lt;cluster-name&amp;gt; --format &lt;span class=\"hljs-string\"&gt;'&amp;lt;format=pretty&amp;gt;yson'&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'//home/tutorial/staff_unsorted_sample'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"209\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-209\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-209\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-209.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Table representation in YSON format:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{\n    \"name\" = \"Elena\";\n    \"uid\" = 95792365232151958;\n};\n{\n    \"name\" = \"Denis\";\n    \"uid\" = 78086244452810046;\n};\n{\n    \"name\" = \"Mikhail\";\n    \"uid\" = 70609792906901286;\n};\n{\n    \"name\" = \"Ilya\";\n    \"uid\" = 15696008603902587;\n};\n{\n    \"name\" = \"Oxana\";\n    \"uid\" = 76840674253209974;\n};\n{\n    \"name\" = \"Alexey\";\n    \"uid\" = 15943558469181404;\n};\n{\n    \"name\" = \"Roman\";\n    \"uid\" = 37865805882228106;\n};\n{\n    \"name\" = \"Anna\";\n    \"uid\" = 35039450424270744;\n};\n{\n    \"name\" = \"Nikolai\";\n    \"uid\" = 45320538587295288;\n};\n{\n    \"name\" = \"Karina\";\n    \"uid\" = 20364947097122776;\n};\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"213\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-213\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-213\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-213.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;strong&gt;Parameters&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;The values are specified in parentheses by default.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;format&lt;/strong&gt; (&lt;code&gt;binary&lt;/code&gt;) — describes the YSON variant to be used in generating data. Specifying the variant is only important when setting the output format in relation to the system, while for the input format the system reads all the YSON varieties homogeneously:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;binary&lt;/code&gt; — binary&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;text&lt;/code&gt; — text without formatting&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;pretty&lt;/code&gt; — text with formatting&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;skip_null_values&lt;/strong&gt; (&lt;code&gt;%false&lt;/code&gt;) — enable skipping &lt;code&gt;null&lt;/code&gt; values in schematized tables. By default, all values are written.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_string_to_all_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — enable conversion of string values to numeric and boolean types. For example, &lt;code&gt;\"42u\"&lt;/code&gt; is converted to &lt;code&gt;42u&lt;/code&gt;, and &lt;code&gt;\"false\"&lt;/code&gt; is converted to &lt;code&gt;%false&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_all_to_string_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — enable conversion of numeric and boolean values to string type. For example, &lt;code&gt;3.14&lt;/code&gt; becomes &lt;code&gt;\"3.14\"&lt;/code&gt;, and &lt;code&gt;%false&lt;/code&gt; becomes &lt;code&gt;\"false\"&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_integral_type_conversion&lt;/strong&gt; (&lt;code&gt;true&lt;/code&gt;) — enable conversion of &lt;code&gt;uint64&lt;/code&gt; to &lt;code&gt;int64&lt;/code&gt; and vice versa. This option is enabled by default. If an overflow occurs during conversion, you will see a corresponding error.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_integral_to_double_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — enable conversion of &lt;code&gt;uint64&lt;/code&gt; and &lt;code&gt;int64&lt;/code&gt; to &lt;code&gt;double&lt;/code&gt;. For example, integer &lt;code&gt;42&lt;/code&gt; becomes decimal number &lt;code&gt;42.0&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_type_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — enable all of the above options. In most cases, this option will suffice.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;complex_type_mode&lt;/strong&gt; (&lt;code&gt;named&lt;/code&gt;) — representation of composite types, structs, and variants.&lt;br /&gt;\nPossible values are &lt;code&gt;named&lt;/code&gt; and &lt;code&gt;positional&lt;/code&gt;. For more information, see &lt;a href=\"user-guide/storage/data-types.html#yson\"&gt;this section&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;string_keyed_dict_mode&lt;/strong&gt; (&lt;code&gt;positional&lt;/code&gt;) — representation of dictionaries with string keys. Possible values are &lt;code&gt;named&lt;/code&gt; and &lt;code&gt;positional&lt;/code&gt;. For more information, see &lt;a href=\"user-guide/storage/data-types.html#yson\"&gt;this section&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;decimal_mode&lt;/strong&gt; (&lt;code&gt;binary&lt;/code&gt;) — representation of the &lt;code&gt;decimal&lt;/code&gt; type.&lt;br /&gt;\nPossible values are &lt;code&gt;text&lt;/code&gt; and &lt;code&gt;binary&lt;/code&gt;. For more information, see &lt;a href=\"user-guide/storage/data-types.html#yson\"&gt;this section&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;time_mode&lt;/strong&gt; (&lt;code&gt;binary&lt;/code&gt;) — representation of &lt;code&gt;date&lt;/code&gt;, &lt;code&gt;datetime&lt;/code&gt;, and &lt;code&gt;timestamp&lt;/code&gt; types. Possible values are &lt;code&gt;text&lt;/code&gt; and &lt;code&gt;binary&lt;/code&gt;. For more information, see &lt;a href=\"user-guide/storage/data-types.html#yson\"&gt;this section&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;uuid_mode&lt;/strong&gt; (&lt;code&gt;binary&lt;/code&gt;) — representation of the &lt;code&gt;uuid&lt;/code&gt; type. Possible values are &lt;code&gt;binary&lt;/code&gt;, &lt;code&gt;text_yql&lt;/code&gt;, and &lt;code&gt;text_yt&lt;/code&gt;. For more information, see &lt;a href=\"user-guide/storage/data-types.html#yson\"&gt;this section&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;sort_keys&lt;/strong&gt; (&lt;code&gt;%false&lt;/code&gt;) — output keys in dictionaries in a sorted order. Possible values are &lt;code&gt;%true&lt;/code&gt; and &lt;code&gt;%false&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"json\"&gt;&lt;a href=\"en/user-guide/storage/formats.html#json\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;JSON&lt;/span&gt;&lt;/a&gt;JSON&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"https://en.wikipedia.org/wiki/JSON\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;JSON&lt;/a&gt; is a common format for displaying structured data.&lt;/p&gt;\n&lt;p&gt;JSON is convenient to use thanks to popular tools such as &lt;a href=\"https://stedolan.github.io/jq/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;jq&lt;/a&gt;. And there is no need to install additional libraries to support YSON.&lt;br /&gt;\nDetailed &lt;a href=\"https://www.json.org/json-en.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;JSON&lt;/a&gt; specification.&lt;/p&gt;\n&lt;p&gt;YSON is the main format of YTsaurus. Unlike JSON, YSON has attributes. Therefore, to convert data from YSON to JSON, you need to encode attributes in JSON.&lt;br /&gt;\nTo do this, convert the node with attributes to map-node with two keys:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;\\$value&lt;/code&gt; — its value is taken as the entire current node without attributes.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;\\$attributes&lt;/code&gt; — its value is taken as the &lt;code&gt;map&lt;/code&gt; of attributes.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;For example, &lt;code&gt;&amp;lt;attr=10&amp;gt;{x=y}&lt;/code&gt; is represented as &lt;code&gt;{\"$value\": {\"x\": \"y\"}, \"$attributes\": {\"attr\": 10}}&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The strings in YTsaurus — YSON strings — are byte strings, while JSON uses Unicode encoding.&lt;br /&gt;\nThe format has an &lt;code&gt;encode_utf8&lt;/code&gt; setting that allows you to manage conversions. The &lt;code&gt;encode_utf8&lt;/code&gt; defaults to &lt;code&gt;%true&lt;/code&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li id=\"utf8-true\"&gt;encode_utf8=%true&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;To convert a YSON string to a JSON string, convert each byte to a Unicode character with the corresponding number and encode it in UTF-8. This conversion occurs, for example, when reading table data using the &lt;a href=\"api/commands.html#read_table\"&gt;&lt;code&gt;read_table&lt;/code&gt;&lt;/a&gt; command.&lt;/p&gt;\n&lt;p&gt;When a JSON string is converted to a YSON string, the sequence of Unicode characters of the JSON string is checked to make sure each of them is in the 0–255 range. They are then converted to the appropriate bytes. This conversion is performed when writing table data using the &lt;a href=\"api/commands.html#write_table\"&gt;&lt;code&gt;write_table&lt;/code&gt;&lt;/a&gt; command.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;With &lt;code&gt;encode_utf8=%true&lt;/code&gt;, Unicode characters outside the 0..255 range in the JSON string are not allowed.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;ul&gt;\n&lt;li id=\"utf8-false\"&gt;encode_utf8=%false&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;To convert a YSON string to a JSON string, the YSON string must contain a valid UTF-8 sequence. It will be converted to a Unicode JSON string.&lt;/p&gt;\n&lt;p&gt;During JSON string to YSON string conversion, UTF-8 Unicode characters are encoded into byte sequences. This conversion is performed with the &lt;a href=\"api/commands.html#write_table\"&gt;&lt;code&gt;write_table&lt;/code&gt;&lt;/a&gt; command.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In general, byte sequences in tables are not always UTF-8 sequences. Therefore, with &lt;code&gt;encode_utf8=%false&lt;/code&gt; not all YSON strings are readable.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;UTF-8 strings:&lt;/p&gt;\n&lt;div class=\"yfm-tabs\" data-diplodoc-group=\"defaultTabsGroup-ptfq3xnz\" data-diplodoc-variant=\"regular\"&gt;\n&lt;div class=\"yfm-tab-list\" role=\"tablist\"&gt;\n&lt;div data-diplodoc-id=\"python\" data-diplodoc-key=\"python\" class=\"yfm-tab yfm-tab-group active\" role=\"tab\" tabindex=\"0\" data-diplodoc-is-active=\"true\"&gt;Python&lt;/div&gt;\n&lt;div data-diplodoc-id=\"cli\" data-diplodoc-key=\"cli\" class=\"yfm-tab yfm-tab-group\" role=\"tab\" tabindex=\"-1\" data-diplodoc-is-active=\"false\"&gt;CLI&lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"o9567tha\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"Python\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.write_table(&lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt;, [{&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"Ivan\"&lt;/span&gt;}], &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=yt.JsonFormat(attributes={&lt;span class=\"hljs-string\"&gt;\"encode_utf8\"&lt;/span&gt;: &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;}))\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"393\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-393\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-393\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-393.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"nio8ycsm\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"CLI\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'{\"key\": \"Jane\"}{\"key\":\"Doe\"}'&lt;/span&gt; | YT_PROXY=&amp;lt;cluster-name&amp;gt; yt write --table &lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt; --format=&lt;span class=\"hljs-string\"&gt;\"&amp;lt;encode_utf8=%false&amp;gt;json\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"396\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-396\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-396\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-396.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;When the user reads the table in JSON format, each record is made in a separate line. The &lt;code&gt;pretty&lt;/code&gt; format is not supported.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Reading a table in JSON format:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; --proxy &amp;lt;cluster-name&amp;gt; --format json &lt;span class=\"hljs-string\"&gt;'//home/tutorial/staff_unsorted_sample'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"412\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-412\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-412\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-412.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Table representation in JSON format:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"Elena\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"uid\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;95792365232151958&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"Denis\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"uid\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;78086244452810046&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"Mikhail\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"uid\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;70609792906901286&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"Ilya\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"uid\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;15696008603902587&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"Oxana\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"uid\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;76840674253209974&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"Alexey\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"uid\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;15943558469181404&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"Roman\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"uid\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;37865805882228106&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"Anna\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"uid\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;35039450424270744&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"Nikolai\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"uid\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;45320538587295288&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"Karina\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"uid\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;20364947097122776&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"416\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-416\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-416\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-416.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;strong&gt;Parameters&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;The values are specified in parentheses by default.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;format&lt;/strong&gt; (&lt;code&gt;text&lt;/code&gt;) — describes the JSON format in which data is to be generated. Matters only when the output format is specified relative to the system. For the input format, all JSON varieties are read by the system homogeneously:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;text&lt;/code&gt; — text without formatting&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;pretty&lt;/code&gt; — text with formatting&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;attributes_mode&lt;/strong&gt; (&lt;code&gt;on_demand&lt;/code&gt;) — attribute mode:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;always&lt;/code&gt; — each node turns into a map with &lt;code&gt;\\$value&lt;/code&gt; and &lt;code&gt;\\$attributes&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;never&lt;/code&gt; — attributes are ignored.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;on_demand&lt;/code&gt; — only nodes with non-empty attributes are converted to a map with &lt;code&gt;\\$value&lt;/code&gt; and &lt;code&gt;\\$attributes&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;encode_utf8&lt;/strong&gt; (&lt;code&gt;true&lt;/code&gt;) — enable UTF-8 character interpretation in bytes with corresponding numbers.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;string_length_limit&lt;/strong&gt; — limit on the length of the string in bytes. If the limit is exceeded, the string is trimmed and the result is written as &lt;code&gt;{$incomplete: true, $value:...}&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;stringify&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — enable conversion of all scalar types to strings.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;stringify_nan_and_infinity&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — enable conversion of &lt;code&gt;Nan&lt;/code&gt; and &lt;code&gt;Infinity&lt;/code&gt; to strings. You can't use this together with &lt;code&gt;support_infinity&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;support_infinity&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — allow the &lt;code&gt;Nan&lt;/code&gt; value for the &lt;code&gt;double&lt;/code&gt; type. You can't use this together with &lt;code&gt;stringify_nan_and_infinity&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;annotate_with_types&lt;/strong&gt; — enable type annotation &lt;code&gt;{$type: \"uint64\", $value: 100500}&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;plain&lt;/strong&gt; — enable the JSON parser option, which disables accounting for the logic regarding special keys &lt;code&gt;\\$attributes&lt;/code&gt;, &lt;code&gt;\\$value&lt;/code&gt;, &lt;code&gt;\\$type&lt;/code&gt; and parses JSON as is. When the option is enabled, the parser works much faster.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_string_to_all_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — enable conversion of string values to numeric and &lt;code&gt;boolean&lt;/code&gt; types. For example, &lt;code&gt;\"42u\"&lt;/code&gt; is converted to &lt;code&gt;42u&lt;/code&gt;, and &lt;code&gt;\"false\"&lt;/code&gt; is converted to &lt;code&gt;%false&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_all_to_string_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — enable conversion of numeric and &lt;code&gt;boolean&lt;/code&gt; values to string type. For example, &lt;code&gt;3.14&lt;/code&gt; becomes &lt;code&gt;\"3.14\"&lt;/code&gt;, and &lt;code&gt;%false&lt;/code&gt; becomes &lt;code&gt;\"false\"&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_integral_type_conversion&lt;/strong&gt; (&lt;code&gt;true&lt;/code&gt;) — enable conversion of &lt;code&gt;uint64&lt;/code&gt; to &lt;code&gt;int64&lt;/code&gt; and vice versa. If an overflow occurs during conversion, you will see a corresponding error.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_integral_to_double_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — enable conversion of &lt;code&gt;uint64&lt;/code&gt; and &lt;code&gt;int64&lt;/code&gt; to &lt;code&gt;double&lt;/code&gt;. For example, integer &lt;code&gt;42&lt;/code&gt; becomes decimal number &lt;code&gt;42.0&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_type_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — enable all of the above options. In most cases, this option will suffice.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;JSON represents bytes numbered 0–32 (namely \\u00XX) in a non-compact way. When you try to write a long string with such data, an &lt;strong&gt;Out of memory&lt;/strong&gt; error may occur in the Yajl library, because the memory amount limit is &lt;code&gt;2 * row_weight&lt;/code&gt;. In that case, the JSON format is not recommended.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"yaml\"&gt;&lt;a href=\"en/user-guide/storage/formats.html#yaml\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YAML&lt;/span&gt;&lt;/a&gt;YAML&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"https://yaml.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YAML&lt;/a&gt; is a human-readable data serialization format that has become a standard for configuration files and infrastructure-as-code. It offers a more compact and readable syntax compared to JSON, with features like comments and anchors.&lt;/p&gt;\n&lt;p&gt;YAML is available in YTsaurus starting from version 24.2.&lt;/p&gt;\n&lt;p&gt;Reading a Cypress node in YAML format:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt get //path/to/some_table/@ --format yaml\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"546\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-546\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-546\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-546.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Example output:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;id:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;7b7-154e6-13440191-489067e7&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;type:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;table&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;ref_counter:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;foreign:&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;native_cell_tag:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;4932&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;revision:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;8482560616109&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;acl:&lt;/span&gt; []\n&lt;span class=\"hljs-attr\"&gt;owner:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;max&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;null&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;key:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;squirrels&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;creation_time:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'2023-12-06T22:03:43.498610Z'&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;modification_time:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'2023-12-06T22:20:05.142350Z'&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;access_time:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'2024-11-05T23:39:45.599145Z'&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;access_counter:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1012&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;resource_usage:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;node_count:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;chunk_count:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;disk_space_per_medium:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;default:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;560736&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;disk_space:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;560736&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;chunk_host_cell_master_memory:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;master_memory:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;detailed_master_memory:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;nodes:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;chunks:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;attributes:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;tablets:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;schemas:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;tablet_count:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;tablet_static_memory:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;recursive_resource_usage:&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;null&lt;/span&gt;\n&lt;span class=\"hljs-string\"&gt;...&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"550\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-550\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-550\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-550.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"type-system\"&gt;&lt;a href=\"en/user-guide/storage/formats.html#type-system\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Type System&lt;/span&gt;&lt;/a&gt;Type System&lt;/h3&gt;\n&lt;p&gt;YAML format in YTsaurus uses a &lt;a href=\"https://yaml.org/spec/1.2.2/#schema\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YAML schema&lt;/a&gt; approach for type deduction. The implementation follows the &lt;a href=\"https://yaml.org/spec/1.2.2/#core-schema\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Core schema&lt;/a&gt;, which is widely used by most YAML parsers:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;On parsing, the system complies with specific tags and deduces non-specific tags using Core schema regexps, which detect integer/float/string/boolean/null values\n&lt;ul&gt;\n&lt;li&gt;For example, &lt;code&gt;123&lt;/code&gt;, &lt;code&gt;3.14&lt;/code&gt;, &lt;code&gt;true&lt;/code&gt;, &lt;code&gt;null&lt;/code&gt; are detected as integer, float, boolean and null value respectively, and &lt;code&gt;foo&lt;/code&gt;, &lt;code&gt;bar&lt;/code&gt;, &lt;code&gt;baz&lt;/code&gt; are detected as strings&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;On writing:\n&lt;ul&gt;\n&lt;li&gt;Non-string scalars are serialized in plain (unquoted) manner, e.g. &lt;code&gt;123&lt;/code&gt;, &lt;code&gt;3.14&lt;/code&gt;, &lt;code&gt;true&lt;/code&gt;, &lt;code&gt;false&lt;/code&gt;, &lt;code&gt;null&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;String scalars are serialized in plain (unquoted) manner if syntactically possible and if the unquoted representation doesn't match null/bool/int/float regexps, e.g. &lt;code&gt;foo&lt;/code&gt;, &lt;code&gt;bar&lt;/code&gt;, &lt;code&gt;baz&lt;/code&gt;, but &lt;code&gt;\"null\"&lt;/code&gt;, &lt;code&gt;\"true\"&lt;/code&gt;, &lt;code&gt;\"false\"&lt;/code&gt;, &lt;code&gt;\"123\"&lt;/code&gt;, &lt;code&gt;\"3.14\"&lt;/code&gt; (otherwise they would be interpreted by most YAML parsers as types other than strings)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"signed/unsigned-integer-handling\"&gt;&lt;a href=\"en/user-guide/storage/formats.html#signed/unsigned-integer-handling\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signed/Unsigned Integer Handling&lt;/span&gt;&lt;/a&gt;Signed/Unsigned Integer Handling&lt;/h3&gt;\n&lt;p&gt;To handle unsigned integers explicitly, a custom tag &lt;code&gt;!yt/uint&lt;/code&gt; is introduced. The format has a &lt;code&gt;write_uint_tag&lt;/code&gt; option (false by default) which forces the writer to use this tag for all uint64 scalars.&lt;/p&gt;\n&lt;p&gt;On parsing:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;If a tag &lt;code&gt;!yt/uint&lt;/code&gt; is present, the value is interpreted as an uint64&lt;/li&gt;\n&lt;li&gt;If a tag is missing or is a standard YAML &lt;code&gt;!!int&lt;/code&gt;:\n&lt;ul&gt;\n&lt;li&gt;For decimal form, numbers in range [-2^63, 2^63) are interpreted as int64 and numbers in range [2^63, 2^64) as uint64&lt;/li&gt;\n&lt;li&gt;For hexadecimal/octal form, values are always interpreted as uint64&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;On writing:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;If &lt;code&gt;write_uint_tag = %false&lt;/code&gt;, all integers are output in plain (unquoted) untagged form&lt;/li&gt;\n&lt;li&gt;If &lt;code&gt;write_uint_tag = %true&lt;/code&gt;, int64 is output in plain untagged decimal form, and uint64 in plain decimal form with tag &lt;code&gt;!yt/uint&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"attribute-representation\"&gt;&lt;a href=\"en/user-guide/storage/formats.html#attribute-representation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Attribute Representation&lt;/span&gt;&lt;/a&gt;Attribute Representation&lt;/h3&gt;\n&lt;p&gt;Nodes with attributes are represented as a 2-element sequence tagged with &lt;code&gt;!yt/attrnode&lt;/code&gt; to distinguish them from regular lists:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;YSON:\n{\n    \"foo\" = &amp;lt;\n        \"x\" = 1;\n        \"y\" = 2;\n    &amp;gt; {\n        \"bar\" = 3;\n    };\n}\nYAML:\nfoo: !yt/attrnode\n- x: 1\n  y: 2\n- bar: 3\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"642\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-642\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-642\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-642.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"limitations\"&gt;&lt;a href=\"en/user-guide/storage/formats.html#limitations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Limitations&lt;/span&gt;&lt;/a&gt;Limitations&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Comments&lt;/strong&gt;: YAML comments are dropped when writing, as they are not a part of the node structure&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Anchors and Aliases&lt;/strong&gt;: Only non-recursive anchors and aliases are supported, also aliases must refer to a node defined somewhere before them; aliases are not preserved on parsing, i.e. they are immediately resolved&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Merge Operator&lt;/strong&gt;: The YAML 1.1 merge operator (\"&amp;lt;&amp;lt;\") is not supported and is treated as a regular scalar key&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Parameters&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;The values are specified in parentheses by default.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;write_uint_tag&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — enable using the &lt;code&gt;!yt/uint&lt;/code&gt; tag for all uint64 scalars on writing&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"dsv\"&gt;&lt;a href=\"en/user-guide/storage/formats.html#dsv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DSV (TSKV)&lt;/span&gt;&lt;/a&gt;DSV (TSKV)&lt;/h2&gt;\n&lt;p&gt;&lt;strong&gt;DSV&lt;/strong&gt; — Delimiter-Separated Values.&lt;br /&gt;\n&lt;strong&gt;TSKV&lt;/strong&gt; — Tab-Separated Key-Value.&lt;/p&gt;\n&lt;p&gt;A format that is widely used for storing logs and working with them. DSV and TSKV are two names of the same format.&lt;br /&gt;\nThis format only supports flat records with an arbitrary column set and string values. Records are separated by the line break character &lt;code&gt;\\n&lt;/code&gt;.&lt;br /&gt;\nFields in a record are separated by the tab character &lt;code&gt;\\t&lt;/code&gt;.&lt;br /&gt;\nFor more information, read below.&lt;/p&gt;\n&lt;p&gt;Example record: &lt;code&gt;time=10\\tday=monday\\n&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The format does not support attributes and typed values. In the example, &lt;code&gt;10&lt;/code&gt; will be recognized by the system as a string, not a number.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Reading a table in DSV format:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; --proxy &amp;lt;cluster-name&amp;gt; --format dsv &lt;span class=\"hljs-string\"&gt;'//home/tutorial/staff_unsorted_sample'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"701\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-701\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-701\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-701.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Table representation in DSV format:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;name=Elena      uid=95792365232151958\nname=Denis\tuid=78086244452810046\nname=Mikhail\tuid=70609792906901286\nname=Ilya\tuid=15696008603902587\nname=Oxana\tuid=76840674253209974\nname=Alexey\tuid=15943558469181404\nname=Roman\tuid=37865805882228106\nname=Anna\tuid=35039450424270744\nname=Nikolai\tuid=45320538587295288\nname=Karina\tuid=20364947097122776\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"705\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-705\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-705\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-705.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Reading a table with some parameters:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; --proxy &amp;lt;cluster-name&amp;gt; --format &lt;span class=\"hljs-string\"&gt;'&amp;lt;field_separator=\";\";key_value_separator=\":\"&amp;gt;dsv'&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'//home/tutorial/staff_unsorted_sample'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"709\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-709\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-709\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-709.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;strong&gt;Parameters:&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;The values are specified in parentheses by default.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;record_separator&lt;/strong&gt; (&lt;code&gt;\\n&lt;/code&gt;) — record separator.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;key_value_separator&lt;/strong&gt; (&lt;code&gt;=&lt;/code&gt;) — key-value pair separator.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;field_separator&lt;/strong&gt; (&lt;code&gt;\\t&lt;/code&gt;) — separator of fields in a record.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;line_prefix&lt;/strong&gt; (no column by default) — mandatory column at the start of each record.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_escaping&lt;/strong&gt; (&lt;code&gt;true&lt;/code&gt;) — enable escaping for records.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;escape_carriage_return&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — enable escaping for the &lt;code&gt;\\r&lt;/code&gt; character.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;escaping_symbol&lt;/strong&gt; (&lt;code&gt;\\&lt;/code&gt;) — escape character.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_table_index&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) – enable output of the input table index.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;table_index_column&lt;/strong&gt; (&lt;code&gt;@table_index&lt;/code&gt;) – name of the column with the table index.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_string_to_all_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — enable conversion of string values to numeric and boolean types. For example, &lt;code&gt;\"42u\"&lt;/code&gt; is converted to &lt;code&gt;42u&lt;/code&gt;, and &lt;code&gt;\"false\"&lt;/code&gt; is converted to &lt;code&gt;%false&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_all_to_string_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — enable conversion of numeric and boolean values to string type. For example, number &lt;code&gt;3.14&lt;/code&gt; is converted to &lt;code&gt;\"3.14\"&lt;/code&gt;, and &lt;code&gt;%false&lt;/code&gt; to &lt;code&gt;\"false\"&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_integral_type_conversion&lt;/strong&gt; (&lt;code&gt;true&lt;/code&gt;) — enable conversion of &lt;code&gt;uint64&lt;/code&gt; to &lt;code&gt;int64&lt;/code&gt; and vice versa. If an overflow occurs during conversion, you will see a corresponding error.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_integral_to_double_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — enable conversion of &lt;code&gt;uint64&lt;/code&gt; and &lt;code&gt;int64&lt;/code&gt; to &lt;code&gt;double&lt;/code&gt;. For example, integer &lt;code&gt;42&lt;/code&gt; is converted to decimal number &lt;code&gt;42.0&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_type_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — enable all of the above options. In most cases, this option will suffice.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In practice, an arbitrary string is a valid DSV record. If there is no key-value separator after the key, the field is ignored.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"schemaful_dsv\"&gt;&lt;a href=\"en/user-guide/storage/formats.html#schemaful_dsv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SCHEMAFUL_DSV&lt;/span&gt;&lt;/a&gt;SCHEMAFUL_DSV&lt;/h2&gt;\n&lt;p&gt;This format is a variation of DSV. With SCHEMAFUL_DSV, data is generated as a set of values separated by tabs.&lt;br /&gt;\nThe format has a mandatory &lt;code&gt;columns&lt;/code&gt; attribute, in which you specify the names of the columns you need, separated by a semicolon. If the value of one of the columns is missing from at least one of the records, an error occurs (see &lt;strong&gt;missing_value_mode&lt;/strong&gt;).&lt;/p&gt;\n&lt;p&gt;For example, if a table has two records &lt;code&gt;{a=10;b=11} {c=100}&lt;/code&gt; and the format &lt;code&gt;&amp;lt;columns=[a]&amp;gt;schemaful_dsv&lt;/code&gt; is specified, the following error occurs — &lt;code&gt;Column \"a\" is in schema but missing&lt;/code&gt;.&lt;br /&gt;\nIf only the first record is in the table, the job will receive record &lt;code&gt;10&lt;/code&gt; as input.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;When working with YTsaurus CLI, attributes must be written in quotes. For example: &lt;code&gt;--format=\"&amp;lt;columns=[a;b]&amp;gt;schemaful_dsv\"&lt;/code&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Reading a table in SCHEMAFUL_DSV format:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; --proxy &amp;lt;cluster-name&amp;gt; --format &lt;span class=\"hljs-string\"&gt;'&amp;lt;columns=[name;uid]&amp;gt;schemaful_dsv'&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'//home/tutorial/staff_unsorted_sample'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"820\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-820\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-820\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-820.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Table representation in SCHEMAFUL_DSV format:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Elena   95792365232151958\nDenis\t78086244452810046\nMikhail\t70609792906901286\nIlya\t15696008603902587\nOxana\t76840674253209974\nAlexey\t15943558469181404\nRoman\t37865805882228106\nAnna\t35039450424270744\nNikolai\t45320538587295288\nKarina\t20364947097122776\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"824\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-824\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-824\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-824.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;strong&gt;Parameters:&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;The values are specified in parentheses by default.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;record_separator&lt;/strong&gt; (&lt;code&gt;\\n&lt;/code&gt;) — record separator.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;field_separator&lt;/strong&gt; (&lt;code&gt;\\t&lt;/code&gt;) — field separator.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_table_index&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) – enable printing of table switching in input data.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_escaping&lt;/strong&gt; (&lt;code&gt;true&lt;/code&gt;) – enable escaping for special characters &lt;code&gt;\\n&lt;/code&gt;, &lt;code&gt;\\t&lt;/code&gt;, and &lt;code&gt;\\&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;escaping_symbol&lt;/strong&gt; (&lt;code&gt;\\&lt;/code&gt;) – escape character.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;columns&lt;/strong&gt; – list of columns to be formatted, for example &lt;code&gt;&amp;lt;columns=[columnA;columnB]&amp;gt;schemaful_dsv&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;missing_value_mode&lt;/strong&gt; (&lt;code&gt;fail&lt;/code&gt;) — behavior in the absence of a value (&lt;code&gt;NULL&lt;/code&gt;):\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;skip_row&lt;/code&gt; — skip a row.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;fail&lt;/code&gt; — stop the operation if the specified column is missing in one of the rows.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;print_sentinel&lt;/code&gt; — instead of missing values, set &lt;code&gt;missing_value_sentinel&lt;/code&gt;, whose default is an empty string.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;missing_value_sentinel&lt;/strong&gt; (&lt;code&gt;empty line&lt;/code&gt;) — value of the missing column for &lt;strong&gt;print_sentinel&lt;/strong&gt; mode.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_column_names_header&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — can only be used for generating data in SCHEMAFUL_DSV format, but not for parsing such data. If the value is &lt;code&gt;%true&lt;/code&gt;, the first row will have column names instead of values.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_string_to_all_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — enable conversion of string values to numeric and boolean types. For example, &lt;code&gt;\"42u\"&lt;/code&gt; is converted to &lt;code&gt;42u&lt;/code&gt;, and &lt;code&gt;\"false\"&lt;/code&gt; is converted to &lt;code&gt;%false&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_all_to_string_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — enable conversion of numeric and boolean values to string type. For example, &lt;code&gt;3.14&lt;/code&gt; becomes &lt;code&gt;\"3.14\"&lt;/code&gt;, and &lt;code&gt;%false&lt;/code&gt; becomes &lt;code&gt;\"false\"&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_integral_type_conversion&lt;/strong&gt; (&lt;code&gt;true&lt;/code&gt;) — enable conversion of &lt;code&gt;uint64&lt;/code&gt; to &lt;code&gt;int64&lt;/code&gt; and vice versa. This option is enabled by default. If an overflow occurs during conversion, you will see a corresponding error.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_integral_to_double_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — enable conversion of &lt;code&gt;uint64&lt;/code&gt; and &lt;code&gt;int64&lt;/code&gt; to &lt;code&gt;double&lt;/code&gt;. For example, integer &lt;code&gt;42&lt;/code&gt; becomes decimal number &lt;code&gt;42.0&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_type_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — enable all of the above options. In most cases, this option will suffice.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"Arrow\"&gt;&lt;a href=\"en/user-guide/storage/formats.html#Arrow\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ARROW&lt;/span&gt;&lt;/a&gt;ARROW&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"https://arrow.apache.org/overview\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apache Arrow&lt;/a&gt; is a binary format developed as a language-agnostic standard for columnar memory representation to facilitate interoperability.&lt;/p&gt;\n&lt;p&gt;Format advantages:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Unlike row-based representation, where the data in each row is stored together, Arrow organizes data into columns. This improves the performance of some analytical queries.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Arrow supports composite data types, such as structs, lists, dictionaries, and others.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"arrow-in-ytsaurus\"&gt;&lt;a href=\"en/user-guide/storage/formats.html#arrow-in-ytsaurus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Arrow in YTsaurus&lt;/span&gt;&lt;/a&gt;Arrow in YTsaurus&lt;/h3&gt;\n&lt;p&gt;Reading a table in Arrow format returns a concatenation of multiple &lt;a href=\"https://arrow.apache.org/docs/format/Columnar.html#ipc-streaming-format\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;IPC Streaming Format&lt;/a&gt; streams.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;SCHEMA&amp;gt;\n&amp;lt;DICTIONARY 0&amp;gt;\n...\n&amp;lt;DICTIONARY k - 1&amp;gt;\n&amp;lt;RECORD BATCH 0&amp;gt;\n...\n&amp;lt;DICTIONARY x DELTA&amp;gt;\n...\n&amp;lt;DICTIONARY y DELTA&amp;gt;\n...\n&amp;lt;RECORD BATCH n - 1&amp;gt;\n&amp;lt;EOS 0x00000000&amp;gt;\n&amp;lt;SCHEMA&amp;gt;\n...\n&amp;lt;EOS 0x00000000&amp;gt;\n...\n&amp;lt;EOS 0x00000000&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"947\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-947\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-947\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-947.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;This returns a concatenation of multiple streams instead of a single stream, because YTsaurus can store the same column differently across different chunks. For example, column data can be stored either explicitly in its entirety or as a dictionary (similar to an &lt;a href=\"https://arrow.apache.org/docs/format/Columnar.html#dictionary-encoded-layout\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Arrow dictionary&lt;/a&gt;). When representing data in Arrow format, we store the encoding as a dictionary and return a concatenation of multiple streams if a column is encoded in its entirety in one chunk and as a dictionary in another.&lt;/p&gt;\n&lt;p&gt;Limitations and notes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Reading and writing is only available for schematized tables.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;For more efficient reading, we recommend reading Arrow tables with columnar chunk storage (&lt;code&gt;optimize_for = scan&lt;/code&gt;).&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Writing to Arrow isn't currently optimized for tables with columnar chunk storage and involves two-fold conversion of data: from columnar to row-based representation and back.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"types\"&gt;&lt;a href=\"en/user-guide/storage/formats.html#types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Types&lt;/span&gt;&lt;/a&gt;Types&lt;/h3&gt;\n&lt;p&gt;Table reads currently support the following types:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;string&lt;/code&gt; is displayed as &lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type6BINARYE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::binary&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;integer&lt;/code&gt; is displayed as one of the &lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type5UINT8E\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::integer&lt;/a&gt; types depending on its&lt;br /&gt;\nbit count and signedness.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;boolean&lt;/code&gt; is displayed as &lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type4BOOLE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::bool&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;float&lt;/code&gt; is displayed as &lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type5FLOATE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::float&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;double&lt;/code&gt; is displayed as &lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type6DOUBLEE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::double&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;date&lt;/code&gt; is displayed as &lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type6DATE32E\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::date32&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;datetime&lt;/code&gt; is displayed as &lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type6DATE64E\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::date64&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;timestamp&lt;/code&gt; is displayed as &lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type9TIMESTAMPE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::timestamp&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;interval&lt;/code&gt; is displayed as &lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type5INT64E\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::int64&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Complex types&lt;/code&gt; are represented as &lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type6BINARYE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::binary&lt;/a&gt; with &lt;a href=\"https://yt.yandex-team.ru/docs/user-guide/storage/data-types#yson\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YSON representation&lt;/a&gt; of these types.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Writes support the same types as reads, as well as the following:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type4LISTE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::list&lt;/a&gt; is represented as &lt;code&gt;list&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type3MAPE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::map&lt;/a&gt; is represented as &lt;code&gt;dict&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type6STRUCTE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::struct&lt;/a&gt; is represented as &lt;code&gt;struct&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Other notes for working with types:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;When reading a table, almost any type can be returned as &lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type10DICTIONARYE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::dictionary&lt;/a&gt;, where the dictionary elements are the column values, and the indexes specify the order of those values. For more information, see &lt;a href=\"https://arrow.apache.org/docs/format/Columnar.html#dictionary-encoded-layout\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;this section&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;The Arrow format supports one level of nesting, \"optional\". Deeper nesting is returned as the binary type during reads, same as for other composite data types.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"examples-of-operations\"&gt;&lt;a href=\"en/user-guide/storage/formats.html#examples-of-operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples of operations&lt;/span&gt;&lt;/a&gt;Examples of operations&lt;/h3&gt;\n&lt;p&gt;Reading an Arrow table:&lt;/p&gt;\n&lt;div class=\"yfm-tabs\" data-diplodoc-group=\"defaultTabsGroup-11trwhmp\" data-diplodoc-variant=\"regular\"&gt;\n&lt;div class=\"yfm-tab-list\" role=\"tablist\"&gt;\n&lt;div data-diplodoc-id=\"python-1\" data-diplodoc-key=\"python\" class=\"yfm-tab yfm-tab-group active\" role=\"tab\" tabindex=\"0\" data-diplodoc-is-active=\"true\"&gt;Python&lt;/div&gt;\n&lt;div data-diplodoc-id=\"cli-1\" data-diplodoc-key=\"cli\" class=\"yfm-tab yfm-tab-group\" role=\"tab\" tabindex=\"-1\" data-diplodoc-is-active=\"false\"&gt;CLI&lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"izyy7km7\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"Python\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.read_table(&lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt;, &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=yt.&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;.ArrowFormat(), raw=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1085\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1085\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1085\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1085.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"ipvwucv2\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"CLI\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt; yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; --table &lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt; --format arrow\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1088\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1088\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1088\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1088.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;p&gt;Arrow map operation:&lt;/p&gt;
