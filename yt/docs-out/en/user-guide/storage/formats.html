\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt map --input-format arrow --output-format arrow  --src &lt;span class=\"hljs-string\"&gt;\"//path/to/input_table\"&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"cat\"&lt;/span&gt; --dst &lt;span class=\"hljs-string\"&gt;'&amp;lt;schema=[{name=item_1;type=int64};{name=item_2;type=string}]&amp;gt;//path/to/output_table'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1094\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1094\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1094\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1094.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"operations-with-multiple-tables\"&gt;&lt;a href=\"en/user-guide/storage/formats.html#operations-with-multiple-tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Operations with multiple tables&lt;/span&gt;&lt;/a&gt;Operations with multiple tables&lt;/h3&gt;\n&lt;p&gt;If you pass multiple tables as input to an Arrow operation, it will output a stream of multiple concatenated IPC Streaming Format streams, where each segment of the stream may belong to one of the tables. The table index is passed as &lt;a href=\"https://arrow.apache.org/docs/format/Columnar.html#schema-message\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;schema metadata&lt;/a&gt; under the name &lt;code&gt;TableId&lt;/code&gt;. Learn more about &lt;a href=\"https://arrow.apache.org/docs/format/Columnar.html#custom-application-metadata\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Arrow metadata&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"PARQUET\"&gt;&lt;a href=\"en/user-guide/storage/formats.html#PARQUET\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PARQUET&lt;/span&gt;&lt;/a&gt;PARQUET&lt;/h2&gt;\n&lt;p&gt;You can work with &lt;a href=\"https://parquet.apache.org/docs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;parquet&lt;/a&gt; from the command line:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.cli.html#yt.cli.yt_binary.dump_parquet\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;dump-parquet&lt;/a&gt;: download a table locally as a parquet file.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.cli.html#yt.cli.yt_binary.upload_parquet\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;upload-parquet&lt;/a&gt;: upload a local parquet file to YT as a static schematized table.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"PROTOBUF\"&gt;&lt;a href=\"en/user-guide/storage/formats.html#PROTOBUF\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PROTOBUF&lt;/span&gt;&lt;/a&gt;PROTOBUF&lt;/h2&gt;\n&lt;p&gt;Protobuf is a structured data transfer protocol for working with tables in the C++ API.&lt;/p&gt;\n&lt;p&gt;Learn more about &lt;a href=\"api/cpp/protobuf.html\"&gt;Protobuf&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/storage/formats.md","sourcePath":"en/user-guide/storage/formats.md"},"headings":[{"title":
