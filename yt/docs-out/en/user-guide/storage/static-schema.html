        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"schema_overview\"&gt;&lt;a href=\"en/user-guide/storage/static-schema.html#schema_overview\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General description&lt;/span&gt;&lt;/a&gt;General description&lt;/h2&gt;\n&lt;p&gt;The table schema describes the known columns and their types.&lt;/p&gt;\n&lt;p&gt;The schema can be read from the &lt;code&gt;@schema&lt;/code&gt; system attribute that each table has.&lt;br /&gt;\nTo set the schema, set this attribute when creating a table.&lt;br /&gt;\nTo change the schema of an existing table, use the &lt;code&gt;alter_table&lt;/code&gt; command.&lt;br /&gt;\nFor more information, see &lt;a href=\"en/user-guide/storage/static-schema.html#examples\"&gt;Examples of working with a schema&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;TableSchema&lt;/code&gt; type is a list of &lt;code&gt;ColumnSchema&lt;/code&gt; elements.&lt;br /&gt;\nEach such element is a dict with a set structure:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Name&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;Mandatory&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Column name.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Type of column elements.&lt;/td&gt;\n&lt;td&gt;Yes, if &lt;code&gt;type_v3&lt;/code&gt; is not set&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type_v3&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;any&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Alternative type representation. This field enables you to specify columns with &lt;a href=\"user-guide/storage/data-types.html#schema\"&gt;composite types&lt;/a&gt;.&lt;/td&gt;\n&lt;td&gt;Yes, if &lt;code&gt;type&lt;/code&gt; is not set&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;sort_order&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The column sort order - either a missing value or the &lt;code&gt;ascending&lt;/code&gt; value is allowed. If the value is set, the column is key. (Please note that the &lt;code&gt;descending&lt;/code&gt; sort order is currently in alpha and may be unavailable on clusters; we don't recommend using it)&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;lock&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Lock name. For non-key columns only.&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;expression&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;An expression defining the value of the computed column field. For key columns only. For more information, see &lt;a href=\"user-guide/dynamic-tables/resharding.html\"&gt;Sharding&lt;/a&gt;.&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;aggregate&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Aggregate function name. For non-key columns only.&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;required&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;boolean&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;If set to &lt;code&gt;%true&lt;/code&gt;, the value in the column must not be &lt;code&gt;null&lt;/code&gt;. The default value is &lt;code&gt;required=%false&lt;/code&gt;. A column of the &lt;code&gt;any&lt;/code&gt; type cannot be &lt;code&gt;required=%true&lt;/code&gt;.&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;group&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;If two columns have the same group name, the data from those columns will get into the same blocks. You can change the &lt;code&gt;group&lt;/code&gt; attribute at any time using the &lt;code&gt;alter-table&lt;/code&gt; command, the changes will be applied to the new chunks.&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Schema properties:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The column name must be a non-empty string. The maximum length is 256 characters.&lt;/li&gt;\n&lt;li&gt;The column name cannot begin with system prefix &lt;code&gt;@&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Column names cannot be repeated within a table.&lt;/li&gt;\n&lt;li&gt;Key columns must form the schema prefix.&lt;/li&gt;\n&lt;li&gt;All key columns must be specified in the schema.&lt;/li&gt;\n&lt;li&gt;Up to 32,000 columns are supported, but we recommend limiting the number of columns to four figures.&lt;/li&gt;\n&lt;li&gt;A column must always have an explicitly specified type: in the &lt;code&gt;type&lt;/code&gt; or &lt;code&gt;type_v3&lt;/code&gt; attribute.&lt;/li&gt;\n&lt;li&gt;When reading a schema, both attributes are always returned: &lt;code&gt;type&lt;/code&gt; and &lt;code&gt;type_v3&lt;/code&gt; regardless of how the schema was created.&lt;/li&gt;\n&lt;li&gt;Computed columns can only be key. Computed columns can depend only on key non-computed columns.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Schema attributes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;strict&lt;/code&gt; of the &lt;code&gt;boolean&lt;/code&gt; type. The default value is &lt;code&gt;true&lt;/code&gt;. If the table is strict, that is, the attribute has the &lt;code&gt;true&lt;/code&gt; value, you cannot write data to the table column that is not in the schema. Otherwise, you are allowed to write to a missing column which will automatically appear, but only in a new row.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;unique_keys&lt;/code&gt; of the &lt;code&gt;boolean&lt;/code&gt; type. The default value is &lt;code&gt;false&lt;/code&gt;. If the attribute has the &lt;code&gt;true&lt;/code&gt; value and the table is sorted, all keys in the table must be unique.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"types\"&gt;&lt;a href=\"en/user-guide/storage/static-schema.html#types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Supported column types&lt;/span&gt;&lt;/a&gt;Supported column types&lt;/h3&gt;\n&lt;p&gt;YTsaurus supports the column types described in the &lt;a href=\"user-guide/storage/data-types.html\"&gt;Data types&lt;/a&gt; section.&lt;br /&gt;\nAmong them are both primitive and composite types.&lt;/p&gt;\n&lt;p&gt;Values in the table cells always have the type specified in the schema.&lt;/p&gt;\n&lt;p&gt;You can use one of the following methods to specify a type in the table schema:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Using the &lt;code&gt;type&lt;/code&gt; and (optional) &lt;code&gt;required&lt;/code&gt; keys, you can specify only primitive or optional primitive types.&lt;/li&gt;\n&lt;li&gt;Using the &lt;code&gt;type_v3&lt;/code&gt; key.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The &lt;code&gt;type&lt;/code&gt; key expects a string.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;type_v3&lt;/code&gt; key expects either a string (for primitive types) or a yson dict.&lt;br /&gt;\nA yson dict always has the &lt;code&gt;type_name&lt;/code&gt; key that stores the type name.&lt;/p&gt;\n&lt;p&gt;Other keys depend on the specific type and are described on the &lt;a href=\"user-guide/storage/data-types.html\"&gt;Data types&lt;/a&gt; page.&lt;/p&gt;\n&lt;p&gt;Standard order relations apply for elementary types other than &lt;code&gt;any&lt;/code&gt; and &lt;code&gt;yson&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Order relations also apply for &lt;code&gt;optional&amp;lt;T&amp;gt;&lt;/code&gt; types where &lt;code&gt;T&lt;/code&gt; is a primitive comparable type.&lt;br /&gt;\nIt is guaranteed that missing values — values of the &lt;code&gt;null&lt;/code&gt; type — are smaller than any value of any type.&lt;/p&gt;\n&lt;p&gt;Comparing elements of comparable types is supported.&lt;br /&gt;\nThe comparison is first made by type and then if the types match, values are compared.&lt;br /&gt;\nThe order between different types is not specified. For example, it makes no sense to compare &lt;code&gt;100&lt;/code&gt; and &lt;code&gt;3.14&lt;/code&gt;, because the result is not specified.&lt;/p&gt;\n&lt;h3 id=\"schema_examples\"&gt;&lt;a href=\"en/user-guide/storage/static-schema.html#schema_examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Schema examples&lt;/span&gt;&lt;/a&gt;Schema examples&lt;/h3&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Schema of a static table after creation (unless explicitly stated otherwise)&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;strict=%false&amp;gt;[]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"273\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-273\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-273\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-273.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Automatically output schema for a table sorted by &lt;code&gt;key1; key2&lt;/code&gt;.&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;strict=%false&amp;gt;[\n  {\n      name = \"key1\";\n      type = \"any\";\n      sort_order = \"ascending\"\n      type_v3= {\n          type_name=optional;\n          item=yson;\n      };\n  };{\n      name = \"key2\";\n      type = \"any\";\n      sort_order = \"ascending\"\n      type_v3= {\n          type_name=optional;\n          item=yson;\n      };\n  }\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"281\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-281\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-281\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-281.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Example of a schema for a sorted table.&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[\n  {\n    name = \"key\";\n    type = \"string\";\n    sort_order = \"ascending\"\n  };{\n    name = \"subkey\";\n    type = \"string\";\n    sort_order = \"ascending\"\n  };{\n    name = \"value\";\n    type = \"string\"\n  }\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"289\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-289\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-289\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-289.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Example of a schema with grouping for columns that are often used together.&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[\n  {\n    name = \"key\";\n    type = \"string\";\n    sort_order = \"ascending\";\n    group = \"g1\"\n  };{\n    name = \"subkey\";\n    type = \"string\";\n    sort_order = \"ascending\";\n    group = \"g1\"\n  };{\n    name = \"value\";\n    type = \"string\";\n    sort_order = \"ascending\";\n  }\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"297\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-297\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-297\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-297.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Example of a schema for a table with logs.&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;strict=%false&amp;gt;[\n {\n    \"name\" = \"id\";\n    \"type\" = \"int64\";\n };{\n    \"name\" = \"class\";\n    \"type\" = \"int64\";\n };{\n    \"name\" = \"uid\";\n    \"type\" = \"string\";\n };{\n    \"name\" = \"ip\";\n    \"type\" = \"int64\";\n };{\n    \"name\" = \"iso_eventtime\";\n    \"type\" = \"string\";\n };{\n    \"name\" = \"error\";\n    \"type\" = \"string\"\n };{\n    \"name\" = \"ip6\";\n    \"type\" = \"string\"\n };{\n    \"name\" = \"port\";\n    \"type\" = \"int64\"\n };{\n    \"name\" = \"comment\";\n    \"type\" = \"string\"\n }\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"305\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-305\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-305\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-305.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"schema_mode\"&gt;&lt;a href=\"en/user-guide/storage/static-schema.html#schema_mode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Weak and strong schema&lt;/span&gt;&lt;/a&gt;Weak and strong schema&lt;/h2&gt;\n&lt;p&gt;A table has the &lt;code&gt;schema_mode&lt;/code&gt; attribute that defines the source of the schema origin.&lt;/p&gt;\n&lt;p&gt;If the schema was not set explicitly by the user, the &lt;code&gt;@schema_mode&lt;/code&gt; attribute will have the &lt;code&gt;weak&lt;/code&gt; value. This means that the table schema was created automatically and is only needed to mark up the key columns.&lt;br /&gt;\nThis schema automatically changes if the table loses its sorting property or changes the set of key columns.&lt;/p&gt;\n&lt;p&gt;For example, an entry with the &lt;code&gt;&amp;lt;append=%true&amp;gt;&lt;/code&gt; flag to a sorted table without specifying the &lt;code&gt;sorted_by&lt;/code&gt; attribute causes the table to lose sorting property, which means that its schema changes — at least the &lt;code&gt;sort_order&lt;/code&gt; attribute.&lt;/p&gt;\n&lt;p&gt;If the table schema is set explicitly by the user, then &lt;code&gt;@schema_mode == strong&lt;/code&gt;. The schema of such a table is saved and checked when writing, both in &lt;code&gt;append&lt;/code&gt; and &lt;code&gt;overwrite&lt;/code&gt; mode. Implicit transformations with a strong schema are impossible.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Create a table without a schema&lt;/span&gt;\n$ yt --proxy &amp;lt;cluster-name&amp;gt; create table //tmp/table_1\n213c-a01da-3fc0191-54a9a802\n$ yt --proxy &amp;lt;cluster-name&amp;gt; get //tmp/table_1/@schema_mode\n&lt;span class=\"hljs-string\"&gt;\"weak\"&lt;/span&gt;\n$ yt --proxy &amp;lt;cluster-name&amp;gt; get //tmp/table_1/@schema\n&amp;lt;\n    &lt;span class=\"hljs-string\"&gt;\"unique_keys\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"strict\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;;\n&amp;gt; []\n&lt;span class=\"hljs-comment\"&gt;# Create a table with an explicitly specified schema&lt;/span&gt;\n$ yt --proxy &amp;lt;cluster-name&amp;gt; create table //tmp/table_2 --attributes &lt;span class=\"hljs-string\"&gt;'{schema = [{name = a; type = int64}; {name = b; type = string}]}'&lt;/span&gt;\n213c-b75ef-3fc0191-1e85fe66\n$ yt --proxy &amp;lt;cluster-name&amp;gt; get //tmp/table_2/@schema_mode\n&lt;span class=\"hljs-string\"&gt;\"strong\"&lt;/span&gt;\n$ yt --proxy &amp;lt;cluster-name&amp;gt; get //tmp/table_2/@schema\n&amp;lt;\n    &lt;span class=\"hljs-string\"&gt;\"unique_keys\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"strict\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n&amp;gt; [\n    {\n        &lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"int64\"&lt;/span&gt;;\n    };\n    {\n        &lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"string\"&lt;/span&gt;;\n    };\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"323\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-323\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-323\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-323.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"strict_schematization_advantages\"&gt;&lt;a href=\"en/user-guide/storage/static-schema.html#strict_schematization_advantages\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Strict schematization advantages&lt;/span&gt;&lt;/a&gt;Strict schematization advantages&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Performance:\n&lt;ul&gt;\n&lt;li&gt;If you additionally enable the columnar format of storing &lt;a href=\"user-guide/storage/chunks.html\"&gt;chunks&lt;/a&gt; &lt;code&gt;optimize_for = scan&lt;/code&gt;, data will be stored more compactly and reading a subset of columns will be faster.&lt;/li&gt;\n&lt;li&gt;Some table readers can work faster for tables with a schema.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Convenience and more options:\n&lt;ul&gt;\n&lt;li&gt;YQL is more convenient for working with schematized tables.&lt;/li&gt;\n&lt;li&gt;In &lt;a href=\"user-guide/data-processing/chyt/about-chyt.html\"&gt;CHYT&lt;/a&gt;, you cannot work with unschematized data.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"schema_inference\"&gt;&lt;a href=\"en/user-guide/storage/static-schema.html#schema_inference\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Inheriting a schema in system operations&lt;/span&gt;&lt;/a&gt;Inheriting a schema in system operations&lt;/h2&gt;\n&lt;p&gt;System operations such as Sort, Erase, Merge, and Remote copy can independently output the output table schema. Schema output rules for operations are regulated by the &lt;code&gt;schema_inference_mode = (auto|from_input|from_output)&lt;/code&gt; specification. Examples of using the options can be found in the &lt;a href=\"en/user-guide/storage/static-schema.html#examples\"&gt;Examples&lt;/a&gt; section.&lt;/p&gt;\n&lt;h3 id=\"ordered-merge,-erase\"&gt;&lt;a href=\"en/user-guide/storage/static-schema.html#ordered-merge,-erase\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ordered merge, Erase&lt;/span&gt;&lt;/a&gt;Ordered merge, Erase&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Option&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from_input&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The schemas of all tables must match with an accuracy of the &lt;code&gt;sort_order&lt;/code&gt; attribute and the column order. Then the output table schema matches the input table schema. If there is one input table, sorting is preserved. If input tables had a strong schema, the output table will have a strong schema as well.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from_output&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The output table schema is used, data is validated in relation to this schema.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;auto&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;If the output table has a strong schema, its compatibility by types with the schema of all highly schematized input tables is checked. If the output table has a weak schema, the schema is derived from the input table schemas similarly to the &lt;code&gt;from_input&lt;/code&gt; option.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"unordered-merge\"&gt;&lt;a href=\"en/user-guide/storage/static-schema.html#unordered-merge\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Unordered merge&lt;/span&gt;&lt;/a&gt;Unordered merge&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Option&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from_input&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The number and types of columns must match, then the output table schema matches the input table schema except for sorting. If input tables had a strong schema, the output table will have a strong schema as well.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from_output&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The output table schema is used, data is validated in relation to this schema.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;auto&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;If the output table has a strong schema, its compatibility by types with the schema of all highly schematized input tables is checked. If the output table has a weak schema, the schema is derived from the input table schemas (similarly to the &lt;code&gt;from_input&lt;/code&gt; option).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"sorted-merge\"&gt;&lt;a href=\"en/user-guide/storage/static-schema.html#sorted-merge\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sorted merge&lt;/span&gt;&lt;/a&gt;Sorted merge&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Option&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from_input&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The number and types of columns must match, then the output table schema matches the input table schema, key columns are set according to the &lt;code&gt;merge_by&lt;/code&gt; parameter of the specification. If input tables had a strong schema, the output table will have a strong schema as well.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from_output&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;It is checked that key columns of the output table match the &lt;code&gt;merge_by&lt;/code&gt; key columns from the specification.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;auto&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;If the output table has a strong schema, its compatibility by types with the schema of all highly schematized input tables is checked. It is checked that key columns coincide with the &lt;code&gt;merge_by&lt;/code&gt; parameter. If the output table has a weak schema, the schema is derived from the input table schemas similarly to the &lt;code&gt;from_input&lt;/code&gt; option.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"sort\"&gt;&lt;a href=\"en/user-guide/storage/static-schema.html#sort\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sort&lt;/span&gt;&lt;/a&gt;Sort&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;Sort&lt;/code&gt; is the only operation that can change a strong table schema. The column order is changed: key columns are moved to the beginning and the &lt;code&gt;sort_order&lt;/code&gt; attribute is set. This is due to the common scenario of replacing a table with its sorted copy.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Option&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from_input&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;If all input tables have strong schemas and the schemas match with an accuracy of the &lt;code&gt;sort_order&lt;/code&gt; attribute and column order, then the output table column types match the types in the input table schemas. The key columns are derived from the operation specification (&lt;code&gt;sort_by&lt;/code&gt;). If all input tables have a weak schema, the schema will be derived from the key columns.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from_output&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The output table schema is saved, the key columns are changed according to the &lt;code&gt;sort_by&lt;/code&gt; specification parameter. All key columns must be present in the schema.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;auto&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;If the output table has a strong schema, its compatibility by types with the schema of all highly schematized input tables is checked. The key columns change according to the specification. If the output table has a weak schema, the schema is derived from the input table schemas (similarly to the &lt;code&gt;from_input&lt;/code&gt; option).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"changing-a-schema\"&gt;&lt;a href=\"en/user-guide/storage/static-schema.html#changing-a-schema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Changing a schema&lt;/span&gt;&lt;/a&gt;Changing a schema&lt;/h2&gt;\n&lt;p&gt;Changing a schema is an easy operation with metainformation that does not require reading data. To change a schema, use the &lt;code&gt;alter_table&lt;/code&gt; command.&lt;br /&gt;\nThe schema of an empty table can be changed in a random manner. For non-empty tables, there are several allowed schema change scenarios:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Adding a non-key column to a strict schema: &lt;code&gt;strict = %true&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Adding a key column to the end of the key in a strict schema: &lt;code&gt;strict = %true&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Deleting a column from a non-strict schema: &lt;code&gt;strict = %false&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Converting a schema from strict (&lt;code&gt;strict = %true&lt;/code&gt;) to non-strict (&lt;code&gt;strict = %false&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Other schema changes are prohibited, because they require data revalidation and such changes can be made through &lt;code&gt;Merge&lt;/code&gt; or &lt;code&gt;Map&lt;/code&gt; operations.&lt;/p&gt;\n&lt;p&gt;There are a number of restrictions on changing the schema:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Changing the schema does not necessarily result in changing the contents of the table. For example, changing the &lt;code&gt;strict&lt;/code&gt; attribute of the table from &lt;code&gt;false&lt;/code&gt; to &lt;code&gt;true&lt;/code&gt; requires checking that each row in the table contains only the values related to the columns mentioned in the schema and such a check is equivalent to reading the table completely.&lt;/li&gt;\n&lt;li&gt;You cannot delete columns if &lt;code&gt;strict = true&lt;/code&gt;: there is no way to clear the corresponding value in each row. You cannot add columns if &lt;code&gt;strict = false&lt;/code&gt;: when adding a column of a certain type, you cannot be sure that there are no rows in the table that already contain a value corresponding to this column, and this value may already belong to a different data type.&lt;/li&gt;\n&lt;li&gt;You cannot delete key columns from the middle, because this can potentially violate the sort order.&lt;/li&gt;\n&lt;li&gt;You cannot enter new computed columns or change the expression or aggregate function of existing columns, because this would require recomputing all rows in the table. But, for example, you can delete the last key columns, because this only weakens the sorting condition for future insertions without changing it for the existing set of rows.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"en/user-guide/storage/static-schema.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples of working with a schema&lt;/span&gt;&lt;/a&gt;Examples of working with a schema&lt;/h2&gt;\n&lt;h3 id=\"reading-a-schema\"&gt;&lt;a href=\"en/user-guide/storage/static-schema.html#reading-a-schema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reading a schema&lt;/span&gt;&lt;/a&gt;Reading a schema&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt --proxy &amp;lt;cluster-name&amp;gt; get //home/tutorial/links_sorted_schematized/@schema\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"603\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-603\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-603\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-603.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Python&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.get(&lt;span class=\"hljs-string\"&gt;\"//home/tutorial/links_sorted_schematized/@schema\"&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"609\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-609\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-609\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-609.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"creating-a-table-with-a-schema\"&gt;&lt;a href=\"en/user-guide/storage/static-schema.html#creating-a-table-with-a-schema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Creating a table with a schema&lt;/span&gt;&lt;/a&gt;Creating a table with a schema&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt --proxy &amp;lt;cluster-name&amp;gt; create table //tmp/table --attributes &lt;span class=\"hljs-string\"&gt;'{schema = [{name = a; type = int64}; {name = b; type = string}]}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"620\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-620\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-620\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-620.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Python&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.create_table(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;, attributes={&lt;span class=\"hljs-string\"&gt;\"schema\"&lt;/span&gt; : [{&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt; : &lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt; : &lt;span class=\"hljs-string\"&gt;\"int64\"&lt;/ )(&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;)(&lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"string\"&lt;/span&gt;));\nclient-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Create&lt;/span&gt;(\n  &lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;,\n  NYT::NT_TABLE,\n  &lt;span class=\"hljs-built_in\"&gt;TCreateOptions&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;Attributes&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TNode&lt;/span&gt;()(&lt;span class=\"hljs-string\"&gt;\"schema\"&lt;/span&gt;, schemaNode)));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"632\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-632\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-632\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-632.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"the-schema-attribute-in-richypath\"&gt;&lt;a href=\"en/user-guide/storage/static-schema.html#the-schema-attribute-in-richypath\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;The schema attribute in RichYPath&lt;/span&gt;&lt;/a&gt;The schema attribute in RichYPath&lt;/h3&gt;\n&lt;p&gt;You can use the &lt;code&gt;@schema&lt;/code&gt; attribute of the path when writing data using the &lt;code&gt;write_table&lt;/code&gt; command or at the output of MapReduce operations.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;CLI\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; data | yt write &lt;span class=\"hljs-string\"&gt;'&amp;lt;schema=[{name = a; type = int64}; {name = b; type = string}]&amp;gt;//tmp/table'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"646\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-646\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-646\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-646.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"setting-a-schema-and-changing-a-format-for-typified-and-structured-data\"&gt;&lt;a href=\"en/user-guide/storage/static-schema.html#setting-a-schema-and-changing-a-format-for-typified-and-structured-data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Setting a schema and changing a format for typified and structured data&lt;/span&gt;&lt;/a&gt;Setting a schema and changing a format for typified and structured data&lt;/h3&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Enable columnar storage format&lt;/span&gt;\nyt --proxy &amp;lt;cluster-name&amp;gt; &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //tmp/table/@optimize_for scan\n&lt;span class=\"hljs-comment\"&gt;# Set a new schema and transfer data to the new storage format&lt;/span&gt;\nyt --proxy &amp;lt;cluster-name&amp;gt; merge --mode ordered --src //tmp/table --dst &lt;span class=\"hljs-string\"&gt;'&amp;lt;schema=[{name = a; type = int64; sort_order = ascending}; {name = b; type = string}]&amp;gt;//tmp/table'&lt;/span&gt; --spec &lt;span class=\"hljs-string\"&gt;'{schema_inference_mode = from_output; force_transform = %true}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"655\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-655\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-655\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-655.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;There are more automatic solu
