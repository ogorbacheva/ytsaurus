        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section contains information about how to use tables to store binary data.&lt;/p&gt;\n&lt;h2 id=\"common\"&gt;&lt;a href=\"en/user-guide/storage/blobtables.html#common\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General information&lt;/span&gt;&lt;/a&gt;General information&lt;/h2&gt;\n&lt;p&gt;You sometimes need to save binary data from jobs.&lt;br /&gt;\nThe obvious solution is to write a file from each job to Cypress.&lt;br /&gt;\nBut this method has its drawbacks:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;It creates a high load on the proxy.&lt;/li&gt;\n&lt;li&gt;A large number of objects appears in Cypress which makes working with them less efficient.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Therefore, it is preferable to write the binary data in a single table:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The data is divided into parts and saved in separate table rows. This table must have a set of key columns that uniquely identify the file: name and path. Besides that, there must be a column responsible for the &lt;a href=\"https://en.wikipedia.org/wiki/Object_storage\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;BLOB&lt;/a&gt; number with the data and a column responsible for the data itself. The table must be sorted by a set of key columns and by a column with the BLOB number so that point reads by the key that specifies the file name are possible.&lt;/li&gt;\n&lt;li&gt;For a file, all BLOBs, except for the last one, must be the same size. The recommended size is 4 MB, and some commands, such as &lt;code&gt;read_blob_table&lt;/code&gt;, are applied to it by default. The columns with data and the BLOB number must be named &lt;code&gt;data&lt;/code&gt; and &lt;code&gt;part_index&lt;/code&gt;, respectively.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Tables that meet the described conditions are BLOB tables.&lt;/p&gt;\n&lt;p&gt;BLOB tables are used within YTsaurus to store stderr and core files generated by operation jobs.&lt;br /&gt;\nFor example, the table with stderr operations has 3 columns: &lt;code&gt;job_id&lt;/code&gt;, &lt;code&gt;part_index&lt;/code&gt;, and &lt;code&gt;data&lt;/code&gt;, the table is sorted by &lt;code&gt;job_id&lt;/code&gt; and &lt;code&gt;part_index&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"read_blob_table\"&gt;&lt;a href=\"en/user-guide/storage/blobtables.html#read_blob_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;The read_blob_table command&lt;/span&gt;&lt;/a&gt;The read_blob_table command&lt;/h2&gt;\n&lt;p&gt;The special &lt;code&gt;read_blob_table&lt;/code&gt; command is implemented for convenient data reading from BLOB tables.&lt;/p&gt;\n&lt;p&gt;The command takes the path to the table as input and outputs a binary data stream.&lt;br /&gt;\nThe command also checks that the indexes of read BLOBs start from zero and go without gaps.&lt;/p&gt;\n&lt;p&gt;The command has the &lt;code&gt;part_index_column_name&lt;/code&gt; and &lt;code&gt;data_column_name&lt;/code&gt; parameters that enable you to set the names of columns with the BLOB number and data, respectively. By default, these names are &lt;code&gt;part_index&lt;/code&gt; and &lt;code&gt;data&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Example of running an operation and reading the stderr of a job from a BLOB table:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Starting a Map operation&lt;/span&gt;\n$ yt --proxy &amp;lt;cluster-name&amp;gt; map --src &lt;span class=\"hljs-string\"&gt;'//tmp/table_in'&lt;/span&gt; --dst &lt;span class=\"hljs-string\"&gt;'//tmp/table_mapped'&lt;/span&gt; --format yson &lt;span class=\"hljs-string\"&gt;'cat; echo something &amp;gt;&amp;amp;2'&lt;/span&gt; --spec=&lt;span class=\"hljs-string\"&gt;'{stderr_table_path=\"//tmp/stderr_table\";}'&lt;/span&gt;\n\n2023-12-07 16:25:19,463\tINFO\tOperation started: http://&amp;lt;cluster-name&amp;gt;/?page=operation&amp;amp;mode=detail&amp;amp;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=11788844-52f37dd2-3ff03e8-ff3bf1e4&amp;amp;tab=details\n2023-12-07 16:25:19,561\tINFO\t( 0 min) operation 11788844-52f37dd2-3ff03e8-ff3bf1e4 initializing\n2023-12-07 16:25:22,961\tINFO\t( 0 min) Unrecognized spec: {&lt;span class=\"hljs-string\"&gt;'mapper'&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;'title'&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'cat;'&lt;/span&gt;}}\n2023-12-07 16:25:24,230\tINFO\t( 0 min) operation 11788844-52f37dd2-3ff03e8-ff3bf1e4: running=0     completed=0     pending=1     failed=0     aborted=0     lost=0     total=1     blocked=0\n2023-12-07 16:25:25,353\tINFO\t( 0 min) operation 11788844-52f37dd2-3ff03e8-ff3bf1e4 completing\n2023-12-07 16:25:27,527\tINFO\t( 0 min) operation 11788844-52f37dd2-3ff03e8-ff3bf1e4 completed\n\n&lt;span class=\"hljs-comment\"&gt;# Finding out the job id&lt;/span&gt;\n$ yt --proxy &amp;lt;cluster-name&amp;gt; list-jobs 11788844-52f37dd2-3ff03e8-ff3bf1e4 --format json | jq &lt;span class=\"hljs-string\"&gt;'.jobs[] | select(.type==\"map\").id'&lt;/span&gt;\n\n&lt;span class=\"hljs-string\"&gt;\"4c3fc84d-884fbde5-3ff0384-94b1\"&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Reading the \"errors\" of this job only&lt;/span&gt;\n$ yt --proxy &amp;lt;cluster-name&amp;gt; read-blob-table &lt;span class=\"hljs-string\"&gt;'//tmp/stderr_table[\"4c3fc84d-884fbde5-3ff0384-94b1\"]'&lt;/span&gt;\nsomething\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"57\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-57\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-57\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-57.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/storage/blobtables.md","sourcePath":"en/user-guide/storage/blobtables.md"},"headings":[{"title":"General information","href":"en/user-guide/storage/blobtables.html#common","level":2},{"title":"The read_blob_table command","href":"en/user-guide/storage/blobtables.html#read_blob_table","level":2}],"title":"Binary data in tables"},"router":{"pathname":"en/user-guide/storage/blobtables","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
