        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section lists operation input/output configuration options as well as table read and write command options.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;This section considers only important options that might help a user. In actuality, the options are much more numerous and provide fairly fine control of the various data read/write parameters. More often that not, this type of configuration is not required, and using non-default values might actually do harm.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;You can control reading and writing via &lt;a href=\"user-guide/storage/formats.html\"&gt;table data formats&lt;/a&gt;, &lt;code&gt;TableReader/TableWriter&lt;/code&gt;, and &lt;code&gt;ControlAttributes&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;You control data reads via settings in two sections: &lt;code&gt;table_reader&lt;/code&gt; and &lt;code&gt;control_attributes&lt;/code&gt;.&lt;br /&gt;\nYou can control data writes in the &lt;code&gt;table_writer&lt;/code&gt; section.&lt;/p&gt;\n&lt;h2 id=\"table_reader\"&gt;&lt;a href=\"en/user-guide/storage/io-configuration.html#table_reader\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TableReader section&lt;/span&gt;&lt;/a&gt;TableReader section&lt;/h2&gt;\n&lt;p&gt;These settings can be specified when reading tables using the &lt;code&gt;table_reader&lt;/code&gt; option or in the &lt;code&gt;table_reader&lt;/code&gt; section under &lt;code&gt;job_io&lt;/code&gt; in the operation specification.&lt;/p&gt;\n&lt;h3 id=\"sampling\"&gt;&lt;a href=\"en/user-guide/storage/io-configuration.html#sampling\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sampling&lt;/span&gt;&lt;/a&gt;Sampling&lt;/h3&gt;\n&lt;p&gt;Under &lt;code&gt;table_reader&lt;/code&gt;, you can specify sampling settings &lt;code&gt;sampling_seed&lt;/code&gt; and &lt;code&gt;sampling_rate&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;...\nspec = {&lt;span class=\"hljs-string\"&gt;\"job_io\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"table_reader\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"sampling_seed\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;42&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"sampling_rate\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;0.3&lt;/span&gt;}}}\nyt.run_map(map_function, &lt;span class=\"hljs-built_in\"&gt;input&lt;/span&gt;, output, spec=spec)\n...\nyt.read_table(table_path, table_reader={&lt;span class=\"hljs-string\"&gt;\"sampling_seed\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;42&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"sampling_rate\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;0.3&lt;/span&gt;})\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"31\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-31\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-31\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-31.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The value of &lt;code&gt;\"sampling_rate\": 0.3&lt;/code&gt; will result in the operation (&lt;code&gt;map_function&lt;/code&gt;) receiving 30% of all the input table rows as input.&lt;br /&gt;\nThe &lt;code&gt;sampling_seed&lt;/code&gt; option controls a random number generator used to sample rows. It guarantees the same output for the same &lt;code&gt;sampling_seed&lt;/code&gt;, a pure &lt;code&gt;map_function&lt;/code&gt;, and the same collection of input chunks. If &lt;code&gt;sampling_seed&lt;/code&gt; is not included in the specification, it will be random.&lt;/p&gt;\n&lt;p&gt;When sampling is used all the data are read from disk, the specified probability notwithstanding.&lt;br /&gt;\nNonetheless, this could be less costly than independent data sampling since the sampling itself will occur system-side immediately following the disk read.&lt;br /&gt;\nTo obtain maximum sampling read performance in an operation at a reduced sampling quality, use the &lt;a href=\"en/user-guide/storage/io-configuration.html#sampling\"&gt;&lt;code&gt;sampling&lt;/code&gt;&lt;/a&gt; option in the operation specification.&lt;/p&gt;\n&lt;h3 id=\"window_size\"&gt;&lt;a href=\"en/user-guide/storage/io-configuration.html#window_size\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Buffer size for data fed to a job&lt;/span&gt;&lt;/a&gt;Buffer size for data fed to a job&lt;/h3&gt;\n&lt;p&gt;You control the job data feed buffer via the &lt;code&gt;window_size&lt;/code&gt; parameter expressed in bytes. The default value is 20 MB.&lt;/p&gt;\n&lt;p&gt;Configuring the job feed data buffer:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;...\nspec = {&lt;span class=\"hljs-string\"&gt;\"job_io\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"table_reader\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"window_size\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;20971520&lt;/span&gt;}}}\nyt.run_map(map_function, &lt;span class=\"hljs-built_in\"&gt;input&lt;/span&gt;, output, spec=spec)\n...\nyt.read_table(table_path, table_reader={&lt;span class=\"hljs-string\"&gt;\"window_size\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;20971520&lt;/span&gt;})\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"47\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-47\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-47\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-47.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"table_writer\"&gt;&lt;a href=\"en/user-guide/storage/io-configuration.html#table_writer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TableWriter section&lt;/span&gt;&lt;/a&gt;TableWriter section&lt;/h2&gt;\n&lt;p&gt;These settings can be included in the &lt;code&gt;table_writer&lt;/code&gt; section when writing table data or in the &lt;code&gt;table_writer&lt;/code&gt; section under operation &lt;code&gt;job_io&lt;/code&gt; settings.&lt;/p&gt;\n&lt;h3 id=\"max_row_weight\"&gt;&lt;a href=\"en/user-guide/storage/io-configuration.html#max_row_weight\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Limit on table row size&lt;/span&gt;&lt;/a&gt;Limit on table row size&lt;/h3&gt;\n&lt;p&gt;When writing table data, the YTsaurus system checks their size. If this size is over a certain limit, writing stops and the relevant job or &lt;code&gt;write&lt;/code&gt; command fails.&lt;/p&gt;\n&lt;p&gt;The default string size cap is 16 MB; however, it can be configured under &lt;code&gt;table_writer&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Updating the table row size constraint:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;...\nspec = {&lt;span class=\"hljs-string\"&gt;\"job_io\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"table_writer\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"max_row_weight\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;32&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;1024&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;1024&lt;/span&gt;}}}\nyt.run_map(map_function, &lt;span class=\"hljs-built_in\"&gt;input&lt;/span&gt;, output, spec=spec)\n...\nyt.write_table(table_path, table_writer={&lt;span class=\"hljs-string\"&gt;\"max_row_weight\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;32&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;1024&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;1024&lt;/span&gt;})\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"66\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-66\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-66\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-66.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code&gt;max_row_weight&lt;/code&gt; is specified in bytes. It cannot exceed 128 MB.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;table_writer&lt;/code&gt; controls the various storage settings at table creation time or when calling &lt;code&gt;merge&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"desired_chunk_size\"&gt;&lt;a href=\"en/user-guide/storage/io-configuration.html#desired_chunk_size\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Chunk size&lt;/span&gt;&lt;/a&gt;Chunk size&lt;/h3&gt;\n&lt;p&gt;The &lt;code&gt;desired_chunk_size&lt;/code&gt; specification setting defines the desired chunk size in bytes.&lt;br /&gt;\nTo modify a table to achieve a chunk size close to 1 KB, you can call the merge command.&lt;/p&gt;\n&lt;p&gt;Modifying chunk size:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt merge --mode auto --spec &lt;span class=\"hljs-string\"&gt;'{\"force_transform\"=true; \"job_io\"={\"table_writer\"={\"desired_chunk_size\"=1024}}}'&lt;/span&gt; --src &amp;lt;&amp;gt; --dst &amp;lt;&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"82\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-82\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-82\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-82.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Data fed to a job cannot be smaller than block size. Block size is defined by &lt;code&gt;block_size&lt;/code&gt; in bytes. The minimum value is 1 KB, and the default is 16 MB.&lt;/p&gt;\n&lt;h3 id=\"upload_replication_factor\"&gt;&lt;a href=\"en/user-guide/storage/io-configuration.html#upload_replication_factor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Replication factor&lt;/span&gt;&lt;/a&gt;Replication factor&lt;/h3&gt;\n&lt;p&gt;The &lt;code&gt;upload_replication_factor&lt;/code&gt; specification setting defines the number of table or file chunk replicas. The default is 2 and the maximum is 10.&lt;br /&gt;\nTo modify the number of replicas, simply call the merge command.&lt;/p&gt;\n&lt;p&gt;Modifying the replication factor:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt merge --mode auto --spec &lt;span class=\"hljs-string\"&gt;'{\"force_transform\"=true; \"job_io\"={\"table_writer\"={\"upload_replication_factor\"=10}}}'&lt;/span&gt; --src &amp;lt;&amp;gt; --dst &amp;lt;&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"95\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-95\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-95\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-95.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;For the modification to take place in the background at a later time, call &lt;code&gt;set&lt;/code&gt; on the table &lt;code&gt;replication_factor&lt;/code&gt;. The same is true for a table write with a pre-defined parameter.&lt;/p&gt;\n&lt;h3 id=\"sample_rate\"&gt;&lt;a href=\"en/user-guide/storage/io-configuration.html#sample_rate\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sampling rate&lt;/span&gt;&lt;/a&gt;Sampling rate&lt;/h3&gt;\n&lt;p&gt;The &lt;code&gt;sample_rate&lt;/code&gt; specification setting defines the percentage of the rows to be selected and placed in chunk metadata.&lt;br /&gt;\nThis row selection affects the construction of buckets for the sort's &lt;code&gt;partition&lt;/code&gt; stage. Increasing the &lt;code&gt;sample_rate&lt;/code&gt; value helps the system compute a key distribution more precisely but increases system load by increasing the amount of metadata and reducing read and write performance.&lt;br /&gt;\nTo avoid skewed bucket sizes when putting values in a single partition for a column with few values, increase &lt;code&gt;sample_rate&lt;/code&gt; prior to the &lt;code&gt;sort&lt;/code&gt; or the &lt;code&gt;reduce stage&lt;/code&gt;.&lt;br /&gt;\nThe default value is 1/10,000.&lt;/p&gt;\n&lt;p&gt;If a table has, say, 100,000 rows, the sample will include 10. Consequently, the sort will have no more than 10 partitions.&lt;/p&gt;\n&lt;p&gt;To obtain a sample of 0.1% of the table (maximum sample size), run a merge.&lt;/p&gt;\n&lt;p&gt;Modifying the sampling rate:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt merge --mode auto --spec &lt;span class=\"hljs-string\"&gt;'{\"force_transform\"=true; \"job_io\"={\"table_writer\"={\"sample_rate\"=0.001}}}'&lt;/span&gt; --src &amp;lt;&amp;gt; --dst &amp;lt;&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"114\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-114\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-114\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-114.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"control_attributes\"&gt;&lt;a href=\"en/user-guide/storage/io-configuration.html#control_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ControlAttributes section&lt;/span&gt;&lt;/a&gt;ControlAttributes section&lt;/h2&gt;\n&lt;p&gt;When reading several tables or several ranges of the same table, it is useful to have housekeeping information to provide insight which table or read range data is coming from.&lt;br /&gt;\nTo support this information in jobs or when reading tables, we introduced the notion of system management (control) entries containing such information.&lt;br /&gt;\nThis concept is internal, and its representation in a job's input data stream depends on the requested format.&lt;/p&gt;\n&lt;p&gt;Let's look at control attributes using the YSON format. For this format, the stream might include special records of the Yson Entity type rather than regular data records that are of the Yson Map type. Their attributes contain housekeeping information.&lt;br /&gt;\nFor instance, if record &lt;code&gt;&amp;lt;table_index=2&amp;gt;#&lt;/code&gt; comes in, it would mean that all subsequent records in the stream will be from the second input table until a new control record is received with a different &lt;code&gt;table_index&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;control_attributes&lt;/code&gt; section supports the following options:&lt;/p&gt;\n&lt;p&gt;The values are specified in parentheses by default.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code&gt;enable_table_index&lt;/code&gt;&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;): send control records with an input table index (&lt;code&gt;table_index&lt;/code&gt; field of type &lt;code&gt;int64&lt;/code&gt; in the control record attributes).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code&gt;enable_row_index&lt;/code&gt;&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;): send control records with an input table record index (&lt;code&gt;row_index&lt;/code&gt; field of type &lt;code&gt;int64&lt;/code&gt; in the control record attributes).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code&gt;enable_range_index&lt;/code&gt;&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;): send control records with a range number from among the requested input table ranges. Please see ranges (&lt;code&gt;range_index&lt;/code&gt; field of type &lt;code&gt;int64&lt;/code&gt; in the control record attributes).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code&gt;enable_key_switch&lt;/code&gt;&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;): send records on input data key switch (&lt;code&gt;key_switch&lt;/code&gt; field of type &lt;code&gt;bool&lt;/code&gt; in the control record attributes). The setting is only valid for the &lt;code&gt;reduce&lt;/code&gt; phase of the Map-Reduce and Reduce operations.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The processing of control attributes through the Python API and the C++ API is transparent for the user. That is to say that their analysis and conversion to a more convenient representation are handled by the API.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Options that control the transmission of table indexes in the input stream are available at different system layers.&lt;br /&gt;\nThe &lt;code&gt;enable_input_table_index&lt;/code&gt; option is found in the operation spec section describing the user process.&lt;br /&gt;\nThe value of this option overwrites the value in &lt;code&gt;enable_table_index&lt;/code&gt; under &lt;code&gt;control_attributes&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;enable_table_index&lt;/code&gt; option enables and disables &lt;code&gt;table index&lt;/code&gt; at the format level.&lt;br /&gt;\nMany formats have these indexes disabled by default; therefore, they must be enabled. Many formats have options responsible for representing &lt;code&gt;table_index&lt;/code&gt; in this one. For more information on &lt;code&gt;table_index&lt;/code&gt; in various formats, see &lt;a href=\"user-guide/data-processing/operations/table-switch.html\"&gt;Table switching&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;row_index&lt;/code&gt;, &lt;code&gt;range_index&lt;/code&gt;, and &lt;code&gt;key_switch&lt;/code&gt;representations are only supported by the YSON and the JSON formats.&lt;/p&gt;\n&lt;p&gt;Input data stream showing all the control attributes in a YSON format reduce job:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&amp;lt;&lt;span class=\"hljs-string\"&gt;\"table_index\"&lt;/span&gt;=&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;&amp;gt;#;\n&amp;lt;&lt;span class=\"hljs-string\"&gt;\"range_index\"&lt;/span&gt;=&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;&amp;gt;#;\n&amp;lt;&lt;span class=\"hljs-string\"&gt;\"row_index\"&lt;/span&gt;=&lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;;&amp;gt;#;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"2\"&lt;/span&gt;;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n&amp;lt;&lt;span class=\"hljs-string\"&gt;\"key_switch\"&lt;/span&gt;=%&lt;span class=\"hljs-literal\"&gt;&lt;span class=\"hljs-keyword\"&gt;true&lt;/span&gt;&lt;/span&gt;;&amp;gt;#;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"3\"&lt;/span&gt;;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n&amp;lt;&lt;span class=\"hljs-string\"&gt;\"key_switch\"&lt;/span&gt;=%&lt;span class=\"hljs-literal\"&gt;&lt;span class=\"hljs-keyword\"&gt;true&lt;/span&gt;&lt;/span&gt;;&amp;gt;#;\n&amp;lt;&lt;span class=\"hljs-string\"&gt;\"row_index\"&lt;/span&gt;=&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;&amp;gt;#;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"1\"&lt;/span&gt;;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"174\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-174\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-174\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-174.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Enabling control attributes for reading in an operation:&lt;/p&gt;\n&lt;div class=\"yfm-tabs\" data-diplodoc-group=\"defaultTabsGroup-psapnq1v\" data-diplodoc-variant=\"regular\"&gt;\n&lt;div class=\"yfm-tab-list\" role=\"tablist\"&gt;\n&lt;div data-diplodoc-id=\"cli\" data-diplodoc-key=\"cli\" class=\"yfm-tab yfm-tab-group active\" role=\"tab\" tabindex=\"0\" data-diplodoc-is-active=\"true\"&gt;CLI&lt;/div&gt;\n&lt;div data-diplodoc-id=\"python\" data-diplodoc-key=\"python\" class=\"yfm-tab yfm-tab-group\" role=\"tab\" tabindex=\"-1\" data-diplodoc-is-active=\"false\"&gt;Python&lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"8ab6gr6c\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"CLI\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; --control-attributes=&lt;span class=\"hljs-string\"&gt;\"{enable_row_index=true;}\"&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"//path/to/table[#10:#20]\"&lt;/span&gt;\n{&lt;span class=\"hljs-string\"&gt;\"&lt;span class=\"hljs-variable\"&gt;$value&lt;/span&gt;\"&lt;/span&gt;: null, &lt;span class=\"hljs-string\"&gt;\"&lt;span class=\"hljs-variable\"&gt;$attributes&lt;/span&gt;\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"row_index\"&lt;/span&gt;: 10}}\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"188\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-188\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-188\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-188.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"ycp5m2gw\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"Python\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;...\nspec = {&lt;span class=\"hljs-string\"&gt;\"job_io\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"control_attributes\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"enable_row_index\"&lt;/span&gt;: &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;}}}\nyt.run_map(map_function, &lt;span class=\"hljs-built_in\"&gt;input&lt;/span&gt;, output, spec=spec) &lt;span class=\"hljs-comment\"&gt;# will place \"@row_index\" key to input records&lt;/span&gt;\n...\nyt.read_table(path, control_attributes={&lt;span class=\"hljs-string\"&gt;\"enable_row_index\"&lt;/span&gt;: &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;}, &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=yt.YsonFormat())\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"191\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-191\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-191\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-191.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/storage/io-configuration.md","sourcePath":"en/user-guide/storage/io-configuration.md"},"headings":[{"title":"TableReader section","href":"en/user-guide/storage/io-configuration.html#table_reader","level":2,"items":[{"title":"Sampling","href":"en/user-guide/storage/io-configuration.html#sampling","level":3},{"title":"Buffer size for data fed to a job","href":"en/user-guide/storage/io-configuration.html#window_size","level":3}]},{"title":"TableWriter section","href":"en/user-guide/storage/io-configuration.html#table_writer","level":2,"items":[{"title":"Limit on table row size","href":"en/user-guide/storage/io-config
