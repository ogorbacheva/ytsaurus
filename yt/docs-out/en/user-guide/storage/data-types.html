            {"data":{"leading":false,"html":"&lt;p&gt;This section describes the data types supported by YTsaurus and the way they are described in the schema and represented in the formats.&lt;/p&gt;\n&lt;h2 id=\"overview\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#overview\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Overview&lt;/span&gt;&lt;/a&gt;Overview&lt;/h2&gt;\n&lt;p&gt;YTsaurus supports a number of primitive types:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;string&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;integer&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;boolean&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;float&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;double&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;date&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;datetime&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;timestamp&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;interval&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;As well as the following composite (complex) types:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;optional&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;list&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;struct&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;tuple&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;variant&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;tagged&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;You can use one of the following two methods to specify a type in a table schema:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Using the &lt;code&gt;type&lt;/code&gt; and (optionally) the &lt;code&gt;required&lt;/code&gt; keys: historically, the first method but it is only good for defining primitive or optional primitive types.&lt;/li&gt;\n&lt;li&gt;Using the &lt;code&gt;type_v3&lt;/code&gt; key.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The &lt;code&gt;type&lt;/code&gt; key always expects a string.&lt;br /&gt;\nThe &lt;code&gt;type_v3&lt;/code&gt; key expects either a string for primitive types or a YSON dictionary.&lt;br /&gt;\nA YSON dict always has the &lt;code&gt;type_name&lt;/code&gt; key that stores the type name.&lt;br /&gt;\nThe remaining keys depend on the specific type and are described below.&lt;/p&gt;\n&lt;h2 id=\"schema\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#schema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Describing types in a schema&lt;/span&gt;&lt;/a&gt;Describing types in a schema&lt;/h2&gt;\n&lt;h3 id=\"schema_primitive\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#schema_primitive\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Primitive types&lt;/span&gt;&lt;/a&gt;Primitive types&lt;/h3&gt;\n&lt;p&gt;You can define primitive types in a schema both using the &lt;code&gt;type&lt;/code&gt; and the &lt;code&gt;type_v3&lt;/code&gt; keys.&lt;/p&gt;\n&lt;p&gt;If primitive type &lt;code&gt;T&lt;/code&gt; is defined using &lt;code&gt;type&lt;/code&gt;, YTsaurus will additionally check the &lt;code&gt;required&lt;/code&gt; key in the schema:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;required=%true&lt;/code&gt;: the column will have a strictly defined type. &lt;code&gt;Null&lt;/code&gt; or empty values are illegal.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;required=%false&lt;/code&gt;: the column will be of type &lt;code&gt;optional&amp;lt;T&amp;gt;&lt;/code&gt;. Any values of a primitive type and the &lt;code&gt;Null&lt;/code&gt; value will be legal.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The table lists the supported types and their representation in the &lt;code&gt;type&lt;/code&gt;/&lt;code&gt;type_v3&lt;/code&gt; keys.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Representation in &lt;code&gt;type&lt;/code&gt;&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Representation in &lt;code&gt;type_v3&lt;/code&gt;&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;an integer belonging to the range &lt;code&gt;[-2^63, 2^63-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int64&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;an integer belonging to the range &lt;code&gt;[-2^31, 2^31-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int32&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int32&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;an integer belonging to the range &lt;code&gt;[-2^15, 2^15-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int16&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int16&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;an integer belonging to the range &lt;code&gt;[-2^7, 2^7-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int8&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;an integer belonging to the range &lt;code&gt;[0, 2^64-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;an integer belonging to the range &lt;code&gt;[0, 2^32-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint32&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint32&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;an integer belonging to the range &lt;code&gt;[0, 2^16-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint16&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint16&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;an integer belonging to the range &lt;code&gt;[0, 2^8-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint8&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;an 8-byte real number&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;double&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;double&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;a 4-byte real number&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;float&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;float&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Standard &lt;code&gt;true/false&lt;/code&gt; boolean&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;boolean&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt; (different from &lt;code&gt;type&lt;/code&gt;)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;a random sequence of bytes&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;a proper UTF8 sequence&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;utf8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;utf8&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;a string that contains a valid &lt;a href=\"https://en.wikipedia.org/wiki/JSON\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;JSON&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;json&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;json&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Universally_unique_identifier\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;UUID&lt;/a&gt;, a random 16-byte sequence (stored in binary representation)&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uuid&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uuid&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;an integer in the range &lt;code&gt;[-53375809, 53375808 - 1]&lt;/code&gt;, &lt;br /&gt; represents the number of days from the Unix epoch; &lt;br /&gt; the representable time range is about 145,000 years into the past and into the future &lt;br /&gt; see the section about &lt;a href=\"en/user-guide/storage/data-types.html#temporal_types\"&gt;temporal types&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;date32&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;date32&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;an integer in the range &lt;code&gt;[-53375809 * 86400, 53375808 * 86400 - 1]&lt;/code&gt;, &lt;br /&gt; represents the number of seconds from the Unix epoch; &lt;br /&gt; the representable time range is about 145,000 years into the past and into the future &lt;br /&gt; see the section about &lt;a href=\"en/user-guide/storage/data-types.html#temporal_types\"&gt;temporal types&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;datetime64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;datetime64&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;an integer in the range &lt;code&gt;[-53375809 * 86400 * 10^6, 53375808 * 86400 * 10^6 - 1]&lt;/code&gt;, &lt;br /&gt; represents the number of microseconds from the Unix epoch; &lt;br /&gt; the representable time range is about 145,000 years into the past and into the future &lt;br /&gt; see the section about &lt;a href=\"en/user-guide/storage/data-types.html#temporal_types\"&gt;temporal types&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;timestamp64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;timestamp64&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;an integer in the range &lt;code&gt;[-9223339708800000000, 9223339708800000000]&lt;/code&gt;, &lt;br /&gt; represents the number of microseconds between two &lt;code&gt;timestamp64&lt;/code&gt; timestamps &lt;br /&gt; see the section about &lt;a href=\"en/user-guide/storage/data-types.html#temporal_types\"&gt;temporal types&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;interval64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;interval64&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;an integer in the range &lt;code&gt;[0, 49673 - 1]&lt;/code&gt;, &lt;br /&gt; represents the number of days from the Unix epoch; &lt;br /&gt; representable date range: &lt;code&gt;[1970-01-01, 2105-12-31]&lt;/code&gt;  &lt;br /&gt; see the section about &lt;a href=\"en/user-guide/storage/data-types.html#temporal_types\"&gt;temporal types&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;date&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;date&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;an integer in the range &lt;code&gt;[0, 49673 * 86400 - 1]&lt;/code&gt;, &lt;br /&gt; represents the number of seconds from the Unix epoch; &lt;br /&gt; representable time range: &lt;code&gt;[1970-01-01T00:00:00Z, 2105-12-31T23:59:59Z]&lt;/code&gt;  &lt;br /&gt; see the section about &lt;a href=\"en/user-guide/storage/data-types.html#temporal_types\"&gt;temporal types&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;datetime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;datetime&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;an integer in the range &lt;code&gt;[0, 49673 * 86400 * 10^6 - 1]&lt;/code&gt;, &lt;br /&gt; represents the number of microseconds from the Unix epoch; &lt;br /&gt; representable time range: &lt;code&gt;[1970-01-01T00:00:00Z, 2105-12-31T23:59:59.999999Z]&lt;/code&gt;  &lt;br /&gt; see the section about &lt;a href=\"en/user-guide/storage/data-types.html#temporal_types\"&gt;temporal types&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;timestamp&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;timestamp&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;an integer in the range &lt;code&gt;[- 49673 * 86400 * 10^6 + 1, 49673 * 86400 * 10^6 - 1]&lt;/code&gt;, &lt;br /&gt; represents the number of microseconds between two &lt;code&gt;timestamp&lt;/code&gt; timestamps &lt;br /&gt; see the section about &lt;a href=\"en/user-guide/storage/data-types.html#temporal_types\"&gt;temporal types&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;interval&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;interval&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;An arbitrary YSON structure&lt;br /&gt; that is physically represented as a byte sequence, &lt;br /&gt; cannot have a &lt;code&gt;required=%true&lt;/code&gt; attribute&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;any&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;yson&lt;/code&gt; (different from &lt;code&gt;type&lt;/code&gt;)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;a system singular type that can only contain &lt;code&gt;null&lt;/code&gt; &lt;br /&gt; (creating a separate column with this type makes no sense; &lt;br /&gt; we don't expect to see this type in user tables, &lt;br /&gt; but it's useful for YQL integration)&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;a singular type that can only contain &lt;code&gt;null&lt;/code&gt;; this type is different from &lt;code&gt;null&lt;/code&gt; &lt;br /&gt; (creating a separate column with this type makes no sense; &lt;br /&gt; we don't expect to see this type in user tables, &lt;br /&gt; but it's useful for YQL integration)&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;void&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;void&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Schema example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3=utf8\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"442\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-442\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-442\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-442.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3=bool\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"443\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-443\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-443\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-443.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3=yson\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"444\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-444\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-444\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-444.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"temporal_types\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#temporal_types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Temporal types&lt;/span&gt;&lt;/a&gt;Temporal types&lt;/h3&gt;\n&lt;p&gt;Temporal types in YTsaurus are categorized into two groups. Historically, the first ones to appear in the system were &lt;code&gt;date&lt;/code&gt;, &lt;code&gt;datetime&lt;/code&gt;, &lt;code&gt;timestamp&lt;/code&gt;, and &lt;code&gt;interval&lt;/code&gt;. They are used to represent times from the beginning of 1970 to the end of 2105. They were followed by &lt;code&gt;date32&lt;/code&gt;, &lt;code&gt;datetime64&lt;/code&gt;, &lt;code&gt;timestamp64&lt;/code&gt;, and &lt;code&gt;interval64&lt;/code&gt;. These types can be used to represent times over a wider range, about 145,000 into the past and into the future. We recommend using the latter types, because they have a wider range of values.&lt;/p&gt;\n&lt;p&gt;The Gregorian calendar should be used for all of the temporal types. When dealing with values in the distant past, note that YTsaurus in no way accounts for the &lt;a href=\"https://en.wikipedia.org/wiki/Adoption_of_the_Gregorian_calendar\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;transition to the Gregorian calendar&lt;/a&gt;, which occurred in different countries at different times: YT assumes that the Gregorian calendar has always been in use.&lt;/p&gt;\n&lt;h3 id=\"schema_decimal\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#schema_decimal\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Decimal&lt;/span&gt;&lt;/a&gt;Decimal&lt;/h3&gt;\n&lt;p&gt;The values of type &lt;code&gt;decimal(p, s)&lt;/code&gt; are real numbers with the specified precision.&lt;/p&gt;\n&lt;p&gt;To define this type in a schema, specify the following keys:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;type_name&lt;/code&gt;: value of &lt;code&gt;decimal&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;precision&lt;/code&gt;: total number of decimal digits in a numeric value, &lt;code&gt;precision&lt;/code&gt; must be in the range &lt;code&gt;[1, 35]&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;scale&lt;/code&gt;: number of digits to the right of the decimal point in a numeric value, &lt;code&gt;scale&lt;/code&gt; must be in the range &lt;code&gt;[0, precision]&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Schema example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3={\n    type_name=decimal;\n    precision=10;\n    scale=2;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"483\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-483\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-483\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-483.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The values &lt;code&gt;3.14&lt;/code&gt;, &lt;code&gt;-2.71&lt;/code&gt;, &lt;code&gt;9.99&lt;/code&gt; may be of type &lt;code&gt;decimal(3, 2)&lt;/code&gt; (&lt;code&gt;precision=3&lt;/code&gt;, &lt;code&gt;scale=2&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;The type supports a number of special values, such as &lt;code&gt;nan&lt;/code&gt;, &lt;code&gt;+inf&lt;/code&gt;, &lt;code&gt;-inf&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"schema_decimal_binary\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#schema_decimal_binary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Description of binary representation&lt;/span&gt;&lt;/a&gt;Description of binary representation&lt;/h4&gt;\n&lt;p&gt;&lt;code&gt;Decimal&lt;/code&gt; numbers have a unique binary representation&lt;br /&gt;\nthat is the default in many data formats, including &lt;code&gt;yson&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;For the purposes of this representation, the values of &lt;code&gt;decimal(p, s)&lt;/code&gt; types are maintained as binary strings. Binary string length&lt;br /&gt;\ndepends on &lt;code&gt;precision&lt;/code&gt;.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Precision&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Number of bits in the representation&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Number of bytes in the representation&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1-9&lt;/td&gt;\n&lt;td&gt;32&lt;/td&gt;\n&lt;td&gt;4&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;10-18&lt;/td&gt;\n&lt;td&gt;64&lt;/td&gt;\n&lt;td&gt;8&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;19-38&lt;/td&gt;\n&lt;td&gt;128&lt;/td&gt;\n&lt;td&gt;16&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;39-76&lt;/td&gt;\n&lt;td&gt;256&lt;/td&gt;\n&lt;td&gt;32&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;You need to perform the following steps to obtain a binary representation of a &lt;code&gt;decimal&lt;/code&gt; number. These steps will be illustrated with the values &lt;code&gt;3.1415&lt;/code&gt;, &lt;code&gt;-2.7182&lt;/code&gt; of type &lt;code&gt;decimal(5, 4)&lt;/code&gt;.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Take an integer made up of the value's digits. The number of bits is taken from &lt;code&gt;precision&lt;/code&gt; in the table above. In this example, 32-bit numbers &lt;code&gt;31415&lt;/code&gt;, &lt;code&gt;-27182&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Write the number as a big-endian sequence. In this example, the strings are &lt;code&gt;\\x00\\x00\\x7A\\xB7&lt;/code&gt;, &lt;code&gt;\\xFF\\xFF\\x95\\xD2&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Invert the most significant bit. In this example, the strings are &lt;code&gt;\\x80\\x00\\7A\\xB7&lt;/code&gt;, &lt;code&gt;\\x7F\\xFF\\x95\\xD2&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;The integer representations of the special values of &lt;code&gt;nan&lt;/code&gt;, &lt;code&gt;+inf&lt;/code&gt;, &lt;code&gt;-inf&lt;/code&gt; for the first step are shown in the table below:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Special value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Integer representation&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;nan&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;INT_MAX&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;+inf&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;INT_MAX - 1&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;-inf&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;- INT_MAX + 1&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Please note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Only &lt;code&gt;decimals&lt;/code&gt; with a &lt;code&gt;precision&lt;/code&gt; of no more than 35 are currently supported when working with YQL.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"schema_optional\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#schema_optional\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Optional type&lt;/span&gt;&lt;/a&gt;Optional type&lt;/h3&gt;\n&lt;p&gt;The &lt;code&gt;optional&amp;lt;T&amp;gt;&lt;/code&gt; type means that a value may be of type &lt;code&gt;T&lt;/code&gt; or be empty.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Please note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Each use of &lt;code&gt;optional&lt;/code&gt; for a type adds new values.&lt;br /&gt;\nFor instance, &lt;code&gt;optional&amp;lt;optional&amp;lt;bool&amp;gt;&amp;gt;&lt;/code&gt; may take on the following values:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The external &lt;code&gt;optional&lt;/code&gt; is empty.&lt;/li&gt;\n&lt;li&gt;The external &lt;code&gt;optional&lt;/code&gt; is non-empty, and the internal one is empty.&lt;/li&gt;\n&lt;li&gt;All the &lt;code&gt;optionals&lt;/code&gt; are non-empty, the values are &lt;code&gt;true&lt;/code&gt; or &lt;code&gt;false&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Legacy columns containing the &lt;code&gt;type=T;required=false&lt;/code&gt; attributes correspond to type &lt;code&gt;optional&amp;lt;T&amp;gt;&lt;/code&gt; defined using &lt;code&gt;type_v3&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;To define type &lt;code&gt;optional&lt;/code&gt;, specify the keys below:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;type_name&lt;/code&gt;: value of &lt;code&gt;optional&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;item&lt;/code&gt;: element type description.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Schema example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3={\n  type_name=optional;\n  item=string;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"685\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-685\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-685\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-685.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3={\n  type_name=optional;\n  item={\n    type_name=optional;\n    item=bool;\n  }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"686\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-686\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-686\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-686.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"schema_list\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#schema_list\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List&lt;/span&gt;&lt;/a&gt;List&lt;/h3&gt;\n&lt;p&gt;Values of type &lt;code&gt;list&amp;lt;T&amp;gt;&lt;/code&gt; are lists of elements of type &lt;code&gt;T&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;To define the type in the schema, specify the keys below:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;type_name&lt;/code&gt;: value of &lt;code&gt;list&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;item&lt;/code&gt;: element type description.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Schema example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3={\n  type_name=list;\n  item=string;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"711\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-711\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-711\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-711.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3={\n  type_name=list;\n  item={\n    type_name=list;\n    item=double;\n  }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"712\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-712\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-712\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-712.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"schema_struct\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#schema_struct\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Struct&lt;/span&gt;&lt;/a&gt;Struct&lt;/h3&gt;\n&lt;p&gt;A collection of named fields with specified value types.&lt;/p&gt;\n&lt;p&gt;To define this type in a schema, specify the following keys:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;type_name&lt;/code&gt;: value of &lt;code&gt;struct&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;members&lt;/code&gt;: list of dictionaries with keys:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;name&lt;/code&gt;: field name, must be a non-empty utf8 string.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;type&lt;/code&gt;: field type.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Schema example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3={\n  type_name=struct;\n  members=[\n    {\n      name=foo;\n      type=int32;\n    };\n    {\n      name=bar;\n      type={\n        type_name=optional;\n        item=string;\n      }\n    };\n  ]\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"749\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-749\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-749\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-749.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"schema_tuple\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#schema_tuple\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tuple&lt;/span&gt;&lt;/a&gt;Tuple&lt;/h3&gt;\n&lt;p&gt;A collection of unnamed fields of certain predefined types.&lt;/p&gt;\n&lt;p&gt;To define this type, you need to specify the following keys in the schema:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;type_name&lt;/code&gt;: value of &lt;code&gt;tuple&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;elements&lt;/code&gt;: list of dictionaries with keys:&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;type&lt;/code&gt;: element type.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Schema example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3={\n  type_name=tuple;\n  elements=[\n     {\n       type=double;\n     };\n     {\n       type=double;\n     };\n  ]\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"779\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-779\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-779\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-779.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"schema_variant\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#schema_variant\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Variant&lt;/span&gt;&lt;/a&gt;Variant&lt;/h3&gt;\n&lt;p&gt;Variant is strictly a single value from a defined collection of types.&lt;br /&gt;\nA variant may be of one of two types:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Variant over struct. Each type has a name (as in a struct), and each variant value is labeled with the name of the relevant variant element value.&lt;/li&gt;\n&lt;li&gt;Variant over tuple. In this case, all the elements are unnamed, and each value is labeled with an index.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;To define this type, specify the following keys in a schema:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;type_name&lt;/code&gt;: value of &lt;code&gt;variant&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;elements&lt;/code&gt; or &lt;code&gt;members&lt;/code&gt; (not both): the keys have the same structure similar as these keys in &lt;code&gt;tuple&lt;/code&gt; / &lt;code&gt;struct&lt;/code&gt;:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;elements&lt;/code&gt;: for the option with unnamed elements with the key itself containing a list of dictionaries with keys:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;type&lt;/code&gt;: element type.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;members&lt;/code&gt;: for the option with named elements with the key itself containing a list of dictionaries with keys:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;name&lt;/code&gt;: element name, must be a non-empty utf8 string.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;type&lt;/code&gt;: description of element type.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Schema example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3={\n  type_name=variant;\n  members=[\n     {\n       name=int_field;\n       type=int64;\n     };\n     {\n       name=string_field;\n       type=string;\n     };\n  ]\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"847\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-847\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-847\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-847.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3={\n  type_name=variant;\n  elements=[\n     {\n       type=int32;\n     };\n     {\n       type=string;\n     };\n     {\n       type=double;\n     };\n  ]\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"848\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-848\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-848\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-848.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"schema_dict\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#schema_dict\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dict&lt;/span&gt;&lt;/a&gt;Dict&lt;/h3&gt;\n&lt;p&gt;A dict is a sequence of key/value pairs.&lt;br /&gt;\nYTsaurus does not check the keys for uniqueness or order.&lt;br /&gt;\nHowever, most clients will upload data to an actual dictionary while processing, and the value for non-unique keys will be lost.&lt;/p&gt;\n&lt;p&gt;To define this type, specify the following keys in a schema:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;type_name&lt;/code&gt;: value of &lt;code&gt;dict&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;key&lt;/code&gt;: description of key type.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;value&lt;/code&gt;: value type description.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Schema example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3={\n  type_name=dict;\n  key=int64;\n  value={\n    type_name=optional;\n    item=string;\n  };\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"878\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-878\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-878\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-878.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"schema_tagged\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#schema_tagged\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tagged&lt;/span&gt;&lt;/a&gt;Tagged&lt;/h3&gt;\n&lt;p&gt;The &lt;code&gt;tagged&lt;/code&gt; type helps annotate other types with a string. Any value of type &lt;code&gt;T&lt;/code&gt; can serve as a value for type &lt;code&gt;tagged&amp;lt;TAG_NAME,T&amp;gt;&lt;/code&gt;,&lt;br /&gt;\nhowever, the types themselves will be considered different wherever YTsaurus compares schemas. For instance, when the possibility of merging two tables into one is being checked.&lt;/p&gt;\n&lt;p&gt;To define this type, specify the following keys in a schema:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;type_name&lt;/code&gt;: value of &lt;code&gt;tagged&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;tag&lt;/code&gt;: tag name, must be a non-empty utf8 string.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;item&lt;/code&gt;: element type description.&lt;br /&gt;\n—&lt;br /&gt;\nSchema example:&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3={\n  type_name=tagged;\n  tag=\"image/svg\";\n  item=\"string\";\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"905\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-905\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-905\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-905.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"formats\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#formats\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Representing compound types in formats&lt;/span&gt;&lt;/a&gt;Representing compound types in formats&lt;/h2&gt;\n&lt;p&gt;Formats are used to read and write tables.&lt;br /&gt;\nSome formats do not support composite data, and some, such as dsv / schemaful_dsv, will return an error in response to an attempt to read a composite value. For instance, &lt;code&gt;Values of type \"any\" are not supported by the chosen format&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"yson\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#yson\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YSON &lt;/span&gt;&lt;/a&gt;YSON &lt;/h3&gt;\n&lt;p&gt;There are two YSON representations of composite types. The representation of types &lt;code&gt;struct&lt;/code&gt; and &lt;code&gt;variant&lt;/code&gt; are different:&lt;br /&gt;\nthe default representation is more convenient to use,&lt;br /&gt;\nwhile the alternative representation yields better storage and processing performance.&lt;/p&gt;\n&lt;p&gt;You can switch between the representations by using the &lt;code&gt;complex_type_mode&lt;/code&gt; flag. Legal values: &lt;code&gt;named&lt;/code&gt; / &lt;code&gt;positional&lt;/code&gt;.&lt;br /&gt;\nType representation descriptions are provided below. Unless otherwise specified, a type representation does not depend on the &lt;code&gt;complex_type_mode&lt;/code&gt; setting.&lt;/p&gt;\n&lt;p&gt;There are two representations for &lt;code&gt;dict&lt;/code&gt; type with string keys: by default, the &lt;code&gt;positional&lt;/code&gt; representation in the form of a list is used (since the data is stored in YTsaurus). For convenience, you can enable the &lt;code&gt;named&lt;/code&gt; mode using the &lt;code&gt;string_keyed_dict_mode&lt;/code&gt; flag.&lt;/p&gt;\n&lt;h4 id=\"yson_primitive\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#yson_primitive\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Primitive types&lt;/span&gt;&lt;/a&gt;Primitive types&lt;/h4&gt;\n&lt;p&gt;Primitive types have a linear representation as a single YSON value.&lt;br /&gt;\nThe table shows a mapping between the primitive and the YSON types.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;&lt;code&gt;type&lt;/code&gt; / &lt;code&gt;type_v3&lt;/code&gt;&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;YSON representation&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;int64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;signed number&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;int32&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;signed number&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;int16&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;signed number&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;int8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;signed number&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;unsigned number&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;uint32&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;unsigned number&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;uint16&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;unsigned number&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;uint8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;unsigned number&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;double&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;floating point number&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;boolean&lt;/code&gt; / &lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;boolean value&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;utf8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;date&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;unsigned number, see below&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;datetime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;unsigned number, see below&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;timestamp&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;unsigned number, see below&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;interval&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;signed number&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;uuid&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;string with binary data, see below&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;any&lt;/code&gt; / &lt;code&gt;yson&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;value-dependent&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;#&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;void&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;#&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h5 id=\"yson_time_mode\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#yson_time_mode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Time types&lt;/span&gt;&lt;/a&gt;Time types&lt;/h5&gt;\n&lt;p&gt;The YSON format has a &lt;code&gt;time_mode&lt;/code&gt; option that determines how the &lt;code&gt;date&lt;/code&gt;, &lt;code&gt;datetime&lt;/code&gt;, and &lt;code&gt;timestamp&lt;/code&gt; types are displayed. Its possible values are:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;binary&lt;/code&gt; (default) represents the value as an unsigned integer indicating the number of days/seconds/milliseconds that have passed since the beginning of the Unix epoch.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;text&lt;/code&gt; represents values as strings; examples of &lt;code&gt;date&lt;/code&gt;, &lt;code&gt;datetime&lt;/code&gt;, and &lt;code&gt;timestamp&lt;/code&gt; representations are as follows:&lt;br /&gt;\n&lt;code&gt;2022-01-02&lt;/code&gt;, &lt;code&gt;2022-01-02T03:04:05Z&lt;/code&gt;, and &lt;code&gt;2022-01-02T03:04:05.123456Z&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h5 id=\"yson_uuid_mode\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#yson_uuid_mode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;UUID&lt;/span&gt;&lt;/a&gt;UUID&lt;/h5&gt;\n&lt;p&gt;The YSON format has a &lt;code&gt;uuid_mode&lt;/code&gt; option that determines how the &lt;code&gt;uuid&lt;/code&gt; type is displayed. Its possible values are:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;binary&lt;/code&gt; (default) uses a 16-byte binary representation.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;text_yt&lt;/code&gt; uses a string representation in the YTsaurus format with 4 groups. For example: &lt;code&gt;61626364-65666768-696a6b6c-6d6e6f70&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;text_yql&lt;/code&gt; uses a string representation in the YQL format with 5 groups, which resembles the RFC representation. For example: &lt;code&gt;64636261-6665-6867-696a-6b6c6d6e6f70&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"yson_decimal\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#yson_decimal\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Decimal&lt;/span&gt;&lt;/a&gt;Decimal&lt;/h4&gt;\n&lt;p&gt;The YSON format has a &lt;code&gt;decimal_mode&lt;/code&gt; option that determines how the &lt;code&gt;decimal&lt;/code&gt; type is displayed. Its possible values are:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;binary&lt;/code&gt; (default) is encoded as a binary string with a &lt;a href=\"en/user-guide/storage/data-types.html#schema_decimal_binary\"&gt;binary representation&lt;/a&gt; of the &lt;code&gt;decimal&lt;/code&gt; number.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;text&lt;/code&gt; uses a text representation of the &lt;code&gt;decimal&lt;/code&gt; number.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"yson_optional\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#yson_optional\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Optional&lt;/span&gt;&lt;/a&gt;Optional&lt;/h4&gt;\n&lt;p&gt;The representation of type &lt;code&gt;optional&lt;/code&gt; depends on its inner type.&lt;br /&gt;\nThis is required for backward compatibility with the columns with &lt;code&gt;required=%false&lt;/code&gt;.&lt;br /&gt;\nIf &lt;code&gt;T&lt;/code&gt; is an arbitrary type that is not &lt;code&gt;optional&lt;/code&gt;, &lt;code&gt;optional&amp;lt;T&amp;gt;&lt;/code&gt; is represented as follows:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The &lt;code&gt;Null&lt;/code&gt; value that is &lt;code&gt;optional&lt;/code&gt; is represented by &lt;code&gt;#&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Otherwise, the &lt;code&gt;T&lt;/code&gt; type value uses the conventional representation.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If &lt;code&gt;T&lt;/code&gt; is an arbitrary type that is &lt;code&gt;optional&lt;/code&gt;, &lt;code&gt;optional&amp;lt;T&amp;gt;&lt;/code&gt; is represented as follows:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The &lt;code&gt;Null&lt;/code&gt; value of the outer &lt;code&gt;optional&lt;/code&gt; is represented as &lt;code&gt;#&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Otherwise, the &lt;code&gt;[ v ]&lt;/code&gt; representation is used (YSON list of length 1), where &lt;code&gt;v&lt;/code&gt; is the YSON representation of type &lt;code&gt;T&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example values, type &lt;code&gt;optional&amp;lt;int64&amp;gt;&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;#\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1199\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1199\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1199\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1199.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;-42\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1200\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1200\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1200\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1200.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Example values, type &lt;code&gt;optional&amp;lt;optional&amp;lt;int64&amp;gt;&amp;gt;&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;#\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1204\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1204\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1204\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1204.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[ # ]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1205\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1205\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1205\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1205.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[ -42 ]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1206\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1206\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1206\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1206.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"yson_list\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#yson_list\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List&lt;/span&gt;&lt;/a&gt;List&lt;/h4&gt;\n&lt;p&gt;Type &lt;code&gt;list&amp;lt;T&amp;gt;&lt;/code&gt; is encoded as a YSON list whose elements are encoded representations of elements of type &lt;code&gt;T&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Example value, type &lt;code&gt;list&amp;lt;int64&amp;gt;&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1216\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1216\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1216\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1216.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[42; -1;]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1217\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1217\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1217\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1217.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"yson_struct\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#yson_struct\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Struct&lt;/span&gt;&lt;/a&gt;Struct&lt;/h4&gt;\n&lt;p&gt;A struct representation depends on the values of the &lt;code&gt;complex_type_mode&lt;/code&gt; flag.&lt;/p&gt;\n&lt;h5 id=\"yson_struct_named\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#yson_struct_named\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named representation (default)&lt;/span&gt;&lt;/a&gt;Named representation (default)&lt;/h5&gt;\n&lt;p&gt;The representation being described applies to the situation&lt;br /&gt;\nwhen the YSON option of format &lt;code&gt;complex_type_mode&lt;/code&gt; is not set or is set to &lt;code&gt;complex_type_mode=named&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The struct is represented by a YSON dictionary where field names serve as keys and the contents of these fields are the values.&lt;/p&gt;\n&lt;p&gt;Example values, type &lt;code&gt;struct&amp;lt;Foo:int64;Bar:optional&amp;lt;utf8&amp;gt;&amp;gt;&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{Foo=42;Bar=#;}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1236\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1236\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1236\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1236.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{Foo=-5;Bar=\"minus five\";}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1237\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1237\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1237\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1237.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h5 id=\"yson_struct_positional\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#yson_struct_positional\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Positional representation&lt;/span&gt;&lt;/a&gt;Positional representation&lt;/h5&gt;\n&lt;p&gt;Where the &lt;code&gt;complex_type_mode=positional&lt;/code&gt; option is set for the YSON format, a different representation is used.&lt;/p&gt;\n&lt;p&gt;A struct is encoded as a YSON list with the i-th position containing a YSON representation of the struct's i-th field.&lt;br /&gt;\nThe list may contain fewer elements than the number of fields in your struct, which means that the remaining types must be &lt;code&gt;optional&amp;lt;T&amp;gt;&lt;/code&gt;,&lt;br /&gt;\nand the fields are considered to have an empty &lt;code&gt;optional&lt;/code&gt; value.&lt;/p&gt;\n&lt;p&gt;Example values, type &lt;code&gt;struct&amp;lt;Foo:int64;Bar:optional&amp;lt;utf8&amp;gt;&amp;gt;&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[42; #;]\n[42]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1250\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1250\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1250\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1250.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[-5;\"minus five\";]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1251\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1251\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1251\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1251.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"yson_tuple\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#yson_tuple\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tuple&lt;/span&gt;&lt;/a&gt;Tuple&lt;/h4&gt;\n&lt;p&gt;Type &lt;code&gt;tuple&lt;/code&gt; is encoded as a fixed-length YSON list. The i-th position contains the i-th field's encoded value.&lt;/p&gt;\n&lt;p&gt;Example values, type &lt;code&gt;tuple&amp;lt;int64;optional&amp;lt;utf8&amp;gt;&amp;gt;&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[42; #;]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1261\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1261\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1261\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1261.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[-5;\"minus five\";]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1262\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1262\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1262\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1262.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"yson_variant\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#yson_variant\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Variant&lt;/span&gt;&lt;/a&gt;Variant&lt;/h4&gt;\n&lt;h5 id=\"yson_variant_tuple\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#yson_variant_tuple\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Unnamed variant&lt;/span&gt;&lt;/a&gt;Unnamed variant&lt;/h5&gt;\n&lt;p&gt;The unnamed option is represented by a YSON list of length 2 that includes the following elements:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Alternative number (indexed at 0).&lt;/li&gt;\n&lt;li&gt;An encoded value for the relevant alternative.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example values, type &lt;code&gt;variant&amp;lt;int64;optional&amp;lt;utf8&amp;gt;&amp;gt;&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[0; 42]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1287\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1287\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1287\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1287.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[1; #]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1288\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1288\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1288\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1288.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[1; \"foo bar\";]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1289\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1289\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1289\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1289.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h5 id=\"yson_variant_struct\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#yson_variant_struct\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named variant option&lt;/span&gt;&lt;/a&gt;Named variant option&lt;/h5&gt;\n&lt;h6 id=\"yson_variant_struct_named\"&gt;&lt;a href=\"en/user-guide/storage/data-types.html#yson_variant_struct_named\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named representation (default)&lt;/span&gt;&lt;/a&gt;Named representation (default)&lt;/h6&gt;\n&lt;p&gt;This representation applies when the YSON option &lt;code&gt;complex_type_mode&lt;/code&gt; isn't specified or is set to &lt;code&gt;complex_type_mode=named&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The named option is represented by a YSON list of length 2 that includes the following elements:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Alternative name.&lt;/li&gt;\n&lt;li&gt;An encoded value for the relevant alternative.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example values, type `variant&amp;lt;Foo:int64;Bar:optional&amp;gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[Foo; 42]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1317\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1317\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1317\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1317.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[Bar; #]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1318\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1318\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1318\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimati
