        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section contains information on YTsaurus system objects designed to store large amounts of binary data. You can also store binary data in &lt;a href=\"user-guide/storage/blobtables.html\"&gt;tables&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"common\"&gt;&lt;a href=\"en/user-guide/storage/files.html#common\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General information&lt;/span&gt;&lt;/a&gt;General information&lt;/h2&gt;\n&lt;p&gt;A file is a &lt;a href=\"user-guide/storage/cypress.html\"&gt;Cypress&lt;/a&gt; node of type &lt;strong&gt;file&lt;/strong&gt; designed to store large binary data in the system.&lt;/p&gt;\n&lt;p&gt;You can store binary data both in files and in tables.&lt;/p&gt;\n&lt;p&gt;Sometimes, jobs need to save large binary data. The obvious solution is to write the file from each job to Cypress. However, this method has some drawbacks:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;It creates high proxy server load.&lt;/li&gt;\n&lt;li&gt;A large number of objects appears in Cypress which makes working with them less efficient.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;There is another solution that we propose: writing binary data to a single table.&lt;/p&gt;\n&lt;h2 id=\"usage\"&gt;&lt;a href=\"en/user-guide/storage/files.html#usage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usage&lt;/span&gt;&lt;/a&gt;Usage&lt;/h2&gt;\n&lt;p&gt;Files support appends via the &lt;code&gt;write_file&lt;/code&gt; &lt;a href=\"api/commands.html#write_file\"&gt;command&lt;/a&gt;. This performs a write by adding &lt;a href=\"user-guide/storage/chunks.html\"&gt;chunks&lt;/a&gt;; therefore, we recommend against performing many small writes.&lt;/p&gt;\n&lt;p&gt;To read files, use the &lt;code&gt;read_file&lt;/code&gt; &lt;a href=\"api/commands.html#read_file\"&gt;command&lt;/a&gt;. You can either read an entire file or specify a read range in the form of an offset in bytes. To do this, use the &lt;code&gt;offset&lt;/code&gt; selector in the &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPath&lt;/a&gt; language.&lt;br /&gt;\nEach read requires a request for metadata from the master server, so multiple reads are not recommended.&lt;/p&gt;\n&lt;h3 id=\"usage_in_jobs\"&gt;&lt;a href=\"en/user-guide/storage/files.html#usage_in_jobs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Using in jobs&lt;/span&gt;&lt;/a&gt;Using in jobs&lt;/h3&gt;\n&lt;p&gt;One way to use files is to deliver the same data, such as lookups, for &lt;a href=\"user-guide/data-processing/operations/overview.html\"&gt;jobs&lt;/a&gt;. This causes file chunks to be downloaded into the local cache of every node requesting the file.&lt;/p&gt;\n&lt;p&gt;If a file consists of multiple chunks or has &lt;code&gt;compression_codec&lt;/code&gt; set, the cache rebuilds the original file from the &lt;a href=\"user-guide/storage/chunks.html\"&gt;chunks&lt;/a&gt;. This file is referred to as an artifact. There are two ways to deliver an artifact into a file in a job &lt;code&gt;sandbox&lt;/code&gt;, which is a special directory that every job creates:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;By default, a &lt;a href=\"user-guide/storage/links.html\"&gt;link&lt;/a&gt; to the artifact will be created in the job &lt;code&gt;sandbox&lt;/code&gt;. This behavior is preferred since it works faster and creates less hard drive IO load.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;If you include the &lt;code&gt;copy_file&lt;/code&gt; option in the specification, the file will be copied into the &lt;code&gt;sandbox&lt;/code&gt;. It does not make sense to use this behavior unless you need to mount the entire &lt;code&gt;sandbox&lt;/code&gt; in &lt;a href=\"https://en.wikipedia.org/wiki/Tmpfs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;tmpfs&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If a file's &lt;code&gt;executable&lt;/code&gt; attribute is set to &lt;code&gt;true&lt;/code&gt;, it will be executable in the job &lt;code&gt;sandbox&lt;/code&gt;. By default, the attribute is set to &lt;code&gt;false&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;You can use the &lt;code&gt;file_name&lt;/code&gt; attribute to manage the name of a file or link created in the &lt;code&gt;sandbox&lt;/code&gt;. If this attribute is absent, the &lt;a href=\"user-guide/storage/cypress.html\"&gt;Cypress&lt;/a&gt; filename is used instead.&lt;/p&gt;\n&lt;h2 id=\"attributes\"&gt;&lt;a href=\"en/user-guide/storage/files.html#attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;System attributes&lt;/span&gt;&lt;/a&gt;System attributes&lt;/h2&gt;\n&lt;p&gt;Any file has the attributes shown in the table below.&lt;br /&gt;\nThe number of bytes in a file is written in the &lt;code&gt;uncompressed_data_size&lt;/code&gt; attribute that every chunk owner has.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Attribute&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Mandatory&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;executable&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether the file is executable.&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;file_name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Filename when a file is moved into a job &lt;code&gt;sandbox&lt;/code&gt;.&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;All the files are chunk owners, so they get the appropriate &lt;a href=\"user-guide/storage/chunks.html#attributes\"&gt;attributes&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/storage/files.md","sourcePath":"en/user-guide/storage/files.md"},"headings":[{"title":"General information","href":"en/user-guide/storage/files.html#common","level":2},{"title":"Usage","href":"en/user-guide/storage/files.html#usage","level":2,"items":[{"title":"Using in jobs","href":"en/user-guide/storage/files.html#usage_in_jobs","level":3}]},{"title":"System attributes","href":"en/user-guide/storage/files.html#attributes","level":2}],"title":"Files"},"router":{"pathname":"en/user-guide/storage/files","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
