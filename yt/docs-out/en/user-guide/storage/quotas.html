        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section describes resource quotas in the YTsaurus system.&lt;/p&gt;\n&lt;h2 id=\"resources\"&gt;&lt;a href=\"en/user-guide/storage/quotas.html#resources\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Resource types&lt;/span&gt;&lt;/a&gt;Resource types&lt;/h2&gt;\n&lt;p&gt;Most YTsaurus clusters are shared. Cluster resources are shared out to all projects that require data processing and storage. These quotas are displayed but not enabled.&lt;br /&gt;\nThe following types of resource quotas exist:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Storage:\n&lt;ul&gt;\n&lt;li&gt;HDD (SATA) disk quota not accounting for compression or replication.&lt;/li&gt;\n&lt;li&gt;SATA SSD/NVMe SSD disk quota not accounting for compression or replication.&lt;/li&gt;\n&lt;li&gt;Quota on the number of nodes in the &lt;a href=\"user-guide/storage/cypress.html\"&gt;metadata tree&lt;/a&gt; (tables, files, locks). Not booked separately in the annual planning process but provided upon request and approval. There is a limit on the number of tree nodes that applies to an entire cluster. Branched nodes actually consume the quota of the account in which they were created, but since this is not always correct, only trunk nodes are taken into account in the final resource quota.&lt;/li&gt;\n&lt;li&gt;Quota on chunks that all the stored data are split into. Issued in proportion to disk quotas based on 512 MB of space per chunk for static tables and 64 MB per chunk for dynamic tables plus a margin of 200,000 chunks or as may be agreed on a per-project basis.&lt;/li&gt;\n&lt;li&gt;Quota on the master server RAM used by the nodes in the metadata tree. Not requested as a separate resource but rather issued subject to agreement. Takes into account chunk and trunk node metadata, trunk node attributes, &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;dynamic table&lt;/a&gt; pivot keys as well as other data. Rule-of-thumb estimate: 100 to 200 bytes per node and the same amount per chunk. The above values may vary greatly depending on attribute and node name lengths, the lengths of the values in chunk key columns, and so on.&lt;/li&gt;\n&lt;li&gt;Quota on the number of dynamic table &lt;a href=\"user-guide/dynamic-tables/overview.html#tablets\"&gt;tablets (shards)&lt;/a&gt;. Not requested separately but issued upon request. The quota is allocated for the &lt;a href=\"user-guide/dynamic-tables/concepts.html#tablet_cell_bundles\"&gt;tablet_cell_bundle&lt;/a&gt; object.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Processing:\n&lt;ul&gt;\n&lt;li&gt;Guaranteed number of HyperThreading cores for MapReduce operations.&lt;/li&gt;\n&lt;li&gt;Guaranteed amount of RAM for MapReduce operations.&lt;/li&gt;\n&lt;li&gt;Limit on the number of running MapReduce operations and the total number of operations, including those queued to run.&lt;/li&gt;\n&lt;li&gt;Dedicated computational resources for querying &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;dynamic tables&lt;/a&gt; (write/select/lookup): CPU, RAM. This includes the quota on the amount of data in dynamic tables in memory (tablet_static_memory). Quotas are allocated for the &lt;a href=\"user-guide/dynamic-tables/concepts.html#tablet_cell_bundles\"&gt;tablet_cell_bundle&lt;/a&gt; object.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"account_quotas\"&gt;&lt;a href=\"en/user-guide/storage/quotas.html#account_quotas\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data storage&lt;/span&gt;&lt;/a&gt;Data storage&lt;/h2&gt;\n&lt;p&gt;Most types of data storage quotas are linked to a project &lt;strong&gt;account&lt;/strong&gt;. An account is a service object in Cypress. Each Cypress node has a readable/writable &lt;code&gt;account&lt;/code&gt; attribute storing the name of the account the node in question is linked to. In the case of files and tables, assigning an account causes its disk quota to be consumed. This takes into account the space physically allocated on the cluster nodes for data storage, so it depends on the replication degree (the &lt;code&gt;replication_factor&lt;/code&gt; attribute), erasure coding method (the &lt;code&gt;erasure_codec&lt;/code&gt; attribute), and the compression utilized (the &lt;code&gt;compression_codec&lt;/code&gt; attribute).&lt;/p&gt;\n&lt;p&gt;If the user exceeds the account quota for certain resource types, the system starts denying the account further access to the exceeded resource type. This does not mean that an account never exceeds its limits when used. For example, the limits may have been forcibly set below usage. Besides that, disk and chunk quota consumption tracking works asynchronously, which can also result in exceeding allocated limits.&lt;/p&gt;\n&lt;p&gt;For more information, see &lt;a href=\"user-guide/storage/accounts.html\"&gt;Accounts&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"medium\"&gt;&lt;a href=\"en/user-guide/storage/quotas.html#medium\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Media&lt;/span&gt;&lt;/a&gt;Media&lt;/h3&gt;\n&lt;p&gt;Different media types (HDD, SDD, RAM) are logically combined in special entities referred to as &lt;a href=\"user-guide/storage/media.html\"&gt;media&lt;/a&gt;. Media types differ by the amount of available space and read/write performance. The higher the performance of a medium, the smaller the medium is. Media divide the entire set of chunk locations into non-intersecting subsets. At the same time, a single cluster node may have locations on different media. Each such subset does its own chunk balancing and handles its own quota. An account's disk quota is issued for a specific medium. A user may select the medium to use to store different types of data. YTsaurus clusters host the following media types:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;default: integrates the set of a cluster's HDDs.&lt;/li&gt;\n&lt;li&gt;ssd_blobs: set of cluster's SSDs.&lt;/li&gt;\n&lt;li&gt;ssd_journals: set of SSDs for dynamic table log storage.&lt;/li&gt;\n&lt;li&gt;in_memory: dedicated space allocated in cluster node RAM.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;There is a special page in the YTsaurus web interface to view account quotas.&lt;/p&gt;\n&lt;p&gt;For more information on media, see the &lt;a href=\"user-guide/storage/media.html\"&gt;Media&lt;/a&gt; section.&lt;/p&gt;\n&lt;h3 id=\"dyntable_resources\"&gt;&lt;a href=\"en/user-guide/storage/quotas.html#dyntable_resources\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dynamic table resources&lt;/span&gt;&lt;/a&gt;Dynamic table resources&lt;/h3&gt;\n&lt;p&gt;Quotas on the number of tablets and the amount of tablet static memory are linked to tablet cell bundles. Bundle quotas display in a separate web interface section. Monitoring settings and viewing account and bundle quota histories are described in the Quota monitoring section.&lt;/p&gt;\n&lt;h2 id=\"data_processing\"&gt;&lt;a href=\"en/user-guide/storage/quotas.html#data_processing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data processing&lt;/span&gt;&lt;/a&gt;Data processing&lt;/h2&gt;\n&lt;p&gt;Data processing computational resources are linked to &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;pools&lt;/a&gt; (except tablet_cell_bundle).&lt;br /&gt;\nYou can view computational pool settings, including guarantees and operation number limits on the &lt;strong&gt;Scheduling&lt;/strong&gt; page (&lt;strong&gt;Details&lt;/strong&gt; tab, &lt;strong&gt;CPU&lt;/strong&gt; section, &lt;code&gt;Strong guar&lt;/code&gt; column).&lt;/p&gt;\n&lt;p&gt;If a project uses dynamic tables for production, you need to have a separate &lt;a href=\"user-guide/dynamic-tables/concepts.html#tablet_cell_bundles\"&gt;tablet cell bundle&lt;/a&gt; to isolate from other users. A tablet cell bundle is a group of containers (instances) that processes queries to a project's dynamic tables.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Dynamic tables require a disk quota to write journals (medium ssd_journals) and snapshots (medium default). The required quotas are a quota on file system objects (node_count) and a quota on the number of tablets (table shards, or tablet_count).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/storage/quotas.md","sourcePath":"en/user-guide/storage/quotas.md"},"headings":[{"title":"Resource types","href":"en/user-guide/storage/quotas.html#resources","level":2},{"title":"Data storage","href":"en/user-guide/storage/quotas.html#account_quotas","level":2,"items":[{"title":"Media","href":"en/user-guide/storage/quotas.html#medium","level":3},{"title":"Dynamic table resources","href":"en/user-guide/storage/quotas.html#dyntable_resources","level":3}]},{"title":"Data processing","href":"en/user-guide/storage/quotas.html#data_processing","level":2}],"title":"Quotas"},"router":{"pathname":"en/user-guide/storage/quotas","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
