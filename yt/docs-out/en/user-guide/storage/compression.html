        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section describes the compression algorithms supported by YTsaurus.&lt;/p&gt;\n&lt;p&gt;By default, user data in YTsaurus is stored and transmitted in compressed form.&lt;/p&gt;\n&lt;p&gt;The system performs compression:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;When writing to a table or file, data is split into parts — &lt;a href=\"user-guide/storage/chunks.html\"&gt;chunks&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Each chunk is compressed using the algorithm specified for that file or table and written to the disk.&lt;/li&gt;\n&lt;li&gt;For network transmission, data is read from the disk already in compressed form.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"get_compression\"&gt;&lt;a href=\"en/user-guide/storage/compression.html#get_compression\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Viewing a compression algorithm&lt;/span&gt;&lt;/a&gt;Viewing a compression algorithm&lt;/h2&gt;\n&lt;p&gt;Chunks, files, and tables can be compressed in the YTsaurus system.&lt;/p&gt;\n&lt;p&gt;The compression algorithm is specified in the &lt;code&gt;compression_codec&lt;/code&gt; attribute:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;For chunks, the &lt;code&gt;compression_codec&lt;/code&gt; attribute specifies the compression algorithm for all chunk blocks. Different chunks within a file or table can be compressed using different algorithms.&lt;/li&gt;\n&lt;li&gt;For tables and files, &lt;code&gt;compression_codec&lt;/code&gt; defines the default compression algorithm. It will be used if no algorithm is specified for individual file or table chunks. The default &lt;code&gt;compression_codec&lt;/code&gt; value: for tables — &lt;code&gt;lz4&lt;/code&gt;, for files — &lt;code&gt;none&lt;/code&gt; (without compression).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The degree of data compression is specified in the &lt;code&gt;compressed_data_size&lt;/code&gt; and &lt;code&gt;uncompressed_data_size&lt;/code&gt; attributes of a chunk, table, or file:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;For chunks, the &lt;code&gt;uncompressed_data_size&lt;/code&gt; attribute shows the size of the chunk before compression and the &lt;code&gt;compressed_data_size&lt;/code&gt; attribute shows the size of the chunk after compression.&lt;/li&gt;\n&lt;li&gt;For tables and files, the &lt;code&gt;uncompressed_data_size&lt;/code&gt; attribute shows the total uncompressed data size of all object chunks and the &lt;code&gt;compressed_data_size&lt;/code&gt; shows the compressed data size.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Statistics on the compression algorithms used in the table chunks are contained in the &lt;code&gt;compression_statistics&lt;/code&gt; attribute of the table.&lt;/p&gt;\n&lt;h2 id=\"set_compression\"&gt;&lt;a href=\"en/user-guide/storage/compression.html#set_compression\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Changing a compression algorithm&lt;/span&gt;&lt;/a&gt;Changing a compression algorithm&lt;/h2&gt;\n&lt;p&gt;To change the compression algorithm of an existing static table, set a new value of the &lt;code&gt;compression_codec&lt;/code&gt; attribute, then run the &lt;code&gt;merge&lt;/code&gt; command to recompress the chunks.&lt;/p&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //path/to/table/@compression_codec zstd_3\nyt merge --src //path/to/table --dst //path/to/table --spec &lt;span class=\"hljs-string\"&gt;'{force_transform = %true}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"74\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-74\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-74\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-74.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;To change the compression algorithm of a &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;dynamic table&lt;/a&gt;, set a new value for the &lt;code&gt;compression_codec&lt;/code&gt; attribute. Then run the &lt;code&gt;remount-table&lt;/code&gt; command. The old chunks will eventually be recompressed in the process of compaction. The compression rate depends on the table size, the write speed, and the background compaction settings.&lt;/p&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //path/to/table/@compression_codec zstd_3\nyt remount-table //path/to/table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"81\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-81\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-81\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-81.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If the table is permanently written to, there is usually no need for &lt;a href=\"user-guide/dynamic-tables/compaction.html#forced_compaction\"&gt;forced compression&lt;/a&gt;. If you need to force compression, use &lt;code&gt;forced compaction&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"compression_codecs\"&gt;&lt;a href=\"en/user-guide/storage/compression.html#compression_codecs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Supported compression algorithms&lt;/span&gt;&lt;/a&gt;Supported compression algorithms&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Compression algorithms&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;th&gt;Compression/decompression rate&lt;/th&gt;\n&lt;th&gt;Compression degree&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;none&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Without compression.&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;snappy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Learn more about the &lt;a href=\"https://google.github.io/snappy/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;snappy&lt;/a&gt; algorithm.&lt;/td&gt;\n&lt;td&gt;+++&lt;/td&gt;\n&lt;td&gt;+-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;zlib_[1..9]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The YTsaurus system supports all 9 levels. The higher the level is, the more substantially and slowly data is compressed. Learn more about the &lt;a href=\"https://zlib.net\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;zlib&lt;/a&gt; algorithm.&lt;/td&gt;\n&lt;td&gt;++&lt;/td&gt;\n&lt;td&gt;++&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;lz4&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The default compression algorithm for tables. Learn more about the &lt;a href=\"https://lz4.github.io/lz4/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;lz4&lt;/a&gt; algorithm.&lt;/td&gt;\n&lt;td&gt;+++&lt;/td&gt;\n&lt;td&gt;+&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;lz4_high_compression&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The &lt;code&gt;lz4&lt;/code&gt; algorithm with the enabled &lt;code&gt;high_compression&lt;/code&gt; option. Compresses more efficiently, but is significantly slower. Its compression rate is inferior to &lt;code&gt;zlib&lt;/code&gt;.&lt;/td&gt;\n&lt;td&gt;++&lt;/td&gt;\n&lt;td&gt;++-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;zstd_[1..21]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Learn more about the &lt;a href=\"https://github.com/facebook/zstd\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;zstd&lt;/a&gt; algorithm.&lt;/td&gt;\n&lt;td&gt;++&lt;/td&gt;\n&lt;td&gt;++&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;brotli_[1..11]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;We recommend using this algorithm for data that is not temporary. We recommend using levels 3, 5, and 8, because they have the best volume-to-speed ratio. Learn more about the &lt;a href=\"https://github.com/google/brotli\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;brotli&lt;/a&gt; algorithm.&lt;/td&gt;\n&lt;td&gt;++&lt;/td&gt;\n&lt;td&gt;+++&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;lzma_[0..9]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Learn more about the &lt;a href=\"https://www.7-zip.org\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;lzma&lt;/a&gt; algorithm.&lt;/td&gt;\n&lt;td&gt;+&lt;/td&gt;\n&lt;td&gt;+++&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;bzip2_[1..9]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Learn more about the &lt;a href=\"http://www.bzip.org\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;bzip2&lt;/a&gt; algorithm.&lt;/td&gt;\n&lt;td&gt;++&lt;/td&gt;\n&lt;td&gt;++&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"best_practice\"&gt;&lt;a href=\"en/user-guide/storage/compression.html#best_practice\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Best practices&lt;/span&gt;&lt;/a&gt;Best practices&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Compression is usually not applied to files that are used as &lt;a href=\"user-guide/storage/links.html\"&gt;symlinks&lt;/a&gt; to chunks in an operation.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;lz4&lt;/code&gt; is often used for actual data. The algorithm provides high compression and decompression rates at an acceptable compression ratio.&lt;/li&gt;\n&lt;li&gt;When you need maximum compression and long runtime is acceptable, &lt;code&gt;brotli_8&lt;/code&gt; is often used.&lt;/li&gt;\n&lt;li&gt;For operations consisting of a small number of jobs, for example, &lt;code&gt;final sort&lt;/code&gt; or &lt;code&gt;sorted merge&lt;/code&gt;, we recommend adding a separate processing stage — data compression in a merge operation with a large number of jobs.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;While strong compression algorithms (&lt;code&gt;zlib&lt;/code&gt;, &lt;code&gt;zstd&lt;/code&gt;, &lt;code&gt;brotli&lt;/code&gt;) save disk space, they compress data significantly slower than the default algorithm (&lt;code&gt;lz4&lt;/code&gt;). Using algorithms with substantial compression can lead to a significant increase in operation execution time. We recommend using them only for tables that take up a lot of space but rarely change.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"benchmarks\"&gt;&lt;a href=\"en/user-guide/storage/compression.html#benchmarks\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Comparing compression algorithms&lt;/span&gt;&lt;/a&gt;Comparing compression algorithms&lt;/h2&gt;\n&lt;p&gt;The following method applies only to static tables.&lt;/p&gt;\n&lt;p&gt;To determine which algorithm is best for a particular table, run &lt;code&gt;yt run-compression-benchmarks TABLE&lt;/code&gt;. A sample that is 1 GB by default will be taken from the table. It will be compressed by all algorithms.&lt;/p&gt;\n&lt;p&gt;After the operation is complete, you will see &lt;code&gt;codec/cpu/encode&lt;/code&gt;, &lt;code&gt;codec/cpu/decode&lt;/code&gt;, and &lt;code&gt;compression_ratio&lt;/code&gt; for each algorithm. For more information, see &lt;a href=\"user-guide/problems/jobstatistics.html#system_stats\"&gt;Job stats&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;For algorithms with multiple compression levels, the minimum, medium, and maximum levels are used by default.&lt;br /&gt;\nTo obtain results for all levels, use the &lt;code&gt;--all-codecs&lt;/code&gt; option.&lt;/p&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt run-compression-benchmarks //home/dev/tutorial/compression_benchmark_data\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"287\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-287\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-287\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-287.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;[\n    {\n        &lt;span class=\"hljs-string\"&gt;\"codec\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"brotli_1\"&lt;/span&gt;,\n        &lt;span class=\"hljs-string\"&gt;\"codec/cpu/decode\"&lt;/span&gt;: 2103,\n        &lt;span class=\"hljs-string\"&gt;\"codec/cpu/encode\"&lt;/span&gt;: 2123,\n        &lt;span class=\"hljs-string\"&gt;\"compression_ratio\"&lt;/span&gt;: 0.10099302059669339\n    },\n    ...\n    {\n        &lt;span class=\"hljs-string\"&gt;\"codec\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"brotli_11\"&lt;/span&gt;,\n        &lt;span class=\"hljs-string\"&gt;\"codec/cpu/decode\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"Not launched\"&lt;/span&gt;,\n        &lt;span class=\"hljs-string\"&gt;\"codec/cpu/encode\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"Timed out\"&lt;/span&gt;, &lt;span class=\"hljs-comment\"&gt;# compression did not finish within a standard --time-limit-sec (200)&lt;/span&gt;\n        &lt;span class=\"hljs-string\"&gt;\"compression_ratio\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"Timed out\"&lt;/span&gt;\n    },\n    ...\n    {\n        &lt;span class=\"hljs-string\"&gt;\"codec\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"none\"&lt;/span&gt;,\n        &lt;span class=\"hljs-string\"&gt;\"codec/cpu/decode\"&lt;/span&gt;: 0,\n        &lt;span class=\"hljs-string\"&gt;\"codec/cpu/encode\"&lt;/span&gt;: 247,\n        &lt;span class=\"hljs-string\"&gt;\"compression_ratio\"&lt;/span&gt;: 1.0\n    },\n    ...\n    {\n        &lt;span class=\"hljs-string\"&gt;\"codec\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"zstd_11\"&lt;/span&gt;,\n        &lt;span class=\"hljs-string\"&gt;\"codec/cpu/decode\"&lt;/span&gt;: 713,\n        &lt;span class=\"hljs-string\"&gt;\"codec/cpu/encode\"&lt;/span&gt;: 15283,\n        &lt;span class=\"hljs-string\"&gt;\"compression_ratio\"&lt;/span&gt;: 0.07451278201257201\n    },\n    ...\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"288\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-288\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-288\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-288.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/storage/compression.md","sourcePath":"en/user-guide/storage/compression.md"},"headings":[{"title":"Viewing a compression algorithm","href":"en/user-guide/storage/compression.html#get_compression","level":2},{"title":"Changing a compression algorithm","href":"en/user-guide/storage/compression.html#set_compression","level":2},{"title":"Supported compression algorithms","href":"en/user-guide/storage/compression.html#compression_codecs","level":2},{"title":"Best practices","href":"en/user-guide/storage/compression.html#best_practice","level":2},{"title":"Comparing compression algorithms","href":"en/user-guide/storage/compression.html#benchmarks","level":2}],"title":"Compression"},"router":{"pathname":"en/user-guide/storage/compression","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
