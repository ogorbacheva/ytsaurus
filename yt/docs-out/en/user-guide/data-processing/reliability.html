        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"fault-tolerance\"&gt;&lt;a href=\"en/user-guide/data-processing/reliability.html#fault-tolerance\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fault tolerance&lt;/span&gt;&lt;/a&gt;Fault tolerance&lt;/h2&gt;\n&lt;p&gt;This article describes how the data processing system handles failure of individual cluster nodes and what guarantees are provided to YTsaurus cluster users.&lt;/p&gt;\n&lt;p&gt;In terms of fault tolerance, the data processing system pursues the following objectives:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Ensure availability and reliability.&lt;/li&gt;\n&lt;li&gt;Preserve the progress of already completed jobs for running operations.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"availability\"&gt;&lt;a href=\"en/user-guide/data-processing/reliability.html#availability\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Availability&lt;/span&gt;&lt;/a&gt;Availability&lt;/h3&gt;\n&lt;p&gt;The availability of the data processing system is directly connected with liveness of the scheduler.&lt;/p&gt;\n&lt;p&gt;Within the cluster, the scheduler is represented as several independent processes, which are typically executed on different nodes. Each process constantly tries to acquire a lock on the &lt;code&gt;//sys/scheduler/lock&lt;/code&gt; node in Cypress until it succeeds. The succeeding process fetches meta information about current operations from Cypress, recovers its state, and becomes &lt;strong&gt;active&lt;/strong&gt;. This means that it begins to handle user requests related to operations, process heartbeats from exec nodes, etc.&lt;/p&gt;\n&lt;p&gt;If, for whatever reason, there is no active scheduler, the system can't schedule new jobs, make new allocations, or run new operations on the cluster. Essentially, the data processing system is unavailable.&lt;/p&gt;\n&lt;p&gt;If the active scheduler fails, it takes some time for another process to acquire the lock and become active. This usually takes tens of seconds, the duration of such downtime depends on the following parameters:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The frequency of attempts to acquire the lock by the scheduler process.&lt;/li&gt;\n&lt;li&gt;The timeout of the transaction which is used for the lock acquiring.&lt;/li&gt;\n&lt;li&gt;The size of meta information about current operations. This value becomes significant if the cluster has thousands of running operations simultaneously, as it takes considerable time to fetch all of them from Cypress and recover the scheduler state.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Usually users don't notice these periods of unavailability, since it is handled by retries in the YTsaurus SDKs.&lt;/p&gt;\n&lt;h3 id=\"reliability\"&gt;&lt;a href=\"en/user-guide/data-processing/reliability.html#reliability\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reliability&lt;/span&gt;&lt;/a&gt;Reliability&lt;/h3&gt;\n&lt;p&gt;Remind that computations on the cluster are represented by operations. To be reliable, the data processing system must guarantee that running operations won't be lost or fail in case of failure of any data processing component in the cluster.&lt;/p&gt;\n&lt;p&gt;The system guarantees that if the scheduler or any other component fails, all operations will be recovered and continue running. However, part of a running operation's progress may still be lost.&lt;/p&gt;\n&lt;p&gt;The reliability of operations is ensured by Cypress, which safely stores meta information of current operations. When an operation is started, the system additionally creates transactions and acquires proper locks on input and output tables and files. This allows the operation to continue execution even if the input tables are removed or if the active scheduler has changed and operation revival happened.&lt;/p&gt;\n&lt;p&gt;Note that these transactions have a timeout, which is typically a few hours. If the scheduler remains unavailable for a longer period then the new incarnation will attempt to restart operations from scratch. However, it may not have the necessary input or output tables or files. In this case, the operation aborts with an error.&lt;/p&gt;\n&lt;h3 id=\"preserving-computation-progress\"&gt;&lt;a href=\"en/user-guide/data-processing/reliability.html#preserving-computation-progress\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Preserving computation progress&lt;/span&gt;&lt;/a&gt;Preserving computation progress&lt;/h3&gt;\n&lt;p&gt;Unlike with real-time cluster components, the execution of a single operation takes a significant amount of time: from minutes to days depending on the size of processed data, the available computational quotas, and the code executed within the jobs. Because of this, the requirements for the availability of the data processing system are rather relaxed: delays of a few minutes, and in most even a few dozens of minutes, are not supposed to affect the SLOs of systems that run their computations on YTsaurus clusters.&lt;/p&gt;\n&lt;p&gt;To define exactly the guarantees for preserving the progress of computations, we first need to describe how the life cycle of operations and jobs is organized.&lt;/p&gt;\n&lt;p&gt;The state of an operation can be divided into 3 parts:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The operation's meta information: its specification, set of Cypress transactions, input/output tables and files that are locked to run the operation, various runtime settings, and the current &lt;a href=\"en/user-guide/data-processing/operations/overview#status\"&gt;operation state&lt;/a&gt;. The scheduler essentially implements a finite-state machine that handles each operation, and the operation state is a node within it.&lt;/li&gt;\n&lt;li&gt;The state of the operation controller. An operation controller is an object that resides within the controller agent process and is responsible for the operation's execution. The controller manages information about which jobs are currently running within the operation, which ones have finished, which data has already been processed and which hasn't. Overall, this object encapsulates all the data processing logic for the operation as well as its state.&lt;/li&gt;\n&lt;li&gt;A set of all currently running and some of the finished jobs on the cluster's exec nodes.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;The scheduler &lt;em&gt;synchronously&lt;/em&gt; writes the operation's meta information to the corresponding Cypress node, which resides in the &lt;code&gt;//sys/operations&lt;/code&gt; subtree. The operation controller consistently writes its state to Cypress as a binary file. This file is called a &lt;strong&gt;snapshot of the operation&lt;/strong&gt;. Each controller agent periodically generates snapshots of its current operations.&lt;/p&gt;\n&lt;p&gt;Active jobs within each operation periodically report their state to the operation controller via heartbeats from exec nodes. Each exec node sends heartbeats with information about all relevant jobs to each controller agent.&lt;/p&gt;\n&lt;p&gt;Let's consider the behavior of the data processing system in case of failures of individual components.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;If the failed component is a cluster's exec node, after a small timeout (typically 1–2 minutes), the controller agents and the scheduler notice that the node has stopped sending heartbeats and as a result consider all allocations and corresponding jobs to be lost. These computations will be re-scheduled on the other cluster nodes and logically these computations will be represented as new jobs instead of the lost ones.&lt;/li&gt;\n&lt;li&gt;If the failed component is a controller agent, the current state of the operation controllers that were running on that agent is lost. In this case, the scheduler detects that the controller agent is unavailable and re-assigns all of its assigned operations to other controller agents. When re-assigned to a new agent, the operation controller is recovered from the last saved snapshot. While handling heartbeats from exec nodes, recovered operation controller gradually updates its state with the actual state of the cluster.&lt;/li&gt;\n&lt;li&gt;If the failed component is the active scheduler, each controller agent detects this situation, resets the inner state and starts waiting for the new active scheduler. The new scheduler reads the current meta information about operations, then re-distributes these operations across controller agents and starts handling user requests and node heartbeats. In this case, the operations are recovered from the latest snapshots written to Cypress.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The process of recovering operations from a snapshot is called &lt;em&gt;reviving&lt;/em&gt;. Note that if there's no snapshot, the operation is still revived but starts from scratch.&lt;/p&gt;\n&lt;p&gt;Importantly, nodes also store information about completed jobs to report them to the controller if the operation needs to be revived — this helps avoid losing these jobs' progress. Let's consider an example of a situation where loss of information about a completed job can be avoided.&lt;/p&gt;\n&lt;p&gt;Imagine there's a a job (&lt;code&gt;J&lt;/code&gt;) within an operation (&lt;code&gt;O&lt;/code&gt;) running on a node. The execution sequence can be as follows:&lt;/p&gt;\n&lt;table&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;strong&gt;Timestamp&lt;/strong&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;strong&gt;Event&lt;/strong&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;code&gt;X&lt;/code&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Job &lt;code&gt;J&lt;/code&gt; is running on the node. The controller agent captures a snapshot of operation &lt;code&gt;O&lt;/code&gt;. In this snapshot, the operation controller considers job &lt;code&gt;J&lt;/code&gt; to be in progress.&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;code&gt;X+1&lt;/code&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Job &lt;code&gt;J&lt;/code&gt; completes, and the operation controller processes the completion event.&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;code&gt;X+2&lt;/code&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Operation &lt;code&gt;O&lt;/code&gt; is revived (for example, after a restart of the controller agent). After recovery from the snapshot, the controller of operation &lt;code&gt;O&lt;/code&gt; assumes that job &lt;code&gt;J&lt;/code&gt; is still running.&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;code&gt;X+3&lt;/code&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;While handling a heartbeat from the node on which job &lt;code&gt;J&lt;/code&gt; was running, the operation controller notices that it isn't presented among currently running jobs.&lt;/p&gt;\n&lt;p&gt;This prompts it to request information about all previously completed jobs from the node. In the next heartbeat, the node informs the controller that job &lt;code&gt;J&lt;/code&gt; has completed. The controller processes this event and doesn't start a new job.&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;For more information about the revival mechanism, see this &lt;a href=\"en/other/video-posts.html#2019-map-reduce-operaciya-dlinoyu-v-god\"&gt;report&lt;/a&gt;. It should be noted, however, that this mechanism has undergone a number of changes since the report's publication.&lt;/p&gt;\n&lt;p&gt;In summary:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;If the scheduler or one of the controller agents fails, it takes a few minutes to recover the state. In this case, some of the progress since the last saved operation snapshot is lost.&lt;/li&gt;\n&lt;li&gt;If an exec node fails, progress is lost for all jobs that were running on that node.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"consistency-of-scheduler-and-controller-agent-states\"&gt;&lt;a href=\"en/user-guide/data-processing/reliability.html#consistency-of-scheduler-and-controller-agent-states\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Consistency of scheduler and controller agent states&lt;/span&gt;&lt;/a&gt;Consistency of scheduler and controller agent states&lt;/h4&gt;\n&lt;p&gt;The communication protocol between the scheduler and controller agents is fairly complex and extensive. It's important to understand how the system ensures consistency of their states and actions in the event of individual component failure or loss of network connectivity.&lt;/p&gt;\n&lt;p&gt;This consistency is primarily achieved by &lt;em&gt;coupling&lt;/em&gt; the controller agents with the active scheduler. Below is a detailed explanation of how the scheduler and agents become active and what this &lt;em&gt;coupling&lt;/em&gt; means.&lt;/p&gt;\n&lt;p&gt;Let's recall how the active scheduler is selected. Each scheduler process constantly creates a transaction and tries to acquire an exclusive lock on a Cypress node within that transaction. The scheduler that succeeds becomes active. It reads meta information about all operations from Cypress and recovers their state.&lt;/p&gt;\n&lt;p&gt;Controller agents operate as follows:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;First, an agent establishes a connection with the scheduler and receives the transaction in which the scheduler became active.&lt;/li&gt;\n&lt;li&gt;Then, the agent creates its own transaction, which is nested within the scheduler transaction, and attempts to acquire a lock on the &lt;code&gt;//sys/controller_agents/instances/&amp;lt;instance_address&amp;gt;/lock&lt;/code&gt; node. Typically, the agent doesn't have to compete with other processes to acquire the lock, but it may conflict with its previous incarnation.&lt;/li&gt;\n&lt;li&gt;When the agent succeeds in acquiring the lock, it also becomes &lt;em&gt;active&lt;/em&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Once the agent has become active, the scheduler starts assigning it operations, and the agent schedules the jobs for these operations.&lt;/p&gt;\n&lt;p&gt;The agent transaction serves several functions:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;It allows the scheduler to manage the agent and ensures that the agent is coupled with the currently active scheduler. With this transaction, the scheduler can disconnect the controller agent in various scenarios, such as loss of network connectivity or receiving outdated messages. To do this, it simply needs to abort this agent's transaction. In addition, if the scheduler transaction is aborted, all associated agent transactions are aborted as well.&lt;/li&gt;\n&lt;li&gt;It's used by the agent as a prerequisite for its interactions with Cypress. This ensures that the operation state in Cypress can be changed exclusively by the agent to which this operation is assigned.&lt;/li&gt;\n&lt;li&gt;It's used as a session ID for communication with the scheduler. Specifically, agent transaction is passed within each message from agent to scheduler. If the scheduler starts processing a message and detects that the current agent transaction differs from the one in the message, this means that the message came from a previous incarnation and should be ignored.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;All of this ensures that an operation is handled by only one controller agent at any given time.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/reliability.md","sourcePath":"en/user-guide/data-processing/reliability.md"},"headings":[{"title":"Fault tolerance","href":"en/user-guide/data-processing/reliability.html#fault-tolerance","level":2,"items":[{"title":"Availability","href":"en/user-guide/data-processing/reliability.html#availability","level":3},{"title":"Reliability","href":"en/user-guide/data-processing/reliability.html#reliability","level":3},{"title":"Preserving computation progress","href":"en/user-guide/data-processing/reliability.html#preserving-computation-progress","level":3,"items":[{"title":"Consistency of scheduler and controller agent states","href":"en/user-guide/data-processing/reliability.html#consistency-of-scheduler-and-controller-agent-states","level":4}]}]}],"title":""},"router":{"pathname":"en/user-guide/data-processing/reliability","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
