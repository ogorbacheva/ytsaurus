            {"data":{"leading":false,"html":"&lt;p&gt;There is a pool tree, where the internal nodes are pools and the leaves are operations.&lt;/p&gt;\n&lt;p&gt;Each operation in the pool tree has usage and demand — resource vectors that specify the current resource consumption of the operation and the maximum possible resource consumption. These characteristics (usage and demand) are naturally summed across the tree, making it possible to refer to usage and demand of the internal nodes of the tree. In addition, a resource vector can be turned into a non-negative number by taking the ratio of the dominant vector resource to the total amount of that resource on the cluster. This makes it possible to look at the usage ratio and demand ratio in each node of the tree.&lt;/p&gt;\n&lt;p&gt;When calculating the fair share ratio for all nodes of the tree, a procedure is performed recursively to divide the fair share in a given node among its children. In the root, the division starts with a fair share equal to one.&lt;/p&gt;\n&lt;p&gt;When distributing the fair share to the children, the following task is solved: Let &lt;code&gt;F&lt;/code&gt; be the fair share value to be distributed to the children: &lt;code&gt;c_1, c_2, ... c_n&lt;/code&gt;. The weight of the children is marked as &lt;code&gt;w_1, w_2, ... w_n&lt;/code&gt; . The children also have an upper fair share limit denoted as &lt;code&gt;u_i&lt;/code&gt;. This limit is calculated based on the demand, resource granularity, set resource limits, and so on. The lower fair share limit is denoted as &lt;code&gt;l_i&lt;/code&gt; (set by the min share ratio). The algorithm that divides the fair share searches for an &lt;code&gt;x&lt;/code&gt; to execute:&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/fair_share_formula.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;p&gt;If the total &lt;code&gt;min share ratio&lt;/code&gt; of the children in the pool is greater than one, it is normalized to 1. In general, &lt;code&gt;min share ratio&lt;/code&gt; is a complicated characteristic and we do not recommend setting it for nested pools. Otherwise, the task described above would have no solution.&lt;/p&gt;\n&lt;p&gt;A few examples of calculating the fair share ratio:&lt;/p&gt;\n&lt;p&gt;Let there be two pools in the root: &lt;code&gt;A&lt;/code&gt; and &lt;code&gt;B&lt;/code&gt;. The min share ratio of the &lt;code&gt;A&lt;/code&gt; pool is 0.6 and the min share ratio of the &lt;code&gt;B&lt;/code&gt; pool is 0.2. Let large operations with a very high demand run in both pools.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The weight of both pools is one. In this case, after calculating the fair share, the fair share ratio of the &lt;code&gt;A&lt;/code&gt; pool is 0.6 and the fair share ratio of the &lt;code&gt;B&lt;/code&gt; pool is 0.4.&lt;/li&gt;\n&lt;li&gt;The weight of the &lt;code&gt;A&lt;/code&gt; pool is three and the weight of the &lt;code&gt;B&lt;/code&gt; pool is one. Then the fair share ratio of the &lt;code&gt;A&lt;/code&gt; pool is 0.75 and the fair share ratio of the &lt;code&gt;B&lt;/code&gt; pool is 0.25.&lt;/li&gt;\n&lt;li&gt;The weight of both pools is one. Suppose that in addition to &lt;code&gt;A&lt;/code&gt; and &lt;code&gt;B&lt;/code&gt; pools there is a &lt;code&gt;C&lt;/code&gt; pool that has no min share ratio and has a weight of 1. Then the fair share ratio of the &lt;code&gt;A&lt;/code&gt; pool is 0.6, the fair share ratio of the &lt;code&gt;B&lt;/code&gt; pool is 0.2, and the fair share ratio of the &lt;code&gt;C&lt;/code&gt; pool is also 0.2.&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/scheduler/fair-share.md","sourcePath":"en/user-guide/data-processing/scheduler/fair-share.md"},"headings":[],"title":"How the fair share ratio is calculated"},"router":{"pathname":"en/user-guide/data-processing/scheduler/fair-share","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
