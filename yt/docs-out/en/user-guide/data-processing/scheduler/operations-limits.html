        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"limits-on-the-number-of-operations\"&gt;&lt;a href=\"en/user-guide/data-processing/scheduler/operations-limits.html#limits-on-the-number-of-operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Limits on the number of operations&lt;/span&gt;&lt;/a&gt;Limits on the number of operations&lt;/h2&gt;\n&lt;p&gt;YTsaurus has limits on the number of operations running in compute pools. These limits serve as a protective mechanism that controls the load on the scheduler. There are two types of limits on the number of operations:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;total_operation_count&lt;/code&gt; limits the total number of operations. This reduces the load from maintaining the state of the pool tree and performing periodic recalculations of the fair share.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;running_operation_count&lt;/code&gt; limits the number of running operations. This reduces the load from scheduling new allocations.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If a pool has reached its limit on the total number of operations, attempting to run the &lt;code&gt;start_operation&lt;/code&gt; command will result in an error. If an operation starts successfully, but the pool has already reached its maximum number of running operations, the operation enters the &lt;code&gt;pending&lt;/code&gt; state, gets queued, and waits for the currently running operations to complete. In the pool hierarchy, operations count toward the limits of all their ancestor pools. The described rules apply if at least one ancestor pool reaches its limit. Generally, limits from different pools are independent of each other. There may be cases where the combined limits of all child pools exceed the limit of the parent pool.&lt;/p&gt;\n&lt;h3 id=\"lightweight-operations\"&gt;&lt;a href=\"en/user-guide/data-processing/scheduler/operations-limits.html#lightweight-operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Lightweight operations&lt;/span&gt;&lt;/a&gt;Lightweight operations&lt;/h3&gt;\n&lt;p&gt;The bulk of the scheduler's load comes from processing exec node heartbeats and scheduling new allocations. This load directly depends on the number of operations currently involved in the scheduling process. These are called &lt;code&gt;schedulable&lt;/code&gt; operations. For example, a running operation may be non-&lt;code&gt;schedulable&lt;/code&gt; if it already has all the necessary allocations. Since the &lt;code&gt;schedulable&lt;/code&gt; status can change while an operation is in progress, it's difficult to enforce a limit on the number of such operations. For this reason, the system manages the load by implementing a conservative restriction on the number of currently running operations.&lt;/p&gt;\n&lt;p&gt;Some operations may be non-&lt;code&gt;schedulable&lt;/code&gt; for much of their duration. For example, an operation may consist of a single small job that requires minimal time for the scheduler to initiate. In this scenario, the operation continues to count toward the limit on running operations, which can be a valuable resource in large YTsaurus installations. To address cases like this, the service supports a special type of operations called &lt;em&gt;lightweight operations&lt;/em&gt;. These operations don't count toward the &lt;code&gt;running_operation_count&lt;/code&gt;, meaning the limit on the number of running operations doesn't apply to them. However, lightweight operations still count toward the &lt;code&gt;total_operation_count&lt;/code&gt; and the special &lt;code&gt;lightweight_running_operation_count&lt;/code&gt; counter, which doesn't have a limit.&lt;/p&gt;\n&lt;p&gt;For an operation to be considered lightweight, it must meet several conditions:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The operation must be of the &lt;a href=\"user-guide/data-processing/operations/vanilla.html\"&gt;Vanilla&lt;/a&gt; type.&lt;/li&gt;\n&lt;li&gt;The pool where the operation is running must be configured in &lt;code&gt;FIFO&lt;/code&gt; mode.&lt;/li&gt;\n&lt;li&gt;The pool must allow lightweight operations. This is controlled by the &lt;code&gt;enable_lightweight_operations&lt;/code&gt; setting, which can be set by the YTsaurus cluster administrator.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"recommendations-for-use\"&gt;&lt;a href=\"en/user-guide/data-processing/scheduler/operations-limits.html#recommendations-for-use\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Recommendations for use&lt;/span&gt;&lt;/a&gt;Recommendations for use&lt;/h4&gt;\n&lt;p&gt;You may run non-lightweight operations in a pool that has lightweight operations enabled. These operations count toward the &lt;code&gt;running_operation_count&lt;/code&gt; and are subject to the associated limit. However, mixing operations of different types is an anti-pattern and is strongly discouraged.&lt;/p&gt;\n&lt;p&gt;The scheduler algorithm implements special logic to count lightweight operations and expects their jobs to start successfully within a short timeframe. For this reason, we don't recommend abusing this feature by running heavy &lt;code&gt;Vanilla&lt;/code&gt; operations that consist of more than one job in lightweight pools. While these operations are technically considered lightweight, their launch time may be longer than usual.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/scheduler/operations-limits.md","sourcePath":"en/user-guide/data-processing/scheduler/operations-limits.md"},"headings":[{"title":"Limits on the number of operations","href":"en/user-guide/data-processing/scheduler/operations-limits.html#limits-on-the-number-of-operations","level":2,"items":[{"title":"Lightweight operations","href":"en/user-guide/data-processing/scheduler/operations-limits.html#lightweight-operations","level":3,"items":[{"title":"Recommendations for use","href":"en/user-guide/data-processing/scheduler/operations-limits.html#recommendations-for-use","level":4}]}]}],"title":""},"router":{"pathname":"en/user-guide/data-processing/scheduler/operations-limits","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
