        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section explains how to create pools and manage resources and settings of compute pools in the YTsaurus system using the CLI and web interface as examples.&lt;/p&gt;\n&lt;h2 id=\"common\"&gt;&lt;a href=\"en/user-guide/data-processing/scheduler/manage-pools.html#common\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General information&lt;/span&gt;&lt;/a&gt;General information&lt;/h2&gt;\n&lt;p&gt;The YTsaurus system has a feature that manages compute pools and supports pool activities such as:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Creating.&lt;/li&gt;\n&lt;li&gt;Renaming.&lt;/li&gt;\n&lt;li&gt;Moving.&lt;/li&gt;\n&lt;li&gt;Deleting.&lt;/li&gt;\n&lt;li&gt;Changing settings.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;You can change the compute pool settings by editing the relevant pool attributes. Attributes that can be edited by the user:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;weight&lt;/code&gt;: Manages the share of the parent pool's resources that will go to the current pool.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_operation_count&lt;/code&gt;: A limit on the number of running (&lt;code&gt;running&lt;/code&gt;) operations and operations in the queue (&lt;code&gt;pending&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_running_operation_count&lt;/code&gt;: A limit on the number of running (&lt;code&gt;running&lt;/code&gt;) operations.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;strong_guarantee_resources&lt;/code&gt;: A dict describing the pool's guaranteed resources.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;forbid_immediate_operations&lt;/code&gt;: Prohibits operations to be run directly in this pool.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;mode&lt;/code&gt;: A way of allocating resources between operations in the pool.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;fifo_sort_parameters&lt;/code&gt;: Managing the order in which operations are started in fifo pools.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;resource_limits&lt;/code&gt;: A dict that sets the upper limits for the resources available to the pool.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;create_ephemeral_subpools&lt;/code&gt;: Enables the creation of virtual pools.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ephemeral_subpool_config&lt;/code&gt;: A dict describing the configuration of virtual pools.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;integral-guarantees&lt;/code&gt;: Integral guarantees.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;For more information about the listed attributes, see &lt;a href=\"user-guide/data-processing/scheduler/pool-settings.html#pools\"&gt;Pool characteristics&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"validating\"&gt;&lt;a href=\"en/user-guide/data-processing/scheduler/manage-pools.html#validating\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Validating&lt;/span&gt;&lt;/a&gt;Validating&lt;/h3&gt;\n&lt;p&gt;When validating, YTsaurus checks attribute types, the &lt;code&gt;max_operation_count &amp;gt;= max_running_operation_count&lt;/code&gt; limit, the number of tags in the &lt;code&gt;allowed_profiling_tags&lt;/code&gt; list (no more than 200), consistency of resource guarantees, and whether there are subpools in fifo pools.&lt;/p&gt;\n&lt;p&gt;Consistency of resource guarantees means that for each resource, the sum of the descendants' guarantees must not exceed the parent's guarantee. If the subpool has a non-zero guarantee for a specific resource, it must also be set for the parent. The pool is allowed to have a non-zero guarantee on more than one resource.&lt;/p&gt;\n&lt;h2 id=\"cli\"&gt;&lt;a href=\"en/user-guide/data-processing/scheduler/manage-pools.html#cli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Managing pools via the CLI&lt;/span&gt;&lt;/a&gt;Managing pools via the CLI&lt;/h2&gt;\n&lt;p&gt;Creating a subpool:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt create scheduler_pool --attributes=&lt;span class=\"hljs-string\"&gt;'{pool_tree=default;name=project-subpool1;parent_name=project-root}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"114\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-114\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-114\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-114.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;In the attributes, you can additionally pass the pool attributes and they will be validated. If the validation fails, the object will not be created.&lt;/p&gt;\n&lt;p&gt;Example of a weight change for the created pool:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/pool_trees/default/project-root/project-subpool1/@weight 10\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"121\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-121\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-121\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-121.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Initial setting of a pool guarantee provided that the parent has an unallocated guarantee:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/pool_trees/default/project-root/project-subpool1/@strong_guarantee_resources &lt;span class=\"hljs-string\"&gt;'{cpu=50}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"125\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-125\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-125\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-125.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;A specific parameter can be changed to alter a set guarantee:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/pool_trees/default/project-root/project-subpool1/@strong_guarantee_resources/cpu 100\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"129\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-129\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-129\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-129.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Moving is performed in the standard way:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt move //sys/pool_trees/default/project-root/project-subpool1 //sys/pool_trees/default/new-project/new-subpool\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"133\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-133\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-133\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-133.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Renaming via moving is supported.&lt;br /&gt;\nValidation occurs when moving.&lt;/p&gt;\n&lt;p&gt;Attributes are set in the standard way:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/pool_trees/default/project_pool/@max_operation_count 10\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"140\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-140\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-140\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-140.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Validation occurs when setting attributes.&lt;/p&gt;\n&lt;h2 id=\"ui\"&gt;&lt;a href=\"en/user-guide/data-processing/scheduler/manage-pools.html#ui\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Managing pools via the web interface&lt;/span&gt;&lt;/a&gt;Managing pools via the web interface&lt;/h2&gt;\n&lt;p&gt;You can manage pools in the web interface in the &lt;code&gt;Scheduling&lt;/code&gt; section.&lt;/p&gt;\n&lt;p&gt;To create a subpool, go to the parent pool by clicking its name. To do this, click &lt;code&gt;Create pool&lt;/code&gt;, fill in all the required form fields, and click &lt;code&gt;Confirm&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;An example of a pool creation form is shown in the figure.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/manage_pool_01.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;To edit the pool settings, click the pencil on the pool name line on the right-hand side of the screen as shown in the figure.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/manage_pool_04.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;The pool settings available for editing are divided into groups. The figures show examples of general settings and guaranteed resources, respectively.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/manage_pool_02.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/manage_pool_03.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;In the &lt;code&gt;Resource Limits&lt;/code&gt; section, you can set an upper limit for the pool if, for example, you need the pool to remain within the 100-core consumption limit. By default, there is no upper limit for pools and the resources available to a pool are limited by the cluster capacity.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;Other Settings&lt;/code&gt; section provides additional settings, such as the prohibition to run operations in the pool.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Note that we recommend running operations precisely in the pool tree leaves, i.e. in those pools that have no subpools. In this case, it is useful to explicitly prohibit operations from running directly in this pool.&lt;/p&gt;\n&lt;p&gt;Operations must not be run in pool tree nodes (pools with subpools), otherwise it is more difficult to investigate various problems that occur when allocating resources between pools and operations.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/scheduler/manage-pools.md","sourcePath":"en/user-guide/data-processing/scheduler/manage-pools.md"},"headings":[{"title":"General information","href":"en/user-guide/data-processing/scheduler/manage-pools.html#common","level":2,"items":[{"title":"Validating","href":"en/user-guide/data-processing/scheduler/manage-pools.html#validating","level":3}]},{"title":"Managing pools via the CLI","href":"en/user-guide/data-processing/scheduler/manage-pools.html#cli","level":2},{"title":"Managing pools via the web interface","href":"en/user-guide/data-processing/scheduler/manage-pools.html#ui","level":2}],"title":"Managing compute pools"},"router":{"pathname":"en/user-guide/data-processing/scheduler/manage-pools","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
