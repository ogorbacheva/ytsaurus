            {"data":{"leading":false,"html":"&lt;p&gt;Memory is the RAM consumed by operation jobs.&lt;br /&gt;\nFor all operations, there is a default mechanism for selecting the actual memory reserve for the jobs to be run.&lt;/p&gt;\n&lt;p&gt;The operation controller collects memory consumption information for all successfully completed jobs. This information is saved as a special digest, based on which the actual memory reserve for the newly run jobs is selected.&lt;/p&gt;\n&lt;p&gt;The main aspects of the digest:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Collects actual values (typically in the range from 0.0 to 1.0) describing the share of &lt;code&gt;memory_limit&lt;/code&gt; consumed by the job.&lt;/li&gt;\n&lt;li&gt;Only successfully completed jobs and jobs that were aborted because they exceeded the memory reserve are counted.&lt;/li&gt;\n&lt;li&gt;For jobs that were aborted because they exceeded the reserve, a point with the memory consumption share of that job multiplied by a certain constant slightly above one (the default value is 1.1) is added to the digest.&lt;/li&gt;\n&lt;li&gt;The &lt;code&gt;memory_limit * percentile(digest, P)&lt;/code&gt; (by default, &lt;code&gt;P&lt;/code&gt; is 0.95) is taken as a reserve for the newly run job.&lt;/li&gt;\n&lt;li&gt;The digest does not store all points internally, but uses a data structure that allows an approximate calculation of percentiles.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;The memory reserve allocated to the job is used by the scheduler to consider consumption the lower limit. If the reserve value is exceeded and there is no free memory on the cluster node, the job may be aborted due to the &lt;code&gt;resource_overdraft&lt;/code&gt; reason. If there is extra free memory on the cluster node, the job may exceed its allocated reserve and be completed successfully. If the memory limit specified by the user in the operation specification is exceeded, the job will be aborted with the &lt;code&gt;Memory limit exceeded&lt;/code&gt; error.&lt;/p&gt;\n&lt;p&gt;Note that in addition to the user process, there is also a &lt;code&gt;job_proxy&lt;/code&gt; process, which is a layer between the user process and YTsaurus. Depending on different circumstances, job proxy can consume a significant amount of RAM for compression, columnar read/write mechanism, erasure, and other needs. The operation controller supports individual digests for the user process (&lt;code&gt;user_job&lt;/code&gt;) and the &lt;code&gt;job_proxy&lt;/code&gt; process. In the case of the &lt;code&gt;job_proxy&lt;/code&gt; process, the controller makes an assumption about the expected memory usage based on the number of input/output tables and their settings. Based on the assumption , the digest selects a reserve (ranging from 0.5 to 2.0 by default).&lt;/p&gt;\n&lt;p&gt;Besides that, the memory allocated to the user process has a lower limit. By default, it is indicated in the specification and equals 0.05. However, if a job orders &lt;code&gt;tmpfs&lt;/code&gt;, the memory reserve cannot be less than &lt;code&gt;tmpfs_size / memory_limit&lt;/code&gt;, i.e. the system tends not to allow overcommit on &lt;code&gt;tmpfs&lt;/code&gt;, because it can cause scheduler locking.&lt;/p&gt;\n&lt;h3 id=\"statistics\"&gt;&lt;a href=\"en/user-guide/data-processing/scheduler/memory-digest.html#statistics\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Statistics&lt;/span&gt;&lt;/a&gt;Statistics&lt;/h3&gt;\n&lt;p&gt;There are a number of values in the operation statistics that enable you to analyze the reserved memory:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;user_job/memory_reserve&lt;/code&gt; and &lt;code&gt;job_proxy/memory_reserve&lt;/code&gt; (bytes): The memory reserve allocated to the appropriate job process.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;user_job/max_memory&lt;/code&gt; and &lt;code&gt;job_proxy/max_memory&lt;/code&gt; (bytes): The memory consumed by the appropriate job process. Maximum during the operation of a particular job.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;job_proxy/estimated_memory&lt;/code&gt; (bytes) : The scheduler's evaluation of the &lt;code&gt;job_proxy&lt;/code&gt; process memory of a given job.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;user_job/memory_limit&lt;/code&gt; (bytes) : The job memory limit specified by the user.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;user_job/cumulative_memory_reserve&lt;/code&gt;, &lt;code&gt;job_proxy/cumulative_memory_reserve&lt;/code&gt;, &lt;code&gt;user_job/cumulative_max_memory&lt;/code&gt;, &lt;code&gt;job_proxy/cumulative_max_memory&lt;/code&gt;, &lt;code&gt;job_proxy/cumulative_estimated_memory&lt;/code&gt; (bytes * seconds): The appropriate cumulative metrics taking into account the job duration.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"digest-settings\"&gt;&lt;a href=\"en/user-guide/data-processing/scheduler/memory-digest.html#digest-settings\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Digest settings&lt;/span&gt;&lt;/a&gt;Digest settings&lt;/h3&gt;\n&lt;p&gt;The following options are available to the user in the operation specification:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;user_job_memory_digest_default_value&lt;/code&gt;: Initial assumption for selecting the memory reserve (the default value is 0.5).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;user_job_memory_digest_lower_bound&lt;/code&gt;: The limit below which the reserve must not fall (the default value is 0.05). We do not recommend changing the default value.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;memory_reserve_factor&lt;/code&gt;: The alias for the &lt;code&gt;user_job_memory_digest_lower_bound&lt;/code&gt; and &lt;code&gt;user_job_memory_digest_default_value&lt;/code&gt; options concurrently. Using this option is not recommended.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/scheduler/memory-digest.md","sourcePath":"en/user-guide/data-processing/scheduler/memory-digest.md"},"headings":[],"title":"Selecting memory for jobs"},"router":{"pathname":"en/user-guide/data-processing/scheduler/memory-digest","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
