        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section describes the characteristics and settings of pool trees, pools, and operations.&lt;/p&gt;\n&lt;h2 id=\"pool_trees\"&gt;&lt;a href=\"en/user-guide/data-processing/scheduler/pool-settings.html#pool_trees\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Pool tree characteristics&lt;/span&gt;&lt;/a&gt;Pool tree characteristics&lt;/h2&gt;\n&lt;p&gt;A pool tree has the following attributes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;nodes_filter&lt;/code&gt;: A filter for selecting cluster nodes that belong to the tree. For more information, see &lt;a href=\"admin-guide/node-tags.html\"&gt;Tagging cluster nodes&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_operation_count&lt;/code&gt;: The default value for the maximum number of concurrently started (running + pending) operations in the root pool.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_operation_count_per_pool&lt;/code&gt;: The default value for the maximum number of concurrently started operations in the pool. Can be overwritten by a setting on the pool.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_running_operation_count&lt;/code&gt;: The default value for the maximum number of concurrently running operations in the root pool.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_running_operation_count_per_pool&lt;/code&gt;: The default value for the maximum number of concurrently running operations in the pool. Can be overwritten by a setting on the pool.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;default_parent_pool&lt;/code&gt;: The default pool, in which operations that do not have a pool indicated in the specification will be started.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;enable_pool_starvation&lt;/code&gt;: Allow pool starvation. For more information, see &lt;a href=\"user-guide/data-processing/scheduler/preemption.html\"&gt;Preemption&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;forbid_immediate_operations_in_root&lt;/code&gt;: Allow operations to run in the root pool of the tree.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_ephemeral_pool_per_user&lt;/code&gt;: The maximum number of ephemeral pools for each user. An ephemeral pool is a pool that was indicated in the specification, but for which there is no explicit node in Cypress.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;fair_share_preemption_timeout&lt;/code&gt;: How long the operation can remain below its fair_share before the system initiates preemption to run its jobs.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;fair_share_starvation_tolerance&lt;/code&gt;: The tolerance used when comparing usage-ratio with fair_share: an operation is considered starving if &lt;code&gt;usage-ratio &amp;lt; fair_share * tolerance&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;non_preemptible_resource_usage_threshold&lt;/code&gt;: The operation will not be subject to preemption if its resource usage is less than this value.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The &lt;code&gt;fair_share_preemption_timeout&lt;/code&gt; and &lt;code&gt;fair_share_starvation_tolerance&lt;/code&gt; attributes can be redefined in the operation specification.&lt;/p&gt;\n&lt;p&gt;The tree is the &lt;code&gt;scheduler_pool_tree&lt;/code&gt; object at the first level of the &lt;code&gt;//sys/pool_trees&lt;/code&gt; directory in Cypress. The attributes listed above are the attributes of this object. The &lt;code&gt;//sys/pool_trees&lt;/code&gt; node has the &lt;code&gt;default_tree&lt;/code&gt; attribute in which the default tree can be specified. Will be used for operations that do not have the specified &lt;code&gt;pool_trees&lt;/code&gt; option.&lt;/p&gt;\n&lt;h2 id=\"pools\"&gt;&lt;a href=\"en/user-guide/data-processing/scheduler/pool-settings.html#pools\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Pool characteristics&lt;/span&gt;&lt;/a&gt;Pool characteristics&lt;/h2&gt;\n&lt;p&gt;Each pool has the following characteristics. The default values are specified in brackets.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;weight&lt;/code&gt; (1): A real non-negative number, which is responsible for the proportion in which the subtree should be provided with the resources of the parent pool. When a pool has two child pools with weights 2 and 1, the parent's resources will be divided between them in the 2:1 proportion.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;strong_guarantee_resources&lt;/code&gt;: A dict which lists the guaranteed resources of the given pool (&lt;code&gt;user_slots&lt;/code&gt;, &lt;code&gt;cpu&lt;/code&gt;, and &lt;code&gt;memory&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Note that guarantees will be fulfilled only if the dominant resource of the operation coincides with the guaranteed resource.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;resource_limits&lt;/code&gt;: A dict which describes the limits on different resources of the given pool (&lt;code&gt;user_slots&lt;/code&gt;, &lt;code&gt;cpu&lt;/code&gt;, and &lt;code&gt;memory&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;mode&lt;/code&gt; (fair_share): The scheduling mode that can take the &lt;code&gt;fair_share&lt;/code&gt; or &lt;code&gt;fifo&lt;/code&gt; values. With &lt;code&gt;fifo&lt;/code&gt; mode, jobs are issued to child operations in lexicographic sorting order according to the values of the parameters specified in the &lt;code&gt;fifo_sort_parameters&lt;/code&gt; attribute for that pool. For example, if the attribute value is &lt;code&gt;[start_time]&lt;/code&gt;, jobs will first be issued to the operations with the least start time.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_running_operation_count&lt;/code&gt; (8): The limit on the number of concurrently running operations in the pool. Operations above this limit will be queued up and pending.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_operation_count&lt;/code&gt; (50): The limit on the number of concurrently started (running + pending) operations in the pool. If the specified limit is reached, starting new operations in the pool will end with an error.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;fifo_sort_parameters&lt;/code&gt; (start_time): The order of starting operations in the FIFO pool. By default, operations are sorted first by weight, and then by start time. This parameter enables you to change the order of operations in the queue. Supported values: &lt;code&gt;start_time&lt;/code&gt; , &lt;code&gt;weight&lt;/code&gt;, and &lt;code&gt;pending_job_count&lt;/code&gt;. The &lt;code&gt;weight&lt;/code&gt; parameter is applied in reverse order: operations with more weight go first and have a higher priority. The &lt;code&gt;pending_job_count&lt;/code&gt; value enables you to prioritize small operations (with few jobs).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;forbid_immediate_operations&lt;/code&gt;: Prohibits the start of operations directly in the given pool; does not apply to starting operations in subpools.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;create_ephemeral_subpools&lt;/code&gt; (false): Activates the mode in which an ephemeral subpool is created for operations in the given pool with the &lt;code&gt;poolname$username&lt;/code&gt; name where &lt;code&gt;poolname&lt;/code&gt; is the name of the current pool. The operation is started in the created ephemeral subpool.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ephemeral_subpool_config&lt;/code&gt;: A nested configuration of ephemeral subpools created in the current pool. Makes sense only if the &lt;code&gt;create_ephemeral_subpools&lt;/code&gt; option is specified. You can specify the &lt;code&gt;mode&lt;/code&gt;, &lt;code&gt;max_running_operation_count&lt;/code&gt;, &lt;code&gt;max_operation_count&lt;/code&gt;, and &lt;code&gt;resource_limits&lt;/code&gt; in the configuration.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;offloading_settings&lt;/code&gt;: A setting responsible for offloading some of the pool jobs to another tree along with the tree where the pool resides. Job offloading works for operations started after the setting was specified. Example: &lt;code&gt;yt set //sys/pool_trees/&amp;lt;pool_tree&amp;gt;/&amp;lt;pool&amp;gt;/@offloading_settings '{&amp;lt;pool_tree_X&amp;gt;={pool=&amp;lt;pool_name_Y&amp;gt;}}'&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Each pool has its &lt;em&gt;unique&lt;/em&gt; (within a single tree) name. The name of the pool selected to start the operation is shown in the operation settings.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The &lt;code&gt;max_running_operation_count&lt;/code&gt; and &lt;code&gt;max_operation_count&lt;/code&gt; parameters are set (explicitly or implicitly) at all levels of the pool hierarchy and are also checked at all levels of the hierarchy. To be specific, starting a new operation in the P pool is possible if and only if both P and all of its parents (up to the root) have fewer started operations than a given limit. The same applies for the &lt;code&gt;max_running_operation_count&lt;/code&gt; limit: an operation in the P pool will remain in the pending state as long as the number of running operations in that pool or in any of its parents is larger than or equal to the &lt;code&gt;max_running_operation_count&lt;/code&gt; limit. Oversubscribing these limits is possible at each level of the hierarchy. This feature must be taken into account when ordering and changing user pool limits. In order to guarantee a certain number of operations to the pool, you need to make sure that there is no oversubscription at all levels up to the root.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"operations\"&gt;&lt;a href=\"en/user-guide/data-processing/scheduler/pool-settings.html#operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Operations&lt;/span&gt;&lt;/a&gt;Operations&lt;/h3&gt;\n&lt;p&gt;Some of the settings inherent to the pool are also available for operations and are specified in the operation specification root at start-up. These settings include: &lt;code&gt;weight&lt;/code&gt; and &lt;code&gt;resource_limits&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;For example, you can specify &lt;code&gt;resource_limits={user_slots=200}&lt;/code&gt; in the specification. In this case, the operation will not run more than 200 jobs concurrently in each tree.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;resource_limits&lt;/code&gt; and other settings can be specified independently for different pool trees.&lt;/p&gt;\n&lt;h2 id=\"dynamic-characteristics-of-operations-and-pools\"&gt;&lt;a href=\"en/user-guide/data-processing/scheduler/pool-settings.html#dynamic-characteristics-of-operations-and-pools\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dynamic characteristics of operations and pools&lt;/span&gt;&lt;/a&gt;Dynamic characteristics of operations and pools&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Fair share ratio&lt;/code&gt; is a share of cluster resources that is guaranteed for the given operation (pool) at the moment. The fair share sum of all operations does not exceed one.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Guaranteed ratio&lt;/code&gt; is a share of cluster resources that is guaranteed for the operation (pool) at the maximum cluster load.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Usage ratio&lt;/code&gt; is a share of cluster resources currently consumed by the operation or pool: all the running operation or pool jobs. The usage ratio sum of all operations can be larger than one, since operations can consume different resources, while the share is calculated by the dominant resource.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Starving&lt;/code&gt; is a flag indicating whether the operation is starving. If there is a starving operation, the scheduler will attempt to abort the jobs of non-starving operations by performing preemption to start the jobs of that operation.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Demand ratio&lt;/code&gt; is a characteristic that shows the share of all cluster resources that an operation or pool needs to complete computation.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Dominant resource&lt;/code&gt; is the dominant resource of an operation or pool - the resource whose share in the resources of the entire cluster is the largest.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Dynamic characteristics of operations are calculated for each tree separately. Consequently, an operation can have several &lt;code&gt;usage_share&lt;/code&gt; values and so on.&lt;/p&gt;\n&lt;p&gt;The amount of resources that an operation needs to be executed is calculated by summing up the needs of all the operation jobs by each resource type.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/scheduler/pool-settings.md","sourcePath":"en/user-guide/data-processing/scheduler/pool-settings.md"},"headings":[{"title":"Pool tree characteristics","href":"en/user-guide/data-processing/scheduler/pool-settings.html#pool_trees","level":2},{"title":"Pool characteristics","href":"en/user-guide/data-processing/scheduler/pool-settings.html#pools","level":2,"items":[{"title":"Operations","href":"en/user-guide/data-processing/scheduler/pool-settings.html#operations","level":3}]},{"title":"Dynamic characteristics of operations and pools","href":"en/user-guide/data-processing/scheduler/pool-settings.html#dynamic-characteristics-of-operations-and-pools","level":2}],"title":"Pool characteristics"},"router":{"pathname":"en/user-guide/data-processing/scheduler/pool-settings","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
