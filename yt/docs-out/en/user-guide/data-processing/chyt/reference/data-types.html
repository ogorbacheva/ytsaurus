        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;ClickHouse has a wide variety of &lt;a href=\"https://clickhouse.com/docs/en/sql-reference/data-types\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;data types&lt;/a&gt; available. YTsaurus uses its own data type system. Although the ClickHouse data type system largely overlaps that of YTsaurus, some data types from YTsaurus may not exist in ClickHouse, and vice versa. For a complete list of the types supported in the YTsaurus system, see &lt;a href=\"user-guide/storage/data-types.html\"&gt;YTsaurus data types&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"primitive-data-types\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/data-types.html#primitive-data-types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Primitive data types&lt;/span&gt;&lt;/a&gt;Primitive data types&lt;/h2&gt;\n&lt;p&gt;The table below shows the correspondence between the &lt;strong&gt;primitive&lt;/strong&gt; (not composite) ClickHouse and YTsaurus types.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;YTsaurus type&lt;/th&gt;\n&lt;th&gt;ClickHouse type&lt;/th&gt;\n&lt;th&gt;Comment&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;intN, uintN&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;intN, uintN&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Integer numeric columns from the ClickHouse point look like (U)Int of the appropriate digit capacity.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;boolean&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;YtBoolean&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;There are no Booleans in regular ClickHouse, they are represented as single-byte unsigned numbers (&lt;code&gt;UInt8&lt;/code&gt;) with values 0 and 1. CHYT supports the additional &lt;code&gt;YtBoolean&lt;/code&gt; type that is similar to the &lt;code&gt;UInt8&lt;/code&gt; type in ClickHouse computations, but is interpreted as a &lt;code&gt;boolean&lt;/code&gt; when written to a YTsaurus table.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;string, utf8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;String&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Strings are available as string&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;double&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Float64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;date&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Date&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;datetime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;DateTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;any&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;String&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Any columns are read by the ClickHouse engine as string columns containing data in YSON. See also: &lt;a href=\"user-guide/data-processing/chyt/reference/settings.html\"&gt;&lt;code&gt;chyt.composite.default_yson_format&lt;/code&gt;&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;T&lt;/code&gt; with &lt;code&gt;required = %false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Nullable(T)&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;If a column of a &lt;code&gt;T&lt;/code&gt; type is not &lt;code&gt;required&lt;/code&gt;, it is seen as a Nullable column.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"composite-data-types\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/data-types.html#composite-data-types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Composite data types&lt;/span&gt;&lt;/a&gt;Composite data types&lt;/h2&gt;\n&lt;p&gt;Useful links:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/objects.html\"&gt;YTsaurus type system&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;In YTsaurus, the following composite data types are available: lists, dicts, optional types, structures, and tuples. By default, composite values are seen by the CH engine in the same way as the &lt;code&gt;Any&lt;/code&gt; type, i.e. as a YSON string.&lt;/p&gt;\n&lt;p&gt;If you configure the &lt;code&gt;chyt.composite.enable_conversion&lt;/code&gt; setting to 1, CHYT starts converting composite types (specified in the schema, that is, having the &lt;code&gt;type_v3&lt;/code&gt; type) into the corresponding ClickHouse composite types.&lt;/p&gt;\n&lt;p&gt;Query example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# A query with no composite type conversion enabled. Composite types&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# are seen as strings in binary YSON.&lt;/span&gt;\nyt --proxy &amp;lt;cluster_name&amp;gt; clickhouse execute &lt;span class=\"hljs-string\"&gt;'select * from `//home/user/sample_table_composite`'&lt;/span&gt; --format Vertical\nRow 1:\n──────\nlist:   [foo;bar;]\ndict:   [(binary unreadable characters)]\nstruct: [(binary unreadable characters)]\n\nRow 2:\n──────\nlist:   []\ndict:   []\nstruct: [(binary unreadable characters)]\n\n&lt;span class=\"hljs-comment\"&gt;# A query with enabled conversion.&lt;/span&gt;\nyt --proxy &amp;lt;cluster_name&amp;gt; clickhouse execute &lt;span class=\"hljs-string\"&gt;'select * from `//home/user/sample_table_composite`'&lt;/span&gt; --format Vertical --setting chyt.composite.enable_conversion=1 --format Vertical\nRow 1:\n──────\nlist:   [&lt;span class=\"hljs-string\"&gt;'foo'&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;'bar'&lt;/span&gt;]\ndict:   [(&lt;span class=\"hljs-string\"&gt;'key1'&lt;/span&gt;,42),(&lt;span class=\"hljs-string\"&gt;'key2'&lt;/span&gt;,-17)]\nstruct: (3.14,&lt;span class=\"hljs-string\"&gt;'pi'&lt;/span&gt;)\n\nRow 2:\n──────\nlist:   []\ndict:   []\nstruct: (0,&lt;span class=\"hljs-string\"&gt;''&lt;/span&gt;)\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"136\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-136\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-136\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-136.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Unfortunately, the ClickHouse and YTsaurus type systems are quite different as far as composite data types are concerned. Below are the main differences.&lt;/p&gt;\n&lt;h3 id=\"optional\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/data-types.html#optional\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Optional types&lt;/span&gt;&lt;/a&gt;Optional types&lt;/h3&gt;\n&lt;p&gt;In the YTsaurus type system, any type &lt;code&gt;T&lt;/code&gt; can be made optional by surrounding it with &lt;code&gt;optional&amp;lt;T&amp;gt;&lt;/code&gt;, for example, &lt;code&gt;optional&amp;lt;optional&amp;lt;int64&amp;gt;&amp;gt;&lt;/code&gt;, &lt;code&gt;optional&amp;lt;list&amp;lt;string&amp;gt;&amp;gt;&lt;/code&gt;, and &lt;code&gt;optional&amp;lt;tuple&amp;lt;int64, string&amp;gt;&amp;gt;&lt;/code&gt; data types are possible.&lt;/p&gt;\n&lt;p&gt;In ClickHouse, placing values into &lt;code&gt;Nullable&lt;/code&gt; is very limited. In particular, you cannot place into &lt;code&gt;Nullable&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The type that is already &lt;code&gt;Nullable&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Array&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Tuple&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Thus, none of the three examples of types above have their own representation in the ClickHouse type system.&lt;/p&gt;\n&lt;p&gt;To process such types in CHYT, the following conversion is used.&lt;/p&gt;\n&lt;p&gt;If type &lt;code&gt;T&lt;/code&gt; corresponds to type &lt;code&gt;T'&lt;/code&gt; of the ClickHouse type system and type &lt;code&gt;Nullable(T')&lt;/code&gt; does not exist in CH, &lt;code&gt;optional&amp;lt;T&amp;gt;&lt;/code&gt; is mapped to &lt;code&gt;T'&lt;/code&gt; replacing null with the default value for &lt;code&gt;T'&lt;/code&gt;. Examples:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;optional&amp;lt;optional&amp;lt;int64&amp;gt;&amp;gt;&lt;/code&gt; is mapped to &lt;code&gt;Nullable(Int64)&lt;/code&gt;, with two types of different initial &lt;code&gt;null&lt;/code&gt; merged into one.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;optional&amp;lt;list&amp;lt;string&amp;gt;&amp;gt;&lt;/code&gt; is mapped to &lt;code&gt;Array(String)&lt;/code&gt;, with initial &lt;code&gt;null&lt;/code&gt; turning into empty array &lt;code&gt;[]&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;optional&amp;lt;tuple&amp;lt;int64, string&amp;gt;&amp;gt;&lt;/code&gt; is mapped to &lt;code&gt;Tuple(Int64, String)&lt;/code&gt;, with initial &lt;code&gt;null&lt;/code&gt; turning into a tuple of two default values for Int64 and String, i.e. tuple &lt;code&gt;(0, '')&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"dict\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/data-types.html#dict\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dicts&lt;/span&gt;&lt;/a&gt;Dicts&lt;/h3&gt;\n&lt;p&gt;In the Yandex type system, for any two types &lt;code&gt;K&lt;/code&gt; and &lt;code&gt;V&lt;/code&gt; you can make type &lt;code&gt;dict&amp;lt;K, V&amp;gt;&lt;/code&gt;. ClickHouse has nothing like dicts, so &lt;code&gt;dict&amp;lt;K, V&amp;gt;&lt;/code&gt; is mapped to &lt;code&gt;Array(Tuple(K', V'))&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See a query example above: the first value in the &lt;code&gt;dict&lt;/code&gt; column contains the &lt;code&gt;{'key1' -&amp;gt; 42, 'key2' -&amp;gt; -17}&lt;/code&gt; dict.&lt;/p&gt;\n&lt;h3 id=\"tuple\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/data-types.html#tuple\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tuples&lt;/span&gt;&lt;/a&gt;Tuples&lt;/h3&gt;\n&lt;p&gt;Yandex type system tuples are mapped to ClickHouse tuples in a trivial way.&lt;/p&gt;\n&lt;h3 id=\"structures\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/data-types.html#structures\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Structures&lt;/span&gt;&lt;/a&gt;Structures&lt;/h3&gt;\n&lt;p&gt;Structures from the Yandex type system could be mapped to named CH tuples (&lt;code&gt;Named Tuple&lt;/code&gt;) CH. Unfortunately, ClickHouse has problems with supporting named tuples. They are now supported only on the external level of the complex type description (see the relevant &lt;a href=\"https://github.com/ClickHouse/ClickHouse/issues/15587\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;issue&lt;/a&gt;). As a result, you cannot place &lt;code&gt;Named Tuple&lt;/code&gt; inside, for example, a list. To simplify the current implementation, the decision was made to map the structures to regular tuples.&lt;/p&gt;\n&lt;p&gt;Thus, you can work with structures as with tuples, i.e. you can get elements from them by index through &lt;code&gt;.1&lt;/code&gt;, &lt;code&gt;.2&lt;/code&gt;, and so on or using the &lt;code&gt;tupleElement&lt;/code&gt; function:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt; yt --proxy &amp;lt;cluster_name&amp;gt; clickhouse execute &lt;span class=\"hljs-string\"&gt;'select toTypeName(struct), struct.1, struct.2  from `//home/user/sample_table_composite`'&lt;/span&gt; --format Vertical --setting chyt.composite.enable_conversion=1\nRow 1:\n──────\ntoTypeName(struct):      Tuple(Float64, String)\ntupleElement(struct, 1): 3.14\ntupleElement(struct, 2): pi\n\nRow 2:\n──────\ntoTypeName(struct):      Tuple(Float64, String)\ntupleElement(struct, 1): 0\ntupleElement(struct, 2):\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"216\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-216\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-216\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-216.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"tagged\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/data-types.html#tagged\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tagged types&lt;/span&gt;&lt;/a&gt;Tagged types&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;Tagged&lt;/code&gt; types from the general Yandex type system are mapped to the corresponding types without a tag. The tag information is lost.&lt;/p&gt;\n&lt;h3 id=\"var-any\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/data-types.html#var-any\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Variants, Named variants, Any&lt;/span&gt;&lt;/a&gt;Variants, Named variants, Any&lt;/h3&gt;\n&lt;p&gt;Variants and named variants are not supported. Their display logic is the same as if there is a value of the &lt;code&gt;Any&lt;/code&gt; type somewhere inside a composite type. Any value of the &lt;code&gt;Variant&lt;/code&gt;, &lt;code&gt;Named Variant&lt;/code&gt;, or &lt;code&gt;Any&lt;/code&gt; type simply turns into a YSON string with a value representation.&lt;/p&gt;\n&lt;h2 id=\"schema\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/data-types.html#schema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tips for working with insufficiently schematized data&lt;/span&gt;&lt;/a&gt;Tips for working with insufficiently schematized data&lt;/h2&gt;\n&lt;p&gt;Below are a few methods to get around some data type problems.&lt;/p&gt;\n&lt;p&gt;Many tables contain dates and times in text or numeric representation (for example, in ISO or Unix ts format). To convert them to a &lt;strong&gt;time&lt;/strong&gt; data type, you can use the standard &lt;a href=\"https://clickhouse.com/docs/en/sql-reference/functions/date-time-functions\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ClickHouse functions for working with date and time&lt;/a&gt;, &lt;a href=\"https://clickhouse.com/docs/en/sql-reference/functions/type-conversion-functions/#reinterpretasdate\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;reinterpret&lt;/a&gt;, and &lt;a href=\"https://clickhouse.com/docs/en/sql-reference/functions/type-conversion-functions/#type_conversion_function-cast\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;CAST&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;YTsaurus has historically used the &lt;code&gt;Any&lt;/code&gt; data type for working with composite data (arrays, dicts, structures). Despite the appearance of composite type support in the YTsaurus type system, a lot of old data still remains represented in &lt;code&gt;Any&lt;/code&gt;: it will be available as a binary YSON to the ClickHouse engine.&lt;/p&gt;\n&lt;p&gt;However, &lt;code&gt;Any&lt;/code&gt; representation as a binary YSON means almost nothing for the ClickHouse engine, since YSON support is not built into ClickHouse. ClickHouse interprets such data simply as a binary string with a custom format. Therefore, the ClickHouse and YTsaurus compatibility layer provides a number of auxiliary functions that enable you to address over a YSON structure using the &lt;a href=\"user-guide/storage/yson-docs.html\"&gt;YPath language&lt;/a&gt;. And also interpret its nodes as primitive YTsaurus types (&lt;code&gt;Int64&lt;/code&gt;, &lt;code&gt;UInt64&lt;/code&gt;, &lt;code&gt;Double&lt;/code&gt;, or &lt;code&gt;Boolean&lt;/code&gt;), strings (&lt;code&gt;String&lt;/code&gt;), or lists of primitive YTsaurus types (&lt;code&gt;Array(Int64)&lt;/code&gt;, &lt;code&gt;Array(UInt64)&lt;/code&gt;, &lt;code&gt;Array(Double)&lt;/code&gt;, or &lt;code&gt;Array(Boolean)&lt;/code&gt;) with the conversion into the corresponding built-in ClickHouse type. For more information about these functions, see &lt;a href=\"user-guide/data-processing/chyt/reference/functions.html#yson_functions\"&gt;Functions for working with YSON&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Conversion from YTsaurus representation to ClickHouse representation will inevitably result in longer query execution time.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/chyt/reference/data-types.md","sourcePath":"en/user-guide/data-processing/chyt/reference/data-types.md"},"headings":[{"title":"Primitive data types","href":"en/user-guide/data-processing/chyt/reference/data-types.html#primitive-data-types","level":2},{"title":"Composite data types","href":"en/user-guide/data-processing/chyt/reference/data-types.html#composite-data-types","level":2,"items":[{"title":"Optional types","href":"en/user-guide/data-processing/chyt/reference/data-types.html#optional","level":3},{"title":"Dicts","href":"en/user-guide/data-processing/chyt/reference/data-types.html#dict","level":3},{"title":"Tuples","href":"en/user-guide/data-processing/chyt/reference/data-types.html#tuple","level":3},{"title":"Structures","href":"en/user-guide/data-processing/chyt/reference/data-types.html#structures","level":3},{"title":"Tagged types","href":"en/user-guide/data-processing/chyt/reference/data-types.html#tagged","level":3},{"title":"Variants, Named variants, Any","href":"en/user-guide/data-processing/chyt/reference/data-types.html#var-any","level":3}]},{"title":"Tips for working with insufficiently schematized data","href":"en/user-guide/data-processing/chyt/reference/data-types.html#schema","level":2}],"title":"Data types"},"router":{"pathname":"en/user-guide/data-processing/chyt/reference/data-types","depth":6,"base":"../../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
