            {"data":{"leading":false,"html":"&lt;h2 id=\"create_delete_udf\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/user-defined-functions.html#create_delete_udf\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Creating and deleting SQL UDFs&lt;/span&gt;&lt;/a&gt;Creating and deleting SQL UDFs&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"https://clickhouse.com/docs/en/sql-reference/statements/create/function\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;CREATE FUNCTION&lt;/a&gt;: Creates a function from a lambda expression. Functions created this way are available to all users within the used clique, but not outside it.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;CREATE&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FUNCTION&lt;/span&gt; linearEquation &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; (x, k, b) &lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; k&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;x &lt;span class=\"hljs-operator\"&gt;+&lt;/span&gt; b;\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; number, linearEquation(number, &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; numbers(&lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;a href=\"https://clickhouse.com/docs/en/sql-reference/statements/drop#drop-function\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;DROP FUNCTION&lt;/a&gt;: Deletes a user-defined SQL function.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;DROP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FUNCTION&lt;/span&gt; linearEquation;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"10\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-10\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-10\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-10.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Both commands require the &lt;code&gt;Manage&lt;/code&gt; permission for the clique.&lt;/p&gt;\n&lt;h2 id=\"udf_usage\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/user-defined-functions.html#udf_usage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Using functions in queries&lt;/span&gt;&lt;/a&gt;Using functions in queries&lt;/h2&gt;\n&lt;p&gt;UDFs are stored in the clique state, so you don't have to recreate them in every query. You can call a UDF in the same way as any built-in ClickHouse function.&lt;/p&gt;\n&lt;p&gt;If someone recreates a UDF currently in use while a query is being executed, the calls to this function may use different implementations. There is no guaranteed way to know which one will be selected on each clique instance.&lt;/p&gt;\n&lt;h2 id=\"get_all_udfs\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/user-defined-functions.html#get_all_udfs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Listing all SQL UDFs in a clique&lt;/span&gt;&lt;/a&gt;Listing all SQL UDFs in a clique&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; name, create_query &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; system.functions\n&lt;span class=\"hljs-keyword\"&gt;WHERE&lt;/span&gt; origin &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'SQLUserDefined'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"26\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-26\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-26\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-26.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Result:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;name&lt;/th&gt;\n&lt;th&gt;create_query&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;linearEquation&lt;/td&gt;\n&lt;td&gt;CREATE FUNCTION linearEquation AS (x, k, b) -&amp;gt; ((k * x) + b)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/chyt/reference/user-defined-functions.md","sourcePath":"en/user-guide/data-processing/chyt/reference/user-defined-functions.md"},"headings":[{"title":"Creating and deleting SQL UDFs","href":"en/user-guide/data-processing/chyt/reference/user-defined-functions.html#create_delete_udf","level":2},{"title":"Using functions in queries","href":"en/user-guide/data-processing/chyt/reference/user-defined-functions.html#udf_usage","level":2},{"title":"Listing all SQL UDFs in a clique","href":"en/user-guide/data-processing/chyt/reference/user-defined-functions.html#get_all_udfs","level":2}],"title":"User-defined SQL functions"},"router":{"pathname":"en/user-guide/data-processing/chyt/reference/user-defined-functions","depth":6,"base":"../../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"
