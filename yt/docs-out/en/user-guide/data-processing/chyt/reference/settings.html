            {"data":{"leading":false,"html":"&lt;p&gt;This section contains information about CHYT-specific settings. ClickHouse has a large number of different settings which can be specified in different ways: via the GET parameter of a query, directly in the query via the SETTINGS clause, when using YQL via pragma, or in other ways. For a list of the original ClickHouse settings, see the &lt;a href=\"https://clickhouse.com/docs/en/operations/settings/settings/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;The settings related to CHYT start with the &lt;code&gt;chyt.&lt;/code&gt; prefix. Some settings are placed into separate subsections: in this case, the name of the setting will consist of several tokens separated by dots, for example, &lt;code&gt;chyt.composite.enable_conversion&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;As usual in ClickHouse, the &lt;code&gt;1&lt;/code&gt; and &lt;code&gt;0&lt;/code&gt; values are used as &lt;code&gt;True&lt;/code&gt; and &lt;code&gt;False&lt;/code&gt; for logical settings.&lt;/p&gt;\n&lt;p&gt;As usual, many of the settings include certain optimizations that are enabled by default and are listed only to emphasize the possibility of disabling them in case of incorrect optimization.&lt;/p&gt;\n&lt;h2 id=\"available-settings\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/settings.html#available-settings\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Available settings&lt;/span&gt;&lt;/a&gt;Available settings&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;enable_columnar_read&lt;/code&gt; [&lt;code&gt;%true&lt;/code&gt;]: Enables the use of the fast columnar reading interface for tables in scan format.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;enable_computed_column_deduction&lt;/code&gt; [&lt;code&gt;%true&lt;/code&gt;]: Enables the output of values for the computed key columns using the predicate in WHERE. For example, if the &lt;code&gt;key_hash&lt;/code&gt; key column is specified in the schema as a result of the &lt;code&gt;farm_hash(key)&lt;/code&gt; expression, then if the query condition contains the &lt;code&gt;key = 'xyz'&lt;/code&gt; expression, the &lt;code&gt;key_hash = 16518849956333482075&lt;/code&gt; consequence will be automatically added to the predicate. Only conditions of the &lt;code&gt;column = constant expression&lt;/code&gt;, &lt;code&gt;column tuple = tuple of constant expressions&lt;/code&gt;, &lt;code&gt;column IN tuple of constant expressions&lt;/code&gt;, and &lt;code&gt;column tuple IN tuple of constant expression tuples&lt;/code&gt; type are supported.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;infer_dynamic_table_ranges_from_pivot_keys&lt;/code&gt; [&lt;code&gt;%true&lt;/code&gt;]: Enables the additional step of range output when querying via a dynamic table using &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;tablet pivot keys&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;composite&lt;/code&gt;: A section with settings related to composite &lt;code&gt;type_v3&lt;/code&gt; and &lt;code&gt;YSON any/composite&lt;/code&gt; types:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;default_yson_format&lt;/code&gt; [&lt;code&gt;binary&lt;/code&gt;]: The default format for representing YSON strings. Possible values are &lt;code&gt;binary, text, and pretty&lt;/code&gt;. Note that options other than &lt;code&gt;binary&lt;/code&gt; are less efficient, because they require an explicit conversion from binary format. &lt;a href=\"user-guide/data-processing/chyt/reference/functions.html\"&gt;Functions for working with YSON&lt;/a&gt; work with any of the possible YSON formats.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;dynamic_table&lt;/code&gt;: A section with settings related to working with dynamic tables.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;enable_dynamic_store_read&lt;/code&gt; [&lt;code&gt;%true&lt;/code&gt;]: Work with dynamic tables by reading data from dynamic stores. If you enable this option, you cannot read a table that was not mounted with the &lt;code&gt;enable_dynamic_store_read = %true&lt;/code&gt; attribute. Attempting to read will cause an error. If this option is disabled, any query will forcibly read only data from chunk stores, i.e. not including the most recent data from memory store (regardless of whether the table is mounted with &lt;code&gt;enable_dynamic_store_read = %true&lt;/code&gt; or not).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;execution&lt;/code&gt;: A section with settings that affect the process of scheduling and executing a query:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;query_depth_limit&lt;/code&gt; [0]: The limit on the maximum depth of a distributed query. When reaching the specified depth, the query ends with an error. The 0 value means there is no limit.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;join_policy&lt;/code&gt; [&lt;code&gt;distribute_initial&lt;/code&gt;]: JOIN query mode on top of a YTsaurus table. Possible options:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;local&lt;/code&gt;: JOIN is executed locally on the query coordinator. The left- and right-hand side tables (or subquery) are read according to &lt;code&gt;select_policy&lt;/code&gt; mode.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;distribute_initial&lt;/code&gt; (default): &lt;code&gt;JOIN&lt;/code&gt; in the initial query is executed in a distributed manner, while JOIN in the secondary queries are executed locally.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;distribute&lt;/code&gt;: &lt;code&gt;JOIN&lt;/code&gt; in all the queries (initial and secondary) is executed in a distributed manner. We do not recommend using  this mode, because it can lead to an exponential number of secondary queries in case of multiple &lt;code&gt;JOIN&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;select_policy&lt;/code&gt; [&lt;code&gt;distribute_initial&lt;/code&gt;]&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;local&lt;/code&gt;: The &lt;code&gt;SELECT&lt;/code&gt; query is read and processed completely only on one instance (coordinator).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;distribute_initial&lt;/code&gt; (default): &lt;code&gt;SELECT&lt;/code&gt; is executed in a distributed manner on clique instances in the initial query. In secondary queries, the execution is local.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;distribute&lt;/code&gt;: &lt;code&gt;SELECT&lt;/code&gt; in all the queries (initial and secondary) is executed in a distributed manner. We do not recommend using  this mode, because it can lead to an exponential number of secondary queries.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;join_node_limit&lt;/code&gt; [0]: The maximum number of clique nodes on which the distributed &lt;code&gt;JOIN&lt;/code&gt; query is allowed. The 0 value means there is no limit (default).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;select_node_limit&lt;/code&gt; [0]: The maximum number of clique nodes on which the distributed &lt;code&gt;SELECT&lt;/code&gt; query is allowed. The 0 value means there is no limit (default).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;distribution_seed&lt;/code&gt; [42]: The seed used for deterministic distribution of the query to the clique nodes.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;input_streams_per_secondary_query&lt;/code&gt; [0]: The limit on the number of concurrent table read threads on each clique node during query execution. In case of the 0 value, the value of the &lt;code&gt;max_threads&lt;/code&gt; clickhouse setting (default) is used as a limit.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;filter_joined_subquery_by_sort_key&lt;/code&gt; [&lt;code&gt;%true&lt;/code&gt;]: Enables optimization that pre-filters the right-hand side JOIN table (or subquery) by the sort key of the left-hand side table.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;keep_nulls_in_right_or_full_join&lt;/code&gt; [&lt;code&gt;%true&lt;/code&gt;]: Adjusts the behavior of &lt;code&gt;RIGHT&lt;/code&gt; and &lt;code&gt;FULL JOIN&lt;/code&gt; when the right-hand side table (subquery) has the &lt;code&gt;Null&lt;/code&gt; values in the key columns. If &lt;code&gt;%true&lt;/code&gt; is set, the query is executed as usual. The query result will have all rows with the &lt;code&gt;Null&lt;/code&gt; value in the key columns (default). If &lt;code&gt;%false&lt;/code&gt; is set, all or some rows from the right-hand side table with the &lt;code&gt;Null&lt;/code&gt; value in the key columns may be missing and the query can be executed more efficiently. If there are no &lt;code&gt;Null&lt;/code&gt; values in the key columns of the right-hand side table (subquery), the query execution result does not depend on the values of this option.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;distributed_insert_stage&lt;/code&gt; [&lt;code&gt;with_mergeable_state&lt;/code&gt; (may be changed in the future)] is the minimum query execution stage after which distributed writing to the table is allowed when the &lt;code&gt;parallel_distributed_insert_select&lt;/code&gt; ClickHouse setting is enabled. Possible values:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;none&lt;/code&gt;: Never use distributed writing.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;with_mergeable_state&lt;/code&gt; (default, may be changed in the future): Use distributed writing if the query can be executed in a distributed manner at least to the &lt;code&gt;with_mergeable_state&lt;/code&gt; stage. Data aggregation (&lt;code&gt;GROUP BY&lt;/code&gt;, &lt;code&gt;DISTINCT&lt;/code&gt;, &lt;code&gt;LIMIT BY&lt;/code&gt;) and &lt;code&gt;ORDER BY&lt;/code&gt; and &lt;code&gt;LIMIT&lt;/code&gt; clauses can be executed independently on each clique node, so in case of distributed writing the query execution result may contain several rows with the same aggregation key, rows may not be sorted in the ORDER BY order, and the number of rows may exceed a specified LIMIT (but the total number of rows will not exceed the &lt;code&gt;number of instances in the clique&lt;/code&gt; * &lt;code&gt;specified LIMIT&lt;/code&gt;).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;after_aggregation&lt;/code&gt;: Use distributed writing if the query can be executed in a distributed manner at least to the &lt;code&gt;after_aggregation&lt;/code&gt; stage. Data aggregation (&lt;code&gt;GROUP BY&lt;/code&gt;, &lt;code&gt;DISTINCT&lt;/code&gt;, &lt;code&gt;LIMIT BY&lt;/code&gt;) is guranteed to be executed to the end and the &lt;code&gt;ORDER BY&lt;/code&gt; and &lt;code&gt;LIMIT&lt;/code&gt; clauses can be executed independently on each clique node (which can cause sorting to fail and exceeding the specified row limit, as described above). If the query cannot be executed in a distributed manner to the &lt;code&gt;after_aggregation&lt;/code&gt; stage, data will be written locally from the query coordinator.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;complete&lt;/code&gt;: Use distributed writing only if the query can be executed in a completely distributed manner. The result of execution of the query with distributed writing in this case is indistinguishable from an ordinary query, all the clauses (aggregation, &lt;code&gt;ORDER BY&lt;/code&gt;, and &lt;code&gt;LIMIT&lt;/code&gt;) will be executed to the end. If the query cannot be executed in a distributed manner to the &lt;code&gt;complete&lt;/code&gt; stage, data will be written locally from the query coordinator.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;caching&lt;/code&gt;: A section with settings related to the different caches used in CHYT:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;table_attributes_invalidate_mode&lt;/code&gt; [&lt;code&gt;sync&lt;/code&gt;]: The data invalidation mechanism mode in the table attribute cache when the table is changed (the &lt;code&gt;CREATE TABLE/INSERT INTO/DROP TABLE&lt;/code&gt; queries). Possible values:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;none&lt;/code&gt;: Data invalidation in the cache does not occur. Reading tables immediately after a change may return the old data or cause an error.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;local&lt;/code&gt;: Data invalidation occurs only in the local instance cache, without any rpc queries. Reading tables on other instances immediately after a change may return the old data or cause an error.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;async&lt;/code&gt;: Data invalidation occurs synchronously in the local cache and asynchronously on all clique instances. The query completes without waiting for data invalidation on the other clique instances. Errors during data invalidation in the cache do not cause a query to fail. Reading tables on other instances immediately after a change may still return the old data or cause an error, but this time interval after a data change is much shorter than in the &lt;code&gt;none&lt;/code&gt; and &lt;code&gt;local&lt;/code&gt; cases. We recommend using an invalidation mode not lower than this one.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;sync&lt;/code&gt; (default):  Data invalidation occurs synchronously on all clique instances. The query execution time may be slightly longer, because it is necessary to wait for confirmation of cache invalidation on all instances before completing. Errors during cache invalidation will cause a query to fail. After a successful modifying query, you can immediately read the modified tables.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;invalidate_request_timeout&lt;/code&gt; [5000]: The timeout in milliseconds (ms) for rpc queries to clique instances at the cache invalidation stage. If this timeout is exceeded, an error will be shown.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;concat_tables&lt;/code&gt;: A section with settings related to the functions for merging tables of the &lt;code&gt;concatYtTables*&lt;/code&gt; and &lt;code&gt;ytTables&lt;/code&gt; range:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;missing_column_mode&lt;/code&gt; [&lt;code&gt;read_as_null&lt;/code&gt;]: The output mode of the general column schema if it is missing in one of the tables. Possible values:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;throw&lt;/code&gt;: The query will end with an error.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;drop&lt;/code&gt;: The column will be missing in the general schema. You cannot read such a column.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;read_as_null&lt;/code&gt; (default): The column type will be set to &lt;code&gt;Optional(T)&lt;/code&gt;. In the rows from tables where this column is missing, the value in the column will be &lt;code&gt;Null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;type_mismatch_mode&lt;/code&gt; [&lt;code&gt;throw&lt;/code&gt;]: The general column schema output mode if column types in different tables are different and cannot be reduced to a general form. Possible values:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;throw&lt;/code&gt; (default): The query will end with an error.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;drop&lt;/code&gt;: The column will be missing in the general schema. You cannot read such a column.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;read_as_any&lt;/code&gt;: The column type will be set to &lt;code&gt;Any&lt;/code&gt;. All values will be represented as YSON strings which can be handled using the functions of the &lt;code&gt;YSONExtract*&lt;/code&gt; and &lt;code&gt;YPath*&lt;/code&gt; range.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;allow_empty_schema_intersection&lt;/code&gt; [&lt;code&gt;%false&lt;/code&gt;]: Allows combining multiple tables if they have no common columns.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;max_tables&lt;/code&gt; [250]: The maximum number of tables that can be combined for reading. If this limit is exceeded, the query will end with an error.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/chyt/reference/settings.md","sourcePath":"en/user-guide/data-processing/chyt/reference/settings.md"},"headings":[{"title":"Available settings","href":"en/user-guide/data-processing/chyt/reference/settings.html#available-settings","level":2}],"title":"Query settings"},"router":{"pathname":"en/user-guide/data-processing/chyt/reference/settings","depth":6,"base":"../../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
