        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Controller is a service responsible for administering and maintaining the operability of private cliques.&lt;/p&gt;\n&lt;h2 id=\"why\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/controller.html#why\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tasks solved&lt;/span&gt;&lt;/a&gt;Tasks solved&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Store the clique configuration persistently.&lt;/li&gt;\n&lt;li&gt;Generate the appropriate &lt;a href=\"user-guide/data-processing/chyt/reference/configuration.html\"&gt;instance configurations&lt;/a&gt; based on the clique configuration and YTsaurus cluster configuration.&lt;/li&gt;\n&lt;li&gt;Start and restart Vanilla operations on the clique, if they have been terminated because of failures or maintenance works on the cluster.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"cli\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/controller.html#cli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Controller CLI&lt;/span&gt;&lt;/a&gt;Controller CLI&lt;/h2&gt;\n&lt;p&gt;To access the controller, you can use the Command Line Interface (CLI) provided with the &lt;code&gt;ytsaurus-client&lt;/code&gt; package.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;We're continuously adding new &lt;a href=\"en/user-guide/data-processing/chyt/cliques/controller.html#commands\"&gt;commands&lt;/a&gt; for the controller, so some of them might not be in the documentation yet. To view all the currently available commands, use &lt;code&gt;yt clickhouse ctl --help&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;All the commands have the optional &lt;code&gt;--proxy&lt;/code&gt; parameter for setting the YTsaurus cluster to access the cliques from:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt --proxy &amp;lt;cluster_name&amp;gt; clickhouse ctl list\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"42\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-42\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-42\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-42.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If you omit this argument, the default value from the &lt;code&gt;YT_PROXY&lt;/code&gt; environment variable will be used.&lt;/p&gt;\n&lt;h2 id=\"access\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/controller.html#access\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Clique permissions&lt;/span&gt;&lt;/a&gt;Clique permissions&lt;/h2&gt;\n&lt;p&gt;Clique permissions are stored at &lt;code&gt;//sys/access_control_object_namespaces/chyt/&amp;lt;alias&amp;gt;/@principal_acl&lt;/code&gt;. Replace the &lt;code&gt;@principal_acl&lt;/code&gt; attribute with the necessary permissions:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;use&lt;/code&gt;: Use the clique (run queries).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;read&lt;/code&gt;: Read the clique's configuration.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;manage&lt;/code&gt;: Edit the clique's configuration&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;remove&lt;/code&gt;: Remove the clique.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"commands\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/controller.html#commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Commands&lt;/span&gt;&lt;/a&gt;Commands&lt;/h2&gt;\n&lt;h3 id=\"create\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/controller.html#create\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Create&lt;/span&gt;&lt;/a&gt;Create&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;yt clickhouse ctl create &amp;lt;alias&amp;gt;&lt;/code&gt;: Create a clique with the specified alias (name). The clique's alias must meet the ID requirements, that is, include only Latin characters, digits, and underscores (&lt;code&gt;_&lt;/code&gt;) and never begin with a digit. You can also use &lt;code&gt;*&lt;/code&gt; in the beginning (however, it would be ignored) and the &lt;code&gt;-&lt;/code&gt; character.&lt;/p&gt;\n&lt;p&gt;Once the command is successfully executed, the &lt;code&gt;//sys/strawberry/chyt/&amp;lt;alias&amp;gt;/speclet&lt;/code&gt; node is created in Cypress to store the clique's configuration.&lt;/p&gt;\n&lt;p&gt;In the web interface, the &lt;code&gt;//sys/strawberry/chyt/&amp;lt;alias&amp;gt;&lt;/code&gt; node will now additionally show the current state of the clique, including possible errors preventing the Vanilla operation from running on the clique's instances.&lt;/p&gt;\n&lt;p&gt;Cliques are created in an inactive state in which they cannot accept or process queries. To activate your clique, first set it up using appropriate commands.&lt;/p&gt;\n&lt;h3 id=\"remove\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/controller.html#remove\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Remove&lt;/span&gt;&lt;/a&gt;Remove&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;yt clickhouse ctl remove &amp;lt;alias&amp;gt;&lt;/code&gt;: Fully delete the clique and its persistent state. Once the operation is completed, you can't recover the clique anymore. To execute this operation, you only need the &lt;strong&gt;Manage&lt;/strong&gt; role for this clique.&lt;/p&gt;\n&lt;h3 id=\"exists\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/controller.html#exists\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Exists&lt;/span&gt;&lt;/a&gt;Exists&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;yt clickhouse ctl exists &amp;lt;alias&amp;gt;&lt;/code&gt;: Make sure that the clique exists on the cluster. The result of the command is a &lt;code&gt;bool&lt;/code&gt; value.&lt;/p&gt;\n&lt;p&gt;Result example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt clickhouse ctl exists test_clique_name\n%&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"107\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-107\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-107\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-107.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"status\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/controller.html#status\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Status&lt;/span&gt;&lt;/a&gt;Status&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;yt clickhouse ctl status &amp;lt;alias&amp;gt;&lt;/code&gt;: Return the current clique status.&lt;/p&gt;\n&lt;p&gt;Result example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt clickhouse ctl status test_clique_name\n{\n    &lt;span class=\"hljs-string\"&gt;\"status\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"Waiting for restart: speclet changed\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"operation_state\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"running\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"operation_url\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"https://ytsaurus.ru/&amp;lt;cluster_name&amp;gt;/operations/de569537-f8cded7d-3fe03e8-b5278252\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"speclet_diff\"&lt;/span&gt; = {\n        &lt;span class=\"hljs-string\"&gt;\"enable_geodata\"&lt;/span&gt; = {\n            &lt;span class=\"hljs-string\"&gt;\"new_value\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n            &lt;span class=\"hljs-string\"&gt;\"old_value\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;;\n        };\n    };\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"117\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-117\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-117\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-117.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"list\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/controller.html#list\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List&lt;/span&gt;&lt;/a&gt;List&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;yt clickhouse ctl list&lt;/code&gt;: Look up all the aliases of all the cliques running in the cluster.&lt;/p&gt;\n&lt;p&gt;Result example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt clickhouse ctl list\n[\n    &lt;span class=\"hljs-string\"&gt;\"&amp;lt;clique_name_1&amp;gt;\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"&amp;lt;clique_name_2&amp;gt;\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"&amp;lt;clique_name_3&amp;gt;\"&lt;/span&gt;;\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"127\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-127\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-127\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-127.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"set_option\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/controller.html#set_option\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Set-option&lt;/span&gt;&lt;/a&gt;Set-option&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;yt clickhouse ctl set-option &amp;lt;key&amp;gt; &amp;lt;value&amp;gt; [--alias &amp;lt;alias&amp;gt;]&lt;/code&gt;: Set the speclet's &lt;code&gt;key&lt;/code&gt; option to &lt;code&gt;value&lt;/code&gt;. To execute this command, you only need the &lt;strong&gt;manage&lt;/strong&gt; role for this clique.&lt;/p&gt;\n&lt;p&gt;An arbitrary YSON value is used for &lt;code&gt;value&lt;/code&gt;. For example, the value can be:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;A number:&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt clickhouse ctl set-option instance_count 1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"144\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-144\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-144\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-144.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;A boolean value. Such values begin with &lt;code&gt;%&lt;/code&gt; in YSON syntax:&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt clickhouse ctl set-option enable_geodata %&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"152\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-152\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-152\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-152.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;An ID string:&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt clickhouse ctl set-option query_settings/chyt.execution.join_policy &lt;span class=\"hljs-built_in\"&gt;local&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"160\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-160\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-160\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-160.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;An arbitrary string. If the string includes something different from alphanumeric characters, underscores &lt;code&gt;_&lt;/code&gt; and dashes &lt;code&gt;-&lt;/code&gt;, to be sure that it's parsed correctly as a string, enclose it in double quotes (&lt;code&gt;\"like this\"&lt;/code&gt;). Most of the popular command line implementations, such as bash, zsh, and others, parse &lt;code&gt;\"&lt;/code&gt; as a control character and might deliver values without the enclosing double quotes to the CLI. To overcome this issue, enclose the argument additionally in single quotes:&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt clickhouse ctl set-option chyt_version &lt;span class=\"hljs-string\"&gt;'\"stable-2.08\"'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"168\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-168\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-168\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-168.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The optional &lt;code&gt;--alias &amp;lt;alias&amp;gt;&lt;/code&gt; argument sets the alias for the clique to be updated. You can omit this argument; in this case, its value will be taken from &lt;code&gt;CHYT_ALIAS&lt;/code&gt;. If it is empty, an error will be returned.&lt;/p&gt;\n&lt;p&gt;To view all the set options, run the &lt;a href=\"en/user-guide/data-processing/chyt/cliques/controller.html#get-speclet\"&gt;get-speclet&lt;/a&gt; command. For a description of all available options, see &lt;a href=\"user-guide/data-processing/chyt/reference/configuration.html#options\"&gt;Configuration&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"remove_option\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/controller.html#remove_option\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Remove-option&lt;/span&gt;&lt;/a&gt;Remove-option&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;yt clickhouse ctl remove-option &amp;lt;key&amp;gt; [--alias &amp;lt;alias&amp;gt;]&lt;/code&gt;: Remove a previously assigned option value from the clique configuration. The options omitted in the clique configuration will be taken from their defaults when the clique's operation is started.&lt;/p&gt;\n&lt;h3 id=\"get-speclet\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/controller.html#get-speclet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Get-speclet&lt;/span&gt;&lt;/a&gt;Get-speclet&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;yt clickhouse ctl get-speclet [--alias &amp;lt;alias&amp;gt;]&lt;/code&gt;: Get all the options set for the clique.&lt;/p&gt;\n&lt;p&gt;Result example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt clickhouse ctl get-speclet --&lt;span class=\"hljs-built_in\"&gt;alias&lt;/span&gt; test_clique_name\n{\n    &lt;span class=\"hljs-string\"&gt;\"family\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"chyt\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"stage\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"production\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"instance_count\"&lt;/span&gt; = 8;\n    &lt;span class=\"hljs-string\"&gt;\"active\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"pool\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"chyt\"&lt;/span&gt;;\n    ...\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"190\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-190\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-190\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-190.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"set-speclet\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/controller.html#set-speclet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Set-speclet&lt;/span&gt;&lt;/a&gt;Set-speclet&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;yt clickhouse ctl set-speclet &amp;lt;speclet&amp;gt; [--alias &amp;lt;alias&amp;gt;]&lt;/code&gt;: Set the clique's speclet in YSON string format. To execute this command, you only need the &lt;strong&gt;manage&lt;/strong&gt; role for this clique.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt clickhouse ctl set-speclet &lt;span class=\"hljs-string\"&gt;'{instance_count=2;pool=\"chyt\";}'&lt;/span&gt; --&lt;span class=\"hljs-built_in\"&gt;alias&lt;/span&gt; test_clique_name\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"200\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-200\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-200\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-200.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"start\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/controller.html#start\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Start&lt;/span&gt;&lt;/a&gt;Start&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;yt clickhouse ctl start &amp;lt;alias&amp;gt; [--untracked]&lt;/code&gt;: Start a previously created clique.&lt;/p&gt;\n&lt;p&gt;With the &lt;code&gt;untracked&lt;/code&gt; option, you can start the clique without linking it to the controller and without any guarantees. This option is intended for starting test cliques without a compute pool. We strongly advise against running production cliques without specifying a compute pool, as this may make the clique unstable. The clique will start under the user's name. The controller doesn't monitor the state of such cliques or restart them if there are any errors. If the clique's operation ends in an error, you'll need to restart the clique manually by running the command again.&lt;/p&gt;\n&lt;p&gt;To execute this command, you only need the &lt;strong&gt;manage&lt;/strong&gt; role for this clique.&lt;/p&gt;\n&lt;p&gt;Result example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt clickhouse ctl start test_clique_name\n{\n    &lt;span class=\"hljs-string\"&gt;\"status\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"Ok\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"operation_state\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"initializing\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"operation_url\"&lt;/span&gt; = ...;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"216\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-216\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-216\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-216.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"stop\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/controller.html#stop\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Stop&lt;/span&gt;&lt;/a&gt;Stop&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;yt clickhouse ctl stop &amp;lt;alias&amp;gt;&lt;/code&gt;: Stop the clique. The clique will be stopped. All pool resources allocated to the clique will be released. The clique configuration won't be deleted. The user can restart the clique at any time using the &lt;code&gt;start&lt;/code&gt; command. To execute this command, you only need the &lt;strong&gt;manage&lt;/strong&gt; role for this clique.&lt;/p&gt;\n&lt;h2 id=\"options\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/controller.html#options\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Available options&lt;/span&gt;&lt;/a&gt;Available options&lt;/h2&gt;\n&lt;p&gt;For a list of the clique options that can be set by the &lt;code&gt;set-option&lt;/code&gt; command, see &lt;a href=\"user-guide/data-processing/chyt/reference/configuration.html#options\"&gt;Configuration&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/chyt/cliques/controller.md","sourcePath":"en/user-guide/data-processing/chyt/cliques/controller.md"},"headings":[{"title":"Tasks solved","href":"en/user-guide/data-processing/chyt/cliques/controller.html#why","level":2},{"title":"Controller CLI","href":"en/user-guide/data-processing/chyt/cliques/controller.html#cli","level":2},{"title":"Clique permissions","href":"en/user-guide/data-processing/chyt/cliques/controller.html#access","level":2},{"title":"Commands","href":"en/user-guide/data-processing/chyt/cliques/controller.html#commands","level":2,"items":[{"title":"Create","href":"en/user-guide/data-processing/chyt/cliques/controller.html#create","level":3},{"title":"Remove","href":"en/user-guide/data-processing/chyt/cliques/controller.html#remove","level":3},{"title":"Exists","href":"en/user-guide/data-processing/chyt/cliques/controller.html#exists","level":3},{"title":"Status","href":"en/user-guide/data-processing/chyt/cliques/controller.html#status","level":3},{"title":"List","href":"en/user-guide/data-processing/chyt/cliques/controller.html#list","level":3},{"title":"Set-option","href":"en/user-guide/data-processing/chyt/cliques/controller.html#set_option","level":3},{"title":"Remove-option","href":"en/user-guide/data-processing/chyt/cliques/controller.html#remove_option","level":3},{"title":"Get-speclet","href":"en/user-guide/data-processing/chyt/cliques/controller.html#get-speclet","level":3},{"title":"Set-speclet","href":"en/user-guide/data-processing/chyt/cliques/controller.html#set-speclet","level":3},{"title":"Start","href":"en/user-guide/data-processing/chyt/cliques/controller.html#start","level":3},{"title":"Stop","href":"en/user-guide/data-processing/chyt/cliques/controller.html#stop","level":3}]},{"title":"Available options","href":"en/user-guide/data-processing/chyt/cliques/controller.html#options","level":2}],"title":"Controller"},"router":{"pathname":"en/user-guide/data-processing/chyt/cliques/controller","depth":6,"base":"../../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
