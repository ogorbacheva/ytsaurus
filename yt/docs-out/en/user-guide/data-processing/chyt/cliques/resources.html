        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;A CHYT clique is a Vanilla YTsaurus operation and instances are run in the jobs of this operation and consume resources. A typical CHYT instance runs on about 10 CPU cores and about 60 GB of RAM.&lt;/p&gt;\n&lt;p&gt;Before continuing with this article, consider reading about the &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;Scheduler and pools&lt;/a&gt; first.&lt;/p&gt;\n&lt;h2 id=\"preemption\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/resources.html#preemption\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Preemption&lt;/span&gt;&lt;/a&gt;Preemption&lt;/h2&gt;\n&lt;p&gt;The main mechanism for ensuring fair resource allocation in the YTsaurus scheduler is preemption. This means that if at some point an operation starts consuming more resources than it's entitled to, any of its jobs will be \"preempted\", i.e. forcibly stopped, and another operation that is actually entitled to the resources will be started in its place. This job is called an &lt;em&gt;aborted job&lt;/em&gt; and the reason for &lt;code&gt;abort&lt;/code&gt; is &lt;code&gt;preemption&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;This approach works well for jobs of regular YTsaurus operations, since a typical job in YTsaurus has a duration of a few minutes, and losing a job progress is not a problem — the scheduler will restart the job later when there are available resources for it. Map-Reduce has delays of about several minutes, so this situation is absolutely tolerable.&lt;/p&gt;\n&lt;p&gt;The situation with CHYT is a bit more complicated. The built-in ClickHouse protocol does not provide a mechanism to recover queries that failed due to a component failure at runtime. This means that if queries are now running on the instance and &lt;code&gt;abort&lt;/code&gt; is sent to the job where the instance is running, then all running queries will fail with network layer errors (&lt;code&gt;NetException&lt;/code&gt;, &lt;code&gt;Attempt to read after eof&lt;/code&gt;, &lt;code&gt;Connection refused&lt;/code&gt;, and others). By then, the client could have returned a random set of strings from the response to the query, which only complicates the task of restarting the query.&lt;/p&gt;\n&lt;h2 id=\"interruption\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/resources.html#interruption\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Interruption&lt;/span&gt;&lt;/a&gt;Interruption&lt;/h2&gt;\n&lt;p&gt;MR jobs have long used a mechanism called &lt;em&gt;Interruption&lt;/em&gt;: if YTsaurus realizes that it is about to interrupt a job, it simply stops feeding data to the job's input. If the job manages to complete within a certain &lt;code&gt;interruption_timeout&lt;/code&gt;, it is considered &lt;code&gt;completed&lt;/code&gt;, and the data it has not processed will be fed to a new job. If the job does not manage to complete within an &lt;code&gt;interruption_timeout&lt;/code&gt;, it is simply aborted and its input is fully processed by another job.&lt;/p&gt;\n&lt;p&gt;ClickHouse instances do not process any input in the usual way for YTsaurus, independently executing queries coming from the outer world, so information about the upcoming interruption comes to such jobs in a different way. For CHYT, the &lt;code&gt;interruption_signal&lt;/code&gt; option is supported in the operation specification. This is a signal that will be sent to the job to notify it of an imminent completion.&lt;/p&gt;\n&lt;p&gt;When receiving the signal, the instance goes into completion mode, sends this information to the others using gossip, and no longer accepts any new queries, but continues executing those that are already in progress. After all current queries are executed, the instance will end with the &lt;code&gt;completed&lt;/code&gt; status.&lt;/p&gt;\n&lt;h2 id=\"preemption-dif\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/cliques/resources.html#preemption-dif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Regular preemption and graceful preemption&lt;/span&gt;&lt;/a&gt;Regular preemption and graceful preemption&lt;/h2&gt;\n&lt;p&gt;The YTsaurus scheduler preempts jobs based on the following logic: if a node has jobs whose operations have a lower &lt;code&gt;fair_share&lt;/code&gt; than their &lt;code&gt;usage_share&lt;/code&gt;, this job is considered &lt;code&gt;preemptable&lt;/code&gt;. If the scheduler has a job of the starving operation that can be run on a node if preemptable jobs are preempted, then it does it — it preempts the required number of preemptable jobs and plans new ones in their place. In this model, it is unacceptable to wait very long to preempt jobs, so the &lt;code&gt;interruption_timeout&lt;/code&gt; is only 15 seconds.&lt;/p&gt;\n&lt;p&gt;A typical usage scenario for CHYT is small and medium queries that run from single-digit seconds to several minutes; &lt;code&gt;interruption_timeout = 15 sec&lt;/code&gt; is often less than the standard query time, which means that many queries that were running on a given instance will end with an error.&lt;/p&gt;\n&lt;p&gt;To combat instance preemption, you can start a clique in the pool with guarantees, but not all users have guarantees. Besides that, some users don't want the clique to interfere with other operations in the pool: they need it to scale down when there is a demand for pool resources and expand when there are extra resources.&lt;/p&gt;\n&lt;p&gt;To solve this problem, a new operation scheduling mode — &lt;em&gt;Graceful Preemption&lt;/em&gt; — was added. To avoid preemption problems in this mode, preemption is performed in advance: if there are &lt;code&gt;preemptable&lt;/code&gt; jobs, a completion signal is sent to them, regardless of whether there is a candidate for these resources. Thus, the operation independently seeks that &lt;code&gt;usage_share = fair_share&lt;/code&gt;, catching up with the fair amount of resources it is due at the moment. Due to this, you can increase the preemption timeout to 10 minutes, because no one is idle, waiting for the release of resources.&lt;/p&gt;\n&lt;p&gt;Below is an example of how &lt;code&gt;usage_share&lt;/code&gt; (orange graph) and &lt;code&gt;fair_share&lt;/code&gt; (green graph) change after a heavyweight operation is started in the same pool as the clique.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/chyt_graceful_preemption.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;p&gt;To use &lt;em&gt;Graceful Preemption&lt;/em&gt;, set it with the &lt;code&gt;--spec {preemption_mode = graceful}&lt;/code&gt; parameter.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/chyt/cliques/resources.md","sourcePath":"en/user-guide/data-processing/chyt/cliques/resources.md"},"headings":[{"title":"Preemption","href":"en/user-guide/data-processing/chyt/cliques/resources.html#preemption","level":2},{"title":"Interruption","href":"en/user-guide/data-processing/chyt/cliques/resources.html#interruption","level":2},{"title":"Regular preemption and graceful preemption","href":"en/user-guide/data-processing/chyt/cliques/resources.html#preemption-dif","level":2}],"title":"Resources and preemption"},"router":{"pathname":"en/user-guide/data-processing/chyt/cliques/resources","depth":6,"base":"../../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
