        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;There are several ways to try CHYT.&lt;/p&gt;\n&lt;p&gt;The simplest way is to run a query via the Query Tracker web interface. You can use a public clique with the &lt;code&gt;ch_public&lt;/code&gt; alias. This is the main public clique found on every cluster of CHYT's presence.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In YTsaurus 24.1 and lower, a clique alias is specified with an asterisk at the beginning. For example, &lt;code&gt;*ch_public&lt;/code&gt;. In the current version, &lt;code&gt;*ch_public&lt;/code&gt; and &lt;code&gt;ch_public&lt;/code&gt; are the same alias.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;All YTsaurus users have access to the public clique, so there is a risk that it may not be available due to queries from other users or be occupied by other people's computations. In this regard, important processes and dashboards must not be based on a public clique. A public clique is essentially a demo version of CHYT. We highly recommend creating a separate clique for your team.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"http\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/try-chyt.html#http\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HTTP interface&lt;/span&gt;&lt;/a&gt;HTTP interface&lt;/h2&gt;\n&lt;p&gt;A clique is accessed via heavy YTsaurus HTTP proxies. The most convenient way to access a clique is to send a query to the name of the corresponding cluster and process the redirect. When using the cURL utility, this means that you must specify the &lt;code&gt;--location-trusted&lt;/code&gt; flag.&lt;/p&gt;\n&lt;p&gt;Below is an example of how to query a clique using the cURL command line utility, knowing the cluster name (&lt;code&gt;YT_PROXY&lt;/code&gt;), the YTsaurus access token (&lt;code&gt;YT_TOKEN&lt;/code&gt;), and the clique alias (&lt;code&gt;CHYT_ALIAS&lt;/code&gt;).&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ curl --location-trusted -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/chyt?chyt.clique_alias=&lt;span class=\"hljs-variable\"&gt;$CHYT_ALIAS&lt;/span&gt;\"&lt;/span&gt; -d &lt;span class=\"hljs-string\"&gt;'SELECT Avg(a) FROM \"//sys/clickhouse/sample_table\"'&lt;/span&gt;\n224.30769230769232\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"35\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-35\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-35\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-35.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"clique_alias_specification\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/try-chyt.html#clique_alias_specification\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How to specify a clique alias&lt;/span&gt;&lt;/a&gt;How to specify a clique alias&lt;/h3&gt;\n&lt;p&gt;You can specify a clique alias in the special &lt;code&gt;chyt.clique_alias&lt;/code&gt; URL parameter (see the example above) or in the &lt;code&gt;user&lt;/code&gt; field using any of the authorization methods (information about the actual user is contained in the token). For example, &lt;code&gt;http://cluster.domain.com/chyt?user=my-clique&amp;amp;password=my-token&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Authentication (clique alias + token) via different combinations of parameters isn't allowed. For example, the following query contains an error: &lt;code&gt;-H 'X-ClickHouse-User: my-clique' 'http://cluster.domain.com/chyt?password=my-token'&lt;/code&gt; (the alias is specified in the &lt;code&gt;X-ClickHouse-User/Key&lt;/code&gt; headers, and the token is specified in the &lt;code&gt;user/password&lt;/code&gt; URL parameters)&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In the old version, queries use the &lt;code&gt;http://$YT_PROXY/query&lt;/code&gt; path.&lt;/p&gt;\n&lt;p&gt;When CHYT is accessed using the deprecated &lt;code&gt;/query&lt;/code&gt; path, the alias is passed via the &lt;code&gt;database&lt;/code&gt; url parameter. When CHYT is accessed using the new &lt;code&gt;/chyt&lt;/code&gt; path, the alias is taken from &lt;code&gt;user&lt;/code&gt; or the &lt;code&gt;chyt.clique_alias&lt;/code&gt; URL parameter.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"chyt_port\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/try-chyt.html#chyt_port\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Exclusive connection port&lt;/span&gt;&lt;/a&gt;Exclusive connection port&lt;/h3&gt;\n&lt;p&gt;Not all clients support custom paths. Special ports can be configured on the HTTP Proxy to access CHYT. These ports don't require custom paths to be specified. For the numbers of dedicated ports, please contact the YTsaurus cluster administrator. The instructions on how you can configure these ports will be added in the near future.&lt;/p&gt;\n&lt;h2 id=\"odbc\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/try-chyt.html#odbc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ODBC interface&lt;/span&gt;&lt;/a&gt;ODBC interface&lt;/h2&gt;\n&lt;p&gt;You can use CHYT from Tableau via the &lt;a href=\"https://github.com/ClickHouse/clickhouse-odbc\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Clickhouse ODBC Driver&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;To do this, you just need to make the ODBC configuration represented below. The &lt;code&gt;YT_TOKEN&lt;/code&gt; variable denotes the YTsaurus access token (&lt;code&gt;AQAD-qJ…&lt;/code&gt;), &lt;code&gt;CHYT_ALIAS&lt;/code&gt; is the alias of the clique (&lt;code&gt;ch_public&lt;/code&gt;), and &lt;code&gt;YT_PROXY&lt;/code&gt; is the cluster name.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;[ClickHouse]\nDriver = &amp;lt;path to driver libclickhouseodbc&amp;gt;\n&lt;span class=\"hljs-comment\"&gt;# For example /usr/local/opt/clickhouse-odbc/lib/libclickhouseodbc.dylib&lt;/span&gt;\nuser = &lt;span class=\"hljs-variable\"&gt;$CHYT_ALIAS&lt;/span&gt;\npassword = &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\nurl = http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/chyt\nport = 80\n&lt;span class=\"hljs-comment\"&gt;# trace = 1&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# TraceFile=/tmp/odbc.log&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"80\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-80\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-80\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-80.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Below is an example of how to access CHYT via the ODBC interface from the command line using the &lt;a href=\"https://en.wikipedia.org/wiki/UnixODBC\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;isql&lt;/a&gt; utility. To do this, write the &lt;code&gt;~/.odbc.ini&lt;/code&gt; configuration file, install the Clickhouse ODBC driver from the official repository, and use the isql utility.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;isql -v clickhouse\n+---------------------------------------+\n| Connected!                            |\n|                                       |\n| sql-statement                         |\n| &lt;span class=\"hljs-built_in\"&gt;help&lt;/span&gt; [tablename]                      |\n| quit                                  |\n|                                       |\n+---------------------------------------+\nSQL&amp;gt; SELECT * FROM &lt;span class=\"hljs-string\"&gt;\"//tmp/sample_table\"&lt;/span&gt;\n+--+\n| a|\n+--+\n| 2|\n| 9|\n| 6|\n| 4|\n| 8|\n| 3|\n| 1|\n| 5|\n| 7|\n| 0|\n+--+\nSQLRowCount returns 10\n10 rows fetched\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"84\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-84\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-84\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-84.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"jdbc\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/try-chyt.html#jdbc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;JDBC interface&lt;/span&gt;&lt;/a&gt;JDBC interface&lt;/h2&gt;\n&lt;p&gt;The JDBC driver is configured in a similar way to the ODBC driver, see the example below. The &lt;code&gt;YT_TOKEN&lt;/code&gt; variable denotes the YTsaurus access token (&lt;code&gt;AQAD-qJ…&lt;/code&gt;), &lt;code&gt;CHYT_ALIAS&lt;/code&gt; is the ID/alias of the clique (&lt;code&gt;ch_public&lt;/code&gt;), and &lt;code&gt;YT_PROXY&lt;/code&gt; is the cluster name.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;JDBC URL = jdbc:clickhouse://{host}:{port}/chyt?chyt.clique_alias={clique_alias}\nhost = &lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;\nuser = &lt;span class=\"hljs-variable\"&gt;$CHYT_ALIAS&lt;/span&gt;\npassword = &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\nport = 80\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"91\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-91\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-91\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-91.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Besides that, you need to change the driver properties:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;check_for_redirects=true&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;use_path_as_db=false&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The JDBC driver can be used as a basis for using &lt;a href=\"https://dbeaver.io\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;DBeaver&lt;/a&gt;, an open-source database management program. DBeaver 6.1.5 was used for testing. If the ClickHouse-JDBC driver is not installed automatically, &lt;a href=\"https://github.com/yandex/clickhouse-jdbc\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;download&lt;/a&gt; it manually. You must use a driver version higher than 0.1.55.&lt;/p&gt;\n&lt;h2 id=\"cli-and-api\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/try-chyt.html#cli-and-api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CLI and Python API&lt;/span&gt;&lt;/a&gt;CLI and Python API&lt;/h2&gt;\n&lt;p&gt;CHYT has the official Python API and the official command line utility. For more information, see &lt;a href=\"user-guide/data-processing/chyt/cli-and-api.html\"&gt;CLI and Python API&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/chyt/try-chyt.md","sourcePath":"en/user-guide/data-processing/chyt/try-chyt.md"},"headings":[{"title":"HTTP interface","href":"en/user-guide/data-processing/chyt/try-chyt.html#http","level":2,"items":[{"title":"How to specify a clique alias","href":"en/user-guide/data-processing/chyt/try-chyt.html#clique_alias_specification","level":3},{"title":"Exclusive connection port","href":"en/user-guide/data-processing/chyt/try-chyt.html#chyt_port","level":3}]},{"title":"ODBC interface","href":"en/user-guide/data-processing/chyt/try-chyt.html#odbc","level":2},{"title":"JDBC interface","href":"en/user-guide/data-processing/chyt/try-chyt.html#jdbc","level":2},{"title":"CLI and Python API","href":"en/user-guide/data-processing/chyt/try-chyt.html#cli-and-api","level":2}],"title":"How to try"},"router":{"pathname":"en/user-guide/data-processing/chyt/try-chyt","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
