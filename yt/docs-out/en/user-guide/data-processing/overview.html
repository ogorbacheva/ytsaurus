        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"data-processing\"&gt;&lt;a href=\"en/user-guide/data-processing/overview.html#data-processing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data processing&lt;/span&gt;&lt;/a&gt;Data processing&lt;/h2&gt;\n&lt;p&gt;This section contains information about running computations and data processing in a YTsaurus cluster.&lt;/p&gt;\n&lt;p&gt;Data processing is performed in a distributed manner. The logical unit of computation is an &lt;strong&gt;operation&lt;/strong&gt;. Most operations have a set of input and output tables. They process data from the input tables, writing the results to an output table. For example, an operation may sort table &lt;code&gt;A&lt;/code&gt; and save the result to table &lt;code&gt;B&lt;/code&gt;, or it may execute user code to process rows from table &lt;code&gt;A&lt;/code&gt; and write the result to table &lt;code&gt;B&lt;/code&gt;. YTsaurus also allows running operations that execute a custom bash command, such as running a user-defined executable, in a distributed manner. This feature is particularly useful for running distributed ML operations on a cluster.&lt;/p&gt;\n&lt;p&gt;There are several &lt;a href=\"en/user-guide/data-processing/operations/overview#obzor\"&gt;types of operations&lt;/a&gt;. Among other things, they implement the &lt;a href=\"https://en.wikipedia.org/wiki/MapReduce\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MapReduce&lt;/a&gt; paradigm for distributed data processing.&lt;/p&gt;\n&lt;p&gt;Each operation consists of a number of &lt;strong&gt;jobs&lt;/strong&gt;, which are executed in the cluster in parallel and usually independently. Each job is an isolated process that handles a part of the overall computation and is executed on one of the cluster nodes. Before starting a job, an &lt;strong&gt;allocation&lt;/strong&gt; is made on the node. An allocation is a logical entity characterized by a set of computational resources, such as RAM and CPU. After this, the job is executed within the created allocation.&lt;/p&gt;\n&lt;p&gt;The general concept and design of the YTsaurus data processing system is similar to such systems as:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://hadoop.apache.org/docs/r1.2.1/mapred_tutorial.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Hadoop MapReduce&lt;/a&gt; and &lt;a href=\"https://hadoop.apache.org/docs/stable/hadoop-yarn/hadoop-yarn-site/YARN.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apache YARN&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://mesos.apache.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apache Mesos&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Please be aware that YTsaurus and Hadoop use different terminology: a YTsaurus operation would be called a job in Hadoop's terms, while a YTsaurus job would be called a task.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"architecture\"&gt;&lt;a href=\"en/user-guide/data-processing/overview.html#architecture\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Architecture&lt;/span&gt;&lt;/a&gt;Architecture&lt;/h2&gt;\n&lt;p&gt;The components involved in running computations in a cluster include the scheduler, controller agents, and exec nodes.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/data_processing_overview.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;The &lt;strong&gt;scheduler&lt;/strong&gt; is the key component that stores information about all operations, makes new allocations for operations, and implements hierarchical resource distribution.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Controller agents&lt;/strong&gt; are responsible for scheduling the jobs of individual operations. They contain the logic for the operation's execution plan, which breaks down the operation into individual jobs. The implementation correctly handles loss of individual jobs and ensures transactional execution of operations.&lt;/p&gt;\n&lt;p&gt;An &lt;strong&gt;exec node&lt;/strong&gt; is a process that runs on all compute nodes within the cluster. It handles the execution of individual jobs within allocations, prepares the environment for their execution, and ensures that the jobs are isolated from each other.&lt;/p&gt;\n&lt;p&gt;At any moment, the cluster state consists of:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;A single active scheduler that handles all allocation tasks.&lt;/li&gt;\n&lt;li&gt;Several independent controller agents that are responsible for scheduling operations.&lt;/li&gt;\n&lt;li&gt;A set of exec nodes that perform the computations.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The scheduler and the controller agents store their state in Cypress, while exec nodes don't have a persistent state and can be easily added to and removed from the cluster.&lt;/p&gt;\n&lt;p&gt;Let's make a short overview of the interaction between these components.&lt;/p&gt;\n&lt;p&gt;The scheduler provides an API for starting new operations and managing operations that are already running. It also periodically reads its own configuration and the &lt;a href=\"en/user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;pool&lt;/a&gt; hierarchy from Cypress. In addition, the scheduler uses Cypress as a persistent storage for the operation's meta state. An operation's meta state is a small set of attributes that are necessary to manage transactional execution of the operation and ensure fault tolerance.&lt;/p&gt;\n&lt;p&gt;When an operation is started, the scheduler initializes its state in Cypress and assigns it a controller agent, which will handle the job scheduling for that operation.&lt;/p&gt;\n&lt;p&gt;Each exec node periodically sends a heartbeat to the scheduler, informing it about the status of current allocations and receiving new allocations. It also receives requests to preempt some of the existing allocations and abort any associated jobs. In addition, exec nodes send heartbeats to each controller agent, informing them of the status of currently running jobs and retrieving specifications for starting new ones.&lt;/p&gt;\n&lt;h2 id=\"features-and-capabilities\"&gt;&lt;a href=\"en/user-guide/data-processing/overview.html#features-and-capabilities\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features and capabilities&lt;/span&gt;&lt;/a&gt;Features and capabilities&lt;/h2&gt;\n&lt;p&gt;Below is a description of the features and various capabilities provided by the YTsaurus data processing system.&lt;/p&gt;\n&lt;h3 id=\"fault-tolerance\"&gt;&lt;a href=\"en/user-guide/data-processing/overview.html#fault-tolerance\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fault tolerance&lt;/span&gt;&lt;/a&gt;Fault tolerance&lt;/h3&gt;\n&lt;p&gt;YTsaurus guarantees reliability and availability of data processing. Even if individual components fail, the cluster can still recover and continue to function. In such situations, the progress of individual operations may be lost, but the operations' states are safely stored in Cypress and operations will be correctly recovered.&lt;/p&gt;\n&lt;p&gt;In addition, the system aims to minimize loss of progress for running operations. For more information, see &lt;a href=\"en/user-guide/data-processing/reliability\"&gt;this document&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"scalability\"&gt;&lt;a href=\"en/user-guide/data-processing/overview.html#scalability\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Scalability&lt;/span&gt;&lt;/a&gt;Scalability&lt;/h3&gt;\n&lt;p&gt;The system offers a transparent way to add new exec nodes to the cluster in order to increase computational resources. It also supports the addition of extra controller agents, which is necessary for scaling up the number of operations that can be executed on the cluster.&lt;/p&gt;\n&lt;p&gt;The largest YTsaurus cluster installations service more than 1M CPUs and can run tens of thousands of operations simultaneously.&lt;/p&gt;\n&lt;p&gt;Note that the active scheduler is a single process, so the system's scalability is still limited. For more information about scheduler's scalability, see &lt;a href=\"https://www.youtube.com/watch?v=Vy6rHf-BIG8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;this presentation&lt;/a&gt; (in Russian).&lt;/p&gt;\n&lt;h3 id=\"resource-management\"&gt;&lt;a href=\"en/user-guide/data-processing/overview.html#resource-management\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Resource management&lt;/span&gt;&lt;/a&gt;Resource management&lt;/h3&gt;\n&lt;p&gt;The scheduler provides a rich API for distributing cluster resources among different users and projects. The basic unit for managing resources is a &lt;strong&gt;pool&lt;/strong&gt;. The pools form a hierarchy called a &lt;strong&gt;pool tree&lt;/strong&gt;. For each pool, you can configure guaranteed resources, manage resource distribution weights, and set resource limits and various &lt;a href=\"en/user-guide/data-processing/scheduler/preemption.html\"&gt;preemption&lt;/a&gt; settings.&lt;/p&gt;\n&lt;p&gt;For more information about resource allocation, see &lt;a href=\"en/user-guide/data-processing/scheduler/scheduler-and-pools\"&gt;Scheduler and pools&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"resource-heterogeneity\"&gt;&lt;a href=\"en/user-guide/data-processing/overview.html#resource-heterogeneity\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Resource heterogeneity&lt;/span&gt;&lt;/a&gt;Resource heterogeneity&lt;/h3&gt;\n&lt;p&gt;YTsaurus clusters can handle heterogeneous exec nodes and heterogeneous resource requirements of running jobs. For example, the same cluster can run both memory-intensive and CPU-intensive computations simultaneously.&lt;/p&gt;\n&lt;p&gt;In addition, the system is designed to be reactive, which means that scheduler tries to start new jobs as quickly as possible using any available resources, while the efficient packing of jobs on the exec nodes is not a priority for the scheduling algorithm. Because of this, highly imbalanced loads may lead to fragmentation of resources in the cluster.&lt;/p&gt;\n&lt;h3 id=\"gpu-support\"&gt;&lt;a href=\"en/user-guide/data-processing/overview.html#gpu-support\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GPU support&lt;/span&gt;&lt;/a&gt;GPU support&lt;/h3&gt;\n&lt;p&gt;Exec nodes are capable to start jobs that require GPU devices. In addition, the scheduler can be informed of the network topology on GPU hosts, and it will be taken into account for &lt;a href=\"https://en.wikipedia.org/wiki/Gang_scheduling\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;gang operations&lt;/a&gt; scheduling.&lt;/p&gt;\n&lt;p&gt;Internally, GPU resource is represented as a single integer indicating the number of devices, e.g. the total number of GPUs on a node or a number of GPUs required by a job. For this reason, it's recommended to split nodes with different GPU types into separate &lt;a href=\"en/user-guide/data-processing/scheduler/scheduler-and-pools#puly-i-derevya-pulov\"&gt;pool trees&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"support-for-multiple-data-processing-interfaces\"&gt;&lt;a href=\"en/user-guide/data-processing/overview.html#support-for-multiple-data-processing-interfaces\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Support for multiple data processing interfaces&lt;/span&gt;&lt;/a&gt;Support for multiple data processing interfaces&lt;/h3&gt;\n&lt;p&gt;The YTsaurus data processing system not only implements the MapReduce paradigm, but also supports running other data processing applications over shared computational resources. For example, you can run &lt;a href=\"en/yql\"&gt;YQL&lt;/a&gt; queries over YTsaurus or create &lt;a href=\"en/user-guide/data-processing/chyt/about-chyt\"&gt;ClickHouse cliques&lt;/a&gt; and &lt;a href=\"en/user-guide/data-processing/spyt/overview\"&gt;Spark clusters&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/overview.md","sourcePath":"en/user-guide/data-processing/overview.md"},"headings":[{"title":"Data processing","href":"en/user-guide/data-processing/overview.html#data-processing","level":2},{"title":"Architecture","href":"en/user-guide/data-processing/overview.html#architecture","level":2},{"title":"Features and capabilities","href":"en/user-guide/data-processing/overview.html#features-and-capabilities","level":2,"items":[{"title":"Fault tolerance","href":"en/user-guide/data-processing/overview.html#fault-tolerance","level":3},{"title":"Scalability","href":"en/user-guide/data-processing/overview.html#scalability","level":3},{"title":"Resource management","href":"en/user-guide/data-processing/overview.html#resource-management","level":3},{"title":"Resource heterogeneity","href":"en/user-guide/data-processing/overview.html#resource-heterogeneity","level":3},{"title":"GPU support","href":"en/user-guide/data-processing/overview.html#gpu-support","level":3},{"title":"Support for multiple data processing interfaces","href":"en/user-guide/data-processing/overview.html#support-for-multiple-data-processing-interfaces","level":3}]}],"title":""},"router":{"pathname":"en/user-guide/data-processing/overview","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.htm
