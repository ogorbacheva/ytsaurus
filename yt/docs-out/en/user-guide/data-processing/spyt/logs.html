        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"event-log\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/logs.html#event-log\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Event log &lt;/span&gt;&lt;/a&gt;Event log &lt;/h2&gt;\n&lt;p&gt;&lt;em&gt;Event log&lt;/em&gt; is a special log format in Spark. Logs are written by a &lt;a href=\"user-guide/data-processing/spyt/cluster/cluster-desc.html#spark-app\"&gt;driver&lt;/a&gt; and read by a special service called &lt;em&gt;Spark History Server (SHS)&lt;/em&gt;. SHS launches alongside the master and the workers when a SPYT cluster is started. SHS uses the log to draw a UI similar to Spark UI.&lt;/p&gt;\n&lt;p&gt;The difference between them is that Spark UI is available on the driver only while a job is running, whereas SHS is always up and can read the logs of completed jobs.&lt;br /&gt;\nLogs are written to a &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;dynamic table&lt;/a&gt; in &lt;code&gt;discovery-path&lt;/code&gt;. SHS can delete them &lt;a href=\"en/user-guide/data-processing/spyt/logs.html#log-settings\"&gt;automatically&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"log-on\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/logs.html#log-on\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Enabling&lt;/span&gt;&lt;/a&gt;Enabling&lt;/h2&gt;\n&lt;p&gt;Set &lt;code&gt;spark.eventLog.enabled&lt;/code&gt; to &lt;code&gt;true&lt;/code&gt; on starting a job:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ spark-submit-yt ... --conf spark.eventLog.enabled=&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"15\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-15\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-15\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-15.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"log-settings\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/logs.html#log-settings\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Configuring&lt;/span&gt;&lt;/a&gt;Configuring&lt;/h2&gt;\n&lt;p&gt;For a detailed description of SHS settings, please see the &lt;a href=\"https://spark.apache.org/docs/latest/monitoring.html#spark-history-server-configuration-options\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Spark documentation&lt;/a&gt;. You can pass any settings from this description in to &lt;code&gt;spark-launch-yt ... --params '{spark_conf={\"spark.param\"=value;...}}'&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;By default, the &lt;code&gt;spark.history.fs.cleaner.enabled&lt;/code&gt; is set to &lt;code&gt;true&lt;/code&gt;. The other parameters' default values are as per the Spark documentation. If the parameters are set to their defaults, SHS deletes all logs older than one week. You can change this age limit using the setting: &lt;code&gt;spark.history.fs.cleaner.maxAge&lt;/code&gt; (&lt;code&gt;spark-launch-yt ... --params '{spark_conf={\"spark.history.fs.cleaner.maxAge\"=\"14d\";...}}'&lt;/code&gt;).&lt;/p&gt;\n&lt;h2 id=\"worker-logs\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/logs.html#worker-logs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Worker logs&lt;/span&gt;&lt;/a&gt;Worker logs&lt;/h2&gt;\n&lt;p&gt;When you start a cluster, you can configure &lt;a href=\"user-guide/data-processing/spyt/cluster/cluster-desc.html#spark-standalone\"&gt;worker&lt;/a&gt; logs to upload to YTsaurus tables. Logs will be written to &lt;code&gt;{cluster_path}/logs/worker_log&lt;/code&gt; with a separate table created for each date. To enable sending of logs when starting a cluster, you must use one of these options:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;--enable-worker-log-transfer&lt;/code&gt;: Enables log forwarding.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--enable-worker-log-json-mode&lt;/code&gt;: Enables json mode for the logs. Table data are displayed in a more convenient format and broken down into component parts. If the option is disabled, logs are written to a single column called &lt;code&gt;messages&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--worker-log-update-interval ...&lt;/code&gt; : Sets the frequency of log upload; the default value is 10 minutes (10m), the minimum value is 1 minute.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--worker-log-table-ttl ...&lt;/code&gt; : Sets the table age limit; the default is 7 days (7d).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;You can view logs on SHS: the &lt;em&gt;executors&lt;/em&gt; tab of any &lt;em&gt;application&lt;/em&gt; contains &lt;code&gt;[HS]&lt;/code&gt;-prefixed links for every worker. A log page referenced by these links is generated from the YTsaurus tables; therefore, it is available even if a worker no longer is. A log persists until the relevant table is deleted:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-launch-yt ... \\\n  --enable-worker-log-transfer \\\n  --enable-worker-log-json-mode \\\n  --worker-log-update-interval 30m \\\n  --worker-log-table-ttl 30d\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"56\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-56\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-56\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-56.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/spyt/logs.md","sourcePath":"en/user-guide/data-processing/spyt/logs.md"},"headings":[{"title":"Event log ","href":"en/user-guide/data-processing/spyt/logs.html#event-log","level":2},{"title":"Enabling","href":"en/user-guide/data-processing/spyt/logs.html#log-on","level":2},{"title":"Configuring","href":"en/user-guide/data-processing/spyt/logs.html#log-settings","level":2},{"title":"Worker logs","href":"en/user-guide/data-processing/spyt/logs.html#worker-logs","level":2}],"title":"Logs"},"router":{"pathname":"en/user-guide/data-processing/spyt/logs","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
