            {"data":{"leading":false,"html":"&lt;h2 id=\"how-to\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/API/spyt-python.html#how-to\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Steps to launch&lt;/span&gt;&lt;/a&gt;Steps to launch&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Write some code.&lt;/li&gt;\n&lt;li&gt;Post your code and dependencies to YTsaurus. The main &lt;code&gt;.py&lt;/code&gt; file and the dependencies in &lt;code&gt;.py&lt;/code&gt;, &lt;code&gt;.zip&lt;/code&gt;, or &lt;code&gt;.egg&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Build a binary file and post it to YTsaurus (Spark 3.2.2+).&lt;/li&gt;\n&lt;li&gt;Run &lt;code&gt;spark-submit-yt&lt;/code&gt; for submitting to inner standalone cluster or &lt;code&gt;spark-submit&lt;/code&gt; for submitting directly to YTsaurus (available from version 1.76.0)&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"submit\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/API/spyt-python.html#submit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Differences for submitting directly to YTsaurus&lt;/span&gt;&lt;/a&gt;Differences for submitting directly to YTsaurus&lt;/h2&gt;\n&lt;p&gt;All of the examples below are written for using with inner Spark standalone cluster. There's some differences for creating SparkSession object when submitting directly to YTsaurus. Instead of using &lt;code&gt;with spark_session()&lt;/code&gt; or &lt;code&gt;spyt.connect()&lt;/code&gt; functions the object should be created explicitly according to Spark recommendations:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; pyspark.sql &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; SparkSession\n\nspark = SparkSession.builder.appName(&lt;span class=\"hljs-string\"&gt;'My Application'&lt;/span&gt;).getOrCreate()\n\n&lt;span class=\"hljs-meta\"&gt;... &lt;/span&gt;&lt;span class=\"hljs-comment\"&gt;# Application code&lt;/span&gt;\n\nspark.stop()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"31\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-31\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-31\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-31.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"simple\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/API/spyt-python.html#simple\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Running with no dependencies&lt;/span&gt;&lt;/a&gt;Running with no dependencies&lt;/h2&gt;\n&lt;h3 id=\"main-file-code\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/API/spyt-python.html#main-file-code\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Main file code&lt;/span&gt;&lt;/a&gt;Main file code&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; spyt &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; spark_session\n\n&lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"Hello world\"&lt;/span&gt;)\n&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; spark_session() &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; spark:\n    spark.read.yt(&lt;span class=\"hljs-string\"&gt;\"path_to_file\"&lt;/span&gt;).show()\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"38\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-38\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-38\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-38.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"launch\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/API/spyt-python.html#launch\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Launch&lt;/span&gt;&lt;/a&gt;Launch&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-submit-yt \\\n  --proxy &amp;lt;cluster-name&amp;gt; \\\n  --discovery-path //my_discovery_path \\\n  --deploy-mode cluster \\\n  YT_path_to_file\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"42\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-42\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-42\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-42.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"dependencies\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/API/spyt-python.html#dependencies\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Running with dependencies&lt;/span&gt;&lt;/a&gt;Running with dependencies&lt;/h2&gt;\n&lt;h3 id=\"main-file-code1\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/API/spyt-python.html#main-file-code1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Main file code&lt;/span&gt;&lt;/a&gt;Main file code&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; my_lib &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; plus5\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; pyspark.sql.functions &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; col\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; spyt &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; spark_session\n\n&lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"Hello world\"&lt;/span&gt;)\n&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; spark_session() &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; spark:\n    spark.read.yt(&lt;span class=\"hljs-string\"&gt;\"path_to_file\"&lt;/span&gt;)\\\n\t.withColumn(&lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;, plus5(col(&lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;)))\\\n\t.write.mode(&lt;span class=\"hljs-string\"&gt;\"overwrite\"&lt;/span&gt;).yt(&lt;span class=\"hljs-string\"&gt;\"path_to_file\"&lt;/span&gt;)\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"49\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-49\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-49\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-49.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"dependency\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/API/spyt-python.html#dependency\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dependency&lt;/span&gt;&lt;/a&gt;Dependency&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;my_lib.zip&lt;/code&gt; containing &lt;code&gt;my_lib.py&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; pyspark.sql.functions &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; udf\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; pyspark.sql.types &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; LongType\n\nplus5 = udf(&lt;span class=\"hljs-keyword\"&gt;lambda&lt;/span&gt; x: x + &lt;span class=\"hljs-number\"&gt;5&lt;/span&gt;, LongType())\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"56\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-56\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-56\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-56.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"code-and-dependencies-in-ytsaurus\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/API/spyt-python.html#code-and-dependencies-in-ytsaurus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Code and dependencies in YTsaurus&lt;/span&gt;&lt;/a&gt;Code and dependencies in YTsaurus&lt;/h3&gt;\n&lt;p&gt;To be posted to YTsaurus:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;A file, such as &lt;code&gt;deps_example.py&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Dependencies, such as &lt;code&gt;my_lib.zip&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"launch1\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/API/spyt-python.html#launch1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Launch&lt;/span&gt;&lt;/a&gt;Launch&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-submit-yt \\\n    --proxy &amp;lt;cluster-name&amp;gt; \\\n    --discovery-path //my_discovery_path \\\n    --deploy-mode cluster \\\n    --py-files YT_path_to_lib \\\n    YT_path_to_file\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"78\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-78\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-78\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-78.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"running-with-configurations\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/API/spyt-python.html#running-with-configurations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Running with configurations&lt;/span&gt;&lt;/a&gt;Running with configurations&lt;/h2&gt;\n&lt;p&gt;Spark includes many useful configurations that you can specify when running a job. Such as &lt;a href=\"https://spark.apache.org/docs/latest/sql-performance-tuning.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;spark.sql.shuffle.partitions&lt;/a&gt;. There is a way to control the amount of resources per job via &lt;code&gt;spark.cores.max&lt;/code&gt; and &lt;code&gt;spark.executor.memory&lt;/code&gt;. For more information, please see the &lt;a href=\"https://spark.apache.org/docs/latest/configuration.html#application-properties\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Spark documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In &lt;a href=\"user-guide/data-processing/spyt/cluster/cluster-desc.html#spark-standalone\"&gt;Standalone&lt;/a&gt; mode, the &lt;code&gt;num-executors&lt;/code&gt; and the &lt;code&gt;spark.executor.instances&lt;/code&gt; settings are non-functional while the number of executors depends on the &lt;code&gt;spark.cores.max&lt;/code&gt; parameter.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"main-file-code2\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/API/spyt-python.html#main-file-code2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Main file code&lt;/span&gt;&lt;/a&gt;Main file code&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; pyspark_yt &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; spark_session\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; pyspark.sql.functions &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; col\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; spyt &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; spark_session\n\n&lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"Hello world\"&lt;/span&gt;)\n&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; spark_session() &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; spark:\n    spark.read.yt(&lt;span class=\"hljs-string\"&gt;\"path_to_file\"&lt;/span&gt;)\\\n\t.withColumn(&lt;span class=\"hljs-string\"&gt;\"id_mod_10\"&lt;/span&gt;, col(&lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt;) % &lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;)\\\n\t.groupBy(&lt;span class=\"hljs-string\"&gt;\"id_mod_10\"&lt;/span&gt;)\\\n\t.count()\\\n\t.write.mode(&lt;span class=\"hljs-string\"&gt;\"overwrite\"&lt;/span&gt;).yt(&lt;span class=\"hljs-string\"&gt;\"path_to_file\"&lt;/span&gt;)\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"98\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-98\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-98\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-98.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"code-in-ytsaurus\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/API/spyt-python.html#code-in-ytsaurus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Code in YTsaurus&lt;/span&gt;&lt;/a&gt;Code in YTsaurus&lt;/h3&gt;\n&lt;p&gt;You need to post this file to YTsaurus.&lt;/p&gt;\n&lt;h3 id=\"launch2\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/API/spyt-python.html#launch2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Launch&lt;/span&gt;&lt;/a&gt;Launch&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-submit-yt \\\n  --proxy &amp;lt;cluster-name&amp;gt; \\\n  --&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;test&lt;/span&gt; \\\n  --discovery-dir //my_discovery_path \\\n  --deploy-mode cluster \\\n  --conf spark.sql.shuffle.partitions=1 \\\n  --conf spark.cores.max=1 \\\n  --conf spark.executor.cores=1 \\\n  YT_path_to_file\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"108\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-108\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-108\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-108.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"other-examples\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/API/spyt-python.html#other-examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Other examples&lt;/span&gt;&lt;/a&gt;Other examples&lt;/h2&gt;\n&lt;p&gt;You can find additional examples in &lt;a href=\"user-guide/data-processing/spyt/API/spyt-jupyter.html\"&gt;SPYT in Jupyter&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;In regular jobs, you can create the &lt;code&gt;spark&lt;/code&gt; object the same way as in Jupyter via a call to &lt;code&gt;connect&lt;/code&gt;or, alternatively, via &lt;code&gt;with spark_session&lt;/code&gt; as in the example. The difference between the options is minimal. Jupyter allows you to pass resource settings, while for regular jobs, you would normally do this at launch to avoid reposting code if, for instance, the amount of data had increased.&lt;/p&gt;\n&lt;p&gt;Example job start and output verification:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; spyt\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; time\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; spyt.submit &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; java_gateway, SparkSubmissionClient, SubmissionStatus\n\nuser = &lt;span class=\"hljs-string\"&gt;\"user_name\"&lt;/span&gt;\ntoken = spyt.utils.default_token()\nyt_proxy = &lt;span class=\"hljs-string\"&gt;\"cluster_name\"&lt;/span&gt;\ndiscovery_path = &lt;span class=\"hljs-string\"&gt;\"//my_discovery_path\"&lt;/span&gt;\nspyt_version = &lt;span class=\"hljs-string\"&gt;\"1.4.1\"&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; java_gateway() &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; gateway:\n    client = SparkSubmissionClient(gateway, yt_proxy, discovery_path, spyt_version, user, token)\n    launcher = (\n        client\n            .new_launcher()\n            .set_app_resource(&lt;span class=\"hljs-string\"&gt;\"yt:///sys/spark/examples/smoke_test.py\"&lt;/span&gt;)\n            .set_conf(&lt;span class=\"hljs-string\"&gt;\"spark.pyspark.python\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"/opt/python3.7/bin/python3.7\"&lt;/span&gt;)\n    )\n    submission_id = client.submit(launcher)\n    status = client.get_status(submission_id)\n    &lt;span class=\"hljs-keyword\"&gt;while&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;not&lt;/span&gt; SubmissionStatus.is_final(status):\n        status = client.get_status(submission_id)\n        time.sleep(&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;)\n    SubmissionStatus.is_success(status)\n    SubmissionStatus.is_failure(status)\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"121\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-121\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-121\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-121.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;The client operates via &lt;code&gt;Py4J&lt;/code&gt; calling the required &lt;code&gt;RestSubmissionClient&lt;/code&gt; methods. The string &lt;code&gt;with java_gateway() as gateway&lt;/code&gt; will bring the &lt;code&gt;JVM&lt;/code&gt; up with the right &lt;code&gt;Classpath&lt;/code&gt; and exit without error.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;You can use the &lt;code&gt;launch_gateway&lt;/code&gt; and the &lt;code&gt;shutdown_gateway&lt;/code&gt; methods to control the creation of a &lt;code&gt;JVM&lt;/code&gt; manually.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;SparkSubmissionClient&lt;/code&gt; is a client to submit jobs to a specific cluster. The client finds the location of the master with &lt;code&gt;discovery_path&lt;/code&gt; and communicates with it.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;The parameters of the job to be started are described in the &lt;code&gt;launcher&lt;/code&gt; object. A complete listing of the object's methods is available in the code. They match the &lt;code&gt;spark-submit&lt;/code&gt; parameters.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;After launch, you can check job status using the &lt;code&gt;client.get_status&lt;/code&gt; method. The example shows the timeout to get the final output.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/spyt/API/spyt-python.md","sourcePath":"en/user-guide/data-processing/spyt/API/spyt-python.md"},"headings":[{"title":"Steps to launch","href":"en/user-guide/data-processing/spyt/API/spyt-python.html#how-to","level":2},{"title":"Differences for submitting directly to YTsaurus","href":"en/user-guide/data-processing/spyt/API/spyt-python.html#submit","level":2},{"title":"Running with no dependencies","href":"en/user-guide/data-processing/spyt/API/spyt-python.html#simple","level":2,"items":[{"title":"Main file code","href":"en/user-guide/data-processing/spyt/API/spyt-python.html#main-file-code","level":3},{"title":"Launch","href":"en/user-guide/data-processing/spyt/API/spyt-python.html#launch","level":3}]},{"title":"Running with dependencies","href":"en/user-guide/data-processing/spyt/API/spyt-python.html#dependencies","level":2,"items":[{"title":"Main file code","href":"en/user-guide/data-processing/spyt/API/spyt-python.html#main-file-code1","level":3},{"title":"Dependency","href":"en/user-guide/data-processing/spyt/API/spyt-python.html#dependency","level":3},{"title":"Code and dependencies in YTsaurus","href":"en/user-guide/data-processing/spyt/API/spyt-python.html#code-and-dependencies-in-ytsaurus","level":3},{"title":"Launch","href":"en/user-guide/data-processing/spyt/API/spyt-python.html#launch1","level":3}]},{"title":"Running with configurations","href":"en/user-guide/data-processing/spyt/API/spyt-python.html#running-with-configurations","level":2,"items":[{"title":"Main file code","href":"en/user-guide/data-processing/spyt/API/spyt-python.html#main-file-code2","level":3},{"title":"Code in YTsaurus","href":"en/user-guide/data-processing/spyt/API/spyt-python.html#code-in-ytsaurus","level":3},{"title":"Launch","href":"en/user-guide/data-processing/spyt/API/spyt-python.html#launch2","level":3}]},{"title":"Other examples","href":"en/user-guide/data-processing/spyt/API/spyt-python.html#other-examples","level":2}],"title":"SPYT in Python"},"router":{"pathname":"en/user-guide/data-processing/spyt/API/spyt-python","depth":6,"base":"../../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
