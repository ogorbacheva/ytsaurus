        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;SPYT 1.77.0 introduced support for &lt;a href=\"https://spark.apache.org/docs/latest/streaming/index.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;streaming processes&lt;/a&gt; over YTsaurus.&lt;/p&gt;\n&lt;h2 id=\"general-scheme-of-spark-structured-streaming-in-spyt\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/structured-streaming.html#general-scheme-of-spark-structured-streaming-in-spyt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General scheme of Spark Structured Streaming in SPYT&lt;/span&gt;&lt;/a&gt;General scheme of Spark Structured Streaming in SPYT&lt;/h2&gt;\n&lt;p&gt;&lt;img src=\"images/spyt-streaming-general-schemeMM.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;h3 id=\"concepts\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/structured-streaming.html#concepts\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Concepts&lt;/span&gt;&lt;/a&gt;Concepts&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;Queue&lt;/code&gt;: Any ordered dynamic table.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;Consumer&lt;/code&gt;: A sorted table that has a defined schema. It has a many-to-many relationship with queues and represents a consumer of one or more queues. A consumer's function is to store offsets across the partitions of readable queues.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;Source&lt;/code&gt;: A data source. In regard to streaming over the Queue API, this is a queue (ordered dynamic table).&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;Sink&lt;/code&gt;: A data sink. Dependent on task an output table may be either sorted or ordered dynamic table.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;Microbatch&lt;/code&gt;: An amount of data that's processed within a single streaming iteration.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;Streaming Query&lt;/code&gt;: A continuously running process that processes data streams in microbatches. It reads data from &lt;code&gt;Source&lt;/code&gt;, applies specified transformations, and writes results to &lt;code&gt;Sink&lt;/code&gt;. It's created using the &lt;code&gt;start()&lt;/code&gt; method of the &lt;code&gt;DataStreamWriter&lt;/code&gt; class.&lt;/p&gt;\n&lt;h2 id=\"checkpoint-location\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/structured-streaming.html#checkpoint-location\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Checkpoint storage&lt;/span&gt;&lt;/a&gt;Checkpoint storage&lt;/h2&gt;\n&lt;p&gt;YTsaurus can serve as a reliable storage for offsets and other metadata. For this, specify the &lt;code&gt;checkpointLocation&lt;/code&gt; option with the &lt;code&gt;yt:///...&lt;/code&gt; value. This saves all subsequent metainformation about the task at the specified path.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Listing 1 — Example of using checkpoint storage&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs scala\"&gt;&lt;span class=\"hljs-keyword\"&gt;val&lt;/span&gt; numbers = spark\n  .readStream\n  .format(&lt;span class=\"hljs-string\"&gt;\"rate\"&lt;/span&gt;)\n  .option(&lt;span class=\"hljs-string\"&gt;\"rowsPerSecond\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;)\n  .load()\n  .select($&lt;span class=\"hljs-string\"&gt;\"timestamp\"&lt;/span&gt;, floor(rand() * &lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;).as(&lt;span class=\"hljs-string\"&gt;\"num\"&lt;/span&gt;))\n\n&lt;span class=\"hljs-keyword\"&gt;val&lt;/span&gt; groupedNumbers = numbers\n  .withWatermark(&lt;span class=\"hljs-string\"&gt;\"timestamp\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"5 seconds\"&lt;/span&gt;)\n  .groupBy(window($&lt;span class=\"hljs-string\"&gt;\"timestamp\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"5 seconds\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"3 seconds\"&lt;/span&gt;), $&lt;span class=\"hljs-string\"&gt;\"num\"&lt;/span&gt;)\n  .count()\n\n&lt;span class=\"hljs-keyword\"&gt;val&lt;/span&gt; job = groupedNumbers\n  .writeStream\n  .option(&lt;span class=\"hljs-string\"&gt;\"checkpointLocation\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"yt:///tmp/spark-streaming/sample01/checkpoints\"&lt;/span&gt;)\n  .trigger(&lt;span class=\"hljs-type\"&gt;ProcessingTime&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;1000&lt;/span&gt;))\n  .foreachBatch { (frame: &lt;span class=\"hljs-type\"&gt;DataFrame&lt;/span&gt;, batchNum: &lt;span class=\"hljs-type\"&gt;Long&lt;/span&gt;) =&amp;gt;\n    frame.write.mode(&lt;span class=\"hljs-type\"&gt;SaveMode&lt;/span&gt;.&lt;span class=\"hljs-type\"&gt;Append&lt;/span&gt;).yt(&lt;span class=\"hljs-string\"&gt;\"//tmp/spark-streaming/sample01/result\"&lt;/span&gt;)\n  }\n\n&lt;span class=\"hljs-keyword\"&gt;val&lt;/span&gt; query = job.start()\nquery.awaitTermination()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"39\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-39\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-39\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-39.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"queues\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/structured-streaming.html#queues\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Streaming YTsaurus queues&lt;/span&gt;&lt;/a&gt;Streaming YTsaurus queues&lt;/h2&gt;\n&lt;p&gt;YTsaurus has its own implementation of &lt;a href=\"user-guide/dynamic-tables/queues.html\"&gt;queues&lt;/a&gt; based on ordered dynamic tables.&lt;/p&gt;\n&lt;p&gt;Currently, the SPYT cluster can operate only on data located on the same YTsaurus cluster. This limitation also applies to queues and consumers.&lt;/p&gt;\n&lt;p&gt;Before starting a streaming task, create and configure queues as described in the &lt;a href=\"user-guide/dynamic-tables/queues.html#api\"&gt;documentation&lt;/a&gt;. For read tasks, create queue and consumer tables, then register the consumers. Streaming results are written to an ordered dynamic table that is created and mounted in advance.&lt;/p&gt;\n&lt;p&gt;After processing a chunk of data, a new offset is committed to notify the input table to delete unnecessary rows.&lt;/p&gt;\n&lt;p&gt;When using queues for reading and writing, at-least-once guarantees can be enabled.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Listing 2 — Example of using queues in Scala&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs scala\"&gt;&lt;span class=\"hljs-keyword\"&gt;val&lt;/span&gt; numbers = spark\n  .readStream\n  .format(&lt;span class=\"hljs-string\"&gt;\"yt\"&lt;/span&gt;)\n  .option(&lt;span class=\"hljs-string\"&gt;\"consumer_path\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/spark-streaming/sample02/consumer\"&lt;/span&gt;)\n  .load(&lt;span class=\"hljs-string\"&gt;\"//tmp/spark-streaming/sample02/queue\"&lt;/span&gt;)\n\n&lt;span class=\"hljs-keyword\"&gt;val&lt;/span&gt; job = numbers\n  .writeStream\n  .option(&lt;span class=\"hljs-string\"&gt;\"checkpointLocation\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"yt:///tmp/spark-streaming/sample02/checkpoints\"&lt;/span&gt;)\n  .trigger(&lt;span class=\"hljs-type\"&gt;ProcessingTime&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;2000&lt;/span&gt;))\n  .format(&lt;span class=\"hljs-string\"&gt;\"yt\"&lt;/span&gt;)\n  .option(&lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/spark-streaming/sample02/result\"&lt;/span&gt;)\n\n&lt;span class=\"hljs-keyword\"&gt;val&lt;/span&gt; query = job.start()\nquery.awaitTermination()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"61\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-61\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-61\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-61.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;small&gt;Listing 3 — Example of using queues in Python&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; pyspark.sql.functions &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; length\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; spyt &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; spark_session\n\n&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; spark_session() &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; spark:\n    df = spark \\\n        .readStream \\\n        .&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"yt\"&lt;/span&gt;) \\\n        .option(&lt;span class=\"hljs-string\"&gt;\"consumer_path\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/spark-streaming/sample02/consumer\"&lt;/span&gt;) \\\n        .load(&lt;span class=\"hljs-string\"&gt;\"//tmp/spark-streaming/sample02/queue\"&lt;/span&gt;)\n    df\\\n        .select(&lt;span class=\"hljs-string\"&gt;\"data\"&lt;/span&gt;) \\\n        .withColumn(&lt;span class=\"hljs-string\"&gt;'data_length'&lt;/span&gt;, length(&lt;span class=\"hljs-string\"&gt;\"data\"&lt;/span&gt;)) \\\n        .writeStream \\\n        .&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"yt\"&lt;/span&gt;) \\\n        .option(&lt;span class=\"hljs-string\"&gt;\"checkpointLocation\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"yt:///tmp/spark-streaming/sample02/checkpoints\"&lt;/span&gt;) \\\n        .option(&lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/spark-streaming/sample02/result\"&lt;/span&gt;) \\\n        .start().awaitTermination()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"65\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-65\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-65\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-65.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"streaming-query-processing-mechanism\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/structured-streaming.html#streaming-query-processing-mechanism\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mechanism of microbatch processing in Streaming Query&lt;/span&gt;&lt;/a&gt;Mechanism of microbatch processing in Streaming Query&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Initializing a batch&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;The driver runs processing of the new &lt;strong&gt;#N&lt;/strong&gt; microbatch:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;It retrieves current offsets (lowerIndex) for all partitions in the queue.&lt;/li&gt;\n&lt;li&gt;It calculates upperIndex for each partition using the formula:\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;upperIndex = min(\n    lowerIndex + max_rows_per_partition,\n    current_end_of_queue\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"87\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-87\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-87\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-87.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Comparing lowerIndex and upperIndex&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;For each partition:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;If lowerIndex &amp;lt; upperIndex:\n&lt;ul&gt;\n&lt;li&gt;The &lt;a href=\"user-guide/dynamic-tables/queues.html#rabota-s-konsyumerom\"&gt;advanceConsumer&lt;/a&gt; method is executed to commit offsets of batch &lt;code&gt;#N-1&lt;/code&gt; in the consumer.&lt;/li&gt;\n&lt;li&gt;Tasks for executors are created.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Otherwise: processing is skipped (the batch is empty).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Running on executors&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;For its partition, each executor:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Writes data using the &lt;a href=\"user-guide/dynamic-tables/queues.html#chtenie-dannyh\"&gt;pullConsumer&lt;/a&gt; method.&lt;/li&gt;\n&lt;li&gt;Applies transformations (if any).&lt;/li&gt;\n&lt;li&gt;Writes data to an output table.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Creating checkpoint files on Cypress for batch #N&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;A file in the &lt;code&gt;offsets&lt;/code&gt; directory.&lt;/li&gt;\n&lt;li&gt;A file in the &lt;code&gt;commits&lt;/code&gt; directory.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;New iteration&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The system proceeds to batch &lt;code&gt;#N+1&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Then it repeats steps 1–3 with new offsets.&lt;/li&gt;\n&lt;li&gt;The commit of batch &lt;strong&gt;#N&lt;/strong&gt; is only invoked at stage 2 of the &lt;code&gt;#N+1&lt;/code&gt; iteration, provided there are available rows.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"streaming-offsets\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/structured-streaming.html#streaming-offsets\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with offsets&lt;/span&gt;&lt;/a&gt;Working with offsets&lt;/h2&gt;\n&lt;p&gt;Offsets are currently stored in two places:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;In &lt;a href=\"user-guide/data-processing/spyt/structured-streaming#checkpoint-location\"&gt;checkpoint files&lt;/a&gt; automatically created by Spark in the directory.&lt;/li&gt;\n&lt;li&gt;In the \"consumer\" table.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"defining-lowerindex-and-upperindex-for-each-partition\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/structured-streaming.html#defining-lowerindex-and-upperindex-for-each-partition\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Defining lowerIndex and upperIndex for each partition&lt;/span&gt;&lt;/a&gt;Defining lowerIndex and upperIndex for each partition&lt;/h3&gt;\n&lt;ol&gt;\n&lt;li&gt;Spark tries to find the last checkpoint file on Cypress.\n&lt;ul&gt;\n&lt;li&gt;If there is one, the offset structure containing &lt;code&gt;lowerIndex&lt;/code&gt; for each partition is retrieved.&lt;/li&gt;\n&lt;li&gt;If not, offsets are retrieved from the consumer.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;For each partition of the input queue, the maximum $row_index is retrieved — &lt;code&gt;upper_row_index&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;The &lt;code&gt;max_rows_per_partition&lt;/code&gt; option is analyzed:\n&lt;ul&gt;\n&lt;li&gt;If it's set, &lt;code&gt;upperIndex&lt;/code&gt; is calculated for each partition using the formula:\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;upperIndex = min(\n    lowerIndex + max_rows_per_partition,\n    upper_row_index\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"241\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-241\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-241\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-241.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"possible-offset-misalignment\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/structured-streaming.html#possible-offset-misalignment\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Possible offset misalignment&lt;/span&gt;&lt;/a&gt;Possible offset misalignment&lt;/h3&gt;\n&lt;p&gt;Due to the late &lt;code&gt;commit&lt;/code&gt; method call implemented in Spark, offsets in the consumer may be one batch behind offsets in checkpoint files if:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Batch &lt;strong&gt;#N&lt;/strong&gt; has been fully processed, but batch &lt;code&gt;#N+1&lt;/code&gt; hasn't been initialized yet.&lt;/li&gt;\n&lt;li&gt;Batch &lt;code&gt;#N+1&lt;/code&gt; is empty and won't be processed because there are no (or none left) unread rows in the input queue.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Then the offsets in the last checkpoint file will correspond to &lt;code&gt;upperIndex&lt;/code&gt; of batch &lt;strong&gt;#N&lt;/strong&gt;, while the &lt;code&gt;offset&lt;/code&gt; field in the consumer will correspond to &lt;code&gt;upperIndex&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"exactly-once\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/structured-streaming.html#exactly-once\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Achieving exactly-once semantics&lt;/span&gt;&lt;/a&gt;Achieving exactly-once semantics&lt;/h2&gt;\n&lt;p&gt;Spark Structured Streaming running over YTsaurus queues provides the &lt;code&gt;at-least-once&lt;/code&gt; guarantee.&lt;/p&gt;\n&lt;p&gt;In some scenarios, it's possible to achieve the &lt;code&gt;exactly-once&lt;/code&gt; guarantee if two conditions are met simultaneously:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Stateless processing&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Such operations include:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Simple transformations (&lt;code&gt;select&lt;/code&gt;, &lt;code&gt;filter&lt;/code&gt;, &lt;code&gt;withColumn&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;Projections and column renaming.&lt;/li&gt;\n&lt;li&gt;Any operations where each output row is &lt;strong&gt;strictly dependent on a single input row&lt;/strong&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Injective mapping&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;The following requirements must be met:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Each input row is converted to &lt;strong&gt;no more than one output row&lt;/strong&gt;.&lt;/li&gt;\n&lt;li&gt;No operations generate duplicates. For example, &lt;code&gt;join&lt;/code&gt;, &lt;code&gt;groupBy&lt;/code&gt;, &lt;code&gt;union&lt;/code&gt; without deduplication must not be used.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;strong&gt;Required actions:&lt;/strong&gt;&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Set the &lt;code&gt;include_service_columns&lt;/code&gt; option to &lt;code&gt;true&lt;/code&gt;. With this option, the streaming DataFrame will include the &lt;code&gt;__spyt_streaming_src_tablet_index&lt;/code&gt; and &lt;code&gt;__spyt_streaming_src_row_index&lt;/code&gt; columns, which correspond to the &lt;code&gt;$tablet_index&lt;/code&gt; and&lt;code&gt;$row_index&lt;/code&gt; columns of the queue being read.&lt;/li&gt;\n&lt;li&gt;Create a sorted dynamic output table with the &lt;code&gt;__spyt_streaming_src_tablet_index&lt;/code&gt; and &lt;code&gt;__spyt_streaming_src_row_index&lt;/code&gt; key columns. You can assign these columns different names in the output table, but in that case, you also need to rename them in the DataFrame (see the example below).&lt;/li&gt;\n&lt;li&gt;If reads originate from more than one queue, you can add a key column containing a unique ID of the source queue to the DataFrame (using &lt;code&gt;withColumn()&lt;/code&gt;) and to the output table. For example, you can use the queue's ID or path (see the example below).&lt;/li&gt;\n&lt;li&gt;Achieve at-most-once by ensuring that\n&lt;ul&gt;\n&lt;li&gt;All pairs of the &lt;code&gt;$tablet_index&lt;/code&gt; and &lt;code&gt;$row_index&lt;/code&gt; column values are unique within each queue.&lt;/li&gt;\n&lt;li&gt;In the sorted dynamic output table, &lt;code&gt;__spyt_streaming_src_tablet_index&lt;/code&gt; and &lt;code&gt;__spyt_streaming_src_row_index&lt;/code&gt; are key columns.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;As a result, &lt;code&gt;at-least-once&lt;/code&gt; + &lt;code&gt;at-most-once&lt;/code&gt; = &lt;code&gt;exactly-once&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Remember that using a sorted dynamic table instead of an ordered one adds sorting overhead. Because of this, if you don't require at-most-once semantics, it's preferable to write to ordered dynamic tables.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;small&gt;Listing 4 — Using the include_service_columns option&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; spyt\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; pyspark.sql &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; SparkSession\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; pyspark.sql.functions &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; lit\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; YtClient\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; os\n\n\nyt = YtClient(proxy=&lt;span class=\"hljs-string\"&gt;\"hume.yt.yandex.net\"&lt;/span&gt;, token=os.environ[&lt;span class=\"hljs-string\"&gt;'YT_SECURE_VAULT_YT_TOKEN'&lt;/span&gt;])\nspark = SparkSession.builder.appName(&lt;span class=\"hljs-string\"&gt;'streaming example'&lt;/span&gt;).getOrCreate()\n\nschema = [\n    {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"src_queue_path\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"string\"&lt;/span&gt;},\n    {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"tablet_idx\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"int64\"&lt;/span&gt;},\n    {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"row_idx\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"int64\"&lt;/span&gt;},\n    {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"some_data\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"string\"&lt;/span&gt;},\n]\nyt.create(&lt;span class=\"hljs-string\"&gt;\"table\"&lt;/span&gt;, result_table_path, recursive=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;, attributes={&lt;span class=\"hljs-string\"&gt;\"dynamic\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"true\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"schema\"&lt;/span&gt;: schema})\nyt.mount_table(result_table_path, sync=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n\ndf = spark \\\n  .readStream \\\n  .&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"yt\"&lt;/span&gt;) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"consumer_path\"&lt;/span&gt;, consumer_path) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"include_service_columns\"&lt;/span&gt;, &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;) \\\n  .load(queue_path)\n  .withColumnRenamed(&lt;span class=\"hljs-string\"&gt;\"__spyt_streaming_src_tablet_index\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"tablet_idx\"&lt;/span&gt;)\n  .withColumnRenamed(&lt;span class=\"hljs-string\"&gt;\"__spyt_streaming_src_row_index\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"row_idx\"&lt;/span&gt;)\n  .withColumn(&lt;span class=\"hljs-string\"&gt;\"src_queue_path\"&lt;/span&gt;, lit(queue_path))\n\nquery = df\\\n  .writeStream \\\n  .outputMode(&lt;span class=\"hljs-string\"&gt;\"append\"&lt;/span&gt;) \\\n  .&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"yt\"&lt;/span&gt;) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"checkpointLocation\"&lt;/span&gt;, checkpoints_path) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt;, result_table_path) \\\n  .start()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"376\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-376\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-376\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-376.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"rows-limit\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/structured-streaming.html#rows-limit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Configuring the number of rows per batch&lt;/span&gt;&lt;/a&gt;Configuring the number of rows per batch&lt;/h2&gt;\n&lt;p&gt;By default, Spark attempts to read all available rows in the queue as part of a single streaming microbatch. If the queue contains a large number of unread rows, this will lead to &lt;code&gt;OutOfMemoryError&lt;/code&gt; on the executors. There are two ways to set the microbatch row limit:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The &lt;code&gt;max_rows_per_partition&lt;/code&gt; option sets the maximum number of rows that can be read from a single queue partition within a single batch. For example:\n&lt;ul&gt;\n&lt;li&gt;If the queue consists of three partitions and &lt;code&gt;max_rows_per_partition&lt;/code&gt; is set to 1000, no more than 1000 rows will be read from each partition, resulting in a total of no more than 3000 rows per batch. Partitions are evenly distributed among the executors. If there are at least as many executors as there are partitions, each executor processes no more than one partition.&lt;/li&gt;\n&lt;li&gt;In the simplest case where the queue contains one partition, &lt;code&gt;max_rows_per_partition&lt;/code&gt; effectively sets the row limit per batch.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;The &lt;code&gt;spark.yt.write.dynBatchSize&lt;/code&gt; configuration parameter sets the maximum number of rows that can be written to a dynamic table in a single &lt;code&gt;modifyRows&lt;/code&gt; call. For example:\n&lt;ul&gt;\n&lt;li&gt;If the executor read 1000 rows, and &lt;code&gt;spark.yt.write.dynBatchSize&lt;/code&gt; is set to 100, &lt;code&gt;ModifyRowsRequest&lt;/code&gt; containing 100 rows will be generated 10 times sequentially.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;small&gt;Listing 5 — Using the max_rows_per_partition option&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;spark = SparkSession.builder.appName(&lt;span class=\"hljs-string\"&gt;'streaming example'&lt;/span&gt;) \\\n   .config(&lt;span class=\"hljs-string\"&gt;\"spark.yt.write.dynBatchSize\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;100&lt;/span&gt;) \\\n   .getOrCreate()\n\ndf = spark \\\n  .readStream \\\n  .&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"yt\"&lt;/span&gt;) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"consumer_path\"&lt;/span&gt;, consumer_path) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"max_rows_per_partition\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;1000&lt;/span&gt;) \\\n  .load(queue_path)\n\nquery = df\\\n  .writeStream \\\n  .outputMode(&lt;span class=\"hljs-string\"&gt;\"append\"&lt;/span&gt;) \\\n  .&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"yt\"&lt;/span&gt;) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"checkpointLocation\"&lt;/span&gt;, checkpoints_path) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt;, result_table_path) \\\n  .start()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"417\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-417\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-417\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-417.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"type-v3\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/structured-streaming.html#type-v3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Composite types&lt;/span&gt;&lt;/a&gt;Composite types&lt;/h2&gt;\n&lt;p&gt;To process &lt;a href=\"user-guide/storage/data-types.html\"&gt;composite data types&lt;/a&gt; using streaming, enable the &lt;code&gt;parsing_type_v3&lt;/code&gt; and &lt;code&gt;write_type_v3&lt;/code&gt; options, same as for batch jobs.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Listing 6 — Processing composite types in Structured Streaming&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;df = spark \\\n  .readStream \\\n  .&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"yt\"&lt;/span&gt;) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"consumer_path\"&lt;/span&gt;, consumer_path) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"parsing_type_v3\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"true\"&lt;/span&gt;) \\\n  .load(queue_path)\n\nquery = df\\\n  .writeStream \\\n  .outputMode(&lt;span class=\"hljs-string\"&gt;\"append\"&lt;/span&gt;) \\\n  .&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"yt\"&lt;/span&gt;) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"write_type_v3\"&lt;/span&gt;, &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"checkpointLocation\"&lt;/span&gt;, checkpoints_path) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt;, result_table_path) \\\n  .start()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"427\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-427\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-427\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-427.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"streaming-required-params\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/structured-streaming.html#streaming-required-params\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Spark Structured Streaming parameters set via Spark methods&lt;/span&gt;&lt;/a&gt;Spark Structured Streaming parameters set via Spark methods&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Parameter&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;th&gt;Mandatory&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;format&lt;/td&gt;\n&lt;td&gt;Format. Specified separately for readStream and writeStream&lt;/td&gt;\n&lt;td&gt;yes (for Structured Streaming using dynamic tables, specify the &lt;code&gt;yt&lt;/code&gt; value)&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;load&lt;/td&gt;\n&lt;td&gt;Input queue&lt;/td&gt;\n&lt;td&gt;yes&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;outputMode&lt;/td&gt;\n&lt;td&gt;Write mode&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;\"append\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"streaming-configs\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/structured-streaming.html#streaming-configs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Spark session parameters for the streaming configuration&lt;/span&gt;&lt;/a&gt;Spark session parameters for the streaming configuration&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Option&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;th&gt;Mandatory&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;spark.yt.write.dynBatchSize&lt;/td&gt;\n&lt;td&gt;Maximum number of rows in a single dynamic table write operation&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;50000&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"streaming-options\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/structured-streaming.html#streaming-options\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Options&lt;/span&gt;&lt;/a&gt;Options&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Option&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;th&gt;Mandatory&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;consumer_path&lt;/td&gt;\n&lt;td&gt;Path to the consumer table&lt;/td&gt;\n&lt;td&gt;yes&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;checkpointLocation&lt;/td&gt;\n&lt;td&gt;Path to the directory containing checkpoint files&lt;/td&gt;\n&lt;td&gt;yes&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;path&lt;/td&gt;\n&lt;td&gt;Path to the output table&lt;/td&gt;\n&lt;td&gt;yes&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;include_service_columns&lt;/td&gt;\n&lt;td&gt;Add the &lt;code&gt;$tablet_index&lt;/code&gt; and &lt;code&gt;$row_index&lt;/code&gt; columns of the queue being read to the DataFrame&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_rows_per_partition&lt;/td&gt;\n&lt;td&gt;Maximum number of rows read from a queue partition as part of a single batch&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;∞&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;parsing_type_v3&lt;/td&gt;\n&lt;td&gt;Read composite types with types preserved&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;write_type_v3&lt;/td&gt;\n&lt;td&gt;Write composite types with types preserved&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"compatibility-matrix\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/structured-streaming.html#compatibility-matrix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Compatibility matrix&lt;/span&gt;&lt;/a&gt;Compatibility matrix&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Functionality&lt;/th&gt;\n&lt;th&gt;Minimum SPYT version&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;YTsaurus checkpoint storage&lt;/td&gt;\n&lt;td&gt;1.77.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Structured Streaming over the YTsaurus Queue API&lt;/td&gt;\n&lt;td&gt;1.77.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Support for composite data types&lt;/td&gt;\n&lt;td&gt;2.6.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Max_rows_per_partition option&lt;/td&gt;\n&lt;td&gt;2.6.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Include_service_columns option&lt;/td&gt;\n&lt;td&gt;2.6.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Spark.yt.write.dynBatchSize parameter&lt;/td&gt;\n&lt;td&gt;Starting from version 2.6.5, became configurable for streaming (previously, was fixed at 50000)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"monitoring\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/structured-streaming.html#monitoring\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Monitoring in the Spark webUI&lt;/span&gt;&lt;/a&gt;Monitoring in the Spark webUI&lt;/h2&gt;\n&lt;p&gt;The Jobs, Stages, and SQL/Dataframes pages, similar to those in standard Spark applications, serve to monitor jobs, execution stages, and query plans.&lt;/p&gt;\n&lt;p&gt;The Environment page is used to view all configuration parameters of the Spark session and certain metrics.&lt;/p&gt;\n&lt;p&gt;On the Executors page, you can see the number of active, failed, and completed tasks and figure out how optimally the executor cores are loaded. Additionally, you can check memory usage statistics. Occasionally, when dealing with memory leaks, you can go to Thread Dump or Heap Histogram to identify the cause for them.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/spyt-streaming-monitoring-executors.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;p&gt;For streaming processes, the Structured Streaming page appears in the webUI by default. Here you can view statistics for active and completed streams. For example, it may be useful to check the error that caused the Streaming Query to terminate.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/spyt-streaming-monitoring-streaming.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;p&gt;By clicking the Run ID value, you can view detailed statistics for a specific Streaming Query.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/spyt-streaming-monitoring-streaming-query-stats.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;h2 id=\"best-practices\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/structured-streaming.html#best-practices\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Best practices&lt;/span&gt;&lt;/a&gt;Best practices&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Set up the &lt;code&gt;max_rows_per_partition&lt;/code&gt; option and the &lt;code&gt;spark.yt.write.dynBatchSize&lt;/code&gt; config properly to limit the size of rows processed per batch. Don't make them too large to avoid the risk of getting &lt;code&gt;OutOfMemoryError&lt;/code&gt;. However, don't make them too small, as this will result in batches being created too frequently, significantly increasing the load on YTsaurus master and proxy servers.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Set a small value for the &lt;code&gt;spark.sql.streaming.minBatchesToRetain&lt;/code&gt; config. This parameter defines the minimum number of recent batches whose metadata must be stored. These are files in the checkpoint directory on Cypress and objects in the internal driver structures. The default value for this config is 100. For streaming without stateful transformations, just set &lt;code&gt;--conf spark.sql.streaming.minBatchesToRetain=2&lt;/code&gt;. This helps you save chunks on Cypress and reduce driver memory usage.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Set the following configuration parameters when creating a Spark session:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;.config(\"spark.streaming.stopGracefullyOnShutdown\", True)&lt;/code&gt;: Properly complete processing of all created batches and clean up resources prior to streaming shutdown.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;.config(\"spark.streaming.stopGracefullyOnShutdown.timeout\", ...)&lt;/code&gt;: Proper shutdown timeout in milliseconds.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;.config(\"spark.sql.adaptive.enabled\", False)&lt;/code&gt;: Standard adaptive execution doesn't work for streaming. Disable it.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;.config(\"spark.sql.streaming.adaptiveExecution.enabled\", True)&lt;/code&gt;: Enable special adaptive execution for streaming jobs.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Configure memory allocation using the &lt;code&gt;spark.memory.fraction&lt;/code&gt; and &lt;code&gt;spark.memory.storageFraction&lt;/code&gt; parameters, for example:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;.config(\"spark.memory.fraction\", 0.5)&lt;/code&gt;: 50% of memory for execution, 50% for storage.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;.config(\"spark.memory.storageFraction\", 0.2)&lt;/code&gt;: allocate 20% of memory for cache and 80% — for data processing (optimal for non-caching scenarios).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/spyt/structured-streaming.md","sourcePath":"en/user-guide/data-processing/spyt/structured-streaming.md"},"headings":[{"title":"General scheme of Spark Structured Streaming in SPYT","href":"en/user-guide/data-processing/spyt/structured-streaming.html#general-scheme-of-spark-structured-streaming-in-spyt","level":2,"items":[{"title":"Concepts","href":"en/user-guide/data-processing/spyt/structured-streaming.html#concepts","level":3}]},{"title":"Checkpoint storage","href":"en/user-guide/data-processing/spyt/structured-streaming.html#checkpoint-location","level":2},{"title":"Streaming YTsaurus queues","href":"en/user-guide/data-processing/spyt/structured-streaming.html#queues","level":2},{"title":"Mechanism of microbatch processing in Streaming Query","href":"en/user-guide/data-processing/spyt/structured-streaming.html#streaming-query-processing-mechanism","level":2},{"title":"Working with offsets","href":"en/user-guide/data-processing/spyt/structured-streaming.html#streaming-offsets","level":2,"items":[{"title":"Defining lowerIndex and upperIndex for each partition","href":"en/user-guide/data-processing/spyt/structured-streaming.html#defining-lowerindex-and-upperindex-for-each-partition","level":3},{"title":"Possible offset misalignment","href":"en/user-guide/data-processing/spyt/structured-streaming.html#possible-offset-misalignment","level":3}]},{"title":"Achieving exactly-once semantics","href":"en/user-guide/data-processing/spyt/structured-streaming.html#exactly-once","level":2},{"title":"Configuring the number of rows per batch","href":"en/user-guide/data-processing/spyt/structured-streaming.html#rows-limit","level":2},{"title":"Composite types","href":"en/user-guide/data-processing/spyt/structured-streaming.html#type-v3","level":2},{"title":"Spark Structured Streaming parameters set via Spark methods","href":"en/user-guide/data-processing/spyt/structured-streaming.html#streaming-required-params","level":2},{"title":"Spark session parameters for the streaming configuration","href":"en/user-guide/data-processing/spyt/structured-streaming.html#streaming-configs","level":2},{"title":"Options","href":"en/user-guide/data-processing/spyt/structured-streaming.html#streaming-options","level":2},{"title":"Compatibility matrix","href":"en/user-guide/data-processing/spyt/structured-streaming.html#compatibility-matrix","level":2},{"title":"Monitoring in the Spark webUI","href":"en/user-guide/data-processing/spyt/structured-streaming.html#monitoring","level":2},{"title":"Best practices","href":"en/user-guide/data-processing/spyt/structured-streaming.html#best-practices","level":2}],"title":"Structured Streaming"},"router":{"pathname":"en/user-guide/data-processing/spyt/structured-streaming","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
