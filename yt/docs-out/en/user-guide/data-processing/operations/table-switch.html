        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Operations can have several input and output tables. This section describes how to switch reading between them.&lt;/p&gt;\n&lt;p&gt;You can get data about which table an entry came from, and select which table to send it to, in the operation's &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt; and &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt; user code. This is done using &lt;strong&gt;&lt;a href=\"en/user-guide/data-processing/operations/table-switch.html#descriptors\"&gt;descriptors&lt;/a&gt;&lt;/strong&gt; or &lt;strong&gt;&lt;a href=\"en/user-guide/data-processing/operations/table-switch.html#switches\"&gt;table switches&lt;/a&gt;&lt;/strong&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;A user has several ways to specify which table a string is to be sent to: you can indicate the table's descriptor, or use a switch.&lt;/p&gt;\n&lt;p&gt;There is no technical restriction on using both of these mechanisms simultaneously, but doing so in practice is &lt;strong&gt;not recommended&lt;/strong&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;When no mapper is specified for a &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt; type operation, there will be no data about which input tables entries came from at the reducer input.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"descriptors\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/table-switch.html#descriptors\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Descriptors&lt;/span&gt;&lt;/a&gt;Descriptors&lt;/h2&gt;\n\n&lt;p&gt;There are &lt;strong&gt;descriptor numbering rules&lt;/strong&gt; that enable a user code (job) to write string X in table 0, and string Y in table 1.&lt;/p&gt;\n&lt;p&gt;When there's one output table, the job writes all entries and descriptor 1 (in stdout).&lt;br /&gt;\nWhen there are multiple output tables, the numbering rules are used. The formula 3k+1, where k is the index of the output table, begins with 0.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Table 0 - descriptor 1.&lt;/li&gt;\n&lt;li&gt;Table 1 - descriptor 4.&lt;/li&gt;\n&lt;li&gt;Table 2 - descriptor 7.&lt;/li&gt;\n&lt;li&gt;...&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"switches\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/table-switch.html#switches\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Table switches&lt;/span&gt;&lt;/a&gt;Table switches&lt;/h2&gt;\n&lt;p&gt;The correspondence between descriptor numbers and output tables can be changed while working with a job, by using &lt;strong&gt;table switches&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;The schema of configuring switches for input tables can be read in the &lt;a href=\"user-guide/storage/io-configuration.html\"&gt;Input/output settings&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;The switches form depends on the format of output data.&lt;/p&gt;\n&lt;h3 id=\"yson\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/table-switch.html#yson\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YSON&lt;/span&gt;&lt;/a&gt;YSON&lt;/h3&gt;\n&lt;p&gt;In &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON&lt;/a&gt;, in the entry stream, you might encounter an &lt;a href=\"user-guide/storage/yson.html#entity\"&gt;entity&lt;/a&gt; with attributes for both input and output tables.  These are control inputs that are built into the datastream. For example: &lt;code&gt;table_index=N&lt;/code&gt;, where N is an integer. This command \"switches\" the stream in such a way that subsequent entries are connected to another table with index N. This is true for both input and output tables.&lt;/p&gt;\n&lt;p&gt;Suppose our operation has 2 output tables at the output.&lt;br /&gt;\nBy default, to send data to a table with index 0 we must enter it in descriptor 1, and to be sent to table 1 it must be entered in descriptor 4.&lt;br /&gt;\nSuppose the job has entered the following sequence of entries in descriptor 4:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;{a=1};\n&amp;lt;table_index=0&amp;gt;#;\n{b=2};\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"82\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-82\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-82\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-82.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;In that case, the entry &lt;code&gt;a=1&lt;/code&gt; goes into table 1, and entry &lt;code&gt;b=2&lt;/code&gt; goes into table 0. Both descriptors will then write to table 0.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The order of strings when writing to one table through two descriptors is not established.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Switches work independently for each output descriptor.&lt;/p&gt;\n&lt;p&gt;Suppose descriptor N corresponds to table X. When you write 10 lines without switches to descriptor N, they will go into table X in the exact order in which they were written in the descriptor. There will be no other strings between them.&lt;/p&gt;\n&lt;p&gt;Suppose descriptors N and M correspond to table X. When you write 5 strings in descriptor N and 5 strings in descriptor M, all strings will go into table X, but their order will be unknown. Even if the user code writes only to descriptor N first, and only then to descriptor M, it cannot be guaranteed that the strings from N will appear in table X before the strings from M, or that they will not be shuffled.&lt;/p&gt;\n&lt;h3 id=\"json\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/table-switch.html#json\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;JSON&lt;/span&gt;&lt;/a&gt;JSON&lt;/h3&gt;\n&lt;p&gt;Works the same as &lt;a href=\"en/user-guide/data-processing/operations/table-switch.html#yson\"&gt;YSON&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Table switch:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;'&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"$value\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;&lt;span class=\"hljs-keyword\"&gt;null&lt;/span&gt;&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"$attributes\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"table_index\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\\n'\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"114\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-114\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-114\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-114.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"dsv\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/table-switch.html#dsv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DSV&lt;/span&gt;&lt;/a&gt;DSV&lt;/h3&gt;\n&lt;p&gt;Strictly speaking, the format and its derivatives do not support switches as a separate control input in the datastream. Each data entry must contain information about the table index.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"user-guide/storage/formats.html#dsv\"&gt;DSV&lt;/a&gt; does not support switching of input tables.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;When the &lt;code&gt;enable_table_index&lt;/code&gt; format option is enabled each line of an input table will be supplemented by a command window containing the table index. By default, the command field is called &lt;code&gt;@table_index&lt;/code&gt;. The name of the field can be changed via the &lt;code&gt;table_index_column&lt;/code&gt; format option.&lt;/p&gt;\n&lt;p&gt;All lines from the &lt;code&gt;//path/to/table&lt;/code&gt; table, which was numbered N in the list of the operation's input tables, will have the same value in their &lt;code&gt;@table_index&lt;/code&gt; field, equal to N.&lt;/p&gt;\n&lt;h3 id=\"schemaful_dsv\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/table-switch.html#schemaful_dsv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SCHEMAFUL_DSV&lt;/span&gt;&lt;/a&gt;SCHEMAFUL_DSV&lt;/h3&gt;\n&lt;p&gt;When installing the &lt;code&gt;enable_table_index=true&lt;/code&gt; option for tables in &lt;a href=\"user-guide/storage/formats.html#schemaful_dsv\"&gt;SCHEMAFUL_DSV&lt;/a&gt; format, the table index will be recorded in all lines of the table with the first field, before the schema columns.&lt;/p&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/table-switch.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-comment\"&gt;# -*- coding: utf-8 -*-&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\n\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; datetime &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; datetime\n\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;parse_time&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;time_str&lt;/span&gt;):\n    &lt;span class=\"hljs-string\"&gt;\"2012-10-19T11:22:58.190448Z\"&lt;/span&gt;\n    &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; datetime.strptime(time_str, &lt;span class=\"hljs-string\"&gt;\"%Y-%m-%dT%H:%M:%S.%fZ\"&lt;/span&gt;)\n\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;get_duration&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;rowA, rowB&lt;/span&gt;):\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; rowA[&lt;span class=\"hljs-string\"&gt;\"event_type\"&lt;/span&gt;] == &lt;span class=\"hljs-string\"&gt;\"job_completed\"&lt;/span&gt;:\n        rowA, rowB = rowB, rowA\n    delta = parse_time(rowB[&lt;span class=\"hljs-string\"&gt;\"timestamp\"&lt;/span&gt;]) - parse_time(rowA[&lt;span class=\"hljs-string\"&gt;\"timestamp\"&lt;/span&gt;])\n    &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; delta.total_seconds() + (delta.microseconds / &lt;span class=\"hljs-number\"&gt;1000000.0&lt;/span&gt;)\n\n&lt;span class=\"hljs-comment\"&gt;# By default the map-function accepts one entry for input.&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# Any function run as an operation must be a generator.&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;filter_event_type&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;row&lt;/span&gt;):\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; row.get(&lt;span class=\"hljs-string\"&gt;\"event_type\"&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; [&lt;span class=\"hljs-string\"&gt;\"job_started\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"job_completed\"&lt;/span&gt;]:\n        &lt;span class=\"hljs-keyword\"&gt;yield&lt;/span&gt; row\n\n&lt;span class=\"hljs-comment\"&gt;# In the event of a reduce-function, a key is sent to the input (this is a map from the key columns to their value), as well as a list of entries.&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# The key columns of each entry are equal to that which lies in the key&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;calculate_duration&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;key, rows&lt;/span&gt;):\n    rows = &lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(rows)\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;len&lt;/span&gt;(rows) == &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;:\n        &lt;span class=\"hljs-keyword\"&gt;yield&lt;/span&gt; {&lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt;: key[&lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt;], &lt;span class=\"hljs-string\"&gt;\"duration\"&lt;/span&gt;: get_duration(*rows)}\n    &lt;span class=\"hljs-keyword\"&gt;else&lt;/span&gt;:\n        &lt;span class=\"hljs-keyword\"&gt;assert&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;len&lt;/span&gt;(rows) == &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n        row = rows[&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;]\n        &lt;span class=\"hljs-comment\"&gt;# You can indicate the output table number via the special field&lt;/span&gt;\n        row[&lt;span class=\"hljs-string\"&gt;\"@table_index\"&lt;/span&gt;] = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n        &lt;span class=\"hljs-keyword\"&gt;yield&lt;/span&gt; row\n\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; __name__ == &lt;span class=\"hljs-string\"&gt;\"__main__\"&lt;/span&gt;:\n    yt.config[&lt;span class=\"hljs-string\"&gt;\"tabular_data_format\"&lt;/span&gt;] = yt.JsonFormat(control_attributes_mode=&lt;span class=\"hljs-string\"&gt;\"row_fields\"&lt;/span&gt;)\n    yt.run_map_reduce(filter_event_type, calculate_duration,\n                      &lt;span class=\"hljs-string\"&gt;\"//tmp/forbeginners/event_log\"&lt;/span&gt;,\n                      [&lt;span class=\"hljs-string\"&gt;\"//tmp/forbeginners/durations\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/forbeginners/filtered\"&lt;/span&gt;],\n                      reduce_by=&lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"146\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-146\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-146\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-146.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;An example of switching between output tables with a &lt;code&gt;table_index&lt;/code&gt; with &lt;code&gt;control_attributes_mode=\"iterator\"&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\n\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; random\n\n&lt;span class=\"hljs-meta\"&gt;@yt.aggregator&lt;/span&gt;\n&lt;span class=\"hljs-meta\"&gt;@yt.with_context&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;mapper&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;rows, context&lt;/span&gt;):\n    &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; row &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; rows:\n        input_table_index = context.table_index\n        &lt;span class=\"hljs-built_in\"&gt;sum&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n        &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; input_table_index == &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;:\n            &lt;span class=\"hljs-built_in\"&gt;sum&lt;/span&gt; += &lt;span class=\"hljs-built_in\"&gt;int&lt;/span&gt;(row[&lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;])\n        &lt;span class=\"hljs-keyword\"&gt;else&lt;/span&gt;:\n            &lt;span class=\"hljs-built_in\"&gt;sum&lt;/span&gt; -= &lt;span class=\"hljs-built_in\"&gt;int&lt;/span&gt;(row[&lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;])\n\n        output_table_index = random.randint(&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;)\n        &lt;span class=\"hljs-comment\"&gt;# The function enables you to create an entry that is the switch to the table with the specified index.&lt;/span&gt;\n        &lt;span class=\"hljs-keyword\"&gt;yield&lt;/span&gt; yt.create_table_switch(output_table_index)\n        &lt;span class=\"hljs-keyword\"&gt;yield&lt;/span&gt; {&lt;span class=\"hljs-string\"&gt;\"sum\"&lt;/span&gt;: &lt;span class=\"hljs-built_in\"&gt;sum&lt;/span&gt;}\n\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; __name__ == &lt;span class=\"hljs-string\"&gt;\"__main__\"&lt;/span&gt;:\n    yt.run_map(mapper,\n               [&lt;span class=\"hljs-string\"&gt;\"//tmp/input1\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/input2\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/input3\"&lt;/span&gt;],\n               [&lt;span class=\"hljs-string\"&gt;\"//tmp/output1\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/output2\"&lt;/span&gt;],\n               &lt;span class=\"hljs-built_in\"&
