        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;The Sort operation sorts the data from the selected tables and writes it to one output table. The Reduce operation can be run on a sorted table, and when data is read from the table (in particular, with specified ranges), it appears in a sorted form. It is also possible to use ranges by value, not only by table row number. The comparison is performed first by type, and then, if the types match, in the regular fashion (numbers by value, strings — lexicographically).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In the Sort operation, there are no guarantees when it comes to the order of rows with the same key value.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;One of the main sorting parameters is the number of partitions (&lt;code&gt;partition_count&lt;/code&gt;). This parameter is calculated in advance. Before the main jobs start, samples are read from the input table. These samples serve to calculate the key ranges for splitting input data into parts (based on &lt;code&gt;partition_count&lt;/code&gt;) of approximately the same size. Next, things proceed in the following phases:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Running first are partition jobs, which split all their input into partitions based on &lt;code&gt;partition_count&lt;/code&gt;, matching each row to a partition.&lt;/li&gt;\n&lt;li&gt;Second phase is sorting jobs, which sort the data from the partitions. Here, there are two options: if there is little data in the partition, it is sorted whole, and the partition processing ends there. If there is a lot of data and one job is not enough to sort it, sorting jobs are run on fixed-size parts of the partition before the transition to the third phase.&lt;/li&gt;\n&lt;li&gt;The third phase consists of merge jobs, which merge the sorted parts of large partitions.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;General parameters for all operation types are described in &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Operation options&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;The Sort operation supports the following additional options (default values, if set, are specified in brackets):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;sort_by&lt;/code&gt; — list of columns used for sorting (mandatory).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;input_table_paths&lt;/code&gt; — list of input tables with full paths (cannot be empty).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;output_table_path&lt;/code&gt; — full path to the output table.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;partition_count&lt;/code&gt;, &lt;code&gt;partition_data_size&lt;/code&gt; — options that specify how many partitions are to be made in the sorting process (these are recommendations).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;partition_job_count&lt;/code&gt;, &lt;code&gt;data_size_per_partition_job&lt;/code&gt; — specify how many partition jobs should be started (these are recommendations).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;intermediate_data_replication_factor&lt;/code&gt; (1) — replication factor for intermediate data.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;intermediate_data_account&lt;/code&gt; (intermediate) — account to whose quota the transaction's intermediate data goes.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;intermediate_compression_codec&lt;/code&gt; (lz4) — codec used for compressing intermediate data.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;intermediate_data_medium&lt;/code&gt; (&lt;code&gt;default&lt;/code&gt;) — type of &lt;a href=\"user-guide/storage/media.html\"&gt;medium&lt;/a&gt; storing chunks of intermediate data produced by sorting.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;partition_job_io, sort_job_io, merge_job_io&lt;/code&gt; — I/O settings for the respective job types; in the &lt;code&gt;merge_job_io&lt;/code&gt; option, the &lt;code&gt;table_writer&lt;/code&gt; section is added for all jobs that write to output tables.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;schema_inference_mode&lt;/code&gt; (auto) — schema definition mode. Possible values: auto, from_input, from_output. For more information, see the &lt;a href=\"user-guide/storage/static-schema.html#schema_inference\"&gt;Data schema&lt;/a&gt; section.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;samples_per_partition&lt;/code&gt; (1000) — number of keys for samples from the table for each partition (only available for dynamic tables).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;data_size_per_sorted_merge_job&lt;/code&gt; — determines the amount of input data for merge jobs (it is a recommendation).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;sort_locality_timeout&lt;/code&gt; (1 min) — time during which the scheduler waits for resources to free up on specific cluster nodes in order to start sorting all the parts of each partition on a node. This is necessary to ensure higher read locality in the course of the subsequent merging of sorted data.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;By default, &lt;code&gt;partition_count&lt;/code&gt; and &lt;code&gt;partition_job_count&lt;/code&gt; are calculated automatically based on the amount of input data so as to minimize the sorting time.&lt;/p&gt;\n&lt;h2 id=\"example-specification\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/sort.html#example-specification\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example specification&lt;/span&gt;&lt;/a&gt;Example specification&lt;/h2&gt;\n&lt;p&gt;Example of a Sort operation's specification:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;{\n  &lt;span class=\"hljs-string\"&gt;data_size_per_partition_job&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1000000&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;sort_by&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"subkey\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;input_table_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/input_table1\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"//tmp/input_table2\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;output_table_path&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"//tmp/sorted_output_table\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"120\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-120\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-120\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-120.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/operation
