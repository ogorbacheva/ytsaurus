        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section describes the process of merging chunks automatically at the operation output. We'll discuss the scope of this feature, its settings, and examples.&lt;/p&gt;\n&lt;h2 id=\"overview\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/automerge.html#overview\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Overview&lt;/span&gt;&lt;/a&gt;Overview&lt;/h2&gt;\n&lt;p&gt;One of the most popular data processing scenarios is filtering of a large table consisting of multiple chunks that uses the &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt; operation without special flags (Unordered Map) to produce a small result. Because of the underlying mechanism of such operations, filtering of a table of &lt;code&gt;n&lt;/code&gt; chunks can at worst create &lt;code&gt;n&lt;/code&gt; resulting chunks in the output, regardless of how small each of these chunks is. Such a behavior might devour the chunk quota on the user account. For more information on quoting, see &lt;a href=\"user-guide/storage/quotas.html\"&gt;Quotas&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;You can merge the resulting chunks using the &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt; operation, but this method is not convenient because it requires an additional operation. Still, however, in this case, you need to create a safety stock of quota for &lt;code&gt;n&lt;/code&gt; chunks to allow for bursts: this might be as high as hundreds of thousands of chunks for large tables (and the chunk quota is quite an expensive resource). That's why YTsaurus provides automated chunk merging at operation output. This merging is proactive in the sense that it merges output chunks before they have used up your quota.&lt;/p&gt;\n&lt;p&gt;Automatic merging has the following constraints:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;It's only available for Unordered &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt; and &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Sorted Reduce&lt;/a&gt; operations.&lt;/li&gt;\n&lt;li&gt;It works only with tables that accept &lt;strong&gt;unsorted data&lt;/strong&gt;. For the operations with sorted output, the situation is complicated by the fact that you cannot merge output chunks in an arbitrary order.&lt;/li&gt;\n&lt;li&gt;Unavailable if &lt;code&gt;row_count_limit&lt;/code&gt; is set. To learn more about this parameter, see &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Operation options&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If the operation goes beyond the constraints, the user has to run the &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt; operation manually.&lt;/p&gt;\n&lt;h2 id=\"mode\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/automerge.html#mode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Automated merging modes&lt;/span&gt;&lt;/a&gt;Automated merging modes&lt;/h2&gt;\n&lt;p&gt;Automated merging is set up using the &lt;code&gt;auto_merge&lt;/code&gt; section that needs to be added to the operation's specification. The section is a dict where the main parameter is the &lt;code&gt;mode&lt;/code&gt; key that can take upon the &lt;code&gt;disabled&lt;/code&gt;, &lt;code&gt;relaxed&lt;/code&gt;, &lt;code&gt;economy&lt;/code&gt;, &lt;code&gt;manual&lt;/code&gt; values that set different behaviors in the context of automated merging.&lt;/p&gt;\n&lt;h3 id=\"relaxed\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/automerge.html#relaxed\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Relaxed&lt;/span&gt;&lt;/a&gt;Relaxed&lt;/h3&gt;\n&lt;p&gt;The mode that's not attempting to save the quota in real time, but tries to get a table with reasonably sized chunks at the output. Actually, this method relieves the use of the need to run an Unordered Merge on the output table. However, it does not guarantee that the operation will run properly under a quota shortage.&lt;/p&gt;\n&lt;h3 id=\"economy\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/automerge.html#economy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Economy&lt;/span&gt;&lt;/a&gt;Economy&lt;/h3&gt;\n&lt;p&gt;The mode that optimizes the maximum quota usage by the operation. This mode is suitable for the operations that often hit the quota limit.&lt;/p&gt;\n&lt;p&gt;Under ideal circumstances, the chunk quota usage in the &lt;code&gt;economy&lt;/code&gt; mode can be evaluated as &lt;code&gt;4 * sqrt(n)&lt;/code&gt;, where &lt;code&gt;n&lt;/code&gt; is the number of chunks that you would have had in the output table without automated merging. Such a result is not guaranteed, it's only a best-effort behavior that requires, for example, that the quantities of chunks output by jobs are burst-free (one job wouldn't generate a thousand chunks at once). In this case, to filter a table of 100,000 chunks, you can safely do with a quota of a couple of thousand chunks.&lt;/p&gt;\n&lt;h3 id=\"manual\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/automerge.html#manual\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manual&lt;/span&gt;&lt;/a&gt;Manual&lt;/h3&gt;\n&lt;p&gt;The mode in which you can manually set up the automated merge behavior using the following parameters in the &lt;code&gt;auto_merge&lt;/code&gt; section:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;max_intermediate_chunk_count&lt;/code&gt;: The scheduler will try to maintain the specified constraint on the intermediate chunk quota. However, you could never maintain this limit exactly because of the internal mechanisms of chunk generation.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;chunk_count_per_merge_job&lt;/code&gt;: Defines the size of chunk portions that the scheduler will try to merge per job (without exceeding the limit of &lt;code&gt;desired_chunk_size&lt;/code&gt; in &lt;code&gt;job_io&lt;/code&gt; for Merge jobs; the default value is 1 GB).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;chunk_size_threshold&lt;/code&gt; is the limit that allows you to avoid merging the chunks whose size exceeds the given percentage of &lt;code&gt;desired_chunk_size&lt;/code&gt;. That is, only the chunks whose size is smaller than this percentage (10% by default) will be merged.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"disabled\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/automerge.html#disabled\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Disabled&lt;/span&gt;&lt;/a&gt;Disabled&lt;/h3&gt;\n&lt;p&gt;The mode with no automated merging. This mode is used by default.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The &lt;code&gt;economy&lt;/code&gt; mode (as well as the &lt;code&gt;manual&lt;/code&gt;mode at certain parameters), imposes quite a strong constraint on the operation parallelism, which might slow the operation down. The reason for such behavior is that you cannot run 10,000 jobs in parallel, keeping to the constraint of 1000 intermediate chunks because such number of jobs can generate 10,000 chunks at the same time. On the other hand, the `relaxed``` mode doesn't have this issue because it doesn't try to meet the chunk quota constraints in real time.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Auto-merging is an additional step in the operation that consumes time. That's why automated merging is disabled by default. If the growth in the operation runtime due to automated merging isn't critical for you, use the &lt;code&gt;relaxed&lt;/code&gt; mode.  It's assumed that this mode suits the demands of most users.&lt;/p&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/automerge.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sample specifications&lt;/span&gt;&lt;/a&gt;Sample specifications&lt;/h2&gt;\n&lt;p&gt;Sample specification with the &lt;code&gt;relaxed&lt;/code&gt; mode:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;{\n  &lt;span class=\"hljs-string\"&gt;input_table_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/input_table\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;output_table_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/output_table\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;mapper&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; {\n    &lt;span class=\"hljs-string\"&gt;command&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"cat\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  }&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;auto_merge&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; {\n    &lt;span class=\"hljs-string\"&gt;mode&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"relaxed\"&lt;/span&gt;\n  }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"104\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0 ass=\"hljs-string\"&gt;\"manual\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;max_intermediate_chunk_count&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1000&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;chunk_count_per_merge_job&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;chunk_size_threshold&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;5&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"108\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-108\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-108\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-108.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/operations/automerge.md","sourcePath":"en/user-guide/data-processing/operat
