        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section describes general properties of various operations, as well as user script parameters on paths, and file attributes.&lt;/p&gt;\n&lt;h2 id=\"common_options\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/operations-options.html#common_options\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General options for all operation types&lt;/span&gt;&lt;/a&gt;General options for all operation types&lt;/h2&gt;\n&lt;p&gt;The parameters below can be indicated in any operation's specification root.&lt;br /&gt;\nThe default values, if set, are provided in parentheses:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;pool&lt;/code&gt; — name of the &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;compute pool&lt;/a&gt; where the operation runs. If this parameter is not specified, the pool name defaults to the name of the YTsaurus user who started the operation.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;weight&lt;/code&gt;(1.0) — weight of the started operation. It determines how much of the pool's compute quota is allocated to the operation. For more information, see &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;Scheduler and pools&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;pool_trees&lt;/code&gt; — list of &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;pool trees&lt;/a&gt; where the operation's jobs are run. The default pool tree is configured by the cluster administrator.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;DEPRECATED&lt;/strong&gt; &lt;code&gt;tentative_pool_trees&lt;/code&gt; — list of test pool trees that will be used for running the operation if there is no performance degradation.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;DEPRECATED&lt;/strong&gt; &lt;code&gt;use_default_tentative_pool_trees&lt;/code&gt; — enable the use of all trees in the cluster that are &lt;code&gt;tentative&lt;/code&gt; relative to the default pool tree.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;DEPRECATED&lt;/strong&gt; &lt;code&gt;tentative_tree_eligibility&lt;/code&gt; — configuration for running the operation's jobs in &lt;code&gt;tentative&lt;/code&gt; trees:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;sample_job_count&lt;/code&gt; (10) — number of jobs to be run as samples.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_tentative_job_duration_ratio&lt;/code&gt; (10) — maximum allowed latency of job execution.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;min_job_duration&lt;/code&gt; (30) — job duration threshold in &lt;code&gt;tentative&lt;/code&gt; trees. If the average job duration in the &lt;code&gt;tentative&lt;/code&gt; tree exceeds this threshold, new jobs of the operation are not run in that &lt;code&gt;tentative&lt;/code&gt; tree.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ignore_missing_pool_trees&lt;/code&gt; (false) — allows ignoring &lt;code&gt;tentative&lt;/code&gt; trees that are missing on the cluster.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;resource_limits&lt;/code&gt; — fair-share settings that will apply to all jobs of the operation in aggregate. For more information, see &lt;a href=\"user-guide/data-processing/scheduler/pool-settings.html#operations\"&gt;Pool characteristics&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;time_limit&lt;/code&gt; — general time limit on the operation (in milliseconds). If the operation does not complete within the specified time, it will be force-stopped by the scheduler.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;acl&lt;/code&gt; — Access Control List, which sets out access permissions for the operation. The &lt;code&gt;manage&lt;/code&gt; permission is associated with mutating actions on the operation and its jobs: abort, suspend, job shell, and so on. In turn, the &lt;code&gt;read&lt;/code&gt; permission relates to non-mutating actions like get_job_stderr and get_job_input_context. This &lt;code&gt;acl&lt;/code&gt; will be supplemented with records on the user that ran the operation and YTsaurus administrators.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;max_stderr_count&lt;/code&gt; (10) — limit on the amount of stored data from the standard error stream (stderr) of jobs, by default taken from cluster settings that usually have it equal to 10. The maximum value is 150.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;max_failed_job_count&lt;/code&gt; (10) — number of failed jobs past which the operation is considered failed. By default, this value is taken from the cluster settings, where it is usually set to 10.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;unavailable_chunk_strategy&lt;/code&gt; and &lt;code&gt;unavailable_chunk_tactics&lt;/code&gt; — determine further action in case intermediate calculation results are unavailable. For more information, see &lt;a href=\"user-guide/data-processing/operations/overview.html#chunk_strategy\"&gt;Operation types&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;chunk_availability_policy&lt;/code&gt; — system behavior if erasure chunks are unavailable. For more information, see &lt;a href=\"user-guide/data-processing/operations/overview.html#chunk_erasure_strategy\"&gt;Operation types&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;scheduling_tag_filter&lt;/code&gt; — filter for selecting cluster nodes upon job launch. The filter is a &lt;a href=\"admin-guide/node-tags.html\"&gt;logical expression&lt;/a&gt; that includes &lt;code&gt;&amp;amp;&lt;/code&gt; (logical AND), &lt;code&gt;|&lt;/code&gt; (logical OR), and &lt;code&gt;!&lt;/code&gt; (logical NOT) operators and parentheses. The possible values of cluster node tags act as variables in the expression. A tag is a marker placed on a cluster node. Markup is done by the YTsaurus service when configuring a cluster. If the cluster node has a tag specified in the expression, the expression takes the \"true\" value, if not — the value is \"false\". If the expression as a whole returns \"false\", then that cluster node is not selected to run the job.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;max_data_weight_per_job&lt;/code&gt; (200 GB) — maximum allowed size of input data per job (in bytes). This option sets a hard cap on the job size. If the scheduler is not able to generate a job with a smaller size, the operation ends with an error.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;data_weight_per_job&lt;/code&gt; (256 MB) — recommended size of input data per job (in bytes). This option is useless for composite operations such as MapReduce. which instead call for the following options:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;data_weight_per_map_job&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;data_weight_per_sort_job&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;data_weight_per_partition_job&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;data_weight_per_sorted_merge_job&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;data_weight_per_reduce_job&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;secure_vault&lt;/code&gt; — values from this map end up in the environments of all the user jobs of a given operation and can't be viewed by unauthorized users, unlike the &lt;code&gt;environment&lt;/code&gt; section in the user job specification. In particular, the entire passed-in map in the YSON format is written to the &lt;code&gt;YT_SECURE_VAULT&lt;/code&gt; environment variable, and, to save time, \"value\" is written to the &lt;code&gt;YT_SECURE_VAULT_key&lt;/code&gt; environment variable for each &lt;code&gt;key=value&lt;/code&gt; pair from the map. This only happens for elementary type values, such as int64, uint64, double, boolean, or string.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;stderr_table_path&lt;/code&gt; — for specifying the path to an existing table, which must be created outside of transactions. If this option is enabled, the complete data from the standard error stream (stderr) of all jobs (except for the aborted ones) is written to the specified table. That table will have the following columns:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;job_id&lt;/code&gt; — job ID.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;part_index&lt;/code&gt; — for large error messages, the stderr message of a single job can be split into several segments that are stored in different rows. This column contains the numbers corresponding to these segments.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;data&lt;/code&gt; — data from the standard error stream.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;redirect_stdout_to_stderr&lt;/code&gt; — option for redirecting a standard output stream (stdout) to a standard error stream (stderr).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;core_table_path&lt;/code&gt; — path to an existing table for writing core dump. The table format is identical to that described for &lt;code&gt;stderr_table_path&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;input_query&lt;/code&gt; — for the &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt; and &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt; operations, you can pre-filter each input row using the &lt;a href=\"user-guide/dynamic-tables/dyn-query-language.html\"&gt;query language&lt;/a&gt;. Because the input table is already known, and it is assumed that each row will be individually filtered, the query syntax changes and gets simplified to &lt;code&gt;* | &amp;lt;select-expr-1&amp;gt; [AS &amp;lt;select-alias-1&amp;gt;]... [WHERE &amp;lt;predicate-expr&amp;gt;]&lt;/code&gt;. Speeifically, you cannot use &lt;code&gt;GROUP BY&lt;/code&gt; and &lt;code&gt;ORDER BY&lt;/code&gt;. Queries need strictly schematized data, so input tables must have a strict schema. In the &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt; operation, the schema of the final data in the query is incorporated when outputting the schema for the output table.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;If the &lt;code&gt;input_query&lt;/code&gt; parameter is specified, the &lt;code&gt;enable_row_index&lt;/code&gt; and &lt;code&gt;enable_range_index&lt;/code&gt; attributes are excluded from the job.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;omit_inaccessible_columns&lt;/code&gt; (false) — skips columns that cannot be accessed. By default, operations in this scenario end with an error at startup.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;alias&lt;/code&gt; — alias of the operation. Makes the operation available in search and through the &lt;code&gt;get-operation&lt;/code&gt; command on the specified row.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;job_node_account&lt;/code&gt; (tmp_jobs) — account under which chunks of files with the error log (stderr) and input context are stored.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;suspend_operation_if_account_limit_exceeded&lt;/code&gt; (false) — suspends (pauses) the operation in case of the \"Account limit exceeded\" error in a job.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;enable_job_splitting&lt;/code&gt; (true) — determines if the scheduler is allowed to adaptively split user jobs that take a long time.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;fail_on_job_restart&lt;/code&gt; (false) — force-interrupts the operation if a started job terminates in any state other than success (such as abort or fail). Useful for operations that do not tolerate job restarts.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;title&lt;/code&gt; — operation title. The passed-in text is shown in the web interface.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;started_by&lt;/code&gt; — a map describing the client that started the operation. This field is not associated with a strict schema. The specified information is shown on the operation page in the web interface.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;annotations&lt;/code&gt; — a map where the user can write any structured information related to the operation. The &lt;code&gt;annotations&lt;/code&gt; contents are saved to the operation archive as &lt;a href=\"user-guide/storage/formats.html#yson\"&gt;YSON&lt;/a&gt; and can then be used to look up and identify operations within the archive.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Adding user information to the specification root is not recommended: This leads to user data appearing in Unrecognized Spec. In the future, this practice will be prohibited.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;description&lt;/code&gt; — a map similar to &lt;code&gt;annotations&lt;/code&gt; that also appears on the operation page in the web interface. It is best to add only small amounts of human-readable information to this section to avoid overcrowding the operation page.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;use_columnar_statistics&lt;/code&gt; (false) — determines whether to use columnar statistics to accurately estimate the size of jobs when starting operations on tables with column samples. This option improves automatic splitting into jobs, with columns taken from the input data forming a small fraction of the input table size (previously, column selection was ignored, and the resulting jobs were very small, which had to be rectified with the &lt;code&gt;data_weight_per_job&lt;/code&gt; option).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;sampling&lt;/code&gt; — configuration of large-block sampling of input data (not available for Sort, RemoteCopy, and Vanilla operations). This option is obsolete: use &lt;a href=\"user-guide/storage/io-configuration.html#sampling\"&gt;read sampling&lt;/a&gt; instead. The &lt;code&gt;sampling&lt;/code&gt; option only supports block-based sampling. It works to proportionally decrease the amount of data read from disk, which, under ideal conditions, should result in a proportional increase in operation speed. The trade-off is that the resulting process is not really sampling in its true mathematical sense, but only an approximation: the data is divided into fairly large blocks of successive rows, and then these blocks are sampled whole. The result may be adequate for applied calculations on sufficiently large tables. The parameter value is set by a map with the following keys:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;sampling_rate&lt;/code&gt; (null) — share of sampled rows.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;io_block_size&lt;/code&gt; (16 MB) — minimum sampling block size. We do not recommend changing the default value.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;max_speculative_job_count_per_task&lt;/code&gt; — limit on the number of speculative jobs (currently supported for Map, Reduce, MapReduce, Sort, and Merge operations).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;job_speculation_timeout&lt;/code&gt; — timeout period, in milliseconds, after which a speculative job is run for the currently executing one.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;try_avoid_duplicating_jobs&lt;/code&gt; (false) — if possible, prevents jobs with the same input from running, unless required. In particular, this disables speculative jobs. Still, it is impossible to guarantee that there won't be any jobs run with the same input. For example, if the node hosting the first instance of a job loses connectivity with the cluster, the job continues to run on that cluster and can potentially perform observable side actions. In this case, the cluster has to restart the job with the same input on another node.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;You can configure &lt;a href=\"user-guide/storage/io-configuration.html\"&gt;I/O parameters&lt;/a&gt; for each type of job in the operation. If the operation has one job type, the specification section is called &lt;code&gt;job_io&lt;/code&gt;. If the operation involves jobs of different types (this is applicable to MapReduce and Sort operations), then each type has its own section. The names of these sections are listed in the settings of the corresponding operations.&lt;/p&gt;\n&lt;h2 id=\"user_script_options\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/operations-options.html#user_script_options\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;User script options&lt;/span&gt;&lt;/a&gt;User script options&lt;/h2&gt;\n&lt;p&gt;The following parameters are supported for each user script (default values, if defined, are provided in parentheses):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;command&lt;/code&gt; (required parameter) — string to be executed via the &lt;code&gt;bash -c&lt;/code&gt; call.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;file_paths&lt;/code&gt; — list of &lt;a href=\"user-guide/storage/cypress.html\"&gt;Cypress&lt;/a&gt; paths to files or tables. These files and tables are downloaded to the cluster node where the command is executed, and a special &lt;code&gt;sandbox&lt;/code&gt; environment houses symbolic links to the downloaded files. The links are read-only. The filename defaults to the basename of the Cypress path, but you can change it by specifying the &lt;code&gt;file_name&lt;/code&gt; attribute for the path. If the path points to a table, the &lt;code&gt;format&lt;/code&gt; attribute must be specified, which determines the &lt;a href=\"user-guide/storage/formats.html\"&gt;format&lt;/a&gt; in which the table is saved to a file on disk. The size of table files is limited by a constant value that can be configured at the cluster level.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;docker_image&lt;/code&gt; — name of the Docker image for the job's root file system.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;layer_paths&lt;/code&gt; — list of paths to porto layers in Cypress. Layers are listed from top to bottom.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;cuda_toolkit_version&lt;/code&gt; — &lt;a href=\"https://ru.wikipedia.org/wiki/CUDA\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;CUDA&lt;/a&gt; version required by the job. If the version is specified, then a standard delta layer with the respective CUDA toolkit is provided to the job.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;format&lt;/code&gt;, &lt;code&gt;input_format&lt;/code&gt;, &lt;code&gt;output_format&lt;/code&gt; (yson) — &lt;a href=\"user-guide/storage/formats.html\"&gt;format&lt;/a&gt; in which input table data is fed to the operation. The &lt;code&gt;input_format&lt;/code&gt; and &lt;code&gt;output_format&lt;/code&gt; options take priority over &lt;code&gt;format&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;environment&lt;/code&gt;— a map of environment variables specified while the operation is running. This option helps avoid specifying environment variables in the &lt;code&gt;command&lt;/code&gt; parameter so as not to hinder its readability.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;cpu_limit&lt;/code&gt; (1) — number of compute cores that the scheduler may allocate for the job being executed.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;set_container_cpu_limit&lt;/code&gt; (false) — sets the &lt;code&gt;cpu_limit&lt;/code&gt; for the porto container to the requested value.  By default, only the weight proportional to the requested &lt;code&gt;cpu_limit&lt;/code&gt; is set.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;gpu_limit&lt;/code&gt; (0) — number of GPUs to be allocated for the job.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;memory_limit&lt;/code&gt; (512 MB) — limit on job memory consumption (in bytes).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;user_job_memory_digest_default_value&lt;/code&gt; (0.5) — initial estimate for &lt;a href=\"user-guide/data-processing/scheduler/memory-digest.html\"&gt;memory reserve&lt;/a&gt; selection.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;user_job_memory_digest_lower_bound&lt;/code&gt; (0.05) — minimum threshold for the &lt;a href=\"user-guide/data-processing/scheduler/memory-digest.html\"&gt;memory reserve&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;enable_input_table_index&lt;/code&gt; — whether to write the input index of a row's originating table to the input stream. By default, the attributes are only written if there is more than one input table.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;tmpfs_path&lt;/code&gt; — path to the &lt;code&gt;sandbox&lt;/code&gt; where tmpfs is mounted. By default, the tmpfs size matches the job's &lt;code&gt;memory_limit&lt;/code&gt;, and the effective occupied space counts toward the job's memory consumption.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;tmpfs_size&lt;/code&gt; — optional parameter that sets the limit of the tmpfs size for a job. This parameter only matters when &lt;code&gt;tmpfs_path&lt;/code&gt; is specified. If the parameter is not specified, it defaults to &lt;code&gt;memory_limit&lt;/code&gt;, and &lt;code&gt;memory_reserve_factor&lt;/code&gt; is automatically set to 1.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;tmpfs_volumes&lt;/code&gt; — this parameter allows specifying a list of tmpfs volumes for the job. Each list element is a map containing two fields: &lt;code&gt;size&lt;/code&gt; and &lt;code&gt;path&lt;/code&gt;. The paths to the requested volumes must not overlap.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;copy_files&lt;/code&gt; (false) — by default, user files go to the job's &lt;code&gt;sandbox&lt;/code&gt; via a &lt;a href=\"user-guide/storage/links.html\"&gt;symbolic link&lt;/a&gt;. If this option is enabled, they are copied to the &lt;code&gt;sandbox&lt;/code&gt;. It can be useful in tandem with &lt;code&gt;tmpfs_path=.&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;check_input_fully_consumed&lt;/code&gt; (false) — this option allows you to run system-wide checks to make sure the job has not exited prematurely and read all the data written to its buffer.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_stderr_size&lt;/code&gt; (5 MB) — limit on the size of stderr resulting from the job. Any data written to stderr in excess of this limit is ignored.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;custom_statistics_count_limit&lt;/code&gt; (128) — maximum number of user statistics that can be written by the job (up to 1024).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;job_time_limit&lt;/code&gt; — time limit (in milliseconds) on a job. Jobs exceeding this limit are deemed failed.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;disk_request&lt;/code&gt; — list of disks required by the job. By default, a job is assigned a local disk on the cluster node where it was initiated. Disk space usage is not limited, but the job can be interrupted if the disk space runs out. Each disk is characterized by the following parameters:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;disk_space&lt;/code&gt; — maximum total file size for the job's &lt;code&gt;sandbox&lt;/code&gt; on the disk.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;inode_count&lt;/code&gt; — limit on the number of &lt;a href=\"https://ru.wikipedia.org/wiki/Inode\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;inodes&lt;/a&gt; on the disk.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;account&lt;/code&gt; — account for which the requested disk space is provided.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;medium_name&lt;/code&gt; (default) — name of the &lt;a href=\"user-guide/storage/media.html\"&gt;medium&lt;/a&gt; that a disk is being requested from.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;interruption_signal&lt;/code&gt; — number of the signal sent to the user process if the job is preempted. There is a timeout period between sending the signal and the job interruption. The duration of this timeout is determined by the cluster settings. During this time, the user process may attempt to finish processing the data and successfully complete the job.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;restart_exit_code&lt;/code&gt; — exit code signaling the need to restart the job after it was interrupted. This option is important for vanilla jobs that represent services or handle data that is external to YTsaurus.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;job_speculation_timeout&lt;/code&gt; — timeout period after which a speculative job can be run for the current one. A speculative job is a mechanism for running an additional copy of a job with the same input data and in parallel with the original job in cases where the latter appears to have frozen. The scheduler identifies \"suspicious\" jobs by itself based on the statistics regarding the read (for input data) and write (for output data) speeds, job preparation time, attempts to divide up the job, and other heuristics.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;waiting_job_timeout&lt;/code&gt; — timeout period during which the job can remain queued for launch on the node. By default, it is taken from the settings of a particular cluster.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The options listed above characterize the script rather than the operation as a whole. They should be located not in the specification root, but in branches like &lt;code&gt;mapper&lt;/code&gt; or &lt;code&gt;reducer&lt;/code&gt;. The user script is a separate entity because the &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt; operation involves more than one such script (mapper, reducer, reduce_combiner).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"memory_reserve_factor\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/operations-options.html#memory_reserve_factor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Memory reserve&lt;/span&gt;&lt;/a&gt;Memory reserve&lt;/h3&gt;\n&lt;p&gt;By default, the operation controller looks at the jobs statistics and determines a memory reserve for newly started jobs based on that. The mechanism is transparent to users and does not impact the operation's success. However, it may result in aborted jobs due to &lt;code&gt;resource_overdraft&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;For a detailed description of this mechanism, see &lt;a href=\"user-guide/data-processing/scheduler/memory-digest\"&gt;Selecting memory for jobs&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;When tmpfs is enabled (specifying &lt;code&gt;tmpfs_path&lt;/code&gt; is equivalent to enabling tmpfs) without an explicit limit on its size (the &lt;code&gt;tmpfs_size&lt;/code&gt; parameter), the memory reserve is automatically set to 1. This is because the Linux OS kernel does not allow overcommitting for the tmpfs size, and the total size exceeding the physical capabilities can therefore lead to the cluster node freezing.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"many_input_tables\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/operations-options.html#many_input_tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Multiple input table reads&lt;/span&gt;&lt;/a&gt;Multiple input table reads&lt;/h3&gt;\n&lt;p&gt;Data from input tables written according to the specified input format is sent to the user script, standard input (&lt;code&gt;stdin&lt;/code&gt;). The user script has output table write descriptors open. The descriptor numbers &lt;code&gt;1, 4, 7, ..&lt;/code&gt; are consistent with the order in which the output tables are passed to the operation.&lt;/p&gt;\n&lt;h3 id=\"disk_request\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/operations-options.html#disk_request\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Disk requests for jobs&lt;/span&gt;&lt;/a&gt;Disk requests for jobs&lt;/h3&gt;\n&lt;p&gt;If only &lt;code&gt;disk_space&lt;/code&gt; is specified in the &lt;code&gt;disk_request&lt;/code&gt; specification, the default disks for jobs are used. In this case, no book-keeping is done on used space — free disk space is assumed to be abundant, no problems are expected. Only the data that the user stores on the cluster counts toward that user's disk quota (account), while the disk space used for the job does not. The scheduler ensures that no job exceeds its limits and that the sum of the limits of all jobs on the cluster node does not exceed the available disk space on the cluster node.&lt;/p&gt;\n&lt;p&gt;In addition, specifying &lt;code&gt;disk_space&lt;/code&gt; means that YTsaurus starts limiting the space used by the job, but also guarantees it.&lt;/p&gt;\n&lt;p&gt;If you want to use other disks for your operations' jobs, such as an SSD in place of the default HDD, specify the desired &lt;code&gt;medium&lt;/code&gt; and your &lt;code&gt;account&lt;/code&gt; for quoting the requested space.&lt;/p&gt;\n&lt;h2 id=\"path_attributes\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/operations-options.html#path_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Path attributes&lt;/span&gt;&lt;/a&gt;Path attributes&lt;/h2&gt;\n&lt;p&gt;The following attributes are supported for operations' output tables (default values, if set, are specified in parentheses):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;sorted_by&lt;/code&gt; — set of columns by which to sort the table.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;append&lt;/code&gt; (false) — determines if data is appended to a given output table. If &lt;code&gt;append&lt;/code&gt; is set to &lt;code&gt;false&lt;/code&gt;, the data in the table is overwritten.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;row_count_limit&lt;/code&gt; — finishes the operation ahead of time as soon as the output table reaches at least &lt;code&gt;row_count_limit&lt;/code&gt; rows. Can only be set for one table.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;create&lt;/code&gt; (false) — if the table at the specified path does not exist, the scheduler will create it automatically with default settings (it will execute the &lt;code&gt;create&lt;/code&gt; command with the parameters &lt;code&gt;{ \"path\" = \"//path/from/spec\" ; \"type\" = \"table\" }&lt;/code&gt;)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The following attributes are supported on operations' input tables:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Standard &lt;a href=\"user-guide/storage/ypath.html#rich_ypath_suffix\"&gt;modifiers for selecting rows and columns&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;transaction_id&lt;/code&gt; — specifies the transaction within which to access the input table.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;timestamp&lt;/code&gt; — allows using the state of a dynamic table &lt;a href=\"user-guide/dynamic-tables/mapreduce.html#dyntable_mr_timestamp\"&gt;at a specific point in time&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;rename_columns&lt;/code&gt; — enables renaming certain columns before table processing starts as part of the operation. Only columns within the schema can be renamed. Post-rename, all restrictions on the table schema should be met, and there should be no column name overlaps within chunks when it comes to the non-strict schema. When the &lt;code&gt;sorted_by&lt;/code&gt; column set is specified for the operation's output table, or when the output table schema has key columns, the following occurs:\n&lt;ol&gt;\n&lt;li&gt;When generating chunks for the table, the operation's jobs check if records are sorted by the specified set of columns.&lt;/li&gt;\n&lt;li&gt;The scheduler validates that the key ranges of the chunks generated for this output table do not overlap and proceeds to form a sorted table from this set of chunks.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The operation will end with an error if the validation fails at any of these steps.&lt;/p&gt;\n&lt;h3 id=\"files\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/operations-options.html#files\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Files&lt;/span&gt;&lt;/a&gt;Files&lt;/h3&gt;\n&lt;p&gt;The following attributes are supported on file paths:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;file_name&lt;/code&gt; — name of the file in the job's &lt;code&gt;sandbox&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;executable&lt;/code&gt; — makes the file executable.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;format&lt;/code&gt; — format in which the file from the table should be generated if the file constitutes the path to the table.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;bypass_artifact_cache&lt;/code&gt; — a flag indicating that the file should be downloaded to the job's &lt;code&gt;sandbox&lt;/code&gt;, bypassing the cache. This attribute can be useful if the files are already on the SSD or in memory, and you want to deliver them to the job without extra delays. Good for cases where the operation involves a small number of jobs, rendering caching ineffective.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/operations/operations-options.md","sourcePath":"en/user-guide/data-processing/operations/operations-options.md"},"headings":[{"title":"General options for all operation types","href":"en/user-guide/data-processing/operations/operations-options.html#common_options","level":2},{"title":"User script options","href":"en/user-guide/data-processing/operations/operations-options.html#user_script_options","level":2,"items":[{"title":"Memory reserve","href":"en/user-guide/data-processing/operations/operations-options.html#memory_reserve_factor","level":3},{"title":"Multiple input table reads","href":"en/user-guide/data-processing/operations/operations-options.html#many_input_tables","level":3},{"title":"Disk requests for jobs","href":"en/user-guide/data-processing/operations/operations-options.html#disk_request","level":3}]},{"title":"Path attributes","href":"en/user-guide/data-processing/operations/operations-options.html#path_attributes","level":2,"items":[{"title":"Files","href":"en/user-guide/data-processing/operations/operations-options.html#files","level":3}]}],"title":"Operation options"},"router":{"pathname":"en/user-guide/data-processing/operations/operations-options","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
