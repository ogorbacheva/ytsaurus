        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section is a collection of recommendations on using the YTsaurus for massively parallel data processing scenarios.&lt;/p&gt;\n&lt;h2 id=\"chunks-too-small\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/recommendations.html#chunks-too-small\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Chunks too small&lt;/span&gt;&lt;/a&gt;Chunks too small&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The small chunk scenario is relevant to static tables. Dynamic table use cases imply fine-grained reads to reduce query response times; therefore, small chunks are acceptable for dynamic tables.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;A &lt;a href=\"user-guide/storage/chunks.html\"&gt;chunk&lt;/a&gt; under 100 MB may be considered small. To prevent there being too many chunks in the system, you should look to have an average chunk size of at least 512 MB.&lt;/p&gt;\n&lt;p&gt;Small chunks complicate cluster operation for several reasons:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Small chunks subject master servers to an additional load. The more chunks, the more master server memory is required to store chunk metainformation and the slower their performance: they are slower to write snapshots and longer to recover from them in the event of problems.&lt;/li&gt;\n&lt;li&gt;A large number of small chunks results in slower data reads. For instance, if 100 MB are scattered throughout a million chunks, one record each, a million disk &lt;code&gt;seeks&lt;/code&gt; are required to read all the data which is very slow even if they are done in parallel.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Operation execution or fine-grained data reads may produce tables with many small chunks. To resolve this problem, you need to increase chunk size for such tables. You can increase chunk size by calling the command below:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt merge --src //your/table --dst //your/table --spec &lt;span class=\"hljs-string\"&gt;'{combine_chunks=true;mode=&amp;lt;mode&amp;gt;}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"37\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-37\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-37\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-37.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You need to set the &lt;code&gt;&amp;lt;mode&amp;gt;&lt;/code&gt; attribute to &lt;code&gt;sorted&lt;/code&gt; for a &lt;a href=\"user-guide/storage/static-tables.html#sorted_tables\"&gt;sorted table&lt;/a&gt; and to &lt;code&gt;ordered&lt;/code&gt; for an &lt;a href=\"user-guide/storage/static-tables.html#unsorted_tables\"&gt;unsorted&lt;/a&gt; one. For more information on table types, please see &lt;a href=\"user-guide/storage/static-tables.html\"&gt;Static tables&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;In both the cases, merge will maintain data ordering. But for &lt;code&gt;sorted&lt;/code&gt;, it will also maintain the table sort from the system standpoint: the table will remain &lt;code&gt;sorted&lt;/code&gt; and keep all the relevant attributes.&lt;/p&gt;\n&lt;p&gt;If you are using a &lt;a href=\"api/python/userdoc.html\"&gt;python library&lt;/a&gt;, you can specify the &lt;code&gt;auto_merge_output={action=merge}&lt;/code&gt; configuration option which will make the library automatically aggregate the resulting tables if their chunks are too small.&lt;/p&gt;\n&lt;h2 id=\"mapreduce-vs-mapsortreduce\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/recommendations.html#mapreduce-vs-mapsortreduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MapReduce vs Map+Sort+Reduce&lt;/span&gt;&lt;/a&gt;MapReduce vs Map+Sort+Reduce&lt;/h2&gt;\n&lt;p&gt;For more information on MapReduce internals and on why it is normally faster than the Map+Sort+Reduce sequence, please see &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Below is a description of circumstances when using the combined MapReduce operation is &lt;strong&gt;not recommended&lt;/strong&gt;.&lt;/p&gt;\n&lt;h3 id=\"heavy-mapper-with-strong-filter\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/recommendations.html#heavy-mapper-with-strong-filter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Heavy mapper with strong filter&lt;/span&gt;&lt;/a&gt;Heavy mapper with strong filter&lt;/h3&gt;\n&lt;p&gt;As a theoretical reference, you can use the fact that a heavy mapper spends over 100 ms of CPU to process a single row. Normally, the number of input rows of a strongly filtering mapper is 5 or more times greater than the number of its output rows or bytes.&lt;/p&gt;\n&lt;p&gt;This requires there to be as many jobs as possible in the map phase for each to run more quickly. A MapReduce has a constraint on the number of map jobs because if there are too many, the sort phase will become costly to perform following a large number of small random disk reads.&lt;/p&gt;\n&lt;p&gt;The correct solution in this case is to start a Map first specifying as many jobs as possible. Thereafter, apply a combined MapReduce with an empty mapper to the resulting data.&lt;/p&gt;\n&lt;h3 id=\"frequent-application-of-mapreduce-to-same-key-fields\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/recommendations.html#frequent-application-of-mapreduce-to-same-key-fields\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Frequent application of MapReduce to same key fields&lt;/span&gt;&lt;/a&gt;Frequent application of MapReduce to same key fields&lt;/h3&gt;\n&lt;p&gt;If you need to process your data through a Reduce more than once, it will, most likely, be more efficient to sort the data first followed by conventional Reduce operations. Logs are a common example of such data.&lt;/p&gt;\n&lt;p&gt;This arrangement will only work well in two situations:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The data does not change.&lt;/li&gt;\n&lt;li&gt;The data is appended. A table is time-sorted, for instance. An additional amount of data comes in with all the key (time) values greater than all the key (time) values in the table. Then, a sort can be applied to this batch of data followed by a Reduce with &lt;code&gt;teleport=%true&lt;/code&gt;. For more information on the option, please see the &lt;a href=\"user-guide/data-processing/operations/reduce.html#foreign_tables\"&gt;Reduce&lt;/a&gt; section.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"heavy-reducer\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/recommendations.html#heavy-reducer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Heavy reducer&lt;/span&gt;&lt;/a&gt;Heavy reducer&lt;/h3&gt;\n&lt;p&gt;Like with a heavy mapper, you need to start as many reduce jobs as possible. But the operation has a limit on the number of partitions; therefore, on the number of reduce jobs.&lt;/p&gt;\n&lt;p&gt;The right thing to do in this case is to sort the table and then run Reduce with as many jobs as possible.&lt;/p&gt;\n&lt;h2 id=\"large-number-of-records-with-identical-keys-during-reduce-phase\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/recommendations.html#large-number-of-records-with-identical-keys-during-reduce-phase\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Large number of records with identical keys during reduce phase&lt;/span&gt;&lt;/a&gt;Large number of records with identical keys during reduce phase&lt;/h2&gt;\n&lt;p&gt;To solve this problem, YTsaurus has &lt;a href=\"user-guide/data-processing/operations/mapreduce#reduce_combiner.md\"&gt;Reduce combiners&lt;/a&gt; that help process large keys in several jobs in the reduce phase.&lt;/p&gt;\n&lt;h3 id=\"map-combiners\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/recommendations.html#map-combiners\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Map combiners&lt;/span&gt;&lt;/a&gt;Map combiners&lt;/h3&gt;\n&lt;p&gt;The idea behind a map combiner is to aggregate data during the map phase.&lt;/p&gt;\n&lt;p&gt;The &lt;a href=\"http://wiki.apache.org/hadoop/WordCount\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;WordCount task&lt;/a&gt; is a classic example of using a map combiner. The map phase of this task requires inserting &lt;code&gt;(word, count)&lt;/code&gt; rather than &lt;code&gt;(word, 1)&lt;/code&gt; pairs, where &lt;code&gt;count&lt;/code&gt; is the number of occurrences of a specific word in this job. Therefore, it is useful to aggregate data both in the reduce phase as well as directly in the map phase.&lt;/p&gt;\n&lt;p&gt;The YTsaurus system does not have dedicated map combiner support. Large keys are frequently caused by a failure to aggregate in the map phase. Thus, if aggregation is possible, we recommend aggregating.&lt;/p&gt;\n&lt;h2 id=\"numerous-output-tables-in-operation\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/recommendations.html#numerous-output-tables-in-operation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Numerous output tables in operation&lt;/span&gt;&lt;/a&gt;Numerous output tables in operation&lt;/h2&gt;\n&lt;p&gt;A RAM buffer is reserved for each operation output table. When operation launches, all the output table buffer sizes are added together and added to the amount of memory indicated by a user in the operation spec.&lt;/p&gt;\n&lt;p&gt;Technically, output table buffer size is implicitly counted as part of the &lt;code&gt;JobProxy&lt;/code&gt; process memory and depends on cluster settings as well as the value of an output table's &lt;code&gt;erasure_codec&lt;/code&gt; attribute. For more information on &lt;code&gt;JobProxy&lt;/code&gt;, see the Jobs todo section.&lt;/p&gt;\n&lt;p&gt;If there are many output tables, the total amount of memory may turn out be fairly large; so, the scheduler will not be able quickly to find a cluster node with the right amount of free memory or may not find one at all. This will cause the operation to be aborted, and the &lt;code&gt;No online node can satisfy the resource demand&lt;/code&gt; error to be displayed for the user. The error message will indicate the amount of memory requested.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;We recommend specifying no more than several dozen output tables for an operation.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/operations/recommendations.md","sourcePath":"en/user-guide/data-processing/operations/recommendations.md"},"headings":[{"title":"Chunks too small","href":"en/user-guide/data-processing/operations/recommendations.html#chunks-too-small","level":2},{"title":"MapReduce vs Map+Sort+Reduce","href":"en/user-guide/data-processing/operations/recommendations.html#mapreduce-vs-mapsortreduce","level":2,"items":[{"title":"Heavy mapper with strong filter","href":"en/user-guide/data-processing/operations/recommendations.html#heavy-mapper-with-strong-filter","level":3},{"title":"Frequent application of MapReduce to same key fields","href":"en/user-guide/data-processing/operations/recommendations.html#frequent-application-of-mapreduce-to-same-key-fields","level":3},{"title":"Heavy reducer","href":"en/user-guide/data-processing/operations/recommendations.html#heavy-reducer","level":3}]},{"title":"Large number of records with identical keys during reduce phase","href":"en/user-guide/data-processing/operations/recommendations.html#large-number-of-records-with-identical-keys-during-reduce-phase","level":2,"items":[{"title":"Map combiners","href":"en/user-guide/data-processing/operations/recommendations.html#map-combiners","level":3}]},{"title":"Numerous output tables in operation","href":"en/user-guide/data-processing/operations/recommendations.html#numerous-output-tables-in-operation","level":2}],"title":"Using YTsaurus system properly and efficiently"},"router":{"pathname":"en/user-guide/data-processing/operations/recommendations","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
