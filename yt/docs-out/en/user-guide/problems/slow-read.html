"&gt;&lt;/path&gt;&lt;path d=\"M 399.21 55.79 L 396.73 63.22 L 395.5 59.5 L 391.78 58.27 Z\" fill=\"rgb(0, 0, 0)\" stroke=\"rgb(0, 0, 0)\" stroke-miterlimit=\"10\"&gt;&lt;/path&gt;&lt;path d=\"M 270 315 L 396.89 88.06\" fill=\"none\" stroke=\"rgb(0, 0, 0)\" stroke-miterlimit=\"10\"&gt;&lt;/path&gt;&lt;path d=\"M 399.45 83.48 L 399.09 91.29 L 396.89 88.06 L 392.98 87.88 Z\" fill=\"rgb(0, 0, 0)\" stroke=\"rgb(0, 0, 0)\" stroke-miterlimit=\"10\"&gt;&lt;/path&gt;&lt;path d=\"M 270 55 L 394.89 147.7\" fill=\"none\" stroke=\"rgb(0, 0, 0)\" stroke-miterlimit=\"10\"&gt;&lt;/path&gt;&lt;path d=\"M 399.1 150.83 L 391.4 149.47 L 394.89 147.7 L 395.57 143.85 Z\" fill=\"rgb(0, 0, 0)\" stroke=\"rgb(0, 0, 0)\" stroke-miterlimit=\"10\"&gt;&lt;/path&gt;&lt;path d=\"M 490 55 L 614.04 101.75\" fill=\"none\" stroke=\"rgb(0, 0, 0)\" stroke-miterlimit=\"10\"&gt;&lt;/path&gt;&lt;path d=\"M 618.95 103.61 L 611.17 104.41 L 614.04 101.75 L 613.64 97.86 Z\" fill=\"rgb(0, 0, 0)\" stroke=\"rgb(0, 0, 0)\" stroke-miterlimit=\"10\"&gt;&lt;/path&gt;&lt;path d=\"M 490 179 L 614.14 126.48\" fill=\"none\" stroke=\"rgb(0, 0, 0)\" stroke-miterlimit=\"10\"&gt;&lt;/path&gt;&lt;path d=\"M 618.97 124.44 L 613.89 130.39 L 614.14 126.48 L 611.16 123.94 Z\" fill=\"rgb(0, 0, 0)\" stroke=\"rgb(0, 0, 0)\" stroke-miterlimit=\"10\"&gt;&lt;/path&gt;&lt;g transform=\"translate(-0.5 -0.5)\"&gt;&lt;switch&gt;&lt;div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display:flex;width:1px;height:1px;padding-top:194px;margin-left:580px\"&gt;&lt;div style=\"box-sizing:border-box;font-size:0px;text-align:center\" data-drawio-colors=\"color: rgb(0, 0, 0); background-color: rgb(255, 255, 255); \"&gt;&lt;div style=\"display:inline-block;font-size:11px;font-family:Helvetica;color:rgb(0, 0, 0);background-color:rgb(255, 255, 255)\"&gt;Requested format,&lt;br /&gt;compressed by network codec&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;text x=\"580\" y=\"197\" fill=\"rgb(0, 0, 0)\" font-family=\"Helvetica\" font-size=\"11px\" text-anchor=\"middle\"&gt;Requested...&lt;/text&gt;&lt;/switch&gt;&lt;/g&gt;&lt;path d=\"M 270 27.5 L 393.63 27.5\" fill=\"none\" stroke=\"rgb(0, 0, 0)\" stroke-miterlimit=\"10\"&gt;&lt;/path&gt;&lt;path d=\"M 398.88 27.5 L 391.88 31 L 393.63 27.5 L 391.88 24 Z\" fill=\"rgb(0, 0, 0)\" stroke=\"rgb(0, 0, 0)\" stroke-miterlimit=\"10\"&gt;&lt;/path&gt;&lt;/g&gt;&lt;switch&gt;&lt;g&gt;&lt;/g&gt;&lt;a transform=\"translate(0,-5)\" xlink:href=\"https://www.diagrams.net/doc/faq/svg-export-text-problems\" target=\"_blank\"&gt;&lt;text text-anchor=\"middle\" font-size=\"10px\" x=\"50%\" y=\"100%\"&gt;Text is not SVG - cannot display&lt;/text&gt;&lt;/a&gt;&lt;/switch&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;h2 id=\"how-reading-is-performed\"&gt;&lt;a href=\"en/user-guide/problems/slow-read.html#how-reading-is-performed\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How reading is performed.&lt;/span&gt;&lt;/a&gt;How reading is performed.&lt;/h2&gt;\n&lt;p&gt;Table chunks are hosted on node disks in a native format compressed by &lt;code&gt;compression_codec&lt;/code&gt;.&lt;br /&gt;\nFrom there, they are moved to data proxies where they are unpacked, recoded as requested by the user (as YSON, Protobuf, or Skiff), compressed by the specified network codec as part of the HTTP response, and find their way to the user machine.&lt;/p&gt;\n&lt;h2 id=\"factors-affecting-read-performance\"&gt;&lt;a href=\"en/user-guide/problems/slow-read.html#factors-affecting-read-performance\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Factors affecting read performance&lt;/span&gt;&lt;/a&gt;Factors affecting read performance&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"user-guide/storage/media.html\"&gt;&lt;strong&gt;Medium&lt;/strong&gt;&lt;/a&gt;. This is the type of disk table chunks are stored on. Held in the &lt;code&gt;@primary_medium&lt;/code&gt; attribute. SSD speed is higher than HDD but their quota is more limited. To change the medium, you first need to make a new entry in the table's &lt;code&gt;@media&lt;/code&gt; attribute, such as, &lt;code&gt;yt set //path/to/table/@media/ssd_blobs '{replication_factor=3}'&lt;/code&gt;, and then move the table to the new medium: &lt;code&gt;yt set //path/to/table/@primary_medium ssd_blobs&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"user-guide/storage/compression.html\"&gt;&lt;strong&gt;Compression algorithms&lt;/strong&gt;&lt;/a&gt; are a compromise between performance and compression quality. The fastest is &lt;code&gt;lz4&lt;/code&gt;, the slower and the more compact ones range from &lt;code&gt;brotli_1&lt;/code&gt; to &lt;code&gt;brotli_11&lt;/code&gt; (the larger the number, the better the compression). You have to remember that there are two algorithms:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The one used to store the table (&lt;code&gt;yt get //path/to/table/@compression_codec&lt;/code&gt;). To change this one, you need to set the &lt;code&gt;@compression_codec&lt;/code&gt; attribute and re-compress all the table chunks (see &lt;a href=\"user-guide/storage/compression.html#set_compression\"&gt;commands&lt;/a&gt;).&lt;/li&gt;\n&lt;li&gt;The one used for network transmission. It depends on the client used.\n&lt;ul&gt;\n&lt;li&gt;In C++ API, you need to set the &lt;code&gt;TConfig::Get()-&amp;gt;AcceptEncoding&lt;/code&gt; global configuration option. The algorithm names from the &lt;a href=\"user-guide/storage/compression.html#compression_codecs\"&gt;section&lt;/a&gt; must be prefixed with &lt;code&gt;\"z-\"&lt;/code&gt;, such as &lt;code&gt;\"z-snappy\"&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;In Python API, you need to set the &lt;code&gt;yt.wrapper.config[\"proxy\"][\"accept_encoding\"]&lt;/code&gt; option. The supported algorithms are &lt;code&gt;gzip&lt;/code&gt;, &lt;code&gt;br&lt;/code&gt; (brotli), and &lt;code&gt;identity&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Parallelism&lt;/strong&gt;. If you have reached the limit of disk read performance or node format/compression, parallel reads may help.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;In Python API, use the &lt;code&gt;yt.wrapper.config[\"read_parallel\"]&lt;/code&gt; config section that includes &lt;code&gt;\"enable\"&lt;/code&gt;, &lt;code&gt;\"data_size_per_thread\"&lt;/code&gt;, and &lt;code&gt;\"max_thread_count\"&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;In C++ API, you need to use the &lt;code&gt;CreateParallelTableReader&lt;/code&gt; function from a special library.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Network&lt;/strong&gt;. If data is hosted in one data center, and data are read from a different one, you might discover that bandwidth is the bottleneck.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"user-guide/storage/formats.html\"&gt;&lt;strong&gt;Format&lt;/strong&gt;&lt;/a&gt; The fastest is skiff, followed by Protobuf and YSON.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Data proxy load&lt;/strong&gt;. The proxies are divided into groups (roles), and by default, everyone uses the &lt;code&gt;data&lt;/code&gt; role; that is why, such proxies carry a higher load.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Work on the cluster&lt;/strong&gt;. When cluster nodes are updating, for instance, disks may carry a higher load.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"where-do-i-start\"&gt;&lt;a href=\"en/user-guide/problems/slow-read.html#where-do-i-start\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Where do I start?&lt;/span&gt;&lt;/a&gt;Where do I start?&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Increase parallelism (see above). This may solve most of your reading problems. If this does not help or does not help enough, you need to do further troubleshooting.&lt;/li&gt;\n&lt;li&gt;Look CPU load up in the &lt;a href=\"https://en.wikipedia.org/wiki/Perf_(Linux)\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;profiler&lt;/a&gt; or &lt;a href=\"https://en.wikipedia.org/wiki/Top\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;top-e&lt;/a&gt;. If you can see activities related to reading, the possible reasons are:\n&lt;ul&gt;\n&lt;li&gt;HTTP codec. Python API, for instance, uses gzip by default, and that may prove to be the bottleneck because of compression speed. In the latter case, top-e may show high CPU load from the python process. You can try replacing it with &lt;code&gt;identity&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Format. Such as parsing YSON and distributing it to objects in memory.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;As an experiment, try moving some of the data to an SSD (see above) and reading from there. This will help you ascertain whether node disk limitations are your problem.&lt;/li&gt;\n&lt;li&gt;If the above steps failed to increase performance, please contact the system administrator. If the problem is associated with system capability limitations, write to the  YTsaurus  mailbox describing what you have done and the outcomes that you obtained and would like to obtain.&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/problems/slow-read.md","sourcePath":"en/user-guide/problems/slow-read.md"},"headings":[{"title":"How reading is performed.","href":"en/user-guide/problems/slow-read.html#how-reading-is-performed","level":2},{"title":"Factors affecting read performance","href":"en/user-guide/problems/slow-read.html#factors-affecting-read-performance","level":2},{"title":"Where do I start?","href":"en/user-guide/problems/slow-read.html#where-do-i-start","level":2}],"title":"Slow table and file reads"},"router":{"pathname":"en/user-guide/problems/slow-read","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface"
