        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section provides a description of using the &lt;code&gt;Job Shell&lt;/code&gt; tool to troubleshoot slow jobs.&lt;/p&gt;\n&lt;p&gt;On occasion, one or more operation jobs may run for a long time without visible progress. To figure out the reason, you can use the &lt;code&gt;Job Shell&lt;/code&gt; tool. You can use this tool to open a console directly from the job environment on behalf of the same user the job is running under. Thereafter, you can explore the running job with calls to &lt;strong&gt;gdb&lt;/strong&gt; or &lt;strong&gt;strace&lt;/strong&gt;. The recommended work algorithm is shown in the figure:&lt;/p&gt;\n&lt;h2 id=\"starting-job-shell\"&gt;&lt;a href=\"en/user-guide/problems/jobshell-and-slowjobs.html#starting-job-shell\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Starting Job Shell&lt;/span&gt;&lt;/a&gt;Starting Job Shell&lt;/h2&gt;\n&lt;p&gt;To launch Job Shell, you need to run &lt;code&gt;yt --proxy &amp;lt;cluster name&amp;gt; run-job-shell &amp;lt;job id&amp;gt;&lt;/code&gt;, substituting a cluster name or a job ID for &lt;code&gt;&amp;lt;...&amp;gt;&lt;/code&gt;. You can find out the job ID on the &lt;strong&gt;Jobs&lt;/strong&gt; tab of the operation page.&lt;/p&gt;\n&lt;p&gt;Detailed description of Job Shell launch:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt --proxy cluster-name run-job-shell fcebe6b9-e06ab2e1-3fe0384-d0b66453\nUse ^F to terminate shell.\n\nJob environment:\nTMPDIR=/yt/disk2/cluster-data/slots/11/sandbox\nPYTHONPATH=/yt/disk2/cluster-data/slots/11/sandbox\nPYTHONUSERBASE=/yt/disk2/cluster-data/slots/11/sandbox/.python-site-packages\nPYTHON_EGG_CACHE=/yt/disk2/cluster-data/slots/11/sandbox/.python-eggs\nHOME=/yt/disk2/cluster-data/slots/11/sandbox\nYT_OPERATION_ID=78b048b5-8055fabe-3fe03e8-d5b74b2a\nYT_JOB_INDEX=120\nYT_JOB_ID=fcebe6b9-e06ab2e1-3fe0384-d0b66453\nYT_START_ROW_INDEX=202133578\n\nUID          PID    PPID  C STIME TTY          TIME CMD\n19911     257386  239675  0 02:24 pts/1    00:00:00 /bin/bash\n19911     257397  257386  0 02:24 pts/1    00:00:00  \\_ ps -fu 19911 --forest\n19911     240043  239675  0 02:21 ?        00:00:00 /bin/bash -c :; ./my_mapper\n19911     240073  240043 91 02:21 ?        00:02:37  \\_ ./my_mapper\n\nyt_slot_11@n1757-sas:~$\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"15\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-15\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-15\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-15.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Command output displays all kinds of job information:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Path to the job's working directory: /yt/disk2/cluster-data/slots/11/sandbox.&lt;/li&gt;\n&lt;li&gt;Name of user job is running under: yt_slot_11.&lt;/li&gt;\n&lt;li&gt;List of processes running under current user.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The first and the second processes in the example belong to Job Shell, the third process is a bash command-line shell session that the job in question is launched in, and the forth is the user process itself.&lt;/p&gt;\n&lt;h2 id=\"user-process-analysis\"&gt;&lt;a href=\"en/user-guide/problems/jobshell-and-slowjobs.html#user-process-analysis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;User process analysis&lt;/span&gt;&lt;/a&gt;User process analysis&lt;/h2&gt;\n&lt;p&gt;The first thing to do is to execute the &lt;code&gt;top -p &amp;lt;PID&amp;gt;&lt;/code&gt; command passing in the user process ID as an argument. Below is an example and a call output:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt_slot_11@n1757-sas:~$ top -p 240073\ntop - 02:30:52 up 6 days,  7:11,  0 &lt;span class=\"hljs-built_in\"&gt;users&lt;/span&gt;,  load average: 41.26, 37.59, 39.23\nTasks:   1 total,   1 running,   0 sleeping,   0 stopped,   0 zombie\nCpu(s): 48.9%us,  5.6%sy,  0.0%ni, 31.1%&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;, 14.3%wa,  0.0%hi,  0.2%si,  0.0%st\nMem:  132001796k total, 130937776k used,  1064020k free,   296488k buffers\nSwap:        0k total,        0k used,        0k free, 107424768k cached\n\n    PID USER      PR  NI  VIRT  RES  SHR S %CPU %MEM    TIME+  COMMAND\n 240073 yt_slot_  20   0  4164  632  552 R   98  0.0   8:08.05 my_mapper\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"45\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-45\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-45\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-45.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;From CPU usage in this example (48.9%), it is obvious that the user process is performing computations, and the reason for the job's slow performance may be in the user code. You should connect to the job process using &lt;strong&gt;gdb&lt;/strong&gt; and try and figure out what it is doing at the moment.&lt;/p&gt;\n&lt;p&gt;If CPU usage is close to zero, this most likely means that the process is frozen in a system call. You should call &lt;strong&gt;strace&lt;/strong&gt; on the user process.&lt;br /&gt;\nExample call:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt_slot_11@n1757-sas:~$ strace -p 240073\nProcess 240073 attached - interrupt to quit\nwrite(4\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"52\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-52\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-52\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-52.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If the process is making system calls all the time (rather than freezing in a single one), be prepared for the stream of information that the above command will output to the console. In this situation, this syntax may prove useful: &lt;code&gt;strace -p &amp;lt;PID&amp;gt; 2&amp;gt;&amp;amp;1 | head&lt;/code&gt;. This helps you see a single call.&lt;/p&gt;\n&lt;p&gt;In addition, if your code is multi-treaded, it might be useful to add the &lt;code&gt;-f&lt;/code&gt; option that helps capture system calls from all threads.&lt;/p&gt;\n&lt;p&gt;If a process hangs up on a read or &lt;strong&gt;write&lt;/strong&gt; system call, you should look at the value of the first argument, which is the file descriptor of the thread. The value of zero for the &lt;strong&gt;read&lt;/strong&gt; system call and a small integer for the &lt;strong&gt;write&lt;/strong&gt; system call (1, 4, 7) means that for some reason, the YTsaurus Job Proxy service process is not releasing or accepting the next batch of data to or from the user process. In this situation, you need to advise the system administrator of the problem enclosing detailed information on the troubleshooting you have done. For more information on troubleshooting, see &lt;a href=\"user-guide/problems/howtoreport.html\"&gt;How to report&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;In the event of system call hang-ups on &lt;strong&gt;futex&lt;/strong&gt;, &lt;strong&gt;connect&lt;/strong&gt;, &lt;strong&gt;open&lt;/strong&gt;, &lt;strong&gt;stat&lt;/strong&gt;, and others, the cause is not related to the operation of &lt;code&gt;Job Proxy&lt;/code&gt; or the YTsaurus system overall. You should look for the problem inside user code. You need to use &lt;strong&gt;gdb&lt;/strong&gt; to figure out what is causing the block. If the user code is multi-threaded, for instance, and blockage occurs for some reason, &lt;strong&gt;strace&lt;/strong&gt; output could look like this:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt_slot_11@n1757-sas:~$ strace -p 240073 2&amp;gt;&amp;amp;1 | &lt;span class=\"hljs-built_in\"&gt;head&lt;/span&gt;\nProcess 240073 attached - interrupt to quit\nfutex(0x7ffff79b3e00, FUTEX_WAIT, 2, NULL\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"65\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-65\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-65\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-65.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;It is possible that the user process is not consuming any CPU, and &lt;strong&gt;strace&lt;/strong&gt; is not showing any system calls. This means that the code is using &lt;strong&gt;memory mapping&lt;/strong&gt; and reads from (or writes to) a file on disk. This results in a &lt;strong&gt;major page fault&lt;/strong&gt;, and the process waits while the operating system uploads data from disk into memory.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The use of &lt;strong&gt;memory mapping&lt;/strong&gt; in jobs is &lt;strong&gt;strongly discouraged&lt;/strong&gt; while jobs doing this create heavy disk load with random reads and writes. Such jobs are recognizable from the high values of the &lt;a href=\"user-guide/problems/jobstatistics.html\"&gt;statistics&lt;/a&gt; for &lt;code&gt;/user_job/block_io/[io_read,io_write]&lt;/code&gt;. Please remember that a conventional hard drive is capable of no more than 100 random access operations per second while there are several dozen jobs running concurrently on a cluster node.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;A specific example of a &lt;strong&gt;memory mapped&lt;/strong&gt; file read by a job is an operation executable and its dependencies dynamically loaded by a linker as the operation is launched. The loader code is normally written to prevent the resulting &lt;strong&gt;page faults&lt;/strong&gt; from causing problems. You should remember that reducing the executable and dependency size always has a salutary effect on performance. In particular, from the performance standpoint, it is better to use executables without debug symbols.&lt;/p&gt;\n&lt;h2 id=\"job-shell-execute-privilege\"&gt;&lt;a href=\"en/user-guide/problems/jobshell-and-slowjobs.html#job-shell-execute-privilege\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Job Shell execute privilege&lt;/span&gt;&lt;/a&gt;Job Shell execute privilege&lt;/h2&gt;\n&lt;p&gt;To run Job Shell, you need to have the operation &lt;strong&gt;read&lt;/strong&gt; and &lt;strong&gt;manage&lt;/strong&gt; privileges.&lt;/p&gt;\n&lt;p&gt;To get these, you need to include in the operation spec an &lt;a href=\"user-guide/storage/access-control.html\"&gt;ACL&lt;/a&gt; describing users and groups that are authorized to manipulate the operation and jobs when launching an operation.&lt;br /&gt;\nBy default, the ACL list is empty, and operation privileges are only issued to the user that launched the operation as well as the YTsaurus system administrators.&lt;/p&gt;\n&lt;p&gt;Example ACL configuration in Python:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;spec={&lt;span class=\"hljs-string\"&gt;\"acl\"&lt;/span&gt;: [{&lt;span class=\"hljs-string\"&gt;\"permissions\"&lt;/span&gt;: [&lt;span class=\"hljs-string\"&gt;\"read\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"manage\"&lt;/span&gt;], &lt;span class=\"hljs-string\"&gt;\"subjects\"&lt;/span&gt;: [&lt;span class=\"hljs-string\"&gt;\"user1\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"user2\"&lt;/span&gt;], &lt;span class=\"hljs-string\"&gt;\"action\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"allow\"&lt;/span&gt;}]}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"94\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-94\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-94\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-94.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The user from the YT_TOKEN/YT_TOKEN_PATH (authenticated_user) environment variables is added automatically.&lt;/p&gt;\n&lt;p&gt;To modify the access rights of an already running operation, you need to run the &lt;code&gt;update_operation_parameters&lt;/code&gt; command with a new ACL.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/problems/jobshell-and-slowjobs.md","sourcePath":"en/user-guide/problems/jobshell-and-slowjobs.md"},"headings":[{"title":"Starting Job Shell","href":"en/user-guide/problems/jobshell-and-slowjobs.html#starting-job-shell","level":2},{"title":"User process analysis","href":"en/user-guide/problems/jobshell-and-slowjobs.html#user-process-analysis","level":2},{"title":"Job Shell execute privilege","href":"en/user-guide/problems/jobshell-and-slowjobs.html#job-shell-execute-privilege","level":2}],"title":"Slow job troubleshooting"},"router":{"pathname":"en/user-guide/problems/jobshell-and-slowjobs","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
