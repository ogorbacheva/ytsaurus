        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section describes how and in what cases to ask for help when working with YTsaurus.  It also gives recommendations for how to compose requests and report errors.&lt;/p&gt;\n&lt;h2 id=\"request-examples\"&gt;&lt;a href=\"en/user-guide/problems/howtoreport.html#request-examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Request examples&lt;/span&gt;&lt;/a&gt;Request examples&lt;/h2&gt;\n&lt;p&gt;YTsaurus consists of different components and services, so there are several ways to ask for help or a question.  For each situation, there is a best way to report a problem or ask for help working with the system.  Before submitting your first request, select the appropriate method to minimize expenses in routing your request to people who can help.&lt;/p&gt;\n&lt;p&gt;Select the section that best fits your situation.&lt;/p&gt;\n&lt;h3 id=\"questions-about-the-web-interface\"&gt;&lt;a href=\"en/user-guide/problems/howtoreport.html#questions-about-the-web-interface\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Questions about the web interface&lt;/span&gt;&lt;/a&gt;Questions about the web interface&lt;/h3&gt;\n&lt;p&gt;If you're experiencing problems with the layout, updating data on the web interface, and similar problems, write to the &lt;a href=\"mailto:ui@ytsaurus.tech\"&gt;ui@ytsaurus.tech&lt;/a&gt; mailing list.&lt;br /&gt;\nMake sure to describe the problem and the expected behavior, and include the address of the page.&lt;/p&gt;\n&lt;h3 id=\"questions-about-the-current-functioning-of-the-system\"&gt;&lt;a href=\"en/user-guide/problems/howtoreport.html#questions-about-the-current-functioning-of-the-system\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Questions about the current functioning of the system&lt;/span&gt;&lt;/a&gt;Questions about the current functioning of the system&lt;/h3&gt;\n&lt;p&gt;Questions on the current functioning of YTsaurus include, but are not limited to:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Slow reading/recording of data and long calculations on the cluster.&lt;/li&gt;\n&lt;li&gt;Unknown errors when performing an operation or requests to the cluster.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Send a description of the problem and the most basic example necessary for the team to reproduce the problem to the &lt;a href=\"mailto:dev@ytsaurus.tech\"&gt;dev@ytsaurus.tech&lt;/a&gt; mailing list.&lt;br /&gt;\nIf the problem has to do with the operation's jobs being slow, first take all possible steps to diagnose the problem yourself using &lt;a href=\"user-guide/problems/jobshell-and-slowjobs.html\"&gt;Job Shell&lt;/a&gt; and &lt;a href=\"user-guide/problems/jobstatistics.html\"&gt;jobs statistics&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"questions-about-development\"&gt;&lt;a href=\"en/user-guide/problems/howtoreport.html#questions-about-development\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Questions about development&lt;/span&gt;&lt;/a&gt;Questions about development&lt;/h3&gt;\n&lt;p&gt;This category includes questions on the technology in general, and any consultations:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;API and its use.&lt;/li&gt;\n&lt;li&gt;Features and restrictions.&lt;/li&gt;\n&lt;li&gt;Questions on ways to optimize calculations.&lt;/li&gt;\n&lt;li&gt;Questions on types of YTsaurus quotes and how to get them.&lt;/li&gt;\n&lt;li&gt;Questions on assigning metrics and correctly interpreting graphs.&lt;/li&gt;\n&lt;li&gt;Questions on rating necessary resources.&lt;/li&gt;\n&lt;li&gt;Questions about reasons errors may appear and ways to self-diagnose them.&lt;/li&gt;\n&lt;li&gt;Conceptual questions and suggestions.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ask such questions on &lt;a href=\"https://stackoverflow.com\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Stack Overflow&lt;/a&gt;, and tag &lt;a href=\"https://stackoverflow.com/tags/ytsaurus\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ytsaurus&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"other-questions\"&gt;&lt;a href=\"en/user-guide/problems/howtoreport.html#other-questions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Other questions&lt;/span&gt;&lt;/a&gt;Other questions&lt;/h3&gt;\n&lt;p&gt;If none of the described categories fits your question or problem, write to the (mailto:community@ytsaurus.tech) mailing list.&lt;/p&gt;\n&lt;h2 id=\"suggestions-for-reporting-errors\"&gt;&lt;a href=\"en/user-guide/problems/howtoreport.html#suggestions-for-reporting-errors\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Suggestions for reporting errors&lt;/span&gt;&lt;/a&gt;Suggestions for reporting errors&lt;/h2&gt;\n&lt;p&gt;These suggestions will help you describe the situation in its original form, completely, without preemptive interpretations, and without missing important details.&lt;/p&gt;\n&lt;p&gt;Before sending your error report, read it over and imagine that you're the person who will be helping you. How would you start solving the problem? Is there enough information in your report to do this?&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Always show the error report in full.&lt;/strong&gt; Errors in YTsaurus are hierarchical: aside from the text itself, the error has attached attributes and enclosed errors.  Do not truncate the information, but show everything that's there. If the truncation happened before printing, try to figure out why this happened.  This may be useful to you in the future. If the information is being truncated by the API you're using, write to the (mailto:community@ytsaurus.tech) mailing list.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Enable logging.&lt;/strong&gt; Most SDKs provided by YTsaurus use a &lt;code&gt;YT_LOG_LEVEL&lt;/code&gt;environment variable. Establish its value in &lt;code&gt;debug&lt;/code&gt;, assemble the logs from stderr and attach them to your error report. It also makes sense to take into account the following proprietary circumstances:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;When using a Python library, you must configure logging through the &lt;code&gt;logging.getLogger('Yt').setLevel(logging.DEBUG)&lt;/code&gt; logging module.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;In Java libraries, slf4j is used for logging. To enable logs, enable the &lt;code&gt;debug&lt;/code&gt; level for &lt;code&gt;tech.ytsaurus&lt;/code&gt; loggers.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;If the problem is reproducing when you use the local YTsaurus, enable debug logs in it, after passing the &lt;code&gt;--enable-debug-logging&lt;/code&gt; option when calling &lt;code&gt;yt_local start&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;For product processes, keep debug logs enabled all the time, with the appropriate rotation and compression configured. In many complex cases, it is impossible to establish the reason without detailed logs. YTsaurus writes detailed logs on the server side, but if the problem is in the network interaction between the client and the server, for example, server logs are useless.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Provide more context:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Make sure to provide the maximum information about your cluster.&lt;/li&gt;\n&lt;li&gt;If the operation has concluded with an error, provide the result as an example.&lt;/li&gt;\n&lt;li&gt;If the code falls due to exclusion, you must attach a backtrace.&lt;/li&gt;\n&lt;li&gt;If the code concludes with an error and goes into the  memory dump, you have to send a link to the memory dump so it can be downloaded and examined.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;If the problem is being reproduced, try to find the minimum example to reproduce it.&lt;/strong&gt; Building a minimum example that reproduces the problem often enables you to find the error in the user code. If your calculations depend on additional data (tables, local files), prepare reliable links to that data. Additional data may be needed for the YTsaurus team to reproduce the problem on their own, if they cannot find the reason for the problem by reading the logs.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Try to provide the initial data.&lt;/strong&gt; Show the problem and everything having to do with it in its raw form. The YTsaurus team will do everything they can to understand the root cause.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Try to separate problems.&lt;/strong&gt; Don't write about different problems in the same error report. Submit two reports.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Use the tools provided by the system for independent diagnosis to their full capacity.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Provide more preceding history to hone performance.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Read the documentation, especially the FAQ&lt;/strong&gt; located in a separate &lt;a href=\"faq/index.html\"&gt;section&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/problems/howtoreport.md","sourcePath":"en/user-guide/problems/howtoreport.md"},"headings":[{"title":"Request examples","href":"en/user-guide/problems/howtoreport.html#request-examples","level":2,"items":[{"title":"Questions about the web interface","href":"en/user-guide/problems/howtoreport.html#questions-about-the-web-interface","level":3},{"title":"Questions about the current functioning of the system","href":"en/user-guide/problems/howtoreport.html#questions-about-the-current-functioning-of-the-system","level":3},{"title":"Questions about development","href":"en/user-guide/problems/howtoreport.html#questions-about-development","level":3},{"title":"Other questions","href":"en/user-guide/problems/howtoreport.html#other-questions","level":3}]},{"title":"Suggestions for reporting errors","href":"en/user-guide/problems/howtoreport.html#suggestions-for-reporting-errors","level":2}],"title":"Reporting a problem"},"router":{"pathname":"en/user-guide/problems/howtoreport","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
