        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"introduction\"&gt;&lt;a href=\"en/yql/udf/python.html#introduction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Introduction&lt;/span&gt;&lt;/a&gt;Introduction&lt;/h2&gt;\n&lt;p&gt;Sometimes it can be difficult to describe tasks using only a declarative language like SQL. You may find it more convenient to express declaratively which data to join and how to group it, and to describe the applied logic of data fragment processing in an imperative style. For this use case, YQL provides a mechanism for writing and calling user-defined functions (UDFs) in Python 3.6 or Python 2.7.&lt;/p&gt;\n&lt;h2 id=\"defining-and-calling-a-udf\"&gt;&lt;a href=\"en/yql/udf/python.html#defining-and-calling-a-udf\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Defining and calling a UDF&lt;/span&gt;&lt;/a&gt;Defining and calling a UDF&lt;/h2&gt;\n&lt;p&gt;To use a Python UDF in a YQL query, follow these steps:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Pass a string containing a Python script that defines the function to the query. This function will be called as a UDF.&lt;/li&gt;\n&lt;li&gt;In your query, declare the function name and its signature (input and output value types).&lt;/li&gt;\n&lt;li&gt;Call the function in the query body and pass the arguments to it.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Each of the three steps is described in detail below.&lt;/p&gt;\n&lt;h3 id=\"string-containing-a-python-script\"&gt;&lt;a href=\"en/yql/udf/python.html#string-containing-a-python-script\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;String containing a Python script&lt;/span&gt;&lt;/a&gt;String containing a Python script&lt;/h3&gt;\n&lt;p&gt;You can add your script as:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Regular string literal. For example: &lt;code&gt;\"def foo(): return 'bar'\"&lt;/code&gt;. This option isn't convenient for complex multi-line scripts.&lt;/li&gt;\n&lt;li&gt;Multi-line string literal (YQL extension). This literal is enclosed in &lt;code&gt;@@&lt;/code&gt; characters and works roughly similar to triple quotes in Python. The &lt;code&gt;#py&lt;/code&gt; comment enables Python syntax highlighting in the YQL editor:\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;@@#py\ndef foo():\n    return b'bar'\n@@\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"48\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-48\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-48\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-48.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;Named file attached to the query. You can include the script content in your query using the &lt;code&gt;FileContent(\"foo.py\")&lt;/code&gt; function.&lt;/li&gt;\n&lt;/ul&gt;\n\n&lt;h3 id=\"declare-function-name-and-signature\"&gt;&lt;a href=\"en/yql/udf/python.html#declare-function-name-and-signature\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Declare function name and signature&lt;/span&gt;&lt;/a&gt;Declare function name and signature&lt;/h3&gt;\n&lt;p&gt;Since Python is a dynamically typed language and YQL is statically typed, you need a method to define the types.&lt;br /&gt;\nThe &lt;strong&gt;name and signature&lt;/strong&gt; of the function called from the Python script must be known in advance before executing a YQL query. If the declared signature doesn't match the actual data that the function returns, the query will result in a runtime error — it's up to the user to ensure consistency.&lt;br /&gt;\nThere are three ways to specify the function &lt;strong&gt;signature&lt;/strong&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;In the query itself.&lt;/li&gt;\n&lt;li&gt;As an annotation of arguments and the output value (for Python 3 only).&lt;/li&gt;\n&lt;li&gt;As docstring in a Python function.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Since running arbitrary Python code in YQL isn't safe, the second and third options require running a separate Map operation on YT, which takes about 30–60 seconds.&lt;/p&gt;\n&lt;p&gt;Calling a separate function from the script body rather than running the entire script is implemented to ensure that not only a string value, but more complex data types (more on them below) can be returned in a UDF. So the approach &lt;code&gt;if __name__ == '__main__': ...&lt;/code&gt; that is popular in Python console utilities is of no use in this case, since the returned value can only be obtained through the standard script output (stdout).&lt;/p&gt;\n&lt;p&gt;&lt;/p&gt;\n&lt;p&gt;Example of declaring a function name and signature:&lt;br /&gt;\n&lt;code&gt;$f = Python3::foo(Callable&amp;lt;()-&amp;gt;String&amp;gt;, $script);&lt;/code&gt;&lt;br /&gt;\nWhere&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;$f&lt;/code&gt; and &lt;code&gt;$script&lt;/code&gt; are &lt;a href=\"en/yql/syntax/expressions.html#named-nodes\"&gt;named YQL expressions&lt;/a&gt;. In this example:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;$f&lt;/code&gt; is a ready-to-use function (contains the function name, its signature, and the script body).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;$script&lt;/code&gt; is the Python script body defined in one of the ways described in the previous section.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Python3::&lt;/code&gt; is a fixed namespace for Python 3.x functions. It's used to distinguish this construct from UDFs in other interpreted languages or C++. The &lt;code&gt;Python::&lt;/code&gt; alias is available as well. Specify &lt;code&gt;Python2::&lt;/code&gt; to use Python 2.7.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;foo&lt;/code&gt;: Name of the function to be called, defined in the &lt;code&gt;$script&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Callable&amp;lt;()-&amp;gt;String&amp;gt;&lt;/code&gt;: Function signature description. The empty brackets indicate that the function doesn't accept any arguments. String after the arrow means that the function returns a string. Example of a function signature with arguments: &lt;code&gt;Callable&amp;lt;(String, Uint32)-&amp;gt;Double&amp;gt;&lt;/code&gt;. &lt;a href=\"en/yql/types/type_string.html\"&gt;Detailed documentation on the format for describing data types&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;As an alternative to using a string describing the function signature, you may also pass the type of the called expression created via &lt;a href=\"en/yql/builtins/types.html\"&gt;functions for working with data types&lt;/a&gt;. This option is usually more convenient if the query uses multiple functions that handle the same composite data types, or if a composite data type can be obtained via &lt;a href=\"en/yql/builtins/types.html#typeof\"&gt;TypeOf&lt;/a&gt; from a table column or row.&lt;/p&gt;\n&lt;p&gt;If you omit the function signature description, YQL will extract it either from the annotations or from the beginning of the function's docstring to the first empty string or end of the docstring.&lt;/p&gt;\n&lt;p&gt;When describing a function with annotations, all arguments and the output value must be annotated. You can't use &lt;code&gt;*args&lt;/code&gt; and &lt;code&gt;**kwargs&lt;/code&gt;, and default values can only be &lt;code&gt;None&lt;/code&gt; while the corresponding argument types must be &lt;code&gt;Optional&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"type-annotations\"&gt;&lt;a href=\"en/yql/udf/python.html#type-annotations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Type annotations&lt;/span&gt;&lt;/a&gt;Type annotations&lt;/h3&gt;\n&lt;p&gt;Type annotations in Python 3 should use types from the &lt;code&gt;yql.typing&lt;/code&gt; module: &lt;a href=\"en/yql/types/primitive.html\"&gt;primitive types&lt;/a&gt; and, generally, same-name constructor functions of the types from the &lt;a href=\"en/yql/types/type_string.html\"&gt;text type description&lt;/a&gt;, except that square brackets are used instead of angle brackets due to Python restrictions.&lt;/p&gt;\n&lt;p&gt;To specify the types of &lt;code&gt;tuple&lt;/code&gt; or &lt;code&gt;structure&lt;/code&gt; without elements, use the &lt;code&gt;EmptyTuple&lt;/code&gt; and &lt;code&gt;EmptyStruct&lt;/code&gt; annotations.&lt;/p&gt;\n&lt;p&gt;To describe the type of a callable value, use the &lt;code&gt;Callable&lt;/code&gt; annotation, passing the number of optional arguments, the output value type, and argument descriptions in square brackets. The argument description is either a type or &lt;code&gt;slice&lt;/code&gt; in &lt;code&gt;argument-name:type:flags&lt;/code&gt; format. If you don't need to specify the argument name, use an empty string. You can omit the last &lt;code&gt;slice&lt;/code&gt; component, but if it is specified, it must be a &lt;code&gt;set&lt;/code&gt; of flags. Currently, the only possible flag value is &lt;code&gt;AutoMap&lt;/code&gt;. If you need to specify flags or a name for an argument of a particular UDF, specify the &lt;code&gt;slice&lt;/code&gt; object in the same form in the annotation.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Example of using annotations:&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$script = @@#py\nfrom yql.typing import *\n\n\ndef foo(\n    x:Optional[Int32],\n    y:Struct['a':Int32, 'b':Int32],\n    z:slice(\"name\", Int32, {AutoMap})) -&amp;gt; Optional[Int32]:\n    \"\"\"\n       foo function description\n    \"\"\"\n    return x + y.a + z\n@@;\n\n$udf = Python3::foo($script);\nSELECT $udf(1, AsStruct(2 AS a, 3 AS b), 10 AS name); -- 13\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"150\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-150\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-150\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-150.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;strong&gt;Example of using docstring:&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$script = @@#py\ndef foo():\n    \"\"\"\n       ()-&amp;gt;String\n\n       foo function description\n    \"\"\"\n    return b\"bar\"\n@@;\n\n$udf = Python3::foo($script);\nSELECT $udf(); -- bar\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"154\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-154\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-154\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-154.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"calling-a-udf-in-a-query\"&gt;&lt;a href=\"en/yql/udf/python.html#calling-a-udf-in-a-query\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Calling a UDF in a query&lt;/span&gt;&lt;/a&gt;Calling a UDF in a query&lt;/h3&gt;\n&lt;p&gt;You can call the function obtained after declaring the signature in the same way as any other built-in YQL function, passing arguments in parentheses. For example, &lt;code&gt;$f()&lt;/code&gt; or &lt;code&gt;$udf(\"test\", 123)&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"data-types\"&gt;&lt;a href=\"en/yql/udf/python.html#data-types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data types&lt;/span&gt;&lt;/a&gt;Data types&lt;/h2&gt;\n&lt;h3 id=\"primitive-data-type\"&gt;&lt;a href=\"en/yql/udf/python.html#primitive-data-type\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Primitive (Data type)&lt;/span&gt;&lt;/a&gt;Primitive (Data type)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"en/yql/types/primitive.html\"&gt;Primitive data types&lt;/a&gt;&lt;/p&gt;\n&lt;h3 id=\"nullable-types\"&gt;&lt;a href=\"en/yql/udf/python.html#nullable-types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nullable types&lt;/span&gt;&lt;/a&gt;Nullable types&lt;/h3&gt;\n&lt;p&gt;In YQL, table columns (and any values as well) can be either non-nullable or &lt;a href=\"en/yql/types/optional.html\"&gt;potentially nullable&lt;/a&gt; (in SQL terms, nullable means allowing &lt;code&gt;NULL&lt;/code&gt;). Functions in YQL, including Python functions, must declare in their signature whether they can handle potentially nullable input values, and whether they need to be able to return a nullable value (&lt;code&gt;NULL&lt;/code&gt;, or \"empty Optional\").&lt;/p&gt;\n&lt;p&gt;When specifying a signature for a Python UDF, nullable types are indicated by appending the &lt;code&gt;?&lt;/code&gt; suffix; for example, &lt;code&gt;String?&lt;/code&gt; or &lt;code&gt;Double?&lt;/code&gt;. For Python, &lt;code&gt;NULL&lt;/code&gt; values correspond to &lt;code&gt;None&lt;/code&gt; in the argument or in the returned function value.&lt;/p&gt;\n&lt;p&gt;If an argument is marked as allowing &lt;code&gt;NULL&lt;/code&gt; (Optional/Nullable), this &lt;strong&gt;doesn't mean&lt;/strong&gt; that it can be omitted when calling the function.&lt;/p&gt;\n&lt;p&gt;When describing the function signature, optional arguments are specified in square brackets after the required ones. Python will pass &lt;code&gt;None&lt;/code&gt; as the values of all optional arguments not specified when calling the function.&lt;/p&gt;\n&lt;p&gt;For example, if a function's arguments are declared as &lt;code&gt;(String, [Int32?, Bool?])&lt;/code&gt;, it means that the function takes three arguments: one required String argument and two optional Int32 and Bool arguments, respectively.&lt;/p&gt;\n&lt;h3 id=\"containers\"&gt;&lt;a href=\"en/yql/udf/python.html#containers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Containers&lt;/span&gt;&lt;/a&gt;Containers&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Name&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Signature declaration&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Signature example&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Representation in Python&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;List&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;List&amp;lt;Type&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;List&amp;lt;Int32&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list-like object&lt;/code&gt; &lt;a href=\"en/yql/udf/python.html#python-container-wrappers\"&gt;(learn more)&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Dictionary&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Dict&amp;lt;KeyType,ValueType&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Dict&amp;lt;String,Int32&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;dict-like object&lt;/code&gt; &lt;a href=\"en/yql/udf/python.html#python-container-wrappers\"&gt;(learn more)&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Set&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Set&amp;lt;KeyType&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Set&amp;lt;String&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;dict-like object&lt;/code&gt; &lt;a href=\"en/yql/udf/python.html#python-container-wrappers\"&gt;(learn more)&lt;/a&gt;, value type — &lt;code&gt;yql.Void&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tuple&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Tuple&amp;lt;Type1,...,TypeN&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Tuple&amp;lt;Int32,Int32&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tuple&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Structure&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Struct&amp;lt;Name1:Type1,...,NameN:TypeN&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Struct&amp;lt;Name:String,Age:Int32&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Python2 : &lt;code&gt;object&lt;/code&gt; /  Python3 : &lt;code&gt;StructSequence&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Stream&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Stream&amp;lt;Type&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Stream&amp;lt;Int32&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;generator&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Variant on tuple&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Variant&amp;lt;Type1,Type2&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Variant&amp;lt;Int32,String&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tuple with index and object&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Variant on structure&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Variant&amp;lt;Name1:Type1,Name2:Type2&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Variant&amp;lt;value:Int32,error:String&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tuple with field name and object&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Enumeration&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Enum&amp;lt;Name1, Name2&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Enum&amp;lt;Foo,Bar&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tuple with field name and yql.Void&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Containers can be nested. For example, &lt;code&gt;List&amp;lt;Tuple&amp;lt;Int32,Int32&amp;gt;&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"special-types\"&gt;&lt;a href=\"en/yql/udf/python.html#special-types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Special types&lt;/span&gt;&lt;/a&gt;Special types&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Callable&lt;/strong&gt;: A callable value that can be executed by passing arguments in parentheses in SQL syntax or with Apply in s-expressions. Since the signature of the called expressions must be statically known, all Python UDFs that return callable values must specify their signature as well. For example, &lt;code&gt;(Double)-&amp;gt;(Bool)-&amp;gt;Int64&lt;/code&gt;: a UDF takes Double as input and returns a callable value with the &lt;code&gt; (Bool)-&amp;gt;Int64&lt;/code&gt; signature. You can also use this approach to build longer chains of callable values.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Resource&lt;/strong&gt;: An opaque pointer to a resource you can pass between user-defined functions. The type of the returned and accepted resource is declared inside a function with a string label. This label is used to match them in advance to ensure that the resources aren't passed between incompatible functions. In a C++ UDF, you can set a custom resource name, whereas Python UDFs currently only allow a fixed resource name, &lt;code&gt;Python2&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Void&lt;/strong&gt;: No other type; it is the &lt;code&gt;NULL&lt;/code&gt; literal type.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"automatic-type-conversion-when-interacting-with-python-udfs\"&gt;&lt;a href=\"en/yql/udf/python.html#automatic-type-conversion-when-interacting-with-python-udfs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Automatic type conversion when interacting with Python UDFs&lt;/span&gt;&lt;/a&gt;Automatic type conversion when interacting with Python UDFs&lt;/h2&gt;\n&lt;p&gt;As input:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;String&lt;/code&gt;,&lt;code&gt;Yson&lt;/code&gt; to &lt;code&gt;bytes&lt;/code&gt; (&lt;code&gt;str&lt;/code&gt; for Python 2).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Utf8&lt;/code&gt;,&lt;code&gt;Json&lt;/code&gt; to &lt;code&gt;str&lt;/code&gt; (&lt;code&gt;unicode&lt;/code&gt; for Python 2).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Void&lt;/code&gt; type object: to &lt;code&gt;yql.Void&lt;/code&gt; (&lt;code&gt;import yql&lt;/code&gt; needed).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;As output:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;long/int&lt;/code&gt; to &lt;code&gt;Int8&lt;/code&gt;, &lt;code&gt;Int16&lt;/code&gt;, &lt;code&gt;Int32&lt;/code&gt;, &lt;code&gt;Int64&lt;/code&gt;, &lt;code&gt;Uint8&lt;/code&gt;, &lt;code&gt;Uint16&lt;/code&gt;, &lt;code&gt;Uint32&lt;/code&gt;, &lt;code&gt;Uint64&lt;/code&gt;, &lt;code&gt;Float&lt;/code&gt;, &lt;code&gt;Double&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;float&lt;/code&gt; to &lt;code&gt;Float&lt;/code&gt;, &lt;code&gt;Double&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;str&lt;/code&gt; (&lt;code&gt;unicode&lt;/code&gt; in Python 2) to &lt;code&gt;String&lt;/code&gt;, &lt;code&gt;Utf8&lt;/code&gt;, &lt;code&gt;Yson&lt;/code&gt;, &lt;code&gt;Json&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;bytes&lt;/code&gt; (&lt;code&gt;str&lt;/code&gt; in Python 2) to &lt;code&gt;String&lt;/code&gt;, &lt;code&gt;Yson&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;dict&lt;/code&gt; or object to &lt;code&gt;Struct&amp;lt;...&amp;gt;&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;tuple&lt;/code&gt; to &lt;code&gt;List&amp;lt;...&amp;gt;&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Any object to &lt;code&gt;Bool&lt;/code&gt; according to &lt;a href=\"https://docs.python.org/3/library/stdtypes.html?#truth-value-testing\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Python rules&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Generators, iterators, and iterable objects to &lt;code&gt;Stream&amp;lt;...&amp;gt;&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Iterable objects to lazy &lt;code&gt;List&amp;lt;...&amp;gt;&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;See the table above for basic container representations.&lt;/p&gt;\n&lt;p&gt;You can configure automatic YSON unpacking on UDF boundaries using the &lt;code&gt;_yql_convert_yson&lt;/code&gt; property of the Python function. You should put a tuple with functions for deserialization and serialization into the property.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Example:&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$script = @@#py\nimport cyson\n\ndef f(s):\n    abc = s.get(b\"abc\", 0)\n    return (abc, s)\n\nf._yql_convert_yson = (cyson.loads, cyson.dumps)\n@@;\n\n$udf = Python3::f(Callable&amp;lt;(Yson?)-&amp;gt;Tuple&amp;lt;Int64,Yson?&amp;gt;&amp;gt;, $script);\n\nSELECT $udf(CAST(@@{\"abc\"=1}@@ as Yson));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"442\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-442\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-442\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-442.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;/p&gt;\n&lt;p&gt;A string in Python 3 corresponds to the &lt;code&gt;Utf8&lt;/code&gt; type in YQL, and the &lt;code&gt;String&lt;/code&gt; type corresponds to &lt;code&gt;bytes&lt;/code&gt; in Python 3.&lt;/p&gt;\n&lt;p&gt;Not following this rule can in many cases lead to unexpected and seemingly erroneous behavior, for example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$script = @@#py\ndef getDict():\n    return {'Key': 123}\n@@;\n$utfDict = Python::getDict(Callable&amp;lt;()-&amp;gt; Dict&amp;lt;Utf8, Int32&amp;gt;&amp;gt;,  $script);\n$strDict = Python::getDict(Callable&amp;lt;()-&amp;gt; Dict&amp;lt;String, Int32&amp;gt;&amp;gt;, $script);\nSELECT $utfDict()['Key'] AS good, $strDict()['Key'] AS bad, $strDict() AS strange;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"452\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-452\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-452\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-452.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;In Python2, there was actually no difference between a text string and a byte sequence.&lt;/p&gt;\n&lt;p&gt;&lt;/p&gt;\n&lt;h2 id=\"python-struct-fields\"&gt;&lt;a href=\"en/yql/udf/python.html#python-struct-fields\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Getting a list of structure fields&lt;/span&gt;&lt;/a&gt;Getting a list of structure fields&lt;/h2&gt;\n&lt;p&gt;Instead of directly accessing structure fields using dot notation, it can sometimes be convenient to loop over all fields and use &lt;code&gt;getattr&lt;/code&gt; to retrieve their values. You can do this by accessing &lt;code&gt;__class__.__match_args__&lt;/code&gt; on a structure object.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$script = @@#py\ndef f(s):\n    return \",\".join(str(getattr(s,name)) for name in s.__class__.__match_args__)\n@@;\n\n$f = ($s)-&amp;gt;{\n    return Python::f(CallableType(0,Utf8,TypeOf($s)),$script)($s);\n};\n\nselect $f(&amp;lt;|a:\"foo\"u,b:\"bar\"u|&amp;gt;); -- \"foo,bar\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"468\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-468\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-468\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-468.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"python-container-wrappers\"&gt;&lt;a href=\"en/yql/udf/python.html#python-container-wrappers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Specifics of objects for lists and dictionaries passed to functions&lt;/span&gt;&lt;/a&gt;Specifics of objects for lists and dictionaries passed to functions&lt;/h2&gt;\n&lt;p&gt;The lists and dictionaries that you pass to Python UDFs are not actually passed as real Python objects of type list or dict, but rather as special &lt;code&gt;yql.TList&lt;/code&gt; and &lt;code&gt;yql.TDict&lt;/code&gt; objects, which are read-only and help avoid copying all data into memory.&lt;/p&gt;\n&lt;p&gt;Notes on both objects:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Both objects are read-only, meaning you can't make any changes to them without copying them first, because another part of the current query may use the same object. For example, a neighboring function.&lt;/li&gt;\n&lt;li&gt;At the cost of potentially slow copying, you can retrieve a real list object (set, frozenset, and other objects are also possible if necessary) from them by iterating for partial copying or performing some transformations when copying. For dictionaries, you also need to call &lt;code&gt;iteritems()&lt;/code&gt;. By setting the &lt;code&gt;_yql_lazy_input&lt;/code&gt; attribute value to False on the Python function itself, you can enable automatic copying of lists and dictionaries to \"list\" and \"dict\". This mechanism works recursively for nested containers and also supports other types of containers, including Struct and Tuple.&lt;/li&gt;\n&lt;li&gt;To get the number of elements, you can call &lt;code&gt;len(my_arg)&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;The below documented method sets may be slightly outdated. You can find out the current set using &lt;code&gt;dir(my_arg)&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Notes on &lt;code&gt;yql.TList&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;has_fast_len()&lt;/code&gt; indicates whether you can quickly get the list length. If False is returned, the list is lazy.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;has_items()&lt;/code&gt; checks whether the list is empty.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;reversed()&lt;/code&gt; returns a reversed copy of the list.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;skip(n)&lt;/code&gt; and &lt;code&gt;take(n)&lt;/code&gt; perform an equivalent function to &lt;code&gt;[n:]&lt;/code&gt; and &lt;code&gt;[:n]&lt;/code&gt; slices, respectively. An invalid index (n value) may throw the exception &lt;code&gt;IndexError&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;to_index_dict()&lt;/code&gt; returns a dictionary with element indices as keys, which allows random access. It is disabled on the &lt;code&gt;yql.TList&lt;/code&gt; object.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;** Attention! These specifics are no longer recommended to be used and will be removed in future updates.**&lt;br /&gt;\nYou can use standard Python methods to organize random access to the list:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;list[index]: Access by index.&lt;/li&gt;\n&lt;li&gt;list[start:stop:step]: List slice.&lt;/li&gt;\n&lt;li&gt;reversed(list): List reversing.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Example with _yql_lazy_input:&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$u = Python3::list_func(Callable&amp;lt;(List&amp;lt;Int32&amp;gt;)-&amp;gt;Int32&amp;gt;, @@#py\ndef list_func(lst):\n  return lst.count(1)\nlist_func._yql_lazy_input = False\n@@);\nSELECT $u(AsList(1,2,3));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"553\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-553\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-553\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-553.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"please-note\"&gt;&lt;a href=\"en/yql/udf/python.html#please-note\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Please note&lt;/span&gt;&lt;/a&gt;Please note&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;When working on YT, the standard output (stdout) is used for system purposes. Therefore, you must not use it from UDFs.&lt;/li&gt;\n&lt;li&gt;All heavy initialization should be done outside frequently called functions, either at the module level or using closures (&lt;a href=\"en/yql/udf/python.html#separate-init-example\"&gt;see the example below&lt;/a&gt;). Otherwise, the operation may not only take an indefinitely long time, but also interfere with its neighbors in a MapReduce cluster.&lt;/li&gt;\n&lt;li&gt;You can register multiple functions from a single script by repeating the function name and signature declaration the required number of times.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"en/yql/udf/python.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h2&gt;\n&lt;h3 id=\"hello-world\"&gt;&lt;a href=\"en/yql/udf/python.html#hello-world\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hello World&lt;/span&gt;&lt;/a&gt;Hello World&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$script = @@#py\ndef hello(name):\n    return b'Hello, %s!' % name\n@@;\n\n$udf = Python3::hello(Callable&amp;lt;(String)-&amp;gt;String&amp;gt;, $script);\n\nSELECT $udf(\"world\");\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"580\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-580\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-580\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-580.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"generators-for-creating-lists\"&gt;&lt;a href=\"en/yql/udf/python.html#generators-for-creating-lists\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Generators for creating lists&lt;/span&gt;&lt;/a&gt;Generators for creating lists&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$script = @@#py\ndef gen():\n    for x in range(1, 10):\n        yield x\n@@;\n$udf = Python::gen(Callable&amp;lt;()-&amp;gt;Stream&amp;lt;Int64&amp;gt;&amp;gt;, $script);\nSELECT Yql::Collect($udf());\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"584\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-584\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-584\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-584.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Can be used in combination with &lt;a href=\"en/yql/syntax/process.html\"&gt;PROCESS&lt;/a&gt; for stream table processing, for example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$udf = Python::process(\nCallable&amp;lt;\n    (List&amp;lt;Struct&amp;lt;\n        age:Int64,\n        name:String?\n    &amp;gt;&amp;gt;)-&amp;gt;Stream&amp;lt;Struct&amp;lt;result:Int64&amp;gt;&amp;gt;\n&amp;gt;, @@\ndef process(rows):\n    for row in rows:\n        result = row.age ** len(row.name or '')\n        yield locals()\n@@);\n\n$users = (\n    SELECT age, name FROM &amp;lt;table_name&amp;gt;\n);\n\nPROCESS $users\nUSING $udf(TableRows());\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"588\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-588\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-588\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-588.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"separate-init-example\"&gt;&lt;a href=\"en/yql/udf/python.html#separate-init-example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Splitting initialization and function call&lt;/span&gt;&lt;/a&gt;Splitting initialization and function call&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$script = @@#py\ndef multiply_by_filesize(path):\n    with open(path, 'r') as f:\n        size = len(f.read())\n\n        def multiply(arg):\n            return arg * size  # closure\n\n        return multiply\n@@;\n$udf = Python3::multiply_by_filesize(\n    Callable&amp;lt;(String)-&amp;gt;Callable&amp;lt;(Int64)-&amp;gt;Int64&amp;gt;&amp;gt;,\n    $script\n);\n$callable = $udf(FilePath(\"foo.txt\")); -- expensive initialization\nSELECT $callable(123);                 -- cheap call of already initialized function\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"592\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-592\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-592\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-592.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"using-input-data-type-when-declaring-a-signature\"&gt;&lt;a href=\"en/yql/udf/python.html#using-input-data-type-when-declaring-a-signature\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Using input data type when declaring a signature&lt;/span&gt;&lt;/a&gt;Using input data type when declaring a signature&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$func = ($obj) -&amp;gt; {\n    $udf = Python3::func(\n        CallableType(0, ParseType(\"String?\"), TypeOf($obj)),\n        FileContent(\"my_func.py\")\n    );\n    RETURN $udf($obj);\n};\n\nSELECT $func(TableRow()) FROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"596\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-596\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-596\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-596.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"secureparam\"&gt;&lt;a href=\"en/yql/udf/python.html#secureparam\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SecureParam&lt;/span&gt;&lt;/a&gt;SecureParam&lt;/h3&gt;\n\n&lt;p&gt;To use SecureParam in Python, access the &lt;code&gt;_yql_secure_param(token)&lt;/code&gt; attribute of the function whose signature is declared in the query, where &lt;code&gt;token&lt;/code&gt; (string) is the name of the token whose value you need to obtain. The token name must be passed through the &lt;code&gt;SecureParam()&lt;/code&gt; wrapper. Otherwise, the value won't be found. If the token isn't found by name, the function will end with an error.&lt;br /&gt;\nExample of using SecureParam&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$secParLen = @@#py\ndef MyFunc(token):\n    return len(MyFunc._yql_secure_param(token))\n@@;\n$udf = Python::MyFunc(Callable&amp;lt;(String)-&amp;gt;Int&amp;gt;, $secParLen);\nSELECT $udf(SecureParam(\"token:default_yt\"));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"604\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-604\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-604\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-604.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;See &lt;a href=\"en/yql/builtins/types.html\"&gt;Functions for working with data types&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/udf/python.md","sourcePath":"en/yql/udf/python.md"},"headings":[{"title":"Introduction","href":"en/yql/udf/python.html#introduction","level":2},{"title":"Defining and calling a UDF","href":"en/yql/udf/python.html#defining-and-calling-a-udf","level":2,"items":[{"title":"String containing a Python script","href":"en/yql/udf/python.html#string-containing-a-python-script","level":3},{"title":"Declare function name and signature","href":"en/yql/udf/python.html#declare-function-name-and-signature","level":3},{"title":"Type annotations","href":"en/yql/udf/python.html#type-annotations","level":3},{"title":"Calling a UDF in a query","href":"en/yql/udf/python.html#calling-a-udf-in-a-query","level":3}]},{"title":"Data types","href":"en/yql/udf/python.html#data-types","level":2,"items":[{"title":"Primitive (Data type)","href":"en/yql/udf/python.html#primitive-data-type","level":3},{"title":"Nullable types","href":"en/yql/udf/python.html#nullable-types","level":3},{"title":"Containers","href":"en/yql/udf/python.html#containers","level":3},{"title":"Special types","href":"en/yql/udf/python.html#special-types","level":3}]},{"title":"Automatic type conversion when interacting with Python UDFs","href":"en/yql/udf/python.html#automatic-type-conversion-when-interacting-with-python-udfs","level":2},{"title":"Getting a list of structure fields","href":"en/yql/udf/python.html#python-struct-fields","level":2},{"title":"Specifics of objects for lists and dictionaries passed to functions","href":"en/yql/udf/python.html#python-container-wrappers","lev
