        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;a href=\"https://www.hyperscan.io\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Hyperscan&lt;/a&gt; is an open source library developed by Intel for searching with regular expressions.&lt;/p&gt;\n&lt;p&gt;The library features 4 implementations with different processor instruction sets (SSE3, SSE4.2, AVX2, and AVX512) that are chosen automatically depending on the current processor.&lt;/p&gt;\n&lt;p&gt;By default, all functions work in the single-byte mode. However, if the regular expression is a valid UTF-8 string but is not a valid ASCII string, the UTF-8 mode is enabled automatically.&lt;/p&gt;\n&lt;h2 id=\"function-list\"&gt;&lt;a href=\"en/yql/udf/list/hyperscan.html#function-list\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List of functions&lt;/span&gt;&lt;/a&gt;List of functions&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Hyperscan::Grep(pattern:String) -&amp;gt; (string:String?) -&amp;gt; Bool&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Hyperscan::Match(pattern:String) -&amp;gt; (string:String?) -&amp;gt; Bool&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Hyperscan::BacktrackingGrep(pattern:String) -&amp;gt; (string:String?) -&amp;gt; Bool&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Hyperscan::BacktrackingMatch(pattern:String) -&amp;gt; (string:String?) -&amp;gt; Bool&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Hyperscan::MultiGrep(pattern:String) -&amp;gt; (string:String?) -&amp;gt; Tuple&amp;lt;Bool, Bool, ...&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Hyperscan::MultiMatch(pattern:String) -&amp;gt; (string:String?) -&amp;gt; Tuple&amp;lt;Bool, Bool, ...&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Hyperscan::Capture(pattern:String) -&amp;gt; (string:String?) -&amp;gt; String?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Hyperscan::Replace(pattern:String) -&amp;gt; (string:String?, replacement:String) -&amp;gt; String?&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"syntax\"&gt;&lt;a href=\"en/yql/udf/list/hyperscan.html#syntax\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Call syntax&lt;/span&gt;&lt;/a&gt;Call syntax&lt;/h2&gt;\n&lt;p&gt;To avoid compiling a regular expression at each table row at direct call, wrap the function call by a &lt;a href=\"en/yql/syntax/expressions.html#named-nodes\"&gt;named expression&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$re = Hyperscan::Grep(\"\\\\d+\");      -- we create a called value to test the specific regular expression\nSELECT * FROM table WHERE $re(key); -- we use the value to filter the table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"60\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-60\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-60\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-60.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;strong&gt;Please note&lt;/strong&gt; escaping of special characters in regular expressions. Be sure to use the second slash, since all the standard string literals in SQL can accept C-escaped strings, and the &lt;code&gt;\\d&lt;/code&gt; sequence is not a valid sequence (even if it were, it wouldn't search for numbers as intended).&lt;/p&gt;\n&lt;p&gt;You can enable the case-insensitive mode by specifying, at the beginning of the regular expression, the flag &lt;code&gt;(?i)&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"grep\"&gt;&lt;a href=\"en/yql/udf/list/hyperscan.html#grep\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Grep&lt;/span&gt;&lt;/a&gt;Grep&lt;/h2&gt;\n&lt;p&gt;Matches the regular expression with a &lt;strong&gt;part of the string&lt;/strong&gt; (arbitrary substring).&lt;/p&gt;\n&lt;h2 id=\"match\"&gt;&lt;a href=\"en/yql/udf/list/hyperscan.html#match\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Match&lt;/span&gt;&lt;/a&gt;Match&lt;/h2&gt;\n&lt;p&gt;Matches the &lt;strong&gt;whole string&lt;/strong&gt; against the regular expression.&lt;/p&gt;\n&lt;p&gt;To get a result similar to that of &lt;code&gt;Grep&lt;/code&gt; (that matches against a substring), enclose the regular expression in &lt;code&gt;.*&lt;/code&gt; on both sides (&lt;code&gt;.*foo.*&lt;/code&gt; instead of &lt;code&gt;foo&lt;/code&gt;). However, in terms of code readability, it's usually better to change the function.&lt;/p&gt;\n&lt;h2 id=\"backtrackinggrep\"&gt;&lt;a href=\"en/yql/udf/list/hyperscan.html#backtrackinggrep\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BacktrackingGrep / BacktrackingMatch&lt;/span&gt;&lt;/a&gt;BacktrackingGrep / BacktrackingMatch&lt;/h2&gt;\n&lt;p&gt;The functions are identical to the same-name functions without the &lt;code&gt;Backtracking&lt;/code&gt; prefix. However, they support a broader range of regular expressions. This is due to the fact that if a specific regular expression is not fully supported by Hyperscan, the library switches to the prefilter mode. In this case, it responds not by \"Yes\" or \"No\", but by \"Definitely not\" or \"Maybe yes\". The \"maybe yes\" answers are then automatically rechecked using the slower but more powerful &lt;a href=\"https://www.pcre.org\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;libpcre&lt;/a&gt; library.&lt;/p&gt;\n&lt;h2 id=\"multigrep\"&gt;&lt;a href=\"en/yql/udf/list/hyperscan.html#multigrep\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MultiGrep / MultiMatch&lt;/span&gt;&lt;/a&gt;MultiGrep / MultiMatch&lt;/h2&gt;\n&lt;p&gt;Hyperscan lets you match against multiple regular expressions in a single pass through the text, and get a separate response for each match.&lt;/p&gt;\n&lt;p&gt;However, if you want to match a string against any of the listed expressions (the results would be joined with \"or\"), it would be more efficient to combine the query parts in a single regular expression with &lt;code&gt;|&lt;/code&gt; and match it with regular &lt;code&gt;Grep&lt;/code&gt; or &lt;code&gt;Match&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;When you call &lt;code&gt;MultiGrep&lt;/code&gt;/&lt;code&gt;MultiMatch&lt;/code&gt;, regular expressions are passed one per line using &lt;a href=\"en/yql/syntax/lexer.html#multiline-string-literals\"&gt;multiline string literals&lt;/a&gt;:&lt;/p&gt;\n&lt;h4 id=\"example\"&gt;&lt;a href=\"en/yql/udf/list/hyperscan.html#example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$multi_match = Hyperscan::MultiMatch(@@a.*\n.*x.*\n.*axa.*@@);\n\nSELECT\n    $multi_match(\"a\") AS a,     -- (true, false, false)\n    $multi_match(\"axa\") AS axa; -- (true, true, true)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"103\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-103\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-103\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-103.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"capture\"&gt;&lt;a href=\"en/yql/udf/list/hyperscan.html#capture\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Capture and Replace&lt;/span&gt;&lt;/a&gt;Capture and Replace&lt;/h2&gt;\n&lt;p&gt;If a string matches the given regexp, &lt;code&gt;Hyperscan::Capture&lt;/code&gt; returns the last substring matched by the regexp. &lt;code&gt;Hyperscan::Replace&lt;/code&gt; replaces all substrings matched by the specified regexp with the given string.&lt;/p&gt;\n&lt;p&gt;Hyperscan offers limited capabilities for such operations. This means that although &lt;code&gt;Hyperscan::Capture&lt;/code&gt; and &lt;code&gt;Hyperscan::Replace&lt;/code&gt; are implemented for uniformity, we recommend using same-name functions from Re2 for non-obvious search and replacement operations:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/yql/udf/list/re2.html#capture\"&gt;Re2::Capture&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/udf/list/re2.html#replace\"&gt;Re2::Replace&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"usage-example\"&gt;&lt;a href=\"en/yql/udf/list/hyperscan.html#usage-example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usage example&lt;/span&gt;&lt;/a&gt;Usage example&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$value = \"xaaxaaXaa\";\n\n$match = Hyperscan::Match(\"a.*\");\n$grep = Hyperscan::Grep(\"axa\");\n$insensitive_grep = Hyperscan::Grep(\"(?i)axaa$\");\n$multi_match = Hyperscan::MultiMatch(@@a.*\n.*a.*\n.*a\n.*axa.*@@);\n\n$capture = Hyperscan::Capture(\".*a{2}.*\");\n$capture_many = Hyperscan::Capture(\".*x(a+).*\");\n$replace = Hyperscan::Replace(\"xa\");\n\nSELECT\n    $match($value) AS match,                        -- false\n    $grep($value) AS grep,                          -- true\n    $insensitive_grep($value) AS insensitive_grep,  -- true\n    $multi_match($value) AS multi_match,            -- (false, true, true, true)\n    $multi_match($value).0 AS some_multi_match,     -- false\n    $capture($value) AS capture,                    -- \"xaa\"\n    $capture_many($value) AS capture_many,          -- \"xa\"\n    $replace($value, \"b\") AS replace                -- \"babaXaa\"\n;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"128\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-128\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-128\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-128.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/udf/list/hyperscan.md","sourcePath":"en/yql/udf/list/hyperscan.md"},"headings":[{"title":"List of functions","href":"en/yql/udf/list/hyperscan.html#function-list","level":2},{"title":"Call syntax","href":"en/yql/udf/list/hyperscan.html#syntax","level":2},{"title":"Grep","href":"en/yql/udf/list/hyperscan.html#grep","level":2},{"title":"Match","href":"en/yql/udf/list/hyperscan.html#match","level":2},{"title":"BacktrackingGrep / BacktrackingMatch","href":"en/yql/udf/list/hyperscan.html#backtrackinggrep","level":2},{"title":"MultiGrep / MultiMatch","href":"en/yql/udf/list/hyperscan.html#multigrep","level":2},{"title":"Capture and Replace","href":"en/yql/udf/list/hyperscan.html#capture","level":2},{"title":"Usage example","href":"en/yql/udf/list/hyperscan.html#usage-example","level":2}],"title":"Hyperscan"},"router":{"pathname":"en/yql/udf/list/hyperscan","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
