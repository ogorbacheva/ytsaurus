            {"data":{"leading":false,"html":"&lt;p&gt;&lt;a href=\"https://ytsaurus.tech/docs/en/user-guide/storage/yson\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YSON&lt;/a&gt; is a data format similar to JSON developed by Yandex.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Similarities with JSON:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Does not have a strict scheme.&lt;/li&gt;\n&lt;li&gt;Besides simple data types, it supports dictionaries and lists in arbitrary combinations.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Some differences from JSON:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;It also has a binary representation in addition to the text representation.&lt;/li&gt;\n&lt;li&gt;The text representation uses semicolons instead of commas and equal signs instead of colons.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;The concept of \"attributes\" is supported, that is, named properties that can be assigned to a node in the tree.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Implementation specifics and functionality of the module:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Along with YSON, this module also supports standard JSON to expand the application scope in a way.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;It works with a DOM representation of YSON in memory that in YQL terms is passed between functions as a \"resource\" (see the &lt;a href=\"en/yql/types/special.html\"&gt;description of special data types&lt;/a&gt;). Most of the module's functions have the semantics of a query to perform a specified operation with a resource and return an empty &lt;a href=\"en/yql/types/optional.html\"&gt;optional&lt;/a&gt; type if the operation failed because the actual data type mismatched the expected one.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Provides several main classes of functions (find below a complete list and detailed description of functions):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Yson::Parse***&lt;/code&gt;: Getting a resource with a DOM object from serialized data, with all further operations performed on the obtained resource.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Yson::From&lt;/code&gt;: Getting a resource with a DOM object from simple YQL data types or containers (lists or dictionaries).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Yson::ConvertTo***&lt;/code&gt;: Converting a resource to &lt;a href=\"en/yql/types/primitive.html\"&gt;primitive data types&lt;/a&gt; or &lt;a href=\"en/yql/types/containers.html\"&gt;containers&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Yson::Lookup***&lt;/code&gt;: Getting a single list item or a dictionary with optional conversion to the relevant data type.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Yson::YPath***&lt;/code&gt;: Getting one element from the document tree based on the relative path specified, optionally converting it to the relevant data type.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Yson::Serialize***&lt;/code&gt;: Getting a copy of data from the resource and serializing the data in one of the formats.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;For convenience, when serialized Yson and Json are passed to functions expecting a resource with a DOM object, implicit conversion using &lt;code&gt;Yson::Parse&lt;/code&gt; or &lt;code&gt;Yson::ParseJson&lt;/code&gt; is done automatically. In SQL syntax, the dot or square brackets operator automatically adds a &lt;code&gt;Yson::Lookup&lt;/code&gt; call. To serialize a resource, you still need to call &lt;code&gt;Yson::ConvertTo***&lt;/code&gt; or &lt;code&gt;Yson::Serialize***&lt;/code&gt;. It means that, for example, to get the \"foo\" element as a string from the Yson column named mycolumn and serialized as a dictionary, you can write: &lt;code&gt;SELECT Yson::ConvertToString(mycolumn[\"foo\"]) FROM mytable;&lt;/code&gt; or &lt;code&gt;SELECT Yson::ConvertToString(mycolumn.foo) FROM mytable;&lt;/code&gt;. In the variant with a dot, special characters can be escaped by &lt;a href=\"en/yql/syntax/expressions.html#escape\"&gt;general rules for IDs&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The module's functions must be considered as \"building blocks\" from which you can assemble different structures, for example:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Yson::Parse*** -&amp;gt; Yson::Serialize***&lt;/code&gt;: Converting from one format to other.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Yson::Parse*** -&amp;gt; Yson::Lookup -&amp;gt; Yson::Serialize***&lt;/code&gt;: Extracting the value of the specified subtree in the source YSON tree.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Yson::Parse*** -&amp;gt; Yson::ConvertToList -&amp;gt; ListMap -&amp;gt; Yson::Lookup***&lt;/code&gt;: Extracting items by a key from the YSON list.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"en/yql/udf/list/yson.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$node = Json(@@\n  {\"abc\": {\"def\": 123, \"ghi\": \"hello\"}}\n@@);\nSELECT Yson::SerializeText($node.abc) AS `yson`;\n-- {\"def\"=123;\"ghi\"=\"\\xD0\\xBF\\xD1\\x80\\xD0\\xB8\\xD0\\xB2\\xD0\\xB5\\xD1\\x82\"}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"124\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-124\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-124\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-124.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$node = Yson(@@\n  &amp;lt;a=z;x=y&amp;gt;[\n    {abc=123; def=456};\n    {abc=234; xyz=789};\n  ]\n@@);\n$attrs = Yson::YPath($node, \"/@\");\n\nSELECT\n  ListMap(Yson::ConvertToList($node), ($x) -&amp;gt; { return Yson::LookupInt64($x, \"abc\") }) AS abcs,\n  Yson::ConvertToStringDict($attrs) AS attrs,\n  Yson::SerializePretty(Yson::Lookup($node, \"7\", Yson::Options(false AS Strict))) AS miss;\n\n/*\n- abcs: `[123; 234]`\n- attrs: `{\"a\"=\"z\";\"x\"=\"y\"}`\n- miss: `NULL`\n*/\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"125\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-125\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-125\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-125.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"ysonparse\"&gt;&lt;a href=\"en/yql/udf/list/yson.html#ysonparse\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::Parse...&lt;/span&gt;&lt;/a&gt;Yson::Parse...&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::Parse(Yson{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;'Yson2.Node'&amp;gt;\nYson::ParseJson(Json{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;'Yson2.Node'&amp;gt;\nYson::ParseJsonDecodeUtf8(Json{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;'Yson2.Node'&amp;gt;\n\nYson::Parse(String{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;'Yson2.Node'&amp;gt;? -- accepts YSON in any format\nYson::ParseJson(String{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;'Yson2.Node'&amp;gt;?\nYson::ParseJsonDecodeUtf8(String{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;'Yson2.Node'&amp;gt;?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"129\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-129\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-129\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-129.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The result of all three functions is non-serializable: it can only be passed as the input to other function from the Yson library. However, you can't save it to a table or return to the client as a result of the operation: such an attempt results in a typing error. You also can't return it outside &lt;a href=\"en/yql/syntax/select/index.html\"&gt;subqueries&lt;/a&gt;: if you need to do this, call &lt;a href=\"en/yql/udf/list/yson.html#ysonserialize\"&gt;Yson::Serialize&lt;/a&gt;, and the optimizer will remove unnecessary serialization and deserialization if materialization isn't needed in the end.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The &lt;code&gt;Yson::ParseJsonDecodeUtf8&lt;/code&gt; expects that characters outside the ASCII range must be additionally escaped.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"ysonfrom\"&gt;&lt;a href=\"en/yql/udf/list/yson.html#ysonfrom\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::From&lt;/span&gt;&lt;/a&gt;Yson::From&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::From(T) -&amp;gt; Resource&amp;lt;'Yson2.Node'&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"146\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-146\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-146\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-146.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code&gt;Yson::From&lt;/code&gt; is a polymorphic function that converts most primitive data types and containers (lists, dictionaries, tuples, structures, and so on) into a Yson resource. The source object type must be Yson-compatible. For example, in dictionary keys, you can only use the &lt;code&gt;String&lt;/code&gt; or &lt;code&gt;Utf8&lt;/code&gt; data types, but not &lt;code&gt;String?&lt;/code&gt; or &lt;code&gt;Utf8?&lt;/code&gt; .&lt;/p&gt;\n&lt;h4 id=\"example\"&gt;&lt;a href=\"en/yql/udf/list/yson.html#example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Yson::Serialize(Yson::From(TableRow())) FROM table1;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"153\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-153\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-153\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-153.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"ysonwithattributes\"&gt;&lt;a href=\"en/yql/udf/list/yson.html#ysonwithattributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::WithAttributes&lt;/span&gt;&lt;/a&gt;Yson::WithAttributes&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::WithAttributes(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;'Yson2.Node'&amp;gt;?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"157\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-157\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-157\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-157.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Adds attributes (the second argument) to the Yson node (the first argument). The attributes must constitute a map node.&lt;/p&gt;\n&lt;h2 id=\"ysonequals\"&gt;&lt;a href=\"en/yql/udf/list/yson.html#ysonequals\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::Equals&lt;/span&gt;&lt;/a&gt;Yson::Equals&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::Equals(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Bool\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"164\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-164\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-164\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-164.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Checking trees in memory for equality. The operation is tolerant to the source serialization format and the order of keys in dictionaries.&lt;/p&gt;\n&lt;h2 id=\"ysongethash\"&gt;&lt;a href=\"en/yql/udf/list/yson.html#ysongethash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::GetHash&lt;/span&gt;&lt;/a&gt;Yson::GetHash&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::GetHash(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint64\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"171\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-171\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-171\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-171.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Calculating a 64-bit hash from an object tree.&lt;/p&gt;\n&lt;h2 id=\"ysonis\"&gt;&lt;a href=\"en/yql/udf/list/yson.html#ysonis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::Is...&lt;/span&gt;&lt;/a&gt;Yson::Is...&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::IsEntity(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; bool\nYson::IsString(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; bool\nYson::IsDouble(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; bool\nYson::IsUint64(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; bool\nYson::IsInt64(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; bool\nYson::IsBool(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; bool\nYson::IsList(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; bool\nYson::IsDict(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; bool\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"178\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-178\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-178\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-178.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Checking that the current node has the appropriate type. The Entity is &lt;code&gt;#&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"ysongetlength\"&gt;&lt;a href=\"en/yql/udf/list/yson.html#ysongetlength\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::GetLength&lt;/span&gt;&lt;/a&gt;Yson::GetLength&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::GetLength(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint64?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"185\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-185\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-185\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-185.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Getting the number of elements in a list or dictionary.&lt;/p&gt;\n&lt;h2 id=\"ysonconvertto\"&gt;&lt;a href=\"en/yql/udf/list/yson.html#ysonconvertto\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::ConvertTo...&lt;/span&gt;&lt;/a&gt;Yson::ConvertTo...&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::ConvertTo(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, Type&amp;lt;T&amp;gt;) -&amp;gt; T\nYson::ConvertToBool(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Bool?\nYson::ConvertToInt64(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Int64?\nYson::ConvertToUint64(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint64?\nYson::ConvertToDouble(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Double?\nYson::ConvertToString(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; String?\nYson::ConvertToList(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; List&amp;lt;Resource&amp;lt;'Yson2.Node'&amp;gt;&amp;gt;\nYson::ConvertToBoolList(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; List&amp;lt;Bool&amp;gt;\nYson::ConvertToInt64List(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; List&amp;lt;Int64&amp;gt;\nYson::ConvertToUint64List(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; List&amp;lt;Uint64&amp;gt;\nYson::ConvertToDoubleList(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; List&amp;lt;Double&amp;gt;\nYson::ConvertToStringList(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; List&amp;lt;String&amp;gt;\nYson::ConvertToDict(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Dict&amp;lt;String,Resource&amp;lt;'Yson2.Node'&amp;gt;&amp;gt;\nYson::ConvertToBoolDict(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Dict&amp;lt;String,Bool&amp;gt;\nYson::ConvertToInt64Dict(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Dict&amp;lt;String,Int64&amp;gt;\nYson::ConvertToUint64Dict(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Dict&amp;lt;String,Uint64&amp;gt;\nYson::ConvertToDoubleDict(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Dict&amp;lt;String,Double&amp;gt;\nYson::ConvertToStringDict(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Dict&amp;lt;String,String&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"192\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-192\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-192\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-192.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;These functions do not do implicit type casting by default, that is, the value in the argument must exactly match the function called.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;code&gt;Yson::ConvertTo&lt;/code&gt; is a polymorphic function that converts the data type that is specified in the second argument and supports containers (lists, dictionaries, tuples, structures, and so on) into a Yson resource.&lt;/p&gt;\n&lt;h4 id=\"example1\"&gt;&lt;a href=\"en/yql/udf/list/yson.html#example1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$data = Yson(@@{\n    \"name\" = \"Anya\";\n    \"age\" = 15u;\n    \"params\" = {\n        \"ip\" = \"95.106.17.32\";\n        \"last_time_on_site\" = 0.5;\n        \"region\" = 213;\n        \"user_agent\" = \"Mozilla/5.0\"\n    }\n}@@);\nSELECT Yson::ConvertTo($data,\n    Struct&amp;lt;\n        name: String,\n        age: Uint32,\n        params: Dict&amp;lt;String,Yson&amp;gt;\n    &amp;gt;\n);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"209\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-209\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-209\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-209.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"ysoncontains\"&gt;&lt;a href=\"en/yql/udf/list/yson.html#ysoncontains\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::Contains&lt;/span&gt;&lt;/a&gt;Yson::Contains&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::Contains(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Bool?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"213\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-213\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-213\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-213.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Checks for a key in the dictionary. If the object type is a map, then it searches among the keys.&lt;br /&gt;\nIf the object type is a list, then the key must be a decimal number, i.e., an index in the list.&lt;/p&gt;\n&lt;h2 id=\"ysonlookup\"&gt;&lt;a href=\"en/yql/udf/list/yson.html#ysonlookup\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::Lookup...&lt;/span&gt;&lt;/a&gt;Yson::Lookup...&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::Lookup(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Resource&amp;lt;'Yson2.Node'&amp;gt;?\nYson::LookupBool(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Bool?\nYson::LookupInt64(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Int64?\nYson::LookupUint64(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Uint64?\nYson::LookupDouble(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Double?\nYson::LookupString(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; String?\nYson::LookupDict(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Dict&amp;lt;String,Resource&amp;lt;'Yson2.Node'&amp;gt;&amp;gt;?\nYson::LookupList(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; List&amp;lt;Resource&amp;lt;'Yson2.Node'&amp;gt;&amp;gt;?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"220\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-220\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-220\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-220.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The above functions are short notations for a typical use case: &lt;code&gt;Yson::YPath&lt;/code&gt;: go to a level in the dictionary and then extract the value — &lt;code&gt;Yson::ConvertTo***&lt;/code&gt;. For all the listed functions, the second argument is a key name from the dictionary (unlike YPath, it has no &lt;code&gt;/&lt;/code&gt;prefix) or an index from the list (for example, &lt;code&gt;7&lt;/code&gt;). They simplify the query and produce a small gain in speed.&lt;/p&gt;\n&lt;h2 id=\"ysonypath\"&gt;&lt;a href=\"en/yql/udf/list/yson.html#ysonypath\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::YPath&lt;/span&gt;&lt;/a&gt;Yson::YPath&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::YPath(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Resource&amp;lt;'Yson2.Node'&amp;gt;?\nYson::YPathBool(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Bool?\nYson::YPathInt64(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Int64?\nYson::YPathUint64(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Uint64?\nYson::YPathDouble(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Double?\nYson::YPathString(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; String?\nYson::YPathDict(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Dict&amp;lt;String,Resource&amp;lt;'Yson2.Node'&amp;gt;&amp;gt;?\nYson::YPathList(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; List&amp;lt;Resource&amp;lt;'Yson2.Node'&amp;gt;&amp;gt;?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"227\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-227\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-227\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-227.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Lets you get a part of the resource based on the source resource and the part's path in YPath format.&lt;/p&gt;\n&lt;h2 id=\"ysonattributes\"&gt;&lt;a href=\"en/yql/udf/list/yson.html#ysonattributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::Attributes&lt;/span&gt;&lt;/a&gt;Yson::Attributes&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::Attributes(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Dict&amp;lt;String,Resource&amp;lt;'Yson2.Node'&amp;gt;&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"234\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-234\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-234\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-234.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Getting all node attributes as a dictionary.&lt;/p&gt;\n&lt;h2 id=\"ysonserialize\"&gt;&lt;a href=\"en/yql/udf/list/yson.html#ysonserialize\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::Serialize...&lt;/span&gt;&lt;/a&gt;Yson::Serialize...&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::Serialize(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Yson -- A binary representation\nYson::SerializeText(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Yson\nYson::SerializePretty(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Yson -- To get a text result, wrap it in ToBytes(...)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"241\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-241\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-241\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-241.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"ysonserializejson\"&gt;&lt;a href=\"en/yql/udf/list/yson.html#ysonserializejson\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::SerializeJson&lt;/span&gt;&lt;/a&gt;Yson::SerializeJson&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::SerializeJson(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, [Resource&amp;lt;'Yson2.Options'&amp;gt;?, SkipMapEntity:Bool?, EncodeUtf8:Bool?, WriteNanAsString:Bool?]) -&amp;gt; Json?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"245\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-245\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-245\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-245.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;SkipMapEntity&lt;/code&gt; serializes &lt;code&gt;#&lt;/code&gt; values in dictionaries. The value of attributes is not affected by the flag. By default, &lt;code&gt;false&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;EncodeUtf8&lt;/code&gt; responsible for escaping non-ASCII characters. By default, &lt;code&gt;false&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;WriteNanAsString&lt;/code&gt; allows serializing &lt;code&gt;NaN&lt;/code&gt; and &lt;code&gt;Inf&lt;/code&gt; values as strings. By default, &lt;code&gt;false&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The &lt;code&gt;Yson&lt;/code&gt; and &lt;code&gt;Json&lt;/code&gt; data types returned by serialization functions are special cases of a string that is known to contain data in the given format (Yson/Json).&lt;/p&gt;\n&lt;h2 id=\"ysonoptions\"&gt;&lt;a href=\"en/yql/udf/list/yson.html#ysonoptions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::Options&lt;/span&gt;&lt;/a&gt;Yson::Options&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::Options([AutoConvert:Bool?, Strict:Bool?]) -&amp;gt; Resource&amp;lt;'Yson2.Options'&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"269\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-269\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-269\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-269.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;It's passed in the last optional argument (omitted for brevity) to the methods &lt;code&gt;Parse...&lt;/code&gt;, &lt;code&gt;ConvertTo...&lt;/code&gt;, &lt;code&gt;Contains&lt;/code&gt;, &lt;code&gt;Lookup...&lt;/code&gt;, and &lt;code&gt;YPath...&lt;/code&gt; that accept the result of the &lt;code&gt;Yson::Options&lt;/code&gt; call. By default, all the &lt;code&gt;Yson::Options&lt;/code&gt; fields are false and when enabled (true), they modify the behavior as follows:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;AutoConvert&lt;/strong&gt;: If the value passed to Yson doesn't match the result data type exactly, the value is converted where possible. For example, &lt;code&gt;Yson::ConvertToInt64&lt;/code&gt; in this mode will convert even Double numbers to Int64.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Strict&lt;/strong&gt;: By default, all functions from the Yson library return an error in case of issues during query execution (for example, an attempt to parse a string that is not Yson/Json, or an attempt to search by a key in a scalar type, or when a conversion to an incompatible data type has been requested, and so on). If you disable the strict mode, &lt;code&gt;NULL&lt;/code&gt; is returned instead of an error in most cases. When converting to a dictionary or list (&lt;code&gt;ConvertTo&amp;lt;Type&amp;gt;Dict&lt;/code&gt; or &lt;code&gt;ConvertTo&amp;lt;Type&amp;gt;List&lt;/code&gt;), improper items are excluded from the resulting collection.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"example2\"&gt;&lt;a href=\"en/yql/udf/list/yson.html#example2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$yson = @@{y = true; x = 5.5}@@y;\nSELECT Yson::LookupBool($yson, \"z\"); --- null\nSELECT Yson::LookupBool($yson, \"y\"); --- true\n\n-- SELECT Yson::LookupInt64($yson, \"x\"); --- Error occurs\nSELECT Yson::LookupInt64($yson, \"x\", Yson::Options(false as Strict)); --- null\nSELECT Yson::LookupInt64($yson, \"x\", Yson::Options(true as AutoConvert)); --- 5\n\n-- SELECT Yson::ConvertToBoolDict($yson); --- Error occurs\nSELECT Yson::ConvertToBoolDict($yson, Yson::Options(false as Strict)); --- { \"y\": true }\nSELECT Yson::ConvertToDoubleDict($yson, Yson::Options(false as Strict)); --- { \"x\": 5.5 }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"288\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-288\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-288\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-288.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If you need to use the same Yson library settings throughout the query, it's more convenient to use &lt;a href=\"en/yql/syntax/pragma/yson.html#ysonautoconvert\"&gt;PRAGMA yson.AutoConvert;&lt;/a&gt; and/or &lt;a href=\"en/yql/syntax/pragma/yson.html#ysonstrict\"&gt;PRAGMA yson.Strict;&lt;/a&gt;. Only with these &lt;code&gt;PRAGMA&lt;/code&gt; you can affect implicit calls to the Yson library occurring when you work with Yson/Json data types.&lt;/p&gt;\n\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/udf/list/yson.md","sourcePath":"en/yql/udf/list/yson.md"},"headings":[{"title":"Examples","href":"en/yql/udf/list/yson.html#examples","level":2},{"title":"Yson::Parse...","href":"en/yql/udf/list/yson.html#ysonparse","level":2},{"title":"Yson::From","href":"en/yql/udf/list/yson.html#ysonfrom","level":2},{"title":"Yson::WithAttributes","href":"en/yql/udf/list/yson.html#ysonwithattributes","level":2},{"title":"Yson::Equals","href":"en/yql/udf/list/yson.html#ysonequals","level":2},{"title":"Yson::GetHash","href":"en/yql/udf/list/yson.html#ysongethash","level":2},{"title":"Yson::Is...","href":"en/yql/udf/list/yson.html#ysonis","level":2},{"title":"Yson::GetLength","href":"en/yql/udf/list/yson.html#ysongetlength","level":2},{"title":"Yson::ConvertTo...","href":"en/yql/udf/list/yson.html#ysonconvertto","level":2},{"title":"Yson::Contains","href":"en/yql/udf/list/yson.html#ysoncontains","level":2},{"title":"Yson::Lookup...","href":"en/yql/udf/list/yson.html#ysonlookup","level":2},{"title":"Yson::YPath","href":"en/yql/udf/list/yson.html#ysonypath","level":2},{"title":"Yson::Attributes","href":"en/yql/udf/list/yson.html#ysonattributes","level":2},{"title":"Yson::Serialize...","href":"en/yql/udf/list/yson.html#ysonserialize","level":2},{"title":"Yson::SerializeJson","href":"en/yql/udf/list/yson.html#ysonserializejson","level":2},{"title":"Yson::Options","href":"en/yql/udf/list/yson.html#ysonoptions","level":2}],"title":"Yson"},"router":{"pathname":"en/yql/udf/list/yson","depth":5,"base":"../../../../"},"lang"
