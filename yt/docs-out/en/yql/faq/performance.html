        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"perf_join\"&gt;&lt;a href=\"en/yql/faq/performance.html#perf_join\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Why do queries with a JOIN clause take so long?&lt;/span&gt;&lt;/a&gt;Why do queries with a JOIN clause take so long?&lt;/h2&gt;\n&lt;p&gt;All the basic &lt;a href=\"en/yql/syntax/join.html\"&gt;JOIN&lt;/a&gt; types (except SEMI/ONLY) build a Cartesian product of rows by the matching key values. If one or more key values are singular, it might have many rows on each side and result in a huge Cartesian product. This is the most common reason behind slow JOINs, and since such singular values don't have much practical value, you can exclude them using the &lt;code&gt;WHERE&lt;/code&gt; clause.&lt;/p&gt;\n&lt;p&gt;To find such frequent anomalies, you can execute two queries against each table with a GROUP BY the same keys as in &lt;code&gt;JOIN&lt;/code&gt;, using the &lt;code&gt;COUNT&lt;/code&gt; aggregate function and descending sorting by its result. You can also add &lt;code&gt;LIMIT 100&lt;/code&gt; to speed up the process.&lt;/p&gt;\n&lt;p&gt;Sometimes, your query won't actually need a Cartesian product in &lt;code&gt;JOIN&lt;/code&gt; because in the end you'll only be interested in distinct values. In this case, eliminate duplicates in your subquery using &lt;a href=\"en/yql/syntax/group_by.html\"&gt;GROUP BY&lt;/a&gt; or &lt;a href=\"en/yql/syntax/select/distinct.html\"&gt;SELECT DISTINCT&lt;/a&gt; even before &lt;code&gt;JOIN&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"perf_slowdown\"&gt;&lt;a href=\"en/yql/faq/performance.html#perf_slowdown\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;My query used to take N hours, but now it takes M hours. Why is that?&lt;/span&gt;&lt;/a&gt;My query used to take N hours, but now it takes M hours. Why is that?&lt;/h2&gt;\n&lt;p&gt;When analyzing performance, consider the following factors:&lt;/p&gt;\n&lt;h3 id=\"has-the-input-data-volume-changed\"&gt;&lt;a href=\"en/yql/faq/performance.html#has-the-input-data-volume-changed\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Has the input data volume changed?&lt;/span&gt;&lt;/a&gt;Has the input data volume changed?&lt;/h3&gt;\n&lt;p&gt;For example, more tables were added to the query or their volume changed significantly. To check if the input data volume changed, click the first YTsaurus operation in the query plan and view &lt;code&gt;Data flow&lt;/code&gt;/&lt;code&gt;Data weight&lt;/code&gt; in the YTsaurus interface:&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/data_weight.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;h3 id=\"has-the-query-execution-plan-changed\"&gt;&lt;a href=\"en/yql/faq/performance.html#has-the-query-execution-plan-changed\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Has the query execution plan changed?&lt;/span&gt;&lt;/a&gt;Has the query execution plan changed?&lt;/h3&gt;\n&lt;p&gt;A plan can change for several reasons:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;A different &lt;code&gt;JOIN&lt;/code&gt; strategy was applied. To learn more about triggering criteria for a particular strategy, see the &lt;a href=\"en/yql/syntax/join.html#join_strategy\"&gt;article&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;The schema of some input tables in the folder changed. YQL aligns the schema of input tables, which creates additional operations.&lt;/li&gt;\n&lt;li&gt;YQL optimizers changed in the new version.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"does-the-query-use-a-pool-with-dedicated-guarantees\"&gt;&lt;a href=\"en/yql/faq/performance.html#does-the-query-use-a-pool-with-dedicated-guarantees\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Does the query use a pool with dedicated guarantees?&lt;/span&gt;&lt;/a&gt;Does the query use a pool with dedicated guarantees?&lt;/h3&gt;\n&lt;p&gt;The query must specify the &lt;a href=\"en/yql/syntax/pragma/yt.html#ytstaticpool\"&gt;yt.StaticPool&lt;/a&gt; pragma to apply the pool. If the pragma is missing, the query execution time isn't guaranteed in any way. Neighboring queries and seasonal cluster load fluctuations can affect execution. You should also make sure that the pool is set by the &lt;a href=\"en/yql/syntax/pragma/yt.html#ytstaticpool\"&gt;yt.StaticPool&lt;/a&gt; pragma, not &lt;a href=\"en/yql/syntax/pragma/yt.html#ytpool\"&gt;yt.Pool&lt;/a&gt;. The latter is a dynamic pragma applied at runtime. Because of this, service operations launched at the optimization stage don't use its value and are launched in the pool by default, which may result in their significant slowdown. The &lt;a href=\"en/yql/syntax/pragma/yt.html#ytstaticpool\"&gt;yt.StaticPool&lt;/a&gt; pragma applies to all operations, including service ones.&lt;/p&gt;\n&lt;h3 id=\"checking-summary-statistics-for-a-query\"&gt;&lt;a href=\"en/yql/faq/performance.html#checking-summary-statistics-for-a-query\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Checking summary statistics for a query&lt;/span&gt;&lt;/a&gt;Checking summary statistics for a query&lt;/h3&gt;\n&lt;p&gt;The YQL query's &lt;code&gt;Statistics&lt;/code&gt; tab contains the summary query statistics:&lt;br /&gt;\n&lt;img src=\"images/stat.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;First of all, note and compare the following metrics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;yt/total/Job_CalcTime&lt;/code&gt; (Sum): Useful time spent across all jobs with user code of all YTsaurus operations of the query. A change in this value, with no variation in input data volume, indicates performance changes in the YQL runtime.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt/total/Job_InputDecodeTime&lt;/code&gt; (Sum): Time spent by the YQL decoder to read input data across all jobs of all YTsaurus operations of the query. A change in this value, with no variation in input data volume, indicates performance changes in the YQL decoder.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt/total/Job_OutputEncodeTime&lt;/code&gt; (Sum): Time spent by the YQL encoder to write input data across all jobs of all YTsaurus operations of the query. A change in this value, with no variation in input data volume, indicates performance changes in the YQL encoder.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt/total/CodeGen_FullTime&lt;/code&gt; (Sum): Time spent to generate code across all jobs of all YTsaurus operations of the query. A change in this value, with the same number of YTsaurus jobs, indicates code generation performance changes in the YQL runtime. If this time represents a significant portion of &lt;code&gt;Job_CalcTime&lt;/code&gt;, consider disabling LLVM in the query via &lt;code&gt;pragma config.flags(\"LLVM\", \"OFF\")&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt/total/Join_Spill_Count&lt;/code&gt; (Sum): A non-zero value of this metric indicates &lt;code&gt;JOIN&lt;/code&gt; performance issues in the query. If the keys in the first side of the JOIN have a large number of writes, they can't fit into memory and are stored on disk. This causes significant degradation in the execution time of YTsaurus jobs performing the &lt;code&gt;JOIN&lt;/code&gt;. To resolve this issue, you can increase the &lt;a href=\"en/yql/syntax/pragma/yt.html#ytcommonjoincorelimit\"&gt;yt.CommonJoinCoreLimit&lt;/a&gt; pragma value or swap &lt;code&gt;JOIN&lt;/code&gt; sides.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt/total/data/input/data_weight&lt;/code&gt; (Sum): Total data volume processed by all jobs of all YTsaurus operations of the query. If there are no changes in the query plan, a change in this metric indicates a change in the input data volume of the query.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"finding-the-slowest-ytsaurus-operation-in-a-query\"&gt;&lt;a href=\"en/yql/faq/performance.html#finding-the-slowest-ytsaurus-operation-in-a-query\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Finding the slowest YTsaurus operation in a query&lt;/span&gt;&lt;/a&gt;Finding the slowest YTsaurus operation in a query&lt;/h3&gt;\n&lt;p&gt;In the YQL query's &lt;code&gt;Progress&lt;/code&gt; tab, switch to &lt;code&gt;Timeline&lt;/code&gt; mode:&lt;br /&gt;\n&lt;img src=\"images/timeline.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;In this mode, you can clearly see which YTsaurus operation affected the YQL query execution time the most. You can also drill down to execution details at various stages of the operation:&lt;br /&gt;\n&lt;img src=\"images/pending.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;Here you can see that the operation was &lt;code&gt;Pending&lt;/code&gt; for a while due to insufficient limits on the number of running operations in the pool.&lt;/p&gt;\n&lt;p&gt;For further analysis, you can open a slow operation in the YTsaurus interface by clicking its name in the timeline column on the left. In a YTsaurus operation, first of all, pay attention to &lt;code&gt;Total job wall time&lt;/code&gt; and &lt;code&gt;Total CPU time spent&lt;/code&gt;. If these values remain largely unchanged for two YQL query runs, but &lt;code&gt;Duration&lt;/code&gt; has changed, it indicates potential query pool issues. Click the name of the pool&lt;br /&gt;\n&lt;img src=\"images/pool.png\" alt=\"\" /&gt;&lt;br /&gt;\nand open it in the &lt;code&gt;Monitoring&lt;/code&gt; tab in the YTsaurus interface to analyze its load.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/faq/performance.md","sourcePath":"en/yql/faq/performance.md"},"headings":[{"title":"Why do queries with a JOIN clause take so long?","href":"en/yql/faq/performance.html#perf_join","level":2},{"title":"My query used to take N hours, but now it takes M hours. Why is that?","href":"en/yql/faq/performance.html#perf_slowdown","level":2,"items":[{"title":"Has the input data volume changed?","href":"en/yql/faq/performance.html#has-the-input-data-volume-changed","level":3},{"title":"Has the query execution plan changed?","href":"en/yql/faq/performance.html#has-the-query-execution-plan-changed","level":3},{"title":"Does the query use a pool with dedicated guarantees?","href":"en/yql/faq/performance.html#does-the-query-use-a-pool-with-dedicated-guarantees","level":3},{"title":"Checking summary statistics for a query","href":"en/yql/faq/performance.html#checking-summary-statistics-for-a-query","level":3},{"title":"Finding the slowest YTsaurus operation in a query","href":"en/yql/faq/performance.html#finding-the-slowest-ytsaurus-operation-in-a-query","level":3}]}],"title":"Performance"},"router":{"pathname":"en/yql/faq/performance","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
