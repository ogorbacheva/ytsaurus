            {"data":{"leading":false,"html":"&lt;p&gt;This section describes distinctions of YQL SQL dialect and the ISO/IEC 9075-2 standard (Part 2: Foundation) in the version SQL-2011.&lt;br /&gt;\nTo make the comparison, we took table 38 from the standard&lt;br /&gt;\n(\"Feature taxonomy and definition for mandatory features\").&lt;/p&gt;\n&lt;h2 id=\"distinctions-in-behavior-between-yql-and-ansi-sql\"&gt;&lt;a href=\"en/yql/differences_from/ansi.html#distinctions-in-behavior-between-yql-and-ansi-sql\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Distinctions in behavior between YQL and ANSI SQL&lt;/span&gt;&lt;/a&gt;Distinctions in behavior between YQL and ANSI SQL&lt;/h2&gt;\n&lt;p&gt;In this table, we've put together the scenarios where the same query produces different results in YQL and ANSI SQL.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;ID&lt;/th&gt;\n&lt;th&gt;Name&lt;/th&gt;\n&lt;th&gt;Behavioral distinctions&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;E011-04&lt;/td&gt;\n&lt;td&gt;Arithmetic operators&lt;/td&gt;\n&lt;td&gt;YQL suppresses errors in arithmetic calculations. For example, the expression &lt;code&gt;1/0&lt;/code&gt; has the type &lt;code&gt;Int32?&lt;/code&gt; and the value &lt;code&gt;NULL&lt;/code&gt;. ANSI SQL will throw an error in this case:&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E011-06&lt;/td&gt;\n&lt;td&gt;Implicit casting among the numeric data types&lt;/td&gt;\n&lt;td&gt;YQL doesn't provide implicit casting between NUMERIC and INTEGER/FLOAT.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E031-01&lt;/td&gt;\n&lt;td&gt;Delimited identifiers&lt;/td&gt;\n&lt;td&gt;In YQL, the expression &lt;code&gt;SELECT \"a\" FROM foo&lt;/code&gt; returns a string constant. In ANSI, &lt;code&gt;\"a\"&lt;/code&gt; is treated as the ID (the &lt;code&gt;a&lt;/code&gt; column)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E071-02&lt;/td&gt;\n&lt;td&gt;UNION ALL table operator&lt;/td&gt;\n&lt;td&gt;In ANSI SQL, columns are joined according to their positions; in YQL, they are joined by names. Adding the &lt;code&gt;PositionalUnionAll&lt;/code&gt; pragma enables the standard columnar execution for UNION ALL. In this case, column ordering is enabled automatically.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"ansi-sql-support-status\"&gt;&lt;a href=\"en/yql/differences_from/ansi.html#ansi-sql-support-status\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ANSI SQL support status&lt;/span&gt;&lt;/a&gt;ANSI SQL support status&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;ID&lt;/th&gt;\n&lt;th&gt;Name&lt;/th&gt;\n&lt;th&gt;Support&lt;/th&gt;\n&lt;th&gt;Comment&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;E011&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Numeric data types&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Partial&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E011-01&lt;/td&gt;\n&lt;td&gt;INTEGER and SMALLINT data types&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Signed and unsigned integral types are additionally supported: &lt;code&gt;[U]INT{8,16,32,64}&lt;/code&gt; and &lt;code&gt;TINYINT&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E011-02&lt;/td&gt;\n&lt;td&gt;REAL, DOUBLE PRECISION and FLOAT data types data types&lt;/td&gt;\n&lt;td&gt;Partial&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;FLOAT(&amp;lt;binary_precision&amp;gt;)&lt;/code&gt;isn't supported&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E011-03&lt;/td&gt;\n&lt;td&gt;DECIMAL and NUMERIC data types&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;DECIMAL(p,s)&lt;/code&gt; is supported&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E011-04&lt;/td&gt;\n&lt;td&gt;Arithmetic operators&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E011-05&lt;/td&gt;\n&lt;td&gt;Numeric comparison&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E011-06&lt;/td&gt;\n&lt;td&gt;Implicit casting among the numeric data types&lt;/td&gt;\n&lt;td&gt;Partial&lt;/td&gt;\n&lt;td&gt;The standard allows for implicit mutual casting between all the numeric types. We only implicitly cast \"related\" types.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;[&lt;strong&gt;E021&lt;/strong&gt;](####E021 Character string types)&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Character string types&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Partial&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;CHAR(len)&lt;/code&gt;, &lt;code&gt;VARCHAR(len)&lt;/code&gt; is not supported&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E021-01&lt;/td&gt;\n&lt;td&gt;CHARACTER data type&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E021-02&lt;/td&gt;\n&lt;td&gt;CHARACTER VARYING data type&lt;/td&gt;\n&lt;td&gt;Partial&lt;/td&gt;\n&lt;td&gt;The closest analog is &lt;code&gt;String&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E021-03&lt;/td&gt;\n&lt;td&gt;Character literals&lt;/td&gt;\n&lt;td&gt;Partial&lt;/td&gt;\n&lt;td&gt;Automatic &lt;code&gt;'aaa' 'bbb'&lt;/code&gt; concatenation isn't supported&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E021-04&lt;/td&gt;\n&lt;td&gt;CHARACTER_LENGTH function&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E021-05&lt;/td&gt;\n&lt;td&gt;OCTET_LENGTH function&lt;/td&gt;\n&lt;td&gt;Partial&lt;/td&gt;\n&lt;td&gt;The closest analog is &lt;code&gt;LEN()&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E021-06&lt;/td&gt;\n&lt;td&gt;SUBSTRING&lt;/td&gt;\n&lt;td&gt;Partial&lt;/td&gt;\n&lt;td&gt;Distinctions in syntax&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E021-07&lt;/td&gt;\n&lt;td&gt;Character concatenation&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Supported for the String type&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E021-08&lt;/td&gt;\n&lt;td&gt;UPPER and LOWER functions&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;Available using String UDF&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E021-09&lt;/td&gt;\n&lt;td&gt;TRIM function&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;Can be implemented using String UDF&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E021-10&lt;/td&gt;\n&lt;td&gt;Implicit casting among the fixed-length and variable-length character string types&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;Relevant types are missing&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E021-11&lt;/td&gt;\n&lt;td&gt;POSITION function&lt;/td&gt;\n&lt;td&gt;Partial&lt;/td&gt;\n&lt;td&gt;The counterpart is &lt;code&gt;FIND&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E021-12&lt;/td&gt;\n&lt;td&gt;Character comparison&lt;/td&gt;\n&lt;td&gt;Partial&lt;/td&gt;\n&lt;td&gt;String type is compared bitwise&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;E031&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Identifiers&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Partial&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E031-01&lt;/td&gt;\n&lt;td&gt;Delimited identifiers&lt;/td&gt;\n&lt;td&gt;Partial&lt;/td&gt;\n&lt;td&gt;YQL uses backticks for IDs rather than double quotes prescribed by the standard&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E031-02&lt;/td&gt;\n&lt;td&gt;Lower case identifiers&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E031-03&lt;/td&gt;\n&lt;td&gt;Trailing underscore&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;E051&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Basic query specification&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Partial&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E051-01&lt;/td&gt;\n&lt;td&gt;SELECT DISTINCT&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E051-02&lt;/td&gt;\n&lt;td&gt;GROUP BY clause&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E051-04&lt;/td&gt;\n&lt;td&gt;GROUP BY can contain columns not in &amp;lt;select list&amp;gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E051-05&lt;/td&gt;\n&lt;td&gt;Select items can be renamed&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;SELECT foo AS bar&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E051-06&lt;/td&gt;\n&lt;td&gt;HAVING clause&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E051-07&lt;/td&gt;\n&lt;td&gt;Qualified * in select list&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;SELECT a.*, 1 AS foo FROM T AS a&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E051-08&lt;/td&gt;\n&lt;td&gt;Correlation name in the FROM clause&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;SELECT ... FROM T AS a&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E051-09&lt;/td&gt;\n&lt;td&gt;Rename columns in the FROM clause&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;SELECT ... FROM T AS a (x AS foo, y AS bar)&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;E061&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Basic predicates and search conditions&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Partial&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E061-01&lt;/td&gt;\n&lt;td&gt;Comparison predicate&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Operators &lt;code&gt;&amp;lt;,&amp;gt;,=,&amp;lt;&amp;gt;,&amp;lt;=,&amp;gt;=&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E061-02&lt;/td&gt;\n&lt;td&gt;BETWEEN predicate&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E061-03&lt;/td&gt;\n&lt;td&gt;IN predicate with list of values&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E061-04&lt;/td&gt;\n&lt;td&gt;LIKE predicate&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E061-05&lt;/td&gt;\n&lt;td&gt;LIKE predicate: ESCAPE clause&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E061-06&lt;/td&gt;\n&lt;td&gt;NULL predicate&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E061-07&lt;/td&gt;\n&lt;td&gt;Quantified comparison predicate&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;X &amp;lt; ANY (...)&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E061-08&lt;/td&gt;\n&lt;td&gt;EXISTS predicate&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E061-09&lt;/td&gt;\n&lt;td&gt;Subqueries in comparison predicate&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Scalar context for sub-queries&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E061-11&lt;/td&gt;\n&lt;td&gt;Subqueries in IN predicate&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E061-12&lt;/td&gt;\n&lt;td&gt;Subqueries in quantified comparison predicate&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E061-13&lt;/td&gt;\n&lt;td&gt;Correlated subqueries&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E061-14&lt;/td&gt;\n&lt;td&gt;Search condition&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;SELECT ... WHERE &amp;lt;search condition&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;E071&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Basic query expressions&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Partial&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Joining results of multiple queries&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E071-01&lt;/td&gt;\n&lt;td&gt;UNION DISTINCT table operator&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E071-02&lt;/td&gt;\n&lt;td&gt;UNION ALL table operator&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E071-03&lt;/td&gt;\n&lt;td&gt;EXCEPT DISTINCT table operator&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E071-05&lt;/td&gt;\n&lt;td&gt;Columns combined via table operators need not have exactly the same data type&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;UNION ALL&lt;/code&gt; allows compatible types for columns&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E071-06&lt;/td&gt;\n&lt;td&gt;Table operators in subqueries&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;UNION ALL&lt;/code&gt; can be used in sub-queries&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;E081&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Basic privileges&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;No&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Privileges for INSERT/SELECT/DELETE/UPDATE&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;E091&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Set functions&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Yes&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E091-01&lt;/td&gt;\n&lt;td&gt;AVG&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E091-02&lt;/td&gt;\n&lt;td&gt;COUNT&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E091-03&lt;/td&gt;\n&lt;td&gt;MAX&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E091-04&lt;/td&gt;\n&lt;td&gt;MIN&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E091-05&lt;/td&gt;\n&lt;td&gt;SUM&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E091-06&lt;/td&gt;\n&lt;td&gt;ALL quantifier&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;SELECT AVG(ALL x)&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E091-07&lt;/td&gt;\n&lt;td&gt;DISTINCT quantifier&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;SELECT AVG(DISTINCT x)&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;E101&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Basic data manipulation&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Yes&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E101-01&lt;/td&gt;\n&lt;td&gt;INSERT statement&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E101-03&lt;/td&gt;\n&lt;td&gt;Searched UPDATE statement&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E101-04&lt;/td&gt;\n&lt;td&gt;Searched DELETE statement&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;E111&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Single row SELECT statement&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;No&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;SELECT ... INTO &amp;lt;param1&amp;gt;, &amp;lt;param2&amp;gt; ... FROM&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;E121&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Basic cursor support&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;No&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;DECLARE CURSOR&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;E131&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Null value support (nulls in lieu of values)&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Yes&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;E141&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Basic integrity constraints&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Partial&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E141-01&lt;/td&gt;\n&lt;td&gt;NOT NULL constraints&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E141-02&lt;/td&gt;\n&lt;td&gt;UNIQUE constraint of NOT NULL columns&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E141-03&lt;/td&gt;\n&lt;td&gt;PRIMARY KEY constraints&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E141-04&lt;/td&gt;\n&lt;td&gt;Basic FOREIGN KEY constraint with the NO ACTION default for both referential delete action and referential update action&lt;/td&gt;\n&lt;td&gt;?&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E141-06&lt;/td&gt;\n&lt;td&gt;CHECK constraint&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E141-07&lt;/td&gt;\n&lt;td&gt;Column defaults&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E141-08&lt;/td&gt;\n&lt;td&gt;NOT NULL inferred on PRIMARY KEY&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E141-10&lt;/td&gt;\n&lt;td&gt;Names in a foreign key can be specified in any order&lt;/td&gt;\n&lt;td&gt;?&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;E151&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Transaction support&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;No&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;COMMIT&lt;/code&gt; in YQL is ordering operations within a single transaction&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E151-01&lt;/td&gt;\n&lt;td&gt;COMMIT statement&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E151-02&lt;/td&gt;\n&lt;td&gt;ROLLBACK statement&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;E152&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Basic SET TRANSACTION statement&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;No&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ISOLATION LEVEL&lt;/code&gt; etc&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E152-01&lt;/td&gt;\n&lt;td&gt;SET TRANSACTION statement: ISOLATION LEVEL SERIALIZABLE clause&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;E152-02&lt;/td&gt;\n&lt;td&gt;SET TRANSACTION statement: READ ONLY and READ WRITE clauses&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;E153&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Updatable queries with subqueries&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;No&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;?&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;E161&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;SQL comments using leading double minus&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Yes&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;E171&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;SQLSTATE support&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;No&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;E182&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Host language binding&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;No&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"e021-character-string-types\"&gt;&lt;a href=\"en/yql/differences_from/ansi.html#e021-character-string-types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;E021 Character string types&lt;/span&gt;&lt;/a&gt;E021 Character string types&lt;/h4&gt;\n&lt;p&gt;Should be supported:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;CHARACTER[(len)]&lt;/code&gt; (aka &lt;code&gt;CHAR&lt;/code&gt;): A string type of a fixed length.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;VAR CHAR[(len)]&lt;/code&gt; (aka &lt;code&gt;CHARACTER VARYING&lt;/code&gt;): A string type of a variable length.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;It should also support the optional specifier &lt;code&gt;CHARACTER SET cs&lt;/code&gt; and setting sorting rules by &lt;code&gt;COLLATE&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;These types aren't supported in YQL. The nearest analog is the &lt;code&gt;String&lt;/code&gt; type&lt;br /&gt;\nwhich is a binary string of a variable length.&lt;/p&gt;\n&lt;h5 id=\"e021-03-character-literals\"&gt;&lt;a href=\"en/yql/differences_from/ansi.html#e021-03-character-literals\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;E021-03 Character literals&lt;/span&gt;&lt;/a&gt;E021-03 Character literals&lt;/h5&gt;\n&lt;p&gt;According to the standard, string literals have the following format:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;character string literal&amp;gt; ::=\n  [ &amp;lt;introducer&amp;gt; &amp;lt;character set specification&amp;gt; ]\n      &amp;lt;quote&amp;gt; [ &amp;lt;character representation&amp;gt;... ] &amp;lt;quote&amp;gt;\n      [ { &amp;lt;separator&amp;gt; &amp;lt;quote&amp;gt; [ &amp;lt;character representation&amp;gt;... ] &amp;lt;quote&amp;gt; }... ]\n&amp;lt;separator&amp;gt; ::=\n  { &amp;lt;comment&amp;gt; | &amp;lt;white space&amp;gt; }...\n&amp;lt;introducer&amp;gt; ::=\n  &amp;lt;underscore&amp;gt;\n&amp;lt;character representation&amp;gt; ::=\n    &amp;lt;nonquote character&amp;gt;\n  | &amp;lt;quote symbol&amp;gt;\n&amp;lt;quote symbol&amp;gt; ::=\n  &amp;lt;quote&amp;gt; &amp;lt;quote&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1355\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1355\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1355\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1355.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;In YQL:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Escaping by &lt;code&gt;'&lt;/code&gt; isn't supported&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;Character set specification&amp;gt;&lt;/code&gt; isn't supported&lt;/li&gt;\n&lt;li&gt;Implicit concatenation of literals isn't supported (according to the standard, &lt;code&gt;'aaa' 'bbb'&lt;/code&gt; means the same as &lt;code&gt;'aaabbb&lt;/code&gt;)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;On the other hand:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;You can enclose string literals into double quotes (&lt;code&gt;\"aaa\"&lt;/code&gt;)&lt;/li&gt;\n&lt;li&gt;C-style escaping by a backslash can also be used&lt;/li&gt;\n&lt;li&gt;Multi-line string literals are supported&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h5 id=\"e021-05-octet_length-function\"&gt;&lt;a href=\"en/yql/differences_from/ansi.html#e021-05-octet_length-function\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;E021-05 OCTET_LENGTH function&lt;/span&gt;&lt;/a&gt;E021-05 OCTET_LENGTH function&lt;/h5&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;CHARACTER_LENGTH(&amp;lt;character value expression&amp;gt;) [USING CHARACTERS | OCTETS]\nOCTET_LENGTH(&amp;lt;string value expression&amp;gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1399\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1399\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1399\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1399.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;YQL suports &lt;code&gt;LENGTH(&amp;lt;string value expression&amp;gt;)&lt;/code&gt; that returns the length of a string in bytes&lt;/p&gt;\n&lt;h5 id=\"e021-06-substring-function\"&gt;&lt;a href=\"en/yql/differences_from/ansi.html#e021-06-substring-function\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;E021-06 SUBSTRING function&lt;/span&gt;&lt;/a&gt;E021-06 SUBSTRING function&lt;/h5&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;character substring function&amp;gt; ::=\n  SUBSTRING &amp;lt;left paren&amp;gt; &amp;lt;character value expression&amp;gt; FROM &amp;lt;start position&amp;gt;\n      [ FOR &amp;lt;string length&amp;gt; ] [ USING CHARACTERS | OCTETS ] &amp;lt;right paren&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1406\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1406\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1406\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1406.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;In YQL, it's supported as &lt;code&gt;SUBSTRING(str, start, len)&lt;/code&gt;.&lt;br /&gt;\nCharacter numbering within a string in YQL begins with zero&lt;/p&gt;\n&lt;h5 id=\"e021-09-trim-function\"&gt;&lt;a href=\"en/yql/differences_from/ansi.html#e021-09-trim-function\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;E021-09 TRIM function&lt;/span&gt;&lt;/a&gt;E021-09 TRIM function&lt;/h5&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt; TRIM([[LEADING | TRAILING | BOTH] [&amp;lt;char value expression&amp;gt;] FROM] &amp;lt;char value expression&amp;gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1413\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1413\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1413\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1413.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Deleting a prefix or suffix from a string. Not supported in YQL; you can build a functional equivalent using a String/Unicode UDF.&lt;/p&gt;\n&lt;h5 id=\"e021-11-position-function\"&gt;&lt;a href=\"en/yql/differences_from/ansi.html#e021-11-position-function\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;E021-11 POSITION function&lt;/span&gt;&lt;/a&gt;E021-11 POSITION function&lt;/h5&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;POSITION(S1 IN S2) [USING CHARACTERS | OCTETS]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1420\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1420\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1420\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1420.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Searching a substring S1 in a string S2.&lt;/p&gt;\n&lt;p&gt;Supported in YQL in the format &lt;code&gt;FIND(S2, S1)&lt;/code&gt;. Positions are numbered beginning from 0. If the string isn't found, NULL is returned.&lt;/p&gt;\n&lt;h4 id=\"e031-identifiers\"&gt;&lt;a href=\"en/yql/differences_from/ansi.html#e031-identifiers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;E031 Identifiers&lt;/span&gt;&lt;/a&gt;E031 Identifiers&lt;/h4&gt;\n&lt;p&gt;According to the standard, the IDs (for example, table and column names) can be&lt;br /&gt;\nregular identifiers and delimited identifiers.&lt;br /&gt;\nRegular identifiers begin with a letter and can only include letters, digits, and underscores.&lt;/p&gt;\n&lt;h5 id=\"e031-01-delimited-identifiers\"&gt;&lt;a href=\"en/yql/differences_from/ansi.html#e031-01-delimited-identifiers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;E031-01 Delimited identifiers&lt;/span&gt;&lt;/a&gt;E031-01 Delimited identifiers&lt;/h5&gt;\n&lt;p&gt;Delimited identifiers are enclosed in double quotes: &lt;code&gt;\"abc def\"&lt;/code&gt; and can contain arbitrary characters.&lt;br /&gt;\nDouble quotes are escaped by double quotes: &lt;code&gt;\"complex \"\"identifier\"\"\"&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Instead of double quotes, YQL uses backticks&lt;/p&gt;\n&lt;h4 id=\"e051-basic-query-specification\"&gt;&lt;a href=\"en/yql/differences_from/ansi.html#e051-basic-query-specification\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;E051 Basic query specification&lt;/span&gt;&lt;/a&gt;E051 Basic query specification&lt;/h4&gt;\n&lt;p&gt;According to the standard, the generic format of the SELECT statement is as follows&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;query specification&amp;gt; ::=\n  SELECT [ &amp;lt;set quantifier&amp;gt; ] &amp;lt;select list&amp;gt; &amp;lt;table expression&amp;gt;\n&amp;lt;set quantifier&amp;gt; ::=\n    DISTINCT\n  | ALL\n&amp;lt;select list&amp;gt; ::=\n    &amp;lt;asterisk&amp;gt;\n  | &amp;lt;select sublist&amp;gt; [ { &amp;lt;comma&amp;gt; &amp;lt;select sublist&amp;gt; }... ]\n&amp;lt;select sublist&amp;gt; ::=\n    &amp;lt;derived column&amp;gt;\n  | &amp;lt;qualified asterisk&amp;gt;\n&amp;lt;qualified asterisk&amp;gt; ::=\n    &amp;lt;asterisked identifier chain&amp;gt; &amp;lt;period&amp;gt; &amp;lt;asterisk&amp;gt;\n  | &amp;lt;all fields reference&amp;gt;\n&amp;lt;asterisked identifier chain&amp;gt; ::=\n  &amp;lt;asterisked identifier&amp;gt; [ { &amp;lt;period&amp;gt; &amp;lt;asterisked identifier&amp;gt; }... ]\n&amp;lt;asterisked identifier&amp;gt; ::=\n  &amp;lt;identifier&amp;gt;\n&amp;lt;derived column&amp;gt; ::=\n  &amp;lt;value expression&amp;gt; [ &amp;lt;as clause&amp;gt; ]\n&amp;lt;as clause&amp;gt; ::=\n  [ AS ] &amp;lt;column name&amp;gt;\n&amp;lt;all fields reference&amp;gt; ::=\n  &amp;lt;value expression primary&amp;gt; &amp;lt;period&amp;gt; &amp;lt;asterisk&amp;gt;\n      [ AS &amp;lt;left paren&amp;gt; &amp;lt;all fields column name list&amp;gt; &amp;lt;right paren&amp;gt; ]\n&amp;lt;all fields column name list&amp;gt; ::=\n  &amp;lt;column name list&amp;gt;\n\n&amp;lt;table expression&amp;gt; ::=\n  &amp;lt;from clause&amp;gt;\n      [ &amp;lt;where clause&amp;gt; ]\n      [ &amp;lt;group by clause&amp;gt; ]\n      [ &amp;lt;having clause&amp;gt; ]\n      [ &amp;lt;window clause&amp;gt; ]\n&amp;lt;from clause&amp;gt; ::=\n  FROM &amp;lt;table reference list&amp;gt;\n&amp;lt;table reference list&amp;gt; ::=\n  &amp;lt;table reference&amp;gt; [ { &amp;lt;comma&amp;gt; &amp;lt;table reference&amp;gt; }... ]\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1448\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1448\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1448\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1448.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;YQL doesn't support multiple tables after &lt;code&gt;FROM&lt;/code&gt; (&lt;code&gt;&amp;lt;table reference list&amp;gt;&lt;/code&gt; includes more than one item)&lt;/p&gt;\n&lt;h5 id=\"e051-01-select-distinct\"&gt;&lt;a href=\"en/yql/differences_from/ansi.html#e051-01-select-distinct\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;E051-01 SELECT DISTINCT&lt;/span&gt;&lt;/a&gt;E051-01 SELECT DISTINCT&lt;/h5&gt;\n&lt;p&gt;SELECT DISTINCT is supported except for the variant with asterisk/qualified asterisk&lt;/p&gt;\n&lt;h5 id=\"e051-07-qualified-in-select-list\"&gt;&lt;a href=\"en/yql/differences_from/ansi.html#e051-07-qualified-in-select-list\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;E051-07 Qualified * in select list&lt;/span&gt;&lt;/a&gt;E051-07 Qualified * in select list&lt;/h5&gt;\n&lt;p&gt;In YQL:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;asterisk identifier chain&amp;gt;&lt;/code&gt; can only consist of one item&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;All fields reference&amp;gt;&lt;/code&gt; doesn't support aliases &lt;code&gt;&amp;lt;all fields column name list&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;Value expression primary&amp;gt;&lt;/code&gt; can only include a link to a table&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h5 id=\"e061-01-comparison-predicate\"&gt;&lt;a href=\"en/yql/differences_from/ansi.html#e061-01-comparison-predicate\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;E061-01 Comparison predicate&lt;/span&gt;&lt;/a&gt;E061-01 Comparison predicate&lt;/h5&gt;\n&lt;p&gt;YQL supports operators  &amp;lt;,&amp;gt;,=,&amp;lt;&amp;gt;,&amp;lt;=,&amp;gt;= for compatible types&lt;/p&gt;\n&lt;h5 id=\"e061-07-quantified-comparison-predicate\"&gt;&lt;a href=\"en/yql/differences_from/ansi.html#e061-07-quantified-comparison-predicate\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;E061-07 Quantified comparison predicate&lt;/span&gt;&lt;/a&gt;E061-07 Quantified comparison predicate&lt;/h5&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;quantified comparison predicate&amp;gt; ::=\n  &amp;lt;row value predicand&amp;gt; &amp;lt;quantified comparison predicate part 2&amp;gt;\n&amp;lt;quantified comparison predicate part 2&amp;gt; ::=\n  &amp;lt;comp op&amp;gt; &amp;lt;quantifier&amp;gt; &amp;lt;table subquery&amp;gt;\n&amp;lt;quantifier&amp;gt; ::=\n    &amp;lt;all&amp;gt;\n  | &amp;lt;some&amp;gt;\n&amp;lt;all&amp;gt; ::= ALL\n&amp;lt;some&amp;gt; ::=\n    SOME\n  | ANY\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1490\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1490\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1490\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1490.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/differences_from/ansi.md","sourcePath":"en/yql/differences_from/ansi.md"},"headings":[{"title":"Distinctions in behavior between YQL and ANSI SQL","href":"en/yql/differences_from/ansi.html#distinctions-in-behavior-between-yql-and-ansi-sql","level":2},{"title":"ANSI SQL support status","href":"en/yql/differences_from/ansi.html#ansi-sql-support-status","level":2}],"title":"Distinctions of YQL SQL dialect from ANSI SQL"},"router":{"pathname":"en/yql/differences_from/ansi","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
