        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"intro\"&gt;&lt;a href=\"en/yql/types/type_string.html#intro\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Introduction&lt;/span&gt;&lt;/a&gt;Introduction&lt;/h2&gt;\n&lt;p&gt;Since YQL is a strongly typed language, the data type is important for many of its aspects. To make data type management easy, YQL has a data type definition convention in text format. It's mentioned in many places in the documentation. There's also a library that provides functions for building a data type based on a text description (for example, when manually defining the signature for the called value) or for serializing the data type into a string for debugging purposes.&lt;/p&gt;\n&lt;p&gt;Functions for data types are &lt;a href=\"en/yql/builtins/types.html\"&gt;described in the article&lt;/a&gt;. Below is the format of text representation of data types.&lt;/p&gt;\n&lt;h2 id=\"rules\"&gt;&lt;a href=\"en/yql/types/type_string.html#rules\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General conventions&lt;/span&gt;&lt;/a&gt;General conventions&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"en/yql/types/primitive.html\"&gt;Primitive data types&lt;/a&gt; are represented in text format simply by referencing their name.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;A complex data type is composed of other data types. If you depict this structure as a tree, it has &lt;a href=\"en/yql/types/primitive.html\"&gt;primitive data types&lt;/a&gt; as leaves and &lt;a href=\"en/yql/types/containers.html\"&gt;containers&lt;/a&gt; as other nodes. You may treat &lt;a href=\"en/yql/types/special.html\"&gt;special data types&lt;/a&gt; as exceptions, because they can function as both.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;The text representation repeats the structure of this tree from the root to the leaves: each node of the tree specifies the name of the current data type, and proceeding to a deeper level is denoted by different types of brackets.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Feel free to use spaces and line breaks if they improve readability.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;If the ID contains something else except the Latin letters and numbers, put it in single quotes and use C-escaping.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"containers\"&gt;&lt;a href=\"en/yql/types/type_string.html#containers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Containers&lt;/span&gt;&lt;/a&gt;Containers&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Use angle brackets to specify the types of container elements.&lt;/p&gt;\n&lt;p&gt;Example: &lt;code&gt;List&amp;lt;Int32&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;If a container can hold multiple heterogeneous elements, they are listed inside angle brackets with a comma.&lt;/p&gt;\n&lt;p&gt;Example: &lt;code&gt;Tuple&amp;lt;Int32, String&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;If a container can hold named elements, use comma-separated name-type pairs with a colon in-between instead of comma-separated data types.&lt;/p&gt;\n&lt;p&gt;Example: &lt;code&gt;Struct&amp;lt;a:Int32, b:String&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;The underlying &lt;code&gt;Variant&lt;/code&gt; container type is chosen based on the presence of names in arguments.&lt;/p&gt;\n&lt;p&gt;Example: &lt;code&gt;Variant&amp;lt;Int32, String&amp;gt;&lt;/code&gt; is a variant on tuple, &lt;code&gt;Variant&amp;lt;a:Int32, b:String&amp;gt;&lt;/code&gt; is a variant on structure.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"optional\"&gt;&lt;a href=\"en/yql/types/type_string.html#optional\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Types that allow NULL&lt;/span&gt;&lt;/a&gt;Types that allow NULL&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;They are called &lt;code&gt;Optional&lt;/code&gt; in YQL terms, or nullable in the classic SQL terms.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Formally, this type is a container. So, you may declare it as &lt;code&gt;Optional&amp;lt;...&amp;gt;&lt;/code&gt;, but the shortcut notation of a question mark suffix is usually used instead.&lt;/p&gt;\n&lt;p&gt;Example: &lt;code&gt;String?&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"callable\"&gt;&lt;a href=\"en/yql/types/type_string.html#callable\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Called values&lt;/span&gt;&lt;/a&gt;Called values&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;The basic form of the called values looks as follows: &lt;code&gt;(arg1, arg2, ...) -&amp;gt; result&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;An example of declaring a function signature that accepts two strings and returns a number: &lt;code&gt;(String, String) -&amp;gt; Int64&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;The called values can return the called values: in this case, they make up a chain of the required length.&lt;/p&gt;\n&lt;p&gt;Example: &lt;code&gt;(String, String) -&amp;gt; (String, String) -&amp;gt; Int64&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Optional arguments must have the &lt;code&gt;Optional&lt;/code&gt; type at the top level and be enclosed in square brackets.&lt;/p&gt;\n&lt;p&gt;Example: &lt;code&gt;(String, [String?, Double?]) -&amp;gt; Int64&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;The arguments of the called values can contain flags.&lt;/p&gt;\n&lt;p&gt;Currently, the only possible flag is &lt;code&gt;AutoMap&lt;/code&gt;. It means that if NULL is passed to this argument, the result must also be set to NULL without running the function.&lt;/p&gt;\n&lt;p&gt;Example: &lt;code&gt;(String{Flags: AutoMap}) -&amp;gt; Int64&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Use this particular format if you need &lt;code&gt;Optional&amp;lt;Callable&amp;lt;...&amp;gt;&amp;gt;&lt;/code&gt;, because the trailing question mark refers to the result of the called value.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"resources\"&gt;&lt;a href=\"en/yql/types/type_string.html#resources\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Resources&lt;/span&gt;&lt;/a&gt;Resources&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Unlike containers, a resource isn't parameterized by the element type (it's a pointer in memory and YQL knows nothing about its contents). Instead, a resource is parameterized by a string label that can safeguard against passing resources between incompatible functions.&lt;/p&gt;\n&lt;p&gt;Example: &lt;code&gt;Resource&amp;lt;Foo&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/types/type_string.md","sourcePath":"en/yql/types/type_string.md"},"headings":[{"title":"Introduction","href":"en/yql/types/type_string.html#intro","level":2},{"title":"General conventions","href":"en/yql/types/type_string.html#rules","level":2},{"title":"Containers","href":"en/yql/types/type_string.html#containers","level":2},{"title":"Types that allow NULL","href":"en/yql/types/type_string.html#optional","level":2},{"title":"Called values","href":"en/yql/types/type_string.html#callable","level":2},{"title":"Resources","href":"en/yql/types/type_string.html#resources","level":2}],"title":"Text representation of data types"},"router":{"pathname":"en/yql/types/type_string","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexN         </script>
