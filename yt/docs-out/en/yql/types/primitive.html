        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;The terms \"simple\", \"primitive\", and \"elementary\" data types are used synonymously.&lt;/p&gt;\n&lt;h2 id=\"numeric\"&gt;&lt;a href=\"en/yql/types/primitive.html#numeric\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Numeric types&lt;/span&gt;&lt;/a&gt;Numeric types&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;th&gt;Notes&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Boolean value.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Int8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A signed integer.&lt;br /&gt;Acceptable values: from -2&lt;sup&gt;7&lt;/sup&gt; to 2&lt;sup&gt;7&lt;/sup&gt;–1.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Int16&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A signed integer.&lt;br /&gt;Acceptable values: from –2&lt;sup&gt;15&lt;/sup&gt; to 2&lt;sup&gt;15&lt;/sup&gt;–1.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Int32&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A signed integer.&lt;br /&gt;Acceptable values: from –2&lt;sup&gt;31&lt;/sup&gt; to 2&lt;sup&gt;31&lt;/sup&gt;–1.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Int64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A signed integer.&lt;br /&gt;Acceptable values: from –2&lt;sup&gt;63&lt;/sup&gt; to 2&lt;sup&gt;63&lt;/sup&gt;–1.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Uint8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;An unsigned integer.&lt;br /&gt;Acceptable values: from 0 to 2&lt;sup&gt;8&lt;/sup&gt;–1.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Uint16&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;An unsigned integer.&lt;br /&gt;Acceptable values: from 0 to 2&lt;sup&gt;16&lt;/sup&gt;–1.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Uint32&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;An unsigned integer.&lt;br /&gt;Acceptable values: from 0 to 2&lt;sup&gt;32&lt;/sup&gt;–1.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;An unsigned integer.&lt;br /&gt;Acceptable values: from 0 to 2&lt;sup&gt;64&lt;/sup&gt;–1.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Float&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A real number with variable precision, 4 bytes in size.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Double&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A real number with variable precision, 8 bytes in size.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Decimal&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A real number with the specified precision, up to 35 decimal digits&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;DyNumber&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A binary representation of a real number with an accuracy of up to 38 digits.&lt;br /&gt;Acceptable values: positive numbers from 1×10&lt;sup&gt;-130&lt;/sup&gt; up to 1×10&lt;sup&gt;126&lt;/sup&gt;–1, negative numbers from -1×10&lt;sup&gt;126&lt;/sup&gt;–1 to -1×10&lt;sup&gt;-130&lt;/sup&gt;, and 0.&lt;br /&gt;Compatible with the &lt;code&gt;Number&lt;/code&gt; type in AWS DynamoDB.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"string\"&gt;&lt;a href=\"en/yql/types/primitive.html#string\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;String types&lt;/span&gt;&lt;/a&gt;String types&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;th&gt;Notes&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;String&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A string that can contain any binary data&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Utf8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Text encoded in &lt;a href=\"https://en.wikipedia.org/wiki/UTF-8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;UTF-8&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Json&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://en.wikipedia.org/wiki/JSON\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;JSON&lt;/a&gt; represented as text&lt;/td&gt;\n&lt;td&gt;Doesn't support matching&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;JsonDocument&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://en.wikipedia.org/wiki/JSON\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;JSON&lt;/a&gt; in an indexed binary representation&lt;/td&gt;\n&lt;td&gt;Doesn't support matching&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Yson&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/yql/udf/list/yson.html\"&gt;YSON&lt;/a&gt; in a textual or binary representation.&lt;/td&gt;\n&lt;td&gt;Doesn't support matching&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Uuid&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Universally unique identifier &lt;a href=\"https://tools.ietf.org/html/rfc4122\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;UUID&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Unlike the &lt;code&gt;JSON&lt;/code&gt; data type that stores the original text representation passed by the user, &lt;code&gt;JsonDocument&lt;/code&gt; uses an indexed binary representation. An important difference from the point of view of semantics is that &lt;code&gt;JsonDocument&lt;/code&gt; doesn't preserve formatting, the order of keys in objects, or their duplicates.&lt;/p&gt;\n&lt;p&gt;Thanks to the indexed view, &lt;code&gt;JsonDocument&lt;/code&gt; lets you bypass the document model using &lt;code&gt;JsonPath&lt;/code&gt; without the need to parse the full content. This helps efficiently perform operations from the &lt;a href=\"en/yql/builtins/json.html\"&gt;JSON API&lt;/a&gt;, reducing delays and cost of user queries. Execution of &lt;code&gt;JsonDocument&lt;/code&gt; queries can be up to several times more efficient depending on the type of load.&lt;/p&gt;\n&lt;p&gt;Due to the added redundancy, &lt;code&gt;JsonDocument&lt;/code&gt; is less effective in storage. The additional storage overhead depends on the specific content, but is 20-30% of the original volume on average. Saving data in &lt;code&gt;JsonDocument&lt;/code&gt; format requires additional conversion from the textual representation, which makes writing it less efficient. However, for most read-intensive scenarios that involve processing data from JSON, this data type is preferred and recommended.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;To store numbers (JSON Number) in &lt;code&gt;JsonDocument&lt;/code&gt;, as well as for arithmetic operations on them in the &lt;a href=\"en/yql/builtins/json.html\"&gt;JSON API&lt;/a&gt;, the &lt;a href=\"https://en.wikipedia.org/wiki/Double-precision_floating-point_format\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Double&lt;/a&gt; type is used. Precision might be lost when non-standard representations of numbers are used in the source JSON document.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"datetime\"&gt;&lt;a href=\"en/yql/types/primitive.html#datetime\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Date and time&lt;/span&gt;&lt;/a&gt;Date and time&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;th&gt;Notes&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Date&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Date, precision to the day&lt;/td&gt;\n&lt;td&gt;Range of values for all time types except &lt;code&gt;Interval&lt;/code&gt;: From 00:00 01.01.1970 to 00:00 01.01.2106. Internal &lt;code&gt;Date&lt;/code&gt; representation: Unsigned 16-bit integer&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Datetime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Date/time, precision to the second&lt;/td&gt;\n&lt;td&gt;Internal representation: Unsigned 32-bit integer&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Timestamp&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Date/time, precision to the microsecond&lt;/td&gt;\n&lt;td&gt;Internal representation: Unsigned 64-bit integer&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Interval&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Time interval (signed), precision to microseconds&lt;/td&gt;\n&lt;td&gt;Value range: From -136 years to +136 years. Internal representation: Signed 64-bit integer.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;TzDate&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Date with time zone label, precision to the day&lt;/td&gt;\n&lt;td&gt;Not supported in table columns&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;TzDateTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Date/time with time zone label, precision to the second&lt;/td&gt;\n&lt;td&gt;Not supported in table columns&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;TzTimestamp&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Date/time with time zone label, precision to the microsecond&lt;/td&gt;\n&lt;td&gt;Not supported in table columns&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"supporting-types-with-a-time-zone-label\"&gt;&lt;a href=\"en/yql/types/primitive.html#supporting-types-with-a-time-zone-label\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Supporting types with a time zone label&lt;/span&gt;&lt;/a&gt;Supporting types with a time zone label&lt;/h3&gt;\n&lt;p&gt;Time zone label for the &lt;code&gt;TzDate&lt;/code&gt;, &lt;code&gt;TzDatetime&lt;/code&gt;, &lt;code&gt;TzTimestamp&lt;/code&gt; types is an attribute that is used:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;When converting (&lt;a href=\"en/yql/syntax/expressions.html#cast\"&gt;CAST&lt;/a&gt;, &lt;a href=\"en/yql/udf/list/datetime.html#parse\"&gt;DateTime::Parse&lt;/a&gt;, &lt;a href=\"en/yql/udf/list/datetime.html#format\"&gt;DateTime::Format&lt;/a&gt;) to a string and from a string.&lt;/li&gt;\n&lt;li&gt;In &lt;a href=\"en/yql/udf/list/datetime.html#split\"&gt;DateTime::Split&lt;/a&gt;, a timezone component is added to &lt;code&gt;Resource&amp;lt;TM&amp;gt;&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The point in time for these types is stored in UTC, and the timezone label doesn't participate in any other calculations in any way. For example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT -- these expressions are always true for any timezones: the timezone doesn't affect the point in time.\n    AddTimezone(CurrentUtcDate(), \"Europe/Moscow\") ==\n        AddTimezone(CurrentUtcDate(), \"America/New_York\"),\n    AddTimezone(CurrentUtcDatetime(), \"Europe/Moscow\") ==\n        AddTimezone(CurrentUtcDatetime(), \"America/New_York\");\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"390\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-390\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-390\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-390.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Keep in mind that when converting between &lt;code&gt;TzDate&lt;/code&gt; and &lt;code&gt;TzDatetime&lt;/code&gt;, or &lt;code&gt;TzTimestamp&lt;/code&gt; the date's midnight doesn't follow the local time zone, but midnight in UTC for the date in UTC.&lt;/p&gt;\n&lt;h2 id=\"cast\"&gt;&lt;a href=\"en/yql/types/primitive.html#cast\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Casting between data types&lt;/span&gt;&lt;/a&gt;Casting between data types&lt;/h2&gt;\n&lt;h3 id=\"explicit-cast\"&gt;&lt;a href=\"en/yql/types/primitive.html#explicit-cast\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Explicit casting&lt;/span&gt;&lt;/a&gt;Explicit casting&lt;/h3&gt;\n&lt;p&gt;Explicit casting using &lt;a href=\"en/yql/syntax/expressions.html#cast\"&gt;CAST&lt;/a&gt;:&lt;/p&gt;\n&lt;h4 id=\"casting-to-numeric-types\"&gt;&lt;a href=\"en/yql/types/primitive.html#casting-to-numeric-types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Casting to numeric types&lt;/span&gt;&lt;/a&gt;Casting to numeric types&lt;/h4&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Bool&lt;/th&gt;\n&lt;th&gt;Int&lt;/th&gt;\n&lt;th&gt;Uint&lt;/th&gt;\n&lt;th&gt;Float&lt;/th&gt;\n&lt;th&gt;Double&lt;/th&gt;\n&lt;th&gt;Decimal&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Bool&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Yes&lt;sup&gt;1&lt;/sup&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;sup&gt;1&lt;/sup&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;sup&gt;1&lt;/sup&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;sup&gt;1&lt;/sup&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;INT&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;sup&gt;2&lt;/sup&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Yes&lt;sup&gt;3&lt;/sup&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Uint&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;sup&gt;2&lt;/sup&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Float&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;sup&gt;2&lt;/sup&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Double&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;sup&gt;2&lt;/sup&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Decimal&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;String&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Utf8&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;td&
