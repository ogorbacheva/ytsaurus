        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"introduction\"&gt;&lt;a href=\"en/yql/recipes/metaprogramming.html#introduction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Introduction&lt;/span&gt;&lt;/a&gt;Introduction&lt;/h2&gt;\n&lt;p&gt;YTsaurus doesn't support partitioned tables natively. That's why typical is the situation where a logically single table is stored as a set of physical tables split by date, hour, or the division remainder of some field hash. As a result, the queries run in YQL over YTsaurus often access a huge number of tables (dozens, hundreds, or thousands).&lt;/p&gt;\n&lt;p&gt;Measured by the SQL standard, this is an exclusive situation and there are no generally adopted mechanisms to describe such queries in SQL terms. Rachel offers many extensions for the standard designed for such specific tasks. In the majority of regularly or periodically ran queries, they enable you to totally skip generation of query texts on the client. Each mechanism &lt;a href=\"yql/syntax/index.html\"&gt;is detailed in the main YQL syntax tutorial&lt;/a&gt;, and the purpose of this article is to demonstrate how you can combine these mechanisms to achieve practically useful results on near-to-real examples.&lt;/p&gt;\n&lt;h2 id=\"use-cases\"&gt;&lt;a href=\"en/yql/recipes/metaprogramming.html#use-cases\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Use cases&lt;/span&gt;&lt;/a&gt;Use cases&lt;/h2&gt;\n&lt;h3 id=\"selecting-tables-by-dates\"&gt;&lt;a href=\"en/yql/recipes/metaprogramming.html#selecting-tables-by-dates\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Selecting tables by dates&lt;/span&gt;&lt;/a&gt;Selecting tables by dates&lt;/h3&gt;\n&lt;p&gt;Most logs are archived to a flat directory in YTsaurus where an independent table is created for each date. If you want to make a calculation for certain dates, but don't want to add them manually to the query text, use the &lt;code&gt;FILTER&lt;/code&gt; table function and select the dates with a Lambda function.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE &amp;lt;cluster-name&amp;gt;;\n\n$log_type = \"yql-log\";\n$base_folder = \"logs/\" || $log_type || \"/1d\";\n$today = CurrentUtcDate();\n$yesterday = $today - Interval(\"P1D\");\n$a_week_ago = $today - Interval(\"P1W\");\n\n$is_during_last_week = ($table_name) -&amp;gt; {\n    $date = CAST($table_name AS Date);\n    RETURN ($date BETWEEN $a_week_ago AND $yesterday) ?? false;\n};\n\nSELECT COUNT(*)\nFROM FILTER($base_folder, $is_during_last_week);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"18\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-18\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-18\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-18.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Links to documentation:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"yql/builtins/basic.html#currentutcdate\"&gt;CurrentUtcDate&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/syntax/expressions.html#lambda\"&gt;Lambda functions&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/syntax/select/index.html\"&gt;FILTER&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"processing-tables-with-a-cached-sliding-window\"&gt;&lt;a href=\"en/yql/recipes/metaprogramming.html#processing-tables-with-a-cached-sliding-window\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Processing tables with a cached sliding window&lt;/span&gt;&lt;/a&gt;Processing tables with a cached sliding window&lt;/h3&gt;\n&lt;p&gt;Imagine that every day you need to calculate some aggregate of values for the previous week (like in the previous example). By their very nature, most log tables don't change beginning from the night of the next day. Hence, nearly 6/7 of computing resources every day are wasted to repeat calculations from the previous day. YQL offers a mechanism for &lt;a href=\"yql/syntax/pragma/yt#querycachemode\"&gt;automatic caching of intermediate computing results&lt;/a&gt;. However, as it wholly runs at the MapReduce level, the previous query would have zero cache hit: every day will produce a different set  of input tables for the first Map operation (and this set is used to calculate a key in the cache).&lt;/p&gt;\n&lt;p&gt;To give the automatic caching mechanism a chance to succeed (or even guarantee success, if you override &lt;a href=\"yql/syntax/pragma/yt#tmpfolder\"&gt;PRAGMA yt.TmpFolder&lt;/a&gt; to your custom directory/quota instead of &lt;code&gt;//tmp&lt;/code&gt;), you need to calculate an aggregate for each day separately and then combine the aggregates into a single resulting value (fortunately, most aggregate functions support this).&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE &amp;lt;cluster-name&amp;gt;;\n\n$log_type = \"visit-log\";\n$base_folder = \"logs/\" || $log_type || \"/1d/\";\n$today = CurrentUtcDate();\n$range = ListFromRange(1, 9);\n\n$shift_back_by_days = ($days_count) -&amp;gt; {\n    RETURN Unwrap(\n        $today - $days_count * Interval(\"P1D\"),\n        \"Failed to shift today back by \" || CAST($days_count AS String) || \" days\"\n    );\n};\n$dates = ListMap($range, $shift_back_by_days);\n\nDEFINE ACTION $max_income($date) AS\n    $table_path = $base_folder || CAST($date AS String);\n    INSERT INTO @daily_results\n    SELECT MAX(CAST(Income AS Double)) AS MaxIncome\n    FROM $table_path;\nEND DEFINE;\n\nEVALUATE FOR $date IN $dates DO $max_income($date);\n\nCOMMIT;\n\nSELECT MAX(MaxIncome) AS MaxIncome\nFROM @daily_results;\n\nDISCARD SELECT\n    Ensure(\n        NULL,\n        COUNT(*) == 7,\n        \"Unexpected number of aggregates to be merged: \" || CAST(COUNT(*) AS String) || \" instead of 7\"\n    )\nFROM @daily_results;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"48\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-48\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-48\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-48.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;In contrast to the previous example, here we don't select table paths based on the directory contents. Instead, we generate them \"out of thin air\" based on the table naming conventions configured for this log. We first define an action to process each table separately (&lt;code&gt;DEFINE ACTION&lt;/code&gt;) and then use a loop to apply this action to each calculated date (&lt;code&gt;EVALUATE FOR&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;This query also demonstrates several ways to terminate a query with a meaningful error if something strange occurs, instead of producing an invalid result:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Going beyond the range of supported values is almost impossible for this use case. However, only in these situations, the date arithmetic can return NULL. In this context, it's quite safe to use Unwrap to convert an Optional value to a non-Optional one (exactly not NULL), producing a runtime error if the Optional type, nevertheless, included NULL.&lt;/li&gt;\n&lt;li&gt;Using Ensure, you can check any conditions when running a query and return an error if the condition isn't met. You can add it at runtime, but if you combine it with &lt;code&gt;DISCARD&lt;/code&gt; (calculate something and discard the result), you can make a separate side-check, for example, based on an aggregate of a temporary or summary table as here. In the case with &lt;code&gt;DISCARD&lt;/code&gt;, the first argument is Ensure, which is usually a result of its call. It doesn't bear much sense, so you can write any constant to it, for example, NULL.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Links to documentation:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"yql/syntax/expressions.html#lambda\"&gt;Lambda functions&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/builtins/basic.html#currentutcdate\"&gt;CurrentUtcDate&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/builtins/list.html#listfromrange\"&gt;ListFromRange&lt;/a&gt; / &lt;a href=\"yql/builtins/list.html#listmap\"&gt;ListMap&lt;/a&gt; / &lt;a href=\"yql/builtins/list.html#listlength\"&gt;ListLength&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/builtins/basic.html#unwrap\"&gt;Unwrap&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/syntax/action.html\"&gt;DEFINE ACTION&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/syntax/action.html#evaluate-for\"&gt;EVALUATE FOR&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/syntax/select/temporary_table.html\"&gt;@foo&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/syntax/commit.html\"&gt;COMMIT&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/syntax/discard.html\"&gt;DISCARD&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/builtins/basic.html#ensure\"&gt;Ensure&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"use-case-with-job-processing\"&gt;&lt;a href=\"en/yql/recipes/metaprogramming.html#use-case-with-job-processing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Use case with job processing&lt;/span&gt;&lt;/a&gt;Use case with job processing&lt;/h3&gt;\n&lt;p&gt;For example, you have an external process that writes tables to a directory. Basically, these tables are jobs to be processed. You need to run a computation on the contents of such table, write the result to another directory, and delete the processed tables: all this in the transactional mode.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;How can you emulate such an external process on YQL for testing purposes?&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE &amp;lt;cluster-name&amp;gt;;\n\n$root_folder = \"//tmp/tasks/\";\n$values = ListFromRange(1, 10);\n\nDEFINE ACTION $create_task($i) AS\n    $path = $root_folder || CAST($i AS String);\n    INSERT INTO $path SELECT $i AS Task;\nEND DEFINE;\n\nEVALUATE FOR $value IN $values DO $create_task($value);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"133\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-133\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-133\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-133.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;First, start the processing&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE &amp;lt;cluster-name&amp;gt;;\n\n$tasks_folder = \"tmp/tasks\";\n$results_folder = \"tmp/results\";\n\nDEFINE ACTION $process_task($input_path) AS\n    $output_path = String::ReplaceAll($input_path, $tasks_folder, $results_folder);\n\n    INSERT INTO $output_path WITH TRUNCATE\n    SELECT Task * Task AS Result\n    FROM $input_path;\n    COMMIT;\n    DROP TABLE $input_path;\nEND DEFINE;\n\n$tasks = (\n    SELECT AGGREGATE_LIST(Path)\n    FROM FOLDER($tasks_folder, \"row_count\")\n    WHERE Type == \"table\" AND\n        Yson::LookupInt64(Attributes, \"row_count\") == 1\n);\n\nEVALUATE FOR $task IN $tasks ?? ListCreate(TypeOf($tasks)) DO $process_task($task);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"139\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-139\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-139\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-139.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Here, you also use the mechanism of actions that loop through a list. However, the list of input tables isn't taken \"out of thin air\", but from the &lt;code&gt;FOLDER&lt;/code&gt; table function that provides access to the contents of an arbitrary directory in YTsaurus. Since &lt;code&gt;FOLDER&lt;/code&gt; outputs not only tables but other types of nodes as well, meaning you can't be sure that the directory hosts only tables, we recommend adding a filter by Type or by arbitrary meta attributes of the table (we use row_count here as an example). For this, you'll need to query them in the second &lt;code&gt;FOLDER&lt;/code&gt; argument (if you have several of them, use a semicolon) and then access the Attributes Yson-type column.&lt;/p&gt;\n&lt;p&gt;ListExtract takes a list of structures that include a single element and converts it to a list of strings with paths. However, it's also possible to retrieve Path from inside the action.&lt;/p&gt;\n&lt;p&gt;Links to documentation:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"yql/udf/list/string.html\"&gt;String UDF&lt;/a&gt; / &lt;a href=\"yql/udf/list/yson.html\"&gt;Yson UDF&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/builtins/list.html#listfromrange\"&gt;ListFromRange&lt;/a&gt; / &lt;a href=\"yql/builtins/list.html#listextract\"&gt;ListExtract&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/syntax/select/folder.html\"&gt;FOLDER&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/syntax/drop_table.html\"&gt;DROP TABLE&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/recipes/metaprogramming.md","sourcePath":"en/yql/recipes/metaprogramming.md"},"headings":[{"title":"Introduction","href":"en/yql/recipes/metaprogramming.html#introduction","level":2},{"title":"Use cases","href":"en/yql/recipes/metaprogramming.html#use-cases","level":2,"items":[{"title":"Selecting tables by dates","href":"en/yql/recipes/metaprogramming.html#selecting-tables-by-dates","level":3},{"title":"Processing tables with a cached sliding window","href":"en/yql/recipes/metaprogramming.html#processing-tables-with-a-cached-sliding-window","level":3},{"title":"Use case with job processing","href":"en/yql/recipes/metaprogramming.html#use-case-with-job-processing","level":3}]}],"title":"Metaprogramming practices in YQL"},"router":{"pathname":"en/yql/recipes/metaprogramming","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
