            {"data":{"leading":false,"html":"&lt;h2 id=\"introduction\"&gt;&lt;a href=\"en/yql/recipes/codegen.html#introduction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Introduction&lt;/span&gt;&lt;/a&gt;Introduction&lt;/h2&gt;\n&lt;p&gt;When working with tables of many columns, you might spend too much effort listing them repeatedly in different parts of your SQL query. This happens when you can't select all your columns by &lt;code&gt;*&lt;/code&gt; and, optionally, by &lt;code&gt;WITHOUT&lt;/code&gt;. Sometimes, column selection may depend both on the column name and its data type. To avoid writing lengthy SQL queries manually, you can use &lt;a href=\"en/yql/builtins/types.html\"&gt;type introspection&lt;/a&gt; and &lt;a href=\"en/yql/builtins/codegen.html\"&gt;code generation&lt;/a&gt;. Code will be generated before the main query is executed, and the resulting programs are fully equivalent to those written manually.&lt;/p&gt;\n&lt;p&gt;When you use code generation, keep in mind that as it is executed before the main process starts, so you can only use column types when generating code, but not column values. You can also use constants and expressions that do not depend on table columns, without any limitation.&lt;/p&gt;\n&lt;p&gt;Now let's discuss typical use cases and how to implement them.&lt;/p&gt;\n&lt;h2 id=\"use-cases\"&gt;&lt;a href=\"en/yql/recipes/codegen.html#use-cases\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Use cases&lt;/span&gt;&lt;/a&gt;Use cases&lt;/h2&gt;\n&lt;h3 id=\"declaring-a-udf-type-by-computations\"&gt;&lt;a href=\"en/yql/recipes/codegen.html#declaring-a-udf-type-by-computations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Declaring a UDF type by computations&lt;/span&gt;&lt;/a&gt;Declaring a UDF type by computations&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$tuple = AsTuple(1, \"foo\", AsList(-1.2, 3.0));\n\n$tupleType = TypeOf($tuple);\n$reverseTupleType = EvaluateType(TupleTypeHandle(\n    ListReverse(TupleTypeComponents(TypeHandle($tupleType)))));\n\n$script = @@\ndef reverse_any_tuple(t):\n   return tuple(reversed(list(t)))\n@@;\n\n\n$udfType = CallableType(0, $reverseTupleType, $tupleType);\n$udf = {{python-lib-qt}}::reverse_any_tuple($udfType, $script);\n\nSELECT $udf($tuple);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"18\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-18\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-18\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-18.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Links to documentation:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/types.html#evaluatetype\"&gt;EvaluateType&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"filtering-columns-by-a-list-of-names\"&gt;&lt;a href=\"en/yql/recipes/codegen.html#filtering-columns-by-a-list-of-names\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Filtering columns by a list of names&lt;/span&gt;&lt;/a&gt;Filtering columns by a list of names&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE &amp;lt;cluster-name&amp;gt;;\n\n$makeFieldsSelector = ($fields) -&amp;gt; {\n    RETURN EvaluateCode(LambdaCode(($row) -&amp;gt; {\n        $items = ListMap($fields, ($f) -&amp;gt; {\n            $atom = AtomCode($f);\n            RETURN ListCode($atom, FuncCode(\"Member\", $row, $atom));\n        });\n\n        RETURN FuncCode(\"AsStruct\", $items);\n    }))\n};\n\n$selectFields1 = $makeFieldsSelector(AsList(\"age\", \"name\", \"region\"));\n$selectFields2 = $makeFieldsSelector(AsList(\"age\", \"name\"));\n\nINSERT INTO @tmp1\nSELECT * FROM (\n    SELECT $selectFields1(TableRow()) FROM `home/yql/tutorial/users`\n    WHERE region != 225\n) FLATTEN COLUMNS;\n\nINSERT INTO @tmp2\nSELECT * FROM (\n    SELECT $selectFields2(TableRow()) FROM `home/yql/tutorial/users`\n    WHERE region = 225\n) FLATTEN COLUMNS;\n\nCOMMIT;\n\nSELECT * FROM @tmp1;\nSELECT * FROM @tmp2;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"32\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-32\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-32\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-32.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Links to documentation:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/codegen.html#evaluatecode\"&gt;EvaluateCode&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/list.html#listmap\"&gt;ListMap&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/expressions.html#lambda\"&gt;Lambda functions&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/basic.html#tablerow\"&gt;TableRow&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"searching-in-all-string-columns\"&gt;&lt;a href=\"en/yql/recipes/codegen.html#searching-in-all-string-columns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Searching in all string columns&lt;/span&gt;&lt;/a&gt;Searching in all string columns&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE &amp;lt;cluster-name&amp;gt;;\n\n$containsAnyColumns = ($strValue, $needle) -&amp;gt; {\n    -- Lambda function, a predicate that will be applied to the value of each column\n    $func = ($where) -&amp;gt; {\n        RETURN String::Contains($where, $needle);\n    };\n\n    $code = EvaluateCode(LambdaCode(($strCode) -&amp;gt; {\n        -- Select a list of struct fields\n        $members = StructTypeComponents(TypeHandle(TypeOf($strValue)));\n\n        $filteredMembers = ListFilter($members, ($x) -&amp;gt; {\n             $type = $x.Type;\n             -- Remove the optional top-level type\n             $cleanType = If (TypeKind($type) == \"Optional\", OptionalItemType($type), $type);\n             -- Leave only String and String? columns\n             RETURN TypeKind($cleanType) == \"Data\" AND\n                DataTypeComponents($cleanType)[0] == \"String\";\n        });\n\n        -- Generate an expression in the format $func(column1) OR $func(column2)...\n        RETURN Yql::Fold($filteredMembers, ReprCode(false), ($item, $state) -&amp;gt; {\n            $member = FuncCode(\"Member\", $strCode, AtomCode($item.Name));\n            $apply = FuncCode(\"Apply\", QuoteCode($func), $member);\n            RETURN FuncCode(\"Or\", $state, $apply);\n        });\n    }));\n\n    RETURN $code($strValue);\n};\n\nSELECT * FROM `home/yql/tutorial/users`\nWHERE $containsAnyColumns(TableRow(), \"comment\");\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"61\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-61\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-61\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-61.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Links to documentation:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/codegen.html#evaluatecode\"&gt;EvaluateCode&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/list.html#listmap\"&gt;ListFilter&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/expressions.html#lambda\"&gt;Lambda functions&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/basic.html#tablerow\"&gt;TableRow&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"merging-structures-left-to-right\"&gt;&lt;a href=\"en/yql/recipes/codegen.html#merging-structures-left-to-right\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Merging structures left-to-right&lt;/span&gt;&lt;/a&gt;Merging structures left-to-right&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;\n-- Remove the high-level Optional from the data type\n$removeOptional = ($type) -&amp;gt; {\n    RETURN IF(TypeKind($type) == \"Optional\", OptionalItemType($type), $type);\n};\n\n$combineMembersLeft = ($str1, $str2) -&amp;gt; {\n    $code = EvaluateCode(LambdaCode(($str1code, $str2code) -&amp;gt; {\n        -- Get lists of fields from both structures\n        $leftMembers = StructTypeComponents($removeOptional(TypeHandle(TypeOf($str1))));\n        $rightMembers = StructTypeComponents($removeOptional(TypeHandle(TypeOf($str2))));\n\n        -- Generate field retrieval from the left structure\n        $members1 = ListMap($leftMembers, ($x) -&amp;gt; {\n            $atom = AtomCode($x.Name);\n            RETURN ListCode($atom, FuncCode(\"Member\", $str1code, $atom));\n        });\n\n        -- Collect the names of fields in the left structure into a set to facilitate search\n        $leftNames = ToSet(ListExtract($leftMembers, \"Name\"));\n\n        -- Generate retrieval of fields from the right structure unless they are already in the left structure\n        $members2 = ListFlatMap($rightMembers, ($x) -&amp;gt; {\n            $atom = AtomCode($x.Name);\n            $member = ListCode($atom, FuncCode(\"Member\", $str2code, $atom));\n            RETURN IF(DictContains($leftNames, $x.Name), NULL, $member);\n        });\n\n        -- Generate a final structure\n        RETURN FuncCode(\"AsStruct\", ListExtend($members1, $members2));\n    }));\n\n    RETURN $code($str1, $str2);\n};\n\nSELECT $combineMembersLeft(\n    Just(AsStruct(1 as a, 2 as b)),\n    AsStruct(3 as c, 4 as b)\n);\n-- (a:1, b:2, c:3)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"90\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-90\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-90\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-90.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Links to documentation:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/codegen.html#evaluatecode\"&gt;EvaluateCode&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/list.html#listmap\"&gt;ListMap&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/expressions.html#lambda\"&gt;Lambda functions&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"reading-a-column-by-the-name-written-to-another-column\"&gt;&lt;a href=\"en/yql/recipes/codegen.html#reading-a-column-by-the-name-written-to-another-column\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reading a column by the name written to another column&lt;/span&gt;&lt;/a&gt;Reading a column by the name written to another column&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$input = AsList(\n    AsStruct(1 as key, \"value1\" as index, \"foo\" as value1),\n    AsStruct(2 as key, \"value2\" as index, \"bar\" as value2),\n    AsStruct(3 as key, \"value3\" as index)\n);\n\n-- Build a Lambda function that returns, for the input table row,\ntwo columns - a key copied unchanged and a value\n-- retrieved from a column whose name is written to the index column.\n$makeDynamicAccessor = ($keyColumn, $indexColumn, $valueColumn) -&amp;gt; {\n    RETURN ($row) -&amp;gt; {\n        RETURN EvaluateCode(LambdaCode(($rowCode) -&amp;gt; {\n            -- Build a list of all fields except the key field and index field\n            $names = ListExtract(StructTypeComponents(TypeHandle(TypeOf($row))), \"Name\");\n            $names = ListFilter($names, ($x) -&amp;gt; {\n                    return $x != $keyColumn and $x != $indexColumn\n            });\n\n            -- Build a dictionary from the column name contained in variant\n            $dict = EvaluateCode(FuncCode(\"AsDict\",\n                ListMap($names,\n                    ($x) -&amp;gt; {\n                        RETURN ListCode(ReprCode($x),\n                            FuncCode(\"Variant\", FuncCode(\"Void\"), AtomCode($x),\n                            FuncCode(\"VariantType\", FuncCode(\"StructType\",\n                                ListMap($names, ($x) -&amp;gt; {\n                                    RETURN ListCode(AtomCode($x), FuncCode(\"VoidType\")) })))))\n                    })));\n\n            -- Index column value\n            $indexValue = FuncCode(\"Member\", $rowCode, AtomCode($indexColumn));\n\n            -- Take the column value unchanged\n            $keyMember = ListCode(AtomCode($keyColumn),\n                FuncCode(\"Member\", $rowCode, AtomCode($keyColumn)));\n\n            -- Search in the dictionary\n            $enumLookup = FuncCode(\"Lookup\", ReprCode($dict), $indexValue);\n\n            -- Process the value found in the dictionary\n            $value = FuncCode(\"FlatMap\", $enumLookup, LambdaCode(($x) -&amp;gt; {\n                -- Build a list of handlers for each column name\n                $handlers = ListFlatMap($names, ($name) -&amp;gt; {\n                    RETURN AsList(AtomCode($name),\n                        LambdaCode(($u) -&amp;gt; {\n                            RETURN FuncCode(\"Member\", $rowCode, AtomCode($name));\n                        }));\n                });\n\n                -- Apply a visitor to the found value\n                RETURN FuncCode(\"Visit\", $x, $handlers);\n            }));\n\n            $valueMember = ListCode(AtomCode($valueColumn), $value);\n\n            -- Build an output structure of the key and value\n            RETURN FuncCode(\"AsStruct\", AsList($keyMember, $valueMember));\n        }))($row);\n    };\n};\n\nSELECT * FROM (\n    SELECT $makeDynamicAccessor(\"key\",\"index\",\"value\")(TableRow())\n    FROM AS_TABLE($input)\n) FLATTEN COLUMNS\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"114\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-114\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-114\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-114.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Links to documentation:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/codegen.html#evaluatecode\"&gt;EvaluateCode&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/list.html#listmap\"&gt;ListMap&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/expressions.html#lambda\"&gt;Lambda functions&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"calculate-a-sum-across-tuple-items\"&gt;&lt;a href=\"en/yql/recipes/codegen.html#calculate-a-sum-across-tuple-items\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Calculate a sum across tuple items&lt;/span&gt;&lt;/a&gt;Calculate a sum across tuple items&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$t = AsTuple(1,2,3);\n\n$sumTuple = ($tupleValue) -&amp;gt; {\n    $code = EvaluateCode(LambdaCode(($tupleCode) -&amp;gt; {\n        -- Count the tuple size\n        $count = ListLength(TupleTypeComponents(TypeHandle(TypeOf($tupleValue))));\n        -- Generate the sum\n        $pair = Yql::Fold(ListFromRange(0ul, $count), AsTuple(ReprCode(0), 0), ($item, $state) -&amp;gt; {\n            -- $state is a pair of the sum and current index taken from the code\n            RETURN AsTuple(\n                FuncCode(\"+\", $state.0, FuncCode(\"Nth\", $tupleCode, AtomCode(\n                    CAST($state.1 as string)))),\n                $state.1 + 1\n            )\n        });\n\n        RETURN $pair.0;\n    }));\n\n    RETURN $code($tupleValue);\n};\n\nSELECT $sumTuple($t);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"138\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-138\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-138\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-138.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Links to documentation:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/codegen.html#evaluatecode\"&gt;EvaluateCode&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/expressions.html#lambda\"&gt;Lambda functions&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"aggregating-values-of-all-numeric-columns\"&gt;&lt;a href=\"en/yql/recipes/codegen.html#aggregating-values-of-all-numeric-columns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Aggregating values of all numeric columns&lt;/span&gt;&lt;/a&gt;Aggregating values of all numeric columns&lt;/h3&gt;\n&lt;p&gt;Select all the numeric columns in a table, apply several aggregate functions to them, and write the values to output columns, adding the name of the aggregate function to the output column names.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE &amp;lt;cluster-name&amp;gt;;\n\n-- Remove the top-level Optional from the data type\n$removeOptional = ($type) -&amp;gt; {\n    RETURN IF(TypeKind($type) == \"Optional\", OptionalItemType($type), $type);\n};\n\n-- Filter only numeric columns and put them in the nums struct\n$filterOnlyNumericColumns = ($strValue) -&amp;gt; {\n    $code = EvaluateCode(LambdaCode(($str) -&amp;gt; {\n        $members = StructTypeComponents(TypeHandle(TypeOf($strValue)));\n        $filteredMembers = ListFilter($members, ($x) -&amp;gt; {\n            $type = $x.Type;\n            $cleanType = $removeOptional($type);\n            RETURN TypeKind($cleanType) == \"Data\" AND\n                DataTypeComponents($cleanType)[0] REGEXP \"Int[0-9]+|Uint[0-9]+|Float|Double\"\n        });\n\n        $list = ListMap($filteredMembers, ($x) -&amp;gt; {\n            RETURN ListCode(AtomCode($x.Name), FuncCode(\"Member\", $str, AtomCode($x.Name)));\n        });\n\n        RETURN FuncCode(\"AsStruct\",$list);\n    }));\n\n    RETURN $code($strValue);\n};\n\n$nums = (SELECT $filterOnlyNumericColumns(TableRow()) as nums FROM `home/yql/tutorial/users`);\n\nSELECT * FROM $nums;\n\n-- Apply the set aggregate function to the entire nums struct at once.\n-- Aggregation results are nested structures for the columns count/min/...\n$agg = (SELECT\n    MULTI_AGGREGATE_BY(nums, AggregationFactory(\"count\")) as count,\n    MULTI_AGGREGATE_BY(nums, AggregationFactory(\"min\")) as min,\n    MULTI_AGGREGATE_BY(nums, AggregationFactory(\"max\")) as max,\n    MULTI_AGGREGATE_BY(nums, AggregationFactory(\"avg\")) as avg,\n    MULTI_AGGREGATE_BY(nums, AggregationFactory(\"percentile\", 0.9)) as p90\nFROM $nums);\n\nSELECT * FROM $agg;\n\n-- Expand the structures so that the columns have the format originalcolumn_aggrfunc.\n-- You can't manage with FLATTEN COLUMNS here only, because there are conflicts: in count/min, etc.\n-- the nested fields are identical.\n\n$rotateStruct = ($value) -&amp;gt; {\n    $code = EvaluateCode(LambdaCode(($strValue) -&amp;gt; {\n        -- Retrieve the top-level structure columns\n        $topMembers = StructTypeComponents(TypeHandle(TypeOf($value)));\n        $list = ListFlatMap($topMembers, ($x) -&amp;gt; {\n            $topMember = FuncCode(\"Member\", $strValue, AtomCode($x.Name));\n            -- Traverse fields in the structures\n            $nestedMembers = StructTypeComponents($removeOptional($x.Type));\n            RETURN ListMap($nestedMembers, ($y) -&amp;gt; {\n                RETURN ListCode(AtomCode($y.Name || \"_\" || $x.Name),\n                    FuncCode(\"Member\", $topMember, AtomCode($y.Name)));\n            })\n        });\n\n        RETURN FuncCode(\"AsStruct\", $list);\n    }));\n\n    RETURN $code($value);\n};\n\n$rotate = (SELECT $rotateStruct(TableRow()) FROM $agg);\n\nSELECT * FROM $rotate;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"160\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-160\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-160\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-160.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Links to documentation:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/codegen.html#evaluatecode\"&gt;EvaluateCode&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/list.html#listfilter\"&gt;ListFilter&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/list.html#listmap\"&gt;ListMap&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/expressions.html#lambda\"&gt;Lambda functions&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/aggregation.html#multiaggregateby\"&gt;MULTI_AGGREGATE_BY&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/basic.html#aggregationfactory\"&gt;AggregationFactory&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"transposing-a-table-pivot\"&gt;&lt;a href=\"en/yql/recipes/codegen.html#transposing-a-table-pivot\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Transposing a table (PIVOT)&lt;/span&gt;&lt;/a&gt;Transposing a table (PIVOT)&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;-- Sample data\n$input = AsList(\n    AsStruct(\"2012\" as year, 1 as key, 3.0 as value),\n    AsStruct(\"2013\" as year, 1 as key, 4.0 as value),\n    AsStruct(\"2013\" as year, 2 as key, 5.0 as value),\n    AsStruct(\"2014\" as year, 1 as key, 6.0 as value),\n    AsStruct(\"2014\" as year, 1 as key, 7.0 as value)\n);\n\n$makePivot = ($nameColumn, $valueColumn, $nameList) -&amp;gt; {\n    RETURN EvaluateCode(LambdaCode(($row) -&amp;gt; {\n        $name = FuncCode(\"Member\", $row, AtomCode($nameColumn));\n        $value = FuncCode(\"Member\", $row, AtomCode($valueColumn));\n        $row = FuncCode(\"RemoveMember\", $row, AtomCode($nameColumn));\n        $row = FuncCode(\"RemoveMember\", $row, AtomCode($valueColumn));\n\n        $ensureOptional = ($x) -&amp;gt; {\n            RETURN YQL::MatchType($x, AsAtom(\"Optional\"), () -&amp;gt; { RETURN $x }, () -&amp;gt; { RETURN Just($x) });\n        };\n\n        $structItems = ListMap($nameList, ($item) -&amp;gt; {\n            $adjustedValue = FuncCode(\"Apply\", QuoteCode($ensureOptional), $value);\n            $ifValue = FuncCode(\"FlatOptionalIf\",\n                FuncCode(\"Coalesce\", FuncCode(\"==\", $name, ReprCode($item)), ReprCode(false)),\n                $adjustedValue);\n            RETURN ListCode(AtomCode($item), $ifValue);\n        });\n\n        $struct = FuncCode(\"AsStruct\", $structItems);\n        RETURN FuncCode(\"AddMember\", $row, AtomCode($valueColumn), $struct);\n    }));\n};\n\n-- Build a PIVOT operation:\n-- 1. The `value` field is populated with the structure where you created the columns from the last list.\n-- 2. Depending on `year` field value, a certain field in the output `value` structure is populated.\n-- 3. After that, the `year` field is deleted\n\n$pivot = $makePivot(\"year\", \"value\", AsList(\"2012\", \"2013\", \"2014\"));\n\n-- Source data\nSELECT * FROM AS_TABLE($input);\n\n$x = (SELECT * FROM (\n    SELECT $pivot(TableRow()) FROM AS_TABLE($input)\n) FLATTEN COLUMNS);\n\n-- Result\nSELECT * FROM (\n    SELECT\n        AsStruct(key as key),\n        MULTI_AGGREGATE_BY(value, AggregationFactory(\"sum\"))\n    FROM $x GROUP BY key\n) FLATTEN COLUMNS;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"199\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-199\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-199\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-199.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Links to documentation:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/codegen.html#evaluatecode\"&gt;EvaluateCode&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/list.html#listmap\"&gt;ListMap&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/expressions.html#lambda\"&gt;Lambda functions&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/aggregation.html#multiaggregateby\"&gt;MULTI_AGGREGATE_BY&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/basic.html#aggregationfactory\"&gt;AggregationFactory&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"merging-subquery-templates\"&gt;&lt;a href=\"en/yql/recipes/codegen.html#merging-subquery-templates\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Merging subquery templates&lt;/span&gt;&lt;/a&gt;Merging subquery templates&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$combineQueries = ($query, $list) -&amp;gt; {\n    RETURN EvaluateCode(LambdaCode(($world) -&amp;gt; {\n        -- An implicit parameter in the subquery template is the world argument used to pass\n        -- dependencies, for example, visible PRAGMA or COMMIT operations at the subquery template point of use.\n        $queries = ListMap($list, ($arg) -&amp;gt; {\n                -- Pass world further, as the first argument of the subquery template\n                RETURN FuncCode(\"Apply\", QuoteCode($query), $world, ReprCode($arg))\n            });\n\n        -- Merge all the results into a common list (this requires that types are the same).\n        -- For weaker merging, you can use the UnionAll function.\n        RETURN FuncCode(\"Extend\", $queries);\n    }));\n};\n\nDEFINE SUBQUERY $sub($n) AS\n   SELECT $n;\nEND DEFINE;\n\n-- Build a query template on merging\n-- the results of applying the $sub subquery template for each value between 0 and 9.\n$fullQuery = $combineQueries($sub, ListFromRange(0, 10));\nSELECT * FROM $fullQuery();\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"233\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-233\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-233\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-233.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Links to documentation:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/codegen.html#evaluatecode\"&gt;EvaluateCode&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/list.html#listmap\"&gt;ListMap&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/expressions.html#lambda\"&gt;Lambda functions&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/subquery.html\"&gt;Subquery templates&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"building-a-subquery-template-with-sorting-by-a-list-of-column\"&gt;&lt;a href=\"en/yql/recipes/codegen.html#building-a-subquery-template-with-sorting-by-a-list-of-column\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Building a subquery template with sorting by a list of column&lt;/span&gt;&lt;/a&gt;Building a subquery template with sorting by a list of column&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE &amp;lt;cluster-name&amp;gt;;\n\n$sorted = ($world, $input, $orderByColumns, $asc) -&amp;gt; {\n    $n = ListLength($orderByColumns);\n\n    $keySelector = LambdaCode(($row) -&amp;gt; {\n        $items = ListMap($orderByColumns,\n            ($x) -&amp;gt; {\n                RETURN FuncCode(\"Member\", $row, AtomCode($x));\n            });\n        RETURN ListCode($items);\n    });\n\n    $sort = EvaluateCode(LambdaCode(($x) -&amp;gt; {\n        return FuncCode(\"Sort\",\n            $x,\n            ListCode(ListReplicate(ReprCode($asc), $n)),\n            $keySelector)\n    }));\n\n    RETURN $sort($input($world));\n};\n\nDEFINE SUBQUERY $source() AS\n    PROCESS `home/yql/tutorial/users`;\nEND DEFINE;\n\nPROCESS $sorted($source, AsList(\"name\",\"age\"), true);\nPROCESS $sorted($source, AsList(\"name\"), true);\nPROCESS $sorted($source, ListCreate(TypeOf(\"\")), true);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"262\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-262\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-262\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-262.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Links to documentation:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/codegen.html#evaluatecode\"&gt;EvaluateCode&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/list.html#listmap\"&gt;ListMap&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/expressions.html#lambda\"&gt;Lambda functions&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/subquery.html\"&gt;Subquery templates&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/recipes/codegen.md","sourcePath":"en/yql/recipes/codegen.md"},"headings":[{"title":"Introduction","href":"en/yql/recipes/codegen.html#introduction","level":2},{"title":"Use cases","href":"en/yql/recipes/codegen.html#use-cases","level":2,"items":[{"title":"Declaring a UDF type by computations","href":"en/yql/recipes/codegen.html#declaring-a-udf-type-by-computations","level":3},{"title":"Filtering columns by a list of names","href":"en/yql/recipes/codegen.html#filtering-columns-by-a-list-of-names","level":3},{"title":"Searching in all string columns","href":"en/yql/recipes/codegen.html#searching-in-all-string-columns","level":3},{"title":"Merging structures left-to-right","href":"en/yql/recipes/codegen.html#merging-structures-left-to-right","level":3},{"title":"Reading a column by the name written to another column","href":"en/yql/recipes/codegen.html#reading-a-column-by-the-name-written-to-another-column","level":3},{"title":"Calculate a sum across tuple items","href":"en/yql/recipes/codegen.html#calculate-a-sum-across-tuple-items","level":3},{"title":"Aggregating values of all numeric columns","href":"en/yql/recipes/codegen.html#aggregating-values-of-all-numeric-columns","level":3},{"title":"Transposing a table (PIVOT)","href":"en/yql/recipes/codegen.html#transposing-a-table-pivot","level":3},{"title":"Merging subquery templates","href":"en/yql/recipes/codegen.html#merging-subquery-templates","level":3},{"title":"Building a subquery template with sorting by a list of column","href":"en/yql/recipes/codegen.html#building-a-subquery-template-with-sorting-by-a-list-of-column","level":3}]}],"title":"Recipes for code generation"},"router":{"pathname":"en/yql/recipes/codegen","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName"
