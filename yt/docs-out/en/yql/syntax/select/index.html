        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h1&gt;SELECT&lt;/h1&gt;\n&lt;p&gt;Returns the result of evaluating the expressions specified after &lt;code&gt;SELECT&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;It can be used in combination with other operations to obtain other effect.&lt;/p&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"en/yql/syntax/select/index.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT \"Hello, world!\";\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"13\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-13\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-13\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-13.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT 2 + 2;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"14\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-14\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-14\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-14.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"selectexec\"&gt;&lt;a href=\"en/yql/syntax/select/index.html#selectexec\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SELECT execution procedure&lt;/span&gt;&lt;/a&gt;SELECT execution procedure&lt;/h2&gt;\n&lt;p&gt;The &lt;code&gt;SELECT&lt;/code&gt; query result is calculated as follows:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Determine the set of input tables by evaluating the &lt;a href=\"en/yql/syntax/select/from.html\"&gt;FROM&lt;/a&gt; clauses.&lt;/li&gt;\n&lt;li&gt;Apply &lt;a href=\"en/yql/syntax/select/sample.html\"&gt;SAMPLE&lt;/a&gt;/&lt;a href=\"en/yql/syntax/select/sample.html\"&gt;TABLESAMPLE&lt;/a&gt; to input tables.&lt;/li&gt;\n&lt;li&gt;Execute &lt;a href=\"en/yql/syntax/flatten.html#flatten-columns\"&gt;FLATTEN COLUMNS&lt;/a&gt; or &lt;a href=\"en/yql/syntax/flatten.html\"&gt;FLATTEN BY&lt;/a&gt;; aliases set in &lt;code&gt;FLATTEN BY&lt;/code&gt; become visible after this point.&lt;/li&gt;\n&lt;li&gt;Execute every &lt;a href=\"en/yql/syntax/join.html\"&gt;JOIN&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Add to (or replace in) the data the columns listed in &lt;a href=\"en/yql/syntax/group_by.html\"&gt;GROUP BY ... AS ...&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Execute &lt;a href=\"en/yql/syntax/select/where.html\"&gt;WHERE&lt;/a&gt; - discard all the data mismatching the predicate.&lt;/li&gt;\n&lt;li&gt;Execute &lt;a href=\"en/yql/syntax/group_by.html\"&gt;GROUP BY&lt;/a&gt;, evaluate aggregate functions.&lt;/li&gt;\n&lt;li&gt;Apply the filter &lt;a href=\"en/yql/syntax/group_by.html#having\"&gt;HAVING&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Evaluate &lt;a href=\"en/yql/syntax/window.html\"&gt;window functions&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;Evaluate expressions in &lt;code&gt;SELECT&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Assign names set by aliases to expressions in &lt;code&gt;SELECT&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Apply top-level &lt;a href=\"en/yql/syntax/select/distinct.html\"&gt;DISTINCT&lt;/a&gt; to the resulting columns.&lt;/li&gt;\n&lt;li&gt;Execute similarly every subquery inside &lt;a href=\"en/yql/syntax/select/union.html#union-all\"&gt;UNION ALL&lt;/a&gt;, combine them.&lt;/li&gt;\n&lt;li&gt;Perform sorting with &lt;a href=\"en/yql/syntax/select/order_by.html\"&gt;ORDER BY&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Apply &lt;a href=\"en/yql/syntax/select/limit_offset.html\"&gt;OFFSET and LIMIT&lt;/a&gt; to the result.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"orderedcolumns\"&gt;&lt;a href=\"en/yql/syntax/select/index.html#orderedcolumns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Column order in YQL&lt;/span&gt;&lt;/a&gt;Column order in YQL&lt;/h2&gt;\n&lt;p&gt;The standard SQL is sensitive to the order of columns in projections (that is, in &lt;code&gt;SELECT&lt;/code&gt;). While the order of columns must be preserved in the query results or when writing data to a new table, some SQL constructs use this order.&lt;br /&gt;\nThis applies, for example, to &lt;a href=\"en/yql/syntax/select/union.html#union-all\"&gt;UNION ALL&lt;/a&gt; and positional &lt;a href=\"en/yql/syntax/select/order_by.html\"&gt;ORDER BY&lt;/a&gt; (ORDER BY ordinal).&lt;/p&gt;\n&lt;p&gt;The column order is ignored in YQL by default:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The order of columns in the output tables and query results is undefined&lt;/li&gt;\n&lt;li&gt;The data scheme of the &lt;code&gt;UNION ALL&lt;/code&gt; result is output by column names rather than positions&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If you enable &lt;code&gt;PRAGMA OrderedColumns;&lt;/code&gt;, the order of columns is preserved in the query results and is derived from the order of columns in the input tables using the following rules:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;SELECT&lt;/code&gt;: an explicit column enumeration dictates the result order.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;SELECT&lt;/code&gt; with an asterisk (&lt;code&gt;SELECT * FROM ...&lt;/code&gt;) inherits the order from its input.&lt;/li&gt;\n&lt;li&gt;The order of columns after &lt;a href=\"en/yql/syntax/join.html\"&gt;JOIN&lt;/a&gt;: First output the left-hand columns, then the right-hand ones. If the column order in any of the sides in the &lt;code&gt;JOIN&lt;/code&gt; output is undefined, the column order in the result is also undefined.&lt;/li&gt;\n&lt;li&gt;The order in &lt;code&gt;UNION ALL&lt;/code&gt; depends on the &lt;a href=\"en/yql/syntax/select/union.html#union-all\"&gt;UNION ALL&lt;/a&gt; execution mode.&lt;/li&gt;\n&lt;li&gt;The column order for &lt;a href=\"en/yql/syntax/select/from_as_table.html\"&gt;AS_TABLE&lt;/a&gt; is undefined.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"combining-queries\"&gt;&lt;a href=\"en/yql/syntax/select/index.html#combining-queries\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Combining queries&lt;/span&gt;&lt;/a&gt;Combining queries&lt;/h3&gt;\n&lt;p&gt;Results of several SELECT statements (or subqueries) can be combined using &lt;code&gt;UNION&lt;/code&gt; and &lt;code&gt;UNION ALL&lt;/code&gt; keywords.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;query1 UNION [ALL] query2 (UNION [ALL] query3 ...)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"155\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-155\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-155\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-155.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Union of more than two queries is interpreted as a left-associative operation, that is&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;query1 UNION query2 UNION ALL query3\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"159\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-159\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-159\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-159.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;is interpreted as&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;(query1 UNION query2) UNION ALL query3\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"163\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-163\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-163\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-163.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If the underlying queries have one of the &lt;code&gt;ORDER BY/LIMIT/DISCARD/INTO RESULT&lt;/code&gt; operators, the following rules apply:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;ORDER BY/LIMIT/INTO RESULT&lt;/code&gt; is only allowed after the last query&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DISCARD&lt;/code&gt; is only allowed before the first query&lt;/li&gt;\n&lt;li&gt;the operators apply to the &lt;code&gt;UNION [ALL]&lt;/code&gt; as a whole, instead of referring to one of the queries&lt;/li&gt;\n&lt;li&gt;to apply the operator to one of the queries, enclose the query in parantheses&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"clauses-supported-in-select\"&gt;&lt;a href=\"en/yql/syntax/select/index.html#clauses-supported-in-select\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Clauses supported in SELECT&lt;/span&gt;&lt;/a&gt;Clauses supported in SELECT&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/select/from.html\"&gt;FROM&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/select/from_as_table.html\"&gt;FROM AS_TABLE&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/select/from_select.html\"&gt;FROM SELECT&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/select/distinct.html\"&gt;DISTINCT&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/select/unique_distinct_hints.html\"&gt;UNIQUE DISTINCT&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/select/union.html\"&gt;UNION&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/select/with.html\"&gt;WITH&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/select/without.html\"&gt;WITHOUT&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/select/where.html\"&gt;WHERE&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/select/order_by.html\"&gt;ORDER BY&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/select/assume_order_by.html\"&gt;ASSUME ORDER BY&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/select/limit_offset.html\"&gt;LIMIT OFFSET&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/select/sample.html\"&gt;SAMPLE&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/select/sample.html\"&gt;TABLESAMPLE&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/select/folder.html\"&gt;FOLDER&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/select/walk_folders.html\"&gt;WalkFolders&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/select/view.html\"&gt;VIEW&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/select/temporary_table.html\"&gt;TEMPORARY TABLE&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/select/concat.html\"&gt;CONCAT&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/syntax/select/index.md","sourcePath":"en/yql/syntax/select/index.md"},"headings":[{"title":"Examples","href":"en/yql/syntax/select/index.html#examples","level":2},{"title":"SELECT execution procedure","href":"en/yql/syntax/select/index.html#selectexec","level":2},{"title":"Column order in YQL","href":"en/yql/syntax/select/index.html#orderedcolumns","level":2,"items":[{"title":"Combining queries","href":"en/yql/syntax/select/index.html#combining-queries","level":3}]},{"title":"Clauses supported in SELECT","href":"en/yql/syntax/select/index.html#clauses-supported-in-select","level":2}],"title":""},"router":{"pathname":"en/yql/syntax/select/index","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
