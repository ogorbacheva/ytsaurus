            {"data":{"leading":false,"html":"&lt;p&gt;Checking that the &lt;code&gt;SELECT&lt;/code&gt; result is sorted by the value in the specified column or multiple columns. The result of such a &lt;code&gt;SELECT&lt;/code&gt; statement is treated as sorted, but without actually running a sort. Sort check is performed at the query execution stage.&lt;/p&gt;\n&lt;p&gt;As in case of &lt;code&gt;ORDER BY&lt;/code&gt;, it supports setting the sort order using the keywords &lt;code&gt;ASC&lt;/code&gt; (ascending order) and &lt;code&gt;DESC&lt;/code&gt; (descending order). Expressions are not supported in &lt;code&gt;ASSUME ORDER BY&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"en/yql/syntax/select/assume_order_by.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT key || \"suffix\" as key, -CAST(subkey as Int32) as subkey\nFROM my_table\nASSUME ORDER BY key, subkey DESC;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"9\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-9\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-9\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-9.end+1\"
