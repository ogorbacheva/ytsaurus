        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"union\"&gt;&lt;a href=\"en/yql/syntax/select/union.html#union\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;UNION&lt;/span&gt;&lt;/a&gt;UNION&lt;/h2&gt;\n&lt;p&gt;Union of the results of the underlying queries, with duplicates removed.&lt;br /&gt;\nBehavior is identical to using &lt;code&gt;UNION ALL&lt;/code&gt; followed by &lt;code&gt;SELECT DISTINCT *&lt;/code&gt;.&lt;br /&gt;\nRefer to &lt;a href=\"en/yql/syntax/select/union.html#union-all\"&gt;UNION ALL&lt;/a&gt; for more details.&lt;/p&gt;\n&lt;h4 id=\"examples\"&gt;&lt;a href=\"en/yql/syntax/select/union.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT key FROM T1\nUNION\nSELECT key FROM T2 -- returns the set of distinct keys in the tables\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"9\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-9\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-9\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-9.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"union-all\"&gt;&lt;a href=\"en/yql/syntax/select/union.html#union-all\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;UNION ALL&lt;/span&gt;&lt;/a&gt;UNION ALL&lt;/h2&gt;\n&lt;p&gt;Concatenating results of multiple &lt;code&gt;SELECT&lt;/code&gt; statements (or subqueries).&lt;/p&gt;\n&lt;p&gt;Two &lt;code&gt;UNION ALL&lt;/code&gt; modes are supported: by column names (the default mode) and by column positions (corresponds to the ANSI SQL standard and is enabled by the &lt;a href=\"en/yql/syntax/pragma/global.html#positionalunionall\"&gt;PRAGMA&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;In the \"by name\" mode, the output of the resulting data schema uses the following rules:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The resulting table includes all columns that were found in at least one of the input tables.&lt;/li&gt;\n&lt;li&gt;If a column wasn't present in all the input tables, then it's automatically assigned the &lt;a href=\"en/yql/types/optional.html\"&gt;optional data type&lt;/a&gt; (that can accept &lt;code&gt;NULL&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;If a column in different input tables had different types, then the shared type (the broadest one) is output.&lt;/li&gt;\n&lt;li&gt;If a column in different input tables had a heterogeneous type, for example, string and numeric, an error is raised.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The order of output columns in this mode is equal to the largest common prefix of the order of inputs, followed by all other columns in the alphabetic order.&lt;br /&gt;\nIf the largest common prefix is empty (for example, if the order isn't specified for one of the inputs), then the output order is undefined.&lt;/p&gt;\n&lt;p&gt;In the \"by position\" mode, the output of the resulting data schema uses the following rules:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;All inputs must have equal number of columns&lt;/li&gt;\n&lt;li&gt;The order of columns must be defined for all inputs&lt;/li&gt;\n&lt;li&gt;The names of the resulting columns must match the names of columns in the first table&lt;/li&gt;\n&lt;li&gt;The type of the resulting columns is output as a common (widest) type of input column types having the same positions&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The order of the output columns in this mode is the same as the order of columns in the first input.&lt;/p&gt;\n&lt;h4 id=\"examples1\"&gt;&lt;a href=\"en/yql/syntax/select/union.html#examples1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT 1 AS x\nUNION ALL\nSELECT 2 AS y\nUNION ALL\nSELECT 3 AS z;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"78\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-78\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-78\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-78.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;In the default mode, this query returns a selection with three columns x, y, and z. When &lt;code&gt;PRAGMA PositionalUnionAll;&lt;/code&gt; is enabled, the selection only includes the x column.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;PRAGMA PositionalUnionAll;\n\nSELECT 1 AS x, 2 as y\nUNION ALL\nSELECT * FROM AS_TABLE([&amp;lt;|x:3, y:4|&amp;gt;]); -- error: the order of columns in AS_TABLE is undefined\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"82\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-82\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-82\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-82.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/syntax/select/union.md","sourcePath":"en/yql/syntax/select/union.md"},"headings":[{"title":"UNION","href":"en/yql/syntax/select/union.html#union","level":2},{"title":"UNION ALL","href":"en/yql/syntax/select/union.html#union-all","level":2}],"title":"Combining subquery results (UNION)"},"router":{"pathname":"en/yql/syntax/select/union","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search
