            {"data":{"leading":false,"html":"&lt;p&gt;An iterator for traversing the target cluster tree, with the ability to accumulate state, typically in the form of a list of paths to tables.&lt;br /&gt;\nCustom functions are called for the descendants of each node to accumulate state and select attributes and nodes for further traversal.&lt;/p&gt;\n&lt;p&gt;Specified as the &lt;code&gt;WalkFolders&lt;/code&gt; function in &lt;a href=\"en/yql/syntax/select/from.html\"&gt;FROM&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Returns a single &lt;code&gt;State&lt;/code&gt; column with the same type as &lt;code&gt;InitialState&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Required:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Path&lt;/strong&gt;: Path to the original directory.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Optional:&lt;/p&gt;\n&lt;ol start=\"2\" style=\"--hier-list-start:1\"&gt;\n&lt;li&gt;&lt;strong&gt;InitialState&lt;/strong&gt; (&lt;code&gt;Persistable&lt;/code&gt;). The state must be of any serializable type (for example, &lt;code&gt;Callable&lt;/code&gt; or &lt;code&gt;Resource&lt;/code&gt; can't be used). By default, &lt;code&gt;ListCreate(String)&lt;/code&gt; is used&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Optional named:&lt;/p&gt;\n&lt;ol start=\"3\" style=\"--hier-list-start:2\"&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;RootAttributes&lt;/strong&gt; (&lt;code&gt;String&lt;/code&gt;): Semicolon-separated string listing the desired meta attributes (for example, &lt;code&gt;\"schema;row_count\"&lt;/code&gt;). &lt;code&gt;\"\"&lt;/code&gt; by default.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;PreHandler&lt;/strong&gt;: Lambda function called for the list of descendants of the current directory after the List operation (before resolving the links). Accepts a list of nodes, the current state, and the current traversal depth, returning the next state.&lt;/p&gt;\n&lt;p&gt;Signature: &lt;code&gt;(List&amp;lt;Struct&amp;lt;'Path':String, 'Type':String, 'Attributes':Yson&amp;gt;&amp;gt;, TypeOf(InitialState), Int32) -&amp;gt; TypeOf(InitialState)&lt;/code&gt;&lt;br /&gt;\nTypeOf(InitialState) is the returned type of InitialState.&lt;/p&gt;\n&lt;p&gt;Default implementation: &lt;code&gt;($nodes, $state, $level) -&amp;gt; ($state)&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;ResolveHandler&lt;/strong&gt;: Lambda function called after &lt;code&gt;PreHandler&lt;/code&gt;. Accepts a list of descendant links of the current directory, the current state, a list of requested attributes for the ancestor directory, and the current traversal depth. Returns &lt;code&gt;Tuple&amp;lt;List&amp;lt;Tuple&amp;lt;String,String&amp;gt;&amp;gt;, TypeOf(InitialState)&amp;gt;&lt;/code&gt;, a tuple with a list of links to traverse with the requested meta attributes, along with the next state. If a link is broken, WalkFolders ignores it: you don't need to check for this in the handler&lt;/p&gt;\n&lt;p&gt;Signature: &lt;code&gt;(List&amp;lt;Struct&amp;lt;'Path':String, 'Type':String, 'Attributes':Yson&amp;gt;&amp;gt;, TypeOf(InitialState), List&amp;lt;String&amp;gt;, Int32) -&amp;gt; Tuple&amp;lt;List&amp;lt;Tuple&amp;lt;String,String&amp;gt;&amp;gt;, TypeOf(InitialState)&amp;gt;&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Default implementation:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;-- resolve each link, requesting the same attributes that we requested from their ancestor\n($nodes, $state, $rootAttrList, $level) -&amp;gt; {\n        $linksToVisit = ListMap($nodes, ($node) -&amp;gt; (($node.Path, $rootAttrList)));\n        return ($linksToVisit, $state);\n    }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"59\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-59\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-59\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-59.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;DiveHandler&lt;/strong&gt;: Lambda function called after &lt;code&gt;ResolveHandler&lt;/code&gt;. Accepts a list of descendant directories of the current directory, the current state, a list of requested attributes for the ancestor directory, and the current traversal depth. Returns &lt;code&gt;Tuple&amp;lt;List&amp;lt;Tuple&amp;lt;String,String&amp;gt;&amp;gt;, TypeOf(InitialState)&amp;gt;&lt;/code&gt;, a tuple with a list of directories to traverse with the requested meta attributes after processing the current directory, along with the next state. The returned paths are queued for traversal.&lt;/p&gt;\n&lt;p&gt;Signature: &lt;code&gt;(List&amp;lt;Struct&amp;lt;'Path':String, 'Type':String, 'Attributes':Yson&amp;gt;&amp;gt;, TypeOf(InitialState), List&amp;lt;String&amp;gt;, Int32) -&amp;gt; Tuple&amp;lt;List&amp;lt;Tuple&amp;lt;String,String&amp;gt;&amp;gt;, TypeOf(InitialState)&amp;gt;&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Default implementation:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;-- traverse each subdirectory, requesting the same attributes that we requested from their ancestor\n    ($nodes, $state, $rootAttrList, $level) -&amp;gt; {\n        $nodesToDive = ListMap($nodes, ($node) -&amp;gt; (($node.Path, $rootAttrList)));\n        return ($nodesToDive, $state);\n    }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"71\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-71\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-71\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-71.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;PostHandler&lt;/strong&gt;: Lambda function called after &lt;code&gt;DiveHandler&lt;/code&gt;. Accepts a list of descendants of the current directory after resolving the links, the current state, and the current traversal depth.&lt;/p&gt;\n&lt;p&gt;Signature: &lt;code&gt;(List&amp;lt;Struct&amp;lt;'Path':String, 'Type':String, 'Attributes':Yson&amp;gt;&amp;gt;, TypeOf(InitialState), Int32) -&amp;gt; TypeOf(InitialState)&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Default implementation: &lt;code&gt;($nodes, $state, $level) -&amp;gt; ($state)&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;WalkFolders can create a significant load on the master.&lt;/strong&gt; Exercise caution when using WalkFolders with attributes containing large values (&lt;code&gt;schema&lt;/code&gt; could be one of those) or when traversing a subtree with significant size or depth.&lt;/p&gt;\n&lt;p&gt;Directory listing requests within a single WalkFolders call can be executed in parallel. When requesting attributes with large values, &lt;strong&gt;reduce&lt;/strong&gt; the number of simultaneous requests by using the &lt;a href=\"en/yql/syntax/pragma/yt.html#ytbatchlistfolderconcurrency\"&gt;yt.BatchListFolderConcurrency&lt;/a&gt; pragma.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Handlers are executed via &lt;a href=\"en/yql/builtins/basic.html#evaluate_expr_atom\"&gt;EvaluateExpr&lt;/a&gt;. There is a limit on the number of YQL AST nodes. You can't use very large containers within State.&lt;/p&gt;\n&lt;p&gt;This restriction can be circumvented by running multiple WalkFolders calls and combining the results. Or you can serialize the new state into a string without intermediate deserialization (for example, using JSON/Yson lines).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Because of parallel directory listing calls, the traversal order of the nodes in the tree doesn't follow a depth-first search (DFS) pattern&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;InitialState is used to infer handler types. It must be specified explicitly: for example, as &lt;code&gt;ListCreate(String)&lt;/code&gt; rather than &lt;code&gt;[]&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Recommendations for use:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;We recommend using &lt;a href=\"en/yql/udf/list/yson.html\"&gt;Yson UDF&lt;/a&gt; to work with the Attributes column&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;The listing result for each directory is cached so you can quickly traverse the same subtree again in another WalkFolders call within the same request, if needed&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"en/yql/syntax/select/walk_folders.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h2&gt;\n&lt;p&gt;Recursively collect the paths of all tables starting from &lt;code&gt;initial_folder&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$postHandler = ($nodes, $state, $level) -&amp;gt; {\n    $tables = ListFilter($nodes, ($x)-&amp;gt;($x.Type = \"table\"));\n    return ListExtend($state, ListExtract($tables, \"Path\"));\n};\n\nSELECT State FROM WalkFolders(`initial_folder`, $postHandler AS PostHandler);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"141\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-141\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-141\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-141.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Recursively find the last table created in &lt;code&gt;initial_folder&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$extractTimestamp = ($node) -&amp;gt; {\n    $creation_time_str = Yson::LookupString($node.Attributes, \"creation_time\");\n    RETURN DateTime::MakeTimestamp(DateTime::ParseIso8601($creation_time_str));\n};\n$postHandler = ($nodes, $maxTimestamp, $_) -&amp;gt; {\n    $tables = ListFilter($nodes, ($node) -&amp;gt; ($node.Type == \"table\"));\n    RETURN ListFold(\n        $tables, $maxTimestamp,\n        ($table, $maxTimestamp) -&amp;gt; (max_of($extractTimestamp($table), $maxTimestamp))\n    );\n};\n$initialTimestamp = CAST(0ul AS Timestamp);\nSELECT\n    *\nFROM WalkFolders(`initial_folder`, $initialTimestamp, \"creation_time\" AS RootAttributes, $postHandler AS PostHandler);\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"145\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-145\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-145\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-145.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Recursively collect the paths of all tables two levels deep from &lt;code&gt;initial_folder&lt;/code&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$diveHandler = ($nodes, $state, $attrList, $level) -&amp;gt; {\n    $paths = ListExtract($nodes, \"Path\");\n    $pathsWithReqAttrs = ListMap($paths, ($x) -&amp;gt; (($x, $attrList)));\n\n    $nextToVisit = IF($level &amp;lt; 2, $pathsWithReqAttrs, []);\n    return ($nextToVisit, $state);\n};\n\n$postHandler = ($nodes, $state, $level) -&amp;gt; {\n    $tables = ListFilter($nodes, ($x)-&amp;gt;($x.Type = \"table\"));\n    return ListExtend($state, ListExtract($tables, \"Path\"));\n};\n\nSELECT State FROM WalkFolders(`initial_folder`,\n    $diveHandler AS DiveHandler, $postHandler AS PostHandler);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"149\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-149\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-149\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-149.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Collect the paths from all nodes within &lt;code&gt;initial_folder&lt;/code&gt; without traversing its subdirectories&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$diveHandler = ($_, $state, $_, $_) -&amp;gt; {\n    $nextToVisit = [];\n    RETURN ($nextToVisit, $state);\n};\n$postHandler = ($nodes, $state, $_) -&amp;gt; {\n    $tables = ListFilter($nodes, ($x) -&amp;gt; ($x.Type = \"table\"));\n    RETURN ListExtend($state, ListExtract($tables, \"Path\"));\n};\nSELECT\n    State\nFROM WalkFolders(`initial_folder`, $diveHandler AS DiveHandler, $postHandler AS PostHandler);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"153\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-153\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-153\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-153.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Recursively collect the paths of all broken links (links with non-existent destination paths) from &lt;code&gt;initial_folder&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$resolveHandler = ($list, $state, $attrList, $_) -&amp;gt; {\n    $broken_links = ListFilter($list, ($link) -&amp;gt; (Yson::LookupBool($link.Attributes, \"broken\")));\n    $broken_links_target_paths = ListNotNull(\n        ListMap(\n            $broken_links,\n            ($link) -&amp;gt; (Yson::LookupString($link.Attributes, \"target_path\"))\n        )\n    );\n    $nextState = ListExtend($state, $broken_links_target_paths);\n    -- WalkFolders ignores broken links during resolution\n    $paths = ListTake(ListExtract($list, \"Path\"), 1);\n    $pathsWithReqAttrs = ListMap($paths, ($x) -&amp;gt; (($x, $attrList)));\n    RETURN ($pathsWithReqAttrs, $nextState);\n};\n\nSELECT\n    State\nFROM WalkFolders(`initial_folder`, $resolveHandler AS ResolveHandler, \"target_path\" AS RootAttributes);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"157\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-157\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-157\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-157.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Recursively build a Yson that includes a &lt;code&gt;Type&lt;/code&gt;, a &lt;code&gt;Path&lt;/code&gt;, and an &lt;code&gt;Attributes&lt;/code&gt; map containing node attributes (&lt;code&gt;creation_time&lt;/code&gt; and a custom &lt;code&gt;foo&lt;/code&gt; attribute) for each node from &lt;code&gt;initial_folder&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;-- If you need to accumulate a very large state in a single request, you can store it as a string to circumvent the limit on the number of nodes during the Evaluate call.\n$saveNodesToYsonString = ($list, $stateStr, $_) -&amp;gt; {\n    RETURN $stateStr || ListFold($list, \"\", ($node, $str) -&amp;gt; ($str || ToBytes(Yson::SerializeText(Yson::From($node))) || \"\\n\"));\n};\n$serializedYsonNodes =\n    SELECT\n        State\n    FROM WalkFolders(\"//home/yql\", \"\", \"creation_time;foo\" AS RootAttributes, $saveNodesToYsonString AS PostHandler);\n\nSELECT\n    ListMap(String::SplitToList($serializedYsonNodes, \"\\n\", true AS SkipEmpty), ($str) -&amp;gt; (Yson::Parse($str)));\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"161\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-161\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-161\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-161.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Pagination of WalkFolders results. Skipping the first 200 paths, collect 100 paths from &lt;code&gt;initial_folder&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$skip = 200ul;\n$take = 100ul;\n\n$diveHandler = ($nodes, $state, $reqAttrs, $_) -&amp;gt; {\n    $paths = ListExtract($nodes, \"Path\");\n    $pathsWithReqAttrs = ListMap($paths, ($x) -&amp;gt; (($x, $reqAttrs)));\n\n    $_, $collectedPaths = $state;\n    -- complete the traversal if we've reached the required number of nodes\n    $nextToVisit =  IF(\n        ListLength($collectedPaths) &amp;gt; $take,\n        [],\n        $pathsWithReqAttrs\n    );\n    return ($nextToVisit, $state);\n};\n\n$postHandler = ($nodes, $state, $_) -&amp;gt; {\n    $visited, $collectedPaths = $state;\n    $paths = ListExtract($nodes, \"Path\");\n    $itemsToTake = IF(\n        $visited &amp;lt; $skip,\n        0,\n        $take - ListLength($collectedPaths)\n    );\n    $visited = $visited + ListLength($paths);\n\n    return ($visited, ListExtend($collectedPaths, ListTake($paths, $itemsToTake)));\n};\n$initialState = (0ul, ListCreate(String));\n\n$walkFoldersRes = SELECT * FROM WalkFolders(`initial_folder`, $initialState, $diveHandler AS DiveHandler, $postHandler AS PostHandler);\n\n$_, $paths = Unwrap($walkFoldersRes);\nSELECT $paths;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"165\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-165\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-165\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-165.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/syntax/select/walk_folders.md","sourcePath":"en/yql/syntax/select/walk_folders.md"},"headings":[
