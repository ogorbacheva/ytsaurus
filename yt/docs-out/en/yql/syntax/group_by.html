        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"group-by\"&gt;&lt;a href=\"en/yql/syntax/group_by.html#group-by\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GROUP BY&lt;/span&gt;&lt;/a&gt;GROUP BY&lt;/h2&gt;\n&lt;p&gt;Group the &lt;code&gt;SELECT&lt;/code&gt; results by the values of the specified columns or expressions. The aggregate functions (&lt;code&gt;COUNT&lt;/code&gt;, &lt;code&gt;MAX&lt;/code&gt;, &lt;code&gt;MIN&lt;/code&gt;, &lt;code&gt;SUM&lt;/code&gt;, &lt;code&gt;AVG&lt;/code&gt;) are often used together with &lt;code&gt;GROUP BY&lt;/code&gt; to perform calculations in each group.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Syntax&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt;                             &lt;span class=\"hljs-comment\"&gt;-- In SELECT, you can use:&lt;/span&gt;\n    column1,                       &lt;span class=\"hljs-comment\"&gt;-- key columns specified in GROUP BY&lt;/span&gt;\n    key_n,                         &lt;span class=\"hljs-comment\"&gt;-- named expressions specified in GROUP BY&lt;/span&gt;\n    column1 &lt;span class=\"hljs-operator\"&gt;+&lt;/span&gt; key_n,               &lt;span class=\"hljs-comment\"&gt;-- random non-aggregate derived functions&lt;/span&gt;\n    Aggr_Func1( column2 ),         &lt;span class=\"hljs-comment\"&gt;-- aggregate functions containing any columns in arguments,&lt;/span&gt;\n    Aggr_Func2( key_n &lt;span class=\"hljs-operator\"&gt;+&lt;/span&gt; column2 ), &lt;span class=\"hljs-comment\"&gt;--   including named expressions specified in GROUP BY&lt;/span&gt;\n    ...\n&lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;table&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;GROUP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt;\n    column1, column2, ...,\n    &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; key_n           &lt;span class=\"hljs-comment\"&gt;-- When grouping by expression, it can be assigned a name via AS,&lt;/span&gt;\n                              &lt;span class=\"hljs-comment\"&gt;-- that may be used in SELECT&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"10\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-10\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-10\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-10.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Querying the &lt;code&gt;SELECT * FROM table GROUP BY k1, k2, ...&lt;/code&gt; type returns all the columns listed in GROUP BY, which is equivalent to the &lt;code&gt;SELECT DISTINCT k1, k2, ... query FROM table&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;An asterisk can also be used as an argument for the &lt;code&gt;COUNT&lt;/code&gt; aggregate function. &lt;code&gt;COUNT(*)&lt;/code&gt; means \"the count of rows in the group\".&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Aggregate functions ignore &lt;code&gt;NULL&lt;/code&gt; in their arguments, except for &lt;code&gt;COUNT&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;YQL also supports factories of aggregate functions implemented using the &lt;code&gt;AGGREGATION_FACTORY&lt;/code&gt; and &lt;code&gt;AGGREGATE_BY&lt;/code&gt; functions.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Examples&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; key, &lt;span class=\"hljs-built_in\"&gt;COUNT&lt;/span&gt;(&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; my_table\n&lt;span class=\"hljs-keyword\"&gt;GROUP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; key;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"33\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-33\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-33\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-33.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; double_key, &lt;span class=\"hljs-built_in\"&gt;COUNT&lt;/span&gt;(&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; my_table\n&lt;span class=\"hljs-keyword\"&gt;GROUP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; key &lt;span class=\"hljs-operator\"&gt;+&lt;/span&gt; key &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; double_key;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"34\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-34\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-34\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-34.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt;\n   double_key,                           &lt;span class=\"hljs-comment\"&gt;-- OK: key column&lt;/span&gt;\n   &lt;span class=\"hljs-built_in\"&gt;COUNT&lt;/span&gt;(&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; group_size,               &lt;span class=\"hljs-comment\"&gt;-- OK: COUNT(*)&lt;/span&gt;\n   &lt;span class=\"hljs-built_in\"&gt;SUM&lt;/span&gt;(key &lt;span class=\"hljs-operator\"&gt;+&lt;/span&gt; subkey) &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; sum1,            &lt;span class=\"hljs-comment\"&gt;-- OK: aggregate function&lt;/span&gt;\n   &lt;span class=\"hljs-built_in\"&gt;CAST&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;SUM&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;+&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; String) &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; sum2,   &lt;span class=\"hljs-comment\"&gt;-- OK: aggregate function with constant argument&lt;/span&gt;\n   &lt;span class=\"hljs-built_in\"&gt;SUM&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;SUM&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;) &lt;span class=\"hljs-operator\"&gt;+&lt;/span&gt; key) &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; sum3,            &lt;span class=\"hljs-comment\"&gt;-- ERROR: nested aggregations are not allowed&lt;/span&gt;\n   key &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; k1,                            &lt;span class=\"hljs-comment\"&gt;-- ERROR: use of non-key Key column without aggregation&lt;/span&gt;\n   key &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; dk1,                       &lt;span class=\"hljs-comment\"&gt;-- ERROR in YQL: use of non-key Key column without aggregation&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; my_table\n&lt;span class=\"hljs-keyword\"&gt;GROUP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt;\n  key &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; double_key,\n  subkey &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; sk,\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"35\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-35\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-35\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-35.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Specifying a name for a column or expression in &lt;code&gt;GROUP BY .. AS foo&lt;/code&gt; it is an extension on top of YQL. This name becomes visible in &lt;code&gt;WHERE&lt;/code&gt; despite the fact that filtration by &lt;code&gt;WHERE&lt;/code&gt; is performed&lt;a href=\"en/yql/syntax/select/index.html#selectexec\"&gt;before&lt;/a&gt; grouping. For example, if the &lt;code&gt;T&lt;/code&gt; table includes two columns, &lt;code&gt;foo&lt;/code&gt; and &lt;code&gt;bar&lt;/code&gt;, then the query &lt;code&gt;SELECT&lt;/code&gt; foo FROM T WHERE foo &amp;gt; 0 GROUP BY bar AS foo would actually filter data by the &lt;code&gt;bar&lt;/code&gt; column from the source table.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"session-window\"&gt;&lt;a href=\"en/yql/syntax/group_by.html#session-window\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GROUP BY ... SessionWindow()&lt;/span&gt;&lt;/a&gt;GROUP BY ... SessionWindow()&lt;/h2&gt;\n&lt;p&gt;YQL supports grouping by session. To standard expressions in &lt;code&gt;GROUP BY&lt;/code&gt;, you can add a special &lt;code&gt;SessionWindow&lt;/code&gt; function:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt;\n  &lt;span class=\"hljs-keyword\"&gt;user&lt;/span&gt;,\n  session_start,\n  SessionStart() &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; same_session_start, &lt;span class=\"hljs-comment\"&gt;-- the same as session_start&lt;/span&gt;\n  &lt;span class=\"hljs-built_in\"&gt;COUNT&lt;/span&gt;(&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; session_size,\n  &lt;span class=\"hljs-built_in\"&gt;SUM&lt;/span&gt;(&lt;span class=\"hljs-keyword\"&gt;value&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; sum_over_session,\n&lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; my_table\n&lt;span class=\"hljs-keyword\"&gt;GROUP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;user&lt;/span&gt;, SessionWindow(&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;time_expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;, &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;timeout_expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; session_start\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"52\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-52\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-52\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-52.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The following happens in this case:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The input table is partitioned by the grouping keys specified in &lt;code&gt;GROUP BY&lt;/code&gt;, ignoring SessionWindow (in this case, it's based on &lt;code&gt;user&lt;/code&gt;).&lt;br /&gt;\nIf &lt;code&gt;GROUP BY&lt;/code&gt; includes nothing more than SessionWindow, then the input table gets into one partition&lt;/li&gt;\n&lt;li&gt;Each partition is split into disjoint subsets of rows (sessions).&lt;br /&gt;\nFor this, the partition is sorted in the ascending order of the &lt;code&gt;time_expr&lt;/code&gt; expression.&lt;br /&gt;\nThe session limits are drawn between neighboring items of the partition, that differ in their &lt;code&gt;time_expr&lt;/code&gt; values by more than &lt;code&gt;timeout_expr&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;The sessions obtained in this way are the final partitions on which aggregate functions are calculated.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;The SessionWindow() key column (in the example, it's &lt;code&gt;session_start&lt;/code&gt;) has the value \"the minimum &lt;code&gt;time_expr&lt;/code&gt; in the session\".&lt;br /&gt;\nAlso, if SessionWindow() is present in &lt;code&gt;GROUP BY&lt;/code&gt;, you can use the special&lt;br /&gt;\n&lt;code&gt;SessionStart&lt;/code&gt; aggregate function.&lt;/p&gt;\n&lt;p&gt;An extended version of SessionWindow with four arguments is also supported:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;SessionWindow(&amp;lt;order_expr&amp;gt;, &amp;lt;init_lambda&amp;gt;, &amp;lt;update_lambda&amp;gt;, &amp;lt;calculate_lambda&amp;gt;)&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Where:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;order_expr&amp;gt;&lt;/code&gt; is an expression based on which the original partition is sorted&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;init_lambda&amp;gt;&lt;/code&gt; is a lambda function for initializing the session calculation status. It has the signature &lt;code&gt;(TableRow())-&amp;gt;State&lt;/code&gt;. It's called once for the first (following the sorting order) element of the source partition&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;update_lambda&amp;gt;&lt;/code&gt; is a lambda function for refreshing the session calculation state and defining session limits. It has the signature &lt;code&gt;(TableRow(), State)-&amp;gt;Tuple&amp;lt;Bool, State&amp;gt;&lt;/code&gt;. It's called for every item of the source partition, except the first one. The new value of state is calculated based on the current row of the table and the previous state. If the first item in the return tuple is &lt;code&gt;True&lt;/code&gt;, then a new session starts from the &lt;em&gt;current&lt;/em&gt; row. The new session key is obtained by applying &lt;code&gt;&amp;lt;calculate_lambda&amp;gt;&lt;/code&gt; to the second tuple element.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;calculate_lambda&amp;gt;&lt;/code&gt;: A lambda function for calculating the session key (the \"value\" of SessionWindow() that is also accessible via SessionStart()). The function has the signature &lt;code&gt;(TableRow(), State)-&amp;gt;SessionKey&lt;/code&gt;. It's called in the first partition element (after &lt;code&gt;&amp;lt;init_lambda&amp;gt;&lt;/code&gt;) and on those elements for which &lt;code&gt;&amp;lt;update_lambda&amp;gt;&lt;/code&gt; returned&lt;code&gt;True&lt;/code&gt; as the first tuple element. It's worth noting that to start a new session, &lt;code&gt;&amp;lt;calculate_lambda&amp;gt;&lt;/code&gt; must return a value that is different from the previous session key. Sessions having the same keys are not merged. For example, if &lt;code&gt;&amp;lt;calculate_lambda&amp;gt;&lt;/code&gt; sequentially returns &lt;code&gt;0, 1, 0, 1&lt;/code&gt;, they will be four different sessions.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Using the extended version of SessionWindow, you can, for example, do the following: divide a partition into sessions, as in the SessionWindow use case with two arguments, but with the maximum session length limited by a certain constant:&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Example&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;$max_len &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1000&lt;/span&gt;; &lt;span class=\"hljs-comment\"&gt;-- maximum session length&lt;/span&gt;\n$timeout &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;100&lt;/span&gt;; &lt;span class=\"hljs-comment\"&gt;-- timeout (timeout_expr in a simplified variant of SessionWindow)&lt;/span&gt;\n\n$init &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; ($&lt;span class=\"hljs-type\"&gt;row&lt;/span&gt;) &lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; (AsTuple($row.ts, $row.ts)); &lt;span class=\"hljs-comment\"&gt;-- session state - tuple of 1) values of temporary ts column in the first session row and 2) in the current row&lt;/span&gt;\n$&lt;span class=\"hljs-keyword\"&gt;update&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; ($&lt;span class=\"hljs-type\"&gt;row&lt;/span&gt;, $state) &lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; {\n  $is_end_session &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; $row.ts &lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt; $state&lt;span class=\"hljs-number\"&gt;.0&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; $max_len &lt;span class=\"hljs-keyword\"&gt;OR&lt;/span&gt; $row.ts &lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt; $state&lt;span class=\"hljs-number\"&gt;.1&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; $timeout;\n  $new_state &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; AsTuple(IF($is_end_session, $row.ts, $state&lt;span class=\"hljs-number\"&gt;.0&lt;/span&gt;), $row.ts);\n  &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; AsTuple($is_end_session, $new_state);\n};\n$calculate &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; ($&lt;span class=\"hljs-type\"&gt;row&lt;/span&gt;, $state) &lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; ($row.ts);\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt;\n  &lt;span class=\"hljs-keyword\"&gt;user&lt;/span&gt;,\n  session_start,\n  SessionStart() &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; same_session_start, &lt;span class=\"hljs-comment\"&gt;-- the same as session_start&lt;/span&gt;\n  &lt;span class=\"hljs-built_in\"&gt;COUNT&lt;/span&gt;(&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; session_size,\n  &lt;span class=\"hljs-built_in\"&gt;SUM&lt;/span&gt;(&lt;span class=\"hljs-keyword\"&gt;value&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; sum_over_session,\n&lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; my_table\n&lt;span class=\"hljs-keyword\"&gt;GROUP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;user&lt;/span&gt;, SessionWindow(ts, $init, $&lt;span class=\"hljs-keyword\"&gt;update&lt;/span&gt;, $calculate) &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; session_start\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"113\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-113\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-113\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-113.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You can use SessionWindow in GROUP BY only once.&lt;/p&gt;\n&lt;h2 id=\"rollup\"&gt;&lt;a href=\"en/yql/syntax/group_by.html#rollup\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ROLLUP, CUBE, and GROUPING SETS&lt;/span&gt;&lt;/a&gt;ROLLUP, CUBE, and GROUPING SETS&lt;/h2&gt;\n&lt;p&gt;The results of calculating the aggregate function as subtotals for the groups and overall totals over individual columns or whole table.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Syntax&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt;\n    c1, c2,                          &lt;span class=\"hljs-comment\"&gt;-- columns based on which grouping is performed&lt;/span&gt;\n\nAGGREGATE_FUNCTION(c3) &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; outcome_c  &lt;span class=\"hljs-comment\"&gt;-- (SUM, AVG, MIN, MAX, COUNT) aggregate function&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; table_name\n\n&lt;span class=\"hljs-keyword\"&gt;GROUP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt;\n    GROUP_BY_EXTENSION(c1, c2)       &lt;span class=\"hljs-comment\"&gt;-- GROUP BY: ROLLUP, CUBE, or GROUPING SETS extension&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"126\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-126\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-126\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-126.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;ROLLUP&lt;/code&gt; groups the column values in the order they are listed in the arguments (strictly from left to right), generates subtotals for each group and the overall total.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;CUBE&lt;/code&gt; groups the values for every possible combination of columns, generates the subtotals for each group and the overall total.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;GROUPING SETS&lt;/code&gt; sets the groups for subtotals.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;You can combine &lt;code&gt;ROLLUP&lt;/code&gt;, &lt;code&gt;CUBE&lt;/code&gt; and &lt;code&gt;GROUPING SETS&lt;/code&gt;, separating them by commas.&lt;/p&gt;\n&lt;h3 id=\"grouping\"&gt;&lt;a href=\"en/yql/syntax/group_by.html#grouping\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GROUPING&lt;/span&gt;&lt;/a&gt;GROUPING&lt;/h3&gt;\n&lt;p&gt;The values of columns not used in calculations are replaced with &lt;code&gt;NULL&lt;/code&gt; in the subtotal. In the overall total, the values of all columns are replaced by &lt;code&gt;NULL&lt;/code&gt;. &lt;code&gt;GROUPING&lt;/code&gt;: A function that allows you to distinguish the source &lt;code&gt;NULL&lt;/code&gt; values from the &lt;code&gt;NULL&lt;/code&gt; values added while calculating subtotals and overall totals.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;GROUPING&lt;/code&gt; returns a bit mask:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;0&lt;/code&gt;: If &lt;code&gt;NULL&lt;/code&gt; is used for the original empty value.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;1&lt;/code&gt;: If &lt;code&gt;NULL&lt;/code&gt; is added for a subtotal or overall total.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Example&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt;\n    column1,\n    column2,\n    column3,\n\n    &lt;span class=\"hljs-keyword\"&gt;CASE&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;GROUPING&lt;/span&gt;(\n        column1,\n        column2,\n        column3,\n    )\n        &lt;span class=\"hljs-keyword\"&gt;WHEN&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;  &lt;span class=\"hljs-keyword\"&gt;THEN&lt;/span&gt; \"Subtotal: column1 and column2\"\n        &lt;span class=\"hljs-keyword\"&gt;WHEN&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;  &lt;span class=\"hljs-keyword\"&gt;THEN&lt;/span&gt; \"Subtotal: column1\"\n        &lt;span class=\"hljs-keyword\"&gt;WHEN&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;4&lt;/span&gt;  &lt;span class=\"hljs-keyword\"&gt;THEN&lt;/span&gt; \"Subtotal: column2 and column3\"\n        &lt;span class=\"hljs-keyword\"&gt;WHEN&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;6&lt;/span&gt;  &lt;span class=\"hljs-keyword\"&gt;THEN&lt;/span&gt; \"Subtotal: column3\"\n        &lt;span class=\"hljs-keyword\"&gt;WHEN&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;7&lt;/span&gt;  &lt;span class=\"hljs-keyword\"&gt;THEN&lt;/span&gt; \"Grand total\"\n        &lt;span class=\"hljs-keyword\"&gt;ELSE&lt;/span&gt;         \"Individual group\"\n    &lt;span class=\"hljs-keyword\"&gt;END&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; subtotal,\n\n    &lt;span class=\"hljs-built_in\"&gt;COUNT&lt;/span&gt;(&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; rows_count\n\n&lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; my_table\n\n&lt;span class=\"hljs-keyword\"&gt;GROUP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt;\n    &lt;span class=\"hljs-keyword\"&gt;ROLLUP&lt;/span&gt;(\n        column1,\n        column2,\n        column3\n    ),\n    &lt;span class=\"hljs-keyword\"&gt;GROUPING SETS&lt;/span&gt;(\n        (column2, column3),\n        (column3)\n        &lt;span class=\"hljs-comment\"&gt;-- if you added (column2) as well, then&lt;/span&gt;\n        &lt;span class=\"hljs-comment\"&gt;-- summing up these ROLLUP and GROUPING SETS would give the result&lt;/span&gt;\n        &lt;span class=\"hljs-comment\"&gt;-- similar to CUBE&lt;/span&gt;\n    )\n;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"171\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-171\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-171\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-171.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n&lt;h2 id=\"distinct\"&gt;&lt;a href=\"en/yql/syntax/group_by.html#distinct\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DISTINCT&lt;/span&gt;&lt;/a&gt;DISTINCT&lt;/h2&gt;\n&lt;p&gt;Applying aggregate functions only to distinct values of the column.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Applying &lt;code&gt;DISTINCT&lt;/code&gt; to calculated values is not currently implemented. For this purpose, use a &lt;a href=\"en/yql/syntax/select/from.html\"&gt;subquery&lt;/a&gt; or the clause &lt;code&gt;GROUP BY ... AS ...&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Example&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt;\n  key,\n  &lt;span class=\"hljs-built_in\"&gt;COUNT&lt;/span&gt;(&lt;span class=\"hljs-keyword\"&gt;DISTINCT&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;value&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; count &lt;span class=\"hljs-comment\"&gt;-- top 3 keys based on the number of unique values&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; my_table\n&lt;span class=\"hljs-keyword\"&gt;GROUP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; key\n&lt;span class=\"hljs-keyword\"&gt;ORDER&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; count &lt;span class=\"hljs-keyword\"&gt;DESC&lt;/span&gt;\nLIMIT &lt;span class=\"hljs-number\"&gt;3.&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"192\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-192\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-192\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-192.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You can also use &lt;code&gt;DISTINCT&lt;/code&gt; to fetch unique rows using &lt;a href=\"en/yql/syntax/select/distinct.html\"&gt;&lt;code&gt;SELECT DISTINCT&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"compact\"&gt;&lt;a href=\"en/yql/syntax/group_by.html#compact\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;COMPACT&lt;/span&gt;&lt;/a&gt;COMPACT&lt;/h2&gt;\n&lt;p&gt;The presence of &lt;a href=\"en/yql/syntax/lexer.html#sql-hints\"&gt;SQL hint&lt;/a&gt; &lt;code&gt;COMPACT&lt;/code&gt; right after the &lt;code&gt;GROUP&lt;/code&gt; keyword allows for more effective aggregation in cases where the query author knows beforehand that no aggregation key produces large amounts of data (more than a gigabyte or millions of rows). If this assumption fails to materialize, then the operation may fail with Out of Memory error or start running much slower compared to the non-COMPACT version.&lt;/p&gt;\n&lt;p&gt;Unlike regular GROUP BY, Map-side combiner and additional Reduce for each field with &lt;a href=\"en/yql/syntax/group_by.html#distinct\"&gt;DISTINCT&lt;/a&gt; aggregation are disabled.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Example:&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  key,\n  COUNT(DISTINCT value) AS count -- top 3 keys based on the number of unique values\nFROM my_table\nGROUP /*+ COMPACT() */ BY key\nORDER BY count DESC\nLIMIT 3;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"208\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-208\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-208\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-208.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"having\"&gt;&lt;a href=\"en/yql/syntax/group_by.html#having\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HAVING&lt;/span&gt;&lt;/a&gt;HAVING&lt;/h2&gt;\n&lt;p&gt;Filtering a &lt;code&gt;SELECT&lt;/code&gt; based on the aggregate function calculation results. The syntax is similar to the &lt;a href=\"en/yql/syntax/select/where.html\"&gt;&lt;code&gt;WHERE&lt;/code&gt;&lt;/a&gt; clause.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Example&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    key\nFROM my_table\nGROUP BY key\nHAVING COUNT(value) &amp;gt; 100;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"218\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-218\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-218\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-218.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/syntax/group_by.md","sourcePath":"en/yql/syntax/group_by.md"},"headings":[{"title":"GROUP BY","href":"en/yql/syntax/group_by.html#group-by","level":2},{"title":"GROUP BY ... SessionWindow()","href":"en/yql/syntax/group_by.html#session-window","level":2},{"title":"ROLLUP, CUBE, and GROUPING SETS","href":"en/yql/syntax/group_by.html#rollup","level":2,"items":[{"title":"GROUPING","href":"en/yql/syntax/group_by.html#grouping","level":3}]},{"title":"DISTINCT","href":"en/yql/syntax/group_by.html#distinct","level":2},{"title":"COMPACT","href":"en/yql/syntax/group_by.html#compact","level":2},{"title":"HAVING","href":"en/yql/syntax/group_by.html#having","level":2}],"title":""},"router":{"pathname":"en/yql/syntax/group_by","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
