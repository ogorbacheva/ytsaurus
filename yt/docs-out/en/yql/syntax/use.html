            {"data":{"leading":false,"html":"&lt;p&gt;Specifying the \"database\". As a rule, one of the YTsaurus clusters is used as a database. This database will be used by default to search for tables whenever the database hasn't been specified explicitly.&lt;/p&gt;\n&lt;p&gt;If the query doesn't include &lt;code&gt;USE&lt;/code&gt;, then the cluster must be specified at the beginning of the table path in the format &lt;code&gt;cluster.`path/to/table`&lt;/code&gt; , for example &lt;code&gt;cluster.`home/yql/test`&lt;/code&gt;. Backticks are used to automatically escape special characters (in this case, slashes).&lt;/p&gt;\n&lt;p&gt;Usually the cluster name is specified explicitly, but you can use an expression for it. In this case, &lt;code&gt;USE&lt;/code&gt; must have the notation &lt;code&gt;USE yt:$cluster_name&lt;/code&gt;, where &lt;code&gt;$cluster_name&lt;/code&gt; is the &lt;a href=\"en/yql/syntax/expressions.html#named-nodes\"&gt;named expression&lt;/a&gt; of the &lt;code&gt;String&lt;/code&gt; type.&lt;/p&gt;\n&lt;p&gt;Alternatively, you can specify the cluster right at the beginning of the table path in the format &lt;code&gt;yt:$cluster_name.`path/to/table`&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;In this case, &lt;code&gt;USE&lt;/code&gt; itself can be used inside &lt;a href=\"en/yql/syntax/action.html\"&gt;actions&lt;/a&gt; or &lt;a href=\"en/yql/syntax/subquery.html\"&gt;subquery templates&lt;/a&gt;. The current cluster value is inherited in the declarations of nested actions or subqueries. The influence area of &lt;code&gt;USE&lt;/code&gt; stops after the end of the action or subquery template in which it was declared.&lt;/p&gt;\n&lt;h4 id=\"examples\"&gt;&lt;a href=\"en/yql/syntax/use.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE &amp;lt;cluster-name&amp;gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"18\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-18\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-18\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-18.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;code&gt;USE&lt;/code&gt; &lt;strong&gt;doesn't&lt;/strong&gt; guarantee that a query will be executed on the specified cluster. A query can be executed on another cluster if no input data are used in it (e.g. &lt;code&gt;USE foo; SELECT 2 + 2;&lt;/code&gt;) or if a full path to a table in another cluster is specified (e.g. &lt;code&gt;USE foo; SELECT * FROM bar.`path/to/table`;&lt;/code&gt;).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/syntax/use.md","sourcePath":"en/yql/syntax/use.md"},"headings":[],"title":"USE"},"router":{"pathname":"en/yql/syntax/use","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
