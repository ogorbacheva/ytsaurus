        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;It lets you combine multiple data sources (subqueries or tables) by equality of values in the specified columns or expressions (the &lt;code&gt;JOIN&lt;/code&gt; keys).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Syntax&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; ...    &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; table_1\n&lt;span class=\"hljs-comment\"&gt;-- first JOIN step:&lt;/span&gt;\n  &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;Join_Type&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;JOIN&lt;/span&gt; table_2 &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;Join_Condition&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n  &lt;span class=\"hljs-comment\"&gt;-- left subquery -- entries in table_1&lt;/span&gt;\n  &lt;span class=\"hljs-comment\"&gt;-- right subquery -- entries in table_2&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;-- next JOIN step:&lt;/span&gt;\n  &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;Join_Type&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;JOIN&lt;/span&gt; table_n &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;Join_Condition&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n  &lt;span class=\"hljs-comment\"&gt;-- left subquery -- JOIN result in the previous step&lt;/span&gt;\n  &lt;span class=\"hljs-comment\"&gt;-- right subquery -- entries in table_n&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;-- JOIN can include the following steps&lt;/span&gt;\n...\n&lt;span class=\"hljs-keyword\"&gt;WHERE&lt;/span&gt;  ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;At each JOIN step, rules are used to establish correspondences between rows in the left and right data subqueries, creating a new subquery that includes every combination of rows that meet the JOIN conditions.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Since columns in YQL are identified by their names, and you can't have two columns with the same name in the subquery, &lt;code&gt;SELECT * FROM ... JOIN ...&lt;/code&gt; can't be executed if there are columns with identical names in the joined tables.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"types-of-join-join_type\"&gt;&lt;a href=\"en/yql/syntax/join.html#types-of-join-join_type\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Types of join (Join_Type)&lt;/span&gt;&lt;/a&gt;Types of join (Join_Type)&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;INNER&lt;/code&gt; &lt;span style=\"color:gray\"&gt;(default)&lt;/span&gt;: Rows from joined subqueries that don't match any rows on the other side won't be included in the result.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;LEFT&lt;/code&gt;: If there's no value in the right subquery, it adds a row to the result with column values from the left subquery, using &lt;code&gt;NULL&lt;/code&gt; in columns from the right subquery&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;RIGHT&lt;/code&gt;: If there's no value in the left subquery, it adds the row to the result, including column values from the right subquery, but using &lt;code&gt;NULL&lt;/code&gt; in columns from the left subquery&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;FULL&lt;/code&gt; = &lt;code&gt;LEFT&lt;/code&gt; + &lt;code&gt;RIGHT&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;LEFT/RIGHT SEMI&lt;/code&gt;: One side of the subquery is a whitelist of keys, its values are not available. The result includes columns from one table only, no Cartesian product is created.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;LEFT/RIGHT ONLY&lt;/code&gt;: Subtracting the sets by keys (blacklist). It's almost the same as adding &lt;code&gt;IS NULL&lt;/code&gt; to the key on the opposite side in the regular &lt;code&gt;LEFT/RIGHT&lt;/code&gt; JOIN, but with no access to values: the same as &lt;code&gt;SEMI&lt;/code&gt; JOIN.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;CROSS&lt;/code&gt;: A full Cartesian product of two tables without specifying key columns and no explicit &lt;code&gt;ON/USING&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;EXCLUSION&lt;/code&gt;: Both sides minus the intersection.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;img src=\"en/yql/syntax/_assets/join-YQL-06.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;code&gt;NULL&lt;/code&gt; is a special value to denote nothing. Hence, &lt;code&gt;NULL&lt;/code&gt; values on both sides are not treated as equal to each other. This eliminates ambiguity in some types of &lt;code&gt;JOIN&lt;/code&gt; and avoids a giant Cartesian product otherwise created.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"conditions-for-joining-join_condition\"&gt;&lt;a href=\"en/yql/syntax/join.html#conditions-for-joining-join_condition\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Conditions for joining (Join_Condition)&lt;/span&gt;&lt;/a&gt;Conditions for joining (Join_Condition)&lt;/h2&gt;\n&lt;p&gt;For &lt;code&gt;CROSS JOIN&lt;/code&gt;, no join condition is specified. The result includes the Cartesian product of the left and right subquery, meaning it combines everything with everything. The number of rows in the resulting subquery is the product of the number of rows in the left and right subqueries.&lt;/p&gt;\n&lt;p&gt;For any other JOIN types, specify the condition using one of the two methods:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;USING (column_name)&lt;/code&gt;. Used if both the left and right subqueries share a column whose equality of values is a join condition.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ON (equality_conditions)&lt;/code&gt;. Lets you set a condition of equality for column values or expressions over columns in the left and right subqueries or use several such conditions combined by &lt;code&gt;and&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;strong&gt;Examples:&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt;    a.value &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; a_value, b.value &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; b_value\n&lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt;      a_table &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; a\n&lt;span class=\"hljs-keyword\"&gt;FULL&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;JOIN&lt;/span&gt; b_table &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; b &lt;span class=\"hljs-keyword\"&gt;USING&lt;/span&gt; (key);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"102\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-102\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-102\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-102.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt;    a.value &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; a_value, b.value &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; b_value\n&lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt;      a_table &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; a\n&lt;span class=\"hljs-keyword\"&gt;FULL&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;JOIN&lt;/span&gt; b_table &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; b &lt;span class=\"hljs-keyword\"&gt;ON&lt;/span&gt; a.key &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; b.key;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"103\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-103\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-103\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-103.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt;     a.value &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; a_value, b.value &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; b_value, c.column2\n&lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt;       a_table &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; a\n&lt;span class=\"hljs-keyword\"&gt;CROSS&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;JOIN&lt;/span&gt; b_table &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; b\n&lt;span class=\"hljs-keyword\"&gt;LEFT&lt;/span&gt;  &lt;span class=\"hljs-keyword\"&gt;JOIN&lt;/span&gt; c_table &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; c &lt;span class=\"hljs-keyword\"&gt;ON&lt;/span&gt; c.ref &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; a.key &lt;span class=\"hljs-keyword\"&gt;and&lt;/span&gt; c.column1 &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; b.value;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"104\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-104\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-104\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-104.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;To make sure no full scan of the right joined table is required, a secondary index can be applied to the columns included in the Join condition. Accessing a secondary index should be specified explicitly in &lt;code&gt;JOIN table_name VIEW index_name AS table_alias&lt;/code&gt; format.&lt;/p&gt;\n&lt;p&gt;For example, creating an index to use in the Join condition:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;ALTER TABLE b_table ADD INDEX b_index_ref GLOBAL ON(ref);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"111\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-111\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-111\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-111.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Using the created index:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT    a.value as a_value, b.value as b_value\nFROM      a_table AS a\nINNER JOIN b_table VIEW b_index_ref AS b ON a.ref = b.ref;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"115\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-115\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-115\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-115.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If the statement filters data in addition to &lt;code&gt;JOIN&lt;/code&gt;, we recommend wrapping the criteria that would return &lt;code&gt;true&lt;/code&gt; for most of the rows in the &lt;code&gt;LIKELY(...)&lt;/code&gt; function call. If your assumption that positive values prevail for the criteria is correct, such a hint might speed up your subquery. &lt;code&gt;LIKELY&lt;/code&gt; can be useful when the predicate calculation is a resource-intensive operation and JOIN significantly reduces the number of rows.&lt;/p&gt;\n&lt;p&gt;In front of any data source for &lt;code&gt;JOIN&lt;/code&gt;, you can add the &lt;code&gt;ANY&lt;/code&gt; keyword to suppress duplicate &lt;code&gt;JOIN&lt;/code&gt; keys on the given side. In this case, only one row is left from the set of rows with the same &lt;code&gt;JOIN&lt;/code&gt; key value (no matter which one, that's why the keyword is called &lt;code&gt;ANY&lt;/code&gt;).&lt;br /&gt;\nThis syntax is different from the one accepted in [ClickHouse], where &lt;code&gt;ANY&lt;/code&gt; is placed before &lt;code&gt;JOIN&lt;/code&gt; type and only functions for the right side.&lt;/p&gt;\n&lt;p&gt;Request&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$t1 = AsList(\n    AsStruct(\"1\" AS key, \"v111\" AS value),\n    AsStruct(\"2\" AS key, \"v121\" AS value),\n    AsStruct(\"2\" AS key, \"v122\" AS value),\n    AsStruct(\"3\" AS key, \"v131\" AS value),\n    AsStruct(\"3\" AS key, \"v132\" AS value));\n\n$t2 = AsList(\n    AsStruct(\"2\" AS key, \"v221\" AS value),\n    AsStruct(\"2\" AS key, \"v222\" AS value),\n    AsStruct(\"3\" AS key, \"v231\" AS value),\n    AsStruct(\"3\" AS key, \"v232\" AS value),\n    AsStruct(\"4\" AS key, \"v241\" AS value));\n\nSELECT\n  a.key, a.value, b.value\nFROM ANY AS_TABLE($t1) AS a\nJOIN ANY AS_TABLE($t2) AS b\nON a.key == b.key;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"125\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-125\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-125\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-125.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;results in:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;a.key&lt;/th&gt;\n&lt;th&gt;a.value&lt;/th&gt;\n&lt;th&gt;b.value&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;\"3\"&lt;/td&gt;\n&lt;td&gt;\"v131\"&lt;/td&gt;\n&lt;td&gt;\"v231\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\"2\"&lt;/td&gt;\n&lt;td&gt;\"v121\"&lt;/td&gt;\n&lt;td&gt;\"v221\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;а без &lt;code&gt;ANY&lt;/code&gt; выдал бы:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;a.key&lt;/th&gt;\n&lt;th&gt;a.value&lt;/th&gt;\n&lt;th&gt;b.value&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;\"3\"&lt;/td&gt;\n&lt;td&gt;\"v131\"&lt;/td&gt;\n&lt;td&gt;\"v231\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\"3\"&lt;/td&gt;\n&lt;td&gt;\"v131\"&lt;/td&gt;\n&lt;td&gt;\"v232\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\"3\"&lt;/td&gt;\n&lt;td&gt;\"v132\"&lt;/td&gt;\n&lt;td&gt;\"v231\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\"3\"&lt;/td&gt;\n&lt;td&gt;\"v132\"&lt;/td&gt;\n&lt;td&gt;\"v232\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\"2\"&lt;/td&gt;\n&lt;td&gt;\"v121\"&lt;/td&gt;\n&lt;td&gt;\"v221\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\"2\"&lt;/td&gt;\n&lt;td&gt;\"v121\"&lt;/td&gt;\n&lt;td&gt;\"v222\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\"2\"&lt;/td&gt;\n&lt;td&gt;\"v122\"&lt;/td&gt;\n&lt;td&gt;\"v221\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\"2\"&lt;/td&gt;\n&lt;td&gt;\"v122\"&lt;/td&gt;\n&lt;td&gt;\"v222\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"join-execution-strategies-in-ytsaurus\"&gt;&lt;a href=\"en/yql/syntax/join.html#join-execution-strategies-in-ytsaurus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;JOIN execution strategies in YTsaurus&lt;/span&gt;&lt;/a&gt;JOIN execution strategies in YTsaurus&lt;/h2&gt;\n&lt;h3 id=\"introduction\"&gt;&lt;a href=\"en/yql/syntax/join.html#introduction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Introduction&lt;/span&gt;&lt;/a&gt;Introduction&lt;/h3&gt;\n&lt;p&gt;The following &lt;code&gt;JOIN&lt;/code&gt; syntax is supported in standard SQL:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  ...\nFROM T1 &amp;lt;Join_Type&amp;gt; JOIN T2\nON F(T1, T2);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"285\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-285\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-285\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-285.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;where &lt;code&gt;F(T1, T2)&lt;/code&gt; is a custom predicate depending on columns of both tables &lt;code&gt;T1, T2&lt;/code&gt;.&lt;br /&gt;\nYQL only supports a special case where the &lt;code&gt;F&lt;/code&gt; predicate is separable, i.e. looks as follows:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  ...\nFROM T1 &amp;lt;Join_Type&amp;gt; JOIN T2\nON F1(T1) = G1(T2) AND F2(T1) = G2(T2) AND ...;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"289\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-289\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-289\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-289.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Such predicate structure allows for effective &lt;code&gt;JOIN&lt;/code&gt; implementation within the map-reduce concept.&lt;/p&gt;\n&lt;p&gt;Just like in standard SQL, several &lt;code&gt;JOIN&lt;/code&gt;s can be created in a single SELECT in YQL:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  ...\nFROM\nT1 &amp;lt;Join_Type&amp;gt; JOIN T2 ON F1(T1) = G1(T2) AND F2(T1) = G2(T2) AND ...\n   &amp;lt;Join_Type&amp;gt; JOIN T3 ON H1(T1,T2) = J1(T3) AND H2(T1,T2) = J2(T3) AND ...;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"296\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-296\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-296\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-296.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Currently, such &lt;code&gt;JOIN&lt;/code&gt;s are performed consecutively, strictly in the order specified in the query.&lt;br /&gt;\nThe only exception is the StarJoin strategy.&lt;/p&gt;\n&lt;h3 id=\"calculating-join-keys\"&gt;&lt;a href=\"en/yql/syntax/join.html#calculating-join-keys\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Calculating JOIN keys&lt;/span&gt;&lt;/a&gt;Calculating JOIN keys&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;JOIN&lt;/code&gt; execution starts when the keys are calculated and their values are saved to a separate column.&lt;br /&gt;\nThis transformation takes place as early as the SQL parser level and is common for all backends (YDB, YTsaurus, DQ, etc.)&lt;/p&gt;\n&lt;p&gt;In practice, the query&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  ...\nFROM T1 &amp;lt;Join_Type&amp;gt; JOIN T2\nON F1(T1) = G1(T2) AND F2(T1) = G2(T2) AND ...;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"309\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-309\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-309\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-309.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;is converted to&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n...\nFROM (\n    SELECT t.*,\n           F1(...) as _yql_join_key1,\n           F2(...) as _yql_join_key2, ...\n    FROM T1 as t\n) as t1\n&amp;lt;Join_Type&amp;gt; JOIN (\n     SELECT t.*,\n            G1(...) as _yql_join_key1,\n            G2(...) as _yql_join_key2, ...\n    FROM T2 as t\n) as t2\nON t1._yql_join_key1 = t2._yql_join_key1 AND t1._yql_join_key2 = t2._yql_join_key2 AND ...;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"313\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-313\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-313\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-313.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"converting-keys-to-a-simple-common-type\"&gt;&lt;a href=\"en/yql/syntax/join.html#converting-keys-to-a-simple-common-type\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Converting keys to a simple common type&lt;/span&gt;&lt;/a&gt;Converting keys to a simple common type&lt;/h3&gt;\n&lt;p&gt;This stage is already specific for YTsaurus. It converts key columns from both sides to an identical simple type.&lt;/p&gt;\n&lt;p&gt;Request&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  ...\nFROM T1 as t1 &amp;lt;Join_Type&amp;gt; JOIN T2 as t2\nON t1.key1 = t2.key1 AND t1.key2 = t2.key2 AND ...;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"323\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-323\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-323\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-323.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;is converted to&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n...\nFROM (\n    SELECT t.*,\n           CastToCommonKeyType(key1) as _yql_join_key1,\n           CastToCommonKeyType(key2) as _yql_join_key2,\n    FROM T1 as t\n) as t1\n&amp;lt;Join_Type&amp;gt; JOIN (\n     SELECT t.*,\n           CastToCommonKeyType(key1) as _yql_join_key1,\n           CastToCommonKeyType(key2) as _yql_join_key2,\n    FROM T2 as t\n) as t2\nON t1._yql_join_key1 = t2._yql_join_key1 AND t1._yql_join_key2 = t2._yql_join_key2 AND ...;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"327\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-327\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-327\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-327.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Conversion to a common type is necessary for the correct map-reduce operation with related but different key types.&lt;br /&gt;\nFor example, &lt;code&gt;Optional&amp;lt;Int32&amp;gt;&lt;/code&gt; will be the common type for &lt;code&gt;Int32&lt;/code&gt; and &lt;code&gt;Uint32&lt;/code&gt; key types.&lt;br /&gt;\nIf no conversion into a common type is performed, and initial columns are left as key for map-reduce operations,&lt;br /&gt;\nthen YtsaurusYTsaurus will deem -1 and 4294967295 keys to be identical.&lt;/p&gt;\n&lt;p&gt;This conversion is not always necessary. For example, Int32 and Optional key types operate correctly.&lt;/p&gt;\n&lt;p&gt;Additionally, composite key types (everything more sophisticated than Optional from &lt;a href=\"en/yql/types/primitive.html\"&gt;simple type&lt;/a&gt;))&lt;br /&gt;\nafter changing to common type are also converted to a string:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;\nif (\n    YQL::HasNulls(casted_key), -- if null\n    null occurs somewhere in a key,                      -- then the value is converted to a string-type null (null in SQL is not equal to any value, including itself)\n    StablePickle(casted_key),  -- otherwise the value is serialized to string presentation\n)\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"337\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-337\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-337\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-337.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;This conversion is needed because composite key types aren't supported as reduce operation keys in YTsaurus.&lt;/p&gt;\n&lt;p&gt;Therefore, after all conversions we obtain keys of pair-wise identical simple type (with precision down to Optional) at both &lt;code&gt;JOIN&lt;/code&gt; sides.&lt;/p&gt;\n&lt;h3 id=\"basic-join-strategy-aka-commonjoin\"&gt;&lt;a href=\"en/yql/syntax/join.html#basic-join-strategy-aka-commonjoin\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Basic JOIN strategy (aka CommonJoin)&lt;/span&gt;&lt;/a&gt;Basic JOIN strategy (aka CommonJoin)&lt;/h3&gt;\n&lt;p&gt;The basic &lt;code&gt;JOIN&lt;/code&gt; strategy is selected when other &lt;code&gt;JOIN&lt;/code&gt; strategies cannot be applied due to some other reason.&lt;br /&gt;\nThis strategy supports all &lt;code&gt;JOIN&lt;/code&gt; types, including &lt;code&gt;CROSS JOIN&lt;/code&gt;, and is implemented through a single MapReduce operation.&lt;/p&gt;\n&lt;p&gt;The following happens at the map stage:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;converting keys to a simple common type&lt;/li&gt;\n&lt;li&gt;if the ANY modifier is present, identical keys are \"thinned\" by a separate window filter. Strings with identical keys are detected at a window of a certain size (hundreds of megabytes) and duplicates are filtered out&lt;/li&gt;\n&lt;li&gt;nulls are processed in keys. For &lt;code&gt;INNER JOIN&lt;/code&gt;, the nulls from both sides are filtered out,&lt;br /&gt;\nand for &lt;code&gt;LEFT/RIGHT/FULL JOIN&lt;/code&gt; strings with null keys, they are passed to a separate output table immediately from the map stage&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;From the map stage, strings with an identical key are passed to a single YTsaurus reduce job where &lt;code&gt;JOIN&lt;/code&gt; actually takes place.&lt;br /&gt;\nIf necessary, the resulting table from the reduce stage is merged with output tables from the map stage by using a separate YTsaurus Merge operation.&lt;/p&gt;\n&lt;p&gt;To perform &lt;code&gt;CROSS JOIN&lt;/code&gt; (where there are no keys), an identical 0 key is assigned to all strings of both output tables at the map stage.&lt;/p&gt;\n&lt;h3 id=\"lookupjoin-strategy\"&gt;&lt;a href=\"en/yql/syntax/join.html#lookupjoin-strategy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LookupJoin strategy&lt;/span&gt;&lt;/a&gt;LookupJoin strategy&lt;/h3&gt;\n&lt;p&gt;This strategy is triggered when one of the tables is sorted by &lt;code&gt;JOIN&lt;/code&gt; keys and the second one has a very small size (less than ~900 strings).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Hereinafter, a table is called &lt;em&gt;sorted by JOIN keys&lt;/em&gt; if the list of &lt;code&gt;JOIN&lt;/code&gt; keys acts as a sorting keys prefix for a certain order of &lt;code&gt;JOIN&lt;/code&gt; keys.&lt;br /&gt;\nFor example, a table with &lt;code&gt;JOIN&lt;/code&gt; &lt;code&gt;b, a&lt;/code&gt; keys and sorting by &lt;code&gt;a, b, c&lt;/code&gt; is sorted by the &lt;code&gt;JOIN&lt;/code&gt; keys.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;LookupJoin is supported for the following JOIN types:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;INNER&lt;/code&gt; (small table can be from any side)&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;LEFT SEMI&lt;/code&gt; (small table from the left)&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;RIGHT SEMI&lt;/code&gt; (small table from the right)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The LookupJoin strategy is implemented through a single Map operation on a big table, with a small table loaded into the memory.&lt;br /&gt;\nKey types don't have to match. The small table's keys are casted into the big table's key type.&lt;/p&gt;\n&lt;p&gt;Unlike the MapJoin strategy (see below), in LookupJoin &lt;code&gt;JOIN&lt;/code&gt; keys' values from the small table are passed to the&lt;br /&gt;\nranges &lt;code&gt;setting&lt;/code&gt; in the big table's YPath. Thus, only the strings with &lt;code&gt;JOIN&lt;/code&gt; keys that are present in the small table are read out from the big table.&lt;/p&gt;\n&lt;p&gt;LookupJoin is the most effective &lt;code&gt;JOIN&lt;/code&gt; strategy. However, it imposes the strictest conditions on &lt;code&gt;JOIN&lt;/code&gt;&lt;br /&gt;\ntypes (they must be \"filtering\" based on the big table) and on the small table's size (keys must \"fit in\" the maximum permitted number of &lt;code&gt;ranges&lt;/code&gt; in YPath).&lt;br /&gt;\nMoreover, &lt;code&gt;ANY&lt;/code&gt; on the big table's side is not supported in LookupJoin.&lt;/p&gt;\n&lt;p&gt;(PRAGMA) settings for the strategy:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Name&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytlookupjoinlimit\"&gt;yt.LookupJoinLimit&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;Small table's maximum size in bytes (up to 10M)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytlookupjoinmaxrows\"&gt;yt.LookupJoinMaxRows&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;Small table's maximum size in strings (up to 1,000)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;The LookupJoin strategy gets disabled when any of these values is set to 0.&lt;/p&gt;\n&lt;h3 id=\"sortedjoin-strategy-aka-mergejoin\"&gt;&lt;a href=\"en/yql/syntax/join.html#sortedjoin-strategy-aka-mergejoin\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SortedJoin strategy (aka MergeJoin)&lt;/span&gt;&lt;/a&gt;SortedJoin strategy (aka MergeJoin)&lt;/h3&gt;\n&lt;p&gt;This strategy is triggered when both tables are sorted by &lt;code&gt;JOIN&lt;/code&gt; keys.&lt;br /&gt;\nHere, &lt;code&gt;JOIN&lt;/code&gt; keys must match in terms of types with precision down to Optional at the upper level.&lt;/p&gt;\n&lt;p&gt;If only one table is sorted and the other's size is under &lt;code&gt;yt.JoinMergeUnsortedFactor * &amp;lt;size of sorted table&amp;gt;&lt;/code&gt;,&lt;br /&gt;\nthe SortedJoin strategy is selected as well and the unsorted table is sorted out a separate YTsaurus operation.&lt;br /&gt;\n&lt;a href=\"en/yql/syntax/pragma/yt.html#ytjoinmergeunsortedfactor\"&gt;&lt;code&gt;yt.JoinMergeUnsortedFactor&lt;/code&gt;&lt;/a&gt; is set to &lt;code&gt;0.2&lt;/code&gt; by default.&lt;/p&gt;\n&lt;p&gt;The SortedJoin strategy supports all &lt;code&gt;JOIN&lt;/code&gt; types except &lt;code&gt;CROSS JOIN&lt;/code&gt; and is implemented through a single Reduce operation.&lt;br /&gt;\nHere, reduce with foreign tables mode is used where possible.&lt;br /&gt;\nMoreover, when &lt;code&gt;JOIN&lt;/code&gt; keys are unique, the &lt;code&gt;enable_key_guarantee = false&lt;/code&gt; setting is additionally enabled. &lt;/p&gt;\n&lt;p&gt;The SortedJoin strategy can be forcibly selected through an &lt;a href=\"en/yql/syntax/lexer.html#sql-hints\"&gt;SQL hint&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT * FROM T1 AS a JOIN /*+ merge() */ T2 AS b ON a.key = b.key;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"472\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-472\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-472\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-472.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;In this case (where necessary)&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;JOIN&lt;/code&gt; keys will be converted to common type&lt;/li&gt;\n&lt;li&gt;both tables will be sorted by &lt;code&gt;JOIN&lt;/code&gt; keys&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;(PRAGMA) settings for the strategy:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Name&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytjoinmergeunsortedfactor\"&gt;&lt;code&gt;yt.JoinMergeUnsortedFactor&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;See above&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytjoinmergetableslimit\"&gt;&lt;code&gt;yt.JoinMergeTablesLimit&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;Maximum number of &lt;code&gt;JOIN&lt;/code&gt; input tables (when using &lt;a href=\"en/yql/syntax/select/concat.html\"&gt;RANGE, CONCAT&lt;/a&gt;, etc.)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytjoinmergeusesmallasprimary\"&gt;&lt;code&gt;yt.JoinMergeUseSmallAsPrimary&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;Influences the primary table selection when executing a Reduce operation&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytjoinmergeforce\"&gt;&lt;code&gt;yt.JoinMergeForce&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;Forces the selection of the SortedJoin strategy for all &lt;code&gt;JOIN&lt;/code&gt; in a query&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;code&gt;yt.JoinMergeTablesLimit&lt;/code&gt; set to 0 disables the SortedJoin strategy.&lt;/p&gt;\n&lt;h3 id=\"mapjoin-strategy\"&gt;&lt;a href=\"en/yql/syntax/join.html#mapjoin-strategy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MapJoin strategy&lt;/span&gt;&lt;/a&gt;MapJoin strategy&lt;/h3&gt;\n&lt;p&gt;This strategy triggers when one of the input tables is sufficiently small (its size doesn't exceed &lt;a href=\"en/yql/syntax/pragma/yt.html#ytmapjoinlimit\"&gt;&lt;code&gt;yt.MapJoinLimit&lt;/code&gt;&lt;/a&gt;).&lt;br /&gt;\nIn this case, a smaller table is loaded into the memory (as a dictionary with &lt;code&gt;JOIN&lt;/code&gt; keys), and Map is executed thereafter for the big table.&lt;/p&gt;\n&lt;p&gt;This strategy supports all &lt;code&gt;JOIN&lt;/code&gt; types (including &lt;code&gt;CROSS&lt;/code&gt;). However, it isn't selected if &lt;code&gt;ANY&lt;/code&gt; is on the bigger side.&lt;/p&gt;\n&lt;p&gt;An unique feature of MapJoin is that this strategy is available for earlier selection.&lt;br /&gt;\nIn other words, when a smaller input table is already calculated and subject to size limitations and the big table isn't yet ready.&lt;br /&gt;\nIn this case, MapJoin can be selected immediately,&lt;br /&gt;\nand there's a chance that the Map operation for the big table will \"glue to\" the Map operation (for example, filter) preparing this big table.&lt;/p&gt;\n&lt;p&gt;There is also a sharded MapJoin variant: the small table is split into &lt;a href=\"en/yql/syntax/pragma/yt.html#ytmapjoinshardcount\"&gt;&lt;code&gt;yt.MapJoinShardCount&lt;/code&gt;&lt;/a&gt; parts&lt;br /&gt;\n(each one cannot exceed &lt;code&gt;yt.MapJoinLimit&lt;/code&gt;), and each part is in parallel and on its own &lt;code&gt;JOIN&lt;/code&gt;with the big table through a Map operation.&lt;br /&gt;\nThen all obtained parts are joined through YTsaurus Merge.&lt;/p&gt;\n&lt;p&gt;Sharded MapJoin is only possible for certain &lt;code&gt;JOIN&lt;/code&gt; types (&lt;code&gt;INNER&lt;/code&gt;,&lt;code&gt;CROSS&lt;/code&gt;, and &lt;code&gt;LEFT SEMI&lt;/code&gt;, provided that the small table to the right is unique).&lt;/p&gt;\n&lt;p&gt;(PRAGMA) settings for the strategy:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Name&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytmapjoinlimit\"&gt;&lt;code&gt;yt.MapJoinLimit&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;Maximum size of the smaller &lt;code&gt;JOIN&lt;/code&gt; side presentation in the memory for which the MapJoin strategy is selected&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytmapjoinshardcount\"&gt;&lt;code&gt;yt.MapJoinShardCount&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;Maximum number of shards&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytmapjoinshardminrows\"&gt;&lt;code&gt;yt.MapJoinShardMinRows&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;Minimum number of strings in one shard&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;code&gt;yt.MapJoinLimit&lt;/code&gt; set to 0 disables the MapJoin strategy.&lt;/p&gt;\n&lt;h3 id=\"starjoin-strategy\"&gt;&lt;a href=\"en/yql/syntax/join.html#starjoin-strategy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;StarJoin strategy&lt;/span&gt;&lt;/a&gt;StarJoin strategy&lt;/h3&gt;\n&lt;p&gt;This strategy makes it possible to perform several subsequent &lt;code&gt;JOIN&lt;/code&gt;s at once through a single Reduce operation.&lt;/p&gt;\n&lt;p&gt;This strategy is possible when dictionary tables are subsequently appended to one (\"main\") table through &lt;code&gt;INNER JOIN&lt;/code&gt; or &lt;code&gt;LEFT JOIN&lt;/code&gt;, provided that:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;identical keys are used in all &lt;code&gt;JOIN&lt;/code&gt;s from the main table&lt;/li&gt;\n&lt;li&gt;all tables are sorted by &lt;code&gt;JOIN&lt;/code&gt; keys&lt;/li&gt;\n&lt;li&gt;dictionary tables are also unique in terms of &lt;code&gt;JOIN&lt;/code&gt; keys&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;(PRAGMA) settings for the strategy:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Name&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"en/yql/syntax/pragma/yt.html#ytjoinenablestarjoin\"&gt;&lt;code&gt;yt.JoinEnableStarJoin&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;Enables/disables StarJoin strategy selection (enabled by default)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"strategy-selection-sequence\"&gt;&lt;a href=\"en/yql/syntax/join.html#strategy-selection-sequence\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Strategy selection sequence&lt;/span&gt;&lt;/a&gt;Strategy selection sequence&lt;/h3&gt;\n&lt;p&gt;When &lt;code&gt;JOIN&lt;/code&gt; is executed, strategies are tried in a certain sequence, and the first suitable one is selected.&lt;br /&gt;\nThe sequence is as follows:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;StarJoin&lt;/li&gt;\n&lt;li&gt;LookupJoin&lt;/li&gt;\n&lt;li&gt;OrderedJoin&lt;/li&gt;\n&lt;li&gt;MapJoin&lt;/li&gt;\n&lt;li&gt;CommonJoin (always possible)&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/syntax/join.md","sourcePath":"en/yql/syntax/join.md"},"headings":[{"title":"Types of join (Join_Type)","href":"en/yql/syntax/join.html#types-of-join-join_type","level":2},{"title":"Conditions for joining (Join_Condition)","href":"en/yql/syntax/join.html#conditions-for-joining-join_condition","level":2},{"title":"JOIN execution strategies in YTsaurus","href":"en/yql/syntax/join.html#join-execution-strategies-in-ytsaurus","level":2,"items":[{"title":"Introduction","href":"en/yql/syntax/join.html#introduction","level":3},{"title":"Calculating JOIN keys","href":"en/yql/syntax/join.html#calculating-join-keys","level":3},{"title":"Converting keys to a simple common type","href":"en/yql/syntax/join.html#converting-keys-to-a-simple-common-type","level":3},{"title":"Basic JOIN strategy (aka CommonJoin)","href":"en/yql/syntax/join.html#basic-join-strategy-aka-commonjoin","level":3},{"title":"LookupJoin strategy","href":"en/yql/syntax/join.html#lookupjoin-strategy","level":3},{"title":"SortedJoin strategy (aka MergeJoin)","href":"en/yql/syntax/join.html#sortedjoin-strategy-aka-mergejoin","level":3},{"title":"MapJoin strategy","href":"en/yql/syntax/join.html#mapjoin-strategy","level":3},{"title":"StarJoin strategy","href":"en/yql/syntax/join.html#starjoin-strategy","level":3},{"title":"Strategy selection sequence","href":"en/yql/syntax/join.html#strategy-selection-sequence","level":3}]}],"title":"JOIN"},"router":{"pathname":"en/yql/syntax/join","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
