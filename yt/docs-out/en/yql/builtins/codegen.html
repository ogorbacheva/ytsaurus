            {"data":{"leading":false,"html":"&lt;p&gt;During computations, you can generate code consisting of S-expression nodes. To do this, use a mechanism for representing code packed in a &lt;a href=\"en/yql/types/special.html\"&gt;resource&lt;/a&gt;. After constructing the code, you can insert it into the main program using the &lt;a href=\"en/yql/builtins/codegen.html#evaluatecode\"&gt;EvaluateCode&lt;/a&gt; function. For debugging, you can convert the code into a string using the &lt;a href=\"en/yql/builtins/codegen.html#formatcode\"&gt;FormatCode&lt;/a&gt; function.&lt;/p&gt;\n&lt;p&gt;Possible node types in S-expressions that can be used to generate code:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Atom: An untyped string of zero or more characters.&lt;/li&gt;\n&lt;li&gt;List: A sequence of zero or more nodes. Corresponds to the &lt;code&gt;tuple&lt;/code&gt; type in SQL.&lt;/li&gt;\n&lt;li&gt;Invokation of a built-in function: Consists of a name expressed by an atom and a sequence of zero or more nodes that are arguments of that function.&lt;/li&gt;\n&lt;li&gt;Declaration of a lambda function: Consists of the declaration of argument names and the node that is the root of the body of that lambda function.&lt;/li&gt;\n&lt;li&gt;A lambda function argument: A node that can only be used inside the body of the lambda function.&lt;/li&gt;\n&lt;li&gt;World: A special node that marks I/O operations.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;S-expressions nodes form an oriented graph. Atoms are always leaf nodes, since they cannot contain child nodes.&lt;/p&gt;\n&lt;p&gt;S-expressions are written as follows in text form:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Atom: &lt;code&gt;'\"foo\"&lt;/code&gt;. The apostrophe symbol (') is a sign of quoting a subsequent string usually enclosed in quotation marks.&lt;/li&gt;\n&lt;li&gt;List: &lt;code&gt;'(\"foo\" \"bar\")&lt;/code&gt;. The apostrophe symbol (') is a sign that there will be no function invocation in brackets.&lt;/li&gt;\n&lt;li&gt;Invocation of a built-in function: &lt;code&gt;(foo \"bar\")&lt;/code&gt;. The first item inside the brackets is a mandatory function name, which is then followed by arguments.&lt;/li&gt;\n&lt;li&gt;Declaration of a lambda function: &lt;code&gt;(lambda '(x y) (+ x y))&lt;/code&gt;. The &lt;code&gt;lambda&lt;/code&gt; keyword is followed by a list of argument names and the body of the lambda function.&lt;/li&gt;\n&lt;li&gt;A lambda function argument: &lt;code&gt;x&lt;/code&gt;. Unlike an atom, a string without an apostrophe symbol (') is a reference to the name in the current scope. When you declare a lambda function, the argument names are added to the scope of the body, hiding the name from the enclosing scope if necessary.&lt;/li&gt;\n&lt;li&gt;World: &lt;code&gt;world&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"formatcode\"&gt;&lt;a href=\"en/yql/builtins/codegen.html#formatcode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FormatCode&lt;/span&gt;&lt;/a&gt;FormatCode&lt;/h2&gt;\n&lt;p&gt;Code serialization as &lt;a href=\"/docs/s_expressions\"&gt;S-expressions&lt;/a&gt;. The code must not contain free function arguments, i.e. to serialize the lambda function code, you must pass it in its entirety, not expressions that potentially contain lambda function arguments.&lt;/p&gt;\n&lt;h4 id=\"examples\"&gt;&lt;a href=\"en/yql/builtins/codegen.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT FormatCode(AtomCode(\"foo\"));\n-- (\n-- (return '\"foo\")\n-- )\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"85\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-85\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-85\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-85.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"worldcode\"&gt;&lt;a href=\"en/yql/builtins/codegen.html#worldcode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;WorldCode&lt;/span&gt;&lt;/a&gt;WorldCode&lt;/h2&gt;\n&lt;p&gt;Build a code node with the &lt;code&gt;world&lt;/code&gt; type.&lt;/p&gt;\n&lt;h4 id=\"examples1\"&gt;&lt;a href=\"en/yql/builtins/codegen.html#examples1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT FormatCode(WorldCode());\n-- (\n-- (return world)\n-- )\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"95\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-95\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-95\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-95.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"atomcode\"&gt;&lt;a href=\"en/yql/builtins/codegen.html#atomcode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AtomCode&lt;/span&gt;&lt;/a&gt;AtomCode&lt;/h2&gt;\n&lt;p&gt;Build a code node with the &lt;code&gt;atom&lt;/code&gt; type from a string passed to the argument.&lt;/p&gt;\n&lt;h4 id=\"examples2\"&gt;&lt;a href=\"en/yql/builtins/codegen.html#examples2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT FormatCode(AtomCode(\"foo\"));\n-- (\n-- (return '\"foo\")\n-- )\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"105\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-105\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-105\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-105.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"listcode\"&gt;&lt;a href=\"en/yql/builtins/codegen.html#listcode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ListCode&lt;/span&gt;&lt;/a&gt;ListCode&lt;/h2&gt;\n&lt;p&gt;Build a code node with the &lt;code&gt;list&lt;/code&gt; type from a set of nodes or lists of code nodes passed to the arguments. The lists from the arguments are embedded as separately listed code nodes.&lt;/p&gt;\n&lt;h4 id=\"examples3\"&gt;&lt;a href=\"en/yql/builtins/codegen.html#examples3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT FormatCode(ListCode(\n    AtomCode(\"foo\"),\n    AtomCode(\"bar\")));\n-- (\n-- (return '('\"foo\" '\"bar\"))\n-- );\n\nSELECT FormatCode(ListCode(AsList(\n    AtomCode(\"foo\"),\n    AtomCode(\"bar\"))));\n-- (\n-- (return '('\"foo\" '\"bar\"))\n-- )\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"115\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-115\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-115\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-115.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"funccode\"&gt;&lt;a href=\"en/yql/builtins/codegen.html#funccode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FuncCode&lt;/span&gt;&lt;/a&gt;FuncCode&lt;/h2&gt;\n&lt;p&gt;Build a code node with the &lt;code&gt;built-in function invocation&lt;/code&gt; type from a string with the function name and a set of nodes or lists of code nodes passed to the arguments. The lists from the arguments are embedded as separately listed code nodes.&lt;/p&gt;\n&lt;h4 id=\"examples4\"&gt;&lt;a href=\"en/yql/builtins/codegen.html#examples4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT FormatCode(FuncCode(\n    \"Baz\",\n    AtomCode(\"foo\"),\n    AtomCode(\"bar\")));\n-- (\n-- (return (Baz '\"foo\" '\"bar\"))\n-- )\n\nSELECT FormatCode(FuncCode(\n    \"Baz\",\n    AsList(\n        AtomCode(\"foo\"),\n        AtomCode(\"bar\"))));\n-- (\n-- (return (Baz '\"foo\" '\"bar\"))\n-- )\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"125\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-125\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-125\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-125.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"lambdacode\"&gt;&lt;a href=\"en/yql/builtins/codegen.html#lambdacode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LambdaCode&lt;/span&gt;&lt;/a&gt;LambdaCode&lt;/h2&gt;\n&lt;p&gt;You can build a code node with the &lt;code&gt;lambda function declaration&lt;/code&gt; type from the:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/expressions.html#lambda\"&gt;Lambda function&lt;/a&gt; if the number of arguments is known in advance. In this case, nodes of the &lt;code&gt;argument&lt;/code&gt; type will be passed as arguments of this lambda function.&lt;/li&gt;\n&lt;li&gt;Number of arguments and &lt;a href=\"en/yql/syntax/expressions.html#lambda\"&gt;lambda function&lt;/a&gt; with one argument. In this case, a list of nodes of the &lt;code&gt;argument&lt;/code&gt; type will be passed as an argument of this lambda function.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"examples5\"&gt;&lt;a href=\"en/yql/builtins/codegen.html#examples5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT FormatCode(LambdaCode(($x, $y) -&amp;gt; {\n    RETURN FuncCode(\"+\", $x, $y);\n}));\n-- (\n-- (return (lambda '($1 $2) (+ $1 $2)))\n-- )\n\nSELECT FormatCode(LambdaCode(2, ($args) -&amp;gt; {\n    RETURN FuncCode(\"*\", Unwrap($args[0]), Unwrap($args[1]));\n}));\n-- (\n-- (return (lambda '($1 $2) (* $1 $2)))\n-- )\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"147\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-147\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-147\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-147.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"evaluatecode\"&gt;&lt;a href=\"en/yql/builtins/codegen.html#evaluatecode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;EvaluateCode&lt;/span&gt;&lt;/a&gt;EvaluateCode&lt;/h2&gt;\n&lt;p&gt;Placing the code node passed to the argument into the main program.&lt;/p&gt;\n&lt;h4 id=\"examples6\"&gt;&lt;a href=\"en/yql/builtins/codegen.html#examples6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT EvaluateCode(FuncCode(\"Int32\", AtomCode(\"1\"))); -- 1\n\n$lambda = EvaluateCode(LambdaCode(($x, $y) -&amp;gt; {\n    RETURN FuncCode(\"+\", $x, $y);\n}));\nSELECT $lambda(1, 2); -- 3\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"157\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-157\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-157\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-157.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"reprcode\"&gt;&lt;a href=\"en/yql/builtins/codegen.html#reprcode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ReprCode&lt;/span&gt;&lt;/a&gt;ReprCode&lt;/h2&gt;\n&lt;p&gt;Placing the code node that is a representation of the result of computing the expression passed to the argument into the main program.&lt;/p&gt;\n&lt;h4 id=\"examples7\"&gt;&lt;a href=\"en/yql/builtins/codegen.html#examples7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$add3 = EvaluateCode(LambdaCode(($x) -&amp;gt; {\n    RETURN FuncCode(\"+\", $x, ReprCode(1 + 2));\n}));\nSELECT $add3(1); -- 4\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"167\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-167\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-167\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-167.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"quotecode\"&gt;&lt;a href=\"en/yql/builtins/codegen.html#quotecode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;QuoteCode&lt;/span&gt;&lt;/a&gt;QuoteCode&lt;/h2&gt;\n&lt;p&gt;Placing the code node that is a representation of the expression or &lt;a href=\"en/yql/syntax/expressions.html#lambda\"&gt;lambda function&lt;/a&gt; passed to the argument into the main program. If free lambda function arguments are found during placing, they are computed and placed into the code as in the &lt;a href=\"en/yql/builtins/codegen.html#reprcode\"&gt;ReprCode&lt;/a&gt; function.&lt;/p&gt;\n&lt;h4 id=\"examples8\"&gt;&lt;a href=\"en/yql/builtins/codegen.html#examples8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$lambda = ($x, $y) -&amp;gt; { RETURN $x + $y };\n$makeClosure = ($y) -
