            {"data":{"leading":false,"html":"&lt;p&gt;For the YTsaurus cluster to work, its components need disk space to store persistent, temporary, and debugging data. Paths to the file system directories intended for YTsaurus are set in static configs of components generated by the K8s operator. In the YTsaurus specification, paths are defined in the Locations section. Location types correspond to relevant components. Volumes are allocated to locations using standard Kubernetes concepts: &lt;code&gt;volumeMounts&lt;/code&gt;, &lt;code&gt;volumes&lt;/code&gt; (for non-persistent volumes), and &lt;code&gt;volumeClaimTemplates&lt;/code&gt; (for persistent volumes).&lt;/p&gt;\n&lt;h2 id=\"location_types\"&gt;&lt;a href=\"en/admin-guide/locations.html#location_types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Location types&lt;/span&gt;&lt;/a&gt;Location types&lt;/h2&gt;\n&lt;h3 id=\"location_master\"&gt;&lt;a href=\"en/admin-guide/locations.html#location_master\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MasterChangelogs, MasterSnapshots&lt;/span&gt;&lt;/a&gt;MasterChangelogs, MasterSnapshots&lt;/h3&gt;\n&lt;p&gt;Used to store master data, which includes all the cluster's metadata. These types must be placed on persistent volumes regardless of the installation size (except very small ones). The required volume size depends on the amount of metadata and the cluster load. Overloaded locations can make the cluster unavailable, which is why we recommend allocating some extra space and keeping an eye on its usage. Production installations are typically hundreds of gigabytes in size.&lt;/p&gt;\n&lt;p&gt;In order to ensure performance in production installations, we recommend placing &lt;code&gt;MasterChangelogs&lt;/code&gt; on separate, fast (NVMe, for instance) volumes since logging latency directly impacts the latency of mutating requests submitted to the master.&lt;/p&gt;\n&lt;p&gt;Each master instance can and should have exactly one &lt;code&gt;MasterChangelogs&lt;/code&gt; location and one &lt;code&gt;MasterSnapshots&lt;/code&gt; location.&lt;/p&gt;\n&lt;h3 id=\"locations_exec_nodes\"&gt;&lt;a href=\"en/admin-guide/locations.html#locations_exec_nodes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ChunkCache, ImageCache, Slots&lt;/span&gt;&lt;/a&gt;ChunkCache, ImageCache, Slots&lt;/h3&gt;\n&lt;p&gt;Used by exec nodes when initiating jobs that contain user code (Map, Reduce, Vanilla, including CHYT and SPYT). &lt;code&gt;ChunkCache&lt;/code&gt; locations are used for managing and caching binary artifacts like executable files or auxiliary dictionaries. &lt;code&gt;ImageCeche&lt;/code&gt; locations are used for caching container images, depending on configuration of job environment. &lt;code&gt;Slots&lt;/code&gt; locations are needed to allocate a temporary workspace (sandbox, scratch space) when running user processes. Each exec node must have at least one &lt;code&gt;ChunkCache&lt;/code&gt; location and at least one &lt;code&gt;Slots&lt;/code&gt; location. When allocating multiple &lt;code&gt;ChunkCache&lt;/code&gt; or &lt;code&gt;Slots&lt;/code&gt; locations for a single node, the exec node will try to balance the load between them.&lt;/p&gt;\n&lt;p&gt;Non-persistent volumes can be used for &lt;code&gt;ChunkCache&lt;/code&gt;, &lt;code&gt;ImageCache&lt;/code&gt; and &lt;code&gt;Slots&lt;/code&gt; locations without compromising data reliability. Typical location sizes are 10–50 GB for &lt;code&gt;ChunkCache&lt;/code&gt; and 5–200 GB for &lt;code&gt;Slots&lt;/code&gt; and &lt;code&gt;ImageCache&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"location_data_nodes\"&gt;&lt;a href=\"en/admin-guide/locations.html#location_data_nodes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ChunkStore&lt;/span&gt;&lt;/a&gt;ChunkStore&lt;/h3&gt;\n&lt;p&gt;Used by data nodes to store chunks. These types must be placed on persistent volumes regardless of the installation size (except very small ones). The size of the locations determines the total capacity of the cluster. When building a multi-tiered storage (containing different disk types, like HDD and SSD), specify the &lt;code&gt;medium&lt;/code&gt; parameter in the location description. By default, the location is assigned to the &lt;code&gt;default&lt;/code&gt; medium.&lt;/p&gt;\n&lt;p&gt;The minimum location size is 10 GB for a test installation and 100 GB for production. Each data node must have at least one &lt;code&gt;ChunkStore&lt;/code&gt; location.&lt;/p&gt;\n&lt;h3 id=\"location_logs\"&gt;&lt;a href=\"en/admin-guide/locations.html#location_logs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Logs&lt;/span&gt;&lt;/a&gt;Logs&lt;/h3&gt;\n&lt;p&gt;Used by all components to store logs. Setting these locations is optional. If you don't set any, logs are saved to &lt;code&gt;/var/log&lt;/code&gt; within the container. You can use non-persistent volumes — this won't compromise data reliability but can complicate debugging when migrating or re-creating pods. Typical location sizes for production installations are 50–200 GB.&lt;/p&gt;\n&lt;p&gt;Each instance can have no more than one &lt;code&gt;Logs&lt;/code&gt; location.&lt;/p&gt;\n&lt;h2 id=\"spec_examples\"&gt;&lt;a href=\"en/admin-guide/locations.html#spec_examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Specification examples&lt;/span&gt;&lt;/a&gt;Specification examples&lt;/h2&gt;\n&lt;h3 id=\"spec_example_masters\"&gt;&lt;a href=\"en/admin-guide/locations.html#spec_example_masters\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example setup for volumes and master locations&lt;/span&gt;&lt;/a&gt;Example setup for volumes and master locations&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;primaryMasters:&lt;/span&gt;\n  &lt;span class=\"hljs-comment\"&gt;# Other master parameters.&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;volumeClaimTemplates:&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;# Persistent volume for master changelogs, uses dynamic volume provisioner in YC, non-replicated SSD storage class.&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;master-changelogs&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;storageClassName:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;yc-network-ssd-nonreplicated&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;accessModes:&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"ReadWriteOnce\"&lt;/span&gt; ]\n        &lt;span class=\"hljs-attr\"&gt;resources:&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;requests:&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;storage:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;200Gi&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;# Persistent volume for master snapshots, uses dynamic volume provisioner in YC, HDD storage class.&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;master-snapshots&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;storageClassName:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;yc-network-hdd&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;accessModes:&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"ReadWriteOnce\"&lt;/span&gt; ]\n        &lt;span class=\"hljs-attr\"&gt;resources:&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;requests:&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;storage:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;200Gi&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;volumes:&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;# Non-persistent volume for debug logs.&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;master-logs&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;emptyDir:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;sizeLimit:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;100Gi&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;volumeMounts:&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;master-changelogs&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;mountPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/master-changelogs&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;master-snapshots&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;mountPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/master-snapshots&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;master-logs&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;mountPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/master-logs&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;locations:&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;locationType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;MasterChangelogs&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/master-changelogs&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;locationType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;MasterSnapshots&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/master-snapshots&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;locationType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Logs&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/master-logs&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"51\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-51\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-51\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-51.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"spec_example_data_nodes\"&gt;&lt;a href=\"en/admin-guide/locations.html#spec_example_data_nodes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sample configuration for volumes and data node locations&lt;/span&gt;&lt;/a&gt;Sample configuration for volumes and data node locations&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;dataNodes:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;volumeClaimTemplates:&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;# Persistent volume for chunk stores on HDD.&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;chunk-store-hdd&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;storageClassName:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;yc-network-hdd&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;accessModes:&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"ReadWriteOnce\"&lt;/span&gt; ]\n        &lt;span class=\"hljs-attr\"&gt;resources:&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;requests:&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;storage:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;300Gi&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;# Persistent volume for chunk stores on SSD.&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;chunk-store-ssd&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;storageClassName:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;yc-network-ssd&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;accessModes:&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"ReadWriteOnce\"&lt;/span&gt; ]\n        &lt;span class=\"hljs-attr\"&gt;resources:&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;requests:&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;storage:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;300Gi&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;# Persistent volume for debug logs.&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;node-logs&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;storageClassName:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;yc-network-hdd&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;accessModes:&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"ReadWriteOnce\"&lt;/span&gt; ]\n        &lt;span class=\"hljs-attr\"&gt;resources:&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;requests:&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;storage:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;300Gi&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;volumeMounts:&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;chunk-store-hdd&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;mountPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/node-chunk-store-hdd&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;chunk-store-ssd&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;mountPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/node-chunk-store-ssd&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;node-logs&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;mountPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/node-logs&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;locations:&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;locationType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ChunkStore&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/node-chunk-store-hdd&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;medium:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;default&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;locationType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ChunkStore&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/node-chunk-store-ssd&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;medium:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ssd_blobs&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;locationType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Logs&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/node-logs&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"55\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-55\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-55\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-55.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"volumes_without_dvp\"&gt;&lt;a href=\"en/admin-guide/locations.html#volumes_without_dvp\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Configuring volumes for K8s clusters without dynamic volume provisioning&lt;/span&gt;&lt;/a&gt;Configuring volumes for K8s clusters without dynamic volume provisioning&lt;/h2&gt;\n&lt;p&gt;There are two ways to mark up disks and create persistent volumes on clusters without dynamic provisioning for volumes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Using hostPath-type volumes&lt;/li&gt;\n&lt;li&gt;Manually creating persistent volumes with &lt;a href=\"https://cloud.google.com/kubernetes-engine/docs/how-to/persistent-volumes/preexisting-pd?authuser=0#pv_to_statefulset\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;claimRef&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"host_path_volumes\"&gt;&lt;a href=\"en/admin-guide/locations.html#host_path_volumes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Using hostPath volumes&lt;/span&gt;&lt;/a&gt;Using hostPath volumes&lt;/h3&gt;\n&lt;p&gt;Sample configuration for a homogeneous set of hosts with disks mounted in the &lt;code&gt;/yt/chunk-store-hdd-1&lt;/code&gt;, &lt;code&gt;/yt/chunk-store-hdd-2&lt;/code&gt;, and &lt;code&gt;/yt/chunk-store-ssd-1&lt;/code&gt; directory.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;dataNodes:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;volumes:&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;chunk-store-hdd-1&lt;/spa
