        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"setting-up-prometheus\"&gt;&lt;a href=\"en/admin-guide/monitoring.html#setting-up-prometheus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Setting up Prometheus&lt;/span&gt;&lt;/a&gt;Setting up Prometheus&lt;/h2&gt;\n&lt;h3 id=\"prerequisites\"&gt;&lt;a href=\"en/admin-guide/monitoring.html#prerequisites\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Prerequisites&lt;/span&gt;&lt;/a&gt;Prerequisites&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://github.com/prometheus-operator/prometheus-operator#quickstart\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Follow the instructions&lt;/a&gt; to install the Prometheus operator.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"launch\"&gt;&lt;a href=\"en/admin-guide/monitoring.html#launch\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Launch&lt;/span&gt;&lt;/a&gt;Launch&lt;/h3&gt;\n&lt;p&gt;Monitoring services are created by the YTsaurus operator automatically. To collect metrics, you need to:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Create &lt;a href=\"https://github.com/ytsaurus/yt-k8s-operator/blob/main/config/samples/prometheus/prometheus_service_monitor.yaml\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ServiceMonitor&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Create a &lt;a href=\"https://github.com/ytsaurus/yt-k8s-operator/blob/main/config/samples/prometheus/prometheus_service_account.yaml\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;service account&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Give the account you created a &lt;a href=\"https://github.com/ytsaurus/yt-k8s-operator/blob/main/config/samples/prometheus/prometheus_role_binding.yaml\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;role&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://github.com/ytsaurus/yt-k8s-operator/blob/main/config/samples/prometheus/prometheus.yaml\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Create Prometheus&lt;/a&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"monitoring-methods-and-important-ytsaurus-metrics\"&gt;&lt;a href=\"en/admin-guide/monitoring.html#monitoring-methods-and-important-ytsaurus-metrics\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Monitoring methods and important YTsaurus metrics&lt;/span&gt;&lt;/a&gt;Monitoring methods and important YTsaurus metrics&lt;/h2&gt;\n&lt;p&gt;The monitoring of technical systems can be roughly classified into two general approaches: let's call them qualitative monitoring and quantitative monitoring.&lt;/p&gt;\n&lt;h3 id=\"qualitative-monitoring\"&gt;&lt;a href=\"en/admin-guide/monitoring.html#qualitative-monitoring\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qualitative monitoring&lt;/span&gt;&lt;/a&gt;Qualitative monitoring&lt;/h3&gt;\n&lt;p&gt;Qualitative monitoring verifies whether a system can perform its basic functions. This is done by running test tasks, or checks. These checks return a qualitative description of the system state:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The system runs normally (OK).&lt;/li&gt;\n&lt;li&gt;The system doesn't work (CRITICAL).&lt;/li&gt;\n&lt;li&gt;The system works, but with deviations from the normal mode (WARNING).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;A list of the most important qualitative checks in YTsaurus:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;sort_result&lt;/code&gt;: Starts a sort operation on a small test table, waits for its completion, and checks the sorting result.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;map_result&lt;/code&gt;: Starts a map operation with a small test table as an input, waits for its completion, and checks the map result.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;dynamic_table_commands&lt;/code&gt;: Checks the operability of dynamic tables by going over their entire life cycle: creates a test table, mounts the table, writes data to the table and reads data from it, then unmounts and deletes the table.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;There are checks of the self-diagnosis messages of the YTsaurus cluster's subsystems:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;master_alerts&lt;/code&gt;: Checks the &lt;code&gt;//sys/@master_alerts&lt;/code&gt; attribute value.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;scheduler_alerts&lt;/code&gt;: Checks the &lt;code&gt;//sys/scheduler/@alerts&lt;/code&gt; attribute value.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;controller_agent_alerts&lt;/code&gt;: Reads the alerts attribute from all nodes at &lt;code&gt;//sys/controller_agents/instances&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;lost_vital_chunks&lt;/code&gt;: Checks that the lost_vital_chunks counter is zero at &lt;code&gt;//sys/lost_vital_chunks/@count&lt;/code&gt;. Learn more about vitality &lt;a href=\"user-guide/storage/chunks.html#vitality\"&gt;here&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;tablet_cells&lt;/code&gt;: Checks that dynamic tables don't have any tablet cells in failed status.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;quorum_health&lt;/code&gt;: Checks that all masters are operational and in quorum.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The implementation of these checks can be viewed in &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/odin\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Odin&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;In its current implementation, Odin doesn't support alerts: it can only run checks, save the results to a dynamic table, and display them in the UI.&lt;/p&gt;\n&lt;h3 id=\"quantitative-monitoring\"&gt;&lt;a href=\"en/admin-guide/monitoring.html#quantitative-monitoring\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Quantitative monitoring&lt;/span&gt;&lt;/a&gt;Quantitative monitoring&lt;/h3&gt;\n&lt;p&gt;Quantitative monitoring evaluates metrics collected in the form of time series from various cluster's subsystems. They can be used to assess load and resource consumption trends and pre-empt cluster problems that would be noticeable to the user.&lt;/p&gt;\n&lt;p&gt;Some important quantitative metrics in Prometheus:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;yt_resource_tracker_total_cpu{service=\"yt-master\", thread=\"Automaton\"}&lt;/code&gt;: Load on Automaton, the master's main thread of execution. The load shouldn't exceed 90%.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt_resource_tracker_memory_usage_rss{service=\"yt-master\"}&lt;/code&gt;: Memory consumption by the master. The threshold must be just under half of the container's memory. The master performs fork to write a snapshot, so there must be a double memory margin.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt_resource_tracker_memory_usage_rss&lt;/code&gt;: A metric that is also important for other cluster components. It enables you to assess the memory consumption trend to avoid Out of Memory events.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt_changelogs_available_space{service=\"yt-master\"}&lt;/code&gt;: Free space for changelogs. There is a changelogs storage setting in the master's configuration file. The amount of free space must exceed the value of this setting.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt_snapshots_available_space{service=\"yt-master\"}&lt;/code&gt;: The same for snapshots.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt_logging_min_log_storage_available_space{service=\"yt-master\"}&lt;/code&gt;: The same for logs.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;In addition, you should monitor increases in chunks in bad states:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;yt_chunk_server_underreplicated_chunk_count&lt;/code&gt;: The number of chunks that have fewer replicas on cluster disks than specified in the replication_factor attribute. A continual growth in the number of underreplicated chunks may indicate that your &lt;a href=\"user-guide/storage/media.html\"&gt;media&lt;/a&gt; settings prevent replication_factor conditions from being met in the current cluster configuration. You can view the number of underreplicated chunks at //sys/underreplicated_chunks/@count.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt_chunk_server_parity_missing_chunk_count&lt;/code&gt; and &lt;code&gt;yt_chunk_server_data_missing_chunk_count&lt;/code&gt;: A continual growth of parity_missing_chunk or data_missing_chunk attribute values can be caused by the erasure repair process not keeping up with the breakdown when hosts or disks fail. You can view the number of parity_missing and data_missing chunks at //sys/parity_missing_chunks/@count and //sys/data_missing_chunks/@count.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;It's important to monitor &lt;a href=\"user-guide/storage/quotas.html\"&gt;quotas&lt;/a&gt; of system accounts such as sys, tmp, and intermediate, as well as user quotas of product processes. Example for a sys account:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;yt_accounts_chunk_count{account=\"sys\"} / yt_accounts_chunk_count_limit{account=\"sys\"}&lt;/code&gt;: Percentage of the chunk quota usage.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt_accounts_node_count{account=\"sys\"} / yt_accounts_node_count_limit{account=\"sys\"}&lt;/code&gt;: Percentage of the quota usage per number of Cypress nodes.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt_accounts_disk_space_in_gb{account=\"sys\"} / yt_accounts_disk_space_limit_in_gb{account=\"sys\"}&lt;/code&gt;: Percentage of the disk quota usage.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/admin-guide/monitoring.md","sourcePath":"en/admin-guide/monitoring.md"},"headings":[{"title":"Setting up Prometheus","href":"en/admin-guide/monitoring.html#setting-up-prometheus","level":2,"items":[{"title":"Prerequisites","href":"en/admin-guide/monitoring.html#prerequisites","level":3},{"title":"Launch","href":"en/admin-guide/monitoring.html#launch","level":3}]},{"title":"Monitoring methods and important YTsaurus metrics","href":"en/admin-guide/monitoring.html#monitoring-methods-and-important-ytsaurus-metrics","level":2,"items":[{"title":"Qualitative monitoring","href":"en/admin-guide/monitoring.html#qualitative-monitoring","level":3},{"title":"Quantitative monitoring","href":"en/admin-guide/monitoring.html#quantitative-monitoring","level":3}]}],"title":"Monitoring"},"router":{"pathname":"en/admin-guide/monitoring","depth":3,"base":"../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
