        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;The YTsaurus web interface offers two types of user authentication: password-based authentication and single sign-on (&lt;a href=\"https://en.wikipedia.org/wiki/Single_sign-on\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;SSO&lt;/a&gt;). To learn more about using passwords, see the &lt;a href=\"user-guide/storage/auth\"&gt;User manual&lt;/a&gt;. This article explains how to configure SSO.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;YTsaurus supports SSO authentication exclusively through the &lt;a href=\"https://oauth.net/2/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;OAuth 2.0&lt;/a&gt; protocol. When configuring SSO, choose an identity server that supports OAuth.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"configuration\"&gt;&lt;a href=\"en/admin-guide/oauth.html#configuration\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Configuration&lt;/span&gt;&lt;/a&gt;Configuration&lt;/h2&gt;\n&lt;p&gt;To implement proper authentication, you need to configure two components: a proxy and a web interface.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;To set up a proxy, fill in the &lt;code&gt;oauthService&lt;/code&gt; field in the ytsaurus &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/blob/main/docs/api.md#ytsaurusspec\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;resource specification&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;To configure the web interface, set the &lt;a href=\"https://github.com/ytsaurus/ytsaurus-ui/blob/main/packages/ui/docs/configuration.md#oauth\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ytOAuthSettings&lt;/a&gt; parameter in the web interface config file. You can do this via &lt;a href=\"https://github.com/ytsaurus/ytsaurus-ui/blob/main/packages/ui-helm-chart/values.yaml#L80-L89\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ui-helm-chart&lt;/a&gt; by filling in the &lt;code&gt;settings.oauth&lt;/code&gt; field in &lt;code&gt;values.yaml&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"example\"&gt;&lt;a href=\"en/admin-guide/oauth.html#example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h3&gt;\n&lt;p&gt;Below is an example demonstrating how to set up SSO authentication in YTsaurus using &lt;a href=\"https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-auth-code-flow\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Microsoft Identity Platform&lt;/a&gt;.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;First, create an OAuth app in MS Identity Platform. For RedirectURIs, specify &lt;code&gt;https://&amp;lt;HOST_NAME_OF_YOUR_YT_CLUSTER&amp;gt;/api/oauth/callback&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;When creating the app, you'll receive a &lt;code&gt;CLIENT_ID&lt;/code&gt; and a &lt;code&gt;CLIENT_SECRET&lt;/code&gt;. You'll also need to specify the &lt;code&gt;TENANT_ID&lt;/code&gt;. You can get it from your OAuth server administrator. You'll need to enter the received parameters in the web interface specification.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Next, configure the server:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-comment\"&gt;# ytsaurus.yaml&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;apiVersion:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;cluster.ytsaurus.tech/v1&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;kind:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Ytsaurus&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ytdemo&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;oauthService:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;host:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;graph.microsoft.com&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;port:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;443&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;secure:&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;userInfoHandler:&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;endpoint:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;oidc/userinfo&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;loginField:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;email&lt;/span&gt;\n  &lt;span class=\"hljs-comment\"&gt;# ...&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"50\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-50\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-50\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-50.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Your web interface settings should look like this:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-comment\"&gt;# ui-helm.values.yaml&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;ui:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;image:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;repository:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ghcr.io/ytsaurus/ui&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# ...&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;settings:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;oauth:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;enabled:&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;baseURL:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"https://login.microsoftonline.com/mycompany.onmicrosoft.com/oauth2/v2.0/\"&lt;/span&gt; &lt;span class=\"hljs-comment\"&gt;# mycompany.onmicrosoft.com is a tenant ID example&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;authPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"authorize\"&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;logoutPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"logout\"&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;tokenPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"token\"&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;clientIdEnvName:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"CLIENT_ID\"&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;clientSecretEnvName:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"CLIENT_SECRET\"&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;scope:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"openid offline_access\"&lt;/span&gt; &lt;span class=\"hljs-comment\"&gt;# offline_access scope is required for api to respond with refresh_token&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;buttonLabel:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Login via SSO\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"56\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-56\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-56\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-56.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"implementation-details\"&gt;&lt;a href=\"en/admin-guide/oauth.html#implementation-details\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Implementation details&lt;/span&gt;&lt;/a&gt;Implementation details&lt;/h2&gt;\n&lt;p&gt;Below is an overview of the OAuth workflow. Understanding it will help you identify potential issues in your configuration.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The user opens the YTsaurus web interface and clicks \"Login via SSO\".&lt;/li&gt;\n&lt;li&gt;The YTsaurus web interface redirects them to the URL of a third-party OAuth identity server, forwarding the configured &lt;code&gt;scopes&lt;/code&gt;. The URL of the third-party server is generated from &lt;code&gt;baseURL&lt;/code&gt; and &lt;code&gt;authPath&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;The user agrees to grant the requested permissions, and the OAuth identity server redirects them to the address specified in the OAuth app settings: &lt;code&gt;https://&amp;lt;HOST_NAME_OF_YOUR_YT_CLUSTER&amp;gt;/api/oauth/callback&lt;/code&gt;. The authorization code is passed in the &lt;code&gt;code&lt;/code&gt; query parameter.&lt;/li&gt;\n&lt;li&gt;The web interface makes a request to the OAuth identity server using the URL generated from &lt;code&gt;baseURL&lt;/code&gt; and &lt;code&gt;tokenPath&lt;/code&gt;. The request passes the authorization code and the app secret. The response contains &lt;code&gt;access_token&lt;/code&gt; and &lt;code&gt;refresh_token&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;The web interface stores the tokens in the user's browser cookies: &lt;code&gt;yt_oauth_access_token&lt;/code&gt; and &lt;code&gt;yt_oauth_refresh_token&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;When &lt;code&gt;yt_oauth_access_token&lt;/code&gt; expires, the web interface updates it using &lt;code&gt;yt_oauth_refresh_token&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;The web interface sends a request to the proxy, passing the value of the &lt;code&gt;yt_oauth_access_token&lt;/code&gt; cookie. The proxy makes a request to the OAuth identity server via a URL generated from &lt;code&gt;oauthService.host&lt;/code&gt;, &lt;code&gt;oauthService.port&lt;/code&gt;, and &lt;code&gt;oauthService.userInfoHandler.endpoint&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;The received response contains the field configured in &lt;code&gt;oauthService.userInfoHandler.loginField&lt;/code&gt;, which is used as the username in YTsaurus.&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"},{"property":"og:title","content":"Authentication in YTsaurus"},{"property":"og:description","content":"How to set up SSO in the YTsaurus web interface via OAuth 2.0."},{"property":"og:type","content":"article"},{"property":"og:url","content":"https://ytsaurus.tech/docs/ru/admin-guide/oauth"},{"property":"article:section","content":"auth"},{"property":"article:modified_time","content":"2025-01-22T20:00:00+03:00"},{"property":"article:author","content":"Kirill Sibirev"}],"vcsPath":"en/admin-guide/oauth.md","sourcePath":"en/admin-guide/oauth.md"},"headings":[{"title":"Configuration","href":"en/admin-guide/oauth.html#configuration","level":2,"items":[{"title":"Example","href":"en/admin-guide/oauth.html#example","level":3}]},{"title":"Implementation details","href":"en/admin-guide/oauth.html#implementation-details","level":2}],"title":"Setting up SSO"},"router":{"pathname":"en/admin-guide/oauth","depth":3,"base":"../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
