        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;The server components of the YTsaurus cluster generate detailed logs that can be used to audit and analyze problems during operation. For production installations, we recommend allocating dedicated &lt;a href=\"admin-guide/locations.html\"&gt;storage locations on persistent volumes&lt;/a&gt; for these logs. Absence of logs can significantly complicate support.&lt;/p&gt;\n&lt;p&gt;You can use Prometheus metrics with the &lt;code&gt;yt_logging_*&lt;/code&gt; prefix to analyze the logging subsystem.&lt;/p&gt;\n&lt;h2 id=\"debug_logs\"&gt;&lt;a href=\"en/admin-guide/logging.html#debug_logs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Debugging logs&lt;/span&gt;&lt;/a&gt;Debugging logs&lt;/h2&gt;\n&lt;p&gt;Debugging logs are described in the &lt;code&gt;loggers&lt;/code&gt; section of the YTsaurus component specification.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Table 1 — YTsaurus debug logger settings&lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Field&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Possible values&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;arbitrary string&lt;/td&gt;\n&lt;td&gt;The logger name (we recommend choosing short and clear names like &lt;code&gt;debug&lt;/code&gt; or &lt;code&gt;info&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;format&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;plain_text&lt;/code&gt; (default), &lt;code&gt;yson&lt;/code&gt;, &lt;code&gt;json&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The format of the log string.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;minLogLevel&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;trace&lt;/code&gt;, &lt;code&gt;debug&lt;/code&gt;, &lt;code&gt;info&lt;/code&gt;, &lt;code&gt;error&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The minimum level for records that reach the log.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;categoriesFilter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;A filter that only lets you write logs from some subsystems (see &lt;a href=\"en/admin-guide/logging.html#debug_log_categories\"&gt;below&lt;/a&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;writerType&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;file&lt;/code&gt;, &lt;code&gt;stderr&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Write logs to a file or stderr. When writing to stderr, the rotation settings are ignored.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;compression&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;none&lt;/code&gt; (default), &lt;code&gt;gzip&lt;/code&gt;, &lt;code&gt;zstd&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;If a value other than &lt;code&gt;none&lt;/code&gt; is set, the YTsaurus server will write compressed logs.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;useTimestampSuffix&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;, &lt;code&gt;false&lt;/code&gt; (default)&lt;/td&gt;\n&lt;td&gt;If &lt;code&gt;true&lt;/code&gt;, a timestamp is added to the file name when it's opened or on rotation. At the same time, the numbering mechanism doesn't apply to old segments. This option is only relevant when writing to a file.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;rotationPolicy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Log rotation settings (see &lt;a href=\"en/admin-guide/logging.html#log_rotation\"&gt;below&lt;/a&gt;). This option is only relevant when writing to a file.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;The path to the directory for logs with &lt;code&gt;writerType=file&lt;/code&gt; is set in the &lt;code&gt;Logs&lt;/code&gt; type location description. If no &lt;code&gt;Logs&lt;/code&gt; location is specified, they are written to &lt;code&gt;/var/log&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Log file names follow the format &lt;code&gt;[component].[name].log(.[format])(.[compression])(.[timestamp_suffix])&lt;/code&gt;. Examples:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;controller-agent.error.log&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;master.debug.log.gzip&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;scheduler.info.log.json.zstd.2023-01-01T10:30:00&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Debug log entries contain the following fields:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;instant&lt;/code&gt; — the time in the local time zone&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;level&lt;/code&gt; — write level: &lt;code&gt;T&lt;/code&gt; — trace, &lt;code&gt;D&lt;/code&gt; — debug, &lt;code&gt;I&lt;/code&gt; — info, &lt;code&gt;W&lt;/code&gt; — warning, &lt;code&gt;E&lt;/code&gt; — error&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;category&lt;/code&gt; — the name of the subsystem the recording belongs to (for example, &lt;code&gt;ChunkClient&lt;/code&gt;, &lt;code&gt;ObjectServer&lt;/code&gt;, or &lt;code&gt;RpcServer&lt;/code&gt;)&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;message&lt;/code&gt; — message body&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;thread_id&lt;/code&gt; — the ID or name of the thread that generated the entry (only written as &lt;code&gt;plain_text&lt;/code&gt;)&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;fiber_id&lt;/code&gt; — the ID of the fiber that generated the record (only written as &lt;code&gt;plain_text&lt;/code&gt;)&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;trace_id&lt;/code&gt; — the trace_context ID the recording appeared for (only written as &lt;code&gt;plain_text&lt;/code&gt;)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sample entry&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;2023-09-15 00:00:17,215385      I       ExecNode        Artifacts prepared (JobId: d15d7d5f-164ff08a-3fe0384-128e0, OperationId: cd56ab80-d21ef5ab-3fe03e8-d05edd49, JobType: Map)      Job     fff6d4149ccdf656    2bd5c3c9-600a44f5-de721d58-fb905017\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"188\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-188\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-188\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-188.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h3 id=\"debug_log_categories\"&gt;&lt;a href=\"en/admin-guide/logging.html#debug_log_categories\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Recommendations for configuring categories&lt;/span&gt;&lt;/a&gt;Recommendations for configuring categories&lt;/h3&gt;\n&lt;p&gt;There are two types of category filters (&lt;code&gt;categoriesFilter&lt;/code&gt;):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;inclusive — records are only written for categories that were explicitly listed&lt;/li&gt;\n&lt;li&gt;exclusive — records are written for any categories except those that are listed&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;In large installations, you often need to exclude the &lt;code&gt;Bus&lt;/code&gt; and &lt;code&gt;Concurrency&lt;/code&gt; categories.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sample filters&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;categoriesFilter:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;type:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;exclude&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;values:&lt;/span&gt; [&lt;span class=\"hljs-string\"&gt;\"Bus\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"Concurrency\"&lt;/span&gt;]\n\n&lt;span class=\"hljs-attr\"&gt;categoriesFilter:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;type:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;include&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;values:&lt;/span&gt; [&lt;span class=\"hljs-string\"&gt;\"Scheduler\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"Strategy\"&lt;/span&gt;]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"217\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-217\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-217\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-217.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"structured_logs\"&gt;&lt;a href=\"en/admin-guide/logging.html#structured_logs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Structured logs&lt;/span&gt;&lt;/a&gt;Structured logs&lt;/h2&gt;\n&lt;p&gt;Some YTsaurus components can generate structured logs, which you can later use for auditing, analytics, and automatic processing. Structured logs are described in the &lt;code&gt;structured_loggers&lt;/code&gt; section of the YTsaurus component specification.&lt;/p&gt;\n&lt;p&gt;Structured loggers are described using the same fields as debugging logs, except:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;writerType&lt;/code&gt; — not set (structured logs are always written to a file)&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;categoriesFilter&lt;/code&gt; — the required &lt;code&gt;category&lt;/code&gt; field is set instead and is equal to one category&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Structured logs should always be written in a structured format: &lt;code&gt;JSON&lt;/code&gt; or &lt;code&gt;YSON&lt;/code&gt;. Events in a structured log are usually recorded at the &lt;code&gt;info&lt;/code&gt; level. The set of structured log fields varies depending on the specific log type.&lt;/p&gt;\n&lt;p&gt;The main types of structured logs:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;master_access_log&lt;/code&gt; — data access log (written on the master, &lt;code&gt;Access&lt;/code&gt; category)&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;master_security_log&lt;/code&gt; — log of security events like adding a user to a group or modifying an ACL (written on the master, &lt;code&gt;SecurityServer&lt;/code&gt; category)&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;structured_http_proxy_log&lt;/code&gt; — log of requests to http proxy, one line per request (written on http proxy, &lt;code&gt;HttpStructuredProxy&lt;/code&gt; category)&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;chyt_log&lt;/code&gt; — log of requests to CHYT, one line per request (written on http proxy, &lt;code&gt;ClickHouseProxyStructured&lt;/code&gt; catgeory)&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;structured_rpc_proxy_log&lt;/code&gt; — log of requests to rpc proxy, one line per request (written on rpc proxy, &lt;code&gt;RpcProxyStructuredMain&lt;/code&gt; category)&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;scheduler_event_log&lt;/code&gt; — scheduler event log, written by the scheduler (&lt;code&gt;SchedulerEventLog&lt;/code&gt; category)&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;controller_event_log&lt;/code&gt; — log of controller agent events, written on the controller agent (&lt;code&gt;ControllerEventLog&lt;/code&gt; category)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"access_log\"&gt;&lt;a href=\"en/admin-guide/logging.html#access_log\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Table access log&lt;/span&gt;&lt;/a&gt;Table access log&lt;/h3&gt;\n&lt;p&gt;Sometimes, you may need to know who's using a particular table, for example, to evaluate the consequences of it being moved or deleted. This might be difficult if the table is accessed by &lt;a href=\"user-guide/storage/objects.html#links\"&gt;links&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;For this, there is a special log that records events involving Cypress nodes that might be of interest to users.&lt;/p&gt;\n&lt;p&gt;Logs are written by master servers. Due to technical reasons, several servers produce the same sequence of entries, so duplication is to be expected. On top of that, some actions (for example, writing to a table) are represented as a sequence of several different events on different master servers (from different shards). This is covered in more detailed below.&lt;/p&gt;\n&lt;p&gt;Each log entry (table row) contains one command applied to a certain Cypress node.&lt;/p&gt;\n&lt;p&gt;Only the commands applied to the following types of nodes are recorded:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Table&lt;/li&gt;\n&lt;li&gt;File&lt;/li&gt;\n&lt;li&gt;Document&lt;/li&gt;\n&lt;li&gt;Journal&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;It must be noted that directories &lt;em&gt;are not included&lt;/em&gt; in this list.&lt;/p&gt;\n&lt;p&gt;The following commands are recorded:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Basic (CRUD):\n&lt;ul&gt;\n&lt;li&gt;Create&lt;/li&gt;\n&lt;li&gt;Get&lt;/li&gt;\n&lt;li&gt;GetKey&lt;/li&gt;\n&lt;li&gt;Exists&lt;/li&gt;\n&lt;li&gt;List&lt;/li&gt;\n&lt;li&gt;Set&lt;/li&gt;\n&lt;li&gt;Remove&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Creating a symbolic link:\n&lt;ul&gt;\n&lt;li&gt;Link&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Locking:\n&lt;ul&gt;\n&lt;li&gt;Lock&lt;/li&gt;\n&lt;li&gt;Unlock&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Copying and moving:\n&lt;ul&gt;\n&lt;li&gt;Copy&lt;/li&gt;\n&lt;li&gt;Move&lt;/li&gt;\n&lt;li&gt;BeginCopy, EndCopy&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Reading and writing data:\n&lt;ul&gt;\n&lt;li&gt;GetBasicAttributes&lt;/li&gt;\n&lt;li&gt;Fetch&lt;/li&gt;\n&lt;li&gt;BeginUpload&lt;/li&gt;\n&lt;li&gt;EndUpload&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Changing the state of a dynamic table:\n&lt;ul&gt;\n&lt;li&gt;PrepareMount, CommitMount, AbortMount&lt;/li&gt;\n&lt;li&gt;PrepareUnmount, CommitUnmount, AbortUnmount&lt;/li&gt;\n&lt;li&gt;PrepareRemount, CommitRemount, AbortRemount&lt;/li&gt;\n&lt;li&gt;PrepareFreeze, CommitFreeze, AbortFreeze&lt;/li&gt;\n&lt;li&gt;PrepareUnfreeze, CommitUnfreeze, AbortUnfreeze&lt;/li&gt;\n&lt;li&gt;PrepareReshard, CommitReshard, AbortReshard&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Other:\n&lt;ul&gt;\n&lt;li&gt;CheckPermission&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Below you can find some comments on the command semantics.&lt;/p&gt;\n&lt;p&gt;Each log entry has certain fields (table columns), which are represented in Table 1.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Table 1 — Description of log fields&lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Field&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;instant&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Event time in the format &lt;code&gt;YYYY-MM-DD hh:mm:ss,sss&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;cluster&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Short cluster name&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;method&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Command (see the above list)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt; (see Note)&lt;/td&gt;\n&lt;td&gt;Path passed to the command as an argument&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;original_path&lt;/code&gt; (see Note)&lt;/td&gt;\n&lt;td&gt;Path passed to the command as an argument&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;destination_path&lt;/code&gt; (see Note)&lt;/td&gt;\n&lt;td&gt;Destination path for the Copy, Move, and Link commands (not applicable to other commands)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;original_destination_path&lt;/code&gt; (see Note)&lt;/td&gt;\n&lt;td&gt;Destination path for the Copy, Move, and Link commands (not applicable to other commands)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;User who gave the command&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Type of node created with the Create command (not applicable to other commands)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_info&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Information about the transaction where the command was executed (not applicable to cases where the command was executed outside of a transaction)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The difference between &lt;code&gt;original_path&lt;/code&gt; and &lt;code&gt;path&lt;/code&gt; (as well as between &lt;code&gt;original_destination_path&lt;/code&gt; and &lt;code&gt;destination_path&lt;/code&gt;) is as follows:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;If a link (symbolic link) was specified as a path, &lt;code&gt;original_path&lt;/code&gt; will contain the path to the link, whereas &lt;code&gt;path&lt;/code&gt; will contain the actual path to the node.&lt;/li&gt;\n&lt;li&gt;If this path leads to a shard, its log will feature the actual path under &lt;code&gt;original_path&lt;/code&gt;, while the path relative to the root of the shard will be written in &lt;code&gt;path&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Overall, this means that if you grep a relative path to a symbolic link, the command will always return entries containing the actual path to the node, while grepping the actual path finds accesses, including via symbolic links. &lt;strong&gt;The key takeaway here is that you should search both by &lt;code&gt;path&lt;/code&gt; and by &lt;code&gt;original_path&lt;/code&gt;.&lt;/strong&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;The structure of the &lt;code&gt;transaction_info&lt;/code&gt; field is shown in Table 2.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Table 2 — Structure of the &lt;code&gt;transaction_info&lt;/code&gt; field&lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Field&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Transaction ID&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_title&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Human-readable description of the transaction (specified by the client upon transaction start; the field is missing if the description wasn't specified)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;ID of the operation associated with the transaction&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_title&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Human-readable description of the operation associated with the transaction&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parent&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;For a nested transaction, the description of its parent (for top-level transactions, the field is missing)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Please note that the &lt;code&gt;parent&lt;/code&gt; field is structured the same way as &lt;code&gt;transaction_info&lt;/code&gt;. Thus, &lt;code&gt;transaction_info&lt;/code&gt; contains the full recursive description of the ancestry of the transaction where the command was run.&lt;/p&gt;\n&lt;h4 id=\"notes\"&gt;&lt;a href=\"en/admin-guide/logging.html#notes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Notes&lt;/span&gt;&lt;/a&gt;Notes&lt;/h4&gt;\n&lt;ol&gt;\n&lt;li&gt;The reading and writing of metadata needs to be distinguished from the reading and writing of data (chunks) to tables and files.&lt;/li&gt;\n&lt;li&gt;From a master's point of view, data reads/writes look like the following sequence of commands:\n&lt;ul&gt;\n&lt;li&gt;Reading:\n&lt;ul&gt;\n&lt;li&gt;GetBasicAttributes: Getting some service attributes necessary for reading.&lt;/li&gt;\n&lt;li&gt;Fetch: Getting a list of chunks that make up the file or table.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Writing:\n&lt;ul&gt;\n&lt;li&gt;GetBasicAttributes: Getting some service attributes necessary for writing.&lt;/li&gt;\n&lt;li&gt;BeginUpload: Starting the upload transaction.&lt;/li&gt;\n&lt;li&gt;EndUpload: Completing the upload transaction.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;When reading/writing data, the GetBasicAttributes command targets one cell, while Fetch, BeginUpload, and EndUpload target another — this is normal.&lt;/li&gt;\n&lt;li&gt;In most cases, copying or moving a table looks like the Copy or Move commands. The BeginCopy and EndCopy commands are used when copying/moving crosses the Cypress sharding boundaries. In practice, such cases are rare.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"http_proxy_log\"&gt;&lt;a href=\"en/admin-guide/logging.html#http_proxy_log\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HTTP Proxy request log&lt;/span&gt;&lt;/a&gt;HTTP Proxy request log&lt;/h3&gt;\n&lt;p&gt;This log contains entries for all requests handled by the HTTP proxy.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Table 2 — Description of log fields&lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Field&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;instant&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Event time in the format &lt;code&gt;YYYY-MM-DD hh:mm:ss,sss&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;cluster&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Short name of the cluster&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;request_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Identifier of the request&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;correlation_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Special request identifier generated by the client and unchanged in case of retries&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;User making the request&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;method&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;HTTP request method&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;http_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;HTTP request path&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_agent&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Contents of the &lt;code&gt;User-Agent&lt;/code&gt; header in the request&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;command&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"api/commands.html\"&gt;Command&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parameters&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Parameters of the command&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Value of the &lt;code&gt;path&lt;/code&gt; parameter&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;error&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Structured description of the error if the request failed&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;error_code&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Error code if the request failed&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;http_code&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;HTTP response code for the request&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;start_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Actual start time of the request execution on the proxy&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;cpu_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Time spent by the proxy for request execution (excluding time spent in other cluster components)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;duration&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Total duration of the request&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;in_bytes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Size of the request data in bytes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;out_bytes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Size of the response data in bytes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;remote_address&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Address from which the request originated&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"log_rotation\"&gt;&lt;a href=\"en/admin-guide/logging.html#log_rotation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Configuring log rotation&lt;/span&gt;&lt;/a&gt;Configuring log rotation&lt;/h2&gt;\n&lt;p&gt;For debug and structured logs written to a file, you can configure the built-in rotation mechanism (the &lt;code&gt;rotationPolicy&lt;/code&gt; field). The rotation settings are detailed in the table. If the &lt;code&gt;useTimestampSuffix&lt;/code&gt; option isn't enabled, an index number is appended to the file names of old segments on rotation.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Table 3 — Log rotation settings &lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Field&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;rotationPeriodMilliseconds&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Rotation period in milliseconds. Can be set together with &lt;code&gt;maxSegmentSize&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;maxSegmentSize&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Log segment size limit in bytes. Can be set together with &lt;code&gt;rotationPeriodMilliseconds&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;maxTotalSizeToKeep&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Total segment size limit in bytes. At the time of rotation, the oldest logs are deleted to meet the limit.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;maxSegmentCountToKeep&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Limit on the number of stored log segments. The oldest segments over the limit are deleted.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"log_dynamic_configuration\"&gt;&lt;a href=\"en/admin-guide/logging.html#log_dynamic_configuration\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dynamic configuration&lt;/span&gt;&lt;/a&gt;Dynamic configuration&lt;/h2&gt;\n&lt;p&gt;Components that support dynamic configuration let you further refine the logging system settings using the dynamic config in Cypress (&lt;code&gt;logging&lt;/code&gt; section).&lt;/p&gt;\n&lt;p&gt;Basic parameters:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;enable_anchor_profiling&lt;/code&gt; — enables Prometheus metrics for individual record prefixes&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;min_logged_message_rate_to_profile&lt;/code&gt; — the minimum message frequency for inclusion in a separate metric&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;suppressed_messaged&lt;/code&gt; — a list of debug log message prefixes to be excluded from logging&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Configuration example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{\n  logging = {\n    enable_anchor_profiling = %true;\n    min_logged_message_rate_to_profile = 100;\n    suppressed_messaged = [\n      \"Skipping out of turn block\",\n      \"Request attempt started\",\n      \"Request attempt acknowledged\"\n    ];\n  }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1025\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1025\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1025\" attributeName=\"visibi
