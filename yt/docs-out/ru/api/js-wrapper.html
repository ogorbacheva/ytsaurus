        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Враппер для запросов к кластерам YTsaurus, который использует HTTP API YTsaurus с наиболее приближенным к нему интерфейсом.&lt;/p&gt;\n&lt;h2 id=\"ustanovka\"&gt;&lt;a href=\"ru/api/js-wrapper.html#ustanovka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка&lt;/span&gt;&lt;/a&gt;Установка&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;npm install @ytsaurus/javascript-wrapper&lt;/code&gt;&lt;/p&gt;\n&lt;h2 id=\"podklyuchenie-i-ispolzovanie\"&gt;&lt;a href=\"ru/api/js-wrapper.html#podklyuchenie-i-ispolzovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подключение и использование&lt;/span&gt;&lt;/a&gt;Подключение и использование&lt;/h2&gt;\n&lt;p&gt;Библиотека написана в стиле CommonJS - можно использовать в nodejs-приложениях или собирать зависимости с помощью Webpack.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs javascript\"&gt;    &lt;span class=\"hljs-keyword\"&gt;const&lt;/span&gt; yt = &lt;span class=\"hljs-built_in\"&gt;require&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;'@ytsaurus/javascript-wrapper'&lt;/span&gt;)()\n\n    &lt;span class=\"hljs-comment\"&gt;// Позволяет задать настройки по умолчанию для всех команд.&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;// Если же необходимо работать с несколькими кластерами одновременно, то прокси и токен передаются каждой команде отдельно.&lt;/span&gt;\n    yt.&lt;span class=\"hljs-property\"&gt;setup&lt;/span&gt;.&lt;span class=\"hljs-title function_\"&gt;setGlobalOption&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;'proxy'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'cluster-name.yt.my-domain.com'&lt;/span&gt;);\n    yt.&lt;span class=\"hljs-property\"&gt;setup&lt;/span&gt;.&lt;span class=\"hljs-title function_\"&gt;setGlobalOption&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;'secure'&lt;/span&gt;, &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;);\n\n    yt.&lt;span class=\"hljs-property\"&gt;setup&lt;/span&gt;.&lt;span class=\"hljs-title function_\"&gt;setGlobalOption&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;'authentication'&lt;/span&gt;, {\n        &lt;span class=\"hljs-attr\"&gt;type&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'domain'&lt;/span&gt;\n    });\n\n    yt.&lt;span class=\"hljs-property\"&gt;setup&lt;/span&gt;.&lt;span class=\"hljs-title function_\"&gt;setGlobalOption&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;'timeout'&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;15000&lt;/span&gt;);\n\n    &lt;span class=\"hljs-comment\"&gt;// Пример 1&lt;/span&gt;\n    yt.&lt;span class=\"hljs-property\"&gt;v3&lt;/span&gt;.&lt;span class=\"hljs-title function_\"&gt;get&lt;/span&gt;({ &lt;span class=\"hljs-attr\"&gt;path&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'//sys/users/user/@'&lt;/span&gt; })\n\n    yt.&lt;span class=\"hljs-property\"&gt;v3&lt;/span&gt;.&lt;span class=\"hljs-title function_\"&gt;get&lt;/span&gt;({\n        &lt;span class=\"hljs-attr\"&gt;setup&lt;/span&gt;: {\n            &lt;span class=\"hljs-attr\"&gt;proxy&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'cluster-name.yt.my-domain.com'&lt;/span&gt;,\n            &lt;span class=\"hljs-attr\"&gt;authentication&lt;/span&gt;: {\n                &lt;span class=\"hljs-attr\"&gt;type&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'none'&lt;/span&gt;\n            }\n        },\n        &lt;span class=\"hljs-attr\"&gt;parameters&lt;/span&gt;: { &lt;span class=\"hljs-attr\"&gt;path&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'//sys/users/user/@'&lt;/span&gt; }\n    })\n        .&lt;span class=\"hljs-title function_\"&gt;done&lt;/span&gt;(&lt;span class=\"hljs-keyword\"&gt;function&lt;/span&gt; (&lt;span class=\"hljs-params\"&gt;userAttributes&lt;/span&gt;) {\n            &lt;span class=\"hljs-comment\"&gt;// ...&lt;/span&gt;\n        });\n\n\n    &lt;span class=\"hljs-comment\"&gt;// Пример 2&lt;/span&gt;\n    yt.&lt;span class=\"hljs-property\"&gt;v3&lt;/span&gt;.&lt;span class=\"hljs-title function_\"&gt;set&lt;/span&gt;({ &lt;span class=\"hljs-attr\"&gt;path&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'//sys/users/user/@banned'&lt;/span&gt; }, &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;);\n\n    yt.&lt;span class=\"hljs-property\"&gt;v3&lt;/span&gt;.&lt;span class=\"hljs-title function_\"&gt;set&lt;/span&gt;({\n        &lt;span class=\"hljs-attr\"&gt;setup&lt;/span&gt;: {\n            &lt;span class=\"hljs-attr\"&gt;proxy&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'cluster-name.yt.my-domain.com'&lt;/span&gt;,\n            &lt;span class=\"hljs-attr\"&gt;authentication&lt;/span&gt;: {\n                &lt;span class=\"hljs-attr\"&gt;type&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'oauth'&lt;/span&gt;,\n                &lt;span class=\"hljs-attr\"&gt;token&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'abcdefghijklmnopqrstuvwxyz'&lt;/span&gt;\n            }\n        },\n        &lt;span class=\"hljs-attr\"&gt;parameters&lt;/span&gt;: { &lt;span class=\"hljs-attr\"&gt;path&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'//sys/users/user/@banned'&lt;/span&gt; },\n        &lt;span class=\"hljs-attr\"&gt;data&lt;/span&gt;: &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n    })\n        .&lt;span class=\"hljs-title function_\"&gt;done&lt;/span&gt;(&lt;span class=\"hljs-keyword\"&gt;function&lt;/span&gt; (&lt;span class=\"hljs-params\"&gt;&lt;/span&gt;) {\n            &lt;span class=\"hljs-comment\"&gt;// ...&lt;/span&gt;\n        });\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"15\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-15\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-15\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-15.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Кроме того, библиотеку можно использовать как глобальную переменную.&lt;/p&gt;\n&lt;h2 id=\"nastrojki\"&gt;&lt;a href=\"ru/api/js-wrapper.html#nastrojki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройки&lt;/span&gt;&lt;/a&gt;Настройки&lt;/h2&gt;\n&lt;p&gt;Враппер позволяет задавать глобальные и локальные настройки для каждого запроса.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Имя&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;secure&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;useHeavyProxy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;proxy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;heavyProxy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Number&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;100000&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;useEncodedParameters&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;authentication&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;object&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;{ type: 'none' }&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;dataType&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;encodedParametersSettings&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;object&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;\n{\n    maxSize: 64 * 1024,\n    maxCount: 2,\n    encoder(string) {\n        return window.btoa(utf8.encode(string));\n    }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"141\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-141\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-141\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-141.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"sobytiya\"&gt;&lt;a href=\"ru/api/js-wrapper.html#sobytiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;События&lt;/span&gt;&lt;/a&gt;События&lt;/h2&gt;\n&lt;p&gt;Можно подписаться на события &lt;code&gt;requestStart&lt;/code&gt;, &lt;code&gt;requestEnd&lt;/code&gt;, &lt;code&gt;error&lt;/code&gt;:&lt;/p&gt;\n&lt;pre&gt;&lt;code&gt;yt.subscribe('requestStart', function () {\n    console.log('requestStart');\n});\n&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;Это может быть полезно для отображения лоадера (можно считать, сколько активных запросов) и для логирования ошибок при запросе API.&lt;/p&gt;\n&lt;h2 id=\"komandy\"&gt;&lt;a href=\"ru/api/js-wrapper.html#komandy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Команды&lt;/span&gt;&lt;/a&gt;Команды&lt;/h2&gt;\n&lt;p&gt;О доступных командах можно почитать в разделе &lt;a href=\"api/commands.html\"&gt;Команды&lt;/a&gt;. Единственное отличие заключается в том, что имена команд пишутся в привычном стиле для языка JavaScript, а именно CamelCase.&lt;/p&gt;\n&lt;p&gt;Не все команды реализованы, но могут быть добавлены при надобности. Обычно враппер выдает соответствующую ошибку при отсутствии команды.&lt;/p&gt;\n&lt;p&gt;Общий вид команды:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs javascript\"&gt;&lt;span class=\"hljs-comment\"&gt;// yt.&amp;lt;version&amp;gt;.&amp;lt;command&amp;gt;(&amp;lt;parameters&amp;gt;[, &amp;lt;data&amp;gt;])&lt;/span&gt;\nyt.&lt;span class=\"hljs-property\"&gt;v3&lt;/span&gt;.&lt;span class=\"hljs-title function_\"&gt;get&lt;/span&gt;({ &lt;span class=\"hljs-attr\"&gt;path&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"//home/user/@account\"&lt;/span&gt; });\nyt.&lt;span class=\"hljs-property\"&gt;v3&lt;/span&gt;.&lt;span class=\"hljs-title function_\"&gt;set&lt;/span&gt;({ &lt;span class=\"hljs-attr\"&gt;path&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"//home/user/@account\"&lt;/span&gt; }, &lt;span class=\"hljs-string\"&gt;\"default\"&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"164\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-164\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-164\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-164.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Общий вид команды с возможностью задать локальные настройки:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs javascript\"&gt;&lt;span class=\"hljs-comment\"&gt;/**\n * yt.&amp;lt;version&amp;gt;.&amp;lt;command&amp;gt;({\n *    parameters: &amp;lt;parameters&amp;gt;,\n *    data: &amp;lt;data&amp;gt;,\n *    setup: &amp;lt;setup&amp;gt;\n * })\n */&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;const&lt;/span&gt; setup = { &lt;span class=\"hljs-attr\"&gt;timeout&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;3000&lt;/span&gt; };\nyt.&lt;span class=\"hljs-property\"&gt;v3&lt;/span&gt;.&lt;span class=\"hljs-title function_\"&gt;get&lt;/span&gt;({ setup, &lt;span class=\"hljs-attr\"&gt;parameters&lt;/span&gt;: { &lt;span class=\"hljs-attr\"&gt;path&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"//home/user/@account\"&lt;/span&gt; } });\nyt.&lt;span class=\"hljs-property\"&gt;v3&lt;/span&gt;.&lt;span class=\"hljs-title function_\"&gt;set&lt;/span&gt;({ setup, &lt;span class=\"hljs-attr\"&gt;parameters&lt;/span&gt;: { &lt;span class=\"hljs-attr\"&gt;path&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"//home/user/@account\"&lt;/span&gt; } }, &lt;span class=\"hljs-string\"&gt;\"default\"&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"168\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-168\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-168\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-168.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"konstanty-dlya-kodov-oshibok\"&gt;&lt;a href=\"ru/api/js-wrapper.html#konstanty-dlya-kodov-oshibok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Константы для кодов ошибок&lt;/span&gt;&lt;/a&gt;Константы для кодов ошибок&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Константа&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Код&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;yt.codes.GENERAL_ERROR&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;yt.codes.NODE_DOES_NOT_EXIST&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;500&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;yt.codes.NODE_ALREADY_EXISTS&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;501&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;yt.codes.PERMISSION_DENIED&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;901&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;yt.codes.USER_IS_BANNED&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;903&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;yt.codes.USER_EXCEEDED_RPS&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;904&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"poleznye-ssylki\"&gt;&lt;a href=\"ru/api/js-wrapper.html#poleznye-ssylki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Полезные ссылки&lt;/span&gt;&lt;/a&gt;Полезные ссылки&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/YTsaurus/YTsaurus/blob/main/yt/yt/client/driver/driver.cpp\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Регистрация команд по версиям на бэкенде&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/api/js-wrapper.md","sourcePath":"ru/api/js-wrapper.md"},"headings":[{"title":"Установка","href":"ru/api/js-wrapper.html#ustanovka","level":2},{"title":"Подключение и использование","href":"ru/api/js-wrapper.html#podklyuchenie-i-ispolzovanie","level":2},{"title":"Настройки","href":"ru/api/js-wrapper.html#nastrojki","level":2},{"title":"События","href":"ru/api/js-wrapper.html#sobytiya","level":2},{"title":"Команды","href":"ru/api/js-wrapper.html#komandy","level":2},{"title":"Константы для кодов ошибок","href":"ru/api/js-wrapper.html#konstanty-dlya-kodov-oshibok","level":2},{"title":"Полезные ссылки","href":"ru/api/js-wrapper.html#poleznye-ssylki","level":2}],"title":"YTsaurus JavaScript Wrapper (Browser + Node.js)"},"router":{"pathname":"ru/api/js-wrapper","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
