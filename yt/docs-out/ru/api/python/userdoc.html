t;В YTsaurus хранятся структурированные данные, никакого предопределенного текстового представления у них нет, все джобы работают в стриминг режиме, и пользователю необходимо явно указать, в каком виде его скрипт ожидает увидеть данные во входном потоке. В противоположность этому, работая с данными в python-функции вы тоже получаете их в структурированном виде. Между структурированным видом данных в YTsaurus и в python можно построить соответствие, а промежуточный формат, который будет использован при передаче данных в джоб, уже не так важен.&lt;/p&gt;\n&lt;p&gt;Важно понимать, что идеального взаимооднозначного соответствия между структурированными данными в YTsaurus и dict-ами в python нет, поэтому существуют разные особенности, про которые будет рассказано далее.&lt;/p&gt;\n&lt;h4 id=\"structured_data\"&gt;&lt;a href=\"ru/api/python/userdoc.html#structured_data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Структурированное представление данных&lt;/span&gt;&lt;/a&gt;Структурированное представление данных&lt;/h4&gt;\n&lt;p&gt;Существуют следующие важные особенности представления структурированных данных в python:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Объекты в табличных записях в YTsaurus могут иметь &lt;a href=\"user-guide/storage/attributes.html\"&gt;атрибуты&lt;/a&gt; (это относится только к колонкам типа any). Для их представления в библиотеке заведены &lt;a href=\"http://pydoc.ytsaurus.tech/yt.yson.html#module-yt.yson.yson_types\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;специальные типы&lt;/a&gt;, которые унаследованы от стандартных python-типов, но еще имеют поле &lt;code&gt;attributes&lt;/code&gt;. Так как создание custom объектов является дорогой процедурой, то по умолчанию такой объект создается, только если у него есть атрибуты. Чтобы регулировать данное поведение существует опция: &lt;code&gt;always_create_attributes&lt;/code&gt;. Сравнение yson типов происходит следующим образом: сначала сравниваются значения базовых типов, а затем сравниваются атрибуты. Если атрибуты не равны (в том числе если у одного объекта есть атрибуты, а у другого нет), то объекты считаются не равными. Это стоит учитывать при сравнении с базовыми типами в python: чтобы не зависеть от наличия атрибутов у объекта стоит явно приводить объект к базовому типу.&lt;/p&gt;\n&lt;p&gt;Поясняющий пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.yson &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yson\ns = yson.YsonString(&lt;span class=\"hljs-string\"&gt;b\"a\"&lt;/span&gt;)\ns == &lt;span class=\"hljs-string\"&gt;b\"a\"&lt;/span&gt; &lt;span class=\"hljs-comment\"&gt;# True&lt;/span&gt;\ns.attributes[&lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;] = &lt;span class=\"hljs-string\"&gt;\"c\"&lt;/span&gt;\ns == &lt;span class=\"hljs-string\"&gt;b\"a\"&lt;/span&gt; &lt;span class=\"hljs-comment\"&gt;# False&lt;/span&gt;\n\n&lt;span class=\"hljs-built_in\"&gt;bytes&lt;/span&gt;(s) == &lt;span class=\"hljs-string\"&gt;b\"a\"&lt;/span&gt; &lt;span class=\"hljs-comment\"&gt;# True&lt;/span&gt;\n\nother_s = yson.YsonString(&lt;span class=\"hljs-string\"&gt;b\"a\"&lt;/span&gt;)\nother_s == s &lt;span class=\"hljs-comment\"&gt;# False&lt;/span&gt;\n\nother_s.attributes[&lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;] = &lt;span class=\"hljs-string\"&gt;\"c\"&lt;/span&gt;\nother_s == s &lt;span class=\"hljs-comment\"&gt;# True&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2250\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2250\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2250\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2250.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;В формате YSON имеется два целочисленных типа: &lt;a href=\"user-guide/storage/yson.html\"&gt;int64 и uint64&lt;/a&gt;. В то время, как в python с точки зрения модели данных тип один и никаких ограничений не имеет. Поэтому при чтении данных беззнаковый тип представляется как YsonUint64, в то время, как знаковый представляется обычным int-ом. При записи int-ов сделана автоматика: числа в диапазоне [-2^63, 2^63) представляются как знаковые, а числа в диапазоне [2^63, 2^64) как беззнаковые. Но всегда можно явно указать тип, создав явно Yson-объект.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Unicode-строки. Так как в YTsaurus все строки байтовые, то python unicode-строки по умолчанию кодируются в байтовые строки utf-8 кодировкой. При чтении в Python3 происходит попытка раскодировать байтовые строки с помощью utf-8 декодера, если же это не получается, то возвращается специальный объект &lt;a href=\"https://pydoc.ytsaurus.tech/yt.yson.html#yt.yson.yson_types.YsonStringProxy\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YsonStringProxy&lt;/a&gt;. Более подробно смотрите соответствующий &lt;a href=\"ru/api/python/userdoc.html#python3_strings\"&gt;раздел&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;При записи данных, YsonFormat корректно отличает элементарные python-типы от yson-типов.&lt;/p&gt;\n&lt;h4 id=\"control_attributes\"&gt;&lt;a href=\"ru/api/python/userdoc.html#control_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Контрольные атрибуты&lt;/span&gt;&lt;/a&gt;Контрольные атрибуты&lt;/h4&gt;\n&lt;p&gt;Кроме потока записей при чтении из таблицы (или в джобе) можно заказать разные &lt;a href=\"user-guide/storage/io-configuration.html#control_attributes\"&gt;контрольные атрибуты&lt;/a&gt;. Работа с контрольными атрибутами зависит от формата, например в форматах, отличных от Yamr, JSON и YSON, большинство контрольных атрибутов не представимы.&lt;/p&gt;\n&lt;p&gt;В формате Yamr в python API корректно поддержан парсинг атрибутов row_index и table_index, которые будут представлены как поля tableIndex и recordIndex и объектов типа Record.&lt;/p&gt;\n&lt;p&gt;В формате JSON никакой специальной обработки контрольных атрибутов не производится, то есть при их заказе необходимо будет самостоятельно обрабатывать контрольные записи в потоке.&lt;/p&gt;\n&lt;p&gt;В формате YSON имеется несколько режимов для автоматической обработки контрольных атрибутов. Выбор режима контролируется опцией &lt;code&gt;control_attributes_mode&lt;/code&gt;, которая может принимать следующие значения &lt;strong&gt;(важно: по историческим причинам, чтобы опция правильно работала —  необходимо указать также process_table_index=None при создании формата, по умолчанию process_table_index равен True, что форсирует control_attributes_mode=row_fields)&lt;/strong&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;iterator&lt;/code&gt;(default) — при парсинге потока формат выдаст итератор по записям, чтобы получить в джобе контрольные атрибуты будет необходимо воспользоваться контекстом.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;row_fields&lt;/code&gt; — заказанные контрольные атрибуты будут записаны в качестве полей у каждой записи. Например, если заказан row_index, то у каждой записи будет поле &lt;code&gt;@row_index&lt;/code&gt;, в котором записан номер данной записи.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;none&lt;/code&gt; — никакой специальной обработки контрольных атрибутов производиться не будет, то есть клиенту придет поток записей, в котором будут встречаться записи типа entity с контрольными атрибутами.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Примеры переключения между выходными таблицами с &lt;code&gt;table_index&lt;/code&gt; при &lt;code&gt;control_attributes_mode&lt;/code&gt;, равном &lt;code&gt;iterator&lt;/code&gt; и &lt;code&gt;row_fields&lt;/code&gt;, а также пример получения индекса текущей строки таблицы в reducer-е с помощью &lt;code&gt;context&lt;/code&gt;, можно найти &lt;a href=\"api/python/examples.html#table_switches_untyped\"&gt;здесь&lt;/a&gt;&lt;/p&gt;\n&lt;h4 id=\"other_formats\"&gt;&lt;a href=\"ru/api/python/userdoc.html#other_formats\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Другие форматы&lt;/span&gt;&lt;/a&gt;Другие форматы&lt;/h4&gt;\n&lt;p&gt;По умолчанию библиотека проводит сериализацию через &lt;a href=\"user-guide/storage/formats.html#yson\"&gt;YSON формат&lt;/a&gt;, так как именно он обеспечивает корректное и однозначное представление любых данных, хранящихся в таблицах YTsaurus. Для эффективной работы с YSON-форматом в python необходима &lt;a href=\"ru/api/python/userdoc.html#yson_bindings\"&gt;нативная библиотека&lt;/a&gt;. В случае отсутствия данной библиотеки на кластере вы получите ошибку при выполнении джоба (fallback на python-библиотеку для YSON не делается из-за того, что она очень медленная и неэффективная). В такой ситуации вы можете переключиться на использование &lt;a href=\"user-guide/storage/formats.html#json\"&gt;JSON-формата&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Большинство других форматов являются текстовыми (то есть числа в них никак не отличаются от строк) и таким образом вы потеряете типизацию.&lt;/p&gt;\n&lt;p&gt;В случае использования форматов отличных от YSON и Yamr в качестве рекордов всегда будет приходить &lt;code&gt;dict&lt;/code&gt;. Например, никаких преобразований из JSON-представления записей в YSON-представление автоматически происходить не будет.&lt;/p&gt;\n&lt;h2 id=\"other\"&gt;&lt;a href=\"ru/api/python/userdoc.html#other\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Другое&lt;/span&gt;&lt;/a&gt;Другое&lt;/h2&gt;\n&lt;h3 id=\"grpc\"&gt;&lt;a href=\"ru/api/python/userdoc.html#grpc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;gRPC&lt;/span&gt;&lt;/a&gt;gRPC&lt;/h3&gt;\n&lt;p&gt;Поддержки RPC proxy с использованием gRPC транспорта нет. Если вы не можете поставить бинарный пакет с RPC-биндингами, вы можете самостоятельно пользоваться gRPC-транспортом.&lt;/p&gt;\n\n&lt;h3 id=\"yson\"&gt;&lt;a href=\"ru/api/python/userdoc.html#yson\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YSON&lt;/span&gt;&lt;/a&gt;YSON&lt;/h3&gt;\n&lt;p&gt;Вместе с библиотекой для работы с кластерами YTsaurus также поставляется библиотека для работы с &lt;a href=\"user-guide/storage/yson.html\"&gt;форматом YSON&lt;/a&gt;. Библиотека доступна в модуле &lt;code&gt;yt.yson&lt;/code&gt; и реализует стандартные функции &lt;code&gt;load&lt;/code&gt;, &lt;code&gt;loads&lt;/code&gt;, &lt;code&gt;dump&lt;/code&gt; и &lt;code&gt;dumps&lt;/code&gt;. Кроме того, она предоставляет доступ к &lt;a href=\"ru/api/python/userdoc.html#structured_data\"&gt;Yson-типам&lt;/a&gt;. Также библиотека реализует следующие общеполезные функции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.yson.html#yt.yson.convert.to_yson_type\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;to_yson_type&lt;/a&gt; — создание yson-типа из python-объекта.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.yson.html#yt.yson.convert.json_to_yson\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;json_to_yson&lt;/a&gt; — рекурсивно преобразует python-объект из JSON-представления (читайте про особенности представления структурированных данных в YTsaurus в &lt;a href=\"user-guide/storage/formats.html#json\"&gt;формате JSON&lt;/a&gt; ) в YSON-представлении.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.yson.html#yt.yson.convert.yson_to_json\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yson_to_json&lt;/a&gt; — рекурсивно преобразует python-объект из YSON-представления в JSON-представление.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"yson_bindings\"&gt;&lt;a href=\"ru/api/python/userdoc.html#yson_bindings\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YSON-биндинги&lt;/span&gt;&lt;/a&gt;YSON-биндинги&lt;/h4&gt;\n&lt;p&gt;Библиотека yson имеет две реализации: на чистом python и в виде C++-биндингов.&lt;br /&gt;\nНативный parser и writer YSON-а, написанные на python, очень медленные и подходят только для работы с небольшими объемами данных.&lt;br /&gt;\n&lt;strong&gt;Важно&lt;/strong&gt;: в частности, запустить операции или читать таблицы в формате YSON не получится&lt;/p&gt;\n&lt;p&gt;C++-биндинги поставляются в виде debian- и pip-пакетов.&lt;/p&gt;\n&lt;p&gt;Пакеты собираются в виде универсальной .so библиотеки, в которую вкомпилена libcxx, поэтому должны работать в любой debian-системе.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/api/python/userdoc.md","sourcePath":"ru/api/python/userdoc.md"},"headings":[{"title":"Общая информация","href":"ru/api/python/userdoc.html#common","level":2,"items":[{"title":"Соглашения","href":"ru/api/python/userdoc.html#agreements","level":3},{"title":"Клиент и глобальный клиент","href":"ru/api/python/userdoc.html#client","level":3,"items":[{"title":"Параметры команд","href":"ru/api/python/userdoc.html#commandparams","level":4},{"title":"Потокобезопасность","href":"ru/api/python/userdoc.html#threadsafety","leve
