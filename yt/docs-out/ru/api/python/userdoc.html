        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"common\"&gt;&lt;a href=\"ru/api/python/userdoc.html#common\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общая информация&lt;/span&gt;&lt;/a&gt;Общая информация&lt;/h2&gt;\n&lt;h3 id=\"agreements\"&gt;&lt;a href=\"ru/api/python/userdoc.html#agreements\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Соглашения&lt;/span&gt;&lt;/a&gt;Соглашения&lt;/h3&gt;\n&lt;p&gt;Опции системных команд имеют значение по умолчанию &lt;code&gt;None&lt;/code&gt;. Это означает, что значение данной опции не будет передано при выполнении команды и система будет использовать значение по умолчанию.&lt;/p&gt;\n&lt;p&gt;Для опции &lt;code&gt;format&lt;/code&gt; значение по умолчанию &lt;code&gt;None&lt;/code&gt; обычно имеет другой смысл. Результат команды должен быть возвращен в виде python-структуры (в parsed виде), либо вход команды ожидается в виде python-структуры. Если опция &lt;code&gt;format&lt;/code&gt; указана, результат выполнения команды будет возвращен в unparsed виде, либо вход команды ожидается в unparsed виде.&lt;/p&gt;\n&lt;p&gt;Все таймауты/периоды времени по умолчанию принимаются в миллисекундах. В ряде случаев поддержано использование &lt;code&gt;datetime.timedelta&lt;/code&gt; в качестве времени наравне с указанием в миллисекундах.&lt;/p&gt;\n&lt;p&gt;Все функции имеют в качестве последней опции объект &lt;code&gt;client&lt;/code&gt;. Такое поведение является особенностью реализации. Не рекомендуется самостоятельно использовать данную возможность.&lt;/p&gt;\n&lt;p&gt;В примерах ниже для краткости подразумевается, что выполнен импорт вида &lt;code&gt;import yt.wrapper as yt&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"client\"&gt;&lt;a href=\"ru/api/python/userdoc.html#client\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Клиент и глобальный клиент&lt;/span&gt;&lt;/a&gt;Клиент и глобальный клиент&lt;/h3&gt;\n&lt;p&gt;Функции и классы доступны из глобального окружения библиотеки модуля yt.wrapper и могут менять его глобальное состояние. Например, сохраняют туда текущую транзакцию. Также, меняя yt.config, вы меняете глобальную конфигурацию. Если вы хотите иметь возможность работать из нескольких независимых (по-разному сконфигурированных) клиентов, то используйте класс &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtClient&lt;/a&gt;. У данного класса доступны практически все функции из модуля &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt.wrapper&lt;/a&gt;, то есть вы можете вызывать &lt;code&gt;client.run_map&lt;/code&gt;, &lt;code&gt;client.read_table_structured&lt;/code&gt;, &lt;code&gt;with client.Transaction()&lt;/code&gt; и так далее. Обратите внимание, что переменные окружения &lt;code&gt;YT_PROXY&lt;/code&gt;, &lt;code&gt;YT_TOKEN&lt;/code&gt; и остальные задают только конфигурацию глобального клиента, то есть влияют только на &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#module-yt.wrapper.config\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt.wrapper.config&lt;/a&gt;, но не на конфигурацию явно созданных экземпляров &lt;code&gt;YtClient&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; YtClient\nclient = YtClient(proxy=&amp;lt;cluster-name&amp;gt;, config={&lt;span class=\"hljs-string\"&gt;\"backend\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"rpc\"&lt;/span&gt;})\n&lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;(client.&lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"/\"&lt;/span&gt;))\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"27\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-27\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-27\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-27.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Обратите внимание, что библиотека не является потокобезопасной, поэтому для работы из разных потоков в каждом необходимо создавать свой экземпляр клиента.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"commandparams\"&gt;&lt;a href=\"ru/api/python/userdoc.html#commandparams\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Параметры команд&lt;/span&gt;&lt;/a&gt;Параметры команд&lt;/h4&gt;\n&lt;p&gt;Существует возможность передавать заданный набор параметров во все запросы, задаваемые через клиент (например, &lt;code&gt;trace_id&lt;/code&gt;). Для этого есть специальный метод &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html?highlight=create_client_with#yt.wrapper.client.create_client_with_command_params\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;create_client_with_command_params&lt;/a&gt;, который позволяет указать произвольный набор опций, которые будут передавать во все вызовы API.&lt;/p&gt;\n&lt;h4 id=\"threadsafety\"&gt;&lt;a href=\"ru/api/python/userdoc.html#threadsafety\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Потокобезопасность&lt;/span&gt;&lt;/a&gt;Потокобезопасность&lt;/h4&gt;\n&lt;p&gt;Даже если вы пользуетесь не потоками (threading), а процессами (multiprocessing), то совет также остается в силе. Одна из причин: если в главном процессе вы уже задавали запрос к кластеру, то был инициализирован connection pool до этого кластера в рамках глобального клиента. Поэтому после fork процессы будут использовать одни и те же сокеты при общении с кластером, что приведет к разнообразным проблемам.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При использовании нативного драйвера стоит пользоваться fork + exec (через &lt;code&gt;Popen&lt;/code&gt;) и не пользоваться даже &lt;code&gt;multiprocessing&lt;/code&gt;, так как fork не сохраняет служебные потоки драйвера, и драйвер становится неспособным выполнять запросы. Также не стоит переиспользовать клиенты после fork-ов, у них может быть нетривиальное состояние, которое плохо переживает fork-и.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gevent\"&gt;&lt;a href=\"ru/api/python/userdoc.html#gevent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Асинхронный клиент на основе gevent&lt;/span&gt;&lt;/a&gt;Асинхронный клиент на основе gevent&lt;/h4&gt;\n&lt;p&gt;Если ваш код использует &lt;code&gt;gevent&lt;/code&gt;, то можно использовать &lt;code&gt;yt.wrapper&lt;/code&gt; в асинхронном режиме. Данная функциональность в данный момент не покрыта тестами, но в простых сценариях должна работать. Важные моменты:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Перед началом работы выполните monkey patching, чтобы заменить блокирующие сетевые вызовы.&lt;/li&gt;\n&lt;li&gt;Внутри каждого &lt;a href=\"https://pypi.org/project/greenlet/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;greenlet&lt;/a&gt; создавайте свой отдельный &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtClient&lt;/a&gt;. Это важно, невыполнение этого пункта приведет к ошибкам.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример можно найти в &lt;a href=\"api/python/examples.html#gevent\"&gt;разделе&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"configuration\"&gt;&lt;a href=\"ru/api/python/userdoc.html#configuration\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конфигурация&lt;/span&gt;&lt;/a&gt;Конфигурация&lt;/h3&gt;\n&lt;p&gt;Библиотека поддерживает богатые возможности по конфигурации своего поведения в разных местах. Например, вы можете изменить путь в Кипарисе, где будут по умолчанию создаваться временные таблицы: &lt;code&gt;yt.config[\"remote_temp_tables_directory\"] = \"//home/my_home_dir/tmp\"&lt;/code&gt;.&lt;br /&gt;\nОпции и их подробные описания проще всего посмотреть &lt;a href=\"http://pydoc.ytsaurus.tech/_modules/yt/wrapper/default_config.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;в коде&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Конфигурация библиотеки выполняется одним из следующих способов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Изменение объекта &lt;code&gt;yt.config&lt;/code&gt;: &lt;code&gt;yt.config[\"proxy\"][\"url\"] = \"&amp;lt;cluster_name&amp;gt;\"&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Вызов функции &lt;code&gt;yt.update_config&lt;/code&gt;: &lt;code&gt;yt.update_config({\"proxy\": {\"url\": \"&amp;lt;cluster_name&amp;gt;\"}})&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Установка переменной окружения: &lt;code&gt;export YT_CONFIG_PATCHES='{url=\"&amp;lt;cluster_name&amp;gt;\"}'&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Через файл, путь к которому указан в переменной окружения &lt;code&gt;YT_CONFIG_PATH&lt;/code&gt;, по умолчанию &lt;code&gt;~/.yt/config&lt;/code&gt;. Файл должен быть в формате &lt;a href=\"user-guide/storage/formats.html#yson\"&gt;YSON&lt;/a&gt; (с помощью переменной окружения &lt;code&gt;YT_CONFIG_FORMAT&lt;/code&gt; можно изменить это поведение; поддерживаются форматы YSON и JSON). Пример содержания файла: &lt;code&gt;{proxy={url=\"&amp;lt;cluster_name&amp;gt;\"}}&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Часть опций конфигурации можно изменять через переменные окружения. К таким относятся &lt;code&gt;YT_TOKEN&lt;/code&gt;, &lt;code&gt;YT_PROXY&lt;/code&gt;, &lt;code&gt;YT_PREFIX&lt;/code&gt;. А также опции для конфигурации логирования (которые находятся отдельно от конфига): &lt;code&gt;YT_LOG_LEVEL&lt;/code&gt; и &lt;code&gt;YT_LOG_PATTERN&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;При использовании &lt;a href=\"api/cli/cli.html\"&gt;CLI&lt;/a&gt; патч к конфигурации можно передать с помощью опции &lt;code&gt;--config&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Обратите внимание, что конфигурация библиотеки не влияет на конфигурацию клиента и по умолчанию при создании клиента используется конфиг с дефолтными значениями. Вы можете передать в клиент конфиг, построенный на основе переменных окружения следующим образом &lt;code&gt;client = yt.YtClient(..., config=yt.default_config.get_config_from_env())&lt;/code&gt;, также вы можете обновить имеющийся у вас конфиг значениями из переменных окружения с помощью функции &lt;code&gt;update_config_from_env(config)&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Также обратите внимание на порядок приоритетов. При импорте библиотеки применяются конфигурации, переданные через &lt;code&gt;YT_CONFIG_PATCHES&lt;/code&gt;. В данной переменной окружения ожидается list_fragment, то есть может быть передано несколько конфигураций, разделенных точкой с запятой. Указанные патчи накладываются от последнего к первому. Дальше накладываются значения опций, указанные через конкретные переменные окружения, например через &lt;code&gt;YT_PROXY&lt;/code&gt;. И лишь затем накладываются конфигурации, указанные явно в коде, или переданные через опцию &lt;code&gt;--config&lt;/code&gt; при использовании CLI.&lt;/p&gt;\n&lt;p&gt;При накладывании конфига все узлы, являющиеся dict-ами, мержатся, а не перезаписываются.&lt;/p&gt;\n&lt;p&gt;Настройка глобальной конфигурации для работы с кластером в своей домашней директории.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.config[&lt;span class=\"hljs-string\"&gt;\"prefix\"&lt;/span&gt;] = &lt;span class=\"hljs-string\"&gt;\"//home/username/\"&lt;/span&gt;\nyt.config[&lt;span class=\"hljs-string\"&gt;\"proxy\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"url\"&lt;/span&gt;] = &lt;span class=\"hljs-string\"&gt;\"cluster-name\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"137\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-137\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-137\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-137.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Создание клиента, который будет создавать все новые таблицы с кодеком &lt;code&gt;brotli_3&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;client = yt.YtClient(proxy=&amp;lt;cluster-name&amp;gt;, config={&lt;span class=\"hljs-string\"&gt;\"create_table_attributes\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"compression_codec\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"brotli_3\"&lt;/span&gt;}})\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"141\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-141\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-141\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-141.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Настройка глобального клиента для сбора архивов зависимостей в python-операциях с использованием локальной директории отличной от &lt;code&gt;/tmp&lt;/code&gt;. Затем создание клиента с дополнительной настройкой max_row_weight в 128 МБ:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;my_config = yt.default_config.get_config_from_env()\nmy_config[&lt;span class=\"hljs-string\"&gt;\"local_temp_directory\"&lt;/span&gt;] = &lt;span class=\"hljs-string\"&gt;\"/home/ignat/tmp\"&lt;/span&gt;\nmy_config[&lt;span class=\"hljs-string\"&gt;\"table_writer\"&lt;/span&gt;] = {&lt;span class=\"hljs-string\"&gt;\"max_row_weight\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;128&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;1024&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;1024&lt;/span&gt;}\nclient = yt.YtClient(config=my_config)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"145\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-145\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-145\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-145.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"configuration_common\"&gt;&lt;a href=\"ru/api/python/userdoc.html#configuration_common\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общий конфиг&lt;/span&gt;&lt;/a&gt;Общий конфиг&lt;/h4&gt;\n&lt;h4 id=\"configuration_profiles\"&gt;&lt;a href=\"ru/api/python/userdoc.html#configuration_profiles\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Профили&lt;/span&gt;&lt;/a&gt;Профили&lt;/h4&gt;\n&lt;p&gt;В файле конфигурации можно указывать несколько профилей для работы с YTsaurus. Профиль - это набор настроек с общим именем. Профили могут быть полезны:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Для разных сценариев использования одного кластера (профиль для долгих процессов и профиль для быстрых разовых операций).&lt;/li&gt;\n&lt;li&gt;Чтобы указать настройки по умолчанию для работы с разными кластерами.&lt;/li&gt;\n&lt;li&gt;Дать короткое удобное имя для кластера.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Чтобы использовать профили, нужно включить вторую версию формата: &lt;code&gt;config_version=2&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Структура файла конфигурации второй версии:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;profiles&lt;/code&gt; - словарь, задающий профили и соответствующие им настройки. Ключ словаря - это имя профиля, а значение — конфигурация профиля в стандратном &lt;a href=\"api/python/userdoc.html#configuration\"&gt;формате&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;default_profile&lt;/code&gt; — строка, содержит имя профиля по умолчанию.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;config_version&lt;/code&gt; — число, версия формата файла конфигурации. Профили поддерживаются только во второй версии. По умолчанию используется первая версия.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример конфигурации с профилями в формате yson:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{\n    \"default_profile\"=\"dev\";\n    \"profiles\"={\n        \"main\"={\n            \"token_path\"=\"/etc/token\";\n            \"proxy\"={\n                \"url\"=\"cluster-url\";\n            };\n            \"prefix\"=\"//main\";\n        };\n        \"dev\"={\n            \"token_path\"=\"/etc/token-dev\";\n            \"proxy\"={\n                \"url\"=\"cluster-url\";\n            };\n            \"prefix\"=\"//dev\";\n            \"pool\"=\"dev\";\n        };\n        \"external\"={\n            \"token_path\"=\"/etc/token-external\";\n            \"proxy\"={\n                \"url\"=\"external-url\";\n            };\n        };\n    };\n    \"config_version\"=2;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"198\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-198\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-198\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-198.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Указать профиль можно несколькими способами:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Через переменную окружения &lt;code&gt;YT_CONFIG_PROFILE&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;В python sdk &lt;code&gt;client = yt.YtClient(..., config=yt.default_config.get_config_from_env(profile=\"my_profile\"))&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;В качестве заначения по умолчанию используется значение ключа &lt;code&gt;default_profile&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"configuration_logging\"&gt;&lt;a href=\"ru/api/python/userdoc.html#configuration_logging\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройка логирования&lt;/span&gt;&lt;/a&gt;Настройка логирования&lt;/h4&gt;\n&lt;p&gt;Логирование в ytsaurus-client и всех инструментах, использующих данную библиотеку, устроено следующим образом. Заведен специальный логгер, который находится в модуле &lt;code&gt;yt.logger&lt;/code&gt; в виде глобальной переменной &lt;code&gt;LOGGER&lt;/code&gt; и алиасов для логирования на уровне модуля.&lt;/p&gt;\n&lt;p&gt;Для изменения настроек логирования необходимо изменять &lt;code&gt;LOGGER&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Первичная настройка логгера (при загрузке модуля) регулируется переменными окружения &lt;code&gt;YT_LOG_LEVEL&lt;/code&gt;, &lt;code&gt;YT_LOG_PATTERN&lt;/code&gt; и &lt;code&gt;YT_LOG_PATH&lt;/code&gt;.&lt;br /&gt;\nПеременная &lt;code&gt;YT_LOG_LEVEL&lt;/code&gt;, регулирующая уровень логирования, принимает одно из значений &lt;code&gt;DEBUG&lt;/code&gt;, &lt;code&gt;INFO&lt;/code&gt;, &lt;code&gt;WARNING&lt;/code&gt;, &lt;code&gt;ERROR&lt;/code&gt;, переменная &lt;code&gt;YT_LOG_PATTERN&lt;/code&gt;, регулирующая форматирование лог-сообщений принимает строку форматирования логгера, подробнее можно прочитать в &lt;a href=\"https://docs.python.org/3/library/logging.html#logging.Formatter\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;документации&lt;/a&gt; по Python, а переменная окружения &lt;code&gt;YT_LOG_PATH&lt;/code&gt; позволяет указать путь до лог-файла.&lt;/p&gt;\n&lt;p&gt;По умолчанию уровень логирования равен INFO, и логирование происходит в stderr.&lt;/p&gt;\n&lt;h4 id=\"configuration_token\"&gt;&lt;a href=\"ru/api/python/userdoc.html#configuration_token\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройка токена&lt;/span&gt;&lt;/a&gt;Настройка токена&lt;/h4&gt;\n&lt;p&gt;Токен может браться из следующих мест (перечислены в порядке приоритета):&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Из опции &lt;code&gt;config[\"token\"]&lt;/code&gt;, которая попадает в глобальную конфигурацию из переменной окружения &lt;code&gt;YT_TOKEN&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Из файла, указанного в &lt;code&gt;config[\"token_path\"]&lt;/code&gt;; по умолчанию эта опция равна &lt;code&gt;~/.yt/token&lt;/code&gt;, также опция может быть переопределена с помощью переменной окружения &lt;code&gt;YT_TOKEN_PATH&lt;/code&gt; (переменная окружения действует только на конфигурацию глобального клиента, детальней написано в &lt;a href=\"ru/api/python/userdoc.html#configuration\"&gt;разделе&lt;/a&gt;).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"configuration_retries\"&gt;&lt;a href=\"ru/api/python/userdoc.html#configuration_retries\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройка повторных запросов (retry)&lt;/span&gt;&lt;/a&gt;Настройка повторных запросов (retry)&lt;/h4&gt;\n&lt;p&gt;Команды в YTsaurus делятся на легкие и тяжелые (посмотреть на список команд с точки зрения системы можно в разделе &lt;a href=\"api/commands.html\"&gt;Команды&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;Легкие команды — это команды вида &lt;code&gt;create, remove, set, list, get, ping&lt;/code&gt; и так далее. Также перед всеми запросами клиент обращается к специальной вызову прокси для выяснения поддерживаемых ею команд. Такие команды могут выполняться повторно в случае ошибки или таймаута. Настроить параметры повторных запросов можно в секции &lt;code&gt;proxy/retries&lt;/code&gt; конфигурации.&lt;/p&gt;\n&lt;p&gt;Тяжелые запросы делятся на две категории.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Чтения и запись таблиц, файлов (то есть read_table, write_table, read_blob_table и другие). Повторные запросы таких команд настраиваются в секциях &lt;code&gt;read_retries&lt;/code&gt; и &lt;code&gt;write_retries&lt;/code&gt; (в зависимости от того, запрос на чтение или на запись).&lt;/li&gt;\n&lt;li&gt;Чтения и запись в динамические таблицы (то есть тяжелые запросы select_rows, lookup_rows, insert_rows и другие). Повторные запросы этих команд настраиваются отдельно (обычные read_retries и write_retries не подойдут, так как при чтении статических таблиц считается нормальным интервал в 60 секунд между повторными запросами, что неприменимо к динамическим таблицам, где латентность должна быть низкой) в секции &lt;code&gt;dynamic_table_retries&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Повторные запросы, описанные выше, влияют на процессы загрузки, выгрузки данных с кластера в случае сетевых проблем, недоступности чанков и других проблем. Ниже описаны повторные запросы действий, которые порождаются внутри кластера (запуск mapreduce операции, выполнение батч-запроса).&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Секция &lt;code&gt;start_operation_retries&lt;/code&gt; отвечает за повторные запросы команды запуска операции, то есть это не сетевые проблемы, а ошибки вида «concurrent operation limit exceeded», когда одновременно бегущих операций много, и планировщик отказывается запускать новые операции. Клиент повторно выполняет такие ошибки с большими sleep-ами, чтобы какие-то операции успели завершиться.&lt;/li&gt;\n&lt;li&gt;Секция &lt;code&gt;concatenate_retries&lt;/code&gt; отвечает за повторные запросы команды concatenate (см. &lt;a href=\"api/python/start.html\"&gt;API&lt;/a&gt;) , которую нельзя назвать легкой, так как она может ходить к разным мастер-селлам, долго висеть, поэтому повторные запросы для легких команд ей не подходят.&lt;/li&gt;\n&lt;li&gt;Секция &lt;code&gt;batch_requests_retries&lt;/code&gt; отвечает за повторные запросы запросов внутри batch запроса (см. описание команды &lt;code&gt;execute_batch&lt;/code&gt;). Клиент повторно выполняет запросы, завершившиеся с ошибками вида «request rate limit exceeded» и так далее. То есть клиент отправляет батчем пачку запросов, какие-то из них завершились, а какие-то упали с ошибками вида «превышен размер очереди запросов на пользователя» и тогда такие запросы снова отправляются новым батчем. Секция регламентирует политику таких повторных запросов.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"errors\"&gt;&lt;a href=\"ru/api/python/userdoc.html#errors\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ошибки&lt;/span&gt;&lt;/a&gt;Ошибки&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.html#yt.common.YtError\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtError&lt;/a&gt; — базовый класс всех ошибок библиотеки. Имеет следующие поля:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;code&lt;/code&gt; (тип int) — HTTP код ошибки (смотрите &lt;a href=\"api/error-codes.html\"&gt;раздел&lt;/a&gt;). Если не проставлен, то равен 1.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;inner_errors&lt;/code&gt; (тип list) — ошибки, которые предшествовали данной ошибке при исполнении запроса (прокси обратилась к драйверу, внутри драйвера произошла ошибка, она будет в &lt;code&gt;inner_errors&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;attributes&lt;/code&gt; (тип dict) —  атрибуты ошибки общего назначения (например, дата запроса).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Следующие ошибки описывают более специфичные проблемы:&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.errors.YtOperationFailedError\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtOperationFailedError&lt;/a&gt; —  операция завершилась неуспешно. У этой ошибки в поле &lt;code&gt;attributes&lt;/code&gt; есть следующая информация:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;id&lt;/code&gt; — ID операции.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;url&lt;/code&gt; — URL операции.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;stderrs&lt;/code&gt; —  список словарей с информацией про завершившиеся с ошибкой джобы или джобы с stderr. У словаря есть поле &lt;code&gt;host&lt;/code&gt;, а также могут быть поля &lt;code&gt;stderr&lt;/code&gt; и &lt;code&gt;error&lt;/code&gt; в зависимости от того, был ли у джоба stderr и завершился ли джоб с ошибкой.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;state&lt;/code&gt; — статус операции (например, &lt;code&gt;failed&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Чтобы при падении операции распечатать stderr, необходимо обработать исключение и явно напечатать сообщения об ошибках, иначе вы увидите их в урезанном виде в backtrace. Существует непубличный декоратор (вы можете его использовать, но он может быть переименован) &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operation_commands.add_failed_operation_stderrs_to_error_message\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;add_failed_operation_stderrs_to_error_message&lt;/a&gt;, который перехватывает исключение &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.errors.YtOperationFailedError\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtOperationFailedError&lt;/a&gt; и обогащает его сообщение об ошибке stderr.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.errors.YtResponseError\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtResponseError&lt;/a&gt; — команда (запрос к системе YTsaurus) выполнилась неуспешно. У данного класса есть поле &lt;code&gt;error&lt;/code&gt;, в котором хранится структурированный ответ, описывающий причину ошибки.&lt;br /&gt;\nИмеет следующие полезные методы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.html#yt.common.YtResponseError.is_resolve_error\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;is_resolve_error&lt;/a&gt; (например, возвращает &lt;code&gt;True&lt;/code&gt; если была попытка закоммитить несуществующую транзакцию или запросить несуществующий узел);&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.html#yt.common.YtResponseError.is_access_denied\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;is_access_denied&lt;/a&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.html#yt.common.YtResponseError.is_concurrent_transaction_lock_conflict\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;is_concurrent_transaction_lock_conflict&lt;/a&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.html#yt.common.YtResponseError.is_request_queue_size_limit_exceeded\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;is_request_queue_size_limit_exceeded&lt;/a&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.html#yt.common.YtResponseError.is_chunk_unavailable\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;is_chunk_unavailable&lt;/a&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.html#yt.common.YtResponseError.is_request_timed_out\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;is_request_timed_out&lt;/a&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.html#yt.common.YtResponseError.is_concurrent_operations_limit_reached\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;is_concurrent_operations_limit_reached&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Другие наследники &lt;code&gt;YtError&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.errors.YtHttpResponseError\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtHttpResponseError&lt;/a&gt; — наследник &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.errors.YtResponseError\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtResponseError&lt;/a&gt;, имеет поле &lt;code&gt;headers&lt;/code&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.errors.YtProxyUnavailable\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtProxyUnavailable&lt;/a&gt; — proxy сейчас недоступна, например, она слишком загружена запросами;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.errors.YtTokenError\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtTokenError&lt;/a&gt; — передан неверный токен;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.errors.YtFormatError\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtFormatError&lt;/a&gt; — неверный формат;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.errors.YtIncorrectResponse\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtIncorrectResponse&lt;/a&gt; — некорректный ответ от прокси (например, некорректный JSON);&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.errors.YtTimeoutError\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtTimeoutError&lt;/a&gt; — операция завершилась по таймауту.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Полный список наследников можно посмотреть в коде.&lt;/p&gt;\n&lt;h3 id=\"formats\"&gt;&lt;a href=\"ru/api/python/userdoc.html#formats\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Форматы&lt;/span&gt;&lt;/a&gt;Форматы&lt;/h3&gt;\n&lt;p&gt;Подробнее про форматы можно прочитать &lt;a href=\"user-guide/storage/formats.html\"&gt;в разделе&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Для каждого формата существует отдельный класс:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.format.YsonFormat\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YsonFormat&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.format.JsonFormat\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;JsonFormat&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.format.DsvFormat\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;DsvFormat&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.format.SchemafulDsvFormat\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;SchemafulDsvFormat&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.format.YamrFormat\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YamrFormat&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В конструкторе эти классы принимают параметры, специфичные для конкретных форматов. Если опция формата недоступна в явном виде в конструкторе, то её можно передать через опцию &lt;code&gt;attributes&lt;/code&gt;, принимающую &lt;code&gt;dict&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Кроме того, у каждого класса имеется набор методов для сериализации/десериализации записей из потока:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.format.Format.load_row\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;load_row&lt;/a&gt; — вычитывает из потока одну запись. Некоторые форматы (например, Yson) не поддерживают загрузку одной записи, поэтому вызов &lt;code&gt;load_row&lt;/code&gt; у них выбросит исключение;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.format.Format.load_rows\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;load_rows&lt;/a&gt; — вычитывает из потока все записи, обрабатывает переключатели таблиц, возвращает итератор по записям. Если &lt;code&gt;raw==True&lt;/code&gt;, то метод возвращает строки, не выполняя парсинг. Метод является генератором;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.format.Format.dumps_row\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;dump_row&lt;/a&gt; — записывает в поток одну запись;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.format.Format.dumps_rows\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;dump_rows&lt;/a&gt; — записывает в поток набор записей. Добавляет в выходной поток переключатели таблиц.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Также есть функция &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.format.create_format\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;create_format&lt;/a&gt;, которая создает формат по указанному имени и с указанным набором атрибутов. Также в имени формата могут присутствовать атрибуты в YSON-формате, то есть можно создать формат следующим образом &lt;code&gt;create_format(\"&amp;lt;columns=[columnA;columnB]&amp;gt;schemaful_dsv\")&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;С помощью функции &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.format.create_table_switch\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;create_table_switch&lt;/a&gt;, которая позволяет создать запись, являющую переключателем на таблицу с указанным индексом.&lt;/p&gt;\n&lt;p&gt;У функций &lt;code&gt;read_table, write_table, select_rows, lookup_rows, insert_rows, delete_rows&lt;/code&gt; есть параметр &lt;code&gt;raw&lt;/code&gt;, который позволяет указать, что вы хотите получать/передавать записи в нераспарсенном виде (в виде строк). Если параметр &lt;code&gt;raw&lt;/code&gt; равен &lt;code&gt;False&lt;/code&gt;, то это означает, что записи будут десериализованы в &lt;code&gt;dict&lt;/code&gt; при чтении и сериализованы из &lt;code&gt;dict&lt;/code&gt; при записи.&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.write_table(&lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;, [&lt;span class=\"hljs-string\"&gt;b\"x=value\\n\"&lt;/span&gt;], &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=yt.DsvFormat(), raw=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n&lt;span class=\"hljs-keyword\"&gt;assert&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(yt.read_table(&lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;, &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=yt.DsvFormat(), raw=&lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;)) == [{&lt;span class=\"hljs-string\"&gt;\"x\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;}]  &lt;span class=\"hljs-comment\"&gt;# Ok&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"504\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-504\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-504\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-504.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Аналогичная опция есть для операций. По умолчанию операция десериализует записи из формата, указанного при запуске операции. Если вы хотите, чтобы операция принимала на вход нераспарсенные строки, то используйте декоратор &lt;code&gt;raw&lt;/code&gt; и указывайте формат при запуске операции:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-meta\"&gt;@yt.raw&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;mapper&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;rec&lt;/span&gt;):\n    ...\n\nyt.run_map(...., &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=yt.JsonFormat())\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"508\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-508\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-508\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-508.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Для использования YSON формата для работы с таблицами (операции, чтение/запись таблиц) вам необходимо будет дополнительно установить пакет с YSON C++ биндингами, смотрите &lt;a href=\"ru/api/python/userdoc.html#yson_bindings\"&gt;yson bindings&lt;/a&gt;. В противном случае вылетит исключение «Yson bindings required».&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Особенности работы с JSON форматом: модуль JSON написан на Python, поэтому работает очень медленно. Библиотека старается использовать разные модули, для которых есть биндинги, написанные на более быстрых языках, например ujson. Включить его можно с помощью параметра &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.format.JsonFormat\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;enable_ujson&lt;/a&gt;: &lt;code&gt;JsonFormat(..., enable_ujson=True)&lt;/code&gt;. По умолчанию ujson выключен, так как в некоторых случаях его поведение по умолчанию не является корректным:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; ujson\ns = &lt;span class=\"hljs-string\"&gt;'{\"a\": 48538100000000000000.0}'&lt;/span&gt;\nujson.loads(s)\n{&lt;span class=\"hljs-string\"&gt;u'a'&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;1.1644611852580897e+19&lt;/span&gt;}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"522\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-522\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-522\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-522.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если после прочтения документации к ujson есть понимание, что ваши входные данные будут корректно десериализованы, то рекомендуется использовать данный модуль для парсинга.&lt;/p&gt;\n&lt;h3 id=\"ypath\"&gt;&lt;a href=\"ru/api/python/userdoc.html#ypath\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YPath&lt;/span&gt;&lt;/a&gt;YPath&lt;/h3&gt;\n&lt;p&gt;Пути в YTsaurus представляются в виде так называемого &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPath&lt;/a&gt;. В коде для этого используется класс &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.ypath.YPath\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YPath&lt;/a&gt;, а также его наследники &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.ypath.TablePath\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TablePath&lt;/a&gt; и &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.ypath.FilePath\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;FilePath&lt;/a&gt;. В конструкторах последних двух классов можно указывать соответствующие YPath-атрибуты, например, &lt;code&gt;schema&lt;/code&gt;, &lt;code&gt;start_index&lt;/code&gt;, &lt;code&gt;end_index&lt;/code&gt; для &lt;code&gt;TablePath&lt;/code&gt; и &lt;code&gt;append&lt;/code&gt; и &lt;code&gt;executable&lt;/code&gt; для &lt;code&gt;FilePath&lt;/code&gt;. Подробнее про &lt;code&gt;TablePath&lt;/code&gt; можно прочитать в &lt;a href=\"ru/api/python/userdoc.html#tablepath_class\"&gt;разделе&lt;/a&gt;.&lt;br /&gt;\nРекомендуется использовать указанные классы для работы с путями в коде вместо ручного форматирования YPath-литералов.&lt;/p&gt;\n&lt;p&gt;Также в модуле &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#module-yt.wrapper.ypath\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YPath&lt;/a&gt; есть ещё несколько полезных функций, вот некоторые их них:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.ypath.ypath_join\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ypath_join&lt;/a&gt; — объединяет несколько частей пути в один путь (аналог &lt;code&gt;os.path.join&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.ypath.ypath_split\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ypath_split&lt;/a&gt; — возвращает пару &lt;code&gt;(head, tail)&lt;/code&gt;, где &lt;code&gt;tail&lt;/code&gt; — последняя компонента пути, а &lt;code&gt;head&lt;/code&gt; — остальное (аналог &lt;code&gt;os.path.split&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.ypath.ypath_dirname\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ypath_dirname&lt;/a&gt; — возвращает путь без последней компоненты (аналог &lt;code&gt;os.path.dirname&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.ypath.escape_ypath_literal\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;escape_ypath_literal&lt;/a&gt; — экранирует строку для использования в качестве компоненты YPath.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"python3_strings\"&gt;&lt;a href=\"ru/api/python/userdoc.html#python3_strings\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Python3 и байтовые строки&lt;/span&gt;&lt;/a&gt;Python3 и байтовые строки&lt;/h3&gt;\n&lt;p&gt;В YTsaurus все строки байтовые, а в Python3 обычные строки юникодные, поэтому при работе со структурированными данными (словарями) в Python3 в форматах появилась следующая особенность. При записи и чтении таблиц в &lt;code&gt;raw&lt;/code&gt; режиме библиотека работает с бинарными строками на вход и на выход.&lt;br /&gt;\nВ не-&lt;code&gt;raw&lt;/code&gt; режиме включается следующая логика.&lt;/p&gt;\n&lt;p&gt;По умолчанию строки при чтении будут автоматически закодированы в utf-8, включая ключи словарей (выбрать другую кодировку можно с помощью параметра &lt;code&gt;encoding&lt;/code&gt; у формата, смотрите далее). При этом если встретится байтовая строка, вернётся специальный объект типа &lt;a href=\"https://pydoc.ytsaurus.tech/yt.yson.html#yt.yson.yson_types.YsonStringProxy\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YsonStringProxy&lt;/a&gt;. Для такого объекта все попытки работать с ним как со строкой приведут к характерной ошибке &lt;a href=\"https://pydoc.ytsaurus.tech/yt.yson.html#yt.yson.yson_types.NotUnicodeError\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;NotUnicodeError&lt;/a&gt;. Для этого объекта можно вызвать две функции: &lt;a href=\"https://pydoc.ytsaurus.tech/yt.yson.html#yt.yson.yson_types.is_unicode\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt.yson.is_unicode&lt;/a&gt; и &lt;a href=\"https://pydoc.ytsaurus.tech/yt.yson.html#yt.yson.yson_types.get_bytes\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt.yson.get_bytes&lt;/a&gt;. Первая вернёт &lt;code&gt;False&lt;/code&gt; для &lt;code&gt;YsonStringProxy&lt;/code&gt;, а вторая вернёт сырые байты, которые не получилось декодировать. Те же функции можно вызывать и для обычных строк, для них ожидаемо &lt;code&gt;is_unicode&lt;/code&gt; вернёт &lt;code&gt;True&lt;/code&gt;. При вызове &lt;code&gt;get_bytes&lt;/code&gt; для обычных строк можно указать вторым аргументом кодировку (по умолчанию &lt;code&gt;utf-8&lt;/code&gt;) и получить &lt;code&gt;s.encode(encoding)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Предполагаемый сценарий работы со смешанными, обычными и байтовыми строками при чтении таблиц или в операциях следующий:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-comment\"&gt;## Если просто нужны байты&lt;/span&gt;\nb = yt.yson.get_bytes(s)\n\n&lt;span class=\"hljs-comment\"&gt;## Если хочется по-разному отреагировать на байтовую и обычную строки&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; yt.yson.is_unicode(s):\n    &lt;span class=\"hljs-comment\"&gt;# Обрабатываем случай обычной строки&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;else&lt;/span&gt;:\n    b = yt.yson.get_bytes(s)\n    &lt;span class=\"hljs-comment\"&gt;# Обрабатываем байтовую строку&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"569\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-569\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-569\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-569.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;При записи можно как оставлять объект &lt;code&gt;YsonStringProxy&lt;/code&gt; (он автоматически превратится в байтовую строку), так и отдавать байтовую или unicode строку. Unicode строки будут закодированы в UTF-8 (или в другую кодировку).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Обратите внимание&lt;/strong&gt;, что в ключах словарей запрещено смешивать &lt;code&gt;bytes&lt;/code&gt; и &lt;code&gt;str&lt;/code&gt;. При &lt;code&gt;encoding != None&lt;/code&gt; единственный способ указать байтовый ключ — использовать функцию &lt;a href=\"https://pydoc.ytsaurus.tech/yt.yson.html#yt.yson.yson_types.make_byte_key\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt.yson.make_byte_key&lt;/a&gt;. Причина в том что в Python3 строки &lt;code&gt;\"a\"&lt;/code&gt; и &lt;code&gt;b\"a\"&lt;/code&gt; не равны. Недопустимо чтобы словарь вида: &lt;code&gt;{\"a\": 1, b\"a\": 1}&lt;/code&gt; неявно отправлялся в систему, превращенный в строку с двумя одинаковыми ключами &lt;code&gt;a&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;При необходимости можно отключить логику по декодированию строк или выбрать другую кодировку. Для этого необходимо использовать параметр &lt;code&gt;encoding&lt;/code&gt; при создании формата. Если параметр &lt;code&gt;encoding&lt;/code&gt; указан и равен &lt;code&gt;None&lt;/code&gt;, то библиотека работает с записями, в которых все строки ожидаются бинарными (и ключи, и значения; как при чтении, так и при записи). При попытке сериализации словаря с unicode строками c указанным &lt;code&gt;encoding=None&lt;/code&gt; в большинстве форматов будет возникать ошибка.&lt;/p&gt;\n&lt;p&gt;Если параметр &lt;code&gt;encoding&lt;/code&gt; указан и не равен &lt;code&gt;None&lt;/code&gt;, то библиотека работает с unicode строками, но предполагает указанную кодировку для всех данных вместо UTF-8, которая используется по умолчанию.&lt;/p&gt;\n&lt;p&gt;Пример использования с комментариями можно найти &lt;a href=\"api/python/examples.html#yson_string_proxy\"&gt;в отдельном разделе&lt;/a&gt;&lt;/p&gt;\n&lt;h3 id=\"batch-zaprosy\"&gt;&lt;a href=\"ru/api/python/userdoc.html#batch-zaprosy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batch-запросы&lt;/span&gt;&lt;/a&gt;Batch-запросы&lt;/h3&gt;\n&lt;p&gt;Низкоуровневое API:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.execute_batch\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;execute_batch&lt;/a&gt; — принимает набор описаний запросов в виде списка и возвращает набор результатов. Простая обертка над &lt;a href=\"api/commands.html#execute_batch\"&gt;командой API&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Высокоуровневое API:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.batch_helpers.create_batch_client\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;create_batch_client&lt;/a&gt; — создает batch-клиент. Функция доступна, как у клиента, так и глобально. Batch-клиент имеет в качестве методов все функции API, которые поддерживаются в batch-запросах.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.batch_apply\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;batch_apply&lt;/a&gt; — данный метод позволяет применить функцию к набору данных в batch-режиме. Возвращает список полученных результатов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;client = yt.YtClient(&lt;span class=\"hljs-string\"&gt;\"cluster-name\"&lt;/span&gt;)\n\nbatch_client = client.create_batch_client()\nlist_rsp = batch_client.&lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"/\"&lt;/span&gt;)\nexists_rsp = batch_client.exists(&lt;span class=\"hljs-string\"&gt;\"/\"&lt;/span&gt;)\nbatch_client.commit_batch()\n\n&lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;(list_rsp.get_result())\n&lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;(exists_rsp.get_result())\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"616\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-616\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-616\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-616.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Подробней про batch-запросы можно узнать в &lt;a href=\"user-guide/storage/batch-requests.html\"&gt;tutorial&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Особенности при работе с batch клиентом:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;У метода &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.create_batch_client\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;create_batch_client&lt;/a&gt; и в конфигурации клиента имеется параметр &lt;code&gt;max_batch_size&lt;/code&gt;, по умолчанию равный 100. Когда у клиента вызывается метод &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.batch_client.BatchClient.commit_batch\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;commit_batch&lt;/a&gt;, запросы разделяются на части по &lt;code&gt;max_batch_size&lt;/code&gt; и выполняются указанными частями. Так сделано из-за естественных ограничений на размер одного запроса.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Все запросы отправляются с транзакцией клиента, из которого сконструирован batch-client. Если клиент используется внутри транзакции, то все запросы от него выполняются в контексте этой транзакции. Батч-клиент ведет себя аналогично.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;По умолчанию все ошибки, которые возникают в запросах, можно обработать, посмотрев на &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.batch_response.BatchResponse\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;BatchResponse&lt;/a&gt;, который возвращают методы батч-клиента.&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;client = yt.YtClient(&lt;span class=\"hljs-string\"&gt;\"cluster-name\"&lt;/span&gt;)\nbatch_client = client.create_batch_client()\nlist_rsp = batch_client.&lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//some/node\"&lt;/span&gt;)\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; list_rsp.is_ok():\n    &lt;span class=\"hljs-comment\"&gt;# ...&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;else&lt;/span&gt;:\n    error = yt.YtResponseError(list_rsp.get_error())\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; error.is_resolve_error():\n        &lt;span class=\"hljs-comment\"&gt;# Обрабатываем ситуацию, когда узла, на который сделан list не существует&lt;/span&gt;\n        &lt;span class=\"hljs-comment\"&gt;# ...&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"641\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-641\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-641\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-641.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;У метода &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.create_batch_client\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;create_batch_client&lt;/a&gt; имеется параметр &lt;code&gt;raise_errors&lt;/code&gt;, который можно указать равным &lt;code&gt;True&lt;/code&gt;, тогда, если хоть один запрос выполнился неуспешно, появится исключение &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.batch_execution.YtBatchRequestFailedError\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtBatchRequestFailedError&lt;/a&gt; со всеми ошибками. Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;client = yt.YtClient(&lt;span class=\"hljs-string\"&gt;\"cluster-name\"&lt;/span&gt;)\nbatch_client = client.create_batch_client(raise_errors=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\nlist_rsp = batch_client.&lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//some/node\"&lt;/span&gt;)\n&lt;span class=\"hljs-keyword\"&gt;try&lt;/span&gt;:\n    batch_client.commit_batch()\n&lt;span class=\"hljs-keyword\"&gt;except&lt;/span&gt; yt.YtBatchRequestFailedError &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; err:\n   &lt;span class=\"hljs-comment\"&gt;# Напечатаем сообщение об ошибке&lt;/span&gt;\n   &lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt; err.inner_errors[&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"message\"&lt;/span&gt;]  &lt;span class=\"hljs-comment\"&gt;# \"Error resolving path //some/node\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"647\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-647\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-647\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-647.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"commands\"&gt;&lt;a href=\"ru/api/python/userdoc.html#commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Команды&lt;/span&gt;&lt;/a&gt;Команды&lt;/h2&gt;\n&lt;p&gt;Библиотека yt делает команды доступными в Python API системы. Публичной частью библиотеки являются только методы, находящиеся в &lt;code&gt;yt/wrapper/__init__.py&lt;/code&gt; и &lt;code&gt;yt/yson/__init__.py&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Ряд опций в командах являются общими опциями для целых классов команд. Подробнее можно прочитать в разделе &lt;a href=\"api/commands.html\"&gt;Команды&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"cypress_commands\"&gt;&lt;a href=\"ru/api/python/userdoc.html#cypress_commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с Кипарисом&lt;/span&gt;&lt;/a&gt;Работа с Кипарисом&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.get\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get&lt;/a&gt; — получить значение узла Кипариса. &lt;a href=\"user-guide/storage/cypress-example.html#get\"&gt;Подробнее&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.set\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;set&lt;/a&gt; — записать значение в узел Кипариса. &lt;a href=\"user-guide/storage/cypress-example.html#set\"&gt;Подробнее&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.create\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;create&lt;/a&gt; — создать пустой узел Кипариса типа &lt;code&gt;type&lt;/code&gt; и атрибутами &lt;code&gt;attributes&lt;/code&gt;. &lt;a href=\"user-guide/storage/cypress-example.html#create\"&gt;Подробнее&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.exists\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;exists&lt;/a&gt; — проверить существование узла Кипариса. &lt;a href=\"user-guide/storage/cypress-example.html#exists\"&gt;Подробнее&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.remove\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;remove&lt;/a&gt; — удалить узел Кипариса. &lt;a href=\"user-guide/storage/cypress-example.html#remove\"&gt;Подробнее&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.list\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;list&lt;/a&gt; — получить список детей узла &lt;code&gt;path&lt;/code&gt;. Опция &lt;code&gt;absolute&lt;/code&gt; включает вывод абсолютных путей вместо относительных. &lt;a href=\"user-guide/storage/cypress-example.html#list\"&gt;Подробнее&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Примеры:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.create(&lt;span class=\"hljs-string\"&gt;\"table\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;, attributes={&lt;span class=\"hljs-string\"&gt;\"mykey\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"myvalue\"&lt;/span&gt;}) &lt;span class=\"hljs-comment\"&gt;# Output: &amp;lt;id of the created object&amp;gt;&lt;/span&gt;\nyt.get(&lt;span class=\"hljs-string\"&gt;\"//home/table/@mykey\"&lt;/span&gt;)  &lt;span class=\"hljs-comment\"&gt;# Output: \"myvalue\"&lt;/span&gt;\nyt.create(&lt;span class=\"hljs-string\"&gt;\"map_node\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//home/dir\"&lt;/span&gt;) &lt;span class=\"hljs-comment\"&gt;# Output: &amp;lt;id of the created object&amp;gt;&lt;/span&gt;\nyt.exists(&lt;span class=\"hljs-string\"&gt;\"//home/dir\"&lt;/span&gt;)  &lt;span class=\"hljs-comment\"&gt;# Output: True&lt;/span&gt;\n\nyt.&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//home/string_node\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"abcde\"&lt;/span&gt;)\nyt.get(&lt;span class=\"hljs-string\"&gt;\"//home/string_node\"&lt;/span&gt;)  &lt;span class=\"hljs-comment\"&gt;# Output: \"abcde\"&lt;/span&gt;\nyt.get(&lt;span class=\"hljs-string\"&gt;\"//home/string_node\"&lt;/span&gt;, &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"json\"&lt;/span&gt;)  &lt;span class=\"hljs-comment\"&gt;# Output: '\"abcde\"'&lt;/span&gt;\n\nyt.&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//home/string_node/@mykey\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;)  &lt;span class=\"hljs-comment\"&gt;# Установить атрибут&lt;/span&gt;\nyt.get(&lt;span class=\"hljs-string\"&gt;\"//home/string_node/@mykey\"&lt;/span&gt;)  &lt;span class=\"hljs-comment\"&gt;# Output: \"value\"&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;## Создаёт документ и использует его в качестве словаря&lt;/span&gt;\nyt.create(&lt;span class=\"hljs-string\"&gt;\"document\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//home/doc\"&lt;/span&gt;)\nyt.&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//home/doc\"&lt;/span&gt;, {&lt;span class=\"hljs-string\"&gt;\"number\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;7&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"vegetable\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"tomato\"&lt;/span&gt;})\nyt.get(&lt;span class=\"hljs-string\"&gt;\"//home/doc\"&lt;/span&gt;)  &lt;span class=\"hljs-comment\"&gt;# Output: [7L, \"tomato\"]&lt;/span&gt;\nyt.&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//home/doc/vegetable\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"cabbage\"&lt;/span&gt;)\nyt.get(&lt;span class=\"hljs-string\"&gt;\"//home/doc\"&lt;/span&gt;)  &lt;span class=\"hljs-comment\"&gt;# Output: [7L, \"cabbage\"]&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;## Создаёт документ и использует в качестве списка, записывая в конец число и строку&lt;/span&gt;\nyt.create(&lt;span class=\"hljs-string\"&gt;\"document\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//home/doc-list\"&lt;/span&gt;)\nyt.&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//home/doc-list\"&lt;/span&gt;, [])\nyt.&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//home/doc-list/end\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;7&lt;/span&gt;)\nyt.&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//home/doc-list/end\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"cabbage\"&lt;/span&gt;)\nyt.get(&lt;span class=\"hljs-string\"&gt;\"//home/doc-list\"&lt;/span&gt;)  &lt;span class=\"hljs-comment\"&gt;# Output: [7L, \"cabbage\"]&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"695\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-695\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-695\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-695.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.copy\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;copy&lt;/a&gt; и &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.move\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;move&lt;/a&gt; — скопировать/переместить узел Кипариса. Подробнее про значение опций можно прочитать в &lt;a href=\"user-guide/storage/cypress-example.html#copy_move\"&gt;разделе&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.link\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;link&lt;/a&gt; — сделать символьную ссылку на узел Кипариса. &lt;a href=\"user-guide/storage/cypress-example.html#link\"&gt;Подробнее&lt;/a&gt;.&lt;br /&gt;\nЧтобы узнать, куда указывает символьная ссылка, необходимо прочитать значение атрибута &lt;code&gt;@path&lt;/code&gt;. Для обращения к объекту типа &lt;code&gt;link&lt;/code&gt; используйте &lt;code&gt;&amp;amp;&lt;/code&gt; в конце пути.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Примеры:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.create(&lt;span class=\"hljs-string\"&gt;\"table\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;)\nyt.copy(&lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/test/path/table\"&lt;/span&gt;)\n&lt;span class=\"hljs-comment\"&gt;## error&lt;/span&gt;\nyt.copy(&lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/test/path/table\"&lt;/span&gt;, recursive=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\nyt.get(&lt;span class=\"hljs-string\"&gt;\"//home/table/@account\"&lt;/span&gt;)\n&lt;span class=\"hljs-comment\"&gt;## Output: sys&lt;/span&gt;\nyt.get(&lt;span class=\"hljs-string\"&gt;\"//tmp/test/path/table/@account\"&lt;/span&gt;)\n&lt;span class=\"hljs-comment\"&gt;## Output: tmp&lt;/span&gt;\n\nyt.move(&lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/test/path/table\"&lt;/span&gt;)\n&lt;span class=\"hljs-comment\"&gt;## error&lt;/span&gt;\nyt.move(&lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/test/path/table\"&lt;/span&gt;, force=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\nyt.get(&lt;span class=\"hljs-string\"&gt;\"//tmp/test/path/table/@account\"&lt;/span&gt;)\n&lt;span class=\"hljs-comment\"&gt;## Output: sys&lt;/span&gt;\n\nyt.link(&lt;span class=\"hljs-string\"&gt;\"//tmp/test/path/table\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;)\nyt.get(&lt;span class=\"hljs-string\"&gt;\"//home/table/@path\"&lt;/span&gt;)\n&lt;span class=\"hljs-comment\"&gt;##Output: \"/tmp/test/path/table\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"711\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-711\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-711\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-711.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Функция-алиас для создания директории:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.mkdir\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;mkdir&lt;/a&gt; — создает директорию, то есть узел типа &lt;code&gt;map_node&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Функции-алиасы для работы с атрибутами&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.get_attribute\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get_attribute&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.has_attribute\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;has_attribute&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.set_attribute\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;set_attribute&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.remove_attribute\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;remove_attribute&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Обратите внимание, что данные функции намеренно не поддерживают обращение к вложенным атрибутам.&lt;br /&gt;\nДля работы с вложенными атрибутами стоит использовать обычн
