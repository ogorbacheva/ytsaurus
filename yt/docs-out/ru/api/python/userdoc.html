&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.MapJobIOSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MapJobIOSpecBuilder&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Spec builder'ы для заполнения спецификации пользовательского джоба:\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.MapperSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MapperSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.ReducerSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ReducerSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.ReduceCombinerSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ReduceCombinerSpecBuilder&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;смотрите &lt;a href=\"api/python/examples.html#spec_builder\"&gt;пример в туториале&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"drugie-parametry-komand-zapuska-operacij\"&gt;&lt;a href=\"ru/api/python/userdoc.html#drugie-parametry-komand-zapuska-operacij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Другие параметры команд запуска операций&lt;/span&gt;&lt;/a&gt;Другие параметры команд запуска операций&lt;/h4&gt;\n&lt;p&gt;Общим для всех функций запуска операций является параметр &lt;code&gt;sync&lt;/code&gt; (&lt;code&gt;True&lt;/code&gt; по умолчанию). Если &lt;code&gt;sync=True&lt;/code&gt;, то при вызове функции будет синхронно происходить ожидание окончания операции. В случае же &lt;code&gt;sync=False&lt;/code&gt; клиенту вернется объект типа &lt;a href=\"ru/api/python/userdoc.html#operation_class\"&gt;Operation&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Если интересующего параметра нет в соответствующем spec builder'е, можно использовать параметр &lt;code&gt;spec&lt;/code&gt; типа &lt;code&gt;dict&lt;/code&gt;, который позволяет явно задать произвольные опции для спецификации операции (указанный параметр имеет наивысший приоритет при формировании спецификации). Например, можно указать желаемое количество данных на джоб: &lt;code&gt;yt.run_map(my_mapper, \"//tmp/in\", \"//tmp/out\", spec={\"data_weight_per_job\": 1024 * 1024})&lt;/code&gt; (но конкретно в этом случае правильнее использовать &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.MapSpecBuilder.data_size_per_job\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;метод билдера&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;Все обязательные параметры спецификации вынесены в отдельные опции. К таким параметрам относятся пути входных/выходных таблиц, команда (для операций с пользовательским кодом). Для операций sort , reduce, map_reduce, join_reduce вынесены в отдельные опции параметры &lt;code&gt;sort_by&lt;/code&gt;, &lt;code&gt;reduce_by&lt;/code&gt; и &lt;code&gt;join_by&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Параметры &lt;code&gt;source_table&lt;/code&gt; и &lt;code&gt;destination_table&lt;/code&gt; могут принимать на вход как путь к таблице, так и список путей к таблицам, корректно обрабатывая оба случая в зависимости от того, ожидает ли операция в данном месте путь к таблице или в набор путей к таблице. В качестве пути к таблице принимается как строки, так и объекты типа &lt;a href=\"ru/api/python/userdoc.html#tablepath_class\"&gt;TablePath&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;В параметры вынесен ряд параметров, которые относительно часто возникает необходимость изменять. К ним относятся &lt;code&gt;job_io&lt;/code&gt; и его часть &lt;code&gt;table_writer&lt;/code&gt;. Данные параметры будут добавлены в соответствующие части спецификации. В случае если у операции несколько стадий, то указанные через &lt;code&gt;job_io&lt;/code&gt; параметры доедут до всех стадий. Для всех операций, имеющих в спецификации параметр &lt;code&gt;job_count&lt;/code&gt;, он вынесен в отдельную опцию.&lt;/p&gt;\n&lt;p&gt;Для всех операций с пользовательским кодом в отдельную опцию вынесен &lt;code&gt;memory_limit&lt;/code&gt; и опции &lt;code&gt;format&lt;/code&gt;, &lt;code&gt;input_format&lt;/code&gt;,&lt;code&gt;output_format&lt;/code&gt;, позволяющие специфицировать &lt;a href=\"user-guide/storage/formats.html\"&gt;формат входных/выходных данных&lt;/a&gt;. Имеются параметры &lt;code&gt;yt_files&lt;/code&gt; и &lt;code&gt;local_files&lt;/code&gt; (и алиас &lt;code&gt;files&lt;/code&gt;), позволяющие задать пути файлов в Кипарисе и пути к локальным файлам (соответственно), которые приедут в окружение джоба.&lt;/p&gt;\n&lt;p&gt;Для операции map_reduce все параметры пользовательского скрипта, описанные в предыдущем абзаце, продублированы отдельно для mapper-а, reducer-a и reduce-combiner-а.&lt;/p&gt;\n&lt;p&gt;В качестве &lt;code&gt;binary&lt;/code&gt; может быть передана как &lt;a href=\"user-guide/data-processing/operations/overview.html\"&gt;команда запуска&lt;/a&gt; в виде строки, так и callable python-объект. Операции с callable-объектами в качестве &lt;code&gt;binary&lt;/code&gt; называются &lt;a href=\"ru/api/python/userdoc.html#python_operations\"&gt;python-операциями&lt;/a&gt;. В случае, если в качестве &lt;code&gt;binary&lt;/code&gt; передана команда запуска, обязательно должен быть указан &lt;a href=\"ru/api/python/userdoc.html#python_formats\"&gt;формат&lt;/a&gt;. В случае же callable-объекта передавать формат не обязательно.&lt;/p&gt;\n&lt;p&gt;Любая операция, которая пишет в destination_table, может не удалять существующую таблицу, а дописывать записи в конец. Для этого в качестве destination_table можно указать &lt;a href=\"ru/api/python/userdoc.html#tablepath_class\"&gt;объект типа TablePath&lt;/a&gt; с опцией &lt;code&gt;append=True&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;При запуске операции &lt;code&gt;map_reduce&lt;/code&gt; с несколькими входными таблицами нужно иметь в виду, что клиент YTsaurus может добавить во входные записи переключатели таблиц, что может привести к попаданию этих переключателей в выходной поток (если эти записи передавать в выходной поток as is, e.g. mapper из одной строки &lt;code&gt;yield row&lt;/code&gt;). Это может привести к ошибке записи в несуществующую таблицу. Чтобы избежать подобной ситуации следует либо выключить table index с помощью опции &lt;code&gt;enable_input_table_index&lt;/code&gt; в спецификации, либо вручную удалять table index перед записью в выходной поток — &lt;code&gt;del row[\"@table_index\"]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;У функции &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_map_reduce\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_map_reduce&lt;/a&gt; все опции, специфичные для конкретного джоба, продублированы в трех экземплярах – для mapper-а, для reducer-а и для reduce_combiner-а. То есть у функции есть опции &lt;code&gt;map_local_files&lt;/code&gt;, &lt;code&gt;reduce_local_files&lt;/code&gt;, &lt;code&gt;reduce_combiner_local_files&lt;/code&gt;, и.т.п. Полный список опций можно посмотреть в &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_map_reduce\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;pydoc-е&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"operation_and_job_commands\"&gt;&lt;a href=\"ru/api/python/userdoc.html#operation_and_job_commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с операциями и джобами&lt;/span&gt;&lt;/a&gt;Работа с операциями и джобами&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.get_operation_state\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get_operation_state&lt;/a&gt; — возвращает состояние текущей операции. Возвращаемым объектом является класс, у которого есть единственное поле &lt;code&gt;name&lt;/code&gt; и методы &lt;code&gt;is_finished, is_running, is_unsuccessfully_finished&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.abort_operation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;abort_operation&lt;/a&gt;— прервать операцию, не сохранив её результат.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.suspend_operation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;suspend_operation&lt;/a&gt; — приостановить операцию.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.resume_operation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;resume_operation&lt;/a&gt; — продолжить приостановленную операцию.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.complete_operation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;complete_operation&lt;/a&gt; — завершить операцию с текущим имеющимся результатом.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;При запуске операции с флагом &lt;code&gt;sync=False&lt;/code&gt; удобнее использовать методы &lt;code&gt;abort, suspend, resume, complete&lt;/code&gt; класса &lt;code&gt;Operation&lt;/code&gt; вместо перечисленных выше, смотрите раздел &lt;a href=\"ru/api/python/userdoc.html#operation_class\"&gt;Operation&lt;/a&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_job_shell\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_job_shell&lt;/a&gt; —  запустить job-shell для джоба. Проще использовать данную функцию с помощью аналогичной команды в &lt;a href=\"api/cli/examples.html\"&gt;CLI&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"operation_and_job_info_commands\"&gt;&lt;a href=\"ru/api/python/userdoc.html#operation_and_job_info_commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Получение информации о джобах и операциях&lt;/span&gt;&lt;/a&gt;Получение информации о джобах и операциях&lt;/h4&gt;\n&lt;p&gt;Операция имеет довольно нетривиальный жизненный цикл и в разные моменты времени информация об операции может быть получена из разных источников:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Кипарис (содержит информацию о выполняющихся и еще не заархивированных операциях)&lt;/li&gt;\n&lt;li&gt;Орхидея контроллер-агента (содержит всю актуальную информацию о выполняющихся операциях)&lt;/li&gt;\n&lt;li&gt;Архив операций (содержит информацию о завершенных операциях)&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Так как информация об операции может быть получена из разных источников (которые могут меняться как по составу, так и по своему внутреннему устройству), то существуют следующие методы, которые в любой момент умеют собирать информацию об операции из перечисленных источников.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operation_commands.get_operation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get_operation&lt;/a&gt; — получить информацию об операции по ее id. Возвращается &lt;code&gt;dict&lt;/code&gt; с полями, аналогичными полям ответа &lt;a href=\"api/commands.html#get_operation\"&gt;get_operation&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operation_commands.list_operations\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;list_operations&lt;/a&gt; — получить информацию про набор операций по фильтрам. Смысл полей аналогичен &lt;code&gt;get_operation&lt;/code&gt;. Список фильтров см. в разделе &lt;a href=\"api/commands.html#list_operations\"&gt;Команды&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operation_commands.iterate_operations\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;iterate_operations&lt;/a&gt; — получить итератор на набор операций. Функция аналогична &lt;code&gt;list_operations&lt;/code&gt;, но не имеет ограничения на количество запрашиваемых операций.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример - вывести типы трех последних операций, запущенных пользователем &lt;code&gt;username&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; datetime &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; datetime\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\nresult = yt.list_operations(\n    user=&lt;span class=\"hljs-string\"&gt;\"username\"&lt;/span&gt;,\n    cursor_time=datetime.utcnow(),\n    cursor_direction=&lt;span class=\"hljs-string\"&gt;\"past\"&lt;/span&gt;,\n    limit=&lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;,\n)\n&lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;([op[&lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;] &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; op &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; result[&lt;span class=\"hljs-string\"&gt;\"operations\"&lt;/span&gt;]])\n&lt;span class=\"hljs-comment\"&gt;## Output: ['sort', 'sort', 'sort']&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1662\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1662\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1662\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1662.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Другой пример - найти все выполняющиеся операции, запущенные в пользовательских эфемерных пулах:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; op &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; client.iterate_operations(state=&lt;span class=\"hljs-string\"&gt;\"running\"&lt;/span&gt;):\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"$\"&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; op.get(&lt;span class=\"hljs-string\"&gt;\"pool\"&lt;/span&gt;):\n        &lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;(op[&lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt;], op[&lt;span class=\"hljs-string\"&gt;\"start_time\"&lt;/span&gt;])\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1666\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1666\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1666\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1666.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Информация про джобы операции находится в планировщике и в архиве. Следующие методы позволяют получить информацию про джобы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operation_commands.get_job\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get_job&lt;/a&gt; — получить информацию про джоб. Возвращается &lt;code&gt;dict&lt;/code&gt; с полями, аналогичными полям ответа &lt;a href=\"api/commands.html#get_job\"&gt;get_job&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operation_commands.list_jobs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;list_jobs&lt;/a&gt; — получить информацию про набор джобов операции. Смысл полей в ответе аналогичен &lt;code&gt;get_job&lt;/code&gt;. Список фильтров см. в разделе &lt;a href=\"api/commands.html#list_jobs\"&gt;Команды&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operation_commands.get_job_stderr\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get_job_stderr&lt;/a&gt; — получить stderr джоба.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operation_commands.get_job_input\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get_job_input&lt;/a&gt; — получить полный вход джоба.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operation_commands.get_job_input_paths\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get_job_input_paths&lt;/a&gt; — получить список входных таблиц (с диапазонами строк) джоба.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.get_job_spec\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get_job_spec&lt;/a&gt; — получить спецификацию джоба.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Вызовы функций из данного раздела внутри себя могут обращаться к мастер-серверам, планировщику, узлам кластера (а обращения к мастер-серверам и планировщику не масштабируются) поэтому не стоит использовать их слишком часто.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для отладки невыполнившихся (failed) джобов удобно использовать &lt;a href=\"user-guide/problems/jobstatistics.html\"&gt;job tool&lt;/a&gt;. Данная утилита позволяет подготовить окружение, аналогичное окружению джоба и запустить его для тех же входных данных.&lt;/p&gt;\n&lt;h4 id=\"operation_class\"&gt;&lt;a href=\"ru/api/python/userdoc.html#operation_class\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Operation&lt;/span&gt;&lt;/a&gt;Operation&lt;/h4&gt;\n&lt;p&gt;Объект данного класса возвращают команды запуска операций &lt;code&gt;run_*&lt;/code&gt;. Он предоставляет &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operation_commands.Operation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;небольшое API&lt;/a&gt; для работы с уже запущенной (или завершенной) операцией.&lt;/p&gt;\n&lt;h4 id=\"operations_tracker_class\"&gt;&lt;a href=\"ru/api/python/userdoc.html#operations_tracker_class\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;OperationsTracker&lt;/span&gt;&lt;/a&gt;OperationsTracker&lt;/h4&gt;\n&lt;p&gt;Для удобной работы с несколькими операциями можно использовать &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operations_tracker.OperationsTracker\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;OperationsTracker&lt;/a&gt;. Его также можно использовать для работы с операциями, запущенными на разных кластерах. OperationsTracker имеет следующий интерфейс:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operations_tracker.OperationsTrackerBase.add\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;add&lt;/a&gt; — добавить объект типа &lt;code&gt;Operation&lt;/code&gt; во множество отслеживаемых&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operations_tracker.OperationsTracker.add_by_id\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;add_by_id&lt;/a&gt; — добавить операцию по id во множество отслеживаемых&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operations_tracker.OperationsTrackerBase.wait_all\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;wait_all&lt;/a&gt; — дождаться завершения всех операций&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operations_tracker.OperationsTrackerBase.abort_all\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;abort_all&lt;/a&gt; — прервать все отслеживаемые операции&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; yt.OperationsTracker() &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; tracker:\n    op1 = yt.run_map(&lt;span class=\"hljs-string\"&gt;\"sleep 10; cat\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/table1\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/table1_out\"&lt;/span&gt;, sync=&lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;)\n    op2 = yt.run_map(&lt;span class=\"hljs-string\"&gt;\"sleep 10; cat\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/table2\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/table2_out\"&lt;/span&gt;, sync=&lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;)\n    tracker.add(op1)\n    tracker.add(op2)\n    tracker.abort_all()\n    tracker.add(yt.run_map(&lt;span class=\"hljs-string\"&gt;\"true\"&lt;/span&gt;, table, TEST_DIR + &lt;span class=\"hljs-string\"&gt;\"/out\"&lt;/span&gt;, sync=&lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;))\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1752\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1752\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1752\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1752.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;На выходе из &lt;code&gt;with&lt;/code&gt;-блока трекер дождется завершения всех операций. Если произошло исключение, то все запущенные операции будут прерваны.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование трекера без &lt;code&gt;with&lt;/code&gt; является устаревшим и не рекомендованным.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"operations_tracker_pool_class\"&gt;&lt;a href=\"ru/api/python/userdoc.html#operations_tracker_pool_class\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;OperationsTrackerPool&lt;/span&gt;&lt;/a&gt;OperationsTrackerPool&lt;/h4&gt;\n&lt;p&gt;Класс &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operations_tracker.OperationsTrackerPool\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;OperationsTrackerPool&lt;/a&gt; похож на &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operations_tracker.OperationsTracker\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;OperationsTracker&lt;/a&gt;, но дополнительно гарантирует, что не будет запущено более чем &lt;code&gt;pool_size&lt;/code&gt; операций одновременно. На вход методы класса принимают один или несколько spec builder-ов (смотрите соответствующий &lt;a href=\"ru/api/python/userdoc.html#spec_builder\"&gt;раздел&lt;/a&gt;).&lt;br /&gt;\nДанный класс создает фоновый поток, который постепенно запускает все операции из очереди, соблюдая гарантии на число одновременно выполняющихся операций.&lt;br /&gt;\nИнтерфейс:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operations_tracker.OperationsTrackerPool.add\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;add&lt;/a&gt; — принимает на вход spec builder и добавляет его в очередь на запуск&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operations_tracker.OperationsTrackerPool.map\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;map&lt;/a&gt; — принимает на вход список spec builder-ов. Остальные параметры имеют тот же смысл, что и у метода add.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"acl_commands\"&gt;&lt;a href=\"ru/api/python/userdoc.html#acl_commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работы с правами доступа&lt;/span&gt;&lt;/a&gt;Работы с правами доступа&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.check_permission\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;check_permission&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.add_member\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;add_member&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.remove_member\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;remove_member&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Примеры:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.create(&lt;span class=\"hljs-string\"&gt;\"user\"&lt;/span&gt;, attributes={&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"tester\"&lt;/span&gt;})\nyt.check_permission(&lt;span class=\"hljs-string\"&gt;\"tester\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"read\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//sys\"&lt;/span&gt;)\n&lt;span class=\"hljs-comment\"&gt;## Output: {\"action\": \"allow\", ...}&lt;/span&gt;\nyt.create(&lt;span class=\"hljs-string\"&gt;\"group\"&lt;/span&gt;, attributes={&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"test_group\"&lt;/span&gt;})\nyt.add_member(&lt;span class=\"hljs-string\"&gt;\"tester\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"test_group\"&lt;/span&gt;)\nyt.get_attribute(&lt;span class=\"hljs-string\"&gt;\"//sys/groups/testers\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"members\"&lt;/span&gt;)\n&lt;span class=\"hljs-comment\"&gt;## Output: [\"tester\"]&lt;/span&gt;\nyt.remove_member(&lt;span class=\"hljs-string\"&gt;\"tester\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"test_group\"&lt;/span&gt;)\nyt.get_attribute(&lt;span class=\"hljs-string\"&gt;\"//sys/groups/testers\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"members\"&lt;/span&gt;)\n&lt;span class=\"hljs-comment\"&gt;## Output: []&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1807\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1807\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1807\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1807.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"dyntables_commands\"&gt;&lt;a href=\"ru/api/python/userdoc.html#dyntables_commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с динамическими таблицами&lt;/span&gt;&lt;/a&gt;Работа с динамическими таблицами&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Динамические таблицы&lt;/a&gt; реализуют интерфейс точечного чтения и записи данных по ключу, поддерживающих транзакции и собственный диалект SQL.&lt;/p&gt;\n&lt;p&gt;Список команд для работы с содержимым динамических таблиц.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.insert_rows\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;insert_rows&lt;/a&gt; — &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html#insert_rows\"&gt;вставить&lt;/a&gt; строки в динамическую таблицу&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.lookup_rows\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;lookup_rows&lt;/a&gt; — &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html#chtenie-stroki\"&gt;выбрать&lt;/a&gt; строки с заданными ключами&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.delete_rows\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;delete_rows&lt;/a&gt; — &lt;a href=\"../../../user-guide/dynamic-tables//sorted-dynamic-tables.md#udalenie-stroki\"&gt;удалить&lt;/a&gt; строки с заданными ключами&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.select_rows\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;select_rows&lt;/a&gt; — &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html#vypolnenie-zaprosa\"&gt;выбрать&lt;/a&gt; строки, удовлетворяющие запросу на &lt;a href=\"user-guide/dynamic-tables/dyn-query-language.html\"&gt;диалекте SQL&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.lock_rows\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;lock_rows&lt;/a&gt; — &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html#blokirovka-stroki\"&gt;заблокировать&lt;/a&gt; строки с заданными ключами&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.trim_rows\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;trim_rows&lt;/a&gt; — &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables#trim\"&gt;удалить&lt;/a&gt; заданное количество строк из упорядоченной таблицы&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Команды, связанные с &lt;a href=\"user-guide/dynamic-tables/overview.html#mount_table\"&gt;монтирование&lt;/a&gt; таблиц.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.mount_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;mount_table&lt;/a&gt; — примонтировать динамическую таблицу&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.unmount_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;unmount_table&lt;/a&gt; — отмонтировать динамическую таблицу&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.remount_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;remount_table&lt;/a&gt; — перемонтировать динамическую таблицу&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Команды, связанные с &lt;a href=\"user-guide/dynamic-tables/resharding.html\"&gt;шардированием&lt;/a&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.reshard_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;reshard_table&lt;/a&gt; — решардировать таблицу по указанным pivot-ключам&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.reshard_table_automatic\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;reshard_table_automatic&lt;/a&gt; — пошардировать примонтированные таблеты в соответствии с конфигурацией таблет-балансера.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Другие команды.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.freeze_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;freeze_table&lt;/a&gt; — &lt;a href=\"user-guide/dynamic-tables/overview.html#zamorozka\"&gt;заморозить&lt;/a&gt; таблицу&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.unfreeze_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;unfreeze_table&lt;/a&gt; — &lt;a href=\"user-guide/dynamic-tables/overview.html#zamorozka\"&gt;разморозить&lt;/a&gt; таблицу&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.balance_tablet_cells\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;balance_tablet_cells&lt;/a&gt; — распределить таблеты равномерно по &lt;a href=\"user-guide/dynamic-tables/overview.html#tablet_cells\"&gt;таблет-селлам&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.get_tablet_infos\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get_tablet_infos&lt;/a&gt; — получить атрибуты &lt;a href=\"user-guide/dynamic-tables/overview.html#tablets\"&gt;таблета&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.get_tablet_errors\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get_tablet_errors&lt;/a&gt; — получить ошибки &lt;a href=\"user-guide/dynamic-tables/overview.html#tablets\"&gt;таблета&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.dynamic_table_commands.alter_table_replica\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;alter_table_replica&lt;/a&gt; — &lt;a href=\"user-guide/dynamic-tables/replicated-dynamic-tables.html#nastrojki-replik\"&gt;изменить атрибуты&lt;/a&gt; реплики &lt;a href=\"user-guide/dynamic-tables/replicated-dynamic-tables.html\"&gt;реплицированной таблицы&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"etc_commands\"&gt;&lt;a href=\"ru/api/python/userdoc.html#etc_commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Другие команды&lt;/span&gt;&lt;/a&gt;Другие команды&lt;/h3&gt;\n&lt;h4 id=\"preobrazovaniya-tablic\"&gt;&lt;a href=\"ru/api/python/userdoc.html#preobrazovaniya-tablic\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Преобразования таблиц&lt;/span&gt;&lt;/a&gt;Преобразования таблиц&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Transform.&lt;/strong&gt; Иногда бывает необходимо переложить таблицу в новый кодек сжатия или erasure, переложить таблицу в &lt;a href=\"user-guide/storage/chunks.html\"&gt;новый формат чанка&lt;/a&gt;. В решении таких задач поможет функция &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.transform\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;transform&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Функция запускает &lt;code&gt;merge&lt;/code&gt;-операцию над входной таблицей, выполняя пережатие данных в соответствии с указанными параметрами. Если опция &lt;code&gt;check_codecs&lt;/code&gt; выставлена в &lt;code&gt;True&lt;/code&gt;, то функция проверяет, сжаты ли уже данные, и если да, то операция не запускается. Если указана опция &lt;code&gt;optimize_for&lt;/code&gt;, то операция запускается всегда (опция &lt;code&gt;check_codecs&lt;/code&gt; игнорируется), так как нет возможности проверить какой формат имеют чанки таблицы.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Shuffle.&lt;/strong&gt; Для перемешивания строк таблицы в случайном порядке существует функция &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.shuffle_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;shuffle_table&lt;/a&gt;.&lt;br /&gt;\nФункция запускает операцию &lt;code&gt;map_reduce&lt;/code&gt;, сортирующую таблицу по добавленной колонке со случайным числом.&lt;/p&gt;\n&lt;h2 id=\"python_operations\"&gt;&lt;a href=\"ru/api/python/userdoc.html#python_operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Python-объекты в качестве операций&lt;/span&gt;&lt;/a&gt;Python-объекты в качестве операций&lt;/h2&gt;\n&lt;h3 id=\"python_operations_intro\"&gt;&lt;a href=\"ru/api/python/userdoc.html#python_operations_intro\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общая информация&lt;/span&gt;&lt;/a&gt;Общая информация&lt;/h3&gt;\n&lt;p&gt;Для того, чтобы запустить операцию, необходимо описать специальный класс-наследник &lt;code&gt;yt.wrapper.TypedJob&lt;/code&gt; и передать объект данного класса в &lt;a href=\"ru/api/python/userdoc.html#run_operation_commands\"&gt;функцию&lt;/a&gt; запуска операции (либо указать в соответствующем поле &lt;a href=\"ru/api/python/userdoc.html#spec_builders\"&gt;SpecBuilder-а&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;В классе джоба обязательно должен быть определен метод &lt;code&gt;__call__(self, row)&lt;/code&gt; (для mapper-а) или &lt;code&gt;__call__(self, rows)&lt;/code&gt; (для reducer-а). На вход данному методу приходят строки таблицы (в случае reducer-а один вызов &lt;code&gt;__call__&lt;/code&gt; соответствует набору строк с одинаковым ключом). Он обязан вернуть (&lt;strong&gt;с помощью &lt;code&gt;yield&lt;/code&gt;&lt;/strong&gt;) строки, которые нужно записать в выходную таблицу. Если выходных таблиц несколько, нужно использовать класс-обёртку &lt;code&gt;yt.wrapper.OutputRow&lt;/code&gt;, конструктор которого принимает записываемую строку и &lt;code&gt;table_index&lt;/code&gt; в виде именованного параметра (смотрите &lt;a href=\"api/python/examples.html#table_switches\"&gt;пример&lt;/a&gt; в туториале).&lt;/p&gt;\n&lt;p&gt;Дополнительно можно определить методы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;start(self)&lt;/code&gt; — будет вызван ровно один раз перед обработкой записей джоба;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;finish(self)&lt;/code&gt; — будет вызван один раз после обработки записей джоба.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Эти методы, как и &lt;code&gt;__call__&lt;/code&gt;, могут генерировать с помощью &lt;code&gt;yield&lt;/code&gt; новые записи. Это позволяет делать буферизацию или какое-то накапливание данных. Эти методы не вызываются для операций, помеченных &lt;code&gt;@yt.aggregator&lt;/code&gt; и получающих весь вход целиком.&lt;/p&gt;\n&lt;p&gt;Также можно определить метод &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.prepare_operation.TypedJob.prepare_operation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;.prepare_operation(self, context, preparer)&lt;/a&gt;. Он используется для указания типов строк входных и выходных таблиц, а также для модификации спеки операции. Для более подробной информации смотрите раздел &lt;a href=\"ru/api/python/userdoc.html#prepare_operation\"&gt;Подготовка операции из джоба&lt;/a&gt;, а также изучите примеры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#prepare_operation\"&gt;{#T}&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#grep\"&gt;{#T}&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"prepare_operation\"&gt;&lt;a href=\"ru/api/python/userdoc.html#prepare_operation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подготовка операции из джоба&lt;/span&gt;&lt;/a&gt;Подготовка операции из джоба&lt;/h3&gt;\n&lt;p&gt;Для указания входных и выходных типов строк в классе джоба можно использовать тайп хинты (смотрите примеры в туториале: &lt;a href=\"api/python/examples.html#simple_map\"&gt;раз&lt;/a&gt;, &lt;a href=\"api/python/examples.html#multiple_input_reduce\"&gt;два&lt;/a&gt;, &lt;a href=\"api/python/examples.html#multiple_input_multiple_output_reduce\"&gt;три&lt;/a&gt; и &lt;a href=\"api/python/examples.html#map_reduce_multiple_intermediate_streams\"&gt;четыре&lt;/a&gt;), либо переопределить метод &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.prepare_operation.TypedJob.prepare_operation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;&lt;code&gt;.prepare_operation(self, context, preparer)&lt;/code&gt;&lt;/a&gt;. Указание типов производится через методы объекта &lt;code&gt;preparer&lt;/code&gt; типа &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.prepare_operation.OperationPreparer\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;&lt;code&gt;OperationPreparer&lt;/code&gt;&lt;/a&gt;. Полезные методы:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.prepare_operation.OperationPreparer.inputs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;&lt;code&gt;inputs&lt;/code&gt;&lt;/a&gt;: позволяет указать для нескольких входных таблиц тип входной строки (обязан быть классом с декоратором &lt;a href=\"ru/api/python/userdoc.html#dataclass\"&gt;&lt;code&gt;@yt.wrapper.yt_dataclass&lt;/code&gt;&lt;/a&gt;), список имён колонок, которые нужны джобу, а также переименования колонок.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.prepare_operation.OperationPreparer.outputs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;&lt;code&gt;outputs&lt;/code&gt;&lt;/a&gt;: позволяет указать для нескольких выходных таблиц тип выходной строки (обязан быть классом с декоратором &lt;a href=\"ru/api/python/userdoc.html#dataclass\"&gt;&lt;code&gt;@yt.wrapper.yt_dataclass&lt;/code&gt;&lt;/a&gt;), а также схему, которую хочется вывести для этих таблиц (по умолчанию схема выводится из датакласса).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;input&lt;/code&gt; и &lt;code&gt;output&lt;/code&gt; — аналоги соответствующих методов, принимающие единственный индекс.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Объект &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.prepare_operation.OperationPreparationContext\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;&lt;code&gt;context&lt;/code&gt;&lt;/a&gt; позволяет получать информацию о входных и выходных потоках: их количество, схемы и пути к таблицам.&lt;/p&gt;\n&lt;p&gt;смотрите примеры в туториале: &lt;a href=\"api/python/examples.html#prepare_operation\"&gt;раз&lt;/a&gt; и &lt;a href=\"api/python/examples.html#grep\"&gt;два&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Если запускается MapReduce с несколькими промежуточными потоками, то требуется также переопределить метод &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.prepare_operation.TypedJob.get_intermediate_stream_count\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;.get_intermediate_stream_count(self)&lt;/a&gt;, вернув из него количество промежуточных потоков. Смотрите &lt;a href=\"api/python/examples.html#map_reduce_multiple_intermediate_streams\"&gt;пример&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"python_decorators\"&gt;&lt;a href=\"ru/api/python/userdoc.html#python_decorators\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Декораторы&lt;/span&gt;&lt;/a&gt;Декораторы&lt;/h3&gt;\n&lt;p&gt;Существует возможность пометить функции или классы джобов специальными декораторами, меняющими ожидаемый интерфейс взаимодействия с джобами.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.py_wrapper.aggregator\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;aggregator&lt;/a&gt; — декоратор, который позволяет отметить, что данный mapper является агрегатором, то есть принимает на вход итератор на строки, а не одну строку.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.py_wrapper.raw\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;raw&lt;/a&gt; — декоратор, который позволяет отметить, что функция принимает на вход поток сырых данных, а не распарсенные записи.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.py_wrapper.raw_io\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;raw_io&lt;/a&gt; — декоратор, который позволяет отметить, что функция будет брать записи (строки) из &lt;code&gt;stdin&lt;/code&gt; и писать в &lt;code&gt;stdout&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.py_wrapper.reduce_aggregator\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;reduce_aggregator&lt;/a&gt; — декоратор, который позволяет отметить, что reducer является агрегатором, то есть принимает на вход итератор не на записи с одним ключом, а генератор из пар, где каждая пара — (ключ, записи с этим ключом).&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.py_wrapper.with_context\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;with_context&lt;/a&gt; — декоратор, который позволяет заказать контекст для функции. В данном контексте будут находиться контрольные атрибуты, заказанные при запуске операции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Обратите внимание, что декораторы реализованы через простановку атрибута на функции. Поэтому, например, объявить функцию с декоратором, а потом сделать поверх неё &lt;code&gt;functools.partial&lt;/code&gt; не получится. Если вы хотите прямо при вызове передать какие-то параметры в функцию – стоит завести класс с декоратором (смотрите последний пример ниже).&lt;/p&gt;\n&lt;p&gt;Примеры можно найти в &lt;a href=\"api/python/examples.html#job_decorators\"&gt;туториале&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"pickling\"&gt;&lt;a href=\"ru/api/python/userdoc.html#pickling\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Pickling функции и окружения&lt;/span&gt;&lt;/a&gt;Pickling функции и окружения&lt;/h3&gt;\n&lt;h4 id=\"pickling_description\"&gt;&lt;a href=\"ru/api/python/userdoc.html#pickling_description\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общее устройство&lt;/span&gt;&lt;/a&gt;Общее устройство&lt;/h4&gt;\n&lt;p&gt;При запуске операции, которая является python функцией, происходит следующее:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Библиотека, используя модуль &lt;a href=\"https://github.com/uqfoundation/dill\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;dill&lt;/a&gt;, преобразует запускаемый объект (класс или функцию) в поток байт&lt;/li&gt;\n&lt;li&gt;Собирается локальное окружение, в котором запущена функция, передается внутрь джоба на кластере и там используется для корректного запуска вашей функции.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;После этого на кластере запускается специальный код из модуля &lt;code&gt;_py_runner.py&lt;/code&gt;, который локально в каждом джобе распаковывает все зависимости, преобразует функцию из набора байт в python объект и запускает её правильным образом, читая данные из stdin.&lt;/p&gt;\n&lt;h4 id=\"pickling_advises\"&gt;&lt;a href=\"ru/api/python/userdoc.html#pickling_advises\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ссылка на пост с советами&lt;/span&gt;&lt;/a&gt;Ссылка на пост с советами&lt;/h4&gt;\n&lt;p&gt;{% cut \"Примеры фильтрации модулей\" %}&lt;br /&gt;\nНапример, как отфильтровать передачу .so и .pyc файлов, сохранив передачу модуля yt (кстати, это же позволит запускать скрипты c Mac OS X):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.config[&lt;span class=\"hljs-string\"&gt;\"pickling\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"module_filter\"&lt;/span&gt;] = &lt;span class=\"hljs-keyword\"&gt;lambda&lt;/span&gt; module: &lt;span class=\"hljs-built_in\"&gt;hasattr&lt;/span&gt;(module, &lt;span class=\"hljs-string\"&gt;\"__file__\"&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;and&lt;/span&gt; \\\n    &lt;span class=\"hljs-keyword\"&gt;not&lt;/span&gt; module.__file__.endswith(&lt;span class=\"hljs-string\"&gt;\".so\"&lt;/span&gt;)\nyt.config[&lt;span class=\"hljs-string\"&gt;\"pickling\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"force_using_py_instead_of_pyc\"&lt;/span&gt;] = &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;## При работе через клиента можно задать в его конфиге:&lt;/span&gt;\nclient = yt.wrapper.client.Yt(config={&lt;span class=\"hljs-string\"&gt;\"pickling\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"module_filter\"&lt;/span&gt;: &lt;span class=\"hljs-keyword\"&gt;lambda&lt;/span&gt; ...}})\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2080\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2080\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2080\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2080.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;А можно написать свою функцию сбора зависимостей, взяв за основу &lt;a href=\"http://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.py_wrapper.create_modules_archive_default\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;дефолтную реализацию отсюда&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;my_create_modules_archive&lt;/span&gt;():\n    ...\n\nyt.config[&lt;span class=\"hljs-string\"&gt;\"pickling\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"create_modules_archive_function\"&lt;/span&gt;] = my_create_modules_archive\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2084\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2084\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2084\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2084.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если вы используете бинарные модули, которые динамически линкуются с другими библиотеками, которые на кластере отсутствуют, то стоит привезти эти библиотеки на кластер вручную (и не забыть при этом выставить переменную окружения &lt;code&gt;LD_LIBRARY_PATH&lt;/code&gt;), либо воспользоваться автоматическим сбором динамических библиотек для Python модулей. При автоматическом сборе на каждую &lt;code&gt;.so&lt;/code&gt;-шку вызывается &lt;code&gt;ldd&lt;/code&gt; и найденные зависимости пакуются.&lt;br /&gt;\nВключается следующим образом:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.config[&lt;span class=\"hljs-string\"&gt;\"pickling\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"dynamic_libraries\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"enable_auto_collection\"&lt;/span&gt;] = &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2088\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2088\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2088\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2088.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Также можно указать фильтр, если какие-то библиотеки добавлять не нужно. Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.config[&lt;span class=\"hljs-string\"&gt;\"pickling\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"dynamic_libraries\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"library_filter\"&lt;/span&gt;] = &lt;span class=\"hljs-keyword\"&gt;lambda&lt;/span&gt; lib: &lt;span class=\"hljs-keyword\"&gt;not&lt;/span&gt; lib.startswith(&lt;span class=\"hljs-string\"&gt;\"/lib\"&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2092\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2092\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2092\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2092.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;По умолчанию рекомендуется отфильтровывать библиотеки, которые находятся в директориях &lt;code&gt;/lib&lt;/code&gt;, &lt;code&gt;/lib64&lt;/code&gt;, так как там находятся разные системные библиотеки (например, &lt;code&gt;libcgroup&lt;/code&gt;) и их использование на кластере может привести к странным ошибкам. Отфильтровать можно функцией из примера выше.&lt;/p&gt;\n&lt;p&gt;Рецепты фильтров для разных случаев:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Если вы получаете ошибку: &lt;code&gt;AttributeError: 'module' object has no attribute 'openssl_md_meth_names'&lt;/code&gt;, то нужно отфильтровать hashlib:&lt;code&gt;yt.config[\"pickling\"][\"module_filter\"] = lambda module: \"hashlib\" not in getattr(module, \"__name__\", \"\") &lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Если у вас Anaconda, то нужно отфильтровать hashlib (смотрите пример фильтра выше), а также .so библиотеки. Для фильтрации .so библиотек можно использовать следующий фильтр:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.config[&lt;span class=\"hljs-string\"&gt;\"pickling\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"module_filter\"&lt;/span&gt;] = (\n    &lt;span class=\"hljs-keyword\"&gt;lambda&lt;/span&gt; module: &lt;span class=\"hljs-built_in\"&gt;hasattr&lt;/span&gt;(module, &lt;span class=\"hljs-string\"&gt;\"__file__\"&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;and&lt;/span&gt;\n    &lt;span class=\"hljs-keyword\"&gt;not&lt;/span&gt; module.__file__.endswith(&lt;span class=\"hljs-string\"&gt;\".so\"&lt;/span&gt;)\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2109\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2109\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2109\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2109.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данный фильтр также отфильтровывает YSON &lt;a href=\"ru/api/python/userdoc.html#yson\"&gt;биндинги&lt;/a&gt;. Если используется YSON, то стоит добавить библиотеку в исключения:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.config[&lt;span class=\"hljs-string\"&gt;\"pickling\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"module_filter\"&lt;/span&gt;] = (\n    &lt;span class=\"hljs-keyword\"&gt;lambda&lt;/span&gt; module: &lt;span class=\"hljs-built_in\"&gt;hasattr&lt;/span&gt;(module, &lt;span class=\"hljs-string\"&gt;\"__file__\"&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;and&lt;/span&gt;\n    (&lt;span class=\"hljs-keyword\"&gt;not&lt;/span&gt; module.__file__.endswith(&lt;span class=\"hljs-string\"&gt;\".so\"&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;or&lt;/span&gt; module.__file__.endswith(&lt;span class=\"hljs-string\"&gt;\"yson_lib.so\"&lt;/span&gt;)\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2118\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2118\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2118\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2118.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Вы запускаетесь свежим python2.7 и получаете ошибку вида: &lt;code&gt;ImportError: No module named urllib3&lt;/code&gt; или &lt;code&gt;ImportError: cannot import name _compare_digest&lt;/code&gt;, или не можете поимпортировать модуль &lt;code&gt;hmac&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Чтобы решить эту проблему, нужно отфильтровать hmac из модулей, которые вы забираете с собой (он импортирует из модуля operator метод, которого нет в python2.7.3, установленном на кластере).&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.config[&lt;span class=\"hljs-string\"&gt;\"pickling\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"module_filter\"&lt;/span&gt;] = ... &lt;span class=\"hljs-keyword\"&gt;and&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;getattr&lt;/span&gt;(module, &lt;span class=\"hljs-string\"&gt;\"__name__\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"\"&lt;/span&gt;) != &lt;span class=\"hljs-string\"&gt;\"hmac\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2129\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2129\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2129\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2129.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Также поддерживается автоматическая фильтрация .pyc и .so файлов в случае, если версия питона / операционной системы на кластере и клиенте отличаются. Опцию предварительно необходимо включить в конфиге:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.config[&lt;span class=\"hljs-string\"&gt;\"pickling\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"enable_modules_compatibility_filter\"&lt;/span&gt;] = &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2135\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2135\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2135\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2135.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;При запуске python-функции в джобе происходит распаковка и импорт всех модулей, которые есть в зависимостях, в частности вашего main-модуля. В связи с этим, вся бизнес-логика должна быть спрятана под &lt;code&gt;__main__&lt;/code&gt;, то есть, правильно делать следующим образом:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;Mapper&lt;/span&gt;(yt.TypedJob):\n    ...\n\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; __name__ == &lt;span class=\"hljs-string\"&gt;\"__main__\"&lt;/span&gt;:\n    yt.run_map(mapper, ...)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2139\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2139\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2139\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2139.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;/p&gt;\n&lt;h3 id=\"porto_layers\"&gt;&lt;a href=\"ru/api/python/userdoc.html#porto_layers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Porto-слои&lt;/span&gt;&lt;/a&gt;Porto-слои&lt;/h3&gt;\n&lt;p&gt;При запуске операции можно указать, какой &lt;a href=\"user-guide/data-processing/layers/layer-paths.html\"&gt;образ ФС&lt;/a&gt; необходимо подготовить перед запуском джобов.&lt;br /&gt;\nЕсть некоторый набор &lt;a href=\"user-guide/data-processing/layers/layer-paths.html#gotovye-sloi-v-kiparise\"&gt;готовых слоёв&lt;/a&gt;, которые находятся по пути &lt;code&gt;//porto_layers&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Указать путь до нужного слоя можно через параметр &lt;code&gt;layer_paths&lt;/code&gt; в спеке джоба, например, так:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;spec_builder = ReduceSpecBuilder() \\\n    .begin_reducer() \\\n        .command(reducer) \\\n        .layer_paths([&lt;span class=\"hljs-string\"&gt;\"//porto_layers/ubuntu-precise-base.tar.xz\"&lt;/span&gt;]) \\\n    .end_reducer() \\\n    ...\nyt.run_operation(spec_builder)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2152\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2152\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2152\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2152.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"tmpfs_in_jobs\"&gt;&lt;a href=\"ru/api/python/userdoc.html#tmpfs_in_jobs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;tmpfs в джобах&lt;/span&gt;&lt;/a&gt;tmpfs в джобах&lt;/h3&gt;\n&lt;p&gt;Поддержка tmpfs в джобах состоит из двух частей:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Для python-операций tmpfs включен по умолчанию, он заказывается в специальную директорию tmpfs и туда происходит распаковка архива модулей. Дополнительная память под tmpfs прибавляется к лимиту, который указал пользователь. Поведение регулируется опциями &lt;code&gt;pickling/enable_tmpfs_archive&lt;/code&gt; и &lt;code&gt;pickling/add_tmpfs_archive_size_to_memory_limit&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Имеется возможность автоматически заказать tmpfs на все файлы джоба, опция называется &lt;code&gt;mount_sandbox_in_tmpfs/enable&lt;/code&gt; и по умолчанию выключена. Её включение приводит к тому, что в ваших операциях в спеке будет указано &lt;code&gt;tmpfs_path=\".\"&lt;/code&gt;, а также &lt;code&gt;tmpfs_size&lt;/code&gt;, равный суммарному размеру файлов. Также tmpfs_size будет добавлен к &lt;code&gt;memory_limit&lt;/code&gt;. Обратите внимание, что если вы используете табличные файлы – у системы нет возможности узнать их размер на диске после форматирования, поэтому размер необходимо указать в атрибутах пути с помощью атрибута &lt;code&gt;disk_size&lt;/code&gt;. Также есть возможность заказать дополнительное место в tmpfs, если ваш джоб порождает в процессе работы какие-то файлики, для этого можно указать нужное количество байт через опцию &lt;code&gt;mount_sandbox_in_tmpfs/additional_tmpfs_size&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"python_jobs_statistics\"&gt;&lt;a href=\"ru/api/python/userdoc.html#python_jobs_statistics\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистики в джобах&lt;/span&gt;&lt;/a&gt;Статистики в джобах&lt;/h3&gt;\n&lt;p&gt;В процессе работы джоба пользователь может экспортировать свои собственные статистики (например, подсчитывать время работы отдельных стадий внутри джоба). В библиотеке доступны следующие функции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.user_statistics.write_statistics\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;write_statistics&lt;/a&gt; — записывает словарь с собранной статистикой в нужный файловый дескриптор. Функция обязательно должна вызываться только из джоба.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Также у класса &lt;code&gt;Operation&lt;/code&gt; есть метод &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.operation_commands.Operation.get_job_statistics\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get_job_statistics&lt;/a&gt; для быстрого доступа к статистике операции.&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;WriteStatistics&lt;/span&gt;(yt.wrapper.TypedJob):\n    &lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;__call__&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;self, row: Row&lt;/span&gt;) -&amp;gt; Row:\n        yt.write_statistics({&lt;span class=\"hljs-string\"&gt;\"row_count\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;})\n        &lt;span class=\"hljs-keyword\"&gt;yield&lt;/span&gt; row\n\nyt.write_table_structured(table, [Row(x=&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;)])\nop = yt.run_map(WriteStatistics(), table, table, sync=&lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;)\nop.wait()\n&lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;(op.get_job_statistics()[&lt;span class=\"hljs-string\"&gt;\"custom\"&lt;/span&gt;])\n&lt;span class=\"hljs-comment\"&gt;## Output: {\"row_count\": {\"$\": {\"completed\": {\"map\": {\"count\": 1, \"max\": 1, \"sum\": 1, \"min\": 1}}}}}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2190\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2190\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2190\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2190.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"python_operations_untyped\"&gt;&lt;a href=\"ru/api/python/userdoc.html#python_operations_untyped\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нетипизированные Python-операции&lt;/span&gt;&lt;/a&gt;Нетипизированные Python-операции&lt;/h2&gt;\n&lt;p&gt;Помимо типизированных джобов поддерживаются также нетипизированные.&lt;br /&gt;\nВместо наследника &lt;code&gt;TypedJob&lt;/code&gt; в качестве пользовательского джоба выступает python-функция или любой callable-объект. В качестве аргументов функция принимает запись (в случае маппера) и ключ + итератор по записям в случае редьюсера. В последнем случае ключ является &lt;code&gt;dict&lt;/code&gt;-like объектом, в котором заполнены только ключевые колонки. Сама функция обязана являться генератором, с помощью &lt;code&gt;yield&lt;/code&gt; порождающим записи, которые будут записаны в выходную таблицу.&lt;/p&gt;\n&lt;p&gt;Пример фильтрующего маппера:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;mapper&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;row&lt;/span&gt;):\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; row.get(&lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;) == &lt;span class=\"hljs-string\"&gt;\"job_started\"&lt;/span&gt;:\n        &lt;span class=\"hljs-keyword\"&gt;yield&lt;/span&gt; row\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2200\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2200\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2200\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2200.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Пример reducer-а, считающего сумму по колонке value:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;reducer&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;key, rows&lt;/span&gt;):\n    row = &lt;span class=\"hljs-built_in\"&gt;dict&lt;/span&gt;(key.iteritems())\n    row[&lt;span class=\"hljs-string\"&gt;\"sum\"&lt;/span&gt;] = &lt;span class=\"hljs-built_in\"&gt;sum&lt;/span&gt;((row[&lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;] &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; row &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; rows))\n    &lt;span class=\"hljs-keyword\"&gt;yield&lt;/span&gt; row\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2204\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2204\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2204\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2204.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"python_decorators_untyped\"&gt;&lt;a href=\"ru/api/python/userdoc.html#python_decorators_untyped\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Декораторы&lt;/span&gt;&lt;/a&gt;Декораторы&lt;/h3&gt;\n&lt;p&gt;В нетипизированном API смысл некоторых декораторов немного меняется по сравнению &lt;a href=\"ru/api/python/userdoc.html#python_decorators\"&gt;с типизированным&lt;/a&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.py_wrapper.reduce_aggregator\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;reduce_aggregator&lt;/a&gt; — reducer-у будет передана не одна пара (ключ, записи), а итератор пар, где каждая пара — (ключ, записи с этим ключом).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Обратите внимание, что декораторы реализованы через простановку атрибута на функции. Поэтому, например, объявить функцию с декоратором, а потом сделать поверх неё &lt;code&gt;functools.partial&lt;/code&gt; не получится. Если вы хотите прямо при вызове передать какие-то параметры в функцию – стоит завести класс с декоратором (смотрите последний пример ниже).&lt;/p&gt;\n&lt;p&gt;Примеры можно найти в &lt;a href=\"api/python/examples.html#job_decorators_untyped\"&gt;туториале&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"python_formats\"&gt;&lt;a href=\"ru/api/python/userdoc.html#python_formats\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Форматы&lt;/span&gt;&lt;/a&gt;Форматы&lt;/h3&gt;\n&lt;p&gt;По умолчанию, указывать формат при работе с python-операциями не нужно.&lt;/p&gt;\n&lt;p&g
