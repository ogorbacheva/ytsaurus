ые глаголы Кипариса и навигацию с помощью &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPath&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Объединение файлов/таблиц:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.concatenate\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;concatenate&lt;/a&gt; – объединяет чанки из таблиц или файлов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Прочие команды:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.find_free_subpath\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;find_free_subpath&lt;/a&gt; — ищет свободный узел, начинающийся с пути &lt;code&gt;path&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.search\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;search&lt;/a&gt; — выполняет рекурсивный обход поддерева, растущего из узла root. По умолчанию выдаются абсолютные пути всех узлов поддерева, также имеется ряд фильтров, чтобы отбирать отдельные записи. Опция &lt;code&gt;attributes&lt;/code&gt; обозначает список атрибутов, которые должны быть извлечены с каждым узлом. Извлеченные атрибуты доступны в поле &lt;code&gt;.attributes&lt;/code&gt; у возвращаемых путей.&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; table &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; yt.search(\n    &lt;span class=\"hljs-string\"&gt;\"//home\"&lt;/span&gt;,\n    node_type=[&lt;span class=\"hljs-string\"&gt;\"table\"&lt;/span&gt;],\n    object_filter=&lt;span class=\"hljs-keyword\"&gt;lambda&lt;/span&gt; obj: obj.attributes.get(&lt;span class=\"hljs-string\"&gt;\"account\"&lt;/span&gt;) == &lt;span class=\"hljs-string\"&gt;\"dev\"&lt;/span&gt;,\n    attributes=[&lt;span class=\"hljs-string\"&gt;\"account\"&lt;/span&gt;],\n):\n    &lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;(table)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"780\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-780\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-780\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-780.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"file_commands\"&gt;&lt;a href=\"ru/api/python/userdoc.html#file_commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с файлами&lt;/span&gt;&lt;/a&gt;Работа с файлами&lt;/h3&gt;\n&lt;p&gt;Подробнее про файлы в Кипарисе можно прочитать в &lt;a href=\"user-guide/storage/files.html\"&gt;разделе&lt;/a&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.read_file\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;read_file&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;Прочитать файл из Кипариса на локальную машину. Возвращает объект &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.response_stream.ResponseStream\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ResponseStream&lt;/a&gt;, который является итератором по строкам со следующими дополнительными методами:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.response_stream.ResponseStream.read\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;read&lt;/a&gt; — прочитать из потока &lt;code&gt;length&lt;/code&gt; байтов. Если &lt;code&gt;length==None&lt;/code&gt;, то прочитать все до конца;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.response_stream.ResponseStream.readline\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;readline&lt;/a&gt; — прочитать строку (включая \"\\n\");&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.response_stream.ResponseStream.chunk_iter\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;chunk_iter&lt;/a&gt; — итератор по чанкам ответа.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Команда поддерживает повторные запросы (retries, включены по умолчанию). Включить/выключить, увеличить число повторных запросов можно через опцию конфигурации &lt;code&gt;read_retries&lt;/code&gt; (см. &lt;code&gt;read_table&lt;/code&gt;). Повторные запросы на чтение можно включить через переменную &lt;code&gt;YT_RETRY_READ=1&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.write_file\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;write_file&lt;/a&gt;&lt;br /&gt;\nЗаписать файл в Кипарис. Команда принимает поток, из которого читает данные. Команда поддерживает повторные запросы. Повторные запросы можно настроить через опцию конфигурации &lt;code&gt;write_retries&lt;/code&gt; (подробнее см. &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.write_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;write_table&lt;/a&gt;). Существует параметр &lt;code&gt;is_stream_compressed&lt;/code&gt;, который указывает, что данные в потоке уже сжаты и можно передавать их напрямую прокси без пережатия.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Файлы могут быть переданы в качестве аргументов операции. В таком случае они попадают в корень директории, где будут запускаться джобы. Подробнее можно прочитать в &lt;a href=\"ru/api/python/userdoc.html#run_operation_commands\"&gt;разделе&lt;/a&gt; и &lt;a href=\"api/python/examples.html#files\"&gt;примере&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.get_file_from_cache\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;get_file_from_cache&lt;/a&gt;&lt;br /&gt;\nВозвращает путь к файлу в кеше по заданной md5 сумме&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.put_file_to_cache\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;put_file_to_cache&lt;/a&gt;&lt;br /&gt;\nЗагрузить файл из указанного пути в Кипарисе в кеш. Обратите внимание, что файл должен был быть загружен в Кипарис с указанием специальной опции, включающей вычисление md5.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"table_commands\"&gt;&lt;a href=\"ru/api/python/userdoc.html#table_commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с таблицами&lt;/span&gt;&lt;/a&gt;Работа с таблицами&lt;/h3&gt;\n&lt;p&gt;Подробнее про таблицы можно прочитать в разделе &lt;a href=\"user-guide/storage/static-tables.html\"&gt;Статические таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"dataclass\"&gt;&lt;a href=\"ru/api/python/userdoc.html#dataclass\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Датаклассы&lt;/span&gt;&lt;/a&gt;Датаклассы&lt;/h4&gt;\n&lt;p&gt;Основной способ представления строк таблицы — это классы с полями, проаннотированными типами (аналог &lt;a href=\"https://docs.python.org/3/library/dataclasses.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;dataclasses&lt;/a&gt;). Такое представление позволяет эффективно (де)сериализовывать данные, допускать меньше ошибок и удобнее работать со сложными типами (структурами, списками и т.п.). Для определения датакласса используется декоратор &lt;code&gt;yt_dataclass&lt;/code&gt;. Например:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-meta\"&gt;@yt.yt_dataclass&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;Row&lt;/span&gt;:\n    &lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;: &lt;span class=\"hljs-built_in\"&gt;int&lt;/span&gt;\n    name: &lt;span class=\"hljs-built_in\"&gt;str&lt;/span&gt;\n    robot: &lt;span class=\"hljs-built_in\"&gt;bool&lt;/span&gt; = &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"851\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-851\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-851\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-851.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;После двоеточия указывается тип поля. Это может быть либо обычный тип Python, либо тип из модуля &lt;a href=\"https://docs.python.org/3/library/typing.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;typing&lt;/a&gt;, либо же специальный тип, например, &lt;code&gt;OtherColumns&lt;/code&gt;. Подробнее можно прочитать в разделе &lt;a href=\"api/python/dataclass.html#types\"&gt;Датаклассы&lt;/a&gt;. Объект данного класса можно создавать обычным образом: &lt;code&gt;row = Row(id=123, name=\"foo\")&lt;/code&gt;. При этом для всех полей, для которых не указаны дефолтные значения (как для &lt;code&gt;robot: bool = False&lt;/code&gt;), необходимо передать соответствующие поля в конструктор, иначе будет порождено исключение.&lt;/p&gt;\n&lt;p&gt;Для датаклассов допустимо наследование. Подробнее см. в разделе &lt;a href=\"api/python/dataclass.html\"&gt;Датаклассы&lt;/a&gt;. Также смотрите &lt;a href=\"api/python/examples.html#dataclass\"&gt;пример&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"table_schema\"&gt;&lt;a href=\"ru/api/python/userdoc.html#table_schema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схемы&lt;/span&gt;&lt;/a&gt;Схемы&lt;/h4&gt;\n&lt;p&gt;Каждая таблица в YTsaurus имеет &lt;a href=\"user-guide/storage/static-schema.html\"&gt;схему&lt;/a&gt;. В Python API есть соответствующий класс &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.schema.html#yt.wrapper.schema.table_schema.TableSchema\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TableSchema&lt;/a&gt;. Основной способ создания схемы — из &lt;a href=\"ru/api/python/userdoc.html#dataclass\"&gt;датакласса&lt;/a&gt;: &lt;code&gt;schema = TableSchema.from_row_type(Row)&lt;/code&gt;, в частности, это происходит автоматически при записи таблицы. Однако иногда приходится собирать схему вручную, это может быть удобно делать с помощью builder-интерфейса, например:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.type_info.typing &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; ti\n\nschema = yt.schema.TableSchema() \\\n    .add_column(&lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt;, ti.Int64, sort_order=&lt;span class=\"hljs-string\"&gt;\"ascending\"&lt;/span&gt;) \\\n    .add_column(&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;, ti.Utf8) \\\n    .add_column(&lt;span class=\"hljs-string\"&gt;\"clicks\"&lt;/span&gt;, ti.&lt;span class=\"hljs-type\"&gt;List&lt;/span&gt;[\n        ti.Struct[\n            &lt;span class=\"hljs-string\"&gt;\"url\"&lt;/span&gt;: ti.String,\n            &lt;span class=\"hljs-string\"&gt;\"ts\"&lt;/span&gt;: ti.&lt;span class=\"hljs-type\"&gt;Optional&lt;/span&gt;[ti.Timestamp],\n        ]\n    ])\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"864\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-864\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-864\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-864.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Тип колонки должен быть типом из библиотеки &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/yt/type_info\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;type_info&lt;/a&gt;.&lt;br /&gt;\nСоставные типы (&lt;code&gt;Optional&lt;/code&gt;, &lt;code&gt;List&lt;/code&gt;, &lt;code&gt;Struct&lt;/code&gt;, &lt;code&gt;Tuple&lt;/code&gt; и так далее) задаются с помощью квадратных скобок.&lt;/p&gt;\n&lt;p&gt;Схему можно указывать при создании или записи (пустой) таблицы (в атрибуте &lt;code&gt;schema&lt;/code&gt; класса &lt;a href=\"ru/api/python/userdoc.html#tablepath_class\"&gt;TablePath&lt;/a&gt;). Получить схему таблицы можно так:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;schema = TableSchema.from_yson_type(yt.get(&lt;span class=\"hljs-string\"&gt;\"//path/to/table/@schema\"&lt;/span&gt;))\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"871\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-871\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-871\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-871.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"tablepath_class\"&gt;&lt;a href=\"ru/api/python/userdoc.html#tablepath_class\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TablePath&lt;/span&gt;&lt;/a&gt;TablePath&lt;/h4&gt;\n&lt;p&gt;Все команды для работы с таблицами (в том числе операции) принимают в качестве входных и выходных таблиц не только строки, но и класс &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.ypath.TablePath\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TablePath&lt;/a&gt; (там, где это разумно). Данный класс представляет из себя путь к таблице с некоторыми модификаторами (обертка над &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPath&lt;/a&gt; для таблиц). Его конструктор принимает:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;name&lt;/code&gt; — путь к таблице в Кипарисе;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;append&lt;/code&gt; — добавлять записи в конец таблицы вместо перезаписи;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;sorted_by&lt;/code&gt; — набор колонок, по которым должна быть отсортирована таблица при записи в неё;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;columns&lt;/code&gt; — список выбранных колонок;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;lower_key, upper_key, exact_key&lt;/code&gt; — нижняя/верхняя/точная граница чтения, определяемая ключом. Только для сортированных таблиц;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;start_index, end_index, exact_index&lt;/code&gt; — нижняя/верхняя/точная граница чтения, определяемая номерами строк;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ranges&lt;/code&gt; — опция, через которую можно задать произвольный набор диапазонов для чтения;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;schema&lt;/code&gt; — &lt;a href=\"ru/api/python/userdoc.html#table_schema\"&gt;схема таблицы&lt;/a&gt;; имеет смысл при создании или записи в пустую или несуществующую таблицу;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;attributes&lt;/code&gt; — опция, через которую можно задать любые дополнительные атрибуты.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Диапазоны являются полуинтервалами (не включают верхнюю границу). Обратите внимание, что часть модификаторов имеет смысл только при чтении данных из таблицы (все атрибуты, касающиеся диапазонов, columns, ranges), а часть модификаторов только при записи в таблицу (append, sorted_by). В качестве &lt;code&gt;name&lt;/code&gt; можно передавать строку с ypath-модификаторами и ypath-атрибутами, они будут корректно прочитаны и переложены в поле &lt;code&gt;attributes&lt;/code&gt;. У объекта &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.ypath.TablePath\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TablePath&lt;/a&gt; поле &lt;code&gt;attributes&lt;/code&gt; доступно как на чтение, так и на запись.&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-meta\"&gt;@yt.yt_dataclass&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;Row&lt;/span&gt;:\n    x: &lt;span class=\"hljs-built_in\"&gt;str&lt;/span&gt;\n\ntable = &lt;span class=\"hljs-string\"&gt;\"//tmp/some-table\"&lt;/span&gt;\nyt.write_table_structured(table, Row, [Row(x=&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;), Row(x=&lt;span class=\"hljs-string\"&gt;\"c\"&lt;/span&gt;), Row(x=&lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;)])\nyt.run_sort(table, sort_by=[&lt;span class=\"hljs-string\"&gt;\"x\"&lt;/span&gt;])\nranged_path = yt.TablePath(table, lower_key=&lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;)\n&lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(yt.read_table_structured(ranged_path, Row))\n&lt;span class=\"hljs-comment\"&gt;## Output: [Row(x='b'), Row(x='c')]&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"931\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-931\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-931\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-931.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"table_commands1\"&gt;&lt;a id=\"table_commands\" href=\"ru/api/python/userdoc.html#table_commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Команды&lt;/span&gt;&lt;/a&gt;Команды&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.create_temp_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;create_temp_table&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;Создает временную таблицу в директории &lt;code&gt;path&lt;/code&gt; с префиксом &lt;code&gt;prefix&lt;/code&gt;. Если &lt;code&gt;path&lt;/code&gt; не указан, то будет использована директория из конфига: &lt;code&gt;config[\"remote_temp_tables_directory\"]&lt;/code&gt;. Для более удобной работы существует обертка с поддержкой with_statement, принимающая те же параметры.&lt;br /&gt;\nПример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; yt.TempTable(&lt;span class=\"hljs-string\"&gt;\"//home/user\"&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; table1:\n    &lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; yt.TempTable(&lt;span class=\"hljs-string\"&gt;\"//home/user\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"my\"&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; table2:\n        yt.write_table_structured(table1, Row, [Row(x=&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;)])\n        yt.run_map(..., table1, table2, ...)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"943\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-943\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-943\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-943.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.write_table_structured\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;write_table_structured&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;Записывает строки типа &lt;code&gt;row_type&lt;/code&gt; (обязан быть &lt;a href=\"ru/api/python/userdoc.html#dataclass\"&gt;&lt;code&gt;yt_dataclass&lt;/code&gt;-ом&lt;/a&gt;) из &lt;code&gt;input_stream&lt;/code&gt; в таблицу &lt;code&gt;table&lt;/code&gt;.&lt;br /&gt;\nВ случае, если таблица отсутствует, предварительно производится её создание со схемой.     Команда поддерживает повторные запросы. Повторные запросы можно настроить через опцию конфига &lt;code&gt;write_retries&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Запись с повторными запросами потребляет больше памяти, чем обычная запись, так как запись буферизует записываемые строки в чанки перед записью&lt;br /&gt;\n(если записать чанк не получается, происходит повторный запрос), размер каждого чанка по умолчанию составляет 512МБ (см. &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/49f99ef8659f108f94d2d086f5f1dacfddb6b553/yt/python/yt/wrapper/default_config.py#L535\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;опцию конфигурации&lt;/a&gt;).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Опция &lt;code&gt;table_writer&lt;/code&gt; позволяет указать разные системные &lt;a href=\"user-guide/storage/io-configuration.html\"&gt;параметры записи&lt;/a&gt;. Для записи сырых или сжатых данных используйте функцию &lt;code&gt;write_table&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-meta\"&gt;@yt.yt_dataclass&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;Row&lt;/span&gt;:\n    &lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;: &lt;span class=\"hljs-built_in\"&gt;str&lt;/span&gt;\n    ts: &lt;span class=\"hljs-built_in\"&gt;int&lt;/span&gt;\n\nyt.write_table_structured(&lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt;, Row, [Row(&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;, ts=&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;)])\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"968\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-968\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-968\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-968.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;При записи в пустую или несуществующую таблицу схема будет создана автоматически.&lt;br /&gt;\nВ более сложных случаях может потребоваться изготавливать схему вручную, подробнее можно прочитать в &lt;a href=\"ru/api/python/userdoc.html#table_schema\"&gt;разделе&lt;/a&gt; и &lt;a href=\"api/python/examples.html#table_schema\"&gt;примере&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.read_table_structured\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;read_table_structured&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;Читает таблицу в виде последовательности строк типа &lt;code&gt;row_type&lt;/code&gt; (обязан быть &lt;a href=\"ru/api/python/userdoc.html#dataclass\"&gt;&lt;code&gt;yt_dataclass&lt;/code&gt;-ом&lt;/a&gt;).&lt;br /&gt;\nКоманда поддерживает повторные запросы (включены по умолчанию). Настроить повторные запросы можно через опцию конфигурации &lt;code&gt;read_retries&lt;/code&gt;.&lt;br /&gt;\nОпция &lt;code&gt;table_reader&lt;/code&gt; (dict) позволяет указать разные системные &lt;a href=\"user-guide/storage/io-configuration.html#table_reader\"&gt;параметры чтения&lt;/a&gt;.&lt;br /&gt;\nОпция &lt;code&gt;unordered&lt;/code&gt; (bool) позволяет заказать неупорядоченное чтение. В таком случае данные могут читаться быстрее, но порядок их чтения не будет гарантирован.&lt;br /&gt;\nОпция &lt;code&gt;response_parameters&lt;/code&gt; (dict) позволяет передать в неё dict, в который будут дозаписаны специальные параметры команды read (сейчас это два параметра: &lt;code&gt;start_row_index&lt;/code&gt; и &lt;code&gt;approximate_row_count&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Возвращаемый итератор поддерживает метод &lt;code&gt;.with_context()&lt;/code&gt;, который возвращает итератор на пары вида &lt;code&gt;(row, ctx)&lt;/code&gt;. Второй элемент позволяет получать индекс текущей строки и диапазона с помощью методов &lt;code&gt;ctx.get_row_index()&lt;/code&gt; и &lt;code&gt;ctx.get_range_index()&lt;/code&gt; (аналогичный итератор внутри джоба позволяет также получить индекс таблицы: &lt;code&gt;ctx.get_table_index()&lt;/code&gt;). Про контекст в &lt;a href=\"api/python/examples.html#read_write\"&gt;обычном чтении&lt;/a&gt; и &lt;a href=\"api/python/examples.html#table_switches\"&gt;внутри операций&lt;/a&gt; есть примеры в туториале.&lt;/p&gt;\n&lt;p&gt;Подробнее про чтение с повторными запросами: если чтение происходит с повторными запросами, создается транзакция в текущем контексте и на таблицу берется snapshot-лок. Блокировка держится до тех пор, пока не будет вычитан весь поток данных, либо не будет вызван &lt;code&gt;.close()&lt;/code&gt; у стрима или итератора. Такая схема может приводить к разным ошибкам, например, следующий код &lt;strong&gt;не будет&lt;/strong&gt; работать, так как из-за вложенной транзакции чтения не получится закоммитить транзакцию, явно созданную в коде (вложенная транзакция на чтение не завершена, так как &lt;code&gt;read_table_structured&lt;/code&gt; создал итератор, который не был использован):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; Transaction():\n    write_table_structured(table, Row, rows)\n    read_table_structured(table, Row)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"986\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-986\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-986\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-986.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Примеры:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-meta\"&gt;@yt.yt_dataclass&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;Row&lt;/span&gt;:\n    &lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;: &lt;span class=\"hljs-built_in\"&gt;str&lt;/span&gt;\n    ts: &lt;span class=\"hljs-built_in\"&gt;int&lt;/span&gt;\n\nyt.write_table_structured(&lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt;, Row, [Row(&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;, ts=&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;)])\n&lt;span class=\"hljs-keyword\"&gt;assert&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(yt.read_table_structured(&lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt;, Row) == [Row(&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;, ts=&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;)])\n\nranges = [\n    {&lt;span class=\"hljs-string\"&gt;\"lower_limit\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;: [&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;]}, &lt;span class=\"hljs-string\"&gt;\"upper_limit\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;: [&lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;]}},\n    {&lt;span class=\"hljs-string\"&gt;\"lower_limit\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;: [&lt;span class=\"hljs-string\"&gt;\"x\"&lt;/span&gt;]}, &lt;span class=\"hljs-string\"&gt;\"upper_limit\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;: [&lt;span class=\"hljs-string\"&gt;\"y\"&lt;/span&gt;]}},\n]\npath = yt.TablePath(&lt;span class=\"hljs-string\"&gt;\"//other/table\"&lt;/span&gt;, columns=[&lt;span class=\"hljs-string\"&gt;\"time\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;], ranges=ranges)\nrows = yt.read_table_structured(path, Row)\n&lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; row, ctx &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; rows.with_context():\n    &lt;span class=\"hljs-comment\"&gt;# ctx.get_row_index() – index of row in table.&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;# ctx.get_range_index() – index of range from requested ranges.&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;# ...&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"992\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-992\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-992\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-992.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Функции-алиасы для работы с таблицами:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.row_count\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;row_count&lt;/a&gt; ­— возвращает количество записей в таблице&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.is_empty\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;is_empty&lt;/a&gt; — проверяет, является ли таблица пустой&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.is_sorted\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;is_sorted&lt;/a&gt; — проверяет, отсортирована ли таблица&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Примеры:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.write_table_structured(&lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;, Row, [Row(&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;, ts=&lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;), Row(&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;, ts=&lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;)])\n\n&lt;span class=\"hljs-built_in\"&gt;sum&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; row &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; yt.read_table_structured(&lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;, Row):\n    &lt;span class=\"hljs-built_in\"&gt;sum&lt;/span&gt; += row.ts\n&lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;sum&lt;/span&gt;)  &lt;span class=\"hljs-comment\"&gt;# Output: 5&lt;/span&gt;\n\nyt.is_empty(&lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;)  &lt;span class=\"hljs-comment\"&gt;# Output: False&lt;/span&gt;\nyt.row_count(&lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;)  &lt;span class=\"hljs-comment\"&gt;# Output: 2&lt;/span&gt;\nyt.is_sorted(&lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;) &lt;span class=\"hljs-comment\"&gt;# Output: False&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1016\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1016\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1016\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1016.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.write_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;write_table&lt;/a&gt;&lt;br /&gt;\nНетипизированный аналог &lt;code&gt;write_table_structured&lt;/code&gt;, &lt;strong&gt;не рекомендован к использованию&lt;/strong&gt;.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробнее&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Записывает строки из &lt;code&gt;input_stream&lt;/code&gt; в таблицу &lt;code&gt;table&lt;/code&gt;.&lt;br /&gt;\nЕсли таблица отсутствует, предварительно производится ее создание. Повторные запросы можно настроить через опцию конфига &lt;code&gt;write_retries&lt;/code&gt;.&lt;br /&gt;\nСм. &lt;a href=\"api/python/examples.html#read_write_untyped\"&gt;пример&lt;/a&gt; в соответствующем разделе.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Запись с повторными запросами потребляет больше памяти, чем обычная запись, так как запись буферизует записываемые строки в чанки перед записью&lt;br /&gt;\n(если записать чанк не получается, то происходит повторный запрос), размер каждого чанка по умолчанию составляет 512МБ (см. &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/49f99ef8659f108f94d2d086f5f1dacfddb6b553/yt/python/yt/wrapper/default_config.py#L535\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;опцию конфигурации&lt;/a&gt;).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Опция &lt;code&gt;table_writer&lt;/code&gt; позволяет указать разные системные &lt;a href=\"user-guide/storage/io-configuration.html\"&gt;параметры записи&lt;/a&gt;. Также есть параметр &lt;code&gt;is_stream_compressed&lt;/code&gt;, который указывает, что данные в потоке уже сжаты, и можно передавать их напрямую прокси без пережатия. Нужно иметь в виду, что при передаче сжатых данных требуется указать соответствующий &lt;code&gt;Content-Encoding&lt;/code&gt; через конфигурацию: &lt;code&gt;config[\"proxy\"][\"content_encoding\"] = \"gzip\"&lt;/code&gt;, а также установить опцию &lt;code&gt;raw=True&lt;/code&gt;. Опция &lt;code&gt;raw&lt;/code&gt; регулирует то, в каком формате ожидаются данные. Если &lt;code&gt;raw=False&lt;/code&gt;, то ожидается итератор по python-структурам. Если &lt;code&gt;raw=True&lt;/code&gt;, то ожидается либо строка, либо итератор по строкам, либо поток, в котором должны быть данные в формате &lt;code&gt;format&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Примеры:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.write_table(&lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt;, ({&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;: i, &lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;: i * i} &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; i &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; xrange(&lt;span class=\"hljs-number\"&gt;100&lt;/span&gt;)))\nyt.write_table(&lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt;, &lt;span class=\"hljs-built_in\"&gt;open&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"my_file.json\"&lt;/span&gt;), &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"json\"&lt;/span&gt;, raw=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\nyt.write_table(&lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"a=1\\na=2\\n\"&lt;/span&gt;, &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"dsv\"&lt;/span&gt;, raw=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1046\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1046\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1046\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1046.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Чтобы записать таблицу со схемой, её нужно сначала отдельно создать:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;  schema = [\n      {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"string\"&lt;/span&gt;},\n      {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"timestamp\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"int64\"&lt;/span&gt;},\n      {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"some_json_info\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"any\"&lt;/span&gt;},\n  ]\n  yt.create(&lt;span class=\"hljs-string\"&gt;\"table\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt;, attributes={&lt;span class=\"hljs-string\"&gt;\"schema\"&lt;/span&gt;: schema})\n  yt.write_table(&lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt;, rows)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1050\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1050\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1050\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1050.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.read_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;read_table&lt;/a&gt;&lt;br /&gt;\nНетипизированный аналог &lt;code&gt;read_table_structured&lt;/code&gt;, &lt;strong&gt;не рекомендован к использованию&lt;/strong&gt;.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробности&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Читает таблицу в указанном формате. Возвращаемое значение зависит от значения опции &lt;code&gt;raw&lt;/code&gt;. Если &lt;code&gt;raw=False&lt;/code&gt; (значение по умолчанию), то возвращается итератор по списку записей. Одна запись представляет собой &lt;code&gt;dict&lt;/code&gt; или &lt;code&gt;Record&lt;/code&gt; (в случае формата &lt;code&gt;yamr&lt;/code&gt;). Если &lt;code&gt;raw=True&lt;/code&gt;, то возвращается stream-like объект, из которого можно вычитывать данные в формате &lt;code&gt;format&lt;/code&gt;.&lt;br /&gt;\nКоманда поддерживает повторные запросы (включены по умолчанию). Настроить повторные запросы можно через опцию конфигурации &lt;code&gt;read_retries&lt;/code&gt;. При включенных повторных запросах чтение происходит медленнее из-за того, что приходится парсить поток, так как нужно считать число уже прочитанных строк.&lt;br /&gt;\nОпция &lt;code&gt;table_reader&lt;/code&gt; (dict) позволяет указать разные системные &lt;a href=\"user-guide/storage/io-configuration.html#table_reader\"&gt;параметры чтения&lt;/a&gt;.&lt;br /&gt;\nОпция &lt;code&gt;control_attributes&lt;/code&gt; (dict) позволяет при чтении заказать различные &lt;a href=\"user-guide/storage/io-configuration.html#control_attributes\"&gt;контрольные атрибуты&lt;/a&gt;&lt;br /&gt;\nОпция &lt;code&gt;unordered&lt;/code&gt; (bool) позволяет заказать неупорядоченное чтение. В таком случае данные могут читаться быстрее, но порядок их чтения будет не гарантирован.&lt;br /&gt;\nОпция &lt;code&gt;response_parameters&lt;/code&gt; (dict) позволяет передать в нее dict, в который будут дозаписаны специальные параметры команды read (в текущей реализации это два параметра: start_row_index и approximate_row_count).&lt;/p&gt;\n&lt;p&gt;смотрите &lt;a href=\"user-guide/storage/examples.html#read_write_untyped\"&gt;пример&lt;/a&gt; в соответствующем разделе.&lt;/p&gt;\n&lt;p&gt;Подробнее про чтение с повторными запросами: если вы читаете с повторными запросами, создается транзакция в текущем контексте и на таблицу берется snapshot-лок. Этот лок держится до тех пор, пока вы не вычитаете весь поток данных, либо не вызовете &lt;code&gt;.close()&lt;/code&gt; у стрима или итератора, который вам вернули. Такая схема может приводить к ошибкам, например, следующий код &lt;strong&gt;не будет&lt;/strong&gt; работать, так как из-за вложенной транзакции чтения не получится закоммитить транзакцию, явно созданную в коде (вложенная транзакция на чтение не завершена, так как &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.read_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;read_table&lt;/a&gt; создал итератор, который не был использован):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; Transaction():\n    write_table(table, rows)\n    read_table(table, &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"yson\"&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1072\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1072\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1072\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1072.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Чтение с повторными запросами обычно работает медленней, чем без них, так как приходится парсить поток записей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"parallel_read\"&gt;&lt;a href=\"ru/api/python/userdoc.html#parallel_read\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Параллельное чтение таблиц и файлов&lt;/span&gt;&lt;/a&gt;Параллельное чтение таблиц и файлов&lt;/h4&gt;\n&lt;p&gt;Таблица разбивается на небольшие диапазоны исходя из предположения, что данные распределены по строкам равномерно. Каждый такой диапазон читается отдельным потоком. В случае включенных повторных запросов будет повторно обрабатываться весь диапазон, а не отдельные строки таблицы. Такой подход позволяет не производить парсинг данных и ускоряет чтение.&lt;br /&gt;\nФайлы просто разбиваются на части заданного размера и читаются параллельно.&lt;/p&gt;\n&lt;p&gt;Настройки параллельного чтения находятся в секции конфигурации &lt;code&gt;read_parallel&lt;/code&gt;, имеющей следующие ключи:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;enable&lt;/code&gt; - включение параллельного чтения;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_thread_count&lt;/code&gt; - максимальное количество потоков;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;data_size_per_thread&lt;/code&gt; - количество загружаемых каждым потоком данных.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Особенности параллельного чтения таблиц:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Заказ контрольных атрибутов не поддерживается.&lt;/li&gt;\n&lt;li&gt;Не поддерживается указание диапазонов строк таблицы с лимитами в виде ключей.&lt;/li&gt;\n&lt;li&gt;Параллельное чтение может работать неэффективно на таблицах с большим разбросом количества данных в строках.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример ускорения:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ &lt;span class=\"hljs-keyword\"&gt;time&lt;/span&gt; yt read-table //sys/scheduler/event_log.2[:#1000000] --proxy cluster-name --format yson &amp;gt; /dev/null\n\nreal    1m46.608s\nuser    1m39.228s\nsys     0m4.216s\n\n$ &lt;span class=\"hljs-keyword\"&gt;time&lt;/span&gt; yt read-table //sys/scheduler/event_log.2[:#1000000] --proxy cluster-name --format yson --config &lt;span class=\"hljs-string\"&gt;\"{read_parallel={enable=%true;max_thread_count=50;}}\"&lt;/span&gt; &amp;gt; /dev/null\n\nreal    0m14.463s\nuser    0m12.312s\nsys     0m4.304s\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1136\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1136\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1136\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1136.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Замеры скорости&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ &lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_PROXY=cluster-name\n$ yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; //sys/scheduler/event_log.2[:#20000000] --format json --config &lt;span class=\"hljs-string\"&gt;\"{read_parallel={enable=%true;max_thread_count=50;}}\"&lt;/span&gt; &amp;gt; scheduler_log_json\n$ yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; //sys/scheduler/event_log.2[:#20000000] --format yson --config &lt;span class=\"hljs-string\"&gt;\"{read_parallel={enable=%true;max_thread_count=50;}}\"&lt;/span&gt; &amp;gt; scheduler_log_yson\n\n$ &lt;span class=\"hljs-built_in\"&gt;ls&lt;/span&gt; -lah\ntotal 153G\ndrwxrwxr-x 2 user group 4.0K Sep 29 21:23 .\ndrwxrwxr-x 7 user group 4.0K Sep 28 15:20 ..\n-rw-r--r-- 1 user group  51G Sep 29 21:25 scheduler_log_json\n-rw-r--r-- 1 user group  51G Sep 29 21:22 scheduler_log_yson\n-rw-r--r-- 1 user group  51G Sep 29 21:20 test_file\n\n$ &lt;span class=\"hljs-keyword\"&gt;time&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; scheduler_log_yson | yt write-table //tmp/test_yson --format yson\nreal    36m51.653s\nuser    31m34.416s\nsys     1m5.256s\n\n$ &lt;span class=\"hljs-keyword\"&gt;time&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; scheduler_log_json | yt write-table //tmp/test_json --format json\nreal    88m38.745s\nuser    21m7.188s\nsys     1m1.400s\n\n$ &lt;span class=\"hljs-keyword\"&gt;time&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; test_file | yt write-file //tmp/test_file\nreal    35m50.723s\nuser    17m31.232s\nsys     1m39.132s\n\n$ &lt;span class=\"hljs-keyword\"&gt;time&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; scheduler_log_yson | yt write-table //tmp/test_yson --format yson --config &lt;span class=\"hljs-string\"&gt;\"{write_parallel={enable=%true;max_thread_count=30;}}\"&lt;/span&gt;\nreal    13m37.545s\nuser    37m20.516s\nsys     4m16.436s\n\n$ &lt;span class=\"hljs-keyword\"&gt;time&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; scheduler_log_json | yt write-table //tmp/test_json --format json --config &lt;span class=\"hljs-string\"&gt;\"{write_parallel={enable=%true;max_thread_count=30;}}\"&lt;/span&gt;\nreal    3m53.308s\nuser    23m21.152s\nsys     2m57.400s\n\n$ &lt;span class=\"hljs-keyword\"&gt;time&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; test_file | yt write-file //tmp/test_file --config &lt;span class=\"hljs-string\"&gt;\"{write_parallel={enable=%true;max_thread_count=30;}}\"&lt;/span&gt;\nreal    1m49.368s\nuser    18m30.904s\nsys     1m40.660s\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1142\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1142\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1142\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1142.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"parallel_write\"&gt;&lt;a href=\"ru/api/python/userdoc.html#parallel_write\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Параллельная запись таблиц и файлов&lt;/span&gt;&lt;/a&gt;Параллельная запись таблиц и файлов&lt;/h4&gt;\n&lt;p&gt;Чтобы воспользоваться, необходимо:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Установить &lt;code&gt;zlib_fork_safe&lt;/code&gt;, если вы пользуетесь python2;&lt;/li&gt;\n&lt;li&gt;Включить опцию в конфиге: &lt;code&gt;config[\"write_parallel\"][\"enable\"] = True&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;После этого стандартные команды &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.write_table\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;write_table&lt;/a&gt; и &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.write_file\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;write_file&lt;/a&gt; будут работать в многопоточном режиме.&lt;/p&gt;\n&lt;p&gt;В конфигурации клиента появился новый раздел &lt;code&gt;write_parallel&lt;/code&gt; со следующими ключами:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;enable&lt;/code&gt; (False by default) - включает возможность записывать таблицы и файлы в YTsaurus параллельно.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_thread_count&lt;/code&gt; (10 by default) - максимальное количество потоков для записи.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;unordered&lt;/code&gt; (False by default) - разрешает записывать строки в таблицу в произвольном порядке, это позволяет ускорить запись.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;concatenate_size&lt;/code&gt; (20 by default) - ограничение на количество таблиц/файлов, подаваемых на вход команде concatenate.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"kak-eto-rabotaet\"&gt;&lt;a href=\"ru/api/python/userdoc.html#kak-eto-rabotaet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это работает&lt;/span&gt;&lt;/a&gt;Как это работает&lt;/h4&gt;\n&lt;p&gt;Весь процесс параллельной записи выглядит следующим образом:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Входной поток разбивается по строкам, строки группируются в чанки, размер которых регулируется опцией &lt;code&gt;/write_retries/chunk_size&lt;/code&gt; из конфигурации (по умолчанию 512МБ);&lt;/li&gt;\n&lt;li&gt;Чанки подаются в ThreadPool;&lt;/li&gt;\n&lt;li&gt;Потоки получают на вход группу строк для записи, сжимают эти данные, загружают их на сервер во временную таблицу или файл;&lt;/li&gt;\n&lt;li&gt;Главный поток накапливает временные таблицы или файлы, запись в которые уже была произведена;&lt;/li&gt;\n&lt;li&gt;Как только количество записанных таблиц или файлов становится равно &lt;code&gt;/write_parallel/concatenate_size&lt;/code&gt;, выполняется их слияние.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"ogranicheniya\"&gt;&lt;a href=\"ru/api/python/userdoc.html#ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения&lt;/span&gt;&lt;/a&gt;Ограничения&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Параллельная запись недоступна в случае, если на вход подан поток сжатых данных.&lt;/li&gt;\n&lt;li&gt;Если на пути к выходной таблице стоит атрибут &lt;code&gt;sorted_by&lt;/code&gt;, то параллельная запись также не будет доступна.&lt;/li&gt;\n&lt;li&gt;Параллельная запись не будет эффективной в Python2, если не установлен &lt;code&gt;zlib_fork_safe&lt;/code&gt; (из-за GIL).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;ol start=\"4\" style=\"--hier-list-start:3\"&gt;\n&lt;li&gt;Параллельная запись не будет эффективной, если парсер вашего формата медленный (например, в случае &lt;a href=\"user-guide/storage/formats.html#schemaful_dsv\"&gt;schemaful_dsv&lt;/a&gt;).&lt;/li&gt;\n&lt;li&gt;Поскольку входной поток разбивается на чанки для параллельной загрузки на кластер, пользовательский скрипт будет потреблять память, пропорциональную &lt;code&gt;max_thread_count * chunk_size&lt;/code&gt; (на практике получается множитель около 2).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;strong&gt;Q: Почему в несколько потоков запись в формате JSON работает в разы быстрее, чем в YSON, а в один поток наоборот?&lt;/strong&gt;&lt;br /&gt;\n&lt;strong&gt;A:&lt;/strong&gt; На то есть две причины:&lt;br /&gt;\nВходной поток нужно разбить на строки. В JSON это можно сделать просто, поделив его по &lt;code&gt;\\n&lt;/code&gt;, в формате YSON это делается намного сложнее. Поскольку эта операция однопоточная, она является слабым местом и вся запись блокируется ей.&lt;/p&gt;\n&lt;h3 id=\"transaction_commands\"&gt;&lt;a href=\"ru/api/python/userdoc.html#transaction_commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с транзакциями и локами&lt;/span&gt;&lt;/a&gt;Работа с транзакциями и локами&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.transaction.Transaction\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Transaction&lt;/a&gt; — &lt;strong&gt;однопоточный&lt;/strong&gt; класс-обертка, для создания, коммита или аборта транзакций. Поддерживает синтаксис контекстного менеджера (&lt;code&gt;with&lt;/code&gt; statement), то есть в случае успешного выхода из scope транзакция коммитится, а иначе прерывается. Все команды в scope запускаются под указанной транзакцией. Поддерживается возможность создавать вложенные scope'ы. Параметр &lt;code&gt;ping&lt;/code&gt; (по умолчанию равен &lt;code&gt;True&lt;/code&gt;) в конструкторе отвечает за запуск пингующего треда. При отсутствии пинга операция будет принудительно отменена по истечении таймаута.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Примеры:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; yt.Transaction():\n    yt.write_table_structured(table, [Row(x=&lt;span class=\"hljs-number\"&gt;5&lt;/span&gt;)])  &lt;span class=\"hljs-comment\"&gt;# Запись будет проходить под транзакцией&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;# После выхода из-под with будет произведен коммит транзакции.&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; yt.Transaction():\n    yt.write_table_structured(table, [Row(x=&lt;span class=\"hljs-number\"&gt;6&lt;/span&gt;)])\n    &lt;span class=\"hljs-keyword\"&gt;raise&lt;/span&gt; RuntimeError(&lt;span class=\"hljs-string\"&gt;\"Something went wrong\"&lt;/span&gt;)\n    &lt;span class=\"hljs-comment\"&gt;# Исключение вызовет аборт транзакции и изменений никто не увидит&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;## Вложенные транзакции&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; yt.Transaction():\n    yt.lock(&lt;span class=\"hljs-string\"&gt;\"//home/table\"&lt;/span&gt;, waitable=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;, wait_for=&lt;span class=\"hljs-number\"&gt;60000&lt;/span&gt;)\n    &lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; yt.Transaction():\n        yt.&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//home/table/@attr\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1272\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1272\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1272\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1272.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В случае, если пингующий тред завершился с ошибкой при попытке сделать ping транзакции, он вызывает &lt;code&gt;thread.interrupt_main()&lt;/code&gt;. Данное поведение можно поменять с помощью опции &lt;code&gt;config[\"ping_failed_mode\"]&lt;/code&gt;.&lt;br /&gt;\nДоступные опции:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;pass&lt;/code&gt;: не делать ничего&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;call_function&lt;/code&gt;: вызывает функцию указанную в поле &lt;code&gt;ping_failed_function&lt;/code&gt; конфига&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;interrupt_main&lt;/code&gt;: бросить исключение &lt;code&gt;KeyboardInterrupt&lt;/code&gt; в главном треде&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;send_signal&lt;/code&gt;: послать процессу сигнал &lt;code&gt;SIGUSR1&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;terminate_process&lt;/code&gt;: прибить процесс&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Транзакциями можно управлять и на более низком уровне (в отличии от контекстного менеджера &lt;code&gt;Transaction&lt;/code&gt; такие транзакции не прорастают автоматически в команды):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.start_transaction\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;start_transaction&lt;/a&gt; — создать новую транзакцию с заданным таймаутом (в мс);&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.abort_transaction\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;abort_transaction&lt;/a&gt; — прервать транзакцию с данным ID;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.commit_transaction\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;commit_transaction&lt;/a&gt; — закоммитить транзакцию с данным ID;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.ping_transaction\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ping_transaction&lt;/a&gt; — выполнить пинг транзакции для продления срока жизни.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Эти функции дают исключение &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.errors.YtResponseError\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtResponseError&lt;/a&gt; с &lt;code&gt;.is_resolve_error() == True&lt;/code&gt; в случае, если транзакция не найдена.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.lock\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;lock&lt;/a&gt; — берет лок на указанный узел под текущей транзакцией. В случае waitable лока и указанного &lt;code&gt;wait_for&lt;/code&gt; ждет взятия лока в течение &lt;code&gt;wait_for&lt;/code&gt; миллисекунд. Если дождаться не удалось — возвращает исключение.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.unlock\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;unlock&lt;/a&gt; — снимает с указанного узла все &lt;a href=\"user-guide/storage/transactions.html#implicit_locks\"&gt;явные&lt;/a&gt; локи, взятые текущей транзакцией. Как уже взятые, так и ожидающие в очереди. Если локов нет, не имеет эффекта. Если разблокировка невозможна (потому что заблокированная версия узла содержит изменения по сравнению с оригинальной версией), возвращает исключение.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Завершение транзакции (как успешное, так и нет) снимает все взятые ею блокировки; &lt;code&gt;unlock&lt;/code&gt; нужен лишь в тех случаях, когда необходимо разблокировать узел, не завершая транзакции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"run_operation_commands\"&gt;&lt;a href=\"ru/api/python/userdoc.html#run_operation_commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск операций&lt;/span&gt;&lt;/a&gt;Запуск операций&lt;/h3&gt;\n&lt;p&gt;Про доступные операции для работы с табличными данными можно в &lt;a href=\"user-guide/data-processing/operations/overview.html\"&gt;разделе&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Все функции запуска операций начинаются со префикса &lt;code&gt;run_&lt;/code&gt;. Данные функции часто имеют множество параметров. Далее будут описаны общие параметры у всех функций запуска операций и логика выбора параметров. Полный список параметров для каждой отдельной функции можно найти в &lt;a href=\"http://pydoc.ytsaurus.tech/yt.wrapper.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;pydoc&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Команды запуска операций:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_erase\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_erase&lt;/a&gt; — &lt;a href=\"user-guide/data-processing/operations/erase.html\"&gt;операция удаления данных из таблицы&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_merge\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_merge&lt;/a&gt; — &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;операция слияния/обработки данных в таблице без пользовательского кода&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_sort\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_sort&lt;/a&gt; — &lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;операция сортировки данных&lt;/a&gt;. В случае, если не указан destination_table делается inplace-сортировка таблицы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_map_reduce\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_map_reduce&lt;/a&gt; — &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;операция MapReduce&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_map\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_map&lt;/a&gt; — &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;операция Map&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_reduce\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_reduce&lt;/a&gt; — &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;операция Reduce&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_join_reduce\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_join_reduce&lt;/a&gt; — &lt;a href=\"user-guide/data-processing/operations/reduce.html#foreign_tables\"&gt;операция JoinReduce&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_operation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_operation&lt;/a&gt; – запускает операцию.&lt;br /&gt;\nПо умолчанию команда запускает необходимую операцию as is, опция &lt;code&gt;enable_optimizations&lt;/code&gt; разрешает оптимизации &lt;code&gt;treat_unexisting_as_empty&lt;/code&gt;, &lt;code&gt;run_map_reduce_if_source_is_not_sorted&lt;/code&gt;, &lt;code&gt;run_merge_instead_of_sort_if_input_tables_are_sorted&lt;/code&gt;, если они включены в конфиге&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_remote_copy\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_remote_copy&lt;/a&gt; — &lt;a href=\"user-guide/data-processing/operations/remote-copy.html\"&gt;операция RemoteCopy&lt;/a&gt;&lt;br /&gt;\nСкопировать таблицу с одного YTsaurus кластера на другой.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"spec_builder\"&gt;&lt;a href=\"ru/api/python/userdoc.html#spec_builder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SpecBuilder&lt;/span&gt;&lt;/a&gt;SpecBuilder&lt;/h4&gt;\n&lt;p&gt;Рекомендуемым способом указывать параметры для запуска операции являются так называемые &lt;a href=\"ru/api/python/userdoc.html#spec_builder\"&gt;spec builder&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Поддерживаются следующие классы для заполнения спецификации операции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.MapSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MapSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.ReduceSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ReduceSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.MapReduceSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MapReduceSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.JoinReduceSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;JoinReduceSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.MergeSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MergeSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.SortSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;SortSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.RemoteCopySpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;RemoteCopySpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.EraseSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;EraseSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.VanillaSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;VanillaSpecBuilder&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Имена методов соответствуют названиям опций в спецификации, описанным &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;здесь&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;В билдерах, позволяющих заполнять спецификацию для операции с пользовательскими джобами, существуют методы &lt;code&gt;begin_mapper&lt;/code&gt;, &lt;code&gt;begin_reducer&lt;/code&gt;, &lt;code&gt;begin_reduce_combiner&lt;/code&gt;. Аналогично, есть методы &lt;code&gt;begin_job_io&lt;/code&gt;, &lt;code&gt;begin_map_job_io&lt;/code&gt;, &lt;code&gt;begin_sort_job_io&lt;/code&gt;, &lt;code&gt;begin_reduce_job_io&lt;/code&gt;, &lt;code&gt;begin_partition_job_io&lt;/code&gt;, &lt;code&gt;begin_merge_job_io&lt;/code&gt; в соответствующих spec builder.&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\n\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; __name__ == &lt;span class=\"hljs-string\"&gt;\"__main__\"&lt;/span&gt;:\n    spec_builder = yt.spec_builders.MapSpecBuilder() \\\n        .input_table_paths(&lt;span class=\"hljs-string\"&gt;\"//tmp/input_table\"&lt;/span&gt;) \\\n        .output_table_paths(&lt;span class=\"hljs-string\"&gt;\"//tmp/output_table\"&lt;/span&gt;) \\\n        .begin_mapper() \\\n            .command(&lt;span class=\"hljs-string\"&gt;\"cat\"&lt;/span&gt;) \\\n            .&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(yt.YsonFormat()) \\\n        .end_mapper()\n\n    yt.run_operation(spec_builder)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1477\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1477\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1477\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1477.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Для удобства доступны ещё два типа spec builder:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Spec builder'ы для заполнения &lt;a href=\"user-guide/storage/io-configuration.html\"&gt;I/O параметров&lt;/a&gt;:\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.PartitionJobIOSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;PartitionJobIOSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.SortJobIOSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;SortJobIOSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.MergeJobIOSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MergeJobIOSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.spec_builders.ReduceJobIOSpecBuilder\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ReduceJobIOSpecBuilder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;
