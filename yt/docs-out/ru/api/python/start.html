            {"data":{"leading":false,"html":"&lt;h2 id=\"python-api\"&gt;&lt;a href=\"ru/api/python/start.html#python-api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Python API&lt;/span&gt;&lt;/a&gt;Python API&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Перед началом работы установите Python-клиент из pip-репозитория следующей командой:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;pip install ytsaurus-client\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"11\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-11\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-11\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-11.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;После установки пакета становится доступным:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Python библиотека &lt;a href=\"https://pydoc.ytsaurus.tech/yt.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;Бинарный файл &lt;a href=\"api/cli/cli.html\"&gt;yt&lt;/a&gt;;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Текущая вресия пакета требует &lt;strong&gt;Python 3.8+&lt;/strong&gt;&lt;/p&gt;\n&lt;h3 id=\"install\"&gt;&lt;a href=\"ru/api/python/start.html#install\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка&lt;/span&gt;&lt;/a&gt;Установка&lt;/h3&gt;\n&lt;h4 id=\"biblioteki-yson\"&gt;&lt;a href=\"ru/api/python/start.html#biblioteki-yson\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Библиотеки YSON&lt;/span&gt;&lt;/a&gt;Библиотеки YSON&lt;/h4&gt;\n&lt;p&gt;Для использования YSON формата для работы с таблицами потребуются C++ биндинги, которые устанавливаются отдельным пакетом. Установка &lt;a href=\"api/python/userdoc.html#yson_bindings\"&gt;YSON биндингов&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;pip install ytsaurus-yson\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"41\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-41\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-41\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-41.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В настоящий момент нет возможности установить YSON биндинги под Windows.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Для пользователей платформы Apple M1&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В настоящий момент нет YSON биндингов, собранных под платформу Apple. В качестве временного решения можно воспользоваться &lt;a href=\"https://ru.wikipedia.org/wiki/Rosetta_(%D0%BF%D1%80%D0%BE%D0%B3%D1%80%D0%B0%D0%BC%D0%BC%D0%BD%D0%BE%D0%B5_%D0%BE%D0%B1%D0%B5%D1%81%D0%BF%D0%B5%D1%87%D0%B5%D0%BD%D0%B8%D0%B5)\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Rosetta 2&lt;/a&gt; и установить версию Python для архитектуры x86_64.&lt;/p&gt;\n&lt;p&gt;Подробнее об этом можно прочитать по &lt;a href=\"https://stackoverflow.com/questions/71691598/how-to-run-python-as-x86-with-rosetta2-on-arm-macos-machine\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ссылке&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Подробнее про YSON можно прочитать в разделе &lt;a href=\"api/python/userdoc.html#formats\"&gt;Форматы&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Чтобы узнать версию установленной обертки из Python, распечатайте переменную &lt;code&gt;yt.VERSION&lt;/code&gt; или вызовите команду &lt;code&gt;yt --version&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;При возникновении проблем ознакомьтесь с разделом &lt;a href=\"ru/api/python/start.html#faq\"&gt;FAQ&lt;/a&gt;. Если проблема сохранилась, напишите в &lt;a href=\"https://t.me/ytsaurus_ru\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;чат&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/yt/wrapper\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Исходный код библиотеки&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Не рекомендуется устанавливать библиотеку и зависимые от нее пакеты разными способами одновременно. Это может приводить к трудно диагностируемым проблемам.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"userdoc\"&gt;&lt;a href=\"ru/api/python/start.html#userdoc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Документация для пользователей&lt;/span&gt;&lt;/a&gt;Документация для пользователей&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#common\"&gt;Общее&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#agreements\"&gt;Соглашения, использующиеся в коде&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#client\"&gt;Клиент&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#threadsafety\"&gt;Потокобезопасность&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#gevent\"&gt;Асинхронный клиента на основе gevent&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#configuration\"&gt;Конфигурация&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#configuration_common\"&gt;Общий конфиг&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#configuration_logging\"&gt;Настройка логирования&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#configuration_token\"&gt;Настройка токена&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#configuration_retries\"&gt;Настройка ретраев&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#errors\"&gt;Ошибки&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#formats\"&gt;Форматы&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#ypath\"&gt;YPath&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#commands\"&gt;Команды&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#cypress_commands\"&gt;Работа с кипарисом&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#file_commands\"&gt;Работа с файлами&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#table_commands\"&gt;Работа с таблицами&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#dataclass\"&gt;Датаклассы&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#table_schema\"&gt;Схемы&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#tablepath_class\"&gt;TablePath&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#table_commands\"&gt;Команды&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#parallel_read\"&gt;Параллельное чтение таблиц&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#parallel_write\"&gt;Параллельная запись таблиц&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#transaction_commands\"&gt;Работа с транзакциями и локами&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#run_operation_commands\"&gt;Запуск операций&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#spec_builder\"&gt;SpecBuilder&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#operation_and_job_commands\"&gt;Работа с операциями и джобами&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#operation_class\"&gt;Operation&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#operations_tracker_class\"&gt;OperationsTracker&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#operations_tracker_pool_class\"&gt;OperationsTrackerPool&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#acl_commands\"&gt;Работы с правами доступа&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#dyntables_commands\"&gt;Работа с динамическими таблицами&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#etc_commands\"&gt;Другие команды&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#python_operations\"&gt;Python-объекты в качестве операций&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#python_operations_intro\"&gt;Общая информация&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#prepare_operation\"&gt;Подготовка операции из джоба&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#python_decorators\"&gt;Декораторы&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#pickling\"&gt;Pickling функции и окружения&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#pickling_description\"&gt;Общее устройство&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#pickling_advises\"&gt;Ссылка на пост с советами&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#porto_layers\"&gt;Porto-слои&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#tmpfs_in_jobs\"&gt;tmpfs в джобах&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#python_jobs_statistics\"&gt;Статистики в джобах&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#python_operations_untyped\"&gt;Нетипизированные Python-операции&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#python_decorators_untyped\"&gt;Декораторы&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#python_formats\"&gt;Форматы&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#structured_data\"&gt;Структурированное представление данных&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#control_attributes\"&gt;Контрольные атрибуты&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#other_formats\"&gt;Другие форматы&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#other\"&gt;Другое&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#grpc\"&gt;gRPC&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#yson_bindings\"&gt;YSON-биндинги&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#legacy\"&gt;Устаревшее&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/userdoc.html#python3_strings\"&gt;Python3 и байтовые строки&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"pydoc\"&gt;&lt;a href=\"ru/api/python/start.html#pydoc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Справка&lt;/span&gt;&lt;/a&gt;Справка&lt;/h3&gt;\n&lt;p&gt;Самая актуальная справка по конкретным функциям и их параметрам находится в коде.&lt;/p&gt;\n&lt;p&gt;Посмотреть описание функций и классов в интерпретаторе можно следующим образом:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ python\n&amp;gt;&amp;gt;&amp;gt; import yt.wrapper as yt\n&amp;gt;&amp;gt;&amp;gt; &lt;span class=\"hljs-built_in\"&gt;help&lt;/span&gt;(yt.run_sort)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"397\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-397\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-397\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-397.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"examples\"&gt;&lt;a href=\"ru/api/python/start.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#base\"&gt;Базовый уровень&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#read_write\"&gt;Чтение и запись таблиц&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#table_schema\"&gt;Схемы таблиц&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#simple_map\"&gt;Простой map&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#sort_and_reduce\"&gt;Сортировка таблицы и простая операция reduce&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#reduce_multiple_output\"&gt;Reduce с несколькими входными таблицами&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#reduce_multiple_input_output\"&gt;Reduce с несколькими входными и несколькими выходными таблицами&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#map_reduce\"&gt;MapReduce&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#map_reduce_multiple_intermediate_streams\"&gt;MapReduce с несколькими промежуточными таблицами&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#job_decorators\"&gt;Декораторы для классов-джобов&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#files\"&gt;Работа с файлами на клиенте и в операциях&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#grep\"&gt;Генеричный grep&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#advanced\"&gt;Продвинутый уровень&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#batch_queries\"&gt;Batch запросы&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#rpc\"&gt;RPC&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#misc\"&gt;Разное&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#dataclass\"&gt;Датаклассы&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#table_switches\"&gt;Контекст и управление записью в выходные таблицы &lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#spec_builder\"&gt;Spec builders&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"api/python/examples.html#gevent\"&gt;Использование gevent&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n\n&lt;h3 id=\"faq\"&gt;&lt;a href=\"ru/api/python/start.html#faq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FAQ&lt;/span&gt;&lt;/a&gt;FAQ&lt;/h3&gt;\n&lt;p&gt;В данном разделе собраны ответы на ряд частых вопросов, касающихся Python API. Ответы на другие частые вопросы в разделе &lt;a href=\"faq/index.html\"&gt;FAQ&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Q: Установил пакет через pypi, но получаю ошибку &lt;code&gt;yt: command not found&lt;/code&gt;.&lt;/strong&gt;&lt;br /&gt;\nA: Попробуйте выполнить команду&lt;br /&gt;\n&lt;code&gt;pip install ytsaurus-client --force-reinstall&lt;/code&gt;&lt;br /&gt;\nскорее всего в логе будет warning вида &lt;code&gt;The script yt is installed in '...' which isn't on your PATH&lt;/code&gt;. Для решения проблемы необходимо добавить указанный путь в переменную окружения PATH. Для этого нужно выполнить следующую команду:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;echo 'export PATH=\"$PATH:&amp;lt;указанный путь&amp;gt;\"' &amp;gt;&amp;gt; ~/.bashrc\nsource ~/.bashrc\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"519\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-519\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-519\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-519.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В зависимости от оболочки файл может называться по-другому. Чаще всего на Mac он называется &lt;code&gt;~/.zshrc&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Q: Чтение с retry завершается ошибкой из-за превышения таймаута.&lt;/strong&gt;&lt;br /&gt;\nA: Скорее всего в таблице слишком много чанков, нужно укрупнить их. Используйте &lt;code&gt;yt merge --src table --dst table --spec \"{combine_chunks=true}\"&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Q: Операция завершается с ошибкой YSON-а (например: &lt;code&gt;YsonError: Premature end of stream&lt;/code&gt;), а в веб-интерфейсе появляется ошибка парсинга  YSON.&lt;/strong&gt;&lt;br /&gt;\nA: Скорее всего, операция пишет в &lt;code&gt;stdout&lt;/code&gt;. Это запрещено делать явно в Python через &lt;code&gt;print, sys.stdout.write()&lt;/code&gt;, если операция не помечена как &lt;code&gt;raw_io&lt;/code&gt;, но это может делать сторонняя программа, например, архиватор.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Q: Python библиотека слишком много пишет в stderr, как повысить уровень логирования?&lt;/strong&gt;&lt;br /&gt;\nA: Уровень можно повысить, установив переменную окружения &lt;code&gt;YT_LOG_LEVEL=\"ERROR\"&lt;/code&gt;, или через настройку логгера YTsaurus: &lt;code&gt;logging.getLogger(\"Yt\").setLevel(logging.ERROR)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Q: Запускаю операцию с Mac OS X, а джобы завершаются с ошибками типа &lt;code&gt;ImportError: ./tmpfs/modules/_ctypes.so: invalid ELF header&lt;/code&gt;.&lt;/strong&gt;&lt;br /&gt;\nA: Так как Python wrapper забирает с собой на кластер все зависимости Python операции, то туда же приезжают бинарные .so и .pyc файлы, которые потом не могут быть загружены. Стоит использовать porto-слой с вашим локальным окружением, а также включить фильтрацию этих файлов, чтобы они не попадали на кластер. Подробнее можно прочитать в &lt;a href=\"api/python/userdoc.html#porto_layers\"&gt;разделе&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Q: Джобы завершаются с ошибкой &lt;code&gt;Invalid table index N: expected integer in range [A,B]&lt;/code&gt;.&lt;/strong&gt;&lt;br /&gt;\nA: Сообщение означает, что в записях вы выдаете table index, причем соответствующей таблицы нет. Чаще всего это означает, что у вас несколько входных таблиц, а выходная таблица одна. Во входных записях по умолчанию приходят поля &lt;code&gt;@table_index&lt;/code&gt;, чтобы их выключить, можно поменять формат: &lt;code&gt;yt.config[\"tabular_data_format\"] = yt.YsonFormat(process_table_index=None)&lt;/code&gt;. Подробнее про формат можно прочитать в &lt;a href=\"api/python/userdoc.html#python_formats\"&gt;разделе&lt;/a&gt;). В качестве альтернативы явно укажите в спецификации (пример для map-операции):  &lt;code&gt;{\"mapper\": {\"enable_input_table_index\": False}}&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Q: При запуске операции, после того, как она стала completed, появляется ошибка (ReadTimeout, HTTPConnectionPool(....): Read timed out.).&lt;/strong&gt;&lt;br /&gt;\nA: Сообщение означает, что не удалось скачать stderr операции из-за сетевых проблем, причём не помогли даже повторные запросы. В таком случае, стоит воспользоваться опцией &lt;code&gt;ignore_stderr_if_download_failed&lt;/code&gt;, которая позволяет игнорировать stderr, если его не удалось скачать. Рекомендуется использовать опцию при написании production-процессов.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Q: Получаю ошибку &lt;code&gt;Yson bindings required&lt;/code&gt;.&lt;/strong&gt;&lt;br /&gt;\nA: Это означает, что в качестве входного (выходного) формата выбран YSON и в джобе не удалось импортировать биндинги. Подробнее про YSON и биндинги к нему можно прочитать в &lt;a href=\"api/python/userdoc.html#yson\"&gt;разделе&lt;/a&gt;. Нужно установить пакет с биндингами, а также проверить, что YSON биндинги не отфильтровываются с помощью &lt;code&gt;module_filter&lt;/code&gt;. Это динамическая библиотека yson_lib.so, и ее можно легко нечаянно отфильтровать, если отфильтровывать все .so файлы. Кроме того, чтобы &lt;code&gt;yt_yson_bindings&lt;/code&gt;, приехавшие в модулях, не удалялись, в файле конфигурации нужно прописать &lt;code&gt;config[\"pickling\"][\"ignore_yson_bindings_for_incompatible_platforms\"] = False&lt;/code&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/api/python/start.md","sourcePath":"ru/api/python/start.md"},"headings":[{"title":"Python API","href":"ru/api/python/start.html#python-api","level":2,"items":[{"title":"Установка","href":"ru/api/python/start.html#install","level":3,"items":[{"title":"Библиотеки YSON","href":"ru/api/python/start.html#biblioteki-yson","level":4}]},{"title":"Документация для пользователей","href":"ru/api/python/start.html#userdoc","level":3},{"title":"Справка","href":"ru/api/python/start.html#pydoc","level":3},{"title":"Примеры","href":"ru/api/python/start.html#examples","level":3},{"title":"FAQ","href":"ru/api/python/start.html#faq","level":3}]}],"title":""},"router":{"pathname":"ru/api/python/start","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
