            &lt;animate id=\"visibileAnimation-2453\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2453\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2453.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"remove_member\"&gt;&lt;a href=\"ru/api/commands.html#remove_member\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;remove_member&lt;/span&gt;&lt;/a&gt;remove_member&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Удалить пользователя или другую группу из группу.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;member&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Имя пользователя или группы, которое необходимо удалить из группы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;group&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Имя группы, из которой необходимо удалить.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"group\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"admins\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"member\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"devs\"&lt;/span&gt;;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2544\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2544\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2544\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2544.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"check_permission\"&gt;&lt;a href=\"ru/api/commands.html#check_permission\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;check_permission&lt;/span&gt;&lt;/a&gt;check_permission&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Немутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Проверить, есть ли у пользователя определённое право на определённый узел Кипариса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до узла в Кипарисе.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Имя пользователя, для которого необходимо проверить наличие права.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;permission&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Название права, наличие которого необходимо проверить.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;columns&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Список колонок, доступ к которым требуется проверить.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//sys/accounts/statbox\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"permission\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"use\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"user\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"vasya\"&lt;/span&gt;;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2663\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2663\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2663\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2663.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"files\"&gt;&lt;a href=\"ru/api/commands.html#files\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с файлами&lt;/span&gt;&lt;/a&gt;Работа с файлами&lt;/h2&gt;\n&lt;p&gt;Подробную информацию про файлы можно найти в статье &lt;a href=\"user-guide/storage/files.html\"&gt;Файлы&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Все команды для работы с файлами являются транзакционными.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"write_file\"&gt;&lt;a href=\"ru/api/commands.html#write_file\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;write_file&lt;/span&gt;&lt;/a&gt;write_file&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Тяжелая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Синонимы (поддерживаются, но не рекомендуются):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;upload.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Загрузить содержимое в файл;&lt;/li&gt;\n&lt;li&gt;Файл должен существовать;&lt;/li&gt;\n&lt;li&gt;Если на пути &lt;code&gt;path&lt;/code&gt; к файлу указан атрибут &lt;code&gt;append=%true&lt;/code&gt;, то данные добавляются в конец, иначе файл переписывается.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;em&gt;null-transaction-id&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор текущей транзакции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ping_ancestor_transactions&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Пинговать ли все родительские транзакции в процессе выполнения операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до файла в Кипарисе; путь &lt;em&gt;должен&lt;/em&gt; существовать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;compute_md5&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Подсчитывать ли MD5-сумму по записываемому файлу; если &lt;code&gt;compute_md5=%true&lt;/code&gt; и &lt;code&gt;append=%true&lt;/code&gt; , но у файла нет атрибута &lt;code&gt;md5&lt;/code&gt; (то есть раньше его писали без &lt;code&gt;compute_md5=%true&lt;/code&gt; ), возникнет ошибка.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;binary&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: содержимое файла.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {&lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/file\"&lt;/span&gt;}\nINPUT this is sample file content\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2823\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2823\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2823\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2823.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"read_file\"&gt;&lt;a href=\"ru/api/commands.html#read_file\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;read_file&lt;/span&gt;&lt;/a&gt;read_file&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Немутирующая&lt;/strong&gt;, &lt;strong&gt;Тяжелая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Синонимы (поддерживаются, но не рекомендуются):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;download.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Получить содержимое файла из Кипариса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;em&gt;null-transaction-id&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор текущей транзакции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ping_ancestor_transactions&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Пинговать ли все родительские транзакции в процессе выполнения операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до файла в Кипарисе; путь &lt;em&gt;должен&lt;/em&gt; существовать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;offset&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;0&lt;/td&gt;\n&lt;td&gt;Позиция, начиная с которой нужно читать данные.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;length&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Длина данных, которые необходимо вычитать, по умолчанию файл читается до конца.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;binary&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: содержимое файла.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/file\"&lt;/span&gt; }\nOUTPUT this is sample file content\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2971\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2971\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2971\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2971.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"file_cache\"&gt;&lt;a href=\"ru/api/commands.html#file_cache\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с файловым кешем&lt;/span&gt;&lt;/a&gt;Работа с файловым кешем&lt;/h2&gt;\n&lt;p&gt;Подробную информацию про файловый кеш можно найти в разделе &lt;a href=\"user-guide/storage/file-cache.html\"&gt;Файловый кеш&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"put_file_to_cache\"&gt;&lt;a href=\"ru/api/commands.html#put_file_to_cache\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;put_file_to_cache&lt;/span&gt;&lt;/a&gt;put_file_to_cache&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Положить файл в кеш;&lt;/li&gt;\n&lt;li&gt;Проверяет, что по переданному пути лежит файл, MD5 хеш которого соответствует переданному в опциях команды.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь к файлу в Кипарисе.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;md5&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Ожидаемый MD5 хеш файла.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;cache_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь к файловому кешу.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: путь к файлу в кеше.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/file\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"md5\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"a3dcb4d229de6fde0db5686dee47145d\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"cache_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/yt_wrapper/file_storage/new_cache\"&lt;/span&gt;;\n}\nOUTPUT &lt;span class=\"hljs-string\"&gt;\"//tmp/yt_wrapper/file_storage/new_cache/5d/a3dcb4d229de6fde0db5686dee47145d\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3092\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3092\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3092\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3092.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"get_file_from_cache\"&gt;&lt;a href=\"ru/api/commands.html#get_file_from_cache\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;get_file_from_cache&lt;/span&gt;&lt;/a&gt;get_file_from_cache&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Немутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Получить путь к файлу в кеше.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;md5&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;MD5 хеш файла.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;cache_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь к файловому кешу.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: путь к файлу в кэше.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"md5\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"a3dcb4d229de6fde0db5686dee47145d\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"cache_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/yt_wrapper/file_storage/new_cache\"&lt;/span&gt;;\n}\nOUTPUT &lt;span class=\"hljs-string\"&gt;\"//tmp/yt_wrapper/file_storage/new_cache/5d/a3dcb4d229de6fde0db5686dee47145d\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3188\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3188\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3188\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3188.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"tables\"&gt;&lt;a href=\"ru/api/commands.html#tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с таблицами&lt;/span&gt;&lt;/a&gt;Работа с таблицами&lt;/h2&gt;\n&lt;p&gt;Подробную информацию про статические таблицы можно найти в разделе &lt;a href=\"user-guide/storage/static-tables.html\"&gt;Статические таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Подробную информацию про динамические таблицы можно найти в разделе &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Динамические таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"write_table\"&gt;&lt;a href=\"ru/api/commands.html#write_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;write_table&lt;/span&gt;&lt;/a&gt;write_table&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Тяжелая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Применимость: &lt;a href=\"user-guide/storage/static-tables.html\"&gt;Статические таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Синонимы (поддерживаются, но не рекомендуются):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;write.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Добавить новые записи в статическую таблицу;&lt;/li&gt;\n&lt;li&gt;Таблица должна существовать;&lt;/li&gt;\n&lt;li&gt;Если на пути &lt;code&gt;path&lt;/code&gt; к таблице указан атрибут &lt;code&gt;append=%true&lt;/code&gt;, то записи добавляются в конец, иначе таблица перезаписывается;&lt;/li&gt;\n&lt;li&gt;Если на пути &lt;code&gt;path&lt;/code&gt; к таблице указан атрибут &lt;code&gt;sorted_by&lt;/code&gt;, то проверяется, что данные отсортированы по указанному набору ключей и результирующая таблица помечается как сортированная. Запись сортированных данных (с указанным атрибутом &lt;code&gt;sorted_by&lt;/code&gt;) разрешена только в случае, если все новые ключи не меньше всех старых;&lt;/li&gt;\n&lt;li&gt;Запись несортированных данных (без атрибута &lt;code&gt;sorted_by&lt;/code&gt;) разрешена в любую таблицу, но флаг сортированности у таблицы сбрасывается;&lt;/li&gt;\n&lt;li&gt;Команда может быть выполнена внутри &lt;a href=\"ru/api/commands.html#transactions\"&gt;транзакции&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до таблицы в Кипарисе; путь &lt;em&gt;должен&lt;/em&gt; существовать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;table_writer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Из конфигурации драйвера&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/io-configuration.html\"&gt;Опции записи таблицы&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;tabular&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: содержимое таблицы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/node\"&lt;/span&gt; ;\n    &lt;span class=\"hljs-string\"&gt;\"table_writer\"&lt;/span&gt; = { &lt;span class=\"hljs-string\"&gt;\"codec_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"gzip\"&lt;/span&gt; };\n}\nINPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 1; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = 1.125; };\nINPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 2; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = 2.000; };\nINPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 3; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = 3.850; };\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3331\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3331\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3331\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3331.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"read_table\"&gt;&lt;a href=\"ru/api/commands.html#read_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;read_table&lt;/span&gt;&lt;/a&gt;read_table&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Немутирующая&lt;/strong&gt;, &lt;strong&gt;Тяжелая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Применимость: &lt;a href=\"user-guide/storage/static-tables.html\"&gt;Статические&lt;/a&gt; и &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;динамические&lt;/a&gt; таблицы.&lt;/p&gt;\n&lt;p&gt;Синонимы (поддерживаются, но не рекомендуются):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;read.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Получить записи из таблицы в Кипарисе;&lt;/li&gt;\n&lt;li&gt;Команда может быть выполнена внутри &lt;a href=\"ru/api/commands.html#transactions\"&gt;транзакции&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до таблицы в Кипарисе; путь &lt;em&gt;должен&lt;/em&gt; существовать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;table_reader&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Из конфигурации драйвера&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/io-configuration.html#table_reader\"&gt;Опции чтения таблицы&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;control_attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Из конфигурации драйвера&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/io-configuration.html#control_attributes\"&gt;Конфигурация контрольных атрибутов чтения&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;unordered&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Производить ли чтения параллельно, не заботясь о порядке записей.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;tabular&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: содержимое таблицы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/node\"&lt;/span&gt; }\nOUTPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 1; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = 1.125; };\nOUTPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 2; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = 2.000; };\nOUTPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 3; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = 3.850; };\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3473\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3473\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3473\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3473.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"read_blob_table\"&gt;&lt;a href=\"ru/api/commands.html#read_blob_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;read_blob_table&lt;/span&gt;&lt;/a&gt;read_blob_table&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Немутирующая&lt;/strong&gt;, &lt;strong&gt;Тяжелая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Применимость: Статические &lt;a href=\"user-guide/storage/blobtables.html\"&gt;таблицы с бинарными данными&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Получить бинарный поток данных из отдельной колонки таблицы в Кипарисе.&lt;/li&gt;\n&lt;li&gt;Команда может быть выполнена внутри транзакции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до таблицы в Кипарисе; путь &lt;em&gt;должен&lt;/em&gt; существовать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;table_reader&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Из конфига драйвера&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/io-configuration.html\"&gt;Опции чтения таблицы&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;part_index_column_name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;part_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя колонки, в котором хранятся индексы блобов.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data_column_name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;data&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя колонки, в котором хранятся данные.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;binary&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: содержимое колонки с данными в таблицы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/node\"&lt;/span&gt; }\nOUTPUT &lt;span class=\"hljs-string\"&gt;\"Hello world\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3605\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3605\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3605\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3605.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"select_rows\"&gt;&lt;a href=\"ru/api/commands.html#select_rows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;select_rows&lt;/span&gt;&lt;/a&gt;select_rows&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Немутирующая&lt;/strong&gt;, &lt;strong&gt;Тяжелая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Применимость: &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Динамические таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Выполнить SQL-подобный запрос для динамической таблицы в соответствии с &lt;a href=\"user-guide/dynamic-tables/dyn-query-language.html\"&gt;поддерживаемыми возможностями&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;Транзакция может быть выполнена относительно слепка данных с указанной меткой времени.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;query&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Строка запроса.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;timestamp&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;sync last committed&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Относительно какой временной метки следует выполнить запрос.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;tabular&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: набор строк с результатом.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"query\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"key, value from [//tmp/sometable]\"&lt;/span&gt; }\nOUTPUT { &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt; = 1; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"hello\"&lt;/span&gt;; };\nOUTPUT { &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt; = 2; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"world; };\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3709\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3709\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3709\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3709.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"insert_rows\"&gt;&lt;a href=\"ru/api/commands.html#insert_rows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;insert_rows&lt;/span&gt;&lt;/a&gt;insert_rows&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Тяжелая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Применимость: &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Динамические таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Записать строки в динамическую таблицу.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до динамической таблицы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;update&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Если выставлено &lt;code&gt;false&lt;/code&gt;, колонки, которые отсутствуют во входных данных, будут записаны со значением &lt;code&gt;Null&lt;/code&gt; (перезаписывая текущее значение в таблице). Если выставлено &lt;code&gt;true&lt;/code&gt;, такие колонки сохранят своё предыдущее значение в таблице.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;aggregate&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Если выставлено &lt;code&gt;false&lt;/code&gt;, &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html#aggr_columns\"&gt;агрегирующие колонки&lt;/a&gt; перезатерты новым значением. Если выставлено &lt;code&gt;true&lt;/code&gt;, такие колонки применят дельту из входных данных.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;atomicity&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;full&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Поддерживаются значения &lt;code&gt;none&lt;/code&gt; и &lt;code&gt;full&lt;/code&gt;. Если выставлено &lt;code&gt;none&lt;/code&gt;, запись будет происходить на каждом таблете, независимо от других. Если выставлено&lt;code&gt;full&lt;/code&gt;, будут записаны либо все переданные строки, либо ничего. &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html\"&gt;Подробнее&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;require-sync-replica&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Опция имеет смысл только в случае репликации. Если выставлено в &lt;code&gt;true&lt;/code&gt;, то вставка произойдёт только при наличии у таблицы синхронной реплики. Если выставлено в &lt;code&gt;false&lt;/code&gt;, то наличие синхронной реплики необязательно.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;tabular&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: содержимое таблицы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//home/user/table\"&lt;/span&gt; }\nINPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 1; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = 1.125; };\nINPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 2; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = 2.000; };\nINPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 3; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = 3.850; };\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3850\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3850\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3850\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3850.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"delete_rows\"&gt;&lt;a href=\"ru/api/commands.html#delete_rows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;delete_rows&lt;/span&gt;&lt;/a&gt;delete_rows&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Тяжелая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Применимость: &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Динамические таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Удалить из динамической таблицы строки с указанными ключами.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до динамической таблицы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;tabular&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: набор строк с ключами.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/sometable\"&lt;/span&gt; }\nINPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 1; };\nINPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 2; };\nINPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 3; };\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3935\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3935\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3935\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3935.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"lock_rows\"&gt;&lt;a href=\"ru/api/commands.html#lock_rows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;lock_rows&lt;/span&gt;&lt;/a&gt;lock_rows&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Тяжелая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Применимость: &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Динамические таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Заблокировать строки на запись в динамической таблице на время выполнения текущей транзакции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до динамической таблицы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;locks&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Список затрагиваемых групп блокировок (&lt;code&gt;lock group&lt;/code&gt; в схеме таблицы).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;lock_type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;shared strong&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Виды блокировок: &lt;code&gt;shared weak&lt;/code&gt;, &lt;code&gt;shared strong&lt;/code&gt;, &lt;code&gt;exclusive&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Shared-блокировка может быть взята из множества разных транзакций одновременно. Exclusive-блокировка - из одной транзакции, обычно меняющей данную строку.&lt;/p&gt;\n&lt;p&gt;При использовании блокировок на чтение (в отличие от блокировок на запись) одна строка может быть заблокирована из множества разных транзакций. Таким образом, при непрерывном потоке транзакций, берущих shared-блокировку на некоторую строку, строка будет заблокирована постоянно, и модифицировать её не получится. Этот эффект называется &lt;code&gt;write starvation&lt;/code&gt;. В случае write-write конфликтов такого быть не может, так как берется &lt;code&gt;exclusive lock&lt;/code&gt;, который отпускается каждый раз при завершении транзакции с записью.&lt;/p&gt;\n&lt;p&gt;Для ослабления эффекта &lt;code&gt;write starvation&lt;/code&gt; можно понижать изоляцию shared-блокировок. Для этого можно указывать режим блокировки &lt;code&gt;weak&lt;/code&gt; или &lt;code&gt;strong&lt;/code&gt;. Режим &lt;code&gt;weak&lt;/code&gt; отличается тем, что в момент завершения транзакции не запоминаются временные метки, до которых строки были заблокированы разделяемыми блокировками. На практике это означает, что не блокируется запись, которая происходит в транзакции, пересекающейся по времени с данной, но завершение которой происходит позже. При этом если завершение write-транзакции произошло раньше, то транзакция с shared-блокировкой не будет применена. В режиме &lt;code&gt;weak&lt;/code&gt; shared-блокировка становится асимметричной.&lt;/p&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;tabular&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: набор строк с ключами.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"lookup_rows\"&gt;&lt;a href=\"ru/api/commands.html#lookup_rows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;lookup_rows&lt;/span&gt;&lt;/a&gt;lookup_rows&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Немутирующая&lt;/strong&gt;, &lt;strong&gt;Тяжелая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Применимость: &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Динамические таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Выбрать из таблицы строки с указанными ключами;&lt;/li&gt;\n&lt;li&gt;Команда может быть выполнена относительно слепка данных с указанной меткой времени;&lt;/li&gt;\n&lt;li&gt;Гарантируется, что относительный порядок найденных строк в ответе будет совпадать с порядком ключей в запросе.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до динамической таблицы. Путь должен быть простым (не содержать колонок, диапазонов и т.д.)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;column_names&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Какие колонки включить в ответ.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;keep_missing_rows&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Включать ли в ответ строки, соответствующие не найденным ключам; если выставлено &lt;code&gt;true&lt;/code&gt;, на соответствующих позициях будут &lt;code&gt;#&lt;/code&gt; (entity).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;timestamp&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;sync last committed&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Относительно какой метки времени следует выполнить запрос.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;tabular&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: набор строк с ключами.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;tabular&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: набор строк с указанными ключами и запрошенными колонками.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/sometable\"&lt;/span&gt; }\nINPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 1; };\nINPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 2; };\nINPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 3; };\nOUTPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 1; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = 1.125; };\nOUTPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 2; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = 2.000; };\nOUTPUT { &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = 3; &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt; = 3.850; };\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"4185\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-4185\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-4185\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-4185.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"trim_rows\"&gt;&lt;a href=\"ru/api/commands.html#trim_rows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;trim_rows&lt;/span&gt;&lt;/a&gt;trim_rows&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Тяжелая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Применимость: &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables.html\"&gt;Упорядоченные&lt;/a&gt; динамические таблицы.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Удалить строки из начала таблета упорядоченной динамической таблицы. После этого удаленные данные уже нельзя прочитать командой &lt;code&gt;select_rows&lt;/code&gt;. Нумерация остальных строк при этом не меняется;&lt;/li&gt;\n&lt;li&gt;Команда выполняется вне транзакций.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до динамической таблицы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Номер обрезаемого таблета.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;trimmed_row_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Количество удаляемых строк.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//home/user/table\"&lt;/span&gt;; tablet_index = 10; trimmed_row_count = 43 }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"4298\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-4298\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-4298\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-4298.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"mount_table\"&gt;&lt;a href=\"ru/api/commands.html#mount_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;mount_table&lt;/span&gt;&lt;/a&gt;mount_table&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Применимость: &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Динамические таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Монтирует таблеты динамической таблицы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до динамической таблицы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;first_tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Номер первого монтируемого таблета.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;last_tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tablet_count - 1&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Номер последнего монтируемого таблета.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;cell_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Если указано, то монтирование таблетов происходит в данный селл. Если нет, то система сама выбирает подходящие селлы (и в большинстве случаев стоит отдать ей этот выбор).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;freeze&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Если выставлено в &lt;code&gt;true&lt;/code&gt; то таблеты монтируются в замороженное состояние. См. также описание команды &lt;a href=\"ru/api/commands.html#freeze_table\"&gt;freeze_table&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//home/user/table\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"4434\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-4434\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-4434\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-4434.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"unmount_table\"&gt;&lt;a href=\"ru/api/commands.html#unmount_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;unmount_table&lt;/span&gt;&lt;/a&gt;unmount_table&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Применимость: &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Динамические таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Отмонтирует таблеты динамической таблицы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до динамической таблицы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;first_tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Номер первого отмонтируемого таблета.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;last_tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tablet_count - 1&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Номер последнего отмонтируемого таблета.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Принудительно отмонтировать таблеты. Существует риск потери данных, поэтому для использования флага необходимы права администратора YTsaurus.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//home/user/table\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"first_tablet_index\"&lt;/span&gt; = 10; &lt;span class=\"hljs-string\"&gt;\"last_tablet_index\"&lt;/span&gt; = 20; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"4556\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-4556\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-4556\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-4556.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"remount_table\"&gt;&lt;a href=\"ru/api/commands.html#remount_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;remount_table&lt;/span&gt;&lt;/a&gt;remount_table&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Применимость: &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Динамические таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Позволяет обновлять ряд настроек динамических таблиц без отмонтирования;&lt;/li&gt;\n&lt;li&gt;При таком перемонтировании таблица остается доступной на чтение и запись;&lt;/li&gt;\n&lt;li&gt;Настройки берутся из атрибутов таблицы и в итоге доходят до узла, где происходит обработка таблетов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до динамической таблицы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;first_tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Номер первого перемонтируемого таблета.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;last_tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tablet_count - 1&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Номер последнего перемонтируемого таблета.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//home/user/table\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"4674\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-4674\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-4674\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-4674.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"freeze_table\"&gt;&lt;a href=\"ru/api/commands.html#freeze_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;freeze_table&lt;/span&gt;&lt;/a&gt;freeze_table&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Применимость: &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Динамические таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Переводит таблеты динамической таблицы в замороженное состояние, сбрасывая все данные на диск. В этом состоянии возможно чтение данных, но невозможна новая запись. При этом все ранее записанные данные оказываются в чанках, так что они, например, доступны для map-reduce операций (даже без использования опции &lt;code&gt;enable_dynamic_store_read&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до динамической таблицы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;first_tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Номер первого замораживаемого таблета.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;last_tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tablet_count - 1&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Номер последнего замораживаемого таблета.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//home/user/table\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"4782\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-4782\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-4782\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-4782.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"unfreeze_table\"&gt;&lt;a href=\"ru/api/commands.html#unfreeze_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;unfreeze_table&lt;/span&gt;&lt;/a&gt;unfreeze_table&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Применимость: &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Динамические таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Отменяет ранее выполненную (например командой &lt;code&gt;freeze_table&lt;/code&gt;) заморозку таблицы, открывая таблицу на запись.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до динамической таблицы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;first_tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Номер первого размораживаемого таблета.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;last_tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tablet_count - 1&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Номер последнего размораживаемого таблета.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//home/user/table\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"4890\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-4890\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-4890\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-4890.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"reshard_table\"&gt;&lt;a href=\"ru/api/commands.html#reshard_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;reshard_table&lt;/span&gt;&lt;/a&gt;reshard_table&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Применимость: &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Динамические таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Изменяет состав таблетов динамической таблицы;&lt;/li&gt;\n&lt;li&gt;Затронутые таблеты должны быть отмонтированы;&lt;/li&gt;\n&lt;li&gt;Для упорядоченной таблицы должен быть указан &lt;code&gt;tablet_count&lt;/code&gt;. Для сортированной таблицы можно указать как &lt;code&gt;tablet_count&lt;/code&gt;, так и &lt;code&gt;pivot_keys&lt;/code&gt;. При этом затронутые таблеты заменяются на набор новых;&lt;/li&gt;\n&lt;li&gt;В случае сортированной таблицы:\n&lt;ul&gt;\n&lt;li&gt;при передаче &lt;code&gt;pivot_keys&lt;/code&gt; первый ключ в &lt;code&gt;pivot_keys&lt;/code&gt; должен совпадать с первым ключом первого решардируемого таблета. Количество ключей &lt;code&gt;pivot_keys&lt;/code&gt; равно количеству таблетов, на которые разбиваются затронутые таблеты;&lt;/li&gt;\n&lt;li&gt;при передаче &lt;code&gt;tablet_count&lt;/code&gt; система сама выберет pivot-ключи исходя из имеющихся данных в таблице, по возможности равномерно. Если таблица недостаточного размера, в результате может получиться меньше таблетов, чем заказано. При настройках по умолчанию получаемые таблеты не могут оказаться размером менее, чем примерно 200 МБ. Для более мелкой нарезки следует использовать опцию &lt;code&gt;enable_slicing&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;если первая ключевая колонка таблицы имеет целочисленный тип, вместе с &lt;code&gt;tablet_count&lt;/code&gt; можно указать параметр &lt;code&gt;uniform=True&lt;/code&gt;. В этом случае в качестве pivot-ключей будут выбраны равномерные значения из диапазона соответствующего типа. &lt;code&gt;0, 2^64/n, 2^64\\*2/n, ...&lt;/code&gt; для беззнакового 64-битного типа и &lt;code&gt;-2^63, -2^63 + 2^64/n, -2^63 + 2^64\\*2/n, ...&lt;/code&gt; для знакового.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;В случае упорядоченной таблицы &lt;code&gt;tablet_count&lt;/code&gt; указывает, на какое количество новых таблетов следует разделить решардируемые. При этом если новое количество таблетов больше старого, то создаются пустые таблеты. Если же меньше, то соответствующее количество \"хвостовых\" исходных таблетов объединяются в один в естественном порядке.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&l
