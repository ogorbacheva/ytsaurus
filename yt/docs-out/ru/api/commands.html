            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе перечислены все команды, доступные в API системы YTsaurus, с полным описанием их опций.&lt;/p&gt;\n&lt;h2 id=\"structure\"&gt;&lt;a href=\"ru/api/commands.html#structure\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Структура&lt;/span&gt;&lt;/a&gt;Структура&lt;/h2&gt;\n&lt;p&gt;Упрощенно каждая команда представляет собой:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Имя команды (строка);&lt;/li&gt;\n&lt;li&gt;Описание входного и выходного форматов (&lt;a href=\"user-guide/storage/data-types.html#yson\"&gt;YSON-строка&lt;/a&gt; с атрибутами);&lt;/li&gt;\n&lt;li&gt;Параметры исполняемого действия (YSON-структура);&lt;/li&gt;\n&lt;li&gt;Входной и выходной потоки данных.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Каждая команда также определяет тип входных и выходных данных. Ниже перечислены возможные варианты входных и выходных данных:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Данные отсутствуют (&lt;code&gt;null&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;Данные являются бинарным потоком (&lt;code&gt;binary&lt;/code&gt;). Например содержимое &lt;a href=\"user-guide/storage/files.html\"&gt;файлов&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;Данные &lt;a href=\"user-guide/storage/formats.html#structured_data\"&gt;структурированы&lt;/a&gt; (&lt;code&gt;structured&lt;/code&gt;). Например обычные узлы &lt;a href=\"user-guide/storage/cypress.html\"&gt;Кипариса&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;Данные являются табличным потоком (&lt;code&gt;tabular&lt;/code&gt;). Например  содержимое &lt;a href=\"user-guide/storage/objects.html#tables\"&gt;таблиц&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Кроме того, каждая команда может быть:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Мутирующей или нет (меняет ли она что-нибудь в метасостоянии или нет);&lt;/li&gt;\n&lt;li&gt;Легкой или тяжелой (легкие команды передают в запросе только параметры команды, тяжелые же пишут или читают поток данных).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"formats\"&gt;&lt;a href=\"ru/api/commands.html#formats\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Форматы&lt;/span&gt;&lt;/a&gt;Форматы&lt;/h3&gt;\n&lt;p&gt;Если команда работает со структурированными или табличными данными, для неё следует указать &lt;a href=\"user-guide/storage/formats.html\"&gt;формат&lt;/a&gt;. Для входного потока данных служит параметр &lt;code&gt;input_format&lt;/code&gt;, для выходного потока параметр &lt;code&gt;output_format&lt;/code&gt; соответственно.&lt;/p&gt;\n&lt;p&gt;В случае структурированных данных поддерживаются форматы &lt;code&gt;yson&lt;/code&gt; (используется по умолчанию) и &lt;code&gt;json&lt;/code&gt;. Для табличных данных существует множество различных &lt;a href=\"user-guide/storage/formats.html\"&gt;форматов&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"retry\"&gt;&lt;a href=\"ru/api/commands.html#retry\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Повторное выполнение (ретраи)&lt;/span&gt;&lt;/a&gt;Повторное выполнение (ретраи)&lt;/h3&gt;\n&lt;p&gt;Под повторным выполнением команды мы понимаем возможность повторить запрос в случае возникновения транзиентных (временных) ошибок. Ожидается, что ответ на повторный запрос будет не отличим от ответа на исходный запрос, как если бы транзиентных ошибок не возникло. Это не означает, что ответ на повторный запрос действительно будет тем же самым, что на исходные, то есть гарантируется лишь стандартный уровень \"изоляции\".&lt;/p&gt;\n&lt;p&gt;Возможность повторно выполнить команду и механизм повторения зависит от свойств команды.&lt;/p&gt;\n&lt;h4 id=\"light\"&gt;&lt;a href=\"ru/api/commands.html#light\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Легкие команды&lt;/span&gt;&lt;/a&gt;Легкие команды&lt;/h4&gt;\n&lt;p&gt;Для немутирующих легких команд можно повторить исходный запрос.&lt;/p&gt;\n&lt;p&gt;Мутирующие легкие команды изменяют состояние системы, поэтому необходимо системе подсказать, что такой запрос уже задавался. Для этого, перед тем как выполнять команду, необходимо сгенерировать &lt;code&gt;mutation_id&lt;/code&gt; для команды. Это стандартный GUID, состоящий из 4-х 32-битных чисел в HEX-формате, разделенных символом &lt;code&gt;-&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Сгенерированный &lt;code&gt;mutation_id&lt;/code&gt; необходимо указать в параметрах как исходного запроса, так и повторных запросов. Кроме того, в исходный запрос необходимо добавить параметр &lt;code&gt;retry&lt;/code&gt; со значением &lt;code&gt;false&lt;/code&gt;, а в повторные параметр &lt;code&gt;retry&lt;/code&gt; со значением &lt;code&gt;true&lt;/code&gt;. Некоторые легкие мутирующие команды не поддерживают повторное выполнение: к таким относится &lt;code&gt;concatenate&lt;/code&gt;. Такие команды можно выполнить повторно, используя транзакции.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;code&gt;mutation_id&lt;/code&gt; обычно хранится 5-10 минут.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"hard\"&gt;&lt;a href=\"ru/api/commands.html#hard\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тяжелые команды&lt;/span&gt;&lt;/a&gt;Тяжелые команды&lt;/h4&gt;\n&lt;p&gt;Тяжелые команды нельзя выполнить повторно. Однако, пользуясь транзакциями, можно написать механизм повторного выполнения.&lt;/p&gt;\n&lt;h2 id=\"transactions\"&gt;&lt;a href=\"ru/api/commands.html#transactions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Транзакции&lt;/span&gt;&lt;/a&gt;Транзакции&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"user-guide/storage/transactions.html\"&gt;Транзакции&lt;/a&gt; являются неотъемлемым свойством Кипариса. Многие команды, которые так или иначе работают с Кипарисом, являются транзакционными. У каждой команды или группы команд отдельно отмечено, является команда транзакционной или нет. Если команда является транзакционной, у неё поддерживаются следующие параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;em&gt;null-transaction-id&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор текущей транзакции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ping_ancestor_transactions&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Пинговать ли все родительские транзакции в процессе выполнения операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"drugie-parametry-zaprosov\"&gt;&lt;a href=\"ru/api/commands.html#drugie-parametry-zaprosov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Другие параметры запросов&lt;/span&gt;&lt;/a&gt;Другие параметры запросов&lt;/h2&gt;\n&lt;p&gt;Также имеется возможность указывать пререквизиты у запросов, а также для легких немутирующих запросов указывать, откуда производить чтение. Подробную информацию можно найти в разделе &lt;a href=\"api/query-parameters.html\"&gt;Параметры запросов&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"rabota-s-tranzakciyami\"&gt;&lt;a href=\"ru/api/commands.html#rabota-s-tranzakciyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с транзакциями&lt;/span&gt;&lt;/a&gt;Работа с транзакциями&lt;/h2&gt;\n&lt;p&gt;Подробную информацию про транзакции можно найти в статье &lt;a href=\"user-guide/storage/transactions.html\"&gt;Транзакции&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"start_tx\"&gt;&lt;a href=\"ru/api/commands.html#start_tx\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;start_tx&lt;/span&gt;&lt;/a&gt;start_tx&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Начать новую транзакцию в контексте текущей транзакции.&lt;/li&gt;\n&lt;li&gt;Новая транзакция является вложенной (внутренней) по отношению к указанной.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;em&gt;null-transaction-id&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор текущей транзакции (которая станет родительской для транзакции, созданной командой).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ping_ancestor_transactions&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Пинговать (продлевать время жизни) все родительские транзакции в процессе выполнения операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;15000&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время жизни транзакции с момента последнего продления (в мс).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;deadline&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;missing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Дедлайн на время выполнения транзакции (в UTC).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;missing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Позволяет задать атрибуты создаваемой транзакции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;master&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Позволяет задать тип транзакции: &lt;code&gt;master&lt;/code&gt; или &lt;code&gt;tablet&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: идентификатор новой транзакции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"transaction_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"0-54b-1-36223d20\"&lt;/span&gt; }\nOUTPUT &lt;span class=\"hljs-string\"&gt;\"0-54c-1-bb49086d\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"339\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-339\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-339\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-339.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"ping_tx\"&gt;&lt;a href=\"ru/api/commands.html#ping_tx\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ping_tx&lt;/span&gt;&lt;/a&gt;ping_tx&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Обновить транзакцию.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Подробное описание:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;ping_tx&lt;/code&gt; пингует транзакцию на сервере (включая все родительские, если указан &lt;code&gt;ping_ancestors&lt;/code&gt;), тем самым обновляя время ее жизни.&lt;/li&gt;\n&lt;li&gt;Если транзакция была начата в момент времени &lt;code&gt;s&lt;/code&gt; с таймаутом (временем жизни) &lt;code&gt;t&lt;/code&gt;, то по умолчанию транзакция завершится в момент времени &lt;code&gt;s + t&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Если ее пинговать в момент времени &lt;code&gt;r&lt;/code&gt; (&lt;code&gt;s &amp;lt; r &amp;lt; s + t&lt;/code&gt;), то транзакция будет продлена вплоть до момента &lt;code&gt;r + t&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор  родительской транзакции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ping_ancestor_transactions&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Пинговать ли все родительские транзакции в процессе выполнения операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"transaction_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"0-54b-1-36223d20\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"450\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-450\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-450\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-450.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"commit_tx\"&gt;&lt;a href=\"ru/api/commands.html#commit_tx\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;commit_tx&lt;/span&gt;&lt;/a&gt;commit_tx&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Успешно завершить транзакцию.&lt;/li&gt;\n&lt;li&gt;При наличии незавершенных внутренних транзакций успешное завершение внешней транзакции невозможно.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор  транзакции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ping_ancestor_transactions&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Пинговать ли все родительские транзакции в процессе выполнения операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"transaction_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"0-54b-1-36223d20\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"546\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-546\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-546\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-546.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"abort_tx\"&gt;&lt;a href=\"ru/api/commands.html#abort_tx\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;abort_tx&lt;/span&gt;&lt;/a&gt;abort_tx&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Прервать транзакцию.&lt;/li&gt;\n&lt;li&gt;Все активные внутренние транзакции прерываются.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор  транзакции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ping_ancestor_transactions&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Пинговать ли все родительские транзакции в процессе выполнения операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Принудительно прерывает транзакцию, даже если это может привести к потере консистентности (в случае tablet-транзакции и  &lt;a href=\"https://en.wikipedia.org/wiki/Two-phase_commit_protocol\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;двухфазного коммита&lt;/a&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"transaction_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"0-54b-1-36223d20\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"656\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-656\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-656\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-656.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"rabota-s-kiparisom\"&gt;&lt;a href=\"ru/api/commands.html#rabota-s-kiparisom\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с Кипарисом&lt;/span&gt;&lt;/a&gt;Работа с Кипарисом&lt;/h2&gt;\n&lt;p&gt;Подробную информацию про дерево метаинформации можно найти в статье &lt;a href=\"user-guide/storage/cypress.html\"&gt;Кипарис&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Все команды для работы с Кипарисом являются транзакционными.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"create\"&gt;&lt;a href=\"ru/api/commands.html#create\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;create&lt;/span&gt;&lt;/a&gt;create&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Создать узел заданного типа в Кипарисе.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до узла в Кипарисе. При настройках по умолчанию путь &lt;em&gt;не должен&lt;/em&gt; существовать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/objects.html\"&gt;Тип узла&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;recursive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Создавать ли рекурсивно промежуточные узлы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;{}&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Позволяет задать атрибуты создаваемого узла.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ignore_existing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;В случае, если заказанный узел уже существует, то он не пересоздается заново. В частности, переданные атрибуты игнорируются. Также тип существующего узла и заказываемого должны совпадать, иначе выполнение запроса завершится ошибкой.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;lock_existing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Установить на указанный узел &lt;a href=\"user-guide/storage/transactions.html#locks\"&gt;exclusive-блокировку&lt;/a&gt;, даже если он уже существует. Используется только вместе с &lt;code&gt;ignore_existing&lt;/code&gt;. Если невозможно установить блокировку, команда завершится ошибкой.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Если указанный узел уже существует, то он удаляется и на его месте создается новый. При этом существующий узел может быть любого типа. При пересоздании меняется идентификатор узла.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: идентификатор созданного узла.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Примеры:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt; ; &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"table\"&lt;/span&gt; }\nOUTPUT &lt;span class=\"hljs-string\"&gt;\"0-4-191-6c07cd58\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"838\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-838\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-838\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-838.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"user\"&lt;/span&gt; ; attributes = { name = &lt;span class=\"hljs-string\"&gt;'kulichek-robot'&lt;/span&gt; } }\nOUTPUT &lt;span class=\"hljs-string\"&gt;\"7727-417b1-1f5-d4f116ca\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"839\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-839\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-839\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-839.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/document\"&lt;/span&gt; ; &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"document\"&lt;/span&gt; ; attributes = { value = {} } }\nOUTPUT &lt;span class=\"hljs-string\"&gt;\"7727-417b1-1f5-d4f116ca\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"840\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-840\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-840\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-840.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"remove\"&gt;&lt;a href=\"ru/api/commands.html#remove\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;remove&lt;/span&gt;&lt;/a&gt;remove&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Удалить узел Кипариса.&lt;/li&gt;\n&lt;li&gt;Успешно удаляет узел, даже если из него растет непустое поддерево.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до узла в Кипарисе. Путь &lt;em&gt;должен&lt;/em&gt; существовать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;recursive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Позволяет удалить все поддерево в случае, если удаляемый узел является составным типом.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Позволяет считать команду успешно выполненной, если удаляемый узел отсутствует.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"950\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-950\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-950\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-950.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"set\"&gt;&lt;a href=\"ru/api/commands.html#set\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;set&lt;/span&gt;&lt;/a&gt;set&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Записать новое содержимое узла Кипариса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до узла в Кипарисе. Если &lt;code&gt;recursive == false&lt;/code&gt;, то путь &lt;em&gt;должен&lt;/em&gt; существовать за исключением, возможно, последнего токена.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;recursive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Создать все несуществующие промежуточные узлы пути.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Позволяет менять любые узлы Кипариса, а не только атрибуты и документы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Значение: содержимое узла;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/node\"&lt;/span&gt; }\nINPUT {\n    &lt;span class=\"hljs-string\"&gt;\"my_integer\"&lt;/span&gt; = 4 ;\n    &lt;span class=\"hljs-string\"&gt;\"my_double\"&lt;/span&gt; = 2.718281828 ;\n    &lt;span class=\"hljs-string\"&gt;\"map\"&lt;/span&gt; = { &lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt; = 1 ; &lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt; = 2 } ;\n    &lt;span class=\"hljs-string\"&gt;\"list\"&lt;/span&gt; = [ 1, 2, 3 ]\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1060\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1060\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1060\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1060.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"multiset_attributes\"&gt;&lt;a href=\"ru/api/commands.html#multiset_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;multiset_attributes&lt;/span&gt;&lt;/a&gt;multiset_attributes&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Выставить несколько атрибутов по заданному пути (если атрибуты уже существуют, они будут перезаписаны).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до атрибутов узла в Кипарисе, путь &lt;em&gt;должен&lt;/em&gt; существовать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Значение: map-узел, содержащий новые значения атрибутов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/node/@\"&lt;/span&gt; }\nINPUT {\n    &lt;span class=\"hljs-string\"&gt;\"attribute1\"&lt;/span&gt; = 4 ;\n    &lt;span class=\"hljs-string\"&gt;\"attribute2\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"attribute2 value\"&lt;/span&gt;;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1142\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1142\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1142\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1142.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"get\"&gt;&lt;a href=\"ru/api/commands.html#get\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;get&lt;/span&gt;&lt;/a&gt;get&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Немутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Получить содержимое узла Кипариса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до узла в Кипарисе. Путь &lt;em&gt;должен&lt;/em&gt; существовать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;[]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список атрибутов, которые нужно получить вместе с каждым узлом.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;max_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;missing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ограничение на количество детей, которые будут выданы в случае виртуальных составных узлов (для обычных map-узлов в настоящий момент эта опция не имеет смысла).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ignore_opaque&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Игнорировать атрибут &lt;code&gt;opaque&lt;/code&gt; при выполнении запроса (никогда не используйте эту опцию без явных рекомендаций от разработчиков YTsaurus).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: содержимое узла.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/node\"&lt;/span&gt; }\nOUTPUT {\n    &lt;span class=\"hljs-string\"&gt;\"my_integer\"&lt;/span&gt; = 4 ;\n    &lt;span class=\"hljs-string\"&gt;\"my_double\"&lt;/span&gt; = 2.718281828 ;\n    &lt;span class=\"hljs-string\"&gt;\"map\"&lt;/span&gt; = { &lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt; = 1 ; &lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt; = 2 } ;\n    &lt;span class=\"hljs-string\"&gt;\"list\"&lt;/span&gt; = [ 1, 2, 3 ]\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1266\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1266\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1266\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1266.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"list\"&gt;&lt;a href=\"ru/api/commands.html#list\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;list&lt;/span&gt;&lt;/a&gt;list&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Немутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Получить список потомков узла Кипариса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до узла в Кипарисе. Путь &lt;em&gt;должен&lt;/em&gt; существовать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;[]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список атрибутов, которые нужно получить вместе с каждым узлом.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;max_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;missing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ограничение на количество детей, которые будут выданы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Значение: список потомков узла.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/node\"&lt;/span&gt; }\nOUTPUT [\n    &lt;span class=\"hljs-string\"&gt;\"home\"&lt;/span&gt; ;\n    &lt;span class=\"hljs-string\"&gt;\"sys\"&lt;/span&gt; ;\n    &lt;span class=\"hljs-string\"&gt;\"statbox\"&lt;/span&gt; ;\n    &lt;span class=\"hljs-string\"&gt;\"tmp\"&lt;/span&gt;\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1376\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1376\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1376\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1376.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"lock\"&gt;&lt;a href=\"ru/api/commands.html#lock\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;lock&lt;/span&gt;&lt;/a&gt;lock&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Установить блокировку на узел Кипариса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до узла в Кипарисе. Путь &lt;em&gt;должен&lt;/em&gt; существовать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;mode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;exclusive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип блокировки (snapshot, shared, exclusive).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;waitable&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;В случае конфликта не завершаться ошибкой, а встать в очередь. Была ли блокировка установлена фактически, можно узнать с помощью атрибута &lt;code&gt;state&lt;/code&gt; объекта блокировки. См. &lt;a href=\"user-guide/storage/transactions.html#locking_queue\"&gt;Транзакции&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;child_key&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Ключ в словаре, по которому надо взять блокировку (только для типа &lt;code&gt;shared&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;attribute_key&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Имя атрибута, по которому надо взять блокировку (только для типа &lt;code&gt;shared&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Для данной команды необходимо указывать идентификатор транзакции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Значение: идентификатор созданной блокировки и идентификатор узла в момент ответвления.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/node\"&lt;/span&gt; }\nOUTPUT {\nOUTPUT   &lt;span class=\"hljs-string\"&gt;\"lock_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"0-1-3fe00c8-353e9ba4\"&lt;/span&gt;;\nOUTPUT   &lt;span class=\"hljs-string\"&gt;\"node_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"0-1-3fe012f-9ad48d90\"&lt;/span&gt;;\nOUTPUT }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1524\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1524\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1524\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1524.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"unlock\"&gt;&lt;a href=\"ru/api/commands.html#unlock\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;unlock&lt;/span&gt;&lt;/a&gt;unlock&lt;/h3&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Блокировки автоматически снимаются по завершении транзакции. Не следует использовать команду &lt;code&gt;unlock&lt;/code&gt; без веской необходимости. См. &lt;a href=\"user-guide/storage/transactions.html#lock_operations\"&gt;Транзакции&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Снять с узла Кипариса все блокировки для заданной транзакции.&lt;/li&gt;\n&lt;li&gt;Снимать можно только явные блокировки.&lt;/li&gt;\n&lt;li&gt;Снимаются как уже взятые, так и ожидающие в очереди блокировки.&lt;/li&gt;\n&lt;li&gt;Если узел не заблокирован, команда считается успешной.&lt;/li&gt;\n&lt;li&gt;Если заблокированная версия узла содержит изменения в сравнении с оригинальной, разблокировка завершается ошибкой.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до узла в Кипарисе. Путь &lt;em&gt;должен&lt;/em&gt; существовать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Для данной команды необходимо указывать идентификатор транзакции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/node\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1641\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1641\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1641\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1641.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"copy\"&gt;&lt;a href=\"ru/api/commands.html#copy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;copy&lt;/span&gt;&lt;/a&gt;copy&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Скопировать узел Кипариса по новому адресу.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;source_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до исходного узла в Кипарисе; путь &lt;em&gt;должен&lt;/em&gt; существовать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;destination_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь, по которому будет создана копия; путь &lt;em&gt;не должен&lt;/em&gt; существовать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;recursive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Создавать ли пропущенные уровни (map-узлы) по пути назначения.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ignore_existing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Если узел по пути &lt;code&gt;destination_path&lt;/code&gt; уже существует, ничего не делать (нельзя указывать одновременно с &lt;code&gt;force = %true&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;lock_existing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Установить на узел по пути &lt;code&gt;destination_path&lt;/code&gt; &lt;a href=\"user-guide/storage/transactions.html#locks\"&gt;exclusive-блокировку&lt;/a&gt;, даже если он уже существует. Используется только вместе с &lt;code&gt;ignore_existing&lt;/code&gt;. В случае невозможности установить блокировку команда завершится ошибкой.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Разрешает указывать в качестве пути назначения уже существующий узел, который должен быть заменен.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;preserve_account&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Сохранять ли аккаунты исходных узлов или использовать аккаунт пути назначения.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;preserve_expiration_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Копировать ли атрибут &lt;a href=\"user-guide/storage/cypress.html#TTL\"&gt;&lt;code&gt;expiration_time&lt;/code&gt;&lt;/a&gt; или оставлять его пустым.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;preserve_expiration_timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Копировать ли атрибут &lt;a href=\"user-guide/storage/cypress.html#TTL\"&gt;&lt;code&gt;expiration_timeout&lt;/code&gt;&lt;/a&gt; или оставлять его пустым.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: идентификатор созданного узла.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"source_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/from\"&lt;/span&gt; ;\n    &lt;span class=\"hljs-string\"&gt;\"destination_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/to\"&lt;/span&gt; ;\n}\nOUTPUT &lt;span class=\"hljs-string\"&gt;\"0-4-191-6c07cd58\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1835\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1835\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1835\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1835.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"move\"&gt;&lt;a href=\"ru/api/commands.html#move\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;move&lt;/span&gt;&lt;/a&gt;move&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Перенести узел Кипариса по новому адресу.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;source_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до исходного узла в Кипарисе. Путь &lt;em&gt;должен&lt;/em&gt; существовать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;destination_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Новый путь в Кипарисе; путь &lt;em&gt;не должен&lt;/em&gt; существовать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;recursive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Создавать ли пропущенные уровни (map-узлы) по пути назначения.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Разрешает указывать в качестве пути назначения уже существующий узел, который должен быть заменен.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;preserve_account&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Сохранять ли аккаунты исходных узлов или использовать аккаунт пути назначения.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;preserve_expiration_timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Копировать ли атрибут &lt;a href=\"user-guide/storage/cypress.html#TTL\"&gt;&lt;code&gt;expiration_timeout&lt;/code&gt;&lt;/a&gt; или оставлять его пустым.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"source_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/from\"&lt;/span&gt; ;\n    &lt;span class=\"hljs-string\"&gt;\"destination_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/to\"&lt;/span&gt; ;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1982\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1982\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1982\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1982.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"link\"&gt;&lt;a href=\"ru/api/commands.html#link\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;link&lt;/span&gt;&lt;/a&gt;link&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Создать символическую ссылку на объект по новому адресу.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;link_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь, по которому будет создана ссылка; путь &lt;em&gt;не должен&lt;/em&gt; существовать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;target_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до исходного узла в Кипарисе; путь &lt;em&gt;должен&lt;/em&gt; существовать&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;missing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Атрибуты узла, созданного в результате выполнения команды.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;recursive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Создавать ли рекурсивно промежуточные узлы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ignore_existing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Позволяет не падать с ошибкой, если указанный узел уже существует и является ссылкой. Вызов вернёт ошибку если узел существует, но ссылкой не является.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;lock_existing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Установить на узел исключительную блокировку, даже если он уже существует. Используется только вместе с параметром &lt;code&gt;ignore_existing&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Пересоздать ссылку, если путь, по которому будет создана ссылка, уже существует.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: идентификатор созданного узла.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"target_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/from\"&lt;/span&gt; ;\n    &lt;span class=\"hljs-string\"&gt;\"link_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/to\"&lt;/span&gt; ;\n}\nOUTPUT &lt;span class=\"hljs-string\"&gt;\"0-4-191-6c07cd58\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2148\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2148\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2148\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2148.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"exists\"&gt;&lt;a href=\"ru/api/commands.html#exists\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;exists&lt;/span&gt;&lt;/a&gt;exists&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Немутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Проверяет существование узла.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до исходного узла в Кипарисе.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: строка &lt;code&gt;true&lt;/code&gt; или &lt;code&gt;false&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/my_table/@_format\"&lt;/span&gt; ;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2230\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2230\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2230\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2230.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"concatenate\"&gt;&lt;a href=\"ru/api/commands.html#concatenate\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;concatenate&lt;/span&gt;&lt;/a&gt;concatenate&lt;/h3&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Склеить набор файлов или таблиц (в том порядке, в котором указаны пути).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;em&gt;null-transaction-id&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор текущей транзакции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ping_ancestor_transactions&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Пинговать ли все родительские транзакции в процессе выполнения операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;source_paths&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Список путей до входных файлов или таблиц в Кипарисе; пути &lt;em&gt;должны&lt;/em&gt; существовать и все являться либо файлами, либо таблицами.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;destination_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до файла или таблицы в Кипарисе; путь &lt;em&gt;должен&lt;/em&gt; существовать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"source_paths\"&lt;/span&gt; = [&lt;span class=\"hljs-string\"&gt;\"//tmp/file1\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"//tmp/file2\"&lt;/span&gt;];\n    &lt;span class=\"hljs-string\"&gt;\"destination_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/file\"&lt;/span&gt;;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2346\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2346\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2346\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2346.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"access-control\"&gt;&lt;a href=\"ru/api/commands.html#access-control\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с контролем доступа&lt;/span&gt;&lt;/a&gt;Работа с контролем доступа&lt;/h2&gt;\n&lt;p&gt;Подробную информацию про права доступа можно найти в разделе &lt;a href=\"user-guide/storage/access-control.html\"&gt;Контроль доступа&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данный набор команд не является транзакционным.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"add_member\"&gt;&lt;a href=\"ru/api/commands.html#add_member\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;add_member&lt;/span&gt;&lt;/a&gt;add_member&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Добавить пользователя или другую группу в группу.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;member&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Имя пользователя или группы, которую необходимо добавить в группу.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;group&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Имя группы, в которую необходимо добавить.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"group\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"admins\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"member\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"devs\"&lt;/span&gt;;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2453\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n
