t;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до таблицы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;first_tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Номер первого решардируемого таблета.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;last_tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tablet_count - 1&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Номер последнего решардируемого таблета.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;pivot_keys&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Граничные ключи для новых таблетов (в случае сортированной таблицы).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;tablet_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Количество новых таблетов.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;uniform&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Равномерно решардировать по целочисленной ключевой колонке.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;enable_slicing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Использовать семплирование для повышения гранулярности (более точного разделения на таблеты) при автоматическом выборе pivot-ключей. Полезно, если одному ключу соответствует большое число записей, а другому малое.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;slicing_accuracy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0.05&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Допустимая погрешность при равномерном решардировании на заданное число таблетов.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//home/user/table\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"schema\"&lt;/span&gt; = [{&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;; &lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"int64\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"sort_order\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"ascending\"&lt;/span&gt;}; {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;; &lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"string\"&lt;/span&gt;}]; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"5105\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-5105\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-5105\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-5105.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"reshard_table_automatic\"&gt;&lt;a href=\"ru/api/commands.html#reshard_table_automatic\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;reshard_table_automatic&lt;/span&gt;&lt;/a&gt;reshard_table_automatic&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Применимость: &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html\"&gt;Сортированные&lt;/a&gt; динамические таблицы.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Форсированно запускает итерацию &lt;a href=\"user-guide/dynamic-tables/resharding.html\"&gt;фонового балансировщика таблетов&lt;/a&gt;, т.е. решардирует таблеты, выходящие за границы &lt;code&gt;min_tablet_size&lt;/code&gt;–&lt;code&gt;max_tablet_size&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;В отличие от &lt;code&gt;reshard_table&lt;/code&gt;, работает с примонтированными таблицами. В процессе работы может отмонтировать таблеты;&lt;/li&gt;\n&lt;li&gt;По умолчанию запускается асинхронно, но при указании параметра &lt;code&gt;keep_actions&lt;/code&gt; возвращает список идентификаторов, по которым можно отслеживать прогресс. Большинство API делают это автоматически при передаче флага &lt;code&gt;sync=True&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Команда не поддерживает реплицированные таблицы (допустимо использование независимо на отдельных репликах).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до таблицы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;keep_actions&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Если задано &lt;code&gt;true&lt;/code&gt;, вернуть в ответ список идентификаторов для отслеживания прогресса.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Значение: список &lt;code&gt;tablet_action_id&lt;/code&gt;, если &lt;code&gt;keep_actions=True&lt;/code&gt;. Иначе пустой список.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//home/user/table\"&lt;/span&gt;; }\nOUTPUT [\n    &lt;span class=\"hljs-string\"&gt;\"11-22-33-44\"&lt;/span&gt;;\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"5219\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-5219\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-5219\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-5219.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"alter_table\"&gt;&lt;a href=\"ru/api/commands.html#alter_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;alter_table&lt;/span&gt;&lt;/a&gt;alter_table&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Применимость: &lt;a href=\"user-guide/storage/static-tables.html\"&gt;Статические&lt;/a&gt; и &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;динамические таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Выполняет изменение схемы и других настроек таблицы (как статической, так и динамической);&lt;/li&gt;\n&lt;li&gt;Через &lt;code&gt;alter_table&lt;/code&gt; обычно меняются настройки, которые требуют комплексной совместной валидации. Через атрибуты меняются настройки, имеющие рекомендательный смысл и влияющие только на новые данные;&lt;/li&gt;\n&lt;li&gt;При изменении схемы происходят &lt;a href=\"user-guide/storage/static-schema.html\"&gt;разнообразные проверки корректности&lt;/a&gt;, т.к. система должна быть уверена, что существующие данные соответствуют схеме;&lt;/li&gt;\n&lt;li&gt;Статическую таблицу можно сделать динамической, но не наоборот;&lt;/li&gt;\n&lt;li&gt;Изменение схемы динамической таблицы, а также &lt;code&gt;upstream_replica_id&lt;/code&gt; возможно, лишь если таблица отмонтирована.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь до таблицы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;schema&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Если указано, то устанавливает для таблицы новую схему.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;dynamic&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Если указано, то изменяет динамичность таблицы. Изменение данной настройки возможно только вне транзакции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;upstream_replica_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Если указано, то изменяет идентификатор объекта-реплики на метакластере. Подробнее можно прочесть в разделе &lt;a href=\"user-guide/dynamic-tables/replicated-dynamic-tables.html\"&gt;Реплицированные&lt;/a&gt; динамические таблицы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//home/user/table\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"schema\"&lt;/span&gt; = [{&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;; &lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"int64\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"sort_order\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"ascending\"&lt;/span&gt;}; {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;; &lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"string\"&lt;/span&gt;}]; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"5361\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-5361\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-5361\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-5361.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"alter_table_replica\"&gt;&lt;a href=\"ru/api/commands.html#alter_table_replica\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;alter_table_replica&lt;/span&gt;&lt;/a&gt;alter_table_replica&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Применимость: &lt;a href=\"user-guide/dynamic-tables/replicated-dynamic-tables.html\"&gt;Реплицированные&lt;/a&gt; динамические таблицы.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Изменяет свойства реплики: включает/выключает её или меняет её режим.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;replica_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор реплики.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;enabled&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;не меняет включённость реплики&lt;/td&gt;\n&lt;td&gt;Если выставлено &lt;code&gt;true&lt;/code&gt;, включает таблицу. Если выставлено &lt;code&gt;false&lt;/code&gt;, выключает.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;mode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;не меняет режим реплики&lt;/td&gt;\n&lt;td&gt;Меняет режим реплики &lt;code&gt;sync&lt;/code&gt; / &lt;code&gt;async&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"replica_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"730e-8611b-3ff02c5-f647333f\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"enabled\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"5469\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-5469\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-5469\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-5469.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"get_table_columnar_statistics\"&gt;&lt;a href=\"ru/api/commands.html#get_table_columnar_statistics\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;get_table_columnar_statistics&lt;/span&gt;&lt;/a&gt;get_table_columnar_statistics&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Немутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Применимость: &lt;a href=\"user-guide/storage/static-tables.html\"&gt;Статические&lt;/a&gt; и &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;динамические&lt;/a&gt; таблицы.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Получить статистику по набору колонок в заданном наборе таблиц (взятых полностью или частично, по диапазонам);&lt;/li&gt;\n&lt;li&gt;Статистика включает в себя:\n&lt;ul&gt;\n&lt;li&gt;Суммарный &lt;code&gt;data_weight&lt;/code&gt; данных из каждой заказанной колонки;&lt;/li&gt;\n&lt;li&gt;Суммарный &lt;code&gt;data_weight&lt;/code&gt; всех старых чанков (в которые не была сохранена метаинформация про каждую колонку, так как чанк формировался до поддержания поколоночных статистик);&lt;/li&gt;\n&lt;li&gt;Суммарный вес всех временных меток строк в случае динамической таблицы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;В путях обязательно должны быть указаны &lt;code&gt;column selectors&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Команда может быть выполнена внутри транзакции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;paths&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Список путей до таблиц в Кипарисе; таблицы &lt;em&gt;должны&lt;/em&gt; существовать; на путях &lt;em&gt;должны&lt;/em&gt; быть указаны &lt;code&gt;column selectors&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: поколоночные статистики для заказанных колонок.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"paths\"&lt;/span&gt; = [&lt;span class=\"hljs-string\"&gt;\"//tmp/table1{a,b,c}\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"//tmp/table2{a,b,c}\"&lt;/span&gt;];\n    &lt;span class=\"hljs-string\"&gt;\"transaction_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"1234-abcd-abcd-7890\"&lt;/span&gt;\n}\nOUTPUT {\n    &lt;span class=\"hljs-string\"&gt;\"column_data_weights\"&lt;/span&gt; = {\n        &lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt; = 8124;\n        &lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt; = 124241241;\n        &lt;span class=\"hljs-string\"&gt;\"c\"&lt;/span&gt; = 3121414;\n    };\n    &lt;span class=\"hljs-string\"&gt;\"legacy_chunks_data_weight\"&lt;/span&gt; = 100242;\n    &lt;span class=\"hljs-string\"&gt;\"timestamp_total_weight\"&lt;/span&gt; = 50056;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"5586\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-5586\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-5586\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-5586.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"zapusk-operacij\"&gt;&lt;a href=\"ru/api/commands.html#zapusk-operacij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск операций&lt;/span&gt;&lt;/a&gt;Запуск операций&lt;/h2&gt;\n&lt;p&gt;Подробную информацию про запуск операций обработки данных можно найти в разделе &lt;a href=\"user-guide/data-processing/operations/overview.html\"&gt;Обработка данных&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Все операции выполняются асинхронно, указанные команды лишь запускают их. Чтобы узнать, закончилась операция или нет, запросите &lt;a href=\"user-guide/data-processing/operations/overview.html#status\"&gt;статус операции&lt;/a&gt; командой &lt;code&gt;get_operation&lt;/code&gt;.&lt;br /&gt;\nТакже все команды для работы с операциями являются транзакционными. Это означает, что вся работа с таблицами в пределах операции будет делаться в рамках указанной транзакции при запуске операции.  Узел отвечающей операции (&lt;code&gt;//sys/operations/&amp;lt;OP_ID&amp;gt;&lt;/code&gt;) обновляется &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;планировщиком&lt;/a&gt; вне любых транзакций.&lt;/p&gt;\n&lt;h3 id=\"start_operation\"&gt;&lt;a href=\"ru/api/commands.html#start_operation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;start_operation&lt;/span&gt;&lt;/a&gt;start_operation&lt;/h3&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В HTTP API данная операция поддерживается начиная с версии v4. В более ранних версиях API для запуска операций используются одноименные команды — &lt;code&gt;map&lt;/code&gt;, &lt;code&gt;reduce&lt;/code&gt;, &lt;code&gt;sort&lt;/code&gt; и так далее.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Запустить операцию указанного типа.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Тип операции (один из &lt;code&gt;map&lt;/code&gt;, &lt;code&gt;reduce&lt;/code&gt;, &lt;code&gt;map_reduce&lt;/code&gt;, &lt;code&gt;remote-copy&lt;/code&gt;, &lt;code&gt;erase&lt;/code&gt;, &lt;code&gt;sort&lt;/code&gt;, &lt;code&gt;merge&lt;/code&gt;, &lt;code&gt;vanilla&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Спецификация операции. Подробнее в разделе &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Настройка операций&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: идентификатор запущенной операции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {  &lt;span class=\"hljs-string\"&gt;\"operation_type\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"map_reduce\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"spec\"&lt;/span&gt; = {\n        &lt;span class=\"hljs-string\"&gt;\"input_table_paths\"&lt;/span&gt; = [ &lt;span class=\"hljs-string\"&gt;\"//tmp/table_in\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/table_in\"&lt;/span&gt; ] ;\n        &lt;span class=\"hljs-string\"&gt;\"output_table_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/table_out\"&lt;/span&gt;\n    }\n}\nOUTPUT &lt;span class=\"hljs-string\"&gt;\"37878b-ba919c15-cdc97f3a-8a983ece\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"5701\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-5701\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-5701\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-5701.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"merge\"&gt;&lt;a href=\"ru/api/commands.html#merge\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;merge&lt;/span&gt;&lt;/a&gt;merge&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Запустить слияние исходных таблиц;&lt;/li&gt;\n&lt;li&gt;Подробное описание всех &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;параметров спецификации&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Спецификация операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;spec[input_table_paths]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Список входных таблиц.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;spec[output_table_path]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Выходная таблица.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;spec[mode]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;unordered&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Режим слияния ( &lt;code&gt;unordered&lt;/code&gt;, &lt;code&gt;ordered&lt;/code&gt;, &lt;code&gt;sorted&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: идентификатор запущенной операции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"spec\"&lt;/span&gt; = {\n        &lt;span class=\"hljs-string\"&gt;\"input_table_paths\"&lt;/span&gt; = [ &lt;span class=\"hljs-string\"&gt;\"//tmp/table_in\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/table_in\"&lt;/span&gt; ] ;\n        &lt;span class=\"hljs-string\"&gt;\"output_table_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/table_out\"&lt;/span&gt;\n    }\n}\nOUTPUT &lt;span class=\"hljs-string\"&gt;\"37878b-ba919c15-cdc97f3a-8a983ece\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"5830\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-5830\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-5830\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-5830.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"erase\"&gt;&lt;a href=\"ru/api/commands.html#erase\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;erase&lt;/span&gt;&lt;/a&gt;erase&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Запустить удаление данных из исходной таблицы;&lt;/li&gt;\n&lt;li&gt;Подробное описание всех &lt;a href=\"user-guide/data-processing/operations/erase.html\"&gt;параметров спецификации&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Спецификация операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;spec[table_path]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Входная таблица с указанным селектором по строкам, она же будет выходной.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: идентификатор запущенной операции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"spec\"&lt;/span&gt; = {\n        &lt;span class=\"hljs-string\"&gt;\"table_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/table[#0:#500]\"&lt;/span&gt; ;\n    }\n}\nOUTPUT &lt;span class=\"hljs-string\"&gt;\"3f9e62-ce8d2965-6350842b-3e4628d2\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"5931\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-5931\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-5931\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-5931.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"map\"&gt;&lt;a href=\"ru/api/commands.html#map\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;map&lt;/span&gt;&lt;/a&gt;map&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Запустить map поверх исходных таблиц с записью в выходные таблицы;&lt;/li&gt;\n&lt;li&gt;Подробное описание всех &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;параметров спецификации&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Спецификация операции (см. ниже релевантные поля).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;spec[input_table_paths]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Список входных таблиц.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;spec[output_table_paths]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Список выходных таблиц.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;spec[mapper][command]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Команда запуска маппера.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table &gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Список выходных таблиц.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;spec[mapper][command]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Команда запуска маппера.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;spec[sort_by]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Непустой набор имен колонок по которым будут отсортированы данные для редьюсеров.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;spec[reduce_by]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Колонки, по которым выполняется reduce.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;spec[reducer][command]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Команда запуска reducer.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: идентификатор запущенной операции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"spec\"&lt;/span&gt; = {\n      &lt;span class=\"hljs-string\"&gt;\"mapper\"&lt;/span&gt; = {\n          &lt;span class=\"hljs-string\"&gt;\"command\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"cat\"&lt;/span&gt;\n      } ;\n      &lt;span class=\"hljs-string\"&gt;\"reducer\"&lt;/span&gt; = {\n          &lt;span class=\"hljs-string\"&gt;\"command\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"cat\"&lt;/span&gt;\n      } ;\n      &lt;span class=\"hljs-string\"&gt;\"input_table_paths\"&lt;/span&gt; = [ &lt;span class=\"hljs-string\"&gt;\"//tmp/table_in\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/table_in\"&lt;/span&gt; ] ;\n      &lt;span class=\"hljs-string\"&gt;\"output_table_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/table_out\"&lt;/span&gt; ;\n      &lt;span class=\"hljs-string\"&gt;\"reduce_by\"&lt;/span&gt; = [ &lt;span class=\"hljs-string\"&gt;\"my_key\"&lt;/span&gt; ] ;\n    }\n}\nOUTPUT &lt;span class=\"hljs-string\"&gt;\"37878b-ba919c15-cdc97f3a-8a983ece\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6503\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6503\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6503\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6503.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"remote-copy\"&gt;&lt;a href=\"ru/api/commands.html#remote-copy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;remote-copy&lt;/span&gt;&lt;/a&gt;remote-copy&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Скопировать исходные таблицы c указанного кластера;&lt;/li&gt;\n&lt;li&gt;Подробное описание всех &lt;a href=\"user-guide/data-processing/operations/remote-copy.html\"&gt;параметров спецификации&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Спецификация операции (см. ниже релевантные поля).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;spec[input_table_paths]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Список входных таблиц.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;spec[output_table_paths]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Список выходных таблиц.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;spec[cluster_name]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Кластер с исходными таблицами.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: идентификатор запущенной операции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"spec\"&lt;/span&gt; = {\n      &lt;span class=\"hljs-string\"&gt;\"input_table_paths\"&lt;/span&gt; = [ &lt;span class=\"hljs-string\"&gt;\"//tmp/table_in\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/table_in\"&lt;/span&gt; ] ;\n      &lt;span class=\"hljs-string\"&gt;\"output_table_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/table_out\"&lt;/span&gt; ;\n      &lt;span class=\"hljs-string\"&gt;\"cluster_name\"&lt;/span&gt; = &amp;lt;cluster-name&amp;gt;;\n    }\n}\nOUTPUT &lt;span class=\"hljs-string\"&gt;\"37878b-ba919c15-cdc97f3a-8a983ece\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6632\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6632\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6632\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6632.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"rabota-s-operaciyami\"&gt;&lt;a href=\"ru/api/commands.html#rabota-s-operaciyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с операциями&lt;/span&gt;&lt;/a&gt;Работа с операциями&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Все команды для работы с операциями  не являются &lt;a href=\"ru/api/commands.html#transactions\"&gt;транзакционными&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В таблице описан тип &lt;code&gt;TOperation&lt;/code&gt;, который содержит информацию об операции, возвращаемую командами &lt;code&gt;get_operation&lt;/code&gt; и &lt;code&gt;list_operations&lt;/code&gt;:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Поле&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Строковое представление id операции (например, &lt;code&gt;d840bb39-3d893e5b-3fe03e8-f009b1fb&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип операции (например, &lt;code&gt;map&lt;/code&gt;, &lt;code&gt;reduce&lt;/code&gt;, &lt;code&gt;map_reduce&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;state&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Текущее состояние операции (например, &lt;code&gt;completed&lt;/code&gt;, &lt;code&gt;running&lt;/code&gt;,&lt;code&gt;failed&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;authenticated_user&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Пользователь, запустивший операцию.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;start_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ISO 8601 string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время начала.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;finish_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ISO 8601 string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время окончания (если операция завершилась).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;brief_progress&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Краткие статистики по джобам.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;progress&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Полные статистики по джобам.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;brief_spec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Часть спецификации с лёгкими полями.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;provided_spec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Спецификация, указанная пользователем при старте операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;full_spec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Спецификация, в которой все не указанные пользователем поля заполнены значениями по умолчанию.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;unrecognized_spec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Поля спецификации, указанные пользователем, но не распознанные планировщиком.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;experiment_assignment_names&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список имен экспериментов, примененных к операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;experiment_assignments&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список описаний экспериментов, примененных к операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Спецификация, указанная пользователем при старте операции, после применения к ней экспериментов.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;controller_agent_address&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Адрес контроллер-агента (хост:порт), который отвечает за операцию.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;events&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&amp;lt;map&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список событий изменения состояния, произошедших с операцией.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;alerts&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&amp;lt;string, map&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Алёрты, выставленные на операции в данный момент.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;alert_events&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&amp;lt;map&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список событий появления или прекращения алерта, произошедших с операцией.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;result&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Map с полем &lt;code&gt;error&lt;/code&gt;, в котором может содержаться ошибка в случае упавшей операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;committed&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Закоммичены ли результаты операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;suspended&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Приостановлена ли операция в данный момент.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;scheduling_attributes_per_pool_tree&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&amp;lt;string, map&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Словарь с различной информацией про ход операции в различных деревьях.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;task_names&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список имен тасков, из которых состоит операция.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;controller_features&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Набор количественных характеристик, с помощью которых можно анализировать эксперименты, проводимые с операциями.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"list_operations\"&gt;&lt;a href=\"ru/api/commands.html#list_operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;list_operations&lt;/span&gt;&lt;/a&gt;list_operations&lt;/h3&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данная команда может создавать значительную нагрузку на кластер, не используйте её в процессах без согласования с администратором.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Свойства команды: &lt;strong&gt;Немутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Получить список операций, удовлетворяющих фильтрам.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список атрибутов операций, которые вернутся в ответе.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ISO 8601 string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ограничение снизу на диапазон времени для выбора операций (по времени начала операции).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;to_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ISO 8601 string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ограничение сверху на диапазон времени для выбора операций (по времени начала операции).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;cursor_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ISO 8601 string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время, начиная с которого требуется вернуть список операций.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;cursor_direction&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;{past, future}&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;past&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Направление перечисления операций по времени.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя пользователя для фильтрации.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;state&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Состояние операции для фильтрации.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип операции для фильтрации.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;filter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Подстрока, которая должна присутствовать в &lt;code&gt;filter_factors&lt;/code&gt;. &lt;code&gt;filter_factors&lt;/code&gt; – это конкатенация различных атрибутов операции: &lt;code&gt;id&lt;/code&gt;, &lt;code&gt;type&lt;/code&gt;, &lt;code&gt;authenticated_user&lt;/code&gt;, &lt;code&gt;state&lt;/code&gt;, &lt;code&gt;input_table_paths&lt;/code&gt;, &lt;code&gt;output_table_paths&lt;/code&gt;, &lt;code&gt;experiments&lt;/code&gt;, &lt;code&gt;annotations&lt;/code&gt;, &lt;code&gt;runtime_parameters&lt;/code&gt;, &lt;code&gt;pool&lt;/code&gt;, &lt;code&gt;title&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;pool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Пул для фильтрации.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;pool_tree&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Дерево пулов для фильтрации.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;with_failed_jobs&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Возвращать только операции, у которых есть джобы со статусом &lt;code&gt;failed&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;access&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Словарь с обязательными полями &lt;code&gt;subject&lt;/code&gt; (строка) и &lt;code&gt;permissions&lt;/code&gt; (список строк), задающий фильтр по правам доступа. Если указан, возвращаются только операции, к которым субъект &lt;code&gt;subject&lt;/code&gt; имеет каждое из прав в списке &lt;code&gt;permissions&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;include_archive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Запрашивать ли операции из архива.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;include_counters&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Возвращать ли статистику по запрошенным операциям.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;100&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Количество операций, которые необходимо вернуть в ответе.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operations&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&amp;lt;TOperation&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список операций.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;incomplete&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Является ли список операций полным, то есть перечислены ли все операции в диапазоне &lt;code&gt;from_time&lt;/code&gt; — &lt;code&gt;to_time&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type_counts&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&amp;lt;string, int&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Словарь, содержащий количество операций различного типа, подходящих под все указанные фильтры (кроме фильтра по типу).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;state_counts&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&amp;lt;string, int&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Словарь, содержащий количество операций в различных состояниях, подходящих под все указанные фильтры (кроме фильтра по состоянию).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type_counts&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&amp;lt;string, int&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Словарь, содержащий количество операций различного типа, подходящих под все указанные фильтры (кроме фильтра по типу).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;pool_counts&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&amp;lt;string, int&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Словарь, содержащий количество операций в различных пулах, подходящих под все указанные фильтры (кроме фильтра по пулу).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;pool_tree_counts&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&amp;lt;string, int&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Словарь, содержащий количество операций в различных деревьях пулов, подходящих под все указанные фильтры (кроме фильтра по дереву пулов).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;failed_job_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Количество джобов, завершившихся неуспешно (состояние &lt;code&gt;failed&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { }\nOUTPUT {\n      &lt;span class=\"hljs-string\"&gt;\"operations\"&lt;/span&gt; = [\n          {\n              &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"7001208d-fef089b3-3fe03e8-453d99a1\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"remote-copy\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"state\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"initializing\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"authenticated_user\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"user-name\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"brief_progress\"&lt;/span&gt; = {};\n              &lt;span class=\"hljs-string\"&gt;\"brief_spec\"&lt;/span&gt; = {\n                  ...\n              };\n              &lt;span class=\"hljs-string\"&gt;\"start_time\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"2018-02-06T11:06:34.200591Z\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"suspended\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"weight\"&lt;/span&gt; = 1.;\n          };\n      ];\n      &lt;span class=\"hljs-string\"&gt;\"incomplete\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n      &lt;span class=\"hljs-string\"&gt;\"pool_counts\"&lt;/span&gt; = {\n          &lt;span class=\"hljs-string\"&gt;\"pool-counts-example\"&lt;/span&gt; = 2;\n          &lt;span class=\"hljs-string\"&gt;\"user-name-1\"&lt;/span&gt; = 2;\n          ...\n      };\n      &lt;span class=\"hljs-string\"&gt;\"user_counts\"&lt;/span&gt; = {\n          &lt;span class=\"hljs-string\"&gt;\"yql\"&lt;/span&gt; = 52;\n          &lt;span class=\"hljs-string\"&gt;\"user-name-1\"&lt;/span&gt; = 2;\n      };\n      &lt;span class=\"hljs-string\"&gt;\"state_counts\"&lt;/span&gt; = {\n          &lt;span class=\"hljs-string\"&gt;\"materializing\"&lt;/span&gt; = 10;\n          &lt;span class=\"hljs-string\"&gt;\"pending\"&lt;/span&gt; = 763;\n          &lt;span class=\"hljs-string\"&gt;\"running\"&lt;/span&gt; = 1848;\n          &lt;span class=\"hljs-string\"&gt;\"completed\"&lt;/span&gt; = 6654;\n          &lt;span class=\"hljs-string\"&gt;\"aborted\"&lt;/span&gt; = 37;\n          &lt;span class=\"hljs-string\"&gt;\"failed\"&lt;/span&gt; = 98;\n      };\n      &lt;span class=\"hljs-string\"&gt;\"type_counts\"&lt;/span&gt; = {\n          &lt;span class=\"hljs-string\"&gt;\"map\"&lt;/span&gt; = 4294;\n          &lt;span class=\"hljs-string\"&gt;\"merge\"&lt;/span&gt; = 1337;\n          &lt;span class=\"hljs-string\"&gt;\"erase\"&lt;/span&gt; = 97;\n          &lt;span class=\"hljs-string\"&gt;\"sort\"&lt;/span&gt; = 1126;\n          &lt;span class=\"hljs-string\"&gt;\"reduce\"&lt;/span&gt; = 886;\n          &lt;span class=\"hljs-string\"&gt;\"map_reduce\"&lt;/span&gt; = 1609;\n          &lt;span class=\"hljs-string\"&gt;\"remote-copy\"&lt;/span&gt; = 24;\n      };\n      &lt;span class=\"hljs-string\"&gt;\"failed_jobs_count\"&lt;/span&gt; = 109;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"7393\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-7393\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-7393\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-7393.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"get_operation\"&gt;&lt;a href=\"ru/api/commands.html#get_operation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;get_operation&lt;/span&gt;&lt;/a&gt;get_operation&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Немутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Получить информацию об операции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;GUID&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;[]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Атрибуты операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Описание операции (&lt;code&gt;TOperation&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {  &lt;span class=\"hljs-string\"&gt;\"operation_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"33ab3f-bf1df917-b35fe9ed-c70a4bf4\"&lt;/span&gt;; attributes = [ &lt;span class=\"hljs-string\"&gt;\"state\"&lt;/span&gt; ] }\nOUTPUT {\n    &lt;span class=\"hljs-string\"&gt;\"state\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"running\"&lt;/span&gt;;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"7498\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-7498\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-7498\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-7498.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"list_operation_events\"&gt;&lt;a href=\"ru/api/commands.html#list_operation_events\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;list_operation_events&lt;/span&gt;&lt;/a&gt;list_operation_events&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Немутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Получить события операции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;GUID&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;event_type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип события. В случае пустого значения возращает события всех типов.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;list&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Список событий операции &lt;code&gt;TOperationEvent&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;code&gt;TOperationEvent&lt;/code&gt; — структура, содержащая информацию о событии операции. Поддерживаются следующие типы событий:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;incarnation_started&lt;/code&gt; - начало новой инкарнации у gang операции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Следующие поля присутствуют у всех событий, независимо от их типа:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Поле&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th& lass=\"hljs-string\"&gt;\"33ab3f-bf1df917-b35fe9ed-c70a4bf4\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"7893\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-7893\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-7893\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-7893.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"suspend_operation\"&gt;&lt;a href=\"ru/api/commands.html#suspend_operation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;suspend_operation&lt;/span&gt;&lt;/a&gt;suspend_operation&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Приостановить выполнение операции;&lt;/li&gt;\n&lt;li&gt;Выполняется мгновенно, после этого перестают запускаться новые джобы операции, а также опционально прерываются уже запущенные джобы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&l
