 fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"resume_operation\"&gt;&lt;a href=\"ru/api/commands.html#resume_operation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;resume_operation&lt;/span&gt;&lt;/a&gt;resume_operation&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Продолжить выполнение приостановленной операции;&lt;/li&gt;\n&lt;li&gt;Выполняется мгновенно.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"operation_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"33ab3f-bf1df917-b35fe9ed-c70a4bf4\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"8071\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-8071\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-8071\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-8071.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"update_operation_parameters\"&gt;&lt;a href=\"ru/api/commands.html#update_operation_parameters\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;update_operation_parameters&lt;/span&gt;&lt;/a&gt;update_operation_parameters&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Обновить параметры запущенной операции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parameters&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Словарь с параметрами операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;parameters[owners]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;(deprecated, будет удалено) Список новых владельцев операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;parameters[acl]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Новый ACL операции (накладывается на base ACL).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;parameters[pool]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Имя пула, на который надо переключить операцию во всех её деревьях.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;parameters[weight]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Новый вес операции во всех деревьях.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;parameters[scheduling_options_per_pool_tree]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Словарь &lt;code&gt;{имя дерева: настройки планировщика для данного дерева}&lt;/code&gt;. Описание настроек ниже. Подробнее про планировщик можно прочесть в разделе &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;Планировщик и пулы&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;em&gt;parameters[options_per_job_shell]&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Словарь &lt;code&gt;{имя Job Shell: настройки для данного Job Shell}&lt;/code&gt;. Описание настроек ниже.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Настройки планировщика для дерева:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;weight&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Вес операции в дереве.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;pool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Пул операции в дереве.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;resource_limits&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Словарь &lt;code&gt;{имя ресурса: лимит}&lt;/code&gt;. Лимиты ресурсов в дереве.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Настройки Job Shell:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;owners&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Субъекты (пользователи или группы), которым будет разрешен доступ до Job Shell.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {&lt;span class=\"hljs-string\"&gt;\"operation_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"33ab3f-bf1df917-b35fe9ed-c70a4bf4\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"parameters\"&lt;/span&gt; = {&lt;span class=\"hljs-string\"&gt;\"pool\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"username\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"scheduling_options_per_pool_tree\"&lt;/span&gt; = {&lt;span class=\"hljs-string\"&gt;\"default\"&lt;/span&gt; = {&lt;span class=\"hljs-string\"&gt;\"weight\"&lt;/span&gt; = 2; &lt;span class=\"hljs-string\"&gt;\"resource_limits\"&lt;/span&gt; = { &lt;span class=\"hljs-string\"&gt;\"user_slots\"&lt;/span&gt; = 1; &lt;span class=\"hljs-string\"&gt;\"cpu\"&lt;/span&gt; = 0.5; &lt;span class=\"hljs-string\"&gt;\"network\"&lt;/span&gt; = 10; &lt;span class=\"hljs-string\"&gt;\"memory\"&lt;/span&gt; = 1000000000}}}}}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"8348\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-8348\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-8348\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-8348.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"rabota-s-dzhobami\"&gt;&lt;a href=\"ru/api/commands.html#rabota-s-dzhobami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с джобами&lt;/span&gt;&lt;/a&gt;Работа с джобами&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Все команды для работы с джобами не являются &lt;a href=\"ru/api/commands.html#transactions\"&gt;транзакционными&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В таблице описан тип &lt;code&gt;TJob&lt;/code&gt;, который содержит информацию о джобе, возвращаемую командами &lt;code&gt;get_job&lt;/code&gt; и &lt;code&gt;list_jobs&lt;/code&gt;:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Поле&lt;/th&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_id&lt;/code&gt;/&lt;code&gt;id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Строковое представление id джоба (например, &lt;code&gt;6bf44e17-8c200aed-41103e8-4958aff3&lt;/code&gt;). Имя поля зависит от команды: в &lt;code&gt;get_job&lt;/code&gt; это &lt;code&gt;job_id&lt;/code&gt;, а в &lt;code&gt;list_jobs&lt;/code&gt; — &lt;code&gt;id&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Строковое представление id операции (например, &lt;code&gt;2cb654e4-9ab04944-4110384-100d7ed&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;allocation_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Строковое представление id аллокации, в рамках которой исполнялся джоб (например, &lt;code&gt;2cb654e4-9ab04944-4110384-d7ed&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип джоба (например, &lt;code&gt;vanilla&lt;/code&gt;, &lt;code&gt;map&lt;/code&gt;, &lt;code&gt;partition_reduce&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;state&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Текущее состояние джоба (например, &lt;code&gt;running&lt;/code&gt;, &lt;code&gt;failed&lt;/code&gt;, &lt;code&gt;completed&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;controller_state&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Состояние джоба по версии контроллера.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;archive_state&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Состояние джоба по версии ноды.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;address&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Адрес exec-ноды (хост:порт), на которой исполнялся джоб. Если у ноды есть несколько адресов, значение будет равно адресу по умолчанию.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;addresses&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Словарь с адресами exec-ноды, на которой исполнялся джоб. Используется, когда у exec-ноды может быть несколько адресов.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;task_name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Название таска, к которому принадлежал джоб.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;start_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ISO 8601 string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время начала джоба.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;finish_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ISO 8601 string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время окончания джоба.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;has_spec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Флаг, показывающий сохранена ли спецификация джоба в архиве.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;has_competitors&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Флаг, показывающий является ли джоб спекулятивным или что у него есть спекулятивные соперники.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;has_probing_competitors&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Флаг, показывающий является ли джоб пробинговым или что у него есть пробинговые соперники.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_competition_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Для спекулятивного джоба равен id джоба, с которым соревновался этот джоб.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;probing_job_competition_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Для пробингого джоба равен id джоба, с которым соревновался этот джоб.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;pool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Название &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;пула&lt;/a&gt;, в котором был запущен джоб.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;pool_tree&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Название &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;дерева пулов&lt;/a&gt;, в котором был запущен джоб.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;progress&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;float in [0,1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Оценка доли работы, выполненной джобом к текущему моменту.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;stderr_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Размер сохранённого stderr джоба (сам stderr можно получить с помощью команды &lt;a href=\"ru/api/commands.html#get_job_stderr\"&gt;&lt;code&gt;get_job_stderr&lt;/code&gt;&lt;/a&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;fail_context_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Размер сохранённого fail_context джоба (сам fail_context можно получить с помощью команды &lt;a href=\"ru/api/commands.html#get_fail_context\"&gt;&lt;code&gt;get_fail_context&lt;/code&gt;&lt;/a&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;error&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ошибка, с которой завершился джоб.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;statistics&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Статистики джоба.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;brief_statistics&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Краткие статистики джоба.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;exec_attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Метаинформация о запуске джоба на exec-ноде.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;monitoring_descriptor&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор, используемый Мониторингом для хранения информации о джобе&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_cookie&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Уникальный индекс джоба в операции, деталь реализации контроллера операции. В ванильных операциях может быть использован для группирования \"воркеров\": если джоб прерывается, то новый джоб, запущенный ему на замену, будет иметь такой же &lt;code&gt;job_cookie&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_incarnation&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор инкарнации gang операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;interruption_info&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Информация о причинах прерывания джоба.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;archive_features&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Информация о сохраненных в архиве атрибутах джоба.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;core_infos&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список метаинформации о сохраненных core dump джоба.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;events&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список событий перехода джоба в новую стадию.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;is_stale&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Является ли информация о джобе устаревшей (если &lt;code&gt;%true&lt;/code&gt;, то некоторые поля могут быть в неактуальном состоянии). Информация о джобе считается устаревшей, если она давно не обновлялась. Обновлением информации в архиве джобов занимается нода, на которой джоб бежит, а также контроллер операции. Это происходит асинхронно. Если нода и контроллер одновременно рестартовали по какой-то причине (например, в результате обновления), информация о конечном состоянии джоба (&lt;code&gt;completed&lt;/code&gt;, &lt;code&gt;failed&lt;/code&gt; или &lt;code&gt;aborted&lt;/code&gt;) может не попасть в архив, и в результате джоб будет всегда возвращаться как stale. Несмотря на статус &lt;code&gt;running&lt;/code&gt;, обычно такие джобы уже давно не бегут, их следует игнорировать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"get_job\"&gt;&lt;a href=\"ru/api/commands.html#get_job\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;get_job&lt;/span&gt;&lt;/a&gt;get_job&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Немутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Получить информацию о джобе. Команда работает как для запущенных, так и для завершившихся джобов, в случае если информация о джобе была сохранена;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;GUID&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;GUID&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор джоба.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список атрибутов джоба, которые вернутся в ответе.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Параметр &lt;code&gt;attributes&lt;/code&gt; - подмножество &lt;code&gt;TJob&lt;/code&gt;. Если он &lt;code&gt;Null&lt;/code&gt;, то будут возращены все атрибуты джоба, в противном случае пользователь получит только атрибуты, указанные в &lt;code&gt;attributes&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Описание джоба (&lt;code&gt;TJob&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"operation_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"e13c5406-e5dd6f5d-3fe03e8-fe05f0d3\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"job_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"f11ae559-a0375703-3fe0384-8f1\"&lt;/span&gt;}\nOUTPUT {\n      &lt;span class=\"hljs-string\"&gt;\"operation_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"e13c5406-e5dd6f5d-3fe03e8-fe05f0d3\"&lt;/span&gt;;\n      &lt;span class=\"hljs-string\"&gt;\"job_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"f11ae559-a0375703-3fe0384-8f1\"&lt;/span&gt;;\n      &lt;span class=\"hljs-string\"&gt;\"state\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"completed\"&lt;/span&gt;;\n      &lt;span class=\"hljs-string\"&gt;\"start_time\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"2018-02-06T09:37:02.858492Z\"&lt;/span&gt;;\n      &lt;span class=\"hljs-string\"&gt;\"finish_time\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"2018-02-06T09:42:19.185525Z\"&lt;/span&gt;;\n      &lt;span class=\"hljs-string\"&gt;\"address\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"hostname.net:9012\"&lt;/span&gt;;\n      &lt;span class=\"hljs-string\"&gt;\"statistics\"&lt;/span&gt; = {\n          &lt;span class=\"hljs-string\"&gt;\"data\"&lt;/span&gt; = {\n               ...\n          };\n      };\n      &lt;span class=\"hljs-string\"&gt;\"events\"&lt;/span&gt; = [\n          ...\n      ];\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"8880\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-8880\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-8880\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-8880.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"list_jobs\"&gt;&lt;a href=\"ru/api/commands.html#list_jobs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;list_jobs&lt;/span&gt;&lt;/a&gt;list_jobs&lt;/h3&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данная команда может создавать значительную нагрузку на кластер, не используйте её в ваших процессах без согласования с администратором.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Свойства команды: &lt;strong&gt;Немутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Для заданной операции получить все джобы, удовлетворяющие фильтрам.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;GUID&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type (job_type)&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;EJobType&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;При указании параметра в ответе будут только джобы с указанным  &lt;code&gt;job_type&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;state (job_state)&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;EJobState&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;При указании параметра в ответе будут только джобы с указанным &lt;code&gt;job_state&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;address&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;При указании параметра в ответе будут только джобы с адресом, начинающимся на &lt;code&gt;address&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;with_stderr&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;При &lt;code&gt;Null&lt;/code&gt; возвращаются все джобы; при &lt;code&gt;True&lt;/code&gt; возвращаются только джобы с непустым &lt;code&gt;stderr&lt;/code&gt;; при &lt;code&gt;False&lt;/code&gt; возвращаются только джобы с пустым &lt;code&gt;stderr&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;with_fail_context&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;При &lt;code&gt;Null&lt;/code&gt; возвращаются все джобы; при &lt;code&gt;True&lt;/code&gt; возвращаются только джобы, у которых сохранен &lt;code&gt;fail_context&lt;/code&gt;; при &lt;code&gt;False&lt;/code&gt; возвращаются только джобы, у которых нет &lt;code&gt;fail_context&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;with_spec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;При &lt;code&gt;Null&lt;/code&gt; возвращаются все джобы; при &lt;code&gt;True&lt;/code&gt; возвращаются только джобы, у которых сохранена спецификация; при &lt;code&gt;False&lt;/code&gt; возвращаются только джобы, у которых нет спецификации.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;with_competitors&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;При &lt;code&gt;Null&lt;/code&gt; возвращаются все джобы; при &lt;code&gt;True&lt;/code&gt; возвращаются только джобы, для которых были запущены спекулятивные копии вместе с этими копиями; при &lt;code&gt;False&lt;/code&gt; возвращаются только джобы, у которых нет спекулятивных копий.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_competition_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;GUID&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;При указании параметра в ответе будет джоб с идентификатором &lt;code&gt;job_competition_id&lt;/code&gt; и все его спекулятивные копии (если они есть).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;with_monitoring_descriptor&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;При &lt;code&gt;Null&lt;/code&gt; возвращаются все джобы; при &lt;code&gt;True&lt;/code&gt; возвращаются только джобы, у которых есть &lt;code&gt;monitoring_descriptor&lt;/code&gt;; при &lt;code&gt;False&lt;/code&gt; возвращаются только джобы, у которых нет &lt;code&gt;monitoring_descriptor&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;with_interruption_info&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;При &lt;code&gt;Null&lt;/code&gt; возвращаются все джобы; при &lt;code&gt;True&lt;/code&gt; возвращаются только джобы, у которых есть &lt;code&gt;interruption_info&lt;/code&gt;; при &lt;code&gt;False&lt;/code&gt; возвращаются только джобы, у которых нет &lt;code&gt;interruption_info&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;task_name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;При указании параметра в ответе будут только джобы с указанным &lt;code&gt;task_name&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_incarnation&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;При указании параметра в ответе будут только джобы, относящиеся к запрашиваемой инкарнации&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ISO 8601 string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ограничение снизу на диапазон времени для выбора операций (по времени начала операции)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;to_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ISO 8601 string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ограничение сверху на диапазон времени для выбора операций (по времени начала операции для бегущих джобов и по времени конца для завершившихся)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;continuation_token&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Строка, использующаяся для пагинации (см. ниже).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;sort_field&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;{none,type,state,start_time,finish_time,address,duration,progress,id}&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;none&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Поле сортировки.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;sort_order&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;{ascending,descending}&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ascending&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Порядок сортировки.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;1000&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ограничение на количество возвращаемых джобов.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;offset&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Смещение на определенное количество джобов.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список атрибутов джобов, которые следует вернуть в ответе.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Параметры &lt;code&gt;job_type&lt;/code&gt;, &lt;code&gt;job_state&lt;/code&gt;, &lt;code&gt;address&lt;/code&gt;, &lt;code&gt;with_stderr&lt;/code&gt;, &lt;code&gt;with_fail_context&lt;/code&gt;, &lt;code&gt;with_competitors&lt;/code&gt;, &lt;code&gt;with_spec&lt;/code&gt;, &lt;code&gt;with_monitoring_descriptor&lt;/code&gt;, &lt;code&gt;with_interruption_info&lt;/code&gt; задают &lt;em&gt;фильтр&lt;/em&gt; джобов. В ответе будут перечислены только джобы, удовлетворяющие условию фильтрации.&lt;/p&gt;\n&lt;p&gt;Параметры &lt;code&gt;sort_field&lt;/code&gt;, &lt;code&gt;sort_order&lt;/code&gt; задают порядок джобов в ответе. При этом параметры &lt;code&gt;limit&lt;/code&gt; и &lt;code&gt;offset&lt;/code&gt; определяют срез (подмножество) джобов в ответе: отбрасываются первые &lt;code&gt;offset&lt;/code&gt; джобов и далее выбираются &lt;code&gt;limit&lt;/code&gt; оставшихся.&lt;/p&gt;\n&lt;p&gt;Параметр &lt;code&gt;attributes&lt;/code&gt; - список из &lt;code&gt;TJob&lt;/code&gt; . Если он &lt;code&gt;Null&lt;/code&gt;, то будут возращены дефолтные атрибуты, в противном случае пользователь получит только атрибуты, указанные в &lt;code&gt;attributes&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;jobs&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&amp;lt;TJob&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список джобов.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;controller_agent_job_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Количество джобов в ответе, информация про которые находится в контроллере операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;archive_job_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Количество джобов в ответе, информация про которые находится в архиве.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type_counts&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&amp;lt;string, int&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Словарь, содержащий количество джобов различного типа, подходящих под все указанные фильтры (кроме фильтра по типу).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;state_counts&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;map&amp;lt;string, int&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Словарь, содержащий количество джобов в различных состояниях, подходящих под все указанные фильтры (кроме фильтра по состоянию).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;errors&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&amp;lt;map&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список ошибок.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;continuation_token&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Строка, использующаяся для пагинации. В ней закодированы параметры запроса, а также место, с которого нужно продолжить перечислять джобы. Ее можно передать в параметре &lt;code&gt;continuation_token&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"operation_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"4505e8eb-28fa88e2-3fe03e8-c6fcd8fa\"&lt;/span&gt;; }\nOUTPUT {\n      &lt;span class=\"hljs-string\"&gt;\"jobs\"&lt;/span&gt; = [\n          {\n              &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"55aff293-7ef14284-3fe0384-3e07\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"map\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"state\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"failed\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"address\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"hostname.net:9012\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"start_time\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"2018-05-05T00:41:27.433832Z\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"finish_time\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"2018-05-05T00:49:04.288196Z\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"fail_context_size\"&lt;/span&gt; = 973230u;\n              &lt;span class=\"hljs-string\"&gt;\"error\"&lt;/span&gt; = {\n                  &lt;span class=\"hljs-string\"&gt;\"code\"&lt;/span&gt; = 1205;\n                  &lt;span class=\"hljs-string\"&gt;\"message\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"User job failed\"&lt;/span&gt;;\n                  ...\n              };\n              ...\n          };\n          ...\n          {\n              &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"69ae20a7-887b25ab-3fe0384-3cff\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"map\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"state\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"running\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"address\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"hostname.net:9012\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"start_time\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"2018-05-07T13:04:03.339873Z\"&lt;/span&gt;;\n              &lt;span class=\"hljs-string\"&gt;\"progress\"&lt;/span&gt; = 0.;\n              &lt;span class=\"hljs-string\"&gt;\"brief_statistics\"&lt;/span&gt; = &amp;lt;\n                  &lt;span class=\"hljs-string\"&gt;\"timestamp\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"2018-05-07T13:04:08.431740Z\"&lt;/span&gt;;\n              &amp;gt; {\n                  &lt;span class=\"hljs-string\"&gt;\"processed_input_compressed_data_size\"&lt;/span&gt; = 0;\n                  &lt;span class=\"hljs-string\"&gt;\"processed_input_data_weight\"&lt;/span&gt; = 0;\n                  &lt;span class=\"hljs-string\"&gt;\"processed_output_uncompressed_data_size\"&lt;/span&gt; = 0;\n                  &lt;span class=\"hljs-string\"&gt;\"processed_output_compressed_data_size\"&lt;/span&gt; = 0;\n                  &lt;span class=\"hljs-string\"&gt;\"processed_input_uncompressed_data_size\"&lt;/span&gt; = 0;\n                  &lt;span class=\"hljs-string\"&gt;\"processed_input_row_count\"&lt;/span&gt; = 0;\n              };\n          };\n      ];\n      &lt;span class=\"hljs-string\"&gt;\"cypress_job_count\"&lt;/span&gt; = 200;\n      &lt;span class=\"hljs-string\"&gt;\"scheduler_job_count\"&lt;/span&gt; = 208;\n      &lt;span class=\"hljs-string\"&gt;\"archive_job_count\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n      &lt;span class=\"hljs-string\"&gt;\"type_counts\"&lt;/span&gt; = {\n          &lt;span class=\"hljs-string\"&gt;\"map\"&lt;/span&gt; = 408;\n      };\n      &lt;span class=\"hljs-string\"&gt;\"state_counts\"&lt;/span&gt; = {\n          &lt;span class=\"hljs-string\"&gt;\"running\"&lt;/span&gt; = 208;\n          &lt;span class=\"hljs-string\"&gt;\"failed\"&lt;/span&gt; = 200;\n      };\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"9416\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-9416\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-9416\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-9416.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"abandon_job\"&gt;&lt;a href=\"ru/api/commands.html#abandon_job\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;abandon_job&lt;/span&gt;&lt;/a&gt;abandon_job&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Прервать джоб и считать, что его входные данные успешно обработаны.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор джоба.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"job_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"1225d-1f2fb8c4-f1075d39-5fb7cdff\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"9493\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-9493\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-9493\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-9493.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"abort_job\"&gt;&lt;a href=\"ru/api/commands.html#abort_job\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;abort_job&lt;/span&gt;&lt;/a&gt;abort_job&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Мутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Прервать джоб, в дальнейшем он будет перезапущен планировщиком (как и любой прерванный джоб операции).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор джоба.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;interrupt_timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Таймаут на возможность успешного завершения джоба после того, как в него перестают подавать входные данные.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"job_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"1225d-1f2fb8c4-f1075d39-5fb7cdff\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"9584\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2 t;code&gt;binary&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: &lt;code&gt;fail context&lt;/code&gt; джоба.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"operation_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"33ab3f-bf1df917-b35fe9ed-c70a4bf4\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"job_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"1225d-1f2fb8c4-f1075d39-5fb7cdff\"&lt;/span&gt;}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"9853\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-9853\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-9853\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-9853.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"get_job_stderr\"&gt;&lt;a href=\"ru/api/commands.html#get_job_stderr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;get_job_stderr&lt;/span&gt;&lt;/a&gt;get_job_stderr&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Немутирующая&lt;/strong&gt;, &lt;strong&gt;Тяжелая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Получить stderr джоба. Команда работает для запущенных джобов и для упавших джобов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор джоба.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;offset&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Смещение от начала в байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Максимальный размер в байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;binary&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Значение: stderr джоба.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"operation_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"33ab3f-bf1df917-b35fe9ed-c70a4bf4\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"job_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"1225d-1f2fb8c4-f1075d39-5fb7cdff\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"offset\"&lt;/span&gt; = 500; &lt;span class=\"hljs-string\"&gt;\"limit\"&lt;/span&gt; = 100 }\nOUTPUT {\nOUTPUT   &lt;span class=\"hljs-string\"&gt;\"total_size\"&lt;/span&gt; = 1000;\nOUTPUT   &lt;span class=\"hljs-string\"&gt;\"end_offset\"&lt;/span&gt; = 600;\nOUTPUT }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"9977\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-9977\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-9977\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-9977.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"prochee\"&gt;&lt;a href=\"ru/api/commands.html#prochee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Прочее&lt;/span&gt;&lt;/a&gt;Прочее&lt;/h2&gt;\n&lt;h3 id=\"parse_ypath\"&gt;&lt;a href=\"ru/api/commands.html#parse_ypath\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;parse_ypath&lt;/span&gt;&lt;/a&gt;parse_ypath&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Немутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Выполнить разбор переданного &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPath-пути&lt;/a&gt;, переложив все идентификаторы сложного YPath в атрибуты.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Путь, который необходимо распарсить.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/table[#1:#2]\"&lt;/span&gt; }\nOUTPUT { &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"&amp;lt;ranges=[{lower_limit={row_index=1};upper_limit={row_index=2}}]&amp;gt;//tmp/table\"&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"10057\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-10057\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-10057\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-10057.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"execute_batch\"&gt;&lt;a href=\"ru/api/commands.html#execute_batch\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;execute_batch&lt;/span&gt;&lt;/a&gt;execute_batch&lt;/h3&gt;\n&lt;p&gt;Свойства команды:  &lt;strong&gt;Мутирующая, если в наборе есть мутирующие команды&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Выполнить за один запрос набор команд, переданных в параметрах;&lt;/li&gt;\n&lt;li&gt;Команды могут (и будут) выполняться параллельно, так что если в одном наборе будет одновременно запись узла и его чтение, то результат чтения может быть как старым значением, так и новым;&lt;/li&gt;\n&lt;li&gt;В наборе могут участвовать только легкие команды;&lt;/li&gt;\n&lt;li&gt;В наборе могут участвовать только команды с типом входа &lt;code&gt;null&lt;/code&gt; или &lt;code&gt;structured&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;В наборе могут участвовать только команды с типом выхода &lt;code&gt;null&lt;/code&gt; или &lt;code&gt;structured&lt;/code&gt;;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;requests&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Описание выполняемых запросов.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;concurrency&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;50&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Численный параметр, который ограничивает сверху число команд выполняющихся на кластере одновременно, можно использовать, чтобы не исчерпать свой request rate limit.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Выполняемые запросы перечисляются в параметре &lt;code&gt;requests&lt;/code&gt;, представляющем собой список;&lt;/li&gt;\n&lt;li&gt;Каждый элемент данного списка — это словарь с полями:&lt;/li&gt;\n&lt;/ul&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;command&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Имя команды.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parameters&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Словарь с параметрами команды.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;input&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Вход для запроса (для команд с типом входа &lt;code&gt;structured&lt;/code&gt;, например &lt;code&gt;set&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;На выходе получается список той же длины, что и на входе;&lt;/li&gt;\n&lt;li&gt;Каждый элемент списка описывает результат выполнения одного запроса. Это словарь следующего вида:&lt;/li&gt;\n&lt;/ul&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;error&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Ошибка, возникшая при выполнении запроса (если есть).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;output&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Выход запроса (для успешных команд с типом выхода &lt;code&gt;structured&lt;/code&gt; , например &lt;code&gt;get&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS {\n    &lt;span class=\"hljs-string\"&gt;\"requests\"&lt;/span&gt; = [\n      {\n        &lt;span class=\"hljs-string\"&gt;\"command\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"set\"&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"parameters\"&lt;/span&gt; = {&lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/a\"&lt;/span&gt;};\n        &lt;span class=\"hljs-string\"&gt;\"input\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"value_a\"&lt;/span&gt;;\n      };\n      {\n        &lt;span class=\"hljs-string\"&gt;\"command\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"get\"&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"parameters\"&lt;/span&gt; = {&lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//tmp/b\"&lt;/span&gt;};\n      };\n      {\n        &lt;span class=\"hljs-string\"&gt;\"command\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"get\"&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"parameters\"&lt;/span&gt; = {&lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//nonexisting\"&lt;/span&gt;};\n      };\n    ];\n}\nOUTPUT [\n    { };\n    { output = &lt;span class=\"hljs-string\"&gt;\"value_b\"&lt;/span&gt;; };\n    { error = {...} };\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"10289\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-10289\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-10289\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-10289.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"get_supported_features\"&gt;&lt;a href=\"ru/api/commands.html#get_supported_features\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;get_supported_features&lt;/span&gt;&lt;/a&gt;get_supported_features&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Немутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Возвращает словарь с полем &lt;code&gt;features&lt;/code&gt;, в котором описаны поддерживаемые кластером примитивные типы данных, кодеки сжатия, erasure-кодеки и т. п.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Нет&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Входные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выходные данные:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тип: &lt;code&gt;structured&lt;/code&gt;. В ключе &lt;code&gt;features&lt;/code&gt; ответа лежит словарь со следующими полями.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Ключ&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип значения&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;primitive_types&lt;/td&gt;\n&lt;td&gt;список строк&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/data-types.html#schema_primitive\"&gt;Примитивные типы&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;erasure_codecs&lt;/td&gt;\n&lt;td&gt;список строк&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/replication.html\"&gt;Erasure-кодеки&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;compression_codecs&lt;/td&gt;\n&lt;td&gt;список строк&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/compression.html\"&gt;Кодеки сжатия&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;PARAMETERS { }\nOUTPUT {\n    &lt;span class=\"hljs-string\"&gt;\"features\"&lt;/span&gt; = {\n      &lt;span class=\"hljs-string\"&gt;\"primitive_types\"&lt;/span&gt; = [&lt;span class=\"hljs-string\"&gt;\"int8\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"int16\"&lt;/span&gt;; ... ];\n      &lt;span class=\"hljs-string\"&gt;\"erasure_codecs\"&lt;/span&gt; = [&lt;span class=\"hljs-string\"&gt;\"none\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"isa_lrc_12_2_2\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"isa_reed_solomon_6_3\"&lt;/span&gt;; ... ];\n      &lt;span class=\"hljs-string\"&gt;\"compression_codecs\"&lt;/span&gt; = [&lt;span class=\"hljs-string\"&gt;\"none\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"snappy\"&lt;/span&gt;; &lt;span class=\"hljs-string\"&gt;\"brotli_1\"&lt;/span&gt;; ... ];\n    };\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"10389\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-10389\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-10389\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-10389.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"generate_timestamp\"&gt;&lt;a href=\"ru/api/commands.html#generate_timestamp\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;generate_timestamp&lt;/span&gt;&lt;/a&gt;generate_timestamp&lt;/h3&gt;\n&lt;p&gt;Свойства команды: &lt;strong&gt;Немутирующая&lt;/strong&gt;, &lt;strong&gt;Легкая&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Генерирует монотонную временную метку.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Нет&lt;/li&gt;\n&lt;/ul&gt;\
