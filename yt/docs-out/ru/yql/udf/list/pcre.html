        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Библиотека Pcre на данный момент является алиасом к &lt;a href=\"ru/yql/udf/list/hyperscan.html\"&gt;Hyperscan&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Если вы завязываетесь на какие-либо особенности конкретного движка, реализующего регулярные выражения, то лучше использовать UDF с определённой библиотекой внутри, а Pcre рассматривать как текущий наиболее рекомендуемый вариант для простых проверок на соответствие, который может в будущем поменяться.&lt;/p&gt;\n&lt;p&gt;На данный момент доступны:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/udf/list/hyperscan.html\"&gt;Hyperscan&lt;/a&gt; &lt;span style=\"color:gray\"&gt;(Intel)&lt;/span&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/udf/list/pire.html\"&gt;Pire&lt;/a&gt; &lt;span style=\"color:gray\"&gt;(Яндекс)&lt;/span&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/udf/list/re2.html\"&gt;Re2&lt;/a&gt; &lt;span style=\"color:gray\"&gt;(Google)&lt;/span&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Все три модуля предоставляют примерно одинаковый набор функций с идентичным интерфейсом, что позволяет переключаться между ними с минимальными изменениями запроса.&lt;/p&gt;\n&lt;p&gt;HyperScan внутри имеет несколько реализаций с использованием разных наборов процессорных инструкций, среди которых автоматически выбирается нужная в соответствии с текущим процессором. В Hyperscan также доступны отдельные функции с backtracking (возможность сослаться на предыдущую найденную часть строки), которые реализованы через гибридное использование двух библиотек Hyperscan и libpcre.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/yandex/pire\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Pire&lt;/a&gt; (Perl Incompatible Regular Expressions) это разработанная в Яндексе очень быстрая библиотека регулярных выражений. На нижнем уровне она просматривает входную строку один раз, подряд, без откатов, и тратит (на x86 и x86_64) по 5 инструкций на символ. Но с 2011-2013 года эта библиотека практически не развивается и как намекает название («i» расшифровывается как incompatible), возможно потребуется адаптировать сами выражения.&lt;/p&gt;\n&lt;p&gt;Hyperscan и Pire рассчитаны в первую очередь под Grep и Match.&lt;/p&gt;\n&lt;p&gt;Модуль Re2 использует &lt;a href=\"https://github.com/google/re2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;google::RE2&lt;/a&gt;, где реализован широкий ассортимент возможностей (&lt;a href=\"https://github.com/google/re2/wiki/Syntax\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;смотрите официальную документацию&lt;/a&gt;). Основной плюс библиотеки Re2 — развитый функционал по Capture и Replace, если вам нужны эти функции, то рекомендуется пользоваться именно ей.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/udf/list/pcre.md","sourcePath":"ru/yql/udf/list/pcre.md"},"headings":[],"title":"Pcre"},"router":{"pathname":"ru/yql/udf/list/pcre","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
