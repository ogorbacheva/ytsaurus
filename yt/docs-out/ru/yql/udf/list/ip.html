        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В модуле &lt;code&gt;Ip&lt;/code&gt; поддерживаются как IPv4, так и IPv6 адреса. По умолчанию они представляются в виде бинарных строк длиной 4 и 16 байт соответственно.&lt;/p&gt;\n&lt;h2 id=\"spisok-funkcij\"&gt;&lt;a href=\"ru/yql/udf/list/ip.html#spisok-funkcij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Ip::FromString(String{Flags:AutoMap}) -&amp;gt; String?&lt;/code&gt; — из человекочитаемого представления в бинарное&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Ip::SubnetFromString(String{Flags:AutoMap}) -&amp;gt; String?&lt;/code&gt; — из человекочитаемого представления подсети в бинарное&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Ip::ToString(String{Flags:AutoMap}) -&amp;gt; String?&lt;/code&gt; — из бинарного представления в человекочитаемое&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Ip::ToString(String{Flags:AutoMap}) -&amp;gt; String?&lt;/code&gt; — из бинарного представления подсети в человекочитаемое&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Ip::IsIPv4(String?) -&amp;gt; Bool&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Ip::IsIPv6(String?) -&amp;gt; Bool&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Ip::IsEmbeddedIPv4(String?) -&amp;gt; Bool&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Ip::ConvertToIPv6(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt; — IPv6 остается без изменений, а IPv4 становится embedded в IPv6&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Ip::GetSubnet(String{Flags:AutoMap}, [Uint8?]) -&amp;gt; String&lt;/code&gt; — во втором аргументе размер подсети, по умолчанию 24 для IPv4 и 64 для IPv6&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Ip::GetSubnetByMask(String{Flags:AutoMap}, String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt; — во втором аргументе битовая маска подсети&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Ip::SubnetMatch(String{Flags:AutoMap}, String{Flags:AutoMap}) -&amp;gt; Bool&lt;/code&gt; — в первом аргументе подсеть, во втором аргументе подсеть или адрес&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"primery\"&gt;&lt;a href=\"ru/yql/udf/list/ip.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Ip::IsEmbeddedIPv4(\n  Ip::FromString(\"::ffff:77.75.155.3\")\n); -- true\n\nSELECT\n  Ip::ToString(\n    Ip::GetSubnet(\n      Ip::FromString(\"213.180.193.3\")\n    )\n  ); -- \"213.180.193.0\"\n\nSELECT\n  Ip::SubnetMatch(\n    Ip::SubnetFromString(\"192.168.0.1/16\"),\n    Ip::FromString(\"192.168.1.14\"),\n  ); -- true\n\nSELECT\n  Ip::ToString(\n    Ip::GetSubnetByMask(\n      Ip::FromString(\"192.168.0.1\"),\n      Ip::FromString(\"255.255.0.0\")\n    )\n  ); -- \"192.168.0.0\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"66\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-66\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-66\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-66.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/udf/list/ip.md","sourcePath":"ru/yql/udf/list/ip.md"},"headings":[{"title":"Список функций","href":"ru/yql/udf/list/ip.html#spisok-funkcij","level":2},{"title":"Примеры","href":"ru/yql/udf/list/ip.html#primery","level":2}],"title":"Ip"},"router":{"pathname":"ru/yql/udf/list/ip","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
