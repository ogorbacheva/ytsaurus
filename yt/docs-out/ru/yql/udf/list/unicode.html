        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Функции для работы с Unicode строками.&lt;/p&gt;\n&lt;h2 id=\"spisok-funkcij\"&gt;&lt;a href=\"ru/yql/udf/list/unicode.html#spisok-funkcij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::IsUtf(String) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Проверяет является ли строка валидной utf-8 последовательностью. Например, строка &lt;code&gt;\"\\xF0\"&lt;/code&gt; не является валидной utf-8 последовательностью, а строка &lt;code&gt;\"\\xF0\\x9F\\x90\\xB1\"&lt;/code&gt; корректно описывает utf-8 emoji с котиком.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::GetLength(Utf8{Flags:AutoMap}) -&amp;gt; Uint64&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Возвращает длину utf-8 строки в символах (unicode code points). Суррогатные пары учитываются как один символ.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Unicode::GetLength(\"жніўня\"); -- 6\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"22\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-22\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-22\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-22.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::Find(string:Utf8{Flags:AutoMap}, subString:Utf8, [pos:Uint64?]) -&amp;gt; Uint64?&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::RFind(string:Utf8{Flags:AutoMap}, subString:Utf8, [pos:Uint64?]) -&amp;gt; Uint64?&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Поиск первого(&lt;code&gt;RFind&lt;/code&gt; — последнего) вхождения подстроки в строку начиная с позиции &lt;code&gt;pos&lt;/code&gt;. Возвращает позицию первого символа от найденной подстроки, в случае неуспеха возвращается Null.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Unicode::Find(\"aaa\", \"bb\"); -- Null\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"36\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-36\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-36\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-36.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::Substring(string:Utf8{Flags:AutoMap}, from:Uint64?, len:Uint64?) -&amp;gt; Utf8&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Возвращает подстроку от &lt;code&gt;string&lt;/code&gt; начиная с символа &lt;code&gt;from&lt;/code&gt; длиной в &lt;code&gt;len&lt;/code&gt; символов. Если аргумент &lt;code&gt;len&lt;/code&gt; опущен, то подстрока берётся до конца исходной строки. В случае, когда &lt;code&gt;from&lt;/code&gt; больше длины исходной строки, возвращается пустая строка &lt;code&gt;\"\"&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Unicode::Substring(\"0123456789abcdefghij\", 10); -- \"abcdefghij\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"45\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-45\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-45\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-45.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Функции &lt;code&gt;Unicode::Normalize...&lt;/code&gt; приводят переданную utf-8 строку в одну из &lt;a href=\"https://unicode.org/reports/tr15/#Norm_Forms\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;нормальных форм&lt;/a&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Unicode::Normalize(Utf8{Flags:AutoMap}) -&amp;gt; Utf8&lt;/code&gt; -- NFC&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Unicode::NormalizeNFD(Utf8{Flags:AutoMap}) -&amp;gt; Utf8&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Unicode::NormalizeNFC(Utf8{Flags:AutoMap}) -&amp;gt; Utf8&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Unicode::NormalizeNFKD(Utf8{Flags:AutoMap}) -&amp;gt; Utf8&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Unicode::NormalizeNFKC(Utf8{Flags:AutoMap}) -&amp;gt; Utf8&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::Translit(string:Utf8{Flags:AutoMap}, [lang:String?]) -&amp;gt; Utf8&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Транслитерирует в латинский алфавит слова переданной строки, целиком состоящие из символов алфавита языка, переданного вторым аргументом. Если язык не указан, то транслитерация ведется с русского. Доступные языки: \"kaz\", \"rus\", \"tur\", \"ukr\".&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Unicode::Translit(\"Тот уголок земли, где я провел\"); -- \"Tot ugolok zemli, gde ya provel\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"86\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-86\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-86\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-86.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::LevensteinDistance(stringA:Utf8{Flags:AutoMap}, stringB:Utf8{Flags:AutoMap}) -&amp;gt; Uint64&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Вычисляет расстояние Левенштейна для переданных строк.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::Fold(Utf8{Flags:AutoMap}, [ Language:String?, DoLowerCase:Bool?, DoRenyxa:Bool?, DoSimpleCyr:Bool?, FillOffset:Bool? ]) -&amp;gt; Utf8&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Выполняет &lt;a href=\"https://www.w3.org/TR/charmod-norm/#definitionCaseFolding\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;case folding&lt;/a&gt; для переданной строки.&lt;br /&gt;\nПараметры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Language&lt;/code&gt; задаётся по тем же правилам, что и в &lt;code&gt;Unicode::Translit()&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DoLowerCase&lt;/code&gt; приводить строку к нижнему регистру, по умолчанию &lt;code&gt;true&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DoRenyxa&lt;/code&gt; приводить символы с диакритическими знаками к аналогичным латинским символам, по умолчанию &lt;code&gt;true&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DoSimpleCyr&lt;/code&gt; приводить кириллические символы с диакритическими знаками к аналогичным латинским символам, по умолчанию &lt;code&gt;true&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;FillOffset&lt;/code&gt; параметр не используется.&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Unicode::Fold(\"Kongreßstraße\",  false AS DoSimpleCyr, false AS DoRenyxa); -- \"kongressstrasse\"\nSELECT Unicode::Fold(\"ҫурт\"); -- \"сурт\"\nSELECT Unicode::Fold(\"Eylül\", \"Turkish\" AS Language); -- \"eylul\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"130\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-130\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-130\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-130.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::ReplaceAll(input:Utf8{Flags:AutoMap}, find:Utf8, replacement:Utf8) -&amp;gt; Utf8&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::ReplaceFirst(input:Utf8{Flags:AutoMap}, find:Utf8, replacement:Utf8) -&amp;gt; Utf8&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::ReplaceLast(input:Utf8{Flags:AutoMap}, find:Utf8, replacement:Utf8) -&amp;gt; Utf8&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Заменяет все/первое/последнее вхождения строки &lt;code&gt;find&lt;/code&gt; в &lt;code&gt;input&lt;/code&gt; на &lt;code&gt;replacement&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::RemoveAll(input:Utf8{Flags:AutoMap}, symbols:Utf8) -&amp;gt; Utf8&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::RemoveFirst(input:Utf8{Flags:AutoMap}, symbols:Utf8) -&amp;gt; Utf8&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::RemoveLast(input:Utf8{Flags:AutoMap}, symbols:Utf8) -&amp;gt; Utf8&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Удаляются все/первое/последнее вхождения символов в наборе &lt;code&gt;symbols&lt;/code&gt; из &lt;code&gt;input&lt;/code&gt;. Второй аргумент интерпретируется как неупорядоченный набор символов для удаления.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Unicode::ReplaceLast(\"absence\", \"enc\", \"\"); -- \"abse\"\nSELECT Unicode::RemoveAll(\"abandon\", \"an\"); -- \"bdo\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"167\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-167\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-167\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-167.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::ToCodePointList(Utf8{Flags:AutoMap}) -&amp;gt; List&amp;lt;Uint32&amp;gt;&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Разбить строку на unicode'ую последовательность codepoint'ов.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::FromCodePointList(List&amp;lt;Uint32&amp;gt;{Flags:AutoMap}) -&amp;gt; Utf8&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Сформировать unicode строку из codepoint'ов.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Unicode::ToCodePointList(\"Щавель\"); -- [1065, 1072, 1074, 1077, 1083, 1100]\nSELECT Unicode::FromCodePointList(AsList(99,111,100,101,32,112,111,105,110,116,115,32,99,111,110,118,101,114,116,101,114)); -- \"code points converter\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"184\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-184\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-184\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-184.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::Reverse(Utf8{Flags:AutoMap}) -&amp;gt; Utf8&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Перевернуть строку.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::ToLower(Utf8{Flags:AutoMap}) -&amp;gt; Utf8&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::ToUpper(Utf8{Flags:AutoMap}) -&amp;gt; Utf8&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::ToTitle(Utf8{Flags:AutoMap}) -&amp;gt; Utf8&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Привести регистр строки к ВЕРХНЕМУ, нижнему или Заглавному виду.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::SplitToList( string:Utf8?, separator:Utf8, [ DelimeterString:Bool?,  SkipEmpty:Bool?, Limit:Uint64? ]) -&amp;gt; List&amp;lt;Utf8&amp;gt;&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Разбиение строки на подстроки по разделителю.&lt;br /&gt;\n&lt;code&gt;string&lt;/code&gt; — исходная строка;&lt;br /&gt;\n&lt;code&gt;separator&lt;/code&gt; — разделитель.&lt;br /&gt;\nПараметры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;DelimeterString:Bool? — считать разделитель строкой (&lt;code&gt;true&lt;/code&gt;, по умолчанию) или набором символов \"любой из\" (&lt;code&gt;false&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;SkipEmpty:Bool? — пропускать ли пустые строки в результате, по умолчанию &lt;code&gt;false&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Limit:Uint64? — ограничение на число извлекаемых компонент, по умолчанию не ограничено; необработанный суффикс оригинальной строки возвращается последним элементом при превышении лимита.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::JoinFromList(List&amp;lt;Utf8&amp;gt;{Flags:AutoMap}, separator:Utf8) -&amp;gt; Utf8&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Конкатенация списка строк через &lt;code&gt;separator&lt;/code&gt; в единую строку.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Unicode::SplitToList(\"One, two, three, four, five\", \", \", 2 AS Limit); -- [\"One\", \"two\", \"three, four, five\"]\nSELECT Unicode::JoinFromList([\"One\", \"two\", \"three\", \"four\", \"five\"], \";\"); -- \"One;two;three;four;five\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"244\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-244\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-244\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-244.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::ToUint64(string:Utf8{Flags:AutoMap}, [prefix:Uint16?]) -&amp;gt; Uint64&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Конвертация из строки в число. Второй опциональный аргумент задаёт систему счисления, по умолчанию 0 — автоматическое определение по префиксу.&lt;/p&gt;\n&lt;p&gt;Поддерживаемые префиксы : &lt;code&gt;0x(0X)&lt;/code&gt; — base-16, &lt;code&gt;0&lt;/code&gt; — base-8. Система по умолчанию — base-10.&lt;br /&gt;\nЗнак &lt;code&gt;-&lt;/code&gt; перед числом интерпретируется как в беззнаковой арифметике языка C, например &lt;code&gt;-0x1&lt;/code&gt; -&amp;gt; UI64_MAX.&lt;br /&gt;\nВ случае наличия в строке некорректных символов или выхода числа за границы ui64 функция завершается с ошибкой.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::TryToUint64(string:Utf8{Flags:AutoMap}, [prefix:Uint16?]) -&amp;gt; Uint64?&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Аналогично функции &lt;code&gt;Unicode::ToUint64()&lt;/code&gt;, но вместо ошибки возвращает &lt;code&gt;NULL&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Unicode::ToUint64(\"77741\"); -- 77741\nSELECT Unicode::ToUint64(\"-77741\"); -- 18446744073709473875\nSELECT Unicode::TryToUint64(\"asdh831\"); -- Null\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"264\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-264\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-264\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-264.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::Strip(string:Utf8{Flags:AutoMap}) -&amp;gt; Utf8&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Вырезает из строки крайние символы Unicode-категории Space.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Unicode::Strip(\"\\u2002ыкль\\u2002\"u); -- \"ыкль\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"273\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-273\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-273\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-273.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::IsAscii(string:Utf8{Flags:AutoMap}) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Проверяет, состоит ли utf-8 строка исключительно из символов ascii.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::IsSpace(string:Utf8{Flags:AutoMap}) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::IsUpper(string:Utf8{Flags:AutoMap}) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::IsLower(string:Utf8{Flags:AutoMap}) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::IsAlpha(string:Utf8{Flags:AutoMap}) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::IsAlnum(string:Utf8{Flags:AutoMap}) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::IsHex(string:Utf8{Flags:AutoMap}) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Проверяют, отвечает ли utf-8 строка указанному условию.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Unicode::IsUnicodeSet(string:Utf8{Flags:AutoMap}, unicode_set:Utf8) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Проверяет, состоит ли utf-8 строка &lt;code&gt;string&lt;/code&gt; исключительно из символов, указанных в &lt;code&gt;unicode_set&lt;/code&gt;. Символы в &lt;code&gt;unicode_set&lt;/code&gt; нужно указывать в квадратных скобках.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Unicode::IsUnicodeSet(\"ваоао\"u, \"[вао]\"u); -- true\nSELECT Unicode::IsUnicodeSet(\"ваоао\"u, \"[ваб]\"u); -- false\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"323\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-323\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-323\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-323.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/udf/list/unicode.md","sourcePath":"ru/yql/udf/list/unicode.md"},"headings":[{"title":"Список функций","href":"ru/yql/udf/list/unicode.html#spisok-funkcij","level":2}],"title":"Unicode"},"router":{"pathname":"ru/yql/udf/list/unicode","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
