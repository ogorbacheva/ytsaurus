            {"data":{"leading":false,"html":"&lt;p&gt;&lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/storage/yson\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YSON&lt;/a&gt; — разработанный в Яндексе формат данных, похожий на JSON.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Сходства с JSON:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;не имеет строгой схемы;&lt;/li&gt;\n&lt;li&gt;помимо простых типов данных поддерживает словари и списки в произвольных комбинациях.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Некоторые отличия от JSON:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Помимо текстового представления имеет и бинарное;&lt;/li&gt;\n&lt;li&gt;В текстовом представлении вместо запятых — точки с запятой, а вместо двоеточий — равно;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Поддерживается концепция «атрибутов», то есть именованных свойств, которые могут быть присвоены узлу в дереве.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Особенности реализации и функциональность модуля:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Наравне с YSON данный модуль поддерживает и стандартный JSON, что несколько расширяет область его применения.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Работает с DOM представлением YSON в памяти, которое в терминах YQL передается между функциями как «ресурс» (см. &lt;a href=\"ru/yql/types/special.html\"&gt;описание специальных типов данных&lt;/a&gt;). Большинство функций модуля имеют семантику запроса на выполнение указанной операции с ресурсом и возвращают пустой &lt;a href=\"ru/yql/types/optional.html\"&gt;optional&lt;/a&gt;, если операция не удалась из-за несоответствия фактического типа данных ожидаемому.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Предоставляет несколько основных классов функций (полный список и подробное описание функций см. ниже):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Yson::Parse***&lt;/code&gt; — получение ресурса с DOM-объектом из сериализованных данных, все дальнейшие операции выполняются уже над полученным ресурсом;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Yson::From&lt;/code&gt; — получение ресурса с DOM-объектом из простых типов данных YQL или контейнеров (списков или словарей);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Yson::ConvertTo***&lt;/code&gt; — преобразовать ресурс к &lt;a href=\"ru/yql/types/primitive.html\"&gt;простым типам данных&lt;/a&gt; или &lt;a href=\"ru/yql/types/containers.html\"&gt;контейнерам&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Yson::Lookup***&lt;/code&gt; — получение одного элемента списка или словаря с опциональным преобразованием в нужный тип данных;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Yson::YPath***&lt;/code&gt; — получение одного элемента дерева документа по указанному относительному пути с опциональным преобразованием в нужный тип данных;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Yson::Serialize***&lt;/code&gt; — получить из ресурса копию его данных, сериализованную в одном из форматов;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Для удобства при передаче сериализованного Yson и Json в функции, ожидающие на входе ресурс с DOM-объектом, неявное преобразование через &lt;code&gt;Yson::Parse&lt;/code&gt; или &lt;code&gt;Yson::ParseJson&lt;/code&gt; происходит автоматически. Также в SQL синтаксисе оператор точки или квадратных скобок автоматически добавляет вызов &lt;code&gt;Yson::Lookup&lt;/code&gt;. Для сериализации ресурса по-прежнему нужно вызывать &lt;code&gt;Yson::ConvertTo***&lt;/code&gt; или &lt;code&gt;Yson::Serialize***&lt;/code&gt;. Таким образом, например, получение элемента \"foo\" словаря из колонки mycolumn типа Yson в виде строки может выглядеть так: &lt;code&gt;SELECT Yson::ConvertToString(mycolumn[\"foo\"]) FROM mytable;&lt;/code&gt; или &lt;code&gt;SELECT Yson::ConvertToString(mycolumn.foo) FROM mytable;&lt;/code&gt;. В варианте с точкой можно экранировать спецсимволы по &lt;a href=\"ru/yql/syntax/expressions.html#escape\"&gt;общим правилам для индентификаторов&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Функции модуля стоит рассматривать как «кубики», из которых можно собирать разные конструкции, например:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Yson::Parse*** -&amp;gt; Yson::Serialize***&lt;/code&gt; — конвертация из одного формата в другой;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Yson::Parse*** -&amp;gt; Yson::Lookup -&amp;gt; Yson::Serialize***&lt;/code&gt; — извлечение значения указанного поддерева в исходном дереве YSON;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Yson::Parse*** -&amp;gt; Yson::ConvertToList -&amp;gt; ListMap -&amp;gt; Yson::Lookup***&lt;/code&gt; — извлечение элементов по ключу из YSON списка.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также примеры комбинирования YSON-функций в &lt;a href=\"https://yql.yandex-team.ru/Tutorial/yt_17_Yson_and_Json\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;tutorial&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"primery\"&gt;&lt;a href=\"ru/yql/udf/list/yson.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$node = Json(@@\n  {\"abc\": {\"def\": 123, \"ghi\": \"привет\"}}\n@@);\nSELECT Yson::SerializeText($node.abc) AS `yson`;\n-- {\"def\"=123;\"ghi\"=\"\\xD0\\xBF\\xD1\\x80\\xD0\\xB8\\xD0\\xB2\\xD0\\xB5\\xD1\\x82\"}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"127\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-127\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-127\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-127.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$node = Yson(@@\n  &amp;lt;a=z;x=y&amp;gt;[\n    {abc=123; def=456};\n    {abc=234; xyz=789};\n  ]\n@@);\n$attrs = Yson::YPath($node, \"/@\");\n\nSELECT\n  ListMap(Yson::ConvertToList($node), ($x) -&amp;gt; { return Yson::LookupInt64($x, \"abc\") }) AS abcs,\n  Yson::ConvertToStringDict($attrs) AS attrs,\n  Yson::SerializePretty(Yson::Lookup($node, \"7\", Yson::Options(false AS Strict))) AS miss;\n\n/*\n- abcs: `[123; 234]`\n- attrs: `{\"a\"=\"z\";\"x\"=\"y\"}`\n- miss: `NULL`\n*/\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"128\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-128\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-128\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-128.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"ysonparse\"&gt;&lt;a href=\"ru/yql/udf/list/yson.html#ysonparse\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::Parse...&lt;/span&gt;&lt;/a&gt;Yson::Parse...&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::Parse(Yson{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;'Yson2.Node'&amp;gt;\nYson::ParseJson(Json{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;'Yson2.Node'&amp;gt;\nYson::ParseJsonDecodeUtf8(Json{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;'Yson2.Node'&amp;gt;\n\nYson::Parse(String{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;'Yson2.Node'&amp;gt;? -- принимает YSON в любом формате\nYson::ParseJson(String{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;'Yson2.Node'&amp;gt;?\nYson::ParseJsonDecodeUtf8(String{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;'Yson2.Node'&amp;gt;?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"132\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-132\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-132\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-132.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Результат всех трёх функций является несериализуемым: его можно только передать на вход другой функции из библиотеки Yson, но нельзя сохранить в таблицу или вернуть на клиент в результате операции — попытка так сделать приведет к ошибке типизации. Также запрещено возвращать его за пределы &lt;a href=\"ru/yql/syntax/select/index.html\"&gt;подзапросов&lt;/a&gt;: если это требуется, то надо вызвать &lt;a href=\"ru/yql/udf/list/yson.html#ysonserialize\"&gt;Yson::Serialize&lt;/a&gt;, а оптимизатор уберёт лишнюю сериализию и десериализацию, если материализация в конечном счёте не потребуется.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Функция &lt;code&gt;Yson::ParseJsonDecodeUtf8&lt;/code&gt; ожидает, что символы, выходящие за пределы ASCII, должны быть дополнительно заэкранированы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"ysonfrom\"&gt;&lt;a href=\"ru/yql/udf/list/yson.html#ysonfrom\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::From&lt;/span&gt;&lt;/a&gt;Yson::From&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::From(T) -&amp;gt; Resource&amp;lt;'Yson2.Node'&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"149\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-149\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-149\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-149.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code&gt;Yson::From&lt;/code&gt; является полиморфной функцией, преобразующей в Yson ресурс большинство примитивных типов данных и контейнеров (списки, словари, кортежи, структуры и т.п.). Тип исходного объекта должен быть совместим с Yson. Например, в ключах словарей допустимы только типы &lt;code&gt;String&lt;/code&gt; или &lt;code&gt;Utf8&lt;/code&gt;, а вот &lt;code&gt;String?&lt;/code&gt; или &lt;code&gt;Utf8?&lt;/code&gt; уже нет.&lt;/p&gt;\n&lt;h4 id=\"primer\"&gt;&lt;a href=\"ru/yql/udf/list/yson.html#primer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Yson::Serialize(Yson::From(TableRow())) FROM table1;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"156\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-156\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-156\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-156.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"ysonwithattributes\"&gt;&lt;a href=\"ru/yql/udf/list/yson.html#ysonwithattributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::WithAttributes&lt;/span&gt;&lt;/a&gt;Yson::WithAttributes&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::WithAttributes(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;'Yson2.Node'&amp;gt;?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"160\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-160\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-160\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-160.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Добавляет к узлу Yson (первый аргумент) атрибуты (второй аргумент). Атрибуты должны представлять из себя узел map.&lt;/p&gt;\n&lt;h2 id=\"ysonequals\"&gt;&lt;a href=\"ru/yql/udf/list/yson.html#ysonequals\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::Equals&lt;/span&gt;&lt;/a&gt;Yson::Equals&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::Equals(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Bool\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"167\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-167\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-167\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-167.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Проверка деревьев в памяти на равенство, толерантная к исходному формату сериализации и порядку перечисления ключей в словарях.&lt;/p&gt;\n&lt;h2 id=\"ysongethash\"&gt;&lt;a href=\"ru/yql/udf/list/yson.html#ysongethash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::GetHash&lt;/span&gt;&lt;/a&gt;Yson::GetHash&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::GetHash(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint64\n&lt;/code&gt;&lt;/pre&gt;\n\n ode'&amp;gt;{Flags:AutoMap}) -&amp;gt; bool\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"181\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-181\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-181\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-181.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Проверка, что текущий узел имеет соответствующий тип. Entity это &lt;code&gt;#&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"ysongetlength\"&gt;&lt;a href=\"ru/yql/udf/list/yson.html#ysongetlength\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::GetLength&lt;/span&gt;&lt;/a&gt;Yson::GetLength&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::GetLength(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint64?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"188\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-188\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-188\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-188.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Получение числа элементов в списке или словаре.&lt;/p&gt;\n&lt;h2 id=\"ysonconvertto\"&gt;&lt;a href=\"ru/yql/udf/list/yson.html#ysonconvertto\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::ConvertTo...&lt;/span&gt;&lt;/a&gt;Yson::ConvertTo...&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::ConvertTo(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, Type&amp;lt;T&amp;gt;) -&amp;gt; T\nYson::ConvertToBool(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Bool?\nYson::ConvertToInt64(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Int64?\nYson::ConvertToUint64(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint64?\nYson::ConvertToDouble(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Double?\nYson::ConvertToString(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; String?\nYson::ConvertToList(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; List&amp;lt;Resource&amp;lt;'Yson2.Node'&amp;gt;&amp;gt;\nYson::ConvertToBoolList(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; List&amp;lt;Bool&amp;gt;\nYson::ConvertToInt64List(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; List&amp;lt;Int64&amp;gt;\nYson::ConvertToUint64List(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; List&amp;lt;Uint64&amp;gt;\nYson::ConvertToDoubleList(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; List&amp;lt;Double&amp;gt;\nYson::ConvertToStringList(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; List&amp;lt;String&amp;gt;\nYson::ConvertToDict(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Dict&amp;lt;String,Resource&amp;lt;'Yson2.Node'&amp;gt;&amp;gt;\nYson::ConvertToBoolDict(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Dict&amp;lt;String,Bool&amp;gt;\nYson::ConvertToInt64Dict(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Dict&amp;lt;String,Int64&amp;gt;\nYson::ConvertToUint64Dict(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Dict&amp;lt;String,Uint64&amp;gt;\nYson::ConvertToDoubleDict(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Dict&amp;lt;String,Double&amp;gt;\nYson::ConvertToStringDict(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Dict&amp;lt;String,String&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"195\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-195\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-195\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-195.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данные функции по умолчанию не делают неявного приведения типов, то есть значение в аргументе должно в точности соответствовать вызываемой функции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;code&gt;Yson::ConvertTo&lt;/code&gt; является полиморфной функцией, преобразующей Yson ресурс в указанный во втором аргументе тип данных с поддержкой вложенных контейнеров (списки, словари, кортежи, структуры и т.п.).&lt;/p&gt;\n&lt;h4 id=\"primer1\"&gt;&lt;a href=\"ru/yql/udf/list/yson.html#primer1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$data = Yson(@@{\n    \"name\" = \"Anya\";\n    \"age\" = 15u;\n    \"params\" = {\n        \"ip\" = \"95.106.17.32\";\n        \"last_time_on_site\" = 0.5;\n        \"region\" = 213;\n        \"user_agent\" = \"Mozilla/5.0\"\n    }\n}@@);\nSELECT Yson::ConvertTo($data,\n    Struct&amp;lt;\n        name: String,\n        age: Uint32,\n        params: Dict&amp;lt;String,Yson&amp;gt;\n    &amp;gt;\n);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"212\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-212\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-212\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-212.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"ysoncontains\"&gt;&lt;a href=\"ru/yql/udf/list/yson.html#ysoncontains\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::Contains&lt;/span&gt;&lt;/a&gt;Yson::Contains&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::Contains(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Bool?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"216\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-216\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-216\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-216.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Проверяет наличие ключа в словаре. Если тип объекта map, то ищем среди ключей.&lt;br /&gt;\nЕсли тип объекта список, то ключ должен быть десятичным числом - индексом в списке.&lt;/p&gt;\n&lt;h2 id=\"ysonlookup\"&gt;&lt;a href=\"ru/yql/udf/list/yson.html#ysonlookup\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::Lookup...&lt;/span&gt;&lt;/a&gt;Yson::Lookup...&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::Lookup(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Resource&amp;lt;'Yson2.Node'&amp;gt;?\nYson::LookupBool(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Bool?\nYson::LookupInt64(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Int64?\nYson::LookupUint64(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Uint64?\nYson::LookupDouble(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Double?\nYson::LookupString(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; String?\nYson::LookupDict(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Dict&amp;lt;String,Resource&amp;lt;'Yson2.Node'&amp;gt;&amp;gt;?\nYson::LookupList(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; List&amp;lt;Resource&amp;lt;'Yson2.Node'&amp;gt;&amp;gt;?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"223\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-223\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-223\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-223.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Перечисленные выше функции представляют собой краткую форму записи для типичного сценария использования: &lt;code&gt;Yson::YPath&lt;/code&gt; — переход в словарь на один уровень с последующим извлечением значения — &lt;code&gt;Yson::ConvertTo***&lt;/code&gt;. Второй аргумент для всех перечисленных функций — имя ключа в словаре (в отличие от YPath, без префикса &lt;code&gt;/&lt;/code&gt;) или индекс в списке (например, &lt;code&gt;7&lt;/code&gt;). Упрощают запрос и дают небольшой выигрыш в скорости работы.&lt;/p&gt;\n&lt;h2 id=\"ysonypath\"&gt;&lt;a href=\"ru/yql/udf/list/yson.html#ysonypath\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::YPath&lt;/span&gt;&lt;/a&gt;Yson::YPath&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::YPath(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Resource&amp;lt;'Yson2.Node'&amp;gt;?\nYson::YPathBool(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Bool?\nYson::YPathInt64(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Int64?\nYson::YPathUint64(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Uint64?\nYson::YPathDouble(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Double?\nYson::YPathString(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; String?\nYson::YPathDict(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; Dict&amp;lt;String,Resource&amp;lt;'Yson2.Node'&amp;gt;&amp;gt;?\nYson::YPathList(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, String) -&amp;gt; List&amp;lt;Resource&amp;lt;'Yson2.Node'&amp;gt;&amp;gt;?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"230\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-230\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-230\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-230.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Позволяет по входному ресурсу и пути на языке YPath получить ресурс, указывающий на соответствующую пути часть исходного ресурса.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://yt.yandex-team.ru/docs/user-guide/storage/ypath\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Информация по YPath&lt;/a&gt; на странице документации YT.&lt;/p&gt;\n&lt;h2 id=\"ysonattributes\"&gt;&lt;a href=\"ru/yql/udf/list/yson.html#ysonattributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::Attributes&lt;/span&gt;&lt;/a&gt;Yson::Attributes&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::Attributes(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Dict&amp;lt;String,Resource&amp;lt;'Yson2.Node'&amp;gt;&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"240\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-240\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-240\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-240.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Получение всех атрибутов узла в виде словаря.&lt;/p&gt;\n&lt;h2 id=\"ysonserialize\"&gt;&lt;a href=\"ru/yql/udf/list/yson.html#ysonserialize\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::Serialize...&lt;/span&gt;&lt;/a&gt;Yson::Serialize...&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::Serialize(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Yson -- бинарное представление\nYson::SerializeText(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Yson\nYson::SerializePretty(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}) -&amp;gt; Yson -- чтобы увидеть именно текстовый результат, можно обернуть его в ToBytes(...)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"247\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-247\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-247\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-247.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"ysonserializejson\"&gt;&lt;a href=\"ru/yql/udf/list/yson.html#ysonserializejson\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::SerializeJson&lt;/span&gt;&lt;/a&gt;Yson::SerializeJson&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::SerializeJson(Resource&amp;lt;'Yson2.Node'&amp;gt;{Flags:AutoMap}, [Resource&amp;lt;'Yson2.Options'&amp;gt;?, SkipMapEntity:Bool?, EncodeUtf8:Bool?, WriteNanAsString:Bool?]) -&amp;gt; Json?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"251\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-251\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-251\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-251.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;SkipMapEntity&lt;/code&gt; отвечает за сериализацию значений в словарях, имеющих значение &lt;code&gt;#&lt;/code&gt;. На значение атрибутов флаг не влияет. По умолчанию &lt;code&gt;false&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;EncodeUtf8&lt;/code&gt; отвечает за экранирование символов, выходящих за пределы ASCII. По умолчанию &lt;code&gt;false&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;WriteNanAsString&lt;/code&gt; разрешает сериализацию значений &lt;code&gt;NaN&lt;/code&gt; и &lt;code&gt;Inf&lt;/code&gt; в json в виде строк. По умолчанию &lt;code&gt;false&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Типы данных &lt;code&gt;Yson&lt;/code&gt; и &lt;code&gt;Json&lt;/code&gt;, возвращаемые функциями сериализации, представляет собой частный случай строки, про которую известно, что в ней находятся данные в соответствующем формате (Yson/Json).&lt;/p&gt;\n&lt;h2 id=\"ysonoptions\"&gt;&lt;a href=\"ru/yql/udf/list/yson.html#ysonoptions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson::Options&lt;/span&gt;&lt;/a&gt;Yson::Options&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Yson::Options([AutoConvert:Bool?, Strict:Bool?]) -&amp;gt; Resource&amp;lt;'Yson2.Options'&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"275\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-275\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-275\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-275.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Передаётся последним опциональным аргументом (который для краткости не указан) в методы &lt;code&gt;Parse...&lt;/code&gt;, &lt;code&gt;ConvertTo...&lt;/code&gt;, &lt;code&gt;Contains&lt;/code&gt;, &lt;code&gt;Lookup...&lt;/code&gt; и &lt;code&gt;YPath...&lt;/code&gt;, которые принимают результат вызова &lt;code&gt;Yson::Options&lt;/code&gt;. По умолчанию все поля &lt;code&gt;Yson::Options&lt;/code&gt; выключены (false), а при включении (true) модифицируют поведение следующим образом:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;AutoConvert&lt;/strong&gt; — если переданное в Yson значение не в точности соответствует типу данных результата, то значение будет по возможности сконвертировано. Например, &lt;code&gt;Yson::ConvertToInt64&lt;/code&gt; в этом режиме будет делать Int64 даже из чисел типа Double.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Strict&lt;/strong&gt; — по умолчанию все функции из библиотеки Yson возвращают ошибку в случае проблем в ходе выполнения запроса (например, попытка парсинга строки не являющейся Yson/Json, или попытка поиска по ключу в скалярном типе, или запрошено преобразование в несовместимый тип данных, и т.п.), а если отключить строгий режим, то вместо ошибки в большинстве случаев будет возвращаться &lt;code&gt;NULL&lt;/code&gt;. При преобразовании в словарь или список (&lt;code&gt;ConvertTo&amp;lt;Type&amp;gt;Dict&lt;/code&gt; или &lt;code&gt;ConvertTo&amp;lt;Type&amp;gt;List&lt;/code&gt;) плохие элементы будут выброшены из полученной коллекции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primer2\"&gt;&lt;a href=\"ru/yql/udf/list/yson.html#primer2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$yson = @@{y = true; x = 5.5}@@y;\nSELECT Yson::LookupBool($yson, \"z\"); --- null\nSELECT Yson::LookupBool($yson, \"y\"); --- true\n\n-- SELECT Yson::LookupInt64($yson, \"x\"); --- Ошибка\nSELECT Yson::LookupInt64($yson, \"x\", Yson::Options(false as Strict)); --- null\nSELECT Yson::LookupInt64($yson, \"x\", Yson::Options(true as AutoConvert)); --- 5\n\n-- SELECT Yson::ConvertToBoolDict($yson); --- Ошибка\nSELECT Yson::ConvertToBoolDict($yson, Yson::Options(false as Strict)); --- { \"y\": true }\nSELECT Yson::ConvertToDoubleDict($yson, Yson::Options(false as Strict)); --- { \"x\": 5.5 }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"294\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-294\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-294\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-294.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если во всём запросе требуется применять одинаковые значения настроек библиотеки Yson, то удобнее воспользоваться &lt;a href=\"ru/yql/syntax/pragma/yson.html#ysonautoconvert\"&gt;PRAGMA yson.AutoConvert;&lt;/a&gt; и/или &lt;a href=\"ru/yql/syntax/pragma/yson.html#ysonstrict\"&gt;PRAGMA yson.Strict;&lt;/a&gt;. Также эти &lt;code&gt;PRAGMA&lt;/code&gt; являются единственным способом повлиять на неявные вызовы библиотеки Yson, которые возникают при работе с типами данных Yson/Json.&lt;/p&gt;\n\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/udf/list/yson.md","sourcePath":"ru/yql/udf/list/yson.md"},"headings":[{"title":"Примеры","href":"ru/yql/udf/list/yson.html#primery","level":2},{"title":"Yson::Parse...","href":"ru/yql/udf/list/yson.html#ysonparse","level":2},{"title":"Yson::From","href":"ru/yql/udf/list/yson.html#ysonfrom","level":2},{"title":"Yson::WithAttributes","href":"ru/yql/udf/list/yson.html#ysonwithattributes","level":2},{"title":"Yson::Equals","href":"ru/yql/udf/list/yson.html#ysonequals","level":2},{"title":"Yson::GetHash","href":"ru/yql/udf/list/yson.html#ysongethash","level":2},{"title":"Yson::Is...","href":"ru/yql/udf/list/yson.html#ysonis","level":2},{"title":"Yson::GetLength","href":"ru/yql/udf/list/yson.html#ysongetlength","level":2},{"title":"Yson::ConvertTo...","href":"ru/yql/udf/list/yson.html#ysonconvertto","level":2},{"title":"Yson::Contains","href":"ru/yql/udf/list/yson.html#ysoncontains","level":2},{"title":"Yson::Lookup...","href":"ru/yql/udf/list/yson.html#ysonlookup","level":2},{"title":"Yson::YPath","href":"ru/yql/udf/list/yson.html#ysonypath","level":2},{"title":"Yson::Attributes","href":"ru/yql/udf/list/yson.html#ysonattributes","level":2},{"title":"Yson::Serialize...","href":"ru/yql/udf/list/yson.html#ysonserialize","level":2},{"title":"Yson::SerializeJson","href":"ru/yql/udf/list/yson.html#ysonserializejson","level":2},{"title":"Yson::Options","href":"ru/yql/udf/list/yson.html#ysonoptions","level":2}],"title":"Yson"},"router":{"pathname":"ru/yql/udf/list/yson","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
