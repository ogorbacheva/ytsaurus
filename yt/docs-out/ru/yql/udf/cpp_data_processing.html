        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h3 id=\"obrabotka-dannyh-v-udf-funkciyah\"&gt;&lt;a href=\"ru/yql/udf/cpp_data_processing.html#obrabotka-dannyh-v-udf-funkciyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обработка данных в UDF-функциях&lt;/span&gt;&lt;/a&gt;Обработка данных в UDF-функциях&lt;/h3&gt;\n&lt;p&gt;Для правильной работы со сложными типами данных, необходимо обработать и сохранить информацию об их структуре. Это делается на этапе формирования сигнатуры udf-функции. Пример класса, который содержит эту информацию&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs cpp\"&gt;&lt;span class=\"hljs-keyword\"&gt;struct&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TInputIndices&lt;/span&gt; {\n        &lt;span class=\"hljs-comment\"&gt;// В эти два поля мы занесем индексы полей в типе Struct. Эти индексы будут использоваться в дальнейшем для того, чтобы по конкретному объекту структуы получить значения ее полей.&lt;/span&gt;\n        ui32 oneInputFieldIndex = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n        ui32 anotherInputFieldIndex = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n\n        &lt;span class=\"hljs-type\"&gt;static&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;constexpr&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;int&lt;/span&gt; FieldsCount = &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;;\n\n        NYql::NUdf::TType* ResultStructType = &lt;span class=\"hljs-literal\"&gt;nullptr&lt;/span&gt;;\n\n        NYql::&lt;span class=\"hljs-function\"&gt;NUdf::TType* &lt;span class=\"hljs-title\"&gt;StructType&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;()&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; &lt;/span&gt;{\n            &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; ResultStructType;\n        }\n\n        &lt;span class=\"hljs-built_in\"&gt;TInputIndices&lt;/span&gt;(NYql::NUdf::IFunctionTypeInfoBuilder&amp;amp; builder) {\n            &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; optionalAnotherInputFieldType = builder.&lt;span class=\"hljs-built_in\"&gt;Optional&lt;/span&gt;()-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Item&lt;/span&gt;(TDataType&amp;lt;TDatetime&amp;gt;::Id).&lt;span class=\"hljs-built_in\"&gt;Build&lt;/span&gt;();\n\n            &lt;span class=\"hljs-comment\"&gt;// После вызова Build, в oneInputFieldIndex и anotherInputFieldIndex окажется индекс соответствующих полей в структуре.&lt;/span&gt;\n            ResultStructType = builder.&lt;span class=\"hljs-built_in\"&gt;Struct&lt;/span&gt;(FieldsCount)\n                                   -&amp;gt;\n                               &lt;span class=\"hljs-built_in\"&gt;AddField&lt;/span&gt;&amp;lt;&lt;span class=\"hljs-type\"&gt;double&lt;/span&gt;&amp;gt;(&lt;span class=\"hljs-string\"&gt;\"oneInputFieldName\"&lt;/span&gt;, &amp;amp;oneInputFieldIndex)\n                                   .\n                               &lt;span class=\"hljs-built_in\"&gt;AddField&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"anotherInputFieldName\"&lt;/span&gt;, optionalAnotherInputFieldType, &amp;amp;anotherInputFieldIndex)\n                                   .\n                               &lt;span class=\"hljs-built_in\"&gt;Build&lt;/span&gt;();\n        }\n\n        &lt;span class=\"hljs-function\"&gt;TSomeStruct &lt;span class=\"hljs-title\"&gt;UnpackUnboxedValue&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; NYql::NUdf::TUnboxedValue&amp;amp; item)&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; &lt;/span&gt;{\n            TSomeStruct someStruct;\n\n            &lt;span class=\"hljs-comment\"&gt;// Таким образом можно можно использовать индекс, чтобы получить значение конкретного поля.&lt;/span&gt;\n            &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; oneInputFieldIValue = item.&lt;span class=\"hljs-built_in\"&gt;GetElement&lt;/span&gt;(oneInputFieldIndex);\n            &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; anotherInputFieldIValue = item.&lt;span class=\"hljs-built_in\"&gt;GetElement&lt;/span&gt;(anotherInputFieldIndex);\n\n            ...\n\n            &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; someStruct;\n        }\n    };\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Для формирования типа входных данных понадобится &lt;code&gt;IFunctionTypeInfoBuilder&lt;/code&gt;.&lt;br /&gt;\nДанный интерфейс поддерживает генерацию сложных типов, таких как структуры, списки, словари и т.д.&lt;br /&gt;\nДопустим на вход подается структура, содержащая два поля - &lt;code&gt;\"oneInputField\"&lt;/code&gt; типа &lt;code&gt;Double&lt;/code&gt; и &lt;code&gt;\"anotherInputField\"&lt;/code&gt; типа &lt;code&gt;TDatetime?&lt;/code&gt;. С помощью билдера &lt;code&gt;IFunctionTypeInfoBuilder&lt;/code&gt;, создается optional-тип для второго поля и создается тип структуры, который заполняется нужными полями.&lt;/p&gt;\n&lt;p&gt;Объявление типа структуры просиходит с помощью билдера через вызов метода &lt;code&gt;Struct(num_of_fields)&lt;/code&gt;. Под капотом, структура в YQL UDF представляется как обычный массив из значений полей.&lt;/p&gt;\n&lt;p&gt;Добавление полей осуществляется с помощью метода &lt;code&gt;AddField&lt;/code&gt; возвращаемого интерфейса для работы со структурами.&lt;br /&gt;\nПосле выполнения метода Build(), переменные &lt;code&gt;oneInputFieldIndex&lt;/code&gt; и &lt;code&gt;anotherInputFieldIndex&lt;/code&gt; будут содержать индексы, по которым во входном массиве данных буду расположены данные конкретного поля. С их помощью можно получить значение конкретного поля из входного массива данных, как это сделано в методе &lt;code&gt;UnpackUnboxedValue&lt;/code&gt; в примере выше.&lt;/p&gt;\n&lt;p&gt;Далее этот класс можно использовать в методе &lt;code&gt;Run&lt;/code&gt; udf-функции для распаковки&lt;br /&gt;\nвходных данных с помощью метода &lt;code&gt;UnpackUnboxedValue&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Для упаковки результатов работы вашей udf можно использовать такие же классы для&lt;br /&gt;\nхранения информации уже о выходных данных. Например:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs cpp\"&gt;&lt;span class=\"hljs-keyword\"&gt;struct&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TOutputIndices&lt;/span&gt; {\n    ui32 firstOutputFieldIndex = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n    ui32 secondOutputFieldIndex = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n    ui32 thirdOutputFieldIndex = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n\n    &lt;span class=\"hljs-type\"&gt;static&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;constexpr&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;int&lt;/span&gt; FieldsCount = &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;;\n\n    NYql::NUdf::TType* ResultStructType = &lt;span class=\"hljs-literal\"&gt;nullptr&lt;/span&gt;;\n\n    NYql::&lt;span class=\"hljs-function\"&gt;NUdf::TType* &lt;span class=\"hljs-title\"&gt;StructType&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;()&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; &lt;/span&gt;{\n        &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; ResultStructType;\n    }\n\n    &lt;span class=\"hljs-built_in\"&gt;TOutputIndices&lt;/span&gt;(NYql::NUdf::IFunctionTypeInfoBuilder&amp;amp; builder) {\n        &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; thirdOutputFieldType = builder.&lt;span class=\"hljs-built_in\"&gt;List&lt;/span&gt;()-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Item&lt;/span&gt;(TDataType&amp;lt;ui32&amp;gt;::Id).&lt;span class=\"hljs-built_in\"&gt;Build&lt;/span&gt;()\n\n        ResultStructType =\n            builder.&lt;span class=\"hljs-built_in\"&gt;Struct&lt;/span&gt;(FieldsCount)\n                  -&amp;gt;\n            &lt;span class=\"hljs-built_in\"&gt;AddField&lt;/span&gt;&amp;lt;ui32&amp;gt;(&lt;span class=\"hljs-string\"&gt;\"firstOutputFieldName\"&lt;/span&gt;, &amp;amp;firstOutputFieldIndex)\n                  .\n            &lt;span class=\"hljs-built_in\"&gt;AddField&lt;/span&gt;&amp;lt;&lt;span class=\"hljs-type\"&gt;char&lt;/span&gt;*&amp;gt;(&lt;span class=\"hljs-string\"&gt;\"secondOutputFieldName\"&lt;/span&gt;, &amp;amp;secondOutputFieldIndex)\n                  .\n            &lt;span class=\"hljs-built_in\"&gt;AddField&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"thirdOutputFieldName\"&lt;/span&gt;, thirdOutputFieldType, &amp;amp;thirdOutputFieldIndex);\n                  .\n            &lt;span class=\"hljs-built_in\"&gt;Build&lt;/span&gt;();\n    }\n\n    NYql::&lt;span class=\"hljs-function\"&gt;NUdf::TUnboxedValue &lt;span class=\"hljs-title\"&gt;PackUnboxedValue&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; NYql::NUdf::IValueBuilder* valueBuilder, ui32 valueForFirstField, &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TString&amp;amp; valueForSecondField, std::vector&amp;lt;ui32&amp;gt; valuesForThirdField)&lt;/span&gt; &lt;/span&gt;{\n        &lt;span class=\"hljs-comment\"&gt;// Обратите внимание на то, что происходит в этом месте. Здесь ДВА выходных параметра: result - это то что вам надо будет вернуть. А вот в elemItems будет записан указатель на массив, в который вам нужно занести значения полей.&lt;/span&gt;\n        TUnboxedValue* elemItems = &lt;span class=\"hljs-literal\"&gt;nullptr&lt;/span&gt;;\n        &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; result = valueBuilder-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;NewArray&lt;/span&gt;(FieldsCount, elemItems);\n\n        &lt;span class=\"hljs-comment\"&gt;// Заполняем значения для полей&lt;/span&gt;\n        elemItems[firstOutputFieldIndex] = &lt;span class=\"hljs-built_in\"&gt;TUnboxedValuePod&lt;/span&gt;(valueForFirstField);\n        elemItems[secondOutputFieldIndex] = valueBuilder-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;NewString&lt;/span&gt;(valueForSecondField);\n\n        std::vector&amp;lt;TUnboxedValue&amp;gt; thirdFieldItems;\n        thirdFieldItems.&lt;span class=\"hljs-built_in\"&gt;reserve&lt;/span&gt;(valuesForThirdField.&lt;span class=\"hljs-built_in\"&gt;size&lt;/span&gt;());\n\n        &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; (&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; value : valuesForThirdField) {\n            TUnboxedValue yqlValue = &lt;span class=\"hljs-built_in\"&gt;TUnboxedValuePod&lt;/span&gt;(value);\n\n            &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; (yqlValue) {\n                thirdFieldItems.&lt;span class=\"hljs-built_in\"&gt;push_back&lt;/span&gt;(std::&lt;span class=\"hljs-built_in\"&gt;move&lt;/span&gt;(yqlValue));\n            }\n        }\n\n        &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; thirdFieldValueHandler = valueBuilder-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;NewList&lt;/span&gt;(thirdFieldItems.&lt;span class=\"hljs-built_in\"&gt;data&lt;/span&gt;(),\n                                                            thirdFieldItems.&lt;span class=\"hljs-built_in\"&gt;size&lt;/span&gt;());\n\n        elemItems[thirdOutputFieldIndex] = thirdFieldValueHandler;\n\n        &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; result;\n    }\n};\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"22\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-22\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-22\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-22.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Формирование типа выходной структуры данных ничем не отличается от формирования типа входной структуры - так же нужно объявить поля структуры и сохранить их индексы для последующего заполнения выходного массива данных. В примере выше эта структура будет состоять из трех поле: одно поле будет иметь примитивный числовой тип, другое представляет собой строку, а третье - список. Для создания типа списка, нужно воспользоваться методом &lt;code&gt;List()&lt;/code&gt; интерфейса &lt;code&gt;NYql::NUdf::IFunctionTypeInfoBuilder&lt;/code&gt;. Этот метод вернет указатель на интерфейс, позволяющий создать тип списка. Указание типа элементов списка происходит через метод &lt;code&gt;Item(type)&lt;/code&gt;. Таким образом, кроме списков можно создавать словари, структуры, кортежи и т.д.&lt;/p&gt;\n&lt;p&gt;Формирование выходного массива данных происходит с помощью &lt;code&gt;NYql::NUdf::IValueBuilder&lt;/code&gt; и его метода &lt;code&gt;NewArray&lt;/code&gt;, который принимает на вход количество выходных элкметов + ссылку на указатель, а возвращает TUnboxedValue описывающий объект целиком + заполняет значением переданный указатель, с помощью которого будет происходить дальнейшее заполнение массива.&lt;/p&gt;\n&lt;p&gt;Данный метод возвращает &lt;code&gt;NYql::NUdf::TUnboxedValue&lt;/code&gt;, который нужно вернуть после заполнения выходного массива необходимыми значениями. Важно понимать, что для заполнения выходного массива нужно использовать именно тот указатель,&lt;br /&gt;\nкоторый метод заполнил, а не то, что он вернул. При заполнении массива конкретным значением для конкретного поля, нужно использовать те индексы, которые ассоциированны с данным полем на этапе формирования типа выходных данных.&lt;/p&gt;\n&lt;p&gt;Если возвращаемое значение является примитивным числовым типом, то это значение можно просто обернуть в &lt;code&gt;TUnboxedValuePod&lt;/code&gt; и положить это значение по соответствующему индексу.&lt;/p&gt;\n&lt;p&gt;Если возвращаемое значение является строкой, то необходимо воспользоваться методом &lt;code&gt;NewString&lt;/code&gt; интерфейса &lt;code&gt;NYql::NUdf::IValueBuilder&lt;/code&gt;, в который передать нужную строку.&lt;/p&gt;\n&lt;p&gt;Если возвращаемое значение является, например, списком, то необходимо создать массив значений &lt;code&gt;TUnboxedValue&lt;/code&gt;, заполнить его, а затем передать его размер и указатель в метод &lt;code&gt;NewList&lt;/code&gt; интерфейса &lt;code&gt;NYql::NUdf::IValueBuilder&lt;/code&gt;. Данный метод вернет &lt;code&gt;TUnboxedValue&lt;/code&gt;, который можно положить в выходной массив по соответствующему данному полю индексу.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/udf/cpp_data_processing.md","sourcePath":"ru/yql/udf/cpp_data_processing.md"},"headings":[],"title":""},"router":{"pathname":"ru/yql/udf/cpp_data_processing","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
