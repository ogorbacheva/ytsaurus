        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"izmeneniya-v-versiyah-yql\"&gt;&lt;a href=\"ru/yql/changelog/index.html#izmeneniya-v-versiyah-yql\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Изменения в версиях YQL&lt;/span&gt;&lt;/a&gt;Изменения в версиях YQL&lt;/h2&gt;\n&lt;p&gt;Этот раздел содержит список изменений в различных версиях YQL&lt;/p&gt;\n&lt;h2 id=\"obshee-opisanie-versij-yql\"&gt;&lt;a href=\"ru/yql/changelog/index.html#obshee-opisanie-versij-yql\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общее описание версий YQL&lt;/span&gt;&lt;/a&gt;Общее описание версий YQL&lt;/h2&gt;\n&lt;p&gt;Цель версионирования языка — контролируемая и безопасная для пользователей эволюция языка, в рамках которой можно:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;добавлять новые фичи;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;менять значения по умолчанию у прагм или выполнять другие не обратно совместимые изменения;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;удалять устаревшие фичи.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Стартовая версия языка — &lt;code&gt;2025.01&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Раз в год выпускается новая версия языка, именуемая как &lt;code&gt;YEAR.X&lt;/code&gt;, например &lt;code&gt;2025.01&lt;/code&gt;. Другие версии в тот же год будут увеличивать младший номер версии (&lt;code&gt;YEAR.02&lt;/code&gt; и т. п.).&lt;/p&gt;\n&lt;p&gt;Для каждой версии вида &lt;code&gt;YEAR.X&lt;/code&gt; &lt;strong&gt;гарантируется ее поддержка в течение трех лет с сохранением семантики и багфиксами&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;При выходе версии &lt;code&gt;YEAR+2.1&lt;/code&gt; выдается предупреждение для всех версий вида &lt;code&gt;YEAR.X&lt;/code&gt; о том, что они скоро перестанут поддерживаться.&lt;/p&gt;\n&lt;p&gt;При выходе версии &lt;code&gt;YEAR+3.1&lt;/code&gt; выдается предупреждение для всех версий вида &lt;code&gt;YEAR.X&lt;/code&gt; о том, что они не поддерживаются и выполнение запросов не гарантируется.&lt;/p&gt;\n&lt;p&gt;При указании версии &lt;code&gt;YEAR.X&lt;/code&gt; большей, чем доступно в некотором сервисе/библиотеке/инструменте на текущий момент, выдается ошибка запроса.&lt;/p&gt;\n&lt;p&gt;При релизе каждой версии в changelog-е в документации указываются изменения, вошедшие в эту версию и рекомендации по миграции.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/changelog/index.md","sourcePath":"ru/yql/changelog/index.md"},"headings":[{"title":"Изменения в версиях YQL","href":"ru/yql/changelog/index.html#izmeneniya-v-versiyah-yql","level":2},{"title":"Общее описание версий YQL","href":"ru/yql/changelog/index.html#obshee-opisanie-versij-yql","level":2}],"title":""},"router":{"pathname":"ru/yql/changelog/index","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
