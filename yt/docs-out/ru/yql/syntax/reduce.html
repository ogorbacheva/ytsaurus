            {"data":{"leading":false,"html":"&lt;p&gt;Выполняет группировку входа по указанным ключевым столбцам, затем передаёт текущие ключи и ленивый итератор соответствующих им значений из остальных колонок на обработку в указанную UDF. По аналогии с &lt;code&gt;PROCESS&lt;/code&gt; UDF может вернуть произвольное количество строк результата на каждый вызов, а также возвращать альтернативы (&lt;code&gt;Variant&lt;/code&gt;) для создания множества выходов. В терминах MapReduce очень близок к Reduce.&lt;/p&gt;\n&lt;p&gt;Указываемые следом ключевые слова:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;PRESORT&lt;/code&gt; (опционально) — указание порядка внутри каждой группы, синтаксис аналогичен &lt;a href=\"ru/yql/syntax/select/order_by.html\"&gt;ORDER BY&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ON&lt;/code&gt; (обязательно) — указание ключевых столбцов;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;USING&lt;/code&gt; или &lt;code&gt;USING ALL&lt;/code&gt; (обязательно) — вызов UDF, о правилах подробнее ниже.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Правила передачи аргументов UDF:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Если аргументом UDF указан &lt;code&gt;TableRows()&lt;/code&gt;, то UDF обязана принимать один аргумент — ленивый итератор по строкам, с точки зрения типов — &lt;code&gt;Stream&amp;lt;Struct&amp;lt;...&amp;gt;&amp;gt;&lt;/code&gt;. В этом случае выходным типом функции может быть только &lt;code&gt;Stream&amp;lt;OutputType&amp;gt;&lt;/code&gt; или &lt;code&gt;List&amp;lt;OutputType&amp;gt;&lt;/code&gt;. Гарантируется, что данные во входном итераторе сгруппированы по ключу и, при необходимости, отсортированы согласно &lt;code&gt;PRESORT&lt;/code&gt; секции. С &lt;code&gt;TableRows()&lt;/code&gt; можно использовать только &lt;code&gt;USING ALL&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;При использовании &lt;code&gt;USING&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;UDF обязана принимать два аргумента: в первый передаётся текущий ключ, а во второй — ленивый итератор с соответствующими этому ключу значениями.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;При использовании &lt;code&gt;USING ALL&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;UDF обязана принимать один аргумент — ленивый итератор кортежей (&lt;code&gt;Tuple&lt;/code&gt;), где первый элемент кортежа это ключ, а второй — ленивый итератор с соответствующими этому ключу значениями.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Ключ для передачи в UDF формируется по следующему правилу. Если ключевая колонка одна, то её значение формирует ключ как есть, если несколько (список колонок указывается по аналогии с &lt;code&gt;GROUP BY&lt;/code&gt; через запятую), то ключ будет формироваться как кортеж (&lt;code&gt;Tuple&lt;/code&gt;) со значениями из перечисленных колонок в указанном порядке.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;При вызове &lt;code&gt;REDUCE&lt;/code&gt; в запросе в круглых скобках после имени UDF указываются только выражение, значения которого будут переданы в качестве элементов итератора (второй аргумент UDF для &lt;code&gt;USING&lt;/code&gt; или второй элемент кортежа для &lt;code&gt;USING ALL&lt;/code&gt;).&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Результат формируется аналогичным &lt;a href=\"ru/yql/syntax/process.html\"&gt;PROCESS&lt;/a&gt; образом. Также доступно ключевое слово &lt;code&gt;TableRow()&lt;/code&gt; для получения строки целиком в виде структуры.&lt;/p&gt;\n&lt;p&gt;В &lt;code&gt;REDUCE&lt;/code&gt; можно передать несколько входов (под входом здесь подразумевается таблица, &lt;a href=\"ru/yql/syntax/select/concat.html\"&gt;диапазон таблиц&lt;/a&gt;, подзапрос, &lt;a href=\"ru/yql/syntax/expressions.html#named-nodes\"&gt;именованное выражение&lt;/a&gt;), разделенных запятой. Все входы обязаны иметь указанные в &lt;code&gt;ON&lt;/code&gt; ключевые колонки совпадающего типа. В функцию из &lt;code&gt;USING&lt;/code&gt; в этом случае можно передать только специальное именованное выражение &lt;code&gt;TableRow()&lt;/code&gt;. Второй аргумент (или второй элемент кортежа для &lt;code&gt;USING ALL&lt;/code&gt;) будет содержать ленивый итератор альтернатив с заполненным элементом, соответствущим номеру входа текущей записи.&lt;/p&gt;\n&lt;p&gt;После &lt;code&gt;USING&lt;/code&gt; в &lt;code&gt;REDUCE&lt;/code&gt; можно опционально указать &lt;code&gt;ASSUME ORDER BY&lt;/code&gt; со списком столбцов. Результат такого &lt;code&gt;REDUCE&lt;/code&gt; будет считаться сортированным, но без выполнения фактической сортировки. Проверка сортированности осуществляется на этапе исполнения запроса. Поддерживается задание порядка сортировки с помощью ключевых слов &lt;code&gt;ASC&lt;/code&gt; (по возрастанию) и &lt;code&gt;DESC&lt;/code&gt; (по убыванию). Выражения в &lt;code&gt;ASSUME ORDER BY&lt;/code&gt; не поддерживается.&lt;/p&gt;\n&lt;h2 id=\"primery\"&gt;&lt;a href=\"ru/yql/syntax/reduce.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;REDUCE my_table\nON key, subkey\nUSING MyUdf::MyReducer(TableRow());\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"79\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-79\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-79\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-79.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;REDUCE my_table\nON key, subkey\nUSING ALL MyUdf::MyStreamReducer(TableRow()); -- MyUdf::MyStreamReducer принимает на вход ленивый список кортежей (ключ, список записей для ключа)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"80\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-80\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-80\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-80.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;REDUCE my_table\nPRESORT LENGTH(subkey) DESC\nON key\nUSING MyUdf::MyReducer(\n    AsTuple(subkey, value)\n);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"81\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-81\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-81\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-81.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;REDUCE my_table\nON key\nUSING ALL MyUdf::MyFlatStreamReducer(TableRows()); -- MyUdf::MyFlatStreamReducer принимает на вход единый ленивый список записей\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"82\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-82\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-82\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-82.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;-- Функция возвращает альтернативы\n$udf = Python::MyReducer(Callable&amp;lt;(String, Stream&amp;lt;Struct&amp;lt;...&amp;gt;&amp;gt;) -&amp;gt; Variant&amp;lt;Struct&amp;lt;...&amp;gt;, Struct&amp;lt;...&amp;gt;&amp;gt;&amp;gt;,\n    $udfScript\n);\n\n-- На выходе из REDUCE получаем кортеж списков\n$i, $j = (REDUCE my_table ON key USING $udf(TableRow()));\n\nSELECT * FROM $i;\nSELECT * FROM $j;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"83\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-83\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-83\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-83.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$script = @@\ndef MyReducer(key, values):\n    state = None, 0\n    for name, last_visit_time in values:\n        if state[1] &amp;lt; last_visit_time:\n            state = name, last_visit_time\n    return {\n        'region':key,\n        'last_visitor':state[0],\n    }\n@@;\n\n$udf = Python::MyReducer(Callable&amp;lt;(\n    Int64?,\n    Stream&amp;lt;Tuple&amp;lt;String?, Uint64?&amp;gt;&amp;gt;\n) -&amp;gt; Struct&amp;lt;\n    region:Int64?,\n    last_visitor:String?\n&amp;gt;&amp;gt;,\n    $script\n);\n\nREDUCE hahn.`home/yql/tutorial/users`\nON region USING $udf((name, last_visit_time));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"84\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-84\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-84\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-84.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;-- Функция принимает на вход ключ и итератор альтернатив\n$udf = Python::MyReducer(Callable&amp;lt;(String, Stream&amp;lt;Variant&amp;lt;Struct&amp;lt;...&amp;gt;,Struct&amp;lt;...&amp;gt;&amp;gt;&amp;gt;) -&amp;gt; Struct&amp;lt;...&amp;gt;&amp;gt;,\n    $udfScript\n);\n\nREDUCE my_table1, my_table2 ON key USING $udf(TableRow());\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"85\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-85\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-85\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-85.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/syntax/reduce.md","sourcePath":"ru/yql/syntax/reduce.md"},"headings":[{"title":"Примеры","href":"ru/yql/syntax/reduce.html#primery","level":2}],"title":"REDUCE"},"router":{"pathname":"ru/yql/syntax/reduce","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
