        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Позволяет объединить несколько источников данных (подзапросов или таблиц) по равенству значений указанных столбцов или выражений (ключей &lt;code&gt;JOIN&lt;/code&gt;).&lt;/p&gt;\n&lt;h2 id=\"sintaksis\"&gt;&lt;a href=\"ru/yql/syntax/join.html#sintaksis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Синтаксис&lt;/span&gt;&lt;/a&gt;Синтаксис&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT ...    FROM table_1\n-- первый шаг объединения:\n  &amp;lt;Join_Type&amp;gt; JOIN table_2 &amp;lt;Join_Condition&amp;gt;\n  -- исходная выборка -- записи в таблице table_1\n  -- присоединяемая выборка -- записи в таблице table_2\n-- следующий шаг объединения:\n  &amp;lt;Join_Type&amp;gt; JOIN table_n &amp;lt;Join_Condition&amp;gt;\n  -- исходная выборка -- результат объединения на предыдущем шаге\n  -- присоединяемая выборка -- записи в таблице table_n\n-- могут быть следующие шаги объединения\n...\nWHERE  ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;На каждом шаге объединения по заданным правилам определяются соответствия между строками исходной и присоединяемой выборок данных, и формируется новая выборка, в которую попадают все сочетания подошедших под условия объединения строк.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Так как колонки в YQL идентифицируются по именам и в выборке не может быть двух колонок с одинаковыми именами, &lt;code&gt;SELECT * FROM ... JOIN ...&lt;/code&gt; не может быть исполнен при наличии колонок с одинаковыми именами в объединяемых таблицах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"tipy-obuedineniya-join_type\"&gt;&lt;a href=\"ru/yql/syntax/join.html#tipy-obuedineniya-join_type\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типы объединения (Join_Type)&lt;/span&gt;&lt;/a&gt;Типы объединения (Join_Type)&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;INNER&lt;/code&gt; &lt;span style=\"color:gray\"&gt;(по умолчанию)&lt;/span&gt; — строки объединяемых выборок, для которых не найдено соответствие ни с одной строкой с другой стороны, не попадут в результат.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;LEFT&lt;/code&gt; — при отсутствии значения в присоединяемой выборке включает строку в результат со значениями колонок из исходной выборки, оставляя пустыми (&lt;code&gt;NULL&lt;/code&gt;) колонки присоединяемой выборки.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;RIGHT&lt;/code&gt; — при отсутствии значения в исходной выборке включает строку в результат со значениям колонок из присоединяемой выборки, оставляя пустыми (&lt;code&gt;NULL&lt;/code&gt;) колонки исходной выборки.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;FULL&lt;/code&gt; = &lt;code&gt;LEFT&lt;/code&gt; + &lt;code&gt;RIGHT&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;LEFT/RIGHT SEMI&lt;/code&gt; — одна сторона выступает как белый список (whitelist) ключей, её значения недоступны. В результат включаются столбцы только из одной таблицы, декартового произведения не возникает.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;LEFT/RIGHT ONLY&lt;/code&gt; — вычитание множеств по ключам (blacklist). Практически эквивалентно добавлению условия &lt;code&gt;IS NULL&lt;/code&gt; на ключ противоположной стороны в обычном &lt;code&gt;LEFT/RIGHT&lt;/code&gt;, но, как и в &lt;code&gt;SEMI&lt;/code&gt;, нет доступа к значениям.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;CROSS&lt;/code&gt; — декартово произведение двух таблиц целиком без указания ключевых колонок, секция с &lt;code&gt;ON/USING&lt;/code&gt; явно не пишется.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;EXCLUSION&lt;/code&gt; — обе стороны минус пересечение.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;img src=\"ru/yql/syntax/_assets/join-YQL-06.png\" alt=\"JOIN\" /&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;code&gt;NULL&lt;/code&gt; является особым значением, которое ничему не равно. Таким образом, значения &lt;code&gt;NULL&lt;/code&gt; с двух сторон не считаются равными друг другу. Это избавляет от неоднозначности в некоторых типах &lt;code&gt;JOIN&lt;/code&gt;, а также от гигантского декартового произведения, которое часто возникает в противном случае.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"usloviya-obuedineniya-join_condition\"&gt;&lt;a href=\"ru/yql/syntax/join.html#usloviya-obuedineniya-join_condition\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Условия объединения (Join_Condition)&lt;/span&gt;&lt;/a&gt;Условия объединения (Join_Condition)&lt;/h2&gt;\n&lt;p&gt;Для &lt;code&gt;CROSS JOIN&lt;/code&gt; условие объединения не указывается. В результат попадёт декартово произведение исходной и присоединяемой выборок, то есть сочетание всех со всеми. Количество строк в результирующей выборке будет произведением количества строк исходной и присоединяемой выборок.&lt;/p&gt;\n&lt;p&gt;Для любых других типов объединения необходимо указать условие одним из двух способов:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;USING (column_name)&lt;/code&gt;. Используется при наличии в исходной и присоединяемой выборках одноименной колонки, равенство значений в которой является условием объединения.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ON (equality_conditions)&lt;/code&gt;. Позволяет задать условие равенства значений колонок или выражений над колонками исходной и присоединяемой выборок, или несколько таких условий, объединенных по &lt;code&gt;and&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"primery\"&gt;&lt;a href=\"ru/yql/syntax/join.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT    a.value as a_value, b.value as b_value\nFROM      a_table AS a\nFULL JOIN b_table AS b USING (key);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"102\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-102\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-102\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-102.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT    a.value as a_value, b.value as b_value\nFROM      a_table AS a\nFULL JOIN b_table AS b ON a.key = b.key;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"103\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-103\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-103\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-103.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT     a.value as a_value, b.value as b_value, c.column2\nFROM       a_table AS a\nCROSS JOIN b_table AS b\nLEFT  JOIN c_table AS c ON c.ref = a.key and c.column1 = b.value;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"104\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-104\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-104\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-104.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Для исключения необходимости в полном сканировании правой присоединяемой таблицы может использоваться вторичный индекс над колонками, входящими в условие соединения. Обращение ко вторичному индексу должно быть указано в явном виде, в формате &lt;code&gt;JOIN table_name VIEW index_name AS table_alias&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Например, создание индекса для использования в условии соединения:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;ALTER TABLE b_table ADD INDEX b_index_ref GLOBAL ON(ref);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"111\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-111\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-111\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-111.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Использование созданного индекса:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT    a.value as a_value, b.value as b_value\nFROM      a_table AS a\nINNER JOIN b_table VIEW b_index_ref AS b ON a.ref = b.ref;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"115\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-115\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-115\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-115.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если в выражении помимо &lt;code&gt;JOIN&lt;/code&gt; выполняется фильтрация данных, то рекомендуется обернуть те условия, про которые известно, что они вернут &lt;code&gt;true&lt;/code&gt; для большинства строк, в вызов функции &lt;code&gt;LIKELY(...)&lt;/code&gt;. Если предположение о преобладании положительных значений в условии окажется верно, такая подсказка может положительно сказаться на времени выполнения запроса. Также &lt;code&gt;LIKELY&lt;/code&gt; может быть полезен в том случае, когда вычисление предиката ресурсоёмко и при этом сам JOIN значительно сокращает число строк.&lt;/p&gt;\n&lt;p&gt;Перед любым источником данных для &lt;code&gt;JOIN&lt;/code&gt; можно указать ключевое слово &lt;code&gt;ANY&lt;/code&gt;, которое служит для подавления дубликатов по ключам &lt;code&gt;JOIN&lt;/code&gt; с соответствующей стороны. В этом случае из множества строк с одинаковым значением ключей &lt;code&gt;JOIN&lt;/code&gt; остается только одна (не уточняется какая именно – отсюда и название &lt;code&gt;ANY&lt;/code&gt;).&lt;br /&gt;\nДанный синтаксис отличается от принятого в &lt;a href=\"https://clickhouse.tech/docs/ru/sql-reference/statements/select/join/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ClickHouse&lt;/a&gt;, где &lt;code&gt;ANY&lt;/code&gt; пишется перед типом &lt;code&gt;JOIN&lt;/code&gt; и работает только для правой стороны.&lt;/p&gt;\n&lt;p&gt;Запрос&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$t1 = AsList(\n    AsStruct(\"1\" AS key, \"v111\" AS value),\n    AsStruct(\"2\" AS key, \"v121\" AS value),\n    AsStruct(\"2\" AS key, \"v122\" AS value),\n    AsStruct(\"3\" AS key, \"v131\" AS value),\n    AsStruct(\"3\" AS key, \"v132\" AS value));\n\n$t2 = AsList(\n    AsStruct(\"2\" AS key, \"v221\" AS value),\n    AsStruct(\"2\" AS key, \"v222\" AS value),\n    AsStruct(\"3\" AS key, \"v231\" AS value),\n    AsStruct(\"3\" AS key, \"v232\" AS value),\n    AsStruct(\"4\" AS key, \"v241\" AS value));\n\nSELECT\n  a.key, a.value, b.value\nFROM ANY AS_TABLE($t1) AS a\nJOIN ANY AS_TABLE($t2) AS b\nON a.key == b.key;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"125\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-125\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-125\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-125.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;выдаст:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;a.key&lt;/th&gt;\n&lt;th&gt;a.value&lt;/th&gt;\n&lt;th&gt;b.value&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;\"3\"&lt;/td&gt;\n&lt;td&gt;\"v131\"&lt;/td&gt;\n&lt;td&gt;\"v231\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\"2\"&lt;/td&gt;\n&lt;td&gt;\"v121\"&lt;/td&gt;\n&lt;td&gt;\"v221\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;а без &lt;code&gt;ANY&lt;/code&gt; выдал бы:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;a.key&lt;/th&gt;\n&lt;th&gt;a.value&lt;/th&gt;\n&lt;th&gt;b.value&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;\"3\"&lt;/td&gt;\n&lt;td&gt;\"v131\"&lt;/td&gt;\n&lt;td&gt;\"v231\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\"3\"&lt;/td&gt;\n&lt;td&gt;\"v131\"&lt;/td&gt;\n&lt;td&gt;\"v232\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\"3\"&lt;/td&gt;\n&lt;td&gt;\"v132\"&lt;/td&gt;\n&lt;td&gt;\"v231\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\"3\"&lt;/td&gt;\n&lt;td&gt;\"v132\"&lt;/td&gt;\n&lt;td&gt;\"v232\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\"2\"&lt;/td&gt;\n&lt;td&gt;\"v121\"&lt;/td&gt;\n&lt;td&gt;\"v221\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\"2\"&lt;/td&gt;\n&lt;td&gt;\"v121\"&lt;/td&gt;\n&lt;td&gt;\"v222\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\"2\"&lt;/td&gt;\n&lt;td&gt;\"v122\"&lt;/td&gt;\n&lt;td&gt;\"v221\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\"2\"&lt;/td&gt;\n&lt;td&gt;\"v122\"&lt;/td&gt;\n&lt;td&gt;\"v222\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"strategii-vypolneniya-join-v-ytsaurus\"&gt;&lt;a href=\"ru/yql/syntax/join.html#strategii-vypolneniya-join-v-ytsaurus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стратегии выполнения JOIN в YTsaurus&lt;/span&gt;&lt;/a&gt;Стратегии выполнения JOIN в YTsaurus&lt;/h2&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"ru/yql/syntax/join.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;В стандартном SQL поддерживается следующий синтаксис &lt;code&gt;JOIN&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  ...\nFROM T1 &amp;lt;Join_Type&amp;gt; JOIN T2\nON F(T1, T2);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"285\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-285\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-285\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-285.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;где &lt;code&gt;F(T1, T2)&lt;/code&gt; — произвольный предикат, зависящий от колонок обоих таблиц &lt;code&gt;T1, T2&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В YQL поддерживается только частный случай — когда предикат &lt;code&gt;F&lt;/code&gt; сепарабельный, т. е. имеет следующий вид:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  ...\nFROM T1 &amp;lt;Join_Type&amp;gt; JOIN T2\nON F1(T1) = G1(T2) AND F2(T1) = G2(T2) AND ...;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"292\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-292\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-292\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-292.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Такая структура предиката позволяет эффективно реализовать &lt;code&gt;JOIN&lt;/code&gt; в рамках концепции map-reduce.&lt;/p&gt;\n&lt;p&gt;В YQL, так же как и в стандартном SQL, можно сделать несколько &lt;code&gt;JOIN&lt;/code&gt; в одном SELECT:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  ...\nFROM\nT1 &amp;lt;Join_Type&amp;gt; JOIN T2 ON F1(T1) = G1(T2) AND F2(T1) = G2(T2) AND ...\n   &amp;lt;Join_Type&amp;gt; JOIN T3 ON H1(T1,T2) = J1(T3) AND H2(T1,T2) = J2(T3) AND ...;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"299\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-299\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-299\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-299.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В настоящий момент такие &lt;code&gt;JOIN&lt;/code&gt; выполняются последовательно и именно в том порядка, в котором написано в запросе. Единственным исключением является стратегия StarJoin.&lt;/p&gt;\n&lt;h3 id=\"vychislenie-klyuchej-join\"&gt;&lt;a href=\"ru/yql/syntax/join.html#vychislenie-klyuchej-join\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вычисление ключей JOIN&lt;/span&gt;&lt;/a&gt;Вычисление ключей JOIN&lt;/h3&gt;\n&lt;p&gt;Выполнение &lt;code&gt;JOIN&lt;/code&gt; начинается с вычислениия ключей и сохранения их значений в отдельную колонку. Такое преобразование происходит ещё на уровне SQL парсера и является общим для всех бэкендов (YTsaurus, DQ и т. п.)&lt;/p&gt;\n&lt;p&gt;Фактически, запрос&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  ...\nFROM T1 &amp;lt;Join_Type&amp;gt; JOIN T2\nON F1(T1) = G1(T2) AND F2(T1) = G2(T2) AND ...;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"312\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-312\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-312\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-312.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;преобразуется в:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n...\nFROM (\n    SELECT t.*,\n           F1(...) as _yql_join_key1,\n           F2(...) as _yql_join_key2, ...\n    FROM T1 as t\n) as t1\n&amp;lt;Join_Type&amp;gt; JOIN (\n     SELECT t.*,\n            G1(...) as _yql_join_key1,\n            G2(...) as _yql_join_key2, ...\n    FROM T2 as t\n) as t2\nON t1._yql_join_key1 = t2._yql_join_key1 AND t1._yql_join_key2 = t2._yql_join_key2 AND ...;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"316\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-316\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-316\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-316.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"privedenie-klyuchej-k-prostomu-obshemu-tipu\"&gt;&lt;a href=\"ru/yql/syntax/join.html#privedenie-klyuchej-k-prostomu-obshemu-tipu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Приведение ключей к простому общему типу&lt;/span&gt;&lt;/a&gt;Приведение ключей к простому общему типу&lt;/h3&gt;\n&lt;p&gt;Данная стадия уже является специфичной для YTsaurus. В ней ключевые колонки с обоих сторон приводятся к одинаковому простому типу.&lt;/p&gt;\n&lt;p&gt;Запрос&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  ...\nFROM T1 as t1 &amp;lt;Join_Type&amp;gt; JOIN T2 as t2\nON t1.key1 = t2.key1 AND t1.key2 = t2.key2 AND ...;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"326\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-326\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-326\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-326.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;преобразуется в:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n...\nFROM (\n    SELECT t.*,\n           CastToCommonKeyType(key1) as _yql_join_key1,\n           CastToCommonKeyType(key2) as _yql_join_key2,\n    FROM T1 as t\n) as t1\n&amp;lt;Join_Type&amp;gt; JOIN (\n     SELECT t.*,\n           CastToCommonKeyType(key1) as _yql_join_key1,\n           CastToCommonKeyType(key2) as _yql_join_key2,\n    FROM T2 as t\n) as t2\nON t1._yql_join_key1 = t2._yql_join_key1 AND t1._yql_join_key2 = t2._yql_join_key2 AND ...;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"330\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-330\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-330\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-330.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Приведение к общему типу необходимо для корректной работы map-reduce по ключам родственных, но разных типов.&lt;br /&gt;\nНапример, для ключей типа &lt;code&gt;Int32&lt;/code&gt; и &lt;code&gt;Uint32&lt;/code&gt;, общим типом будет &lt;code&gt;Optional&amp;lt;Int32&amp;gt;&lt;/code&gt;.&lt;br /&gt;\nЕсли конвертацию в общий тип не сделать и оставить исходные колонки в качестве ключевых для map-reduce операций,&lt;br /&gt;\nто YTsaurus будет рассматривать ключи -1 и 4294967295 как равные.&lt;/p&gt;\n&lt;p&gt;Такая конвертация нужна не всегда — например, ключи типов Int32 и Optional работают корректно.&lt;/p&gt;\n&lt;p&gt;Дополнительно, ключи сложного типа (всё, что сложнее Optional от &lt;a href=\"ru/yql/types/primitive.html\"&gt;простого типа&lt;/a&gt;))&lt;br /&gt;\nпосле каста в общий тип ещё и конвертируются в строку:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;\nif (\n    YQL::HasNulls(casted_key), -- если где-то в ключе встречается null\n    null,                      -- то конвертируем значение в null строкового типа (null в SQL не равен никакому значению, в том числе самому себе)\n    StablePickle(casted_key),  -- иначе сериализуем значение в строковое представление\n)\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"340\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-340\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-340\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-340.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Такая конвертация нужна, поскольку ключи сложных типов не поддерживаются в качестве ключей reduce операций в YTsaurus.&lt;/p&gt;\n&lt;p&gt;Таким образом, после всех конвертаций мы получаем c обоих сторон &lt;code&gt;JOIN&lt;/code&gt; ключи попарно одинакового простого типа (с точностью до Optional).&lt;/p&gt;\n&lt;h3 id=\"bazovaya-strategiya-join-aka-commonjoin\"&gt;&lt;a href=\"ru/yql/syntax/join.html#bazovaya-strategiya-join-aka-commonjoin\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Базовая стратегия JOIN (aka CommonJoin)&lt;/span&gt;&lt;/a&gt;Базовая стратегия JOIN (aka CommonJoin)&lt;/h3&gt;\n&lt;p&gt;Базовая стратегия &lt;code&gt;JOIN&lt;/code&gt; выбирается в тех случаях, когда не удаётся применить по каким-либо причинам остальные стратегии &lt;code&gt;JOIN&lt;/code&gt;. Эта стратегия поддерживает все типы &lt;code&gt;JOIN&lt;/code&gt;, включая &lt;code&gt;CROSS JOIN&lt;/code&gt; и реализуется через одну MapReduce операцию.&lt;/p&gt;\n&lt;p&gt;При этом в map стадии происходит:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Приведение ключей к простому общему типу.&lt;/li&gt;\n&lt;li&gt;При наличии модификатора &lt;code&gt;ANY&lt;/code&gt; одинаковые ключи \"прореживаются\" отдельным оконным фильтром – на окне некоторого размера (сотни мегабайт) детектятся строки с одинаковыми ключами и дубликаты отфильтровываются.&lt;/li&gt;\n&lt;li&gt;Обработка нуллов в ключах. При этом для &lt;code&gt;INNER JOIN&lt;/code&gt; нуллы с обоих сторон отфильтровываются, а для &lt;code&gt;LEFT/RIGHT/FULL JOIN&lt;/code&gt; строки с нулевыми ключами идут в отдельную выходную таблицу сразу из map стадии.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Из map стадии строки с одинаковым ключом попадают в одну YTsaurus reduce джобу, в которой и происходит &lt;code&gt;JOIN&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Если необходимо, результирующая таблица из reduce стадии объединяется с выходными таблцами из map стадии с помощью отдельной YTsaurus Merge операции.&lt;/p&gt;\n&lt;p&gt;Чтобы выполнить &lt;code&gt;CROSS JOIN&lt;/code&gt; (в котором ключей нет), на map стадии всем строчкам обоих входных таблиц назначается одинаковый ключ 0.&lt;/p&gt;\n&lt;h3 id=\"strategiya-lookupjoin\"&gt;&lt;a href=\"ru/yql/syntax/join.html#strategiya-lookupjoin\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стратегия LookupJoin&lt;/span&gt;&lt;/a&gt;Стратегия LookupJoin&lt;/h3&gt;\n&lt;p&gt;Данная стратегия срабатывает, когда одна из таблиц сортирована по ключам &lt;code&gt;JOIN&lt;/code&gt;, а вторая имеет очень малый размер (меньше ~900 строк).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Здесь и далее таблица называется &lt;em&gt;сортированной по ключам JOIN&lt;/em&gt;, если список ключей &lt;code&gt;JOIN&lt;/code&gt; является префиксом ключей сортировки для некоторого порядка ключей &lt;code&gt;JOIN&lt;/code&gt;. Например, таблица с ключами &lt;code&gt;JOIN&lt;/code&gt; &lt;code&gt;b, a&lt;/code&gt; и сортировкой по &lt;code&gt;a, b, c&lt;/code&gt; является сортированной по ключам &lt;code&gt;JOIN&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;LookupJoin поддерживается для следующих типов JOIN:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;INNER&lt;/code&gt; (малая таблица может быть с произвольной стороны).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;LEFT SEMI&lt;/code&gt; (малая таблица справа).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;RIGHT SEMI&lt;/code&gt; (малая таблица слева).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Стратегия LookupJoin реализуется через одну Map операцию по большой таблице, при этом малая таблица загружается в память. Типы ключей при этом не обязательно должны совпадать – ключи малой таблицы приводятся (&lt;a href=\"ru/yql/syntax/expressions.html#cast\"&gt;CAST&lt;/a&gt;) к типу ключей в большой таблице.&lt;/p&gt;\n&lt;p&gt;В отличие от стратегии MapJoin (смотрите ниже), в LookupJoin значения ключей &lt;code&gt;JOIN&lt;/code&gt; из малой таблицы попадают в&lt;br /&gt;\nнастройку &lt;code&gt;ranges&lt;/code&gt; в YPath большой таблицы. Таким образом из большой таблицы вычитываются только строки с ключами &lt;code&gt;JOIN&lt;/code&gt;, которые есть в малой таблице.&lt;/p&gt;\n&lt;p&gt;LookupJoin является наиболее эффективной стратегией &lt;code&gt;JOIN&lt;/code&gt;, но налагает самые жёсткие условия на типы &lt;code&gt;JOIN&lt;/code&gt; (они должны быть \"фильтрующими\" по большой таблице) и на размер малой таблицы (ключи должны \"влезать\" в максимально допустимое число &lt;code&gt;ranges&lt;/code&gt; в YPath). Кроме того, в LookupJoin не поддерживается &lt;code&gt;ANY&lt;/code&gt; на стороне большой таблицы.&lt;/p&gt;\n&lt;p&gt;Настройки (PRAGMA) для стратегии:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Название&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytlookupjoinlimit\"&gt;yt.LookupJoinLimit&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;Максимальный размер малой таблицы в байтах (не более 10М)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytlookupjoinmaxrows\"&gt;yt.LookupJoinMaxRows&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;Максимальный размер малой таблицы в строках (не более 1000)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Установка любого из этих значений в 0 приводит к отключению LookupJoin стратегии.&lt;/p&gt;\n&lt;h3 id=\"strategiya-sortedjoin-aka-mergejoin\"&gt;&lt;a href=\"ru/yql/syntax/join.html#strategiya-sortedjoin-aka-mergejoin\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стратегия SortedJoin (aka MergeJoin)&lt;/span&gt;&lt;/a&gt;Стратегия SortedJoin (aka MergeJoin)&lt;/h3&gt;\n&lt;p&gt;Данная стратегия срабатывает, когда обе таблицы сортированы по ключам &lt;code&gt;JOIN&lt;/code&gt;. При этом ключи &lt;code&gt;JOIN&lt;/code&gt; должны совпадать по типам с точностью до Optional на верхнем уровне.&lt;/p&gt;\n&lt;p&gt;Если сортирована только одна таблица, а размер другой не превышает &lt;code&gt;yt.JoinMergeUnsortedFactor * &amp;lt;размер сортированной таблицы&amp;gt;&lt;/code&gt;, стратегия SortedJoin также выбирается, при этом несортированная таблица сортируется отдельной YTsaurus операцией.&lt;/p&gt;\n&lt;p&gt;Значение настройки &lt;a href=\"ru/yql/syntax/pragma/yt.html#ytjoinmergeunsortedfactor\"&gt;&lt;code&gt;yt.JoinMergeUnsortedFactor&lt;/code&gt;&lt;/a&gt; по умолчанию составляет &lt;code&gt;0.2&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Стратегия SortedJoin поддерживает все виды &lt;code&gt;JOIN&lt;/code&gt; кроме &lt;code&gt;CROSS JOIN&lt;/code&gt; и реализуется через одну операцию Reduce. При этом, по возможности используется режим reduce с внешними таблицами. Кроме того, при уникальности ключей &lt;code&gt;JOIN&lt;/code&gt; дополнительно включается настройка &lt;code&gt;enable_key_guarantee = false&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Стратегию SortedJoin можно выбрать принудительно через &lt;a href=\"ru/yql/syntax/lexer.html#sql-hints\"&gt;SQL хинт&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT * FROM T1 AS a JOIN /*+ merge() */ T2 AS b ON a.key = b.key;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"481\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-481\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-481\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-481.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В этом случае (если необходимо):&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Ключи &lt;code&gt;JOIN&lt;/code&gt; будут приведены к общему типу.&lt;/li&gt;\n&lt;li&gt;Обе таблицы будут отсортированы по ключам &lt;code&gt;JOIN&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Настройки (PRAGMA) для стратегии:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Название&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytjoinmergeunsortedfactor\"&gt;&lt;code&gt;yt.JoinMergeUnsortedFactor&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;Смотрите выше&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytjoinmergetableslimit\"&gt;&lt;code&gt;yt.JoinMergeTablesLimit&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;Максимальное количество таблиц на входе &lt;code&gt;JOIN&lt;/code&gt; (при использовании &lt;a href=\"ru/yql/syntax/select/concat.html\"&gt;RANGE,CONCAT&lt;/a&gt; и т. п.)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytjoinmergeusesmallasprimary\"&gt;&lt;code&gt;yt.JoinMergeUseSmallAsPrimary&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;Влияет на выбор primary таблицы при выполнении Reduce операции&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytjoinmergeforce\"&gt;&lt;code&gt;yt.JoinMergeForce&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;Форсирует выбор SortedJoin стратегии для всех &lt;code&gt;JOIN&lt;/code&gt; в запросе&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Установка &lt;code&gt;yt.JoinMergeTablesLimit&lt;/code&gt; в 0 отключает стратегию SortedJoin.&lt;/p&gt;\n&lt;h3 id=\"strategiya-mapjoin\"&gt;&lt;a href=\"ru/yql/syntax/join.html#strategiya-mapjoin\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стратегия MapJoin&lt;/span&gt;&lt;/a&gt;Стратегия MapJoin&lt;/h3&gt;\n&lt;p&gt;Данная стратегия срабатывает, если одна из входных таблиц достаточно маленькая (размером не более чем &lt;a href=\"ru/yql/syntax/pragma/yt.html#ytmapjoinlimit\"&gt;&lt;code&gt;yt.MapJoinLimit&lt;/code&gt;&lt;/a&gt;). При этом меньшая таблица загружается в память (в виде словаря по ключам &lt;code&gt;JOIN&lt;/code&gt;), а затем производится Map по большой таблице.&lt;/p&gt;\n&lt;p&gt;Данная стратегия поддерживает все виды &lt;code&gt;JOIN&lt;/code&gt; (в том числе &lt;code&gt;CROSS&lt;/code&gt;), но не выбирается, если имеется &lt;code&gt;ANY&lt;/code&gt; на большей стороне.&lt;/p&gt;\n&lt;p&gt;Уникальной особенностью MapJoin стратегии является возможность раннего выбора этой стратегии — т. е. когда малая входная таблица уже посчиталась и попадает под ограничения на размер, а большая таблица ещё не готова. В этом случае мы можем сразу выбрать MapJoin, причём есть шанс, что Map операция по большой таблице \"склеится\" с Map операцией (например, фильтром), которая эту большую таблицу готовит.&lt;/p&gt;\n&lt;p&gt;Существует также шардированный вариант MapJoin: малая таблица разбивается на &lt;a href=\"ru/yql/syntax/pragma/yt.html#ytmapjoinshardcount\"&gt;&lt;code&gt;yt.MapJoinShardCount&lt;/code&gt;&lt;/a&gt; частей (каждая часть при этом не должна превышать &lt;code&gt;yt.MapJoinLimit&lt;/code&gt;), каждая часть параллельно и независимо &lt;code&gt;JOIN&lt;/code&gt;-ится с большой таблицей через Map операцию, и затем все полученные части объединяются через YTsaurus Merge.&lt;/p&gt;\n&lt;p&gt;Шардированный MapJoin возможен только для некоторых типов &lt;code&gt;JOIN&lt;/code&gt;: &lt;code&gt;INNER&lt;/code&gt;,&lt;code&gt;CROSS&lt;/code&gt;, &lt;code&gt;LEFT SEMI&lt;/code&gt; при условии, что малая таблица справа уникальна.&lt;/p&gt;\n&lt;p&gt;Настройки (PRAGMA) для стратегии:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Название&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytmapjoinlimit\"&gt;&lt;code&gt;yt.MapJoinLimit&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;Максимальный размер представления в памяти меньшей стороны &lt;code&gt;JOIN&lt;/code&gt;, при котором выбирается стратегия MapJoin&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytmapjoinshardcount\"&gt;&lt;code&gt;yt.MapJoinShardCount&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;Максимальное число шардов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytmapjoinshardminrows\"&gt;&lt;code&gt;yt.MapJoinShardMinRows&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;Минимальное число строк в одном шарде&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Установка &lt;code&gt;yt.MapJoinLimit&lt;/code&gt; в 0 отключает стратегию MapJoin.&lt;/p&gt;\n&lt;h3 id=\"strategiya-starjoin\"&gt;&lt;a href=\"ru/yql/syntax/join.html#strategiya-starjoin\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стратегия StarJoin&lt;/span&gt;&lt;/a&gt;Стратегия StarJoin&lt;/h3&gt;\n&lt;p&gt;Особенностью данной стратегии является то, что она позволяет выполнять сразу несколько последовательных &lt;code&gt;JOIN&lt;/code&gt; через одну операцию Reduce.&lt;/p&gt;\n&lt;p&gt;Стратегия возможна, когда к одной (\"главной\") таблице последовательно через &lt;code&gt;INNER JOIN&lt;/code&gt; или &lt;code&gt;LEFT JOIN&lt;/code&gt; присоединяются таблицы-словари, причём:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Из главной таблицы во всех запросах &lt;code&gt;JOIN&lt;/code&gt; используются одинаковые ключи.&lt;/li&gt;\n&lt;li&gt;Все таблиицы сортированы по ключам &lt;code&gt;JOIN&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Таблицы-словари ещё уникальны по ключам &lt;code&gt;JOIN&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Настройки (PRAGMA) для стратегии:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Название&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytjoinenablestarjoin\"&gt;&lt;code&gt;yt.JoinEnableStarJoin&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;Включает/отключает выбор стратегии StarJoin (включена по умолчанию)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"poryadok-vybora-strategij\"&gt;&lt;a href=\"ru/yql/syntax/join.html#poryadok-vybora-strategij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Порядок выбора стратегий&lt;/span&gt;&lt;/a&gt;Порядок выбора стратегий&lt;/h3&gt;\n&lt;p&gt;При выполнении &lt;code&gt;JOIN&lt;/code&gt; запроса стратегии пробуются в определённом порядке, и выбирается первая подходящая. Порядок при этом следующий:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;StarJoin&lt;/li&gt;\n&lt;li&gt;LookupJoin&lt;/li&gt;\n&lt;li&gt;OrderedJoin&lt;/li&gt;\n&lt;li&gt;MapJoin&lt;/li&gt;\n&lt;li&gt;CommonJoin (всегда возможна)&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/syntax/join.md","sourcePath":"ru/yql/syntax/join.md"},"headings":[{"title":"Синтаксис","href":"ru/yql/syntax/join.html#sintaksis","level":2},{"title":"Типы объединения (Join_Type)","href":"ru/yql/syntax/join.html#tipy-obuedineniya-join_type","level":2},{"title":"Условия объединения (Join_Condition)","href":"ru/yql/syntax/join.html#usloviya-obuedineniya-join_condition","level":2},{"title":"Стратегии выполнения JOIN в YTsaurus","href":"ru/yql/syntax/join.html#strategii-vypolneniya-join-v-ytsaurus","level":2,"items":[{"title":"Введение","href":"ru/yql/syntax/join.html#vvedenie","level":3},{"title":"Вычисление ключей JOIN","href":"ru/yql/syntax/join.html#vychislenie-klyuchej-join","level":3},{"title":"Приведение ключей к простому общему типу","href":"ru/yql/syntax/join.html#privedenie-klyuchej-k-prostomu-obshemu-tipu","level":3},{"title":"Базовая стратегия JOIN (aka CommonJoin)","href":"ru/yql/syntax/join.html#bazovaya-strategiya-join-aka-commonjoin","level":3},{"title":"Стратегия LookupJoin","href":"ru/yql/syntax/join.html#strategiya-lookupjoin","level":3},{"title":"Стратегия SortedJoin (aka MergeJoin)","href":"ru/yql/syntax/join.html#strategiya-sortedjoin-aka-mergejoin","level":3},{"title":"Стратегия MapJoin","href":"ru/yql/syntax/join.html#strategiya-mapjoin","level":3},{"title":"Стратегия StarJoin","href":"ru/yql/syntax/join.html#strategiya-starjoin","level":3},{"title":"Порядок выбора стратегий","href":"ru/yql/syntax/join.html#poryadok-vybora-strategij","level":3}]}],"title":"JOIN"},"router":{"pathname":"ru/yql/syntax/join","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algoli
