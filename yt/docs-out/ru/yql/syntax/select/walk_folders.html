        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Итератор по дереву целевого кластера, с возможностью накопить состояние, обычно список путей к таблицам.&lt;br /&gt;\nДля потомков каждого узла вызываются пользовательские функции, где можно накопить состояние; выбрать атрибуты и узлы для дальнейшего обхода.&lt;/p&gt;\n&lt;p&gt;Указывается как функция &lt;code&gt;WalkFolders&lt;/code&gt; в &lt;a href=\"ru/yql/syntax/select/from.html\"&gt;FROM&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Возвращает одну колонку &lt;code&gt;State&lt;/code&gt; с таким же типом, как и у &lt;code&gt;InitialState&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Обязательные:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Path&lt;/strong&gt; - Путь к начальной директории;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Опциональные:&lt;/p&gt;\n&lt;ol start=\"2\" style=\"--hier-list-start:1\"&gt;\n&lt;li&gt;&lt;strong&gt;InitialState&lt;/strong&gt; (&lt;code&gt;Persistable&lt;/code&gt;). Тип состояния должен быть любым сериализуемым (например, &lt;code&gt;Callable&lt;/code&gt; или &lt;code&gt;Resource&lt;/code&gt; нельзя использовать). По-умолчанию используется &lt;code&gt;ListCreate(String)&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Опциональные именованные:&lt;/p&gt;\n&lt;ol start=\"3\" style=\"--hier-list-start:2\"&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;RootAttributes&lt;/strong&gt; (&lt;code&gt;String&lt;/code&gt;) -  строка со списком интересующих мета-атрибутов через точку с запятой (Пример: &lt;code&gt;\"schema;row_count\"&lt;/code&gt;). По-умолчанию &lt;code&gt;\"\"&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;PreHandler&lt;/strong&gt;  - лямбда, которая вызывается для списка потомков текущей директории после операции List (ссылки еще не зарезолвлены). Принимает список нод, текущее состояние, текущую глубину обхода, возвращает следующее состояние.&lt;/p&gt;\n&lt;p&gt;Сигнатура: &lt;code&gt;(List&amp;lt;Struct&amp;lt;'Path':String, 'Type':String, 'Attributes':Yson&amp;gt;&amp;gt;, TypeOf(InitialState), Int32) -&amp;gt; TypeOf(InitialState)&lt;/code&gt;&lt;br /&gt;\nTypeOf(InitialState) - выведенный тип InitialState.&lt;/p&gt;\n&lt;p&gt;Реализация по-умолчанию: &lt;code&gt;($nodes, $state, $level) -&amp;gt; ($state)&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;ResolveHandler&lt;/strong&gt; - лямбда, которая вызывается после &lt;code&gt;PreHandler&lt;/code&gt;, принимает список ссылок-потомков текущей директории, текущее состояние, список запрошенных атрибутов для директории-предка, текущую глубину обхода. Возвращает &lt;code&gt;Tuple&amp;lt;List&amp;lt;Tuple&amp;lt;String,String&amp;gt;&amp;gt;, TypeOf(InitialState)&amp;gt;&lt;/code&gt; - тапл из списка ссылок, которые нужно посетить с запрашиваемыми мета-атрибутами и следующее состояние. Если ссылка сломана, WalkFolders ее проигнорирует, проверять на это в хендлере не нужно&lt;/p&gt;\n&lt;p&gt;Сигнатура: &lt;code&gt;(List&amp;lt;Struct&amp;lt;'Path':String, 'Type':String, 'Attributes':Yson&amp;gt;&amp;gt;, TypeOf(InitialState), List&amp;lt;String&amp;gt;, Int32) -&amp;gt; Tuple&amp;lt;List&amp;lt;Tuple&amp;lt;String,String&amp;gt;&amp;gt;, TypeOf(InitialState)&amp;gt;&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Реализация по умолчанию:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;-- резловим каждую ссылку, запрашивая те же атрибуты, которые запросили у их предка\n($nodes, $state, $rootAttrList, $level) -&amp;gt; {\n        $linksToVisit = ListMap($nodes, ($node) -&amp;gt; (($node.Path, $rootAttrList)));\n        return ($linksToVisit, $state);\n    }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"59\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-59\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-59\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-59.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;DiveHandler&lt;/strong&gt; - лямбда, которая вызывается после &lt;code&gt;ResolveHandler&lt;/code&gt;, принимает список директорий-потомков текущей директории, текущее состояние, список запрошенных атрибутов для директории-предка, текущую глубину обхода. Возвращает &lt;code&gt;Tuple&amp;lt;List&amp;lt;Tuple&amp;lt;String,String&amp;gt;&amp;gt;, TypeOf(InitialState)&amp;gt;&lt;/code&gt; - тапл из списка директорий, которые нужно посетить (после обработки текущей директории) с запрашиваемыми мета-атрибутами и следующее состояние. Полученные пути ставятся в очередь на обход.&lt;/p&gt;\n&lt;p&gt;Сигнатура: &lt;code&gt;(List&amp;lt;Struct&amp;lt;'Path':String, 'Type':String, 'Attributes':Yson&amp;gt;&amp;gt;, TypeOf(InitialState), List&amp;lt;String&amp;gt;, Int32) -&amp;gt; Tuple&amp;lt;List&amp;lt;Tuple&amp;lt;String,String&amp;gt;&amp;gt;, TypeOf(InitialState)&amp;gt;&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Реализация по умолчанию:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;-- посещаем каждую поддиректорию, запрашивая те же атрибуты, которые запросили у их предка\n    ($nodes, $state, $rootAttrList, $level) -&amp;gt; {\n        $nodesToDive = ListMap($nodes, ($node) -&amp;gt; (($node.Path, $rootAttrList)));\n        return ($nodesToDive, $state);\n    }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"71\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-71\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-71\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-71.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;PostHandler&lt;/strong&gt; - лямбда, которая вызывается после &lt;code&gt;DiveHandler&lt;/code&gt;, принимает список потомков текущей директории после разрешения ссылок, текущее состояние, текущую глубину обхода.&lt;/p&gt;\n&lt;p&gt;Сигнатура: &lt;code&gt;(List&amp;lt;Struct&amp;lt;'Path':String, 'Type':String, 'Attributes':Yson&amp;gt;&amp;gt;, TypeOf(InitialState), Int32) -&amp;gt; TypeOf(InitialState)&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Реализация по-умолчанию: &lt;code&gt;($nodes, $state, $level) -&amp;gt; ($state)&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;WalkFolders может создавать большую нагрузку на мастер.&lt;/strong&gt; Следует с осторожностью использовать WalkFolders с атрибутами, содержащими большие значения, (&lt;code&gt;schema&lt;/code&gt; может быть одним из таких); обходить поддерево большого размера и/или глубины.&lt;/p&gt;\n&lt;p&gt;Запросы листинга директорий внутри одного вызова WalkFolders могут выполняться параллельно, при запросе атрибутов с большими значениями нужно &lt;strong&gt;уменьшить&lt;/strong&gt; количество одновременных запросов прагмой &lt;a href=\"ru/yql/syntax/pragma/yt.html#ytbatchlistfolderconcurrency\"&gt;yt.BatchListFolderConcurrency&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Хендлеры выполняются через &lt;a href=\"ru/yql/builtins/basic.html#evaluate_expr_atom\"&gt;EvaluateExpr&lt;/a&gt;, существует ограничение на количество узлов YQL AST. Использовать в State контейнеры очень большого размера не получиться.&lt;/p&gt;\n&lt;p&gt;Ограничение можно обойти несколькими вызовами WalkFolders с объединением результатов или сериализуя новое состояние в строку без промежуточной десериализации (например, JSON/Yson lines).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Порядок обхода узлов в дереве не DFS из-за параллельных вызовов листинга директорий&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;InitialState используется для вывода типов обработчиков, его необходимо указывать явно, например, &lt;code&gt;ListCreate(String)&lt;/code&gt;, а не &lt;code&gt;[]&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Рекомендации по использованию:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;C колонкой Attributes рекомендуется работать через &lt;a href=\"ru/yql/udf/list/yson.html\"&gt;Yson UDF&lt;/a&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;В одном запросе результат листинга для каждой директории кешируется, одно и то же поддерево можно быстро обойти заново в другом вызове WalkFolders, если так удобно&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"primery\"&gt;&lt;a href=\"ru/yql/syntax/select/walk_folders.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h2&gt;\n&lt;p&gt;Собрать рекурсивно пути всех таблиц начиная из &lt;code&gt;initial_folder&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$postHandler = ($nodes, $state, $level) -&amp;gt; {\n    $tables = ListFilter($nodes, ($x)-&amp;gt;($x.Type = \"table\"));\n    return ListExtend($state, ListExtract($tables, \"Path\"));\n};\n\nSELECT State FROM WalkFolders(`initial_folder`, $postHandler AS PostHandler);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"141\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-141\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-141\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-141.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Рекурсивно найти последнюю созданную таблицу в &lt;code&gt;initial_folder&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$extractTimestamp = ($node) -&amp;gt; {\n    $creation_time_str = Yson::LookupString($node.Attributes, \"creation_time\");\n    RETURN DateTime::MakeTimestamp(DateTime::ParseIso8601($creation_time_str));\n};\n$postHandler = ($nodes, $maxTimestamp, $_) -&amp;gt; {\n    $tables = ListFilter($nodes, ($node) -&amp;gt; ($node.Type == \"table\"));\n    RETURN ListFold(\n        $tables, $maxTimestamp,\n        ($table, $maxTimestamp) -&amp;gt; (max_of($extractTimestamp($table), $maxTimestamp))\n    );\n};\n$initialTimestamp = CAST(0ul AS Timestamp);\nSELECT\n    *\nFROM WalkFolders(`initial_folder`, $initialTimestamp, \"creation_time\" AS RootAttributes, $postHandler AS PostHandler);\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"145\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-145\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-145\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-145.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Собрать рекурсивно пути всех таблиц в глубину на 2 уровня из &lt;code&gt;initial_folder&lt;/code&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$diveHandler = ($nodes, $state, $attrList, $level) -&amp;gt; {\n    $paths = ListExtract($nodes, \"Path\");\n    $pathsWithReqAttrs = ListMap($paths, ($x) -&amp;gt; (($x, $attrList)));\n\n    $nextToVisit = IF($level &amp;lt; 2, $pathsWithReqAttrs, []);\n    return ($nextToVisit, $state);\n};\n\n$postHandler = ($nodes, $state, $level) -&amp;gt; {\n    $tables = ListFilter($nodes, ($x)-&amp;gt;($x.Type = \"table\"));\n    return ListExtend($state, ListExtract($tables, \"Path\"));\n};\n\nSELECT State FROM WalkFolders(`initial_folder`,\n    $diveHandler AS DiveHandler, $postHandler AS PostHandler);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"149\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-149\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-149\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-149.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Собрать пути из всех узлов в &lt;code&gt;initial_folder&lt;/code&gt;, не заходя в поддиректории&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$diveHandler = ($_, $state, $_, $_) -&amp;gt; {\n    $nextToVisit = [];\n    RETURN ($nextToVisit, $state);\n};\n$postHandler = ($nodes, $state, $_) -&amp;gt; {\n    $tables = ListFilter($nodes, ($x) -&amp;gt; ($x.Type = \"table\"));\n    RETURN ListExtend($state, ListExtract($tables, \"Path\"));\n};\nSELECT\n    State\nFROM WalkFolders(`initial_folder`, $diveHandler AS DiveHandler, $postHandler AS PostHandler);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"153\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-153\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-153\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-153.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Собрать рекурсивно пути всех сломанных (пути назначения не существует) ссылок из &lt;code&gt;initial_folder&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$resolveHandler = ($list, $state, $attrList, $_) -&amp;gt; {\n    $broken_links = ListFilter($list, ($link) -&amp;gt; (Yson::LookupBool($link.Attributes, \"broken\")));\n    $broken_links_target_paths = ListNotNull(\n        ListMap(\n            $broken_links,\n            ($link) -&amp;gt; (Yson::LookupString($link.Attributes, \"target_path\"))\n        )\n    );\n    $nextState = ListExtend($state, $broken_links_target_paths);\n    -- WalkFolders игнорирует сломанные ссылки при разрешении\n    $paths = ListTake(ListExtract($list, \"Path\"), 1);\n    $pathsWithReqAttrs = ListMap($paths, ($x) -&amp;gt; (($x, $attrList)));\n    RETURN ($pathsWithReqAttrs, $nextState);\n};\n\nSELECT\n    State\nFROM WalkFolders(`initial_folder`, $resolveHandler AS ResolveHandler, \"target_path\" AS RootAttributes);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"157\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-157\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-157\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-157.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Собрать рекурсивно Yson для каждого узла из &lt;code&gt;initial_folder&lt;/code&gt;, содержащий &lt;code&gt;Type&lt;/code&gt;, &lt;code&gt;Path&lt;/code&gt;, словарь &lt;code&gt;Attributes&lt;/code&gt; с атрибутами узла (&lt;code&gt;creation_time&lt;/code&gt;, пользовательским атрибутом &lt;code&gt;foo&lt;/code&gt;).&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;-- В случае, если нужно накопить очень большое состояние в одном запросе, можно хранить его в виде строки, чтобы обойти ограничение на количество узлов во время Evaluate.\n$saveNodesToYsonString = ($list, $stateStr, $_) -&amp;gt; {\n    RETURN $stateStr || ListFold($list, \"\", ($node, $str) -&amp;gt; ($str || ToBytes(Yson::SerializeText(Yson::From($node))) || \"\\n\"));\n};\n$serializedYsonNodes =\n    SELECT\n        State\n    FROM WalkFolders(\"//home/yql\", \"\", \"creation_time;foo\" AS RootAttributes, $saveNodesToYsonString AS PostHandler);\n\nSELECT\n    ListMap(String::SplitToList($serializedYsonNodes, \"\\n\", true AS SkipEmpty), ($str) -&amp;gt; (Yson::Parse($str)));\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"161\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-161\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-161\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-161.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Пагинация результатов WalkFolders. Пропускаем 200 первых путей, собираем 100 из &lt;code&gt;initial_folder&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$skip = 200ul;\n$take = 100ul;\n\n$diveHandler = ($nodes, $state, $reqAttrs, $_) -&amp;gt; {\n    $paths = ListExtract($nodes, \"Path\");\n    $pathsWithReqAttrs = ListMap($paths, ($x) -&amp;gt; (($x, $reqAttrs)));\n\n    $_, $collectedPaths = $state;\n    -- заканчиваем обход, если набрали необходимое число узлов\n    $nextToVisit =  IF(\n        ListLength($collectedPaths) &amp;gt; $take,\n        [],\n        $pathsWithReqAttrs\n    );\n    return ($nextToVisit, $state);\n};\n\n$postHandler = ($nodes, $state, $_) -&amp;gt; {\n    $visited, $collectedPaths = $state;\n    $paths = ListExtract($nodes, \"Path\");\n    $itemsToTake = IF(\n        $visited &amp;lt; $skip,\n        0,\n        $take - ListLength($collectedPaths)\n    );\n    $visited = $visited + ListLength($paths);\n\n    return ($visited, ListExtend($collectedPaths, ListTake($paths, $itemsToTake)));\n};\n$initialState = (0ul, ListCreate(String));\n\n$walkFoldersRes = SELECT * FROM WalkFolders(`initial_folder`, $initialState, $diveHandler AS DiveHandler, $postHandler AS PostHandler);\n\n$_, $paths = Unwrap($walkFoldersRes);\nSELECT $paths;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"165\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-165\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-165\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-165.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/syntax/select/walk_folders.md","sourcePath":"ru/yql/syntax/select/walk_folders.md"},"headings":[{"title":"Примеры","href":"ru/yql/syntax/select/walk_folders.html#primery","level":2}],"title":"Рекурсивный обход директорий на кластере"},"router":{"pathname":"ru/yql/syntax/select/walk_folders","depth":5,"base":"../../../../"},"lang":"ru","langs":
