            {"data":{"leading":false,"html":"&lt;p&gt;В YQL реализовано два вида представления данных:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;привязанные к конкретным таблицам;&lt;/li&gt;\n&lt;li&gt;независимые, в которых могут использоваться произвольное число таблиц в рамках кластера.&lt;br /&gt;\nОба они не являются материализованными, то есть подставляются в граф вычислений при каждом использовании.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Для обращения к представлению (&lt;code&gt;VIEW&lt;/code&gt;):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;привязанные к таблице требуют использования специального синтаксиса: &lt;code&gt;[cluster.]`path/to/table` VIEW view_name&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;независимые с точки зрения пользователя выглядят как обычные таблицы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Если в мета-атрибутах таблицы указан автоматический вызов UDF для преобразования сырых данных в структурированный набор колонок, обратиться к сырым данным можно с помощью специального представления &lt;code&gt;raw&lt;/code&gt;, например &lt;code&gt;[cluster.]`path/to/table` VIEW raw&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"primery\"&gt;&lt;a href=\"ru/yql/syntax/select/view.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE some_cluster;\nSELECT *\nFROM my_table VIEW my_view;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"36\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-36\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-36\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-36.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/syntax/select/view.md","sourcePath":"ru/yql/syntax/select/view.md"},"headings":[{"title":"Примеры","href":"ru/yql/syntax/select/view.html#primery","level":2}],"title":"Представления данных (VIEW)"},"router":{"pathname":"ru/yql/syntax/select/view","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
