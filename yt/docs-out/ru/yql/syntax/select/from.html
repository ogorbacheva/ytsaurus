            {"data":{"leading":false,"html":"&lt;p&gt;Источник данных для &lt;code&gt;SELECT&lt;/code&gt;. В качестве аргумента может принимать имя строковой или колоночной таблицы, результат другого &lt;code&gt;SELECT&lt;/code&gt; или &lt;a href=\"ru/yql/syntax/expressions.html#named-nodes\"&gt;именованное выражение&lt;/a&gt;. К именованным выражениям можно обращаться &lt;a href=\"ru/yql/syntax/select/from_as_table.html\"&gt;как к таблицам&lt;/a&gt;(&lt;code&gt;FROM AS_TABLE&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Ещё в YQL можно выполнить запрос по нескольким таблицам. Для этого в &lt;code&gt;SELECT&lt;/code&gt; после &lt;code&gt;FROM&lt;/code&gt; можно указывать не только одну таблицу или подзапрос, но и вызывать встроенные функции, позволяющие объединять данные &lt;a href=\"ru/yql/syntax/select/concat.html\"&gt;нескольких таблиц&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Также вы можете обходить не таблицы, а &lt;a href=\"ru/yql/syntax/select/walk_folders.html\"&gt;итерироваться&lt;/a&gt; по дереву целевого кластера, с возможностью накопить состояние, обычно список путей к таблицам.&lt;/p&gt;\n&lt;p&gt;Между &lt;code&gt;SELECT&lt;/code&gt; и &lt;code&gt;FROM&lt;/code&gt; через запятую указываются имена столбцов из источника или &lt;code&gt;*&lt;/code&gt; для выбора всех столбцов.&lt;/p&gt;\n&lt;p&gt;Таблица по имени ищется в базе данных, заданной оператором &lt;a href=\"ru/yql/syntax/use.html\"&gt;USE&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"primery\"&gt;&lt;a href=\"ru/yql/syntax/select/from.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT key FROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"18\"&gt;\n "&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$table_name = \"my_table\";\nSELECT * FROM $table_name;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"20\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-20\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-20\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-20.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/syntax/select/from.md","sourcePath":"ru/yql/syntax/select/from.md"},"headings":[{"title":"Примеры","href":"ru/yql/syntax/select/from.html#primery","level":2}],"title":"FROM"},"router":{"pathname":"ru/yql/syntax/select/from","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
