        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"flatten-by\"&gt;&lt;a href=\"ru/yql/syntax/flatten.html#flatten-by\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FLATTEN BY&lt;/span&gt;&lt;/a&gt;FLATTEN BY&lt;/h2&gt;\n&lt;p&gt;Преобразует строки исходной таблицы с помощью вертикального разворачивания &lt;a href=\"ru/yql/types/containers.html\"&gt;контейнеров&lt;/a&gt; переменной длины (списков или словарей).&lt;/p&gt;\n&lt;p&gt;Например:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Исходная таблица:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;[a, b, c]&lt;/th&gt;\n&lt;th&gt;1&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;[d]&lt;/td&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;[]&lt;/td&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Таблица после вызова &lt;code&gt;FLATTEN BY&lt;/code&gt; к левому столбцу:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;a&lt;/th&gt;\n&lt;th&gt;1&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;b&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;c&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;d&lt;/td&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primer\"&gt;&lt;a href=\"ru/yql/syntax/flatten.html#primer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$sample = AsList(\n    AsStruct(AsList('a','b','c') AS value, CAST(1 AS Uint32) AS id),\n    AsStruct(AsList('d') AS value, CAST(2 AS Uint32) AS id),\n    AsStruct(AsList() AS value, CAST(3 AS Uint32) AS id)\n);\n\nSELECT value, id FROM as_table($sample) FLATTEN BY (value);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"92\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-92\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-92\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-92.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Такое преобразование может быть удобным в следующих случаях:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Когда по ячейкам из столбца-контейнера необходимо вывести статистику (например, через &lt;a href=\"ru/yql/syntax/group_by.html\"&gt;&lt;code&gt;GROUP BY&lt;/code&gt;&lt;/a&gt;).&lt;/li&gt;\n&lt;li&gt;Когда в ячейках столбца-контейнера хранятся идентификаторы из другой таблицы, которую нужно присоединить с помощью &lt;a href=\"ru/yql/syntax/join.html\"&gt;&lt;code&gt;JOIN&lt;/code&gt;&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"sintaksis\"&gt;&lt;a href=\"ru/yql/syntax/flatten.html#sintaksis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Синтаксис&lt;/span&gt;&lt;/a&gt;Синтаксис&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;FLATTEN BY&lt;/code&gt; указывается после &lt;code&gt;FROM&lt;/code&gt;, но перед &lt;code&gt;GROUP BY&lt;/code&gt;, если &lt;code&gt;GROUP BY&lt;/code&gt; присутствует в запросе.&lt;/li&gt;\n&lt;li&gt;Тип столбца-результата зависит от типа исходного столбца:&lt;/li&gt;\n&lt;/ul&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип контейнера&lt;/th&gt;\n&lt;th&gt;Тип результата&lt;/th&gt;\n&lt;th&gt;Комментарий&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;List&amp;lt;X&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;X&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип ячейки списка&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Dict&amp;lt;X,Y&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Tuple&amp;lt;X,Y&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Кортеж из двух элементов с парами «ключ—значение»&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Optional&amp;lt;X&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;X&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Результат практически эквивалентен конструкции &lt;code&gt;WHERE foo IS NOT NULL&lt;/code&gt;, но тип колонки &lt;code&gt;foo&lt;/code&gt; будет изменен на &lt;code&gt;X&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;ul&gt;\n&lt;li&gt;По умолчанию столбец с результатом заменяет исходный. Используйте &lt;code&gt;FLATTEN BY foo AS bar&lt;/code&gt; для сохранения исходного контейнера. В результате исходный контейнер останется доступным в &lt;code&gt;foo&lt;/code&gt;, а построенный — в &lt;code&gt;bar&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Чтобы построить декартово произведение нескольких столбцов-контейнеров, используйте конструкцию &lt;code&gt;FLATTEN BY (a, b, c)&lt;/code&gt;. Скобки обязательны, чтобы избежать конфликтов в грамматике.&lt;/li&gt;\n&lt;li&gt;В &lt;code&gt;FLATTEN BY&lt;/code&gt; можно использовать только имена столбцов из входной таблицы. Чтобы применить &lt;code&gt;FLATTEN BY&lt;/code&gt; к результату вычисления, используйте подзапрос.&lt;/li&gt;\n&lt;li&gt;В &lt;code&gt;FLATTEN BY&lt;/code&gt; можно использовать не только столбцы, но и произвольные именованные выражения (в отличие от столбцов &lt;code&gt;AS&lt;/code&gt; обязательно). Из-за грамматических неоднозначностей выражения после &lt;code&gt;FLATTEN BY&lt;/code&gt; должны быть заключены в скобки: &lt;code&gt;... FLATTEN BY (ListSkip(col, 1) AS col) ...&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Если в исходном столбце были вложенные контейнеры, например &lt;code&gt;List&amp;lt;Dict&amp;lt;X,Y&amp;gt;&amp;gt;&lt;/code&gt;, &lt;code&gt;FLATTEN BY&lt;/code&gt; развернет только внешний уровень. Чтобы полностью развернуть вложенные контейнеры, используйте подзапрос.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;code&gt;FLATTEN BY&lt;/code&gt; интерпретирует &lt;a href=\"ru/yql/types/optional.html\"&gt;опциональные типы данных&lt;/a&gt; как списки длины 0 или 1. Строки таблицы с &lt;code&gt;NULL&lt;/code&gt; пропускаются, и тип столбца меняется на аналогичный неопциональный.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;FLATTEN BY&lt;/code&gt; делает только одно преобразование за раз, поэтому на опциональных контейнерах, например, &lt;code&gt;Optional&amp;lt;List&amp;lt;String&amp;gt;&amp;gt;&lt;/code&gt; следует использовать &lt;code&gt;FLATTEN LIST BY&lt;/code&gt; или &lt;code&gt;FLATTEN OPTIONAL BY&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"primenenie-flatten-by-k-yson\"&gt;&lt;a href=\"ru/yql/syntax/flatten.html#primenenie-flatten-by-k-yson\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Применение FLATTEN BY к YSON&lt;/span&gt;&lt;/a&gt;Применение FLATTEN BY к YSON&lt;/h2&gt;\n&lt;p&gt;Чтобы применить &lt;code&gt;FLATTEN BY&lt;/code&gt; к YSON, нужно сначала преобразовать его в один из обсуждавшихся выше типов контейнеров. Например, это можно сделать с помощью &lt;a href=\"ru/yql/udf/list/yson.html\"&gt;одноименного UDF-модуля&lt;/a&gt; из списка предустановленных.&lt;/p&gt;\n&lt;h2 id=\"flatten-by-specific-type\"&gt;&lt;a href=\"ru/yql/syntax/flatten.html#flatten-by-specific-type\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Уточнение типа контейнера&lt;/span&gt;&lt;/a&gt;Уточнение типа контейнера&lt;/h2&gt;\n&lt;p&gt;Чтобы уточнить тип контейнера, по которому необходимо произвести преобразование, можно использовать:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;FLATTEN LIST BY&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Для &lt;code&gt;Optional&amp;lt;List&amp;lt;T&amp;gt;&amp;gt;&lt;/code&gt; операция &lt;code&gt;FLATTEN LIST BY&lt;/code&gt; будет разворачивать список, интерпретируя &lt;code&gt;NULL&lt;/code&gt;-значение как пустой список.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;FLATTEN DICT BY&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Для &lt;code&gt;Optional&amp;lt;Dict&amp;lt;T&amp;gt;&amp;gt;&lt;/code&gt; операция &lt;code&gt;FLATTEN DICT BY&lt;/code&gt; будет разворачивать словарь, интерпретируя &lt;code&gt;NULL&lt;/code&gt;-значение как пустой словарь.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;FLATTEN OPTIONAL BY&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Чтобы фильтровать &lt;code&gt;NULL&lt;/code&gt;-значения без размножения, необходимо уточнить операцию до &lt;code&gt;FLATTEN OPTIONAL BY&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery\"&gt;&lt;a href=\"ru/yql/syntax/flatten.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  t.item.0 AS key,\n  t.item.1 AS value,\n  t.dict_column AS original_dict,\n  t.other_column AS other\nFROM my_table AS t\nFLATTEN DICT BY dict_column AS item;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"254\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-254\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-254\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-254.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT * FROM (\n    SELECT\n        AsList(1, 2, 3) AS a,\n        AsList(\"x\", \"y\", \"z\") AS b\n) FLATTEN LIST BY (a, b);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"255\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-255\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-255\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-255.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT * FROM (\n    SELECT\n        \"1;2;3\" AS a,\n        AsList(\"x\", \"y\", \"z\") AS b\n) FLATTEN LIST BY (String::SplitToList(a, \";\") as a, b);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"256\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-256\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-256\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-256.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"flatten-other-dmb\"&gt;&lt;a href=\"ru/yql/syntax/flatten.html#flatten-other-dmb\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аналоги FLATTEN BY для других СУБД&lt;/span&gt;&lt;/a&gt;Аналоги FLATTEN BY для других СУБД&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;PostgreSQL: &lt;code&gt;unnest&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Hive: &lt;code&gt;LATERAL VIEW&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;MongoDB: &lt;code&gt;unwind&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Google BigQuery: &lt;code&gt;FLATTEN&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;ClickHouse: &lt;code&gt;ARRAY JOIN / arrayJoin&lt;/code&gt;;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"flatten-columns\"&gt;&lt;a href=\"ru/yql/syntax/flatten.html#flatten-columns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FLATTEN COLUMNS&lt;/span&gt;&lt;/a&gt;FLATTEN COLUMNS&lt;/h2&gt;\n&lt;p&gt;Преобразует каждый столбец типа &lt;code&gt;Struct&lt;/code&gt; в набор отдельных столбцов, по одному на каждое поле структуры. Названия новых столбцов являются названиями полей исходных столбцов-структур. Столбцы, не являющиеся структурами, остаются без изменений.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Раскрывается только один уровень структуры.&lt;/li&gt;\n&lt;li&gt;Исходные столбцы-структуры не возвращаются в результате, их имена никак не используются.&lt;/li&gt;\n&lt;li&gt;Все имена столбцов в итоговой таблице (включая имена элементов структур в исходных столбцах и имена столбцов, не являющихся структурами) должны быть уникальными, конфликты имен приводят к ошибке.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primer1\"&gt;&lt;a href=\"ru/yql/syntax/flatten.html#primer1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT x, y, z, not_struct\nFROM (\n  SELECT\n    AsStruct(\n        1 AS x,\n        \"foo\" AS y),\n    AsStruct(\n        false AS z),\n    1 as not_struct,\n) FLATTEN COLUMNS;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"313\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n
