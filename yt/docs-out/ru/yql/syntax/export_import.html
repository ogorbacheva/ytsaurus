            {"data":{"leading":false,"html":"&lt;p&gt;Механизм для выноса части запроса в отдельный приложенный файл. Чтобы воспользоваться механизмом, в запросе необходимо выставить прагму:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/pragma/file.html#library\"&gt;PRAGMA Library&lt;/a&gt; — помечает приложенный файл как доступный для импорта.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"export\"&gt;&lt;a href=\"ru/yql/syntax/export_import.html#export\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;EXPORT&lt;/span&gt;&lt;/a&gt;EXPORT&lt;/h2&gt;\n&lt;p&gt;В &lt;code&gt;EXPORT $my_symbol1, $my_symbol2, ...;&lt;/code&gt; перечисляется список именованных выражений в библиотеке, доступных для импорта.&lt;/p&gt;\n&lt;h2 id=\"import\"&gt;&lt;a href=\"ru/yql/syntax/export_import.html#import\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;IMPORT&lt;/span&gt;&lt;/a&gt;IMPORT&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;IMPORT my_library SYMBOLS $my_symbol1, $my_symbol2, ...;&lt;/code&gt; делает перечисленные именованные выражения доступными для использования ниже.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В библиотеку могут быть вынесены &lt;a href=\"ru/yql/syntax/expressions.html#lambda\"&gt;лямбды&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/action.html\"&gt;действия&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/subquery.html\"&gt;именованные подзапросы&lt;/a&gt;, константы и выражения, но &lt;strong&gt;не подзапросы и не агрегатные функции&lt;/strong&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Файл, на который ссылается &lt;a href=\"ru/yql/syntax/pragma/file.html#library\"&gt;PRAGMA Library&lt;/a&gt;, должен быть приложен к запросу. &lt;strong&gt;Использовать для этой цели &lt;a href=\"ru/yql/syntax/pragma/file.html\"&gt;PRAGMA File&lt;/a&gt; нельзя&lt;/strong&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"primer\"&gt;&lt;a href=\"ru/yql/syntax/export_import.html#primer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h2&gt;\n&lt;p&gt;my_lib.sql:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$Square = ($x) -&amp;gt; { RETURN $x * $x; };\n$Sqrt = ($x) -&amp;gt; { RETURN Math::Sqrt($x); };\n\n-- Агрегационные функции, создаваемые с помощью\n-- AggregationFactory, удобно выносить в библиотеку\n$Agg_sum = AggregationFactory(\"SUM\");\n$Agg_max = AggregationFactory(\"MAX\");\n\nEXPORT $Square, $Sqrt, $Agg_sum, $Agg_max;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"48\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-48\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-48\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-48.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Запрос:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;PRAGMA Library(\"my_lib.sql\");\nIMPORT my_lib SYMBOLS $Square, $Sqrt, $Agg_sum, $Agg_max;\nSELECT\n  $Square(2), -- 4\n  $Sqrt(4);   -- 2\n\nSELECT\n  AGGREGATE_BY(x, $Agg_sum), -- 5\n  AGGREGATE_BY(x, $Agg_max)  -- 3\nFROM (\n  SELECT 2 AS x\n  UNION ALL\n  SELECT 3 AS x\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"52\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-52\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-52\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-52.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/syntax/export_import.md","sourcePath":"ru/yql/syntax/export_import.md"},"headings":[{"title":"EXPORT","href":"ru/yql/syntax/export_import.html#export","level":2},{"title":"IMPORT","href":"ru/yql/syntax/export_import.html#import","level":2},{"title":"Пример","href":"ru/yql/syntax/export_import.html#primer","level":2}],"title":"EXPORT и IMPORT"},"router":{"pathname":"ru/yql/syntax/export_import","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
