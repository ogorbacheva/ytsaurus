        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Указать «базу данных». Как правило, в её роли выступает один из кластеров YTsaurus. Это указание будет использоваться по умолчанию для поиска таблиц в тех случаях, где база данных не указана явно.&lt;/p&gt;\n&lt;p&gt;Если в запросе не используется &lt;code&gt;USE&lt;/code&gt;, то кластер следует указывать в начале пути к таблице в формате &lt;code&gt;cluster.`path/to/table`&lt;/code&gt;, например &lt;code&gt;cluster.`home/yql/test`&lt;/code&gt;. Backticks используются для автоматического экранирования спецсимволов, в данном случае слешей.&lt;/p&gt;\n&lt;p&gt;Обычно имя кластера указывается непосредственно, но есть возможность указать его в виде выражения. В этом случае для &lt;code&gt;USE&lt;/code&gt; должна использоваться запись &lt;code&gt;USE yt:$cluster_name&lt;/code&gt;, где &lt;code&gt;$cluster_name&lt;/code&gt; — &lt;a href=\"ru/yql/syntax/expressions.html#named-nodes\"&gt;именованное выражение&lt;/a&gt; типа &lt;code&gt;String&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Либо можно указывать кластер прямо в начале пути к таблице в формате &lt;code&gt;yt:$cluster_name.`path/to/table`&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Сам &lt;code&gt;USE&lt;/code&gt; при этом можно использовать внутри &lt;a href=\"ru/yql/syntax/action.html\"&gt;действий&lt;/a&gt; или &lt;a href=\"ru/yql/syntax/subquery.html\"&gt;шаблонов подзапросов&lt;/a&gt;. Значение текущего кластера наследуется на объявления вложенных действий или подзапросов. Область влияния &lt;code&gt;USE&lt;/code&gt; прекращается по окончании действия или шаблона подзапроса, в котором оно объявлено.&lt;/p&gt;\n&lt;h4 id=\"primer\"&gt;&lt;a href=\"ru/yql/syntax/use.html#primer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE &amp;lt;cluster-name&amp;gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"18\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-18\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-18\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-18.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;code&gt;USE&lt;/code&gt; &lt;strong&gt;не&lt;/strong&gt; гарантирует, что запрос обязательно будет выполнен именно на указанном кластере. Запрос может быть выполнен на другом кластере, если в нём не используются входные данные (например, &lt;code&gt;USE foo; SELECT 2 + 2;&lt;/code&gt; ) или если указан полный путь к таблице на другом кластере (например, &lt;code&gt;USE foo; SELECT * FROM bar.`path/to/table`;&lt;/code&gt;).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/syntax/use.md","sourcePath":"ru/yql/syntax/use.md"},"headings":[],"title":"USE"},"router":{"pathname":"ru/yql/syntax/use","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
