        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"tipy-dannyh,-dopuskayushie-znachenie-null\"&gt;&lt;a href=\"ru/yql/types/optional.html#tipy-dannyh,-dopuskayushie-znachenie-null\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типы данных, допускающие значение NULL&lt;/span&gt;&lt;/a&gt;Типы данных, допускающие значение NULL&lt;/h2&gt;\n&lt;p&gt;Любые типизированные данные в YQL, включая столбцы таблиц, бывают как гарантированно имеющие значение, так и потенциально пустые (что обозначается как &lt;code&gt;NULL&lt;/code&gt;). Типы данных, которые могут содержать значения &lt;code&gt;NULL&lt;/code&gt;, называются &lt;em&gt;опциональными&lt;/em&gt; или, в терминах SQL, — &lt;em&gt;nullable&lt;/em&gt;.&lt;/p&gt;\n&lt;p&gt;Опциональные типы данных в &lt;a href=\"ru/yql/types/type_string.html\"&gt;текстовом виде&lt;/a&gt; обозначаются вопросительным знаком в конце (например, &lt;code&gt;String?&lt;/code&gt;) или как &lt;code&gt;Optional&amp;lt;...&amp;gt;&lt;/code&gt;.&lt;br /&gt;\nНаиболее часто на опциональных типах данных выполняются следующие операции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/expressions.html#is-null\"&gt;IS NULL&lt;/a&gt; — проверка на пустое значение&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/basic.html#coalesce\"&gt;COALESCE&lt;/a&gt; — оставить заполненные значения без изменений, а &lt;code&gt;NULL&lt;/code&gt; заменить на указанное следом значение по умолчанию&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/basic.html#optional-ops\"&gt;UNWRAP&lt;/a&gt; — извлечь значение оригинального типа из опционального, &lt;code&gt;T?&lt;/code&gt; преобразуется в &lt;code&gt;T&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/basic#optional-ops\"&gt;JUST&lt;/a&gt; — добавить опциональность к текущему типу, &lt;code&gt;T&lt;/code&gt; преобразуется в &lt;code&gt;T?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/basic.html#optional-ops\"&gt;NOTHING&lt;/a&gt; — создать пустое значение с указанным типом.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;code&gt;Optional&lt;/code&gt; (nullable) является не свойством типа данных или колонки, а одним из видов &lt;a href=\"ru/yql/types/containers.html\"&gt;контейнеров&lt;/a&gt;, которые могут быть произвольным образом вложены друг в друга. Так, например, столбец с типом &lt;code&gt;Optional&amp;lt;Optional&amp;lt;Boolean&amp;gt;&amp;gt;&lt;/code&gt; может принимать 4 значения — &lt;code&gt;NULL&lt;/code&gt; всего контейнера, &lt;code&gt;NULL&lt;/code&gt; внутреннего контейнера, &lt;code&gt;TRUE&lt;/code&gt; и &lt;code&gt;FALSE&lt;/code&gt;. Описанный тип отличается от &lt;code&gt;List&amp;lt;List&amp;lt;Boolean&amp;gt;&amp;gt;&lt;/code&gt; тем, что роль пустого списка в нем играет &lt;code&gt;NULL&lt;/code&gt; и отсутствует возможность положить больше одного содержательного элемента. Также значения типа &lt;code&gt;Optional&amp;lt;Optional&amp;lt;T&amp;gt;&amp;gt;&lt;/code&gt; возвращаются в качестве результата поиска по ключу в словаре &lt;code&gt;Dict(k,v)&lt;/code&gt; со значениями типа &lt;code&gt;Optional&amp;lt;T&amp;gt;&lt;/code&gt;. Такой тип данных результата позволяет отличать лежащий в словаре &lt;code&gt;NULL&lt;/code&gt; от ситуации отсутствия ключа.&lt;/p&gt;\n&lt;h4 id=\"primer\"&gt;&lt;a href=\"ru/yql/types/optional.html#primer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$dict = {\"a\":1, \"b\":null};\n$found = $dict[\"b\"];\nselect if($found is not null, unwrap($found), -1);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"42\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-42\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-42\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-42.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Результат:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;# column0\nnull\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"46\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-46\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-46\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-46.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"null_expr\"&gt;&lt;a href=\"ru/yql/types/optional.html#null_expr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Логические и арифметические операции с NULL&lt;/span&gt;&lt;/a&gt;Логические и арифметические операции с NULL&lt;/h2&gt;\n&lt;p&gt;Литерал &lt;code&gt;NULL&lt;/code&gt; имеет отдельный сингулярный тип &lt;code&gt;Null&lt;/code&gt; и может быть неявно сконвертирован к любому опциональному типу (в том числе и вложенному &lt;code&gt;Optional&amp;lt;Optional&amp;lt;...Optional&amp;lt;T&amp;gt;...&amp;gt;&amp;gt;&lt;/code&gt;). В ANSI SQL &lt;code&gt;NULL&lt;/code&gt; имеет семантику \"неизвестное значение\" – поэтому логические и арифметические операции с &lt;code&gt;NULL&lt;/code&gt; или с незаполненными &lt;code&gt;Optional&lt;/code&gt; имеют некоторые особенности.&lt;/p&gt;\n&lt;h4 id=\"primery\"&gt;&lt;a href=\"ru/yql/types/optional.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    True OR NULL,        -- Just(True) (работает как True OR &amp;lt;неизвестное значение типа Bool&amp;gt;)\n    False AND NULL,      -- Just(False)\n    True AND NULL,       -- NULL   (точнее Nothing&amp;lt;Bool?&amp;gt; – &amp;lt;неизвестное значение типа Bool&amp;gt;)\n    NULL OR NOT NULL,    -- NULL   (все NULL-ы \"разные\")\n    1 + NULL,            -- NULL   (Nothing&amp;lt;Int32?&amp;gt;) — результат сложения 1 с\n                         --         неизвестным значением типа Int)\n    1 == NULL,           -- NULL   (результат сравнения 1 с неизвестным значением типа Int)\n    (1, NULL) == (1, 2), -- NULL   (сравнение композитных элементов производится покомпонентно\n                         --         через `AND`)\n    (2, NULL) == (1, 3), -- Just(False) (выражение эквивалентно 2 == 1 AND NULL == 3)\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"56\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-56\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-56\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-56.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/types/optional.md","sourcePath":"ru/yql/types/optional.md"},"headings":[{"title":"Типы данных, допускающие значение NULL","href":"ru/yql/types/optional.html#tipy-dannyh,-dopuskayushie-znachenie-null","level":2},{"title":"Логические и арифметические операции с NULL","href":"ru/yql/types/optional.html#null_expr","level":2}],"title":""},"router":{"pathname":"ru/yql/types/optional","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
