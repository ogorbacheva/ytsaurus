            {"data":{"leading":false,"html":"&lt;p&gt;Во время выполнения вычислений можно сгенерировать код, состоящий из узлов S-expressions. Для этого используется механизм представления кода, упакованного в &lt;a href=\"ru/yql/types/special.html\"&gt;ресурс&lt;/a&gt;. После конструирования кода можно подставить его в основную программу с помощью функции &lt;a href=\"ru/yql/builtins/codegen.html#evaluatecode\"&gt;EvaluateCode&lt;/a&gt;. Для отладки сконвертировать код в строку можно с помощью функции &lt;a href=\"ru/yql/builtins/codegen.html#formatcode\"&gt;FormatCode&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Возможные типы узлов в S-expressions, которые можно использовать для генерации кода:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Атом — нетипизированная строка из нуля и более символов.&lt;/li&gt;\n&lt;li&gt;Список — последовательность из нуля и более узлов. Соответствует типу &lt;code&gt;кортеж&lt;/code&gt; в SQL.&lt;/li&gt;\n&lt;li&gt;Вызов встроенной функции — состоит из имени, выраженного атомом, и последовательности из нуля и более узлов, которые являются аргументами этой функции.&lt;/li&gt;\n&lt;li&gt;Объявление лямбда функции — состоит из объявления имен аргументов и узла, который является корнем тела этой лямбда функции.&lt;/li&gt;\n&lt;li&gt;Аргумент лямбды функции — узел, который может использоваться только внутри тела лямбда-функции.&lt;/li&gt;\n&lt;li&gt;Мир — специальный узел, маркирующий операции ввода/вывода.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Узлы S-expressions образуют ориентированный граф. При этом атомы — всегда листовые узлы, так как не могут содержать дочерних узлов.&lt;/p&gt;\n&lt;p&gt;В текстовой записи S-expressions записываются следующим образом:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Атом — &lt;code&gt;'\"foo\"&lt;/code&gt;. Символ апострофа (') является признаком цитирования последующей строки, обычно заключенной в кавычки.&lt;/li&gt;\n&lt;li&gt;Список — &lt;code&gt;'(\"foo\" \"bar\")&lt;/code&gt;. Символ апострофа (') является признаком того, что в скобках не будет вызова функции.&lt;/li&gt;\n&lt;li&gt;Вызов встроенной функции — &lt;code&gt;(foo \"bar\")&lt;/code&gt;. Первый элемент внутри скобок — обязательное имя функции, а далее указываются ее аргументы.&lt;/li&gt;\n&lt;li&gt;Объявление лямбда функции — &lt;code&gt;(lambda '(x y) (+ x y))&lt;/code&gt;. После ключевого слова &lt;code&gt;lambda&lt;/code&gt; стоит список из имен аргументов, за которым следует тело лямбда функции.&lt;/li&gt;\n&lt;li&gt;Аргумент лямбда функции — &lt;code&gt;x&lt;/code&gt;. В отличие от атома, строка без символа апострофа (') является ссылкой на имя в текущей области видимости. При объявлении лямбда функции в область видимости тела добавляются имена аргументов, причем при необходимости скрывается имя из объемлющей области видимости.&lt;/li&gt;\n&lt;li&gt;Мир — &lt;code&gt;world&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"formatcode\"&gt;&lt;a href=\"ru/yql/builtins/codegen.html#formatcode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FormatCode&lt;/span&gt;&lt;/a&gt;FormatCode&lt;/h2&gt;\n&lt;p&gt;Сериализация кода в виде &lt;a href=\"/docs/s_expressions\"&gt;S-expressions&lt;/a&gt;. Код не должен содержать свободных аргументов функций, т.е. для сериализации кода лямбда функции нужно передавать ее целиком, а не выражения, потенциально содержащие аргументы лямбда функции.&lt;/p&gt;\n&lt;h4 id=\"primery\"&gt;&lt;a href=\"ru/yql/builtins/codegen.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT FormatCode(AtomCode(\"foo\"));\n-- (\n-- (return '\"foo\")\n-- )\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"85\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-85\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-85\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-85.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"worldcode\"&gt;&lt;a href=\"ru/yql/builtins/codegen.html#worldcode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;WorldCode&lt;/span&gt;&lt;/a&gt;WorldCode&lt;/h2&gt;\n&lt;p&gt;Построить узел кода с типом &lt;code&gt;мир&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"primery1\"&gt;&lt;a href=\"ru/yql/builtins/codegen.html#primery1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT FormatCode(WorldCode());\n-- (\n-- (return world)\n-- )\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"95\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-95\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-95\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-95.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"atomcode\"&gt;&lt;a href=\"ru/yql/builtins/codegen.html#atomcode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AtomCode&lt;/span&gt;&lt;/a&gt;AtomCode&lt;/h2&gt;\n&lt;p&gt;Построить узел кода с типом &lt;code&gt;атом&lt;/code&gt; из строки, переданной в аргумент.&lt;/p&gt;\n&lt;h4 id=\"primery2\"&gt;&lt;a href=\"ru/yql/builtins/codegen.html#primery2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT FormatCode(AtomCode(\"foo\"));\n-- (\n-- (return '\"foo\")\n-- )\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"105\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-105\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-105\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-105.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"listcode\"&gt;&lt;a href=\"ru/yql/builtins/codegen.html#listcode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ListCode&lt;/span&gt;&lt;/a&gt;ListCode&lt;/h2&gt;\n&lt;p&gt;Построить узел кода с типом &lt;code&gt;список&lt;/code&gt; из набора узлов или списков узлов кода, переданных в аргументы. При этом списки из аргументов встраиваются как отдельно перечисленные узлы кода.&lt;/p&gt;\n&lt;h4 id=\"primery3\"&gt;&lt;a href=\"ru/yql/builtins/codegen.html#primery3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT FormatCode(ListCode(\n    AtomCode(\"foo\"),\n    AtomCode(\"bar\")));\n-- (\n-- (return '('\"foo\" '\"bar\"))\n-- );\n\nSELECT FormatCode(ListCode(AsList(\n    AtomCode(\"foo\"),\n    AtomCode(\"bar\"))));\n-- (\n-- (return '('\"foo\" '\"bar\"))\n-- )\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"115\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-115\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-115\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-115.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"funccode\"&gt;&lt;a href=\"ru/yql/builtins/codegen.html#funccode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FuncCode&lt;/span&gt;&lt;/a&gt;FuncCode&lt;/h2&gt;\n&lt;p&gt;Построить узел кода с типом &lt;code&gt;вызов встроенной функции&lt;/code&gt; из строки с именем функции и набора узлов или списков узлов кода, переданных в аргументы. При этом списки из аргументов встраиваются как отдельно перечисленные узлы кода.&lt;/p&gt;\n&lt;h4 id=\"primery4\"&gt;&lt;a href=\"ru/yql/builtins/codegen.html#primery4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT FormatCode(FuncCode(\n    \"Baz\",\n    AtomCode(\"foo\"),\n    AtomCode(\"bar\")));\n-- (\n-- (return (Baz '\"foo\" '\"bar\"))\n-- )\n\nSELECT FormatCode(FuncCode(\n    \"Baz\",\n    AsList(\n        AtomCode(\"foo\"),\n        AtomCode(\"bar\"))));\n-- (\n-- (return (Baz '\"foo\" '\"bar\"))\n-- )\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"125\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-125\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-125\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-125.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"lambdacode\"&gt;&lt;a href=\"ru/yql/builtins/codegen.html#lambdacode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LambdaCode&lt;/span&gt;&lt;/a&gt;LambdaCode&lt;/h2&gt;\n&lt;p&gt;Построить узел кода с типом &lt;code&gt;объявление лямбда функции&lt;/code&gt; можно из:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/expressions.html#lambda\"&gt;Лямбда функции&lt;/a&gt;, если заранее известно количество аргументов. В этом случае в качестве аргументов этой лямбда функции будут переданы узлы типа &lt;code&gt;аргумент&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Количества аргументов и &lt;a href=\"ru/yql/syntax/expressions.html#lambda\"&gt;лямбда функции&lt;/a&gt; с одним аргументом. В этом случае в качестве аргумента этой лямбды функции будет передан список узлов типа &lt;code&gt;аргумент&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery5\"&gt;&lt;a href=\"ru/yql/builtins/codegen.html#primery5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT FormatCode(LambdaCode(($x, $y) -&amp;gt; {\n    RETURN FuncCode(\"+\", $x, $y);\n}));\n-- (\n-- (return (lambda '($1 $2) (+ $1 $2)))\n-- )\n\nSELECT FormatCode(LambdaCode(2, ($args) -&amp;gt; {\n    RETURN FuncCode(\"*\", Unwrap($args[0]), Unwrap($args[1]));\n}));\n-- (\n-- (return (lambda '($1 $2) (* $1 $2)))\n-- )\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"147\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-147\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-147\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-147.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"evaluatecode\"&gt;&lt;a href=\"ru/yql/builtins/codegen.html#evaluatecode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;EvaluateCode&lt;/span&gt;&lt;/a&gt;EvaluateCode&lt;/h2&gt;\n&lt;p&gt;Подстановка в основную программу узла кода, переданного в аргумент.&lt;/p&gt;\n&lt;h4 id=\"primery6\"&gt;&lt;a href=\"ru/yql/builtins/codegen.html#primery6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT EvaluateCode(FuncCode(\"Int32\", AtomCode(\"1\"))); -- 1\n\n$lambda = EvaluateCode(LambdaCode(($x, $y) -&amp;gt; {\n    RETURN FuncCode(\"+\", $x, $y);\n}));\nSELECT $lambda(1, 2); -- 3\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"157\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-157\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-157\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-157.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"reprcode\"&gt;&lt;a href=\"ru/yql/builtins/codegen.html#reprcode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ReprCode&lt;/span&gt;&lt;/a&gt;ReprCode&lt;/h2&gt;\n&lt;p&gt;Подстановка в основную программу узла кода, который является представлением результата вычисления выражения, переданного в аргумент.&lt;/p&gt;\n&lt;h4 id=\"primery7\"&gt;&lt;a href=\"ru/yql/builtins/codegen.html#primery7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$add3 = EvaluateCode(LambdaCode(($x) -&amp;gt; {\n    RETURN FuncCode(\"+\", $x, ReprCode(1 + 2));\n}));\nSELECT $add3(1); -- 4\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewB
