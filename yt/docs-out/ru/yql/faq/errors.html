        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"expected-comparable-type,-but-got-yson\"&gt;&lt;a href=\"ru/yql/faq/errors.html#expected-comparable-type,-but-got-yson\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Expected comparable type, but got: Yson&lt;/span&gt;&lt;/a&gt;Expected comparable type, but got: Yson&lt;/h2&gt;\n&lt;p&gt;Такое может произойти, если таблица создана в YTsaurus без схемы, а затем отсортирована. При этом система (YT) в схеме таблицы устанавливает столбцу, по которому производилась сортировка, тип &lt;code&gt;any&lt;/code&gt;, что в терминах YQL эквивалентно типу столбца &lt;code&gt;Yson&lt;/code&gt; (произвольные YSON-данные).&lt;/p&gt;\n&lt;p&gt;Например, для запроса&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT * FROM my_table\nWHERE key = 'www.youtube.com/watch?v=Xn599R0ZBwg';\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"9\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-9\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-9\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-9.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;... можно сделать workaround:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT * FROM my_table\nWHERE Yson::ConvertToString(Yson::Parse(key)) = 'www.youtube.com/watch?v=Xn599R0ZBwg';\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"13\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-13\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-13\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-13.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;strong&gt;Недостаток этого решения:&lt;/strong&gt;&lt;br /&gt;\nЗапросы из примеров выводят все строки, которые соответствуют какому-то ключу. Если таблица по этому ключу отсортирована, то обычно время работы такого запроса не зависит от объема таблицы. Но для обсуждаемого здесь workaround такая оптимизация не сработает, и придётся прочитать всю таблицу.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Для  корректно схематизированных таблиц такой проблемы нет, и если у вас есть такая возможность, — настройте схему или попросите это сделать ответственных за нужные вам таблицы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Подробнее &lt;a href=\"ru/yql/udf/list/yson.html\"&gt;про Yson UDF&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"cannot-add-type-string-string-and-string-string\"&gt;&lt;a href=\"ru/yql/faq/errors.html#cannot-add-type-string-string-and-string-string\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cannot add type String (String?) and String (String?)&lt;/span&gt;&lt;/a&gt;Cannot add type String (String?) and String (String?)&lt;/h2&gt;\n&lt;p&gt;Ошибка возникает при попытке конкатенации строк с помощью оператора '+'.&lt;br /&gt;\nВместо него следует использовать оператор '||':&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT \"Hello, \" || \"world\" || \"!\";\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"36\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-36\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-36\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-36.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"expression-has-to-be-an-aggregation-function-or-key-column,-because-aggregation-is-used-elsewhere-in-this-subquery\"&gt;&lt;a href=\"ru/yql/faq/errors.html#expression-has-to-be-an-aggregation-function-or-key-column,-because-aggregation-is-used-elsewhere-in-this-subquery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Expression has to be an aggregation function or key column, because aggregation is used elsewhere in this subquery&lt;/span&gt;&lt;/a&gt;Expression has to be an aggregation function or key column, because aggregation is used elsewhere in this subquery&lt;/h2&gt;\n&lt;p&gt;Наиболее частой причиной возникновения проблемы является использование алиасов из &lt;code&gt;SELECT&lt;/code&gt; в конструкции &lt;code&gt;HAVING&lt;/code&gt;. Алиасы — названия полей, которые следуют за &lt;code&gt;AS&lt;/code&gt; в &lt;code&gt;SELECT&lt;/code&gt;, они являются проекцией и выполняются уже после &lt;code&gt;HAVING&lt;/code&gt;, поэтому там их использовать невозможно.&lt;/p&gt;\n&lt;p&gt;Пример некорректного запроса (так работать &lt;strong&gt;НЕ&lt;/strong&gt; будет):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE &amp;lt;cluster-name&amp;gt;;\nSELECT\n    region,\n    COUNT(age) AS counter\nFROM `home/yql/tutorial/users`\nGROUP BY region\nHAVING counter &amp;gt; 3\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"46\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-46\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-46\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-46.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Для того чтобы избежать дублирование вызова агрегатных функций, рекомендуется использование подзапроса с переносом логики из &lt;code&gt;HAVING&lt;/code&gt; в &lt;code&gt;WHERE&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE &amp;lt;cluster-name&amp;gt;;\nSELECT *\nFROM\n    (SELECT\n        region,\n        COUNT(age) AS counter\n    FROM `home/yql/tutorial/users`\n    GROUP BY region)\nWHERE counter &amp;gt; 3\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"50\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-50\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-50\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-50.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"value-type-double-is-not-a-number\"&gt;&lt;a href=\"ru/yql/faq/errors.html#value-type-double-is-not-a-number\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Value type \"double\" is not a number&lt;/span&gt;&lt;/a&gt;Value type \"double\" is not a number&lt;/h2&gt;\n&lt;p&gt;Вероятной причиной появления ошибки, как правило, является деление на ноль, что приводит к значению NaN (Not a number), которое пока не поддерживается в ряде случаев YTsaurus.&lt;/p&gt;\n&lt;h2 id=\"row-weight-is-too-large\"&gt;&lt;a href=\"ru/yql/faq/errors.html#row-weight-is-too-large\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Row weight is too large&lt;/span&gt;&lt;/a&gt;Row weight is too large&lt;/h2&gt;\n&lt;p&gt;Причиной ошибки является превышение максимального размера памяти, выделяемого для строки. Для изменения этого ограничения стоит использовать соответствующую настройку (&lt;a href=\"ru/yql/syntax/pragma/yt.html#yt\"&gt;PRAGMA&lt;/a&gt;), которая позволяет увеличить ограничение на максимальную длину строки таблицы в YTsaurus.&lt;br /&gt;\nЗначение по умолчанию — \"16M\", максимальное значение — \"128M\". В случае превышения максимального значения необходимо менять логику вычислений, например, разделить таблицу на несколько частей или применить алгоритмы сжатия (&lt;a href=\"ru/yql/udf/list/compress_decompress.html\"&gt;Compress UDF&lt;/a&gt;).&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;PRAGMA yt.MaxRowWeight = \"32M\";\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"63\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-63\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-63\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-63.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"key-weight-is-too-large\"&gt;&lt;a href=\"ru/yql/faq/errors.html#key-weight-is-too-large\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Key weight is too large&lt;/span&gt;&lt;/a&gt;Key weight is too large&lt;/h2&gt;\n&lt;p&gt;Возникает при слишком большом размере значения в ключевом поле таблицы. Одним из способов решения проблемы является использование настройки (&lt;a href=\"ru/yql/syntax/pragma/yt.html#yt\"&gt;PRAGMA&lt;/a&gt;), которая позволяет увеличить ограничение на максимальную длину ключевых полей таблицы в YTsaurus, где поле используется для &lt;code&gt;ORDER BY&lt;/code&gt;, &lt;code&gt;GROUP BY&lt;/code&gt;, &lt;code&gt;PARTITION BY&lt;/code&gt;, &lt;code&gt;DISTINCT&lt;/code&gt;, &lt;code&gt;REDUCE&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Значение по умолчанию — \"16K\", максимальное значение — \"256K\".&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;PRAGMA yt.MaxKeyWeight = \"32K\";\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"73\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-73\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-73\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-73.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"badtabledata\"&gt;&lt;a href=\"ru/yql/faq/errors.html#badtabledata\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таблица содержит разнотипные значения в одной колонке&lt;/span&gt;&lt;/a&gt;Таблица содержит разнотипные значения в одной колонке&lt;/h2&gt;\n&lt;p&gt;При обработке таких таблиц могут возникать разные ошибки, в зависимости от настроек запроса:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt; ReadYsonValue(): requirement cmd == Int64Marker failed, message: Expected char: \"\\2\", but read: \"\\1\"&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt; { 'Table input pipe failed' { 'Unexpected type of \"score\" column, expected: \"int64\" found \"uint64\"' } }&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Чтобы прочитать или обработать такую таблицу, нужно пропатчить тип колонки на &lt;code&gt;Yson?&lt;/code&gt; через &lt;a href=\"ru/yql/syntax/select/with.html\"&gt;WITH COLUMNS&lt;/a&gt; и дальше вручную разобрать данные с использованием &lt;a href=\"ru/yql/udf/list/yson.html\"&gt;Yson UDF&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Yson::ConvertToDouble(bad_column, Yson::Options(false as Strict)) ?? CAST(Yson::ConvertToString(bad_column, Yson::Options(false as Strict)) as Double) as bad_column\nFROM `path/to/bad_table`\nWITH COLUMNS Struct&amp;lt;bad_column: Yson?&amp;gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"95\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-95\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-95\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-95.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если типы допускают автоконвертирование, то можно так:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Yson::ConvertToDouble(bad_column, Yson::Options(true as AutoConvert)) as bad_column\nFROM `path/to/bad_table`\nWITH COLUMNS Struct&amp;lt;bad_column: Yson?&amp;gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"99\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-99\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-99\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-99.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"symlinkaccess\"&gt;&lt;a href=\"ru/yql/faq/errors.html#symlinkaccess\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Access denied for user &amp;lt;&amp;gt;: \"read\" permission for node &amp;lt;&amp;gt; is not allowed by any matching ACE&lt;/span&gt;&lt;/a&gt;Access denied for user &amp;lt;&amp;gt;: \"read\" permission for node &amp;lt;&amp;gt; is not allowed by any matching ACE&lt;/h2&gt;\n&lt;h3 id=\"zapros-prav-v-ytsaurus\"&gt;&lt;a href=\"ru/yql/faq/errors.html#zapros-prav-v-ytsaurus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запрос прав в YTsaurus&lt;/span&gt;&lt;/a&gt;Запрос прав в YTsaurus&lt;/h3&gt;\n&lt;p&gt;Нужно проверить, открывается ли таблица в интерфейсе YTsaurus. Если прав нет, их следует запросить через веб-нитерфейс YTsaurus или через CLI.&lt;/p&gt;\n&lt;h3 id=\"prava-na-symlink-tablicy\"&gt;&lt;a href=\"ru/yql/faq/errors.html#prava-na-symlink-tablicy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Права на Symlink таблицы&lt;/span&gt;&lt;/a&gt;Права на Symlink таблицы&lt;/h3&gt;\n&lt;p&gt;Если в YTsaurus интерфейсе таблица открывается, но YQL ее не видит, то проблема может быть в symlink-ах на таблицы, когда у пользователя есть права доступа на нижележащую таблицу, но нет доступа на чтение самого symlink. Для резолвинга нижележащей таблицы в YTsaurus не требуются права на чтение symlink, поэтому в YTsaurus содержимое отображается нормально. Но YQL помимо резолвинга еще читает атрибуты symlink-а, потому что в атрибутах может переопределяться, например, схема таблицы. Для решения данной проблемы необходимо запросить права на чтение symlink.&lt;/p&gt;\n&lt;h2 id=\"key_monster\"&gt;&lt;a href=\"ru/yql/faq/errors.html#key_monster\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Maximum allowed data weight per sorted job exceeds the limit&lt;/span&gt;&lt;/a&gt;Maximum allowed data weight per sorted job exceeds the limit&lt;/h2&gt;\n&lt;p&gt;В большинстве случаев ошибка возникает при исполнении &lt;code&gt;JOIN&lt;/code&gt;, если в его входах есть ключ-монстр (очень много записей с одним и тем же значением ключа). Диагностировать наличие ключа-монстра можно, перейдя на соответствующую операцию YTsaurus, кликнув на красный кружок в плане исполнения запроса. Далее в интерфейсе YTsaurus необходимо открыть вкладку &lt;code&gt;Partition sizes&lt;/code&gt; упавшей операции:&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/partition_sizes.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;Если есть крупные партиции (больше 200Gb), то это сигнализирует о наличии ключей-монстров. Само значение проблемного ключа, как правило, можно узнать, раскрыв сообщение об ошибке на вкладке &lt;code&gt;Details&lt;/code&gt; операции:&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/max_allowed_data_error.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;В данном примере проблемный ключ это пустая строка. &lt;/p&gt;\n&lt;p&gt;Основной способ решения данной проблемы — это фильтрация проблемных значений ключа на входах JOIN. Как правило, ключи-монстры содержат нерелевантные значения (NULL, пустая строка), которые безболезненно можно отфильтровать. Если значения ключей-монстров важны, то их можно обработать отдельно.&lt;/p&gt;\n&lt;p&gt;Помимо JOIN, такая ошибка может возникать еще в следующих случаях:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Очень большой объем данных в &lt;code&gt;GROUP BY&lt;/code&gt;, &lt;code&gt;JOIN&lt;/code&gt;. Решение: нужно попытаться уменьшить объем.&lt;/li&gt;\n&lt;li&gt;В &lt;a href=\"ru/yql/syntax/window\"&gt;окно&lt;/a&gt; попала вся таблица целиком. Решение: пересмотреть условия партицирования оконной функции&lt;/li&gt;\n&lt;li&gt;Для каких-то значений ключа &lt;code&gt;GROUP BY&lt;/code&gt; получилось слишком много данных. Диагностика проблемного ключа здесь такая же, как и для &lt;code&gt;JOIN&lt;/code&gt;. Решение: отфильтровать проблемный ключ, добавить дополнительные колонки в ключ группировки.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"reading-multiple-times-from-the-same-source-is-not-supported\"&gt;&lt;a href=\"ru/yql/faq/errors.html#reading-multiple-times-from-the-same-source-is-not-supported\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reading multiple times from the same source is not supported&lt;/span&gt;&lt;/a&gt;Reading multiple times from the same source is not supported&lt;/h2&gt;\n&lt;p&gt;DQ не может исполнить запрос, так как в построенном плане присутствует раздвоение входного потока данных на несколько. На данный момент в YTsaurus такое поведение не поддерживается, и корректно выполнить этот запрос не получится.&lt;/p&gt;\n\n&lt;h2 id=\"strict-yson-type-is-not-allowed-to-write,-please-use-optional\"&gt;&lt;a href=\"ru/yql/faq/errors.html#strict-yson-type-is-not-allowed-to-write,-please-use-optional\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Strict Yson type is not allowed to write, please use Optional&lt;/span&gt;&lt;/a&gt;Strict Yson type is not allowed to write, please use Optional&lt;/h2&gt;\n&lt;p&gt;Это текущее ограничение YTsaurus, которое не позволяет писать в режиме &lt;code&gt;type_v3&lt;/code&gt; неопциональные Yson колонки. Ошибка возникает при использовании в запросе прагмы &lt;a href=\"ru/yql/syntax/pragma/yt.html#yt-usenativeyttypes\"&gt;yt.UseNativeYtTypes&lt;/a&gt; — обратите внимание, эта прагма включена по умолчанию.&lt;/p&gt;\n&lt;p&gt;Чтобы избавиться от ошибки:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Убедитесь, что запрос не формирует явно данные с типом Yson на любом уровне (например, тип &lt;code&gt;List&amp;lt;Yson&amp;gt;&lt;/code&gt; также невозможно записать).&lt;/li&gt;\n&lt;li&gt;Убедитесь, что в используемых таблицах запроса нет колонок с неопциональным Yson на любом уровне.&lt;/li&gt;\n&lt;li&gt;Некоторые агрегатные функции (&lt;code&gt;AGG_LIST&lt;/code&gt;, например) безусловно снимают опциональность со своих элементов. Поэтому, даже если исходная колонка имела тип &lt;code&gt;Optional&amp;lt;Yson&amp;gt;&lt;/code&gt;, то в результате &lt;code&gt;AGG_LIST&lt;/code&gt; получается тип &lt;code&gt;List&amp;lt;Yson&amp;gt;&lt;/code&gt;, который невозможно записать. В этом случае необходимо преобразовать тип колонки в любой другой тип перед &lt;code&gt;AGG_LIST&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Также можно отключить прагму &lt;code&gt;PRAGMA yt.UseNativeYtTypes&lt;/code&gt;. Следует иметь в виду, что при отключении прагмы вы потеряете преимущества строгой типизации, так как нативные типы будут представлены как строки.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/faq/errors.md","sourcePath":"ru/yql/faq/errors.md"},"headings":[{"title":"Expected comparable type, but got: Yson","href":"ru/yql/faq/errors.html#expected-comparable-type,-but-got-yson","level":2},{"title":"Cannot add type String (String?) and String (String?)","href":"ru/yql/faq/errors.html#cannot-add-type-string-string-and-string-string","level":2},{"title":"Expression has to be an aggregation function or key column, because aggregation is used elsewhere in this subquery","href":"ru/yql/faq/errors.html#expression-has-to-be-an-aggregation-function-or-key-column,-because-aggregation-is-used-elsewhere-in-this-subquery","level":2},{"title":"Value type \"double\" is not a number","href":"ru/yql/faq/errors.html#value-type-double-is-not-a-number","level":2},{"title":"Row weight is too large","href":"ru/yql/faq/errors.html#row-weight-is-too-large","level":2},{"title":"Key weight is too large","href":"ru/yql/faq/errors.html#key-weight-is-too-large","level":2},{"title":"Таблица содержит разнотипные значения в одной колонке","href":"ru/yql/faq/errors.html#badtabledata","level":2},{"title":"Access denied for user &lt;&gt;: \"read\" permission for node &lt;&gt; is not allowed by any matching ACE","href":"ru/yql/faq/errors.html#symlinkaccess","level":2,"items":[{"title":"Запрос прав в YTsaurus","href":"ru/yql/faq/errors.html#zapros-prav-v-ytsaurus","level":3},{"title":"Права на Symlink таблицы","href":"ru/yql/faq/errors.html#prava-na-symlink-tablicy","level":3}]},{"title":"Maximum allowed data weight per sorted job exceeds the limit","href":"ru/yql/faq/errors.html#key_monster","level":2},{"title":"Reading multiple times from the same source is not supported","href":"ru/yql/faq/errors.html#reading-multiple-times-from-the-same-source-is-not-supported","level":2},{"title":"Strict Yson type is not allowed to write, please use Optional","href":"ru/yql/faq/errors.html#strict-yson-type-is-not-allowed-to-write,-please-use-optional","level":2}],"title":"Ошибки"},"router":{"pathname":"ru/yql/faq/errors","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
