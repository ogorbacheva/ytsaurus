        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе собрана информация про атрибуты Кипариса.&lt;/p&gt;\n&lt;h2 id=\"common\"&gt;&lt;a href=\"ru/user-guide/storage/attributes.html#common\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общая информация&lt;/span&gt;&lt;/a&gt;Общая информация&lt;/h2&gt;\n&lt;p&gt;С каждым объектом в системе YTsaurus связан набор &lt;strong&gt;атрибутов&lt;/strong&gt;. Множество атрибутов представляет собой словарь ключ-значение, который доступен для чтения и изменения. Именами атрибутов могут выступать произвольные непустые строки. Значениями — произвольные &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON&lt;/a&gt;-структуры.&lt;/p&gt;\n&lt;p&gt;Атрибуты бывают двух видов: &lt;strong&gt;&lt;a href=\"ru/user-guide/storage/attributes.html#system_attr\"&gt;системные&lt;/a&gt;&lt;/strong&gt; и &lt;strong&gt;&lt;a href=\"ru/user-guide/storage/attributes.html#user_attr\"&gt;пользовательские&lt;/a&gt;&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Для обращения к атрибутам объекта используется специальный модификатор пути &lt;code&gt;/@&lt;/code&gt; и команды &lt;code&gt;get&lt;/code&gt;, &lt;code&gt;list&lt;/code&gt;, &lt;code&gt;set&lt;/code&gt;, &lt;code&gt;remove&lt;/code&gt;. Помимо обращения к атрибутам целиком можно адресовать их части (в случае, когда значение атрибута — составной тип).&lt;/p&gt;\n&lt;p&gt;Более подробную информацию про модификаторы пути можно найти в разделе &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPath&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;У команд &lt;code&gt;get&lt;/code&gt; и &lt;code&gt;list&lt;/code&gt; можно опционально указать список атрибутов, которые требуется вернуть вместе c найденными объектами.&lt;/p&gt;\n&lt;h2 id=\"system_attr\"&gt;&lt;a href=\"ru/user-guide/storage/attributes.html#system_attr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Системные атрибуты&lt;/span&gt;&lt;/a&gt;Системные атрибуты&lt;/h2&gt;\n&lt;p&gt;У разных типов объектов имеется свой набор системных атрибутов, специфичных для данного типа. Например, у любого объекта есть атрибут &lt;code&gt;id&lt;/code&gt;, у таблиц есть атрибуты &lt;code&gt;compression_codec&lt;/code&gt; и &lt;code&gt;compressed_data_size&lt;/code&gt;. Подробнее про атрибуты, присущие всем объектам, можно почитать в разделе &lt;a href=\"user-guide/storage/objects.html\"&gt;Объекты&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Системные атрибуты бывают изменяемыми (может изменять пользователь), например &lt;code&gt;compression_codec&lt;/code&gt;, и неизменяемыми, например &lt;code&gt;compressed_data_size&lt;/code&gt;. При попытке установить неизменяемый атрибут система вернет ошибку. Попытка удаления системного атрибута также приведет к ошибке.&lt;/p&gt;\n&lt;p&gt;Некоторые атрибуты являются &lt;strong&gt;наследуемыми&lt;/strong&gt;: такие атрибуты можно устанавливать на директориях (map-нодах), где они являются nullable, то есть могут не иметь (и не имеют по умолчанию) никакого значения. Если при создании нового объекта не указано значение наследуемого атрибута, данный атрибут получает значение ближайшего узла-предка или значение по умолчанию, если ни у одного предка вплоть до корня атрибут не установлен.&lt;/p&gt;\n&lt;p&gt;Для разных типов объектов наследуются разные множества атрибутов. Следующие атрибуты наследуются &lt;strong&gt;таблицами, файлами и журналами:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;chunk_merger_mode&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;compression_codec&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;enable_striped_erasure&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;erasure_codec&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;hunk_media&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;hunk_primary_medium&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;media&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;primary_medium&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;replication_factor&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;vital&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В дополнение к перечисленным, следующие атрибуты наследуются &lt;strong&gt;только таблицами:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;atomicity&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;hunk_erasure_codec&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;commit_ordering&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;in_memory_mode&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;optimize_for&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;profiling_mode&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;profiling_tag&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;tablet_cell_bundle&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Реплицированные Хаосные таблицы&lt;/strong&gt; наследуют следующие атрибуты:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;chaos_cell_bundle&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Также системные атрибуты могут быть &lt;strong&gt;непрозрачными&lt;/strong&gt; (&lt;strong&gt;вычисляемыми&lt;/strong&gt;, &lt;strong&gt;opaque&lt;/strong&gt;), то есть их значение будет доступно только при явном запросе командой &lt;code&gt;get&lt;/code&gt;, но не будет доступно (а точнее, значение атрибута будет равно &lt;strong&gt;entity&lt;/strong&gt;) при запросе всех атрибутов. Чаще всего непрозрачными объявляются атрибуты, имеющие большое значение (в смысле объема данных), либо вычисление которых требует значительного времени. То есть, если данные в атрибуте составляют более сотни килобайт, имеет смысл делать их непрозрачными. В таком случае при запросе всех атрибутов, они не будут возвращаться, и чтение всех атрибутов будет быстрее. Если требуется получить эти значения, нужно явно их запросить. Примером непрозрачного атрибута будет список всех чанков таблицы (атрибут &lt;code&gt;chunk_ids&lt;/code&gt;) или суммарное использование ресурсов по поддереву Кипариса (атрибут &lt;code&gt;recursive_resource_usage&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Ниже представлен список атрибутов объектов системы YTsaurus:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/objects.html#attributes\"&gt;атрибуты любого объекта&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/cypress.html#attributes\"&gt;атрибуты узлов Кипариса&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/static-tables.html#attributes\"&gt;атрибуты статических таблиц&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/dynamic-tables/overview.html#attributes\"&gt;атрибуты динамических таблиц&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/files.html#attributes\"&gt;атрибуты файлов&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;атрибуты &lt;a href=\"user-guide/storage/compression.html#get_compression\"&gt;compression_codec&lt;/a&gt; и &lt;a href=\"user-guide/storage/replication.html#erasure\"&gt;erasure_codec&lt;/a&gt; для таблиц и файлов;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/transactions.html#attributes\"&gt;атрибуты транзакций&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/links.html#attributes\"&gt;атрибуты ссылок&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/accounts.html#account_attributes\"&gt;атрибуты аккаунтов&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/media.html#atributy\"&gt;атрибуты медиумов&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"user_attr\"&gt;&lt;a href=\"ru/user-guide/storage/attributes.html#user_attr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пользовательские атрибуты&lt;/span&gt;&lt;/a&gt;Пользовательские атрибуты&lt;/h2&gt;\n&lt;p&gt;Пользователь может самостоятельно устанавливать произвольные атрибуты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Имена (ключи) пользовательских атрибутов не должны совпадать с именами системных атрибутов. Рекомендуется начинать имена пользовательских атрибутов с подчеркивания, это позволит избежать потенциальных проблем при расширении множества системных атрибутов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Атрибуты являются метаинформацией и хранятся в памяти мастер-сервера Кипариса, поэтому общий объем пользовательских атрибутов не должен превышать сотни мегабайт.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"how_stored\"&gt;&lt;a href=\"ru/user-guide/storage/attributes.html#how_stored\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как атрибуты хранятся в системе&lt;/span&gt;&lt;/a&gt;Как атрибуты хранятся в системе&lt;/h2&gt;\n&lt;p&gt;Системные атрибуты могут храниться различными способами, зависящими от типа объекта. Они могут не храниться, а рассчитываться во время вычислений. Пользовательские атрибуты хранятся в виде словаря ключ-значение. Значение закодировано в виде YSON, поэтому обращение к значению атрибута требует распаковки.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //tmp/@my_attribute &lt;span class=\"hljs-string\"&gt;'{x=10; y=[\"hello\"; \"world\"]}'&lt;/span&gt;\nyt get //tmp/@my_attribute/x\n10\nyt get //tmp/@my_attribute/y/1\n&lt;span class=\"hljs-string\"&gt;\"world\"&lt;/span&gt;\n\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //tmp/@my_attribute/y/@inner_attribute attr\nyt get //tmp/@my_attribute/y/@inner_attribute\n&lt;span class=\"hljs-string\"&gt;\"attr\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"233\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-233\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-233\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-233.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"ru/user-guide/storage/attributes.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Получение всех атрибутов объекта&lt;/span&gt;\nyt get //tmp/@\n{\n  &lt;span class=\"hljs-string\"&gt;\"creation_time\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"2013-12-06T19:00:48.256444Z\"&lt;/span&gt;;\n  &lt;span class=\"hljs-string\"&gt;\"locks\"&lt;/span&gt; = [];\n ...\n}\n\n&lt;span class=\"hljs-comment\"&gt;# Получение конкретного атрибута объекта&lt;/span&gt;\nyt get //tmp/@&lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt;\n&lt;span class=\"hljs-string\"&gt;\"map_node\"&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Установка конкретного атрибута объекта&lt;/span&gt;\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //tmp/@my_attribute &lt;span class=\"hljs-string\"&gt;\"my_value\"&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Удаление атрибута&lt;/span&gt;\nyt remove //tmp/@my_attribute\n\n&lt;span class=\"hljs-comment\"&gt;# создание таблицы&lt;/span&gt;\n&lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'{\"a\": 10, \"b\": \"hello\"}'&lt;/span&gt; | yt write //tmp/my_table --format json\n\n&lt;span class=\"hljs-comment\"&gt;# Получение первого чанка таблицы&lt;/span&gt;\nyt get //tmp/my_table/@chunk_ids/0\n&lt;span class=\"hljs-string\"&gt;\"3ab1-cd56f-3ec0064-c8998820\"&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Удаление таблицы&lt;/span&gt;\nyt remove //tmp/my_table --force\n\n\n&lt;span class=\"hljs-comment\"&gt;# Запрос списка с атрибутами&lt;/span&gt;\nyt list / --attribute &lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt; --format &lt;span class=\"hljs-string\"&gt;'&amp;lt;format=pretty&amp;gt;yson'&lt;/span&gt;\n[\n    &amp;lt;\n        &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"map_node\"&lt;/span&gt;\n    &amp;gt; &lt;span class=\"hljs-string\"&gt;\"home\"&lt;/span&gt;;\n    &amp;lt;\n        &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"map_node\"&lt;/span&gt;\n    &amp;gt; &lt;span class=\"hljs-string\"&gt;\"kiwi\"&lt;/span&gt;;\n   ....\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"237\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-237\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-237\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-237.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"path_attr\"&gt;&lt;a href=\"ru/user-guide/storage/attributes.html#path_attr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атрибуты на путях&lt;/span&gt;&lt;/a&gt;Атрибуты на путях&lt;/h2&gt;\n&lt;p&gt;Популярным сценарием использования атрибутов является аннотирование пути к таблицам и файлам при задании запросов. Подробную информацию можно найти в разделах &lt;a href=\"user-guide/data-processing/operations/operations-options.html#path_attributes\"&gt;Настройки операций&lt;/a&gt; и &lt;a href=\"user-guide/storage/ypath.html#known_attributes\"&gt;YPath&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/storage/attributes.md","sourcePath":"ru/user-guide/storage/attributes.md"},"headings":[{"title":"Общая информация","href":"ru/user-guide/storage/attributes.html#common","level":2},{"title":"Системные атрибуты","href":"ru/user-guide/storage/attributes.html#system_attr","level":2},{"title":"Пользовательские атрибуты","href":"ru/user-guide/storage/attributes.html#user_attr","level":2},{"title":"Как атрибуты хранятся в системе","href":"ru/user-guide/storage/attributes.html#how_stored","level":2},{"title":"Примеры","href":"ru/user-guide/storage/attributes.html#examples","level":2},{"title":"Атрибуты на путях","href":"ru/user-guide/storage/attributes.html#path_attr","level":2}],"title":"Атрибуты"},"router":{"pathname":"ru/user-guide/storage/attributes","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"fe
