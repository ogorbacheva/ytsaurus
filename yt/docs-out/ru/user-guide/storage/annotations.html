        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе описываются аннотации таблиц, директорий и других узлов &lt;a href=\"user-guide/storage/cypress.html\"&gt;Кипариса&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"rationale\"&gt;&lt;a href=\"ru/user-guide/storage/annotations.html#rationale\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Предназначение аннотаций&lt;/span&gt;&lt;/a&gt;Предназначение аннотаций&lt;/h2&gt;\n&lt;p&gt;Аннотации — это способ снабдить таблицу, директорию или любой другой узел Кипариса коротким описанием.&lt;/p&gt;\n&lt;p&gt;Формально таким описанием может служить произвольный текст длиной до 1 КБ, состоящий из неуправляющих ASCII-символов, однако рекомендуется придерживаться формата Markdown.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Аннотации хранятся в памяти мастер-серверов YTsaurus. Рекомендуется ограничивать содержимое аннотаций одним-двумя предложениями и ссылками на более подробную документацию.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"annotation_attribute\"&gt;&lt;a href=\"ru/user-guide/storage/annotations.html#annotation_attribute\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атрибут annotation&lt;/span&gt;&lt;/a&gt;Атрибут annotation&lt;/h2&gt;\n&lt;p&gt;У всех узлов Кипариса имеется атрибут &lt;code&gt;annotation&lt;/code&gt;, значением которого является &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON string&lt;/a&gt;. Значение можно задать, как и для других атрибутов:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/project/path/table/@annotation &lt;span class=\"hljs-string\"&gt;'\"This table contains valuable data.\"'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"28\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-28\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-28\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-28.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Удаление производится обычным образом:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt remove //home/project/path/table/@annotation\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"32\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-32\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-32\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-32.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Атрибут &lt;code&gt;annotation&lt;/code&gt; присутствует всегда, но по умолчанию равен &lt;code&gt;null&lt;/code&gt;. Удаление сбрасывает атрибут до значения &lt;code&gt;null&lt;/code&gt;, однако формально он продолжает существовать.&lt;/p&gt;\n&lt;p&gt;Таким образом, проверка существования атрибута &lt;code&gt;annotation&lt;/code&gt; всегда возвращает положительный результат и потому бесполезна. Вместо этого следует проверять атрибут на равенство &lt;code&gt;null&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Такая особенность поведения связана с наследованием.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"inheritance\"&gt;&lt;a href=\"ru/user-guide/storage/annotations.html#inheritance\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Наследование&lt;/span&gt;&lt;/a&gt;Наследование&lt;/h2&gt;\n&lt;p&gt;Аннотация может сопровождать как таблицу, так и целое поддерево. Чтобы добавить аннотацию поддерева, установите ее на соответствующую директорию. После этого любой узел, рекурсивно содержащийся в ней и не обладающий собственной аннотацией, отобразит ее в своем атрибуте &lt;code&gt;annotation&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Иными словами, атрибут &lt;code&gt;annotation&lt;/code&gt; наследуется: в нем всегда отображается ближайшая ненулевая аннотация предка. Поиск начинается с самого узла.&lt;/p&gt;\n&lt;p&gt;Чтобы понять, какому предку принадлежит отображаемая аннотация, существует атрибут &lt;code&gt;annotation_path&lt;/code&gt;. Он доступен только для чтения и содержит полный путь к соответствующему предку или к самому узлу, если аннотирован непосредственно он.&lt;/p&gt;\n&lt;h2 id=\"web_interface\"&gt;&lt;a href=\"ru/user-guide/storage/annotations.html#web_interface\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поддержка в веб-интерфейсе&lt;/span&gt;&lt;/a&gt;Поддержка в веб-интерфейсе&lt;/h2&gt;\n&lt;p&gt;Веб-интерфейс поддерживает отображение аннотаций и воспринимает формат Markdown — диалект &lt;a href=\"https://ydocs.tech/en/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YFM&lt;/a&gt;, который поддерживается пакетом &lt;a href=\"https://www.npmjs.com/package/@doc-tools/transform\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;@doc-tools/transform&lt;/a&gt;.&lt;br /&gt;\nАннотации отображаются в разделе &lt;strong&gt;Navigation&lt;/strong&gt;, на вкладке &lt;strong&gt;Annotation&lt;/strong&gt; выбранного узла. Чтобы отредактировать аннотацию, нажмите &lt;strong&gt;Edit metadata&lt;/strong&gt; и перейдите на вкладку &lt;strong&gt;Description&lt;/strong&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/storage/annotations.md","sourcePath":"ru/user-guide/storage/annotations.md"},"headings":[{"title":"Предназначение аннотаций","href":"ru/user-guide/storage/annotations.html#rationale","level":2},{"title":"Атрибут annotation","href":"ru/user-guide/storage/annotations.html#annotation_attribute","level":2},{"title":"Наследование","href":"ru/user-guide/storage/annotations.html#inheritance","level":2},{"title":"Поддержка в веб-интерфейсе","href":"ru/user-guide/storage/annotations.html#web_interface","level":2}],"title":"Аннотации"},"router":{"pathname":"ru/user-guide/storage/annotations","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
