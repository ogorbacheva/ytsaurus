        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе содержится информация о пакетной обработке запросов (batch-запросах), приведены примеры использования для &lt;a href=\"user-guide/storage/batch-requests.html#python_api\"&gt;Python&lt;/a&gt;, &lt;a href=\"user-guide/storage/batch-requests.html#c_plus_plus_api\"&gt;C++&lt;/a&gt; и &lt;a href=\"user-guide/storage/batch-requests.html#java_api\"&gt;Java&lt;/a&gt; API.&lt;/p&gt;\n&lt;p&gt;При работе с системой YTsaurus каждая команда порождает отдельный запрос к мастер-серверу. Запрос несет в себе накладные расходы, зачастую более высокие, чем непосредственно выполнение команды. Поэтому объединение нескольких команд в один запрос может существенно ускорить процессы, которые посылают много легких команд к &lt;a href=\"user-guide/storage/cypress.html\"&gt;Кипарису&lt;/a&gt; и основную часть времени находятся в ожидании ответа. Такой запрос называется &lt;strong&gt;Batch-запросом&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Мастер-сервер Кипариса выполнит команды из batch-запроса в произвольном порядке и вернет все полученные результаты. Ошибки, возникающие при выполнении отдельных команд, не влияют на другие команды.&lt;/p&gt;\n&lt;p&gt;При этом с точки зрения RPS-лимитов, устанавливаемых мастер-сервером, batch-запрос ничем не отличается от последовательности составляющих его команд и стоит сообразно.&lt;/p&gt;\n&lt;h2 id=\"concurrency\"&gt;&lt;a href=\"ru/user-guide/storage/batch-requests.html#concurrency\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Concurrency&lt;/span&gt;&lt;/a&gt;Concurrency&lt;/h2&gt;\n&lt;p&gt;Batch-запрос на мастере Кипариса выполняется как набор независимых команд, конкретный порядок в выполнении команд не гарантируется. Все команды учитываются в квоте команд пользователя. У Batch-запроса существует параметр &lt;code&gt;concurrency&lt;/code&gt;, который регулирует параллельность исполнения команд. Значение параметра ограничивает количество одновременно выполняющихся команд, тем самым позволяет не превышать допустимое число одновременных обращений к мастеру для пользователя, в противном случае в ответ на запрос вернётся ошибка &lt;code&gt;User 'user' has exceeded its request queue size limit&lt;/code&gt;. По умолчанию параметр имеет значение 50 (одновременно выполняющихся команд), а ограничение у пользователя равно 100, что позволит избегать ошибок с превышением ограничения. Превышение ограничения представляет собой не фатальную ошибку, в случае ее возникновения рекомендуется делать перезапрос. При использовании высокоуровневых SDK перезапрос будет делаться автоматически.&lt;/p&gt;\n&lt;h2 id=\"python_api\"&gt;&lt;a href=\"ru/user-guide/storage/batch-requests.html#python_api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Python API&lt;/span&gt;&lt;/a&gt;Python API&lt;/h2&gt;\n&lt;p&gt;В python API доступен метод &lt;code&gt;create_batch_client()&lt;/code&gt;, который позволяет, имея простого клиента (&lt;code&gt;client = yt.YtClient(&amp;lt;cluster-name&amp;gt;)&lt;/code&gt;) , создать клиента для объединения нескольких команд в один batch-запрос (&lt;code&gt;client.create_batch_client()&lt;/code&gt;). Пример использования представлен ниже:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\n\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; __name__ == &lt;span class=\"hljs-string\"&gt;\"__main__\"&lt;/span&gt;:\n    client = yt.YtClient(&amp;lt;cluster-name&amp;gt;)\n\n    batch_client = client.create_batch_client()\n    list_rsp = batch_client.&lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"/\"&lt;/span&gt;)\n    exists_rsp = batch_client.exists(&lt;span class=\"hljs-string\"&gt;\"/\"&lt;/span&gt;)\n    batch_client.commit_batch()\n\n    &lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt; list_rsp.get_result()\n    &lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt; exists_rsp.get_result()\n\n&lt;span class=\"hljs-comment\"&gt;#['cooked_logs', 'home', 'logs', 'projects', 'statbox', 'sys', 'tmp', 'user_sessions', 'userdata', 'userfeat', 'userstats']&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;#true&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"24\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-24\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-24\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-24.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В результате выполнения запроса с помощью &lt;code&gt;batch_client&lt;/code&gt; в ответ возвращается специальный объект типа &lt;code&gt;BatchResponse&lt;/code&gt;, который обладает следующей структурой, представленной ниже.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;BatchResponse&lt;/span&gt;(&lt;span class=\"hljs-title class_ inherited__\"&gt;object&lt;/span&gt;):\n    ...\n\n    &lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;get_result&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;self&lt;/span&gt;):\n        ...\n\n    &lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;get_error&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;self&lt;/span&gt;):\n        ...\n\n    &lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;is_ok&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;self&lt;/span&gt;):\n        ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"28\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-28\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-28\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-28.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Указать &lt;a href=\"user-guide/storage/formats.html\"&gt;формат&lt;/a&gt; возвращаемых данных отдельной команды через &lt;code&gt;batch_client&lt;/code&gt; нельзя. Причина в том, что формат возвращаемых данных един для всего batch-запроса.&lt;/p&gt;\n&lt;h2 id=\"c_plus_plus_api\"&gt;&lt;a href=\"ru/user-guide/storage/batch-requests.html#c_plus_plus_api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C++ API&lt;/span&gt;&lt;/a&gt;C++ API&lt;/h2&gt;\n&lt;p&gt;В С++ API для выполнения batch-запроса необходимо:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;создать объект типа &lt;code&gt;TBatchRequest&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;с его помощью задать команды (методы &lt;code&gt;TBatchRequest&lt;/code&gt; возвращают &lt;code&gt;TFuture&lt;/code&gt; на соответствующий тип);&lt;/li&gt;\n&lt;li&gt;передать его в метод &lt;code&gt;ExecuteBatch&lt;/code&gt; у клиента;&lt;/li&gt;\n&lt;li&gt;достать результаты из полученных ранее &lt;code&gt;TFuture&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;При этом, если какие-то команды завершились с ошибкой, узнать об этом можно, вызвав &lt;code&gt;future.GetValue&lt;/code&gt; или &lt;code&gt;future.HasException&lt;/code&gt; (т. е. вызов &lt;code&gt;ExecuteBatch&lt;/code&gt; не будет возвращать ошибку). Пример использования представлен ниже.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-meta\"&gt;#&lt;span class=\"hljs-keyword\"&gt;include&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;&amp;lt;yt/cpp/mapreduce/interface/client.h&amp;gt;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\"hljs-meta\"&gt;#&lt;span class=\"hljs-keyword\"&gt;include&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;&amp;lt;yt/cpp/mapreduce/common/helpers.h&amp;gt;&lt;/span&gt;&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;using&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;namespace&lt;/span&gt; NYT;\n\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;int&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;main&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;()&lt;/span&gt;\n&lt;/span&gt;{\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; client = &lt;span class=\"hljs-built_in\"&gt;CreateClient&lt;/span&gt;(&amp;lt;cluster-name&amp;gt;);\n\n    TBatchRequest batchRequest;\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; listRsp = batchRequest.&lt;span class=\"hljs-built_in\"&gt;List&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"/\"&lt;/span&gt;, &lt;span class=\"hljs-built_in\"&gt;TListOptions&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;MaxSize&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;5&lt;/span&gt;));\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; existsRsp = batchRequest.&lt;span class=\"hljs-built_in\"&gt;Exists&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp\"&lt;/span&gt;);\n\n    client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;ExecuteBatch&lt;/span&gt;(batchRequest);\n\n    &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; (&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; item : listRsp.&lt;span class=\"hljs-built_in\"&gt;GetValue&lt;/span&gt;()) {\n        Cerr &amp;lt;&amp;lt; &lt;span class=\"hljs-built_in\"&gt;NodeToYsonString&lt;/span&gt;(item) &amp;lt;&amp;lt; Endl;\n    }\n    Cerr &amp;lt;&amp;lt; &lt;span class=\"hljs-built_in\"&gt;NodeToYsonString&lt;/span&gt;(existsRsp.&lt;span class=\"hljs-built_in\"&gt;GetValue&lt;/span&gt;()) &amp;lt;&amp;lt; Endl;\n\n    &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n}\n\n&lt;span class=\"hljs-comment\"&gt;/* Output of program:\n\"tmp\"\n\"projects\"\n\"logs\"\n\"userfeat\"\n\"cooked_logs\"\n%true\n*/&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"63\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-63\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-63\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-63.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"java_api\"&gt;&lt;a href=\"ru/user-guide/storage/batch-requests.html#java_api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Java API&lt;/span&gt;&lt;/a&gt;Java API&lt;/h2&gt;\n&lt;p&gt;В Java API доступен метод &lt;code&gt;executeBatch&lt;/code&gt;, который позволяет, имея клиента для работы с Кипарисом &lt;code&gt;yt.cypress()&lt;/code&gt;, создать объект типа &lt;code&gt;BatchRequest&lt;/code&gt; для выполнения нескольких команд в рамках одного batch-запроса. Все команды, отправленные через &lt;code&gt;BatchRequest&lt;/code&gt;, возвращают объекты типа &lt;code&gt;future&lt;/code&gt;, которые будут выполнены после вызова метода &lt;code&gt;execute&lt;/code&gt;. Пример использования представлен ниже.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs java\"&gt;&lt;span class=\"hljs-type\"&gt;BatchRequest&lt;/span&gt; &lt;span class=\"hljs-variable\"&gt;request&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; yt.cypress().executeBatch(transactionId, pingAncestorTransactions, Option.empty());\nListF&amp;lt;CompletableFuture&amp;lt;YTreeNode&amp;gt;&amp;gt; futures = Cf.arrayList();\n\n&lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; (YPath path : spec.getInputTables()) {\n\tfutures.add(request.get(transactionId, pingAncestorTransactions, path.attribute(&lt;span class=\"hljs-string\"&gt;\"sorted\"&lt;/span&gt;), Cf.set()));\n}\n\nrequest.execute().join();\n\n&lt;span class=\"hljs-type\"&gt;boolean&lt;/span&gt; &lt;span class=\"hljs-variable\"&gt;result&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; futures.forAll(x -&amp;gt; {\n\t&lt;span class=\"hljs-type\"&gt;YTreeNode&lt;/span&gt; &lt;span class=\"hljs-variable\"&gt;node&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; x.join();\n\t&lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; node.isBooleanNode() &amp;amp;&amp;amp; node.boolValue();\n});\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"70\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-70\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-70\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-70.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/storage/batch-requests.md","sourcePath":"ru/user-guide/storage/batch-requests.md"},"headings":[{"title":"Concurrency","href":"ru/user-guide/storage/batch-requests.html#concurrency","level":2},{"title":"Python API","href":"ru/user-guide/storage/batch-requests.html#python_api","level":2},{"title":"C++ API","href":"ru/user-guide/storage/batch-requests.html#c_plus_plus_api","level":2},{"title":"Java API","href":"ru/user-guide/storage/batch-requests.html#java_api","level":2}],"title":"Пакетная обработка запросов"},"router":{"pathname":"ru/user-guide/storage/batch-requests","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
