        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе описаны алгоритмы сжатия, поддерживаемые YTsaurus.&lt;/p&gt;\n&lt;p&gt;В YTsaurus пользовательские данные по умолчанию хранятся и передаются в сжатом виде.&lt;/p&gt;\n&lt;p&gt;Система самостоятельно производит сжатие:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;При записи в таблицу или файл данные разбиваются на части — &lt;a href=\"user-guide/storage/chunks.html\"&gt;чанки&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Каждый чанк сжимается алгоритмом, указанным для данного файла или таблицы, и записывается на диск.&lt;/li&gt;\n&lt;li&gt;Для передачи по сети данные считываются с диска уже в сжатом виде.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"get_compression\"&gt;&lt;a href=\"ru/user-guide/storage/compression.html#get_compression\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Просмотр алгоритма сжатия&lt;/span&gt;&lt;/a&gt;Просмотр алгоритма сжатия&lt;/h2&gt;\n&lt;p&gt;В системе YTsaurus могут быть сжаты чанки, файлы и таблицы.&lt;/p&gt;\n&lt;p&gt;Алгоритм сжатия указан в атрибуте &lt;code&gt;compression_codec&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Для чанков атрибут &lt;code&gt;compression_codec&lt;/code&gt; задает алгоритм сжатия всех блоков чанка. Разные чанки внутри файла или таблицы могут быть сжаты с помощью разных алгоритмов.&lt;/li&gt;\n&lt;li&gt;Для таблиц и файлов &lt;code&gt;compression_codec&lt;/code&gt; определяет алгоритм сжатия по умолчанию. Он будет использован, если для отдельных чанков файла или таблицы алгоритм не указан. Значение &lt;code&gt;compression_codec&lt;/code&gt; по умолчанию: для таблиц — &lt;code&gt;lz4&lt;/code&gt;, для файлов — &lt;code&gt;none&lt;/code&gt; (без сжатия).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Степень сжатия данных указана в атрибутах &lt;code&gt;compressed_data_size&lt;/code&gt; и &lt;code&gt;uncompressed_data_size&lt;/code&gt; чанка, таблицы или файла:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Для чанков атрибут &lt;code&gt;uncompressed_data_size&lt;/code&gt; показывает размер чанка до сжатия, атрибут &lt;code&gt;compressed_data_size&lt;/code&gt; — размер чанка после сжатия.&lt;/li&gt;\n&lt;li&gt;Для таблиц и файлов атрибут &lt;code&gt;uncompressed_data_size&lt;/code&gt; показывает суммарный размер несжатых данных всех чанков объекта, атрибут &lt;code&gt;compressed_data_size&lt;/code&gt; — размер сжатых данных.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Статистика по алгоритмам сжатия, используемых в чанках таблицы, содержится в атрибуте &lt;code&gt;compression_statistics&lt;/code&gt; таблицы.&lt;/p&gt;\n&lt;h2 id=\"set_compression\"&gt;&lt;a href=\"ru/user-guide/storage/compression.html#set_compression\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Изменение алгоритма сжатия&lt;/span&gt;&lt;/a&gt;Изменение алгоритма сжатия&lt;/h2&gt;\n&lt;p&gt;Чтобы изменить алгоритм сжатия существующей статической таблицы, установите новое значение атрибута &lt;code&gt;compression_codec&lt;/code&gt;. Затем запустите команду &lt;code&gt;merge&lt;/code&gt;, чтобы выполнить повторное сжатие чанков.&lt;/p&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //path/to/table/@compression_codec zstd_3\nyt merge --src //path/to/table --dst //path/to/table --spec &lt;span class=\"hljs-string\"&gt;'{force_transform = %true}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"74\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-74\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-74\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-74.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Чтобы изменить алгоритм сжатия &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;динамической таблицы&lt;/a&gt;, установите новое значение атрибута &lt;code&gt;compression_codec&lt;/code&gt;. Затем выполните &lt;code&gt;remount-table&lt;/code&gt;. Старые чанки со временем будут повторно сжаты в процессе компактификации. Скорость сжатия зависит от объема таблицы, скорости записи, настроек фоновой компактификации.&lt;/p&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //path/to/table/@compression_codec zstd_3\nyt remount-table //path/to/table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"81\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-81\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-81\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-81.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если в таблицу идёт постоянная запись, как правило, нет необходимости в &lt;a href=\"user-guide/dynamic-tables/compaction.html#forced_compaction\"&gt;форсированном сжатии&lt;/a&gt;. Если требуется форсировать сжатие, используйте &lt;code&gt;forced compaction&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"compression_codecs\"&gt;&lt;a href=\"ru/user-guide/storage/compression.html#compression_codecs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поддерживаемые алгоритмы сжатия&lt;/span&gt;&lt;/a&gt;Поддерживаемые алгоритмы сжатия&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Алгоритм сжатия&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;th&gt;Скорость сжатия/распаковки&lt;/th&gt;\n&lt;th&gt;Степень сжатия&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;none&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Без сжатия.&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;snappy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Подробнее об алгоритме &lt;a href=\"https://google.github.io/snappy/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;snappy&lt;/a&gt;.&lt;/td&gt;\n&lt;td&gt;+++&lt;/td&gt;\n&lt;td&gt;+-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;zlib_[1..9]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Система YTsaurus поддерживает все 9 уровней. Чем больше уровень, тем сильнее и тем медленнее сжимаются данные. Подробнее об алгоритме &lt;a href=\"https://zlib.net\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;zlib&lt;/a&gt;.&lt;/td&gt;\n&lt;td&gt;++&lt;/td&gt;\n&lt;td&gt;++&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;lz4&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Алгоритм сжатия по умолчанию для таблиц. Подробнее об алгоритме &lt;a href=\"https://lz4.github.io/lz4/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;lz4&lt;/a&gt;.&lt;/td&gt;\n&lt;td&gt;+++&lt;/td&gt;\n&lt;td&gt;+&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;lz4_high_compression&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Алгоритм &lt;code&gt;lz4&lt;/code&gt; c включенной опцией &lt;code&gt;high_compression&lt;/code&gt;. Сжимает эффективнее, но существенно медленнее. По степени сжатия уступает &lt;code&gt;zlib&lt;/code&gt;.&lt;/td&gt;\n&lt;td&gt;++&lt;/td&gt;\n&lt;td&gt;++-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;zstd_[1..21]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Подробнее об алгоритме &lt;a href=\"https://github.com/facebook/zstd\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;zstd&lt;/a&gt;.&lt;/td&gt;\n&lt;td&gt;++&lt;/td&gt;\n&lt;td&gt;++&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;brotli_[1..11]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Данный алгоритм рекомендуется к использованию для данных, которые не являются временными. Рекомендуется использовать уровни 3, 5 и 8 — они имеют лучшее соотношение объема и скорости. Подробнее об алгоритме &lt;a href=\"https://github.com/google/brotli\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;brotli&lt;/a&gt;.&lt;/td&gt;\n&lt;td&gt;++&lt;/td&gt;\n&lt;td&gt;+++&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;lzma_[0..9]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Подробнее об алгоритме &lt;a href=\"https://www.7-zip.org\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;lzma&lt;/a&gt;.&lt;/td&gt;\n&lt;td&gt;+&lt;/td&gt;\n&lt;td&gt;+++&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;bzip2_[1..9]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Подробнее об алгоритме &lt;a href=\"http://www.bzip.org\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;bzip2&lt;/a&gt;.&lt;/td&gt;\n&lt;td&gt;++&lt;/td&gt;\n&lt;td&gt;++&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"best_practice\"&gt;&lt;a href=\"ru/user-guide/storage/compression.html#best_practice\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Рекомендации&lt;/span&gt;&lt;/a&gt;Рекомендации&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Для файлов, которые используются в операции в виде &lt;a href=\"user-guide/storage/links.html\"&gt;симлинков&lt;/a&gt; на чанки, сжатие чаще всего не применяется.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;lz4&lt;/code&gt; часто используется для актуальных данных. Алгоритм обеспечивает высокую скорость сжатия и распаковки при приемлемом коэффициенте сжатия.&lt;/li&gt;\n&lt;li&gt;Когда необходимо максимальное сжатие, а длительное время работы является приемлемым, часто используется &lt;code&gt;brotli_8&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Для операций, состоящих из малого количества джобов, например, &lt;code&gt;final sort&lt;/code&gt; или &lt;code&gt;sorted merge&lt;/code&gt;, рекомендуется добавить отдельную стадию обработки — сжатие данных в операции merge с большим числом джобов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Хотя алгоритмы с сильным сжатием (&lt;code&gt;zlib&lt;/code&gt;, &lt;code&gt;zstd&lt;/code&gt;, &lt;code&gt;brotli&lt;/code&gt;) позволяют экономить место на диске, их скорость сжатия на порядок ниже, чем у алгоритма по умолчанию (&lt;code&gt;lz4&lt;/code&gt;). Использование алгоритмов с сильным сжатием может привести к значительному росту времени выполнения операций. Рекомендуется использовать их только для таблиц, которые занимают много места, но редко меняются.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"benchmarks\"&gt;&lt;a href=\"ru/user-guide/storage/compression.html#benchmarks\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сравнение алгоритмов сжатия&lt;/span&gt;&lt;/a&gt;Сравнение алгоритмов сжатия&lt;/h2&gt;\n&lt;p&gt;Способ, описанный ниже, работает только для статических таблиц.&lt;/p&gt;\n&lt;p&gt;Чтобы определить, какой алгоритм лучше подойдет для определенной таблицы, запустите &lt;code&gt;yt run-compression-benchmarks TABLE&lt;/code&gt;. Из таблицы будет взят сэмпл, по умолчанию равный 1 ГБ. Он будет сжат всеми алгоритмами.&lt;/p&gt;\n&lt;p&gt;После завершения операции вы увидите &lt;code&gt;codec/cpu/encode&lt;/code&gt;, &lt;code&gt;codec/cpu/decode&lt;/code&gt; и &lt;code&gt;compression_ratio&lt;/code&gt; для каждого алгоритма. Подробнее смотрите в разделе &lt;a href=\"user-guide/problems/jobstatistics.html#system_stats\"&gt;Статистики джобов&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Для алгоритмов с несколькими уровнями сжатия по умолчанию используются минимальный, средний и максимальный уровни.&lt;br /&gt;\nЧтобы получить результаты по всем уровням, используйте опцию &lt;code&gt;--all-codecs&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt run-compression-benchmarks //home/dev/tutorial/compression_benchmark_data\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"287\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-287\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-287\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-287.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;[\n    {\n        &lt;span class=\"hljs-string\"&gt;\"codec\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"brotli_1\"&lt;/span&gt;,\n        &lt;span class=\"hljs-string\"&gt;\"codec/cpu/decode\"&lt;/span&gt;: 2103,\n        &lt;span class=\"hljs-string\"&gt;\"codec/cpu/encode\"&lt;/span&gt;: 2123,\n        &lt;span class=\"hljs-string\"&gt;\"compression_ratio\"&lt;/span&gt;: 0.10099302059669339\n    },\n    ...\n    {\n        &lt;span class=\"hljs-string\"&gt;\"codec\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"brotli_11\"&lt;/span&gt;,\n        &lt;span class=\"hljs-string\"&gt;\"codec/cpu/decode\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"Not launched\"&lt;/span&gt;,\n        &lt;span class=\"hljs-string\"&gt;\"codec/cpu/encode\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"Timed out\"&lt;/span&gt;, &lt;span class=\"hljs-comment\"&gt;# сжатие не успело завершиться за стандартный --time-limit-sec (200)&lt;/span&gt;\n        &lt;span class=\"hljs-string\"&gt;\"compression_ratio\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"Timed out\"&lt;/span&gt;\n    },\n    ...\n    {\n        &lt;span class=\"hljs-string\"&gt;\"codec\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"none\"&lt;/span&gt;,\n        &lt;span class=\"hljs-string\"&gt;\"codec/cpu/decode\"&lt;/span&gt;: 0,\n        &lt;span class=\"hljs-string\"&gt;\"codec/cpu/encode\"&lt;/span&gt;: 247,\n        &lt;span class=\"hljs-string\"&gt;\"compression_ratio\"&lt;/span&gt;: 1.0\n    },\n    ...\n    {\n        &lt;span class=\"hljs-string\"&gt;\"codec\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"zstd_11\"&lt;/span&gt;,\n        &lt;span class=\"hljs-string\"&gt;\"codec/cpu/decode\"&lt;/span&gt;: 713,\n        &lt;span class=\"hljs-string\"&gt;\"codec/cpu/encode\"&lt;/span&gt;: 15283,\n        &lt;span class=\"hljs-string\"&gt;\"compression_ratio\"&lt;/span&gt;: 0.07451278201257201\n    },\n    ...\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"288\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-288\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-288\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-288.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/storage/compression.md","sourcePath":"ru/user-guide/storage/compression.md"},"headings":[{"title":"Просмотр алгоритма сжатия","href":"ru/user-guide/storage/compression.html#get_compression","level":2},{"title":"Изменение алгоритма сжатия","href":"ru/user-guide/storage/compression.html#set_compression","level":2},{"title":"Поддерживаемые алгоритмы сжатия","href":"ru/user-guide/storage/compression.html#compression_codecs","level":2},{"title":"Рекомендации","href":"ru/user-guide/storage/compression.html#best_practice","level":2},{"title":"Сравнение алгоритмов сжатия","href":"ru/user-guide/storage/compression.html#benchmarks","level":2}],"title":"Сжатие"},
