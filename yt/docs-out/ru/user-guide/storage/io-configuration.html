        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе перечислены опции для настройки ввода-вывода операций, а также опции команд чтения и записи таблиц.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В данном разделе рассмотрена только важная часть опций, которая может помочь пользователю. Фактически опций гораздо больше, и они позволяют достаточно тонко настраивать различные параметры при чтении/записи данных. Чаще всего в такой настройке нет необходимости и использование значений не по умолчанию может навредить.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Управлять чтением и записью можно через &lt;a href=\"user-guide/storage/formats.html\"&gt;форматы табличных данных&lt;/a&gt; и с помощью конфигов &lt;code&gt;TableReader&lt;/code&gt;, &lt;code&gt;TableWriter&lt;/code&gt; и &lt;code&gt;ControlAttributes&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"table_reader\"&gt;&lt;a href=\"ru/user-guide/storage/io-configuration.html#table_reader\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конфиг TableReader &lt;/span&gt;&lt;/a&gt;Конфиг TableReader &lt;/h2&gt;\n&lt;p&gt;Данные настройки можно указать при чтении таблицы с помощью опции &lt;code&gt;table_reader&lt;/code&gt;, либо в конфиге &lt;code&gt;table_reader&lt;/code&gt; в ветке &lt;code&gt;job_io&lt;/code&gt; в спецификации операции. Для операций с несколькими типами джобов, конфиг указывается в соответствующих ветках: &lt;code&gt;map_job_io&lt;/code&gt;, &lt;code&gt;sort_job_io&lt;/code&gt;, &lt;code&gt;reduce_job_io&lt;/code&gt; и так далее.&lt;/p&gt;\n&lt;h3 id=\"sampling\"&gt;&lt;a href=\"ru/user-guide/storage/io-configuration.html#sampling\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Семплирование&lt;/span&gt;&lt;/a&gt;Семплирование&lt;/h3&gt;\n&lt;p&gt;В конфиге &lt;code&gt;table_reader&lt;/code&gt; можно указать настройки семплирования &lt;code&gt;sampling_seed&lt;/code&gt;, &lt;code&gt;sampling_rate&lt;/code&gt; и &lt;code&gt;sampling_mode&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;...\nspec = {&lt;span class=\"hljs-string\"&gt;\"job_io\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"table_reader\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"sampling_seed\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;42&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"sampling_rate\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;0.3&lt;/span&gt;}}}\nyt.run_map(map_function, &lt;span class=\"hljs-built_in\"&gt;input&lt;/span&gt;, output, spec=spec)\n...\nyt.read_table(table_path, table_reader={&lt;span class=\"hljs-string\"&gt;\"sampling_seed\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;42&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"sampling_rate\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;0.3&lt;/span&gt;})\n...\nyt.read_table(table_path, table_reader={&lt;span class=\"hljs-string\"&gt;\"sampling_seed\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;42&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"sampling_rate\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;0.3&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"sampling_mode\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"block\"&lt;/span&gt;})\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"28\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-28\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-28\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-28.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Значение &lt;code&gt;\"sampling_rate\": 0.3&lt;/code&gt; приведет к тому, что операция — функция &lt;code&gt;map_function&lt;/code&gt; — получит на вход 30% всех строк из входной таблицы.&lt;br /&gt;\nОпция &lt;code&gt;sampling_seed&lt;/code&gt; позволяет управлять генератором случайных чисел, который  используется для семплирования строк. Гарантируется, что при одинаковом &lt;code&gt;sampling_seed&lt;/code&gt;, детерминированной &lt;code&gt;map_function&lt;/code&gt; и том же наборе входных чанков будет сгенерирован одинаковый выход. Если &lt;code&gt;sampling_seed&lt;/code&gt; не был указан в спецификации, то он будет случайным.&lt;/p&gt;\n&lt;p&gt;Опция &lt;code&gt;sampling_mode&lt;/code&gt; может принимать значения &lt;code&gt;row&lt;/code&gt; или &lt;code&gt;block&lt;/code&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;При &lt;code&gt;sampling_mode = row&lt;/code&gt; (вариант по умолчанию) все данные читаются с диска независимо от указанной вероятности. Тем не менее, это может быть дешевле, чем самостоятельное семплирование данных, так как семплирование будет производиться на стороне системы сразу после чтения данных с диска.&lt;/li&gt;\n&lt;li&gt;Вариант &lt;code&gt;sampling_mode = block&lt;/code&gt; старается пропорционально уменьшить количество прочитанных с диска данных, и поэтому в идеальных обстоятельствах должен приводить к пропорциональному ускорению операции. Ценой этого является тот факт, что результат не является полноценным сэмплированием в математическом смысле этого слова, а является лишь его приближением: данные разбиваются на достаточно большие блоки идущих подряд строк, и далее происходит сэмплирование данных блоков целиком. Особенно заметна неполноценность семплирования будет на сортированных и упорядоченных таблицах.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"window_size\"&gt;&lt;a href=\"ru/user-guide/storage/io-configuration.html#window_size\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Размер буфера подаваемых джобу данных&lt;/span&gt;&lt;/a&gt;Размер буфера подаваемых джобу данных&lt;/h3&gt;\n&lt;p&gt;Размером буфера подаваемых джобу данных можно управлять через параметр &lt;code&gt;window_size&lt;/code&gt; в байтах. По умолчанию значение равно 20 МБ.&lt;/p&gt;\n&lt;p&gt;Настройка буфера подаваемых джобу данных:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;...\nspec = {&lt;span class=\"hljs-string\"&gt;\"job_io\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"table_reader\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"window_size\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;20971520&lt;/span&gt;}}}\nyt.run_map(map_function, &lt;span class=\"hljs-built_in\"&gt;input&lt;/span&gt;, output, spec=spec)\n...\nyt.read_table(table_path, table_reader={&lt;span class=\"hljs-string\"&gt;\"window_size\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;20971520&lt;/span&gt;})\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"56\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-56\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-56\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-56.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"table_writer\"&gt;&lt;a href=\"ru/user-guide/storage/io-configuration.html#table_writer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конфиг TableWriter&lt;/span&gt;&lt;/a&gt;Конфиг TableWriter&lt;/h2&gt;\n&lt;p&gt;Данные настройки можно указать в конфиге &lt;code&gt;table_writer&lt;/code&gt; при записи табличных данных, либо в конфиге &lt;code&gt;table_writer&lt;/code&gt; в &lt;code&gt;job_io&lt;/code&gt; настройках операции. Для операций с несколькими типами джобов, конфиг указывается в соответствующих ветках: &lt;code&gt;map_job_io&lt;/code&gt;, &lt;code&gt;sort_job_io&lt;/code&gt;, &lt;code&gt;reduce_job_io&lt;/code&gt; и так далее.&lt;/p&gt;\n&lt;h3 id=\"max_row_weight\"&gt;&lt;a href=\"ru/user-guide/storage/io-configuration.html#max_row_weight\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничение на размеры строк в таблице&lt;/span&gt;&lt;/a&gt;Ограничение на размеры строк в таблице&lt;/h3&gt;\n&lt;p&gt;При записи табличных данных система YTsaurus проверяет размер. Если размер оказывается больше определенного лимита, то запись прерывается и соответствующий джоб или команда &lt;code&gt;write&lt;/code&gt; заканчивается неудачей.&lt;/p&gt;\n&lt;p&gt;По умолчанию ограничение на размер строки — 16 МБ, однако оно может быть настроено в конфиге &lt;code&gt;table_writer&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Изменение ограничения на размер строки в таблице:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;...\nspec = {&lt;span class=\"hljs-string\"&gt;\"job_io\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"table_writer\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"max_row_weight\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;32&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;1024&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;1024&lt;/span&gt;}}}\nyt.run_map(map_function, &lt;span class=\"hljs-built_in\"&gt;input&lt;/span&gt;, output, spec=spec)\n...\nyt.write_table(table_path, table_writer={&lt;span class=\"hljs-string\"&gt;\"max_row_weight\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;32&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;1024&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;1024&lt;/span&gt;})\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"75\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-75\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-75\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-75.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code&gt;max_row_weight&lt;/code&gt; указывается в байтах. Не может быть больше 128 МБ.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;table_writer&lt;/code&gt; позволяет на этапе создания таблицы в операции или при запуске операции &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt; управлять различными параметрами хранения.&lt;/p&gt;\n&lt;h3 id=\"desired_chunk_size\"&gt;&lt;a href=\"ru/user-guide/storage/io-configuration.html#desired_chunk_size\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Размер чанка&lt;/span&gt;&lt;/a&gt;Размер чанка&lt;/h3&gt;\n&lt;p&gt;Настройка спецификации &lt;code&gt;desired_chunk_size&lt;/code&gt; задаёт желаемый размер чанка в байтах.&lt;br /&gt;\nДля преобразования таблицы, чтобы размер чанка был близок к 1 КБ, можно вызвать команду merge.&lt;/p&gt;\n&lt;p&gt;Изменение размера чанка:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt merge --mode auto --spec &lt;span class=\"hljs-string\"&gt;'{\"force_transform\"=true; \"job_io\"={\"table_writer\"={\"desired_chunk_size\"=1024}}}'&lt;/span&gt; --src &amp;lt;&amp;gt; --dst &amp;lt;&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"91\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-91\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-91\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-91.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Данные, приходящие в джобы, не могут быть меньше размера блока. Размер блока задаётся &lt;code&gt;block_size&lt;/code&gt; в байтах, минимальное значение 1 КБ, значение по умолчанию  — 16 МБ.&lt;/p&gt;\n&lt;h3 id=\"upload_replication_factor\"&gt;&lt;a href=\"ru/user-guide/storage/io-configuration.html#upload_replication_factor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Коэффициент репликации&lt;/span&gt;&lt;/a&gt;Коэффициент репликации&lt;/h3&gt;\n&lt;p&gt;Настройка спецификации &lt;code&gt;upload_replication_factor&lt;/code&gt; задаёт число реплик для чанков таблицы или файла. Значение по умолчанию — 2, максимальное — 10.&lt;br /&gt;\nДля изменения числа реплик достаточно выполнить команду merge.&lt;/p&gt;\n&lt;p&gt;Изменение коэффициента репликации:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt merge --mode auto --spec &lt;span class=\"hljs-string\"&gt;'{\"force_transform\"=true; \"job_io\"={\"table_writer\"={\"upload_replication_factor\"=10}}}'&lt;/span&gt; --src &amp;lt;&amp;gt; --dst &amp;lt;&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"104\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-104\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-104\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-104.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Чтобы изменить количество реплик в фоновом режиме, выполните &lt;code&gt;set&lt;/code&gt; на &lt;code&gt;replication_factor&lt;/code&gt; таблицы. Аналогичное верно и для записи в таблицу с предварительно заданным параметром.&lt;/p&gt;\n&lt;h3 id=\"sample_rate\"&gt;&lt;a href=\"ru/user-guide/storage/io-configuration.html#sample_rate\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Коэффициент семплирования&lt;/span&gt;&lt;/a&gt;Коэффициент семплирования&lt;/h3&gt;\n&lt;p&gt;Настройка спецификации &lt;code&gt;sample_rate&lt;/code&gt; задаёт долю строк, которые будут отобраны и помещены в метаданные чанка.&lt;br /&gt;\nДанный набор строк влияет на построение корзин для &lt;code&gt;partition&lt;/code&gt; стадии сортировки. Увеличение значения &lt;code&gt;sample_rate&lt;/code&gt; позволяет системе более точно находить распределение ключей, но увеличивает нагрузку на систему: увеличится объем метаданных, время записи и чтения.&lt;br /&gt;\nЧтобы избежать перекоса в размере корзин при объединении значений в одну партицию для колонки, в которой мало значений, увеличьте &lt;code&gt;sample_rate&lt;/code&gt; перед фазой &lt;code&gt;sort&lt;/code&gt; или &lt;code&gt;reduce&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Значение по умолчанию 1/10 000. Например, если в таблице 100 000 строк, то в семпле будет 10. Следовательно, партиций в сортировке будет не более 10.&lt;/p&gt;\n&lt;p&gt;Чтобы получить максимально возможный &lt;code&gt;sample_rate&lt;/code&gt;, равный 0,1%, выполните команду merge:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt merge --mode auto --spec &lt;span class=\"hljs-string\"&gt;'{\"force_transform\"=true; \"job_io\"={\"table_writer\"={\"sample_rate\"=0.001}}}'&lt;/span&gt; --src &amp;lt;&amp;gt; --dst &amp;lt;&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"120\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-120\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-120\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-120.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"control_attributes\"&gt;&lt;a href=\"ru/user-guide/storage/io-configuration.html#control_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конфиг ControlAttributes&lt;/span&gt;&lt;/a&gt;Конфиг ControlAttributes&lt;/h2&gt;\n&lt;p&gt;При чтении нескольких таблиц или разных диапазонов одной таблицы полезно иметь служебную информацию, которая позволит понять из какой таблицы и какого диапазона этой таблицы пришли данные.&lt;br /&gt;\nЧтобы поддержать эту информацию в джобах или при чтении таблицы, было введено понятие системных управляющих (контрольных) записей, которые доставляют такую информацию.&lt;br /&gt;\nДанное понятие является внутренним, и его представление в потоке данных, который приходит на вход джобу, зависит от заказанного формата.&lt;/p&gt;\n&lt;p&gt;Рассмотрим контрольные атрибуты на примере формата YSON: в таком случае в потоке данных могут встречаться специальные записи, которые имеют тип Yson Entity, а не Yson Map, как обычные записи с данными. Они содержат в атрибутах служебную информацию.&lt;br /&gt;\nНапример, если пришла запись &lt;code&gt;&amp;lt;table_index=2&amp;gt;#&lt;/code&gt;, это означает, что все последующие записи в потоке будут из второй входной таблицы до тех пор, пока не придет новая контрольная запись, в которой будет указан другой &lt;code&gt;table_index&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Конфиг &lt;code&gt;control_attributes&lt;/code&gt; поддерживает следующие опции, в скобках указаны их значения по умолчанию:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;enable_table_index&lt;/code&gt; (&lt;code&gt;false&lt;/code&gt;) — присылать контрольные записи с индексами входных таблиц (поле &lt;code&gt;table_index&lt;/code&gt; типа &lt;code&gt;int64&lt;/code&gt; в атрибутах контрольной записи);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;enable_row_index&lt;/code&gt; (&lt;code&gt;false&lt;/code&gt;) — присылать контрольные записи с номером записи входной таблицы (поле &lt;code&gt;row_index&lt;/code&gt; типа &lt;code&gt;int64&lt;/code&gt; в атрибутах контрольной записи);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;enable_range_index&lt;/code&gt; (&lt;code&gt;false&lt;/code&gt;) — присылать контрольные записи с номером диапазона среди заказанных диапазонов входной таблицы (поле &lt;code&gt;range_index&lt;/code&gt; типа &lt;code&gt;int64&lt;/code&gt; в атрибутах контрольной записи); подробнее можно прочитать в разделе &lt;a href=\"user-guide/storage/ypath.html#known_attributes\"&gt;YPATH&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;enable_key_switch&lt;/code&gt; (&lt;code&gt;false&lt;/code&gt;) — присылать записи при переключении ключа входных данных (поле &lt;code&gt;key_switch&lt;/code&gt; типа &lt;code&gt;bool&lt;/code&gt; в атрибутах контрольной записи). Настройка имеет силу только в фазе &lt;code&gt;reduce&lt;/code&gt; в операциях Map-Reduce и Reduce.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа с контрольными атрибутами в случае языковых SDK скрыта от пользователей, данная информация представляется в виде более удобных примитивов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Опции, регулирующие наличие и отсутствие табличных индексов во входном потоке, представлены в разных слоях системы.&lt;br /&gt;\nОпция &lt;code&gt;enable_input_table_index&lt;/code&gt; находится в спецификации операции в конфиге, описывающем пользовательский процесс.&lt;br /&gt;\nЗначение этой опции перезаписывает значение опции &lt;code&gt;enable_table_index&lt;/code&gt; в конфиге &lt;code&gt;control_attributes&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Опция &lt;code&gt;enable_table_index&lt;/code&gt; позволяет включать и выключать &lt;code&gt;table index&lt;/code&gt; на уровне формата.&lt;br /&gt;\nВо многих форматах индексы выключены по умолчанию, поэтому их необходимо включать. Во многих форматах есть опции, отвечающие за представление &lt;code&gt;table_index&lt;/code&gt; в данном формате.&lt;br /&gt;\nПодробнее про &lt;code&gt;table_index&lt;/code&gt; в разных форматах можно прочитать в разделе &lt;a href=\"user-guide/data-processing/operations/table-switch.html\"&gt;Переключение таблиц&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Представление &lt;code&gt;row_index&lt;/code&gt;, &lt;code&gt;range_index&lt;/code&gt; и &lt;code&gt;key_switch&lt;/code&gt; поддерживается только в форматах YSON и JSON.&lt;/p&gt;\n&lt;p&gt;Пример потока входных данных в reduce-джобе в формате YSON, с указанием всех контрольных атрибутов:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&amp;lt;&lt;span class=\"hljs-string\"&gt;\"table_index\"&lt;/span&gt;=&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;&amp;gt;#;\n&amp;lt;&lt;span class=\"hljs-string\"&gt;\"range_index\"&lt;/span&gt;=&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;&amp;gt;#;\n&amp;lt;&lt;span class=\"hljs-string\"&gt;\"row_index\"&lt;/span&gt;=&lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;;&amp;gt;#;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"2\"&lt;/span&gt;;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n&amp;lt;&lt;span class=\"hljs-string\"&gt;\"key_switch\"&lt;/span&gt;=%&lt;span class=\"hljs-literal\"&gt;&lt;span class=\"hljs-keyword\"&gt;true&lt;/span&gt;&lt;/span&gt;;&amp;gt;#;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"3\"&lt;/span&gt;;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n&amp;lt;&lt;span class=\"hljs-string\"&gt;\"key_switch\"&lt;/span&gt;=%&lt;span class=\"hljs-literal\"&gt;&lt;span class=\"hljs-keyword\"&gt;true&lt;/span&gt;&lt;/span&gt;;&amp;gt;#;\n&amp;lt;&lt;span class=\"hljs-string\"&gt;\"row_index\"&lt;/span&gt;=&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;&amp;gt;#;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"1\"&lt;/span&gt;;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"177\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-177\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-177\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-177.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Включение контрольных атрибутов в операции и при чтении:&lt;/p&gt;\n&lt;div class=\"yfm-tabs\" data-diplodoc-group=\"defaultTabsGroup-589ckufi\" data-diplodoc-variant=\"regular\"&gt;\n&lt;div class=\"yfm-tab-list\" role=\"tablist\"&gt;\n&lt;div data-diplodoc-id=\"cli\" data-diplodoc-key=\"cli\" class=\"yfm-tab yfm-tab-group active\" role=\"tab\" tabindex=\"0\" data-diplodoc-is-active=\"true\"&gt;CLI&lt;/div&gt;\n&lt;div data-diplodoc-id=\"python\" data-diplodoc-key=\"python\" class=\"yfm-tab yfm-tab-group\" role=\"tab\" tabindex=\"-1\" data-diplodoc-is-active=\"false\"&gt;Python&lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"ibsqdumc\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"CLI\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; --control-attributes=&lt;span class=\"hljs-string\"&gt;\"{enable_row_index=true;}\"&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"//path/to/table[#10:#20]\"&lt;/span&gt;\n{&lt;span class=\"hljs-string\"&gt;\"&lt;span class=\"hljs-variable\"&gt;$value&lt;/span&gt;\"&lt;/span&gt;: null, &lt;span class=\"hljs-string\"&gt;\"&lt;span class=\"hljs-variable\"&gt;$attributes&lt;/span&gt;\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"row_index\"&lt;/span&gt;: 10}}\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"191\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-191\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-191\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-191.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"fekke2xe\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"Python\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;...\nspec = {&lt;span class=\"hljs-string\"&gt;\"job_io\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"control_attributes\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"enable_row_index\"&lt;/span&gt;: &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;}}}\nyt.run_map(map_function, &lt;span class=\"hljs-built_in\"&gt;input&lt;/span&gt;, output, spec=spec) &lt;span class=\"hljs-comment\"&gt;# will place \"@row_index\" key to input records&lt;/span&gt;\n...\nyt.read_table(path, control_attributes={&lt;span class=\"hljs-string\"&gt;\"enable_row_index\"&lt;/span&gt;: &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;}, &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=yt.YsonFormat())\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"194\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-194\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-194\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-194.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/storage/io-configuration.md","sourcePath":"ru/user-guide/storage/io-configuration.md"},"headings":[{"title":"Конфиг TableReader ","href":"ru/user-guide/storage/io-configuration.html#table_reader","level":2,"items":[{"title":"Семплирование","href":"ru/user-guide/storage/io-configuration.html#sampling","level":3},{"title":"Размер буфера подаваемых джобу данных","href":"ru/user-guide/storage/io-configuration.html#window_size","level":3}]},{"title":"Конфиг TableWriter","href":"ru/user-guide/storage/io-configuration.html#table_writer","level":2,"items":[{"title":"Ограничение на размеры строк в таблице","href":"ru/user-guide/storage/io-configuration.html#max_row_weight","level":3},{"title":"Размер чанка","href":"ru/user-guide/storage/io-configuration.html#desired_chunk_size","level":3},{"title":"Коэффициент репликации","href":"ru/user-guide/storage/io-configuration.html#upload_replication_factor","level":3},{"title":"Коэффициент семплирования","href":"ru/user-guide/storage/io-configuration.html#sample_rate","level":3}]},{"title":"Конфиг ControlAttributes","href":"ru/user-guide/storage/io-configuration.html#control_attributes","level":2}],"title":"Настройки ввода/вывода"},"router":{"pathname":"ru/user-guide/storage/io-configuration","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
