            {"data":{"leading":false,"html":"&lt;p&gt;В разделе описаны основные &lt;a href=\"user-guide/storage/objects.html#object_types\"&gt;типы объектов&lt;/a&gt; системы YTsaurus. Представлена таблица с ключевыми &lt;a href=\"user-guide/storage/objects.html#attributes\"&gt;атрибутами каждого объекта&lt;/a&gt; и описано понятие &lt;a href=\"user-guide/storage/objects.html#object_ids\"&gt;идентификатора объекта&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"object_types\"&gt;&lt;a href=\"ru/user-guide/storage/objects.html#object_types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типы объектов&lt;/span&gt;&lt;/a&gt;Типы объектов&lt;/h2&gt;\n&lt;p&gt;Основные типы объектов в YTsaurus:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/objects.html#files\"&gt;Файлы&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/objects.html#tables\"&gt;Таблицы&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/objects.html#links\"&gt;Ссылки&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/objects.html#yson_doc\"&gt;YSON-документы&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/objects.html#primitive_types\"&gt;Примитивные типы&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/user-guide/storage/objects.html#internal_objects\"&gt;Системные объекты&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Описание объектов занимает большую часть метаинформации, которая хранится в реплицированном виде в памяти мастер-серверов &lt;a href=\"user-guide/storage/cypress.html\"&gt;Кипариса&lt;/a&gt;. Кипарис содержит в себе различную системную информацию, а также данные о том, где хранятся пользовательские данные.&lt;/p&gt;\n&lt;p&gt;Для любого узла Кипариса может присутствовать несколько версий, поскольку в контексте каждой &lt;a href=\"user-guide/storage/transactions.html\"&gt;транзакции&lt;/a&gt; состояние узла может выглядеть по-разному.&lt;/p&gt;\n&lt;h3 id=\"files\"&gt;&lt;a href=\"ru/user-guide/storage/objects.html#files\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Файлы&lt;/span&gt;&lt;/a&gt;Файлы&lt;/h3&gt;\n&lt;p&gt;Это узлы Кипариса, имеющие тип &lt;strong&gt;file&lt;/strong&gt; и предназначенные для хранения больших бинарных данных в системе.&lt;br /&gt;\nФайлы состоят из множества чанков — &lt;a href=\"user-guide/storage/chunks.html#attributes\"&gt;являются владельцами чанков&lt;/a&gt;.&lt;br /&gt;\nЧанки организованы в виде специальной древовидной структуры данных, в которой листьями являются чанки, а промежуточными вершинами — чанк-листы.&lt;/p&gt;\n&lt;p&gt;Подробнее можно прочитать в разделе &lt;a href=\"user-guide/storage/files.html\"&gt;Файлы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"tables\"&gt;&lt;a href=\"ru/user-guide/storage/objects.html#tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таблицы&lt;/span&gt;&lt;/a&gt;Таблицы&lt;/h3&gt;\n&lt;p&gt;Это узлы типа &lt;strong&gt;table&lt;/strong&gt;, предназначенные для хранения больших пользовательских данных. Таблицы бывают двух типов: &lt;a href=\"user-guide/storage/static-tables.html\"&gt;Статические&lt;/a&gt; и &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Динамические&lt;/a&gt;. Логически таблица представляет из себя последовательность строк. Каждая строка состоит из колонок.&lt;br /&gt;\nЗначения колонок типизированы и могут содержать произвольные структурированные данные, поддерживаемые языком &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"links\"&gt;&lt;a href=\"ru/user-guide/storage/objects.html#links\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ссылки&lt;/span&gt;&lt;/a&gt;Ссылки&lt;/h3&gt;\n&lt;p&gt;Ссылки представляют собой узлы типа &lt;strong&gt;link&lt;/strong&gt;, ссылающиеся на другие объекты по пути, указанному при создании объекта.&lt;br /&gt;\nВсе обращения к узлу-ссылке автоматически переадресуются к целевому объекту.&lt;br /&gt;\nПодробнее можно прочитать в разделе &lt;a href=\"user-guide/storage/links.html\"&gt;Ссылки&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"yson_doc\"&gt;&lt;a href=\"ru/user-guide/storage/objects.html#yson_doc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YSON-документы&lt;/span&gt;&lt;/a&gt;YSON-документы&lt;/h3&gt;\n&lt;p&gt;YSON-документ — это узел Кипариса, имеющий тип  &lt;strong&gt;document&lt;/strong&gt; и предназначенный для хранения произвольных YSON-структур.&lt;/p&gt;\n&lt;p&gt;Поддерживаются запросы и модификации внутри документа. Адресация внутри документа осуществляется с помощью языка &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPath&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Подробнее можно прочитать в разделе &lt;a href=\"user-guide/storage/yson-docs.html\"&gt;YSON-документы&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Подробнее про формат YSON можно прочитать в разделе &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON.&lt;/a&gt;&lt;/p&gt;\n&lt;h3 id=\"primitive_types\"&gt;&lt;a href=\"ru/user-guide/storage/objects.html#primitive_types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примитивные типы&lt;/span&gt;&lt;/a&gt;Примитивные типы&lt;/h3&gt;\n&lt;p&gt;Узел Кипариса может содержать значение примитивного типа: строку, число, словарь, список. В таблице представлено описание примитивных типов узлов Кипариса.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Имя типа&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;string_node&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Узел Кипариса, содержащий строку&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;int64_node&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Узел Кипариса, содержащий целое знаковое число&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;uint64_node&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Узел Кипариса, содержащий целое беззнаковое число&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;double_node&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Узел Кипариса, содержащий вещественное число&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;map_node&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Словарь в Кипарисе (ключи — строки, значения — другие узлы). Если проводить аналогию с файловой системой, то это каталог&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;list_node&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Устаревшее, в качестве альтернативы предлагается использовать document.&lt;/strong&gt; Упорядоченный список в Кипарисе (значения — другие узлы)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;boolean_node&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Узел кипариса, содержащий булево значение&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"internal_objects\"&gt;&lt;a href=\"ru/user-guide/storage/objects.html#internal_objects\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Системные объекты&lt;/span&gt;&lt;/a&gt;Системные объекты&lt;/h3&gt;\n&lt;p&gt;Кроме перечисленных выше объектов, существуют внутренние объекты: транзакции, чанки, аккаунты, пользователи и группы. Такие объекты не версионируются.&lt;br /&gt;\nСистемные объекты перечислены в таблице:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Имя объекта&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/transactions.html\"&gt;Транзакция&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Чанк&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk_list&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Чанклист&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;erasure_chunk&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Erasure-chunk&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;account&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Аккаунт&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Пользователь&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;group&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Группа&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"object_ids\"&gt;&lt;a href=\"ru/user-guide/storage/objects.html#object_ids\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Идентификаторы объектов&lt;/span&gt;&lt;/a&gt;Идентификаторы объектов&lt;/h2&gt;\n&lt;p&gt;Каждый объект имеет уникальный &lt;strong&gt;идентификатор&lt;/strong&gt;, представляющий собой 128-битное число, по формату совпадающее с GUID. Это число можно представить в виде четырех 32-битных чисел: &lt;code&gt;a-b-c-d&lt;/code&gt;. Обычно при печати идентификатора компоненты &lt;code&gt;a&lt;/code&gt;, &lt;code&gt;b&lt;/code&gt;, &lt;code&gt;c&lt;/code&gt; и &lt;code&gt;d&lt;/code&gt; записываются в шестнадцатеричном виде. Каждая из этих компонент имеет свой смысл, описание приведено в таблице.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th style=\"text-align:center\"&gt;Компонент&lt;/th&gt;\n&lt;th&gt;Назначение&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:center\"&gt;&lt;code&gt;a&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Номер Hydra-эпохи, в которой был создан данный объект&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:center\"&gt;&lt;code&gt;b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Номер мутации в пределах эпохи, на которой был создан данный объект&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:center\"&gt;&lt;code&gt;c[16..31]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор группы мастеров (cell id), представляет собой уникальное 16-битное число, однозначно определяющее кластер. Данный идентификатор можно найти в веб-интерфейсе кластера напротив мастер-серверов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:center\"&gt;&lt;code&gt;c[0..15]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип объекта&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:center\"&gt;&lt;code&gt;d&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Хеш, представляет собой псевдоуникальное случайное число, выбираемое в момент создания объекта.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Таким образом, идентификатор объекта зависит от кластера, на котором создан данный объект, а также от момента времени (в смысле номеров мутаций), когда объект был создан. В пределах одной мутации может быть создано более одного объекта, тогда они будут отличаться значением хеша. Это различие гарантируется механизмом порождения хешей. Пример идентификатора: &lt;code&gt;28bb5-75b04b-3fe012f-8b4eda94&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"attributes\"&gt;&lt;a href=\"ru/user-guide/storage/objects.html#attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атрибуты объектов&lt;/span&gt;&lt;/a&gt;Атрибуты объектов&lt;/h2&gt;\n&lt;p&gt;Все объекты системы имеют атрибуты, представленные в таблице:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th style=\"text-align:left\"&gt;&lt;strong&gt;Атрибут&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;&lt;code&gt;id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор объекта&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;&lt;code&gt;type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип объекта&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;&lt;code&gt;ref_counter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;integer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Количество &lt;a href=\"user-guide/storage/objects.html#ref_counter\"&gt;сильных ссылок&lt;/a&gt; на объект&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;&lt;code&gt;supported_permissions&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список поддерживаемых прав доступа&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;&lt;code&gt;effective_acl&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Acl&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Эффективный ACL объекта&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;У некоторых объектов системы есть дополнительные атрибуты: &lt;code&gt;inherit_acl&lt;/code&gt;, &lt;code&gt;acl&lt;/code&gt; и &lt;code&gt;owner&lt;/code&gt;, влияющие на доступ к данному объекту. Эти атрибуты носят название &lt;strong&gt;дескриптор управления доступом&lt;/strong&gt; (ACD, access control descriptor). Подробно про ACD в разделе &lt;a href=\"user-guide/storage/access-control.html\"&gt;Управление доступом&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"ref_counter\"&gt;&lt;a href=\"ru/user-guide/storage/objects.html#ref_counter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Счетчики ссылок&lt;/span&gt;&lt;/a&gt;Счетчики ссылок&lt;/h3&gt;\n&lt;p&gt;Для отслеживания времени жизни объекта используются &lt;strong&gt;счетчики ссылок&lt;/strong&gt;. Объект живет в системе до тех пор, пока на него есть &lt;strong&gt;сильные ссылки&lt;/strong&gt;. Количество последних можно узнать из атрибута ref_counter. Как только это число становится равным нулю, объект превращается в &lt;strong&gt;зомби&lt;/strong&gt; и подлежит удалению. Это удаление производится не мгновенно, вместо этого есть специальная &lt;strong&gt;очередь на удаление&lt;/strong&gt; (GC queue), из которой зомби забираются порциями контролируемого размера и разрушаются. Размер задается внутренними конфигурационными параметрами системы. После того, как объект стал зомби, обратиться к нему уже нельзя, даже явно построив путь по идентификатору.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/storage/objects.md","sourcePath":"ru/user-guide/storage/objects.md"},"headings":[{"title":"Типы объектов","href":"ru/user-guide/storage/objects.html#object_types","level":2,"items":[{"title":"Файлы","href":"ru/user-guide/storage/objects.html#files","level":3},{"title":"Таблицы","href":"ru/user-guide/storage/objects.html#tables","level":3},{"title":"Ссылки","href":"ru/user-guide/storage/objects.html#links","level":3},{"title":"YSON-документы","href":"ru/user-guide/storage/objects.html#yson_doc","level":3},{"title":"Примитивные типы","href":"ru/user-guide/storage/objects.html#primitive_types","level":3},{"title":"Системные объекты","href":"ru/user-guide/storage/objects.html#internal_objects","level":3}]},{"title":"Идентификаторы объектов","href":"ru/user-guide/storage/objects.html#object_ids","level":2},{"title":"Атрибуты объектов","href":"ru/user-guide/storage/objects.html#attributes","level":2,"items":[{"title":"Счетчики ссылок","href":"ru/user-guide/storage/objects.html#ref_counter","level":3}]}],"title":"Объекты"},"router":{"pathname":"ru/user-guide/storage/objects","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
