        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе содержится вводная информация о статических таблицах, их типах и &lt;a href=\"ru/user-guide/storage/static-tables.html#schema\"&gt;схеме&lt;/a&gt;.&lt;br /&gt;\nКроме статических таблиц, система YTsaurus поддерживает динамические таблицы. Подробнее о видах и возможностях динамических таблиц можно прочитать в разделе &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Динамические таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"common\"&gt;&lt;a href=\"ru/user-guide/storage/static-tables.html#common\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общее описание&lt;/span&gt;&lt;/a&gt;Общее описание&lt;/h2&gt;\n&lt;p&gt;Статические таблицы — это классический тип таблиц в системе YTsaurus.&lt;br /&gt;\nФизически такие таблицы разбиты на части (&lt;a href=\"user-guide/storage/chunks.html\"&gt;чанки&lt;/a&gt;), каждая часть содержит фрагмент записей таблицы.&lt;/p&gt;\n&lt;p&gt;Название «статические» подразумевает, что данные, которые уже записаны в таблицу, невозможно обновить без перезаписи. Однако можно добавлять записи в конец таблицы.&lt;/p&gt;\n&lt;p&gt;Также данные в таблице можно менять с помощью следующих операций, но следует понимать, что в типичном случае потребуется чтение и перезапись целых чанков таблицы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;слияние&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/data-processing/operations/erase.html\"&gt;удаление&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Статические таблицы бывают &lt;a href=\"ru/user-guide/storage/static-tables.html#sorted_tables\"&gt;сортированные&lt;/a&gt; и &lt;a href=\"ru/user-guide/storage/static-tables.html#unsorted_tables\"&gt;несортированные&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"sorted_tables\"&gt;&lt;a href=\"ru/user-guide/storage/static-tables.html#sorted_tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сортированные таблицы&lt;/span&gt;&lt;/a&gt;Сортированные таблицы&lt;/h3&gt;\n&lt;p&gt;Для сортированной таблицы известен набор неизменяемых ключевых колонок.&lt;br /&gt;\nЗаписи таблицы оказываются физически или логически упорядочены по ключу. Поэтому сортированные таблицы дают возможность эффективного поиска данных по ключу.&lt;/p&gt;\n&lt;p&gt;Таблица сортированная — если в таблице есть хотя бы одна ключевая колонка, атрибут таблицы &lt;code&gt;sorted&lt;/code&gt; равен &lt;code&gt;true&lt;/code&gt;. Атрибут доступен только для чтения.&lt;/p&gt;\n&lt;p&gt;В схеме сортированных таблиц есть ключевые (сортированные) колонки. В схеме они помечены полем &lt;code&gt;sort_order&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Список всех ключевых колонок доступен в атрибутах таблицы &lt;code&gt;key_columns&lt;/code&gt; и &lt;code&gt;sorted_by&lt;/code&gt;. Последовательность колонок определяется в схеме таблицы. Атрибуты доступны только для чтения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Записи, добавляемые в конец сортированной таблицы, не должны нарушать порядок сортировки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"unsorted_tables\"&gt;&lt;a href=\"ru/user-guide/storage/static-tables.html#unsorted_tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Несортированные таблицы&lt;/span&gt;&lt;/a&gt;Несортированные таблицы&lt;/h3&gt;\n&lt;p&gt;Для несортированных таблиц понятие ключа не определено, поэтому поиск данных по ключу возможен только с помощью чтения всего содержимого таблицы. Но возможно обращение по номерам строк.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Добавление записей в конец несортированной таблицы лежит в основе многих способов загрузки данных в кластеры системы YTsaurus.&lt;br /&gt;\nЧтобы эта операция была эффективна, учитывайте следующие особенности:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Любой запрос на изменение обрабатывается мастер-сервером. Такая схема плохо масштабируется, поэтому не стоит делать более 100 записей в секунду.&lt;/li&gt;\n&lt;li&gt;Запись небольшого числа строк в одном запросе приводит к появлению мелких чанков, которые нагружают мастер-сервер большим объемом метаданных и делают чтение менее эффективным.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"attributes\"&gt;&lt;a href=\"ru/user-guide/storage/static-tables.html#attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атрибуты&lt;/span&gt;&lt;/a&gt;Атрибуты&lt;/h2&gt;\n&lt;p&gt;Любая статическая таблица имеет атрибуты, представленные в таблице:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Имя&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;sorted&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Является ли таблица сортированной.&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;key_columns&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имена ключевых колонок.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;dynamic&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Является ли таблица динамической.&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;schema&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TableSchema&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Схема таблицы.&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;row_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;integer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Количество строк в таблице.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data_weight&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;integer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;\"Логический\" объем несжатых данных, записанных в таблицу. Зависит только от значений в ячейках таблицы и количества строк. Вычисляется как &lt;code&gt;row_count + sum(data_weight(value))&lt;/code&gt; по всем значениям в ячейках таблицы. &lt;code&gt;data_weight&lt;/code&gt; для значения зависит от физического типа значения: для &lt;code&gt;int64&lt;/code&gt;, &lt;code&gt;uint64&lt;/code&gt;, &lt;code&gt;double&lt;/code&gt; — 8 байт; для &lt;code&gt;bool&lt;/code&gt;, &lt;code&gt;null&lt;/code&gt; — 1 байт; для &lt;code&gt;string&lt;/code&gt; —  длина строки; для &lt;code&gt;any&lt;/code&gt; — длина значения, сериализованного в binary YSON.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Кроме того, таблица является объектом, который владеет чанками, то есть имеет соответствующие атрибуты, представленные в &lt;a href=\"user-guide/storage/chunks.html#attributes\"&gt;таблице&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"schema\"&gt;&lt;a href=\"ru/user-guide/storage/static-tables.html#schema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема статических таблиц&lt;/span&gt;&lt;/a&gt;Схема статических таблиц&lt;/h2&gt;\n&lt;p&gt;Схема статической таблицы представляет из себя список описаний колонок. Подробное описание формата схемы приведено в разделе &lt;a href=\"user-guide/storage/static-schema.html\"&gt;Схема данных&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"limitations\"&gt;&lt;a href=\"ru/user-guide/storage/static-tables.html#limitations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения&lt;/span&gt;&lt;/a&gt;Ограничения&lt;/h2&gt;\n&lt;p&gt;На строки и схему таблицы наложен ряд ограничений по размеру и типу содержимого:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Количество колонок в статической таблице не может быть больше 32768. Не рекомендуется использовать более тысячи колонок.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Имя колонки представляется произвольной последовательностью байтов и может содержать от 1 до 256 символов. Также оно не может начинаться с зарезервированного системного префикса &lt;code&gt;@&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Максимальная длина значений типа &lt;code&gt;string&lt;/code&gt; в статической таблице ограничивается через максимальный вес строки.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Максимальный вес строки  — 128 мегабайт. Вес строки — сумма длин всех значений в данной строке в байтах. При этом длины значений считаются в зависимости от типа:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;int64&lt;/code&gt;, &lt;code&gt;uint64&lt;/code&gt;, &lt;code&gt;double&lt;/code&gt; — 8 байт;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;boolean&lt;/code&gt; — 1 байт;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;string&lt;/code&gt; — длина строки;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;any&lt;/code&gt; — длина структуры сериализованной в binary &lt;a href=\"user-guide/storage/yson.html\"&gt;yson&lt;/a&gt;, в байтах;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;null&lt;/code&gt; — 0 байт.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Максимальный вес ключа в сортированной таблице — 256 килобайт. Ограничение по умолчанию — 16 килобайт. Вес ключа считается аналогично весу строки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Повышать лимит на вес ключа крайне не рекомендуется, так как есть риск переполнения памяти мастер-сервера. Изменение настройки &lt;code&gt;max_key_weight&lt;/code&gt; допустимо только в качестве экстренной меры.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/storage/static-tables.md","sourcePath":"ru/user-guide/storage/static-tables.md"},"headings":[{"title":"Общее описание","href":"ru/user-guide/storage/static-tables.html#common","level":2,"items":[{"title":"Сортированные таблицы","href":"ru/user-guide/storage/static-tables.html#sorted_tables","level":3},{"title":"Несортированные таблицы","href":"ru/user-guide/storage/static-tables.html#unsorted_tables","level":3}]},{"title":"Атрибуты","href":"ru/user-guide/storage/static-tables.html#attributes","level":2},{"title":"Схема статических таблиц","href":"ru/user-guide/storage/static-tables.html#schema","level":2},{"title":"Ограничения","href":"ru/user-guide/storage/static-tables.html#limitations","level":2}],"title":"Статические таблицы"},"router":{"pathname":"ru/user-guide/storage/static-tables","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
