        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе содержится описание работы ACL на колонки, приводятся примеры использования.&lt;/p&gt;\n&lt;h2 id=\"brief_desc\"&gt;&lt;a href=\"ru/user-guide/storage/columnar-acl.html#brief_desc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Краткое описание&lt;/span&gt;&lt;/a&gt;Краткое описание&lt;/h2&gt;\n&lt;p&gt;ACL на колонки позволяют уточнить правила доступа к отдельным колонкам таблицы. Это позволяет хранить в одной таблице как общедоступные данные, так и приватные. При этом процессы и пользователи, которые имеют подходящий доступ, смогут читать все колонки в таблице, включая приватные, а остальные пользователи — только публичные.&lt;/p&gt;\n&lt;h2 id=\"details\"&gt;&lt;a href=\"ru/user-guide/storage/columnar-acl.html#details\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Принцип работы&lt;/span&gt;&lt;/a&gt;Принцип работы&lt;/h2&gt;\n&lt;p&gt;Общие принципы работы системы контроля доступа в системе YTsaurus описаны в разделе &lt;a href=\"user-guide/storage/access-control.html\"&gt;Контроль доступа&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Чтобы установить ACL на колонки, необходимо в ACL узлов — как самих таблиц, так и директорий — использовать ACE специального вида, в которых указан дополнительный атрибут &lt;code&gt;columns&lt;/code&gt;. Подобные ACE (&lt;strong&gt;колоночные&lt;/strong&gt;) никак не участвуют в обычных проверках прав к целым объектам. Такие ACE учитываются на стадии проверки доступа к отдельным колонкам таблиц.&lt;/p&gt;\n&lt;p&gt;Предположим, что система выполняет проверку прав доступа на чтение к таблице &lt;code&gt;T&lt;/code&gt; от имени пользователя &lt;code&gt;U&lt;/code&gt;, при этом данный пользователь хочет прочитать колонки из множества &lt;code&gt;Cs&lt;/code&gt;. Подобные чтения происходят при выполнении команды &lt;code&gt;read-table&lt;/code&gt;, а также при подаче таблицы &lt;code&gt;T&lt;/code&gt; в качестве входной в операцию MapReduce или другие.&lt;/p&gt;\n&lt;p&gt;Описываемая функциональность доступна только для &lt;a href=\"user-guide/storage/static-schema.html\"&gt;схематизированных данных&lt;/a&gt;. В частности, будем считать, что &lt;code&gt;Cs&lt;/code&gt; представляет собой подмножество всех колонок, явно указанных в схеме таблицы &lt;code&gt;T&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Само множество &lt;code&gt;Cs&lt;/code&gt; пользователь обычно указывает, задавая фильтр колонок, например, через &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPath&lt;/a&gt;. В случае, когда никакой фильтр не указан, считается, что &lt;code&gt;Cs&lt;/code&gt; — множество всех колонок, описанных в схеме таблицы. Если при этом схема таблицы нестрогая, то в самих данных могут встретиться дополнительные колонки, но для них никаких специальных проверок не производится.&lt;/p&gt;\n&lt;p&gt;Помимо наличия права &lt;code&gt;read&lt;/code&gt; на всю таблицу у пользователя также должно быть право &lt;code&gt;read&lt;/code&gt; на каждую из колонок множества &lt;code&gt;Cs&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Последнее свойство проверяется следующим образом: рассмотрим имя колонки &lt;code&gt;C&lt;/code&gt; из &lt;code&gt;Cs&lt;/code&gt;. Построим эффективный ACL таблицы &lt;code&gt;T&lt;/code&gt;. Из составляющих его ACE отберем те, которые являются колоночными и применимы к &lt;code&gt;C&lt;/code&gt; (содержат &lt;code&gt;C&lt;/code&gt; в атрибуте &lt;code&gt;columns&lt;/code&gt;); обозначим результат через &lt;code&gt;L&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В случае, если &lt;code&gt;L&lt;/code&gt; пусто, это означает что для колонки &lt;code&gt;C&lt;/code&gt; никакие особые ограничения не действуют, и проверка доступа к данной колонке считается успешной.&lt;/p&gt;\n&lt;p&gt;В противном случае, если нашлась хотя бы одна подходящая ACE, работает следующая логика. Среди построенного ранее списка &lt;code&gt;L&lt;/code&gt; отберем теперь ровно те записи, которые касаются операции чтения (содержат &lt;code&gt;read&lt;/code&gt; в &lt;code&gt;permissions&lt;/code&gt;) и относятся к текущему пользователю &lt;code&gt;U&lt;/code&gt; (&lt;code&gt;U&lt;/code&gt; либо явно упомянут в &lt;code&gt;subjects&lt;/code&gt;, либо принадлежит к одной из групп, упомянутых в &lt;code&gt;subjects&lt;/code&gt;). Новый список обозначим через &lt;code&gt;L'&lt;/code&gt;. Если в &lt;code&gt;L'&lt;/code&gt; есть хотя бы одна разрешающая запись и нет ни одной запрещающей, то проверка успешна; иначе в доступе будет отказано.&lt;/p&gt;\n&lt;h2 id=\"compatibility_mode\"&gt;&lt;a href=\"ru/user-guide/storage/columnar-acl.html#compatibility_mode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Режим совместимости&lt;/span&gt;&lt;/a&gt;Режим совместимости&lt;/h2&gt;\n&lt;p&gt;Существует ситуация, когда пользователи заказывают чтение всей таблицы целиком (то есть не указывают никакой колоночный фильтр) при том, что им нужна лишь малая часть колонок. Если в подобном сценарии установить на таблицу колоночный ACL, то у пользователей, не имеющих доступ к защищаемым колонкам, возникнет ошибка авторизации.&lt;/p&gt;\n&lt;p&gt;На такой случай существует специальный флаг &lt;code&gt;omit_inaccessible_columns&lt;/code&gt; (значение по умолчанию &lt;code&gt;%false&lt;/code&gt;), флаг можно указывать при операциях чтения. Одноименная настройка также имеется в спецификации операций.&lt;/p&gt;\n&lt;p&gt;В случае, если данная опция включена, то при невозможности получить доступ на чтение к какой-либо колонке таблицы (при наличии доступа на чтение к таблице в целом) система скрывает ее полностью от пользователя, а запрашиваемое действие при этом завершается успешно. При этом, в ответе на запрос чтения (в т. н. &lt;code&gt;output parameters&lt;/code&gt;) передаётся список колонок, которые были пропущены при чтении из-за недостатка прав. В случае операции подобная информация отображается в предупреждении от планировщика.&lt;/p&gt;\n&lt;p&gt;Данная возможность активно используется в веб-интерфейсе YTsaurus, чтобы дать возможность просмотреть данные в тех колонках, до которых у пользователя есть доступ и предупредить, что часть колонок скрыта ввиду недоступности.&lt;/p&gt;\n&lt;h2 id=\"example\"&gt;&lt;a href=\"ru/user-guide/storage/columnar-acl.html#example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h2&gt;\n&lt;p&gt;Пусть на таблице установлен ACL, в котором есть следующая ACE:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;{\n    action = allow;\n    subjects = [username];\n    permissions = [&lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt;];\n    columns = [money];\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"60\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-60\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-60\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-60.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Будем также считать, то на всем пути вверх до корня от данной таблицы более нет никаких колоночных ACE.&lt;/p&gt;\n&lt;p&gt;Тогда выполняется следующее:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Любой пользователь, у которого есть доступ &lt;code&gt;read&lt;/code&gt; на данную таблицу, сможет прочитать все колонки, кроме &lt;code&gt;money&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Если пользователь, отличный от &lt;code&gt;username&lt;/code&gt;, попытается прочитать колонку &lt;code&gt;money&lt;/code&gt;, то возникнет ошибка авторизации. Это произойдет как при явном указании имени данной колонки в фильтре, так и при попытке чтения без всякого фильтра.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Пользователь &lt;code&gt;username&lt;/code&gt; сможет прочитать колонку &lt;code&gt;money&lt;/code&gt; (при условии, что у него также есть доступ &lt;code&gt;read&lt;/code&gt; на таблицу целиком).&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"notes\"&gt;&lt;a href=\"ru/user-guide/storage/columnar-acl.html#notes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Замечания&lt;/span&gt;&lt;/a&gt;Замечания&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Установка ACE с разрешением на чтение колонки приводит к тому, что все пользователи, не указанные в ACE, автоматически лишаются права на чтение колонки. Поэтому, прежде чем ограничивать доступ к колонке, убедитесь, что подобные действия не приведут к поломке процессов, работающих с таблицей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;ol&gt;\n&lt;li&gt;В текущей реализации функциональность распространяется лишь на чтение колонок. Поэтому не нужно указывать в атрибуте &lt;code&gt;permissions&lt;/code&gt; права, отличные от &lt;code&gt;read&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Если у таблицы нет схемы, либо схема пустая и слабая, то ограничить доступ к отдельным ее колонкам не получится. Не получится ограничить доступ к колонкам, которые не указаны в схеме, если схема является нестрогой, даже если при этом какие-либо ограничения для них описаны в ACL. Обязательно схематизируйте свои данные и опишите защищаемые колонки в схеме явным образом.&lt;/li&gt;\n&lt;li&gt;Колоночные ACE нужно указывать не только на самих таблицах, но и на директориях. При этом данные ACE наследуются стандартным образом, и их наследование, в частности, обрывается в тех узлах, где выставлено &lt;code&gt;inherit_acl = %false&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;Управление колоночными ACE доступно только администраторам YTsaurus.&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/storage/columnar-acl.md","sourcePath":"ru/user-guide/storage/columnar-acl.md"},"headings":[{"title":"Краткое описание","href":"ru/user-guide/storage/columnar-acl.html#brief_desc","level":2},{"title":"Принцип работы","href":"ru/user-guide/storage/columnar-acl.html#details","level":2},{"title":"Режим совместимости","href":"ru/user-guide/storage/columnar-acl.html#compatibility_mode","level":2},{"title":"Пример","href":"ru/user-guide/storage/columnar-acl.html#example","level":2},{"title":"Замечания","href":"ru/user-guide/storage/columnar-acl.html#notes","level":2}],"title":"Управление доступом к колонкам таблиц"},"router":{"pathname":"ru/user-guide/storage/columnar-acl","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
