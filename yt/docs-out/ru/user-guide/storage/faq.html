        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h4 id=\"structure-in-cell\"&gt;&lt;a href=\"ru/user-guide/storage/faq.html#structure-in-cell\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Можно ли положить в ячейку таблицы произвольную YSON-структуру?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Можно ли положить в ячейку таблицы произвольную YSON-структуру?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Можно, для этого подходят колонки типа &lt;code&gt;any&lt;/code&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"change-table-schema\"&gt;&lt;a href=\"ru/user-guide/storage/faq.html#change-table-schema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Можно ли изменять схему таблицы?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Можно ли изменять схему таблицы?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Можно, примеры и ограничения можно найти в разделе &lt;a href=\"ru/user-guide/storage/static-schema.html#create\"&gt;Схема таблиц&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"file-size-limit\"&gt;&lt;a href=\"ru/user-guide/storage/faq.html#file-size-limit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Насколько большие файлы поддерживает система?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Насколько большие файлы поддерживает система?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Формально длина файла ограничена лишь 64-битным целым типом. Фактически — размером свободного места на узлах кластера. Поскольку файл делится на чанки, то он не обязан храниться на одном узле, поэтому он может превышать размер одного жесткого диска. Настолько большие файлы не могут обрабатываться одним джобом, поэтому работа с ними будет сводиться к использованию команды read_file и чтению по диапазонам.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"move-table\"&gt;&lt;a href=\"ru/user-guide/storage/faq.html#move-table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как переложить таблицу с HDD на SSD?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как переложить таблицу с HDD на SSD?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Изменение типа носителя для таблицы или файла осуществляется путём редактирования первичного медиума таблицы через атрибут &lt;code&gt;primary_medium&lt;/code&gt;. Перед тем, как изменять данный атрибут, таблицу нужно отмонтировать (а в конце смонтировать назад, чтобы вернуть все в прежнее состояние). Например:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt unmount-table --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt; //home/path/to/table\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/path/to/table/@primary_medium ssd_blobs\nyt mount-table --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt; //home/path/to/table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"27\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-27\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-27\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-27.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Сразу после выставления атрибута новые данные будут записываться на SSD, старые данные будут переложены в фоне. Подробнее о том, как влиять на данный процесс и отслеживать его динамику, в разделе &lt;a href=\"ru/user-guide/storage/static-tables.html#medium\"&gt;статические таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"slow-table-read\"&gt;&lt;a href=\"ru/user-guide/storage/faq.html#slow-table-read\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Что делать, если чтение таблицы тормозит?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Что делать, если чтение таблицы тормозит?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Про это есть &lt;a href=\"ru/user-guide/problems/slow-read.html\"&gt;отдельная страница&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"reduce-chunk-usage\"&gt;&lt;a href=\"ru/user-guide/storage/faq.html#reduce-chunk-usage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как уменьшить число используемых чанков в своей квоте?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как уменьшить число используемых чанков в своей квоте?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Если эти чанки занимают таблицы (а это типичный случай), то следует запустить операцию &lt;a href=\"ru/user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt; с параметром &lt;code&gt;combine_chunks = %true&lt;/code&gt;.&lt;br /&gt;\nТаблица будет пересобрана из более крупных чанков, тем самым можно уменьшить использование чанков в своей квоте. Из командной строки операцию можно запустить командой, заменив &lt;code&gt;src table&lt;/code&gt; и &lt;code&gt;dst table&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;yt merge --src table --dst table --spec \"{combine_chunks=true}\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"45\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-45\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-45\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-45.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Существует возможность контролировать потребление чанков и без запуска отдельной операции, Подробнее можно прочитать в разделе Автоматическое слияние чанков на выходе операций.&lt;/p&gt;\n&lt;p&gt;Также в некоторых случаях большое количество чанков может потребляться файлами. Например, когда к существующим файлам постоянно дописываются небольшие фрагменты. В настоящий момент нет готовых способов, аналогичных операции Merge, для выполнения объединения чанков файлов. Можно выполнить комбинацию &lt;code&gt;yt read-file //path/to/file | yt write-file //path/to/file&lt;/code&gt;. При этом весь поток данных пойдет через клиента.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"yamreddsv-disabled\"&gt;&lt;a href=\"ru/user-guide/storage/faq.html#yamreddsv-disabled\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Получаю ошибку: Format \"YamredDsv\" is disabled. Что делать?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Получаю ошибку: Format \"YamredDsv\" is disabled. Что делать?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Формат &lt;code&gt;YAMRED_DSV&lt;/code&gt; больше не поддерживается. Стоит воспользоваться другим &lt;a href=\"ru/user-guide/storage/formats.html#formaty-predstavleniya-tablichnyh-dannyh\"&gt;форматом&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/storage/faq.md","sourcePath":"ru/user-guide/storage/faq.md"},"headings":[],"title":"FAQ"},"router":{"pathname":"ru/user-guide/storage/faq","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
