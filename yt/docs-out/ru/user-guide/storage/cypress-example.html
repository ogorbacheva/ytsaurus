idden\" dur=\"1s\" begin=\"visibileAnimation-167.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"vyzov-komandy-get-nad-atributom-uzla\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-get-nad-atributom-uzla\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды get над атрибутом узла&lt;/span&gt;&lt;/a&gt;Вызов команды get над атрибутом узла&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //home/dev/test1/test2/@account\n&lt;span class=\"hljs-string\"&gt;\"dev\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"171\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-171\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-171\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-171.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опция &lt;code&gt;--max-size&lt;/code&gt; позволяет ограничить количество узлов, которые будут выданы в случае виртуальных составных узлов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Для обычных map-узлов в настоящий момент эта опция не имеет смысла.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vyzov-komandy-get-bez-opcii-max-size\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-get-bez-opcii-max-size\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды get без опции max-size&lt;/span&gt;&lt;/a&gt;Вызов команды get без опции max-size&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //sys/transactions/@&lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt;\n&lt;span class=\"hljs-string\"&gt;\"transaction_map\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"188\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-188\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-188\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-188.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"vyzov-komandy-get-s-opciej-max-size\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-get-s-opciej-max-size\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды get с опцией max-size&lt;/span&gt;&lt;/a&gt;Вызов команды get с опцией max-size&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get --max-size 3 //sys/transactions\n&amp;lt;\n    &lt;span class=\"hljs-string\"&gt;\"incomplete\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n&amp;gt; {\n    &lt;span class=\"hljs-string\"&gt;\"12814-3b9ce8-3fe0001-3b10627\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"12817-1cc292-3fe0001-fcdca56f\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"1268e-42d32d-3fe0001-d0fc5c4f\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"192\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-192\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-192\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-192.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опция &lt;code&gt;--format&lt;/code&gt; определяет формат выходных данных. Поддерживаются форматы &lt;code&gt;json&lt;/code&gt; и &lt;code&gt;yson&lt;/code&gt;. Подробнее можно прочитать в разделе &lt;a href=\"user-guide/storage/formats.html\"&gt;Форматы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"vyzov-komandy-get-s-opciej-format\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-get-s-opciej-format\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды get с опцией format&lt;/span&gt;&lt;/a&gt;Вызов команды get с опцией format&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get --format &lt;span class=\"hljs-string\"&gt;\"&amp;lt;format=pretty&amp;gt;json\"&lt;/span&gt; //home/dev/test1\n{\n    &lt;span class=\"hljs-string\"&gt;\"test2\"&lt;/span&gt;: {\n        &lt;span class=\"hljs-string\"&gt;\"test3\"&lt;/span&gt;: {\n\n        }\n    }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"199\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-199\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-199\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-199.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Объекты специальных типов, а также &lt;strong&gt;непрозрачные&lt;/strong&gt; узлы (объекты с атрибутом &lt;code&gt;opaque&lt;/code&gt; равным &lt;code&gt;%true&lt;/code&gt; ) выводятся как entity. Атрибуты, связанные с узлами поддерева, по умолчанию не выводятся. Но их можно заказать для вывода с помощью опции &lt;code&gt;--attribute&lt;/code&gt;, аналогично команде &lt;code&gt;list&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"vyzov-komandy-get-s-opciej-attribute\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-get-s-opciej-attribute\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды get с опцией attribute&lt;/span&gt;&lt;/a&gt;Вызов команды get с опцией attribute&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get --attribute opaque //home/dev/test1/test2\n&amp;lt;\n    &lt;span class=\"hljs-string\"&gt;\"opaque\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;;\n&amp;gt; {\n    &lt;span class=\"hljs-string\"&gt;\"test3\"&lt;/span&gt; = &amp;lt;\n        &lt;span class=\"hljs-string\"&gt;\"opaque\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;;\n    &amp;gt; {};\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"206\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-206\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-206\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-206.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Некоторые узлы могут вернуться как непрозрачные (у таких узлов не будет никаких дополнительных атрибутов), в случае если обходимое поддерево оказывается слишком большим.&lt;/p&gt;\n&lt;h2 id=\"set\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#set\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Set&lt;/span&gt;&lt;/a&gt;Set&lt;/h2&gt;\n&lt;p&gt;Команда &lt;code&gt;set&lt;/code&gt; присваивает указанное значение &lt;code&gt;value&lt;/code&gt; в формате &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON&lt;/a&gt; по указанному пути &lt;code&gt;&amp;lt;path&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Следует понимать, что если &lt;code&gt;&amp;lt;path&amp;gt;&lt;/code&gt; заканчивается на &lt;code&gt;/@&lt;/code&gt;, то команда &lt;code&gt;set&lt;/code&gt; устанавливает &lt;em&gt;словарь атрибутов&lt;/em&gt; узла, а не только атрибуты, перечисленные в &lt;code&gt;value&lt;/code&gt;. Иными словами, команды&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/dev/test1/@some_attr &lt;span class=\"hljs-built_in\"&gt;test&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"224\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-224\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-224\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-224.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;и&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/dev/test1/@ &lt;span class=\"hljs-string\"&gt;'{\"some_attr\"=\"test\";}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"228\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-228\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-228\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-228.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;не являются эквивалентными: первая изменяет конкретный атрибут, вторая — словарь атрибутов, что приводит к установке значений, перечисленных в указанном словаре, но также и к &lt;strong&gt;удалению всего, что в нем не упомянуто.&lt;/strong&gt; Таким образом, не следует пытаться устанавливать несколько атрибутов сразу одной командой &lt;code&gt;set&lt;/code&gt;, это чревато потерей данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"opisanie-komandy-set\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#opisanie-komandy-set\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Описание команды set&lt;/span&gt;&lt;/a&gt;Описание команды set&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; [--format FORMAT] [-r, --recursive] [-f, --force] &amp;lt;path&amp;gt; &amp;lt;value&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"237\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-237\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-237\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-237.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"vyzov-komandy-set\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-set\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды set&lt;/span&gt;&lt;/a&gt;Вызов команды set&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/dev/test1/@some_attr &lt;span class=\"hljs-built_in\"&gt;test&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"241\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-241\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-241\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-241.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"proverka-vyzova-komandy-set\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#proverka-vyzova-komandy-set\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Проверка вызова команды set&lt;/span&gt;&lt;/a&gt;Проверка вызова команды set&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //home/dev/test1/@some_attr\n&lt;span class=\"hljs-string\"&gt;\"test\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"245\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-245\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-245\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-245.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опция &lt;code&gt;--format&lt;/code&gt; определяет формат значения &lt;code&gt;value&lt;/code&gt;. Поддерживаются форматы &lt;code&gt;json&lt;/code&gt; и &lt;code&gt;yson&lt;/code&gt;. Подробнее можно прочитать в разделе &lt;a href=\"user-guide/storage/formats.html\"&gt;Форматы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"vyzov-komandy-set-s-opciej-format\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-set-s-opciej-format\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды set с опцией format&lt;/span&gt;&lt;/a&gt;Вызов команды set с опцией format&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; --format json //home/dev/test1/test2/test4 &lt;span class=\"hljs-string\"&gt;'{\"some_test_key\":\"some_test_value\"}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"252\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-252\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-252\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-252.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"vyzov-komandy-set-bez-opcii-format\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-set-bez-opcii-format\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды set без опции format&lt;/span&gt;&lt;/a&gt;Вызов команды set без опции format&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //home/dev/test1/test2/test4\n{\n    &lt;span class=\"hljs-string\"&gt;\"some_test_key\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"some_test_value\"&lt;/span&gt;;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"256\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-256\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-256\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-256.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опция &lt;code&gt;-r, --recursive&lt;/code&gt; позволяет создать все несуществующие промежуточные узлы пути.&lt;/p&gt;\n&lt;h3 id=\"vyzov-komandy-set-bez-opcii-recursive\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-set-bez-opcii-recursive\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды set без опции recursive&lt;/span&gt;&lt;/a&gt;Вызов команды set без опции recursive&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/dev/test1/test2/test3 some_test_value\nNode //home/dev has no child with key &lt;span class=\"hljs-string\"&gt;\"test1\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"263\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-263\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-263\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-263.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"vyzov-komandy-set-s-opciej-recursive\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-set-s-opciej-recursive\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды set с опцией recursive&lt;/span&gt;&lt;/a&gt;Вызов команды set с опцией recursive&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; --recursive //home/dev/test1/test2/test3 some_test_value\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"267\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-267\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-267\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-267.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опция &lt;code&gt;-f, --force&lt;/code&gt; позволяет менять любые узлы Кипариса, а не только атрибуты и документы.&lt;/p&gt;\n&lt;h2 id=\"copy_move\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#copy_move\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Copy, Move&lt;/span&gt;&lt;/a&gt;Copy, Move&lt;/h2&gt;\n&lt;p&gt;Данная команда копирует/перемещает узел из пути &lt;code&gt;&amp;lt;source_path&amp;gt;&lt;/code&gt; в &lt;code&gt;&amp;lt;destination_path&amp;gt;&lt;/code&gt;. При копировании файлов или таблиц чанки физически не копируются, все изменения происходят на уровне метаинформации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При перемещении сначала происходит копирование, а потом удаление исходного узла, таким образом идентификаторы всех объектов в поддереве изменятся.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"opisanie-komandy-copy/move\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#opisanie-komandy-copy/move\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Описание команды copy/move&lt;/span&gt;&lt;/a&gt;Описание команды copy/move&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt copy/move [--preserve-account | --no-preserve-account]\n               [--preserve-expiration-time] [--preserve-expiration-timeout]\n               [--preserve-creation-time]\n               [-r, --recursive] [-f, --force]\n               &amp;lt;source_path&amp;gt; &amp;lt;destination_path&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"290\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-290\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-290\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-290.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опция &lt;code&gt;--preserve-account&lt;/code&gt; позволяет сохранить аккаунт копируемого узла, вместо того, чтобы использовать аккаунт родительского каталога узла назначения.&lt;/p&gt;\n&lt;p&gt;Опция &lt;code&gt;--preserve-expiration-time&lt;/code&gt; позволяет сохранить назначенное &lt;a href=\"user-guide/storage/cypress.html\"&gt;время удаления&lt;/a&gt; копируемого узла.&lt;/p&gt;\n&lt;p&gt;Опция &lt;code&gt;--preserve-expiration-timeout&lt;/code&gt; позволяет сохранить назначенный &lt;a href=\"user-guide/storage/cypress.html\"&gt;интервал удаления&lt;/a&gt; копируемого узла.&lt;/p&gt;\n&lt;p&gt;Опция &lt;code&gt;--preserve-creation-time&lt;/code&gt; позволяет сохранить &lt;a href=\"user-guide/storage/cypress.html\"&gt;время создания&lt;/a&gt; копируемого узла. &lt;strong&gt;Только для копирования.&lt;/strong&gt;&lt;/p&gt;\n&lt;h3 id=\"proverka-akkaunta\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#proverka-akkaunta\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Проверка аккаунта&lt;/span&gt;&lt;/a&gt;Проверка аккаунта&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //home/dev/test1/test_file/@account\n&lt;span class=\"hljs-string\"&gt;\"dev\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"306\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-306\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-306\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-306.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"vyzov-komandy-copy\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-copy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды copy&lt;/span&gt;&lt;/a&gt;Вызов команды copy&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt copy //home/dev/test1/test_file //home/dev/test1/test2/test_file_new\n\nyt get //home/dev/test1/test2/test_file_new/@account\n&lt;span class=\"hljs-string\"&gt;\"tmp\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"310\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-310\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-310\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-310.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"vyzov-komandy-copy-s-opciej-preserve-account\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-copy-s-opciej-preserve-account\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды copy с опцией preserve-account&lt;/span&gt;&lt;/a&gt;Вызов команды copy с опцией preserve-account&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt copy --preserve-account //home/dev/test1/test_file //home/dev/test1/test2/test_file_new_p\n\nyt get //home/dev/test1/test2/test_file_new_p/@account\n&lt;span class=\"hljs-string\"&gt;\"dev\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"314\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-314\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-314\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-314.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опция &lt;code&gt;-r, --recursive&lt;/code&gt; регулирует поведение в случае, если не существуют промежуточные узлы &lt;code&gt;&amp;lt;destination_path&amp;gt;&lt;/code&gt; . В случае, если опция включена, данные узлы будут рекурсивно созданы, иначе команда выдаст ошибку.&lt;/p&gt;\n&lt;h3 id=\"vyzov-komandy-copy-bez-opcii-recursive\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-copy-bez-opcii-recursive\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды copy без опции recursive&lt;/span&gt;&lt;/a&gt;Вызов команды copy без опции recursive&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt copy //home/dev/test1/test_file //home/dev/test1/test2/test3/test_file_new\nNode //home/dev/test1/test2 has no child with key &lt;span class=\"hljs-string\"&gt;\"test3\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"321\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-321\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-321\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-321.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"vyzov-komandy-copy-s-opciej-recursive\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-copy-s-opciej-recursive\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды copy с опцией recursive&lt;/span&gt;&lt;/a&gt;Вызов команды copy с опцией recursive&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt copy --recursive //home/dev/test1/test_file //home/dev/test1/test2/test3/test_file_new\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"325\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-325\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-325\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-325.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опция &lt;code&gt;-f, --force&lt;/code&gt; позволяет выполнить команду, даже если узел назначения существует. Существующий узел при этом удаляется.&lt;/p&gt;\n&lt;h3 id=\"vyzov-komandy-copy-bez-opcii-force\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-copy-bez-opcii-force\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды copy без опции force&lt;/span&gt;&lt;/a&gt;Вызов команды copy без опции force&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt copy //home/dev/test1/test_file //home/dev/test1/test2/test_file_new\nNode //home/dev/test1/test2/test_file_new already exists\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"332\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-332\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-332\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-332.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"vyzov-komandy-copy-s-opciej-force\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-copy-s-opciej-force\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды copy с опцией force&lt;/span&gt;&lt;/a&gt;Вызов команды copy с опцией force&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt copy --force //home/dev/test1/test_file //home/dev/test1/test2/test_file_new\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"336\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-336\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-336\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-336.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"link\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#link\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Link&lt;/span&gt;&lt;/a&gt;Link&lt;/h2&gt;\n&lt;p&gt;Данная команда создает &lt;a href=\"user-guide/storage/links.html\"&gt;символическую ссылку&lt;/a&gt; по пути &lt;code&gt;&amp;lt;link_path&amp;gt;&lt;/code&gt; на объект, находящийся по пути &lt;code&gt;&amp;lt;target_path&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"opisanie-komandy-link\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#opisanie-komandy-link\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Описание команды link&lt;/span&gt;&lt;/a&gt;Описание команды link&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &lt;span class=\"hljs-built_in\"&gt;link&lt;/span&gt; [-r, --recursive]\n          [-i, --ignore-existing] [-l, --lock-existing]\n          [-f, --force]\n          &amp;lt;target_path&amp;gt; &amp;lt;link_path&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"346\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-346\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-346\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-346.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опция &lt;code&gt;-r, --recursive&lt;/code&gt; регулирует поведение в случае, если не существуют промежуточные узлы &lt;code&gt;&amp;lt;link_path&amp;gt;&lt;/code&gt; . В случае, если опция включена, данные узлы будут рекурсивно созданы, иначе команда выдаст ошибку.&lt;/p&gt;\n&lt;h3 id=\"vyzov-komandy-link-bez-opcii-recursive\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-link-bez-opcii-recursive\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды link без опции recursive&lt;/span&gt;&lt;/a&gt;Вызов команды link без опции recursive&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &lt;span class=\"hljs-built_in\"&gt;link&lt;/span&gt; //home/dev/test1/test_file //home/dev/test1/test2/link_test_file\nNode //home/dev/test1 has no child with key &lt;span class=\"hljs-string\"&gt;\"test2\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"353\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-353\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-353\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-353.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"vyzov-komandy-link-s-opciej-recursive\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-link-s-opciej-recursive\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды link с опцией recursive&lt;/span&gt;&lt;/a&gt;Вызов команды link с опцией recursive&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &lt;span class=\"hljs-built_in\"&gt;link&lt;/span&gt; --recursive  //home/dev/test1/test_file //home/dev/test1/test2/link_test_file\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"357\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-357\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-357\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-357.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опция &lt;code&gt;-i, --ignore-existing&lt;/code&gt; не будет пересоздавать заново указанную ссылку, если она уже существует.&lt;/p&gt;\n&lt;h3 id=\"vyzov-komandy-link-bez-opcii-ignore-existing\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-link-bez-opcii-ignore-existing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды link без опции ignore-existing&lt;/span&gt;&lt;/a&gt;Вызов команды link без опции ignore-existing&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &lt;span class=\"hljs-built_in\"&gt;link&lt;/span&gt; //home/dev/test1/test_file //home/dev/test1/test2/link_test_file\nNode //home/dev/test1/test2/link_test_file already exists\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"364\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-364\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-364\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-364.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"vyzov-komandy-link-s-opciej-ignore-existing\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-link-s-opciej-ignore-existing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды link с опцией ignore-existing&lt;/span&gt;&lt;/a&gt;Вызов команды link с опцией ignore-existing&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &lt;span class=\"hljs-built_in\"&gt;link&lt;/span&gt; --ignore-existing //home/dev/test1/test_file //home/dev/test1/test2/link_test_file\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"368\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-368\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-368\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-368.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опция &lt;code&gt;-l, --lock-existing&lt;/code&gt; гарантирует, что на ссылку будет установлена &lt;a href=\"user-guide/storage/transactions.html#locks\"&gt;exclusive-блокировка&lt;/a&gt;, даже если ссылка уже существует. (Имеет смысл только вместе с &lt;code&gt;--ignore-existing&lt;/code&gt;; в случае невозможности установить блокировку команда завершится ошибкой).&lt;/p&gt;\n&lt;p&gt;Опция &lt;code&gt;-f, --force&lt;/code&gt; позволяет выполнить команду, даже если узел назначения существует. Существующий узел при этом удаляется.&lt;/p&gt;\n&lt;h2 id=\"concatenate\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#concatenate\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Concatenate&lt;/span&gt;&lt;/a&gt;Concatenate&lt;/h2&gt;\n&lt;p&gt;Команда &lt;code&gt;concatenate&lt;/code&gt; объединяет данные из узлов &lt;code&gt;&amp;lt;source_paths&amp;gt;&lt;/code&gt; в узел &lt;code&gt;&amp;lt;destination_path&amp;gt;&lt;/code&gt;. Все узлы обязаны существовать и также иметь одинаковый тип – быть либо таблицами, либо файлами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Объединение данных происходит на уровне метаинформации, т. е. только на мастер-сервере.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"opisanie-komandy-concatenate\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#opisanie-komandy-concatenate\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Описание команды concatenate&lt;/span&gt;&lt;/a&gt;Описание команды concatenate&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt concatenate --src &amp;lt;source_paths&amp;gt; --dst &amp;lt;destination_path&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"394\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-394\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-394\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-394.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Время работы данного запроса прямо пропорционально количеству чанков, из которых (суммарно) состоят входные узлы.  При этом во многих клиентских библиотеках существует ограничение на максимальное время работы команд, обычно это десятки секунд. Поэтому использовать concatenate стоит только в случае, если вы уверены, что по выходным путям мало чанков, порядка 10 000. В остальных случаях следует использовать операцию &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt;. Она не будет работать эффективнее (и на таблицах в десятки миллионы чанков может занимать многие минуты), но для клиента отслеживание ее работы будет осуществляться через периодический опрос статуса, что фактически снимает все ограничения по времени выполнения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/storage/cypress-example.md","sourcePath":"ru/user-guide/storage/cypress-example.md"},"headings":[{"title":"List","href":"ru/user-guide/storage/cypress-example.html#list","level":2,"items":[{"title":"Описание команды list","href":"ru/user-guide/storage/cypress-example.html#opisanie-komandy-list","level":3},{"title":"Вызов команды list","href":"ru/user-guide/storage/cypress-example.html#vyzov-komandy-list","level":3},{"title":"Вызов команды list с опцией format","href":"ru/user-guide/storage/cypress-example.html#vyzov-komandy-list-s-opciej-format","level":3},{"title":"Вызов команды list с опцией attribute","href":"ru/user-guide/storage/cypress-example.html#vyzov-komandy-list-s-opciej-attribute","level":3},{"title":"Вызов команды list с опцией max-size","href":"ru/user-guide/storage/cypress-example.html#vyzov-komandy-list-s-opciej-max-size","level":3},{"title":"Вызов команды list с опцией absolute","href":"ru/user-guide/storage/cypress-example.html#vyzov-komandy-list-s-opciej-absolute","level":3}]},{"title":"Create","href":"ru/user-guide/storage/cypress-example.html#create","level":2,"items":[{"title":"Описание команды create","href":"ru/user-guide/storage/cypress-example.htm ие команды link","href":"ru/user-guide/storage/cypress-example.html#opisanie-komandy-link","level":3},{"title":"Вызов команды link без опции recursive","href":"ru/user-guide/storage/cypress-example.html#vyzov-komandy-link-bez-opcii-recursive","level":3},{"title":"Вызов команды link с опцией recursive","href":"ru/user-guide/storage/cypress-example.html#vyzov-komandy-link-s-opciej-recursive","level":3},{"title":"Вызов команды link без опции ignore-existing","href":"ru/user-guide/storage/cypress-example.html#vyzov-komandy-link-bez-opcii-ignore-existing","level":3},{"title":"Вызов команды link с опцией ignore-existing","href":"ru/user-guide/storage/cypress-example.html#vyzov-komandy-link-s-opciej-ignore-existing","level":3}]},{"title":"Concatenate","href":"ru/user-guide/storage/cypress-example.html#concatenate","level":2,"items":[{"title":"Описание команды concatenate","href":"ru/user-guide/storage/cypress-example.html#opisanie-komandy-concatenate","level":3}]}],"title":"Работа с деревом метаинформации"},"router":{"pathname":"ru/user-guide/storage/cypress-example","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
