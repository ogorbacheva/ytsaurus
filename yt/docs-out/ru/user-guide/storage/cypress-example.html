        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе собраны наиболее популярные примеры по работе с &lt;a href=\"user-guide/storage/cypress.html\"&gt;Кипарисом&lt;/a&gt; из командной строки (CLI), более подробное описание команд и их параметров можно найти в разделе &lt;a href=\"api/commands.html\"&gt;Команды&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"list\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#list\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List&lt;/span&gt;&lt;/a&gt;List&lt;/h2&gt;\n&lt;p&gt;Данная команда выводит список всех ключей узла &lt;code&gt;&amp;lt;path&amp;gt;&lt;/code&gt;, узел обязан иметь тип map_node.&lt;/p&gt;\n&lt;h3 id=\"opisanie-komandy-list\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#opisanie-komandy-list\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Описание команды list&lt;/span&gt;&lt;/a&gt;Описание команды list&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt list [-l] [--format FORMAT] [--attribute ATTRIBUTES]\n[--max-size MAX_SIZE] [--absolute] &amp;lt;path&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"12\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-12\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-12\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-12.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опция &lt;code&gt;-l&lt;/code&gt; позволяет показывать дополнительные атрибуты (тип узла, аккаунт, объем занимаемого места, дата последнего изменения).&lt;/p&gt;\n&lt;h3 id=\"vyzov-komandy-list\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-list\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды list&lt;/span&gt;&lt;/a&gt;Вызов команды list&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt list -l --max-size 3 //home/dev\nstring_node   dev            0 2018-12-22 09:30 some_key1\n  map_node    dev         1248 2019-01-22 13:14 username1\n  map_node    dev  69856453509 2019-02-26 09:05 username2\nWARNING: list is incomplete, check --max-size option\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"19\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-19\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-19\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-19.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опция &lt;code&gt;--format&lt;/code&gt; определяет формат выходных данных. Поддерживаются форматы &lt;code&gt;json&lt;/code&gt; и &lt;code&gt;yson&lt;/code&gt;. Подробнее можно прочитать в разделе &lt;a href=\"user-guide/storage/formats.html\"&gt;Форматы&lt;/a&gt;. Опцию &lt;code&gt;--format&lt;/code&gt; нельзя указывать вместе с опцией &lt;code&gt;-l&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"vyzov-komandy-list-s-opciej-format\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-list-s-opciej-format\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды list с опцией format&lt;/span&gt;&lt;/a&gt;Вызов команды list с опцией format&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt list --format json //home/dev\n[&lt;span class=\"hljs-string\"&gt;\"some_key1\"&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;\"username1\"&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;\"username2\"&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;\"some_key2\"&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;\"username3\"&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;\"some_key3\"&lt;/span&gt;]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"26\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-26\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-26\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-26.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;С помощью опции &lt;code&gt;--attribute&lt;/code&gt; (которая может быть указана несколько раз) могут быть запрошены дополнительные атрибуты узлов, соответствующих перечисляемым ключам. К примеру, &lt;code&gt;--attribute account&lt;/code&gt; добавит к каждому ключу аккаунт, которому принадлежит данный узел. Опцию &lt;code&gt;--attribute&lt;/code&gt; можно использовать только совместно с опцией &lt;code&gt;--format&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"vyzov-komandy-list-s-opciej-attribute\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-list-s-opciej-attribute\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды list с опцией attribute&lt;/span&gt;&lt;/a&gt;Вызов команды list с опцией attribute&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt list --attribute account --attribute owner --format &lt;span class=\"hljs-string\"&gt;\"&amp;lt;format=pretty&amp;gt;json\"&lt;/span&gt; --max-size 3 //home/dev\n{\n    &lt;span class=\"hljs-string\"&gt;\"&lt;span class=\"hljs-variable\"&gt;$attributes&lt;/span&gt;\"&lt;/span&gt;: {\n        &lt;span class=\"hljs-string\"&gt;\"incomplete\"&lt;/span&gt;: &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n    },\n    &lt;span class=\"hljs-string\"&gt;\"&lt;span class=\"hljs-variable\"&gt;$value&lt;/span&gt;\"&lt;/span&gt;: [\n        {\n            &lt;span class=\"hljs-string\"&gt;\"&lt;span class=\"hljs-variable\"&gt;$attributes&lt;/span&gt;\"&lt;/span&gt;: {\n                &lt;span class=\"hljs-string\"&gt;\"account\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"dev\"&lt;/span&gt;,\n                &lt;span class=\"hljs-string\"&gt;\"owner\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"username1\"&lt;/span&gt;\n            },\n            &lt;span class=\"hljs-string\"&gt;\"&lt;span class=\"hljs-variable\"&gt;$value&lt;/span&gt;\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"some_key1\"&lt;/span&gt;\n        },\n        {\n            &lt;span class=\"hljs-string\"&gt;\"&lt;span class=\"hljs-variable\"&gt;$attributes&lt;/span&gt;\"&lt;/span&gt;: {\n                &lt;span class=\"hljs-string\"&gt;\"account\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"dev\"&lt;/span&gt;,\n                &lt;span class=\"hljs-string\"&gt;\"owner\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"username2\"&lt;/span&gt;\n            },\n            &lt;span class=\"hljs-string\"&gt;\"&lt;span class=\"hljs-variable\"&gt;$value&lt;/span&gt;\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"some_key2\"&lt;/span&gt;\n        },\n        {\n            &lt;span class=\"hljs-string\"&gt;\"&lt;span class=\"hljs-variable\"&gt;$attributes&lt;/span&gt;\"&lt;/span&gt;: {\n                &lt;span class=\"hljs-string\"&gt;\"account\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"dev\"&lt;/span&gt;,\n                &lt;span class=\"hljs-string\"&gt;\"owner\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"username3\"&lt;/span&gt;\n            },\n            &lt;span class=\"hljs-string\"&gt;\"&lt;span class=\"hljs-variable\"&gt;$value&lt;/span&gt;\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"some_key3\"&lt;/span&gt;\n        }\n    ]\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"33\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-33\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-33\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-33.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опция &lt;code&gt;--max-size&lt;/code&gt; позволяет ограничить количество возвращаемых элементов. Будут показаны произвольные элементы.&lt;/p&gt;\n&lt;h3 id=\"vyzov-komandy-list-s-opciej-max-size\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-list-s-opciej-max-size\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды list с опцией max-size&lt;/span&gt;&lt;/a&gt;Вызов команды list с опцией max-size&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt list --max-size 3 //home/dev\nsome_key1\nusername1\nusername2\nWARNING: list is incomplete, check --max-size option\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"40\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-40\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-40\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-40.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опция &lt;code&gt;--absolute&lt;/code&gt; покажет абсолютные пути.&lt;/p&gt;\n&lt;h3 id=\"vyzov-komandy-list-s-opciej-absolute\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-list-s-opciej-absolute\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды list с опцией absolute&lt;/span&gt;&lt;/a&gt;Вызов команды list с опцией absolute&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt list --absolute --max-size 3 //home/dev\n//home/dev/some_key1\n//home/dev/username1\n//home/dev/username2\nWARNING: list is incomplete, check --max-size option\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"47\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-47\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-47\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-47.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"create\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#create\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Create&lt;/span&gt;&lt;/a&gt;Create&lt;/h2&gt;\n&lt;p&gt;Данная команда создает узел указанного типа &lt;code&gt;&amp;lt;type&amp;gt;&lt;/code&gt; по пути &lt;code&gt;&amp;lt;path&amp;gt;&lt;/code&gt;. Команда возвращает идентификатор созданного объекта. Поддерживаемые объекты перечислены в разделе &lt;a href=\"user-guide/storage/objects.html\"&gt;Объекты&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"opisanie-komandy-create\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#opisanie-komandy-create\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Описание команды create&lt;/span&gt;&lt;/a&gt;Описание команды create&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt create [-r, --recursive] [-i,--ignore-existing] [-l,--lock-existing] [-f, --force] [--attributes ATTRIBUTES] &amp;lt;&lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt;&amp;gt; &amp;lt;path&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"57\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-57\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-57\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-57.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опция &lt;code&gt;-r, --recursive&lt;/code&gt; создаст все промежуточные узлы типа &lt;code&gt;map_node&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"vyzov-komandy-create-s-opciej-recursive\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-create-s-opciej-recursive\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды create с опцией recursive&lt;/span&gt;&lt;/a&gt;Вызов команды create с опцией recursive&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt create --recursive map_node //home/dev/test1/test2/test3\n127c1-388f86-3fe012f-6f994b03\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"64\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-64\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-64\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-64.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опция &lt;code&gt;-i, --ignore-existing&lt;/code&gt; не будет пересоздавать заново указанный узел, если он уже существует. Кроме того тип существующего узла и заказываемого должны совпадать, иначе выполнение запроса завершится ошибкой.&lt;/p&gt;\n&lt;h3 id=\"vyzov-komandy-create-bez-opcii-ignore-existing\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-create-bez-opcii-ignore-existing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды create без опции ignore-existing&lt;/span&gt;&lt;/a&gt;Вызов команды create без опции ignore-existing&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt create map_node //home/dev/test1/test2/test3\nNode //home/dev/test1/test2/test3 already exists\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"71\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-71\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-71\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-71.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"vyzov-komandy-create-s-opciej-ignore-existing\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-create-s-opciej-ignore-existing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды create с опцией ignore-existing&lt;/span&gt;&lt;/a&gt;Вызов команды create с опцией ignore-existing&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt create --ignore-existing map_node //home/dev/test1/test2/test3\n127c1-388f86-3fe012f-6f994b03\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"75\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-75\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-75\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-75.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опцию &lt;code&gt;-l, --lock-existing&lt;/code&gt; можно указывать вместе с &lt;code&gt;--ignore-existing&lt;/code&gt;. Тогда на указанный узел будет взята &lt;a href=\"user-guide/storage/transactions.html#locks\"&gt;exclusive-блокировка&lt;/a&gt;, даже если он уже существует. (В случае конфликта блокировки команда завершится ошибкой.) Т.к. фактическое создание узла всегда неявно (автоматически) берет на него блокировку, опция позволяет сделать эффект команды при использовании &lt;code&gt;--ignore-existing&lt;/code&gt; более предсказуемым.&lt;/p&gt;\n&lt;p&gt;Опция &lt;code&gt;-f, --force&lt;/code&gt; позволяет принудительно создать объект. В случае, если указанный узел уже существует, он удаляется и на его месте создается новый. При этом существующий узел может быть любого типа. При пересоздании меняется id узла.&lt;/p&gt;\n&lt;h3 id=\"vyzov-komandy-create-s-opciej-force\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-create-s-opciej-force\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды create с опцией force&lt;/span&gt;&lt;/a&gt;Вызов команды create с опцией force&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt create --force map_node //home/dev/test1/test2/test3\n127c1-4352be-3fe012f-6acab448\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"85\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-85\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-85\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-85.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;С помощью опции &lt;code&gt;--attributes&lt;/code&gt; можно задать атрибуты создаваемого узла.&lt;/p&gt;\n&lt;h3 id=\"vyzov-komandy-create-s-opciej-attributes\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-create-s-opciej-attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды create с опцией attributes&lt;/span&gt;&lt;/a&gt;Вызов команды create с опцией attributes&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt create --attributes &lt;span class=\"hljs-string\"&gt;\"{test_attr=test1;}\"&lt;/span&gt; map_node //home/dev/test1/test2/test3\n127c2-1b78-3fe012f-288106fe\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"92\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-92\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-92\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-92.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"proverka-rezultata-komandy-create-s-opciej-attributes\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#proverka-rezultata-komandy-create-s-opciej-attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Проверка результата команды create с опцией attributes&lt;/span&gt;&lt;/a&gt;Проверка результата команды create с опцией attributes&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //home/dev/test1/test2/test3/@test_attr\n&lt;span class=\"hljs-string\"&gt;\"test1\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"96\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-96\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-96\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-96.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"remove\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#remove\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Remove&lt;/span&gt;&lt;/a&gt;Remove&lt;/h2&gt;\n&lt;p&gt;Данная команда удаляет узел по указанному пути &lt;code&gt;&amp;lt;path&amp;gt;&lt;/code&gt;. Если узел является составным и не пустым, то команда завершится с ошибкой.&lt;/p&gt;\n&lt;h3 id=\"opisanie-komandy-remove\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#opisanie-komandy-remove\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Описание команды remove&lt;/span&gt;&lt;/a&gt;Описание команды remove&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt remove [-r, --recursive] [-f, --force] &amp;lt;path&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"106\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-106\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-106\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-106.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опция &lt;code&gt;-r, --recursive&lt;/code&gt; позволяет удалить все поддерево рекурсивно.&lt;/p&gt;\n&lt;h3 id=\"vyzov-komandy-remove-bez-opcii-recursive\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-remove-bez-opcii-recursive\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды remove без опции recursive&lt;/span&gt;&lt;/a&gt;Вызов команды remove без опции recursive&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt remove //home/dev/test1\nCannot remove non-empty composite node\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"113\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-113\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-113\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-113.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"vyzov-komandy-remove-s-opciej-recursive\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-remove-s-opciej-recursive\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды remove с опцией recursive&lt;/span&gt;&lt;/a&gt;Вызов команды remove с опцией recursive&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt remove --recursive //home/dev/test1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"117\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-117\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-117\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-117.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опция &lt;code&gt;-f, --force&lt;/code&gt; позволяет игнорировать отсутствие указанного узла.&lt;/p&gt;\n&lt;h3 id=\"vyzov-komandy-remove-bez-opcii-force\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-remove-bez-opcii-force\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды remove без опции force&lt;/span&gt;&lt;/a&gt;Вызов команды remove без опции force&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt remove //home/dev/test1\nNode //home/dev has no child with key &lt;span class=\"hljs-string\"&gt;\"test1\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"124\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-124\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;& en\" data-no-index=\"true\"&gt;Exists&lt;/span&gt;&lt;/a&gt;Exists&lt;/h2&gt;\n&lt;p&gt;Данная команда проверяет существование переданного ей узла &lt;code&gt;&amp;lt;path&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"opisanie-komandy-exists\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#opisanie-komandy-exists\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Описание команды exists&lt;/span&gt;&lt;/a&gt;Описание команды exists&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt exists &amp;lt;path&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"138\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-138\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-138\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-138.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"vyzov-komandy-exists-nad-sushestvuyushim-uzlom\"&gt;&lt;a href=\"ru/user-guide/storage/cypress-example.html#vyzov-komandy-exists-nad-sushestvuyushim-uzlom\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов команды exists над существующим узлом&lt;/span&gt;
