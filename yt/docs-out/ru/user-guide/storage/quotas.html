        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе приведено описание квот на ресурсы в системе YTsaurus.&lt;/p&gt;\n&lt;h2 id=\"resources\"&gt;&lt;a href=\"ru/user-guide/storage/quotas.html#resources\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типы ресурсов&lt;/span&gt;&lt;/a&gt;Типы ресурсов&lt;/h2&gt;\n&lt;p&gt;Большинство кластеров YTsaurus являются кластерами общего пользования. Ресурсы кластеров являются разделяемыми для всех проектов, которым требуется хранение и обработка данных. Данные квоты отображаются, но не включены.&lt;br /&gt;\nМожно выделить следующие типы квот на ресурсы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Хранение:\n&lt;ul&gt;\n&lt;li&gt;дисковая квота на HDD (SATA) без учёта сжатия и репликации;&lt;/li&gt;\n&lt;li&gt;дисковая квота на SATA SSD/NVMe SSD без учёта сжатия и репликации;&lt;/li&gt;\n&lt;li&gt;квота на количество узлов (nodes) в &lt;a href=\"user-guide/storage/cypress.html\"&gt;дереве метаинформации&lt;/a&gt; (таблиц, файлов, блокировок), при годовом планировании отдельно не заказывается, выдаётся по договорённости. На весь кластер имеется ограничение на число узлов дерева. Ответвленные узлы фактически потребляют квоту аккаунта, в котором они были созданы, но поскольку это не всегда корректно, то в итоговом квотировании ресурсов учитываются только неответвленные узлы;&lt;/li&gt;\n&lt;li&gt;квота на количество чанков (chunks) на которые делятся все хранимые данные. Выдаётся пропорционально дисковым квотам исходя из размера 512Мб на чанк для статических таблиц и 64Мб на чанк для динамических таблиц, плюс запас в 200 000 чанков или по договоренности с проектом;&lt;/li&gt;\n&lt;li&gt;квота на объем оперативной памяти мастер-серверов, потребляемый узлами (nodes) в дереве метаинформации;  отдельно не заказывается, выдаётся по договорённости. Учитываются метаданные чанков и неответвленных узлов, атрибуты неответвленных узлов, pivot-ключи &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;динамических таблиц&lt;/a&gt;, а также некоторые другие данные. Эмпирическая оценка: 100-200 байт на узел и столько же на чанк. Указанные величины могут существенно варьироваться в зависимости от длины атрибутов и имён узлов, длины значений в ключевых колонках чанков и т.д.;&lt;/li&gt;\n&lt;li&gt;квота на количество &lt;a href=\"user-guide/dynamic-tables/overview.html#tablets\"&gt;таблетов (шардов)&lt;/a&gt; динамических таблиц. Отдельно не заказывается, выдаётся по запросу. Квота выделяется на объект &lt;a href=\"user-guide/dynamic-tables/concepts.html#tablet_cell_bundles\"&gt;таблет-селл бандл (tablet_cell_bundle)&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Обработка:\n&lt;ul&gt;\n&lt;li&gt;гарантированное число HyperThreading ядер для MapReduce операций;&lt;/li&gt;\n&lt;li&gt;гарантированный объём оперативной памяти для MapReduce операций;&lt;/li&gt;\n&lt;li&gt;гарантированное число GPU карт для MapReduce операций;&lt;/li&gt;\n&lt;li&gt;ограничение на количество выполняющихся MapReduce операций и общее количество операций, включая операции, стоящие в очереди на запуск;&lt;/li&gt;\n&lt;li&gt;выделенные вычислительные мощности для выполнения запросов к &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;динамическим таблицам&lt;/a&gt; (write/select/lookup) — CPU, RAM. Сюда входит квота на объём данных в динамических таблицах, поднятых в память (tablet_static_memory). Квоты выделяются на объект &lt;a href=\"user-guide/dynamic-tables/concepts.html#tablet_cell_bundles\"&gt;таблет-селл бандл (tablet_cell_bundle)&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"account_quotas\"&gt;&lt;a href=\"ru/user-guide/storage/quotas.html#account_quotas\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Хранение данных&lt;/span&gt;&lt;/a&gt;Хранение данных&lt;/h2&gt;\n&lt;p&gt;Большинство квот для хранения данных привязаны к &lt;strong&gt;аккаунту&lt;/strong&gt; проекта. Аккаунт — это служебный объект в Кипарисе. Каждый узел Кипариса имеет атрибут &lt;code&gt;account&lt;/code&gt;, доступный на чтение и запись, в котором хранится имя аккаунта, к которому привязан данный узел. В случае файлов и таблиц назначение аккаунта влечет за собой расход его дисковой квоты. При этом учитывается пространство, физически выделенное на узлах кластера для хранения данных, поэтому оно зависит от степени репликации (атрибут &lt;code&gt;replication_factor&lt;/code&gt;), способа erasure-кодирования (атрибут &lt;code&gt;erasure_codec&lt;/code&gt;) и используемой компрессии (атрибут &lt;code&gt;compression_codec&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;В случае превышения пользователем квоты аккаунта по отдельным видам ресурсов система начинает отказывать в дальнейшем использовании аккаунта по превышенному виду ресурса. Это не означает, что использование аккаунта никогда не превышает лимитов. Например, лимиты могли быть принудительно выставлены ниже использования. Кроме того, отслеживание потребления дисковой и чанковой квот работает асинхронно, что также может выливаться в превышение отведенных лимитов.&lt;/p&gt;\n&lt;p&gt;Подробнее можно прочитать в разделе &lt;a href=\"user-guide/storage/accounts.html\"&gt;Аккаунты&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"medium\"&gt;&lt;a href=\"ru/user-guide/storage/quotas.html#medium\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Медиумы&lt;/span&gt;&lt;/a&gt;Медиумы&lt;/h3&gt;\n&lt;p&gt;Различные типы носителей (HDD, SSD, RAM) логически объединены в специальные сущности, называемые &lt;a href=\"user-guide/storage/media.html\"&gt;медиумами&lt;/a&gt; (medium). Типы носителей отличаются по объёму доступного пространства и скорости чтения/записи. Чем выше скорость носителя, тем меньше его объём. Медиумы разделяют всё множество чанковых локаций на непересекающиеся подмножества. При этом один узел кластера может иметь локации, относящиеся к разным медиумам. В пределах каждого такого подмножества осуществляется независимая балансировка чанков и независимое квотирование. При выдаче дисковой квоты аккаунту, квота выдаётся в конкретном медиуме. Пользователь может выбирать на каком медиуме хранить те или иные данные. На кластерах YTsaurus распространены следующие виды медиумов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;default — объединяет множество HDD дисков в кластере;&lt;/li&gt;\n&lt;li&gt;ssd_blobs — множество SSD дисков в кластере;&lt;/li&gt;\n&lt;li&gt;ssd_journals — множество SSD дисков для хранения журналов динамических таблиц;&lt;/li&gt;\n&lt;li&gt;in_memory — выделенное пространство в оперативной памяти узлов кластера.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Для просмотра квот аккаунта существует специальная страница в веб-интерфейсе YTsaurus.&lt;/p&gt;\n&lt;p&gt;Подробнее о медиумах можно прочитать в разделе &lt;a href=\"user-guide/storage/media.html\"&gt;Медиумы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"dyntable_resources\"&gt;&lt;a href=\"ru/user-guide/storage/quotas.html#dyntable_resources\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ресурсы динамических таблиц&lt;/span&gt;&lt;/a&gt;Ресурсы динамических таблиц&lt;/h3&gt;\n&lt;p&gt;Квоты на количество таблетов и tablet static memory привязаны к таблет-селл бандлам (tablet cell bundle). Квоты бандла отображаются в отдельном разделе веб-интерфейса. Настройка мониторинга и просмотр истории значений квот аккаунтов и бандлов рассмотрены в разделе Мониторинг квот.&lt;/p&gt;\n&lt;h2 id=\"data_processing\"&gt;&lt;a href=\"ru/user-guide/storage/quotas.html#data_processing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обработка данных&lt;/span&gt;&lt;/a&gt;Обработка данных&lt;/h2&gt;\n&lt;p&gt;Вычислительные мощности для обработки данных привязаны к &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;пулам&lt;/a&gt; (кроме tablet_cell_bundle).&lt;br /&gt;\nНастройки вычислительного пула, включая гарантии и лимиты на количество операций можно посмотреть на странице &lt;strong&gt;Scheduling&lt;/strong&gt;, вкладка &lt;strong&gt;Details&lt;/strong&gt;, раздел &lt;strong&gt;CPU&lt;/strong&gt;, колонка &lt;code&gt;Strong guar&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В том случае, когда проект использует динамические таблицы в production, для изоляции от других пользователей необходимо завести отдельный &lt;a href=\"user-guide/dynamic-tables/concepts.html#tablet_cell_bundles\"&gt;таблет-селл бандл&lt;/a&gt;. Таблет-селл бандл представляет собой группу контейнеров (инстансов), которая отвечает за обработку запросов к динамическим таблицам проекта.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Для работы динамических таблиц требуется дисковая квота для записи журналов (medium ssd_journals) и снапшотов (medium default). Требуется квота на объекты файловой системы (node_count), а также квота на количество таблетов (шардов таблицы — tablet_count).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/storage/quotas.md","sourcePath":"ru/user-guide/storage/quotas.md"},"headings":[{"title":"Типы ресурсов","href":"ru/user-guide/storage/quotas.html#resources","level":2},{"title":"Хранение данных","href":"ru/user-guide/storage/quotas.html#account_quotas","level":2,"items":[{"title":"Медиумы","href":"ru/user-guide/storage/quotas.html#medium","level":3},{"title":"Ресурсы динамических таблиц","href":"ru/user-guide/storage/quotas.html#dyntable_resources","level":3}]},{"title":"Обработка данных","href":"ru/user-guide/storage/quotas.html#data_processing","level":2}],"title":"Квоты"},"router":{"pathname":"ru/user-guide/storage/quotas","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
