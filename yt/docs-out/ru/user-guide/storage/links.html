        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе содержится информация о &lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D0%B8%D0%BC%D0%B2%D0%BE%D0%BB%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B0%D1%8F_%D1%81%D1%81%D1%8B%D0%BB%D0%BA%D0%B0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;символических ссылках&lt;/a&gt; — симлинках.&lt;/p&gt;\n&lt;h2 id=\"common\"&gt;&lt;a href=\"ru/user-guide/storage/links.html#common\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общие сведения&lt;/span&gt;&lt;/a&gt;Общие сведения&lt;/h2&gt;\n&lt;p&gt;Система поддерживает символические ссылки (&lt;code&gt;soft links&lt;/code&gt;) в &lt;a href=\"user-guide/storage/cypress.html\"&gt;Кипарисе&lt;/a&gt;. Такая ссылка представляет собой узел типа &lt;code&gt;link&lt;/code&gt;, ссылающийся на другой объект &lt;code&gt;target&lt;/code&gt;.&lt;br /&gt;\nПуть к нему указывается при создании ссылки. В процессе вычисления адреса для выполнения операции все обращения к узлу-ссылке автоматически переадресуются к целевому объекту.&lt;/p&gt;\n&lt;p&gt;Ссылка на целевой объект зависит от его пути.&lt;br /&gt;\nЕсли целевой путь будет удален или перемещен, ссылка перестанет действовать. Вы получите сообщение об ошибке вида &lt;code&gt;Link target does not exist&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Узел-ссылка не занимает дискового пространства. Его атрибут &lt;code&gt;resource_usage/disk_space&lt;/code&gt; равен 0. Поэтому лимит на дисковую квоту не может быть превышен из-за создания узлов-ссылок.&lt;br /&gt;\nПри этом каждая ссылка представляет собой узел и занимает один &lt;code&gt;node&lt;/code&gt;, поэтому можно превысить лимит на количество &lt;code&gt;nodes&lt;/code&gt; в аккаунте.&lt;/p&gt;\n&lt;h2 id=\"create\"&gt;&lt;a href=\"ru/user-guide/storage/links.html#create\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создание&lt;/span&gt;&lt;/a&gt;Создание&lt;/h2&gt;\n&lt;p&gt;Чтобы создать символическую ссылку, используйте &lt;a href=\"api/commands.html#link\"&gt;команду&lt;/a&gt; &lt;code&gt;link&lt;/code&gt;. В качестве аргументов сначала укажите путь целевого узла, затем путь узла ссылки:&lt;/p&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;link&lt;/span&gt; //tmp/target_table //tmp/target_table_link\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"24\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-24\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-24\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-24.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Ссылка может вести к произвольным узлам и объектам.&lt;br /&gt;\nНапример, к поддереву &lt;code&gt;//tmp&lt;/code&gt; в домашней директории:&lt;/p&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;link&lt;/span&gt; //tmp //home/username/my_own_tmp\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"31\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-31\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-31\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-31.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Относительные ссылки не поддерживаются.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"redirects\"&gt;&lt;a href=\"ru/user-guide/storage/links.html#redirects\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Переадресация&lt;/span&gt;&lt;/a&gt;Переадресация&lt;/h2&gt;\n&lt;p&gt;Автоматическая переадресация от узла-ссылки к целевому объекту работает с рядом исключений:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Команды &lt;code&gt;remove&lt;/code&gt;, &lt;code&gt;create&lt;/code&gt; и &lt;code&gt;link&lt;/code&gt; для целевого пути обслуживаются в узле-ссылке. Например, при удалении &lt;code&gt;//tmp/target_table_link&lt;/code&gt; пользователь не повредит содержимое таблицы &lt;code&gt;//tmp/target_table&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Команда &lt;code&gt;move&lt;/code&gt; сработает на целевом узле и узел-ссылка станет недействительной.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Также можно отключить переадресацию, для этого добавьте в конец имени ссылки маркер &lt;code&gt;&amp;amp;&lt;/code&gt; (амперсанд).&lt;br /&gt;\nНапример, это позволяет изучать атрибуты узла-ссылки, а не целевого объекта.&lt;br /&gt;\nТак, чтобы получить путь целевого объекта, выполните &lt;code&gt;yt get //tmp/target_table_link&amp;amp;/@&lt;/code&gt;. Путь будет указан в атрибуте &lt;code&gt;target_path&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"attributes\"&gt;&lt;a href=\"ru/user-guide/storage/links.html#attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Системные атрибуты&lt;/span&gt;&lt;/a&gt;Системные атрибуты&lt;/h2&gt;\n&lt;p&gt;Помимо &lt;a href=\"user-guide/storage/attributes.html\"&gt;атрибутов&lt;/a&gt;, общих для всех типов узлов, узлы-ссылки содержат атрибуты:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Имя&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;target_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Путь до объекта, на который указывает ссылка.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;broken&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;, если ссылка указывает на несуществующий объект, иначе &lt;code&gt;false&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/storage/links.md","sourcePath":"ru/user-guide/storage/links.md"},"headings":[{"title":"Общие сведения","href":"ru/user-guide/storage/links.html#common","level":2},{"title":"Создание","href":"ru/user-guide/storage/links.html#create","level":2},{"title":"Переадресация","href":"ru/user-guide/storage/links.html#redirects","level":2},{"title":"Системные атрибуты","href":"ru/user-guide/storage/links.html#attributes","level":2}],"title":"Символические ссылки"},"router":{"pathname":"ru/user-guide/storage/links","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
