            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе описано, в каких случаях, куда и как стоит обращаться за помощью при работе с системой YTsaurus. Даются рекомендации по составлению обращений и сообщений об ошибках.&lt;/p&gt;\n&lt;h2 id=\"sluchai-obrashenij\"&gt;&lt;a href=\"ru/user-guide/problems/howtoreport.html#sluchai-obrashenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Случаи обращений&lt;/span&gt;&lt;/a&gt;Случаи обращений&lt;/h2&gt;\n&lt;p&gt;Система YTsaurus состоит из различных компонент и сервисов, поэтому существует несколько способов обратиться за помощью или задать вопрос. Для каждой ситуации существует лучший способ сообщить о проблеме или попросить помощи по работе с системой. Перед первым запросом выберите подходящий способ — это позволит минимизировать издержки по маршрутизации вашего запроса к людям, которые смогут помочь.&lt;/p&gt;\n&lt;p&gt;Выберите наиболее подходящий раздел, соответствующий вашей ситуации.&lt;/p&gt;\n&lt;h3 id=\"voprosy-po-rabote-s-veb-interfejsom\"&gt;&lt;a href=\"ru/user-guide/problems/howtoreport.html#voprosy-po-rabote-s-veb-interfejsom\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вопросы по работе с веб-интерфейсом&lt;/span&gt;&lt;/a&gt;Вопросы по работе с веб-интерфейсом&lt;/h3&gt;\n&lt;p&gt;О проблемах с вёрсткой, обновлением данных в веб-интерфейсе и других подобных проблемах сообщайте на рассылку &lt;a href=\"mailto:ui@ytsaurus.tech\"&gt;ui@ytsaurus.tech&lt;/a&gt;.&lt;br /&gt;\nОбязательно опишите проблему, ожидаемое поведение и сообщите адрес страницы.&lt;/p&gt;\n&lt;h3 id=\"voprosy-po-tekushej-rabote-sistemy\"&gt;&lt;a href=\"ru/user-guide/problems/howtoreport.html#voprosy-po-tekushej-rabote-sistemy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вопросы по текущей работе системы&lt;/span&gt;&lt;/a&gt;Вопросы по текущей работе системы&lt;/h3&gt;\n&lt;p&gt;К вопросам о текущей работе системы YTsaurus относятся,но не ограничиваются ими:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;медленное чтение/запись данных и долгие вычисления на кластере;&lt;/li&gt;\n&lt;li&gt;неизвестные ошибки при выполнении операций или запросов к кластеру.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Описание проблемы и минимальный пример, который позволит команде воспроизвести проблему, отправьте на рассылку &lt;a href=\"mailto:dev@ytsaurus.tech\"&gt;dev@ytsaurus.tech&lt;/a&gt;.&lt;br /&gt;\nЕсли проблема связана с медленной работой джобов операции, предпримите предварительно максимальные усилия по самостоятельной диагностике проблемы с помощью &lt;a href=\"user-guide/problems/jobshell-and-slowjobs.html\"&gt;Job Shell&lt;/a&gt; и &lt;a href=\"user-guide/problems/jobstatistics.html\"&gt;статистик джобов&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"voprosy-po-razrabotke\"&gt;&lt;a href=\"ru/user-guide/problems/howtoreport.html#voprosy-po-razrabotke\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вопросы по разработке&lt;/span&gt;&lt;/a&gt;Вопросы по разработке&lt;/h3&gt;\n&lt;p&gt;К данной категории относятся вопросы по технологии в целом и любые консультации:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;API и его использование;&lt;/li&gt;\n&lt;li&gt;возможности и ограничения;&lt;/li&gt;\n&lt;li&gt;вопросы по способам оптимизации вычислений;&lt;/li&gt;\n&lt;li&gt;вопросы по разновидностям квот YTsaurus и процессу их получения;&lt;/li&gt;\n&lt;li&gt;вопросы про назначение метрик и правильную интерпретацию графиков;&lt;/li&gt;\n&lt;li&gt;вопросы про оценку необходимых ресурсов;&lt;/li&gt;\n&lt;li&gt;вопросы про причины возникновения ошибок и способы самодиагностики;&lt;/li&gt;\n&lt;li&gt;концептуальные вопросы и предложения.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Подобные вопросы задавайте на платформе &lt;a href=\"https://stackoverflow.com\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Stack Overflow&lt;/a&gt;, тег &lt;a href=\"https://stackoverflow.com/tags/ytsaurus\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ytsaurus&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"prochie-voprosy\"&gt;&lt;a href=\"ru/user-guide/problems/howtoreport.html#prochie-voprosy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Прочие вопросы&lt;/span&gt;&lt;/a&gt;Прочие вопросы&lt;/h3&gt;\n&lt;p&gt;Если ваш вопрос или проблема не подходят ни под одну из описанных категорий, напишите письмо на рассылку (mailto:community@ytsaurus.tech).&lt;/p&gt;\n&lt;h2 id=\"sovety-po-napisaniyu-soobshenij-ob-oshibkah\"&gt;&lt;a href=\"ru/user-guide/problems/howtoreport.html#sovety-po-napisaniyu-soobshenij-ob-oshibkah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Советы по написанию сообщений об ошибках&lt;/span&gt;&lt;/a&gt;Советы по написанию сообщений об ошибках&lt;/h2&gt;\n&lt;p&gt;Приведенные советы помогут не упустить важные детали в сообщениях об ошибках и описать ситуацию в исходном виде без предварительной интерпретации и во всей полноте.&lt;/p&gt;\n&lt;p&gt;Перед отправкой сообщения об ошибке перечитайте его и поставьте себя на место того, кто будет вам помогать. С чего бы вы начали решать проблему? Достаточно ли для этого приведенной информации?&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Всегда показывайте полное сообщение об ошибке.&lt;/strong&gt; В YTsaurus ошибки иерархичны: помимо самого текста к ошибке прилагаются атрибуты, а также вложенные ошибки. Не обрезайте информацию, показывайте все, что есть. Если обрезка произошла еще до печати, постарайтесь разобраться, почему так случилось. Это может пригодиться в будущем. Если информацию обрезает используемое вами API, напишите на рассылку (mailto:community@ytsaurus.tech).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Включите логирование.&lt;/strong&gt; Большинство SDK, предоставляемых YTsaurus, используют переменную окружения &lt;code&gt;YT_LOG_LEVEL&lt;/code&gt;. Установите ее значение в &lt;code&gt;debug&lt;/code&gt;, соберите логи из stderr и приложите их к сообщению об ошибке. Также стоит учесть следующие частные обстоятельства:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;при использовании python библиотеки необходимо настроить логирование через модуль logging: &lt;code&gt;logging.getLogger('Yt').setLevel(logging.DEBUG)&lt;/code&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;в java библиотеках для логирования используется slf4j, для включения логов включите &lt;code&gt;debug&lt;/code&gt; уровень для логгеров &lt;code&gt;tech.ytsaurus&lt;/code&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;если проблема воспроизводится с использованием local YTsaurus, включите debug-логи в нем, передав опцию &lt;code&gt;--enable-debug-logging&lt;/code&gt; при вызове &lt;code&gt;yt_local start&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Для продуктовых процессов держите debug-логи включенными постоянно, настроив для них подходящую ротацию и компрессию. Во многих сложных случаях невозможно установить причину без подробных логов. Система YTsaurus пишет подробные логи на стороне сервера, но если проблема, например, заключается в сетевом взаимодействии между клиентом и сервером, то серверные логи бесполезны.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Предоставляйте больше контекста:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;обязательно расскажите максимальную информацию о вашем кластере;&lt;/li&gt;\n&lt;li&gt;если операция завершилась с ошибкой, предоставьте воспроизводимый пример;&lt;/li&gt;\n&lt;li&gt;если код падает из-за исключения, нужно приложить backtrace;&lt;/li&gt;\n&lt;li&gt;если код завершается с ошибкой и попадает в дамп памяти , необходимо прислать ссылку на дамп памяти, чтобы его можно было скачать и изучить.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Если проблема воспроизводится, постарайтесь найти минимальный пример для воспроизведения.&lt;/strong&gt; Нередки случаи, когда построение минимального примера, воспроизводящего проблему, позволяет найти ошибку в пользовательском коде. Если ваши вычисления зависят от дополнительных данных (таблицы, локальные файлы), подготовьте надежные ссылки на них. Дополнительные данные могут потребоваться для самостоятельного воспроизведения проблемы командой сервиса YTsaurus, если нельзя будет найти причину проблемы путем чтения логов.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Постарайтесь предоставить исходные данные.&lt;/strong&gt; Покажите проблему и все связанное с ней в «сыром» виде, команда сервиса YTsaurus приложит максимум усилий, чтобы понять первопричину.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Постарайтесь разделить проблемы.&lt;/strong&gt; Не пишите в одном сообщении об ошибке о разных проблемах. Напишите два сообщения.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Максимально используйте предоставляемые системой инструменты для самостоятельной диагностики.&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Давайте больше предыстории для отладки производительности.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Читайте документацию, в первую очередь FAQ&lt;/strong&gt;, который находится в отдельном &lt;a href=\"faq/index.html\"&gt;разделе&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/problems/howtoreport.md","sourcePath":"ru/user-guide/problems/howtoreport.md"},"headings":[{"title":"Случаи обращений","href":"ru/user-guide/problems/howtoreport.html#sluchai-obrashenij","level":2,"items":[{"title":"Вопросы по работе с веб-интерфейсом","href":"ru/user-guide/problems/howtoreport.html#voprosy-po-rabote-s-veb-interfejsom","level":3},{"title":"Вопросы по текущей работе системы","href":"ru/user-guide/problems/howtoreport.html#voprosy-po-tekushej-rabote-sistemy","level":3},{"title":"Вопросы по разработке","href":"ru/user-guide/problems/howtoreport.html#voprosy-po-razrabotke","level":3},{"title":"Прочие вопросы","href":"ru/user-guide/problems/howtoreport.html#prochie-voprosy","level":3}]},{"title":"Советы по написанию сообщений об ошибках","href":"ru/user-guide/problems/howtoreport.html#sovety-po-napisaniyu-soobshenij-ob-oshibkah","level":2}],"title":"Как сообщать о проблеме"},"router":{"pathname":"ru/user-guide/problems/howtoreport","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
