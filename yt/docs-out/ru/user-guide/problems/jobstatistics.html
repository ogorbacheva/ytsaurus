            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе содержится перечень и описание статистик, собираемых системой YTsaurus с операций и отдельных джобов. Приводятся примеры диагностики проблем на основе собираемых статистик.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"ru/user-guide/problems/jobstatistics.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;В процессе выполнения операций YTsaurus собирает из джобов различные системные и пользовательские статистики.&lt;/p&gt;\n&lt;p&gt;Статистики отдельных джобов попадают в лог планировщика, агрегированные статистики по операции доступны в веб-интерфейсе во вкладке &lt;strong&gt;Statistics&lt;/strong&gt; на странице операции. На рисунке приведён пример страницы со статистиками джобов операции:&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/jobstatistics.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Для более полного понимания статистик джобов необходимо знать понятия &lt;code&gt;job proxy&lt;/code&gt;, &lt;code&gt;sandbox&lt;/code&gt;, иметь представление о том, как система YTsaurus доставляет пользовательские файлы в джобы. Об этом можно узнать в разделе Джобы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"opisanie-statistik\"&gt;&lt;a href=\"ru/user-guide/problems/jobstatistics.html#opisanie-statistik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Описание статистик&lt;/span&gt;&lt;/a&gt;Описание статистик&lt;/h2&gt;\n&lt;h3 id=\"system_stats\"&gt;&lt;a href=\"ru/user-guide/problems/jobstatistics.html#system_stats\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Системные статистики&lt;/span&gt;&lt;/a&gt;Системные статистики&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Статистика&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;time/total&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время выполнения джоба с момента его создания планировщиком до получения планировщиком информации о завершении джоба (успешном или неуспешном). В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;time/prepare&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время подготовки джоба до запуска &lt;code&gt;job proxy&lt;/code&gt; (загрузка файлов в чанк-кеш при необходимости, создание &lt;code&gt;sandbox&lt;/code&gt;-директории, создание и копирование файлов в &lt;code&gt;tmpfs&lt;/code&gt;, подготовка необходимых &lt;code&gt;cgroups&lt;/code&gt;). В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;time/artifacts_download&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время загрузки файлов в чанк-кеш (при необходимости). Является частью &lt;code&gt;time/prepare&lt;/code&gt;. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;time/prepare_root_fs&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время подготовки файловой системы в porto контейнере (при необходимости). Является частью &lt;code&gt;time/prepare&lt;/code&gt;. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;time/gpu_check&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время выполнения утилиты предварительной проверки работоспособности GPU на ноде (релевантно для части GPU-операций). Является частью &lt;code&gt;time/prepare&lt;/code&gt;. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;time/exec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время выполнения джоба, от старта до завершения процесса &lt;code&gt;job proxy&lt;/code&gt;. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/input/chunk_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Суммарное число дата слайсов, прочитанных джобом. Дата слайс — это непрерывный сегмент одного чанка (в случае статических таблиц), либо непрерывный диапазон строк между двумя ключами (в случае динамических таблиц). В штуках.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/input/row_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Суммарное число табличных строк, прочитанных джобом. В штуках.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/input/compressed_data_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Суммарный сжатый объем блоков, прочитанных джобом (табличные данные, подаваемые на вход операции). В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/input/uncompressed_data_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Суммарный расжатый объем блоков, прочитанных джобом. В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/input/data_weight&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;«Логический» объем несжатых данных, прочитанных джобом. Зависит только от значений в ячейках таблицы и количества строк. Не зависит от наличия на таблице схемы и значений &lt;code&gt;optimize_for&lt;/code&gt;, &lt;code&gt;compression_codec&lt;/code&gt;, &lt;code&gt;erasure_codec&lt;/code&gt;. Вычисляется как &lt;code&gt;row_count + sum(data_weight(value))&lt;/code&gt; по всем значениям в ячейках таблицы. В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/input/not_fully_consumed&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;1, если джоб прочитал не весь вход, иначе 0.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/output/K/chunk_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Число чанков, записанных в выходную таблицу с индексом K. В штуках.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/output/K/row_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Число строк, записанных в выходную таблицу с индексом К. В штуках.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/output/K/compressed_data_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Сжатый объем блоков, записанных в выходную таблицу К. В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/output/K/uncompressed_data_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Несжатый объем блоков, записанных в выходную таблицу К. В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/output/K/data_weight&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;«Логический» объем несжатых данных, записанных в выходную таблицу К, зависит только от значений в ячейках таблицы и количества строк. Не зависит от наличия на таблице схемы и значений &lt;code&gt;optimize_for&lt;/code&gt;, &lt;code&gt;compression_codec&lt;/code&gt;, &lt;code&gt;erasure_codec&lt;/code&gt;. Вычисляется как &lt;code&gt;row_count + sum(data_weight(value))&lt;/code&gt; по всем значениям в ячейках таблицы. В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/output/K/regular_disk_space&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Заполняется только для таблиц с &lt;code&gt;erasure_codec == none&lt;/code&gt; и равен &lt;code&gt;compressed_data_size&lt;/code&gt; + размер метаданных чанков. В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/output/K/erasure_disk_space&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Заполняется только для таблиц с &lt;code&gt;erasure_codec != none&lt;/code&gt;. Помимо &lt;code&gt;compressed_data_size&lt;/code&gt; включает объем &lt;i class=\"yfm yfm-term_title\" term-key=\":parity\" role=\"button\" aria-describedby=\":parity_element\" tabindex=\"0\" id=\"fdx0a9u0\"&gt;parity&lt;/i&gt; блоков. Подробнее про erasure-кодеки можно прочитать в &lt;a href=\"user-guide/storage/replication.html\"&gt;разделе&lt;/a&gt;. В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/cpu/user&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;User mode CPU time процесса &lt;code&gt;job proxy&lt;/code&gt;. Вычисляется на основе значения &lt;code&gt;cpu_usage&lt;/code&gt; porto контейнера. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/cpu/system&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Kernel mode CPU time процесса &lt;code&gt;job proxy&lt;/code&gt;. Вычисляется на основе значения &lt;code&gt;cpu_usage_system&lt;/code&gt; porto контейнера. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/cpu/wait&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Wait CPU time процесса &lt;code&gt;job proxy&lt;/code&gt;. Вычисляется на основе значения &lt;code&gt;cpu_wait&lt;/code&gt; porto контейнера. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/cpu/throttled&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Throttled CPU time процесса &lt;code&gt;job proxy&lt;/code&gt;. Вычисляется на основе значения &lt;code&gt;cpu_throttled&lt;/code&gt; porto контейнера. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/block_io/bytes_written&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Число байтов, записанных процессом &lt;code&gt;job proxy&lt;/code&gt; на локальное блочное устройство. Значение получается из секции &lt;code&gt;Write&lt;/code&gt; из файла &lt;code&gt;blkio.io_serviced_bytes&lt;/code&gt; соответствующей cgroup. Обычно небольшая величина, потому что &lt;code&gt;job proxy&lt;/code&gt; пишет на локальный диск только логи. Запись чанков выполняется через (локальную и/или удаленные) ноды, и в данной статистике никак не учитывается.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/block_io/bytes_read&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Число байтов, прочитанных процессом &lt;code&gt;job proxy&lt;/code&gt; с локального блочного устройства. Значение получается из секции &lt;code&gt;Read&lt;/code&gt; из &lt;code&gt;blkio.io_serviced_bytes&lt;/code&gt; соответствующей cgroup. В типичном случае стремится к нулю, потому что &lt;code&gt;job proxy&lt;/code&gt; читает с локального диска только свою конфигурацию.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/block_io/io_read&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Число чтений с локального блочного устройства процессом &lt;code&gt;job proxy&lt;/code&gt;. Значение получается из секции &lt;code&gt;Read&lt;/code&gt; из &lt;code&gt;blkio.io_serviced&lt;/code&gt; соответствующей cgroup. В штуках.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/block_io/io_write&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Число записей на локальное блочное устройство процессом &lt;code&gt;job proxy&lt;/code&gt;. Значение получается из секции &lt;code&gt;Write&lt;/code&gt; из &lt;code&gt;blkio.io_serviced&lt;/code&gt; соответствующей cgroup. В штуках.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/block_io/io_total&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Общее число операций ввода/вывода с локальным блочным устройством процесса &lt;code&gt;job proxy&lt;/code&gt;. В штуках.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/max_memory&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Максимальный объем оперативной памяти, занимаемый процессом &lt;code&gt;job proxy&lt;/code&gt; в течение работы джоба. В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/memory_reserve&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Объем оперативной памяти, гарантированный &lt;code&gt;job proxy&lt;/code&gt; в момент старта. Если фактическое потребление становится больше &lt;code&gt;memory_reserve&lt;/code&gt;, то джоб может быть прерван с пометкой &lt;code&gt;resource_overdraft&lt;/code&gt;. В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/traffic&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Объем данных, переданных по сети в/из &lt;code&gt;job proxy&lt;/code&gt;. Как правило, соответствует объему входных/выходных данных джоба, если он лишь читает и пишет таблицы/файлы обычным для джоба образом и не генерирует самостоятельно другой трафик. Содержит поля вида &lt;code&gt;A_to_B&lt;/code&gt;, где &lt;code&gt;A&lt;/code&gt; и &lt;code&gt;B&lt;/code&gt; — короткие имена дата-центров. Значение такого поля равно объему данных, переданных в этом направлении. В поле &lt;code&gt;duration_ms&lt;/code&gt; можно найти продолжительность передачи данных. Обычно соответствует времени существования &lt;code&gt;job proxy&lt;/code&gt;. Помимо этого подсчитывается входящий/исходящий трафик (поля &lt;code&gt;inbound&lt;/code&gt; и &lt;code&gt;outbound&lt;/code&gt;, соответственно) — также в разбивке по дата-центрам.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;exec_agent/traffic&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;То же, что и &lt;code&gt;job_proxy/traffic&lt;/code&gt;, но для exec-агента. Как правило, отражает трафик, сгенерированный при подготовке артефактов джоба.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/cpu/*&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Аналогично &lt;code&gt;job_proxy/cpu/*&lt;/code&gt;, но для процессов пользовательского джоба.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/block_io/bytes_read&lt;/code&gt;, &lt;code&gt;user_job/block_io/bytes_written&lt;/code&gt;, &lt;code&gt;user_job/block_io/io_read&lt;/code&gt;, &lt;code&gt;user_job/block_io/io_write&lt;/code&gt;, &lt;code&gt;user_job/block_io/io_total&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Block IO статистики для пользовательского джоба. Аналогично &lt;code&gt;job_proxy/block_io/*&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/cumulative_memory_mb_sec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Интеграл используемой памяти в МБ*сек.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/current_memory/major_page_faults&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Число &lt;a href=\"https://en.wikipedia.org/wiki/Page_fault#Major\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;major page faults&lt;/a&gt;, случившихся в пользовательском процессе. Значение получается из секции &lt;code&gt;pgmajfault&lt;/code&gt; файла &lt;code&gt;memory.stat&lt;/code&gt; из &lt;code&gt;memory&lt;/code&gt; cgroup. Может помочь при изучении повышенного значения статистики &lt;code&gt;user_job/block_io/read&lt;/code&gt;. В штуках.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/current_memory/rss&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Размер RSS на момент окончания джоба. Значение получается из секции &lt;code&gt;rss&lt;/code&gt; файла &lt;code&gt;memory.stat&lt;/code&gt; соответствующей cgroup. В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/current_memory/mapped_file&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Размер memory mapped files на момент окончания джоба. Значение получается из секции &lt;code&gt;mapped_file&lt;/code&gt; файла &lt;code&gt;memory.stat&lt;/code&gt; соответствующей cgroup. В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/tmpfs_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Текущий &lt;strong&gt;занятый&lt;/strong&gt; объем &lt;code&gt;tmpfs&lt;/code&gt; в процессе работы джоба. Вычисляется как разница между &lt;code&gt;total&lt;/code&gt; и &lt;code&gt;free&lt;/code&gt; размерами, полученными вызовом &lt;code&gt;statfs&lt;/code&gt; на tmpfs mount point. В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/max_tmpfs_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Максимальный &lt;strong&gt;занятый&lt;/strong&gt; объем &lt;code&gt;tmpfs&lt;/code&gt; за все время работы джоба. В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/tmpfs_volumes/K/size&lt;/code&gt;, &lt;code&gt;user_job/tmpfs_volumes/K/max_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;То же самое, что &lt;code&gt;user_job/tmpfs_size&lt;/code&gt; и &lt;code&gt;user_job/max_tmpfs_size&lt;/code&gt;, только для каждого заказанного tmpfs volume по отдельности.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/disk/usage&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Занятое место на диске sandbox-ом джоба, вычисляется рекурсивным обходом sandbox-а и суммирование размера всех файлов. В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/disk/limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Заказанный лимит на размер sandbox-a джоба. В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/max_memory&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Максимальный объем оперативной памяти, занимаемый пользовательским джобом в процессе его работы, &lt;strong&gt;без&lt;/strong&gt; учета &lt;code&gt;tmpfs&lt;/code&gt;. В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/memory_limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ограничение на объём памяти, указанное в спецификации операции при её запуске. Дублируется в статистике по техническим причинам. В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/memory_reserve&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Объем памяти, гарантированный пользовательскому джобу в момент запуска. Когда фактическое потребление становится больше (но меньше &lt;code&gt;memory_limit&lt;/code&gt;), джоб может быть прерван с пометкой &lt;code&gt;resource_overdraft&lt;/code&gt;, если на узле кластера недостаточно памяти. Данную величину можно регулировать с помощью &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;опции&lt;/a&gt; &lt;code&gt;memory_reserve_factor&lt;/code&gt; в спецификации операции. В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/pipes/input/bytes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Число байт, переданных через stdin пользовательского процесса (то есть, объем входных данных, преобразованных в заданный входной формат, с учетом всех контрольных модификаторов, таких как: &lt;code&gt;table_index&lt;/code&gt;, &lt;code&gt;row_index&lt;/code&gt;, и так далее).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/pipes/input/idle_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время, в течение которого процесс &lt;code&gt;job proxy&lt;/code&gt; не передавал данные пользовательскому джобу в stdin, потому что читал данные. Например, на узле кластера с данными был загружен диск, данные были недоступны, либо использовался медленный на разжатие &lt;code&gt;compression_codec&lt;/code&gt;. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/pipes/input/busy_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время, в течение которого процесс &lt;code&gt;job proxy&lt;/code&gt; записывал данные в stdin пользовательскому джобу. Значение может быть велико, если пользовательский код реализует вычислительно тяжелую обработку и не успевает читать данные. Кроме того, причина может быть в медленной работе операций записи, когда пользовательский код блокируется на записи и поэтому не вычитывает новые данные. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/pipes/output/K/bytes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Число байт, записанных пользовательским процессом в дескриптор, соответствующий K-й выходной таблице. Про дескрипторы и их нумерацию в разделе.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/pipes/output/K/idle_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время, в течение которого процесс &lt;code&gt;job proxy&lt;/code&gt; не выполнял чтение из потока, соответствующего K-й выходной таблице, потому что записывал уже вычитанные оттуда данные. Например, медленно отвечал узел кластера на который идет запись, либо используется очень медленный алгоритм сжатия. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/pipes/output/K/busy_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время, в течение которого процесс &lt;code&gt;job proxy&lt;/code&gt; выполнял чтение из потока, соответствующего K-й выходной таблице. Если данное время велико, значит, пользовательский код долго ничего не писал в в поток. Например, потому что долго обсчитывал вход, либо вход был недоступен. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_utilization_gpu&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Чистое время, в течение которого выполнялись GPU-вычисления. Суммируется по всем GPU, используемых джобом. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_utilization_memory&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Чистое время, в течение которого выполнялись обращения к GPU-памяти. Суммируется по всем GPU, используемых джобом. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_utilization_clocks_sm&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Интеграл по времени частоты карточки относительно максимальной частоты. Суммируется по всем GPU, используемых джобом. В миллисекундах * долю.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_utilization_power&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Интеграл по времени эффективной мощности GPU-карт относительно максимальной мощности. Суммируется по всем GPU, используемых джобом. В миллисекундах * долю.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_load&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время, в течение которого загруженность GPU была отлична от нуля. Суммируется по всем GPU, используемых джобом. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_memory&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Интеграл используемой памяти GPU. Суммируется по всем GPU, используемых джобом. В миллисекундах * байты.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_power&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Интеграл используемой мощности GPU. Суммируется по всем GPU, используемых джобом. В миллисекундах * мощность.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_clocks_sm&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Интеграл используемой частоты GPU. Суммируется по всем GPU, используемых джобом. В миллисекундах * частоту.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/max_memory_used&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Максимальный зарегистрированный расход памяти GPU. Суммируется по всем GPU, используемых джобом. В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/memory_total&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Общий доступный объем памяти GPU. Суммируется по всем GPU, используемых джобом. В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_slowdown/hw&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время, в течение которого GPU испытывал аппаратное замедление. Суммируется по всем GPU, используемых джобом. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_slowdown/hw_power_brake&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время, в течение которого GPU испытывал аппаратное замедление из-за ограничения мощности. Суммируется по всем GPU, используемых джобом. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_slowdown/hw_thermal&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время, в течение которого GPU испытывал аппаратное замедление из-за перегрева. Суммируется по всем GPU, используемых джобом. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_slowdown/sw_thermal&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время, в течение которого GPU испытывал программное замедление из-за перегрева. Суммируется по всем GPU, используемых джобом. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_tensor_activity\"&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время, в течение которого тензорный конвейер (HMMA) GPU был активен. Суммируется по всем GPU, используемых джобом. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_dram_activity\"&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время, в течение которого интерфейс памяти GPU был активен, отправляя или принимая данные. Суммируется по всем GPU, используемых джобом. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;codec/cpu/decode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время (wall-time), потраченное на расжатие данных. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;codec/cpu/encode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время (wall-time), потраченное на сжатие данных. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/memory_reserve_factor_x10000&lt;/code&gt;, &lt;code&gt;user_job/memory_reserve_factor_x10000&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Внутренние параметры, используемые для анализа работы алгоритма вычисления &lt;code&gt;memory_reserve&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/aggregated_max_cpu_usage_x100&lt;/code&gt;, &lt;code&gt;job_proxy/aggregated_smoothed_cpu_usage_x100&lt;/code&gt;, &lt;code&gt;job_proxy/aggregated_preemptible_cpu_x100&lt;/code&gt;, &lt;code&gt;job_proxy/aggregated_preempted_cpu_x100&lt;/code&gt;, &lt;code&gt;job_proxy/preemptible_cpu_x100&lt;/code&gt;, &lt;code&gt;job_proxy/smoothed_cpu_usage_x100&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Внутренние статистики Job CPU Monitor.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk_reader_statistics/data_bytes_read_from_disk&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Объем данных, взятых с диска в процессе чтения чанков. В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk_reader_statistics/data_bytes_transmitted&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Объем данных, переданных по сети в процессе чтения чанков. В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk_reader_statistics/data_bytes_read_from_cache&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Объем данных, взятых из кеша в процессе чтения чанков. В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk_reader_statistics/meta_bytes_read_from_disk&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Объем метаданных, взятых с диска в процессе чтения чанков. В байтах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk_reader_statistics/wait_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время ожидания поступления данных в процессе чтения чанков. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk_reader_statistics/read_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время, в течение которого производилась активная стадия чтения чанков, например, парсинг строк из прочитанных блоков. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk_reader_statistics/idle_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время, в течение которого чтение чанков было приостановлено, так как обрабатывались уже прочитанные данные. В миллисекундах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"python-api\"&gt;&lt;a href=\"ru/user-guide/problems/jobstatistics.html#python-api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Python API&lt;/span&gt;&lt;/a&gt;Python API&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Статистика&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;custom/python_job_preparation_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время с момента входа в main программы до момента начала обработки входных строк.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"primery-diagnostiki\"&gt;&lt;a href=\"ru/user-guide/problems/jobstatistics.html#primery-diagnostiki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры диагностики&lt;/span&gt;&lt;/a&gt;Примеры диагностики&lt;/h2&gt;\n&lt;h3 id=\"medlennye-dzhoby\"&gt;&lt;a href=\"ru/user-guide/problems/jobstatistics.html#medlennye-dzhoby\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Медленные джобы&lt;/span&gt;&lt;/a&gt;Медленные джобы&lt;/h3&gt;\n&lt;p&gt;Наиболее частый случай использования статистик связан с диагностикой медленных джобов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статистики джобов стоит использовать наряду с другими средствами диагностики, предоставляемыми системой YTsaurus.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"medlennyj-polzovatelskij-kod\"&gt;&lt;a href=\"ru/user-guide/problems/jobstatistics.html#medlennyj-polzovatelskij-kod\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Медленный пользовательский код&lt;/span&gt;&lt;/a&gt;Медленный пользовательский код&lt;/h4&gt;\n&lt;p&gt;Простой случай: если &lt;code&gt;user_job/cpu/user ~= time/exec&lt;/code&gt;, это означает, что причина медленной работы джоба в пользовательском коде. Следует подключиться к джобу с помощью &lt;a href=\"user-guide/problems/jobshell-and-slowjobs.html\"&gt;job shell&lt;/a&gt; и искать узкое место с помощью perf и gdb.&lt;/p&gt;\n&lt;h4 id=\"mnogopotochnost\"&gt;&lt;a href=\"ru/user-guide/problems/jobstatistics.html#mnogopotochnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Многопоточность&lt;/span&gt;&lt;/a&gt;Многопоточность&lt;/h4&gt;\n&lt;p&gt;Более сложный случай: пользователь проанализировал статистики и получил сумму занятого процессорного времени:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;user_job/cpu/user + user_job/cpu/system+job_proxy/cpu/user+job_proxy/cpu/system = 303162 миллисекунд\ntime/exec = 309955 миллисекунд\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"733\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-733\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-733\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-733.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Пользователь ожидает, что цифры должны совпасть.&lt;/p&gt;\n&lt;p&gt;Приведённое равенство не вполне корректное, так как &lt;code&gt;time/exec&lt;/code&gt; — это wall-time, а &lt;code&gt;user_job/cpu/*&lt;/code&gt; и &lt;code&gt;job_proxy/cpu/*&lt;/code&gt; — время, проведенное в вычислении на CPU. При этом и &lt;code&gt;job proxy&lt;/code&gt;, и (потенциально) пользовательский процесс могут занимать больше одного ядра в силу многопоточности, к тому же оба процесса выполняются параллельно.&lt;/p&gt;\n&lt;p&gt;В том случае, если пользовательский процесс однопоточный, должно быть примерно верно следующее:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;time/exec ~= user_job/cpu/* + user_job/pipes/input/idle_time + max(user_job/pipes/output/N/idle_time)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"743\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-743\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-743\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-743.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В приведённый расчёт не входит время на «закрытие» выходных чанков: когда выходной поток уже закрыт, все данные через него прочитаны, но &lt;code&gt;job proxy&lt;/code&gt; ещё совершает действия по финализации чанков.&lt;/p&gt;\n&lt;h4 id=\"dolgaya-kompressiya\"&gt;&lt;a href=\"ru/user-guide/problems/jobstatistics.html#dolgaya-kompressiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Долгая компрессия&lt;/span&gt;&lt;/a&gt;Долгая компрессия&lt;/h4&gt;\n&lt;p&gt;Если операция выполняется существенно дольше, чем время работы пользовательского кода, а при замере времени выполнения выяснилось, что основное время система YTsaurus затрачивает на обработку &lt;code&gt;yield&lt;/code&gt;, дело в том, что внутри &lt;code&gt;yield&lt;/code&gt; python-wrapper записывает данные в выходной поток (output pipe). Если pipeline записи &lt;code&gt;job proxy&lt;/code&gt; перегружен, процесс &lt;code&gt;job proxy&lt;/code&gt; перестаёт вычитывать данные и &lt;code&gt;yield&lt;/code&gt; блокируется. Статистика &lt;code&gt;user_job/pipes/output/N/idle_time&lt;/code&gt; показала «потерянные» минуты. Возможны две причины, по которым процесс &lt;code&gt;job proxy&lt;/code&gt; не вычитывал данные: много времени заняла обработка прочитанных данных на стороне &lt;code&gt;job proxy&lt;/code&gt;, или запись на кластер. По статистике &lt;code&gt;job_proxy/cpu/user&lt;/code&gt; стало ясно, что 70% общего времени работы джоба процесс &lt;code&gt;job proxy&lt;/code&gt; нагружал CPU — это означает, что много времени заняла обработка входных данных. Самой тяжелой частью обработки в &lt;code&gt;job proxy&lt;/code&gt; является компрессия, что в итоге и оказалось видно в профилировщике.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Общее правило при диагностике медленных джобов: при анализе времени работы необходимо найти доминирующие метрики, после этого искать причину проблемы в локализованном компоненте.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"prevyshenie-garantij-po-pamyati\"&gt;&lt;a href=\"ru/user-guide/problems/jobstatistics.html#prevyshenie-garantij-po-pamyati\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Превышение гарантий по памяти&lt;/span&gt;&lt;/a&gt;Превышение гарантий по памяти&lt;/h3&gt;\n&lt;p&gt;Операции превышают ограничения по памяти. Последовательность действий по разрешению данной проблемы:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;При заказе tmpfs необходимо убедиться, что не заказывается лишний объём. Для этого следует посмотреть статистики &lt;code&gt;user_job/tmpfs_size&lt;/code&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Ограничение &lt;code&gt;memory_limit&lt;/code&gt; стоит выбирать, опираясь на статистику &lt;code&gt;user_job/max_memory&lt;/code&gt;; если используется &lt;code&gt;tmpfs&lt;/code&gt;, то требуемый объем &lt;code&gt;tmpfs&lt;/code&gt; нужно добавлять к &lt;code&gt;user_job/max_memory&lt;/code&gt;. При использовании автоматического заказа &lt;code&gt;tmpfs&lt;/code&gt; в C++ и Python API, API сделает добавку автоматически;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Если большинство джобов потребляют немного памяти, но некоторые из джобов требуют существенно больше памяти, стоит выставить &lt;code&gt;memory_limit&lt;/code&gt; по максимальному потреблению памяти джоба, но поставить &lt;code&gt;memory_reserve_factor&lt;/code&gt; меньше (при этом стоит быть готовым к прерываниям работы джобов с пометкой &lt;code&gt;resource_overdraft&lt;/code&gt;). Принять такое решение можно, сравнивая среднее и максимальное значение для статистики &lt;code&gt;user_job/max_memory&lt;/code&gt; (в веб-интерфейсе для этого имеются соответствующие переключатели): если в среднее и максимальное потребление памяти в джобах различаются на десятки процентов или в разы, это значит, что есть джобы с аномально большим потреблением;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Обратная ситуация: если возникает слишком много прерываний джобов с пометкой &lt;code&gt;resource_overdraft&lt;/code&gt;, следует увеличить &lt;code&gt;memory_reserve_factor&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"excessive_io\"&gt;&lt;a href=\"ru/user-guide/problems/jobstatistics.html#excessive_io\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сообщение об  в операциях&lt;/span&gt;&lt;/a&gt;Сообщение об &lt;code&gt;excessive io&lt;/code&gt; в операциях&lt;/h3&gt;\n&lt;p&gt;Следует изучить статистику &lt;code&gt;user_job/block_io/io_read&lt;/code&gt;. Если джоб делает десятки тысяч чтений, такой джоб вредит и себе, и другим пользователям.&lt;br /&gt;\nСтоит проверить счетчик &lt;code&gt;major page faults&lt;/code&gt;. Большое значение говорит о возможном использовании memory mapping.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование &lt;strong&gt;memory mapping&lt;/strong&gt; в джобах &lt;strong&gt;категорически не рекомендуется&lt;/strong&gt;, а джобы, совершающие такие действия, сильно нагружают диски случайными чтениями и записями. Помните, что обычный жесткий диск способен совершить не более 100 операций со случайным доступом в секунду, в то время как на узле кластера одновременно работают несколько десятков джобов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Среди решений данной проблемы: уменьшение размера исполняемого файла (например, путём удаления отладочных символов), заказ tmpfs для джоба и загрузка объёмных файлов в память при запуске джоба (опция &lt;code&gt;copy_files&lt;/code&gt;). Подробнее о данных опциях в разделе &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Настройки операций&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"dopolnitelno\"&gt;&lt;a href=\"ru/user-guide/problems/jobstatistics.html#dopolnitelno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дополнительно&lt;/span&gt;&lt;/a&gt;Дополнительно&lt;/h2&gt;\n&lt;p&gt;YTsaurus не может измерить время стадий внутри пользовательского процесса. Например, если пользовательский код на старте подгружает в память большой словарь, то время загрузки такого словаря на системных метриках увидеть не получится. В таком случае стоит использовать пользовательские статистики.&lt;/p&gt;\n&lt;p&gt;Возможно использование пользовательских статистик для расчётов простых агрегатов даже в операции map. Количество пользовательских статистик ограничено 128-ю на один джоб.&lt;/p&gt;\n&lt;p&gt;Существует возможность строить различные графики по статистикам джобов (в частности, визуализация стадий работы операции) для упрощения диагностики.&lt;/p&gt;\n&lt;dfn class=\"yfm yfm-term_dfn\" id=\":parity_element\" role=\"dialog\"&gt;&lt;p&gt;Дополнительные блоки, которые обеспечивают избыточность и позволяют восстановить исходный блок при выпадении любой части. Вычисляются через логическую операцию XOR.&lt;/p&gt;\n&lt;/dfn&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/problems/jobstatistics.md","sourcePath":"ru/user-guide/problems/jobstatistics.md"},"headings":[{"title":"Обзор","href":"ru/user-guide/problems/jobstatistics.html#obzor","level":2},{"title":"Описание статистик","href":"ru/user-guide/problems/jobstatistics.html#opisanie-statistik","level":2,"items":[{"title":"Системные статистики","href":"ru/user-guide/problems/jobstatistics.html#system_stats","level":3},{"title":"Python API","href":"ru/user-guide/problems/jobstatistics.html#python-api","level":3}]},{"title":"Примеры диагностики","href":"ru/user-guide/problems/jobstatistics.html#primery-diagnostiki","level":2,"items":[{"title":"Медленные джобы","href":"ru/user-guide/problems/jobstatistics.html#medlennye-dzhoby","level":3,"items":[{"title":"Медленный пользовательский код","href":"ru/user-guide/problems/jobstatistics.html#medlennyj-polzovatelskij-kod","level":4},{"title":"Многопоточность","href":"ru/user-guide/problems/jobstatistics.html#mnogopotochnost","level":4},{"title":"Долгая компрессия","href":"ru/user-guide/problems/jobstatistics.html#dolgaya-kompressiya","level":4}]},{"title":"Превышение гарантий по памяти","href":"ru/user-guide/problems/jobstatistics.html#prevyshenie-garantij-po-pamyati","level":3},{"title":"Сообщение об excessive io в операциях","href":"ru/user-guide/problems/jobstatistics.html#excessive_io","level":3}]},{"title":"Дополнительно","href":"ru/user-guide/problems/jobstatistics.html#dopolnitelno","level":2}],"title":"Статистики джобов"},"router":{"pathname":"ru/user-guide/problems/jobstatistics","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
