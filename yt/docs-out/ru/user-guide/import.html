        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Импорт данных из внешних систем в YTsaurus реализован через SPYT.&lt;/p&gt;\n&lt;p&gt;На данной странице приведена инструкция по импорту данных с помощью скрипта &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/connectors/import.py\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;import.py&lt;/a&gt;. Этот скрипт позволяет импортировать данные из Hive, Hadoop, S3, а также из СУБД, поддерживающих протокол JDBC. Для импорта из других систем хранения данных — например, из MongoDB — вы можете использовать SPYT напрямую, обратившись к этой системе с помощью соответствующего Spark Datasource.&lt;/p&gt;\n&lt;h2 id=\"dependencies\"&gt;&lt;a href=\"ru/user-guide/import.html#dependencies\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установите зависимости&lt;/span&gt;&lt;/a&gt;Установите зависимости&lt;/h2&gt;\n&lt;p&gt;jar-зависимости для чтения из Hive предоставляются вместе с пакетом &lt;code&gt;pyspark&lt;/code&gt;. Пакеты для работы с SPYT (включая &lt;code&gt;pyspark&lt;/code&gt;), должны быть установлены на системе, из которой вызывается импорт.&lt;/p&gt;\n&lt;p&gt;Для чтения из СУБД, которая поддерживает JDBC-протокол, нужно скачать JDBC-драйвер этой СУБД.&lt;/p&gt;\n&lt;p&gt;Файл &lt;code&gt;connectors/pom.xml&lt;/code&gt; содержит конфиг для Maven, в котором указаны JDBC-драйвера для MySQL и PostgreSQL. Эти драйвера можно скачать следующим образом:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;~/yt/connectors$ mvn dependency:copy-dependencies\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"18\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-18\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-18\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-18.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code&gt;mvn&lt;/code&gt; скачает jar-файлы с драйверами для PostgreSQL и MySQL в директорию &lt;code&gt;target/dependency&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Если необходимо импортировать данные из другой СУБД, добавьте JDBC-драйвер этой СУБД в качестве зависимости в &lt;code&gt;pom.xml&lt;/code&gt;, и запустите команду &lt;code&gt;$ mvn dependency:copy-dependencies&lt;/code&gt;&lt;/p&gt;\n&lt;h2 id=\"how-to-import\"&gt;&lt;a href=\"ru/user-guide/import.html#how-to-import\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запустите импорт данных&lt;/span&gt;&lt;/a&gt;Запустите импорт данных&lt;/h2&gt;\n&lt;p&gt;Для импорта данных следует запустить скрипт &lt;code&gt;import.py&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ ./import.py \\\n   &lt;span class=\"hljs-comment\"&gt;# Опции импорта.&lt;/span&gt;\n   &lt;span class=\"hljs-comment\"&gt;# ...&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"31\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-31\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-31\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-31.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опции должны идентифицировать:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;источник данных;&lt;/li&gt;\n&lt;li&gt;путь к импортируемым данным;&lt;/li&gt;\n&lt;li&gt;путь в YTsaurus, куда должны быть записаны импортируемые данные.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Список всех опций приведён в конце этого раздела, в секции &lt;a href=\"ru/user-guide/import.html#script-options\"&gt;Опции&lt;/a&gt;. Ниже приведены примеры импорта данных из разных систем.&lt;/p&gt;\n&lt;h3 id=\"hive\"&gt;&lt;a href=\"ru/user-guide/import.html#hive\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hive&lt;/span&gt;&lt;/a&gt;Hive&lt;/h3&gt;\n&lt;p&gt;Чтобы импортировать данные из Hive:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Загрузите на Кипарис файлы &lt;code&gt;hadoop-aws-*.jar&lt;/code&gt; и &lt;code&gt;aws-java-sdk-bundle-*.jar&lt;/code&gt; из локальной директории &lt;code&gt;target/dependency&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Запустите импорт данных следующей командой:\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ ./import.py \\\n  --metastore master_host:9083 \\\n  --warehouse-dir /path/to/hive/warehouse \\\n  --input hive:database_name.table_name \\\n  --output //path/in/yt/table \\\n  --proxy https://ytsaurus.company.net \\\n  --num-executors 5 \\\n  --executor-memory 4G \\\n  --executor-memory-overhead 2G \\\n  --jars yt:///path/to/jars/aws-java-sdk-bundle-1.11.901.jar \\\n         yt:///path/to/jars/hadoop-aws-3.3.1.jar\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"71\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-71\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-71\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-71.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;a href=\"ru/user-guide/import.html#script-options\"&gt;Перейти к описанию опций&lt;/a&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Альтернативно, можно передать в Hive SQL-запрос для исполнения и импортировать результат этого запроса. Для этого используйте префикс &lt;code&gt;hive_sql&lt;/code&gt; для описания исходных данных:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ ./import.py \\\n    ...\n    --input hive_sql:database_name:SELECT * FROM action_log WHERE action_date &amp;gt; &lt;span class=\"hljs-string\"&gt;'2023-01-01'&lt;/span&gt; \\\n    ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"80\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-80\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-80\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-80.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"hdfs\"&gt;&lt;a href=\"ru/user-guide/import.html#hdfs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HDFS&lt;/span&gt;&lt;/a&gt;HDFS&lt;/h3&gt;\n&lt;p&gt;Для импорта файла из HDFS используйте спецификатор с указанием формата этого файла, а также адрес HDFS NameNode:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ ./import.py \\\n    ...\n    --input text:hdfs://namenode/path/to/text/file\n    ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"87\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-87\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-87\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-87.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code&gt;import.py&lt;/code&gt; также поддерживает форматы parquet, orc.&lt;/p&gt;\n&lt;h3 id=\"subd,-podderzhivayushie-jdbc-protokol\"&gt;&lt;a href=\"ru/user-guide/import.html#subd,-podderzhivayushie-jdbc-protokol\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;СУБД, поддерживающие JDBC-протокол&lt;/span&gt;&lt;/a&gt;СУБД, поддерживающие JDBC-протокол&lt;/h3&gt;\n&lt;p&gt;Чтобы импортировать данные из JDBC-совместимых СУБД (например, из PostgreSQL), запустите команду:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ ./import.py \\\n    --jdbc postgresql \\\n    --jdbc-server pg_host:5432 \\\n    --jdbc-user user \\\n    --jdbc-password &lt;span class=\"hljs-string\"&gt;''&lt;/span&gt; \\  &lt;span class=\"hljs-comment\"&gt;# Получить пароль из консольного ввода&lt;/span&gt;\n    --input jdbc:database_name.table_name \\\n    --output //path/in/yt/table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"97\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-97\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-97\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-97.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;a href=\"ru/user-guide/import.html#script-options\"&gt;Перейти к описанию опций&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Чтобы передать в СУБД запрос для исполнения и импортировать результат, можно использовать префикс &lt;code&gt;jdbc_sql&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ ./import.py \\\n    ...\n    --input jdbc_sql:database_name:SELECT * FROM &lt;span class=\"hljs-built_in\"&gt;users&lt;/span&gt; WHERE signup_date &amp;gt; &lt;span class=\"hljs-string\"&gt;'2023-01-01'&lt;/span&gt; \\\n    ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"104\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-104\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-104\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-104.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"s3\"&gt;&lt;a href=\"ru/user-guide/import.html#s3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;S3&lt;/span&gt;&lt;/a&gt;S3&lt;/h3&gt;\n&lt;p&gt;Чтобы импортировать данные из S3:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Загрузите на Кипарис файлы &lt;code&gt;hadoop-aws-*.jar&lt;/code&gt; и &lt;code&gt;aws-java-sdk-bundle-*.jar&lt;/code&gt; из локальной директории &lt;code&gt;target/dependency&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Запустите импорт данных следующей командой:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;./import.py \\\n --input parquet:s3a://bucket/path/to/data/sample-parquet \\\n --output //home/tables/import_from_s3 \\\n --s3-access-key &amp;lt;S3 Access Key&amp;gt; \\\n --s3-secret-key &amp;lt;S3 Secret Key&amp;gt; \\\n --s3-endpoint &amp;lt;S3 endpoint&amp;gt; \\\n --proxy https://ytsaurus.company.net \\\n --num-executors 5 \\\n --executor-memory 4G \\\n --executor-memory-overhead 2G \\\n --jars yt:///path/to/jars/aws-java-sdk-bundle-1.11.901.jar \\\n      yt:///path/to/jars/hadoop-aws-3.3.1.jar\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"121\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-121\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-121\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-121.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Описание опций приведено ниже.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"script-options\"&gt;&lt;a href=\"ru/user-guide/import.html#script-options\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Опции&lt;/span&gt;&lt;/a&gt;Опции&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;import.py&lt;/code&gt; поддерживает следующие опции:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Опция&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--num-executors&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Число экзекьютеров для операции импорта (по умолчанию 1)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--cores-per-executor&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Резервация для числа CPU-ядер на экзекьютер (по умолчанию 1)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--ram-per-core&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;RAM-резервация на каждое ядро (по умолчанию 2GB)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--jdbc&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип JDBC-драйвера для СУБД. Например &lt;code&gt;mysql&lt;/code&gt; или &lt;code&gt;postgresql&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--jdbc-server&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;host:port сервера СУБД&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--jdbc-user&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя пользователя в СУБД&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--jdbc-password&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Пароль для СУБД. Если передан пустой флаг, получить из консоли&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--jars&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Дополнительные JAR-библиотеки. По умолчанию, &lt;code&gt;target/dependency/jar/*.jar&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--input&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Объект для импорта, можно указывать несколько раз&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--output&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Путь для записи в YTsaurus. Должно быть указано одно значение на каждое значение &lt;code&gt;--input&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Если операция импорта данных предусматривает запуск кластера SPYT, следующие опции командной строки могут использоваться для конфигурации этого кластера:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Опция&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--proxy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Адрес прокси в кластере YTsaurus, где будет работать SPYT&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--pool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Пул ресурсов в YTsaurus для кластера SPYT&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--executor-timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Таймаут для Spark-экзекьютеров&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--executor-tmpfs-limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Размер tmpfs-партиции для Spark экзекьютеров&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--executor-memory&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Объём оперативной памяти, выделяемой каждому экзекьютеру&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--executor-memory-overhead&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Дополнительный объём памяти, который выделяется экзекьютерам сверх основной памяти. Например, если основная память 4 ГБ и дополнительная 2 ГБ, то общий объём памяти, запрашиваемый у кластера, будет 6 ГБ&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;В случае импорта данных с S3:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Опция&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--s3-access-key&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ключ доступа (Access Key ID), который идентифицирует пользователя или приложение в S3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--s3-secret-key&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Секретный ключ (Secret Access Key), связанный с ключом доступа&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--s3-endpoint&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;URL-адрес (endpoint) S3-хранилища&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Поддерживаются следующие спецификаторы для импортируемых данных:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Спецификатор&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;hive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Таблица в Hive, вида &lt;code&gt;db_name.table_name&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;hive_sql&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;SQL-запрос над Hive, вида &lt;code&gt;db_name:sql statement&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;jdbc&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Таблица в СУБД, вида &lt;code&gt;db_name.table_name&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;jdbc_sql&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;SQL-запрос для СУБД, вида `db_name:sql statement'&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;text&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Текстовый файл в HDFS&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parquet&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;parquet-файл в HDFS&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;orc&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;orc-файл из в HDFS&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;По умолчанию при записи таблицы в YTsaurus подразумевается, что таблица не существует. Если таблица уже существует, можно её перезаписать или дополнить, используя спецификатор &lt;code&gt;overwrite&lt;/code&gt; или &lt;code&gt;append&lt;/code&gt;. Например: &lt;code&gt;--output overwrite:/path/to/yt&lt;/code&gt;&lt;/p&gt;\n&lt;h2 id=\"preobrazovaniya-tipov\"&gt;&lt;a href=\"ru/user-guide/import.html#preobrazovaniya-tipov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Преобразования типов&lt;/span&gt;&lt;/a&gt;Преобразования типов&lt;/h2&gt;\n&lt;p&gt;Импорт сложных типов из внешних систем может поддерживаться лишь частично. Система типов YTsaurus не имеет взаимно однозначного соответствия с системами типов других систем хранения данных. При импорте SPYT сохранит тип по мере возможности, и преобразует значение в строку в тех случаях, когда не удалось вывести правильный тип. При необходимости используйте SQL для корректного преобразования типов.&lt;/p&gt;\n&lt;p&gt;Диапазоны значений одного типа могут оказаться разными. Например, YTsaurus &lt;code&gt;date&lt;/code&gt; не хранит даты ранее Юникс-эпохи, 1 января 1970 года. Попытка записать в YTsaurus более ранние даты приведёт к ошибке. Даты раньше Юникс-эпохи в YTsaurus можно хранить как строки (например, используя преобразование &lt;code&gt;to_char(date_value, 'YYYY-MM-DD')&lt;/code&gt; в PostgreSQL), или как целые числа (&lt;code&gt;date_value - '1970-01-01'&lt;/code&gt; в PostgreSQL).&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/import.md","sourcePath":"ru/user-guide/import.md"},"headings":[{"title":"Установите зависимости","href":"ru/user-guide/import.html#dependencies","level":2},{"title":"Запустите импорт данных","href":"ru/user-guide/import.html#how-to-import","level":2,"items":[{"title":"Hive","href":"ru/user-guide/import.html#hive","level":3},{"title":"HDFS","href":"ru/user-guide/import.html#hdfs","level":3},{"title":"СУБД, поддерживающие JDBC-протокол","href":"ru/user-guide/import.html#subd,-podderzhivayushie-jdbc-protokol","level":3},{"title":"S3","href":"ru/user-guide/import.html#s3","level":3}]},{"title":"Опции","href":"ru/user-guide/import.html#script-options","level":2},{"title":"Преобразования типов","href":"ru/user-guide/import.html#preobrazovaniya-tipov","level":2}],"title":"Импорт данных из Hive, S3, MongoDB и других систем"},"router":{"pathname":"ru/user-guide/import","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
