        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Под памятью имеется в виду RAM — оперативная память, потребляемая джобами операций.&lt;br /&gt;\nДля всех операций по умолчанию работает механизм подбора фактического резерва памяти для запускаемых джобов.&lt;/p&gt;\n&lt;p&gt;Данный механизм устроен следующим образом. Контроллер операции собирает для всех успешно завершившихся джобов информацию о потребленной памяти. Данная информация сохраняется в специальный digest, на основании которого подбирается фактический резерв памяти для вновь запускаемых джобов.&lt;/p&gt;\n&lt;p&gt;Основные аспекты работы digest-а:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Собирает эффективное потребление памяти джобами, представляемое долей от &lt;code&gt;memory_limit&lt;/code&gt; (то есть числом в диапазоне от 0.0 до 1.0).&lt;/li&gt;\n&lt;li&gt;Учитываются только успешно завершившиеся джобы и джобы, которые были прерваны по причине превышения резерва памяти.&lt;/li&gt;\n&lt;li&gt;Для джобов, которые были прерваны по причине превышения резерва, в digest добавляется точка с долей потребления памяти этого джоба, умноженной на определенную константу, немного превышающую единицу (по умолчанию 1.1).&lt;/li&gt;\n&lt;li&gt;В качестве резерва для вновь запущенного джоба берется &lt;code&gt;memory_limit * percentile(digest, P)&lt;/code&gt; (по умолчанию &lt;code&gt;P&lt;/code&gt; равно 0.95).&lt;/li&gt;\n&lt;li&gt;Внутри себя digest не хранит все точки, а используют некоторую структуру данных, позволяющую приближенно вычислять перцентили.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Выделенный джобу резерв памяти используется планировщиком для учёта потребления в качестве нижней границы. В случае превышения значения резерва и отсутствия свободной памяти на узле кластера джоб может быть прерван, при этом будет указана причина &lt;code&gt;resource_overdraft&lt;/code&gt;. При наличии дополнительной свободной памяти на узле кластера джоб может превысить выделенный ему резерв и успешно завершиться. В случае же превышения &lt;code&gt;memory_limit&lt;/code&gt;, указанного пользователем в спецификации операции, джоб будет прерван с ошибкой &lt;code&gt;Memory limit exceeded&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Важно понимать, что помимо процесса пользователя в джобе также присутствует процесс &lt;code&gt;job_proxy&lt;/code&gt;, являющийся прослойкой между пользовательским процессом и кластером. В зависимости от разных обстоятельств, job proxy может потреблять существенный объём оперативной памяти под компрессию, механизм колоночного чтения/записи, erasure и иные нужды. Контроллер операции поддерживает отдельные digest для процесса пользователя (&lt;code&gt;user_job&lt;/code&gt;) и для процесса &lt;code&gt;job_proxy&lt;/code&gt;. В случае процесса &lt;code&gt;job_proxy&lt;/code&gt; контроллер делает предположение относительно ожидаемого использования памяти, исходя из числа входных/выходных таблиц и их настроек. На основании сделанного предположения digest подбирает резерв (в диапазоне от 0.5 до 2.0 по умолчанию).&lt;/p&gt;\n&lt;p&gt;Кроме того, у выделяемого резерва памяти пользовательскому процессу есть нижняя граница. По умолчанию она указывается в спецификации и равна 0.05. Однако, если джоб заказывает &lt;code&gt;tmpfs&lt;/code&gt;, то резерв памяти не может быть меньше, чем &lt;code&gt;tmpfs_size / memory_limit&lt;/code&gt;, то есть система стремится не допускать оверкоммита по &lt;code&gt;tmpfs&lt;/code&gt;, так как он может приводить к зависанию операционной системы на узлах кластера.&lt;/p&gt;\n&lt;h3 id=\"statistiki\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/memory-digest.html#statistiki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистики&lt;/span&gt;&lt;/a&gt;Статистики&lt;/h3&gt;\n&lt;p&gt;В статистиках операций есть ряд значений, которые позволяют провести анализ зарезервированной памяти:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;user_job/memory_reserve&lt;/code&gt; и &lt;code&gt;job_proxy/memory_reserve&lt;/code&gt; (байты) — резерв памяти, выданной соответствующему процессу джоба;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;user_job/max_memory&lt;/code&gt; и &lt;code&gt;job_proxy/max_memory&lt;/code&gt; (байты) — максимальное потребление памяти соответствующего процесса джоба в течение его исполнения;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;job_proxy/estimated_memory&lt;/code&gt; (байты) — оценка планировщика на память процесса &lt;code&gt;job_proxy&lt;/code&gt; данного джоба;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;user_job/memory_limit&lt;/code&gt; (байты) — указанный пользователем лимит на память джоба;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;user_job/cumulative_memory_reserve&lt;/code&gt;, &lt;code&gt;job_proxy/cumulative_memory_reserve&lt;/code&gt;, &lt;code&gt;user_job/cumulative_max_memory&lt;/code&gt;, &lt;code&gt;job_proxy/cumulative_max_memory&lt;/code&gt;, &lt;code&gt;job_proxy/cumulative_estimated_memory&lt;/code&gt; (байты * секунды) — соответствующие кумулятивные метрики с учетом длительности джобов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"nastrojki-digest\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/memory-digest.html#nastrojki-digest\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройки digest&lt;/span&gt;&lt;/a&gt;Настройки digest&lt;/h3&gt;\n&lt;p&gt;Доступные пользователю опции в спецификации операции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;user_job_memory_digest_default_value&lt;/code&gt; — исходное предположение для выбора резерва памяти (по умолчанию 0.5).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;user_job_memory_digest_lower_bound&lt;/code&gt; — граница, ниже которой не может опускаться резерв (по умолчанию 0.05). Не рекомендуется менять значение по умолчанию.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;memory_reserve_factor&lt;/code&gt; — алиас для опции &lt;code&gt;user_job_memory_digest_lower_bound&lt;/code&gt; и &lt;code&gt;user_job_memory_digest_default_value&lt;/code&gt; одновременно. Не рекомендуется использовать данную опцию.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/scheduler/memory-digest.md","sourcePath":"ru/user-guide/data-processing/scheduler/memory-digest.md"},"headings":[],"title":"Подбор памяти для джобов"},"router":{"pathname":"ru/user-guide/data-processing/scheduler/memory-digest","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
