        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе рассказано о том, как создавать пулы, управлять ресурсами и настройками вычислительных пулов в системе YTsaurus на примере CLI и веб-интерфейса.&lt;/p&gt;\n&lt;h2 id=\"common\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/manage-pools.html#common\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общие сведения&lt;/span&gt;&lt;/a&gt;Общие сведения&lt;/h2&gt;\n&lt;p&gt;В системе YTsaurus реализована возможность управлять вычислительными пулами. Поддерживаются такие действия с пулами, как:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;создание;&lt;/li&gt;\n&lt;li&gt;переименование;&lt;/li&gt;\n&lt;li&gt;перемещение;&lt;/li&gt;\n&lt;li&gt;удаление;&lt;/li&gt;\n&lt;li&gt;изменение настроек.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Изменение настроек вычислительного пула осуществляется путём редактирования соответствующих атрибутов пула. Доступные атрибуты для редактирования пользователем:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;weight&lt;/code&gt; — управление долей ресурсов родительского пула, которая будет доставаться текущему пулу;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_operation_count&lt;/code&gt; — ограничение на число выполняющихся (&lt;code&gt;running&lt;/code&gt;) операций и операций в очереди (&lt;code&gt;pending&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_running_operation_count&lt;/code&gt; — ограничение на число выполняющихся (&lt;code&gt;running&lt;/code&gt;) операций;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;strong_guarantee_resources&lt;/code&gt; — словарь, описывающий гарантированные ресурсы пула;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;forbid_immediate_operations&lt;/code&gt; — запрет на запуск операций непосредственно в данном пуле;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;mode&lt;/code&gt; — способ распределения ресурсов между операциями в пуле;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;fifo_sort_parameters&lt;/code&gt; — управление очередностью запуска операций в fifo-пулах;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;resource_limits&lt;/code&gt; — словарь, задающий верхние ограничения для ресурсов, доступных пулу;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;create_ephemeral_subpools&lt;/code&gt; — разрешение создавать &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html#puly-i-derevya-pulov\"&gt;эфемерные пулы&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ephemeral_subpool_config&lt;/code&gt; — словарь, описывающий конфигурацию виртуальных пулов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Подробное описание указанных атрибутов см. в разделе &lt;a href=\"user-guide/data-processing/scheduler/pool-settings.html#pools\"&gt;Характеристики пулов&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"validaciya\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/manage-pools.html#validaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Валидация&lt;/span&gt;&lt;/a&gt;Валидация&lt;/h3&gt;\n&lt;p&gt;При валидации система YTsaurus проверяет типы атрибутов, ограничение &lt;code&gt;max_operation_count &amp;gt;= max_running_operation_count&lt;/code&gt;, количество тегов в списке &lt;code&gt;allowed_profiling_tags&lt;/code&gt; (не более 200), отсутствие подпулов в fifo-пулах и согласованность гарантий на ресурсы.&lt;/p&gt;\n&lt;p&gt;Согласованность гарантий на ресурсы означает, что по каждому ресурсу сумма гарантий потомков не должна превышать гарантию родителя. Если на подпуле выставлена ненулевая гарантия на некоторый ресурс, то она должна быть выставлена и у родителя. При этом допускается, что у пула ненулевая гарантия выставлена на более чем одном ресурсе.&lt;/p&gt;\n&lt;h2 id=\"prava-dostupa\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/manage-pools.html#prava-dostupa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Права доступа&lt;/span&gt;&lt;/a&gt;Права доступа&lt;/h2&gt;\n&lt;p&gt;Для того чтобы управлять вычислительным пулом, необходимо запросить доступ к управлению пулом. Это можно сделать через веб-интерфейс YTsaurus.&lt;/p&gt;\n&lt;p&gt;Правами доступа к пулу управляют пользователи, у которых уже есть соответствующий доступ, — по умолчанию он выдается пользователю, создавшему пул.&lt;/p&gt;\n&lt;p&gt;Для запроса доступа к вычислительному пулу:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Перейдите на страницу пула из раздела &lt;code&gt;Scheduling&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Выберите вкладку &lt;code&gt;ACL&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Нажмите &lt;code&gt;Request permissions&lt;/code&gt;, заполните открывшуюся форму и нажмите &lt;strong&gt;Confirm&lt;/strong&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;img src=\"images/pool-request-permissions.jpg\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;h3 id=\"perechen-dopustimyh-dejstvij-s-vychislitelnym-pulom\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/manage-pools.html#perechen-dopustimyh-dejstvij-s-vychislitelnym-pulom\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Перечень допустимых действий с вычислительным пулом&lt;/span&gt;&lt;/a&gt;Перечень допустимых действий с вычислительным пулом&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;Для создания/удаления деревьев пулов необходимо право &lt;code&gt;write&lt;/code&gt; на корень &lt;code&gt;//sys/pool_trees&lt;/code&gt; (только для администраторов кластера YTsaurus).&lt;/li&gt;\n&lt;li&gt;Для создания пулов необходимо право &lt;code&gt;write&lt;/code&gt; или &lt;code&gt;modify_children&lt;/code&gt; на родительском пуле (выдаётся вместе с правом доступа &lt;strong&gt;Use&lt;/strong&gt; на родительский пул).&lt;/li&gt;\n&lt;li&gt;Для удаления пула необходимо право &lt;code&gt;remove&lt;/code&gt; на него (выдаётся вместе с правом доступа &lt;strong&gt;Use&lt;/strong&gt; на родительский пул).&lt;/li&gt;\n&lt;li&gt;Для изменения пользовательских атрибутов пула необходимо право &lt;code&gt;write&lt;/code&gt; на пул (выдаётся вместе с правом доступа &lt;strong&gt;Use&lt;/strong&gt; на родительский пул).&lt;/li&gt;\n&lt;li&gt;Для изменения всех остальных атрибутов пула необходимо право &lt;code&gt;administer&lt;/code&gt; (только для администраторов кластера YTsaurus).&lt;/li&gt;\n&lt;li&gt;Для управления операциями в данном пуле и его потомках необходимо право &lt;code&gt;manage&lt;/code&gt; (под управлением операциями скрывается возможность выполнять операции &lt;code&gt;abort&lt;/code&gt;, &lt;code&gt;suspend&lt;/code&gt;, &lt;code&gt;resume&lt;/code&gt; не являясь автором операции).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В качестве примера рассмотрим пул &lt;code&gt;project-root&lt;/code&gt; в дереве пулов &lt;code&gt;default&lt;/code&gt;.&lt;br /&gt;\nНеобходимый набор прав для управления подпулами представлен в листинге:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //sys/pool_trees/default/project-root/@acl\n[\n    {\n        &lt;span class=\"hljs-string\"&gt;\"permissions\"&lt;/span&gt; = [\n            &lt;span class=\"hljs-string\"&gt;\"modify_children\"&lt;/span&gt;;\n        ];\n        &lt;span class=\"hljs-string\"&gt;\"action\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"allow\"&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"subjects\"&lt;/span&gt; = [\n            &lt;span class=\"hljs-string\"&gt;\"some_user\"&lt;/span&gt;;\n        ];\n        &lt;span class=\"hljs-string\"&gt;\"inheritance_mode\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"object_and_descendants\"&lt;/span&gt;;\n    };\n    {\n        &lt;span class=\"hljs-string\"&gt;\"permissions\"&lt;/span&gt; = [\n            &lt;span class=\"hljs-string\"&gt;\"write\"&lt;/span&gt;;\n            &lt;span class=\"hljs-string\"&gt;\"remove\"&lt;/span&gt;;\n        ];\n        &lt;span class=\"hljs-string\"&gt;\"action\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"allow\"&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"subjects\"&lt;/span&gt; = [\n            &lt;span class=\"hljs-string\"&gt;\"some_user\"&lt;/span&gt;;\n        ];\n        &lt;span class=\"hljs-string\"&gt;\"inheritance_mode\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"descendants_only\"&lt;/span&gt;;\n    };\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"173\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-173\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-173\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-173.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Пользователь может управлять подпулами, но не корневым пулом проекта, то есть не может изменить гарантию корневого пула проекта и другие параметры. Разрешение распространяется только на потомков данного пула.&lt;/p&gt;\n&lt;h2 id=\"cli\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/manage-pools.html#cli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Управление пулами через CLI&lt;/span&gt;&lt;/a&gt;Управление пулами через CLI&lt;/h2&gt;\n&lt;p&gt;Создание подпула:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt create scheduler_pool --attributes=&lt;span class=\"hljs-string\"&gt;'{pool_tree=default;name=project-subpool1;parent_name=project-root}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"183\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-183\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-183\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-183.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В &lt;code&gt;attributes&lt;/code&gt; можно дополнительно передать атрибуты пула, они будут провалидированы. В случае неуспешной валидации объект создан не будет.&lt;/p&gt;\n&lt;p&gt;Пример изменения веса для созданного пула:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/pool_trees/default/project-root/project-subpool1/@weight 10\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"190\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-190\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-190\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-190.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Первичное выставление гарантии пула при условии, что у родителя имеется нераспределенная гарантия:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/pool_trees/default/project-root/project-subpool1/@strong_guarantee_resources &lt;span class=\"hljs-string\"&gt;'{cpu=50}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"194\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-194\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-194\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-194.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Для изменения уже выставленной гарантии можно изменить конкретный параметр:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/pool_trees/default/project-root/project-subpool1/@strong_guarantee_resources/cpu 100\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"198\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-198\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-198\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-198.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Перемещение производится стандартным образом:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt move //sys/pool_trees/default/project-root/project-subpool1 //sys/pool_trees/default/new-project/new-subpool\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"202\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-202\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-202\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-202.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Переименование через перемещение поддерживается.&lt;br /&gt;\nПри перемещении происходит валидация.&lt;/p&gt;\n&lt;p&gt;Атрибуты выставляются стандартным образом:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/pool_trees/default/project_pool/@max_operation_count 10\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"209\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-209\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-209\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-209.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;При выставлении атрибутов происходит валидация.&lt;/p&gt;\n&lt;h2 id=\"ui\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/manage-pools.html#ui\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Управление пулами через веб-интерфейс&lt;/span&gt;&lt;/a&gt;Управление пулами через веб-интерфейс&lt;/h2&gt;\n&lt;p&gt;Управление пулами в веб-интерфейсе осуществляется в разделе &lt;code&gt;Scheduling&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Для создания подпула необходимо перейти в родительский пул, нажав на его имя. Далее нужно нажать кнопку &lt;code&gt;Create pool&lt;/code&gt; и заполнить все обязательные поля в форме, после этого нажать &lt;code&gt;Confirm&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Пример формы по созданию пула представлен на рисунке.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/manage_pool_01.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;Для редактирования настроек пула необходимо нажать на карандаш в строке с именем пула в правой части экрана, как показано на рисунке.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/manage_pool_04.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;Настройки пула, доступные для редактирования, разделены на группы. На рисунках приведены примеры общих настроек и гарантированных ресурсов, соответственно.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/manage_pool_02.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/manage_pool_03.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;В разделе &lt;code&gt;Resource Limits&lt;/code&gt; можно выставить верхнее ограничение для пула, если, например, необходимо, чтобы пул не выходил за потребление в 100 ядер. По умолчанию верхнего ограничения для пулов не существует, доступные пулу ресурсы ограничены мощностью кластера.&lt;/p&gt;\n&lt;p&gt;В разделе &lt;code&gt;Other Settings&lt;/code&gt; приведены дополнительные настройки, в частности запрет на запуск операций в пуле.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Обратите внимание, что операции рекомендуется запускать именно в листьях дерева пулов, то есть в тех пулах, у которых нет подпулов. В таком случае полезно явно выставлять запрет на запуск операций непосредственно в данном пуле.&lt;/p&gt;\n&lt;p&gt;В узлах дерева пулов (в пулах, имеющих подпулы) запускать операции не следует, в противном случае сложнее расследовать различные проблемы при распределении ресурсов между пулами и операциями.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/scheduler/manage-pools.md","sourcePath":"ru/user-guide/data-processing/scheduler/manage-pools.md"},"headings":[{"title":"Общие сведения","href":"ru/user-guide/data-processing/scheduler/manage-pools.html#common","level":2,"items":[{"title":"Валидация","href":"ru/user-guide/data-processing/scheduler/manage-pools.html#validaciya","level":3}]},{"title":"Права доступа","href":"ru/user-guide/data-processing/scheduler/manage-pools.html#prava-dostupa","level":2,"items":[{"title":"Перечень допустимых действий с вычислительным пулом","href":"ru/user-guide/data-processing/scheduler/manage-pools.html#perechen-dopustimyh-dejstvij-s-vychislitelnym-pulom","level":3}]},{"title":"Управление пулами через CLI","href":"ru/user-guide/data-processing/scheduler/manage-pools.html#cli","level":2},{"title":"Управление пулами через веб-интерфейс","href":"ru/user-guide/data-processing/scheduler/manage-pools.html#ui","level":2}],"title":"Управление вычислительными пулами"},"router":{"pathname":"ru/user-guide/data-processing/scheduler/manage-pools","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"fee
