        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В статье представлено высокоуровневое описание устройства JOIN в CHYT.&lt;/p&gt;\n&lt;h2 id=\"sort-vs-shard\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/queries/joins.html#sort-vs-shard\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сортировка vs шардирование&lt;/span&gt;&lt;/a&gt;Сортировка vs шардирование&lt;/h2&gt;\n&lt;p&gt;Схема хранения таблиц в YTsaurus принципиально отличается от таковой в ClickHouse. В YTsaurus базовый примитив хранения — &lt;a href=\"user-guide/storage/static-tables.html\"&gt;статическая таблица&lt;/a&gt;, строки которой лежат по &lt;a href=\"user-guide/storage/chunks.html\"&gt;чанкам&lt;/a&gt;, произвольным образом раскиданным по кластеру. Статические таблицы крайне неэффективны в задачах, которые требуют точечного чтения данных (так как эти точечные чтения, как правило, приводят к Random IO на жестком диске). Для быстрых точечных чтений в YTsaurus есть более эффективный и сложный примитив, который называется &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;динамические таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Однако многие batch-приложения, обрабатывающие потоком большой объем данных, требуют так или иначе работать в модели, когда часть колонок являются &lt;em&gt;ключевыми&lt;/em&gt;. В YTsaurus поддерживается понятие сортированной таблицы — в схеме таблицы может быть отражен тот факт, что ее строки отсортированы по некоторому префиксу колонок. Такие колонки называются ключевыми. Подобная метаинформация позволяет эффективно реализовать, например, операцию Sorted Reduce, отсутствующую в оригинальной парадигме Map-Reduce. В YTsaurus семейство Reduce очень богатое: в частности, операции типа Reduce поддерживают foreign-таблицы с &lt;code&gt;LEFT INNER JOIN&lt;/code&gt; семантикой.&lt;/p&gt;\n&lt;p&gt;В ClickHouse основой для распределенного хранения данных является не &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html\"&gt;сортировка&lt;/a&gt;, как в YTsaurus, а &lt;em&gt;шардирование&lt;/em&gt;. По умолчанию данные размазываются по шардам согласно некоторому ключу шардирования на основании остатка от деления выражения шардирования на суммарный вес всех шардов (подробнее можно прочитать в &lt;a href=\"https://clickhouse.yandex/docs/en/operations/table_engines/distributed/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;документации ClickHouse&lt;/a&gt;. Также зачастую пользователи сами управляют логикой шардирования, самостоятельно вставляя данные на конкретные хосты.&lt;/p&gt;\n&lt;p&gt;Обе схемы достигают одной цели разными способами:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;В YTsaurus сортировка обеспечивает локальность строк с одним значением ключа в одном чанке (либо в наборе подряд идущих).&lt;/li&gt;\n&lt;li&gt;В ClickHouse шардирование обеспечивает локальность строк с одним значением выражения шардирования на одной машине.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"query\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/queries/joins.html#query\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как работает запрос в CHYT?&lt;/span&gt;&lt;/a&gt;Как работает запрос в CHYT?&lt;/h2&gt;\n&lt;p&gt;В разделе &lt;a href=\"user-guide/data-processing/chyt/queries/anatomy.html\"&gt;Анатомия запроса&lt;/a&gt; детально описывается устройство CHYT. Любой SELECT-запрос разбивается координатором на порции по основной таблице, после чего каждая порция обрабатывается независимо на своем инстансе.&lt;/p&gt;\n&lt;p&gt;Подобная схема исполнения очень близка к таковой в Distributed-движке ClickHouse за тем исключением, что в ClickHouse чтение данных происходит буквально \"из-под ног\" у инстанса, а в YTsaurus чанки разбросаны произвольным образом по машинам кластера, что компенсируется очень толстой сетью.&lt;/p&gt;\n&lt;p&gt;Такой метод хорошо пригоден для потоковых запросов из одного источника, не содержащих JOIN. Однако как только возникает необходимость джойнить, приходится придумывать, как совмещать относящиеся друг к другу строки из разных источников, не порождая при этом необходимость делать случайные чтения.&lt;/p&gt;\n&lt;h2 id=\"types\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/queries/joins.html#types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Виды JOIN в ClickHouse&lt;/span&gt;&lt;/a&gt;Виды JOIN в ClickHouse&lt;/h2&gt;\n&lt;p&gt;Как вообще может работать координация (то есть распределение нагрузки между инстансами) JOIN в распределенном окружении? В ClickHouse возможны следующие стратегии исполнения конструкции &lt;code&gt;lhs JOIN rhs USING/ON ...&lt;/code&gt;:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Distributed local JOIN: если таблицы шардированы &lt;em&gt;одинаковым образом&lt;/em&gt;, то можно исполнять JOIN независимо на каждом инстансе, так как верно, что пара ключей, соединенная JOIN, не может оказаться на разных машинах. Таким образом, &lt;code&gt;lhs&lt;/code&gt; и &lt;code&gt;rhs&lt;/code&gt; на каждом инстансе интерпретируются как соответствующие им локальные таблицы.&lt;/li&gt;\n&lt;li&gt;GLOBAL JOIN: если использовать ключевое слово GLOBAL рядом с JOIN, то можно форсировать систему поступить следующим образом. На координаторе запроса полностью исполняется и материализуется правый аргумент &lt;code&gt;rhs&lt;/code&gt; и его сериализованное представление рассылается вместе с запросом по инстансам, а инстансам предлагается пользоваться этим представлением для получения правой части в своей памяти. Данный метод хорош, когда &lt;code&gt;rhs&lt;/code&gt; сравнительно небольшого размера, а инстансов сравнительно немного: легко видеть, что при невыполнение одного из этих условий можно упереться в раздачу таблицы с координатора по подзапросом по сети (либо вообще по памяти на координаторе). Этот метод &lt;em&gt;не требует&lt;/em&gt; никаких дополнительных условий на согласованность схемы хранения/шардирования на таблицах.&lt;/li&gt;\n&lt;li&gt;JOIN via subqueries. ClickHouse позволяет окружить &lt;code&gt;lhs&lt;/code&gt; и/или &lt;code&gt;rhs&lt;/code&gt; скобками, и это существенно влияет на план исполнения:&lt;br /&gt;\n— Если окружить &lt;code&gt;lhs&lt;/code&gt; в скобки, то ClickHouse теряет какую-либо информацию про устройство lhs, в частности, пропадает знание про распределённую натуру левой части. В такой ситуации на координаторе независимо исполняется левая часть, независимо исполняется правая часть, правая часть поднимается в оперативную память в хеш-таблицу и дальше происходит полное исполнение JOIN только на координаторе.&lt;br /&gt;\n— Если окружить &lt;code&gt;rhs&lt;/code&gt; скобками, то ClickHouse произведет распределенный запрос, как если бы запрос выглядел просто как &lt;code&gt;SELECT lhs&lt;/code&gt;. Затем отправит на инстансы свои запросы, оставив &lt;code&gt;JOIN (rhs)&lt;/code&gt; как есть. Далее каждый инстанс будет исполнять &lt;code&gt;rhs&lt;/code&gt; независимо, что может привести к кратно большей нагрузке, так как каждый инстанс будет материализовывать правую часть независимо. Против последней проблемы в ClickHouse есть защитный механизм, который по умолчанию запрещает такое поведение и приводит к ошибке &lt;code&gt;Double-distributed IN/JOIN subqueries is denied&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Подробнее об этом читайте в документации ClickHouse, релевантные ссылки:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://clickhouse.com/docs/en/sql-reference/statements/select/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;SELECT Query&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://clickhouse.com/docs/en/operations/settings/settings/#distributed-product-mode\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;distributed_product_mode&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Как же выглядит аналогичная классификация в CHYT? Пункты 2 и 3 работают точно так же: стратегия 2 хороша, если правая часть таблицы маленькая. Первый вариант стратегии 3 подходит, если правая таблица очень большая, но есть возможность ждать долго. Хочется заметить, что CHYT предназначен для быстрых аналитических запросов, а если что-то требует джойнить большие разнородные таблицы, то лучше использовать YQL и Map-Reduce. Поэтому данный способ не рекомендуется.&lt;/p&gt;\n&lt;p&gt;В стратегии 1 в CHYT присутствует существенное отличие, о чем можно прочитать ниже.&lt;/p&gt;\n&lt;h2 id=\"sorted\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/queries/joins.html#sorted\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sorted JOIN&lt;/span&gt;&lt;/a&gt;Sorted JOIN&lt;/h2&gt;\n&lt;p&gt;Вместо логики &lt;em&gt;Distributed JOIN&lt;/em&gt;, использующей идентичность схемы &lt;em&gt;шардирования&lt;/em&gt; аргументов, в CHYT естественным образом возникает логика &lt;em&gt;Sorted JOIN&lt;/em&gt;, использующая идентичность схемы &lt;em&gt;сортировки&lt;/em&gt; аргументов. Для хорошо понимающих, как устроена операция Sorted Reduce, Sorted JOIN работает ровно таким же образом.&lt;/p&gt;\n&lt;p&gt;Для того, чтобы воспользоваться стратегией Sorted JOIN, необходимо использовать обычную конструкцию &lt;code&gt;lhs JOIN rhs USING/ON ...&lt;/code&gt;, но на &lt;code&gt;lhs&lt;/code&gt; и &lt;code&gt;rhs&lt;/code&gt; налагаются следующие дополнительные ограничения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;lhs&lt;/code&gt; и &lt;code&gt;rhs&lt;/code&gt; должны быть сортированными таблицами. Пусть &lt;code&gt;lhs&lt;/code&gt; отсортирована по колонкам &lt;code&gt;l1, l2, ..., ln&lt;/code&gt;, а &lt;code&gt;rhs&lt;/code&gt; – по колонкам &lt;code&gt;r1, r2, ..., rm&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Условие JOIN должно выглядеть как набор равенств &lt;code&gt;l1 = r1&lt;/code&gt;, ...,  &lt;code&gt;lk = rk&lt;/code&gt; для некоторого &lt;code&gt;k&lt;/code&gt; (сами равенства могут идти в произвольном порядке). Это может быть выражено как набором равенств в ON-клаузе, так и набором общих ключевых колонок в USING-клаузе, но не условием в WHERE-клаузе.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;При соблюдении этих условий можно переиспользовать логику координации из операции Sorted reduce, формируя пары соответствующих диапазонов из &lt;code&gt;lhs&lt;/code&gt; и &lt;code&gt;rhs&lt;/code&gt; и распределяя их по инстансам в подзапросах. Если же это условие не выполнено, то возникнет ошибка и придется пользоваться либо стратегией 2 (использовать GLOBAL JOIN), либо вторым вариантом стратегии 3 (заключать правую часть в подзапрос).&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/chyt/queries/joins.md","sourcePath":"ru/user-guide/data-processing/chyt/queries/joins.md"},"headings":[{"title":"Сортировка vs шардирование","href":"ru/user-guide/data-processing/chyt/queries/joins.html#sort-vs-shard","level":2},{"title":"Как работает запрос в CHYT?","href":"ru/user-guide/data-processing/chyt/queries/joins.html#query","level":2},{"title":"Виды JOIN в ClickHouse","href":"ru/user-guide/data-processing/chyt/queries/joins.html#types","level":2},{"title":"Sorted JOIN","href":"ru/user-guide/data-processing/chyt/queries/joins.html#sorted","level":2}],"title":"JOIN в CHYT"},"router":{"pathname":"ru/user-guide/data-processing/chyt/queries/joins","depth":6,"base":"../../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
