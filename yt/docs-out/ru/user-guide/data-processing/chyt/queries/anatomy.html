        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данной статье описано, как устроен запрос в CHYT и откуда можно получить информацию об исполнении запроса.&lt;/p&gt;\n&lt;h2 id=\"id\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/queries/anatomy.html#id\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Идентификаторы запроса: , , &lt;/span&gt;&lt;/a&gt;Идентификаторы запроса: &lt;code&gt;trace id&lt;/code&gt;, &lt;code&gt;query id&lt;/code&gt;, &lt;code&gt;datalens request id&lt;/code&gt;&lt;/h2&gt;\n&lt;p&gt;С любым запросом связаны несколько идентификаторов, которые позволяют постфактум восстановить всю необходимую информацию об исполнении запроса.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;query id&lt;/code&gt; — это идентификатор, назначаемый каждому запросу в ClickHouse. В отличие от оригинального ClickHouse, в CHYT этот идентификатор не контролируется пользователем и всегда имеет вид &lt;em&gt;YTsaurus GUID&lt;/em&gt; – четыре шестнадцатеричных uint32, разделённых дефисами.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;trace id&lt;/code&gt; — это идентификатор, который позволяет провязывать цепочки вызовов в распределённых системах, создавая «след» исполнения запроса. Это часть протокола трассировки &lt;a href=\"https://opentracing.io/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;opentracing&lt;/a&gt;, а конкретно — его реализации под названием &lt;a href=\"https://www.jaegertracing.io/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Jaeger Tracing&lt;/a&gt;, использующейся в YTsaurus. &lt;code&gt;trace id&lt;/code&gt; также является YTsaurus GUID, который в некоторых ситуациях совпадает с &lt;code&gt;query id&lt;/code&gt;, а в некоторых не совпадает, о чём подробно будет написано ниже.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"way-to-proxy\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/queries/anatomy.html#way-to-proxy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Путь запроса от клиента до тяжёлых прокси&lt;/span&gt;&lt;/a&gt;Путь запроса от клиента до тяжёлых прокси&lt;/h2&gt;\n&lt;p&gt;Чтобы лучше понимать, по какой логике существуют и назначаются эти идентификаторы, следует разобраться в том, через какие компоненты в каком порядке проходит запрос в CHYT. Единственным публичным API доступа к CHYT на текущий момент является HTTP API, поэтому дальнейшее описание относится именно к протоколу HTTP.&lt;/p&gt;\n&lt;p&gt;Первым важным пунктом на пути исполнения запроса являются так называемые &lt;em&gt;тяжёлые прокси&lt;/em&gt; YTsaurus, сетевой доступ к которым есть у всех пользователей YTsaurus. Тяжёлые прокси узнают, где сейчас живут инстансы клики с заданным алиасом, а затем отправляют запрос на случайно выбранный инстанс.&lt;/p&gt;\n&lt;p&gt;Ниже показаны три самых популярных способа доступа к YTsaurus.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/chyt_before_clique.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;p&gt;При обращении к CHYT напрямую из скрипта либо из командной строки посредством утилиты cURL в качестве endpoint используется SLB-балансер, например &lt;code&gt;http://$YT_PROXY&lt;/code&gt;. За ним скрывается сложная конструкция из балансеров, которая направляет запрос на так называемые &lt;em&gt;контрольные прокси&lt;/em&gt;, которые отвечают HTTP-редиректом на тяжёлые прокси, обслуживающие всю тяжёлую нагрузку в YTsaurus. При таком интерфейсе доступа &lt;code&gt;query id&lt;/code&gt; совпадает с &lt;code&gt;trace id&lt;/code&gt;: их можно увидеть в заголовках &lt;code&gt;X-Yt-Trace-Id&lt;/code&gt; и &lt;code&gt;X-ClickHouse-Query-Id&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Ниже показан пример взаимодействия с CHYT через утилиту cURL, в котором отмечены наиболее интересные заголовки ответа.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В версиях YT 24.1 и ранее алиас клики указывается со звёздочкой в начале, например, &lt;code&gt;*ch_public&lt;/code&gt;. В текущей версии &lt;code&gt;*ch_public&lt;/code&gt; и &lt;code&gt;ch_public&lt;/code&gt; соответствуют одному алиасу.&lt;/p&gt;\n&lt;p&gt;При обращении к CHYT по устаревшему пути &lt;code&gt;/query&lt;/code&gt; алиас передаётся через url-параметр &lt;code&gt;database&lt;/code&gt;. При обращении по актуальному пути &lt;code&gt;/chyt&lt;/code&gt; алиас берётся из &lt;code&gt;user&lt;/code&gt; или из url-параметра &lt;code&gt;chyt.clique_alias&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ curl -v --location-trusted &lt;span class=\"hljs-string\"&gt;'http://$YT_PROXY/chyt?chyt.clique_alias=ch_public'&lt;/span&gt; -d &lt;span class=\"hljs-string\"&gt;'select max(a) from \"//sys/clickhouse/sample_table\"'&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth `cat ~/.yt/token`\"&lt;/span&gt;\n*   Trying ip_address:80...\n* Connected to &lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt; (ip_address) port 80 (#0)\n&amp;gt; POST /chyt?chyt.clique_alias=ch_public HTTP/1.1\n&amp;gt; Host: &lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;\n&amp;gt; User-Agent: curl/7.69.1-DEV\n&amp;gt; Accept: */*\n&amp;gt; Authorization: OAuth &amp;lt;i&amp;gt;...&amp;lt;my_token&amp;gt;...&amp;lt;/i&amp;gt;\n&amp;gt; Content-Length: 50\n&amp;gt; Content-Type: application/x-www-form-urlencoded\n&amp;gt;\n* upload completely sent off: 50 out of 50 bytes\n* Mark bundle as not supporting multiuse\n&amp;lt;b&amp;gt; // Получаем redirect на тяжелую прокси.&amp;lt;/b&amp;gt;\n&amp;lt; HTTP/1.1 307 Temporary Redirect\n&amp;lt; Content-Length: 0\n&amp;lt; Location: http://sas4-9923-proxy-&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/chyt?chyt.clique_alias=ch_public\n&amp;lt; X-Yt-Trace-Id: 8e9bcc43-5c2be9b4-56f18c4e-117ea314\n&amp;lt;\n* Connection &lt;span class=\"hljs-comment\"&gt;#0 to host $YT_PROXY left intact&lt;/span&gt;\n* Issue another request to this URL: &lt;span class=\"hljs-string\"&gt;'http://sas4-9923-$YT_PROXY/chyt?chyt.clique_alias=ch_public'&lt;/span&gt;\n*   Trying ip_address:80...\n* Connected to sas4-9923-&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt; (ip_address) port 80 (#1)\n&amp;gt; POST /chyt?chyt.clique_alias=ch_public HTTP/1.1\n&amp;gt; Host: sas4-9923-&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;\n&amp;gt; User-Agent: curl/7.69.1-DEV\n&amp;gt; Accept: */*\n&amp;gt; Authorization: OAuth &amp;lt;i&amp;gt;...&amp;lt;my_token&amp;gt;...&amp;lt;/i&amp;gt;\n&amp;gt; Content-Length: 50\n&amp;gt; Content-Type: application/x-www-form-urlencoded\n&amp;gt;\n* upload completely sent off: 50 out of 50 bytes\n* Mark bundle as not supporting multiuse\n&amp;lt; HTTP/1.1 200 OK\n&amp;lt; Transfer-Encoding: chunked\n&amp;lt;b&amp;gt;  // Обратите внимание, query &lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt; = trace &lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;. &amp;lt;/b&amp;gt;\n&amp;lt; &amp;lt;b&amp;gt;X-ClickHouse-Query-Id:&amp;lt;/b&amp;gt; 3fa9405e-15b29877-524e3e67-2be50e94\n&amp;lt; &amp;lt;b&amp;gt;X-Yt-Trace-Id:&amp;lt;/b&amp;gt; 3fa9405e-15b29877-524e3e67-2be50e94\n&amp;lt;b&amp;gt;  // По техническим причинам X-Yt-Trace-Id встретится дважды.&amp;lt;/b&amp;gt;\n&amp;lt; X-Yt-Trace-Id: 3fa9405e-15b29877-524e3e67-2be50e94\n&amp;lt; Keep-Alive: &lt;span class=\"hljs-built_in\"&gt;timeout&lt;/span&gt;=10\n&amp;lt;b&amp;gt;  // Адрес инстанса-координатора запроса. &amp;lt;/b&amp;gt;\n&amp;lt; &amp;lt;b&amp;gt;X-ClickHouse-Server-Display-Name:&amp;lt;/b&amp;gt; sas2-1374-node-&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;\n&amp;lt; X-Yt-Request-Id: 3fa9405d-26285349-db14531a-2a12b9f9\n&amp;lt; Date: Sun, 05 Apr 2020 18:49:57 GMT\n&amp;lt; Content-Type: text/tab-separated-values; charset=UTF-8\n&amp;lt; X-ClickHouse-Summary: {&lt;span class=\"hljs-string\"&gt;\"read_rows\"&lt;/span&gt;:&lt;span class=\"hljs-string\"&gt;\"0\"&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;\"read_bytes\"&lt;/span&gt;:&lt;span class=\"hljs-string\"&gt;\"0\"&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;\"written_rows\"&lt;/span&gt;:&lt;span class=\"hljs-string\"&gt;\"0\"&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;\"written_bytes\"&lt;/span&gt;:&lt;span class=\"hljs-string\"&gt;\"0\"&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;\"total_rows_to_read\"&lt;/span&gt;:&lt;span class=\"hljs-string\"&gt;\"0\"&lt;/span&gt;}\n&amp;lt;b&amp;gt;  // Адрес тяжелой прокси, которая обслуживала запроса. &amp;lt;/b&amp;gt;\n&amp;lt; &amp;lt;b&amp;gt;X-Yt-Proxy:&amp;lt;/b&amp;gt; sas4-9923-&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;\n&amp;lt;\n1100\n* Connection &lt;span class=\"hljs-comment\"&gt;#1 to host sas4-9923-$YT_PROXY left intact&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"55\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-55\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-55\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-55.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"query_execution\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/queries/anatomy.html#query_execution\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Исполнение запроса внутри клики&lt;/span&gt;&lt;/a&gt;Исполнение запроса внутри клики&lt;/h2&gt;\n&lt;p&gt;Тяжёлая прокси &lt;a href=\"user-guide/data-processing/chyt/queries/instance-pick.html\"&gt;выбирает&lt;/a&gt; один инстанс из клики и делегирует ему исполнение запроса. Данный инстанс называется «координатором» (или «инициатором») запроса. Если запрос не использует таблицы YTsaurus (например, он обращается только к системным таблицам, начинающимся с префикса &lt;code&gt;system.&lt;/code&gt;, или это примитивный запрос типа &lt;code&gt;SELECT 1&lt;/code&gt;), то он исполняется на координаторе так же, как и в обычном ClickHouse.&lt;/p&gt;\n&lt;p&gt;Если же запрос затрагивает таблицы YTsaurus, то он всегда исполняется распределённым образом. Рассмотрим исполнение на примере простейшего сканирующего запроса, возможно с фильтрацией, проекцией и агрегацией:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;SELECT someColumns, someFunctions(someColumns) FROM \"//path/to/table\" WHERE somePredicate(someColumns) [GROUP BY someColumns]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Данный запрос приводит к разбиению таблицы &lt;code&gt;//path/to/table&lt;/code&gt; на примерно равные части, каждая из которых будет независимо обрабатываться на одном из узлов клики. Фактически, на каждый инстанс поступит видоизменённый запрос, у которого в FROM-клаузе &lt;code&gt;//path/to/table&lt;/code&gt; будет заменено на некоторое выражение вида &lt;code&gt;ytSubquery(...)&lt;/code&gt;, в аргументе которого закодировано описание очередной части таблицы.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/chyt_inside_clique.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;Таким образом, исполнение запроса сводится к исполнению некоторого количества удалённых подзапросов на инстансах клики. Картинка выше иллюстрирует данный механизм.&lt;/p&gt;\n&lt;p&gt;Здесь полезно понимать, что запросы бывают двух видов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;QueryKind: InitialQuery&lt;/code&gt; — исходные запросы, приходящие от клиентов;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;QueryKind: SecondaryQuery&lt;/code&gt; — это переписанные удалённые подзапросы, в которых в FROM-клаузе фигурируют конкретные части таблиц YTsaurus.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Каждый secondary запрос наследует &lt;code&gt;trace id&lt;/code&gt; родителя. При этом у каждого secondary запроса свой собственный &lt;code&gt;query id&lt;/code&gt;; но несмотря на это каждый secondary запрос помнит initial запрос, к которому он относится. В логах системы родительский &lt;code&gt;query id&lt;/code&gt; исходного initial запроса для secondary запроса обозначается термином &lt;code&gt;InitialQueryId&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"io-i-kompressiya-v-chyt\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/queries/anatomy.html#io-i-kompressiya-v-chyt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;IO и компрессия в CHYT&lt;/span&gt;&lt;/a&gt;IO и компрессия в CHYT&lt;/h2&gt;\n&lt;p&gt;Ниже приведён ряд фактов и рекомендаций касательно чтения данных из YTsaurus. Учитывайте их при использовании CHYT.&lt;/p&gt;\n&lt;h3 id=\"pro-set\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/queries/anatomy.html#pro-set\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Про сеть&lt;/span&gt;&lt;/a&gt;Про сеть&lt;/h3&gt;\n&lt;p&gt;Инстансы любой клики запускаются на случайных машинах кластера, поэтому, скорее всего, чтение данных будет происходить по сети. Грубо можно полагать, что каждый очередной гигабайт данных, которые надо прочитать, будет находиться на новых машинах кластера.&lt;/p&gt;\n&lt;p&gt;При этом следует отметить, что сеть внутри кластеров YTsaurus редко оказывается узким местом, но и такое иногда случается.&lt;/p&gt;\n&lt;h3 id=\"pro-kompressiyu\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/queries/anatomy.html#pro-kompressiyu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Про компрессию&lt;/span&gt;&lt;/a&gt;Про компрессию&lt;/h3&gt;\n&lt;p&gt;Данные в YTsaurus, как правило, хранятся в &lt;strong&gt;сжатом&lt;/strong&gt; виде. За компрессию отвечает атрибут &lt;code&gt;/@compression_codec&lt;/code&gt; на таблице, его также можно увидеть в веб-интерфейсе просмотра таблицы. Про это есть отдельная &lt;a href=\"user-guide/storage/compression.html\"&gt;статья&lt;/a&gt; в документации.&lt;/p&gt;\n&lt;p&gt;Данные сжатых таблиц читаются инстансами в сжатом виде и далее разжимаются непосредственно перед обработкой их движком ClickHouse. Чем сильнее кодек сжатия, тем дороже разжимать данные — учитывайте это при выборе кодека сжатия для данных.&lt;/p&gt;\n&lt;h3 id=\"pro-uncompressed-block-cache\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/queries/anatomy.html#pro-uncompressed-block-cache\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Про uncompressed block cache&lt;/span&gt;&lt;/a&gt;Про uncompressed block cache&lt;/h3&gt;\n&lt;p&gt;В CHYT есть &lt;strong&gt;uncompressed block cache&lt;/strong&gt;, под который по умолчанию отводится 20 GiB. Размер кеша можно регулировать параметром &lt;code&gt;--uncompressed-block-cache-size&lt;/code&gt; в строке запуска клики.&lt;/p&gt;\n&lt;p&gt;Этот кеш заполняется разжатыми блоками недавно прочитанных таблиц, вследствие чего исполнение запроса поверх данных, прочитанных за малое время до того другим запросом, оказывается сильно быстрее, так как часть данных уже может быть готовой и доступной в памяти инстансов. Для эффективного использования данного кеша должны соблюдаться следующие условия:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Кеш хорошо работает, пока состав инстансов в клике остаётся неизменным. Если какой-то инстанс пропадает (например, из-за preemption, выхода ноды YTsaurus из строя или падения CHYT), то распределение будущих подзапросов по инстансам меняется произвольным образом и большая часть закешированных блоков данных в памяти инстансов может стать бесполезной, т. е. вырастет block cache miss. Впрочем, следующий же запрос после такой ситуации восстановит в кеше нужные данные.&lt;/li&gt;\n&lt;li&gt;Если данные в таблице меняются, то и распределение частей таблицы по подзапросом меняется произвольным образом, что аналогично приводит к block cache miss.&lt;/li&gt;\n&lt;li&gt;Наконец, если на один инстанс приходится существенно больше обрабатываемых данных, чем размер block cache (в терминах uncompressed data size), то довольно очевидно, что использование кеша не даст большой пользы для последующих запросов по тем же данным, так как большую часть все равно придётся заново прочитать по сети.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"pro-hdd-vs-ssd\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/queries/anatomy.html#pro-hdd-vs-ssd\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Про HDD vs SSD&lt;/span&gt;&lt;/a&gt;Про HDD vs SSD&lt;/h3&gt;\n&lt;p&gt;Чтение с HDD медленнее, чем с SSD, однако не следует бросаться перекладывать свои данные на SSD, как только ваши запросы начинают тормозить. Есть вероятность, что ваши запросы упираются не в IO, а в CPU — например, все данные лежат готовые в block cache, но для ответа на запрос нужно обработать пару десятков гигабайт разжатых данных. В такой ситуации перекладывание таблиц с HDD на SSD не даст пользы.&lt;/p&gt;\n&lt;p&gt;Если вам кажется, что перекладывание ваших данных на SSD ускорит ваши запросы, то можете проследовать &lt;a href=\"user-guide/data-processing/chyt/faq-chyt.html#how-to-set-ssd\"&gt;плану действий&lt;/a&gt; из FAQ.&lt;/p&gt;\n&lt;h3 id=\"pro-pokolonochnyj-format-hraneniya\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/queries/anatomy.html#pro-pokolonochnyj-format-hraneniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Про поколоночный формат хранения&lt;/span&gt;&lt;/a&gt;Про поколоночный формат хранения&lt;/h3&gt;\n&lt;p&gt;В большинстве случаев при работе с ClickHouse вы захотите использовать поколоночный &lt;a href=\"user-guide/storage/chunks.html#optimize_for\"&gt;формат хранения&lt;/a&gt; таблиц, который достигается выставлением атрибута &lt;code&gt;/@optimize_for&lt;/code&gt; в значение &lt;code&gt;scan&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Преимущества поколоночного хранения заключаются в следующем: вы можете дёшево читать отдельные колонки таблиц без необходимости поднимать всю таблицу в память, а также экономить занимаемое на диске место, так как YTsaurus будет применять различные кодеки поколоночного хранения для оптимизации представления колонки.&lt;/p&gt;\n&lt;p&gt;Тем не менее, возможна ситуация, при которой понадобится построчный формат (&lt;code&gt;/@optimize_for = lookup&lt;/code&gt;). Недостатком поколоночного формата является высокое потребление памяти, особенно для таблиц с большим числом колонок, так как на каждую колонку требуется отдельный буфер. Помимо этого можно отметить, что чтение lookup-таблиц несколько дешевле по CPU.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/chyt/queries/anatomy.md","sourcePath":"ru/user-guide/data-processing/chyt/queries/anatomy.md"},"headings":[{"title":"Идентификаторы запроса: trace id, query id, datalens request id","href":"ru/user-guide/data-processing/chyt/queries/anatomy.html#id","level":2},{"title":"Путь запроса от клиента до тяжёлых прокси","href":"ru/user-guide/data-processing/chyt/queries/anatomy.html#way-to-proxy","level":2},{"title":"Исполнение запроса внутри клики","href":"ru/user-guide/data-processing/chyt/queries/anatomy.html#query_execution","level":2},{"title":"IO и компрессия в CHYT","href":"ru/user-guide/data-processing/chyt/queries/anatomy.html#io-i-kompressiya-v-chyt","level":2,"items":[{"title":"Про сеть","href":"ru/user-guide/data-processing/chyt/queries/anatomy.html#pro-set","level":3},{"title":"Про компрессию","href":"ru/user-guide/data-processing/chyt/queries/anatomy.html#pro-kompressiyu","level":3},{"title":"Про uncompressed block cache","href":"ru/user-guide/data-processing/chyt/queries/anatomy.html#pro-uncompressed-block-cache","level":3},{"title":"Про HDD vs SSD","href":"ru/user-guide/data-processing/chyt/queries/anatomy.html#pro-hdd-vs-ssd","level":3},{"title":"Про поколоночный формат хранения","href":"ru/user-guide/data-processing/chyt/queries/anatomy.html#pro-pokolonochnyj-format-hraneniya","level":3}]}],"title":"Анатомия запроса до и после движка ClickHouse"},"router":{"pathname":"ru/user-guide/data-processing/chyt/queries/anatomy","depth":6,"base":"../../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
