        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе собраны специфичные для CHYT функции.&lt;/p&gt;\n&lt;h2 id=\"yson_functions\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/functions.html#yson_functions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Функции для работы с YSON&lt;/span&gt;&lt;/a&gt;Функции для работы с YSON&lt;/h2&gt;\n&lt;h3 id=\"ypath_simple_types\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/functions.html#ypath_simple_types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YPathType (простые типы и массивы)&lt;/span&gt;&lt;/a&gt;YPathType (простые типы и массивы)&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;YPath&amp;lt;Type&amp;gt;[Strict](yson, ypath)&lt;/code&gt; — извлечь из строки &lt;code&gt;yson&lt;/code&gt; значение типа &lt;code&gt;Type&lt;/code&gt; по пути &lt;code&gt;ypath&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;Type&lt;/code&gt; может принимать одно из следующих значений: &lt;code&gt;Int64&lt;/code&gt;, &lt;code&gt;UInt64&lt;/code&gt;, &lt;code&gt;Boolean&lt;/code&gt;, &lt;code&gt;Double&lt;/code&gt;, &lt;code&gt;String&lt;/code&gt;, &lt;code&gt;ArrayInt64&lt;/code&gt;, &lt;code&gt;ArrayUInt64&lt;/code&gt;, &lt;code&gt;ArrayBoolean&lt;/code&gt;, &lt;code&gt;ArrayDouble&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Опциональный суффикс &lt;code&gt;Strict&lt;/code&gt; обозначает строгость функции.&lt;/p&gt;\n&lt;p&gt;Примеры называний функций: &lt;code&gt;YPathInt64&lt;/code&gt;, &lt;code&gt;YPathStringStrict&lt;/code&gt;, &lt;code&gt;YPathArrayDouble&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Принцип работы функций состоит в следующем:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Переданная строка &lt;code&gt;yson&lt;/code&gt; интерпретируется как YSON-документ;&lt;/li&gt;\n&lt;li&gt;Происходит адресация в этом документе по пути &lt;code&gt;ypath&lt;/code&gt; относительно корня документа;&lt;/li&gt;\n&lt;li&gt;Происходит интерпретация содержимого документа по пути &lt;code&gt;ypath&lt;/code&gt; к типу &lt;code&gt;Type&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;На каждом из этапов работы данной функции могут возникнуть ошибки:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Строка может не представлять собой YSON-документ (такое возможно при указании строковой константы в качестве аргумента функции, но не при чтении реальных Any-колонок из YTsaurus);&lt;/li&gt;\n&lt;li&gt;Данный путь может отсутствовать в документе;&lt;/li&gt;\n&lt;li&gt;Данный путь может соответствовать иному типу данных, отличному от &lt;code&gt;Type&lt;/code&gt; (например, вместо числового значения находится строковый литерал).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Отличие строгой версии функции (с суффиксом &lt;code&gt;Strict&lt;/code&gt;) от нестрогой версии заключается в режиме обработки данных ошибок: строгая версия аварийно завершит работу запроса, тогда как нестрогая версия вернет в качестве результата значение по умолчанию для соответствующего типа колонки (&lt;code&gt;Null&lt;/code&gt;, &lt;code&gt;0&lt;/code&gt;, пустую строку или пустой список) и продолжит работу.&lt;/p&gt;\n&lt;p&gt;Примеры использования (в качестве первого аргумента везде фигурирует строковый литерал, содержащий YSON, но на его месте может быть любая any-колонка таблицы):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathInt64(&lt;span class=\"hljs-string\"&gt;'{key1=42; key2=57; key3=29}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'/key2'&lt;/span&gt;);\n&lt;span class=\"hljs-number\"&gt;57&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathInt64(&lt;span class=\"hljs-string\"&gt;'[3;4;5]'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'/1'&lt;/span&gt;);\n&lt;span class=\"hljs-number\"&gt;4&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathString(&lt;span class=\"hljs-string\"&gt;'[\"aa\";\"bb\";\"cc\"]'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'/1'&lt;/span&gt;);\n\"bb\"\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathString(&lt;span class=\"hljs-string\"&gt;'{a=[{c=xyz}; {c=qwe}]}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'/a/1/c'&lt;/span&gt;);\n\"qwe\"\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathInt64(&lt;span class=\"hljs-string\"&gt;'{key=xyz}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'/key'&lt;/span&gt;);\n&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathInt64Strict(&lt;span class=\"hljs-string\"&gt;'{key=xyz}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'/key'&lt;/span&gt;);\nstd::exception. Code: &lt;span class=\"hljs-number\"&gt;1001&lt;/span&gt;, type: NYT::TErrorException, e.what() &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; Node &lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;key2 has invalid type: expected &lt;span class=\"hljs-keyword\"&gt;one&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;of&lt;/span&gt; {\"int64\", \"uint64\"}, actual \"string\"\n    code            &lt;span class=\"hljs-number\"&gt;500&lt;/span&gt;\n    origin          ...\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathString(&lt;span class=\"hljs-string\"&gt;'{key=3u}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'/nonexistentkey'&lt;/span&gt;);\n\"\"\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathArrayInt64(&lt;span class=\"hljs-string\"&gt;'[1;2;3]'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;''&lt;/span&gt;);\n[&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;]\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathUInt64(&lt;span class=\"hljs-string\"&gt;'42u'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;''&lt;/span&gt;);\n&lt;span class=\"hljs-number\"&gt;42&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"67\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-67\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-67\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-67.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Предположим, что в таблице есть две колонки &lt;code&gt;lhs&lt;/code&gt; и &lt;code&gt;rhs&lt;/code&gt;, представляющие собой &lt;code&gt;any&lt;/code&gt;-колонки, содержащие списки чисел одинаковой длины.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Таблица 1 — Пример таблицы с &lt;code&gt;any&lt;/code&gt; колонками&lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;lhs&lt;/th&gt;\n&lt;th&gt;rhs&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;[1, 2, 3]&lt;/td&gt;\n&lt;td&gt;[5, 6, 7]&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;[-1, 1]&lt;/td&gt;\n&lt;td&gt;[1, 3]&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;[]&lt;/td&gt;\n&lt;td&gt;[]&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Тогда можно построить скалярное произведение векторов &lt;code&gt;lhs&lt;/code&gt; и &lt;code&gt;rhs&lt;/code&gt; с помощью следующей конструкции:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; arraySum((x, y) &lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; x&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;y, YPathArrayInt64(lhs, &lt;span class=\"hljs-string\"&gt;''&lt;/span&gt;), YPathArrayInt64(rhs, &lt;span class=\"hljs-string\"&gt;''&lt;/span&gt;)) &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; \"//path/to/table\"\n&lt;span class=\"hljs-number\"&gt;38&lt;/span&gt;\n&lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;\n&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"115\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-115\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-115\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-115.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"ypath_complex_types\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/functions.html#ypath_complex_types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YPathExtract (сложные типы)&lt;/span&gt;&lt;/a&gt;YPathExtract (сложные типы)&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;YPathExtract[Strict](yson, ypath, type)&lt;/code&gt; — извлечь из строки &lt;code&gt;yson&lt;/code&gt; значение произвольного типа &lt;code&gt;type&lt;/code&gt; по пути &lt;code&gt;ypath&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Функция аналогична функциям &lt;code&gt;YPath&amp;lt;Type&amp;gt;&lt;/code&gt;, но позволяет задать произвольный тип возвращаемого значения с помощью дополнительного аргумента &lt;code&gt;type&lt;/code&gt;. Поддерживаются в том числе сложные составные типы, для которых нет аналога &lt;code&gt;YPath&amp;lt;Type&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;С помощью функции &lt;code&gt;YPathExtract&lt;/code&gt; можно извлекать и простые типы. Например, результат выполнения &lt;code&gt;YPathExtract(yson, ypath, 'Int64')&lt;/code&gt; будет эквивалентен результату &lt;code&gt;YPathInt64(yson, ypath)&lt;/code&gt;. Однако функции &lt;code&gt;YPath&amp;lt;Type&amp;gt;&lt;/code&gt; более специализированы и имеют более оптимальную реализацию, поэтому рекомендуется использовать функцию &lt;code&gt;YPathExtract&lt;/code&gt; только в случае, когда для извлекаемого типа нет специализированной функции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathExtract(&lt;span class=\"hljs-string\"&gt;'[[1;2];[2;3]]'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;''&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'Array(Array(Int64))'&lt;/span&gt;);\n[[&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;], [&lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;]]\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathExtract(&lt;span class=\"hljs-string\"&gt;'{a=1;b=\"abc\"}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;''&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'Tuple(a Int64, b String)'&lt;/span&gt;);\n(\"a\": &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;, \"b\": \"abc\")\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathExtract(&lt;span class=\"hljs-string\"&gt;'{x=[\"abc\";\"bbc\"]}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'/x'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'Array(String)'&lt;/span&gt;)\n[\"abc\", \"bbc\"]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"138\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-138\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-138\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-138.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"ypath_raw\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/functions.html#ypath_raw\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YPathRaw (необработанный yson)&lt;/span&gt;&lt;/a&gt;YPathRaw (необработанный yson)&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;YPathRaw[Strict](yson, ypath, [format])&lt;/code&gt; — извлечь из строки &lt;code&gt;yson&lt;/code&gt; по пути &lt;code&gt;ypath&lt;/code&gt; необработанное значение в формате yson.&lt;/p&gt;\n&lt;p&gt;Функция может быть применена, когда тип результируемого значения неизвестен, либо различается в разных строках одной колонки.&lt;/p&gt;\n&lt;p&gt;Опциональный параметр &lt;code&gt;format&lt;/code&gt; позволяет задать формат представления возвращаемого yson значения и может быть одним из следующих: &lt;code&gt;binary&lt;/code&gt; (по умолчанию), &lt;code&gt;text&lt;/code&gt;, &lt;code&gt;pretty&lt;/code&gt;, &lt;code&gt;unescaped_text&lt;/code&gt;, &lt;code&gt;unescaped_pretty&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Примеры:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathRaw(&lt;span class=\"hljs-string\"&gt;'{x={key=[1]}}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'/x'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'text'&lt;/span&gt;);\n&lt;span class=\"hljs-string\"&gt;'{\"key\"=[1;];}'&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathRaw(&lt;span class=\"hljs-string\"&gt;'{a=1}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'/b'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'text'&lt;/span&gt;);\n&lt;span class=\"hljs-keyword\"&gt;NULL&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"154\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-154\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-154\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-154.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"yson_extract\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/functions.html#yson_extract\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Семейство функций YSON*&lt;/span&gt;&lt;/a&gt;Семейство функций YSON*&lt;/h3&gt;\n&lt;p&gt;Для работы с форматом json в ClickHouse присутсвуют функции семейства &lt;code&gt;JSON*&lt;/code&gt;. Для более схожей работы с обычным ClickHouse, в CHYT поддержаны полные аналоги этих функций, работающие с форматом yson.&lt;/p&gt;\n&lt;p&gt;Значение аргументов функций и их возвращаемое значение можно посмотреть в &lt;a href=\"https://clickhouse.com/docs/ru/sql-reference/functions/json-functions\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;документации ClickHouse&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Поддержанные аналоги на данный момент:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;YSONHas&lt;/code&gt;, &lt;code&gt;YSONLength&lt;/code&gt;, &lt;code&gt;YSONKey&lt;/code&gt;, &lt;code&gt;YSONType&lt;/code&gt;, &lt;code&gt;YSONExtractInt&lt;/code&gt;, &lt;code&gt;YSONExtractUInt&lt;/code&gt;, &lt;code&gt;YSONExtractFloat&lt;/code&gt;, &lt;code&gt;YSONExtractBool&lt;/code&gt;, &lt;code&gt;YSONExtractString&lt;/code&gt;, &lt;code&gt;YSONExtract&lt;/code&gt;, &lt;code&gt;YSONExtractKeysAndValues&lt;/code&gt;, &lt;code&gt;YSONExtractRaw&lt;/code&gt;, &lt;code&gt;YSONExtractArrayRaw&lt;/code&gt;, &lt;code&gt;YSONExtractKeysAndValuesRaw&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В отличие от функций &lt;code&gt;YPath&lt;/code&gt;, в которых нумерация элементов в массиве начинается с 0, нумерация элементов в функциях &lt;code&gt;YSON*&lt;/code&gt; c единицы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данные функции реализованы общим с ClickHouse кодом и не являются оптимальными. Для ускорения вычислений на большом количестве данных рекомендуется воспользоваться более оптимальными функциями &lt;code&gt;YPath&amp;lt;Type&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-comment\"&gt;-- Эквивалентно YPathString('[\"aa\";\"bb\";\"cc\"]', '/0')&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;-- Обратите внимание, нумерация начинается с 1&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YSONExtractString(&lt;span class=\"hljs-string\"&gt;'[\"aa\";\"bb\";\"cc\"]'&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;);\n\"aa\"\n\n&lt;span class=\"hljs-comment\"&gt;-- Эквивалентно YPathString('{a=[{c=xyz}; {c=qwe}]}', '/a/1/c')&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YSONExtractString(&lt;span class=\"hljs-string\"&gt;'{a=[{c=xyz}; {c=qwe}]}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'a'&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'c'&lt;/span&gt;);\n\"qwe\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"193\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-193\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-193\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-193.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"formaty-predstavleniya-yson\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/functions.html#formaty-predstavleniya-yson\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Форматы представления YSON&lt;/span&gt;&lt;/a&gt;Форматы представления YSON&lt;/h3&gt;\n&lt;p&gt;Данные из колонок типа &lt;code&gt;any&lt;/code&gt; могут храниться в бинарном представлении &lt;code&gt;yson&lt;/code&gt;. Поскольку читать такие данные не всегда удобно, в CHYT имеется функция &lt;code&gt;ConvertYson&lt;/code&gt;, которая преобразует разные представления &lt;code&gt;yson&lt;/code&gt; между собой.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;ConvertYson(yson, format)&lt;/code&gt; — преобразовать строку с yson документом в указанный формат.&lt;/p&gt;\n&lt;p&gt;Всего существует пять возможных форматов представления:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;binary&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;text&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;pretty&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;unescaped_text&lt;/code&gt;*&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;unescaped_pretty&lt;/code&gt;*&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;* Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В системе YTsaurus предусмотрено 3 формата представления — &lt;code&gt;binary&lt;/code&gt;, &lt;code&gt;text&lt;/code&gt; и &lt;code&gt;pretty&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В форматах представления &lt;code&gt;text&lt;/code&gt; и &lt;code&gt;pretty&lt;/code&gt; в значениях строк экранируются все символы, выходящие за пределы ascii, в том числе кириллица и различные символы в кодировке utf-8. Чтобы результирующий yson, содержащий строки с символами кириллицы, был более человекочитаемым, в CHYT были добавлены два дополнительных формата - &lt;code&gt;unescaped_text&lt;/code&gt; и &lt;code&gt;unescaped_pretty&lt;/code&gt;. Эти форматы отличаются от &lt;code&gt;text&lt;/code&gt; и &lt;code&gt;pretty&lt;/code&gt; только тем, что в строковых значениях экранируются только служебные для формата yson символы. Остальные символы сохраняются в строках без изменений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Примеры:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; ConvertYson(&lt;span class=\"hljs-string\"&gt;'{x=1}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'text'&lt;/span&gt;);\n&lt;span class=\"hljs-string\"&gt;'{\"x\"=1;}'&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; ConvertYson(&lt;span class=\"hljs-string\"&gt;'{x=1}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'pretty'&lt;/span&gt;);\n&lt;span class=\"hljs-string\"&gt;'{\n    \"x\" = 1;\n}'&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; ConvertYson(&lt;span class=\"hljs-string\"&gt;'{x=1}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'binary'&lt;/span&gt;);\n&lt;span class=\"hljs-string\"&gt;'{\\u0001\\u0002x=\\u0002\\u0002;}'&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; ConvertYson(&lt;span class=\"hljs-string\"&gt;'{x=\"Пример\"}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'text'&lt;/span&gt;);\n&lt;span class=\"hljs-string\"&gt;'{\"x\"=\"\\xD0\\x9F\\xD1\\x80\\xD0\\xB8\\xD0\\xBC\\xD0\\xB5\\xD1\\x80\";}'&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; ConvertYson(&lt;span class=\"hljs-string\"&gt;'{x=\"Пример\"}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'unescaped_text'&lt;/span&gt;);\n&lt;span class=\"hljs-string\"&gt;'{\"x\"=\"Пример\";}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"249\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-249\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-249\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-249.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"primer-raboty-s-yson\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/functions.html#primer-raboty-s-yson\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример работы с YSON&lt;/span&gt;&lt;/a&gt;Пример работы с YSON&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; operation_id, task_id, YPathInt64(task_spec, &lt;span class=\"hljs-string\"&gt;'/gpu_limit'&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; gpu_limit, YPathInt64(task_spec, &lt;span class=\"hljs-string\"&gt;'/job_count'&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; job_count &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; (\n    &lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; tupleElement(tasks, &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; task_id, tupleElement(tasks, &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; task_spec, operation_id &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; (\n        &lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; operation_id, tasks &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; (\n            &lt;span class=\"hljs-keyword\"&gt;Select&lt;/span&gt; YSONExtractKeysAndValuesRaw(&lt;span class=\"hljs-built_in\"&gt;COALESCE&lt;/span&gt;(tasks, &lt;span class=\"hljs-string\"&gt;''&lt;/span&gt;)) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; tasks, operation_id &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; (\n                &lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YSONExtractRaw(spec, &lt;span class=\"hljs-string\"&gt;'tasks'&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; tasks, operation_id\n                &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;home&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;dev&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;chyt_examples&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;completed_ops`\n                &lt;span class=\"hljs-keyword\"&gt;WHERE&lt;/span&gt; YSONHas(spec, &lt;span class=\"hljs-string\"&gt;'tasks'&lt;/span&gt;)\n            )\n        )\n        &lt;span class=\"hljs-keyword\"&gt;ARRAY&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;JOIN&lt;/span&gt; tasks\n    )\n)\n&lt;span class=\"hljs-keyword\"&gt;ORDER&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; gpu_limit &lt;span class=\"hljs-keyword\"&gt;DESC&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"253\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-253\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-253\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-253.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"version_functions\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/functions.html#version_functions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Получение версии клики&lt;/span&gt;&lt;/a&gt;Получение версии клики&lt;/h2&gt;\n&lt;h4 id=\"chyt_version\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/functions.html#chyt_version\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Получение версии CHYT&lt;/span&gt;&lt;/a&gt;Получение версии CHYT&lt;/h4&gt;\n&lt;p&gt;&lt;code&gt;chytVersion()&lt;/code&gt; — получить строковое представление версии CHYT сервера.&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; chytVersion()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"266\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-266\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-266\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-266.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"yt_version\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/functions.html#yt_version\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Получение версии YTsaurus&lt;/span&gt;&lt;/a&gt;Получение версии YTsaurus&lt;/h4&gt;\n&lt;p&gt;&lt;code&gt;ytVersion()&lt;/code&gt; — получить строковое представление версии кода YTsaurus, используемого в текущей версии CHYT.&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; ytVersion()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"276\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-276\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-276\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-276.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"cypress\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/functions.html#cypress\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с кипарисом&lt;/span&gt;&lt;/a&gt;Работа с кипарисом&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Все функции для работы с кипарисом являются табличными в терминах ClickHouse. Это означает, что их возвращаемое значение может использоваться вместо таблицы, например, в секции &lt;code&gt;FROM&lt;/code&gt; запроса &lt;code&gt;SELECT&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"list_nodes\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/functions.html#list_nodes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ytListNodes&lt;/span&gt;&lt;/a&gt;ytListNodes&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;ytListNodes[L](dir_path, [from, [to]])&lt;/code&gt; — получить список всех узлов и их атрибутов в директории &lt;code&gt;dir_path&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Результат содержит по одной строке на каждый узел из директории &lt;code&gt;dir_path&lt;/code&gt;. Каждая строка содержит:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Две встроеных колонки &lt;code&gt;$key&lt;/code&gt; и &lt;code&gt;$path&lt;/code&gt;, хранящие имя и полный путь до узла (всегда начинается с &lt;code&gt;dir_path&lt;/code&gt;). Значение в данных колонках могут отличаться от атрибутов &lt;code&gt;key&lt;/code&gt; и &lt;code&gt;path&lt;/code&gt;, если узел является ссылкой (тип &lt;code&gt;link&lt;/code&gt;) на другой узел.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;3 колонки, соответствующие полям атрибута &lt;code&gt;resource_usage&lt;/code&gt;: &lt;code&gt;disk_space&lt;/code&gt;, &lt;code&gt;tablet_count&lt;/code&gt; и &lt;code&gt;master_memory&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Большое количество колонок, название которых соответствует названию атрибута узла: &lt;code&gt;key&lt;/code&gt;, &lt;code&gt;path&lt;/code&gt;, &lt;code&gt;account&lt;/code&gt;, &lt;code&gt;owner&lt;/code&gt;, &lt;code&gt;erasure_codec&lt;/code&gt;, &lt;code&gt;id&lt;/code&gt;, &lt;code&gt;acl&lt;/code&gt; и другие. Колонки включают практически все системные атрибуты.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Так как обычно пользователям не нужны все атрибуты узла, большинство колонок являются виртуальными в терминах ClickHouse. Это означает, что по умолчанию они не возвращаются через выражения &lt;code&gt;SELECT * FROM ytListNodes(...)&lt;/code&gt; и &lt;code&gt;DESCRIBE ytListNodes(...)&lt;/code&gt;, но могут быть запрошены явно:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; id, key_columns, &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytListNodes(...)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"324\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-324\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-324\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-324.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;По умолчанию функция &lt;code&gt;ytListNodes&lt;/code&gt; не раскрывает ссылки (узлы типа &lt;code&gt;link&lt;/code&gt;). Это означает, что для таких узлов в результате будут возвращены атрибуты самого узла ссылки, а не узла, на который она ссылается. Что бы изменить это поведение и раскрыть все ссылки, можно воспользоваться модификатором функции &lt;code&gt;L&lt;/code&gt; (&lt;code&gt;ytListNodesL&lt;/code&gt;). При этом если ссылка ведет в несуществующий узел, то она останется нераскрытой, поэтому в результате все равно могут присутсвовать строки с типом &lt;code&gt;link&lt;/code&gt;, соответствующие нераскрытым ссылкам.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Раскрытие каждой ссылки требует дополнительного запроса к мастер серверу, поэтому исполнение функции &lt;code&gt;ytListNodeL&lt;/code&gt; может быть дольше и ресурсозатратнее, чем &lt;code&gt;ytListNode&lt;/code&gt;. Использование &lt;code&gt;ytListNodeL&lt;/code&gt; для директорий с большим количеством ссылок крайне не рекомендуется.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;С помощью двух опциональных строковых аргументов &lt;code&gt;from&lt;/code&gt; и &lt;code&gt;to&lt;/code&gt; можно задать фильтрацию возвращаемых узлов по названию (колонке &lt;code&gt;$key&lt;/code&gt;). Сравнение лексикографическое.&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytListNodes(&lt;span class=\"hljs-string\"&gt;'//some/dir/path'&lt;/span&gt;);\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;sum&lt;/span&gt;(disk_space), &lt;span class=\"hljs-built_in\"&gt;sum&lt;/span&gt;(chunk_count) &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytListNodes(&lt;span class=\"hljs-string\"&gt;'//some/dir/path'&lt;/span&gt;);\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytListNodesL(&lt;span class=\"hljs-string\"&gt;'//some/dir/path'&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"346\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-346\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-346\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-346.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"list_tables\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/functions.html#list_tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ytListTables&lt;/span&gt;&lt;/a&gt;ytListTables&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;ytListTables[L](dir_path, [from, [to]])&lt;/code&gt; — получить список всех таблиц и их атрибутов в директории.&lt;/p&gt;\n&lt;p&gt;Аргументы функции и структура возвращаемого значения аналогичны функции &lt;code&gt;ytListNodes[L]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Рузультат функции эквивалентен результату вызова &lt;code&gt;ytListNodes[L]&lt;/code&gt; с последующей фильтрацией &lt;code&gt;WHERE type = 'table'&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Суффикс &lt;code&gt;L&lt;/code&gt; имеет аналогичное значение и расскрывает все ссылки перед фильтрацией. Таким образом, результат выполнения &lt;code&gt;ytListTables&lt;/code&gt; будет содержать только таблицы, непосредственно находящиеся в указанной директории, а результат выполнения &lt;code&gt;ytListTablesL&lt;/code&gt; будет дополнительно содержать таблицы, на которые указывают ссылки из указанной директории.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; path, chunk_count &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytListTables(&lt;span class=\"hljs-string\"&gt;'//dome/dir/path'&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"362\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-362\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-362\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-362.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"list_log_tables\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/functions.html#list_log_tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ytListLogTables&lt;/span&gt;&lt;/a&gt;ytListLogTables&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;ytListLogTables(project_name_or_path, [from_datetime, [to_datetime]])&lt;/code&gt; — получить непересекающийся по времени список таблиц с логами и их атрибуты из указанного проекта.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;project_name_or_path&lt;/code&gt; может содержать либо название проекта с логами (если проект лежит в директории &lt;code&gt;//logs&lt;/code&gt;), либо полный путь до директории с логами.&lt;/p&gt;\n&lt;p&gt;Функция рассмотрит таблицы с логами в четырех поддиректориях (&lt;code&gt;1h&lt;/code&gt;, &lt;code&gt;30m&lt;/code&gt;, &lt;code&gt;1d&lt;/code&gt; и &lt;code&gt;stream/5m&lt;/code&gt;), после чего объединит множества этих таблиц так, что бы интервалы времени таблиц не пересекались.&lt;/p&gt;\n&lt;p&gt;С помощью двух опциональных аргументов &lt;code&gt;from_datetime&lt;/code&gt; и &lt;code&gt;to_datetime&lt;/code&gt; можно задать интересующий временной интервал логов. Таблицы с логами, которые не пересекаются по времени с указанным интервалом, будут отфильтрованы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Фильтрация по временному интервалу происходит только на уровне таблиц. Таблицы с логами из результата работы функции могут покрывать больший временной интервал, чем указанный в аргументах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytListLogTables(&lt;span class=\"hljs-string\"&gt;'chyt-structured-http-proxy-log'&lt;/span&gt;, today() &lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;);\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytListLogTables(&lt;span class=\"hljs-string\"&gt;'//logs/chyt-structured-http-proxy-log'&lt;/span&gt;, today() &lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;5&lt;/span&gt;, today() &lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;4&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"391\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-391\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-391\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-391.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"node_attributes\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/functions.html#node_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ytNodeAttributes&lt;/span&gt;&lt;/a&gt;ytNodeAttributes&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;ytNodeAttributes(path1, [path2, [...]])&lt;/code&gt; — получить атрибуты всех узлов, указанных в аргументах.&lt;/p&gt;\n&lt;p&gt;Возвращаемое значение будет содержать по 1 строке с атрибутами на каждый указанный в аргументах путь. Если указан некоректный или несуществующий путь, будет сгенерирована ошибка.&lt;/p&gt;\n&lt;p&gt;Структура возвращаемого значения аналогична функции &lt;code&gt;ytListNodes&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytNodeAttributes(&lt;span class=\"hljs-string\"&gt;'//sys'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'//sys/clickhouse'&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"407\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-407\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-407\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-407.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"multiple_tables_read\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/functions.html#multiple_tables_read\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чтение множества таблиц&lt;/span&gt;&lt;/a&gt;Чтение множества таблиц&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Все функции для чтения множества таблиц являются табличными в терминах ClickHouse. Это означает, что их возвращаемое значение может использоваться вместо таблицы, например, в секции &lt;code&gt;FROM&lt;/code&gt; запроса &lt;code&gt;SELECT&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"yt_tables\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/functions.html#yt_tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ytTables&lt;/span&gt;&lt;/a&gt;ytTables&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;ytTables(arg1, [arg2, ...])&lt;/code&gt; — прочитать объединение множества таблиц, указанного в аргументах.&lt;/p&gt;\n&lt;p&gt;Каждый аргумент может быть одним из следующих:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Строка, представляющая собой путь до конкретной таблицы&lt;/li&gt;\n&lt;li&gt;Одна из функций &lt;code&gt;ytListNodes[L]&lt;/code&gt;, &lt;code&gt;ytListTables[L]&lt;/code&gt;, &lt;code&gt;ytListLogTables&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Подзапрос, возвращающий произвольное множество путей таблиц*&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;* Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Передача в качестве аргумента функции подзапроса, возвращающего несколько путей, не соответствует синтаксису ClickHouse. Данная конструкция работает в текущей версии CHYT/ClickHouse, но может перестать работать в будущих версиях. Более правильным способом передачи такого подзапроса является использование функции &lt;code&gt;view&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Также на данный момент известно о баге оптимизатора ClickHouse, который может некоретно переносить внешнее условие &lt;code&gt;WHERE&lt;/code&gt; внутрь такого подзапроса, в результате чего может возникать ошибка &lt;code&gt;Missing columns: '&amp;lt;column_name&amp;gt;' while processing query&lt;/code&gt;. Обойти данную ошибку можно с помощью настройки &lt;code&gt;enable_optimize_predicate_expression=0&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Функция возвращает объединение множества всех таблиц, заданных в аргументах. Работа функции аналогичная функции &lt;a href=\"https://clickhouse.com/docs/en/sql-reference/table-functions/merge\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;merge&lt;/a&gt; из ClickHouse, но она предоставляет более гибкую систему указания множества таблиц и оптимизирована для работы с таблицами YTsaurus.&lt;/p&gt;\n&lt;p&gt;Если таблицы из заданного множества таблиц имеют различные схемы, то будет выведена общая схема, с помощью которой можно прочитать все заданные таблицы.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Алгоритм вывода общей схемы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Совместимые типы&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Для каждой колонки выбирается \"наиболее общий тип\", к которому можно привести все типы.&lt;/li&gt;\n&lt;li&gt;Пример: для типов &lt;code&gt;optional&amp;lt;int32&amp;gt;&lt;/code&gt; и &lt;code&gt;int64&lt;/code&gt; \"наиболее общим типом\" будет &lt;code&gt;optional&amp;lt;i64&amp;gt;&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обратите внимание&lt;/strong&gt;, что ввиду особенностей хранения данных в YTsaurus, беззнаковые числовые типы являются несовместимыми со знаковыми (т.е. типы &lt;code&gt;int32&lt;/code&gt; и &lt;code&gt;uint32&lt;/code&gt; несовместимы).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Несовместимые типы&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Если типы колонки несовместимы в разных таблицах, то chyt будет действовать согласно опции &lt;code&gt;chyt.concat_tables.type_mismatch_mode&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Пример: типы &lt;code&gt;string&lt;/code&gt; и &lt;code&gt;int64&lt;/code&gt; несовместимы.&lt;/li&gt;\n&lt;li&gt;Возможные значения опции: &lt;code&gt;drop&lt;/code&gt;, &lt;code&gt;throw&lt;/code&gt;, &lt;code&gt;read_as_any&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;По умолчанию произойдет ошибка исполнения запроса (значение &lt;code&gt;throw&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;Колонки разных типов можно прочитать как yson-строки, указав значение опции &lt;code&gt;read_as_any&lt;/code&gt;. Это может быть неэффективно, поэтому рекомендуется структурировать свои таблицы правильно.&lt;/li&gt;\n&lt;li&gt;Если такие колонки не нужны для исполнения запроса, их можно отбросить, указав значение опции &lt;code&gt;drop&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Отсутствующая колонка&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Если колонка отсуствует в одной или в нескольких входных таблицах, то chyt будет действовать согласно опции &lt;code&gt;chyt.concat_tables.missing_column_mode&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Возможные значения: &lt;code&gt;drop&lt;/code&gt;, &lt;code&gt;throw&lt;/code&gt;, &lt;code&gt;read_as_null&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;По умолчанию колонка станет опциональной, а значения из таблиц, где колонка пропущена, будут прочитаны как &lt;code&gt;NULL&lt;/code&gt; (значение &lt;code&gt;read_as_null&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;Если отсутствие колонок в некоторых таблицах неожидаемо, в таком случае можно генерировать ошибку исполнения запроса, указав значение опции &lt;code&gt;throw&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Как и в случае с несовместимыми типами, такие колонки можно отбросить, указав значение опции &lt;code&gt;drop&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Обратите внимание&lt;/strong&gt;, опция &lt;code&gt;missing_column_mode&lt;/code&gt; влияет на поведение только в случае, если колонка пропущена в таблице со строгой схемой. Если колонка пропущена в нестрогой схеме, то она все равно может существовать в самих данных с любым типом. В этом случае делается пессимистичное предположение, что колонка присутствует с несовместимым типом, и дальнейшее поведение регулируется описанной ранее опцией &lt;code&gt;type_mismatch_mode&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Помимо основных колонок из самих таблиц в результате также всегда присутсвуют виртуальные колонки &lt;code&gt;$table_index&lt;/code&gt;, &lt;code&gt;$table_name&lt;/code&gt; и &lt;code&gt;$table_path&lt;/code&gt;. С помощью данных колонок можно определить, из какой именно таблицы была прочитана каждая строчка. Подробнее про виртуальные колонки можно прочитать в &lt;a href=\"user-guide/data-processing/chyt/yt-tables.html#virtual_columns\"&gt;соответствующем разделе&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-comment\"&gt;-- Прочитать объединение 2 таблиц:&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytTables(&lt;span class=\"hljs-string\"&gt;'//tmp/t1'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'//tmp/t2'&lt;/span&gt;)\n&lt;span class=\"hljs-comment\"&gt;-- Прочитать объединение всех таблиц из директории '//tmp/dir':&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytTables(ytListTables(&lt;span class=\"hljs-string\"&gt;'//tmp/dir'&lt;/span&gt;))\n&lt;span class=\"hljs-comment\"&gt;-- Прочитать объединение всех таблиц из директории и их названия:&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;, $table_name &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytTables(ytListTables(&lt;span class=\"hljs-string\"&gt;'//tmp/dir'&lt;/span&gt;))\n&lt;span class=\"hljs-comment\"&gt;-- Прочитать последнюю (лексикографически) таблицу:&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytTables((\n  &lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;max&lt;/span&gt;(path) &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytListTables(&lt;span class=\"hljs-string\"&gt;'/tmp/dir'&lt;/span&gt;)\n))\n&lt;span class=\"hljs-comment\"&gt;-- Прочитать таблицы с определенным суффиксом:&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytTables((\n  &lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; concat(path, &lt;span class=\"hljs-string\"&gt;'/suffix'&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytListNodes(&lt;span class=\"hljs-string\"&gt;'//tmp/dir'&lt;/span&gt;)\n))\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"576\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-576\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-576\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-576.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"concat_yt_tables\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/functions.html#concat_yt_tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;concatYtTables&lt;/span&gt;&lt;/a&gt;concatYtTables&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;concatYtTables(table1, [table2, [...]])&lt;/code&gt; — прочитать объединение нескольких YTsaurus таблиц.&lt;/p&gt;\n&lt;p&gt;Устаревший вариант функции &lt;code&gt;ytTables&lt;/code&gt;. В качестве аргументов могут выступать только пути таблиц.&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; concatYtTables(&lt;span class=\"hljs-string\"&gt;'//tmp/sample_table'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'//tmp/sample_table2'&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"589\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-589\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-589\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-589.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"concat_yt_tables_range\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/functions.html#concat_yt_tables_range\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;concatYtTablesRange&lt;/span&gt;&lt;/a&gt;concatYtTablesRange&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;concatYtTablesRange(cypress_path, [from, [to]])&lt;/code&gt; — прочитать объединение всех таблиц из директории &lt;code&gt;cypress_path&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Устаревшая функция, эквивалентная &lt;code&gt;ytTables(ytListTables(cypress_path, from, to))&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; concatYtTablesRange(\"//tmp/sample_tables\");\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; concatYtTablesRange(&lt;span class=\"hljs-string\"&gt;'//tmp/sample_tables'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'2019-01-01'&lt;/span&gt;);\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; concatYtTablesRange(&lt;span class=\"hljs-string\"&gt;'//tmp/sample_tables'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'2019-08-13T11:00:00'&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"602\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-602\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-602\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-602.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/chyt/reference/functions.md","sourcePath":"ru/user-guide/data-processing/chyt/reference/functions.md"},"headings":[{"title":"Функции для работы с YSON","href":"ru/user-guide/data-processing/chyt/reference/functions.html#yson_functions","level":2,"items":[{"title":"YPathType (простые типы и массивы)","href":"ru/user-guide/data-processing/chyt/reference/functions.html#ypath_simple_types","level":3},{"title":"YPathExtract (сложные типы)","href":"ru/user-guide/data-processing/chyt/reference/functions.html#ypath_complex_types","level":3},{"title":"YPathRaw (необработанный yson)","href":"ru/user-guide/data-processing/chyt/reference/functions.html#ypath_raw","level":3},{"title":"Семейство функций YSON*","href":"ru/user-guide/data-processing/chyt/reference/functions.html#yson_extract","level":3},{"title":"Форматы представления YSON","href":"ru/user-guide/data-processing/chyt/reference/functions.html#formaty-predstavleniya-yson","level":3},{"title":"Пример работы с YSON","href":"ru/user-guide/data-processing/chyt/reference/functions.html#primer-raboty-s-yson","level":3}]},{"title":"Получение версии клики","href":"ru/user-guide/data-processing/chyt/reference/functions.html#version_functions","level":2},{"title":"Работа с кипарисом","href":"ru/user-guide/data-processing/chyt/reference/functions.html#cypress","level":2,"items":[{"title":"ytListNodes","href":"ru/user-guide/data-processing/chyt/reference/functions.html#list_nodes","level":3},{"title":"ytListTables","href":"ru/user-guide/data-processing/chyt/reference/functions.html#list_tables","level":3},{"title":"ytListLogTables","href":"ru/user-guide/data-processing/chyt/reference/functions.html#list_log_tables","level":3},{"title":"ytNodeAttributes","href":"ru/user-guide/data-processing/chyt/reference/functions.html#node_attributes","level":3}]},{"title":"Чтение множества таблиц","href":"ru/user-guide/data-processing/chyt/reference/functions.html#multiple_tables_read","level":2,"items":[{"title":"ytTables","href":"ru/user-guide/data-processing/chyt/reference/functions.html#yt_tables","level":3},{"title":"concatYtTables","href":"ru/user-guide/data-processing/chyt/reference/functions.html#concat_yt_tables","level":3},{"title":"concatYtTablesRange","href":"ru/user-guide/data-processing/chyt/reference/functions.html#concat_yt_tables_range","level":3}]}],"title":"Функции"},"router":{"pathname":"ru/user-guide/data-processing/chyt/reference/functions","depth":6,"base":"../../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
