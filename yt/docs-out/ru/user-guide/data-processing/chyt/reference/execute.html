        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;С помощью данной команды можно исполнить произвольный запрос в клике. Смотрите также статью &lt;a href=\"user-guide/data-processing/chyt/try-chyt.html\"&gt;Как попробовать&lt;/a&gt;, в которой перечислены альтернативные способы задать запрос в клику CHYT.&lt;/p&gt;\n&lt;h2 id=\"cli\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/execute.html#cli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CLI&lt;/span&gt;&lt;/a&gt;CLI&lt;/h2&gt;\n&lt;p&gt;Команда &lt;code&gt;yt clickhouse execute&lt;/code&gt; имеет следующие параметры (в скобках указаны значения по умолчанию):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;query&lt;/code&gt; — запрос.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;--proxy&lt;/code&gt; — кластер, на котором будет запущена клика, например. Данную опцию также можно задать через переменную окружения &lt;code&gt;YT_PROXY&lt;/code&gt; (например, &lt;code&gt;export YT_PROXY=&amp;lt;cluster_name&amp;gt;&lt;/code&gt;).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;--alias&lt;/code&gt; — алиас, под которым будет доступна клика. Данную опцию также можно задать через переменную окружения &lt;code&gt;CHYT_ALIAS&lt;/code&gt; (&lt;code&gt;export CHYT_ALIAS=example&lt;/code&gt;).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;--format&lt;/code&gt; [TabSeparated] — &lt;a href=\"https://clickhouse.tech/docs/ru/interfaces/formats/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;формат ClickHouse&lt;/a&gt;, в котором следует выдать результат.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;--setting&lt;/code&gt; — позволяет передать произвольную настройку в запрос в формате &lt;code&gt;&amp;lt;key&amp;gt;=&amp;lt;value&amp;gt;&lt;/code&gt;, может быть указана несколько раз.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"python\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/execute.html#python\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Python API  &lt;/span&gt;&lt;/a&gt;Python API  &lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Для использования данной функции нужно &lt;strong&gt;обязательно&lt;/strong&gt; настроить логирование на уровне &lt;strong&gt;Debug&lt;/strong&gt;. Без debug logs ответить на какой-либо вопрос про исполнение запроса (включая \"почему бежит так долго\", \"почему упал\", \"почему выдал такие ответ\") невозможно.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В модуле &lt;code&gt;yt.clickhouse&lt;/code&gt; доступен следующий метод (часть параметров намеренно не упомянута, т.к. не предназначена для использования в обычной ситуации):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;execute&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;\n    query,\n    alias=&lt;span class=\"hljs-literal\"&gt;None&lt;/span&gt;,\n    &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=&lt;span class=\"hljs-literal\"&gt;None&lt;/span&gt;,\n    settings=&lt;span class=\"hljs-literal\"&gt;None&lt;/span&gt;,\n    raw=&lt;span class=\"hljs-literal\"&gt;None&lt;/span&gt;,\n    client=&lt;span class=\"hljs-literal\"&gt;None&lt;/span&gt;&lt;/span&gt;):\n    &lt;span class=\"hljs-keyword\"&gt;pass&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"52\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-52\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-52\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-52.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Часть параметров пересекается с опциями командной строки, для них верно всё то же, что сказано в предыдущем разделе. Функция возвращает генератор строк из результата, причём в качестве строк могут выступать как python-объекты (списки, словари, числа, строки), так и строки в заказанном формате.&lt;/p&gt;\n&lt;p&gt;Опишем отдельные параметры и отличия от запуска через CLI:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;format&lt;/code&gt; (None) и &lt;code&gt;raw&lt;/code&gt; (False) — эти опции контролируют тип возвращаемых значений. Если &lt;code&gt;raw = False&lt;/code&gt;, то функция будет самостоятельно превращать значения в python-объекты аналогично тому, как это делает метод YTsaurus Python API read_table. Если же &lt;code&gt;raw = True&lt;/code&gt;, то нужно дополнительно указать формат ClickHouse, тогда возвращаемым значением будет итератор по строкам (str) в заказанном формате.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;settings&lt;/code&gt; ({}) — словарь с дополнительными &lt;a href=\"https://clickhouse.tech/docs/ru/operations/settings/settings/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;настройками&lt;/a&gt; ClickHouse для запроса.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;client&lt;/code&gt; — клиент от YTsaurus кластера, в котором следует запустить запрос к клике. По умолчанию берётся глобальный клиент; можно, например, передать качестве клиента &lt;code&gt;yt.wrapper.YtClient(\"&amp;lt;cluster_name&amp;gt;\")&lt;/code&gt; и указать, таким образом, нужный кластер. Подробнее можно прочитать в соответствующем разделе документации Python API.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/chyt/reference/execute.md","sourcePath":"ru/user-guide/data-processing/chyt/reference/execute.md"},"headings":[{"title":"CLI","href":"ru/user-guide/data-processing/chyt/reference/execute.html#cli","level":2},{"title":"Python API  ","href":"ru/user-guide/data-processing/chyt/reference/execute.html#python","level":2}],"title":"Выполнение запросов"},"router":{"pathname":"ru/user-guide/data-processing/chyt/reference/execute","depth":6,"base":"../../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
