            {"data":{"leading":false,"html":"&lt;p&gt;В этой статье дается обоснование выбранной модели предоставления ClickHouse внутри экосистемы YTsaurus. В частности, почему в CHYT есть какие-то &lt;em&gt;клики&lt;/em&gt;, тогда как в обычном ClickHouse ничего похожего нет.&lt;/p&gt;\n&lt;h2 id=\"what-is\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/general.html#what-is\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что такое клика?&lt;/span&gt;&lt;/a&gt;Что такое клика?&lt;/h2&gt;\n&lt;p&gt;&lt;em&gt;Клика&lt;/em&gt; представляет из себя полноценный кластер ClickHouse, в который встроена возможность читать данные из таблиц, находящихся в YTsaurus, посредством нативного внутреннего протокола YTsaurus.&lt;/p&gt;\n&lt;p&gt;С точки зрения &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;планировщика YTsaurus&lt;/a&gt; клика — это Vanilla-операция, содержащая в типичном случае до десятков джобов, каждый из которых потребляет по умолчанию до 16 ядер CPU. Название &lt;em&gt;клика&lt;/em&gt; было выбрано в качестве игры слов по созвучию с названием ClickHouse, но при этом правильное написание по-английски — &lt;em&gt;Clique&lt;/em&gt;.&lt;/p&gt;\n&lt;h2 id=\"administration\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/general.html#administration\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Администрирование клики&lt;/span&gt;&lt;/a&gt;Администрирование клики&lt;/h2&gt;\n&lt;p&gt;Администрирование клики осуществляется &lt;em&gt;пользователями&lt;/em&gt;, а не администраторами YTsaurus. В частности, любой пользователь YTsaurus может в любой момент запустить свою собственную клику (или даже несколько клик). Подробнее см. в разделе &lt;a href=\"user-guide/data-processing/chyt/cliques/start.html\"&gt;Как запустить приватную клику&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"isolation\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/general.html#isolation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Надёжная изоляция&lt;/span&gt;&lt;/a&gt;Надёжная изоляция&lt;/h2&gt;\n&lt;p&gt;Благодаря такому представлению решается задача &lt;em&gt;изоляции&lt;/em&gt; нагрузки от различных пользователей. На OLAP-базы данных типа ClickHouse может приходиться нагрузка принципиально разного устройства. Можно отметить продакшн-процессы типа ETL, создающие постоянный фон нагрузки из-под роботных пользователей. Помимо этого бывают разовые ad-hoc запросы от пользователей-людей через инструменты типа YQL, а также разовые или регулярные выгрузки датасетов во внешние BI-системы, такие так &lt;a href=\"https://cloud.yandex.ru/docs/datalens/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;DataLens&lt;/a&gt; или &lt;a href=\"https://www.tableau.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Tableau&lt;/a&gt; для дальнейшей визуализации.&lt;/p&gt;\n&lt;p&gt;Если на базу данных приходится много одновременно заданных \"тяжелых\" запросов, это может перегрузить кластер множеством различных способов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;На вычислительных узлах могут закончиться ресурсы CPU, вследствие чего все запросы (включая быстрые в нормальных обстоятельствах) начнут получать меньше CPU time и произвольным образом деградируют.&lt;/li&gt;\n&lt;li&gt;Как следствие предыдущего может деградировать подсистема IO или сетевой стек (например, TCP или DNS-подсистема), которым тоже нужен CPU time для функционирования.&lt;/li&gt;\n&lt;li&gt;Вычислительные узлы могут упереться в сетевую полосу и стать &lt;a href=\"https://en.wikipedia.org/wiki/I/O_bound\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;IO-bound&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Наконец, обработка существенных объемов данных может потреблять очень много оперативной памяти — как непосредственно для проведения расчётов, требующих поддержания больших промежуточных состояний (таких, как тяжелые &lt;code&gt;GROUP BY&lt;/code&gt;, сортировки или &lt;code&gt;COUNT DISTINCT&lt;/code&gt;), так и элементарно для чтения данных по сети под буфера.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Несмотря на то, что в ClickHouse встроены отдельные защитные механизмы для решения описанных выше проблем, в реалиях YTsaurus они спасают далеко не всегда. Ключевое свойство YTsaurus как источника данных для ClickHouse — любая хоть сколько-то большая таблица является \"очень сильно распределенной\". Грубо говоря, можно считать, что каждый следующий ГБ данных в таблице будет жить на новом хосте. Помимо этого  &lt;a href=\"user-guide/storage/static-tables.html\"&gt;статические таблицы YTsaurus&lt;/a&gt;, а особенно те, которые хранят аналитические данные, зачастую могут быть сжаты тяжелым кодеком компрессии (смотрите &lt;a href=\"user-guide/storage/compression.html\"&gt;Сжатие&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;Эти обстоятельства приводят к тому, что обработка даже \"сравнительно легкой\" таблицы в десяток ГБ с извлечением только нескольких узких колонок суммарным весом в сотни МБ оказывается сильно завязана на сетевой стек и на подсистему декомпрессии данных, а также довольно сильно требовательна к RAM для буферов чтения по сети с каждой машины.&lt;/p&gt;\n&lt;p&gt;Не желая решать сложную задачу менеджмента ресурсов CPU, RAM, полосы сетевого и дискового IO внутри ClickHouse, было принято решение разделять пользователей физически по разным процессам, что как раз достигается заведением необходимого количества независимых друг от друга клик, использующихся небольшими группами пользователей. Ожидается, что клики будут достаточно мелкогранулярными, чтобы не обслуживать разные виды нагрузки либо большое количество пользователей одновременно.&lt;/p&gt;\n&lt;p&gt;Единственное исключение из данного правила — &lt;a href=\"user-guide/data-processing/chyt/try-chyt.html#public\"&gt;публичные клики&lt;/a&gt;, которые намеренно открыты для всех, но предоставляются по принципу best effort — они могут быть в произвольный момент недоступны либо перегружены, хотя за их работоспособностью ведется наблюдение. Есть ограничения на сложность исполняемых запросов, местами довольно жесткие. Следует воспринимать публичные клики как демо-версию CHYT.&lt;/p&gt;\n&lt;h2 id=\"as-a-service\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/general.html#as-a-service\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CHYT as a service: переиспользование ресурсов в YTsaurus и эксплуатация силами пользователей&lt;/span&gt;&lt;/a&gt;CHYT as a service: переиспользование ресурсов в YTsaurus и эксплуатация силами пользователей&lt;/h2&gt;\n&lt;p&gt;Подобная система разделения ресурсов по разным кликам в рамках одного большого кластера YTsaurus напоминает \"облачный\" хостинг ClickHouse, похожий на &lt;a href=\"https://cloud.yandex.ru/services/managed-clickhouse\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Managed ClickHouse&lt;/a&gt; в облачном провайдере. Единственное отличие — пользователи платят не рублями во внешнем облаке, а вычислительной квотой в YTsaurus. Для многих аналитических и разработческих команд это приводит к возможности гибко распоряжаться уже существующими вычислительными ресурсами в YTsaurus. Часть из них можно использовать в \"классических\" вычислительных пайплайнах на минуты/часы/дни с Map-Reduce, например, посредством YQL over YTsaurus. А на другую небольшую часть — поднять клику подходящего размера для быстрых ad-hoc вычислений с задержками в секунды.&lt;/p&gt;\n&lt;p&gt;Помимо этого, как и всегда с облачным технологиями, предоставление чего-либо по модели \"as a service\" позволяет четко обозначить границу ответственности за эксплуатацию тех или иных технических решений.&lt;/p&gt;\n&lt;p&gt;Наибольшие успехи в эксплуатации любой базы данных достигаются при одновременном выполнении двух условий:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Пользователь хорошо понимает устройство базы данных и в состоянии оценить узкие места будущего вычислительного пайплайна с ее использованием.&lt;/li&gt;\n&lt;li&gt;Пользователь хорошо знает специфику хранящихся данных, а также необходимых вычислений над ними, а также знает, откуда эти данные возникают в базе данных, и отвечает за их конкретное представление и форму хранения.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ожидается, что с помощью документации пользователи смогут решать большую часть эксплуатационных проблем, в том числе проводить диагностику медленных запросов и грамотно оценивать потребность в ресурсах.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/chyt/general.md","sourcePath":"ru/user-guide/data-processing/chyt/general.md"},"headings":[{"title":"Что такое клика?","href":"ru/user-guide/data-processing/chyt/general.html#what-is","level":2},{"title":"Администрирование клики","href":"ru/user-guide/data-processing/chyt/general.html#administration","level":2},{"title":"Надёжная изоляция","href":"ru/user-guide/data-processing/chyt/general.html#isolation","level":2},{"title":"CHYT as a service: переиспользование ресурсов в YTsaurus и эксплуатация силами пользователей","href":"ru/user-guide/data-processing/chyt/general.html#as-a-service","level":2}],"title":"Введение"},"router":{"pathname":"ru/user-guide/data-processing/chyt/general","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
