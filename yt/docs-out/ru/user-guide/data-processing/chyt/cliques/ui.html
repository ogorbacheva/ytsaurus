        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;У клики нет отдельного веб-интерфейса, но все связанные с кликой объекты можно просмотреть через веб-интерфейс YTsaurus.&lt;/p&gt;\n&lt;h2 id=\"strawberry-node\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/ui.html#strawberry-node\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Strawberry Node&lt;/span&gt;&lt;/a&gt;Strawberry Node&lt;/h2&gt;\n&lt;p&gt;Конфигурация и персистентное состояние клики хранится в Кипарисе по пути &lt;code&gt;//sys/strawberry/chyt/&amp;lt;alias&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В описании узла можно увидеть служебную информацию: запущена ли клика, в каком пуле, какой статус соответствующей операции YTsaurus и так далее. В данном узле так же находится YSON-документ (спеклет), внутри которого хранятся все настройки клики, выставленные через команду &lt;code&gt;yt clickhouse ctl set-option&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Информацию из strawberry node можно так же получить с помощью команд &lt;code&gt;yt clickhouse ctl get-speclet&lt;/code&gt; и &lt;code&gt;yt clickhouse ctl status&lt;/code&gt; в нашем CLI.&lt;/p&gt;\n\n&lt;h2 id=\"access-control-object-node\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/ui.html#access-control-object-node\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Access Control Object Node&lt;/span&gt;&lt;/a&gt;Access Control Object Node&lt;/h2&gt;\n&lt;p&gt;ACL клики хранится в специализированном узле Access Control Object, находящемся по пути &lt;code&gt;//sys/access_control_object_namespaces/chyt/&amp;lt;alias&amp;gt;&lt;/code&gt;. В данном узле можно просмотреть все выданные доступы к клике.&lt;/p&gt;\n\n&lt;h2 id=\"yt-operation\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/ui.html#yt-operation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YT Operation&lt;/span&gt;&lt;/a&gt;YT Operation&lt;/h2&gt;\n&lt;p&gt;В веб интерфейс служебной YTsaurus операции, в которой запускаются инстансы клики, можно попасть по ссылке из описания strawberry node, либо по ссылке из результата команды &lt;code&gt;yt clickhouse ctl status&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;На странице операции есть много полезной информации, помогающей в эксплуатации CHYT.&lt;/p&gt;\n&lt;h3 id=\"description\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/ui.html#description\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Description&lt;/span&gt;&lt;/a&gt;Description&lt;/h3&gt;\n&lt;p&gt;В секции &lt;strong&gt;Description&lt;/strong&gt; содержится разная системная информации про клику и ряд ссылок.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;ytserver-log-tailer&lt;/code&gt;, &lt;code&gt;ytserver-clickhouse&lt;/code&gt;, &lt;code&gt;clickhouse-trampoline&lt;/code&gt; — в этих секциях описан версии различных компонентов серверного кода CHYT;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"specification\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/ui.html#specification\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Specification&lt;/span&gt;&lt;/a&gt;Specification&lt;/h3&gt;\n&lt;p&gt;В секции &lt;strong&gt;Specification&lt;/strong&gt; содержится информация о том, как именно клика была запущена.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/chyt_operation_specification.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Wrapper version&lt;/strong&gt; — содержит версию лончера, запустившего клику;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Command&lt;/strong&gt; — содержит строку запуска клики.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Последние два значения очень полезны, если нужно, например, перезапустить более свежую версию клики. Можно либо обратиться к пользователю, ее запустившему, либо самостоятельно воспроизвести команду запуска.&lt;/p&gt;\n&lt;h3 id=\"jobs\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/ui.html#jobs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jobs&lt;/span&gt;&lt;/a&gt;Jobs&lt;/h3&gt;\n&lt;p&gt;В секции &lt;strong&gt;Jobs&lt;/strong&gt; есть информация о джобах операции, в которой запущена клика. Напомним, что один джоб соответствует одному инстансу в клике, то есть одному серверу ClickHouse.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/chyt_operation_jobs.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;p&gt;В этой секции в терминах инстансов CHYT:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;total&lt;/code&gt; — общее количество инстансов в клике;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;pending&lt;/code&gt; — число инстансов из общего количества, которые еще не запущены. Ненулевое число в этой секции означает, что у клики не хватает ресурсов, чтобы единомоментно держать все инстансы запущенными, это плохая ситуация для клики;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;running&lt;/code&gt; — число запущенных инстансов из общего количества, т.е. &lt;code&gt;running + pending = total&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;completed&lt;/code&gt; — число &lt;em&gt;gracefully preempted&lt;/em&gt; инстансов. Сюда относятся те инстансы, которые попали под вытеснение и успели завершить все бегущие на них запросы до того момента, как их принудительно поабортило;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;failed&lt;/code&gt; — число упавших инстансов. Инстансы могут падать по разным причинам, наиболее частые: OOM (out of memory) либо баги в коде CHYT или ClickHouse;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;aborted&lt;/code&gt; — число прерванных инстансов. Часть остановок приходится на непреодолимые обстоятельства (например, нода вышла из строя) и с ними ничего не поделать, наличие среди джобов поаборченных по причине &lt;code&gt;preemption&lt;/code&gt; – это плохой знак, демонстрирующий нехватку ресурсов;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;lost&lt;/code&gt; — джобы в клике возникать не должны.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/chyt/cliques/ui.md","sourcePath":"ru/user-guide/data-processing/chyt/cliques/ui.md"},"headings":[{"title":"Strawberry Node","href":"ru/user-guide/data-processing/chyt/cliques/ui.html#strawberry-node","level":2},{"title":"Access Control Object Node","href":"ru/user-guide/data-processing/chyt/cliques/ui.html#access-control-object-node","level":2},{"title":"YT Operation","href":"ru/user-guide/data-processing/chyt/cliques/ui.html#yt-operation","level":2,"items":[{"title":"Description","href":"ru/user-guide/data-processing/chyt/cliques/ui.html#description","level":3},{"title":"Specification","href":"ru/user-guide/data-processing/chyt/cliques/ui.html#specification","level":3},{"title":"Jobs","href":"ru/user-guide/data-processing/chyt/cliques/ui.html#jobs","level":3}]}],"title":"Клика в веб-интерфейсе YTsaurus"},"router":{"pathname":"ru/user-guide/data-processing/chyt/cliques/ui","depth":6,"base":"../../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
