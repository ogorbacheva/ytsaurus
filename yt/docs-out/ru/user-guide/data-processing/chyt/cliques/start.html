        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;em&gt;Приватная клика&lt;/em&gt; — это клика, доступ к которой имеют только определённые пользователи или подразделения.&lt;/p&gt;\n&lt;h2 id=\"conditions\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/start.html#conditions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Условия запуска&lt;/span&gt;&lt;/a&gt;Условия запуска&lt;/h2&gt;\n&lt;p&gt;Для запуска приватной клики понадобится выделенный вычислительный пул с гарантиями (&lt;code&gt;strong_guarantee_resources&lt;/code&gt;) по CPU. Если его нет, следует:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;узнать у администратора кластера, можно ли найти &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;вычислительный пул&lt;/a&gt; с недоизрасходованными ресурсами;&lt;/li&gt;\n&lt;li&gt;сделать заказ новых ресурсов на будущее;&lt;/li&gt;\n&lt;li&gt;запустить клику без гарантий (не рекомендуется).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"how-start\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/start.html#how-start\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Порядок запуска&lt;/span&gt;&lt;/a&gt;Порядок запуска&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Установить &lt;a href=\"user-guide/data-processing/chyt/cli-and-api.html\"&gt;CHYT CLI&lt;/a&gt; в составе пакета &lt;code&gt;ytsaurus-client&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Запустить клику. Ниже приведён пример клики из пяти инстансов с настройками по умолчанию (16 ядер на инстанс) в пуле &lt;code&gt;chyt&lt;/code&gt; с названием &lt;code&gt;chyt_example_clique&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Заказ CPU квоты&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Для поднятия клики с &lt;code&gt;N&lt;/code&gt; инстансами на кластере &lt;code&gt;&amp;lt;cluster_name&amp;gt;&lt;/code&gt; необходимо:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;cluster_name&amp;gt; &amp;lt;pool_tree_name&amp;gt; &amp;lt;running_operations&amp;gt; &lt;/code&gt; — &lt;code&gt;1&lt;/code&gt; (клика – это одна YTsaurus операция, которая запущена всегда);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;cluster_name&amp;gt; &amp;lt;pool_tree_name&amp;gt; &amp;lt;total_operations&amp;gt;&lt;/code&gt; — &lt;code&gt;1&lt;/code&gt; (должен быть больше либо равен лимиту на количество выполняющихся операций);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;cluster_name&amp;gt; &amp;lt;pool_tree_name&amp;gt; &amp;lt;CPU strong guarantee&amp;gt;&lt;/code&gt; — &lt;code&gt;N * 16&lt;/code&gt; (по умолчанию в 1 инстансе 16 ядер CPU).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы не указывать в каждой команде кластер YTsaurus через аргумент &lt;code&gt;--proxy&lt;/code&gt;, первым шагом установите значение по умолчанию через переменную окружения:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_PROXY=&amp;lt;cluster_name&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"71\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-71\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-71\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-71.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Далее необходимо создать клику, используя команду из &lt;a href=\"user-guide/data-processing/chyt/cliques/controller.html\"&gt;CHYT Controller CLI&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt clickhouse ctl create chyt_example_clique\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"75\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-75\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-75\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-75.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;После создания клики необходимо её настроить, задать все необходимые опции. Для всех клик есть одна обязательная опция &lt;code&gt;pool&lt;/code&gt;, в которой должно быть передано название вычислительного пула, где будет запускаться операция с инстансами для клики. Так как операции для клики запускаются из-под системного робота &lt;code&gt;robot-strawberry-controller&lt;/code&gt;, предварительно необходимо выдать право &lt;code&gt;Use&lt;/code&gt; на указываемый пул этому роботу.&lt;/p&gt;\n&lt;p&gt;При установке опции &lt;code&gt;pool&lt;/code&gt; убедитесь, что у вас есть право &lt;code&gt;Use&lt;/code&gt; на указываемый пул (иначе команда завершится ошибкой):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt clickhouse ctl set-option pool chyt_example_pool --&lt;span class=\"hljs-built_in\"&gt;alias&lt;/span&gt; chyt_example_clique\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"82\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-82\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-82\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-82.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Установите нужное количество инстансов с помощью опции &lt;code&gt;instance_count&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt clickhouse ctl set-option instance_count 2 --&lt;span class=\"hljs-built_in\"&gt;alias&lt;/span&gt; chyt_example_clique\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"86\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-86\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-86\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-86.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Теперь клика настроена и все настройки сохранены в Кипарисе. Осталось запустить сконфигурированную клику:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt clickhouse ctl start chyt_example_clique\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"90\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-90\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-90\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-90.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Посмотреть статус клики можно с помощью команды &lt;code&gt;status&lt;/code&gt;. Когда операция клики будет запущена, значение поля &lt;code&gt;status&lt;/code&gt; должно стать &lt;code&gt;Ok&lt;/code&gt;, а &lt;code&gt;operation_state&lt;/code&gt; перейдёт в &lt;code&gt;running&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt clickhouse ctl status chyt_example_clique\n{\n    &lt;span class=\"hljs-string\"&gt;\"status\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"Waiting for restart: oplet does not have running yt operation\"&lt;/span&gt;;\n}\n&lt;span class=\"hljs-comment\"&gt;# a few moments later&lt;/span&gt;\n$ yt clickhouse ctl status chyt_example_clique\n{\n    &lt;span class=\"hljs-string\"&gt;\"status\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"Ok\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"operation_state\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"running\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"operation_url\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"https://domain.com/&amp;lt;cluster_name&amp;gt;/operations/48bdec5d-ed641014-3fe03e8-4289d62e\"&lt;/span&gt;;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"94\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-94\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-94\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-94.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;После запуска операции нужно немного подождать, чтобы инстансы клики успели запуститься и начали принимать входящие запросы. Чтобы убедиться, что клика работает, сделайте в ней тестовый запрос к таблице &lt;code&gt;//sys/clickhouse/sample_table&lt;/code&gt; — эта таблица доступна на всех кластерах, на которых есть CHYT:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt clickhouse execute --proxy &amp;lt;cluster_name&amp;gt; --&lt;span class=\"hljs-built_in\"&gt;alias&lt;/span&gt; chyt_example_clique &lt;span class=\"hljs-string\"&gt;'select avg(a) from `//sys/clickhouse/sample_table`'&lt;/span&gt;\n224.30769230769232\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"98\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-98\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-98\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-98.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если клика остаётся недоступной более 10 минут, попытайтесь понять, что с кликой не так, перейдя по ссылке &lt;code&gt;operation_url&lt;/code&gt; из команды &lt;code&gt;status&lt;/code&gt; в веб-интерфейсе операции. Если самостоятельно разобраться не удалось, обратитесь за помощью в &lt;a href=\"https://t.me/ytsaurus_ru\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;чат YTsaurus&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/chyt/cliques/start.md","sourcePath":"ru/user-guide/data-processing/chyt/cliques/start.md"},"headings":[{"title":"Условия запуска","href":"ru/user-guide/data-processing/chyt/cliques/start.html#conditions","level":2},{"title":"Порядок запуска","href":"ru/user-guide/data-processing/chyt/cliques/start.html#how-start","level":2}],"title":"Как запустить приватную клику"},"router":{"pathname":"ru/user-guide/data-processing/chyt/cliques/start","depth":6,"base":"../../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
