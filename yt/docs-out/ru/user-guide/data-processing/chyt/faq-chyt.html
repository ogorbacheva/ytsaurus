        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h4 id=\"chyt-cliques-explanation\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/faq-chyt.html#chyt-cliques-explanation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Почему в CHYT есть клики, тогда как в обычном ClickHouse ничего похожего нет? Что такое клика?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Почему в CHYT есть клики, тогда как в обычном ClickHouse ничего похожего нет? Что такое клика?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Про это есть отдельная &lt;a href=\"ru/user-guide/user-guide/data-processing/chyt/general.html\"&gt;статья&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"connection-refused-error\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/faq-chyt.html#connection-refused-error\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Получаю одну из ошибок «DB::NetException: Connection refused», «DB::Exception: Attempt to read after eof: while receiving packet from». Что это значит?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Получаю одну из ошибок «DB::NetException: Connection refused», «DB::Exception: Attempt to read after eof: while receiving packet from». Что это значит?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Типично такое означает, что процесс CHYT внутри операции Vanilla аварийно завершился. Можно посмотреть в UI операции на &lt;a href=\"ru/user-guide/user-guide/data-processing/chyt/cliques/ui.html\"&gt;счётчики&lt;/a&gt; числа aborted/failed джобов. Если есть недавние aborted-джобы по причине preemption, это значит, что клике не хватает ресурсов. Если есть недавние failed джобы, обратитесь к администратору системы.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"subquery-data-weight-limit\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/faq-chyt.html#subquery-data-weight-limit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Получаю ошибку «Subquery exceeds data weight limit: XXX &amp;gt; YYY». Что это значит?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Получаю ошибку «Subquery exceeds data weight limit: XXX &amp;gt; YYY». Что это значит?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; смотрите опцию &lt;code&gt;max_data_weight_per_subquery&lt;/code&gt; в документации по &lt;a href=\"ru/user-guide/user-guide/data-processing/chyt/reference/configuration.html#yt\"&gt;конфигурации&lt;/a&gt; клики.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"save-to-table\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/faq-chyt.html#save-to-table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как сохранять в таблицу?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как сохранять в таблицу?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Есть функции &lt;strong&gt;INSERT INTO&lt;/strong&gt; и &lt;strong&gt;CREATE TABLE&lt;/strong&gt;, Подробнее можно прочитать в разделе &lt;a href=\"ru/user-guide/user-guide/data-processing/chyt/yt-tables.html#save\"&gt;Отличие от ClickHouse.&lt;/a&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"load-geodictionaries-chyt\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/faq-chyt.html#load-geodictionaries-chyt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как загрузить геословари в собственной клике?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как загрузить геословари в собственной клике?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; При старте любой клики можно указать опцию &lt;code&gt;--cypress-geodata-path&lt;/code&gt;, которая позволяет указать путь к геословарям в Кипарисе. Подробнее про эту опцию можно прочитать в статье &lt;a href=\"ru/user-guide/user-guide/data-processing/chyt/try-chyt.html\"&gt;Как попробовать&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"chyt-tzdatetime-handling\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/faq-chyt.html#chyt-tzdatetime-handling\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: CHYT умеет обрабатывать даты в формате TzDatetime?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: CHYT умеет обрабатывать даты в формате TzDatetime?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; CHYT умеет обрабатывать даты в формате TzDatetime ровно в той же мере, в какой обычный ClickHouse. Хранить данные придётся в виде строк или чисел и конвертировать при чтении-записи. Пример извлечения даты:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;toDate(reinterpretAsInt64(reverse(unhex(&lt;span class=\"hljs-built_in\"&gt;substring&lt;/span&gt;(hex(payment_dt), &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;8&lt;/span&gt;)))))\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"41\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-41\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-41\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-41.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"how-to-set-ssd\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/faq-chyt.html#how-to-set-ssd\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как переложить таблицу на SSD?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как переложить таблицу на SSD?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Для начала необходимо убедиться, что в вашем аккаунте в YTsaurus квота в медиуме &lt;strong&gt;ssd_blobs&lt;/strong&gt;. Для этого можно на странице аккаунтов переключить тип медиума на &lt;strong&gt;ssd_blobs&lt;/strong&gt; и ввести название своего аккаунта. Если квоты в медиуме &lt;strong&gt;ssd_blobs&lt;/strong&gt; нет, то ее можно запросить через специальную форму.&lt;/p&gt;\n&lt;p&gt;После получения квоты на медиуме &lt;strong&gt;ssd_blobs&lt;/strong&gt; необходимо изменить значение атрибута &lt;code&gt;primary_medium&lt;/code&gt;, данные будут в фоне переложены на соответствующий медиум. Подробнее можно прочитать в разделе про &lt;a href=\"ru/user-guide/faq/index.html#storage\"&gt;хранение&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Для статических таблиц можно форсировать перекладывание с помощью операции &lt;a href=\"ru/user-guide/user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/dev/test_table/@primary_medium ssd_blobs\nyt merge --mode auto --spec &lt;span class=\"hljs-string\"&gt;'{\"force_transform\"=true;}'&lt;/span&gt; --src //home/dev/test_table --dst //home/dev/test_table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"55\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-55\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-55\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-55.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если таблица динамическая, для изменения медиума нужно предварительно отмонтировать таблицу,&lt;br /&gt;\nустановить атрибут, а затем смонтировать обратно:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt unmount-table //home/dev/test_table --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt;\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/dev/test_table/@primary_medium ssd_blobs\nyt mount-table //home/dev/test_table --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"59\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-59\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-59\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-59.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Дополнительно ускорить перекладывание можно с помощью &lt;a href=\"ru/user-guide/user-guide/dynamic-tables/overview.html#attributes\"&gt;forced_compaction&lt;/a&gt;, однако использование этого метода создаёт большую нагрузку на кластер и крайне не рекомендуется.&lt;/p&gt;\n&lt;p&gt;Для проверки того, что таблица действительно изменила медиум можно воспользоваться командой:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //home/dev/test_table/@chunk_media_statistics\n\n{\n    &lt;span class=\"hljs-string\"&gt;\"ssd_blobs\"&lt;/span&gt; = {\n        &lt;span class=\"hljs-string\"&gt;\"chunk_count\"&lt;/span&gt; = 2126;\n        &lt;span class=\"hljs-string\"&gt;\"uncompressed_data_size\"&lt;/span&gt; = 9667220402266;\n        &lt;span class=\"hljs-string\"&gt;\"compressed_data_size\"&lt;/span&gt; = 4954465956017;\n        &lt;span class=\"hljs-string\"&gt;\"data_weight\"&lt;/span&gt; = 10764306825793;\n        &lt;span class=\"hljs-string\"&gt;\"max_block_size\"&lt;/span&gt; = 6584787;\n    };\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"66\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-66\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-66\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-66.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"chyt-sample-support\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/faq-chyt.html#chyt-sample-support\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Поддерживается ли конструкция SAMPLE языка ClickHouse?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Поддерживается ли конструкция SAMPLE языка ClickHouse?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; CHYT поддерживает конструкцию Sample. Отличие заключается в том, что CHYT игнорирует команду &lt;code&gt;OFFSET ...&lt;/code&gt;, таким образом нельзя получить выборку из другой части отобранных данных.&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs SQL\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;count&lt;/span&gt;(&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; \"//tmp/sample_table\" SAMPLE &lt;span class=\"hljs-number\"&gt;0.05&lt;/span&gt;;\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;count&lt;/span&gt;(&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; \"//tmp/sample_table\" SAMPLE &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;20&lt;/span&gt;;\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;count&lt;/span&gt;(&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; \"//tmp/sample_table\" SAMPLE &lt;span class=\"hljs-number\"&gt;100500&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"77\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-77\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-77\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-77.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"get-table-name-query\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/faq-chyt.html#get-table-name-query\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как мне получить имя таблицы в запросе?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как мне получить имя таблицы в запросе?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Можно воспользоваться виртуальными колонками &lt;code&gt;$table_name&lt;/code&gt; и &lt;code&gt;$table_path&lt;/code&gt;. Подробнее про виртуальные колонки читайте в разделе &lt;a href=\"ru/user-guide/user-guide/data-processing/chyt/yt-tables.html##virtual_columns\"&gt;Работа с таблицами YTsaurus&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/chyt/faq-chyt.md","sourcePath":"ru/user-guide/data-processing/chyt/faq-chyt.md"},"headings":[],"title":"FAQ"},"router":{"pathname":"ru/user-guide/data-processing/chyt/faq-chyt","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
