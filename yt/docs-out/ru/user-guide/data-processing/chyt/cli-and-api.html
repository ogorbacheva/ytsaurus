        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Чтобы запустить свою клику или отправить запрос в CHYT из программы либо из командной строки, можно воспользоваться CHYT CLI и CHYT Python API. Они могут быть получены в составе пакета &lt;code&gt;ytsaurus-client&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Утилита командной строки воспринимает две переменные окружения: &lt;code&gt;YT_PROXY&lt;/code&gt; и &lt;code&gt;CHYT_ALIAS&lt;/code&gt;. С помощью первой из них можно указать кластер YTsaurus, а с помощью второй — используемую клику.&lt;/p&gt;\n&lt;p&gt;Например, под Linux и macOS можно использовать следующую команду, чтобы установить переменные окружения и больше не передавать параметры &lt;code&gt;--proxy &amp;lt;cluster_name&amp;gt;&lt;/code&gt; и &lt;code&gt;--alias ch_public&lt;/code&gt; во все последующие вызовы:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_PROXY=&amp;lt;cluster_name&amp;gt; CHYT_ALIAS=ch_public\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"9\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-9\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-9\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-9.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Для совместимости со старыми версиями алиас клики можно указывать со звёздочкой в начале, в таком случае она игнорируется.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Запускающий клику процесс иногда может неформально называться &lt;em&gt;лончером&lt;/em&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytsaurus-client\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cli-and-api.html#ytsaurus-client\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ytsaurus-client&lt;/span&gt;&lt;/a&gt;ytsaurus-client&lt;/h2&gt;\n&lt;p&gt;Основной способ начать работать с YTsaurus — установить пакет &lt;code&gt;ytsaurus-client&lt;/code&gt;. Подробнее об этом можно прочитать в статье &lt;a href=\"api/python/start.html\"&gt;Python Wrapper&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;В составе распространяется программа &lt;code&gt;yt&lt;/code&gt;. Для того чтобы воспользоваться функциональностью CHYT, можно запустить любую команду как &lt;code&gt;yt clickhouse [command]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Например, следующим образом можно сделать тестовый запрос в публичную клику &lt;code&gt;ch_public&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt clickhouse execute &lt;span class=\"hljs-string\"&gt;\"select 'Hello world'\"&lt;/span&gt; --&lt;span class=\"hljs-built_in\"&gt;alias&lt;/span&gt; ch_public\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"35\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-35\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-35\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-35.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Помимо этого пакет содержит Python API для работы с CHYT, доступный в модуле &lt;code&gt;yt.clickhouse&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;python3\nPython 3.7.3 (default, Oct  7 2019, 12:56:13)\n[GCC 8.3.0] on linux\nType &lt;span class=\"hljs-string\"&gt;\"help\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"copyright\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"credits\"&lt;/span&gt; or &lt;span class=\"hljs-string\"&gt;\"license\"&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; more information.\n&amp;gt;&amp;gt;&amp;gt; import yt.clickhouse as chyt\n&amp;gt;&amp;gt;&amp;gt; import yt.wrapper as yt\n&amp;gt;&amp;gt;&amp;gt; client = yt.YtClient(&lt;span class=\"hljs-string\"&gt;\"&amp;lt;cluster_name&amp;gt;\"&lt;/span&gt;)\n&amp;gt;&amp;gt;&amp;gt; list(chyt.execute(&lt;span class=\"hljs-string\"&gt;\"select * from `//home/user/sample_table`\"&lt;/span&gt;, &lt;span class=\"hljs-built_in\"&gt;alias&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"ch_public\"&lt;/span&gt;, client=client))\n[{&lt;span class=\"hljs-string\"&gt;'a'&lt;/span&gt;: 100}, {&lt;span class=\"hljs-string\"&gt;'a'&lt;/span&gt;: 101}, {&lt;span class=\"hljs-string\"&gt;'a'&lt;/span&gt;: 102}, {&lt;span class=\"hljs-string\"&gt;'a'&lt;/span&gt;: 205}, {&lt;span class=\"hljs-string\"&gt;'a'&lt;/span&gt;: 206}, {&lt;span class=\"hljs-string\"&gt;'a'&lt;/span&gt;: 1100}]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"39\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-39\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-39\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-39.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Библиотека доступна для Python 3.&lt;/p&gt;\n&lt;p&gt;Детальную спецификацию возможностей Python API и CLI вы можете найти в статье &lt;a href=\"user-guide/data-processing/chyt/reference/execute.html\"&gt;Выполнение запросов&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/chyt/cli-and-api.md","sourcePath":"ru/user-guide/data-processing/chyt/cli-and-api.md"},"headings":[{"title":"ytsaurus-client","href":"ru/user-guide/data-processing/chyt/cli-and-api.html#ytsaurus-client","level":2}],"title":"CLI и Python API"},"router":{"pathname":"ru/user-guide/data-processing/chyt/cli-and-api","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
