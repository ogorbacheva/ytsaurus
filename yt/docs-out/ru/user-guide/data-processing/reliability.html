            {"data":{"leading":false,"html":"&lt;h2 id=\"otkazoustojchivost\"&gt;&lt;a href=\"ru/user-guide/data-processing/reliability.html#otkazoustojchivost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Отказоустойчивость&lt;/span&gt;&lt;/a&gt;Отказоустойчивость&lt;/h2&gt;\n&lt;p&gt;В данной статье рассказывается, как ведёт себя система обработки данных в случае выхода из строя отдельных узлов кластера и какие гарантии предоставляются пользователям кластера YTsaurus.&lt;/p&gt;\n&lt;p&gt;С точки зрения отказоустойчивости, система обработки данных преследует следующие цели:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;обеспечение максимальной доступности и надёжности;&lt;/li&gt;\n&lt;li&gt;сохранeние прогресса уже выполненных вычислений в рамках исполняющихся операций.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"dostupnost\"&gt;&lt;a href=\"ru/user-guide/data-processing/reliability.html#dostupnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Доступность&lt;/span&gt;&lt;/a&gt;Доступность&lt;/h3&gt;\n&lt;p&gt;Доступность системы обработки данных напрямую связана с работоспособностью планировщика.&lt;/p&gt;\n&lt;p&gt;Планировщик внутри кластера представлен в виде нескольких запущенных процессов, которые, как правило, расположены на разных узлах. Каждый из процессов в цикле пытается захватить блокировку на узел &lt;code&gt;//sys/scheduler/lock&lt;/code&gt; в Кипарисе. Процесс, которому удалось захватить блокировку, зачитывает мета-информацию про текущие операции из Кипариса, восстанавливает своё состояние и становится &lt;strong&gt;активным&lt;/strong&gt; — то есть начинает обслуживать пользовательские запросы про операции, обрабатывать хартбиты от exec-нод и так далее.&lt;/p&gt;\n&lt;p&gt;В случае, если активного планировщика по какой-то причине нет, в кластере не происходит планирования новых джобов и аллокаций, отсутствует возможность запускать новые операции. То есть фактически система обработки данных недоступна.&lt;/p&gt;\n&lt;p&gt;При выходе из строя активного планировщика, требуется некоторое время, пока другой процесс захватит блокировку и станет активным. Данный промежуток времени обычно составляет десятки секунд, при этом его величина зависит от следующих параметров:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;частота, с которой процесс планировщика пытается захватить блокировку;&lt;/li&gt;\n&lt;li&gt;таймаут транзакции, в рамках которой захватывается блокировка;&lt;/li&gt;\n&lt;li&gt;объём мета-информации про текущие операции — данная величина начинает играть роль в том случае, если в кластере исполняются тысячи операций одновременно и требуется существенное время, чтобы все их прочитать из Кипариса и восстановить состояние планировщика.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Стоит отметить, что подобные промежутки недоступности обычно незаметны для пользователей, так как SDK YTsaurus используют ретраи при работе с операциями.&lt;/p&gt;\n&lt;h3 id=\"nadyozhnost\"&gt;&lt;a href=\"ru/user-guide/data-processing/reliability.html#nadyozhnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Надёжность&lt;/span&gt;&lt;/a&gt;Надёжность&lt;/h3&gt;\n&lt;p&gt;Напомним, что для пользователя вычисления на кластере представлены операциями. Поэтому надежность системы обработки данных выражается в том, что операции не должны теряться и завершаться с ошибками в случае выхода из строя различных компонент системы обработки данных.&lt;/p&gt;\n&lt;p&gt;Система гарантирует, что при выходе из строя планировщика или других компонент, операции сохранятся и продолжат исполняться. Однако может теряться часть прогресса исполняемых операций.&lt;/p&gt;\n&lt;p&gt;Сохранность операций достигается за счет того, что мета-информация об исполняющихся операциях надежно хранится в Кипарисе. Также при запуске операции создаются транзакции для работы с входными и выходными таблицами и файлами, и в рамках этих транзакций берутся блокировки в режиме &lt;code&gt;snapshot&lt;/code&gt;. Это позволяет операции продолжать исполнение, если данные таблицы были удалены в ходе работы операции, или если сменится активный планировщик.&lt;/p&gt;\n&lt;p&gt;Важно понимать, что у транзакций имеется таймаут, обычно составляющий несколько часов. Если планировщик будет недоступен дольше указанного таймаута, он попытается запустить операции с нуля — но входных, выходных таблиц или файлов может не оказаться. В таком случае операция ожидаемым образом завершится с ошибкой.&lt;/p&gt;\n&lt;h3 id=\"sohranenie-progressa-vychislenij\"&gt;&lt;a href=\"ru/user-guide/data-processing/reliability.html#sohranenie-progressa-vychislenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сохранение прогресса вычислений&lt;/span&gt;&lt;/a&gt;Сохранение прогресса вычислений&lt;/h3&gt;\n&lt;p&gt;В отличие от real-time компонент кластера, исполнение одной операции требует значительного времени – от единиц минут до нескольких дней в зависимости от объёма обрабатываемых данных, доступной вычислительной квоты и запускаемого кода в джобах. Поэтому требования, предъявляемые к доступности системы обработки данных, достаточно расслабленные: предполагается, что задержки в единицы минут, а в большинстве случаев и в десятки минут, не скажутся значимым образом на SLO систем, которые запускают свои вычисления на YTsaurus кластерах.&lt;/p&gt;\n&lt;p&gt;Чтобы описать точные гарантии в разрезе сохранения прогресса вычислений, необходимо начать с описания логической схемы того, как устроен жизненный цикл операции и джобов.&lt;/p&gt;\n&lt;p&gt;Состояние операции можно разделить на 3 части:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Мета-информация операции: её спецификация, набор Кипарисных транзакций, блокировки входных, выходных таблиц и файлов, использующихся для запуска, различные runtime-настройки операции и текущая &lt;a href=\"ru/user-guide/data-processing/operations/overview#status\"&gt;стадия операции&lt;/a&gt; (она же &lt;code&gt;state&lt;/code&gt;). В планировщике фактически реализован конечный автомат, через который проходит каждая операция. Стадия является узлом этого автомата.&lt;/li&gt;\n&lt;li&gt;Состояние контроллера операции. Контроллер операции – это объект, который находится внутри процесса контроллер-агента и отвечает за процесс исполнения операции. Контроллер заведует информацией про то, какие джобы данной операции сейчас выполняются, какие закончились, какие данные уже обработаны, а какие ещё нет, и в целом в данном объекте инкапсулируется вся логика и состояние обработки данных, которые производятся данной операцией.&lt;/li&gt;\n&lt;li&gt;Набор выполняющихся и некоторых уже завершённых джобов на exec-нодах кластера.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Планировщик &lt;em&gt;синхронно&lt;/em&gt; записывает мета-информацию операции в соответствующий узел Кипариса, который находится в поддереве &lt;code&gt;//sys/operations&lt;/code&gt;. Контроллер операции умеет консистентно сохранять своё состояние в бинарном формате и записывать его в Кипарис в виде файла. Такой блоб называется &lt;strong&gt;снепшотом операции&lt;/strong&gt;. Каждый контроллер-агент периодически строит снепшоты запущенных на нём операций.&lt;/p&gt;\n&lt;p&gt;Выполняющиеся джобы операции периодически сообщают своё состояние контроллеру операции. Это происходит с помощью хартбитов, которые присылают ноды кластера. Каждая exec-нода отправляет хартбиты со всеми релевантными джобами в каждый из контроллер-агентов.&lt;/p&gt;\n&lt;p&gt;Опишем теперь общую схему того, как система обработки данных переживает выход из строя отдельных компонент.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;При выходе из строя exec-ноды кластера, контроллер-агенты и планировщик по истечении небольшого таймаута (обычно равного 1-2 минутам) обнаруживают, что нода перестала присылать хартбиты, и считают все аллокации и соответствующие джобы потерянными, после этого они будут запланированы на другие ноды кластера. Тут стоит отметить, что логически это будут новые джобы взамен потерянных.&lt;/li&gt;\n&lt;li&gt;При выходе из строя контроллер-агента, теряется текущее состояние контроллеров операций, которые были запущены на данном агенте. При этом планировщик обнаруживает, что контроллер-агент отключился, и все операции, которые были на него назначены, переносит на другие контроллер-агенты. При назначении на новый агент контроллер операции восстанавливается из последнего сохранённого снепшота. Также по мере обработки хартбитов контроллер операции синхронизирует своё состояние, прочитанное из снепшота, с фактической ситуацией на кластере.&lt;/li&gt;\n&lt;li&gt;При выходе из строя активного планировщика, автоматически прекращают работу все контроллер-агенты, подключается новый планировщик, он зачитывает текущую мета-информацию про операции, заново распределяет операции по контроллер-агентам и продолжает работу. Операции при этом восстанавливаются из последних записанных в Кипарис снепшотов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Процесс восстановления операций из снепшота называется &lt;em&gt;ревайвом&lt;/em&gt; (он же &lt;code&gt;revive&lt;/code&gt;). Отметим, что снепшот операции может отсутствовать — в таком случае для операции также происходит ревайв и она начинает свою работу с нуля.&lt;/p&gt;\n&lt;p&gt;Важно отметить, что ноды также хранят информацию о завершённых джобах для того, чтобы в случае revive-а операции сообщить о таких джобах контроллеру и не потерять в этом месте прогресс. Приведем пример, описывающий ситуацию, в которой удается не потерять информацию о завершившемся джобе.&lt;/p&gt;\n&lt;p&gt;Предположим, на ноде выполняется джоб &lt;code&gt;J&lt;/code&gt; операции &lt;code&gt;O&lt;/code&gt;. Тогда возможна следующая хронология событий:&lt;/p&gt;\n&lt;table&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;strong&gt;Момент времени&lt;/strong&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;strong&gt;Событие&lt;/strong&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;code&gt;X&lt;/code&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Джоб &lt;code&gt;J&lt;/code&gt; исполняется на ноде, контроллер-агент записал снепшот операции &lt;code&gt;O&lt;/code&gt;. В рамках этого снепшота контроллер операции считает, что джоб &lt;code&gt;J&lt;/code&gt; находится в процессе исполнения.&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;code&gt;X+1&lt;/code&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Джоб &lt;code&gt;J&lt;/code&gt; завершился и контроллер операции обработал это событие.&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;code&gt;X+2&lt;/code&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Произошёл ревайв операции &lt;code&gt;O&lt;/code&gt; (например, вследствие перезапуска контроллер-агента). После восстановления из снепшота контроллер операции &lt;code&gt;O&lt;/code&gt; считает, что джоб &lt;code&gt;J&lt;/code&gt; ещё исполняется.&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;code&gt;X+3&lt;/code&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;При обработке хартбита от ноды, на которой исполнялся джоб &lt;code&gt;J&lt;/code&gt;, контроллер операции обнаружит, что данного джоба нет среди исполняющихся джобов.&lt;/p&gt;\n&lt;p&gt;При этом он запросит у ноды информацию о всех завершённых джобах в прошлом. При следующем хартбите нода пришлёт контроллеру информацию о том, что джоб &lt;code&gt;J&lt;/code&gt; завершился, и контроллер обработает это событие и не будет запускать новый джоб взамен.&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Подробнее про устройство механизма ревайва можно узнать в &lt;a href=\"ru/other/video-posts.html#2019-map-reduce-operaciya-dlinoyu-v-god\"&gt;докладе&lt;/a&gt;. Следует иметь в виду, что данный механизм претерпел ряд изменений с момента записи доклада.&lt;/p&gt;\n&lt;p&gt;Резюмируя сказанное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;В случае выхода из строя планировщика или контроллер-агента требуется несколько минут на восстановление состояния. Кроме того, теряется часть прогресса операций с момента последнего снепшота, отложенного операцией.&lt;/li&gt;\n&lt;li&gt;В случае выхода из строя exec-ноды теряется прогресс всех джобов, которые исполнялись на данной ноде.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"soglasovannost-sostoyanij-planirovshika-i-kontroller-agentov\"&gt;&lt;a href=\"ru/user-guide/data-processing/reliability.html#soglasovannost-sostoyanij-planirovshika-i-kontroller-agentov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Согласованность состояний планировщика и контроллер-агентов&lt;/span&gt;&lt;/a&gt;Согласованность состояний планировщика и контроллер-агентов&lt;/h4&gt;\n&lt;p&gt;Планировщик и контроллер-агенты имеют достаточно сложный и богатый протокол общения. Важно понимать, как обеспечивается согласованность их состояний и их действий в случае выхода из строя отдельных компонент и потери сетевой связности.&lt;/p&gt;\n&lt;p&gt;Данная согласованность во многом достигается за счет того, что контроллер-агенты &lt;em&gt;привязаны&lt;/em&gt; к активному планировщику. Ниже детально описывается схема, по которой планировщик и агенты становятся активными, и объясняется, что это означает данная &lt;em&gt;привязанность&lt;/em&gt;.&lt;/p&gt;\n&lt;p&gt;Напомним, как происходит выбор активного планировщика. Каждый из процессов планировщика в цикле заводит транзакцию и в рамках этой транзакции пытается взять эксклюзивную блокировку на узел в Кипарисе. Планировщик, которому это удалось, становится активным — после этого он читает мета-информацию про все операции из Кипариса и восстанавливает их состояние.&lt;/p&gt;\n&lt;p&gt;Контроллер-агенты действуют по следующей схеме:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Сначала агент устанавливает связь с планировщиком и получает от него транзакцию, в рамках которой этот планировщик стал активным.&lt;/li&gt;\n&lt;li&gt;Дальше агент заводит свою транзакцию, вложенную в транзакцию планировщика, и пытается под ней захватить блокировку на узел &lt;code&gt;//sys/controller_agents/instances/&amp;lt;instance_address&amp;gt;/lock&lt;/code&gt;. В типичном случае агент не соревнуется с другими процессами за взятие блокировки, но может конфликтовать со своей предыдущей инкарнацией.&lt;/li&gt;\n&lt;li&gt;Когда агенту удалось взять данную блокировку, он также становится &lt;em&gt;активным&lt;/em&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;После того, как агент стал активным, планировщик начинает назначать на этого агента операции, а агент выполняет работу по планированию джобов этих операций.&lt;/p&gt;\n&lt;p&gt;Транзакция агента выполняет несколько функций:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Позволяет планировщику управлять данным агентом и обеспечивает привязанность агента к текущему активному планировщику. С помощью этой транзакции планировщик может прерывать работу контроллер-агента в разных ситуациях, например, если с агентом прервалась связь. Для этого достаточно отменить транзакцию данного агента. Кроме того, если транзакция планировщика прервалась, то прерываются и все транзакции агентов.&lt;/li&gt;\n&lt;li&gt;Используется агентом при взаимодействии с Кипарисом как пререквизитная. Это позволяет гарантировать, что изменять состояние операции в Кипарисе может только текущий активный агент, на который назначена данная операция.&lt;/li&gt;\n&lt;li&gt;Используется как идентификатор сессии общения с планировщиком, в частности, передаётся в каждом сообщении. Если планировщик при обработке сообщения обнаружил, что текущий идентификатор агента отличается от пришедшего в сообщении, значит, это сообщение пришло от предыдущей инкарнации, и его необходимо игнорировать.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Таким образом, описанная схема обеспечивает, что в любой момент времени операция обслуживается только одним контроллер-агентом.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/reliability.md","sourcePath":"ru/user-guide/data-processing/reliability.md"},"headings":[{"title":"Отказоустойчивость","href":"ru/user-guide/data-processing/reliability.html#otkazoustojchivost","level":2,"items":[{"title":"Доступность","href":"ru/user-guide/data-processing/reliability.html#dostupnost","level":3},{"title":"Надёжность","href":"ru/user-guide/data-processing/reliability.html#nadyozhnost","level":3},{"title":"Сохранение прогресса вычислений","href":"ru/user-guide/data-processing/reliability.html#sohranenie-progressa-vychislenij","level":3,"items":[{"title":"Согласованность состояний планировщика и контроллер-агентов","href":"ru/user-guide/data-processing/reliability.html#soglasovannost-sostoyanij-planirovshika-i-kontroller-agentov","level":4}]}]}],"title":""},"router":{"pathname":"ru/user-guide/data-processing/reliability","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
