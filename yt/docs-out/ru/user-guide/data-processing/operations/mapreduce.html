            {"data":{"leading":false,"html":"&lt;p&gt;Операция MapReduce устроена следующим образом:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;На узлах кластера наступает map стадия. Каждый пользовательский скрипт map стадии (mapper) получает на вход отдельную часть входной таблицы. Выходные данные map стадии делятся по хешу от ключа на партиции. Полученные партицированные данные сохраняются локально на диск на тех узлах, где выполнялись map джобы, с единичной репликацией.&lt;/li&gt;\n&lt;li&gt;Далее наступает reduce стадия. Каждый пользовательский скрипт reduce стадии (reducer) обслуживает одну партицию: ему на вход попадают все записи, полученные из mapper-ов, чей хеш от ключа имеет заданное значение. Reducer забирает по сети данные, отвечающие его партиции, с узлов кластера, где выполнялись map джобы, — данный процесс называется &lt;strong&gt;shuffle&lt;/strong&gt;, именно в это время порождается максимальная нагрузка на сеть. Каждая партиция сортируется в памяти по ключу, а при совпадении ключей — по подключу. Затем сортированные данные подаются на вход reduce джобу. Выход из reduce джоба записывается на диск с требуемой репликацией — обычно это две синхронные реплики и одна асинхронная, при этом одна из синхронных реплик пишется локально.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;img src=\"images/mapreduce_op1.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;p&gt;Операция MapReduce аналогична операции &lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;Sort&lt;/a&gt;, но позволяет выполнять пользовательский скрипт mapper до выполнения partitioning джобов и пользовательский скрипт reducer после выполнения sorting-джобов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MapReduce — это функционально не то же самое, что Map + Sort + Reduce. Даже если пользовательский скрипт reduce стадии не изменяет значения ключевых колонок, получить на выходе операции сортированную таблицу все равно не удастся. Поэтому использование MapReduce в комбинации с атрибутом &lt;code&gt;sorted_by&lt;/code&gt; на выходной таблице почти всегда некорректно. Ошибка будет проявляться только на достаточно большой таблице, которая не помещается целиком в один reduce джоб.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Особенности работы слитной операции MapReduce:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Пользователь может не указать mapper, в таком случае он предполагается тождественным: данные входных таблиц будут переданы на выход map стадии без обработки. В терминах YTsaurus при наличии пользовательского mapper-а будут работать partition map джобы, а в случае отсутствия — partition джобы.&lt;/li&gt;\n&lt;li&gt;Если партиция оказалась слишком большой и не помещается в память, то отсортировать её на одном узле кластера невозможно. Поэтому партиция делится на части, каждая часть сортируется отдельно, результат записывается локально на диск. После этого запускается &lt;a href=\"https://en.wikipedia.org/wiki/K-way_merge_algorithm\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;multiway merge&lt;/a&gt;, сливающий данные и подающий их на вход reduce джоба. В терминах YTsaurus сортировка маленькой партиции в памяти выполняется с помощью partition reduce джобов. Если же партиция большая, то сортировка частей выполняется partition sort джобами, а финальное слияние и запуск reducer-а — sorted_reduce джобами.&lt;/li&gt;\n&lt;li&gt;Нельзя начать запускать reduce джобы до тех пор, пока map джобы не завершились. Это следует из того, что система YTsaurus должна подавать reduce джобам данные, упорядоченные по подключу, а такую последовательность нельзя сформировать, пока данные (выходы map джобов) не построены до конца. Поэтому между стадиями map и reduce есть так называемый барьер, map и reduce стадии не должны пересекаться по времени.&lt;br /&gt;\nЕсли в процессе работы операции планировщик замечает, что возникает большая партиция, которая не может быть отсортирована в одном джобе, то у него появляется возможность сэкономить время и начать обрабатывать партицированные данные до завершения всех map джобов. Планировщик дробит партицию на несколько частей произвольным образом. Отдельные части сортируются на разных узлах кластера intermediate sort джобами, которые забирают по сети эти данные и сортируют их. Такое наблюдение позволяет частично пересекать фазы и сокращать время операции.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"sravnenie-mapreduce-i-map-sort-reduce\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/mapreduce.html#sravnenie-mapreduce-i-map-sort-reduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сравнение MapReduce и Map + Sort + Reduce&lt;/span&gt;&lt;/a&gt;Сравнение MapReduce и Map + Sort + Reduce&lt;/h2&gt;\n&lt;p&gt;У слитной операции MapReduce по сравнению с комбинацией операций &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt; + &lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;Sort&lt;/a&gt; + &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt; есть несколько плюсов:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Экономия IO-операций на промежуточных данных.&lt;/strong&gt; В типичном случае, без фазы слияния, map-sort-reduce будет писать промежуточные данные на диск три раза: после map стадии, после partition sort стадии и по окончании сортировки. Часть из этих записей, возможно, будет происходить с неединичным коэффициентом репликации. Операция MapReduce обойдется единственной записью на диск, причем будет использовать единичную репликацию.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Отсутствие лишних барьеров (точек синхронизации).&lt;/strong&gt; В комбинации map-sort-reduce система YTsaurus вынуждена ждать окончания &lt;strong&gt;всех&lt;/strong&gt; map джобов (включая самые долгие) прежде чем начинать партиционирование. Аналогично, необходимо дождаться полного окончания сортировки до запуска первых reduce джобов. В случае слитной операции MapReduce точка синхронизации одна и она неизбежна — нельзя запускать reduce джобы до окончания map джобов.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Лучшая устойчивость к сбоям.&lt;/strong&gt; MapReduce — единая операция, и планировщик полностью отвечает за то, чтобы завершить её выполнение даже в случае, когда некоторые промежуточные данные становятся недоступны. В случае цепочки независимых операций ответственность планировщика ограничивается отдельными стадиями. Единственный возможный способ борьбы с этим — увеличение степени репликации промежуточных данных, ведущее к серьезной деградации скорости.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;img src=\"images/mapreduce_op2.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;h3 id=\"zamechaniya-po-ispolzovaniyu\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/mapreduce.html#zamechaniya-po-ispolzovaniyu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Замечания по использованию&lt;/span&gt;&lt;/a&gt;Замечания по использованию&lt;/h3&gt;\n&lt;p&gt;Чтобы перейти к использованию слитной операции MapReduce от комбинации Map + Sort + Reduce, достаточно передать обе опции mapper и reducer в спецификации операции.&lt;/p&gt;\n&lt;p&gt;В ряде случаев пользователи могут сталкиваться с недостаточно быстрой работой слитной операции MapReduce при запуске с настройками по умолчанию. Причины могут быть следующие:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Значительная разница между объемом данных на входе и на выходе mapper-а, ведущая к неправильной оценке планировщиком числа партиций.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Планировщик оценивает число партиций, исходя из объема входных данных, стремясь к тому, чтобы партиция полностью поместилась в память джоба сортировки (по умолчанию 2 ГБ). При этом планировщик исходит из предположения, что объем входа mapper-а приблизительно равен объему выхода.&lt;/p&gt;\n&lt;p&gt;На практике mapper может выполнять фильтрацию исходных данных с отношением выхода к входу порядка 1:1000 и меньше. В результате, в буфер каждой партиции попадает буквально несколько записей, что приводит к большому количеству случайных чтений с диска мелкими порциями в процессе shuffle в начале фазы сортировки.&lt;/p&gt;\n&lt;p&gt;Пример: пусть на вход partition map джоба пришло 2 ГБ данных, на выходе получилось 4 МБ, &lt;code&gt;partition_count&lt;/code&gt; равен 1000. Тогда средний размер блока, записанного partition map джобом, будет составлять около 2 КБ до сжатия. Такие блоки порождают огромное количество случайных обращений к диску.&lt;/p&gt;\n&lt;p&gt;Для борьбы с данной проблемой в спецификацию операции была добавлена опция &lt;code&gt;map_selectivity_factor&lt;/code&gt;, позволяющая пользователю при старте операции задать приблизительное отношение выхода ко входу и помочь планировщику в оценке. В качестве альтернативы можно явно указать желаемое количество reduce-джобов с помощью опции &lt;code&gt;partition_count&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;«Тяжелые» mapper-ы и малое количество параллельных джобов из-за дефицита памяти.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;При выделении ресурсов для джоба планировщик учитывает память, необходимую пользовательскому коду (&lt;code&gt;memory_limit&lt;/code&gt;, задается пользователем в спецификации операции) и память для системной обвязки (JobProxy). Для map-джоба (в операции Map) память складывается из &lt;code&gt;memory_limit&lt;/code&gt;, буфера на чтение и буфера на запись.&lt;/p&gt;\n&lt;p&gt;Пример: пусть &lt;code&gt;memory_limit&lt;/code&gt; равен 250 МБ, размеры буферов — 100 + 100 МБ, итого 450 МБ на джоб. Пусть fair_share операции равен 0,1, суммарный объем ресурсов на кластере — 11 Тб памяти и 7000 CPU, тогда ресурсы, доступные операции, составляют 0,1 * 11 Тб = 1,1 Тб и 0,1 * 7000 = 700 CPU. В результате можно параллельно запустить min(1100 ГБ / 450 МБ, 700) = min(2500, 700) = 700 джобов.&lt;/p&gt;\n&lt;p&gt;Для partition map джоба память складывается из &lt;code&gt;memory_limit&lt;/code&gt;, буфера на чтение и буфера под партиции. Для операций с большим числом партиций планировщик выдает partition map джобу большой объем памяти под буфер партиций, чтобы избежать формирования мелких блоков. Например, при 1000 партициях и буфере в 2 ГБ размер блока в худшем случае будет равен 2 ГБ / 1000 = 2 МБ при равномерном распределении данных. Возвращаясь к предыдущему примеру: объем памяти для partition map джоба будет равен 250 МБ + 100 МБ + 2 ГБ ~ 2400 МБ и при доступной памяти 1,1 Тб планировщик сможет параллельно запустить только min(1100 ГБ / 2400 МБ, 700) = min(470, 700) = 470 джобов.&lt;/p&gt;\n&lt;p&gt;Если mapper «тяжелый» (большое потребление CPU на единицу выходных данных), то снижение параллельности приведет к значительному увеличению времени работы и нивелирует возможный выигрыш от склеивания фаз map и partition. Так как типичный размер выхода из фильтрующего mapper-а очень мал, такой mapper тоже следует считать «тяжелым».&lt;/p&gt;\n&lt;p&gt;Наилучшим решением в такой ситуации будет использовать комбинацию Map + MapReduce (с тривиальным mapper-ом). Даже в таком случае есть выигрыш по числу сохранений промежуточных данных по сравнению с комбинацией Map + Sort + Reduce.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"rezultaty-izmerenij\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/mapreduce.html#rezultaty-izmerenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты измерений&lt;/span&gt;&lt;/a&gt;Результаты измерений&lt;/h3&gt;\n&lt;p&gt;Для примера, показывающего прирост производительности, можно взять стандартную задачу &lt;a href=\"https://en.wikipedia.org/wiki/Word_count\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;WordCount&lt;/a&gt;. Она сводится к выполнению одной операции MapReduce, при этом в mapper-е  производится агрегация данных по ключу.&lt;/p&gt;\n&lt;p&gt;В таблице приведены результаты измерений времени работы операций при решении задачи WordCount с применением слитной MapReduce операции, последовательности Map + Sort + Reduce, а также Map + MapReduce (последний — с тривиальным mapper-ом).&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Операции&lt;/th&gt;\n&lt;th&gt;Время работы&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;MapReduce&lt;/td&gt;\n&lt;td&gt;03:25&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Map + MapReduce&lt;/td&gt;\n&lt;td&gt;05:30&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Map + Sort + Reduce&lt;/td&gt;\n&lt;td&gt;08:10&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Данные результаты получены на кластере, состоящем из 200 узлов, каждый из которых имел 48 ГБ оперативной памяти и 24 ядра под джобы. Размер входных данных составил 1 ТБ.&lt;/p&gt;\n&lt;h2 id=\"nastrojki-operacii-mapreduce\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/mapreduce.html#nastrojki-operacii-mapreduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройки операции MapReduce&lt;/span&gt;&lt;/a&gt;Настройки операции MapReduce&lt;/h2&gt;\n&lt;p&gt;Общие параметры для всех типов операций описаны в разделе &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Настройки операций&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;У операции MapReduce поддерживаются следующие дополнительные параметры (в скобках указаны значения по умолчанию, если заданы):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;mapper&lt;/code&gt; — описание пользовательского скрипта для map стадии. Если не указан, данные из входных таблиц сразу попадут на выход операции без обработки.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;reducer&lt;/code&gt; — описание пользовательского скрипта для reduce стадии.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;reduce_combiner&lt;/code&gt; — описание скрипта reduce_combiner (подробнее рассмотрен &lt;a href=\"ru/user-guide/data-processing/operations/mapreduce.html#reduce_combiner\"&gt;ниже&lt;/a&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;sort_by&lt;/code&gt; (по умолчанию совпадает с &lt;code&gt;reduce_by&lt;/code&gt;) — список колонок, по которым будет производиться сортировка данных, поступающих на вход в reduce стадии. Последовательность &lt;code&gt;reduce_by&lt;/code&gt;-полей должна быть префиксом последовательности &lt;code&gt;sort_by&lt;/code&gt;-полей.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;reduce_by&lt;/code&gt; — список колонок, по которым будет производиться группировка.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;input_table_paths&lt;/code&gt; — список входных таблиц с указанием полных путей (не должен быть пустым).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;output_table_paths&lt;/code&gt; — список выходных таблиц.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;mapper_output_table_count&lt;/code&gt; — количество таблиц из &lt;code&gt;output_table_paths&lt;/code&gt;, которые будут выходными из map стадии. Для таких таблиц &lt;code&gt;table_index&lt;/code&gt; в джобе отсчитывается с единицы, а нулевая выходная таблица — это intermediate output.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;partition_count&lt;/code&gt;, &lt;code&gt;partition_data_size&lt;/code&gt; — опции, которые указывают, сколько партиций должно быть сделано в сортировке.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;map_job_count&lt;/code&gt;, &lt;code&gt;data_weight_per_map_job&lt;/code&gt; — опции, которые указывают, сколько джобов должно быть запущено в map стадии (имеют рекомендательный характер).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;data_weight_per_sort_job&lt;/code&gt; — опция, регулирующая количество данных на входе &lt;code&gt;reduce_combiner&lt;/code&gt; (подробнее рассмотрена &lt;a href=\"ru/user-guide/data-processing/operations/mapreduce.html#reduce_combiner\"&gt;ниже&lt;/a&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;force_reduce_combiners&lt;/code&gt; (false) — форсировать запуск &lt;code&gt;reduce_combiner&lt;/code&gt; (подробнее рассмотрен &lt;a href=\"ru/user-guide/data-processing/operations/mapreduce.html#reduce_combiner\"&gt;ниже&lt;/a&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;map_selectivity_factor&lt;/code&gt; (1.0) — доля от исходного объема данных, который остается после map стадии (значение по умолчанию 1.0 означает, в частности, что map-стадия не меняет ожидаемый размер данных; 2.0 — что она увеличивает размер в два раза и т. п.).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;intermediate_data_replication_factor&lt;/code&gt; (1) — коэффициент репликации промежуточных данных.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;intermediate_data_account&lt;/code&gt; (intermediate) — аккаунт, в квоте которого будут учитываться промежуточные данные операции.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;intermediate_data_medium&lt;/code&gt; (default) — &lt;a href=\"user-guide/storage/media.html\"&gt;тип носителя (медиум)&lt;/a&gt;, на который будут записаны чанки промежуточных данных.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;intermediate_compression_codec&lt;/code&gt; (lz4) — кодек, используемый для сжатия промежуточных данных.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;intermediate_data_acl&lt;/code&gt; &lt;code&gt;({action=allow;subjects=[everyone];permissions=[read]})&lt;/code&gt; — права доступа к промежуточным данным, которые появляются после map стадии.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;map_job_io, sort_job_io, reduce_job_io&lt;/code&gt; — IO-настройки соответствующих типов джобов; секция &lt;code&gt;table_writer&lt;/code&gt; в опции &lt;code&gt;reduce_job_io&lt;/code&gt; добавляется ко всем джобам, которые пишут в выходные таблицы.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;sort_locality_timeout&lt;/code&gt; (1 min) — время, в течение которого планировщик будет ждать появления свободных ресурсов на конкретных узлах кластера, чтобы запускать сортировку всех частей каждой партиции на одном узле. Данное действие необходимо для обеспечения большей локальности чтения при последующем слиянии сортированных данных.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ordered&lt;/code&gt; (false) — включить логику, аналогичную ordered map, на partition-map стадии (входные данные разделяются на джобы последовательными отрезками, каждый джоб map стадии получает строки на вход в порядке следования в исходных таблицах).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;pivot_keys&lt;/code&gt; — список ключей, по которым будет производиться партицирование данных для reduce стадии. Опция полностью аналогична соответствующей &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;опции&lt;/a&gt; для операции reduce.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;compute_pivot_keys_from_samples&lt;/code&gt; (false) - включить автоматическую генерацию ключей для партицирования данных, используя выборки из таблицы. Опция может быть включена, только если &lt;code&gt;mapper&lt;/code&gt; не указан.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;samples_per_partition&lt;/code&gt; (1000) -  количество ключей для выборок из таблицы для каждой партиции.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;reducer/enable_input_table_index&lt;/code&gt; / &lt;code&gt;reduce_combiner/enable_input_table_index&lt;/code&gt; (false) — включать ли передачу индекса входной таблицы в стадию &lt;code&gt;reduce&lt;/code&gt; / &lt;code&gt;reduce_combine&lt;/code&gt; (опция &lt;code&gt;enable_input_table_index&lt;/code&gt; указывается внутри секции &lt;code&gt;reducer&lt;/code&gt; / &lt;code&gt;reduce_combiner&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;mapper/output_streams&lt;/code&gt; / &lt;code&gt;reduce_combiner/output_streams&lt;/code&gt; — описание промежуточных выходных потоков из стадии &lt;code&gt;map&lt;/code&gt; или &lt;code&gt;reduce_combine&lt;/code&gt;, подробнее &lt;a href=\"ru/user-guide/data-processing/operations/mapreduce.html#output_streams\"&gt;ниже&lt;/a&gt; (опция &lt;code&gt;output_streams&lt;/code&gt; указывается внутри секции &lt;code&gt;mapper&lt;/code&gt; / &lt;code&gt;reduce_combiner&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;disable_sorted_input_in_reducer&lt;/code&gt; (false) - отключить сортировку входа reduce джобов. Другие гарантии при этом сохраняются. В частности, все строки с одинаковыми ключами из &lt;code&gt;reduce_by&lt;/code&gt; колонок будут отправлены единственному reduce джобу.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;По умолчанию (и по историческим причинам) в операции MapReduce &lt;code&gt;table_index&lt;/code&gt; поддерживается только в mapper-е. При необходимости иметь &lt;code&gt;table_index&lt;/code&gt; в reducer-е, можно включить опцию &lt;code&gt;enable_input_table_index&lt;/code&gt; внутри секции &lt;code&gt;reducer&lt;/code&gt; (или &lt;code&gt;reduce_combiner&lt;/code&gt;). В будущем эта опция может быть включена по умолчанию. Для включения сортировки по &lt;code&gt;table_index&lt;/code&gt; в reducer-е, необходимо добавить колонку с именем &lt;code&gt;$table_index&lt;/code&gt; в &lt;code&gt;sort_by&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"reduce_combiner\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/mapreduce.html#reduce_combiner\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с большими ключами — reduce_combiner&lt;/span&gt;&lt;/a&gt;Работа с большими ключами — reduce_combiner&lt;/h2&gt;\n&lt;p&gt;Для работы с большими ключами в reduce стадии существует специальная стадия обработки данных. Джобы данной стадии называются &lt;strong&gt;reduce_combiner&lt;/strong&gt; джобами. Такие джобы запускаются на частях «больших» партиций и позволяют выполнять частичный reduce, не дожидаясь сортировки всех частей партиции и запуска reduce с финальным merge. Reduce джоб для такой партиции получит на вход результат слияния выходов нескольких &lt;code&gt;reduce_combiner&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;Reduce_combiner&lt;/code&gt; запускается, если размер партиции превышает &lt;code&gt;data_weight_per_sort_job&lt;/code&gt;. Объем данных в &lt;code&gt;reduce_combiner&lt;/code&gt; равен &lt;code&gt;data_weight_per_sort_job&lt;/code&gt;. Значение по умолчанию для &lt;code&gt;data_weight_per_sort_job&lt;/code&gt; задается в конфигурации планировщика, но может быть переопределено в спецификации операции (в байтах).&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;Reduce_combiner&lt;/code&gt; также можно принудительно запустить, установив параметр &lt;code&gt;force_reduce_combiners&lt;/code&gt; в &lt;code&gt;true&lt;/code&gt;. &lt;code&gt;Reduce_combiner&lt;/code&gt; получает на вход сортированный поток записей (как обычный reducer). Однако, эти записи не обязательно формируют непрерывный диапазон в порядке &lt;code&gt;sort_by&lt;/code&gt;. Если некоторые две записи попали в &lt;code&gt;reduce_combiner&lt;/code&gt; джоб, между ними (в порядке &lt;code&gt;sort_by&lt;/code&gt;) могут быть записи, которые в этот джоб не попали.&lt;/p&gt;\n&lt;p&gt;На выход &lt;code&gt;reduce_combiner&lt;/code&gt; накладывается несколько ограничений:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Выход должен быть сортированным.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;reduce_combiner&lt;/code&gt; не должен изменять ключи — колонки, указанные в поле &lt;code&gt;sort_by&lt;/code&gt; спецификации, а если оно не указано, то в &lt;code&gt;reduce_by&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Должна быть только одна выходная таблица, как для map стадии в операции &lt;code&gt;MapReduce&lt;/code&gt;.&lt;br /&gt;\nОтсюда, в частности, следует, что любой коммутативный и ассоциативный reducer можно использовать в качестве &lt;code&gt;reduce_combiner&lt;/code&gt; в исходном виде.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример запуска операции с &lt;code&gt;reduce_combiner&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;yt map-reduce --reduce-combiner cat --reducer cat --reduce-by cookies --src //statbox/access-log/2013-05-15 --dst //tmp/asd --format dsv\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"359\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-359\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-359\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-359.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"output_streams\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/mapreduce.html#output_streams\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Промежуточные потоки&lt;/span&gt;&lt;/a&gt;Промежуточные потоки&lt;/h2&gt;\n&lt;p&gt;В обычном случае промежуточные потоки данных между стадиями &lt;code&gt;map&lt;/code&gt;, &lt;code&gt;reduce_combine&lt;/code&gt;, &lt;code&gt;reduce&lt;/code&gt; не имеют схемы. Но схема необходима для работы со сложными типами и некоторых эффективных форматов. Чтобы задать схемы данных для этих промежуточных потоков, используется опция &lt;code&gt;output_streams&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Опция указывается в секциях &lt;code&gt;mapper&lt;/code&gt;/&lt;code&gt;reduce_combiner&lt;/code&gt; и должна содержать список словарей со следующими ключами:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;schema&lt;/code&gt; —  YSON-описание схемы потока.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Если опция указывается, то пользовательский код может считать, что он пишет в несколько виртуальных таблиц (по числу элементов списка &lt;code&gt;output_streams&lt;/code&gt;). Следующая стадия получает объединённые данные из всех промежуточных таблиц и может использовать &lt;code&gt;table_index&lt;/code&gt; входных данных для определения, из какого именно потока пришла та или иная строка.&lt;/p&gt;\n&lt;p&gt;Если указаны опции и &lt;code&gt;mapper/output_streams&lt;/code&gt;, и &lt;code&gt;mapper_output_table_count&lt;/code&gt;, то сперва идут промежуточные данные, а потом выходные, т. е. промежуточные данные будут иметь &lt;code&gt;table_index = 0 ... len(mapper.output_streams)-1&lt;/code&gt;, а выходные таблицы — &lt;code&gt;table_index = len(mapper.output_streams) ... len(mapper.output_streams) + mapper_output_table_count&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Пример в спецификации:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;mapper = {\n  output_streams = [\n    {\n      \"schema\" = [\n        {\n          name=key;\n          type= ...\n        };\n        ...\n      ]\n    },\n  ]\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"385\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-385\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-385\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-385.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"primer-specifikacii\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/mapreduce.html#primer-specifikacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример спецификации&lt;/span&gt;&lt;/a&gt;Пример спецификации&lt;/h2&gt;\n&lt;p&gt;Пример спецификации MapReduce операции:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;{\n  &lt;span class=\"hljs-string\"&gt;partition_count&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;100&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;reduce_by&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;sort_by&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"subkey\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;input_table_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/input_table\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;output_table_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/first_output_table\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;//tmp/second_output_table\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;mapper&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; {\n    &lt;span class=\"hljs-string\"&gt;command&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"python my_mapper.py\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;file_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/my_mapper.py\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;tmpfs_path&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\".\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;tmpfs_size&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1000000&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;copy_files&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;%true;&lt;/span&gt;\n  }&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;reducer&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; {\n    &lt;span class=\"hljs-string\"&gt;command&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"python my_reducer.py\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;file_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/my_reducer.py\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  }&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"392\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-392\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-392\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-392.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/operations/mapreduce.md","sourcePath":"ru/user-guide/data-processing/operations/mapreduce.md"},"headings":[{"title":"Сравнение MapReduce и Map + Sort + Reduce","href":"ru/user-guide/data-processing/operations/mapreduce.html#sravnenie-mapreduce-i-map-sort-reduce","level":2,"items":[{"title":"Замечания по использованию","href":"ru/user-guide/data-processing/operations/mapreduce.html#zamechaniya-po-ispolzovaniyu","level":3},{"title":"Результаты измерений","href":"ru/user-guide/data-processing/operations/mapreduce.html#rezultaty-izmerenij","level":3}]},{"title":"Настройки операции MapReduce","href":"ru/user-guide/data-processing/operations/mapreduce.html#nastrojki-operacii-mapreduce","level":2},{"title":"Работа с большими ключами — reduce_combiner","href":"ru/user-guide/data-processing/operations/mapreduce.html#reduce_combiner","level":2},{"title":"Промежуточные потоки","href":"ru/user-guide/data-processing/operations/mapreduce.html#output_streams","level":2},{"title":"Пример спецификации","href":"ru/user-guide/data-processing/operations/mapreduce.html#primer-specifikacii","level":2}],"title":"MapReduce"},"router":{"pathname":"ru/user-guide/data-processing/operations/mapreduce","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
