        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Операции могут иметь несколько входных и несколько выходных таблиц. В данном разделе описано, как переключать чтение и запись между ними.&lt;/p&gt;\n&lt;p&gt;В пользовательском коде операций &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt; и &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt; можно получать данные о том, из какой таблицы пришла запись, и выбирать, в какую таблицу отправить запись. Реализуется это с помощью &lt;strong&gt;&lt;a href=\"ru/user-guide/data-processing/operations/table-switch.html#descriptors\"&gt;дескрипторов&lt;/a&gt;&lt;/strong&gt; или через &lt;strong&gt;&lt;a href=\"ru/user-guide/data-processing/operations/table-switch.html#switches\"&gt;переключатели таблиц&lt;/a&gt;&lt;/strong&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Для пользователя есть несколько способов указать, в какую таблицу отправить строку: можно указать дескриптор таблицы, а можно использовать переключатель.&lt;/p&gt;\n&lt;p&gt;Технически нет ограничений на одновременное использование этих механизмов, но на практике &lt;strong&gt;не рекомендуется&lt;/strong&gt; использовать эти механизмы одновременно.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Когда у операции типа &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt; не указан mapper, на входе reducer не будет данных о том, из каких входных таблиц пришли записи.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"descriptors\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/table-switch.html#descriptors\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дескрипторы&lt;/span&gt;&lt;/a&gt;Дескрипторы&lt;/h2&gt;\n\n&lt;p&gt;Существуют &lt;strong&gt;правила нумерации дескрипторов&lt;/strong&gt;, которые позволят пользовательскому коду (джобу) записать строку Х в таблицу 0, а строку Y в таблицу 1.&lt;/p&gt;\n&lt;p&gt;Когда выходная таблица одна — джоб пишет все записи в дескриптор 1 (в stdout).&lt;br /&gt;\nКогда выходных таблиц несколько, применяются правила нумерации, формула  3k+1, где k — индекс выходной таблицы, начинается с 0:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Таблица 0 — дескриптор 1;&lt;/li&gt;\n&lt;li&gt;Таблица 1 — дескриптор 4;&lt;/li&gt;\n&lt;li&gt;Таблица 2 — дескриптор 7;&lt;/li&gt;\n&lt;li&gt;...&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"switches\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/table-switch.html#switches\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Переключатели таблиц&lt;/span&gt;&lt;/a&gt;Переключатели таблиц&lt;/h2&gt;\n&lt;p&gt;Соответствие между номерами дескрипторов и выходными таблицами можно менять в процессе работы джоба с помощью &lt;strong&gt;переключателей таблиц&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Схему настройки переключателей входных таблиц можно прочесть в разделе &lt;a href=\"user-guide/storage/io-configuration.html\"&gt;Настройки ввода/вывода&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Форма переключателей зависит от формата выходных данных.&lt;/p&gt;\n&lt;h3 id=\"yson\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/table-switch.html#yson\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YSON&lt;/span&gt;&lt;/a&gt;YSON&lt;/h3&gt;\n&lt;p&gt;В &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON&lt;/a&gt; и для входных и для выходных таблиц в потоке записей может встретиться &lt;a href=\"user-guide/storage/yson.html#entity\"&gt;entity&lt;/a&gt; с атрибутами. Это управляющие команды, встроенные в поток данных. Например: &lt;code&gt;table_index=N&lt;/code&gt;, где N — integer. Эта команда «переключает» поток таким образом, что последующие записи относятся к другой таблице с индексом N. Это верно и для входных, и для выходных таблиц.&lt;/p&gt;\n&lt;p&gt;Допустим, у нашей операции на выходе 2 выходные таблицы. По умолчанию для отправки данных в таблицу с индексом 0 необходимо записать их в дескриптор 1, а для отправки в таблицу 1 — в дескриптор 4. Предположим, что джоб записал в дескриптор 4 такую последовательность записей:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;{a=1};\n&amp;lt;table_index=0&amp;gt;#;\n{b=2};\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"82\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-82\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-82\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-82.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В таком случае запись &lt;code&gt;a=1&lt;/code&gt; попадет в таблицу 1, а запись &lt;code&gt;b=2&lt;/code&gt; в таблицу 0, и оба дескриптора после этого будут писать в таблицу 0.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Порядок строк при записи в одну таблицу через два дескриптора не определен.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Переключатели работают независимо для каждого выходного дескриптора.&lt;/p&gt;\n&lt;p&gt;Допустим, дескриптор N соответствует таблице X. При записи в дескриптор N 10 строк без переключателей, они попадут в таблицу X ровно в том порядке, в котором были записаны в дескриптор. Никаких других строк между ними не появится.&lt;/p&gt;\n&lt;p&gt;Допустим дескрипторы N и M соответствуют таблице X. При записи 5 строк в дескриптор N и 5 строк в дескриптор M, все строки окажутся в таблице X, однако порядок их будет неизвестен. Даже при условии, что пользовательский код пишет сначала только в дескриптор N, а потом только в дескриптор M, нельзя гарантировать, что строки из N будут лежать в таблице X раньше строк из M, или что они не перемешаются.&lt;/p&gt;\n&lt;h3 id=\"json\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/table-switch.html#json\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;JSON&lt;/span&gt;&lt;/a&gt;JSON&lt;/h3&gt;\n&lt;p&gt;Работает по аналогии с &lt;a href=\"ru/user-guide/data-processing/operations/table-switch.html#yson\"&gt;YSON&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Переключатель таблицы:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;'&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"$value\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;&lt;span class=\"hljs-keyword\"&gt;null&lt;/span&gt;&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"$attributes\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"table_index\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\\n'\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"114\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-114\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-114\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-114.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"dsv\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/table-switch.html#dsv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DSV&lt;/span&gt;&lt;/a&gt;DSV&lt;/h3&gt;\n&lt;p&gt;Строго говоря, формат и его производные не поддерживают переключатели как отдельную управляющую команду в потоке данных. Каждая запись данных должна содержать информацию об индексе таблицы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"user-guide/storage/formats.html#dsv\"&gt;DSV&lt;/a&gt; не поддерживает переключение выходных таблиц.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;У входных таблиц при включенной опции формата &lt;code&gt;enable_table_index&lt;/code&gt; каждая строка будет дополнена служебным полем, содержащим индекс таблицы. По умолчанию имя поля — &lt;code&gt;@table_index&lt;/code&gt;. Имя поля можно изменить через опцию формата &lt;code&gt;table_index_column&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Все строки из таблицы &lt;code&gt;//path/to/table&lt;/code&gt;, которая имела номер N в списке входных таблиц операции, будут иметь одинаковое значение поля &lt;code&gt;@table_index&lt;/code&gt;, равное N.&lt;/p&gt;\n&lt;h3 id=\"schemaful_dsv\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/table-switch.html#schemaful_dsv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SCHEMAFUL_DSV&lt;/span&gt;&lt;/a&gt;SCHEMAFUL_DSV&lt;/h3&gt;\n&lt;p&gt;При установке опции &lt;code&gt;enable_table_index=true&lt;/code&gt; для таблиц в формате &lt;a href=\"user-guide/storage/formats.html#schemaful_dsv\"&gt;SCHEMAFUL_DSV&lt;/a&gt; во всех строках таблицы первым полем, перед колонами схемы, будет записан индекс таблицы.&lt;/p&gt;\n&lt;h2 id=\"primery\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/table-switch.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-comment\"&gt;# -*- coding: utf-8 -*-&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\n\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; datetime &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; datetime\n\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;parse_time&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;time_str&lt;/span&gt;):\n    &lt;span class=\"hljs-string\"&gt;\"2012-10-19T11:22:58.190448Z\"&lt;/span&gt;\n    &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; datetime.strptime(time_str, &lt;span class=\"hljs-string\"&gt;\"%Y-%m-%dT%H:%M:%S.%fZ\"&lt;/span&gt;)\n\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;get_duration&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;rowA, rowB&lt;/span&gt;):\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; rowA[&lt;span class=\"hljs-string\"&gt;\"event_type\"&lt;/span&gt;] == &lt;span class=\"hljs-string\"&gt;\"job_completed\"&lt;/span&gt;:\n        rowA, rowB = rowB, rowA\n    delta = parse_time(rowB[&lt;span class=\"hljs-string\"&gt;\"timestamp\"&lt;/span&gt;]) - parse_time(rowA[&lt;span class=\"hljs-string\"&gt;\"timestamp\"&lt;/span&gt;])\n    &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; delta.total_seconds() + (delta.microseconds / &lt;span class=\"hljs-number\"&gt;1000000.0&lt;/span&gt;)\n\n&lt;span class=\"hljs-comment\"&gt;# По-дефолту map-функция принимает на вход одну запись.&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# Любая функция, запускаемая в качестве операции должна быть генератором.&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;filter_event_type&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;row&lt;/span&gt;):\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; row.get(&lt;span class=\"hljs-string\"&gt;\"event_type\"&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; [&lt;span class=\"hljs-string\"&gt;\"job_started\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"job_completed\"&lt;/span&gt;]:\n        &lt;span class=\"hljs-keyword\"&gt;yield&lt;/span&gt; row\n\n&lt;span class=\"hljs-comment\"&gt;# В случае reduce-функции на вход приходит ключ (это мапа из ключевых колонок в их значения) и список записей.&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# У каждой записи ключевые колонки равны тому, что лежит в key&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;calculate_duration&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;key, rows&lt;/span&gt;):\n    rows = &lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(rows)\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;len&lt;/span&gt;(rows) == &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;:\n        &lt;span class=\"hljs-keyword\"&gt;yield&lt;/span&gt; {&lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt;: key[&lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt;], &lt;span class=\"hljs-string\"&gt;\"duration\"&lt;/span&gt;: get_duration(*rows)}\n    &lt;span class=\"hljs-keyword\"&gt;else&lt;/span&gt;:\n        &lt;span class=\"hljs-keyword\"&gt;assert&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;len&lt;/span&gt;(rows) == &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n        row = rows[&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;]\n        &lt;span class=\"hljs-comment\"&gt;# Выставить номер выходной таблицы можно через специальное поле&lt;/span&gt;\n        row[&lt;span class=\"hljs-string\"&gt;\"@table_index\"&lt;/span&gt;] = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n        &lt;span class=\"hljs-keyword\"&gt;yield&lt;/span&gt; row\n\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; __name__ == &lt;span class=\"hljs-string\"&gt;\"__main__\"&lt;/span&gt;:\n    yt.config[&lt;span class=\"hljs-string\"&gt;\"tabular_data_format\"&lt;/span&gt;] = yt.JsonFormat(control_attributes_mode=&lt;span class=\"hljs-string\"&gt;\"row_fields\"&lt;/span&gt;)\n    yt.run_map_reduce(filter_event_type, calculate_duration,\n                      &lt;span class=\"hljs-string\"&gt;\"//tmp/forbeginners/event_log\"&lt;/span&gt;,\n                      [&lt;span class=\"hljs-string\"&gt;\"//tmp/forbeginners/durations\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/forbeginners/filtered\"&lt;/span&gt;],\n                      reduce_by=&lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"146\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-146\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-146\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-146.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Пример переключения между выходными таблицами с &lt;code&gt;table_index&lt;/code&gt; при &lt;code&gt;control_attributes_mode=\"iterator\"&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\n\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; random\n\n&lt;span class=\"hljs-meta\"&gt;@yt.aggregator&lt;/span&gt;\n&lt;span class=\"hljs-meta\"&gt;@yt.with_context&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;mapper&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;rows, context&lt;/span&gt;):\n    &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; row &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; rows:\n        input_table_index = context.table_index\n        &lt;span class=\"hljs-built_in\"&gt;sum&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n        &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; input_table_index == &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;:\n            &lt;span class=\"hljs-built_in\"&gt;sum&lt;/span&gt; += &lt;span class=\"hljs-built_in\"&gt;int&lt;/span&gt;(row[&lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;])\n        &lt;span class=\"hljs-keyword\"&gt;else&lt;/span&gt;:\n            &lt;span class=\"hljs-built_in\"&gt;sum&lt;/span&gt; -= &lt;span class=\"hljs-built_in\"&gt;int&lt;/span&gt;(row[&lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;])\n\n        output_table_index = random.randint(&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;)\n        &lt;span class=\"hljs-comment\"&gt;# функция позволяет создать запись, являющую переключателем на таблицу с указанным индексом.&lt;/span&gt;\n        &lt;span class=\"hljs-keyword\"&gt;yield&lt;/span&gt; yt.create_table_switch(output_table_index)\n        &lt;span class=\"hljs-keyword\"&gt;yield&lt;/span&gt; {&lt;span class=\"hljs-string\"&gt;\"sum\"&lt;/span&gt;: &lt;span class=\"hljs-built_in\"&gt;sum&lt;/span&gt;}\n\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; __name__ == &lt;span class=\"hljs-string\"&gt;\"__main__\"&lt;/span&gt;:\n    yt.run_map(mapper,\n               [&lt;span class=\"hljs-string\"&gt;\"//tmp/input1\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/input2\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/input3\"&lt;/span&gt;],\n               [&lt;span class=\"hljs-string\"&gt;\"//tmp/output1\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/output2\"&lt;/span&gt;],\n               &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=yt.YsonFormat(control_attributes_mode=&lt;span class=\"hljs-string\"&gt;\"iterator\"&lt;/span&gt;))\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"150\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-150\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-150\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-150.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/operations/table-switch.md","sourcePath":"ru/user-guide/data-processing/operations/table-switch.md"},"headings":[{"title":"Дескрипторы","href":"ru/user-guide/data-processing/operations/table-switch.html#descriptors","level":2},{"title":"Переключатели таблиц","href":"ru/user-guide/data-processing/operations/table-switch.html#switches","level":2,"items":[{"title":"YSON","href":"ru/user-guide/data-processing/operations/table-switch.html#yson","level":3},{"title":"JSON","href":"ru/user-guide/data-processing/operations/table-switch.html#json","level":3},{"title":"DSV","href":"ru/user-guide/data-processing/operations/table-switch.html#dsv","level":3},{"title":"SCHEMAFUL_DSV","href":"ru/user-guide/data-processing/operations/table-switch.html#schemaful_dsv","level":3}]},{"title":"Примеры","href":"ru/user-guide/
