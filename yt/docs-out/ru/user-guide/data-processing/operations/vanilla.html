        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Vanilla операция отличается от других операций, так как у неё отсутствуют входные таблицы, но могут быть указаны выходные таблицы, таблица для сохранения данных из стандартного потока ошибок (stderr таблицы) и таблицы с coredump. Операцию Vanilla можно использовать в ситуации, когда требуется запустить распределённый процесс, описав несколько видов джобов и указав желаемое количество джобов каждого вида. &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;Планировщик YTsaurus&lt;/a&gt; берёт на себя функцию поддержания жизнедеятельности данного распределённого процесса, добиваясь того, чтобы нужное количество джобов каждого вида было запланировано и успешно завершилось, как и в любой другой операции YTsaurus.&lt;/p&gt;\n&lt;p&gt;Получение входных данных джобом Vanilla операции выполняется с помощью опции &lt;code&gt;file_paths&lt;/code&gt; в спецификации пользовательского скрипта или путём чтения данных джобом напрямую по сети.&lt;/p&gt;\n&lt;p&gt;При загрузке данных в джоб напрямую по сети предварительно обсудите предполагаемый способ использования с администратором системы YTsaurus и с сервисом, откуда вы планируете забирать данные, чтобы не создать слишком большую нагрузку на сеть и сервис-источник данных.&lt;/p&gt;\n&lt;p&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Вся координация и распределение работы между запущенными джобами, а также поддержание консистентности в случае перезапусков джобов ложится на пользователя.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Выходные данные джоб может как писать по сети (в таком случае следует также оценить нагрузку на сеть), так и выводить в таблицы. Для каждого вида джобов при этом будут свои выходные таблицы.&lt;/p&gt;\n&lt;p&gt;Основной частью описания операции Vanilla является перечисление всевозможных &lt;strong&gt;тасков&lt;/strong&gt;. В экосистеме YTsaurus таск  — это группа джобов одного вида, запущенных в рамках операции. Описание таска представляет из себя описание пользовательского скрипта, указание количества джобов, которые должны запуститься в рамках этого таска и, возможно, описание выходных таблиц из данного таска.&lt;/p&gt;\n&lt;p&gt;Описание таска в операции Vanilla очень похоже на описание пользовательского скрипта, но стоит разделять эти понятия, потому что они отвечают разным сущностям в &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;Планировщике&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Описание пользовательского скрипта — это исключительно указание того, как нужно запускать пользовательский код на машине. В нём нет информации о том, какой объём данных необходимо передать каждому джобу. Например: опция &lt;code&gt;data_weight_per_map_job&lt;/code&gt; в операции MapReduce не занесена в спецификацию пользовательского скрипта, потому что она не имеет отношения к тому, как нужно запускать пользовательский скрипт map стадии, который может отсутствовать.&lt;/p&gt;\n&lt;p&gt;Описание таска — это спецификация того, как планировщик должен управлять джобами данного вида. Данное понятие встречается только в операции Vanilla, и в нём оно практически не отличается от описания пользовательского скрипта.&lt;/p&gt;\n&lt;p&gt;Общие параметры для всех типов операций описаны в разделе &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Настройки операций&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;У операции Vanilla имеются следующие дополнительные параметры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;tasks&lt;/code&gt; — словарь, описывающий таски операции. Каждому таску должна соответствовать пара ключ-значение, где ключом является название таска, а значение — спецификация таска. В YTsaurus предпочтителен lowercase_with_underscores стиль именования тасков, например &lt;code&gt;partition_map&lt;/code&gt;. Название таска будет отображено в веб-интерфейсе на странице операции, а также будет доступно в виде ключей в yson-представлении прогресса операции, поэтому не стоит делать его слишком длинным. Спецификация таска состоит из тех же параметров, что и спецификация пользовательского скрипта, а также содержит дополнительные параметры:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;job_count&lt;/code&gt; — количество джобов данного вида, которые должны запуститься в рамках конкретного таска. В случае когда опция &lt;code&gt;fail_on_job_restart&lt;/code&gt;  в спецификации операции не установлена, таск будет считаться успешно завершённым, если ровно &lt;code&gt;job_count&lt;/code&gt; джобов данного вида успешно завершилось (то есть, завершилось с кодом 0 и не было прервано по каким-то причинам);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;output_table_paths&lt;/code&gt; — список выходных таблиц (возможно пустой). В случае, когда одна и та же таблица является выходной для разных тасков, во всех вхождениях на ней должны быть указаны одинаковые атрибуты на путях.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;С помощью опций &lt;code&gt;max_failed_job_count&lt;/code&gt; и &lt;code&gt;fail_on_job_restart&lt;/code&gt;, общих для всех операций, удобно контролировать перезапуски джобов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"primer-specifikacii\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/vanilla.html#primer-specifikacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример спецификации&lt;/span&gt;&lt;/a&gt;Пример спецификации&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;{\n  &lt;span class=\"hljs-string\"&gt;tasks&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; {\n    &lt;span class=\"hljs-string\"&gt;master&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; {\n      &lt;span class=\"hljs-string\"&gt;job_count&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n      &lt;span class=\"hljs-string\"&gt;command&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"python run_master.py &amp;lt; duties.dat\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n      &lt;span class=\"hljs-string\"&gt;file_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [&lt;span class=\"hljs-string\"&gt;\"//tmp/run_master.py\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&amp;lt;file_name=duties.dat&amp;gt;//tmp/duties_180124.dat\"&lt;/span&gt;]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n    }&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;slave&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; {\n      &lt;span class=\"hljs-string\"&gt;job_count&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;100&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n      &lt;span class=\"hljs-string\"&gt;command&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"python run_slave.py\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n      &lt;span class=\"hljs-string\"&gt;file_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [&lt;span class=\"hljs-string\"&gt;\"//tmp/run_slave.py\"&lt;/span&gt;]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n    }&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  }&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;max_failed_job_count&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;stderr_table_path&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"//tmp/stderrs\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"75\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-75\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-75\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-75.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/operations/vanilla.md","sourcePath":"ru/user-guide/data-processing/operations/vanilla.md"},"headings":[{"title":"Пример спецификации","href":"ru/user-guide/data-processing/operations/vanilla.html#primer-specifikacii","level":2}],"title":"Vanilla"},"router":{"pathname":"ru/user-guide/data-processing/operations/vanilla","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
