        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"event-log\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/logs.html#event-log\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Event log &lt;/span&gt;&lt;/a&gt;Event log &lt;/h2&gt;\n&lt;p&gt;&lt;em&gt;Event log&lt;/em&gt; – это специальный формат лога в Spark. Лог пишет &lt;a href=\"user-guide/data-processing/spyt/cluster/cluster-desc.html#spark-app\"&gt;драйвер&lt;/a&gt;, а читает специальный сервис &lt;em&gt;Spark History Server (SHS)&lt;/em&gt;. SHS запускается вместе с мастером и воркерами при старте кластера SPYT. SHS по логу рисует UI, аналогичный Spark UI.&lt;/p&gt;\n&lt;p&gt;Отличие между ними в том, что Spark UI доступен на драйвере в момент выполнения джобы, а SHS поднят всегда и может прочитать логи джобов, которые уже завершились.&lt;br /&gt;\nЛоги записываются в &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;динамическую таблицу&lt;/a&gt; внутри &lt;code&gt;discovery-path&lt;/code&gt;. SHS умеет удалять их &lt;a href=\"ru/user-guide/data-processing/spyt/logs.html#log-settings\"&gt;автоматически&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"log-on\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/logs.html#log-on\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Включение&lt;/span&gt;&lt;/a&gt;Включение&lt;/h2&gt;\n&lt;p&gt;При запуске джобы укажите в конфигурации &lt;code&gt;spark.eventLog.enabled=true&lt;/code&gt;, например:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ spark-submit-yt ... --conf spark.eventLog.enabled=&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"15\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-15\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-15\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-15.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"log-settings\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/logs.html#log-settings\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройка&lt;/span&gt;&lt;/a&gt;Настройка&lt;/h2&gt;\n&lt;p&gt;Подробно настройки SHS описаны в &lt;a href=\"https://spark.apache.org/docs/latest/monitoring.html#spark-history-server-configuration-options\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;документации Spark&lt;/a&gt;. Любые настройки из приведённого описания можно передавать в &lt;code&gt;spark-launch-yt ... --params '{spark_conf={\"spark.param\"=value;...}}'&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;По умолчанию значение параметра &lt;code&gt;spark.history.fs.cleaner.enabled&lt;/code&gt; выставлено в &lt;code&gt;true&lt;/code&gt;. Значения по умолчанию других параметров такое же как в документации к Spark. При настройках по умолчанию SHS удаляет логи старше недели. Срок хранения логов можно изменить следующей настройкой: &lt;code&gt;spark.history.fs.cleaner.maxAge&lt;/code&gt; (&lt;code&gt;spark-launch-yt ... --params '{spark_conf={\"spark.history.fs.cleaner.maxAge\"=\"14d\";...}}'&lt;/code&gt;).&lt;/p&gt;\n&lt;h2 id=\"logi-s-vorkerov\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/logs.html#logi-s-vorkerov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Логи с воркеров&lt;/span&gt;&lt;/a&gt;Логи с воркеров&lt;/h2&gt;\n&lt;p&gt;При запуске кластера можно настроить отправку логов с &lt;a href=\"user-guide/data-processing/spyt/cluster/cluster-desc.html#spark-standalone\"&gt;воркеров&lt;/a&gt; в YTsaurus таблицы. Логи будут записываться по пути &lt;code&gt;{cluster_path}/logs/worker_log&lt;/code&gt;, под каждую дату будет создаваться отдельная таблица. Для включения отправки логов при запуске кластера необходимо использовать следующие опции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;--enable-worker-log-transfer&lt;/code&gt; – включает пересылку логов;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--enable-worker-log-json-mode&lt;/code&gt; – включает json-режим работы логов. Данные в таблице представляются в более удобном формате, разбиваются на составные части. При отключенной опции логи записываются в одну колонку &lt;code&gt;message&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--worker-log-update-interval ...&lt;/code&gt; – задает периодичность отправки логов, по умолчанию – 10 минут (10m), не может быть меньше 1 минуты;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--worker-log-table-ttl ...&lt;/code&gt; – устанавливает время жизни таблиц, по умолчанию – 7 дней (7d).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Посмотреть логи можно в SHS, при просмотре вкладки &lt;em&gt;executors&lt;/em&gt; любого &lt;em&gt;application&lt;/em&gt; у каждого воркера есть ссылки с префиксом &lt;code&gt;[HS]&lt;/code&gt;. Страница логов формируется по таблицам из YTsaurus и, следовательно, доступна, даже если воркера уже нет. Лог существует, пока соответствующая таблица не удалена:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-launch-yt ... \\\n  --enable-worker-log-transfer \\\n  --enable-worker-log-json-mode \\\n  --worker-log-update-interval 30m \\\n  --worker-log-table-ttl 30d\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"56\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-56\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-56\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-56.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/spyt/logs.md","sourcePath":"ru/user-guide/data-processing/spyt/logs.md"},"headings":[{"title":"Event log ","href":"ru/user-guide/data-processing/spyt/logs.html#event-log","level":2},{"title":"Включение","href":"ru/user-guide/data-processing/spyt/logs.html#log-on","level":2},{"title":"Настройка","href":"ru/user-guide/data-processing/spyt/logs.html#log-settings","level":2},{"title":"Логи с воркеров","href":"ru/user-guide/data-processing/spyt/logs.html#logi-s-vorkerov","level":2}],"title":"Логи"},"router":{"pathname":"ru/user-guide/data-processing/spyt/logs","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
