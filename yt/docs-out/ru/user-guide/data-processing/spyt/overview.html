            {"data":{"leading":false,"html":"&lt;h2 id=\"what-is-spark\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/overview.html#what-is-spark\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что такое Spark?&lt;/span&gt;&lt;/a&gt;Что такое Spark?&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"https://spark.apache.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apache Spark&lt;/a&gt; — это фреймворк для расчетов на больших данных (джойнов, группировок, фильтраций и т. д.).&lt;/p&gt;\n&lt;p&gt;Spark обрабатывает данные в оперативной памяти. Ключевое отличие процессинга в памяти от \"классического\" MapReduce образца 2005 года в том, что данные минимально затрагивают диск при работе, а значит, минимизируются расходы на IO — самую медленную часть процессинга. Для одиночной Map операции эффект от использования Spark не будет заметен. Но уже для одного каскада Map и Reduce удается избежать записи промежуточных результатов на диск при условии, что памяти будет достаточно.&lt;/p&gt;\n&lt;p&gt;Для каждого последующего каскада MapReduce экономия нарастает, появляется возможность кешировать результаты. Для больших и сложных аналитических пайплайнов рост производительности будет многократным.&lt;/p&gt;\n&lt;p&gt;Также Spark вооружен полноценным оптимизатором запросов &lt;a href=\"https://github.com/tupol/spark-catalyst-study/blob/master/docs/catalyst-description.md\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Catalyst&lt;/a&gt;, который планирует выполнение и учитывает:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;расположение и объёмы входных данных;&lt;/li&gt;\n&lt;li&gt;протягивание предикатов до файловой системы;&lt;/li&gt;\n&lt;li&gt;целесообразность и порядок шагов при исполнении запроса;&lt;/li&gt;\n&lt;li&gt;набор атрибутов в конечной таблице;&lt;/li&gt;\n&lt;li&gt;локальность данных при обработке;&lt;/li&gt;\n&lt;li&gt;возможную конвейеризацию вычислений.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"kak-spark-integrirovan-s-ytsaurus\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/overview.html#kak-spark-integrirovan-s-ytsaurus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как Spark интегрирован с YTsaurus&lt;/span&gt;&lt;/a&gt;Как Spark интегрирован с YTsaurus&lt;/h2&gt;\n&lt;p&gt;Подробности интеграции Spark c YTsaurus можно узнать в &lt;a href=\"https://youtu.be/gZ7m-2_LqB0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;вебинаре&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"what-is-spyt\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/overview.html#what-is-spyt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что такое SPYT?&lt;/span&gt;&lt;/a&gt;Что такое SPYT?&lt;/h2&gt;\n&lt;p&gt;SPYT powered by Apache Spark позволяет запускать Spark-кластер на вычислительных мощностях YTsaurus. Кластер запускается в &lt;a href=\"ru/user-guide/data-processing/operations/vanilla.html\"&gt;Vanilla-операции YTsaurus&lt;/a&gt;, затем забирает некоторое количество ресурсов из квоты и занимает их постоянно. Spark может читать как &lt;a href=\"ru/user-guide/storage/static-tables.html\"&gt;статические&lt;/a&gt;, так и &lt;a href=\"ru/user-guide/dynamic-tables/overview.html\"&gt;динамические таблицы YTsaurus&lt;/a&gt;, делать на них расчеты и писать результат в статическую таблицу.&lt;/p&gt;\n&lt;h2 id=\"spyt-compatibility\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/overview.html#spyt-compatibility\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Совместимость версий SPYT с версиями Apache Spark, Java, Scala, Python&lt;/span&gt;&lt;/a&gt;Совместимость версий SPYT с версиями Apache Spark, Java, Scala, Python&lt;/h2&gt;\n&lt;table&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;strong&gt;Версия SPYT&lt;/strong&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;strong&gt;Версия Spark&lt;/strong&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;strong&gt;Java&lt;/strong&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;strong&gt;Scala&lt;/strong&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;strong&gt;Python&lt;/strong&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;1.x.x, 2.0.x&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;3.2.2&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;11&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;2.12&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;3.8, 3.9, 3.11, 3.12&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;2.1.x, 2.2.x&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;3.2.2 - 3.2.4&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;11&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;2.12&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;3.8, 3.9, 3.11, 3.12&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;2.3.x, 2.4.x&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;3.2.2 - 3.3.4&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;11&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;2.12&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;3.8, 3.9, 3.11, 3.12&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;2.5.0&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;3.2.2 - 3.5.3&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;11&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;2.12&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;3.8, 3.9, 3.11, 3.12&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;2.6.x, 2.7.x&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;3.2.2 - 3.5.6&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;11, 17&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;2.12&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;3.8, 3.9, 3.11, 3.12&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"what-to-do\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/overview.html#what-to-do\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Когда использовать SPYT&lt;/span&gt;&lt;/a&gt;Когда использовать SPYT&lt;/h2&gt;\n&lt;p&gt;SPYT оптимален в следующих случаев:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;разработка на Java с использованием MapReduce в YTsaurus;&lt;/li&gt;\n&lt;li&gt;оптимизация производительности пайплайна на YTsaurus с двумя и более джойнами или группировками;&lt;/li&gt;\n&lt;li&gt;написание интеграционных ETL пайплайнов из других систем хранения;&lt;/li&gt;\n&lt;li&gt;ad-hoc аналитика в интерактивном режиме с использованием &lt;code&gt;Jupyter&lt;/code&gt;, &lt;code&gt;pyspark&lt;/code&gt;, &lt;code&gt;spark-shell&lt;/code&gt; или встроенного в UI компонента &lt;a href=\"user-guide/query-tracker/about.html\"&gt;Query Tracker&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;SPYT не стоит выбирать, если:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;существует необходимость в обработке более 10 ТБ данных в одной транзакции;&lt;/li&gt;\n&lt;li&gt;процессинг сводится к единичным Map или MapReduce.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"submit\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/overview.html#submit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Способы запуска расчетов на Spark в YTsaurus&lt;/span&gt;&lt;/a&gt;Способы запуска расчетов на Spark в YTsaurus&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Отдельные запуски расчётов напрямую в YTsaurus, используя команду &lt;code&gt;spark-submit&lt;/code&gt; &lt;a href=\"user-guide/data-processing/spyt/launch.html#submit\"&gt;Подробнее&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Создание Standalone Spark кластера как постоянного ресурса внутри YTsaurus при помощи Vanilla операции &lt;a href=\"user-guide/data-processing/spyt/launch.html#standalone\"&gt;Подробнее&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"lang\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/overview.html#lang\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;На каких языках можно писать&lt;/span&gt;&lt;/a&gt;На каких языках можно писать&lt;/h2&gt;\n&lt;p&gt;Spark поддерживает следующие языки и среды разработки:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"user-guide/data-processing/spyt/API/spyt-jupyter.html\"&gt;Jupyter&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/data-processing/spyt/API/spyt-python.html\"&gt;Python&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/data-processing/spyt/API/spyt-java.html\"&gt;Java&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/data-processing/spyt/API/spyt-scala.html\"&gt;Scala&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/spyt/overview.md","sourcePath":"ru/user-guide/data-processing/spyt/overview.md"},"headings":[{"title":"Что такое Spark?","href":"ru/user-guide/data-processing/spyt/overview.html#what-is-spark","level":2},{"title":"Как Spark интегрирован с YTsaurus","href":"ru/user-guide/data-processing/spyt/overview.html#kak-spark-integrirovan-s-ytsaurus","level":2},{"title":"Что такое SPYT?","href":"ru/user-guide/data-processing/spyt/overview.html#what-is-spyt","level":2},{"title":"Совместимость версий SPYT с версиями Apache Spark, Java, Scala, Python","href":"ru/user-guide/data-processing/spyt/overview.html#spyt-compatibility","level":2},{"title":"Когда использовать SPYT","href":"ru/user-guide/data-processing/spyt/overview.html#what-to-do","level":2},{"title":"Способы запуска расчетов на Spark в YTsaurus","href":"ru/user-guide/data-processing/spyt/overview.html#submit","level":2},{"title":"На каких языках можно писать","href":"ru/user-guide/data-processing/spyt/overview.html#lang","level":2}],"title":"Обзор"},"router":{"pathname":"ru/user-guide/data-processing/spyt/overview","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_s
