        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В версии SPYT 1.77.0 появилась поддержка &lt;a href=\"https://spark.apache.org/docs/latest/streaming/index.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;стриминговых процессов&lt;/a&gt; поверх YTsaurus.&lt;/p&gt;\n&lt;h2 id=\"obshaya-shema-spark-structured-streaming-v-spyt\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/structured-streaming.html#obshaya-shema-spark-structured-streaming-v-spyt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общая схема Spark Structured Streaming в SPYT&lt;/span&gt;&lt;/a&gt;Общая схема Spark Structured Streaming в SPYT&lt;/h2&gt;\n&lt;p&gt;&lt;img src=\"images/spyt-streaming-general-scheme.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;h3 id=\"osnovnye-ponyatiya\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/structured-streaming.html#osnovnye-ponyatiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основные понятия&lt;/span&gt;&lt;/a&gt;Основные понятия&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;Очередь&lt;/code&gt; — любая упорядоченная динамическая таблица.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;Сonsumer&lt;/code&gt; — сортированная таблица с некоторой фиксированной схемой. Консьюмер находится в соотношении many-to-many с очередями и представляет из себя потребителя одной или нескольких очередей. Задача консьюмера — хранить оффсеты по партициям читаемых очередей.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;Source&lt;/code&gt; — источник данных. В стриминге поверх Queue API это очередь (упорядоченная динамическая таблица).&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;Sink&lt;/code&gt; — приёмник данных. Например, выходная динамическая таблица.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;Microbatch&lt;/code&gt; — порция данных, которая обрабатывается за одну итерацию стриминга.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;Streaming Query&lt;/code&gt; — непрерывно выполняемый процесс, который обрабатывает поток данных микробатчами. Читает данные из &lt;code&gt;Source&lt;/code&gt;, применяет заданные преобразования и записывает результаты в &lt;code&gt;Sink&lt;/code&gt;. Создается методом &lt;code&gt;start()&lt;/code&gt; класса &lt;code&gt;DataStreamWriter&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"checkpoint-location\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/structured-streaming.html#checkpoint-location\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Хранилище чекпоинтов&lt;/span&gt;&lt;/a&gt;Хранилище чекпоинтов&lt;/h2&gt;\n&lt;p&gt;YTsaurus может выступать в роли надежного хранилища оффсетов и других метаданных. Для этого необходимо указать опцию &lt;code&gt;checkpointLocation&lt;/code&gt; со значением &lt;code&gt;yt:///...&lt;/code&gt;. После чего вся метаинформация об этой задаче будет сохраняться по указанному пути.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Листинг 1 — Пример использования хранилища чекпоинтов&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs scala\"&gt;&lt;span class=\"hljs-keyword\"&gt;val&lt;/span&gt; numbers = spark\n  .readStream\n  .format(&lt;span class=\"hljs-string\"&gt;\"rate\"&lt;/span&gt;)\n  .option(&lt;span class=\"hljs-string\"&gt;\"rowsPerSecond\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;)\n  .load()\n  .select($&lt;span class=\"hljs-string\"&gt;\"timestamp\"&lt;/span&gt;, floor(rand() * &lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;).as(&lt;span class=\"hljs-string\"&gt;\"num\"&lt;/span&gt;))\n\n&lt;span class=\"hljs-keyword\"&gt;val&lt;/span&gt; groupedNumbers = numbers\n  .withWatermark(&lt;span class=\"hljs-string\"&gt;\"timestamp\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"5 seconds\"&lt;/span&gt;)\n  .groupBy(window($&lt;span class=\"hljs-string\"&gt;\"timestamp\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"5 seconds\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"3 seconds\"&lt;/span&gt;), $&lt;span class=\"hljs-string\"&gt;\"num\"&lt;/span&gt;)\n  .count()\n\n&lt;span class=\"hljs-keyword\"&gt;val&lt;/span&gt; job = groupedNumbers\n  .writeStream\n  .option(&lt;span class=\"hljs-string\"&gt;\"checkpointLocation\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"yt:///tmp/spark-streaming/sample01/checkpoints\"&lt;/span&gt;)\n  .trigger(&lt;span class=\"hljs-type\"&gt;ProcessingTime&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;1000&lt;/span&gt;))\n  .foreachBatch { (frame: &lt;span class=\"hljs-type\"&gt;DataFrame&lt;/span&gt;, batchNum: &lt;span class=\"hljs-type\"&gt;Long&lt;/span&gt;) =&amp;gt;\n    frame.write.mode(&lt;span class=\"hljs-type\"&gt;SaveMode&lt;/span&gt;.&lt;span class=\"hljs-type\"&gt;Append&lt;/span&gt;).yt(&lt;span class=\"hljs-string\"&gt;\"//tmp/spark-streaming/sample01/result\"&lt;/span&gt;)\n  }\n\n&lt;span class=\"hljs-keyword\"&gt;val&lt;/span&gt; query = job.start()\nquery.awaitTermination()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"39\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-39\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-39\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-39.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"queues\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/structured-streaming.html#queues\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стриминг очередей YTsaurus&lt;/span&gt;&lt;/a&gt;Стриминг очередей YTsaurus&lt;/h2&gt;\n&lt;p&gt;YTsaurus имеет собственную реализацию &lt;a href=\"user-guide/dynamic-tables/queues.html\"&gt;очередей&lt;/a&gt;, основанных на упорядоченных динамических таблицах.&lt;/p&gt;\n&lt;p&gt;На текущий момент SPYT кластер способен оперировать только с данными, расположенными на том же кластере YTsaurus. Это ограничение накладывается и на консьюмеры/очереди.&lt;/p&gt;\n&lt;p&gt;Перед запуском стриминговой задачи необходимо создать и настроить очереди в соответствии с &lt;a href=\"user-guide/dynamic-tables/queues.html#api\"&gt;документацией&lt;/a&gt;. В случае чтения — создать таблицы очередей и консьюмеров, произвести регистрацию. Запись результатов стриминга производится в упорядоченную динамическую таблицу, созданную и примонтированную заранее.&lt;/p&gt;\n&lt;p&gt;После обработки очередной порции данных совершается коммит нового смещения, что позволяет уведомлять входную таблицу о возможности удалить неактуальные строки.&lt;/p&gt;\n&lt;p&gt;При использовании очередей на чтение и на запись действуют гарантии at-least-once.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Листинг 2 — Пример использования очередей на языке Scala&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs scala\"&gt;&lt;span class=\"hljs-keyword\"&gt;val&lt;/span&gt; numbers = spark\n  .readStream\n  .format(&lt;span class=\"hljs-string\"&gt;\"yt\"&lt;/span&gt;)\n  .option(&lt;span class=\"hljs-string\"&gt;\"consumer_path\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/spark-streaming/sample02/consumer\"&lt;/span&gt;)\n  .load(&lt;span class=\"hljs-string\"&gt;\"//tmp/spark-streaming/sample02/queue\"&lt;/span&gt;)\n\n&lt;span class=\"hljs-keyword\"&gt;val&lt;/span&gt; job = numbers\n  .writeStream\n  .option(&lt;span class=\"hljs-string\"&gt;\"checkpointLocation\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"yt:///tmp/spark-streaming/sample02/checkpoints\"&lt;/span&gt;)\n  .trigger(&lt;span class=\"hljs-type\"&gt;ProcessingTime&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;2000&lt;/span&gt;))\n  .format(&lt;span class=\"hljs-string\"&gt;\"yt\"&lt;/span&gt;)\n  .option(&lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/spark-streaming/sample02/result\"&lt;/span&gt;)\n\n&lt;span class=\"hljs-keyword\"&gt;val&lt;/span&gt; query = job.start()\nquery.awaitTermination()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"61\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-61\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-61\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-61.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;small&gt;Листинг 3 — Пример использования очередей на языке Python&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; pyspark.sql.functions &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; length\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; spyt &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; spark_session\n\n&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; spark_session() &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; spark:\n    df = spark \\\n        .readStream \\\n        .&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"yt\"&lt;/span&gt;) \\\n        .option(&lt;span class=\"hljs-string\"&gt;\"consumer_path\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/spark-streaming/sample02/consumer\"&lt;/span&gt;) \\\n        .load(&lt;span class=\"hljs-string\"&gt;\"//tmp/spark-streaming/sample02/queue\"&lt;/span&gt;)\n    df\\\n        .select(&lt;span class=\"hljs-string\"&gt;\"data\"&lt;/span&gt;) \\\n        .withColumn(&lt;span class=\"hljs-string\"&gt;'data_length'&lt;/span&gt;, length(&lt;span class=\"hljs-string\"&gt;\"data\"&lt;/span&gt;)) \\\n        .writeStream \\\n        .&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"yt\"&lt;/span&gt;) \\\n        .option(&lt;span class=\"hljs-string\"&gt;\"checkpointLocation\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"yt:///tmp/spark-streaming/sample02/checkpoints\"&lt;/span&gt;) \\\n        .option(&lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/spark-streaming/sample02/result\"&lt;/span&gt;) \\\n        .start().awaitTermination()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"65\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-65\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-65\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-65.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"streaming-query-processing-mechanism\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/structured-streaming.html#streaming-query-processing-mechanism\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Механизм обработки микробатча в Streaming Query&lt;/span&gt;&lt;/a&gt;Механизм обработки микробатча в Streaming Query&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Инициализация батча&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Драйвер запускает обработку нового микробатча &lt;strong&gt;#N&lt;/strong&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Получает текущие оффсеты (lowerIndex) для всех партиций очереди.&lt;/li&gt;\n&lt;li&gt;Вычисляет upperIndex для каждой партиции по формуле:\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;upperIndex = min(\n    lowerIndex + max_rows_per_partition,\n    текущий_конец_очереди\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"87\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-87\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-87\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-87.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Сравнение lowerIndex и upperIndex&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Для каждой партиции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Если lowerIndex &amp;lt; upperIndex:\n&lt;ul&gt;\n&lt;li&gt;Выполняется метод &lt;a href=\"user-guide/dynamic-tables/queues.html#rabota-s-konsyumerom\"&gt;advanceConsumer&lt;/a&gt; для фиксации оффсетов батча &lt;code&gt;#N-1&lt;/code&gt; в консьюмере.&lt;/li&gt;\n&lt;li&gt;Формирует таски для экзекьюторов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Иначе: пропускает обработку (пустой батч).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Исполнение на экзекьюторах&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Каждый экзекьютор для своей партиции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Читает данные, используя метод &lt;a href=\"user-guide/dynamic-tables/queues.html#chtenie-dannyh\"&gt;pullConsumer&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Применяет трансформации (если есть).&lt;/li&gt;\n&lt;li&gt;Пишет данные в выходную таблицу.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Создание чекпоинт файлов на Кипарисе для батча #N&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Файл в директории &lt;code&gt;offsets&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Файл в директории &lt;code&gt;commits&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Новая итерация&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Система переходит к батчу &lt;code&gt;#N+1&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Повторяет шаги 1-3 с новыми оффсетами.&lt;/li&gt;\n&lt;li&gt;Только на 2 этапе итерации &lt;code&gt;#N+1&lt;/code&gt; вызывается commit батча &lt;strong&gt;#N&lt;/strong&gt;, если есть доступные строки.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"streaming-offsets\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/structured-streaming.html#streaming-offsets\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с оффсетами&lt;/span&gt;&lt;/a&gt;Работа с оффсетами&lt;/h2&gt;\n&lt;p&gt;На текущий момент оффсеты хранятся в 2 местах:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;В &lt;a href=\"user-guide/data-processing/spyt/structured-streaming#checkpoint-location\"&gt;чекпоинт файлах&lt;/a&gt;, создаваемых Sparkом автоматически в директории.&lt;/li&gt;\n&lt;li&gt;В таблице consumer.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"opredelenie-lowerindex-i-upperindex-dlya-kazhdoj-particii\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/structured-streaming.html#opredelenie-lowerindex-i-upperindex-dlya-kazhdoj-particii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение lowerIndex и upperIndex для каждой партиции&lt;/span&gt;&lt;/a&gt;Определение lowerIndex и upperIndex для каждой партиции&lt;/h3&gt;\n&lt;ol&gt;\n&lt;li&gt;Spark пытается найти последний чекпоинт файл на Кипарисе.\n&lt;ul&gt;\n&lt;li&gt;Если файл есть, то получает из него структуру с оффсетами, содержащую &lt;code&gt;lowerIndex&lt;/code&gt; для каждой партиции.&lt;/li&gt;\n&lt;li&gt;Если нет, то берутся оффсеты из консьюмера.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Для каждой партиции входной очереди происходит получение максимального $row_index — &lt;code&gt;upper_row_index&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Анализируется опция &lt;code&gt;max_rows_per_partition&lt;/code&gt;:\n&lt;ul&gt;\n&lt;li&gt;Если она установлена, то для каждой партиции вычисляется &lt;code&gt;upperIndex&lt;/code&gt; для каждой партиции по формуле:\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;upperIndex = min(\n    lowerIndex + max_rows_per_partition,\n    upper_row_index\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"241\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-241\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-241\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-241.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"vozmozhnyj-rassinhron-offsetov\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/structured-streaming.html#vozmozhnyj-rassinhron-offsetov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Возможный рассинхрон оффсетов&lt;/span&gt;&lt;/a&gt;Возможный рассинхрон оффсетов&lt;/h3&gt;\n&lt;p&gt;Из-за особенности позднего вызова метода &lt;code&gt;commit&lt;/code&gt;, реализованной в самом Spark, оффсеты в консьюмере могут \"отставать\" от оффсетов в чекпоинт файлах на 1 батч, если:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Батч &lt;strong&gt;#N&lt;/strong&gt; полностью обработан, но батч &lt;code&gt;#N+1&lt;/code&gt; еще не инициализирован.&lt;/li&gt;\n&lt;li&gt;Батч &lt;code&gt;#N+1&lt;/code&gt; пустой и не будет обработан, потому что во входной очереди нет (или не осталось) непрочитанных строк.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Тогда оффсеты в последнем чекпоинт файле будут соответствовать &lt;code&gt;upperIndex&lt;/code&gt; батча &lt;strong&gt;#N&lt;/strong&gt;, а поле &lt;code&gt;offset&lt;/code&gt; в консьюмере будут соответствовать &lt;code&gt;upperIndex&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"exactly-once\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/structured-streaming.html#exactly-once\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Достижение семантики exactly-once&lt;/span&gt;&lt;/a&gt;Достижение семантики exactly-once&lt;/h2&gt;\n&lt;p&gt;Spark Structured Streaming, работающий поверх YTsaurus очередей, предоставляет гарантию &lt;code&gt;at-least-once&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В некоторых сценариях возможно достичь гарантии &lt;code&gt;exactly-once&lt;/code&gt; при одновременном выполнении двух условий:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Преобразования без сохранения состояния (stateless processing)&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;К таким операциям относятся:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Простые трансформации (&lt;code&gt;select&lt;/code&gt;, &lt;code&gt;filter&lt;/code&gt;, &lt;code&gt;withColumn&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;Проекции и переименование колонок.&lt;/li&gt;\n&lt;li&gt;Любые операции, где каждая выходная строка зависит &lt;strong&gt;строго от одной входной строки&lt;/strong&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Инъективное отображение данных&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Должны соблюдаться требования:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Каждая входная строка преобразуется &lt;strong&gt;не более чем в одну выходную&lt;/strong&gt;.&lt;/li&gt;\n&lt;li&gt;Отсутствуют операции, порождающие дубликаты (например, &lt;code&gt;join&lt;/code&gt;, &lt;code&gt;groupBy&lt;/code&gt;, &lt;code&gt;union&lt;/code&gt; без дедупликации).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;strong&gt;Необходимые действия:&lt;/strong&gt;&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Установить опцию &lt;code&gt;include_service_columns&lt;/code&gt; в значение &lt;code&gt;true&lt;/code&gt;. Тогда стриминговый датафрейм будет содержать столбцы &lt;code&gt;__spyt_streaming_src_tablet_index&lt;/code&gt; и &lt;code&gt;__spyt_streaming_src_row_index&lt;/code&gt;, соответствующие столбцам &lt;code&gt;$tablet_index&lt;/code&gt; и&lt;code&gt;$row_index&lt;/code&gt; читаемой очереди.&lt;/li&gt;\n&lt;li&gt;Создать выходную сортированную динамическую таблицу с ключевыми колонками &lt;code&gt;__spyt_streaming_src_tablet_index&lt;/code&gt; и &lt;code&gt;__spyt_streaming_src_row_index&lt;/code&gt;. Можно назвать эти колонки в выходной таблице по-другому, но тогда и в датафрейме необходимо переименовать их (как в примере ниже).&lt;/li&gt;\n&lt;li&gt;Если чтение происходит из более чем одной очереди, можно добавить в датафрейм (с помощью &lt;code&gt;withColumn()&lt;/code&gt;) и в выходную таблицу ключевую колонку, содержащую уникальный идентификатор исходной очереди. Например, id или путь к очереди (как в примере ниже).&lt;/li&gt;\n&lt;li&gt;Достигаем at-most-once благодаря тому, что\n&lt;ul&gt;\n&lt;li&gt;В любой очереди комбинация значений столбцов &lt;code&gt;$tablet_index&lt;/code&gt; и &lt;code&gt;$row_index&lt;/code&gt; уникальна.&lt;/li&gt;\n&lt;li&gt;В выходной сортированной динамической таблице колонки &lt;code&gt;__spyt_streaming_src_tablet_index&lt;/code&gt; и &lt;code&gt;__spyt_streaming_src_row_index&lt;/code&gt; ключевые.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;В результате: &lt;code&gt;at-least-once&lt;/code&gt; + &lt;code&gt;at-most-once&lt;/code&gt; = &lt;code&gt;exactly-once&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Важно помнить, что использование сортированной динамической таблицы вместо упорядоченной добавляет накладные расходы на сортировку. Поэтому при отсутствии необходимости в семантике at-most-once лучше писать в упорядоченные динамические таблицы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;small&gt;Листинг 4 — Использование опции include_service_columns&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; spyt\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; pyspark.sql &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; SparkSession\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; pyspark.sql.functions &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; lit\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; YtClient\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; os\n\n\nyt = YtClient(proxy=&lt;span class=\"hljs-string\"&gt;\"hume.yt.yandex.net\"&lt;/span&gt;, token=os.environ[&lt;span class=\"hljs-string\"&gt;'YT_SECURE_VAULT_YT_TOKEN'&lt;/span&gt;])\nspark = SparkSession.builder.appName(&lt;span class=\"hljs-string\"&gt;'streaming example'&lt;/span&gt;).getOrCreate()\n\nschema = [\n    {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"src_queue_path\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"string\"&lt;/span&gt;},\n    {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"tablet_idx\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"int64\"&lt;/span&gt;},\n    {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"row_idx\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"int64\"&lt;/span&gt;},\n    {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"some_data\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"string\"&lt;/span&gt;},\n]\nyt.create(&lt;span class=\"hljs-string\"&gt;\"table\"&lt;/span&gt;, result_table_path, recursive=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;, attributes={&lt;span class=\"hljs-string\"&gt;\"dynamic\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"true\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"schema\"&lt;/span&gt;: schema})\nyt.mount_table(result_table_path, sync=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n\ndf = spark \\\n  .readStream \\\n  .&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"yt\"&lt;/span&gt;) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"consumer_path\"&lt;/span&gt;, consumer_path) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"include_service_columns\"&lt;/span&gt;, &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;) \\\n  .load(queue_path)\n  .withColumnRenamed(&lt;span class=\"hljs-string\"&gt;\"__spyt_streaming_src_tablet_index\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"tablet_idx\"&lt;/span&gt;)\n  .withColumnRenamed(&lt;span class=\"hljs-string\"&gt;\"__spyt_streaming_src_row_index\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"row_idx\"&lt;/span&gt;)\n  .withColumn(&lt;span class=\"hljs-string\"&gt;\"src_queue_path\"&lt;/span&gt;, lit(queue_path))\n\nquery = df\\\n  .writeStream \\\n  .outputMode(&lt;span class=\"hljs-string\"&gt;\"append\"&lt;/span&gt;) \\\n  .&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"yt\"&lt;/span&gt;) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"checkpointLocation\"&lt;/span&gt;, checkpoints_path) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt;, result_table_path) \\\n  .start()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"376\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-376\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-376\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-376.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"rows-limit\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/structured-streaming.html#rows-limit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конфигурация количества строк на 1 батч&lt;/span&gt;&lt;/a&gt;Конфигурация количества строк на 1 батч&lt;/h2&gt;\n&lt;p&gt;По умолчанию Spark пытается прочитать все доступные в очереди строки за 1 стриминговый микробатч. Для очередей с большим количеством непрочитанных строк это приведет к &lt;code&gt;OutOfMemoryError&lt;/code&gt; на экзекьюторах. Есть 2 опции для установки лимита строк на 1 микробатч:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Опция &lt;code&gt;max_rows_per_partition&lt;/code&gt; задает максимальное количество строк, которые могут быть прочитаны из одной партиции очереди в рамках одного батча. Например:\n&lt;ul&gt;\n&lt;li&gt;Если очередь состоит из 3 партиций и &lt;code&gt;max_rows_per_partition&lt;/code&gt; равно 1000, то будет прочитано не более 1000 строк каждой партиции, то есть не более 3000 строк за 1 батч. При этом партиции распределяются между экзекьюторами равномерно. Если экзекьюторов не меньше, чем партиций, то каждый будет обрабатывать не более 1 партиции.&lt;/li&gt;\n&lt;li&gt;В простейшем случае, когда очередь состоит из 1 партиции, &lt;code&gt;max_rows_per_partition&lt;/code&gt; фактически устанавливает лимит строк на 1 батч.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Конфигурационный параметр &lt;code&gt;spark.yt.write.dynBatchSize&lt;/code&gt; устанавливает максимально количество строк, которые могут быть записаны в динамическую таблицу за 1 вызов команды &lt;code&gt;modifyRows&lt;/code&gt;. Например:\n&lt;ul&gt;\n&lt;li&gt;Если экзекьютор прочитал 1000 строк, а &lt;code&gt;spark.yt.write.dynBatchSize&lt;/code&gt; равно 100, то будет 10 раз последовательно будет сформирован &lt;code&gt;ModifyRowsRequest&lt;/code&gt;, содержащий по 100 строк.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;small&gt;Листинг 5 — Использование опции max_rows_per_partition&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;spark = SparkSession.builder.appName(&lt;span class=\"hljs-string\"&gt;'streaming example'&lt;/span&gt;) \\\n   .config(&lt;span class=\"hljs-string\"&gt;\"spark.yt.write.dynBatchSize\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;100&lt;/span&gt;) \\\n   .getOrCreate()\n\ndf = spark \\\n  .readStream \\\n  .&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"yt\"&lt;/span&gt;) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"consumer_path\"&lt;/span&gt;, consumer_path) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"max_rows_per_partition\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;1000&lt;/span&gt;) \\\n  .load(queue_path)\n\nquery = df\\\n  .writeStream \\\n  .outputMode(&lt;span class=\"hljs-string\"&gt;\"append\"&lt;/span&gt;) \\\n  .&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"yt\"&lt;/span&gt;) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"checkpointLocation\"&lt;/span&gt;, checkpoints_path) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt;, result_table_path) \\\n  .start()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"417\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-417\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-417\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-417.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"type-v3\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/structured-streaming.html#type-v3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Композитные типы&lt;/span&gt;&lt;/a&gt;Композитные типы&lt;/h2&gt;\n&lt;p&gt;Для того чтобы обрабатывать стримингом &lt;a href=\"user-guide/storage/data-types.html\"&gt;композитные типы данных&lt;/a&gt;, необходимо, как и для батчовых джоб, включать опции &lt;code&gt;parsing_type_v3&lt;/code&gt; и &lt;code&gt;write_type_v3&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Листинг 6 — Обработка композитных типов в Structured Streaming&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;df = spark \\\n  .readStream \\\n  .&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"yt\"&lt;/span&gt;) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"consumer_path\"&lt;/span&gt;, consumer_path) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"parsing_type_v3\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"true\"&lt;/span&gt;) \\\n  .load(queue_path)\n  \nquery = df\\\n  .writeStream \\\n  .outputMode(&lt;span class=\"hljs-string\"&gt;\"append\"&lt;/span&gt;) \\\n  .&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"yt\"&lt;/span&gt;) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"write_type_v3\"&lt;/span&gt;, &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"checkpointLocation\"&lt;/span&gt;, checkpoints_path) \\\n  .option(&lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt;, result_table_path) \\\n  .start()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"427\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-427\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-427\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-427.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"streaming-required-params\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/structured-streaming.html#streaming-required-params\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Параметры Spark Structured Streaming, задаваемые через Spark методы&lt;/span&gt;&lt;/a&gt;Параметры Spark Structured Streaming, задаваемые через Spark методы&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Параметр&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;th&gt;Обязательный&lt;/th&gt;\n&lt;th&gt;Значение по умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;format&lt;/td&gt;\n&lt;td&gt;Формат. Указывается отдельно для readStream и для writeStream&lt;/td&gt;\n&lt;td&gt;да (для Structured Streaming поверх дин таблиц необходимо указать значение &lt;code&gt;yt&lt;/code&gt;)&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;load&lt;/td&gt;\n&lt;td&gt;Входная очередь&lt;/td&gt;\n&lt;td&gt;да&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;outputMode&lt;/td&gt;\n&lt;td&gt;Режим записи&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;\"append\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"streaming-configs\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/structured-streaming.html#streaming-configs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Параметры Spark сессии для конфигурации стриминга&lt;/span&gt;&lt;/a&gt;Параметры Spark сессии для конфигурации стриминга&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Опция&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;th&gt;Обязательный&lt;/th&gt;\n&lt;th&gt;Значение по умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;spark.yt.write.dynBatchSize&lt;/td&gt;\n&lt;td&gt;Максимальное количество строк в одной операции записи в динамическую таблицу&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;50000&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"streaming-options\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/structured-streaming.html#streaming-options\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Опции&lt;/span&gt;&lt;/a&gt;Опции&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Опция&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;th&gt;Обязательный&lt;/th&gt;\n&lt;th&gt;Значение по умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;consumer_path&lt;/td&gt;\n&lt;td&gt;Путь к таблице-консьюмеру&lt;/td&gt;\n&lt;td&gt;да&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;checkpointLocation&lt;/td&gt;\n&lt;td&gt;Путь к директории с чекпоинт-файлами&lt;/td&gt;\n&lt;td&gt;да&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;path&lt;/td&gt;\n&lt;td&gt;Путь к выходной таблице&lt;/td&gt;\n&lt;td&gt;да&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;include_service_columns&lt;/td&gt;\n&lt;td&gt;Добавить колонки &lt;code&gt;$tablet_index&lt;/code&gt; и &lt;code&gt;$row_index&lt;/code&gt; читаемой очереди в датафрейм&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_rows_per_partition&lt;/td&gt;\n&lt;td&gt;Максимальное количество строк, читаемых из одной партиции очереди в рамках одного батча&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;∞&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;parsing_type_v3&lt;/td&gt;\n&lt;td&gt;Читать композитные типы с сохранением типа&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;write_type_v3&lt;/td&gt;\n&lt;td&gt;Писать композитные типы с сохранением типа&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"compatibility-matrix\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/structured-streaming.html#compatibility-matrix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Матрица совместимости&lt;/span&gt;&lt;/a&gt;Матрица совместимости&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Функциональность&lt;/th&gt;\n&lt;th&gt;Минимальная версия SPYT&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Хранение чекпоинтов на YTsaurus&lt;/td&gt;\n&lt;td&gt;1.77.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Structured Streaming поверх YTsaurus Queue API&lt;/td&gt;\n&lt;td&gt;1.77.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Поддержка композитных типов данных&lt;/td&gt;\n&lt;td&gt;2.6.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Опция max_rows_per_partition&lt;/td&gt;\n&lt;td&gt;2.6.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Опция include_service_columns&lt;/td&gt;\n&lt;td&gt;2.6.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Параметр spark.yt.write.dynBatchSize&lt;/td&gt;\n&lt;td&gt;с 2.6.5 стал конфигурируем для стриминга (ранее был жестко задан и равен 50000)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"monitoring\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/structured-streaming.html#monitoring\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мониторинг в Spark webUI&lt;/span&gt;&lt;/a&gt;Мониторинг в Spark webUI&lt;/h2&gt;\n&lt;p&gt;Страницы Jobs, Stages, SQL/Dataframes как и в обычном Spark приложении нужны для мониторинга джобов, этапов выполнения и планов запросов.&lt;/p&gt;\n&lt;p&gt;Environment нужен для просмотра всех конфигурационных параметров Spark сессии и некоторых метрик.&lt;/p&gt;\n&lt;p&gt;На странице Executors можно посмотреть количество активных, упавших, выполненных тасок и понять, насколько оптимально загружены ядра экзекьюторов. А также можно узнать статистику использования памяти. Иногда при утечке памяти полезно переходить во Thread Dump или Heap Histogram, чтобы найти причину.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/spyt-streaming-monitoring-executors.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;p&gt;Для стриминговых процессов в webUI по умолчанию появляется страница Structured Streaming. Здесь можно смотреть статистику по активным и по завершенным стримам. В частности, полезно смотреть, с какой ошибкой завершился Streaming Query.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/spyt-streaming-monitoring-streaming.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;p&gt;Нажав на Run ID, можно посмотреть более детальную статистику конкретного Streaming Query.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/spyt-streaming-monitoring-streaming-query-stats.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;h2 id=\"best-practices\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/structured-streaming.html#best-practices\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Best practices&lt;/span&gt;&lt;/a&gt;Best practices&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Правильная настройка опций &lt;code&gt;max_rows_per_partition&lt;/code&gt; и конфига &lt;code&gt;spark.yt.write.dynBatchSize&lt;/code&gt; для ограничения размера строк, обрабатываемых за 1 батч. Важно устанавливать их не слишком большими, так как иначе есть риск получить &lt;code&gt;OutOfMemoryError&lt;/code&gt;. Но и не слишком мелкими, так как иначе батчи будут создаваться слишком часто, что значительно увеличивает нагрузку на мастер-сервера и прокси-сервера YTsaurus.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Установка небольшого значения конфига &lt;code&gt;spark.sql.streaming.minBatchesToRetain&lt;/code&gt;. Этот параметр устанавливает минимальное количество последних батчей, метаданные которых необходимо хранить. Это файлы в директории с чекпоинтами на Кипарисе и объекты во внутренних структурах драйвера. По дефолту значение этого конфига равно 100. Для стриминга без трансформаций с сохранением состояния, достаточно выставить &lt;code&gt;--conf spark.sql.streaming.minBatchesToRetain=2&lt;/code&gt;. Это позволяет экономить чанки на Кипарисе и память драйвера.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Устанавливать при создании спарк сессии конфигурационные параметры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;.config(\"spark.streaming.stopGracefullyOnShutdown\", True)&lt;/code&gt; - Корректно завершить обработку всех созданных батчей и очистить ресурсы перед остановкой стриминга.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;.config(\"spark.streaming.stopGracefullyOnShutdown.timeout\", ...)&lt;/code&gt; — Время на корректное завершение в миллисекундах.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;.config(\"spark.sql.adaptive.enabled\", False)&lt;/code&gt; — Обычное адаптивное выполнение не работает для стриминга. Выключаем его.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;.config(\"spark.sql.streaming.adaptiveExecution.enabled\", True)&lt;/code&gt; — Включаем специальное адаптивное выполнение для стриминговых джобов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Настраивать распределение памяти параметрами &lt;code&gt;spark.memory.fraction&lt;/code&gt; и &lt;code&gt;spark.memory.storageFraction&lt;/code&gt;, например:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;.config(\"spark.memory.fraction\", 0.5)&lt;/code&gt; — 50% памяти на execution, 50% на storage.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;.config(\"spark.memory.storageFraction\", 0.2)&lt;/code&gt; — 20% памяти выделяется на кеш и 80% на обработку данных (подходит, если нет кеширования).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/spyt/structured-streaming.md","sourcePath":"ru/user-guide/data-processing/spyt/structured-streaming.md"},"headings":[{"title":"Общая схема Spark Structured Streaming в SPYT","href":"ru/user-guide/data-processing/spyt/structured-streaming.html#obshaya-shema-spark-structured-streaming-v-spyt","level":2,"items":[{"title":"Основные понятия","href":"ru/user-guide/data-processing/spyt/structured-streaming.html#osnovnye-ponyatiya","level":3}]},{"title":"Хранилище чекпоинтов","href":"ru/user-guide/data-processing/spyt/structured-streaming.html#checkpoint-location","level":2},{"title":"Стриминг очередей YTsaurus","href":"ru/user-guide/data-processing/spyt/structured-streaming.html#queues","level":2},{"title":"Механизм обработки микробатча в Streaming Query","href":"ru/user-guide/data-processing/spyt/structured-streaming.html#streaming-query-processing-mechanism","level":2},{"title":"Работа с оффсетами","href":"ru/user-guide/data-processing/spyt/structured-streaming.html#streaming-offsets","level":2,"items":[{"title":"Определение lowerIndex и upperIndex для каждой партиции","href":"ru/user-guide/data-processing/spyt/structured-streaming.html#opredelenie-lowerindex-i-upperindex-dlya-kazhdoj-particii","level":3},{"title":"Возможный рассинхрон оффсетов","href":"ru/user-guide/data-processing/spyt/structured-streaming.html#vozmozhnyj-rassinhron-offsetov","level":3}]},{"title":"Достижение семантики exactly-once","href":"ru/user-guide/data-processing/spyt/structured-streaming.html#exactly-once","level":2},{"title":"Конфигурация количества строк на 1 батч","href":"ru/user-guide/data-processing/spyt/structured-streaming.html#rows-limit","level":2},{"title":"Композитные типы","href":"ru/user-guide/data-processing/spyt/structured-streaming.html#type-v3","level":2},{"title":"Параметры Spark Structured Streaming, задаваемые через Spark методы","href":"ru/user-guide/data-processing/spyt/structured-streaming.html#streaming-required-params","level":2},{"title":"Параметры Spark сессии для конфигурации стриминга","href":"ru/user-guide/data-processing/spyt/structured-streaming.html#streaming-configs","level":2},{"title":"Опции","href":"ru/user-guide/data-processing/spyt/structured-streaming.html#streaming-options","level":2},{"title":"Матрица совместимости","href":"ru/user-guide/data-processing/spyt/structured-streaming.html#compatibility-matrix","level":2},{"title":"Мониторинг в Spark webUI","href":"ru/user-guide/data-processing/spyt/structured-streaming.html#monitoring","level":2},{"title":"Best practices","href":"ru/user-guide/data-processing/spyt/structured-streaming.html#best-practices","level":2}],"title":"Structured Streaming"},"router":{"pathname":"ru/user-guide/data-processing/spyt/structured-streaming","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
