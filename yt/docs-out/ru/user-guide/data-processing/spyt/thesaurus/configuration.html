            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе приведён список конфигурационных параметров, которые можно передавать при запуске задач на Spark. Для этого используется стандартный способ указания дополнительных параметров через опцию &lt;code&gt;--conf&lt;/code&gt; основных Spark команд, таких как &lt;code&gt;spark-submit&lt;/code&gt;, &lt;code&gt;spark-shell&lt;/code&gt;, а также YTsaurus-обёрток над ними &lt;code&gt;spark-submit-yt&lt;/code&gt; и &lt;code&gt;spark-shell-yt&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"main\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/thesaurus/configuration.html#main\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основные опции&lt;/span&gt;&lt;/a&gt;Основные опции&lt;/h2&gt;\n&lt;p&gt;Большинство опций доступны начиная с версии 1.23.0, если не указано иное.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Имя&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.write.batchSize&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;500000&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Размер данных, отправляемых через одну операцию &lt;code&gt;WriteTable&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.write.miniBatchSize&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;1000&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Размер блока данных, отправляемого в &lt;code&gt;WriteTable&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.write.timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;60 seconds&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ограничение на ожидание записи одного блока данных&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.write.typeV3.enabled&lt;/code&gt; (&lt;code&gt;spark.yt.write.writingTypeV3.enabled&lt;/code&gt; до 1.75.2)&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Запись таблиц со схемой в формате &lt;a href=\"user-guide/storage/data-types.html\"&gt;type_v3&lt;/a&gt; вместо &lt;code&gt;type_v1&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.read.vectorized.capacity&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;1000&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Максимальное количество строк в батче при чтении через &lt;code&gt;wire&lt;/code&gt; протокол&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.read.arrow.enabled&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Использовать &lt;code&gt;arrow&lt;/code&gt; формат для чтения данных (если это возможно)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.hadoop.yt.timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;300 seconds&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Таймаут на чтение из YTsaurus&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.read.typeV3.enabled&lt;/code&gt; (&lt;code&gt;spark.yt.read.parsingTypeV3.enabled&lt;/code&gt; до 1.75.2)&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Чтение таблиц со схемой в формате &lt;a href=\"user-guide/storage/data-types.html\"&gt;type_v3&lt;/a&gt; вместо &lt;code&gt;type_v1&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.read.keyColumnsFilterPushdown.enabled&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Использовать фильтры Spark-запроса для выборочного чтения из YTsaurus&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.read.keyColumnsFilterPushdown.union.enabled&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Объединять все фильтры в непрерывный диапазон при выборочном чтении&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.read.keyColumnsFilterPushdown.ytPathCount.limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;100&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Максимальное количество диапазонов таблицы при выборочном чтении&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.transaction.timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;5 minutes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Таймаут на транзакцию записывающей операции&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.transaction.pingInterval&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;30 seconds&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Периодичность пингования транзакции записывающей операции&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.globalTransaction.enabled&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Использовать &lt;a href=\"user-guide/data-processing/spyt/read-transaction.html\"&gt;глобальную транзакцию&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.globalTransaction.id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;None&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор глобальной транзакции&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.globalTransaction.timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;5 minutes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Таймаут глобальной транзакции&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.hadoop.yt.user&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Имя пользователя YTsaurus&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.hadoop.yt.token&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Токен пользователя YTsaurus&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.read.ytPartitioning.enabled&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Использовать партиционирование таблиц средствами YTsaurus&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.read.planOptimization.enabled&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Оптимизировать агрегации и джойны на сортированных входных данных&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.read.keyPartitioningSortedTables.enabled&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Использовать партиционирование по ключам для сортированных таблиц, необходимо для оптимизации планов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.read.keyPartitioningSortedTables.unionLimit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;1&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Максимальное количество объединений партиций при переходе от чтения по индексам к чтению по ключам&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.read.transactional&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Использовать shapshot lock для чтения в случае отсутствия транзакции. Рекомендуется отключать эту опцию в случае чтения неизменяемых данных для повышения производительности чтения.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"direct-submit\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/thesaurus/configuration.html#direct-submit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Опции для запуска задач напрямую&lt;/span&gt;&lt;/a&gt;Опции для запуска задач напрямую&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;С какой версии&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.config.global.path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;//home/spark/conf/global&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Путь к документу с глобальной конфигурацией Spark и SPYT на кластере&lt;/td&gt;\n&lt;td&gt;1.76.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.config.releases.path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;//home/spark/conf/releases&lt;/code&gt; для релизных версий, &lt;code&gt;//home/spark/conf/pre-releases&lt;/code&gt; для предварительных версий&lt;/td&gt;\n&lt;td&gt;Путь к конфигурации релиза SPYT&lt;/td&gt;\n&lt;td&gt;1.76.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.distributives.path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;//home/spark/distrib&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Путь к директории с дистрибутивами Spark. Внутри этой директории структура имеет вид &lt;code&gt;a/b/c/spark-a.b.c-bin-hadoop3.tgz&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;2.0.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.config.launch.file&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;spark-launch-conf&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Название документа с конфигурацией релиза, который лежит внутри директории &lt;code&gt;spark.ytsaurus.config.releases.path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;1.76.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.spyt.version&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Совпадает с версией SPYT на клиенте&lt;/td&gt;\n&lt;td&gt;Версия SPYT, которую нужно использовать на кластере при запуске Spark приложения.&lt;/td&gt;\n&lt;td&gt;1.76.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.driver.maxFailures&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;5&lt;/td&gt;\n&lt;td&gt;Максимально допустимое количество падений драйвера перед тем, как операция будет считаться неуспешной&lt;/td&gt;\n&lt;td&gt;1.76.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.executor.maxFailures&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;10&lt;/td&gt;\n&lt;td&gt;Максимально допустимое количество падений экзекьютора перед тем, как операция будет считаться неуспешной&lt;/td&gt;\n&lt;td&gt;1.76.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.executor.operation.shutdown.delay&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;10000&lt;/td&gt;\n&lt;td&gt;Максимально допустимое время в миллисекундах для ожидания завершения экзекьюторов при остановке приложения перед принудительной остановкой операции с экзекьюторами&lt;/td&gt;\n&lt;td&gt;1.76.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.pool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Пул планировщика, в котором необходимо запускать операции драйвера и экзекьютора&lt;/td&gt;\n&lt;td&gt;1.78.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.python.binary.entry.point&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Функция, используемая в качестве точки входа при использовании скомпилированных Python задач&lt;/td&gt;\n&lt;td&gt;2.4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.python.executable&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Путь к интерпретатору python, используемый в драйвере и экзекьюторах&lt;/td&gt;\n&lt;td&gt;1.78.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.tcp.proxy.enabled&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;Используется ли TCP прокси для доступа к операции&lt;/td&gt;\n&lt;td&gt;2.1.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.tcp.proxy.range.start&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;30000&lt;/td&gt;\n&lt;td&gt;Минимальный номер порта для TCP прокси&lt;/td&gt;\n&lt;td&gt;2.1.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.tcp.proxy.range.size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;1000&lt;/td&gt;\n&lt;td&gt;Размер диапазона портов, которые могут быть выделены для TCP прокси&lt;/td&gt;\n&lt;td&gt;2.1.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.cuda.version&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Версия CUDA, используемая для Spark приложений. Имеет смысл, если расчеты используют GPU&lt;/td&gt;\n&lt;td&gt;2.1.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.redirect.stdout.to.stderr&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;Перенаправление вывода пользовательских скриптов из stdout в stderr&lt;/td&gt;\n&lt;td&gt;2.1.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.remote.temp.files.directory&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;//tmp/yt_wrapper/file_storage&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Путь к кешу на кипарисе для загрузки локальных скриптов&lt;/td&gt;\n&lt;td&gt;2.4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.annotations&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Аннотации для операций с драйвером и экзекьюторами&lt;/td&gt;\n&lt;td&gt;2.2.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.driver.annotations&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Аннотации для операции с драйвером&lt;/td&gt;\n&lt;td&gt;2.2.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.executors.annotations&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Аннотации для операции с экзекьюторами&lt;/td&gt;\n&lt;td&gt;2.2.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.driver.watch&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;td&gt;Флаг для выполнения мониторинга операции с драйвером при выполнении в кластерном режиме&lt;/td&gt;\n&lt;td&gt;2.4.2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.network.project&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Название сетевого проекта, в котором запускается Spark приложения&lt;/td&gt;\n&lt;td&gt;2.4.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.hadoop.yt.mtn.enabled&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;Флаг включения поддержки MTN&lt;/td&gt;\n&lt;td&gt;2.4.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.squashfs.enabled&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;Использование squashFS слоёв в YTsaurus джобе вместо porto слоёв&lt;/td&gt;\n&lt;td&gt;2.6.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.client.rpc.timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Таймаут, используемый в rpc клиенте для старта YTsaurus операций&lt;/td&gt;\n&lt;td&gt;2.6.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.rpc.job.proxy.enabled&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;td&gt;Флаг использования rpc прокси, встроенной в job прокси&lt;/td&gt;\n&lt;td&gt;2.6.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.ytsaurus.java.home&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;/opt/jdk[11,17]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Путь к домашней директории JDK, используемой в контейнерах кластера. Зависит от используемой JDK на клиентской стороне. Допустимы JDK11 и JDK17.&lt;/td&gt;\n&lt;td&gt;2.6.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"spark-submit-yt-conf\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/thesaurus/configuration.html#spark-submit-yt-conf\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Опции для запуска задач во внутреннем кластере&lt;/span&gt;&lt;/a&gt;Опции для запуска задач во внутреннем кластере&lt;/h2&gt;\n&lt;p&gt;Для запуска задач во внутреннем кластере используется обёртка &lt;code&gt;spark-submit-yt&lt;/code&gt;. Её параметры соответствуют параметрам команды &lt;code&gt;spark-submit&lt;/code&gt; из дистрибутива Spark, за следующим исключением:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Вместо параметра &lt;code&gt;--master&lt;/code&gt; используются параметры &lt;code&gt;--proxy&lt;/code&gt; и &lt;code&gt;--discovery-path&lt;/code&gt;. Они определяют, какой YTsaurus кластер будет использоваться для запуска вычислений, и в какой внутренний Spark кластер на этом YTsaurus кластере будет отправлена задача, соответственно.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/spyt/thesaurus/configuration.md","sourcePath":"ru/user-guide/data-processing/spyt/thesaurus/configuration.md"},"headings":[{"title":"Основные опции","href":"ru/user-guide/data-processing/spyt/thesaurus/configuration.html#main","level":2},{"title":"Опции для запуска задач напрямую","href":"ru/user-guide/data-processing/spyt/thesaurus/configuration.html#direct-submit","level":2},{"title":"Опции для запуска задач во внутреннем кластере","href":"ru/user-guide/data-processing/spyt/thesaurus/configuration.html#spark-submit-yt-conf","level":2}],"title":"Конфигурационные параметры для запуска Spark задач"},"router":{"pathname":"ru/user-guide/data-processing/spyt/thesaurus/configuration","depth":6,"base":"../../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
