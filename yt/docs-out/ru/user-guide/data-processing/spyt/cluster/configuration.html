            {"data":{"leading":false,"html":"&lt;p&gt;Список всех поддерживаемых опций Spark содержится в документации на соответствующую версию Spark, которую вы используете. Описание конфигурационных параметров для последней релизной версии Spark доступно &lt;a href=\"https://spark.apache.org/docs/latest/configuration.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;на этой странице&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Список дополнительных опций, относящихся к SPYT, приведен &lt;a href=\"user-guide/data-processing/spyt/thesaurus/configuration.html\"&gt;в справочнике&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"optimizaciya-agregacij-i-dzhojnov\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/configuration.html#optimizaciya-agregacij-i-dzhojnov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оптимизация агрегаций и джойнов&lt;/span&gt;&lt;/a&gt;Оптимизация агрегаций и джойнов&lt;/h2&gt;\n&lt;p&gt;Spark кластер при чтении игнорирует метаинформацию о сортированности таблиц YTsaurus, создавая планы с множеством Shuffle и Sort стадий. Для более эффективной работы были внедрены дополнительные правила оптимизации агрегаций и джойнов поверх сортированных данных. На этапе построения логического плана к вершинам чтения добавляются пометки о сортированности. Позже при создании физического плана эти пометки превращаются в физические вершины, которые не производят действий над данными, но уведомляют планировщик о способе сортировки и партиционирования данных.&lt;/p&gt;\n&lt;p&gt;Партиционирование статических таблиц производится по индексам строк, однако опция &lt;code&gt;spark.yt.read.keyPartitioningSortedTables.enabled&lt;/code&gt; включает партиционирование и чтение по ключам. При таком переходе возможно уменьшение количества партиций, если ключи оказываются достаточно большими. Это может повлечь увеличение количества данных, которые приходятся на один экзекьютор.&lt;/p&gt;\n&lt;h2 id=\"add\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/configuration.html#add\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дополнительные опции конфигурации кластера&lt;/span&gt;&lt;/a&gt;Дополнительные опции конфигурации кластера&lt;/h2&gt;\n&lt;p&gt;Дополнительные опции передаются через &lt;code&gt;--params&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-launch-yt \\\n  --proxy &amp;lt;cluster-name&amp;gt; \\\n  --discovery-path my_discovery_path \\\n  --params &lt;span class=\"hljs-string\"&gt;'{\"spark_conf\"={\"spark.yt.jarCaching\"=\"True\";};\"layer_paths\"=[\"//.../ubuntu_xenial_app_lastest.tar.gz\";...;];\"operation_spec\"={\"max_failed_job_count\"=100;};}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"21\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-21\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-21\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-21.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"spark-configuration\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/configuration.html#spark-configuration\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Spark configuration&lt;/span&gt;&lt;/a&gt;Spark configuration&lt;/h3&gt;\n&lt;p&gt;При использовании &lt;code&gt;spark-launch-yt&lt;/code&gt; для настройки кластера доступна опция &lt;code&gt;--params '{\"spark_conf\"={...};}&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-launch-yt \\\n  --proxy &amp;lt;cluster-name&amp;gt; \\\n  --discovery-path my_discovery_path \\\n  --params &lt;span class=\"hljs-string\"&gt;'{\"spark_conf\"={\"spark.sql.shuffle.partitions\":1,\"spark.cores.max\":1,\"spark.executor.cores\"=1};}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"28\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-28\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-28\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-28.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;При использовании &lt;code&gt;spark-submit-yt&lt;/code&gt; для настройки задачи существует опция &lt;code&gt;spark_conf_args&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-submit-yt \\\n  --proxy &amp;lt;cluster-name&amp;gt; \\\n  --discovery-path my_discovery_path \\\n  --deploy-mode cluster \\\n  --conf spark.sql.shuffle.partitions=1 \\\n  --conf spark.cores.max=1 \\\n  --conf spark.executor.cores=1 \\\n  yt:///sys/spark/examples/grouping_example.py\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"32\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-32\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-32\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-32.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-submit-yt \\\n  --proxy &amp;lt;cluster-name&amp;gt; \\\n  --discovery-path my_discovery_path \\\n  --deploy-mode cluster \\\n  --spark_conf_args &lt;span class=\"hljs-string\"&gt;'{\"spark.sql.shuffle.partitions\":1,\"spark.cores.max\":1,\"spark.executor.cores\"=1}'&lt;/span&gt; \\\n  yt:///sys/spark/examples/grouping_example.py\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"33\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-33\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-33\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-33.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;При запуске из кода можно производить настройку через &lt;code&gt;spark_session.conf.set(\"...\", \"...\")&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Пример на Python:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; spyt &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; spark_session\n\n&lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"Hello world\"&lt;/span&gt;)\n&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; spark_session() &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; spark:\n    spark.conf.&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"spark.yt.read.parsingTypeV3.enabled\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"true\"&lt;/span&gt;)\n    spark.read.yt(&lt;span class=\"hljs-string\"&gt;\"//sys/spark/examples/test_data\"&lt;/span&gt;).show()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"40\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-40\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-40\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-40.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Пример на Java:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs java\"&gt;&lt;span class=\"hljs-keyword\"&gt;protected&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;doRun&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(String[] args, SparkSession spark, CompoundClient yt)&lt;/span&gt; {\n    spark.conf.set(&lt;span class=\"hljs-string\"&gt;\"spark.sql.adaptive.enabled\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"false\"&lt;/span&gt;);\n    spark.read().format(&lt;span class=\"hljs-string\"&gt;\"yt\"&lt;/span&gt;).load(&lt;span class=\"hljs-string\"&gt;\"/sys/spark/examples/test_data\"&lt;/span&gt;).show();\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"44\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-44\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-44\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-44.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"nastrojki-operacij\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/configuration.html#nastrojki-operacij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройки операций&lt;/span&gt;&lt;/a&gt;Настройки операций&lt;/h3&gt;\n&lt;p&gt;При использовании &lt;code&gt;spark-launch-yt&lt;/code&gt; для настройки кластера доступна опция &lt;code&gt;--params '{\"operation_spec\"={...};}&lt;/code&gt;. &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Список всех поддерживаемых опций&lt;/a&gt;.&lt;br /&gt;\nЭто будет полезно, если необходимо изменить стандартные настройки операции например для увеличения количество failed джобов, после которого операция считается failed.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-launch-yt \\\n  --proxy &amp;lt;cluster-name&amp;gt; \\\n  --discovery-path my_discovery_path \\\n  --params &lt;span class=\"hljs-string\"&gt;'{\"operation_spec\"={\"max_failed_job_count\"=100;owners=[...]};}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"51\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-51\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-51\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-51.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"obnovlenie-versii-python\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/configuration.html#obnovlenie-versii-python\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обновление версии python&lt;/span&gt;&lt;/a&gt;Обновление версии python&lt;/h3&gt;\n&lt;p&gt;Существуют два способа обновления версии python:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Установить необходимую версию python:\n&lt;ol&gt;\n&lt;li&gt;Установить необходимую версию python на exeс nodes&lt;/li&gt;\n&lt;li&gt;Добавит версию python &lt;code&gt;//home/spark/conf/global&lt;/code&gt; и путь к новому интерпретатору.&lt;/li&gt;\n&lt;li&gt;После этого в spark-submit-yt будет возможность использовать его. Параметр &lt;code&gt;--python-version&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;/li&gt;\n&lt;li&gt;Собрать свой образ с необходимой версией python&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"ustanovka-dopolnitelnyh-paketov\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/configuration.html#ustanovka-dopolnitelnyh-paketov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка дополнительных пакетов&lt;/span&gt;&lt;/a&gt;Установка дополнительных пакетов&lt;/h3&gt;\n&lt;p&gt;Необходимо собрать образ с установленными пакетами и использовать его в качестве базового образа для запуска задачи.&lt;/p&gt;\n&lt;h3 id=\"sborka-obraza-s-ustanovlennymi-paketami\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/configuration.html#sborka-obraza-s-ustanovlennymi-paketami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сборка образа с установленными пакетами&lt;/span&gt;&lt;/a&gt;Сборка образа с установленными пакетами&lt;/h3&gt;\n&lt;h4 id=\"sborka-obraza\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/configuration.html#sborka-obraza\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сборка образа&lt;/span&gt;&lt;/a&gt;Сборка образа&lt;/h4&gt;\n&lt;p&gt;Пример Dockerfile для сборки образа python3.12 с установленными пакетами:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs docker\"&gt;&lt;span class=\"hljs-comment\"&gt;# Dockerfile&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; mirror.gcr.io/ubuntu:focal\n\n&lt;span class=\"hljs-keyword\"&gt;USER&lt;/span&gt; root\n\n&lt;span class=\"hljs-keyword\"&gt;RUN&lt;/span&gt;&lt;span class=\"language-bash\"&gt; apt-get update &amp;amp;&amp;amp; apt-get install -y software-properties-common&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;RUN&lt;/span&gt;&lt;span class=\"language-bash\"&gt; add-apt-repository ppa:deadsnakes/ppa&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;RUN&lt;/span&gt;&lt;span class=\"language-bash\"&gt; apt-get update &amp;amp;&amp;amp; DEBIAN_FRONTEND=noninteractive TZ=Etc/UTC apt-get install -y \\\n  containerd \\\n  curl \\\n  less \\\n  gdb \\\n  lsof \\\n  strace \\\n  telnet \\\n  tini \\\n  zstd \\\n  unzip \\\n  dnsutils \\\n  iputils-ping \\\n  lsb-release \\\n  openjdk-11-jdk \\\n  libidn11-dev \\\n  python3.12 \\\n  python3-pip \\\n  python3.12-dev \\\n  python3.12-distutils&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;RUN&lt;/span&gt;&lt;span class=\"language-bash\"&gt; &lt;span class=\"hljs-built_in\"&gt;ln&lt;/span&gt; -s /usr/lib/jvm/java-11-openjdk-amd64 /opt/jdk11&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;RUN&lt;/span&gt;&lt;span class=\"language-bash\"&gt; update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.12 1 \\\n    &amp;amp;&amp;amp; update-alternatives --install /usr/bin/python python /usr/bin/python3.12 1&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;COPY&lt;/span&gt;&lt;span class=\"language-bash\"&gt; ./requirements.txt /requirements.txt&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Ensure pip is installed correctly&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;RUN&lt;/span&gt;&lt;span class=\"language-bash\"&gt; curl https://bootstrap.pypa.io/get-pip.py -o get-pip.py \\\n    &amp;amp;&amp;amp; python3.12 get-pip.py \\\n    &amp;amp;&amp;amp; python3.12 -m pip install --upgrade pip setuptools wheel \\\n    &amp;amp;&amp;amp; &lt;span class=\"hljs-built_in\"&gt;rm&lt;/span&gt; get-pip.py&lt;/span&gt;\n\n\n&lt;span class=\"hljs-keyword\"&gt;RUN&lt;/span&gt;&lt;span class=\"language-bash\"&gt; python3.12 -m pip install -r requirements.txt&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"102\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-102\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-102\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-102.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;# requirements.txt\nytsaurus-client==0.13.29\nytsaurus-spyt==2.7.1\npyspark==3.5.6\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"103\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-103\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-103\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-103.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"zapusk-klastera-s-docker-obrazom\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/configuration.html#zapusk-klastera-s-docker-obrazom\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск кластера с docker образом&lt;/span&gt;&lt;/a&gt;Запуск кластера с docker образом&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-launch-yt \\\n--params &lt;span class=\"hljs-string\"&gt;'{operation_spec={tasks={history={docker_image=\"MY_DOCKER_IMAGE\"};master={docker_image=\"MY_DOCKER_IMAGE\"};workers={docker_image=\"MY_DOCKER_IMAGE\"}}}}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"107\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-107\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-107\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-107.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/spyt/cluster/configuration.md","sourcePath":"ru/user-guide/data-processing/spyt/cluster/configuration.md"},"headings":[{"title":"Оптимизация агрегаций и джойнов","href":"ru/user-guide/data-processing/spyt/cluster/configuration.html#optimizaciya-agregacij-i-dzhojnov","level":2},{"title":"Дополнительные опции конфигурации кластера","href":"ru/user-guide/data-processing/spyt/cluster/configuration.html#add","level":2,"items":[{"title":"Spark configuration","href":"ru/user-guide/data-processing/spyt/cluster/configuration.html#spark-configuration","level":3},{"title":"Настройки операций","href":"ru/user-guide/data-processing/spyt/cluster/configuration.html#nastrojki-operacij","level":3},{"title":"Обновление версии python","href
