            {"data":{"leading":false,"html":"&lt;p&gt;History Server может входить как в состав внутреннего кластера, так и запускаться отдельно. Второй случай необходим, если используется запуск задач &lt;a href=\"user-guide/data-processing/spyt/launch.html#submit\"&gt;напрямую в YTsaurus&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"shs-direct-submit\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/shs.html#shs-direct-submit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сохранение event logs при запуске задач напрямую в YTsaurus&lt;/span&gt;&lt;/a&gt;Сохранение event logs при запуске задач напрямую в YTsaurus&lt;/h2&gt;\n&lt;p&gt;Чтобы сохранить event logs запуска задачи, команде &lt;code&gt;spark-submit&lt;/code&gt; следует указать параметры:&lt;br /&gt;\n&lt;code&gt;--conf spark.eventLog.enabled=true --conf spark.eventLog.dir=ytEventLog:/&amp;lt;history server discovery path&amp;gt;/logs/event_log_table&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;В этом случае event logs запуска будут сохранены в соответствующей таблице и будут доступны в History Server, который использует эту таблицу в качестве хранилища логов.&lt;/p&gt;\n&lt;h2 id=\"shs-launch-yt\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/shs.html#shs-launch-yt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск отдельного History Server-а&lt;/span&gt;&lt;/a&gt;Запуск отдельного History Server-а&lt;/h2&gt;\n&lt;p&gt;Основные параметры команды &lt;code&gt;shs-launch-yt&lt;/code&gt; являются подмножеством параметров команды &lt;a href=\"user-guide/data-processing/spyt/cluster/cluster-start.html#spark-launch-yt-params\"&gt;spark-launch-yt&lt;/a&gt;, релевантные для запуска History Server. Пример запуска History Server-а:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ shs-launch-yt --proxy &amp;lt;proxy address&amp;gt; --discovery-path &amp;lt;discovery path&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"18\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-18\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-18\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-18.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ shs-launch-yt --proxy my.ytsaurus.cluster.net --discovery-path //home/user/spark/discovery\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"22\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-22\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-22\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-22.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/spyt/cluster/shs.md","sourcePath":"ru/user-guide/data-processing/spyt/cluster/shs.md"},"headings":[{"title":"Сохранение event logs при запуске задач напрямую в YTsaurus","href":"ru/user-guide/data-processing/spyt/cluster/shs.html#shs-direct-submit","level":2},{"title":"Запуск отдельного History Server-а","href":"ru/user-guide/data-processing/spyt/cluster/shs.html#shs-launch-yt","level":2}],"title":"Spark History Server (SHS)"},"router":{"pathname":"ru/user-guide/data-processing/spyt/cluster/shs","depth":6,"base":"../../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
