        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Начиная с версии 1.74.0 в SPYT доступен сервис &lt;a href=\"https://livy.apache.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Livy&lt;/a&gt;, который позволяет осуществлять общение между клиентом и Spark кластером через REST интерфейс. Этот функционал используется в модуле &lt;a href=\"user-guide/query-tracker/about.html\"&gt;Query tracker&lt;/a&gt; для выполнения Spark SQL запросов в YTsaurus.&lt;/p&gt;\n&lt;p&gt;Дистрибутив Livy уже включен в релизный образ SPYT и помещается на кластер YTsaurus по пути &lt;code&gt;//home/spark/livy/livy.tgz&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"start\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/livy.html#start\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск&lt;/span&gt;&lt;/a&gt;Запуск&lt;/h2&gt;\n&lt;p&gt;Для запуска Livy сервера необходимо в команде запуска кластера SPYT указать опцию &lt;code&gt;--enable-livy&lt;/code&gt;. Максимальное количество одновременных соединений с сервером регулируется опцией &lt;code&gt;--livy-max-sessions&lt;/code&gt;. Попытка установить соединение сверх лимита повлечет ошибку.&lt;/p&gt;\n&lt;p&gt;Драйвер для Spark задач, запущенных через Livy, поднимается в том же контейнере, что и сервер. Поэтому для корректного подсчета и резервирования ресурсов в YTsaurus количество ядер и размер памяти драйвера устанавливаются при старте кластера — с помощью опций &lt;code&gt;--livy-driver-cores&lt;/code&gt; и &lt;code&gt;--livy-driver-memory&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ spark-launch-yt ... --enable-livy --livy-max-sessions 5 --livy-driver-cores 1 --livy-driver-memory 1G\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"15\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-15\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-15\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-15.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Узнать адрес Livy сервера, как и других компонент, можно через &lt;code&gt;spark-discovery-yt&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"query-tracker\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/livy.html#query-tracker\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование в Query tracker&lt;/span&gt;&lt;/a&gt;Использование в Query tracker&lt;/h2&gt;\n&lt;p&gt;К запущенному SPYT кластеру можно выполнять запросы из Query tracker (вкладка SPYT) на языке Spark SQL. В &lt;code&gt;settings&lt;/code&gt; необходимо задать поля &lt;code&gt;cluster&lt;/code&gt; (если в инсталляции YTsaurus не установлен кластер по умолчанию) и &lt;code&gt;discovery_path&lt;/code&gt;. Кроме того, в поле &lt;code&gt;spark_conf&lt;/code&gt; может быть передана произвольная конфигурация Spark сессии в виде yson словаря.&lt;/p&gt;\n&lt;p&gt;В QT версии 0.0.5 была добавлена поддержка аутентификации и переиспользования сессий:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;В момент начала исполнения запроса Query tracker выпускает для пользователя временный &lt;a href=\"user-guide/storage/auth.html\"&gt;токен&lt;/a&gt;, время жизни которого ограничено десятками минут. Полученный токен будет использован при выполнении запроса на SPYT кластере для аутентификации пользователя в YTsaurus, что позволит соблюдать &lt;a href=\"user-guide/storage/access-control.html#authorization\"&gt;права&lt;/a&gt; при чтении/записи данных. В случае длительных запросов временный токен будет периодически пролонгироваться.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Если в &lt;code&gt;settings&lt;/code&gt; поле &lt;code&gt;session_reuse = true&lt;/code&gt; (значение по умолчанию), тогда запросы не будут закрывать установленное соединение с кластером и по возможности будут переиспользовать его в будущем. Это сокращает время исполнения запроса на 10-20 секунд, однако бездействующие сессии также учитываются в лимите количества одновременных соединений с кластером — &lt;code&gt;livy-max-sessions&lt;/code&gt;. Сессия автоматически завершается, если в течение 10 минут не поступает новых запросов.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"direct-connect\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/livy.html#direct-connect\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройка сессии при подключении к серверу напрямую&lt;/span&gt;&lt;/a&gt;Настройка сессии при подключении к серверу напрямую&lt;/h2&gt;\n&lt;p&gt;Эндпоинты Livy сервера описаны в &lt;a href=\"https://livy.apache.org/docs/latest/rest-api.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;официальной документации&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Для работы с YTsaurus при инициализации Livy сессии в &lt;code&gt;spark_conf&lt;/code&gt; необходимо указать два конфигурационных параметра — путь к Java (&lt;code&gt;spark.yt.jars&lt;/code&gt;) и Python (&lt;code&gt;spark.yt.pyFiles&lt;/code&gt;) библиотекам:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;data = {&lt;span class=\"hljs-string\"&gt;'kind'&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'spark'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'conf'&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;'spark.yt.version'&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'2.7.1'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'spark.yt.jars'&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'yt:///home/spark/spyt/releases/2.7.1/spark-yt-data-source.jar'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'spark.yt.pyFiles'&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'yt:///home/spark/spyt/releases/2.7.1/spyt.zip'&lt;/span&gt;}}\nreq = requests.post(host + &lt;span class=\"hljs-string\"&gt;'/sessions'&lt;/span&gt;, data=json.dumps(data))\nresp = req.json()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"49\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-49\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-49\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-49.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"sparkmagic\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/livy.html#sparkmagic\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sparkmagic&lt;/span&gt;&lt;/a&gt;Sparkmagic&lt;/h2&gt;\n&lt;p&gt;К серверу Livy можно подключиться через &lt;a href=\"https://github.com/jupyter-incubator/sparkmagic\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Sparkmagic&lt;/a&gt;, который позволяет работать с SPYT кластером в Jupyter ноутбуке посредством REST интерфейса. Это сокращает количество сетевых доступов, требуемых для интерактивной работы на Python, сохраняя функционал. Помимо языка Python в Sparkmagic поддержаны Scala и SQL.&lt;/p&gt;\n&lt;h2 id=\"livy-launch-yt\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/livy.html#livy-launch-yt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск отдельного Livy сервиса&lt;/span&gt;&lt;/a&gt;Запуск отдельного Livy сервиса&lt;/h2&gt;\n&lt;p&gt;Для запуска Livy сервера можно использовать команду &lt;code&gt;livy-launch-yt&lt;/code&gt;, входящую в дистрибутив SPYT. Её основные параметры повторяют параметры команды &lt;a href=\"user-guide/data-processing/spyt/cluster/cluster-start.html#spark-launch-yt-params\"&gt;spark-launch-yt&lt;/a&gt; с небольшими отличиями, приведёнными в таблице:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;С какой версии&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--spark-master-address&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;да&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Адрес Spark мастера, который будет использован для запуска экзекьюторов. Может быть &lt;code&gt;ytsaurus://&amp;lt;Cluster endpoint&amp;gt;&lt;/code&gt; для запуска задач, используя планировщик YTsaurus&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--master-group-id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Название группы в YTsaurus Discovery server, используется при запуске через Strawberry&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/spyt/cluster/livy.md","sourcePath":"ru/user-guide/data-processing/spyt/cluster/livy.md"},"headings":[{"title":"Запуск","href":"ru/user-guide/data-processing/spyt/cluster/livy.html#start","level":2},{"title":"Использование в Query tracker","href":"ru/user-guide/data-processing/spyt/cluster/livy.html#query-tracker","level":2},{"title":"Настройка сессии при подключении к серверу напрямую","href":"ru/user-guide/data-processing/spyt/cluster/livy.html#direct-connect","level":2},{"title":"Sparkmagic","href":"ru/user-guide/data-processing/spyt/cluster/livy.html#sparkmagic","level":2},{"title":"Запуск отдельного Livy сервиса","href":"ru/user-guide/data-processing/spyt/cluster/livy.html#livy-launch-yt","level":2}],"title":"Livy server"},"router":{"pathname":"ru/user-guide/data-processing/spyt/cluster/livy","depth":6,"base":"../../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
