        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Таблет сортированной динамической таблицы представляет из себя &lt;a href=\"https://en.wikipedia.org/wiki/Log-structured_merge-tree\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;LSM-дерево&lt;/a&gt;. При записи строка сначала попадает в хранилище в памяти — dynamic store. По мере наполнения данные из dynamic store сбрасываются на диск в чанки. Фоновый процесс компактификации периодически объединяет несколько чанков. Это необходимо для:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;применения &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables#udalenie-stroki\"&gt;delete tombstones&lt;/a&gt; и физического удаления строк;&lt;/li&gt;\n&lt;li&gt;удаления старых версий;&lt;/li&gt;\n&lt;li&gt;уменьшения overlapping store count — числа чанков, в которых может потребоваться искать некоторый фиксированный ключ.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Компактификация во многом полагается на эвристики. Однако в зависимости от сценария записи в таблицу оптимальные подходы могут отличаться, например:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;если на таблице установлен небольшой max_data_ttl, имеет смысл периодически компактифицировать старые чанки и освобождать место;&lt;/li&gt;\n&lt;li&gt;если строки регулярно удаляются, то при компактификации имеет смысл одновременно рассмотреть чанк, содержащий вставки и удаления, чтобы физически удалить строки;&lt;/li&gt;\n&lt;li&gt;если поток записи в таблицу большой, можно пожертвовать оптимальностью чтения и ослабить настройки overlapping store count в пользу уменьшения write amplification — отношения количества данных, обрабатываемых компактификацией, к количеству записанных данных, и наоборот.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"glossary\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#glossary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Глоссарий&lt;/span&gt;&lt;/a&gt;Глоссарий&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Dynamic store&lt;/strong&gt; — структура для хранения свежезаписанных строк, находится в оперативной памяти. Аналог MemTable.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Chunk&lt;/strong&gt;, &lt;strong&gt;чанк&lt;/strong&gt; — иммутабельная структура для хранения строк, сброшенных на диск. Аналог SSTable.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Store&lt;/strong&gt;, &lt;strong&gt;стор&lt;/strong&gt; — общее название для чанков и dynamic stores. Формально говоря, в таблете хранятся не чанки, а chunk stores (и dynamic stores), но термины chunk и chunk store обычно взаимозаменимы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Partition&lt;/strong&gt;, &lt;strong&gt;партиция&lt;/strong&gt; — часть подразбиения таблета. Подобно тому, как таблица разбита на таблеты, ограниченные pivot-ключами, таблет внутри разбит на партиции. Чанки, находящиеся внутри партиции, не пересекают её границ.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Eden&lt;/strong&gt;, &lt;strong&gt;Эден&lt;/strong&gt; — особая партиция, содержащая чанки, которые не могут быть помещены ни в одну из партиций, поскольку пересекают границы. Типично чанки живут в Эдене недолго, быстро подвергаясь партицированию.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Overlapping store count&lt;/strong&gt;, &lt;strong&gt;OSC&lt;/strong&gt; — максимальное наложение чанков; максимальное количество чанков, накрывающих тот или иной ключ. Ограничивает сверху fan-in, т.е. количество чанков, которые фактически придётся прочитать для того, чтобы получить актуальное значение по ключу.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Flush&lt;/strong&gt;, &lt;strong&gt;флаш&lt;/strong&gt; — процесс сброса данных на диск, из dynamic store в чанк.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Compaction&lt;/strong&gt;, &lt;strong&gt;компакшн&lt;/strong&gt;, &lt;strong&gt;компактификация&lt;/strong&gt; — процесс слияния чанков, в результате которого отбрасываются старые версии данных, удаляются delete tombstones и объединяются чанки малого размера.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Partitioning&lt;/strong&gt;, &lt;strong&gt;партицирование&lt;/strong&gt; — процесс, схожий с компакшном, однако основной его целью является не объединение чанков, а разбиение чанков из Эдена по различным партициям.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Фоновые процессы&lt;/strong&gt; — общее название для flush+compaction+partitioning.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Write amplification&lt;/strong&gt;, &lt;strong&gt;WA&lt;/strong&gt; — отношение объёма данных, обработанных фоновыми процессами (compaction/partitioning), к объёму данных, записанных в таблицу. Служит одним из важных показателей эффективности подобранных параметров.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Версия строки&lt;/strong&gt; — в модели &lt;a href=\"https://en.wikipedia.org/wiki/Multiversion_concurrency_control\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MVCC&lt;/a&gt; по одному ключу может храниться много значений, каждое со своим timestamp-ом; отдельное значение называется версией. Вообще говоря, записи в каждую колонку могут версионироваться независимо, поэтому имеет смысл говорить о версиях &lt;em&gt;значений&lt;/em&gt;, а не &lt;em&gt;строки&lt;/em&gt; целиком, однако с точки зрения настройки компакшна обычно это не имеет значения.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"attributes\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список атрибутов&lt;/span&gt;&lt;/a&gt;Список атрибутов&lt;/h2&gt;\n&lt;p&gt;Все значения с типом &lt;code&gt;Duration&lt;/code&gt; указаны в миллисекундах. Все значения, обозначающие объём данных, указаны в байтах. Атрибуты, для которых отсутствует описание, имеют сложную семантику, и их не рекомендуется изменять.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Предупреждение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Многие атрибуты влияют на поведение фоновых процессов компактификации. Бездумная установка атрибутов может создать неожиданную нагрузку на бандл или кластер.&lt;/p&gt;\n&lt;p&gt;Пожалуйста, используйте только те атрибуты, смысл которых вы понимаете.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Замечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Установка атрибута на примонтированную таблицу не влечёт применения настроек. Чтобы применить настройки, используйте команду &lt;code&gt;remount-table&lt;/code&gt;:&lt;/p&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //path/to/table/@mount_config/merge_rows_on_flush %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\nyt remount-table //path/to/table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"135\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-135\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-135\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-135.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Узнать актуальные настройки таблета можно по пути &lt;code&gt;//sys/tablets/x-x-x-x/orchid/config&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"flush_attributes\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#flush_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Flush&lt;/span&gt;&lt;/a&gt;Flush&lt;/h3&gt;\n&lt;p&gt;Перечисленные атрибуты регулируют поведение флаша.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Имя&lt;/th&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;dynamic_store_auto_flush_period&lt;/td&gt;\n&lt;td&gt;Duration*&lt;/td&gt;\n&lt;td&gt;900 000 (15 min)&lt;/td&gt;\n&lt;td&gt;Интервал времени для принудительного флаша: даже если dynamic store не переполнился за это время, он будет сброшен на диск вне очереди.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;dynamic_store_flush_period_splay&lt;/td&gt;\n&lt;td&gt;Duration&lt;/td&gt;\n&lt;td&gt;60 000 (1 min)&lt;/td&gt;\n&lt;td&gt;Случайный сдвиг для периода, чтобы избежать синхронизации разных таблетов. Реальный флаш будет наступать спустя &lt;code&gt;period + random(0, splay)&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;merge_rows_on_flush&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;Разрешает слияние версий и удаление строк по TTL при флаше.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;merge_deletions_on_flush&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;Разрешает слияние последовательных удалений в одно при флаше.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_dynamic_store_row_count&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;1 000 000&lt;/td&gt;\n&lt;td&gt;Максимальное количество строк в dynamic store.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_dynamic_store_pool_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;1 073 741 824 (1 GB)&lt;/td&gt;\n&lt;td&gt;Максимальный размер dynamic store.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;dynamic_store_overflow_threshold&lt;/td&gt;\n&lt;td&gt;double&lt;/td&gt;\n&lt;td&gt;0.7&lt;/td&gt;\n&lt;td&gt;Доля заполнения dynamic store относительно max_dynamic_store_row_count и max_dynamic_store_pool_size, при которой начинается флаш.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"compaction_attributes\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#compaction_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Compaction&lt;/span&gt;&lt;/a&gt;Compaction&lt;/h3&gt;\n&lt;h4 id=\"osnovnye-opcii\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#osnovnye-opcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основные опции&lt;/span&gt;&lt;/a&gt;Основные опции&lt;/h4&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Имя&lt;/th&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;auto_compaction_period&lt;/td&gt;\n&lt;td&gt;int*&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Интервал времени в мс для регулярной компактификации. Компактификация затронет каждый чанк таблицы по меньшей мере раз в auto_compaction_period. Подробнее можно прочитать в разделе &lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#periodic_compaction\"&gt;Регулярная компактификация&lt;/a&gt;. В большинстве случаев не рекомендуется к использованию.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;auto_compaction_period_splay_ratio&lt;/td&gt;\n&lt;td&gt;double&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;td&gt;Случайный сдвиг для периода, чтобы избежать синхронизации. Компактификация будет наступать спустя &lt;code&gt;period * (1 + random(0, splay_ratio))&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;periodic_compaction_mode&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;store&lt;/code&gt;, &lt;code&gt;partition&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;store&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Подробнее можно прочитать в разделе &lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#periodic_compaction\"&gt;Регулярная компактификация&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;forced_compaction_revision&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Подробнее можно прочитать в разделе &lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#forced_compaction\"&gt;Форсированная компактификация&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_overlapping_store_count&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;30&lt;/td&gt;\n&lt;td&gt;Максимальное допустимое число чанков, потенциально содержащих один ключ. При достижении порога запись в таблицу будет заблокирована, пока компактификация не оптимизирует структуру.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;critical_overlapping_store_count&lt;/td&gt;\n&lt;td&gt;int*&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Устанавливает порог, при достижении которого в компактификации перестают учитываться &lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#compaction_size_policy\"&gt;ограничения&lt;/a&gt; на размеры чанков в одной порции. Установка этой опции в небольшие значения (5-10) позволяет уменьшить OSC и скорость доступа к данным ценой заметного увеличения write amplication.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_compaction_and_partitioning&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;td&gt;Полностью отключает компактификацию. Запись в таблицу в таком состоянии быстро приведёт к превышению overlapping store count. Если запись не предполагается, вместо этого атрибута используйте монтирование таблицы в frozen состоянии.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"razmery-i-konstanty\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#razmery-i-konstanty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Размеры и константы&lt;/span&gt;&lt;/a&gt;Размеры и константы&lt;/h4&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Имя&lt;/th&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;min_partition_data_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;96 MB&lt;/td&gt;\n&lt;td&gt;Минимальный, желаемый и максимальный размер партиции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;desired_partition_data_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;256 MB&lt;/td&gt;\n&lt;td&gt;↑&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_partition_data_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;320 MB&lt;/td&gt;\n&lt;td&gt;↑&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;min_partitioning_data_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;64 MB&lt;/td&gt;\n&lt;td&gt;Минимальный и максимальный размер данных для одной порции партицирования. Увеличение позволяет снизить write amplification ценой повышения числа чанков в Эдене, а значит, увеличения overlapping store count.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_partitioning_data_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;1 GB&lt;/td&gt;\n&lt;td&gt;↑&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;min_partitioning_store_count&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;Минимальное и максимальное число чанков для одной порции партицирования.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_partitioning_store_count&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;5&lt;/td&gt;\n&lt;td&gt;↑&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;min_compaction_store_count&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;td&gt;Минимальное и максимальное число чанков для одной порции компактификации. Periodic и forced компактификации игнорируют нижнюю оценку, но учитывают верхнюю.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_compaction_store_count&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;5&lt;/td&gt;\n&lt;td&gt;↑&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;compaction_data_size_base&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;16 MB&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;compaction_data_size_ratio&lt;/td&gt;\n&lt;td&gt;double&lt;/td&gt;\n&lt;td&gt;2.0&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"ttl_attributes\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#ttl_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Удаление старых данных&lt;/span&gt;&lt;/a&gt;Удаление старых данных&lt;/h3&gt;\n&lt;p&gt;Подробно эти атрибуты описаны в разделе &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html#remove_old_data\"&gt;Удаление старых данных&lt;/a&gt;.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Имя&lt;/th&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;min_data_ttl&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;1 800 000 (30 min)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_data_ttl&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;1 800 000 (30 min)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;min_data_versions&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_data_versions&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"forced_compaction\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#forced_compaction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Форсированная компактификация&lt;/span&gt;&lt;/a&gt;Форсированная компактификация&lt;/h2&gt;\n&lt;p&gt;Для принудительного запуска компактификации всех чанков таблицы установите значение атрибута &lt;code&gt;forced_compaction_revision&lt;/code&gt; в значение &lt;code&gt;1&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Если выполнить &lt;code&gt;remount-table&lt;/code&gt;, настройка применится сразу ко всем таблетам таблицы. При работе с таблицами размером от терабайта это может создать всплеск нагрузки как на бандл таблицы, так и на кластер целиком. Поэтому рекомендуется выполнять &lt;code&gt;remount&lt;/code&gt; разных таблетов в разное время. Для этого используйте команду &lt;code&gt;yt remount-table --first-tablet-index X --last-tablet-index Y&lt;/code&gt;. Время, в течение которого стоит перемонтировать всю таблицу, можно приблизительно посчитать по формуле &lt;code&gt;table_data_weight / bundle_node_count / (100 Mb/s)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Чтобы отменить форсированную компактификацию, удалите атрибут &lt;code&gt;forced_compaction_revision&lt;/code&gt; с таблицы и выполните &lt;code&gt;remount-table&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Если размер таблицы больше 20 Tb или 100 000 чанков, перед запуском форсированной компактификации получите разрешение администратора.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"periodic_compaction\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#periodic_compaction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Регулярная компактификация&lt;/span&gt;&lt;/a&gt;Регулярная компактификация&lt;/h2&gt;\n&lt;p&gt;Компактификация автоматически запускается, когда в партиции оказывается достаточное число чанков. Обычно это происходит, если в таблицу идёт активная запись. Если записи нет, компактификация происходить не будет. Для того, чтобы регулярно запускать компактификацию даже при отсутствии записи в отдельные партиции или таблеты, можно включить регулярную компактификацию.&lt;/p&gt;\n&lt;p&gt;Использовать регулярную компактификацию имеет смысл, если нужно удалять данные по TTL или применять удаления, вызванные delete-rows, а штатной компактификации оказывается недостаточно.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Предупреждение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В большинстве сценариев в дополнительном включении регулярной компактификации нет необходимости. Напротив, часто она создаёт излишнюю нагрузку и может быть вредна.&lt;/p&gt;\n&lt;p&gt;Не следует использовать регулярную компактификацию для экономии числа чанков. Нормальный размер чанков динамической таблицы составляет порядка 40-60 Mb (в терминах compressed size). Если чанки вашей таблицы подходят под этот размер, нет необходимости пытаться их укрупнять.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для включения регулярной компактификации используется атрибут &lt;code&gt;auto_compaction_period&lt;/code&gt;. Он задаёт время, в течение которого каждый чанк будет подвергнут компактификации. После выставления атрибута необходимо выполнить команду &lt;code&gt;remount-table&lt;/code&gt; для применения настроек.&lt;/p&gt;\n&lt;h4 id=\"periodic_compaction_mode\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#periodic_compaction_mode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Режимы&lt;/span&gt;&lt;/a&gt;Режимы&lt;/h4&gt;\n&lt;p&gt;Имеется два режима периодической компактификации. Режим регулируется атрибутом &lt;code&gt;periodic_compaction_mode&lt;/code&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;store&lt;/code&gt; (значение по умолчанию): решение о компактификации каждого чанка, созданного ранее, чем &lt;code&gt;now - auto_compaction_period&lt;/code&gt;, принимается независимо. Применяется, если нужно удалять данные по TTL.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;partition&lt;/code&gt;: если в партиции есть хотя бы один чанк, созданный ранее, чем &lt;code&gt;now - auto_compaction_period&lt;/code&gt;, компактифицируются все чанки партиции одновременно. Применяется, если нужно очищать строки, удалённые через delete-rows.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Режим &lt;code&gt;partition&lt;/code&gt; лучше подходит для очистки строк, удалённых через delete-rows, поскольку в случае &lt;code&gt;store&lt;/code&gt; запись по некоторому ключу и соответствующий delete tombstone могут попасть в разные чанки, которые будут независимо компактифицироваться по очереди, и tombstone никогда не удалится.&lt;/p&gt;\n&lt;p&gt;Режим &lt;code&gt;store&lt;/code&gt; рассматривает чанки независимо, и, когда будет рассмотрен самый старый чанк, устаревшие данные удалятся.&lt;/p&gt;\n&lt;p&gt;Установка только атрибута &lt;code&gt;periodic_compaction_mode&lt;/code&gt; недостаточна для включения регулярной компактификации. Для этого необходимо явно установить атрибут &lt;code&gt;auto_compaction_period&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"periodic_compaction_period\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#periodic_compaction_period\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выбор периода&lt;/span&gt;&lt;/a&gt;Выбор периода&lt;/h4&gt;\n&lt;p&gt;Рекомендуется выбирать период, соизмеримый с TTL таблицы. К примеру, если TTL составляет 7 дней, можно выставить &lt;code&gt;auto_compaction_period&lt;/code&gt; в 3 дня. Это будет гарантировать, что строки гарантированно удалятся через 10 дней.&lt;/p&gt;\n&lt;p&gt;Установка слишком маленького периода может вызвать чрезмерную нагрузку на бандл. Предельно каждая нода бандла способна компактифицировать порядка 100-200 Mb/s. Как правило, нагрузка от регулярной компактификации не превосходит единиц Mb/s. Часто период соизмерим с &lt;code&gt;max_data_ttl&lt;/code&gt; или в несколько раз меньше него.&lt;/p&gt;\n&lt;p&gt;Например, есть таблица размером 500 Gb и периодом компактификации в сутки, в бандле две ноды. Тогда нагрузка на одну ноду составит 500 Gb / 86400 сек / 2 ≃ 3.1 Mb/s, что допустимо.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Предупреждение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Первоначальная установка &lt;code&gt;auto_compaction_period&lt;/code&gt; на таблицу с большим количеством старых чанков может привести к резкому запуску компактификации всех чанков. В этом случае стоит следовать тем же рекомендациям, что и для форсированной компактификации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы избежать синхронизации и усреднить нагрузку, при вычислении времени компактификации каждого конкретного чанка к &lt;code&gt;auto_compaction_period&lt;/code&gt; добавляется случайное отклонение, доля которого задаётся атрибутом &lt;code&gt;auto_compaction_period_splay_ratio&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"scenarios\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#scenarios\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сценарии&lt;/span&gt;&lt;/a&gt;Сценарии&lt;/h2&gt;\n&lt;h4 id=\"scenario_ttl\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#scenario_ttl\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Удаление данных по TTL&lt;/span&gt;&lt;/a&gt;Удаление данных по TTL&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Сценарий&lt;/strong&gt;: на таблице установлен TTL, но размер увеличивается, как будто TTL не применяется.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Решение&lt;/strong&gt;: используйте &lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#periodic_compaction\"&gt;периодическую компактификацию&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"write_delete\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#write_delete\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Удаление короткоживущих ключей&lt;/span&gt;&lt;/a&gt;Удаление короткоживущих ключей&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Сценарий&lt;/strong&gt;: строка записывается и через некоторое время удаляется. Требуется, чтобы delete tombstones не копились и место очищалось.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Решение&lt;/strong&gt;: используйте &lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#periodic_compaction\"&gt;периодическую компактификацию&lt;/a&gt; в режиме &lt;code&gt;partition&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"woodpecker\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#woodpecker\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Много записей по одному ключу&lt;/span&gt;&lt;/a&gt;Много записей по одному ключу&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Сценарий&lt;/strong&gt;: по одному ключу бывает больше нескольких тысяч записей.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Проблема&lt;/strong&gt;: в системе есть ограничение на количество версий одного ключа. Оно составляет порядка 30 000. Если его превысить, фоновые процессы будут завершаться ошибкой «Too many write timestamps in a versioned row».&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Решение&lt;/strong&gt;: Установите значение &lt;code&gt;True&lt;/code&gt; атрибута &lt;code&gt;merge_rows_on_flush&lt;/code&gt; и уменьшите TTL через атрибут &lt;code&gt;min_data_ttl&lt;/code&gt; так, чтобы количество версий в пределах TTL было не более нескольких тысяч. Если по одному ключу делается много удалений, используйте &lt;code&gt;merge_deletions_on_flush&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"tablet_inside\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#tablet_inside\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Устройство таблета и фоновых процессов&lt;/span&gt;&lt;/a&gt;Устройство таблета и фоновых процессов&lt;/h2&gt;\n&lt;p&gt;В этом разделе описано строение таблета. Оно не обязательно для прочтения, но облегчит понимание тем, кто захочет самостоятельно менять какие-то настройки.&lt;/p&gt;\n&lt;h3 id=\"tablet_description\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#tablet_description\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Устройство&lt;/span&gt;&lt;/a&gt;Устройство&lt;/h3&gt;\n&lt;p&gt;Таблет — часть таблицы, отвечающая за данные, находящиеся между двумя pivot-ключами. Типичный размер таблета составляет от 100 Mb (в случае таблиц в памяти) до единиц гигабайт, иногда достигая десятков гигабайт для особенно больших таблиц. С точки зрения мастер-сервера, таблет является набором чанков. Все описанные далее операции происходят на таблетной ноде, непосредственно обслуживающей таблет.&lt;/p&gt;\n&lt;p&gt;Подобно тому, как таблица разбита на таблеты, ограниченные pivot-ключами, таблет внутри разбит на партиции. Размер одной партиции — порядка 200 Mb (compressed size). Также есть особая партиция — Эден (Eden), границы которой совпадают с границами таблета. Каждый чанк относится либо к Эдену, либо к одной из партиций. Если чанк попадает целиком между граничными ключами некоторой партиции, то он относится к ней, иначе к Эдену.&lt;/p&gt;\n&lt;h3 id=\"flush\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#flush\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dynamic stores и сброс данных на диск&lt;/span&gt;&lt;/a&gt;Dynamic stores и сброс данных на диск&lt;/h3&gt;\n&lt;p&gt;В таблете всегда есть как минимум один dynamic store — активный. При записи данные сначала попадают в dynamic store. Когда dynamic store становится слишком большим (сотни мегабайт) или на ноде заканчивается память категории «tablet dynamic», происходит &lt;em&gt;ротация&lt;/em&gt; стора — создаётся новый активный стор, а старый становится пассивным. Это активирует процесс флаша, и со временем пассивный стор сбрасывается на диск.&lt;/p&gt;\n&lt;p&gt;Если флаш по какой-то причине не работает, данные копятся в памяти, и после переполнения запись начинает падать с ошибкой «Node is out of tablet memory, all writes disabled».&lt;/p&gt;\n&lt;p&gt;По умолчанию во время флаша в чанк сохраняются все версии строки. Чтобы применять очистку по TTL, следует использовать атрибут &lt;code&gt;merge_rows_on_flush&lt;/code&gt;. Это имеет смысл делать, когда TTL меньше типичного времени жизни dynamic store (порядка 15 минут), а по одному ключу происходит много записей.&lt;/p&gt;\n&lt;h3 id=\"partitioning\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#partitioning\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Партицирование&lt;/span&gt;&lt;/a&gt;Партицирование&lt;/h3&gt;\n&lt;p&gt;Чанк, сброшенный на диск, оказывается в Эдене. Как правило, он содержит ключи из всего диапазона таблета, поэтому не может быть отнесён к конкретной партиции. Процесс партицирования берёт один или несколько чанков из Эдена, сливает их и разбивает данные по партициям, помещая в каждую партицию по одному чанку. Если в Эдене много чанков небольшого размера, то сначала в нём запустится компактификация и их объединит.&lt;/p&gt;\n&lt;p&gt;Маленькие чанки делают систему менее эффективной. Первая причина — накладные расходы. Вторая — рост write amplification. Предположим, нода обслуживает несколько таблетов большой таблицы. Поскольку таблетов много, а память общая, размер dynamic store в каждом таблете будет составлять десятки мегабайт, что довольно немного. Если в таблете 100 партиций, то после партицирования в каждой из них размер чанка будет составлять меньше мегабайта. Если увеличить минимально допустимый размер Эдена, при котором запускается партицирование, то в партиции будут сбрасываться чанки бо́льшего размера ценой возросшего overlapping store count.&lt;/p&gt;\n&lt;h3 id=\"compaction\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#compaction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Компактификация&lt;/span&gt;&lt;/a&gt;Компактификация&lt;/h3&gt;\n&lt;p&gt;Процесс компактификации читает порцию чанков в одной партиции и объединяет их в один (реже — несколько), физически удаляя строки и старые версии. Компактификация может запускаться по нескольким причинам:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;forced: на таблицу установлен атрибут &lt;code&gt;forced_compaction_revision&lt;/code&gt;. В этом случае компактификации будут подвергнуты все чанки таблета, размер порции будет ограничен только значением &lt;code&gt;max_compaction_store_count&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;periodic: на таблицу установлен атрибут &lt;code&gt;auto_compaction_period&lt;/code&gt;. Будут компактифицированы чанки, созданные ранее &lt;code&gt;now - auto_compaction_period&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;regular: обычный режим, запускающийся без внешнего воздействия.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"compaction_size_policy\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#compaction_size_policy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выбор чанков исходя из размера&lt;/span&gt;&lt;/a&gt;Выбор чанков исходя из размера&lt;/h4&gt;\n&lt;p&gt;В обычном режиме система выбирает чанки с учетом write amplification. Если в партиции есть чанк размером 100 Mb и периодически появляется чанк размера 1 Mb, то если каждый раз компактифицировать их вместе, будет получена амплификацию в 100 раз. Используются следующие правила:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;в порции должно быть от &lt;code&gt;min_compaction_store_count&lt;/code&gt; до &lt;code&gt;max_compaction_store_count&lt;/code&gt; чанков, но чем больше, тем лучше;&lt;/li&gt;\n&lt;li&gt;отсортируем чанки по размеру. Каждый следующий чанк должен быть не более чем в &lt;code&gt;compaction_data_size_ratio&lt;/code&gt; раз больше, чем сумма размеров предыдущих;&lt;/li&gt;\n&lt;li&gt;предыдущее правило не применяется, пока суммарный размер чанков меньше &lt;code&gt;compaction_data_size_base&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Например, ratio = 2, base = 16 Mb. Тогда:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;набор чанков размерами 1 Kb, 1 Mb, 10 Mb допустим: сумма не больше 16 Mb;&lt;/li&gt;\n&lt;li&gt;набор чанков размерами 10 Mb, 20 Mb, 50 Mb, 150 Mb допустим: 50 &amp;lt; 2 × (10 + 20), 150 &amp;lt; 2 × (10 + 20 + 50);&lt;/li&gt;\n&lt;li&gt;набор чанков размерами 1 Mb, 10 Mb, 100 Mb не допустим: 100 &amp;gt; 2 × (10 + 1).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Уменьшение base и ratio позволяет улучшить WA ценой увеличения OSC. В предельном случае, когда base = 1, а данные не удаляются, можно показать, что WA логарифмически зависит от объёма данных. Каждый раз, когда некоторая строка участвует в компактификации, размер содержащего её чанка увеличивается хотя бы в (1 + 1 / ratio) раз. Следовательно, всего строка поучаствует не более чем в log(tablet_size, 1 + 1 / ratio) компактификациях. На практике эта оценка неточна не только из-за удалений, но также из-за того, что при достижении порогового размера партиция разделяется на две.&lt;/p&gt;\n&lt;h4 id=\"major_timestamp\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/compaction.html#major_timestamp\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Механизм очистки старых версий&lt;/span&gt;&lt;/a&gt;Механизм очистки старых версий&lt;/h4&gt;\n&lt;p&gt;Когда компактификация сливает очередную порцию чанков, она может отбросить старые версии некоторых строк и применить удаления. Однако это можно делать не всегда, поскольку компактификация рассматривает не все чанки в партиции, а только часть.&lt;/p&gt;\n&lt;p&gt;Рассмотрим таблицу с min/max_data_ttl = 0, min/max_data_versions = 1 (по каждому ключу необходимо хранить только самую свежую версию). Например, по некоторому ключу было две записи: {value = 1; timestamp = 10}, {value = 2; timestamp = 20}, и удаление с timestamp = 30.&lt;br /&gt;\nПусть эти версии попали в три разных чанка. Если компактификация рассмотрит только первый и третий чанк, в обработку попадут следующие данные:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;delete tombstone {timestamp = 30}\n{value = 1; timestamp = 10}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"879\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-879\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-879\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-879.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если применить удаления и полностью отбросить эту строку, не записывая её в новый чанк, это приведёт к некорректному чтению: дальнейшие чтения прочитают значение {value = 2; timestamp = 20}, хотя строка была удалена.&lt;/p&gt;\n&lt;p&gt;Во избежание этой проблемы вычисляется &lt;em&gt;major timestamp&lt;/em&gt;: минимальный timestamp данных во всех чанках данной партиции (и Эдене), не попавший в текущую порцию компакшна. После этого компактификация имеет право удалять только версии с timestamp &amp;lt; major timestamp.&lt;/p&gt;\n&lt;p&gt;Данная логика может приводить к тому, что устаревшие версии на самом деле не удаляются. Во-первых, если в таблет или партицию не идёт запись, то множество чанков в партиции стабилизируется и компатификация перестаёт запускаться, не имея возможности узнать об устаревании некоторых строк. Во-вторых, если в партиции есть один большой чанк и запись идёт не очень интенсивно, то вновь появляющиеся маленькие чанки будут компактифицироваться между собой, не затрагивая большой. Большой чанк накладывает ограничение на major timestamp, поэтому даже если ttl = 0, повторные версии в свежих чанках удаляться не будут. Бороться с этим можно при помощи &lt;code&gt;auto_compaction_period&lt;/code&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/dynamic-tables/compaction.md","sourcePath":"ru/user-guide/dynamic-tables/compaction.md"},"headings":[{"title":"Глоссарий","href":"ru/user-guide/dynamic-tables/compaction.html#glossary","level":2},{"title":"Список атрибутов","href":"ru/user-guide/dynamic-tables/compaction.html#attributes","level":2,"items":[{"title":"Flush","href":"ru/user-guide/dynamic-tables/compaction.html#flush_attributes","level":3},{"title":"Compaction","href":"ru/user-guide/dynamic-tables/compaction.html#compaction_attributes","level":3,"items":[{"title":"Основные опции","href":"ru/user-guide/dynamic-tables/compaction.html#osnovnye-opcii","level":4},{"title":"Размеры и константы","href":"ru/user-guide/dynamic-tables/compaction.html#razmery-i-konstanty","level":4}]},{"title":"Удаление старых данных","href":"ru/user-guide/dynamic-tables/compaction.html#ttl_attributes","level":3}]},{"title":"Форсированная компактификация","href":"ru/user-guide/dynamic-tables/compaction.html#forced_compaction","level":2},{"title":"Регулярная компактификация","href":"ru/user-guide/dynamic-tables/compaction.html#periodic_compaction","level":2},{"title":"Сценарии","href":"ru/user-guide/dynamic-tables/compaction.html#scenarios","level":2},{"title":"Устройство таблета и фоновых процессов","href":"ru/user-guide/dynamic-tables/compaction.html#tablet_inside","level":2,"items":[{"title":"Устройство","href":"ru/user-guide/dynamic-tables/compaction.html#tablet_description","level":3},{"title":"Dynamic stores и сброс данных на диск","href":"ru/user-guide/dynamic-tables/compaction.html#flush","level":3},{"title":"Партицирование","href":"ru/user-guide/dynamic-tables/compaction.html#partitioning","level":3},{"title":"Компактификация","href":"ru/user-guide/dynamic-tables/compaction.html#compaction","level":3,"items":[{"title":"Выбор чанков исходя из размера","href":"ru/user-guide/dynamic-tables/compaction.html#compaction_size_policy","level":4},{"title":"Механизм очистки старых версий","href":"ru/user-guide/dynamic-tables/compaction.html#major_timestamp","level":4}]}]}],"title":"Фоновая компактификация"},"router":{"pathname":"ru/user-guide/dynamic-tables/compaction","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
