            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе описаны транзакции применительно к динамическим таблицам. Транзакционная модель статических таблиц описана в разделе &lt;a href=\"user-guide/storage/transactions.html\"&gt;Транзакции статических таблиц&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Транзакции делятся на мастер-транзакции и таблет-транзакции. Мастер-транзакции позволяют выполнять операции с метаинформацией мастера. Таблет-транзакции — только записывать данные в динамические таблицы.&lt;/p&gt;\n&lt;p&gt;Чтение и модификация данных в динамических сортированных таблицах производится с помощью таблетных транзакций.&lt;/p&gt;\n&lt;p&gt;Для изоляции транзакций и разрешения конфликтов используется &lt;a href=\"https://en.wikipedia.org/wiki/Multiversion_concurrency_control\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;модель MVCC&lt;/a&gt;. Уровень изоляции по умолчанию — snapshot (не serializable snapshot).&lt;/p&gt;\n&lt;p&gt;Система поддерживает распределенные транзакции, то есть дает возможность изменения множества строк одной или нескольких динамических таблиц в пределах одной транзакции.&lt;/p&gt;\n&lt;h2 id=\"restrictions\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/transactions.html#restrictions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения&lt;/span&gt;&lt;/a&gt;Ограничения&lt;/h2&gt;\n&lt;p&gt;При использовании транзакций следует иметь в виду:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;транзакции должны быть короткими (ограничение по умолчанию 1 минута);&lt;/li&gt;\n&lt;li&gt;транзакции должны записывать ограниченные объемы данных (ограничение по умолчанию 100 000 строк).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Вычисление момента последней записи нетривиально, так как часть данных уже может быть записана на диск. Попытка прочитать с диска такие данные приводила бы к тому, что запись по ключу превратилась бы в случайное чтение по ключу. Дизайн системы YTsaurus предусматривает, что все записи в неё выполняются быстро. С точки зрения дисковой активности доступ последовательный. Поэтому реализована следующая логика:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;динамические сторы (dynamic_store), хранящие свежезаписанные данные, удерживаются в памяти узла кластера некоторое гарантированное время, даже если они уже записаны в чанки на диск;&lt;/li&gt;\n&lt;li&gt;проверка по таким динамическим сторам быстрая, так как не требует обращения к диску;&lt;/li&gt;\n&lt;li&gt;система запрещает коммит транзакций, время жизни которых превышает некоторую настраиваемую границу.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"timestamps\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/transactions.html#timestamps\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Временные метки&lt;/span&gt;&lt;/a&gt;Временные метки&lt;/h2&gt;\n&lt;p&gt;Каждое значение, сохранённое в сортированной динамической таблице, аннотировано временной меткой timestamp. Временные метки представляют собой 64-битные целые числа, порождаемые кластером по необходимости.&lt;/p&gt;\n&lt;p&gt;При старте любой транзакции происходит порождение стартовой временной метки. Все чтения динамических таблиц в пределах транзакции производятся относительно данной метки, тем самым порождая срез (snapshot) состояния данных в этих таблицах.&lt;/p&gt;\n&lt;p&gt;В момент коммита транзакции порождается еще одна временная метка — метка коммита. Все изменения в таблицах, произведенные данной транзакцией, аннотируются меткой коммита.&lt;/p&gt;\n&lt;p&gt;Временные метки в пределах кластера выдаются централизовано на мастер-серверах. Для лучшей масштабируемости клиенты запрашивают временные метки не напрямую, а через специальные прокси-серверы, которые буферизуют запросы. С практической точки зрения генерация новой временной метки стоит менее 10 ms в случае, когда кластер и клиент находятся в рамках одного ДЦ. Суммарная пропускная способность их генерации практически не ограничена.&lt;/p&gt;\n&lt;p&gt;Для временных меток гарантируются:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;уникальность — все полученные временные метки будут различны;&lt;/li&gt;\n&lt;li&gt;монотонность — если &lt;code&gt;A&lt;/code&gt; обозначает событие получения временной метки &lt;code&gt;T(A)&lt;/code&gt;, а &lt;code&gt;B&lt;/code&gt; обозначает событие заказа временной метки &lt;code&gt;T(B)&lt;/code&gt;, причем &lt;code&gt;A&lt;/code&gt; &lt;a href=\"https://en.wikipedia.org/wiki/Happened-before\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;случилось до&lt;/a&gt; &lt;code&gt;B&lt;/code&gt;, то &lt;code&gt;T(A) &amp;lt; T(B)&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;консистентность — если транзакция &lt;code&gt;A&lt;/code&gt; имеет метку коммита &lt;code&gt;Tc(A)&lt;/code&gt;, а транзакция &lt;code&gt;B&lt;/code&gt; — метку начала &lt;code&gt;Ts(B)&lt;/code&gt;, причем &lt;code&gt;Tc(A) &amp;lt; Ts(B)&lt;/code&gt;, то транзакция &lt;code&gt;B&lt;/code&gt; \"увидит\" все изменения, выполненные транзакцией &lt;code&gt;A&lt;/code&gt; (и только такие). Верно и то, что любая транзакция в процессе работы \"не видит\" собственных изменений (т. к. изменения ещё не получили никакой временной метки).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Дополнительно временные метки устроены так, что по ним легко вычислить приближённое физическое время момента порождения с погрешностью порядка секунды.&lt;/p&gt;\n&lt;p&gt;Работа с транзакциями требует от клиента поддержки определенного состояния в памяти. Например, необходимо помнить временную метку старта транзакции. Также внесенные в пределах транзакции изменения буферизируются на клиенте и рассылаются лишь в момент коммита. В текущей реализации поддержкой такого состояния занимается клиентская библиотека YTsaurus, но теоретически существует возможность переложить эту работу на подходящую stateful proxy.&lt;/p&gt;\n&lt;h2 id=\"guarantees\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/transactions.html#guarantees\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ослабление гарантий&lt;/span&gt;&lt;/a&gt;Ослабление гарантий&lt;/h2&gt;\n&lt;p&gt;По умолчанию при работе с динамическими сортированными таблицами все пользовательские транзакции являются атомарными и гарантируют сохранность данных: записанные изменения не могут пропасть.&lt;/p&gt;\n&lt;p&gt;Для обеспечения атомарности используется техника двухфазного коммита, а для обеспечения сохранности данных сервер дожидается записи данных на диск. Суммарно данные гарантии вносят существенный вклад в латентность операций записи (сотни миллисекунд). Тем не менее бывают пользовательские сценарии, когда допустимы менее строгие гарантии, но требуется заметно меньшая латентность операций записи. Для поддержки таких сценариев в системе есть ряд параметров, позволяющих задавать пониженные уровни атомарности и сохранности.&lt;/p&gt;\n&lt;h2 id=\"atomicity\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/transactions.html#atomicity\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атомарность&lt;/span&gt;&lt;/a&gt;Атомарность&lt;/h2&gt;\n&lt;p&gt;Атомарность транзакций означает, что если пользователь в момент времени &lt;code&gt;t&lt;/code&gt; наблюдает эффект (записанные данные) от транзакции &lt;code&gt;T&lt;/code&gt;, то в любой последующий момент времени &lt;code&gt;t'&lt;/code&gt; он наблюдает все эффекты от транзакции &lt;code&gt;T&lt;/code&gt;. Например, если пользователь 1 поменял строки с ключами &lt;code&gt;k_1&lt;/code&gt; и&lt;code&gt; k_2&lt;/code&gt; в одной или разных динамических таблицах, то невозможна ситуация, когда пользователь 2 прочитает измененную строку &lt;code&gt;k_1&lt;/code&gt;, но неизмененную строку k_2.&lt;/p&gt;\n&lt;p&gt;У таблиц имеется атрибут &lt;code&gt;atomicity&lt;/code&gt;, который определяет гарантии на применяемые транзакции. Данный атрибут можно изменять только для &lt;a href=\"user-guide/dynamic-tables/overview.html#mount_table\"&gt;отмонтированных&lt;/a&gt; таблиц. Значения атрибута могут быть следующие:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;full&lt;/code&gt; — означает, что транзакции полностью атомарны (режим по умолчанию). В режиме &lt;code&gt;full&lt;/code&gt; изменения становятся атомарно видимыми в любой момент времени после commit timestamp (как было указано ранее, в этом режиме система обеспечивает уровень изоляции snapshot isolation).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;none&lt;/code&gt; — означает, что система не дает никаких гарантий об атомарности внесения изменений. В режиме &lt;code&gt;none&lt;/code&gt; возможны ситуации, когда коммит завершился ошибкой (к примеру, по причине недоступности какого-либо таблета), но часть изменений была зафиксирована и стала видна пользователям.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"non-atomicity\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/transactions.html#non-atomicity\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Неатомарные транзакции&lt;/span&gt;&lt;/a&gt;Неатомарные транзакции&lt;/h3&gt;\n&lt;p&gt;Для неатомарных транзакций уровнем изоляции можно считать read committed. Чтение внутри неатомарных транзакций производится не относительно момента старта (как таковой он отсутствует), вместо этого читаются самые свежие записанные данные.&lt;/p&gt;\n&lt;p&gt;Записываемые неатомарными транзакциями значения получают метки времени, но метки формируются клиентами самостоятельно на основе данных системных часов. Система YTsaurus при этом проверяет, что данные метки не отличаются от серверных, формируемых сериализуемым образом, более чем на значение &lt;code&gt;client_timestamp_threshold&lt;/code&gt; (по умолчанию одна минута) в конфигурации системы. Если разница между клиентскими и серверными часами превышает указанный порог, клиент получит ошибку &lt;code&gt;Transaction timestamp is off limits, check the local clock readings&lt;/code&gt;.&lt;br /&gt;\nДаже при неатомарных модификациях в пределах строки гарантируется уникальность и монотонность меток. Для этого система YTsaurus при необходимости исправляет в большую сторону метки, получаемые от клиента.&lt;/p&gt;\n&lt;p&gt;Неатомарные транзакции не берут блокировок, поэтому при одновременной записи учитывается та транзакция, которая коммитится последней (last write wins). Успешное завершение неатомарной транзакции означает применение всех изменений на сервере.&lt;/p&gt;\n&lt;p&gt;В случае неатомарных транзакций в течение времени коммита сторонние наблюдатели могут увидеть изменения, примененными лишь частично. Для атомарных транзакций видимости в любой момент кем-угодно части изменений означает видимость всех изменений. После завершения коммита в любом режиме, кроме &lt;code&gt;atomicity=none&lt;/code&gt; + &lt;code&gt;durability=async&lt;/code&gt; (про &lt;code&gt;durability&lt;/code&gt; см. &lt;a href=\"ru/user-guide/dynamic-tables/transactions.html#durability\"&gt;Сохранность&lt;/a&gt;), все изменения гарантированно видны всем.&lt;/p&gt;\n&lt;p&gt;Чтобы воспользоваться неатомарными транзакциями необходимо:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;указать для таблицы атрибут &lt;code&gt;atomicity&lt;/code&gt; равным &lt;code&gt;none&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;указать режим &lt;code&gt;atomicity=none&lt;/code&gt; при старте транзакции в её настройках.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В момент коммита на сервере происходит проверка режима атомарности таблицы и режима атомарности, указанного клиентом. Если режимы не совпадают, то возникает ошибка времени исполнения. Обязательное указание режима атомарности для транзакции существует по двум причинам:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;идеологическая — для того чтобы места в коде, где происходят неатомарные коммиты, были явно отмечены;&lt;/li&gt;\n&lt;li&gt;техническая — при старте атомарной транзакции происходит дополнительная задержка, связанная с вычислением стартовой метки времени. Для неатомарных транзакций данная метка не имеет смысла. Тем самым, оказывается невозможным бесплатно стартовать неатомарную транзакцию и выяснить факт ее неатомарности лишь в момент коммита.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В таблицы с &lt;code&gt;atomicity=none&lt;/code&gt; можно единоразово записать много версий одного и того же значения. Например, на записывающей стороне перезапрос уходит в бесконечный цикл, или реплицированная таблица с накопившейся очередью записывает её сразу всю в реплику. Это приводит к тому, что данные таблицы не могут быть записаны на диск, и запись в неё останавливается.&lt;/p&gt;\n&lt;p&gt;Поэтому для таблиц с &lt;code&gt;atomicity=none&lt;/code&gt; рекомендуется выставить следующие опции:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;min_data_ttl = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\nmerge_rows_on_flush = %&lt;span class=\"hljs-literal\"&gt;&lt;span class=\"hljs-keyword\"&gt;true&lt;/span&gt;&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"175\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-175\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-175\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-175.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В режиме неатомарных транзакций система ведет себя практически аналогично &lt;a href=\"https://hbase.apache.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apache HBase&lt;/a&gt;. За счет ослабления гарантий каждая запись требует лишь одного round-trip к серверу и одного цикла записи данных на диск (десятки миллисекунд).&lt;/p&gt;\n&lt;h2 id=\"durability\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/transactions.html#durability\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сохранность&lt;/span&gt;&lt;/a&gt;Сохранность&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Параметр &lt;code&gt;durabilty&lt;/code&gt; deprecated. После его удаления поведение будет эквивалентным поведению с &lt;code&gt;durability=sync&lt;/code&gt;. В качестве альтернативного способа получить гарантии, предоставляемые режимом &lt;code&gt;durability=async&lt;/code&gt;, предлагается не ждать ответ на CommitTransaction.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сохранность транзакции означает, что если пользователь в момент времени &lt;code&gt;t&lt;/code&gt; успешно закоммитил транзакцию &lt;code&gt;T&lt;/code&gt; (получил подтверждение от сервера), то в любой последующий момент времени &lt;code&gt;t'&lt;/code&gt; он наблюдает все эффекты от транзакции &lt;code&gt;T&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Для неатомарных транзакций существует также способ радикально понизить их латентность до единиц миллисекунд ценой сохранности. При старте транзакции можно указать параметр &lt;code&gt;durability&lt;/code&gt;, который имеет следующие значения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;async — транзакция была принята сервером, сохранена в памяти, и, при отсутствии сбоев, когда-нибудь будет записана на диск (только для неатомарных транзакций). В этом режиме также теряется гарантия read-after-write;&lt;/li&gt;\n&lt;li&gt;sync — транзакция была принята сервером, подтверждена кворумом серверов и сохранена в журналы на диск; тем самым, при правильных настройках репликации и отсутствии серьёзных проблем, переживает сбои (режим по умолчанию).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"methods\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/transactions.html#methods\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поддерживаемые операции&lt;/span&gt;&lt;/a&gt;Поддерживаемые операции&lt;/h2&gt;\n&lt;h3 id=\"create\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/transactions.html#create\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создание транзакции&lt;/span&gt;&lt;/a&gt;Создание транзакции&lt;/h3&gt;\n&lt;p&gt;В системе YTsaurus существует два вида транзакций:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;мастер-транзакции — создаются и поддерживаются на мастере;  дают возможность работы только с Кипарисом;&lt;/li&gt;\n&lt;li&gt;таблет-транзакции — создаются клиентами без участия мастера; дают возможность работы с динамическими таблицами, но не с Кипарисом.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Вид транзакции указывается клиентом при ее создании. При запуске транзакции система генерирует временную метку начала транзакции. В случае мастер-транзакции временная метка регистрируется на мастере и периодически опрашивается клиентом. В случае таблет-транзакции её состояние обслуживает клиентская библиотека, с точки зрения системы YTsaurus транзакция не видна и ничего не стоит.&lt;/p&gt;\n&lt;p&gt;В пределах одной таблетной транзакции можно выполнять запись в произвольный набор строк одной или нескольких динамических таблиц. Запись в динамические таблицы из мастер-транзакций невозможна.&lt;/p&gt;\n&lt;p&gt;Для таблет-транзакций можно указать настройки &lt;code&gt;atomicity&lt;/code&gt; и &lt;code&gt;durability&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"insert_rows\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/transactions.html#insert_rows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запись строки&lt;/span&gt;&lt;/a&gt;Запись строки&lt;/h3&gt;\n&lt;p&gt;Клиент может выполнить запись данных в пределах активной транзакции методом &lt;code&gt;insert_rows&lt;/code&gt;. Для этого он должен сообщить записываемые строки. В каждой такой строке должны присутствовать все ключевые поля. Часть полей данных из указанных в схеме может отсутствовать.&lt;/p&gt;\n&lt;p&gt;Семантически если строки с указанным ключом в таблице нет, то она появляется. Если же строка с таким ключом уже есть, то происходит перезапись части колонок.&lt;/p&gt;\n&lt;p&gt;При указании части полей существуют режимы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;overwrite&lt;/code&gt; — все неуказанные поля обновляют свои значения на &lt;code&gt;null&lt;/code&gt; (режим по умолчанию);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;update&lt;/code&gt; — включается опцией &lt;code&gt;update == true&lt;/code&gt;. В таком случае сохранится предыдущее значение. В этом режиме необходимо передать все колонки, помеченные атрибутом &lt;code&gt;required&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При чтении и выполнении SQL запроса видны данные только на момент начала транзакции. Изменения, записанные в пределах той же транзакции, для чтения недоступны.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"terminate\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/transactions.html#terminate\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Завершение транзакции&lt;/span&gt;&lt;/a&gt;Завершение транзакции&lt;/h3&gt;\n&lt;p&gt;При этом вызове накопленные в процессе работы изменения отправляются на кластер и происходит попытка коммита. Коммит может быть успешным, и в этом случае клиент узнает временную метку конца транзакции. Коммит может быть неуспешным (по различным причинам, начиная от сетевых проблем и временной недоступности отдельных узлов кластера и заканчивая конфликтами между транзакциями). Не существует встроенного надежного средства узнать, завершился ли коммит успешно (сообщение об этом могло потеряться по пути к клиенту).&lt;/p&gt;\n&lt;h3 id=\"abort\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/transactions.html#abort\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Прерывание транзакции&lt;/span&gt;&lt;/a&gt;Прерывание транзакции&lt;/h3&gt;\n&lt;p&gt;На клиенте освобождается память, занятая под накопленные в транзакции изменения. Если это мастер-транзакция, то она прерывается на мастер-сервере. Если это таблет-транзакция, то никаких дополнительных действий не требуется.&lt;/p&gt;\n&lt;h3 id=\"conflicts\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/transactions.html#conflicts\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Проверка конфликтов транзакций&lt;/span&gt;&lt;/a&gt;Проверка конфликтов транзакций&lt;/h3&gt;\n&lt;p&gt;Для проверки и предотвращения конфликтов между атомарными транзакциями, которые работают (блокируют на чтение или модифицируют) с пересекающимися по ключам с данными, на строках таблиц существуют блокировки или локи:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;в случае блокировок на чтение используются shared-локи.&lt;/li&gt;\n&lt;li&gt;для модификации данных используются exclusive-локи.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В простейшем случае без дополнительной настройки с каждым ключом связан один основной &lt;a href=\"https://en.wikipedia.org/wiki/Readers%E2%80%93writer_lock\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;shared-exclusive lock&lt;/a&gt;. Данная функциональность реализована в виде счетчика shared-блокировок и флага exclusive-блокировки.&lt;/p&gt;\n&lt;p&gt;По умолчанию блокировки распространяются сразу на целые строки. В системе существует возможность повысить гранулярность блокировок, для этого следует разметить колонки в схеме атрибутом &lt;code&gt;lock&lt;/code&gt;, указав в нём имя дополнительного лока. Тем самым можно разбить колонки на группы, каждая из которых управляется своим локом. Если для колонки не указан атрибут &lt;code&gt;lock&lt;/code&gt;, то считается, что она управляется основным локом. Если транзакция записывает по ключу, то она берет локи, управляющие всеми затронутыми колонками.&lt;/p&gt;\n&lt;p&gt;Нельзя взять дополнительный лок, если другой транзакцией уже взят основной. При удалении строки транзакция берет основной лок.&lt;/p&gt;\n&lt;h4 id=\"exclusive_lock\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/transactions.html#exclusive_lock\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Блокировка на модификацию&lt;/span&gt;&lt;/a&gt;Блокировка на модификацию&lt;/h4&gt;\n&lt;p&gt;Гарантируется, что не может быть двух транзакций, одновременно модифицирующих один и тот же ключ.&lt;br /&gt;\nПри модификации данных по ключу — записи или удалении — транзакция в момент коммита берет exclusive-лок по данному ключу. Если указанный лок уже взят другой модифицирующей транзакцией или некоторым количеством читающих транзакций, взявших shared-локи, то возникает конфликт и транзакция прерывается.&lt;/p&gt;\n&lt;p&gt;Гарантируется, что по одному и тому же ключу не могут записывать данные транзакции, время жизни которых пересекается.&lt;br /&gt;\nЛоки на строки берутся и удерживаются только на протяжении коммита. До этого времени данные находятся на клиенте. Коммит в системе двухфазный, и его процесс начинается с временной метки &lt;code&gt;prepare&lt;/code&gt;, а заканчивается временной меткой &lt;code&gt;commit&lt;/code&gt;.&lt;br /&gt;\nНапример, транзакции &lt;code&gt;A&lt;/code&gt; и &lt;code&gt;B&lt;/code&gt; стартовали примерно одновременно, затем &lt;code&gt;A&lt;/code&gt; выполнила запись по ключу &lt;code&gt;k&lt;/code&gt; и закоммитилась. Теперь транзакция &lt;code&gt;B&lt;/code&gt; могла бы выполнить запись по &lt;code&gt;k&lt;/code&gt; и закоммититься, так как никакого лока на &lt;code&gt;k&lt;/code&gt; больше нет. Но такое поведение противоречит уровню изоляции snapshot, обеспечиваемому системой.&lt;/p&gt;\n&lt;p&gt;Поэтому в момент модификации транзакцией &lt;code&gt;B&lt;/code&gt; ключа помимо проверки наличия лока на этом ключе система также проверяет:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;не было ли по данному ключу записей с метками времени больше &lt;code&gt;Tstart(B)&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;не был ли данный ключ заблокирован другой транзакцией до времени, большего &lt;code&gt;Tstart(B)&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Если хотя бы одно из условий не выполняется, возникает конфликт.&lt;/p&gt;\n&lt;h4 id=\"shared_lock\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/transactions.html#shared_lock\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Блокировка на чтение&lt;/span&gt;&lt;/a&gt;Блокировка на чтение&lt;/h4&gt;\n&lt;p&gt;В случае блокировки на чтение кроме проверки возможности взятия shared-лока проверяется только отсутствие модификаций по данному ключу с метками времени больше &lt;code&gt;Tstart(B)&lt;/code&gt;. Структура для проверки конфликтов транзакций определяется счетчиком shared-блокировок, флагом exclusive-блокировки и двумя временными метками — временем до которого строка была заблокирована на чтение и временем последней модификации строки.&lt;/p&gt;\n&lt;p&gt;По окончании модификации строки exclusive-лок отпускается, а в значение времени последнего изменения записывается временная метка commit. При завершении транзакции, берущей блокировки на чтение (shared-локи), по окончании процесса коммита отпускается shared-лок, и в случае strong-блокировки записывается временная метка коммита транзакции. В случае weak-блокировки временная метка не записывается.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/dynamic-tables/transactions.md","sourcePath":"ru/user-guide/dynamic-tables/transactions.md"},"headings":[{"title":"Ограничения","href":"ru/user-guide/dynamic-tables/transactions.html#restrictions","level":2},{"title":"Временные метки","href":"ru/user-guide/dynamic-tables/transactions.html#timestamps","level":2},{"title":"Ослабление гарантий","href":"ru/user-guide/dynamic-tables/transactions.html#guarantees","level":2},{"title":"Атомарность","href":"ru/user-guide/dynamic-tables/transactions.html#atomicity","level":2,"items":[{"title":"Неатомарные транзакции","href":"ru/user-guide/dynamic-tables/transactions.html#non-atomicity","level":3}]},{"title":"Сохранность","href":"ru/user-guide/dynamic-tables/transactions.html#durability","level":2},{"title":"Поддерживаемые операции","href":"ru/user-guide/dynamic-tables/transactions.html#methods","level":2,"items":[{"title":"Создание транзакции","href":"ru/user-guide/dynamic-tables/transactions.html#create","level":3},{"title":"Запись строки","href":"ru/user-guide/dynamic-tables/transactions.html#insert_rows","level":3},{"title":"Завершение транзакции","href":"ru/user-guide/dynamic-tables/transactions.html#terminate","level":3},{"title":"Прерывание транзакции","href":"ru/user-guide/dynamic-tables/transactions.html#abort","level":3},{"title":"Проверка конфликтов транзакций","href":"ru/user-guide/dynamic-tables/transactions.html#conflicts","level":3,"items":[{"title":"Блокировка на модификацию","href":"ru/user-guide/dynamic-tables/transactions.html#exclusive_lock","level":4},{"title":"Блокировка на чтение","href":"ru/user-guide/dynamic-tables/transactions.html#shared_lock","level":4}]}]}],"title":"Мультиверсионность и транзакционность динамических таблиц"},"router":{"pathname":"ru/user-guide/dynamic-tables/transactions","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
