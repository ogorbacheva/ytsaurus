        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе описан пример создания простого веб-сервиса с использованием динамических таблиц.&lt;/p&gt;\n&lt;p&gt;В рамках примера будет построен бекэнд для небольшого сервиса хранения и показа комментариев. Можно рассматривать его как упрощенный аналог &lt;a href=\"https://www.reddit.com\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Reddit&lt;/a&gt;.&lt;br /&gt;\nДля этого будет разработан stateless сервис c HTTP-интерфейсом, работающий поверх консистентного, отказоустойчивого и масштабируемого хранилища, в котором будут находиться топики, комментарии, лайки.&lt;/p&gt;\n&lt;p&gt;Используемые технологии и инструменты:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Исходный код сервиса на Python 3.4 и выше.&lt;/li&gt;\n&lt;li&gt;В качестве хранилища будут использоваться &lt;a href=\"user-guide/dynamic-tables/replicated-dynamic-tables.html\"&gt;реплицированные динамические таблицы&lt;/a&gt; YTsaurus в режиме синхронной репликации. Работа с динамическими таблицами реализована через RPC прокси.&lt;/li&gt;\n&lt;li&gt;В качестве основы для HTTP API будет использоваться фреймворк &lt;a href=\"http://flask.pocoo.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Flask&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данный пример не предусматривает разработку таких компонент как: авторизация, rate limiting, сервисные мониторинги.&lt;br /&gt;\nОписываемый пример предназначен в первую очередь для знакомства с принципами использования и возможностями динамических таблиц YTsaurus, а не для разработки production high-load веб-сервисов на Python.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы скачать примеры кода, перейдите по &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/examples/comment_service\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ссылке&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"designing\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#designing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Проектирование&lt;/span&gt;&lt;/a&gt;Проектирование&lt;/h2&gt;\n&lt;p&gt;Требования к сервису:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Все комментарии, хранимые в сервисе, должны относиться к одному из топиков.&lt;/li&gt;\n&lt;li&gt;Комментарии внутри топика должны быть организованы в дерево, у каждого комментария, кроме корневого комментария топика, должен быть один родитель.&lt;/li&gt;\n&lt;li&gt;Каждый комментарий должен характеризоваться строкой &lt;code&gt;parent_path&lt;/code&gt;. Она представляет собой путь из идентификаторов предков данного комментария в дереве.&lt;/li&gt;\n&lt;li&gt;Для каждого комментария должно храниться имя пользователя, количество просмотров, время создания.&lt;/li&gt;\n&lt;li&gt;API должно позволять:\n&lt;ul&gt;\n&lt;li&gt;создавать, редактировать и удалять комментарии;&lt;/li&gt;\n&lt;li&gt;выбирать все комментарии по топику или поддерево комментариев внутри топика;&lt;/li&gt;\n&lt;li&gt;выбирать последние комментарии, оставленные данным пользователем;&lt;/li&gt;\n&lt;li&gt;выбирать последние добавленные топики.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ожидаемые характеристики:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;до 50 000 комментариев внутри топика;&lt;/li&gt;\n&lt;li&gt;типичный размер комментария — не больше десятков тысяч символов;&lt;/li&gt;\n&lt;li&gt;по нагрузке (RPS) и объему данных сервис должен горизонтально масштабироваться.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"api\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы API&lt;/span&gt;&lt;/a&gt;Методы API&lt;/h3&gt;\n&lt;p&gt;В случае POST-запросов параметры запросов передаются в теле запроса в виде JSON-документа. В GET-запросах — в URL. Во всех случаях результат запроса или ошибка приходит в теле ответа в виде JSON-документа. Возможные HTTP-коды ответа:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;HTTP код&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;200&lt;/td&gt;\n&lt;td&gt;GET/POST запрос был успешно выполнен.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;201&lt;/td&gt;\n&lt;td&gt;Значение было успешно добавлено.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;400&lt;/td&gt;\n&lt;td&gt;Некорректный запрос. Например, не заданы некоторые обязательные параметры.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;404&lt;/td&gt;\n&lt;td&gt;Объект или объекты по заданному критерию не найдены. Например, попытка добавить комментарий в несуществующий топик.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;409&lt;/td&gt;\n&lt;td&gt;Конфликт при внесении изменений в динамическую таблицу.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;503&lt;/td&gt;\n&lt;td&gt;В данный момент сервис не может обработать запрос. Например, мета-кластер обновляется и/или динамические таблицы отмонтированы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;524&lt;/td&gt;\n&lt;td&gt;Превышен таймаут при работе с динамическими таблицами.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;В случае любой ошибки с кодами 4xx и 5xx в теле ответа приходит JSON-документ вида &lt;code&gt;{\"error\" : \"message\"}&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Запись данных — добавление, изменение, удаление комментария — будет реализовано через &lt;code&gt;POST&lt;/code&gt;, чтение — через &lt;code&gt;GET&lt;/code&gt;. В качестве идентификатора комментария используется &lt;code&gt;guid&lt;/code&gt; — такой подход позволит обеспечивать равномерную нагрузку на шарды динамических таблиц.&lt;/p&gt;\n&lt;h4 id=\"call_signatures\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#call_signatures\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сигнатуры вызовов&lt;/span&gt;&lt;/a&gt;Сигнатуры вызовов&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;POST: /post_comment&lt;/code&gt; — добавление комментария.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Имя параметра&lt;/th&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;Обязательный параметр&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;topic_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;guid&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Идентификатор топика, если не задан — создается новый топик.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parent_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Путь к комментарию-родителю. Может быть не задан, если не указан &lt;code&gt;topic_id&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;content&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;Содержимое комментария.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;Имя пользователя.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В случае успешного выполнения возвращается код 201 и документ вида &lt;code&gt;{\"comment_id\" : \"&amp;lt;guid&amp;gt;\", \"new_topic\" : True | False} &lt;/code&gt;;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;POST: /edit_comment&lt;/code&gt; — редактирование комментария.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Имя параметра&lt;/th&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;Обязательный параметр&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;topic_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;guid&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;Идентификатор топика.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parent_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;Путь к комментарию.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;content&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;Новое содержимое комментария.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;В случае успешного выполнения возвращается код 200 и пустой документ.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;POST: /delete_comment&lt;/code&gt; — удаление комментария. При этом из базы данных комментарий в действительности не удаляется, чтобы не нарушать древовидную структуру комментариев. Вместо этого в параметрах комментария выставляется специальный флаг о том, что он удален, после чего комментарий больше нельзя редактировать.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Имя параметра&lt;/th&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;Обязательный параметр&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;topic_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;guid&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;Идентификатор топика.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parent_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;Путь к комментарию.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;В случае успешного выполнения возвращается код 200 и пустой документ.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;GET: /topic_comments&lt;/code&gt; — получение комментария в топике. Для каждого комментария хранится счетчик просмотров, который увеличивается на единицу каждый раз при запросе комментариев топика.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Имя параметра&lt;/th&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;Обязательный параметр&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;topic_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;guid&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;Идентификатор топика.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parent_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Путь к корневому комментарию — может быть указан, если требуется получить только поддерево комментариев по заданному топику.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;В случае успешного выполнения возвращается код 200 и документ со списком комментариев следующего вида:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n  &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"comment_id\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"&amp;lt;id&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"parent_id\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"&amp;lt;id&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"content\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"&amp;lt;large_text&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"user\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"&amp;lt;user_name&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"view_count\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"&amp;lt;N&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"update_time\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"&amp;lt;UTC_time&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"deleted\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"True|False\"&lt;/span&gt;\n  &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"comment_id\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&amp;lt;id&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"parent_id\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&amp;lt;id&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"content\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&amp;lt;large_text&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"user\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&amp;lt;user_name&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"view_count\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &amp;lt;N&amp;gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"update_time\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&amp;lt;UTC_time&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"deleted\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; True|False&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"467\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-467\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-467\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-467.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Возвращаемые комментарии сортируются по &lt;code&gt;parent_path&lt;/code&gt;, поэтому ответы на комментарий оказываются расположены сразу после него и при этом упорядочиваются по времени создания.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;GET: /last_user_comments&lt;/code&gt; — получить список комментариев пользователя, отсортированный в обратном хронологическом порядке. Предполагается, что в веб-интерфейсе сервиса будет страница, где пользователь сможет посмотреть все свои комментарии.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Имя параметра&lt;/th&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;Обязательный параметр&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;Имя пользователя.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Ограничение числа возвращаемых комментариев.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;UTC_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Возвращать только комментарии с &lt;code&gt;update_time&lt;/code&gt; больше данного параметра. Специально используется параметр &lt;code&gt;from_time&lt;/code&gt; вместо &lt;code&gt;offset&lt;/code&gt;, потому что язык запросов YTsaurus не поддерживает ключевое слово &lt;code&gt;OFFSET&lt;/code&gt; в запросах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;В случае успешного выполнения возвращается код 200 и документ со списком комментариев следующего вида:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"comment_id\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&amp;lt;id&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"topic_id\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&amp;lt;id&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"content\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&amp;lt;large_text&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"user\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &amp;lt;user_name&amp;gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"view_count\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &amp;lt;N&amp;gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"update_time\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &amp;lt;UTC_time&amp;gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"543\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-543\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-543\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-543.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;GET: /last_topics&lt;/code&gt; — получить топики, в которых недавно обновлялись комментарии. Топиком является корневой комментарий. Предполагается, что данный запрос будет использоваться главной страницей сервиса, список будет общим для всех пользователей. Необходима поддержка пагинации.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Имя параметра&lt;/th&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;Обязательный параметр&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Ограничение на число возвращаемых топиков.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;UTC_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Возвращать только комментарии с &lt;code&gt;update_time&lt;/code&gt; больше данного параметра. Параметр &lt;code&gt;from_time&lt;/code&gt; используется вместо &lt;code&gt;offset&lt;/code&gt; намеренно, потому что язык запросов YTsaurus не поддерживает ключевое слово &lt;code&gt;OFFSET&lt;/code&gt; в запросах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;В случае успешного выполнения возвращается код 200 и документ со списком комментариев следующего вида:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"topic_id\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&amp;lt;id&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"content\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&amp;lt;large_text&amp;gt;\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"user\"&lt;/span&gt; = &amp;lt;user_name&amp;gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"view_count\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &amp;lt;N&amp;gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;\"update_time\"&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &amp;lt;UTC_time&amp;gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"600\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-600\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-600\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-600.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"tables_description\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#tables_description\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Описание таблиц с данными&lt;/span&gt;&lt;/a&gt;Описание таблиц с данными&lt;/h3&gt;\n&lt;p&gt;Нужно определить необходимый набор таблиц и их схему. При проектировании схемы стоит учитывать возможности и ограничения динамических таблиц:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;В каждой динамической таблице есть уникальный первичный ключ. По первичному ключу можно быстро получать записи вызовом команды &lt;code&gt;lookup&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Динамические таблицы поддерживают транзакции — в том числе между разными таблицами в модели &lt;code&gt;snapshot isolation&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Динамические таблицы не поддерживают вторичные индексы. Эффективный поиск или фильтрация возможны только по префиксу первичного ключа с помощью механизма вывода диапазонов. В противном случае запрос может выродиться в full scan таблицы.&lt;/li&gt;\n&lt;li&gt;Горизонтальное масштабирование динамических таблиц осуществляется посредством шардирования. Шард таблицы в системе называется &lt;code&gt;tablet&lt;/code&gt;. Он задается непрерывным диапазоном значений первичного ключа. Чтобы шардирование было эффективно, необходимо чтобы чтение и запись были равномерно распределены между таблетами.&lt;/li&gt;\n&lt;li&gt;Вторичные индексы можно эмулировать, создавая дополнительные таблицы по соответствующему первичному ключу. В таком случае запись в основную таблицу и таблицу-индекс необходимо осуществлять в одной транзакции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Необходима основная таблица, в которой будет храниться контент — &lt;code&gt;topic_comments&lt;/code&gt;. Запросы на чтение к такой таблице в основном будут ограничены одним топиком, поэтому рекомендуется сделать id топика первой компонентой ключа. В качестве id топика можно выдавать последовательные целые числа или формировать их на основе текущего времени. Однако это будет означать, что при создании новых топиков им будут выдаваться очень близкие номера, а поскольку новые комментарии чаще появляются в новых топиках, вся нагрузка на запись будет идти в один таблет.&lt;br /&gt;\nПоэтому, чтобы обеспечить равномерную загрузку таблетов при масштабировании таблицы, в качестве id топика используется случайно сформированные guid. В качестве id комментариев в топике используются их номера в порядке создания — это может приводить к появлению близких ключей, но если размеры топиков будут не слишком велики, шардирования по guid топиков должно оказаться достаточно.&lt;/p&gt;\n&lt;p&gt;Также в ключевой колонке &lt;code&gt;parent_path&lt;/code&gt; хранится путь к комментарию в топике: для корневого комментария — его id, а &lt;code&gt;parent_path&lt;/code&gt; каждого следующего комментария получается из &lt;code&gt;parent_path&lt;/code&gt; его родителя путём дописывания к нему &lt;code&gt;/&lt;/code&gt; и id родителя. Например, &lt;code&gt;parent_path&lt;/code&gt; комментария с идентификатором &lt;code&gt;#id1&lt;/code&gt;, написанного в ответ на корневой комментарий с идентификатором &lt;code&gt;0&lt;/code&gt;, записывается как &lt;code&gt;0/#id1&lt;/code&gt;. Такая организация пути позволяет быстро отфильтровать комментарии в поддереве при вызове метода &lt;code&gt;topic_comments&lt;/code&gt;: если &lt;code&gt;parent_path&lt;/code&gt; корневого комментария в поддереве — строка &lt;code&gt;S&lt;/code&gt;, то &lt;code&gt;parent_path&lt;/code&gt; любого его потомка будет иметь вид &lt;code&gt;S/#id1/.../#idN&lt;/code&gt;. Он будет содержать &lt;code&gt;S&lt;/code&gt; в качестве префикса. Поэтому, если лексикографически упорядочить комментарии в топике по &lt;code&gt;parent_path&lt;/code&gt;, любому поддереву будет соответствовать непрерывный блок комментариев, начинающийся с корневого комментария поддерева. Таким образом, назначение &lt;code&gt;parent_path&lt;/code&gt; ключевой колонкой позволяет не выполнять full scan таблицы для выбора комментариев в поддереве.&lt;/p&gt;\n&lt;p&gt;Дополнительно для каждого комментария хранится id непосредственного комментария-родителя. Это нужно, чтобы при отображении комментариев их можно было собрать в дерево. Кроме того, в таблице &lt;code&gt;topic_comments&lt;/code&gt; хранится счетчик просмотров комментария, для которого используется механизм агрегирующих колонок. Такой механизм позволяет выполнять инкремент и декремент значения колонки без чтения ее предыдущей версии.&lt;/p&gt;\n&lt;h4 id=\"tablica\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#tablica\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таблица &lt;/span&gt;&lt;/a&gt;Таблица &lt;code&gt;topic_comments&lt;/code&gt;&lt;/h4&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Имя колонки&lt;/th&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;Ключевая колонка&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;topic_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;guid&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;Guid топика.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parent_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;Путь к комментарию.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;comment_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Id комментария. Его порядковый номер при добавлении в топик.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parent_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Id комментария, в ответ на который был написан данный комментарий. Для корневых комментариев совпадает с &lt;code&gt;comment_id&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Логин пользователя, оставившего комментарий.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;create_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Время создания комментария в POSIX Time.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;update_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Время последнего обновления комментария в POSIX Time.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;content&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Текст комментария.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;views_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Количество просмотров, агрегирующая колонка.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;deleted&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;boolean&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Флаг того, что комментарий был удалён.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Чтобы выбирать записи в вызове &lt;code&gt;/last_user_comments&lt;/code&gt;, таблица &lt;code&gt;topic_comments&lt;/code&gt; не подходит. Комментарии пользователя могут находиться в разных топиках, а значит, для выполнения подобного запроса потребуется full scan таблицы. YTsaurus не поддерживает вторичные индексы, поэтому их также не получится использовать.&lt;/p&gt;\n&lt;p&gt;Поэтому необходима вторая, вспомогательная таблица  &lt;code&gt;user_comments&lt;/code&gt;, где в качестве первой компоненты первичного ключа используется имя пользователя. Из соображений равномерного распределения нагрузки при будущем шардировании таблицы, стоит добавить в начало ключа вычислимую колонку — хеш от &lt;code&gt;user_name&lt;/code&gt;. Для хеширования используется функция farm_hash, указываемая в поле &lt;code&gt;expression&lt;/code&gt; в схеме таблицы (смотрите код создания таблиц).&lt;/p&gt;\n&lt;h4 id=\"tablica1\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#tablica1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таблица &lt;/span&gt;&lt;/a&gt;Таблица &lt;code&gt;user_comments&lt;/code&gt;&lt;/h4&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Имя колонки&lt;/th&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;Ключевая колонка&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;hash(user_name)&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;Вычислимая колонка.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;Логин пользователя, оставившего комментарий.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;topic_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;Guid топика.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parent_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;Путь к комментарию.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;update_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Время последнего обновления комментария в POSIX Time.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Необходимо решить, как эффективно обрабатывать вызов &lt;code&gt;/last_topics&lt;/code&gt;. Простой способ — сделать запросы к таблице &lt;code&gt;topic_comments&lt;/code&gt; с группировкой по &lt;code&gt;topic_id&lt;/code&gt;. Но такой подход потребует повторно выполнить full scan самой большой таблицы. Поэтому имеет смысл завести еще одну небольшую таблицу &lt;code&gt;topics&lt;/code&gt;, где по &lt;code&gt;topic_id&lt;/code&gt; будет храниться время последнего обновления топика — то есть любого его комментария.&lt;/p&gt;\n&lt;p&gt;Несмотря на то, что данная таблица будет просматриваться целиком, ее размер гораздо меньше. Это позволит применить ряд оптимизаций. Например, загрузить таблицу целиком в память или увеличить параллельность выполнения запроса с помощью увеличения количества таблетов. Более того, ответ на такой запрос можно кэшировать, поскольку он будет одинаковым для всех пользователей. Также в данной таблице будет храниться количество комментариев в топике, чтобы при добавлении нового комментария можно было получить его идентификатор.&lt;/p&gt;\n&lt;h4 id=\"tablica2\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#tablica2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таблица &lt;/span&gt;&lt;/a&gt;Таблица &lt;code&gt;topic&lt;/code&gt;&lt;/h4&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Имя колонки&lt;/th&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;Ключевая колонка&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;topic_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;Guid топика.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;update_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Время последнего обновления комментария в топике.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;comment_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Количество комментариев в топике, включая удаленные.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"tables_preparation\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#tables_preparation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создание и монтирование таблиц&lt;/span&gt;&lt;/a&gt;Создание и монтирование таблиц&lt;/h2&gt;\n&lt;p&gt;В данном примере использована синхронная репликация с одной синхронной и одной асинхронной репликой и автоматическим переключением режима реплик. Данный режим обеспечивает самые строгие гарантии консистентности — как у нереплицированных динамических таблиц и не требует ручного переключения режима реплик.&lt;/p&gt;\n&lt;p&gt;Создание реплицированной таблицы состоит из следующих шагов:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Создание специального объекта типа &lt;code&gt;replicated_table&lt;/code&gt; на мета-кластере.&lt;/li&gt;\n&lt;li&gt;Создание таблицы-реплики на других кластерах и соответствующие им объекты типа &lt;code&gt;table_replica&lt;/code&gt; на мета-кластере.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Все таблицы необходимо создавать с одинаковой схемой. Для хранения данных используется медиум &lt;code&gt;ssd_blobs&lt;/code&gt;. Выбор медиума SSD обусловлен необходимыми таймингами и потоком записи в мета-кластер. Сначала все реплики будут созданы в режиме &lt;code&gt;async&lt;/code&gt;. После монтирования таблиц синхронная реплика будет выбрана автоматически.&lt;/p&gt;\n&lt;p&gt;Описанные выше действия можно выполнять как через CLI — через команды &lt;code&gt;yt create&lt;/code&gt; и &lt;code&gt;yt set&lt;/code&gt;, так и через Python wrapper.&lt;/p&gt;\n&lt;p&gt;Для данного примера написан скрипт создания необходимых таблиц, который считывает необходимые параметры в аргументах командной строки. Это позволяет использовать скрипт как в production, так и в testing окружении. Параметры скрипта:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;meta_cluster&lt;/code&gt; — кластер с реплицированной таблицей.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;replica_clusters&lt;/code&gt; — кластеры с репликами.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;path&lt;/code&gt; — путь к рабочей директории проекта.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;force&lt;/code&gt; — флаг, используемый для того, чтобы пересоздать таблицы, если они уже существуют. Без него изменения не будут внесены.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример запуска скрипта после сборки через &lt;code&gt;ya make&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;./create_tables --path //path/to/directory/ --meta_cluster &amp;lt;meta_cluster_name&amp;gt; --replica_clusters &amp;lt;replica1-cluster-name&amp;gt; &amp;lt;replica2-cluster-name&amp;gt; --force\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1033\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1033\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1033\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1033.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"kvoty-na-servis\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#kvoty-na-servis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Квоты на сервис&lt;/span&gt;&lt;/a&gt;Квоты на сервис&lt;/h2&gt;\n&lt;p&gt;Создайте выделенный tablet_cell_bundle и аккаунт, в котором будет квота на SSD. Для обеспечения отказоустойчивости сервиса, стоит иметь 3 кластера: мета-кластер и 2 кластера-реплики. Но в учебных целях можно все операции можно сделать на одном кластере. Он будет выступать мета-кластером и двумя репликами (синхронной и асинхронной).&lt;/p&gt;\n&lt;h2 id=\"development\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#development\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Разработка кода сервиса&lt;/span&gt;&lt;/a&gt;Разработка кода сервиса&lt;/h2&gt;\n&lt;h3 id=\"ustanovka-neobhodimyh-paketov\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#ustanovka-neobhodimyh-paketov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка необходимых пакетов&lt;/span&gt;&lt;/a&gt;Установка необходимых пакетов&lt;/h3&gt;\n&lt;p&gt;Установите пакеты &lt;a href=\"http://flask.pocoo.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Flask&lt;/a&gt; и &lt;a href=\"https://wtforms.readthedocs.io\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;WTForms&lt;/a&gt;. WTForms будет использоваться для валидации параметров.&lt;/p&gt;\n&lt;p&gt;Команды установки:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;sudo&lt;/span&gt; pip install flask\n&lt;span class=\"hljs-built_in\"&gt;sudo&lt;/span&gt; pip install wtforms\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1052\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1052\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1052\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1052.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"opredelenie-neobhodimyh-funkcij\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#opredelenie-neobhodimyh-funkcij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение необходимых функций&lt;/span&gt;&lt;/a&gt;Определение необходимых функций&lt;/h3&gt;\n&lt;p&gt;Для передачи параметров программе будут использоваться переменные окружения. В дальнейшем такой подход позволит легко переносить приложение из testing окружения в production.&lt;/p&gt;\n&lt;p&gt;Необходимые переменные окружения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;CLUSTER&lt;/code&gt; — имя кластера, на котором хранятся реплицированные таблицы.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;TABLE_PATH&lt;/code&gt; — путь к директории с таблицами.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Установка необходимых переменных окружения:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; CLUSTER=&amp;lt;cluster-name&amp;gt;\n&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; TABLE_PATH=//path/to/directory\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1077\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1077\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1077\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1077.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Создайте функцию для добавления информации о комментариях во все таблицы. Ее также можно использовать при редактировании комментариев и при добавлении комментария для примера.&lt;/p&gt;\n&lt;h3 id=\"realizaciya-vyzova\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#realizaciya-vyzova\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Реализация вызова &lt;/span&gt;&lt;/a&gt;Реализация вызова &lt;code&gt;find_comment&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Функция для поиска комментариев в таблице принимает значения &lt;code&gt;topic_id&lt;/code&gt; и &lt;code&gt;parent_path&lt;/code&gt; в качестве аргументов. Это позволяет быстро находить комментарий с помощью метода &lt;code&gt;lookup_rows&lt;/code&gt;, поскольку известны значения всех ключевых колонок таблицы &lt;code&gt;topic_comments&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Пример получения информации про последние добавленные комментарии:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-comment\"&gt;# -*- coding: utf-8 -*-&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; json\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; os\n\n\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;find_comment&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;topic_id, parent_path, client, table_path&lt;/span&gt;):\n    &lt;span class=\"hljs-comment\"&gt;# В lookup_rows требуется передать значения всех ключевых колонок&lt;/span&gt;\n    &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(client.lookup_rows(\n        &lt;span class=\"hljs-string\"&gt;\"{}/topic_comments\"&lt;/span&gt;.&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(table_path),\n        [{&lt;span class=\"hljs-string\"&gt;\"topic_id\"&lt;/span&gt;: topic_id, &lt;span class=\"hljs-string\"&gt;\"parent_path\"&lt;/span&gt;: parent_path}],\n    ))\n\n\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;main&lt;/span&gt;():\n    table_path = os.environ[&lt;span class=\"hljs-string\"&gt;\"TABLE_PATH\"&lt;/span&gt;]\n    &amp;lt;cluster-name&amp;gt; = os.environ[&lt;span class=\"hljs-string\"&gt;\"CLUSTER\"&lt;/span&gt;]\n    client = yt.YtClient(cluster_name, config={&lt;span class=\"hljs-string\"&gt;\"backend\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"rpc\"&lt;/span&gt;})\n\n    comment_info = find_comment(\n        topic_id=&lt;span class=\"hljs-string\"&gt;\"1dd64501-4131025-562332a3-40507acc\"&lt;/span&gt;,\n        parent_path=&lt;span class=\"hljs-string\"&gt;\"0\"&lt;/span&gt;,\n        client=client, table_path=table_path,\n    )\n    &lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;(json.dumps(comment_info, indent=&lt;span class=\"hljs-number\"&gt;4&lt;/span&gt;))\n\n\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; __name__ == &lt;span class=\"hljs-string\"&gt;\"__main__\"&lt;/span&gt;:\n    main()\n\n&lt;span class=\"hljs-string\"&gt;\"\"\"\nВывод программы:\n\n[\n    {\n        \"update_time\": 100000,\n        \"views_count\": 0,\n        \"parent_id\": 0,\n        \"deleted\": false,\n        \"comment_id\": 0,\n        \"creation_time\": 100000,\n        \"content\": \"Some comment text\",\n        \"parent_path\": \"0\",\n        \"user\": \"abc\",\n        \"topic_id\": \"1dd64501-4131025-562332a3-40507acc\"\n    }\n]\n\"\"\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1090\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1090\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1090\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1090.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"realizaciya-vyzova1\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#realizaciya-vyzova1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Реализация вызова &lt;/span&gt;&lt;/a&gt;Реализация вызова &lt;code&gt;post_comment&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Первая реализация вызова &lt;code&gt;post_comment&lt;/code&gt; представляет собой функцию, принимающую все параметры в аргументах и возвращающую JSON-строку в качестве ответа. Запросы к динамическим таблицам собраны в одну транзакцию. Добавлена обработка исключений при обращении к системе YTsaurus.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-comment\"&gt;# -*- coding: utf-8 -*-&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; os\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; json\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; time\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; datetime &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; datetime\n\n\n&lt;span class=\"hljs-comment\"&gt;# Вспомогательная функция для получения количества комментариев в топике из таблицы topic_id&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# В случае отсутствия заданного топика возвращается None&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;get_topic_size&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;client, table_path, topic_id&lt;/span&gt;):\n    topic_info = &lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(client.lookup_rows(\n        &lt;span class=\"hljs-string\"&gt;\"{}/topics\"&lt;/span&gt;.&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(table_path), [{&lt;span class=\"hljs-string\"&gt;\"topic_id\"&lt;/span&gt;: topic_id}],\n    ))\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;not&lt;/span&gt; topic_info:\n        &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;None&lt;/span&gt;\n    &lt;span class=\"hljs-keyword\"&gt;assert&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;len&lt;/span&gt;(topic_info) == &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;)\n    &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; topic_info[&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"comment_count\"&lt;/span&gt;]\n\n\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;post_comment&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;client, table_path, user, content, topic_id=&lt;span class=\"hljs-literal\"&gt;None&lt;/span&gt;, parent_id=&lt;span class=\"hljs-literal\"&gt;None&lt;/span&gt;&lt;/span&gt;):\n    &lt;span class=\"hljs-comment\"&gt;# Необходимо обрабатывать исключение YtResponseError, возникающее если выполнить операцию не удается&lt;/span&gt;\n    &lt;span class=\"hljs-keyword\"&gt;try&lt;/span&gt;:\n        &lt;span class=\"hljs-comment\"&gt;# Добавление комментария включает в себя несколько запросов разных типов,&lt;/span&gt;\n        &lt;span class=\"hljs-comment\"&gt;# поэтому требуется собрать их в одну транзакцию, чтобы обеспечить атомарность&lt;/span&gt;\n        &lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; client.Transaction(&lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"tablet\"&lt;/span&gt;):\n            new_topic = &lt;span class=\"hljs-keyword\"&gt;not&lt;/span&gt; topic_id\n            &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; new_topic:\n                topic_id = yt.common.generate_uuid()\n                comment_id = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n                parent_id = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n                parent_path = &lt;span class=\"hljs-string\"&gt;\"0\"&lt;/span&gt;\n            &lt;span class=\"hljs-keyword\"&gt;else&lt;/span&gt;:\n                &lt;span class=\"hljs-comment\"&gt;# Поле comment_id задается равным порядковому номеру комментария в топике&lt;/span&gt;\n                &lt;span class=\"hljs-comment\"&gt;# Этот номер совпадает с текущим размером топика&lt;/span&gt;\n                comment_id = get_topic_size(topic_id)\n                &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;not&lt;/span&gt; comment_id:\n                    &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; json.dumps({&lt;span class=\"hljs-string\"&gt;\"error\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"There is no topic with id {}\"&lt;/span&gt;.&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(topic_id)})\n\n                parent_info = find_comment(topic_id, parent_path, client, table_path)\n                &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;not&lt;/span&gt; parent_info:\n                    &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; json.dumps({&lt;span class=\"hljs-string\"&gt;\"error\"&lt;/span&gt; : &lt;span class=\"hljs-string\"&gt;\"There is no comment {} in topic {}\"&lt;/span&gt;.&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(parent_id, topic_id)})\n                parent_id = parent_info[&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"comment_id\"&lt;/span&gt;]\n                parent_path = &lt;span class=\"hljs-string\"&gt;\"{}/{}\"&lt;/span&gt;.&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(parent_path, comment_id)\n\n            creation_time = &lt;span class=\"hljs-built_in\"&gt;int&lt;/span&gt;(time.mktime(datetime.now().timetuple()))\n            insert_comments([{\n                &lt;span class=\"hljs-string\"&gt;\"topic_id\"&lt;/span&gt;: topic_id,\n                &lt;span class=\"hljs-string\"&gt;\"comment_id\"&lt;/span&gt;: comment_id,\n                &lt;span class=\"hljs-string\"&gt;\"parent_id\"&lt;/span&gt;: parent_id,\n                &lt;span class=\"hljs-string\"&gt;\"parent_path\"&lt;/span&gt;: parent_path,\n                &lt;span class=\"hljs-string\"&gt;\"user\"&lt;/span&gt;: user,\n                &lt;span class=\"hljs-string\"&gt;\"creation_time\"&lt;/span&gt;: creation_time,\n                &lt;span class=\"hljs-string\"&gt;\"update_time\"&lt;/span&gt;: creation_time,\n                &lt;span class=\"hljs-string\"&gt;\"content\"&lt;/span&gt;: content,\n                &lt;span class=\"hljs-string\"&gt;\"views_count\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;,\n                &lt;span class=\"hljs-string\"&gt;\"deleted\"&lt;/span&gt;: &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;,\n            }], client, table_path)\n\n            result = {&lt;span class=\"hljs-string\"&gt;\"comment_id\"&lt;/span&gt; : comment_id, &lt;span class=\"hljs-string\"&gt;\"new_topic\"&lt;/span&gt; : new_topic, &lt;span class=\"hljs-string\"&gt;\"parent_path\"&lt;/span&gt;: parent_path}\n            &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; new_topic:\n                result[&lt;span class=\"hljs-string\"&gt;\"topic_id\"&lt;/span&gt;] = topic_id\n            &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; json.dumps(result)\n    &lt;span class=\"hljs-keyword\"&gt;except&lt;/span&gt; yt.YtResponseError &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; error:\n        &lt;span class=\"hljs-comment\"&gt;# У yt.YtResponseError определен метод __str__, возвращающий подробное сообщение об ошибке&lt;/span&gt;\n        json.dumps({&lt;span class=\"hljs-string\"&gt;\"error\"&lt;/span&gt; : &lt;span class=\"hljs-built_in\"&gt;str&lt;/span&gt;(error)})\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1097\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1097\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1097\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1097.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"realizaciya-vyzova2\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#realizaciya-vyzova2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Реализация вызова &lt;/span&gt;&lt;/a&gt;Реализация вызова &lt;code&gt;user_comments&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Функция включает в себя только один запрос &lt;code&gt;select_rows&lt;/code&gt;. В качестве основной таблицы используется &lt;code&gt;user_comments&lt;/code&gt;, поскольку она отсортирована по полю &lt;code&gt;user&lt;/code&gt;, и из неё эффективнее всего извлекать комментарии заданного пользователя. К данной таблице с помощью &lt;code&gt;JOIN&lt;/code&gt; подключается дополнительная таблица &lt;code&gt;topic_comments&lt;/code&gt;, чтобы получить полную информацию о комментариях. При этом в секции &lt;code&gt;ON&lt;/code&gt; необходимо явно задать и &lt;code&gt;topic_id&lt;/code&gt;, и &lt;code&gt;parent_path&lt;/code&gt;, чтобы данные из дополнительной таблицы можно было эффективно получить по ключу. В секциях &lt;code&gt;WHERE&lt;/code&gt; и &lt;code&gt;LIMIT&lt;/code&gt; задаются необходимые фильтры, в секции &lt;code&gt;ORDER BY&lt;/code&gt; — порядок, чтобы сперва возвращались самые новые комментарии.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-comment\"&gt;# -*- coding: utf-8 -*-&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; os\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; json\n\n\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;get_last_user_comments&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;client, table_path, user, limit=&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;, from_time=&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;&lt;/span&gt;):\n    &lt;span class=\"hljs-keyword\"&gt;try&lt;/span&gt;:\n        &lt;span class=\"hljs-comment\"&gt;# В качестве основной таблицы используется user_comments, позволяющая фильтровать записи по полю user&lt;/span&gt;\n        &lt;span class=\"hljs-comment\"&gt;# Через join подключается дополнительная таблица topic_comments,&lt;/span&gt;\n        &lt;span class=\"hljs-comment\"&gt;# которая используется для получения полной информации про комментарий&lt;/span&gt;\n        comments_info = &lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(client.select_rows(\n            &lt;span class=\"hljs-string\"&gt;\"\"\"\n            topic_comments.topic_id as topic_id,\n            topic_comments.comment_id as comment_id,\n            topic_comments.content as content,\n            topic_comments.user as user,\n            topic_comments.views_count as views_count,\n            topic_comments.update_time as update_time\n            from [{0}/user_comments] as user_comments join [{0}/topic_comments] as topic_comments\n            on (user_comments.topic_id, user_comments.parent_path) =\n            (topic_comments.topic_id, topic_comments.parent_path)\n            where user_comments.user = '{1}' and user_comments.update_time &amp;gt;= {2}\n            order by user_comments.update_time desc\n            limit {3}\"\"\"&lt;/span&gt;.&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(table_path, user, from_time, limit)\n        ))\n        &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; json.dumps(comments_info, indent=&lt;span class=\"hljs-number\"&gt;4&lt;/span&gt;)\n    &lt;span class=\"hljs-keyword\"&gt;except&lt;/span&gt; yt.YtResponseError &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; error:\n        &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; json.dumps({&lt;span class=\"hljs-string\"&gt;\"error\"&lt;/span&gt; : &lt;span class=\"hljs-built_in\"&gt;str&lt;/span&gt;(error)})\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1104\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1104\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1104\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1104.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Запуск приложения. Приложение создаётся через &lt;a href=\"http://flask.pocoo.org/docs/1.0/blueprints/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Blueprint application factory&lt;/a&gt;. Для передачи параметров &lt;code&gt;client&lt;/code&gt; и &lt;code&gt;table_path&lt;/code&gt; используется специальный объект &lt;code&gt;Flask.g&lt;/code&gt;, в котором настраивается контекст приложения. Передача настроек для подключения выполняется через переменные окружения &lt;code&gt;HOST&lt;/code&gt; и &lt;code&gt;PORT&lt;/code&gt;. По умолчанию используется http://127.0.0.1:5000/. Так же настраивается логирование: в файл &lt;code&gt;comment_service.log&lt;/code&gt; производится запись одного сообщения в лог в начале выполнения запроса и еще одного при его завершении. В файл &lt;code&gt;driver.log&lt;/code&gt; перенаправляются отладочные логи системы YTsaurus.&lt;/p&gt;\n&lt;p&gt;Для каждого запроса требуется создавать отдельный клиент YTsaurus, чтобы в дальнейшем было возможно обрабатывать запросы параллельно. При этом для каждого клиента создается собственная версия драйвера, что приводит к дополнительному расходу ресурсов. Чтобы избежать данной проблемы, создается один общий объект драйвера при инициализации приложения, после чего данный объект подключается к каждому создаваемому клиенту путем выставления в клиенте соответствующей опции.&lt;/p&gt;\n\n&lt;p&gt;Для валидации параметров запроса используются формы WTForms. Для каждого метода требуется создать отдельный класс-форму, в которой указываются параметры запроса, их тип и т.п.&lt;/p&gt;\n\n&lt;p&gt;Предполагается что код сохранён в файле &lt;code&gt;run_application.py&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; CLUSTER=&amp;lt;cluster-name&amp;gt;\n&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; TABLE_PATH=//path/to/directory\n&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; HOST=127.0.0.1\n&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; PORT=5000\npython run_application.py\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1119\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1119\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1119\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1119.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tutorials/dyn-tables-tutorial.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры запросов&lt;/span&gt;&lt;/a&gt;Примеры запросов&lt;/h2&gt;\n&lt;p&gt;Для отправки запросов используется &lt;code&gt;curl&lt;/code&gt;, для форматирования JSON вывода утилита &lt;code&gt;jq&lt;/code&gt;.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Листинг 22 — Установка утилит&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;sudo&lt;/span&gt; apt-get install curl\n&lt;span class=\"hljs-built_in\"&gt;sudo&lt;/span&gt; apt-get install jq\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1131\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1131\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1131\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1131.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Листинг 23 — Создание топиков с несколькими комментариями&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Первый топик:&lt;/span&gt;\ncurl - s - X\nPOST - d\n&lt;span class=\"hljs-string\"&gt;'user=abc&amp;amp;content=comment1'&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'http://127.0.0.1:5000/post_comment/'&lt;/span&gt; | jq.\n{\n  &lt;span class=\"hljs-string\"&gt;\"comment_id\"&lt;/span&gt;: 0,\n  &lt;span class=\"hljs-string\"&gt;\"new_topic\"&lt;/span&gt;: &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;,\n  &lt;span class=\"hljs-string\"&gt;\"parent_path\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"0\"&lt;/span&gt;,\n  &lt;span class=\"hljs-string\"&gt;\"topic_id\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"d178dfb1-b721a596-4358abc9-ed93ae6b\"&lt;/span&gt;\n}\n\n\ncurl - s - X\nPOST - d\n&lt;span class=\"hljs-string\"&gt;'user=abc&amp;amp;content=comment2&amp;amp;topic_id=d178dfb1-b721a596-4358abc9-ed93ae6b&amp;amp;parent_path=0'&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'http:
