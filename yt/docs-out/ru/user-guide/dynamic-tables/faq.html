            {"data":{"leading":false,"html":"&lt;h4 id=\"sticky-transaction\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/faq.html#sticky-transaction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При работе с динамическими таблицами из Python API или C++ API получаю ошибку «Sticky transaction 1935-3cb03-4040001-e8723e5a is not found», что делать?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При работе с динамическими таблицами из Python API или C++ API получаю ошибку «Sticky transaction 1935-3cb03-4040001-e8723e5a is not found», что делать?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Ответ зависит от того, как используются транзакции. Если используется мастерная транзакция, то это бессмысленное действие, в таком случае необходимо задавать запрос вне транзакции, для этого можно либо создать отдельный клиент, либо явно указать, что запускаться под нулевой транзакций (&lt;code&gt;with client.Transaction(transaction_id=\"0-0-0-0\"): ...&lt;/code&gt;).&lt;br /&gt;\nПолноценное использование таблетных транзакций в Python API возможно только через RPC-proxy (&lt;code&gt;yt.config['backend'] = 'rpc'&lt;/code&gt;). Использование таблетных транзакций через HTTP невозможно в текущей реализации.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"tablet-memory\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/faq.html#tablet-memory\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При записи в динамическую таблицу возникает ошибка «Node is out of tablet memory; all writes disabled» или «Active store is overflown, all writes disabled». Что она означает и как с ней бороться?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При записи в динамическую таблицу возникает ошибка «Node is out of tablet memory; all writes disabled» или «Active store is overflown, all writes disabled». Что она означает и как с ней бороться?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Ошибка возникает, когда на узле кластера заканчивается память для хранения данных, не записанных на диск. Входной поток данных слишком велик, узел кластера не успевает выполнять сжатие и запись на диск. Запросы с подобными ошибками необходимо повторять, возможно с увеличивающейся задержкой. Если ошибка возникает постоянно, то это может означать (помимо случаев нештатной работы), что либо отдельные таблеты перегружены нагрузкой по записи, либо мощности кластера недостаточно, чтобы справиться с данной нагрузкой. Также может помочь увеличение количества таблетов в таблице (команда &lt;code&gt;reshard-table&lt;/code&gt;).&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"overlapping-stores\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/faq.html#overlapping-stores\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Что значит сообщение «Too many overlapping stores»? Что делать?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Что значит сообщение «Too many overlapping stores»? Что делать?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Данное сообщение об ошибке значит, что структура таблета такова, что покрытие сторами (dynamic store) обслуживаемого таблетом интервала ключей слишком плотное. Плотное покрытие сторами ведет к деградации производительности чтения, поэтому в данной ситуации включается защитный механизм, препятствующий записи новых данных. Постепенно фоновые процессы компактификации и партицирования должны нормализовать структуру таблета; если этого не происходит, то, возможно, кластер не справляется с нагрузкой.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"block-size-limit\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/faq.html#block-size-limit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При запросе в динамическую таблицу получаю ошибку «Maximum block size limit violated»&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При запросе в динамическую таблицу получаю ошибку «Maximum block size limit violated»&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; В запросе участвует динамическая таблица, когда-то сконвертированная из статической. При этом не был указан параметр &lt;code&gt;block_size&lt;/code&gt;. При получении подобной ошибки убедитесь, что выполняете все указания из &lt;a href=\"ru/user-guide/dynamic-tables/mapreduce.html\"&gt;раздела&lt;/a&gt;, посвящённого конвертации статической таблицы в динамическую. Если размер блока получается большим, то следует увеличить &lt;code&gt;max_unversioned_block_size&lt;/code&gt; до 32 мегабайт и перемонтировать таблицу. Так может быть, если в ячейках таблицы хранятся больше бинарные данные, а они целиком попадают в один блок.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"overlapping-stores-tablet\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/faq.html#overlapping-stores-tablet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При запросе в динамическую таблицу получаю ошибку «Too many overlapping stores in tablet»&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При запросе в динамическую таблицу получаю ошибку «Too many overlapping stores in tablet»&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Скорее всего, таблет не справляется с потоком записи — новые чанки не успевают компактифицироваться. Следует проверить, пошардирована ли таблица на достаточное число таблетов. При записи данных в пустую таблицу стоит отключить автошардирование, поскольку маленькие таблеты будут объединяться в один.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"active-store-overflown\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/faq.html#active-store-overflown\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При запросе в динамическую таблицу получаю ошибку «Active store is overflown, all writes disabled»&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При запросе в динамическую таблицу получаю ошибку «Active store is overflown, all writes disabled»&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Таблет не справляется с потоком записи — либо не успевает сбрасывать данные на диск, либо по каким-то причинам не может этого сделать. Следует проверить, нет ли ошибок в атрибуте таблицы &lt;code&gt;@tablet_errors&lt;/code&gt;, если нет, то, аналогично предыдущему пункту, проверить шардирование.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"too-many-stores\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/faq.html#too-many-stores\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При запросе в динамическую таблицу получаю ошибку «Too many stores in tablet, all writes disabled»&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При запросе в динамическую таблицу получаю ошибку «Too many stores in tablet, all writes disabled»&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Слишком большой таблет. Необходимо добиться, того чтобы у таблицы стало больше таблетов. Обратите внимание, что &lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html\"&gt;автошардирование&lt;/a&gt; ограничивает число таблетов числом селлов, умноженном на значение параметра &lt;code&gt;tablet_balancer_config/tablet_to_cell_ratio&lt;/code&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"tablet-not-known\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/faq.html#tablet-not-known\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При запросе в динамическую таблицу получаю ошибку «Tablet ... is not known»&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При запросе в динамическую таблицу получаю ошибку «Tablet ... is not known»&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Клиент отправил запрос на узел кластера, таблет на котором уже не обслуживается. Как правило, такое происходит в результате автоматической балансировки таблетов или перезапуска узлов кластера. Необходимо повторно отправить запрос, ошибка исчезнет сама после обновления кеша, либо отключать балансировку.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"service-not-known\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/faq.html#service-not-known\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При запросе в динамическую таблицу получаю ошибку «Service is not known»&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При запросе в динамическую таблицу получаю ошибку «Service is not known»&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Клиент отправил запрос на узел кластера, таблет-селл на котором уже не обслуживается. Как правило, такое происходит при перебалансировке селлов. Необходимо повторно отправить запрос, ошибка исчезнет сама после обновления кеша.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"chunk-data-not-preloaded\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/faq.html#chunk-data-not-preloaded\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При запросе в динамическую таблицу получаю ошибку «Chunk data is not preloaded yet»&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При запросе в динамическую таблицу получаю ошибку «Chunk data is not preloaded yet»&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Сообщение характерно для таблицы с параметром &lt;code&gt;in_memory_mode&lt;/code&gt;, отличным от &lt;code&gt;none&lt;/code&gt;. Такая таблица в смонтированном состоянии всегда находится в памяти. Для того чтобы читать из такой таблицы, все данные должны быть загружены в память. Если таблица была только что смонтирована, таблет был перемещен в другой селл, или был перезапуск процесса YTsaurus, то данных в памяти нет, и возникает подобная ошибка. Необходимо подождать загрузки данных в память фоновым процессом.&lt;/p&gt;\n&lt;p&gt;Таблеты могут перемещаться в другие селлы в результате &lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html\"&gt;автоматического шардирования&lt;/a&gt;. Такие перемещения можно увидеть на графике \"Tablet balancer moves\" на странице бандла. При необходимости вы можете изменить расписание автоматического шардирования. В этом случае нужно подобрать такое расписание, чтобы таблица продолжила держать вашу нагрузку.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"too-many-timestamps\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/faq.html#too-many-timestamps\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: В tablet_errors вижу ошибку «Too many write timestamps in a versioned row» или «Too many delete timestamps in a versioned row»&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: В tablet_errors вижу ошибку «Too many write timestamps in a versioned row» или «Too many delete timestamps in a versioned row»&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; В сортированных динамических таблицах одновременно хранится много версий одного и того же значения. В lookup формате у каждого ключа может быть не более 2^16 версий. В качестве простого решения можно использовать поколоночный формат (&lt;code&gt;@optimize_for = scan&lt;/code&gt;). На практике такое большое число версий не нужно, они возникают вследствие неправильной конфигурации или программной ошибки. Например, при указании &lt;code&gt;atomicity=none&lt;/code&gt; можно обновлять один и тот же ключ таблицы с огромной частотой (в данном режиме не происходит блокировки строк и транзакции с пересекающимся диапазоном времени могут обновлять один и тот же ключ). Так делать не рекомендуется. Если же запись большого числа версий вызвана продуктовой необходимостью, например, частые записи дельт в агрегирующих колонках, стоит выставить атрибут таблицы &lt;code&gt;@merge_rows_on_flush=%true&lt;/code&gt; и корректно &lt;a href=\"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#remove_old_data\"&gt;настроить удаление данных по TTL&lt;/a&gt;, чтобы при флаше в чанк записывалось только небольшое число реально необходимых версий.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"excessive-input\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/faq.html#excessive-input\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При запросе Select Rows получаю ошибку 'Query terminated prematurely due to excessive input; consider rewriting your query or changing input limit'&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При запросе Select Rows получаю ошибку 'Query terminated prematurely due to excessive input; consider rewriting your query or changing input limit'&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Такая ошибка возникает, если при выполнении запроса было прочитано слишком много данных.&lt;/p&gt;\n&lt;p&gt;Необходимо проверить следующее:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;В секции запроса &lt;code&gt;WHERE&lt;/code&gt; указан префикс первичного ключа таблицы. Если это не сделано, то &lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#input_data_cut\"&gt;отсечение входных данных&lt;/a&gt; выполнить не получится, и запрос не получится эффективно выполнить (запрос будет выполняться, как full scan);&lt;/li&gt;\n&lt;li&gt;Если в запросе есть &lt;code&gt;JOIN&lt;/code&gt;, убедитесь, что он выполняется &lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#joins\"&gt;с использованием индекса&lt;/a&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Необходимо переписать запрос так, чтобы он работал эффективно. Для отладки запроса можно воспользоваться командой &lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#explain_query\"&gt;explain&lt;/a&gt;.&lt;br /&gt;\nПочинить ошибку в моменте можно поднятием &lt;code&gt;input_row_limit&lt;/code&gt;, но это не решит вашу проблему целиком.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"maximum-expression-depth\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/faq.html#maximum-expression-depth\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При запросе Select Rows получаю ошибку 'Maximum expression depth exceeded'&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При запросе Select Rows получаю ошибку 'Maximum expression depth exceeded'&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Такая ошибка возникает, если глубина дерева разбора выражения получается слишком большой. Как правило, такое происходит при написании выражений вида&lt;br /&gt;\n&lt;code&gt;FROM [...] WHERE (id1=\"a\" AND id2=\"b\") OR (id1=\"c\" AND id2=\"d\") OR ... &amp;lt;несколько тысяч условий&amp;gt;&lt;/code&gt;&lt;br /&gt;\nВместо этого их нужно задавать в форме &lt;code&gt;FROM [...] WHERE (id1, id2) IN ((\"a\", \"b\"), (\"c\", \"b\"), ...)&lt;/code&gt;&lt;br /&gt;\nС первым вариантом есть несколько проблем. Дело в том, что запросы компилируются в машинный код. Машинный код для запросов кешируются так, что ключом служит структура запроса без учета констант.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;В первом случае при увеличении количества условий структура запроса будет постоянно меняться. Будет кодогенерация на каждый запрос.&lt;/li&gt;\n&lt;li&gt;Первый запрос будет порождать очень большое количество кода.&lt;/li&gt;\n&lt;li&gt;Компиляция запроса будет очень медленной.&lt;/li&gt;\n&lt;li&gt;Первый случай будет работать просто проверкой всех условий. Никакой трансформации в более сложный алгоритм там не предусмотрено.&lt;/li&gt;\n&lt;li&gt;Кроме этого, если колонки ключевые, для них выводятся диапазоны чтения, чтобы читать только нужные данные. Алгоритм вывода диапазонов чтения будет более оптимально работать для варианта с IN.&lt;/li&gt;\n&lt;li&gt;В случае с IN при проверке условия будет поиск по хеш таблице.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"value-too-long\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/faq.html#value-too-long\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Работе с динамической таблице получаю ошибку 'Value is too long'&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Работе с динамической таблице получаю ошибку 'Value is too long'&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Есть довольно жесткие лимиты на размер значений в динамических таблицах. Размер одного значения (ячейки таблицы) не должен превосходить 16 МБ, а длина всей строки - 128 МБ и 512 МБ с учётом всех версий. Всего в строке может быть не более 1024 значений с учётом всех версий. Также есть ограничения на количество строк в запросах, которое по умолчанию равно 100000 строк в транзакции при вставке, миллион строк при select и 5 миллионов при lookup. Обратим внимание, что приближение к пороговым значениям может вызвать нестабильную работу. Если вы выходите за ограничение, нужно пересмотреть хранение данных в динамической таблице, не хранить такие длинные строки.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"clear-replicated-table-cli\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/faq.html#clear-replicated-table-cli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как очистить реплицированную таблицу с помощью CLI?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как очистить реплицированную таблицу с помощью CLI?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Реплицированную таблицу нельзя очистить атомарно, но вы можете очистить отдельные реплики с помощью операции &lt;a href=\"ru/user-guide/data-processing/operations/erase.html\"&gt;Erase&lt;/a&gt;. Для этого понадобится &lt;a href=\"ru/user-guide/dynamic-tables/bulk-insert.html\"&gt;включить&lt;/a&gt; так называемый «bulk insert» для всего кластера, выставив:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;//sys/@config/tablet_manager/enable_bulk_insert&lt;/code&gt; в &lt;code&gt;%true&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;//sys/controller_agents/config/enable_bulk_insert_for_everyone&lt;/code&gt; в &lt;code&gt;%true&lt;/code&gt; (обратите внимание на отсутствие &lt;code&gt;@&lt;/code&gt;)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Если последний указанный узел не существует, создайте его с помощью команды:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt create document //sys/controller_agents/config --attributes &lt;span class=\"hljs-string\"&gt;'{value={}}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"172\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-172\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-172\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-172.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"timed-out-blocked-row\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/faq.html#timed-out-blocked-row\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При чтении из динамической таблицы получаю ошибку 'Timed out waiting on blocked row'&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При чтении из динамической таблицы получаю ошибку 'Timed out waiting on blocked row'&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Ошибка возникает при конфликтах чтения-записи: вы пытаетесь читать по ключу, который затрагивается конкурирующей транзакцией. Система должна дождаться результата транзакции, чтобы гарантировать требуемый уровень изоляции между транзакциями.&lt;/p&gt;\n&lt;p&gt;Если вам не требуется строгая консистентность, вы можете &lt;a href=\"ru/user-guide/dynamic-tables/sorted-dynamic-tables#chtenie-stroki\"&gt;ослабить&lt;/a&gt; уровень изоляции читающей транзакции.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"row-lock-conflict\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/faq.html#row-lock-conflict\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При записи в динтаблицу получаю ошибку 'Row lock conflict due to concurrent ... write'&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При записи в динтаблицу получаю ошибку 'Row lock conflict due to concurrent ... write'&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Ошибка возникает при конфликтах записи: вы пытаетесь записать строку, которую заблокировала конкурирующая транзакция (это может быть как запись, так и явное взятие лока в транзакции). В некоторых случаях система может дать подсказку о том, что это за транзакция (например, при конфликтах записи-записи в атрибутах ошибки будет указан идентификатор транзакции).&lt;/p&gt;\n&lt;p&gt;В общем случае для того чтобы избавиться от конфликтов, вам нужно пересмотреть то, как устроена запись в динтаблицу с вашей стороны, чтобы избежать записи в один и тот же ключ из разных мест.&lt;/p&gt;\n&lt;p&gt;В некоторых сценариях может помочь ослабление &lt;a href=\"ru/user-guide/dynamic-tables/transactions#conflicts\"&gt;гарантий&lt;/a&gt;: использование режимов &lt;code&gt;atomicity=none&lt;/code&gt; или shared write lock. Перед тем как пользоваться ослабленными гарантиями, обязательно изучите документацию и убедитесь, что побочные эффекты для вас не страшны.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"no-working-replicas\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/faq.html#no-working-replicas\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При чтении из динтаблицы получаю ошибку 'No working in-sync replicas found for table'&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При чтении из динтаблицы получаю ошибку 'No working in-sync replicas found for table'&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Ошибка возникает при чтении из реплицированной или хаосной таблицы, когда не удаётся найти реплику, из которой можно осуществить чтение. Реплика должна удовлетворять следующим критериям:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Она должна содержать достаточно свежие данные. Если при чтении указан timestamp — на реплике должны быть данные до этого таймстампа. Если timestamp не указан, чтение должно производиться из &lt;em&gt;действительно синхронной&lt;/em&gt; реплики: той, у которой &lt;code&gt;mode=sync&lt;/code&gt; и которая точно содержит более старые данные. Более подробно см. в разделе &lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables#garantii\"&gt;гарантии реплицированных динтаблиц&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Реплика должна быть работающей. Если клиент недавно получал ошибку от реплики, в следующий раз он попробует обратиться к другой. Реплики, с которых не удалось прочитать данные, указаны в атрибуте &lt;code&gt;banned_replicas&lt;/code&gt; наблюдаемой ошибки.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"chunk-view-cannot-be-remote-copied\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/faq.html#chunk-view-cannot-be-remote-copied\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При попытке выполнить remote copy получаю ошибку 'Chunk view cannot be copied to remote cluster'&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При попытке выполнить remote copy получаю ошибку 'Chunk view cannot be copied to remote cluster'&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Некоторые действия с динамической таблицей, такие как решарды, могут ради дешевизны такого действия создавать обертки над чанками -- chunk view. И на текущий момент remote copy умеет копировать только обычные чанки, а не chunk view.&lt;br /&gt;\nЧтобы убрать chunk view из таблицы необходимо сделать специальную форсированную компактификацию, выставив в аттрибут &lt;code&gt;forced_chunk_view_compaction_revision&lt;/code&gt; значение 1, после чего выполнить &lt;code&gt;remount-table&lt;/code&gt;. Более подробно см. в разделе &lt;a href=\"ru/user-guide/dynamic-tables/compaction#forced_compaction\"&gt;Форсированная компактификация&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/dynamic-tables/faq.md","sourcePath":"ru/user-guide/dynamic-tables/faq.md"},"headings":[],"title":"FAQ"},"router":{"pathname":"ru/user-guide/dynamic-tables/faq","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
