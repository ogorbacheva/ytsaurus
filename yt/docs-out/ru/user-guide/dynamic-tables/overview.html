        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Динамические таблицы — это вид таблиц в YTsaurus, реализующих интерфейс точечного чтения и записи данных по ключу. Они поддерживают транзакции и собственный диалект SQL.&lt;/p&gt;\n&lt;p&gt;Наличие динамических таблиц добавляет системе YTsaurus возможности типичного key-value storage. Элементарными действиями с такими таблицами являются запись, удаление и чтение строки по ключу. Также возможно выполнение SQL-запросов — для работы с диапазонами строк.&lt;/p&gt;\n&lt;p&gt;Динамические таблицы поддерживают транзакционность по модели &lt;a href=\"https://en.wikipedia.org/wiki/Multiversion_concurrency_control\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MVCC&lt;/a&gt;. Работа с ними не требует общения с мастер-сервером YTsaurus, что даёт дополнительные возможности для масштабирования.&lt;/p&gt;\n&lt;p&gt;Ближайшими аналогами динамических таблиц можно назвать:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"http://hbase.apache.org\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apache HBase&lt;/a&gt; — с точки зрения организации хранения данных;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://ai.google/research/pubs/pub39966\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Spanner&lt;/a&gt; — с точки зрения реализации транзакций;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"http://impala.apache.org\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Impala&lt;/a&gt; — с точки зрения модели вычисления запросов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Сходства с перечисленными системами будут описаны далее.&lt;/p&gt;\n&lt;h2 id=\"types\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/overview.html#types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Виды динамических таблиц&lt;/span&gt;&lt;/a&gt;Виды динамических таблиц&lt;/h2&gt;\n&lt;p&gt;Динамические таблицы бывают &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html\"&gt;сортированные&lt;/a&gt; и &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables.html\"&gt;упорядоченные&lt;/a&gt;. Помимо этого, для каждого вида таблиц реализован механизм репликации. Подробнее о репликации можно узнать в разделе &lt;a href=\"user-guide/dynamic-tables/replicated-dynamic-tables.html\"&gt;реплицированные динамические таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"architecture\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/overview.html#architecture\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Архитектура&lt;/span&gt;&lt;/a&gt;Архитектура&lt;/h2&gt;\n&lt;p&gt;Архитектурно способ хранения динамических таблиц в YTsaurus использует идею &lt;a href=\"https://en.wikipedia.org/wiki/Log-structured_merge-tree\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Log-structured merge tree&lt;/a&gt;. Это делает её похожей на системы &lt;a href=\"http://static.googleusercontent.com/media/research.google.com/en//archive/bigtable-osdi06.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;BigTable&lt;/a&gt; и &lt;a href=\"https://hbase.apache.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;HBase&lt;/a&gt;. Для обеспечения отказоустойчивости и консистентности используется библиотека репликации состояний Hydra (аналог &lt;a href=\"https://raft.github.io/raft.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Raft&lt;/a&gt;), а для поддержки распределённых транзакций — &lt;a href=\"https://en.wikipedia.org/wiki/Two-phase_commit_protocol\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;двухфазный коммит&lt;/a&gt;, аналогично системе &lt;a href=\"https://research.google/pubs/pub39966/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Spanner&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Более подробное описание архитектуры и модели данных приведено в отдельных разделах, посвящённых &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html\"&gt;сортированным&lt;/a&gt; и &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables.html\"&gt;упорядоченным&lt;/a&gt; динамическим таблицам.&lt;/p&gt;\n&lt;h2 id=\"attributes\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/overview.html#attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атрибуты&lt;/span&gt;&lt;/a&gt;Атрибуты&lt;/h2&gt;\n&lt;p&gt;Помимо атрибутов, присущих всем таблицам, динамические таблицы имеют ряд уникальных атрибутов. Некоторые из них представлены в таблице:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Имя&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;chunk_row_count&lt;/td&gt;\n&lt;td&gt;Int&lt;/td&gt;\n&lt;td&gt;Общее количество необъединённых строк во всех чанках таблицы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tablets&lt;i class=\"yfm yfm-term_title\" term-key=\":*\" role=\"button\" aria-describedby=\":*_element\" tabindex=\"0\" id=\"y4ngebwb\"&gt;*&lt;/i&gt;&lt;/td&gt;\n&lt;td&gt;TabletInfo&lt;/td&gt;\n&lt;td&gt;Описание таблетов.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;atomicity&lt;/td&gt;\n&lt;td&gt;Atomicity&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/dynamic-tables/transactions.html#atomicity\"&gt;Режим атомарности&lt;/a&gt;. По умолчанию &lt;code&gt;full&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;in_memory_mode&lt;/td&gt;\n&lt;td&gt;InMemoryMode&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/user-guide/dynamic-tables/overview.html#in_memory\"&gt;In-memory-режим&lt;/a&gt; для таблиц. По умолчанию &lt;code&gt;none&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Атрибут &lt;code&gt;chunk_row_count&lt;/code&gt; может использоваться для оценки размера таблицы, но оценка является приближённой по следующим причинам:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;в оценке не учтены строки, находящиеся в памяти узлов кластера;&lt;/li&gt;\n&lt;li&gt;строки могут быть учтены несколько раз, пока не произошло объединение чанков;&lt;/li&gt;\n&lt;li&gt;строки могут быть не удалены, но помечены как удалённые или устаревшие.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Отдельные атрибуты динамической таблицы влияют на её поведение. В частности, с помощью отдельных атрибутов можно:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"user-guide/dynamic-tables/compaction.html#attributes\"&gt;настраивать фоновую компактификацию&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html#remove_old_data\"&gt;устанавливать TTL&lt;/a&gt; — время жизни отдельных значений;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/dynamic-tables/tablet-balancing.html\"&gt;управлять автоматическим шардированием&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"limitations\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/overview.html#limitations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения &lt;/span&gt;&lt;/a&gt;Ограничения &lt;/h2&gt;\n&lt;p&gt;На строки и схему динамической таблицы наложен ряд ограничений по размеру и типу содержимого:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;количество колонок в динамической таблице не может быть больше 1024, из них не более 32 могут быть ключевыми;&lt;/li&gt;\n&lt;li&gt;максимальная длина значения типа &lt;code&gt;String&lt;/code&gt; в динамической таблице — 16 мегабайт.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Кроме того, динамические таблицы наследуют &lt;a href=\"user-guide/storage/static-tables.html#limitations\"&gt;ограничения&lt;/a&gt; статических таблиц.&lt;/p&gt;\n&lt;h2 id=\"in_memory\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/overview.html#in_memory\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таблицы, находящиеся в памяти (in-memory)&lt;/span&gt;&lt;/a&gt;Таблицы, находящиеся в памяти (in-memory)&lt;/h2&gt;\n&lt;p&gt;Доступ к данным, находящимся в оперативной памяти, на порядки быстрее, чем к данным на диске. В системе YTsaurus существует возможность настроить таблицу так, чтобы её данные постоянно находились в памяти. Подобная настройка радикально повышает скорость операций с таблицей. У такого способа имеются ограничения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Объём оперативной памяти на всех узлах кластера ограничен, поэтому рассматриваемой возможностью стоит пользоваться только тогда, когда это действительно необходимо.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Любая динамическая сортированная таблица может быть переведена в in-memory режим, а также выведена из данного режима. Для вступления изменений в силу необходимо выполнять &lt;code&gt;remount_table&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Использование динамических таблиц, находящихся в памяти, никак не отражается на уровнях изоляции, консистентности, а также отказоустойчивости. Данные таких таблиц в том числе по-прежнему хранятся в чанках распределённого хранилища, in-memory режим лишь означает, что помимо диска данные таблицы также находятся в оперативной памяти.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;При включении in-memory режима происходит загрузка данных в память узлов кластера. Это может занимать некоторое время.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;In-memory режим настраивается с помощью атрибута &lt;code&gt;in_memory_mode&lt;/code&gt; для таблицы. Возможные значения атрибута:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Режим&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;In-memory режим&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;None&lt;/td&gt;\n&lt;td&gt;Отключен&lt;/td&gt;\n&lt;td&gt;Данные таблицы записываются в чанки, а их блоки, сжатые и несжатые, кешируются на общих основаниях. Такой режим подходит для больших таблиц, которые нет возможности зафиксировать в памяти.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Compressed&lt;/td&gt;\n&lt;td&gt;Включен&lt;/td&gt;\n&lt;td&gt;Сжатые данные таблицы — содержимое блоков чанков — постоянно присутствует в памяти, но для обращений на чтение необходимо выполнять распаковку блоков данных. Распакованные блоки кешируются на общих основаниях. Такой режим является хорошим сочетанием по соотношению скорость-объём памяти.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Uncompressed&lt;/td&gt;\n&lt;td&gt;Включен&lt;/td&gt;\n&lt;td&gt;Несжатые данные таблицы постоянно присутствует в памяти, для обращений на чтение нет необходимости ни в дисковых обращениях, ни в распаковке данных. Данный режим дает максимальную производительность ценой оперативной памяти.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"hesh-tablicy-dlya-chteniya-po-klyuchu\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/overview.html#hesh-tablicy-dlya-chteniya-po-klyuchu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Хеш-таблицы для чтения по ключу&lt;/span&gt;&lt;/a&gt;Хеш-таблицы для чтения по ключу&lt;/h3&gt;\n&lt;p&gt;Операция чтения по ключу ищет ключи данных таблицы с помощью двоичного поиска. Можно добиться некоторого ускорения, построив предварительно хеш-таблицы для ключей. Для этого необходимо задать атрибут &lt;code&gt;enable_lookup_hash_table = %true&lt;/code&gt; для таблицы.&lt;/p&gt;\n&lt;p&gt;Хеш-таблицы имеет смысл использовать только в режиме &lt;code&gt;uncompressed&lt;/code&gt;, в остальных режимах их использование запрещено.&lt;/p&gt;\n&lt;h2 id=\"formats\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/overview.html#formats\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Форматы хранения таблиц&lt;/span&gt;&lt;/a&gt;Форматы хранения таблиц&lt;/h2&gt;\n&lt;p&gt;В системе YTsaurus реализовано несколько способов физического хранения данных таблиц в чанках. Выбор между ними управляется атрибутом &lt;code&gt;optimize_for&lt;/code&gt; на таблице. Данный атрибут можно изменить на уже существующей таблице, но эффект будет заметен лишь для вновь создаваемых чанков. С учётом компактификации, старые данные тоже могут быть повторно сжаты в фоновом режиме.&lt;/p&gt;\n&lt;p&gt;Если таблица уже смонтирована, то для донесения до таблетов информации про изменение формата необходимо выполнить команду &lt;code&gt;remount_table&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Возможные значения атрибута &lt;code&gt;optimize_for&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;lookup&lt;/code&gt; — формат, который даёт возможность эффективно читать из таблицы строки по отдельным ключам;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;scan&lt;/code&gt; — формат &lt;code&gt;scan&lt;/code&gt; использует поколоночное хранение, а также адаптивные поколоночные алгоритмы сжатия. Вертикальный способ разделения данных хуже подходит для случайных чтений по ключам, так как потребуется читать больше блоков и тратить больше CPU.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"acl\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/overview.html#acl\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Права доступа&lt;/span&gt;&lt;/a&gt;Права доступа&lt;/h2&gt;\n&lt;p&gt;На динамические таблицы распространяется система управления доступом:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Чтобы читать из динамической таблицы (запросами &lt;code&gt;select_rows&lt;/code&gt;, &lt;code&gt;lookup_rows&lt;/code&gt;), пользователь должен иметь право &lt;code&gt;read&lt;/code&gt; на таблицу.&lt;/li&gt;\n&lt;li&gt;Чтобы писать в динамическую таблицу (командами &lt;code&gt;insert_rows&lt;/code&gt;, &lt;code&gt;delete_rows&lt;/code&gt;), пользователь должен иметь право &lt;code&gt;write&lt;/code&gt; на таблицу.&lt;/li&gt;\n&lt;li&gt;Чтобы выполнять команды &lt;code&gt;mount_table&lt;/code&gt;, &lt;code&gt;unmount_table&lt;/code&gt;, &lt;code&gt;remount_table&lt;/code&gt; и &lt;code&gt;reshard_table&lt;/code&gt;, пользователь должен иметь право &lt;code&gt;mount&lt;/code&gt;на таблицу.&lt;/li&gt;\n&lt;li&gt;По аналогии с аккаунтами для того чтобы создавать таблицы, привязанные к бандлу, у пользователя должно быть право &lt;code&gt;use&lt;/code&gt; на данный бандл. То же правило требуется для того, чтобы изменить бандл у таблицы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"links\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/overview.html#links\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Полезные материалы&lt;/span&gt;&lt;/a&gt;Полезные материалы&lt;/h2&gt;\n&lt;p&gt;Вебинары:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://www.youtube.com/watch?v=vxKD0lLS4mM\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Обзор динамических таблиц, часть 1&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://www.youtube.com/watch?v=JZGTUjyJw38\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Обзор динамических таблиц, часть 2&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;dfn class=\"yfm yfm-term_dfn\" id=\":*_element\" role=\"dialog\"&gt;&lt;p&gt;Параметр встречается в ответе несколько раз.&lt;/p&gt;\n&lt;/dfn&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/dynamic-tables/overview.md","sourcePath":"ru/user-guide/dynamic-tables/overview.md"},"headings":[{"title":"Виды динамических таблиц","href":"ru/user-guide/dynamic-tables/overview.html#types","level":2},{"title":"Архитектура","href":"ru/user-guide/dynamic-tables/overview.html#architecture","level":2},{"title":"Атрибуты","href":"ru/user-guide/dynamic-tables/overview.html#attributes","level":2},{"title":"Ограничения ","href":"ru/user-guide/dynamic-tables/overview.html#limitations","level":2},{"title":"Таблицы, находящиеся в памяти (in-memory)","href":"ru/user-guide/dynamic-tables/overview.html#in_memory","level":2,"items":[{"title":"Хеш-таблицы для чтения по ключу","href":"ru/user-guide/dynamic-tables/overview.html#hesh-tablicy-dlya-chteniya-po-klyuchu","level":3}]},{"title":"Форматы хранения таблиц","href":"ru/user-guide/dynamic-tables/overview.html#formats","level":2},{"title":"Права доступа","href":"ru/user-guide/dynamic-tables/overview.html#acl","level":2},{"title":"Полезные материалы","href":"ru/user-guide/dynamic-tables/overview.html#links","level":2}],"title":"Динамические таблицы"},"router":{"pathname":"ru/user-guide/dynamic-tables/overview","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
