        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"common\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#common\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общие сведения&lt;/span&gt;&lt;/a&gt;Общие сведения&lt;/h2&gt;\n&lt;p&gt;Реплицированные динамические таблицы — это разновидность таблиц в YTsaurus, которая не хранит полный набор записанных данных, а представляет собой очередь на репликацию. По мере успешной записи в реплики данные из реплицированной динамической таблицы удаляются.&lt;/p&gt;\n&lt;p&gt;Копии (реплики) реплицированной таблицы могут находиться как на том же кластере что и таблица источник (внутрикластерная репликация), так и на других кластерах, часто расположенных в разных ДЦ (межкластерная репликация). Репликация между динамическими таблицами позволяет иметь несколько копий одной и той же таблицы в независимых кластерах и организовать автоматическое копирование данных между ними.&lt;/p&gt;\n&lt;p&gt;Использование реплицированных динамических таблиц позволяет:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;переживать сбои уровня ДЦ как на чтение, так и на запись;&lt;/li&gt;\n&lt;li&gt;повысить отказоустойчивость пользовательского сервиса за счёт изоляции реплик таблицы;&lt;/li&gt;\n&lt;li&gt;проводить обновления кластеров YTsaurus с меньшим временем простоя для пользователя (или без такового).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Реплицированными могут быть как &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;сортированные&lt;/a&gt;, так и &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables.html\"&gt;упорядоченные&lt;/a&gt; динамические таблицы. Сами реплики могут быть &lt;strong&gt;синхронными&lt;/strong&gt; и &lt;strong&gt;асинхронными&lt;/strong&gt;. Успешный коммит транзакции записи гарантирует, что данные попали в синхронную реплику и в очередь репликации. В асинхронные реплики данные будут записаны в фоне. Подробнее можно прочитать в разделе &lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#replication\"&gt;Репликация&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;У каждой реплицированной динамической таблицы могут быть реплики обоих видов. Консистентность данных при записи в реплицированную динамическую таблицу такая же, как и в случае использования нереплицированной динамической таблицы (сортированной или упорядоченной соответственно).&lt;/p&gt;\n&lt;p&gt;Для того чтобы воспользоваться репликацией, необходимо иметь один &lt;strong&gt;мета-кластер&lt;/strong&gt; и один или более &lt;strong&gt;кластеров-реплик&lt;/strong&gt;. Настройка репликации состоит из нескольких шагов:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Создание на мета-кластере специального объекта &lt;code&gt;replicated_table&lt;/code&gt;, хранящего информацию о репликах и статусе репликации;&lt;/li&gt;\n&lt;li&gt;Создание на каждом из кластеров-реплик по одной динамической таблице (сортированной или упорядоченной в зависимости от решаемой задачи);&lt;/li&gt;\n&lt;li&gt;Настройка реплик на мета-кластере и включение репликации.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;После выполнения указанных шагов можно записывать или удалять данные из реплицированной таблицы на мета-кластере с помощью команд &lt;code&gt;insert-rows&lt;/code&gt; и &lt;code&gt;delete-rows&lt;/code&gt; . Внесённые изменения попадут на кластеры-реплики.&lt;/p&gt;\n&lt;p&gt;Реплицированная динамическая таблица имеет &lt;em&gt;схему&lt;/em&gt; и &lt;em&gt;таблеты&lt;/em&gt;, определяемые граничными ключами. Схема реплицированной таблицы должна быть не шире чем схема у реплик (различия возможны в процессе миграции всех реплик до более широкой схемы).&lt;/p&gt;\n&lt;p&gt;На запись в реплицированную динамическую таблицу распространяются транзакции: фактическое попадание строк в неё происходит при коммите транзакции записи. Данная транзакция должна проводиться именно на мета-кластере. В рамках подобной транзакции по-прежнему можно использовать другие динамические (не обязательно реплицированные) таблицы мета-кластера.&lt;/p&gt;\n&lt;h2 id=\"write\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#write\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запись данных&lt;/span&gt;&lt;/a&gt;Запись данных&lt;/h2&gt;\n&lt;p&gt;Запись с клиента в реплицированную динамическую таблицу приводит к распределенному коммиту. В рамках коммита в очередь репликации на мета-кластере добавляются строки. Также в рамках этой транзакции клиент записывает изменения в каждую синхронную реплику (если таковые есть). Потоки данных идут от клиента на мета-кластер, а также на каждый кластер с синхронной репликой напрямую, т. е. от клиента потоки кратно увеличиваются (как минимум в два раза при наличии одной синхронной реплики). Координатором данной распределенной транзакции выступает мета-кластер. При невозможности записать данные хотя бы в одну синхронную реплику, клиент получит ошибку.&lt;/p&gt;\n&lt;p&gt;Запись в реплицированную динамическую таблицу с хотя бы одной синхронной репликой семантически не отличается от записи в обычную динамическую таблицу. Существует возможность выполнять запись в реплицированную динамическую таблицу даже при отсутствии синхронных реплик.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В режиме записи в реплицированную динамическую таблицу без синхронных реплик система не в состоянии проверить наличие конфликтов между транзакциями, так что семантически такая запись отличается от обычной.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Успешная запись в реплицированную динамическую таблицу, имеющую только асинхронные реплики, означает только то, что изменения приняты системой и гарантированно (по возможности быстро) будут доставлены до реплик. Сами асинхронные реплики при этом всегда отстают от таблицы источника.&lt;/p&gt;\n&lt;p&gt;Для того чтобы разрешить клиенту запись в реплицированную динамическую таблицу, у которой нет ни одной синхронной реплики, у команд записи (&lt;code&gt;insert-rows&lt;/code&gt;, &lt;code&gt;delete-rows&lt;/code&gt;) имеется специальный флаг &lt;code&gt;require_sync_replica&lt;/code&gt; (значение по умолчанию &lt;code&gt;true&lt;/code&gt;). Выставление флага в &lt;code&gt;false&lt;/code&gt; разрешает запись в реплицированную динамическую таблицу без синхронной реплики.&lt;/p&gt;\n&lt;p&gt;При невозможности записать данные в асинхронную реплику данные будут копиться в реплицированной таблице. После восстановления связи с репликой все неотреплицированные данные будут записаны в реплику.&lt;/p&gt;\n&lt;h2 id=\"read\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#read\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чтение данных&lt;/span&gt;&lt;/a&gt;Чтение данных&lt;/h2&gt;\n&lt;p&gt;Главная задача реплицированной динамической таблицы — как можно быстрее записать пользовательские данные в очередь на репликацию. Также, как уже было упомянуто выше, реплицированная динамическая таблица не хранит полный набор данных. Поэтому система YTsaurus стремится сократить нагрузку на чтение из реплицированной динамической таблицы и при наличии синхронной реплики (определяется подзапросом к мета-кластеру) будет перенаправлять все запросы на чтение на синхронную реплику. При этом гарантируется семантическая неотличимость такого чтения от чтения из обычной динамической таблицы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Возможность чтения из реплицированной динамической таблицы сопряжена с дополнительными накладными расходами по взаимодействию с мета-кластером. Данную функциональность нельзя применять в ситуации, когда необходима низкая латентность или высокий RPS.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При наличии только асинхронных реплик возможность чтения из реплицированной динамической таблицы сохраняется, но является нежелательной, так как создаёт дополнительную нагрузку на реплицированную динамическую таблицу. Чтение стоит осуществлять с реплик.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтение из реплицированной динамической таблицы можно выполнять при помощи команд &lt;code&gt;select-rows&lt;/code&gt;и &lt;code&gt;lookup-rows&lt;/code&gt;). При использовании &lt;code&gt;select-rows&lt;/code&gt; в одном запросе могут участвовать сразу несколько таблиц мета-кластера. В случае если хотя бы одна из таблиц в запросе является реплицированной, все остальные тоже должны быть реплицированными, при этом должен существовать единый кластер, на котором имеются синхронные реплики всех указанных таблиц. Иными словами, межкластерные запросы не поддерживаются.&lt;/p&gt;\n&lt;h2 id=\"replication\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#replication\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Репликация&lt;/span&gt;&lt;/a&gt;Репликация&lt;/h2&gt;\n&lt;p&gt;Процесс асинхронной репликации работает по push схеме. При этом для каждого таблета реплицированной динамической таблицы и каждой её реплики работает т. н. репликатор, который вычитывает свежие изменения из очереди на репликацию и отправляет данные в асинхронные реплики. Процесс отправки представляет собой распределенную (между кластерами) транзакцию, в которой данные с одной стороны записываются в таблицу-реплику, а с другой происходит отметка в метаданных реплицированной динамической таблицы факт репликации порции данных.&lt;/p&gt;\n&lt;h3 id=\"garantii\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#garantii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гарантии&lt;/span&gt;&lt;/a&gt;Гарантии&lt;/h3&gt;\n&lt;p&gt;Для асинхронных реплик транзакции репликации (доставляющие данные до реплик) никак не скоординированы с транзакциями записи в реплицированную таблицу. Изменения в одной транзакции записи в реплицированную таблицу могут быть разбиты на несколько транзакций репликации. Гарантии:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;для читателя реплики нет гарантий атомарности — он может застать реплику в промежуточном состоянии, когда к ней применилась лишь часть изменений транзакции;&lt;/li&gt;\n&lt;li&gt;гарантируется exactly-once семантика (каждая запись в реплицированную таблицу будет доставлена до всех реплик ровно один раз);&lt;/li&gt;\n&lt;li&gt;гарантируется правильный порядок доставки изменений в таблицы-реплики — все транзакции в таблете реплицированной таблицы упорядочиваются относительно времени коммита (commit timestamp). Именно в таком порядке изменения отправляются в реплики.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В случае синхронного режима никакого участия репликатора в деле появления данных в реплике нет. Вместо этого клиент, выполняющий запись в реплицированную таблицу в рамках той же транзакции осуществляет (автоматически, неявно) запись и в таблицу с синхронной репликой. В этом смысле способ, которым данные попадают в синхронную реплику, мало чем отличается от обычной записи в таблицу. В частности, для синхронной реплики консистентность ее состояния гарантируется ровно на том же уровне, на котором она гарантируется для обычной динамической таблицы. (Здесь, впрочем, важно понимать, что написанное справедливо лишь в случае, когда реплика постоянно остается синхронной. При переключении режима репликации на асинхронный данные начинают попадать в таблицу с запаздыванием, и общаясь напрямую с репликой у клиента не так много шансов понять, что подобное переключение произошло.&lt;/p&gt;\n&lt;p&gt;К таблицам-репликами можно общаться напрямую через кластеры, где эти реплики физически находятся. Таблицы-реплики являются особенными. При репликации в таблицах-репликах оказываются данные с timestamp-ом, сгенерированном на мета-кластере. Записывать данные в таблицы-реплики напрямую (минуя мета-кластер) нельзя, система прилагает максимум усилий для того, чтобы запретить такую запись (выставив &lt;code&gt;upstream_replica_id&lt;/code&gt; в нулевое значение, подобную запись можно осуществить. Риски такого действия описаны далее). Чтение данных из таблиц-реплик возможно. Такой способ использования приветствуется в случае, когда таблицы-реплики обслуживают размещенный в том же ДЦ realtime-сервис, отдающий данные внешнему пользователю.&lt;/p&gt;\n&lt;p&gt;Ограничения по консистентности данных, которые можно прочитать:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;если реплика синхронна, то чтение без указания timestamp даст самое свежее состояние (на уровне отдельных значений отдельных строк, в частности, snapshot-изоляция отсутствует: разные строки, а также разные колонки одной и той же строки могут отвечать различным моментам времени; гарантируется, видимость данных из всех закоммиченных транзакций);&lt;/li&gt;\n&lt;li&gt;чтения из реплики с указанием timestamp возможно, но сам timestamp при этом рекомендуется получить на мета-кластере, т.к. этот timestamp на самом деле является невалидным для кластера с репликой (так как пришел из мета-кластера);&lt;/li&gt;\n&lt;li&gt;для асинхронных реплик всегда возможно (и есть) отставание, так что любое чтение будет возвращать отстающие данные; при репликации не гарантируется консистентность (транзакция в реплицированной таблице могла атомарно изменить ключи &lt;code&gt;A&lt;/code&gt; и &lt;code&gt;B&lt;/code&gt;, из реплики можно прочитать новое значение для &lt;code&gt;A&lt;/code&gt;, а после этого — старое для &lt;code&gt;B&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"repliki\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#repliki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Реплики&lt;/span&gt;&lt;/a&gt;Реплики&lt;/h3&gt;\n&lt;p&gt;С каждой реплицированной таблицей связан набор реплик (объектов типа &lt;code&gt;table_replica&lt;/code&gt;) создаваемых следующим образом:&lt;/p&gt;\n&lt;p&gt;Создание реплики:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt create replicated_table //tmp/replicated --attr &lt;span class=\"hljs-string\"&gt;'{dynamic=%true; schema=[{name=k;type=string;sort_order=ascending};{name=v;type=string}]}'&lt;/span&gt;\n\nyt create table_replica --attr &lt;span class=\"hljs-string\"&gt;'{table_path=\"//tmp/replicated\"; cluster_name=\"replica_cluster\";replica_path=\"//tmp/replica\"}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"185\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-185\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-185\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-185.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Данный набор команд создает на метакластере реплицированную таблицу &lt;code&gt;//tmp/replicated&lt;/code&gt;, а также конфигурирует для нее (асинхронную) реплику на кластере &lt;code&gt;replica_cluster&lt;/code&gt; по пути &lt;code&gt;//tmp/replica&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Указанные команды &lt;strong&gt;не создают&lt;/strong&gt; сами по себе таблицу &lt;code&gt;//tmp/replica&lt;/code&gt; на кластере-реплике, а лишь настраивают реплику для &lt;code&gt;//tmp/replicated&lt;/code&gt;. Создание таблиц-реплик необходимо выполнять самостоятельно.&lt;/p&gt;\n&lt;p&gt;Стоит обратить внимание, что сразу после создания реплики, она находится в &lt;strong&gt;отключенном состоянии&lt;/strong&gt; (&lt;code&gt;state = \"disabled\"&lt;/code&gt;), при котором репликация отключена. Чтобы запустить реплику, необходимо выполнить команду &lt;code&gt;alter-table-replica --enable&lt;/code&gt;. Подробнее &lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#replica-state\"&gt;ниже&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;У каждой созданной реплики (как и у любого объекта мастер-сервера) существует id. Для просмотра информации о реплике можно использовать следующие команды:&lt;/p&gt;\n&lt;p&gt;Просмотр реплики:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt get //tmp/replicated/@replicas\nyt get &lt;span class=\"hljs-string\"&gt;'#replica-id/@'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"201\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-201\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-201\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-201.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Удалить реплику можно как и иные объекты с помощью команды &lt;code&gt;remove&lt;/code&gt;:&lt;/p&gt;\n&lt;p&gt;Удаление реплики:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt remove &lt;span class=\"hljs-string\"&gt;'#replica-id'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"208\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-208\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-208\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-208.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"add-new-replica\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#add-new-replica\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Добавление реплики к существующей реплицированной таблице&lt;/span&gt;&lt;/a&gt;Добавление реплики к существующей реплицированной таблице&lt;/h4&gt;\n&lt;p&gt;Если хочется добавить реплику, сделав полную копию данных уже существующей реплики, то стоит воспользоваться готовым инструментом по копированию реплики.&lt;/p&gt;\n&lt;p&gt;Если же хочется добавить новую реплику или уже имеется таблица-реплика, которая хранит требуемое состояние данных, то необходимо при создании объекта &lt;code&gt;table_replica&lt;/code&gt; указать один из двух атрибутов: &lt;code&gt;start_replication_timestamp&lt;/code&gt; или &lt;code&gt;start_replication_row_indexes&lt;/code&gt;. В случае указания &lt;code&gt;start_replication_timestamp&lt;/code&gt; реплицироваться будут все изменения, у которых commit ts строго больше указанного значения (имеется в виду timestamp в смысле метакластера). Если нужно начать репликацию просто с некоторого момента, то самое удобное — это указать timestamp, полученный с помощью вызова generate-timestamp к метакластеру. В случае &lt;code&gt;start_replication_row_indexes&lt;/code&gt; необходимо для каждого таблета реплицированной таблицы указать, с какого row index в этом таблете следует реплицировать данные в реплику. Актуальные row indexes можно получить из запроса get-tablet-infos.&lt;/p&gt;\n&lt;h3 id=\"sozdanie-tablic-replik\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#sozdanie-tablic-replik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создание таблиц-реплик&lt;/span&gt;&lt;/a&gt;Создание таблиц-реплик&lt;/h3&gt;\n&lt;p&gt;Таблица-реплика — это обычная (динамическая) таблица на целевом кластере. Но при ее создании необходимо задать атрибут &lt;code&gt;upstream_replica_id&lt;/code&gt;, в котором указать id объекта-реплики на метакластере. Указание &lt;code&gt;upstream_replica_id&lt;/code&gt; разрешает репликатору выполнять запись из метакластера в кластер с репликой, а также запрещает прямую (минуя репликатор) запись в таблицу-реплику. Указание данного id защищает от ошибок конфигурации, при которых одна и та же таблица оказывается репликой для нескольких реплицированных таблиц.&lt;/p&gt;\n&lt;p&gt;Создание таблицы-реплики:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt create table //tmp/replica --attr &lt;span class=\"hljs-string\"&gt;'{dynamic=%true; upstream_replica_id=replica-id;schema=[{name=k;type=string;sort_order=ascending};{name=v;type=string}]}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"227\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-227\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-227\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-227.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Атрибут &lt;code&gt;upstream_replica_id&lt;/code&gt; у таблицы можно изменить и после создания с помощью команды &lt;code&gt;alter-table&lt;/code&gt;. При этом, все таблеты таблицы должны быть отмонтированы.&lt;/p&gt;\n&lt;h3 id=\"replica-state\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#replica-state\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройки реплик&lt;/span&gt;&lt;/a&gt;Настройки реплик&lt;/h3&gt;\n&lt;p&gt;Сразу после создания реплики она находится в состоянии &lt;code&gt;disabled&lt;/code&gt; (атрибут &lt;code&gt;state&lt;/code&gt;). В таком положении репликация не осуществляется. Для того, чтобы включить реплику, необходимо воспользоваться командой &lt;code&gt;alter-table-replica&lt;/code&gt;:&lt;/p&gt;\n&lt;p&gt;Включение реплики:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt alter-table-replica replica-id --&lt;span class=\"hljs-built_in\"&gt;enable&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"240\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-240\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-240\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-240.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Реплика перейдет в состояние &lt;code&gt;enabling&lt;/code&gt;, а затем, когда будет включена успешно — в состояние &lt;code&gt;enabled&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Реплику можно отключить, прервав тем самым репликацию. Для отключения реплики следует использовать ту же команду &lt;code&gt;alter-table-replica&lt;/code&gt;. Отключение также асинхронно, реплика перейдет в состояние &lt;code&gt;disabling&lt;/code&gt;, а затем &lt;code&gt;disabled&lt;/code&gt;:&lt;/p&gt;\n&lt;p&gt;Выключение реплики:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt alter-table-replica replica-id --&lt;span class=\"hljs-built_in\"&gt;disable&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"250\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-250\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-250\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-250.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"ruchnaya-sinhronizaciya\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#ruchnaya-sinhronizaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ручная синхронизация&lt;/span&gt;&lt;/a&gt;Ручная синхронизация&lt;/h3&gt;\n&lt;p&gt;В ряде случаев для работы достаточно иметь лишь асинхронные реплики (они дают максимальную возможную скорость записи в реплицированную таблицу, т. к. все действия производятся в фоне), но при этом иметь возможность явно дождаться окончания репликации в какую-либо реплику. Для этого существует команда &lt;code&gt;get-in-sync-replicas&lt;/code&gt;. Для ее работы нужно указать timestamp и система найдет все реплики, до которых гарантированно доехали все изменения с timestamp не выше заданного. К примеру, можно сгенерировать текущий timestamp, а затем в цикле ожидать того момента, когда заданная реплика окажется в списке, возвращаемом командой. После этого в данную реплику можно пойти с запросом и передать timestamp. Это будет гарантировать консистентность чтения.&lt;/p&gt;\n&lt;h3 id=\"rezhimy-replikacii\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#rezhimy-replikacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Режимы репликации&lt;/span&gt;&lt;/a&gt;Режимы репликации&lt;/h3&gt;\n&lt;p&gt;По умолчанию реплики создаются в асинхронном режиме. Пользователь может указать синхронный режим при создании (через атрибут &lt;code&gt;mode&lt;/code&gt;), а также сменить режим на лету (с помощью команды &lt;code&gt;alter_table_replica&lt;/code&gt;). При таком переключении может возникать даунтайм на запись: если реплика переводится из асинхронного состояния в синхронное, то перед тем как клиент сможет в нее писать, необходимо, чтобы в эту реплику полностью завершилась репликация хвоста очереди. Поэтому не стоит объявлять синхронной реплику с большим лагом (в реплицированную таблицу нельзя будет писать до тех пор, пока лаг не пропадет).&lt;/p&gt;\n&lt;p&gt;Существует возможность асинхронной репликации без сохранения исходных &lt;code&gt;timestamp&lt;/code&gt;. Чтобы воспользоваться этим режимом необходимо создать реплику с атрибутами &lt;code&gt;{\"mode\": \"async\", \"preserve_timestamps\": \"false\"}&lt;/code&gt;, при этом таблицу-реплику следует создавать без указания атрибута &lt;code&gt;upstream_replica_id&lt;/code&gt;. Данная возможность может быть полезна в ряде случаев:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Хочется реплицировать данные в одну таблицу-реплику из нескольких источников.&lt;/li&gt;\n&lt;li&gt;Хочется вручную менять данные в таблице-реплике (патчить, подливать новые данные) в обход механизма репликации.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"avtomaticheskoe-pereklyuchenie-sinhronnoj-repliki\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#avtomaticheskoe-pereklyuchenie-sinhronnoj-repliki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Автоматическое переключение синхронной реплики&lt;/span&gt;&lt;/a&gt;Автоматическое переключение &lt;strong&gt;синхронной&lt;/strong&gt; реплики&lt;/h3&gt;\n&lt;p&gt;Если кластер, на котором находится синхронная реплика, недоступен, то запись в реплицированную динамическую таблицу останавливается. Чтобы продолжить запись необходимо переключить синхронную реплику на другой кластер. В системе YTsaurus реализована возможность автоматического переключения синхронной реплики. Чтобы активировать данную возможность, следует либо создать реплицированную динамическую таблицу с атрибутом &lt;code&gt;replicated_table_options={enable_replicated_table_tracker=%true}&lt;/code&gt;, либо добавить указанный атрибут впоследствии с помощью вызова &lt;code&gt;yt set&lt;/code&gt;. В таком случае система YTsaurus будет следить за репликами таблицы и при необходимости переключать синхронную реплику на другой кластер.&lt;/p&gt;\n&lt;p&gt;Для настройки числа синхронных реплик существуют две настройки - &lt;code&gt;min_sync_replica_count&lt;/code&gt; и &lt;code&gt;max_sync_replica_count&lt;/code&gt;. Автоматика при наличии доступных реплик переключает их в синхронный режим, но чтобы было не более &lt;code&gt;max_sync_replica_count&lt;/code&gt; синхронных реплик. Также автоматика следит за тем, чтобы число синхронных реплик не опускалось ниже &lt;code&gt;min_sync_replica_count&lt;/code&gt;.&lt;br /&gt;\nЕсли не указаны &lt;code&gt;min_sync_replica_count&lt;/code&gt; и &lt;code&gt;max_sync_replica_count&lt;/code&gt;, то оба поля будут по умолчанию равны 1. Если не указано только &lt;code&gt;min_sync_replica_count&lt;/code&gt;, то оно будет равно &lt;code&gt;max_sync_replica_count&lt;/code&gt;. Если же не указано только &lt;code&gt;max_sync_replica_count&lt;/code&gt;, то оно будет равно общему числу реплик. Таким образом, по умолчанию автоматика поддерживает ровно одну синхронную реплику.&lt;br /&gt;\nДля реплик типа &lt;code&gt;queue&lt;/code&gt; в случае хаосной репликации существуют специальные параметры &lt;code&gt;min_sync_queue_replica_count&lt;/code&gt; и &lt;code&gt;max_sync_queue_replica_count&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Существует режим, когда система YTsaurus перестаёт следить за какой-либо репликой таблицы, но продолжает следить за остальными репликами. Для включения такого режима для реплики (&lt;code&gt;table_replica&lt;/code&gt;) с помощью вызова &lt;code&gt;yt set&lt;/code&gt; необходимо выставить атрибут &lt;code&gt;enable_replicated_table_tracker=%false&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Текущий режим для таблицы-реплики можно посмотреть с помощью аттрибута &lt;code&gt;replicated_table_tracker_enabled&lt;/code&gt; объекта реплики мета-кластера:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt --proxy meta-cluster get //home/some_meta_table/@replicas\n\n&lt;span class=\"hljs-string\"&gt;\"table-replica-id\"&lt;/span&gt; = {\n     &lt;span class=\"hljs-string\"&gt;\"cluster_name\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"some_name\"&lt;/span&gt;;\n     &lt;span class=\"hljs-string\"&gt;\"replica_path\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"//home/some_table\"&lt;/span&gt;;\n     &lt;span class=\"hljs-string\"&gt;\"state\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"enabled\"&lt;/span&gt;;\n     &lt;span class=\"hljs-string\"&gt;\"mode\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"async\"&lt;/span&gt;;\n     &lt;span class=\"hljs-string\"&gt;\"replicated_table_tracker_enabled\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;;\n };\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"293\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-293\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-293\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-293.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"replication_collocation\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#replication_collocation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Одновременное переключение синхронных реплик группы таблиц&lt;/span&gt;&lt;/a&gt;Одновременное переключение синхронных реплик группы таблиц&lt;/h4&gt;\n&lt;p&gt;Существует возможность объединить реплицированные таблицы в группы (коллокации), чтобы система следила за тем, что синхронные реплики этих таблиц находятся на одних и тех же кластерах.&lt;br /&gt;\nДля этого создается объект &lt;code&gt;table_collocation&lt;/code&gt;, который хранит список коллоцированных реплицированных таблиц.&lt;/p&gt;\n&lt;p&gt;Работа с коллокациями реплицированных таблиц:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Создать коллокацию с указанием списка таблиц.&lt;/span&gt;\nyt create table_collocation --attributes &lt;span class=\"hljs-string\"&gt;'{collocation_type=replication; table_paths=[\"//tmp/replicated_table_1\"; \"//tmp/replicated_table_2\"]}'&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Узнать список таблиц в коллокации.&lt;/span&gt;\nyt get &lt;span class=\"hljs-string\"&gt;\"#collocation-id/@table_ids\"&lt;/span&gt;\nyt get &lt;span class=\"hljs-string\"&gt;\"#collocation-id/@table_paths\"&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Узнать id коллокации, которой принадлежит данная таблица.&lt;/span&gt;\nyt get //tmp/replicated_table_1/@replication_collocation_id\n\n&lt;span class=\"hljs-comment\"&gt;# Узнать список всех таблиц в коллокации, которой принадлежит данная таблица.&lt;/span&gt;\nyt get //tmp/replicated_table_1/@replication_collocation_table_paths\n\n&lt;span class=\"hljs-comment\"&gt;# Добавить таблицу в коллокацию.&lt;/span&gt;\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //tmp/replicated_table_3/@replication_collocation_id collocation-id\n\n&lt;span class=\"hljs-comment\"&gt;# Удалить таблицу из коллокации.&lt;/span&gt;\nyt remove //tmp/replicated_table_3/@replication_collocation_id\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"303\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-303\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-303\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-303.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"ukazanie-predpochtitelnyh-klasterov-dlya-sinhronnyh-replik\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#ukazanie-predpochtitelnyh-klasterov-dlya-sinhronnyh-replik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Указание предпочтительных кластеров для синхронных реплик&lt;/span&gt;&lt;/a&gt;Указание предпочтительных кластеров для синхронных реплик&lt;/h4&gt;\n&lt;p&gt;В случае, когда у реплицированной таблицы на разных кластерах существует несколько реплик, которые могут стать синхронными, можно указать, каким из них следует отдавать предпочтение при автоматическом переключении. Для этого на реплицированную таблицу необходимо выставить следующий атрибут:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //tmp/replicated_table/@replicated_table_options/preferred_sync_replica_clusters &lt;span class=\"hljs-string\"&gt;'[\"cluster-name\"]'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"310\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-310\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-310\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-310.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Этот атрибут уважает &lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#replication_collocation\"&gt;коллокации&lt;/a&gt; реплицированных таблиц.&lt;br /&gt;\nЧтобы указать предпочтительные кластера сразу для всех таблиц в коллокации, достаточно один раз указать этот атрибут в опциях коллокации.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; &lt;span class=\"hljs-comment\"&gt;#collocation-id/@replicated_table_options/preferred_sync_replica_clusters '[\"cluster-name\"]'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"314\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-314\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-314\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-314.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В случае отсутствия этого атрибута у коллокации, его значение будет браться из опций реплицированных таблиц. В этом случае стоит следить, чтобы этот атрибут был выставлен &lt;strong&gt;на все таблицы&lt;/strong&gt; коллокации.&lt;/p&gt;\n&lt;h3 id=\"ogranichenie-skorosti-replikacii\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#ogranichenie-skorosti-replikacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничение скорости репликации&lt;/span&gt;&lt;/a&gt;Ограничение скорости репликации&lt;/h3&gt;\n&lt;p&gt;Асинхронная репликация может существенно загружать сеть между датацентрами и кластер с таблицей-репликой, поэтому для таблиц с интенсивной записью рекомендуется настраивать ограничения. Система поддерживает два вида настроек. В большинстве сценариев рекомендуется использовать относительный троттлер.&lt;/p&gt;\n&lt;h4 id=\"otnositelnyj-trottler-replikacii\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#otnositelnyj-trottler-replikacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Относительный троттлер репликации&lt;/span&gt;&lt;/a&gt;Относительный троттлер репликации&lt;/h4&gt;\n&lt;p&gt;Настраивается через атрибут &lt;code&gt;mount_config/relative_replication_throttler&lt;/code&gt;. Это словарь, который может содержать следующие значения.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Имя&lt;/th&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;th&gt;Значение по умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;enable&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Включён ли троттлер&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;%false&lt;/code&gt; (может зависеть от кластера)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;ratio&lt;/td&gt;\n&lt;td&gt;double&lt;/td&gt;\n&lt;td&gt;Отношение скорости репликации к скорости записи&lt;/td&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Относительный троттлер ограничивает скорость асинхронной репликации по отношению к скорости записи. К примеру, если некоторый набор данных был записан в течение одного часа и в это время асинхронная реплика была недоступна, то при ratio = 3 после возвращения реплики эти данные будут отреплицированы за 20 минут.&lt;/p&gt;\n&lt;p&gt;В случае постоянной скорости записи настройка по умолчанию (ratio = 2) обеспечивает, что время схождения лага будет приблизительно равно времени накопления лага. В этом случае предполагается, что на кластере-реплике есть достаточно ресурсов, чтобы обеспечить удвоенную нагрузку на время сокращения отставания. Уменьшая значение ratio, можно уменьшить требуемые гарантии по дополнительным ресурсам ценой увеличения времени догонки реплик.&lt;/p&gt;\n&lt;p&gt;Пример настройки:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;yt set //tmp/replicated_table/@mount_config/relative_replication_throttler '{ratio=1.5}'\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"387\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-387\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-387\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-387.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"absolyutnyj-trottler-replikacii\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#absolyutnyj-trottler-replikacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Абсолютный троттлер репликации&lt;/span&gt;&lt;/a&gt;Абсолютный троттлер репликации&lt;/h4&gt;\n&lt;p&gt;Настраивается через атрибут таблицы &lt;code&gt;mount_config/replication_throttler&lt;/code&gt;, у которого можно задать два значения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;limit — предел для среднего значения пропускной способности в байт/с;&lt;/li&gt;\n&lt;li&gt;period — временной интервал в мс, в течение которого замеряется среднее значение пропускной способности.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Например, следующая команда выставляет ограничение на репликацию в один мегабайт в секунду:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //tmp/replicated_table/@mount_config/replication_throttler &lt;span class=\"hljs-string\"&gt;'{period=1000;limit=1000000}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"409\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-409\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-409\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-409.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выставляемое ограничение действует не на всю таблицу, а на каждый таблет таблицы в отдельности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"sohranenie-indeksa-tableta-pri-replikacii-uporyadochennoj-tablicy\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#sohranenie-indeksa-tableta-pri-replikacii-uporyadochennoj-tablicy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сохранение индекса таблета при репликации упорядоченной таблицы&lt;/span&gt;&lt;/a&gt;Сохранение индекса таблета при репликации упорядоченной таблицы&lt;/h3&gt;\n&lt;p&gt;По умолчанию асинхронная репликация упорядоченной динтаблицы пишет строки в произвольный таблет реплики. Если вам нужно сохранение индекса таблета (а это важно, если вы хотите видеть в разных репликах одну и ту же строку в таблетах под одним и тем же индексом), выставите атрибут &lt;code&gt;preserve_tablet_index&lt;/code&gt; на самой упорядоченной динтаблице в &lt;code&gt;%true&lt;/code&gt;. Если вы пользуетесь таким атрибутом, то вам нужно самостоятельно следить за тем, чтобы у реплицированной таблицы и у таблиц-реплик было строго одинаковое количество таблетов.&lt;/p&gt;\n&lt;h2 id=\"alter_schema\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#alter_schema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Изменение схемы&lt;/span&gt;&lt;/a&gt;Изменение схемы&lt;/h2&gt;\n&lt;p&gt;Совместимое изменение схемы как таблицы-реплики, так и реплицированной таблицы можно выполнить с помощью команды &lt;code&gt;alter-table&lt;/code&gt;. Команду необходимо выполнять на каждой таблице независимо. Перед вызовом команды таблицу необходимо отмонтировать.&lt;/p&gt;\n&lt;p&gt;Схемы таблиц-реплик не обязаны совпадать со схемой реплицированной таблицы, но должны быть не уже схемы последней, чтобы репликация работала корректно. Изменение схемы нужно начинать с реплик, а затем переходить к реплицированной таблице.&lt;/p&gt;\n&lt;h2 id=\"downtimes\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#downtimes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Устойчивость к даунтаймам и обновлениям&lt;/span&gt;&lt;/a&gt;Устойчивость к даунтаймам и обновлениям&lt;/h2&gt;\n&lt;p&gt;Каждый кластер-реплика существует независимо. При отключении кластера-реплики нет возможности читать из него данные. Обновления реплик можно выполнять независимо.&lt;/p&gt;\n&lt;p&gt;Схемы таблиц-реплик не обязаны совпадать со схемой реплицированной таблицы, но должны быть не уже схемы последней, чтобы репликация работала корректно. Изменение схемы нужно начинать с реплик, а затем переходить к реплицированной таблице.&lt;/p&gt;\n&lt;p&gt;Для того, чтобы можно было записывать данные в реплицированную таблицу, необходимо и достаточно выполнение двух условий:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Доступен мета-кластер.&lt;/li&gt;\n&lt;li&gt;Доступны все синхронные реплики реплицированной таблицы. Предполагается, что мета-кластер является геораспределённым, обновляется редко и с коротким даунтаймом, в течение которого в таблицу нельзя писать (но по-прежнему можно читать напрямую из реплик). Если у реплицированной таблицы нет синхронных реплик, то в неё можно писать всегда, когда доступен мета-кластер. Если у таблицы есть синхронная реплика, то необходимо поддерживать её доступной (в чем может помочь автоматика переключения синхронных реплик).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"attributes\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атрибуты&lt;/span&gt;&lt;/a&gt;Атрибуты&lt;/h2&gt;\n&lt;p&gt;Все реплицированные таблицы являются таблицами, а значит обладают соответствующим набором атрибутов. Дополнительно любая реплицированная таблица характеризуется такими параметрами:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Имя&lt;/th&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;replicas&lt;/td&gt;\n&lt;td&gt;Guid-&amp;gt;ReplicaInfo&lt;/td&gt;\n&lt;td&gt;Описание реплик (ключи — id реплик, значения — некоторые их важные атрибуты)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;replicated_table_options&lt;/td&gt;\n&lt;td&gt;ReplicatedTableOptions&lt;/td&gt;\n&lt;td&gt;Настройки автоматики переключения реплик&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;preserve_tablet_index&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Сохранять при репликации упорядоченных динтаблиц tablet index; по умолчанию &lt;code&gt;%false&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Здесь &lt;code&gt;ReplicatedTableOptions&lt;/code&gt; имеют вид:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Имя&lt;/th&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_replicated_table_tracker&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Включена ли автоматика переключения синхронных реплик; по умолчанию &lt;code&gt;%false&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_sync_replica_count&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Максимальное и желаемое количество синхронных реплик, которые нужно поддерживать автоматике&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;min_sync_replica_count&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Минимальное количество синхронных реплик, которые нужно поддерживать автоматике&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_sync_queue_replica_count&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Аналогично &lt;code&gt;max_sync_replica_count&lt;/code&gt;, но для реплик типа &lt;code&gt;queue&lt;/code&gt; (используется в хаосной репликации).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;min_sync_queue_replica_count&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Аналогично &lt;code&gt;min_sync_replica_count&lt;/code&gt;, но для реплик типа &lt;code&gt;queue&lt;/code&gt; (используется в хаосной репликации).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;preferred_sync_replica_clusters&lt;/td&gt;\n&lt;td&gt;list&lt;/td&gt;\n&lt;td&gt;Список предпочтительных кластеров для синхронных реплик&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;sync_replica_lag_threshold&lt;/td&gt;\n&lt;td&gt;Duration&lt;/td&gt;\n&lt;td&gt;Максимальное значение лага, до которого реплика считается доступной. По умолчанию равен 10 минутам. Такое значение иногда может приводить к долгой дорепликации, в этом случае его рекомендуется уменьшить.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_preload_state_check&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Проверять ли preload state таблиц, примонтированных в память для определения их доступности. По умолчанию значение &lt;code&gt;%false&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;incomplete_preload_grace_period&lt;/td&gt;\n&lt;td&gt;Duration&lt;/td&gt;\n&lt;td&gt;При проверке доступности реплики в смысле preload state она считается доступной, если последний раз preload был успешно завершен не позднее, чем значение это параметра. По умолчанию равен 5 минутам. Данный параметр нужен, чтобы кратковременный preload при перебалансировке таблета не влиял на работу алгоритма.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Каждая реплика описывается словарём &lt;code&gt;ReplicaInfo&lt;/code&gt; следующего вида:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Имя&lt;/th&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;cluster_name&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Имя кластера-реплики&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;replica_path&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Путь к таблице с репликой на кластере-реплике&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;state&lt;/td&gt;\n&lt;td&gt;TableReplicaState&lt;/td&gt;\n&lt;td&gt;Состояние реплики&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;mode&lt;/td&gt;\n&lt;td&gt;TableReplicaMode&lt;/td&gt;\n&lt;td&gt;Режим работы реплики: &lt;code&gt;async&lt;/code&gt; или &lt;code&gt;sync&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;replication_lag_time&lt;/td&gt;\n&lt;td&gt;Duration&lt;/td&gt;\n&lt;td&gt;Оценка лага реплики&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;errors&lt;/td&gt;\n&lt;td&gt;Error&lt;i class=\"yfm yfm-term_title\" term-key=\":*\" role=\"button\" aria-describedby=\":*_element\" tabindex=\"0\" id=\"egpbxxln\"&gt;*&lt;/i&gt;&lt;/td&gt;\n&lt;td&gt;Список ошибок при репликации на данную реплику&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;preserve_timestamps&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Сохранять исходные &lt;code&gt;timestamp&lt;/code&gt; ? По умолчанию &lt;code&gt;true&lt;/code&gt;. Имеет смысл только для асинхронных реплик&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;atomicity&lt;/td&gt;\n&lt;td&gt;EAtomicity&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;full&lt;/code&gt; или &lt;code&gt;none&lt;/code&gt;. Имеет смысл только для асинхронных реплик&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Параметр &lt;code&gt;replication_lag_time&lt;/code&gt; дает примерную оценку лага репликации (с точностью до десятков секунд).&lt;/p&gt;\n&lt;p&gt;Сам объект-реплика помимо перечисленных атрибутов (а также атрибутов, присущих всем объектам) обладает также рядом дополнительных (все их можно узнать, выполнив запрос вида &lt;code&gt;yt get '#replica-id/@'&lt;/code&gt;):&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Имя&lt;/th&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;mode&lt;/td&gt;\n&lt;td&gt;ReplicaMode&lt;/td&gt;\n&lt;td&gt;Режим реплики: &lt;code&gt;sync&lt;/code&gt;, &lt;code&gt;async&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;start_replication_timestamp&lt;/td&gt;\n&lt;td&gt;Timestamp&lt;/td&gt;\n&lt;td&gt;Начальный timestamp для реплики&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;table_path&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Путь к реплицированной таблице на метакластере&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tablets&lt;/td&gt;\n&lt;td&gt;TabletReplicaInfo&lt;i class=\"yfm yfm-term_title\" term-key=\":*\" role=\"button\" aria-describedby=\":*_element\" tabindex=\"0\" id=\"myd48gwz\"&gt;*&lt;/i&gt;&lt;/td&gt;\n&lt;td&gt;Описание состояния таблетов; позиция в списке соответствует индексу таблета, как в самой таблице&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_replicated_table_tracker&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Включает автоматику переключения синхронных реплик (см. выше); по умолчанию &lt;code&gt;%true&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Структура &lt;code&gt;TabletReplicaInfo&lt;/code&gt; имеет следующий вид:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Имя&lt;/th&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;tablet_id&lt;/td&gt;\n&lt;td&gt;Guid&lt;/td&gt;\n&lt;td&gt;Id таблета&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;state&lt;/td&gt;\n&lt;td&gt;TableReplicaState&lt;/td&gt;\n&lt;td&gt;Состояние данной реплики данного таблета&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;current_replication_row_index&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Граница репликации в очереди по индексу записи (репликации подлежат записи с индексом &amp;gt;= данного)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;current_replication_timestamp&lt;/td&gt;\n&lt;td&gt;Timestamp&lt;/td&gt;\n&lt;td&gt;Граница репликации в очереди по timestamp (репликации подлежат записи с timestamp &amp;gt; данного)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;replication_lag_time&lt;/td&gt;\n&lt;td&gt;Duration&lt;/td&gt;\n&lt;td&gt;Оценка лага реплики для данного таблета&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;flushed_row_count&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Количество записанных на диск строк в данном таблете; если реплицированная таблица заморожена, то это значение можно сравнивать с &lt;code&gt;current_replication_row_index&lt;/code&gt; для слежения за репликацией&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;trimmed_row_count`&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Количество начальных строк в данном таблете, которые были реплицированы всюду и чанки которых были удалены (log truncation)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;replication_error&lt;/td&gt;\n&lt;td&gt;Error&lt;/td&gt;\n&lt;td&gt;Описывает ошибку при репликации. В случае отсутствия ошибки данный тег также будет отсутствовать&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;В процессе работы репликатора параметры &lt;code&gt;current_replication_row_index&lt;/code&gt; и &lt;code&gt;current_replication_timestamp&lt;/code&gt; монотонно растут, отмечая успешно отреплицированные записи.&lt;/p&gt;\n&lt;h2 id=\"queue_check\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#queue_check\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Проверка очереди репликации&lt;/span&gt;&lt;/a&gt;Проверка очереди репликации&lt;/h2&gt;\n&lt;p&gt;Проверку очереди репликации полезно выполнять для того, чтобы пересоздать реплицированную таблицу, при этом не потеряв изменения. Порядок действий таков:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Выполнить команду &lt;code&gt;freeze-table&lt;/code&gt; для реплицированной таблицы.&lt;/li&gt;\n&lt;li&gt;Дождаться (опрашивая атрибут &lt;code&gt;tablet_state&lt;/code&gt; у таблице), пока все таблеты перейдут в состояние &lt;code&gt;frozen&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Получить информацию о состоянии таблетов интересующей таблицы, для чего сделать запрос &lt;code&gt;get #replica-id/@tablets&lt;/code&gt;. Каждый элемент списка-ответа описывает состояние репликации для  заданного таблета реплицированной таблицы в заданную ее реплику. Для  каждого таблета необходимо изучить значения &lt;code&gt;flushed_row_count&lt;/code&gt; и &lt;code&gt;current_replication_row_index&lt;/code&gt; и дождаться, пока они не станут одинаковы.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры использования&lt;/span&gt;&lt;/a&gt;Примеры использования&lt;/h2&gt;\n&lt;h3 id=\"sozdanie,-nastrojka-replik\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/replicated-dynamic-tables.html#sozdanie,-nastrojka-replik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создание, настройка реплик&lt;/span&gt;&lt;/a&gt;Создание, настройка реплик&lt;/h3&gt;\n&lt;p&gt;Примеры работают начиная с версии ytsaurus-client &amp;gt;= 0.8.19. .&lt;/p&gt;\n&lt;p&gt;Примеры использования реплицированных таблиц:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_PROXY=cluster-name\n\n&lt;span class=\"hljs-comment\"&gt;# Создание реплицированной таблицы.&lt;/span&gt;\nyt create replicated_table //tmp/replicated --attr &lt;span class=\"hljs-string\"&gt;'{\n  dynamic=%true;\n  schema=[{name=k;type=int64;sort_order=ascending};{name=v;type=int64}]\n}'&lt;/span&gt;\n730e-68d3e-3ff01a9-325bbdcd\n\n&lt;span class=\"hljs-comment\"&gt;# Создание реплики, связанной с кластером first-replica-cluster.&lt;/span&gt;\nyt create table_replica --attr &lt;span class=\"hljs-string\"&gt;'{\n  table_path=\"//tmp/replicated\";\n  cluster_name=\"first-replica-cluster\";\n  replica_path=\"//tmp/replica\"\n}'&lt;/span&gt;\n730e-7bcd8-3ff02c5-fd0b36ee\n\n&lt;span class=\"hljs-comment\"&gt;# Создание второй реплики на кластере second-replica-cluster.&lt;/span&gt;\nyt create table_replica --attr &lt;span class=\"hljs-string\"&gt;'{\n  table_path=\"//tmp/replicated\";\n  cluster_name=\"second-replica-cluster\";\n  replica_path=\"//tmp/replica\"\n}'&lt;/span&gt;\n730e-8611b-3ff02c5-f647333f\n\n&lt;span class=\"hljs-comment\"&gt;# Создание таблицы-реплики на кластере first-replica-cluster.&lt;/span&gt;\nYT_PROXY=first-replica-cluster yt create table //tmp/replica --attr &lt;span class=\"hljs-string\"&gt;'{\n  dynamic=%true;\n  upstream_replica_id=\"730e-7bcd8-3ff02c5-fd0b36ee\";\n  schema=[{name=k;type=int64;sort_order=ascending};{name=v;type=int64}]\n}'&lt;/span&gt;\n6cd9-66770-3ee0191-980d9f6\n\n&lt;span class=\"hljs-comment\"&gt;# Создание таблицы-реплики на кластере second-replica-cluster.&lt;/span&gt;\nYT_PROXY=second-replica-cluster yt create table //tmp/replica --attr &lt;span class=\"hljs-string\"&gt;'{\n  dynamic=%true;\n  upstream_replica_id=\"730e-8611b-3ff02c5-f647333f\";\n  schema=[{name=k;type=int64;sort_order=ascending};{name=v;type=int64}]\n}'&lt;/span&gt;\n78b6-1dacd9-3f40191-2057d1df\n\n&lt;span class=\"hljs-comment\"&gt;# Монтирование таблицы-реплики и реплицированной таблицы.&lt;/span&gt;\nyt mount-table //tmp/replicated\nYT_PROXY=first-replica-cluster yt mount-table //tmp/replica\nYT_PROXY=second-replica-cluster yt mount-table //tmp/replica\n\n&lt;span class=\"hljs-comment\"&gt;# Запись данных в реплицированную таблицу.&lt;/span&gt;\n&lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'{k=1;v=100}'&lt;/span&gt; | yt insert-rows //tmp/replicated --format yson\nTable //tmp/replicated has no synchronous replicas\n\n&lt;span class=\"hljs-comment\"&gt;# Выставление флага no-require-sync-replica, чтобы форсировать запись.&lt;/span&gt;\n&lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'{k=1;v=100}'&lt;/span&gt; | yt insert-rows //tmp/replicated --format yson --no-require-sync-replica\n\n&lt;span class=\"hljs-comment\"&gt;# Запись прошла успешно, но в реплике нет данных.&lt;/span&gt;\nYT_PROXY=first-replica-cluster yt select-rows &lt;span class=\"hljs-string\"&gt;'* from [//tmp/replica]'&lt;/span&gt; --format yson\n\n&lt;span class=\"hljs-comment\"&gt;# Просмотр состояния реплики.&lt;/span&gt;\nyt get &lt;span class=\"hljs-string\"&gt;'#730e-7bcd8-3ff02c5-fd0b36ee/@state'&lt;/span&gt;\n&lt;span class=\"hljs-string\"&gt;\"disabled\"&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Реплика не была включена. Включение реплики.&lt;/span&gt;\nyt alter-table-replica 730e-8611b-3ff02c5-f647333f --&lt;span class=\"hljs-built_in\"&gt;enable&lt;/span&gt;\nyt alter-table-replica 730e-7bcd8-3ff02c5-fd0b36ee --&lt;span class=\"hljs-built_in\"&gt;enable&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Проверка успешности репликации.&lt;/span&gt;\nYT_PROXY=first-replica-cluster yt select-rows &lt;span class=\"hljs-string\"&gt;'* from [//tmp/replica]'&lt;/span&gt; --format json\n{&lt;span class=\"hljs-string\"&gt;\"k\"&lt;/span&gt;:1,&lt;span class=\"hljs-string\"&gt;\"v\"&lt;/span&gt;:100}\n\n&lt;span class=\"hljs-comment\"&gt;# Попытка прочитать данные прямо из реплицированной таблицы.&lt;/span&gt;\nyt select-rows &lt;span class=\"hljs-string\"&gt;'* from [//tmp/replicated]'&lt;/span&gt; --format json\nNo in-sync replicas found &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; table //tmp/replicated\n\n&lt;span class=\"hljs-comment\"&gt;# Без синхронных реплик чтение выполнить не получится.&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# Отключение второй реплики и повторная запись.&lt;/span&gt;\nyt alter-table-replica 730e-8611b-3ff02c5-f647333f --&lt;span class=\"hljs-built_in\"&gt;disable&lt;/span&gt;\n&lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'{k=2;v=200}'&lt;/span&gt; | yt insert-rows //tmp/replicated --format yson --no-require-sync-replica\n\n&lt;span class=\"hljs-comment\"&gt;# Чтение из реплик&lt;/span&gt;\nYT_PROXY=first-replica-cluster yt select-rows &lt;span class=\"hljs-string\"&gt;'* from [//tmp/replica]'&lt;/span&gt; --format json\n{&lt;span class=\"hljs-string\"&gt;\"k\"&lt;/span&gt;:1,&lt;span class=\"hljs-string\"&gt;\"v\"&lt;/span&gt;:100}\n{&lt;span class=\"hljs-string\"&gt;\"k\"&lt;/span&gt;:2,&lt;span class=\"hljs-string\"&gt;\"v\"&lt;/span&gt;:200}\n\nYT_PROXY=second-replica-cluster yt select-rows &lt;span class=\"hljs-string\"&gt;'* from [//tmp/replica]'&lt;/span&gt; --format json\n{&lt;span class=\"hljs-string\"&gt;\"k\"&lt;/span&gt;:1,&lt;span class=\"hljs-string\"&gt;\"v\"&lt;/span&gt;:100}\n\n&lt;span class=\"hljs-comment\"&gt;# Видно, что в first-replica-cluster данные пришли, а в second-replica-cluster нет.&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# Неработающую репликацию можно заметить по растущему лагу.&lt;/span&gt;\nyt get &lt;span class=\"hljs-string\"&gt;'#730e-8611b-3ff02c5-f647333f/@replication_lag_time'&lt;/span&gt;\n141000\n\n&lt;span class=\"hljs-comment\"&gt;# Изменение типа репликации на first-replica-cluster и включение реплики.&lt;/span&gt;\nyt alter-table-replica 730e-8611b-3ff02c5-f647333f --&lt;span class=\"hljs-built_in\"&gt;enable&lt;/span&gt; --mode &lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Чтение данных из first-replica-cluster и проверка наличия данных.&lt;/span&gt;\nYT_PROXY=first-replica-cluster yt select-rows &lt;span class=\"hljs-string\"&gt;'* from [//tmp/replica]'&lt;/span&gt; --format json\n{&lt;span class=\"hljs-string\"&gt;\"k\"&lt;/span&gt;:1,&lt;span class=\"hljs-string\"&gt;\"v\"&lt;/span&gt;:100}\n{&lt;span class=\"hljs-string\"&gt;\"k\"&lt;/span&gt;:2,&lt;span class=\"hljs-string\"&gt;\"v\"&lt;/span&gt;:200}\n\n&lt;span class=\"hljs-comment\"&gt;# Наличие синхронной реплики даёт возможность читать прямо из реплицированной таблицы.&lt;/span&gt;\nyt select-rows &lt;span class=\"hljs-string\"&gt;'* from [//tmp/replicated]'&lt;/span&gt; --format json\n{&lt;span class=\"hljs-string\"&gt;\"k\"&lt;/span&gt;:1,&lt;span class=\"hljs-string\"&gt;\"v\"&lt;/span&gt;:100}\n{&lt;span class=\"hljs-string\"&gt;\"k\"&lt;/span&gt;:2,&lt;span class=\"hljs-string\"&gt;\"v\"&lt;/span&gt;:200}\n\n&lt;span class=\"hljs-comment\"&gt;# Удаление первой строки, на этот раз в синхронном режиме.&lt;/span&gt;\n&lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'{k=1}'&lt;/span&gt; | yt delete-rows //tmp/replicated --format yson\n\n&lt;span class=\"hljs-comment\"&gt;# Проверка выполнения команды.&lt;/span&gt;\nYT_PROXY=first-replica-cluster yt select-rows &lt;span class=\"hljs-string\"&gt;'* from [//tmp/replica]'&lt;/span&gt; --format json\n{&lt;span class=\"hljs-string\"&gt;\"k\"&lt;/span&gt;:2,&lt;span class=\"hljs-string\"&gt;\"v\"&lt;/span&gt;:200}\n\nYT_PROXY=second-replica-cluster yt select-rows &lt;span class=\"hljs-string\"&gt;'* from [//tmp/replica]'&lt;/span&gt; --format json\n{&lt;span class=\"hljs-string\"&gt;\"k\"&lt;/span&gt;:2,&lt;span class=\"hljs-string\"&gt;\"v\"&lt;/span&gt;:200}\n\n&lt;span class=\"hljs-comment\"&gt;# Отключение записи в реплицированную таблицу.&lt;/span&gt;\nyt freeze-table //tmp/replicated\n\n&lt;span class=\"hljs-comment\"&gt;# Проверка того, что таблет заморожен, т. е. все данные записаны на диск.&lt;/span&gt;\nyt get //tmp/replicated/@tablet_state\n&lt;span class=\"hljs-string\"&gt;\"frozen\"&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Проверка, что в каждой из реплик все строки успешно отреплицированы.&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# Для этого необходимо изучать атрибуты flushed_row_count и replicated_row_index.&lt;/span&gt;\nyt get &lt;span class=\"hljs-string\"&gt;'#730e-7bcd8-3ff02c5-fd0b36ee/@tablets'&lt;/span&gt;\n[\n    {\n        &lt;span class=\"hljs-string\"&gt;\"flushed_row_count\"&lt;/span&gt; = 5;\n        &lt;span class=\"hljs-string\"&gt;\"tablet_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"730e-68d3e-3ff02be-ee882e4a\"&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"trimmed_row_count\"&lt;/span&gt; = 2;\n        &lt;span class=\"hljs-string\"&gt;\"replication_lag_time\"&lt;/span&gt; = 0;\n        &lt;span class=\"hljs-string\"&gt;\"current_replication_timestamp\"&lt;/span&gt; = 1610012496066773010u;\n        &lt;span class=\"hljs-string\"&gt;\"current_replication_row_index\"&lt;/span&gt; = 5;\n        &lt;span class=\"hljs-string\"&gt;\"state\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"enabled\"&lt;/span&gt;;\n    };\n]\n\nyt get &lt;span class=\"hljs-string\"&gt;'#730e-8611b-3ff02c5-f647333f/@tablets'&lt;/span&gt;\n[\n    {\n        &lt;span class=\"hljs-string\"&gt;\"flushed_row_count\"&lt;/span&gt; = 5;\n        &lt;span class=\"hljs-string\"&gt;\"tablet_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"730e-68d3e-3ff02be-ee882e4a\"&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"trimmed_row_count\"&lt;/span&gt; = 2;\n        &lt;span class=\"hljs-string\"&gt;\"replication_lag_time\"&lt;/span&gt; = 0;\n        &lt;span class=\"hljs-string\"&gt;\"current_replication_timestamp\"&lt;/span&gt; = 1610012496066773010u;\n        &lt;span class=\"hljs-string\"&g
