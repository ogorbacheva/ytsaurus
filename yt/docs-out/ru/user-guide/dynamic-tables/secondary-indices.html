            {"data":{"leading":false,"html":"&lt;p&gt;В теории баз данных вторичным индексом называется структура данных, позволяющая ускорить выборку из таблицы по неключевым колонкам. Индексируемый кортеж неключевых колонок называется &lt;em&gt;вторичным ключем&lt;/em&gt;.&lt;/p&gt;\n&lt;p&gt;В YTsaurus такие структуры реализованы для сортированных динамических таблиц в виде отдельных таблиц, называемых далее индексными, и специальных объектов, связывающих индексируемую таблицу с индексной. Эти объекты в терминологии YTsaurus и называются вторичными индексами. Они не имеют собственных путей в Кипарисе, являются неизменяемыми и существуют, пока существуют обе индексируемая и индексная таблицы.&lt;/p&gt;\n&lt;p&gt;Вторичные индексы поддержаны также для реплицированных таблиц.&lt;/p&gt;\n&lt;h2 id=\"usage\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/secondary-indices.html#usage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование&lt;/span&gt;&lt;/a&gt;Использование&lt;/h2&gt;\n&lt;p&gt;По умолчанию индексация происходит по кортежу из одной или нескольких неключевых колонок таблицы, а между строками таблиц имеет место биективное соответствие — такое поведение задается атрибутом вторичного индекса &lt;code&gt;kind=full_sync&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;То, какие выборки индекс способен ускорить, определяется схемой индексной таблицы. Для эффективного выбора диапазона чтения необходимо, чтобы вторичный ключ являлся префиксом ключа индексной таблицы. Быстрый доступ до данных в индексируемой таблице достигается за счет хранения полного её ключа (называемого &lt;em&gt;первичным&lt;/em&gt;) в индексной таблице. Поскольку строки сортированных динамических таблиц должны быть уникальными по ключу, то ключ индексной таблицы должен содержать первичный ключ, то есть представлять собой конкатенацию вторичного и первичного ключей (у этого правила есть &lt;a href=\"user-guide/dynamic-tables/secondary-indices#unique\"&gt;исключение&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;В качестве неключевых колонок индексная таблица может содержать одну или несколько неключевых колонок индексируемой таблицы. Она также может не содержать значимых неключевых значений, но в этом случае придется добавить в схему индексной таблицы фиктивную колонку &lt;code&gt;$empty&lt;/code&gt; типа &lt;code&gt;int64&lt;/code&gt;, в которой значения всегда будут равны null.&lt;/p&gt;\n&lt;p&gt;Пример создания таблиц и вторичного индекса, связывающего их:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt create table //path/to/table --attributes &lt;span class=\"hljs-string\"&gt;'{dynamic=true; schema=[{name=key; type=int64; sort_order=ascending}; {name=value; type=string}]}'&lt;/span&gt;\nyt create table //path/to/index_table --attributes &lt;span class=\"hljs-string\"&gt;'{dynamic=true; schema=[{name=value; type=string; sort_order=ascending}; {name=key; type=int64; sort_order=ascending}; {name=\"$empty\"; type=int64}]}'&lt;/span&gt;\nyt create secondary_index --attributes &lt;span class=\"hljs-string\"&gt;'{table_path=\"//path/to/table\"; index_table_path=\"//path/to/index/table\"; kind=full_sync; table_to_index_correspondence=bijective}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"24\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-24\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-24\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-24.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Изменяемый атрибут &lt;code&gt;table_to_index_correspondence&lt;/code&gt; указывает YTsaurus, какое предполагать отношение между строками индексируемой и индексной таблицы (он НЕ характеризует реальное отношение между строками таблиц и пользователь может изменять его самостоятельно). Допустимые значения этого атрибута: &lt;code&gt;bijective&lt;/code&gt;, &lt;code&gt;injective&lt;/code&gt;, &lt;code&gt;invalid&lt;/code&gt; и &lt;code&gt;unknown&lt;/code&gt;. Использование индекса с отношением &lt;code&gt;invalid&lt;/code&gt; запрещено и приведет к ошибке. &lt;code&gt;injective&lt;/code&gt; означает, что в индексной таблице есть строчки, не соответствующие никаким строкам в индексируемой таблице (в такое состояние таблицы могут прийти, например, при построении без даунтайма). &lt;code&gt;bijective&lt;/code&gt; означает полное соответствие между строками таблиц.  Оба отношения - &lt;code&gt;bijective&lt;/code&gt; и &lt;code&gt;injective&lt;/code&gt; - являются рабочими состояниями таблиц, о разнице между ними будет сказано ниже. Отношение &lt;code&gt;unknown&lt;/code&gt; можно увидеть на индексах, созданных более старыми версиями YTsaurus.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Обратите внимание, что имена и типы колонок в таблицах полностью совпадают. Наличие в индексной таблице колонок, которых нет в индексируемой, или несовпадение их типов привлечет к ошибке создания вторичного индекса (за исключением фиктивной колонки &lt;code&gt;$empty&lt;/code&gt; — её присутствие в индексируемой таблице не является необходимым).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Вторичный индекс может быть создан, только если обе таблицы отмонтированы. После создания вторичного индекса и монтирования таблиц &lt;em&gt;последующие&lt;/em&gt; записи в индексируемую таблицу автоматически отображаются в индексной (о построении индексной таблицы поверх имеющихся данных см. &lt;a href=\"user-guide/dynamic-tables/secondary-indices#building\"&gt;далее&lt;/a&gt;). Также становится возможным выполнять эффективные select-запросы с фильтрацией по вторичному ключу, используя ключевое слово &lt;code&gt;WITH INDEX&lt;/code&gt;. Запрос с индексом выполнится эффективно, если предикат позволяет &lt;a href=\"user-guide/dynamic-tables/dyn-query-language#input_data_cut\"&gt;отсечь&lt;/a&gt; ненужные строки из индексной таблицы.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt select-rows &lt;span class=\"hljs-string\"&gt;\"key, value FROM [//path/to/table] WITH INDEX [//path/to/index/table] AS IndexTable where value BETWEEN 0 and 10\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"41\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-41\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-41\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-41.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;При исполнении запроса с таким синтаксисом система сначала прочитает из индексной таблицы строки, подходящие под предикат &lt;code&gt;where value BETWEEN 0 and 10&lt;/code&gt;, а затем выполнит внутреннее соединение (inner join) со строками индексируемой таблицы по общим колонкам для индексов с отношением &lt;code&gt;injective&lt;/code&gt; или по первичному ключу для &lt;code&gt;bijective&lt;/code&gt; индексов. То есть такой запрос эквивалентен одному из следующих:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt select-rows &lt;span class=\"hljs-string\"&gt;\"key, value FROM [//path/to/injective/index/table] AS IndexTable JOIN [//path/to/table] ON (IndexTable.key, IndexTable.value) = (key, value) WHERE IndexTable.value BETWEEN 0 and 10\"&lt;/span&gt;\nyt select-rows &lt;span class=\"hljs-string\"&gt;\"key, value FROM [//path/to/bijective/index/table] AS IndexTable JOIN [//path/to/table] ON IndexTable.key = key WHERE IndexTable.value BETWEEN 0 and 10\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"45\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-45\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-45\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-45.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Актуальный список подключенных к таблице вторичных индексов указан в атрибуте &lt;code&gt;secondary_indices&lt;/code&gt; таблицы. Вторичный индекс, для которого данная таблица является индексной, указан в атрибуте &lt;code&gt;index_to&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Существует также возможность исключить часть строчек из индекса, создать индекс поверх колонки со списком, а также создать специальный индекс, ограничивающий индексируемые значения в таблице свойством уникальности.&lt;/p&gt;\n&lt;h3 id=\"predicate\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/secondary-indices.html#predicate\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Частичная индексация&lt;/span&gt;&lt;/a&gt;Частичная индексация&lt;/h3&gt;\n&lt;p&gt;Индексная таблица может содержать отображения не всех строк, а только тех, для которых выполняется некий предикат. Предикат задается атрибутом &lt;code&gt;predicate&lt;/code&gt; вторичного индекса. Он должен представлять собой валидное булевое выражение над схемой индексируемой таблицы (предикат может использовать колонки, которых нет в индексной таблице). Атрибут &lt;code&gt;predicate&lt;/code&gt; совместим с любым из видов вторичных индексов.&lt;/p&gt;\n&lt;p&gt;Это полезно, если запросы, для которых индекс полезен, касаются только некоторой выделяемой части данных. Например, схема таблицы имеет вид &lt;code&gt;[{name=id; sort_order=ascending; type=uint64}; {name=name; type=string}; {name=age; type=int64}; {name=loyalty; type=boolean}; ...]&lt;/code&gt;, а в запросах вы делаете выборку по возрасту только для строк, в которых &lt;code&gt;loyalty&lt;/code&gt; имеет не-null значение. В таком случае вторичный индекс с предикатом &lt;code&gt;not is_null(loyalty)&lt;/code&gt; и индексной таблицей со схемой &lt;code&gt;[{name=age; type=int64; sort_order=ascending}; {name=id; sort_order=ascending; type=uint64}; {name=$empty, type=int64}]&lt;/code&gt; является оптимальным решением — строки с &lt;code&gt;loyalty=#&lt;/code&gt; не попадут в индексную таблицу.&lt;/p&gt;\n&lt;h3 id=\"unfolding\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/secondary-indices.html#unfolding\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Индекс над списком&lt;/span&gt;&lt;/a&gt;Индекс над списком&lt;/h3&gt;\n&lt;p&gt;Индекс вида &lt;code&gt;kind=unfolding&lt;/code&gt; разворачивает строки по колонке со списком значений примитивного типа. Такой индекс позволяет делать выборки строк, в которых индексируемый список содержит определённые значения. Например, строке &lt;code&gt;{id=0; child_ids=[1, 4, 7]}&lt;/code&gt; в индексной таблице будут соответствовать строки &lt;code&gt;[{child_ids=1; id=0}; {child_ids=4; id=0}; {child_ids=7; id=0}]&lt;/code&gt;. При создании такого индекса необходимо указать атрибут &lt;code&gt;unfolded_column&lt;/code&gt; - имя колонки некоторого типа &lt;code&gt;T&lt;/code&gt; в индексной таблице, также как и колонки типа &lt;code&gt;List&amp;lt;T&amp;gt;&lt;/code&gt; или &lt;code&gt;Optional&amp;lt;List&amp;lt;T&amp;gt;&amp;gt;&lt;/code&gt; в индексируемой таблице. В select-запросах ограничение на индексируемое значение можно задавать используя функцию &lt;code&gt;list_contains&lt;/code&gt;. Пример: &lt;code&gt;id FROM [//path/to/table] WITH INDEX [//path/to/index/table] AS IndexTable where list_contains(child_ids, 1)&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При указании в предикате нескольких допустимых значений child_ids, например &lt;code&gt;list_contains(child_ids, 1) or list_contains(child_ids, 4)&lt;/code&gt;, в случае наличия в индексируемом списке обоих значений select запрос может вернуть несколько строк соответствующих одному первичному ключу в индексируемой таблице. Для восстановления уникальности результат необходимо дополнительно группировать по первичному ключу таблицы.&lt;/p&gt;\n&lt;p&gt;Запрос вида &lt;code&gt;list_contains(child_ids, 1) OR list_contains(child_ids, 2) OR ...&lt;/code&gt; не может содержать большого количества условий из-за ограничения на высоту синтаксического дерева во всех выражениях запроса. Для митигации этого ограничения существует возможность записать предикат в форме &lt;code&gt;child_ids IN (1, 2, ...)&lt;/code&gt;, в данном случае система проинтерпретирует обращение к колонке child_ids как обращение к колонке в индексной таблице.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Например, пусть строки в таблице со схемой &lt;code&gt;[{name=id; type=int64; sort_order=ascending}; {name=book_name; type=string}; {name=genres; type_v3={type_name=list; item=string}}; ...]&lt;/code&gt; описывают книги. Для быстрой выборки по жанрам можно использовать &lt;code&gt;unfolding&lt;/code&gt; вторичный индекс над индексной таблицей со схемой &lt;code&gt;[{name=genres; sort_order=ascending; type=string};{name=id; type=int64; sort_order=ascending}; {name=book_name; type=string}]&lt;/code&gt; — присутствие в схеме индексной таблицы колонки &lt;code&gt;book_name&lt;/code&gt; позволит использовать индексную таблицу без присоединения к индексируемой для запросов, в которых нужны только колонки &lt;code&gt;genres&lt;/code&gt;, &lt;code&gt;book_name&lt;/code&gt; и &lt;code&gt;id&lt;/code&gt;, ещё уменьшая количество чтений и ускоряя выполнение запросов.&lt;/p&gt;\n&lt;h3 id=\"unique\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/secondary-indices.html#unique\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Уникальный индекс&lt;/span&gt;&lt;/a&gt;Уникальный индекс&lt;/h3&gt;\n&lt;p&gt;Индекс вида &lt;code&gt;kind=unique&lt;/code&gt; поддерживает уникальность вторичного ключа в индексируемой таблице. Ключом в схеме индексной таблицы для вторичного индекса такого вида является вторичный ключ, а неключевыми значениями — первичный ключ. При попытке записи, которая привела бы к существованию в индексируемой таблице двух строк с одинаковыми значениями вторичного ключа, пользователю вернётся ошибка &lt;code&gt;UniqueIndexConflict&lt;/code&gt;. Параллельный коммит двух транзакций с записями строк с разными первичными ключами и одинаковыми вторичными приведет к падению одной из транзакций с ошибкой &lt;code&gt;TransactionLockConflict&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"sharding\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/secondary-indices.html#sharding\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шардирование вторичного индекса&lt;/span&gt;&lt;/a&gt;Шардирование вторичного индекса&lt;/h3&gt;\n&lt;p&gt;Для шардирования данных зачастую используются &lt;a href=\"user-guide/dynamic-tables/resharding#expression\"&gt;вычисляемые ключевые колонки&lt;/a&gt;, которые для индексной и индексируемой таблицы сделаны независимыми друг от друга — они могут иметь одинаковые или разные имена, типы и выражения, благодаря чему можно независимо контролировать шардирование. Однако обратите внимание, что, также как и в случае обычных таблиц, использование вычисляемой колонки в индексной таблице сделает неэффективными запросы с указанием диапазона по индексируемой колонке.&lt;/p&gt;\n&lt;h3 id=\"copy-move\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/secondary-indices.html#copy-move\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Копирование и перемещение&lt;/span&gt;&lt;/a&gt;Копирование и перемещение&lt;/h3&gt;\n&lt;p&gt;В текущей версии YTsaurus нельзя ни копировать ни перемещать ни индексную ни индексируемую таблицы, сохраняя вторичный индекс между ними - при попытке вернётся ошибка. Правильный порядок действий в этом случае таков - отмонтировать таблицы, удалить вторичные индексы, проделать необходимые операции в Кипарисе, пересоздать вторичные индексы с теми же атрибутами, примонтировать таблицы. Альернативно, можно указать параметр &lt;code&gt;allow_secondary_index_abandonment=%true&lt;/code&gt; для ваших операций - в таком случае все затронутые вторичные индексы будут удалены автоматически.&lt;/p&gt;\n&lt;h2 id=\"limitations\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/secondary-indices.html#limitations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения&lt;/span&gt;&lt;/a&gt;Ограничения&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Поскольку select-запрос с использованием индекса выполняет соединение таблиц, чтение должно производиться под транзакцией для получения глобально консистентного среза (по умолчанию select-запросы выполняются с SyncLastCommittedTimestamp, в этом режиме система в общем случае не может гарантировать консистентность между двумя структурами данных).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Запрещена индексация по агрегирущим колонкам, а также запрещена запись в индексируемую таблицу с блокировкой &lt;code&gt;shared write&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Запись в индексируемую таблицу &lt;a href=\"user-guide/dynamic-tables/bulk-insert\"&gt;map-reduce операцией&lt;/a&gt; не отображается в индексной.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Изменение схемы таблицы со вторичным индексом также имеет особенности. При добавлении ключевой колонки, её нужно сначала добавить в индексные таблицы, а только потом в индексируемую. При добавлении неключевой колонки — наоборот (или её можно не добавлять в индексные таблицы).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Все колонки вторичного ключа, а также колонки, используемые в предикате, должны иметь одинаковую &lt;code&gt;lock&lt;/code&gt; &lt;a href=\"user-guide/dynamic-tables/transactions#conflicts\"&gt;группу&lt;/a&gt; в индексируемой таблице.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"ogranicheniya,-nakladyvaemye-na-replicirovannye-tablicy\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/secondary-indices.html#ogranicheniya,-nakladyvaemye-na-replicirovannye-tablicy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения, накладываемые на реплицированные таблицы&lt;/span&gt;&lt;/a&gt;Ограничения, накладываемые на реплицированные таблицы&lt;/h3&gt;\n&lt;p&gt;Консистентные чтения из реплицированных таблиц при использовании вторичных индексов возможны только если индексная и индексируемая таблицы имеют пересекающийся набор кластеров с синхронными репликами. Поэтому перед созданием вторичного индекса необходимо убедиться, что индексируемая и все индексные таблицы объединены в одну &lt;a href=\"user-guide/dynamic-tables/replicated-dynamic-tables#replication_collocation\"&gt;коллокацию&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"performance\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/secondary-indices.html#performance\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Производительность&lt;/span&gt;&lt;/a&gt;Производительность&lt;/h2&gt;\n&lt;p&gt;Недостаток использования вторичных индексов — замедление записи в индексируемую таблицу. Запись в индексируемую таблицу повлечёт также прозрачное для пользователя чтение из неё и запись во все индексные таблицы, а в случае уникальных индексов — также чтение из индексной таблицы. Эти чтения выполняются в конце транзакции, как следствие — латентность записи увеличивается на латентность чтения.&lt;/p&gt;\n&lt;h2 id=\"building\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/secondary-indices.html#building\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Построение индекса&lt;/span&gt;&lt;/a&gt;Построение индекса&lt;/h2&gt;\n&lt;p&gt;Для корректного создания вторичного индекса поверх существующих данных существует &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/yt/scripts/dynamic_tables/build_secondary_index\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;скрипт&lt;/a&gt;. Он позволит построить вторичный индекс с минимальным для индексируемой таблицы даунтаймом, необходимым на взятие снапшота индексируемой таблицы и её перемонтирования (если только не строится уникальный индекс — для поддержания строгой уникальности необходимо, чтобы в таблицу не происходило записей на протяжении всего построения). После того как скрипт возьмет нужный лок, он самостоятельно примонтирует индексируемую таблицу и её можно будет использовать для чтения и записи. После успешного завершения работы скрипта можно будет использовать индексную таблицу для запросов. Пользователь должен сам проследить за тем, чтобы не задавать запросов с использованием индекса, пока он полностью не построен.&lt;/p&gt;\n&lt;p&gt;Скрипт поддерживает реплицированные таблицы, но в этом случае даунтайм еще немного увеличивается — необходимо также подождать, пока реплики не синхронизируются. Его использование предполагает, что индексируемая и индексная таблицы уже существуют.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;После построения вторичного индекса этим скриптом в индексной таблице могут оказаться лишние строки, не соответствующие никакой записи в индексируемой таблице (&lt;code&gt;table_to_index_correspondence=injective&lt;/code&gt;). Это может произойти из-за фонового процесса компактификации и не влияет на корректность при использовании вторичного индекса в select-запросах, так как при соединении таблиц эти строки все равно будут опущены. Построение строго биективного (&lt;code&gt;table_to_index_correspondence=bijective&lt;/code&gt;) индекса возможно только с полным даунтаймом обеих таблиц, для такого режима построения в скрипте есть флаг.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/dynamic-tables/secondary-indices.md","sourcePath":"ru/user-guide/dynamic-tables/secondary-indices.md"},"headings":[{"title":"Использование","href":"ru/user-guide/dynamic-tables/secondary-indices.html#usage","level":2,"items":[{"title":"Частичная индексация","href":"ru/user-guide/dynamic-tables/secondary-indices.html#predicate","level":3},{"title":"Индекс над списком","href":"ru/user-guide/dynamic-tables/secondary-indices.html#unfolding","level":3},{"title":"Уникальный индекс","href":"ru/user-guide/dynamic-tables/secondary-indices.html#unique","level":3},{"title":"Шардирование вторичного индекса","href":"ru/user-guide/dynamic-tables/secondary-indices.html#sharding","level":3},{"title":"Копирование и перемещение","href":"ru/user-guide/dynamic-tables/secondary-indices.html#copy-move","level":3}]},{"title":"Ограничения","href":"ru/user-guide/dynamic-tables/secondary-indices.html#limitations","level":2,"items":[{"title":"Ограничения, накладываемые на реплицированные таблицы","href":"ru/user-guide/dynamic-tables/secondary-indices.html#ogranicheniya,-nakladyvaemye-na-replicirovannye-tablicy","level":3}]},{"title":"Производительность","href":"ru/user-guide/dynamic-tables/secondary-indices.html#performance","level":2},{"title":"Построение индекса","href":"ru/user-guide/dynamic-tables/secondary-indices.html#building","level":2}],"title":"Вторичные индексы"},"router":{"pathname":"ru/user-guide/dynamic-tables/secondary-indices","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
