            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе описано устройство сортированных динамических таблиц и действия, которые можно выполнять с данным видом таблиц.&lt;/p&gt;\n&lt;h2 id=\"model\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#model\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модель данных&lt;/span&gt;&lt;/a&gt;Модель данных&lt;/h2&gt;\n&lt;p&gt;Каждая сортированная динамическая таблица — набор строк, упорядоченных по ключу. Как и в случае статических таблиц, ключ может быть композитным, то есть состоящим из нескольких колонок. В отличие от статических таблиц, ключ в динамической сортированной таблице уникален.&lt;/p&gt;\n&lt;p&gt;Динамические сортированные таблицы должны быть строго схематизированы, то есть все имена колонок и их типы должны быть заранее указаны в схеме.&lt;/p&gt;\n&lt;h2 id=\"methods\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#methods\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поддерживаемые операции&lt;/span&gt;&lt;/a&gt;Поддерживаемые операции&lt;/h2&gt;\n&lt;h3 id=\"sozdanie\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#sozdanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создание&lt;/span&gt;&lt;/a&gt;Создание&lt;/h3&gt;\n&lt;p&gt;Для создания динамической сортированной таблицы необходимо выполнить команду &lt;code&gt;create table&lt;/code&gt;, указав в атрибутах схему и настройку &lt;code&gt;dynamic=True&lt;/code&gt;. Схема должна соответствовать схеме сортированной таблицы.&lt;/p&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt create table //path/to/table --attributes \\\n&lt;span class=\"hljs-string\"&gt;'{dynamic=%true;schema=[{name=key;type=string;sort_order=ascending}; {name=value;type=string}]}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"24\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-24\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-24\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-24.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Важно указать в схеме таблицы хотя бы одну ключевую колонку. Если этого не сделать, таблица будет успешно создана, но окажется не сортированной, а &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables.html\"&gt;упорядоченной&lt;/a&gt;. При этом для таблицы будет работать большинство типов select-запросов. Но все такие запросы будут сводиться к full scan данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"izmenenie-shemy-i-tipa-tablicy\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#izmenenie-shemy-i-tipa-tablicy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Изменение схемы и типа таблицы&lt;/span&gt;&lt;/a&gt;Изменение схемы и типа таблицы&lt;/h3&gt;\n&lt;p&gt;Поменять схему уже существующей динамической таблицы можно с помощью команды &lt;code&gt;alter-table&lt;/code&gt;. Для успешного выполнения команды таблица должна быть &lt;a href=\"user-guide/dynamic-tables/overview.html#mount_table\"&gt;отмонтирована&lt;/a&gt;, а новая схема — совместима со старой. При этом никаких изменений в записанных на диск данных не происходит, поскольку старые данные удовлетворяют новой схеме.&lt;/p&gt;\n&lt;p&gt;С помощью &lt;code&gt;alter-table&lt;/code&gt; можно из статической таблицы сделать динамическую. Подробнее можно прочитать в разделе &lt;a href=\"user-guide/dynamic-tables/mapreduce.html#convert_table\"&gt;MapReduce по динамическим таблицам&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"chtenie-stroki\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#chtenie-stroki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чтение строки&lt;/span&gt;&lt;/a&gt;Чтение строки&lt;/h3&gt;\n&lt;p&gt;Клиент может выполнять чтение строк по заданному ключу методом &lt;code&gt;lookup&lt;/code&gt;. Для этого необходимо указать имя таблицы, временную метку, определяющую срез читаемых данных (&lt;code&gt;&amp;lt;= t&lt;/code&gt;), а также имена интересующих колонок. Данный запрос является точечным, то есть требует указания всех компонент ключа. Существует разновидность вызовов API, позволяющих читать несколько строк по разным ключам за один запрос.&lt;/p&gt;\n&lt;p&gt;При чтении в пределах атомарной транзакции будет использоваться временная метка старта транзакции. Можно также указать конкретное числовое значение (например, приближенно отвечающее физическому моменту времени), а также одно из двух специальных значений:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;sync_last_committed&lt;/code&gt; — следует прочитать самую свежую версию, гарантированно содержащую все изменения, выполненные в уже закоммиченных транзакциях;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;async_last_committed&lt;/code&gt; — следует прочитать по возможности последнюю версию, но разрешается вернуть данные с небольшим (неспецифицированным, типично в пределах десятков миллисекунд) отставанием.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Метка &lt;code&gt;async_last_committed&lt;/code&gt; может быть использована в тех случаях, когда консистентность чтения не требуется. Данный режим может работать быстрее при наличии конкуренции между чтениями и двухфазными коммитами. При двухфазном коммите строки таблицы блокируются специальным образом до тех пор, пока для транзакции не началась вторая стадия и выбрана метка коммита. Читатели, желающие получить самые последние данные, вынуждены ждать окончания первой фазы, так как до этого неизвестно, будет ли транзакция успешной.&lt;/p&gt;\n&lt;p&gt;Обе метки &lt;code&gt;sync_last_committed&lt;/code&gt;, &lt;code&gt;async_last_committed&lt;/code&gt; не гарантируют глобального консистентного среза. Данные, которые увидит читающий запрос, могут отвечать разным моментам времени как на уровне целых строк, так и на уровне отдельных колонок строк. Для консистентного чтения по всей таблице или для набора таблиц необходимо указывать конкретную временную метку.&lt;/p&gt;\n&lt;p&gt;Для таблицы с неатомарными изменениями режимы &lt;code&gt;sync_last_committed&lt;/code&gt; и &lt;code&gt;async_last_committed&lt;/code&gt; эквивалентны, так как двухфазного коммита не происходит.&lt;/p&gt;\n&lt;h3 id=\"vypolnenie-zaprosa\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#vypolnenie-zaprosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выполнение запроса&lt;/span&gt;&lt;/a&gt;Выполнение запроса&lt;/h3&gt;\n&lt;p&gt;Система понимает &lt;a href=\"user-guide/dynamic-tables/dyn-query-language.html\"&gt;SQL-подобный диалект&lt;/a&gt;, с помощью которого можно производить выборки и агрегацию по объемам данных в миллионы строк в режиме реального времени. Как и для операции чтения строк по ключу в запросе можно указать временную метку, относительно которой запрос следует выполнить.&lt;/p&gt;\n&lt;p&gt;Поскольку данные в системе фактически являются сортированными по набору ключевых колонок, при исполнении система использует данное свойство для сокращения объема прочитанного. В частности, пользовательский запрос анализируется и из него выводятся &lt;code&gt;key ranges&lt;/code&gt; — диапазоны в пространстве ключей, объединение которых покрывает всю область поиска. Это позволяет выполнять эффективный &lt;code&gt;range scan&lt;/code&gt; одним select-запросом. Подробнее можно прочитать в разделе &lt;a href=\"user-guide/dynamic-tables/dyn-query-language.html\"&gt;Язык запросов&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;При построении запроса, следует помнить, что если система не сможет вывести нетривиальные &lt;code&gt;key ranges&lt;/code&gt;, то произойдет &lt;code&gt;full scan&lt;/code&gt; данных. &lt;code&gt;Full scan&lt;/code&gt; случится, например, если в качестве ключевых колонок указать &lt;code&gt;key1, key2&lt;/code&gt;, а в запросе задать фильтрацию лишь по &lt;code&gt;key2&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"insert_rows\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#insert_rows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запись строки&lt;/span&gt;&lt;/a&gt;Запись строки&lt;/h3&gt;\n&lt;p&gt;Клиент может выполнить запись данных методом &lt;code&gt;insert_rows&lt;/code&gt; в пределах активной транзакции. Для этого он должен сообщить записываемые строки. В каждой такой строке должны присутствовать все ключевые поля. Часть полей данных из указанных в схеме может отсутствовать.&lt;/p&gt;\n&lt;p&gt;Семантически если строки с указанным ключом в таблице нет, то она появляется. Если же строка с таким ключом уже есть, то происходит перезапись части колонок.&lt;/p&gt;\n&lt;p&gt;При указании части полей существует 2 режима:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;overwrite&lt;/code&gt; (по умолчанию) — все неуказанные поля обновляют свои значения на &lt;code&gt;null&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;update&lt;/code&gt; — включается опцией &lt;code&gt;update == true&lt;/code&gt;. В таком случае сохранится предыдущее значение. В этом режиме необходимо передать все колонки, помеченные атрибутом &lt;code&gt;required&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При чтении и выполнении SQL запроса видны данные только на момент начала транзакции. Изменения, записанные в пределах той же транзакции, для чтения недоступны.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"udalenie-stroki\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#udalenie-stroki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Удаление строки&lt;/span&gt;&lt;/a&gt;Удаление строки&lt;/h3&gt;\n&lt;p&gt;В пределах транзакции клиент может удалить строку или набор строк, сообщив соответствующие ключи.&lt;/p&gt;\n&lt;p&gt;Семантически если строка с указанным ключом присутствовала в таблице, то она будет удалена. Если же строки не было, то никаких изменений не наступит.&lt;/p&gt;\n&lt;p&gt;Как и в большинстве MVCC-систем, удаление в системе YTsaurus сводится к записи строки без данных, но со специальным маркером &lt;code&gt;tombstone&lt;/code&gt;, сигнализирующим об удалении. Это означает, что освобождение дискового пространства от удалённых строк происходит не сразу, а отложенным образом. Также удаление строк не вызывает немедленного ускорения при чтении: напротив, поскольку при чтении происходит слияние данных, оно замедляется.&lt;/p&gt;\n&lt;h3 id=\"blokirovka-stroki\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#blokirovka-stroki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Блокировка строки&lt;/span&gt;&lt;/a&gt;Блокировка строки&lt;/h3&gt;\n&lt;p&gt;Клиент может заблокировать строки в пределах транзакции. Блокировка дает гарантию того, что строка в течение текущей транзакции не будет изменена в других транзакциях. Одну строку можно заблокировать сразу из нескольких транзакций. Можно указывать отдельные &lt;code&gt;lock&lt;/code&gt; группы колонок, которые будут заблокированы, а также режим блокировки &lt;code&gt;weak&lt;/code&gt; или &lt;code&gt;strong&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"remove_old_data\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#remove_old_data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Удаление старых данных (TTL)&lt;/span&gt;&lt;/a&gt;Удаление старых данных (TTL)&lt;/h3&gt;\n&lt;p&gt;В процессе слияния чанков таблета часть данных может быть признана устаревшей и удалена.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Удаление строк в транзакции фактически лишь записывает специальный маркер, но не освобождает память.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Значения атрибутов &lt;code&gt;min_data_versions&lt;/code&gt;, &lt;code&gt;max_data_versions&lt;/code&gt;, &lt;code&gt;min_data_ttl&lt;/code&gt;, &lt;code&gt;max_data_ttl&lt;/code&gt; показывают, можно ли удалить данные. Значение может быть удалено, если одновременно выполнено два условия:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;нет ни одного запрета удалять данное значение;&lt;/li&gt;\n&lt;li&gt;есть хотя бы одно разрешение удалить данное значение.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Чтобы понять, для каких значений существуют разрешения и запреты и какие типы они имеют, можно мысленно отсортировать все значения в данной строке и данной колонке таблицы: (&lt;code&gt;t1, v1&lt;/code&gt;), (&lt;code&gt;t2, v2&lt;/code&gt;), ..., (&lt;code&gt;tn, vn&lt;/code&gt;), где &lt;code&gt;ti&lt;/code&gt; — временные метки, а &lt;code&gt;vi&lt;/code&gt; — сами значения. Временные метки считаются упорядоченными по убыванию. Кроме того, команда удаления строки таблицы порождает специальное значение для всех её колонок: семантически оно не равно &lt;code&gt;null&lt;/code&gt;, так как после записи &lt;code&gt;null&lt;/code&gt; в строки их невозможно удалить. Тогда правила удаления таковы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;первые &lt;code&gt;min_data_versions&lt;/code&gt; значений нельзя удалять по соображениям числа версий;&lt;/li&gt;\n&lt;li&gt;значения, записанные менее чем &lt;code&gt;min_data_ttl&lt;/code&gt; до текущего момента нельзя удалять по соображениям времени;&lt;/li&gt;\n&lt;li&gt;значения, следующие за первыми &lt;code&gt;max_data_versions&lt;/code&gt;, можно удалять по соображениям числа версий;&lt;/li&gt;\n&lt;li&gt;значения, записанные более давно чем &lt;code&gt;max_data_ttl&lt;/code&gt; от текущего момента, можно удалять по соображениям времени.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Настройки по умолчанию:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;min_data_versions = 1;&lt;/li&gt;\n&lt;li&gt;max_data_versions = 1;&lt;/li&gt;\n&lt;li&gt;min_data_ttl = 1800000 (30 min);&lt;/li&gt;\n&lt;li&gt;max_data_ttl = 1800000 (30 min).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Исходя из настроек по умолчанию, хотя бы одно (последнее) значение будет сохраняться всегда, как и все значения, записанные за последние 30 минут. При этом ограничивается время, на протяжении которого транзакция может оставаться консистентной (система не допускает длинные транзакции).&lt;/p&gt;\n&lt;p&gt;Используя перечисленные параметры, можно строить гибкие политики хранения. Например, &lt;code&gt;min_data_versions = 0&lt;/code&gt;, &lt;code&gt;max_data_versions = 1&lt;/code&gt;, &lt;code&gt;min_data_ttl = 0&lt;/code&gt;, &lt;code&gt;max_data_ttl = 86400000 (1 day)&lt;/code&gt; разрешают удалять любые данные старше одного дня, сохраняя за последний день только одну версию.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Указанные параметры дают системе возможность удалять данные, но не принуждают ее к этому. Операция слияния чанков и удаления данных является фоновой.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Если необходимо принудительно очистить данные, воспользуйтесь атрибутом &lt;code&gt;forced_compaction_revision&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //table/@forced_compaction_revision 1; yt remount-table //table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"238\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-238\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-238\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-238.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Приведённый набор команд запускает компактификацию всех данных, записанных до текущего момента. Таким образом, будут удалены как лишние версии-дубликаты, так и логически удаленные данные. Данная операция создает моментальную нагрузку на кластер, которая зависит от объема многоверсионных данных, поэтому данная операция считается административным вмешательством.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Установка &lt;code&gt;forced_compaction_revision&lt;/code&gt; вызывает сильную нагрузку на кластер. Не рекомендуется использовать данный атрибут без особой необходимости и понимания последствий.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ещё один популярный сценарий возникает, когда в таблицу добавляются свежие записи по (в среднем) возрастающим ключам, а старые данные при этом удаляются также по (в среднем) возрастающим ключам. В конце таблицы возникают партиции c данными, которые логически удалены, т. е. для них присутствуют tombstones. Данные партиции не будут сжиматься, пока количество чанков в них мало. Размер таблицы, хранимый на диске, постоянно растёт, хотя количество неудалённых данных в ней останется на постоянном уровне. Возможное решение — указать параметр &lt;code&gt;auto_compaction_period&lt;/code&gt;, задающий периодичность, с которой партиции будут форсированно компактифицироваться.&lt;/p&gt;\n&lt;h4 id=\"postrochnyj-ttl\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#postrochnyj-ttl\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Построчный TTL&lt;/span&gt;&lt;/a&gt;Построчный TTL&lt;/h4&gt;\n&lt;p&gt;Основным сценарием, при котором возникает необходимость в использовании построчного TTL, является необходимость хранить строки одной таблицы разное количество времени в зависимости от данных в них. Задача определения длительности хранения каждой строки лежит на пользователе.&lt;/p&gt;\n&lt;p&gt;Для включения построчных TTL необходимо добавить в таблицу optional-колонку &lt;code&gt;uint64&lt;/code&gt; с именем &lt;code&gt;$ttl&lt;/code&gt;. Данная колонка является системной, именно поэтому имеет такое название. Однако задача поддержания валидных и актуальных значений в этой колонке лежит на пользователе.&lt;/p&gt;\n&lt;p&gt;При записи в таблицу необходимо указывать значение в миллисекундах, в течение которого строка не должна удаляться. Требования к значениям, записываемым в колонку &lt;code&gt;$ttl&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;min_data_ttl &amp;lt;= ttl&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Особенности взаимодействия атрибутов &lt;code&gt;min_data_versions&lt;/code&gt;, &lt;code&gt;max_data_versions&lt;/code&gt;, &lt;code&gt;min_data_ttl&lt;/code&gt;, &lt;code&gt;max_data_ttl&lt;/code&gt; и колонки &lt;code&gt;$ttl&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Если &lt;code&gt;min_data_versions &amp;gt; 0&lt;/code&gt;, то строки по значениям в колонке &lt;code&gt;$ttl&lt;/code&gt; удаляться не будут.&lt;/li&gt;\n&lt;li&gt;Для строк с непустым значением в колонке &lt;code&gt;$ttl&lt;/code&gt; удаление по истечению &lt;code&gt;max_data_ttl&lt;/code&gt; не производится.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;При удалении данных в качестве значения &lt;code&gt;$ttl&lt;/code&gt; для данного ключа по возможности берется последнее значение, записанное в эту колонку. Исключением являются случаи, когда не все данные находятся в чанках, подвергающихся слиянию. Правила удаления аналогичны правилам удаления, перечисленным в предыдущем разделе, за исключением того, что к ним добавляется еще одно:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;значения, записанные менее чем TTL до текущего момента, нельзя удалять по соображениям времени.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Сценарии работы с построчным TTL:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Для корректного удаления выставленного значения в колонке &lt;code&gt;$ttl&lt;/code&gt; необходимо удалить всю строку по данному ключу и вставить заново без указания значения в колонке &lt;code&gt;$ttl&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Значение в колонке &lt;code&gt;$ttl&lt;/code&gt; должно указываться при каждой вставке по заданному ключу, причем всегда одинаковое, за исключением сценариев ниже. В остальных случаях корректное поведение не гарантируется.&lt;/li&gt;\n&lt;li&gt;Для продления времени жизни данных по заданному ключу требуется записать в таблицу всю строку с новым значением в колонке &lt;code&gt;$ttl&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Для уменьшения времени жизни данных по заданному ключу требуется удалить данные по этому ключу и вставить заново, указав новое значение в колонке &lt;code&gt;$ttl&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Проставление TTL по ранее записанным ключам возможно только через удаление строки и вставку с новым значением в колонке &lt;code&gt;$ttl&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"udalenie-strok-po-watermark\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#udalenie-strok-po-watermark\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Удаление строк по watermark&lt;/span&gt;&lt;/a&gt;Удаление строк по watermark&lt;/h4&gt;\n&lt;p&gt;Динамические таблицы поддерживают сценарий, при котором удаление строк происходит исходя из пользовательских временных меток. Пользователь может указать специальную колонку, в которой для каждой строки хранится её временная метка, и самостоятельно обновлять специальный атрибут таблицы, сдвигая текущую временную границу для данных, которые могут быть удалены во время компактификации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Удаление строк происходит лишь во время компактификации, поэтому включение опции не удалит старые строки моментально, и они будут видны при чтении.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для включения удаления по watermark, необходимо следующее:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Выставить на таблице &lt;code&gt;@mount_config/row_merger_type = \"watermark\"&lt;/code&gt; и перемонтировать таблицу.&lt;/li&gt;\n&lt;li&gt;Установить на таблице атрибут &lt;code&gt;@custom_runtime_data&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Атрибут &lt;code&gt;custom_runtime_data&lt;/code&gt; должен иметь вид:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{\n    \"watermark\" = {\n        \"column_name\" = \"&amp;lt;имя колонки&amp;gt;\";\n        \"watermark\" = &amp;lt;значение&amp;gt;;\n        \"comparison_type\" = \"less\";  # также доступны less_equal, greater, greater_equal\n    };\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"363\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-363\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-363\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-363.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В результате для строк, у которых значение указанной колонки меньше (меньше или равно, больше, больше или равно в зависимости от параметра &lt;code&gt;comparison_type&lt;/code&gt;), будут удалены все версии, такие что их временная метка меньше или равна наибольшей временной метки значения, которое удовлетворяет сравнению. В случае когда строка была вставлена один раз или указанная колонка является частью ключа, строка будет полностью удалена.&lt;/p&gt;\n&lt;p&gt;После включения данной опции &lt;code&gt;min_data_versions&lt;/code&gt; и &lt;code&gt;min_data_ttl&lt;/code&gt; продолжают учитываться, однако настройки &lt;code&gt;max_data_versions&lt;/code&gt; и &lt;code&gt;max_data_ttl&lt;/code&gt; начинают игнорироваться.&lt;/p&gt;\n&lt;h2 id=\"aggr_columns\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#aggr_columns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Агрегирующие колонки&lt;/span&gt;&lt;/a&gt;Агрегирующие колонки&lt;/h2&gt;\n&lt;p&gt;В случае, если сценарий работы с данными подразумевает постоянное прибавление дельт к значениям, уже записанным в таблице, стоит воспользоваться агрегирующими колонками. В схеме для колонки указывается атрибут &lt;code&gt;aggregate=sum&lt;/code&gt; или другая агрегирующая функция. Далее можно делать запись в такую колонку с семантикой прибавления к значению, уже записанному в таблице.&lt;/p&gt;\n&lt;p&gt;Чтения старого значения не происходит, в таблицу записывается только дельта. Реальное суммирование происходит при чтении. Значения в таблицах хранятся вместе с временной меткой. При чтении из агрегирующей колонки значения, соответствующие одному ключу и одной колонке, но с разными временными метками, суммируются. Для оптимизации, на стадии компактификации старые данные в агрегирующей колонке суммируются, и в таблице остаётся только одно значение, соответствующее их сумме.&lt;/p&gt;\n&lt;p&gt;Поддерживаются следующие агрегирующие функции: &lt;code&gt;sum&lt;/code&gt;, &lt;code&gt;min&lt;/code&gt;, &lt;code&gt;max&lt;/code&gt;, &lt;code&gt;first&lt;/code&gt; или &lt;code&gt;xdelta&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;По умолчанию происходит перезапись того, что находится в таблице. Чтобы записать дельту, в команде записи необходимо указать опцию &lt;code&gt;aggregate=true&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"lookup_cache\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#lookup_cache\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Построчный кеш&lt;/span&gt;&lt;/a&gt;Построчный кеш&lt;/h2&gt;\n&lt;p&gt;Для точечного чтения строк (чтения по полному ключу) из динамической таблицы есть вызов API lookup rows.&lt;/p&gt;\n&lt;p&gt;В базовом сценарии таблица хранится на диске (hdd, ssd, nvme). Единицей чтения данных с диска, а также единицей сжатия кодеком (lz, gzip, zstd) является блок. При чтении блоков с диска кеширование данных происходит на нескольких уровнях — на уровне операционной системы и на уровне процесса ноды YTsaurus. В процессе ноды YTsaurus блоки кешируются как в сжатом, так и разжатом виде.&lt;/p&gt;\n&lt;p&gt;Если в кешах не оказывается нужного блока, содержащего ключ, в общем случае происходит чтение блока с диска, передача по сети, разжатие и чтение блока в соответствии с форматом чанков таблицы (unversioned/versioned, scan/lookup). Всё это может занимать довольно большое время. Кроме этого, создается нагрузка на диск, сеть и CPU.&lt;/p&gt;\n&lt;p&gt;Как правило, при точечных чтениях читается достаточно малая доля данных из блока (меньше 1% процента). Из-за этого при отсутствии блоков, содержащих читаемые ключи, в кеше uncompressed блоков много работы будет сделано впустую.&lt;/p&gt;\n&lt;p&gt;Для критичного в latency сценария чтения данных по полным ключам из динамической таблицы был единственный вариант — положить данные полностью в память в разжатом виде (атрибут таблицы &lt;code&gt;@in_memory_mode=uncompressed&lt;/code&gt;). Минусом такого подхода является то, что для больших таблиц требуется много оперативной памяти.&lt;/p&gt;\n&lt;p&gt;Довольно частым является сценарий работы с таблицей, когда есть некоторый ограниченный объём часто читаемых данных. Другими словами, вероятность чтения по различным ключам в некоторый момент времени не одинакова. Если есть такой working set горячих данных, то можно воспользоваться lookup кешом.&lt;/p&gt;\n&lt;p&gt;Lookup cache представляет собой построчный LRU кеш данных — то есть кешируются отдельные строки таблицы. Для кеширования отдельных строк можно было бы пользоваться отдельным инструментом. Например, memcached: cначала делать запрос к memcached, а в случае отсутствия данных в кеше читать из YTsaurus и добавлять в кеш.&lt;/p&gt;\n&lt;p&gt;Проблема в том, что данные в таблице могут постоянно меняться: если в некоторый момент времени строка таблицы есть в кеше, в этот момент может происходить транзакция, которая изменит или удалит эту строку. Таким образом, для обеспечения консистентности и изоляции данных при чтении необходимо синхронизировать кеш с изменениями данных в таблице. Поэтому кеш встроен в YTsaurus.&lt;/p&gt;\n&lt;p&gt;Для использования кеша необходимы следующие действия:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Запросить квоту в категории памяти &lt;code&gt;lookup_rows_cache&lt;/code&gt; (аналогично квоте &lt;code&gt;tablet_static&lt;/code&gt; для in memory таблиц).&lt;/li&gt;\n&lt;li&gt;Выставить у таблиц атрибут &lt;code&gt;@lookup_cache_rows_ratio&lt;/code&gt;, указывающий, какую долю строк в каждом таблете нужно кешировать. Можно начинать выставлять с долей процента (0.0005) и увеличивать до нескольких процентов (0.03).&lt;/li&gt;\n&lt;li&gt;Выставить у таблицы атрибут &lt;code&gt;@enable_lookup_cache_by_default&lt;/code&gt; в значение &lt;code&gt;%true&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Сделать remount-table.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;После этого все lookup запросы к таблице будут обслуживаться с использованием кеша.&lt;/p&gt;\n&lt;p&gt;Если же для некоторых запросов нужно отключить использование кеша, это можно сделать, указав опцию &lt;code&gt;use_lookup_cache&lt;/code&gt; в самом запросе lookup rows. Это может быть полезно, когда есть фоновый процесс, который периодически меняет данные во всей таблице (делает lookup и последующий insert). Если же делать эти lookup с использование кеша, данные из него могут вымываться. С другой стороны, если таким периодическим процессом происходит update только небольшой части данных в таблице, использование кеша может быть полезно для всех lookup запросов, так как ускорит выполнение периодического процесса.&lt;/p&gt;\n&lt;p&gt;По умолчанию опция &lt;code&gt;use_lookup_cache&lt;/code&gt; имеет значение &lt;code&gt;null&lt;/code&gt;. Если &lt;code&gt;use_lookup_cache&lt;/code&gt; равен &lt;code&gt;null&lt;/code&gt;, кеш работает в зависимости от атрибута &lt;code&gt;@enable_lookup_cache_by_default&lt;/code&gt; на таблице (также должен быть сконфигурирован объём кеша). Если в &lt;code&gt;use_lookup_cache&lt;/code&gt; передаётся значение &lt;code&gt;true&lt;/code&gt; или &lt;code&gt;false&lt;/code&gt;, то использование кеша для lookup запроса определяется этой опцией.&lt;/p&gt;\n&lt;p&gt;Атрибут таблицы &lt;code&gt;@lookup_cache_rows_per_tablet&lt;/code&gt; устаревший, его не стоит использовать. Проблема с ним в том, что разные таблеты могут иметь разное количество данных. При фиксировании размера на таблет кеш может работать неэффективно. Кроме этого, при изменении настроек шардирования и росте таблицы фиксированный размер кеша часто перестаёт соответствовать оптимальному.&lt;/p&gt;\n&lt;p&gt;Если используются ханки, то может быть полезен режим, когда таблица находится в памяти &lt;code&gt;@in_memory_mode=uncompressed&lt;/code&gt;, а также включен lookup cache. В этом случае данные в памяти содержат ссылки на ханки. Как правило, объём данных в памяти не очень большой. Lookup cache позволит кешировать ханки и сокращать их чтение с диска, а также потребление сети.&lt;/p&gt;\n&lt;h3 id=\"metriki-dlya-diagnostiki-raboty-lookup-cache\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#metriki-dlya-diagnostiki-raboty-lookup-cache\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метрики для диагностики работы lookup cache.&lt;/span&gt;&lt;/a&gt;Метрики для диагностики работы lookup cache.&lt;/h3&gt;\n&lt;p&gt;При эффективной работе кеша должно снижаться чтение блоков с диска/из кеша блоков.&lt;/p&gt;\n&lt;p&gt;Общие метрики lookup:&lt;/p&gt;\n&lt;p&gt;Метрики чтения с диска и передачи по сети:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.lookup.chunk_reader_statistics.data_bytes_read_from_disk.rate&lt;/code&gt;&lt;br /&gt;\n-&lt;code&gt;yt.tablet_node.lookup.chunk_reader_statistics.data_bytes_read_from_cache.rate&lt;/code&gt;&lt;br /&gt;\n-&lt;code&gt;yt.tablet_node.lookup.chunk_reader_statistics.data_bytes_transmitted.rate&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В случае использования ханков ещё метрики:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.lookup.hunks.chunk_reader_statistics.data_bytes_read_from_disk.rate&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.lookup.hunks.chunk_reader_statistics.data_bytes_transmitted.rate&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Метрика времени ответов на запросы lookup rows на таблетной ноде:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.lookup.duration&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Метрики специфичные для lookup cache:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.lookup.cache_hits.rate&lt;/code&gt; - количество ключей в секунду, попадающих в кеш.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.lookup.cache_misses.rate&lt;/code&gt; - количество ключей в секунду, которых нет в кеше.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.lookup.cache_inserts.rate&lt;/code&gt; - количество ключей в секунду, добавляемых в кеш. Это значение может отличаться от cache_misses, если ключей нет вообще в таблице, либо закончилась память для кеша (категории памяти &lt;code&gt;lookup_rows_cache&lt;/code&gt;). Отсутствие запрашиваемых ключей в таблице можно определить по метрике yt.tablet_node.lookup.missing_row_count.rate. Чтение отсутствующих ключей всегда приводит к обращению к диску (если таблица не в памяти). Чтобы этого не происходило стоит включить key xor filter.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.lookup.cache_outdated.rate&lt;/code&gt; - количество ключей в секунду, которые есть в кеше, но они устарели из-за того, что их не удалось вовремя обновить, если закончилась память для кеша. При вревышении квоты на память (категория памяти lookup_rows_cache) возникает невозможность обновления уже существующей строчки в кеше. При этом старое значение остается в кеше, но уже не может быть прочитано.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В процессе работы с кешом происходит garbage collection. По этим метрикам можно отслеживать реальный объем используемой памяти.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.row_cache.slab_allocator.lookup.alive_items&lt;/code&gt; - количество текущих аллокаций.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.row_cache.slab_allocator.lookup.allocated_items.rate&lt;/code&gt; - количество аллокаций в секунду.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.row_cache.slab_allocator.lookup.freed_items.rate&lt;/code&gt; - количество деаллокаций в секунду.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt.tablet_node.row_cache.slab_allocator.lookup.arena_size&lt;/code&gt; - размеры арен (множества аллокаций одного размера) в байтах.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;У этих метрик тег rank, соответствующий размеру аллокации (в байтах): 16, 32, 48, 64, 96, 128, 192, 256, 384, 512, 768, 1022, 1536, 2048, 3072, 4096, 6144, 8192, 12288, 16384, 22576, 32768, large. Large соответствует размерам аллокации больше 32768 байт.&lt;/p&gt;\n&lt;h2 id=\"key_filter\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#key_filter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Фильтрация несуществующих ключей&lt;/span&gt;&lt;/a&gt;Фильтрация несуществующих ключей&lt;/h2&gt;\n&lt;p&gt;Зачастую паттерн нагрузки на таблицу таков, что чтение по несуществующим ключам является значительной долей запросов. Для того чтобы быстро понимать, что такого ключа в таблице нет, в динамических таблицах реализован механизм фильтрации ключей. Для этого используется &lt;a href=\"https://arxiv.org/abs/1912.08258\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;xor-фильтр&lt;/a&gt;, аналогичный по функциональности фильтру Блума.&lt;/p&gt;\n&lt;p&gt;Фильтр может быть полезен в двух сценариях:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;читаемого ключа нет в таблице.&lt;/li&gt;\n&lt;li&gt;читаемый ключ записывается редко, в этом случае мы читаем все чанки партиции, но в большинстве чанков ключа заведомо нет.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Фильтрация поддержана для lookup-запросов, а также для select-запросов, включающих условие на префикс ключа.&lt;/p&gt;\n&lt;h3 id=\"vklyuchenie-filtra\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#vklyuchenie-filtra\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Включение фильтра&lt;/span&gt;&lt;/a&gt;Включение фильтра&lt;/h3&gt;\n&lt;p&gt;Для включения фильтра необходимо:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Выделить память в бандле под key filter block cache (рекомендуемое значение 500 MB). Это можно сделать самостоятельно в меню Edit Bundle -&amp;gt; Resources, в бандлах не переведенных на новую ресурсную модель значение нужно установить через &lt;a href=\"admin-guide/cluster-operations#ytdyncfgen\"&gt;динамический конфиг нод&lt;/a&gt; в поле data_node/block_cache/xor_filter/capacity. Это может сделать администратор кластера.&lt;/li&gt;\n&lt;li&gt;Включить сохранение фильтров при записи. Для этого нужно установить на таблице атрибут &lt;code&gt;@chunk_writer/key_filter/enable = %true&lt;/code&gt;. Если атрибут &lt;code&gt;@chunk_writer&lt;/code&gt; на таблице отсутствует, нужно установить его в значение &lt;code&gt;{key_filter={enable=%true}}&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Если нужна фильтрация для select-запросов, нужно аналогично включить запись через атрибут &lt;code&gt;@chunk_writer/key_filter_prefix&lt;/code&gt; и указать в нем параметр prefix_lengths.&lt;/li&gt;\n&lt;li&gt;Выставить &lt;code&gt;@mount_config/enable_key_filter_for_lookup = %true&lt;/code&gt;. Эта опция включает использование фильтров как для lookup-запросов, так и для select-запросов.&lt;/li&gt;\n&lt;li&gt;Сделать remount-table на таблице.&lt;/li&gt;\n&lt;li&gt;Для добавления фильтра во все существующие чанки можно использовать &lt;a href=\"user-guide/dynamic-tables/compaction#forced_compaction\"&gt;forced compaction&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"parametry-filtra\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#parametry-filtra\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Параметры фильтра&lt;/span&gt;&lt;/a&gt;Параметры фильтра&lt;/h3&gt;\n&lt;p&gt;Параметры записи фильтра, указываются в &lt;code&gt;@chunk_writer/key_filter&lt;/code&gt; для lookup-запросов и в &lt;code&gt;@chunk_writer/key_filter_prefix&lt;/code&gt; для select-запросов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;enable - необходимо ли создавать фильтр для блоков чанка.&lt;/li&gt;\n&lt;li&gt;false_positive_rate - процент неверных ответов фильтра (фильтр не отфильтровал ключ, но его на самом деле нет) значение по умолчанию 1 / 256. Чем выше точность, тем больше места будет занимать фильтр.&lt;/li&gt;\n&lt;li&gt;bits_per_key - количество бит в фильтре на ключ.&lt;/li&gt;\n&lt;li&gt;prefix_lengths - список длин префиксов ключей, для которых необходимо создать фильтр. Параметр валиден только для &lt;code&gt;@chunk_writer/key_filter_prefix&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;false_positive_rate и bits_per_key не могут быть выставлены одновременно. При выставленном false_positive_rate bits_per_key будет выведен из него. Рекомендуется использовать именно false_positive_rate.&lt;/p&gt;\n&lt;h3 id=\"metriki-dlya-diagnostiki-raboty-filtra\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#metriki-dlya-diagnostiki-raboty-filtra\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метрики для диагностики работы фильтра&lt;/span&gt;&lt;/a&gt;Метрики для диагностики работы фильтра&lt;/h3&gt;\n&lt;p&gt;При эффективной работе фильтра должно снижаться чтение блоков с диска/из кеша блоков.&lt;/p&gt;\n&lt;p&gt;Для удобного мониторинга эффективности использования фильтра есть уже готовые дашборды Key Filter (потабличный) и Bundle UI Key Filter (побандловый, доступен в интерфейсе бандла).&lt;/p&gt;\n&lt;h4 id=\"obshie-metriki\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#obshie-metriki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общие метрики&lt;/span&gt;&lt;/a&gt;Общие метрики&lt;/h4&gt;\n&lt;p&gt;Для оценки целесообразности включения фильтра полезно оценить отношение суммарного числа чанков, в которых был произведен поиск ключа, к числу прочитанных ключей (рекомендуем рассмотреть включение фильтра при соотношениие больше 3):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;yt.tablet_node.lookup.unmerged_missing_row_count.rate / yt.tablet_node.lookup.row_count.rate&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"metriki-dlya-lookup\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#metriki-dlya-lookup\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метрики для lookup&lt;/span&gt;&lt;/a&gt;Метрики для lookup&lt;/h4&gt;\n&lt;p&gt;Метрики чтений с диска/из кеша:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;yt.tablet_node.lookup.chunk_reader_statistics.data_bytes_read_from_cache.rate - количество байт, прочитанных lookup-запросами из кеша блоков.&lt;/li&gt;\n&lt;li&gt;yt.tablet_node.lookup.chunk_reader_statistics.data_bytes_read_from_disk.rate - количество байт, прочитанных lookup-запросами с диска.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Метрики, специфичные для фильтра:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;yt.tablet_node.lookup.key_filter.input_key_count.rate - количество ключей, поступающих на вход фильтру.&lt;/li&gt;\n&lt;li&gt;yt.tablet_node.lookup.key_filter.filtered_out_key_count.rate - количество отфильтрованных фильтром ключей.&lt;/li&gt;\n&lt;li&gt;yt.tablet_node.lookup.key_filter.false_positive_key_count.rate - количество ключей, которых на самом деле не существовало, но фильтр их не отфильтровал.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"metriki-dlya-select\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#metriki-dlya-select\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метрики для select&lt;/span&gt;&lt;/a&gt;Метрики для select&lt;/h4&gt;\n&lt;p&gt;Метрики чтений с диска/из кеша:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;yt.tablet_node.select.chunk_reader_statistics.data_bytes_read_from_cache.rate - количество байт прочитанных select-запросами из кеша блоков.&lt;/li&gt;\n&lt;li&gt;yt.tablet_node.select.chunk_reader_statistics.data_bytes_read_from_disk.rate - количество байт прочитанных select-запросами с диска.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Метрики, специфичные для фильтра:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;yt.tablet_node.select.range_filter.input_range_count.rate - количество интервалов, поступающих на вход фильтру.&lt;/li&gt;\n&lt;li&gt;yt.tablet_node.select.range_filter.filtered_out_range_count.rate - количество отфильтрованных фильтром интервалов.&lt;/li&gt;\n&lt;li&gt;yt.tablet_node.select.range_filter.false_positive_range_count.rate - количество интервалов, которых на самом деле не существовало, но фильтр их не отфильтровал.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/dynamic-tables/sorted-dynamic-tables.md","sourcePath":"ru/user-guide/dynamic-tables/sorted-dynamic-tables.md"},"headings":[{"title":"Модель данных","href":"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#model","level":2},{"title":"Поддерживаемые операции","href":"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#methods","level":2,"items":[{"title":"Создание","href":"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#sozdanie","level":3},{"title":"Изменение схемы и типа таблицы","href":"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#izmenenie-shemy-i-tipa-tablicy","level":3},{"title":"Чтение строки","href":"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#chtenie-stroki","level":3},{"title":"Выполнение запроса","href":"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#vypolnenie-zaprosa","level":3},{"title":"Запись строки","href":"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#insert_rows","level":3},{"title":"Удаление строки","href":"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#udalenie-stroki","level":3},{"title":"Блокировка строки","href":"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#blokirovka-stroki","level":3},{"title":"Удаление старых данных (TTL)","href":"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#remove_old_data","level":3,"items":[{"title":"Построчный TTL","href":"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#postrochnyj-ttl","level":4},{"title":"Удаление строк по watermark","href":"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#udalenie-strok-po-watermark","level":4}]}]},{"title":"Агрегирующие колонки","href":"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#aggr_columns","level":2},{"title":"Построчный кеш","href":"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#lookup_cache","level":2,"items":[{"title":"Метрики для диагностики работы lookup cache.","href":"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#metriki-dlya-diagnostiki-raboty-lookup-cache","level":3}]},{"title":"Фильтрация несуществующих ключей","href":"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#key_filter","level":2,"items":[{"title":"Включение фильтра","href":"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#vklyuchenie-filtra","level":3},{"title":"Параметры фильтра","href":"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#parametry-filtra","level":3},{"title":"Метрики для диагностики работы фильтра","href":"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#metriki-dlya-diagnostiki-raboty-filtra","level":3,"items":[{"title":"Общие метрики","href":"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#obshie-metriki","level":4},{"title":"Метрики для lookup","href":"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#metriki-dlya-lookup","level":4},{"title":"Метрики для select","href":"ru/user-guide/dynamic-tables/sorted-dynamic-tables.html#metriki-dlya-select","level":4}]}]}],"title":"Сортированные динамические таблицы"},"router":{"pathname":"ru/user-guide/dynamic-tables/sorted-dynamic-tables","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
