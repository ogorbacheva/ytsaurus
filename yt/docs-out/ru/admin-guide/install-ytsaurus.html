        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"podnyatie-ytsaurus-v-k8s\"&gt;&lt;a href=\"ru/admin-guide/install-ytsaurus.html#podnyatie-ytsaurus-v-k8s\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поднятие YTsaurus в k8s&lt;/span&gt;&lt;/a&gt;Поднятие YTsaurus в k8s&lt;/h2&gt;\n&lt;p&gt;Развернуть кластер YTsaurus в &lt;a href=\"https://kubernetes.io/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Kubernetes&lt;/a&gt; можно с помощью &lt;a href=\"ru/admin-guide/install-ytsaurus.html#operator\"&gt;оператора&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Для успешного разворачивания YTsaurus в кластере Kubernetes, должно быть как минимум три ноды следующей конфигурации: от 4-х ядер CPU и от 8-ми GB RAM.&lt;/p&gt;\n&lt;p&gt;Перед тем как воспользоваться оператором, убедитесь, что у вас установлена и настроена утилита &lt;a href=\"https://kubernetes.io/ru/docs/tasks/tools/install-kubectl/#%D1%83%D1%81%D1%82%D0%B0%D0%BD%D0%BE%D0%B2%D0%BA%D0%B0-kubectl-%D0%B2-linux\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;kubectl&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"operator\"&gt;&lt;a href=\"ru/admin-guide/install-ytsaurus.html#operator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kubernetes оператор&lt;/span&gt;&lt;/a&gt;Kubernetes оператор&lt;/h2&gt;\n&lt;p&gt;Команда YTsaurus поддерживает и развивает собственный k8s-оператор. Код оператора доступен в &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;github&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Релизы оператора выкладываются в &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/pkgs/container/k8s-operator\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Github Packages&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Дополнительно выкладываются &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/pkgs/container/ytop-chart\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;helm-чарты&lt;/a&gt;, позволяющие установить все необходимые компоненты.&lt;/p&gt;\n&lt;h3 id=\"ustanovka-operatora\"&gt;&lt;a href=\"ru/admin-guide/install-ytsaurus.html#ustanovka-operatora\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка оператора&lt;/span&gt;&lt;/a&gt;Установка оператора&lt;/h3&gt;\n&lt;ol&gt;\n&lt;li&gt;Установите утилиту &lt;a href=\"https://helm.sh/docs/intro/install/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;helm&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Установите cert-manager: &lt;code&gt;kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.11.0/cert-manager.yaml&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Установите чарт &lt;code&gt;helm install ytsaurus oci://ghcr.io/ytsaurus/ytop-chart --version 0.20.0&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Проверьте результат:&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl get pod\nNAME                                                      READY   STATUS     RESTARTS   AGE\nytsaurus-ytop-chart-controller-manager-7478f9b6cb-qr8wd   2/2     Running   0           1m\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"49\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-49\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-49\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-49.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Про обновление оператора можно прочитать в разделе &lt;a href=\"admin-guide/update-ytsaurus.html#operator\"&gt;Обновление оператора&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"zapusk-klastera-ytsaurus\"&gt;&lt;a href=\"ru/admin-guide/install-ytsaurus.html#zapusk-klastera-ytsaurus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск кластера YTsaurus&lt;/span&gt;&lt;/a&gt;Запуск кластера YTsaurus&lt;/h2&gt;\n&lt;p&gt;Создайте пространство имён для запуска кластера:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl create namespace &amp;lt;namespace&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"59\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-59\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-59\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-59.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Создайте секрет, содержащий логин, пароль и токен администратора кластера:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl create secret generic ytadminsec --from-literal=login=admin --from-literal=password=&amp;lt;password&amp;gt; --from-literal=token=&amp;lt;password&amp;gt;  -n &amp;lt;namespace&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"63\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-63\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-63\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-63.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;a href=\"admin-guide/prepare-spec.html\"&gt;Подготовьте спецификацию&lt;/a&gt; &lt;code&gt;Ytsaurus&lt;/code&gt; ресурса и загрузите ее в k8s (&lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/blob/main/config/samples/cluster_v1_demo.yaml\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;пример спецификации&lt;/a&gt;):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl apply -f my_ytsaurus_spec.yaml -n &amp;lt;namespace&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"67\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-67\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-67\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-67.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Кластер перейдет в состояние &lt;code&gt;Initializing&lt;/code&gt;, и оператор будет пытаться поднять все необходимые компоненты.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl get ytsaurus -n &amp;lt;namespace&amp;gt;\nNAME         CLUSTERSTATE   UPDATESTATE   UPDATINGCOMPONENTS\nminisaurus   Initializing   None\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"71\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-71\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-71\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-71.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;За поднятием подов можно следить с помощью &lt;code&gt;kubectl get pod -n &amp;lt;namespace&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Пример того как выглядит успешное поднятие кластера&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Как выглядят поды в процессе инициализации кластера.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl get pod -n &amp;lt;namespace&amp;gt;\nNAME                                                    READY   STATUS     RESTARTS   AGE\nds-0                                                    0/1     Init:0/1   0          1s\nms-0                                                    0/1     Init:0/1   0          1s\nytsaurus-ytop-chart-controller-manager-fbbffc97-6stk8   2/2     Running    0          2m43s\n\n$ kubectl get pod -n &amp;lt;namespace&amp;gt;\nNAME                                                    READY   STATUS      RESTARTS   AGE\nds-0                                                    1/1     Running     0          28s\nms-0                                                    1/1     Running     0          28s\nyt-master-init-job-default-vtkzw                        0/1     Completed   1          25s\nytsaurus-ytop-chart-controller-manager-fbbffc97-6stk8   2/2     Running     0          3m10s\n\n$ kubectl get pod -n &amp;lt;namespace&amp;gt;\nNAME                                                    READY   STATUS              RESTARTS   AGE\nca-0                                                    0/1     PodInitializing     0          9s\ndnd-0                                                   1/1     Running             0          10s\nds-0                                                    1/1     Running             0          41s\nend-0                                                   0/1     Init:0/1            0          9s\nhp-0                                                    1/1     Running             0          10s\nhp-control-0                                            0/1     PodInitializing     0          9s\nms-0                                                    1/1     Running             0          41s\nrp-0                                                    0/1     PodInitializing     0          9s\nrp-heavy-0                                              0/1     PodInitializing     0          9s\nyt-master-init-job-default-vtkzw                        0/1     Completed           1          38s\nyt-ui-init-job-default-2rsfz                            0/1     ContainerCreating   0          8s\nytsaurus-ytop-chart-controller-manager-fbbffc97-6stk8   2/2     Running             0          3m23s\n\n$ kubectl get ytsaurus -n &amp;lt;namespace&amp;gt;\nNAME         CLUSTERSTATE   UPDATESTATE   UPDATINGCOMPONENTS\nminisaurus   Initializing        None\n\n$ kubectl get pod -n &amp;lt;namespace&amp;gt;\nNAME                                                    READY   STATUS      RESTARTS   AGE\nca-0                                                    1/1     Running     0          21s\ndnd-0                                                   1/1     Running     0          22s\nds-0                                                    1/1     Running     0          53s\nend-0                                                   1/1     Running     0          21s\nhp-0                                                    1/1     Running     0          22s\nhp-control-0                                            1/1     Running     0          21s\nms-0                                                    1/1     Running     0          53s\nrp-0                                                    1/1     Running     0          21s\nrp-heavy-0                                              1/1     Running     0          21s\nsch-0                                                   1/1     Running     0          7s\nyt-client-init-job-user-jtl8p                           0/1     Completed   0          11s\nyt-master-init-job-default-vtkzw                        0/1     Completed   1          50s\nyt-ui-init-job-default-2rsfz                            0/1     Completed   0          20s\nytsaurus-ui-deployment-7b5d4776df-w42mj                 1/1     Running     0          5s\nytsaurus-ytop-chart-controller-manager-fbbffc97-6stk8   2/2     Running     0          3m35s\n\n$ kubectl get ytsaurus -n &amp;lt;namespace&amp;gt;\nNAME         CLUSTERSTATE   UPDATESTATE   UPDATINGCOMPONENTS\nminisaurus   Running        None\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"83\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-83\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-83\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-83.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Необходимо дождаться, когда оператор поднимет кластер. В статусе ресурса &lt;code&gt;Ytsaurus&lt;/code&gt; должно быть состояние &lt;code&gt;Running&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl get ytsaurus -n &amp;lt;namespace&amp;gt;\nNAME         CLUSTERSTATE   UPDATESTATE   UPDATINGCOMPONENTS\nminisaurus   Running        None\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"89\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-89\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-89\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-89.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"diagnostika-problem-pri-inicializacii\"&gt;&lt;a href=\"ru/admin-guide/install-ytsaurus.html#diagnostika-problem-pri-inicializacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Диагностика проблем при инициализации&lt;/span&gt;&lt;/a&gt;Диагностика проблем при инициализации&lt;/h3&gt;\n&lt;p&gt;Если кластер завис в состоянии &lt;code&gt;Initializing&lt;/code&gt;, то хорошей отправной точкой для понимания происходящего могут служить сообщения вида &lt;code&gt;Ytsaurus sync status&lt;/code&gt; в логах оператора, где перечислены компоненты, которые еще не поднялись. Посмотреть логи можно с помощью &lt;code&gt;kubectl logs deployment.apps/ytsaurus-ytop-chart-controller-manager&lt;/code&gt;.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Пример логов оператора со статусом компонент&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;kubectl logs deployment.apps/ytsaurus-ytop-chart-controller-manager\n...\n2023-09-10T11:43:00.405Z        INFO    Ytsaurus &lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt; status    {&lt;span class=\"hljs-string\"&gt;\"controller\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"ytsaurus\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"controllerGroup\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"cluster.ytsaurus.tech\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"controllerKind\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"Ytsaurus\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"ytsaurus\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;:&lt;span class=\"hljs-string\"&gt;\"minisaurus\"&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;\"namespace\"&lt;/span&gt;:&lt;span class=\"hljs-string\"&gt;\"default\"&lt;/span&gt;}, &lt;span class=\"hljs-string\"&gt;\"namespace\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"default\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"minisaurus\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"reconcileID\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"a9fcb896-5976-4d60-b18b-730a2c969758\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"notReadyComponents\"&lt;/span&gt;: [&lt;span class=\"hljs-string\"&gt;\"Discovery\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"Master\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"YtsaurusClient\"&lt;/span&gt;, &lt;span cl /p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Пример Conditions в процессе инициализации кластера&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;В примере видно, что компонента &lt;code&gt;Scheduler&lt;/code&gt; не начинает подниматься, так как пока не поднялась компонента &lt;code&gt;ExecNode&lt;/code&gt; (&lt;code&gt;Message: Wait for ExecNode&lt;/code&gt;), а та в свою очередь ждет поднятия своих подов в statefulset (&lt;code&gt;Wait for pods&lt;/code&gt;).&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;Conditions:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:53:43Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;Ready&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;Ready&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;DiscoveryReady&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:54:27Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;yt-master-init-job-default&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;completed&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;Ready&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;MasterReady&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:53:33Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;Wait&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;for&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;HttpProxy&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;Blocked&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;YtsaurusClientReady&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:53:33Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;Wait&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;for&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;pods&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;Blocked&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;DataNodeReady&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:53:33Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;Wait&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;for&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;pods&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;Blocked&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;HttpProxyReady&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:53:33Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;Wait&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;for&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;pods&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;Blocked&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;HttpProxy-controlReady&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:53:33Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;Wait&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;for&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;yt-ui-init-job-default&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;completion&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;Blocked&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;UIReady&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:53:33Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;Wait&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;for&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;pods&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;Blocked&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;RpcProxyReady&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:53:33Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;Wait&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;for&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;pods&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;Blocked&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;RpcProxy-heavyReady&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:53:33Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;Wait&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;for&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;pods&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;Blocked&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;ExecNodeReady&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:53:33Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;Wait&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;for&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ExecNode&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;Blocked&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;SchedulerReady&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:53:33Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;Wait&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;for&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;pods&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;Blocked&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;ControllerAgentReady&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Last Transition Time:&lt;/span&gt;  &lt;span class=\"hljs-number\"&gt;2023-09-10T11:54:25Z&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Message:&lt;/span&gt;               &lt;span class=\"hljs-string\"&gt;Init&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;job&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;successfully&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;completed&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Reason:&lt;/span&gt;                &lt;span class=\"hljs-string\"&gt;InitJobCompleted&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Status:&lt;/span&gt;                &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;Type:&lt;/span&gt;                  &lt;span class=\"hljs-string\"&gt;defaultMasterInitJobCompleted&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;State:&lt;/span&gt;                   &lt;span class=\"hljs-string\"&gt;Initializing&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"115\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-115\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-115\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-115.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Одна из возможных причин зависания кластера в состоянии &lt;code&gt;Initializing&lt;/code&gt; может заключаться в том, что один из init job не завершился. Джоб мог как еще не успеть выполниться, так и пофейлиться. Необходимо изучить логи джоба с помощью &lt;code&gt;kubectl logs &amp;lt;init-job-pod-name&amp;gt; -n &amp;lt;namespace&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Другая возможная причина в том, что k8s не может запланировать поды кластера из-за нехватки k8s-нод, удовлетворяющих &lt;code&gt;resources.requests&lt;/code&gt; компоненты.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Пример неподнимающегося пода&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;В спецификации &lt;code&gt;Ytsaurus&lt;/code&gt; указана следующая группа &lt;code&gt;execNodes&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;  &lt;span class=\"hljs-attr\"&gt;execNodes:&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;loggers:&lt;/span&gt; &lt;span class=\"hljs-meta\"&gt;*loggers&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;resources:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;limits:&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;cpu:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;memory:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;2Gi&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;requests:&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;cpu:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;\n\n      &lt;span class=\"hljs-attr\"&gt;volumeMounts:&lt;/span&gt;\n        &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;node-data&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;mountPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/node-data&lt;/span&gt;\n\n      &lt;span class=\"hljs-attr\"&gt;volumes:&lt;/span&gt;\n        &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;node-data&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;emptyDir:&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;sizeLimit:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;5Gi&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"132\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-132\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-132\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-132.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если в k8s нет ноды, у которой имеется 10 CPU, то под зависнет в состоянии &lt;code&gt;Pending&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$  kubectl get pod -n &amp;lt;namespace&amp;gt;\nNAME                                                    READY   STATUS    RESTARTS   AGE\nca-0                                                    1/1     Running   0          14m\ndnd-0                                                   1/1     Running   0          14m\nds-0                                                    1/1     Running   0          15m\nend-0                                                   0/1     Pending   0          15m\nhp-0                                                    1/1     Running   0          14m\nhp-control-0                                            1/1     Running   0          14m\nms-0                                                    1/1     Running   0          15m\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"136\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-136\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-136\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-136.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;С помощью &lt;code&gt;kubectl describe&lt;/code&gt; пода можно узнать причину:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl describe pod end-0 -n &amp;lt;namespace&amp;gt;\n...\nEvents:\n  Type     Reason            Age    From               Message\n  ----     ------            ----   ----               -------\n  Warning  FailedScheduling  15m42s  default-scheduler  0/1 nodes are available: 1 Insufficient cpu. preemption: 0/1 nodes are available: 1 No preemption victims found &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; incoming pod..\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"140\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-140\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-140\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-140.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"ustanovka-veb-interfejsa-ytsaurus\"&gt;&lt;a href=\"ru/admin-guide/install-ytsaurus.html#ustanovka-veb-interfejsa-ytsaurus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка веб-интерфейса YTsaurus&lt;/span&gt;&lt;/a&gt;Установка веб-интерфейса YTsaurus&lt;/h2&gt;\n&lt;h3 id=\"ustanovka-helm-chart\"&gt;&lt;a href=\"ru/admin-guide/install-ytsaurus.html#ustanovka-helm-chart\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка helm chart&lt;/span&gt;&lt;/a&gt;Установка helm chart&lt;/h3&gt;\n&lt;p&gt;Выполните все необходимые действия для &lt;a href=\"ru/admin-guide/install-ytsaurus.html#starting-cluster\"&gt;запуска кластера YTsaurus&lt;/a&gt;. Затем установите чарт:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;git clone https://github.com/ytsaurus/ytsaurus-ui.git\nhelm upgrade --install ytsaurus-ui ytsaurus-ui/packages/ui-helm-chart/\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"152\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-152\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-152\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-152.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"rabota-s-polzovatelskim-klasterom\"&gt;&lt;a href=\"ru/admin-guide/install-ytsaurus.html#rabota-s-polzovatelskim-klasterom\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с пользовательским кластером&lt;/span&gt;&lt;/a&gt;Работа с пользовательским кластером&lt;/h3&gt;\n&lt;h4 id=\"predvaritelnye-trebovaniya\"&gt;&lt;a href=\"ru/admin-guide/install-ytsaurus.html#predvaritelnye-trebovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Предварительные требования&lt;/span&gt;&lt;/a&gt;Предварительные требования&lt;/h4&gt;\n&lt;p&gt;Ниже приведена инструкция по запуску веб-интерфейса YTsaurus с помощью helm-чарта. На данном этапе у вас должны быть:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;настроенная CLI-утилита &lt;code&gt;kubectl&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;запущенный кластер YTsaurus и адрес HTTP прокси (&lt;code&gt;http_proxy&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;специальный пользователь-робот для веб-интерфейса YTsaurus с выписанным для него токеном (см. раздел &lt;a href=\"user-guide/storage/auth.html#token-management\"&gt;Управление токенами&lt;/a&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"bystryj-start\"&gt;&lt;a href=\"ru/admin-guide/install-ytsaurus.html#bystryj-start\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Быстрый старт&lt;/span&gt;&lt;/a&gt;Быстрый старт&lt;/h4&gt;\n&lt;p&gt;По умолчанию чарт ожидает наличия секрета &lt;code&gt;yt-ui-secret&lt;/code&gt; с ключом &lt;code&gt;yt-interface-secret.json&lt;/code&gt;. Создать секрет можно с помощью следующих команд:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;read -sp \"TOKEN: \" TOKEN ; echo '{\"oauthToken\":\"'$TOKEN'\"}' &amp;gt; tmp.json\nkubectl create secret generic yt-ui-secret --from-literal=\"yt-interface-secret.json=$(cat tmp.json)\" &amp;amp;&amp;amp; rm tmp.json\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"185\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-185\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-185\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-185.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Также вам понадобится предоставить чарту описание кластера:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;read -p \"Cluster id: \" id_; read -p \"http_proxy hostname: \" proxy_; read -p \"Use https [true/false]: \" secure_; read -p \"NODE_TLS_REJECT_UNAUTHORIZED [1/0]: \" tlsrej_; (\ntee values.yaml &amp;lt;&amp;lt; _EOF\nui:\n  env:\n    - name: NODE_TLS_REJECT_UNAUTHORIZED\n      value: \"$tlsrej_\"\n    - name: ALLOW_PASSWORD_AUTH\n      value: \"1\"\n  clusterConfig:\n    clusters:\n      - authentication: basic\n        id: $id_\n        proxy: $proxy_\n        description: My first YTsaurus. Handle with care.\n        environment: testing\n        group: My YTsaurus clusters\n        name: my cluster\n        primaryMaster:\n          cellTag: 1\n        secure: $secure_\n        theme: lavander\n_EOF\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"189\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-189\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-189\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-189.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;После этого можно приступить к установке или обновлению чарта:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;git clone https://github.com/ytsaurus/ytsaurus-ui.git\nhelm upgrade --install yt-ui ytsaurus-ui/packages/ui-helm-chart/ -f values.yaml\n# or run specific version of UI (all versions: https://github.com/ytsaurus/ytsaurus-ui/pkgs/container/ui)\nhelm upgrade --install yt-ui ytsaurus-ui/packages/ui-helm-chart/ -f values.yaml --set ui.image.tag=1.60.1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"193\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-193\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-193\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-193.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Чтобы веб-интерфейс YTsaurus стал доступным в браузере, может потребоваться переадресация портов:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;kubectl port-forward deployment/yt-ui-ytsaurus-ui-chart 8080:80\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"197\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-197\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-197\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-197.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"ustanovka-cron\"&gt;&lt;a href=\"ru/admin-guide/install-ytsaurus.html#ustanovka-cron\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка Cron&lt;/span&gt;&lt;/a&gt;Установка Cron&lt;/h2&gt;\n&lt;h3 id=\"opisanie\"&gt;&lt;a href=\"ru/admin-guide/install-ytsaurus.html#opisanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Описание&lt;/span&gt;&lt;/a&gt;Описание&lt;/h3&gt;\n&lt;p&gt;Для YTsaurus есть набор cron-задач, которые полезны при эксплуатации кластера, таких как очистка временных директорий или удаление неактивных нод. Поддерживаются как встроенные, так и пользовательские задачи.&lt;/p&gt;\n&lt;p&gt;Список встроенных скриптов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;clear_tmp&lt;/code&gt; - скрипт, который очищает временные файлы на кластере. Код скрипта живет &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cron/clear_tmp\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;здесь&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;prune_offline_cluster_nodes&lt;/code&gt; - скрипт, который удаляет из Кипариса offline ноды. Код скрипта живет &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/yt/cron/prune_offline_cluster_nodes\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;здесь&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"predvaritelnye-trebovaniya1\"&gt;&lt;a href=\"ru/admin-guide/install-ytsaurus.html#predvaritelnye-trebovaniya1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Предварительные требования&lt;/span&gt;&lt;/a&gt;Предварительные требования&lt;/h3&gt;\n&lt;p&gt;На данном этапе у вас должны быть:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Helm 3.x&lt;/li&gt;\n&lt;li&gt;запущенный кластер YTsaurus и адрес HTTP прокси (&lt;code&gt;http_proxy&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;специальный пользователь-робот для Cron с выписанным для него токеном (см. раздел &lt;a href=\"user-guide/storage/auth.html#token-management\"&gt;Управление токенами&lt;/a&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"bazovaya-ustanovka\"&gt;&lt;a href=\"ru/admin-guide/install-ytsaurus.html#bazovaya-ustanovka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Базовая установка&lt;/span&gt;&lt;/a&gt;Базовая установка&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;helm install ytsaurus-cron oci://ghcr.io/ytsaurus/cron-chart \\\n  --version 0.0.2 \\\n  --&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; yt.proxy=&lt;span class=\"hljs-string\"&gt;\"http_proxy\"&lt;/span&gt; \\\n  --&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; yt.token=&lt;span class=\"hljs-string\"&gt;\"&amp;lt;ROBOT-CRON-TOKEN&amp;gt;\"&lt;/span&gt; \\\n  --&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; image.tag=&lt;span class=\"hljs-string\"&gt;\"0.0.2\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"248\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-248\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-248\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-248.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"konfiguraciya\"&gt;&lt;a href=\"ru/admin-guide/install-ytsaurus.html#konfiguraciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конфигурация&lt;/span&gt;&lt;/a&gt;Конфигурация&lt;/h3&gt;\n&lt;p&gt;Все параметры чарта можно задать через &lt;code&gt;values.yaml&lt;/code&gt; или с помощью &lt;code&gt;--set&lt;/code&gt; в командной строке.&lt;/p&gt;\n&lt;h3 id=\"autentifikaciya-v-ytsaurus\"&gt;&lt;a href=\"ru/admin-guide/install-ytsaurus.html#autentifikaciya-v-ytsaurus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аутентификация в YTsaurus&lt;/span&gt;&lt;/a&gt;Аутентификация в YTsaurus&lt;/h3&gt;\n&lt;p&gt;Укажите токен напрямую:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;yt:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;proxy:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;yt.company.com&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;token:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Qwerty123!&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"261\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-261\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-261\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-261.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Или настройте использование Kubernetes-секрета:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;unmanagedSecret:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;enabled:&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;secretKeyRef:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ytadminsec&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;key:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;token&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"265\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-265\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-265\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-265.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"vstroennye-zadachi\"&gt;&lt;a href=\"ru/admin-guide/install-ytsaurus.html#vstroennye-zadachi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Встроенные задачи ()&lt;/span&gt;&lt;/a&gt;Встроенные задачи (&lt;code&gt;jobs&lt;/code&gt;)&lt;/h3&gt;\n&lt;p&gt;Каждая задача задаётся структурой:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;name&lt;/code&gt;: Уникальное имя задачи&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;enabled&lt;/code&gt;: Включена ли задача&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;args&lt;/code&gt;: Аргументы командной строки&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;schedule&lt;/code&gt;: Расписание в формате cron&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;restartPolicy&lt;/code&gt;: Политика перезапуска (рекомендуется &lt;code&gt;Never&lt;/code&gt;)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример включения задачи:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;helm upgrade --install ytsaurus-cron oci://ghcr.io/ytsaurus/cron-chart \\\n  --version 0.0.2 \\\n  --&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;jobs&lt;/span&gt;[1].enabled=&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt; \\\n  --&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;jobs&lt;/span&gt;[1].args[5]=&lt;span class=\"hljs-string\"&gt;\"tmp_files\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"302\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-302\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-302\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-302.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Индексация массива &lt;code&gt;jobs&lt;/code&gt; идёт с нуля — следите за порядком задач.&lt;/p&gt;\n&lt;h3 id=\"polzovatelskie-zadachi\"&gt;&lt;a href=\"ru/admin-guide/install-ytsaurus.html#polzovatelskie-zadachi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пользовательские задачи&lt;/span&gt;&lt;/a&gt;Пользовательские задачи&lt;/h3&gt;\n&lt;p&gt;Можно определить собственные задачи:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;additionalJobs:&lt;/span&gt;\n  &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;my_cleanup&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;enabled:&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;args:&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;clear_tmp&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;--directory&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"//my/custom/path\"&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;schedule:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"0 */6 * * *\"&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;restartPolicy:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Never&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"312\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-312\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-312\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-312.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"primer\"&gt;&lt;a href=\"ru/admin-guide/install-ytsaurus.html#primer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример &lt;/span&gt;&lt;/a&gt;Пример &lt;code&gt;values.yaml&lt;/code&gt;&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;yt:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;proxy:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;yt.mycompany.com&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;token:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;my-secret-token&lt;/span&gt;\n\n&lt;span class=\"hljs-attr\"&gt;jobs:&lt;/span&gt;\n  &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;clear_tmp_files&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;enabled:&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;args:&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;clear_tmp&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;--directory&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"//tmp/yt_wrapper/file_storage\"&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;--account&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"tmp_files\"&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;schedule:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"*/30 * * * *\"&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;restartPolicy:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Never&lt;/span&gt;\n\n&lt;span class=\"hljs-attr\"&gt;unmanagedSecret:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;enabled:&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"316\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-316\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-316\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-316.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Запуск:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;helm upgrade --install ytsaurus-cron oci://ghcr.io/ytsaurus/cron-chart \\\n  --version 0.0.2 \\\n  -f my-values.yaml\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"320\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-320\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-320\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-320.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"chasto-ispolzuemye-parametry\"&gt;&lt;a href=\"ru/admin-guide/install-ytsaurus.html#chasto-ispolzuemye-parametry\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Часто используемые параметры&lt;/span&gt;&lt;/a&gt;Часто используемые параметры&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Параметр&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;yt.proxy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;HTTP-прокси для доступа к YTsaurus&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;yt.token&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Токен доступа (если &lt;code&gt;unmanagedSecret&lt;/code&gt; отключён)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;unmanagedSecret&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Использовать Kubernetes-секрет&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;image.repository&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Образ Docker&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;image.tag&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тег образа&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;schedule&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Расписание по умолчанию (если не указано в job)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;concurrencyPolicy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Allow&lt;/code&gt;, &lt;code&gt;Forbid&lt;/code&gt;, или &lt;code&gt;Replace&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;successfulJobsHistoryLimit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Сколько успешных задач хранить&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;failedJobsHistoryLimit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Сколько неудачных задач хранить&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n","meta":{"metadata":[{"name":"
