        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Пример минимальной спецификации можно найти &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/blob/main/config/samples/cluster_v1_demo.yaml\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;по ссылке&lt;/a&gt;.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Пример спецификации&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;apiVersion:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;cluster.ytsaurus.tech/v1&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;kind:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Ytsaurus&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ytdemo&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;coreImage:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ghcr.io/ytsaurus/ytsaurus:stable-24.1.0-relwithdebinfo&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;uiImage:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ghcr.io/ytsaurus/ui:stable&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;adminCredentials:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ytadminsec&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;discovery:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;primaryMasters:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;cellTag:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;volumeMounts:&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;master-data&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;mountPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/master-data&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;locations:&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;locationType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;MasterChangelogs&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/master-data/master-changelogs&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;locationType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;MasterSnapshots&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/master-data/master-snapshots&lt;/span&gt;\n\n    &lt;span class=\"hljs-attr\"&gt;volumeClaimTemplates:&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;master-data&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;accessModes:&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"ReadWriteOnce\"&lt;/span&gt; ]\n          &lt;span class=\"hljs-attr\"&gt;resources:&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;requests:&lt;/span&gt;\n              &lt;span class=\"hljs-attr\"&gt;storage:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;20Gi&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;httpProxies:&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;serviceType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;NodePort&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;rpcProxies:&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;serviceType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;LoadBalancer&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;dataNodes:&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;volumeMounts:&lt;/span&gt;\n        &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;node-data&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;mountPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/node-data&lt;/span&gt;\n\n      &lt;span class=\"hljs-attr\"&gt;locations:&lt;/span&gt;\n        &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;locationType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ChunkStore&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/node-data/chunk-store&lt;/span&gt;\n\n      &lt;span class=\"hljs-attr\"&gt;volumeClaimTemplates:&lt;/span&gt;\n        &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;node-data&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;accessModes:&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"ReadWriteOnce\"&lt;/span&gt; ]\n            &lt;span class=\"hljs-attr\"&gt;resources:&lt;/span&gt;\n              &lt;span class=\"hljs-attr\"&gt;requests:&lt;/span&gt;\n                &lt;span class=\"hljs-attr\"&gt;storage:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;50Gi&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;execNodes:&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;resources:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;limits:&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;cpu:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;memory:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;5Gi&lt;/span&gt;\n\n      &lt;span class=\"hljs-attr\"&gt;volumeMounts:&lt;/span&gt;\n        &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;node-data&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;mountPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/node-data&lt;/span&gt;\n\n      &lt;span class=\"hljs-attr\"&gt;volumes:&lt;/span&gt;\n        &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;node-data&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;emptyDir:&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;sizeLimit:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;40Gi&lt;/span&gt;\n\n      &lt;span class=\"hljs-attr\"&gt;locations:&lt;/span&gt;\n        &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;locationType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ChunkCache&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/node-data/chunk-cache&lt;/span&gt;\n        &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;locationType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Slots&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/node-data/slots&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;tabletNodes:&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;queryTrackers:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;yqlAgents:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;schedulers:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;controllerAgents:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;ui:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;serviceType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;NodePort&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"8\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-8\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-8\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-8.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;В таблице 1 приведены некоторые общие настройки &lt;code&gt;Ytsaurus&lt;/code&gt;. Полное описание: &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/blob/main/docs/api.md#ytsaurusspec\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtsaurusSpec&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Таблица 1 — Базовые поля спецификации &lt;code&gt;Ytsaurus&lt;/code&gt; &lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Поле&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;coreImage&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Образ для основных серверных компонент, например, &lt;code&gt;ghcr.io/ytsaurus/ytsaurus:stable-24.1.0-relwithdebinfo&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;uiImage&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Образ для UI, например, &lt;code&gt;ghcr.io/ytsaurus/ui:stable&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;imagePullSecrets&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;LocalObjectReference&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Секреты, необходимые для скачивания образов из private registry. Подробности можно узнать &lt;a href=\"https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;по ссылке&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;configOverrides&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;optional&amp;lt;LocalObjectReference&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Конфигмапа для переопределения генерируемых статических конфигов. Нужно использовать только в редких случаях.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;adminCredentials&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;optional&amp;lt;LocalObjectReference&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Секрет с логином/паролем для админского аккаунта.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;isManaged&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Флаг, позволяющий отключить все действия оператора над данным кластером, чтобы совершить с кластерам ручные действия при необходимости.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;enableFullUpdate&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Флаг, позволяющий запретить запуск полного обновления кластера.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;useIpv6&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Использовать IPv6 или IPv4&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;bootstrap&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;BootstrapSpec&lt;/td&gt;\n&lt;td&gt;Настройки для первичного поднятия кластера, например, параметры &lt;a href=\"user-guide/dynamic-tables/concepts#tablet_cell_bundles\"&gt;таблет-селл бандлов&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"vybor-nabora-komponent\"&gt;&lt;a href=\"ru/admin-guide/prepare-spec.html#vybor-nabora-komponent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выбор набора компонент&lt;/span&gt;&lt;/a&gt;Выбор набора компонент&lt;/h2&gt;\n&lt;p&gt;Кластер можно поднимать с различными наборами компонент. Рассмотрим кратко, какие компоненты можно настроить в спецификации &lt;code&gt;Ytsaurus&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Подробнее про компоненты можно прочитать &lt;a href=\"admin-guide/components.html\"&gt;в отдельном разделе&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Как минимум в кластере должны быть мастера и discovery-сервисы, они настраиваются в полях &lt;code&gt;primaryMasters&lt;/code&gt; и &lt;code&gt;discovery&lt;/code&gt; соответственно.&lt;/p&gt;\n&lt;p&gt;Для запуска операций необходимы планировщики и контроллер-агенты, которые настраиваются соответственно в полях &lt;code&gt;schedulers&lt;/code&gt; и &lt;code&gt;controllerAgents&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Для выполнения запросов к кластеру из &lt;code&gt;cli&lt;/code&gt; и различных &lt;code&gt;SDK&lt;/code&gt; необходимы прокси. Прокси бывают двух типов: &lt;code&gt;HTTP&lt;/code&gt; и &lt;code&gt;RPC&lt;/code&gt;. Прокси настраиваются соответственно в полях &lt;code&gt;httpProxies&lt;/code&gt; и &lt;code&gt;rpcProxies&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Для того чтобы иметь удобный UI для работы с кластером, необходимо настроить его в поле &lt;code&gt;ui&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Для хранения данных используются &lt;code&gt;dataNodes&lt;/code&gt;, а для запуска джобов операций — &lt;code&gt;execNodes&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Если планируется задавать запросы к данным с помощью SQL-like &lt;a href=\"yql\"&gt;языка запросов&lt;/a&gt;, необходимо добавить в спецификацию &lt;code&gt;queryTrackers&lt;/code&gt; и &lt;code&gt;yqlAgents&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Для использования &lt;a href=\"user-guide/data-processing/chyt/about-chyt\"&gt;CHYT&lt;/a&gt; необходимо запустить специальный контроллер. Контроллер конфигурируется в поле &lt;code&gt;strawberry&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Для работы динамических таблиц (которые необходимы в том числе для системных таблиц некоторых компонент, например, для query tracker-а), необходимо поднять &lt;code&gt;tabletNodes&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"doker-obraz\"&gt;&lt;a href=\"ru/admin-guide/prepare-spec.html#doker-obraz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Докер-образ&lt;/span&gt;&lt;/a&gt;Докер-образ&lt;/h2&gt;\n&lt;p&gt;На первом шаге необходимо выбрать основной docker-образ для серверных компонент.&lt;/p&gt;\n&lt;p&gt;Большинство серверных компонент релизятся из отдельной (релизной) ветки. На данный момент последняя стабильная ветка — &lt;code&gt;stable/24.1&lt;/code&gt;. Настоятельно рекомендуется использовать образ, собранный из стабильной релизной ветки.&lt;/p&gt;\n&lt;p&gt;Докер-образ, собранный из релизной ветки, имеет вид &lt;code&gt;ghcr.io/ytsaurus/ytsaurus:stable-24.1.N&lt;/code&gt; или &lt;code&gt;ghcr.io/ytsaurus/ytsaurus:stable-24.1.N-relwithdebinfo&lt;/code&gt;. Отличия указанных образов в том, что во втором образе все бинарные файлы собраны с debug-символами.&lt;/p&gt;\n&lt;p&gt;В случае падения серверных компонент в stderr компоненты будет напечатан stacktrace, а также на k8s-ноде будет отложен &lt;code&gt;coredump&lt;/code&gt; (если это настроено в вашем k8s-кластере). Такие меры позволят понять, что именно произошло с компонентой. По этой причине  рекомендуется использовать образы &lt;code&gt;relwithdebinfo&lt;/code&gt;, несмотря на то что они занимают больше места. Без debug-символов команда YTsaurus скорее всего не сможет помочь вам в случае проблем.&lt;/p&gt;\n&lt;p&gt;В приведённом образе есть всё необходимое для практически всех компонент. Для компонент, не входящих в основной docker-образ, выкладываются отдельные образы. В Таблице 2 приведены рекомендуемые образы для всех компонент.&lt;/p&gt;\n&lt;p&gt;Образ каждой компоненты берется в первую очередь из поля &lt;code&gt;image&lt;/code&gt; компоненты. Если образ не указан, то берется &lt;code&gt;coreImage&lt;/code&gt; с верхнего уровня спецификации.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Таблица 2 — Образы компонент &lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Поле&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Docker-репозиторий&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Рекомендуемый тег стабильного релиза&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;discovery&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/pkgs/container/ytsaurus\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/ytsaurus&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;stable-24.1.0-relwithdebinfo&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;primaryMasters&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/pkgs/container/ytsaurus\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/ytsaurus&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;stable-24.1.0-relwithdebinfo&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;httpProxies&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/pkgs/container/ytsaurus\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/ytsaurus&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;stable-24.1.0-relwithdebinfo&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;rpcProxies&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/pkgs/container/ytsaurus\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/ytsaurus&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;stable-24.1.0-relwithdebinfo&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;dataNodes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/pkgs/container/ytsaurus\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/ytsaurus&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;stable-24.1.0-relwithdebinfo&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;execNodes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/pkgs/container/ytsaurus\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/ytsaurus&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;stable-24.1.0-relwithdebinfo&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;tabletNodes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/pkgs/container/ytsaurus\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/ytsaurus&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;stable-24.1.0-relwithdebinfo&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;schedulers&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/pkgs/container/ytsaurus\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/ytsaurus&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;stable-24.1.0-relwithdebinfo&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;controllerAgents&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/pkgs/container/ytsaurus\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/ytsaurus&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;stable-24.1.0-relwithdebinfo&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;queryTrackers&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/pkgs/container/query-tracker\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/query-tracker&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0.0.8-relwithdebinfo&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;yqlAgents&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/pkgs/container/query-tracker\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/query-tracker&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0.0.8&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;strawberry&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/pkgs/container/strawberry\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/strawberry&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0.0.12&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ui&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus-ui/pkgs/container/ui\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/ui&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;stable&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Помимо указанных образов выкладывается общий образ для всех серверных компонент сразу (кроме &lt;code&gt;ui&lt;/code&gt;). Такой образ достаточно указать один раз в &lt;code&gt;coreImage&lt;/code&gt;, не указывая ничего в поле &lt;code&gt;image&lt;/code&gt; компонент явно.&lt;/p&gt;\n&lt;h2 id=\"logirovanie\"&gt;&lt;a href=\"ru/admin-guide/prepare-spec.html#logirovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Логирование&lt;/span&gt;&lt;/a&gt;Логирование&lt;/h2&gt;\n&lt;p&gt;Корректная настройка логирования очень важна для диагностики проблем и при обращениях в поддержку. Рекомендации по настройке логирования собраны на отдельной &lt;a href=\"admin-guide/logging.html\"&gt;странице&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"lokacii\"&gt;&lt;a href=\"ru/admin-guide/prepare-spec.html#lokacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Локации&lt;/span&gt;&lt;/a&gt;Локации&lt;/h2&gt;\n&lt;p&gt;Рекомендации по разметке дисков и конфигурации локаций собраны на отдельной &lt;a href=\"admin-guide/locations.html\"&gt;странице&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"job-environment\"&gt;&lt;a href=\"ru/admin-guide/prepare-spec.html#job-environment\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Среда исполнения операций&lt;/span&gt;&lt;/a&gt;Среда исполнения операций&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;Exec Nodes&lt;/code&gt; могут запускать джобы в изолированных контейнерах для обработки опции операции &lt;code&gt;docker_image&lt;/code&gt;. Требуемые настройки заключены в секциях &lt;code&gt;jobResources&lt;/code&gt; и &lt;code&gt;jobEnvironment&lt;/code&gt; в &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/blob/main/docs/api.md#execnodesspec\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ExecNodeSpec&lt;/a&gt;. Пример &lt;a href=\"https://github.com/ytsaurus/yt-k8s-operator/blob/main/config/samples/cluster_v1_cri.yaml\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;настройки кластера&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"nastrojka-tablet-sell-bandlov\"&gt;&lt;a href=\"ru/admin-guide/prepare-spec.html#nastrojka-tablet-sell-bandlov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройка таблет-селл бандлов&lt;/span&gt;&lt;/a&gt;Настройка таблет-селл бандлов&lt;/h2&gt;\n&lt;p&gt;Оператор автоматически создает несколько &lt;a href=\"user-guide/dynamic-tables/concepts#tablet_cell_bundles\"&gt;таблет-селл бандлов&lt;/a&gt; — &lt;code&gt;sys&lt;/code&gt; и &lt;code&gt;default&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Для таблет-селл бандлов можно настроить медиумы, где будут храниться журналы и снепшоты. По умолчанию журналы и снепшоты хранятся в медиуме &lt;code&gt;default&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Рекомендуется настраивать бандлы так, чтобы журналы и снепшоты хранились на &lt;code&gt;SSD&lt;/code&gt;, иначе бандлы могут прийти в нерабочее состояние.&lt;/p&gt;\n&lt;p&gt;Для уже созданных бандлов можно установить атрибуты &lt;code&gt;@options/snapshot_primary_medium&lt;/code&gt; и &lt;code&gt;@options/changelog_primary_medium&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/tablet_cell_bundles/&amp;lt;bundle-name&amp;gt;/@options/snapshot_primary_medium &lt;span class=\"hljs-string\"&gt;'&amp;lt;medium-name&amp;gt;'&lt;/span&gt;\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/tablet_cell_bundles/&amp;lt;bundle-name&amp;gt;/@options/changelog_primary_medium &lt;span class=\"hljs-string\"&gt;'&amp;lt;medium-name&amp;gt;'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"386\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-386\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-386\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-386.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;При инициализации кластера оператор может настроить медиумы для бандлов автоматически. Для настройки бандла укажите названия медиумов в секции &lt;code&gt;bootstrap&lt;/code&gt; на верхнем уровне спецификации. В той же секции можно указать количество таблет-селлов в бандле. После инициализации кластера количество таблет-селлов можно изменить, установив атрибут &lt;code&gt;//sys/tablet_cell_bundles/&amp;lt;bundle-name&amp;gt;/@tablet_cell_count&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Пример &lt;code&gt;bootstrap&lt;/code&gt; секции:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;bootstrap:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;tabletCellBundles:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;sys:&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;snapshotMedium:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ssd_medium&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;changelogMedium:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ssd_medium&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;tabletCellCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;default:&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;snapshotMedium:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ssd_medium&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;changelogMedium:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ssd_medium&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;tabletCellCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;5&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"393\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-393\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-393\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-393.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;После разворачивания кластера оператор не будет обрабатывать изменения в поле &lt;code&gt;bootstrap&lt;/code&gt;. Дальнейшую настройку необходимо выполнять вручную с помощью указанных атрибутов.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/admin-guide/prepare-spec.md","sourcePath":"ru/admin-guide/prepare-spec.md"},"headings":[{"title":"Выбор набора компонент","href":"ru/admin-guide/prepare-spec.html#vybor-nabora-komponent","level":2},{"title":"Докер-образ","href":"ru/admin-guide/prepare-spec.html#doker-obraz","level":2},{"title":"Логирование","href":"ru/admin-guide/prepare-spec.html#logirovanie","level":2},{"title":"Локации","href":"ru/admin-guide/prepare-spec.html#lokacii","level":2},{"title":"Среда исполнения операций","href":"ru/admin-guide/prepare-spec.html#job-environment","level":2},{"title":"Настройка таблет-селл бандлов","href":"ru/admin-guide/prepare-spec.html#nastrojka-tablet-sell-bandlov","level":2}],"title":"Подготовка спецификации YTsaurus"},"router":{"pathname":"ru/admin-guide/prepare-spec","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
