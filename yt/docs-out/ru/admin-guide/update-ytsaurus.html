        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"vybor-obraza-i-start-obnovleniya\"&gt;&lt;a href=\"ru/admin-guide/update-ytsaurus.html#vybor-obraza-i-start-obnovleniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выбор образа и старт обновления&lt;/span&gt;&lt;/a&gt;Выбор образа и старт обновления&lt;/h2&gt;\n&lt;p&gt;Периодически выпускаются новые релизы, а также вносятся исправления в рамках текущих стабильных релизов. Почитать подробнее про выпущенные релизы можно &lt;a href=\"admin-guide/releases.html\"&gt;в отдельном разделе&lt;/a&gt;. Докер-образы со стабильными релизами имеют вид &lt;code&gt;ghcr.io/ytsaurus/ytsaurus:23.N.M&lt;/code&gt;, например &lt;code&gt;ghcr.io/ytsaurus/ytsaurus:24.1.0&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Kubernetes оператор поддерживает обновление докер-образов, используемых для серверных компонент. Для обновления необходимо поменять &lt;code&gt;coreImage&lt;/code&gt; в спецификации YTsaurus и запушить её в k8s с помощью &lt;code&gt;kubectl apply -f my_ytsaurus_spec.yaml -n &amp;lt;namespace&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Можно обновляться только на более свежие версии. Если попытаться обновиться на более старый образ, мастера не смогут подняться. После успешного обновления на свежую версию откатиться обратно уже невозможно.&lt;/p&gt;\n&lt;p&gt;Крайне не рекомендуется обновляться на &lt;code&gt;dev&lt;/code&gt; версию, собранную из текущей &lt;code&gt;main&lt;/code&gt; ветки — такие версии YTsaurus не являются стабильными и не оттестированы. При этом обновиться обратно на последний выпущенный стабильный релиз будет невозможно по описанным выше причинам.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Перед обновлением YTsaurus необходимо обновить оператор на последний релиз. Работоспособность новых стабильных образов не гарантируется со старым оператором, а также не гарантируется работоспособность оператора с нестабильными версиями YTsaurus, например с &lt;code&gt;dev&lt;/code&gt;. Найти список стабильных образов можно на страницe &lt;a href=\"admin-guide/releases\"&gt;Релизы&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"status-obnovleniya\"&gt;&lt;a href=\"ru/admin-guide/update-ytsaurus.html#status-obnovleniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статус обновления&lt;/span&gt;&lt;/a&gt;Статус обновления&lt;/h2&gt;\n&lt;p&gt;Следить за статусом обновления можно с помощью статуса ресурса &lt;code&gt;Ytsaurus&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl get ytsaurus -n &amp;lt;namespace&amp;gt;\nNAME         CLUSTERSTATE      UPDATESTATE            UPDATINGCOMPONENTS\nminisaurus   Updating          WaitingForPodsRemoval\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"38\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-38\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-38\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-38.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если обновление началось, то кластер переходит в состояние &lt;code&gt;Updating&lt;/code&gt; (&lt;code&gt;CLUSTERSTATE&lt;/code&gt;) и далее можно следить за состоянием обновления (&lt;code&gt;UPDATESTATE&lt;/code&gt;). Более детальную информацию о происходящем можно узнать, выполнив &lt;code&gt;kubectl describe ytsaurus -n &amp;lt;namespace&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;После окончания обновления кластер снова переходит в состояние &lt;code&gt;Running&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl get ytsaurus -n &amp;lt;namespace&amp;gt;\nNAME         CLUSTERSTATE   UPDATESTATE   UPDATINGCOMPONENTS\nminisaurus   Running        None\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"45\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-45\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-45\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-45.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"polnoe-i-chastichnoe-obnovlenie\"&gt;&lt;a href=\"ru/admin-guide/update-ytsaurus.html#polnoe-i-chastichnoe-obnovlenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Полное и частичное обновление&lt;/span&gt;&lt;/a&gt;Полное и частичное обновление&lt;/h2&gt;\n&lt;p&gt;В спецификации &lt;code&gt;Ytsaurus&lt;/code&gt; можно указать как один образ на все серверные компоненты (&lt;code&gt;coreImage&lt;/code&gt;), так и разные образы для разных компонент (в поле &lt;code&gt;image&lt;/code&gt; компонент). Указывать отдельные образы следует в редких случаях, желательно предварительно обсудить такое решение с &lt;a href=\"https://ytsaurus.tech/#contact\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;командой YTsaurus&lt;/a&gt;. Если у компоненты указан свой собственный образ, то будет использоваться он. При изменении &lt;code&gt;image&lt;/code&gt; также запускается обновление кластера, но в результате обновится только часть компонент.&lt;/p&gt;\n&lt;h2 id=\"configs\"&gt;&lt;a href=\"ru/admin-guide/update-ytsaurus.html#configs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обновление статических конфигов&lt;/span&gt;&lt;/a&gt;Обновление статических конфигов&lt;/h2&gt;\n&lt;p&gt;По спецификации &lt;code&gt;Ytsaurus&lt;/code&gt; оператор генерирует статические конфиги компонент. Поэтому при некоторых изменениях (например, при изменении &lt;code&gt;locations&lt;/code&gt;) может потребоваться перегенерировать конфиг, а также перезапустить поды соответствующей компоненты. Поэтому при изменении конфига также будет запускаться обновление.&lt;/p&gt;\n&lt;h2 id=\"impossible\"&gt;&lt;a href=\"ru/admin-guide/update-ytsaurus.html#impossible\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Невозможность обновления&lt;/span&gt;&lt;/a&gt;Невозможность обновления&lt;/h2&gt;\n&lt;p&gt;Существует ряд ситуаций, в которых запускать обновление может быть небезопасно. Поэтому оператор перед стартом обновления выполняет различные проверки — например, проверяет, живы ли на данный момент все tablet cell bundles. Если по результатам проверок оператор приходит к выводу, что обновление сейчас невозможно, то выставляется состояние обновления &lt;code&gt;ImpossibleToStart&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl get ytsaurus -n &amp;lt;namespace&amp;gt;\nNAME         CLUSTERSTATE   UPDATESTATE           UPDATINGCOMPONENTS\nminisaurus   Updating       ImpossibleToStart\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"64\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-64\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-64\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-64.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Узнать причину можно в статусе &lt;code&gt;Ytsaurus&lt;/code&gt;, выполнив &lt;code&gt;kubectl describe ytsaurus -n &amp;lt;namespace&amp;gt;&lt;/code&gt; и посмотрев на &lt;code&gt;Conditions&lt;/code&gt; в &lt;code&gt;UpdateStatus&lt;/code&gt;.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Пример причины невозможности запуска обновления&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl describe ytsaurus -n &amp;lt;namespace&amp;gt;\n...\n  Update Status:\n    Conditions:\n      Last Transition Time:  2023-09-26T09:18:11Z\n      Message:               Tablet cell bundles ([sys default]) aren&lt;span class=\"hljs-string\"&gt;'t in '&lt;/span&gt;good&lt;span class=\"hljs-string\"&gt;' health\n      Reason:                Update\n      Status:                True\n      Type:                  NoPossibility\n    State:                   ImpossibleToStart\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"73\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-73\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-73\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-73.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Если подобное произошло, необходимо вернуть спецификацию в прежнее значение, чтобы образы компонент не поменялись, а также по спецификации генерировались те же статические конфиги, что и раньше. Далее оператор отменит обновление и переведет YTsaurus обратно в состояние &lt;code&gt;Running&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"ruchnoe-vmeshatelstvo\"&gt;&lt;a href=\"ru/admin-guide/update-ytsaurus.html#ruchnoe-vmeshatelstvo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ручное вмешательство&lt;/span&gt;&lt;/a&gt;Ручное вмешательство&lt;/h2&gt;\n&lt;p&gt;В процессе обновления потенциально могут возникнуть различные проблемы и может понадобиться ручное вмешательство. Для этого в спецификации &lt;code&gt;Ytsaurus&lt;/code&gt; можно выставить флаг &lt;code&gt;isManaged=false&lt;/code&gt;. После этого оператор прекратит что-либо делать с данным кластером и можно делать ручные действия.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В случае возникновения непредвиденных проблем в процессе обновления рекомендуется проконсультироваться с &lt;a href=\"https://ytsaurus.tech/#contact\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;командой YTsaurus&lt;/a&gt; перед осуществлением каких-либо ручных действий.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"operator\"&gt;&lt;a href=\"ru/admin-guide/update-ytsaurus.html#operator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обновление оператора&lt;/span&gt;&lt;/a&gt;Обновление оператора&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Перед обновлением оператора кластер должен находиться в работоспособном состоянии. Например, на кластере не должно быть &lt;a href=\"admin-guide/problems/#lvc\"&gt;lvc&lt;/a&gt;, а также все &lt;a href=\"admin-guide/problems/#tabletcellbundles\"&gt;tablet cell bundles&lt;/a&gt; должны быть живы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"instrukciya\"&gt;&lt;a href=\"ru/admin-guide/update-ytsaurus.html#instrukciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Инструкция&lt;/span&gt;&lt;/a&gt;Инструкция&lt;/h3&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Запустите обновление чарта:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;helm upgrade ytsaurus --install oci://ghcr.io/ytsaurus/ytop-chart --version &amp;lt;new-version&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"116\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-116\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-116\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-116.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Список доступных версий оператора приведён на &lt;a href=\"admin-guide/releases.html#kubernetes-operator\"&gt;странице релизов&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Проверьте, что старые поды оператора удалились, а новые создались:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl get pod -n &amp;lt;namespace&amp;gt;\nNAME                                                      READY   STATUS        RESTARTS   AGE\nytsaurus-ytop-chart-controller-manager-6f67fd5d5c-6bbws   2/2     Running       0          21s\nytsaurus-ytop-chart-controller-manager-7478f9b6cb-qr8wd   2/2     Terminating   0          23h\n\n$ kubectl get pod -n &amp;lt;namespace&amp;gt;\nNAME                                                      READY   STATUS    RESTARTS   AGE\nytsaurus-ytop-chart-controller-manager-6f67fd5d5c-6bbws   2/2     Running   0          25s\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"125\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-125\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-125\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-125.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;При необходимости обновите CRD.&lt;br /&gt;\nПо умолчанию helm не обновляет ранее установленные &lt;a href=\"https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/#customresourcedefinitions\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;CRD&lt;/a&gt;, поэтому для использования новых полей спеки может потребоваться обновить их вручную. Имейте в виду — выполнять эту процедуру следует с осторожностью из-за риска потерять данные. Подробнее написано в &lt;a href=\"https://helm.sh/docs/topics/charts/#limitations-on-crds\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;документации к helm&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Чтобы вручную обновить CRD, скачайте чарт локально и затем обновите CRD с помощью &lt;code&gt;kubectl replace&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ helm pull oci://ghcr.io/ytsaurus/ytop-chart --version &amp;lt;new-version&amp;gt; --untar\n$ helm template ytop-chart --output-dir ./templates\nwrote ./templates/ytop-chart/templates/serviceaccount.yaml\nwrote ./templates/ytop-chart/templates/manager-config.yaml\n...\n$ kubectl replace -f ./templates/ytop-chart/templates/crds/&amp;lt;crd-to-update&amp;gt;\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"134\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-134\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-134\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-134.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Вероятнее всего, вам может потребоваться обновить следующие CRD:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;chyts.cluster.ytsaurus.tech.yaml&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;spyts.cluster.ytsaurus.tech.yaml&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ytsaurus.cluster.ytsaurus.tech.yaml&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;После обновления кластера в конфигах мастер-серверов могли остаться unrecognized опции (так происходит в случае, когда в новой версии &lt;code&gt;YTsaurus&lt;/code&gt; мы перестаем пользоваться какими-то полями конфига, при мажорных обновлениях это частая ситуация). Если это произойдет, загорится вот такой алерт:&lt;br /&gt;\n&lt;code&gt;Found unrecognized options in dynamic cluster config&lt;/code&gt;&lt;br /&gt;\nУдалить unrecognized опции мастера можно вручную или запустив скрипт, который живет &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/yt/scripts/remove_master_unrecognized_options\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;здесь&lt;/a&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"vozmozhnoe-avtomaticheskoe-obnovlenie-klastera\"&gt;&lt;a href=\"ru/admin-guide/update-ytsaurus.html#vozmozhnoe-avtomaticheskoe-obnovlenie-klastera\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Возможное автоматическое обновление кластера&lt;/span&gt;&lt;/a&gt;Возможное автоматическое обновление кластера&lt;/h3&gt;\n&lt;p&gt;Разные версии оператора могут генерировать разные конфиги для одних и тех же компонент — например, в новой версии оператора может добавиться новое поле. В таком случае сразу после запуска оператора будет запущено обновление кластера.&lt;/p&gt;\n&lt;p&gt;Если обновление окажется &lt;a href=\"ru/admin-guide/update-ytsaurus.html#impossible\"&gt;невозможным&lt;/a&gt;, то кластер останется в состоянии &lt;code&gt;Updating&lt;/code&gt;, а статус обновления станет &lt;code&gt;ImpossibleToStart&lt;/code&gt;. В таком случае можно откатить оператор, тогда обновление отменится и кластер перейдёт в состояние &lt;code&gt;Running&lt;/code&gt;. Либо можно выставить флаг &lt;code&gt;enableFullUpdate = false&lt;/code&gt; в спецификации &lt;code&gt;Ytsaurus&lt;/code&gt;, в таком случае обновление также будет отменено и новый оператор не будет больше пытаться запускать обновление кластера. После этого можно привести кластер в рабочее состояние и повторить попытку обновления, выставив флаг &lt;code&gt;enableFullUpdate = true&lt;/code&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/admin-guide/update-ytsaurus.md","sourcePath":"ru/admin-guide/update-ytsaurus.md"},"headings":[{"title":"Выбор образа и старт обновления","href":"ru/admin-guide/update-ytsaurus.html#vybor-obraza-i-start-obnovleniya","level":2},{"title":"Статус обновления","href":"ru/admin-guide/update-ytsaurus.html#status-obnovleniya","level":2},{"title":"Полное и частичное обновление","href":"ru/admin-guide/update-ytsaurus.html#polnoe-i-chastichnoe-obnovlenie","level":2},{"title":"Обновление статических конфигов","href":"ru/admin-guide/update-ytsaurus.html#configs","level":2},{"title":"Невозможность обновления","href":"ru/admin-guide/update-ytsaurus.html#impossible","level":2},{"title":"Ручное вмешательство","href":"ru/admin-guide/update-ytsaurus.html#ruchnoe-vmeshatelstvo","level":2},{"title":"Обновление оператора","href":"ru/admin-guide/update-ytsaurus.html#operator","level":2,"items":[{"title":"Инструкция","href":"ru/admin-guide/update-ytsaurus.html#instrukciya","level":3},{"title":"Возможное автоматическое обновление кластера","href":"ru/admin-guide/update-ytsaurus.html#vozmozhnoe-avtomaticheskoe-obnovlenie-klastera","level":3}]}],"title":"Обновление серверных компонент YTsaurus"},"router":{"pathname":"ru/admin-guide/update-ytsaurus","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
