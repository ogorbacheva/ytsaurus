            {"data":{"leading":false,"html":"&lt;p&gt;Для работы кластера YTsaurus его компонентам требуется рабочее место на дисках — для хранения персистентных, временных и отладочных данных. Пути до каталогов в файловой системе, предназначенных для работы YTsaurus, задаются в статических конфигах компонент, генерируемых k8s-оператором. В спецификации YTsaurus для указания данных путей используется секция Locations. Типы локаций соответствуют компонентам. Для выделения томов под локации используются стандартные понятия Kubernetes: &lt;code&gt;volumeMounts&lt;/code&gt;, &lt;code&gt;volumes&lt;/code&gt; (для выделения неперсистентных вольюмов) и &lt;code&gt;volumeClaimTemplates&lt;/code&gt; (для выделения персистентных вольюмов).&lt;/p&gt;\n&lt;h2 id=\"location_types\"&gt;&lt;a href=\"ru/admin-guide/locations.html#location_types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типы локаций&lt;/span&gt;&lt;/a&gt;Типы локаций&lt;/h2&gt;\n&lt;h3 id=\"location_master\"&gt;&lt;a href=\"ru/admin-guide/locations.html#location_master\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MasterChangelogs, MasterSnapshots&lt;/span&gt;&lt;/a&gt;MasterChangelogs, MasterSnapshots&lt;/h3&gt;\n&lt;p&gt;Используются для хранения данных мастеров, т.е. всех метаданных кластера. Для любых инсталляций (кроме совсем небольших) локации этих типов необходимо размещать на персистентных вольюмах. Необходимый объём вольюмов зависит от количества метаданных и нагрузки на кластер. Переполнение локаций приведёт к недоступности кластера, рекомендуется выделять место с запасом и мониторить свободное место. Типичный размер для продакшн инсталляций — сотни гигабайт.&lt;/p&gt;\n&lt;p&gt;Для того чтобы обеспечить производительность в продакшн-инсталляциях, рекомендуется размещать &lt;code&gt;MasterChangelogs&lt;/code&gt; на отдельных и быстрых (например NVME) томах — латентность записи журналов непосредственно влияет на латентность мутирующих запросов к мастеру.&lt;/p&gt;\n&lt;p&gt;У каждого инстанса мастера может быть (и должна быть) ровно одна локация типа &lt;code&gt;MasterChangelogs&lt;/code&gt; и одна локация типа &lt;code&gt;MasterSnapshots&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"locations_exec_nodes\"&gt;&lt;a href=\"ru/admin-guide/locations.html#locations_exec_nodes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ChunkCache, ImageCache, Slots&lt;/span&gt;&lt;/a&gt;ChunkCache, ImageCache, Slots&lt;/h3&gt;\n&lt;p&gt;Используются exec-нодами в процессе запуска джобов, содержащих пользовательский код (Map, Reduce, Vanilla, в том числе CHYT и SPYT). &lt;code&gt;ChunkCache&lt;/code&gt; локации нужны для менеджмента и кеширования бинарных артефактов, например, исполняемых файлов или вспомогательных словарей. &lt;code&gt;ImageCeche&lt;/code&gt; локации нужны для кэширования образов контейнеров в зависимости от настройки среды исполнения операций. &lt;code&gt;Slots&lt;/code&gt; локации нужны для выделения временного рабочего пространства (sandbox, scratch space) при запуске пользовательских процессов. У одной exec-ноды должна быть как минимум одна &lt;code&gt;ChunkCache&lt;/code&gt; локация и как минимум одна &lt;code&gt;Slots&lt;/code&gt; локация. При выделении нескольких &lt;code&gt;ChunkCache&lt;/code&gt; или &lt;code&gt;Slots&lt;/code&gt; локаций у одной ноды, exec-нода будет стараться балансировать нагрузку по ним.&lt;/p&gt;\n&lt;p&gt;Без угрозы для надёжности данных, для &lt;code&gt;ChunkCache&lt;/code&gt;, &lt;code&gt;ImageCache&lt;/code&gt; и &lt;code&gt;Slots&lt;/code&gt; локаций можно использовать неперсистентные тома. Типичные размеры локаций — 10-50 GB для &lt;code&gt;ChunkCache&lt;/code&gt;, 5-200 GB для &lt;code&gt;Slots&lt;/code&gt; и &lt;code&gt;ImageCache&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"location_data_nodes\"&gt;&lt;a href=\"ru/admin-guide/locations.html#location_data_nodes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ChunkStore&lt;/span&gt;&lt;/a&gt;ChunkStore&lt;/h3&gt;\n&lt;p&gt;Используются data-нодами для хранения чанков. Для любых инсталляций (кроме совсем небольших) локации указанных типов необходимо размещать на персистентных вольюмах. Объём данных локаций определяет суммарную ёмкость кластера. При построении multi-tiered storage (содержащего диски разного типа, например HDD и SSD) требуется указывать параметр &lt;code&gt;medium&lt;/code&gt; в описании локации. По умолчанию локация будет отнесена к медиуму с именем &lt;code&gt;default&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Минимальный размер локации для тестов — 10 GB, минимальный размер локации для рабочей инсталляции — 100 GB. У каждой data-ноды должна быть как минимум одна &lt;code&gt;ChunkStore&lt;/code&gt; локация.&lt;/p&gt;\n&lt;h3 id=\"location_logs\"&gt;&lt;a href=\"ru/admin-guide/locations.html#location_logs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Logs&lt;/span&gt;&lt;/a&gt;Logs&lt;/h3&gt;\n&lt;p&gt;Используются всеми компонентами для хранения логов. Указывается опционально, если не задано — логи пишутся в &lt;code&gt;/var/log&lt;/code&gt; внутри контейнера. Без угрозы для надёжности данных можно использовать неперсистентные тома, но такой выбор может усложнить отладку в случае переезда или пересоздания подов. Типичные размеры локаций для продакшн инсталляций от 50-200 GB.&lt;/p&gt;\n&lt;p&gt;У каждого инстанса может быть не более одной локации типа &lt;code&gt;Logs&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"spec_examples\"&gt;&lt;a href=\"ru/admin-guide/locations.html#spec_examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры спецификаций&lt;/span&gt;&lt;/a&gt;Примеры спецификаций&lt;/h2&gt;\n&lt;h3 id=\"spec_example_masters\"&gt;&lt;a href=\"ru/admin-guide/locations.html#spec_example_masters\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример настройки томов и локаций для мастеров&lt;/span&gt;&lt;/a&gt;Пример настройки томов и локаций для мастеров&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;primaryMasters:&lt;/span&gt;\n  &lt;span class=\"hljs-comment\"&gt;# Other master parameters.&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;volumeClaimTemplates:&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;# Persistent volume for master changelogs, uses dynamic volume provisioner in YC, non-replicated SSD storage class.&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;master-changelogs&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;storageClassName:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;yc-network-ssd-nonreplicated&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;accessModes:&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"ReadWriteOnce\"&lt;/span&gt; ]\n        &lt;span class=\"hljs-attr\"&gt;resources:&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;requests:&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;storage:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;200Gi&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;# Persistent volume for master snapshots, uses dynamic volume provisioner in YC, HDD storage class.&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;master-snapshots&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;storageClassName:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;yc-network-hdd&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;accessModes:&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"ReadWriteOnce\"&lt;/span&gt; ]\n        &lt;span class=\"hljs-attr\"&gt;resources:&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;requests:&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;storage:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;200Gi&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;volumes:&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;# Non-persistent volume for debug logs.&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;master-logs&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;emptyDir:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;sizeLimit:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;100Gi&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;volumeMounts:&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;master-changelogs&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;mountPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/master-changelogs&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;master-snapshots&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;mountPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/master-snapshots&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;master-logs&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;mountPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/master-logs&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&g in-guide/locations.html#spec_example_data_nodes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример настройки томов и локаций для data-нод&lt;/span&gt;&lt;/a&gt;Пример настройки томов и локаций для data-нод&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;dataNodes:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;volumeClaimTemplates:&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;# Persistent volume for chunk stores on HDD.&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;chunk-store-hdd&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;storageClassName:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;yc-network-hdd&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;accessModes:&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"ReadWriteOnce\"&lt;/span&gt; ]\n        &lt;span class=\"hljs-attr\"&gt;resources:&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;requests:&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;storage:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;300Gi&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;# Persistent volume for chunk stores on SSD.&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;chunk-store-ssd&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;storageClassName:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;yc-network-ssd&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;accessModes:&lt;/span&gt; ass=\"hljs-string\"&gt;node-logs&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;mountPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/node-logs&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;locations:&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;locationType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ChunkStore&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/node-chunk-store-hdd&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;medium:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;default&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;locationType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ChunkStore&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/node-chunk-store-ssd&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;medium:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ssd_blobs&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;locationType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Logs&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/node-logs&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"55\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-55\" attributeName=\"visibility\" from=\"hidden\" t
