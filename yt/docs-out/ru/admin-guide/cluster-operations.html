        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"main\"&gt;&lt;a href=\"ru/admin-guide/cluster-operations.html#main\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эксплуатация кластера&lt;/span&gt;&lt;/a&gt;Эксплуатация кластера&lt;/h2&gt;\n&lt;h3 id=\"upravlenie-kvotami-dlya-hraneniya-dannyh\"&gt;&lt;a href=\"ru/admin-guide/cluster-operations.html#upravlenie-kvotami-dlya-hraneniya-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Управление квотами для хранения данных&lt;/span&gt;&lt;/a&gt;Управление квотами для хранения данных&lt;/h3&gt;\n&lt;p&gt;Управление квотами для хранения данных осуществляется с помощью аккаунтов. Подробнее про аккаунты можно узнать &lt;a href=\"user-guide/storage/accounts.html\"&gt;по ссылке&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;В данном разделе приведено несколько стандартных примеров работы с аккаунтами с помощью CLI.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Просмотр аккаунтов&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Дерево аккаунтов в Кипарисе можно найти по пути &lt;code&gt;//sys/account_tree&lt;/code&gt;. Полный плоский список доступен по пути &lt;code&gt;//sys/accounts&lt;/code&gt; (имена аккаунтов глобально уникальны, несмотря на иерархическую организацию).&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Листинг 1 — Древовидное и плоское представления аккаунтов в Кипарисе&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt list //sys/account_tree/my_account\nmy_subaccount1\nmy_subaccount2\n\n$ yt list //sys/accounts\nmy_account\nmy_subaccount1\nmy_subaccount2\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"23\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-23\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-23\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-23.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;У аккаунта есть &lt;a href=\"user-guide/storage/accounts.html#account_attributes\"&gt;множество атрибутов&lt;/a&gt;, описывающих лимиты на ресурсы, их текущее использование и другие.&lt;/p&gt;\n&lt;p&gt;Запросить атрибуты любого объекта Кипариса и, в частности, аккаунта можно командой:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$ yt get //sys/account_tree/my_account/@\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"30\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-30\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-30\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-30.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Создание аккаунта&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Чтобы создать аккаунт, в атрибуте &lt;code&gt;name&lt;/code&gt; необходимо указать его имя, а в &lt;code&gt;parent_name&lt;/code&gt; — имя родителя. Если имя родителя не указано, будет создан аккаунт верхнего уровня. Создавать такие аккаунты имеют право лишь администраторы кластера.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Листинг 2 — Создание нового аккаунта&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt create account --attributes=&lt;span class=\"hljs-string\"&gt;'{ name = \"my_subaccount3\"; parent_name = \"my_account\" }'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"44\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-44\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-44\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-44.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Удаление аккаунта&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Чтобы удалить аккаунт, достаточно указать путь к нему:&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Листинг 3 — Удаление аккаунта&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt remove //sys/accounts/my_subaccount3\n\n&lt;span class=\"hljs-comment\"&gt;# или&lt;/span&gt;\n\n$ yt remove //sys/account_tree/my_account/my_subaccount3\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"58\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-58\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-58\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-58.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Изменение ресурсов аккаунта&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Пример изменения количества нод Кипариса в лимитах аккаунта.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Листинг 4 — Изменение ресурсов аккаунта&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Просмотр текущего количества&lt;/span&gt;\n$ yt get //sys/accounts/my_subaccount3/@resource_limits/node_count\n1000\n\n&lt;span class=\"hljs-comment\"&gt;# Установка нового значения&lt;/span&gt;\n$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/accounts/my_subaccount3/@resource_limits/node_count 2000\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"72\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-72\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-72\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-72.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Обратите внимание, что дисковое место, управляемое через аккаунты, не лимитировано реальным доступным местом на кластере.&lt;br /&gt;\nОдна из задач системного администратора — с помощью лимитов на аккаунтах предотвращать ситуацию, когда на кластере заканчивается физическое место на дисках.&lt;/p&gt;\n&lt;h3 id=\"upravlenie-vychislitelnymi-kvotami\"&gt;&lt;a href=\"ru/admin-guide/cluster-operations.html#upravlenie-vychislitelnymi-kvotami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Управление вычислительными квотами&lt;/span&gt;&lt;/a&gt;Управление вычислительными квотами&lt;/h3&gt;\n&lt;p&gt;За распределение вычислительных ресурсов в кластере отвечает планировщик, но описание деревьев пулов и пулов (сущностей, которые хранят информацию о вычислительных квотах) хранится в Кипарисе. Рекомендуется прочитать &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;общую документацию&lt;/a&gt; про устройство планировщика и &lt;a href=\"user-guide/data-processing/scheduler/manage-pools.html\"&gt;отдельную страницу про управление пулами&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;В данном разделе приведено несколько стандартных примеров работы с пулами с помощью CLI.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Просмотр пулов&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;small&gt;Листинг 1 — Просмотр пулов&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt get //sys/pool_trees/default\n{\n    &lt;span class=\"hljs-string\"&gt;\"project-root\"&lt;/span&gt; = {\n        &lt;span class=\"hljs-string\"&gt;\"project-subpool1\"&lt;/span&gt; = {\n        };\n        &lt;span class=\"hljs-string\"&gt;\"project-subpool2\"&lt;/span&gt; = {\n        };\n    };\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"95\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-95\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-95\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-95.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Создание вложенного пула&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;small&gt;Листинг 2 — Создание подпула&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt create scheduler_pool --attributes=&lt;span class=\"hljs-string\"&gt;'{pool_tree=default;name=project-subpool1;parent_name=project-root}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"106\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-106\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-106\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-106.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В attributes можно дополнительно передать атрибуты пула, они будут провалидированы. В случае неуспешной валидации объект создан не будет.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Изменения атрибутов пула&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;small&gt;Листинг 3 — Изменения атрибутов пула&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Простановка веса&lt;/span&gt;\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/pool_trees/default/project-root/project-subpool1/@weight 10\n\n&lt;span class=\"hljs-comment\"&gt;# Простановка запрета на запуск операций в пуле&lt;/span&gt;\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/pool_trees/default/project-root/@forbid_immediate_operations &lt;span class=\"hljs-string\"&gt;'%true'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"120\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-120\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-120\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-120.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Выдача и изменение гарантий на пуле&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Первичное выставление гарантии пула (при условии что у родителя имеется нераспределённая гарантия):&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Листинг 4 — Первичная установка гарантии&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/pool_trees/default/project-root/project-subpool1/@strong_guarantee_resources &lt;span class=\"hljs-string\"&gt;'{cpu=50}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"134\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-134\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-134\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-134.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Для изменения уже выставленной гарантии можно указать конкретный параметр:&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Листинг 5 — Изменение гарантии&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/pool_trees/default/project-root/project-subpool1/@strong_guarantee_resources/cpu 100\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"141\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-141\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-141\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-141.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;В отличии от квот на хранение данных планировщик проверяет, что выданные вычислительные квоты обеспечены фактическими ресурсами exec-нод кластера.&lt;/p&gt;\n&lt;h3 id=\"upravlenie-polzovatelyami,-gruppami-i-pravami-dostupa\"&gt;&lt;a href=\"ru/admin-guide/cluster-operations.html#upravlenie-polzovatelyami,-gruppami-i-pravami-dostupa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Управление пользователями, группами и правами доступа&lt;/span&gt;&lt;/a&gt;Управление пользователями, группами и правами доступа&lt;/h3&gt;\n&lt;p&gt;В модели системы поддержаны такие сущности, как пользователи и группы, а через атрибуты объекта можно управлять правами доступа. Подробнее о модели прав доступа рассказано в отдельном &lt;a href=\"user-guide/storage/access-control.html\"&gt;разделе&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Как правило управление пользователями, группами и правами доступа делегируется в стороннюю систему (например в &lt;a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;IAM&lt;/a&gt;), но для небольших инсталляций это бывает удобно делать вручную.&lt;/p&gt;\n&lt;p&gt;Примеры управления пользователями и группами.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Просмотр пользователей и групп&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;small&gt;Листинг 1 — Просмотр пользователей&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt get //sys/users\n{\n    &lt;span class=\"hljs-string\"&gt;\"file_cache\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"guest\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"root\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"scheduler\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"operations_cleaner\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"operations_client\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"queue_agent\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"tablet_balancer\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"167\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-167\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-167\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-167.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;small&gt;Листинг 2 — Просмотр групп&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //sys/groups\n{\n    &lt;span class=\"hljs-string\"&gt;\"devs\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"admins\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"superusers\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"everyone\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"users\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"admin_snapshots\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"171\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-171\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-171\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-171.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;small&gt;Листинг 3 — Просмотр состава группы&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //sys/groups/users/@members\n[\n    &lt;span class=\"hljs-string\"&gt;\"superusers\"&lt;/span&gt;;\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"175\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-175\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-175\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-175.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Создание пользователей и групп&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;small&gt;Листинг 4 — Создание пользователя&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt create user --attributes &lt;span class=\"hljs-string\"&gt;'{name=my_user}'&lt;/span&gt;\n1-4a7d-101f5-f881885\n\n$ yt exists //sys/users/my_user\n&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"186\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-186\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-186\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-186.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;small&gt;Листинг 5 — Создание группы&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt create group --attributes &lt;span class=\"hljs-string\"&gt;'{name=my_group}'&lt;/span&gt;\n1-bedc-101f6-45aec437\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"190\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-190\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-190\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-190.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;small&gt;Листинг 6 — Добавление пользователя в группу&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt add-member my_user my_group\n\n$ yt get //sys/users/my_user/@member_of\n[\n    &lt;span class=\"hljs-string\"&gt;\"users\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"my_group\"&lt;/span&gt;;\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"194\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-194\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-194\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-194.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Изменение RPS-лимитов у пользователя&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;small&gt;Листинг 7 — Изменения RPS-лимитов у пользователя&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //sys/users/my_user/@read_request_rate_limit\n100\n$ yt get //sys/users/my_user/@write_request_rate_limit\n100\n\n$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/users/my_user/@read_request_rate_limit 300\n$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/users/my_user/@write_request_rate_limit 200\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"205\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-205\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-205\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-205.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Просмотр ACL на узле&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Следует отличать права доступа, непосредственно сконфигурированные на узле кипариса, и права доступа с учетом наследования от родителя.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Листинг 8 — Просмотр ACL на узле&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt create map_node //home/my_user\n1-283e-1012f-63684d08\n$ yt get //home/my_user/@acl\n[]\n$ yt get //home/my_user/@inherit_acl\n%&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n$ yt get //home/my_user/@effective_acl\n[\n    {\n        &lt;span class=\"hljs-string\"&gt;\"action\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"allow\"&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"subjects\"&lt;/span&gt; = [\n            &lt;span class=\"hljs-string\"&gt;\"users\"&lt;/span&gt;;\n        ];\n        &lt;span class=\"hljs-string\"&gt;\"permissions\"&lt;/span&gt; = [\n            &lt;span class=\"hljs-string\"&gt;\"read\"&lt;/span&gt;;\n        ];\n        &lt;span class=\"hljs-string\"&gt;\"inheritance_mode\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"object_and_descendants\"&lt;/span&gt;;\n    };\n    {\n        &lt;span class=\"hljs-string\"&gt;\"action\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"allow\"&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"subjects\"&lt;/span&gt; = [\n            &lt;span class=\"hljs-string\"&gt;\"admins\"&lt;/span&gt;;\n        ];\n        &lt;span class=\"hljs-string\"&gt;\"permissions\"&lt;/span&gt; = [\n            &lt;span class=\"hljs-string\"&gt;\"write\"&lt;/span&gt;;\n            &lt;span class=\"hljs-string\"&gt;\"administer\"&lt;/span&gt;;\n            &lt;span class=\"hljs-string\"&gt;\"remove\"&lt;/span&gt;;\n            &lt;span class=\"hljs-string\"&gt;\"mount\"&lt;/span&gt;;\n        ];\n        &lt;span class=\"hljs-string\"&gt;\"inheritance_mode\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"object_and_descendants\"&lt;/span&gt;;\n    };\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"219\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-219\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-219\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-219.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Изменение ACL на узле&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;small&gt;Листинг 9 — Изменение ACL на узле&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/my_user/@acl &lt;span class=\"hljs-string\"&gt;'[{subjects=[my_group];permissions=[read;write;remove;];action=allow}]'&lt;/span&gt;\n$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/my_user/@inherit_acl &lt;span class=\"hljs-string\"&gt;'%false'&lt;/span&gt;\n$ yt get //home/my_user/@effective_acl\n[\n    {\n        &lt;span class=\"hljs-string\"&gt;\"action\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"allow\"&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"subjects\"&lt;/span&gt; = [\n            &lt;span class=\"hljs-string\"&gt;\"my_group\"&lt;/span&gt;;\n        ];\n        &lt;span class=\"hljs-string\"&gt;\"permissions\"&lt;/span&gt; = [\n            &lt;span class=\"hljs-string\"&gt;\"read\"&lt;/span&gt;;\n            &lt;span class=\"hljs-string\"&gt;\"write\"&lt;/span&gt;;\n            &lt;span class=\"hljs-string\"&gt;\"remove\"&lt;/span&gt;;\n        ];\n        &lt;span class=\"hljs-string\"&gt;\"inheritance_mode\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"object_and_descendants\"&lt;/span&gt;;\n    };\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"230\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-230\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-230\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-230.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"rekomendacii-po-upravleniyu-pravami-dostupa\"&gt;&lt;a href=\"ru/admin-guide/cluster-operations.html#rekomendacii-po-upravleniyu-pravami-dostupa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Рекомендации по управлению правами доступа&lt;/span&gt;&lt;/a&gt;Рекомендации по управлению правами доступа&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;используйте группы и выдавайте права исключительно группам; это позволяет выдавать/забирать скоуп доступов у пользователя путем добавления его в группу или исключения его из группы;&lt;/li&gt;\n&lt;li&gt;выдавайте права на крупные проектные директории и не выдавайте права на конкретные таблицы; таблица может быть пересоздана (тогда права потеряются), перемещена (в этом случае &lt;code&gt;effective_acl&lt;/code&gt; с учетом нового расположения в Кипарисе окажется другим, могут быть унаследованы нежелательные доступы);&lt;/li&gt;\n&lt;li&gt;используйте право &lt;code&gt;deny&lt;/code&gt; только в исключительных ситуациях, когда необходимо срочно отобрать права у конкретного пользователя. Правильный способ разграничения прав заключается в аккуратном управлении составами групп и использовании &lt;code&gt;inherit_acl=%false&lt;/code&gt;, чтобы не наследовать широкие права родительского узла.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"upravlenie-nodami-klastera\"&gt;&lt;a href=\"ru/admin-guide/cluster-operations.html#upravlenie-nodami-klastera\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Управление нодами кластера&lt;/span&gt;&lt;/a&gt;Управление нодами кластера&lt;/h3&gt;\n&lt;p&gt;Существенная часть управления кластером состоит в управлении нодами кластера: их вводом и выводом, диагностикой проблем на конкретной ноде.&lt;/p&gt;\n&lt;p&gt;Большую часть информации про ноды кластера можно посмотреть в UI. В то же время полезно знать, как ,ноды представлены в Кипарисе и какие у них есть атрибуты.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Как посмотреть список нод в кластере&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;small&gt;Листинг 1 — Просмотр списка нод&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //sys/cluster_nodes\n{\n    &lt;span class=\"hljs-string\"&gt;\"localhost:17359\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"270\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-270\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-270\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-270.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Атрибуты ноды представлены в таблице 1:&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Таблица 1 — Атрибуты ноды&lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Атрибут&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;state&lt;/td&gt;\n&lt;td&gt;ENodeState&lt;/td&gt;\n&lt;td&gt;Состояние ноды с точки зрения мастера&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;flavors&lt;/td&gt;\n&lt;td&gt;list&lt;/td&gt;\n&lt;td&gt;Список flavor-ов данной ноды&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;resource_limits&lt;/td&gt;\n&lt;td&gt;ClusterResources&lt;/td&gt;\n&lt;td&gt;Доступные ресурсы на данной ноде&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;resource_usage&lt;/td&gt;\n&lt;td&gt;ClusterResources&lt;/td&gt;\n&lt;td&gt;Используемые ресурсы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;alerts&lt;/td&gt;\n&lt;td&gt;list&lt;/td&gt;\n&lt;td&gt;Список алертов на данной ноде&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;version&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Версия бинарного файла YTsaurus, запущенная на данной ноде&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;job_proxy_build_version&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Версия бинарного файла &lt;code&gt;ytserver-job-proxy&lt;/code&gt;, используемого exe-нодой&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tags&lt;/td&gt;\n&lt;td&gt;list&lt;/td&gt;\n&lt;td&gt;Список &lt;a href=\"admin-guide/node-tags.html\"&gt;тегов&lt;/a&gt; данной ноды&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;last_seen_time&lt;/td&gt;\n&lt;td&gt;DateTime&lt;/td&gt;\n&lt;td&gt;Момент времени, когда нода последний раз обращалась к мастеру&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;registered_time&lt;/td&gt;\n&lt;td&gt;DateTime&lt;/td&gt;\n&lt;td&gt;Момент времени, когда нода была зарегистрирована в мастере&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Перечисленные атрибуты носят информационный характер, то есть вычисляются системой исходя из конфигов и текущего состояния кластера.&lt;/p&gt;\n&lt;p&gt;Существуют управляющие атрибуты, значения которых можно менять с помощью вызова &lt;code&gt;set&lt;/code&gt;. Тем самым можно запросить выполнение какого-то действия, связанного с данной нодой.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Таблица 2 — Управляющие атрибуты ноды&lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Атрибут&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;resource_limits_overrides&lt;/td&gt;\n&lt;td&gt;ClusterResources&lt;/td&gt;\n&lt;td&gt;Override на текущие ресурсы ноды (не работает для &lt;code&gt;user_slots&lt;/code&gt;)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;user_tags&lt;/td&gt;\n&lt;td&gt;list&lt;/td&gt;\n&lt;td&gt;Список дополнительных &lt;a href=\"admin-guide/node-tags.html\"&gt;тегов&lt;/a&gt; ноды&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;banned&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Указание значения &lt;code&gt;%true&lt;/code&gt; банит данную ноду&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;decommissioned&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Указание значения &lt;code&gt;%true&lt;/code&gt; заказывает перенос чанков с этой ноды на другие ноды кластера&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;disable_write_sessions&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Указание значения &lt;code&gt;%true&lt;/code&gt; останавливает новые записи на данную ноду&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;disable_scheduler_jobs&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Указание значения &lt;code&gt;%true&lt;/code&gt; останавливает планирование новых джобов и приводит к прерыванию существующих по небольшому таймату&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Корректно работающая нода, подключенная к кластеру, имеет состояние &lt;code&gt;online&lt;/code&gt;. Состояние &lt;code&gt;offline&lt;/code&gt; означает, что нода выключена или не может подняться. Существует ряд промежуточных состояний, в которых может находиться нода, пока происходит её регистрация в мастере.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Просмотр атрибутов ноды&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;small&gt;Листинг 2 — Просмотр атрибутов ноды&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //sys/cluster_nodes/localhost:17359/@\n{\n    &lt;span class=\"hljs-string\"&gt;\"state\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"online\"&lt;/span&gt;;\n    ...\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"509\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-509\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-509\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-509.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h3 id=\"ytdyncfgen\"&gt;&lt;a href=\"ru/admin-guide/cluster-operations.html#ytdyncfgen\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Динамические конфиги&lt;/span&gt;&lt;/a&gt;Динамические конфиги&lt;/h3&gt;\n&lt;p&gt;Большинство компонент кластера поддерживает механизм динамического управления конфигами через Кипарис. Общая концепция выглядит следующим образом: в специальную ноду Кипариса можно написать конфиг-патч в виде документа. Компоненты кластера периодически перечитывают соответствующие им узлы Кипариса и применяют увиденные изменения.&lt;/p&gt;\n&lt;p&gt;Важно понимать, что не все опции поддерживают механизм динамического изменения: зачастую реализовать подобную логику сложно или невозможно, хотя чаще она может быть просто не реализована, так как опции динамизировались по мере надобности.&lt;/p&gt;\n&lt;h4 id=\"dinamicheskij-konfig-nod-klastera\"&gt;&lt;a href=\"ru/admin-guide/cluster-operations.html#dinamicheskij-konfig-nod-klastera\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Динамический конфиг нод кластера&lt;/span&gt;&lt;/a&gt;Динамический конфиг нод кластера&lt;/h4&gt;\n&lt;p&gt;Данный конфиг управляется через узел &lt;code&gt;//sys/cluster_nodes/@config&lt;/code&gt;, в котором должен быть записан словарь: ключом словаря является фильтр, а значением — динамический конфиг, который требуется применить к нодам, подходящим под данный фильтр. Используемые в данном словаре фильтры не должны пересекаться, то есть каждая нода кластера должна попадать не более чем под один фильтр из данного словаря.&lt;/p&gt;\n&lt;h4 id=\"dinamicheskij-konfig-planirovshika-i-kontroller-agentov\"&gt;&lt;a href=\"ru/admin-guide/cluster-operations.html#dinamicheskij-konfig-planirovshika-i-kontroller-agentov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Динамический конфиг планировщика и контроллер-агентов&lt;/span&gt;&lt;/a&gt;Динамический конфиг планировщика и контроллер-агентов&lt;/h4&gt;\n&lt;p&gt;Конфиг планировщика управляется через узел &lt;code&gt;//sys/scheduler/config&lt;/code&gt;. Данный узел представляет собой объект типа документ, который содержит патч к конфигу планировщика. Патч относится непосредственно к подсистеме планирования, то есть к секции &lt;code&gt;scheduler&lt;/code&gt; из статического конфига данной компоненты.&lt;/p&gt;\n&lt;p&gt;Аналогичным образом устроен конфиг контроллер-агентов: он управляется через узел &lt;code&gt;//sys/controller_agents/config&lt;/code&gt; и содержит патч к подсистеме управления контроллерами операций, то есть к секции &lt;code&gt;controller_agent&lt;/code&gt; из статического конфига контроллер-агентов.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Примеры управления конфигами планировщика и контроллер-агентов&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;small&gt;Листинг 1 — Увеличение максимального размера файла, разрешенного в sandbox джобов&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Просмотр текущего значения данной опции&lt;/span&gt;\n$ yt get //sys/controller_agents/instances/&amp;lt;controller_agent&amp;gt;/orchid/controller_agent/config/user_file_limits/max_size\n10737418240\n\n&lt;span class=\"hljs-comment\"&gt;# Создание узла конфига (если его еще нет)&lt;/span&gt;\n$ yt create document //sys/controller_agents/config --attributes &lt;span class=\"hljs-string\"&gt;'{value={}}'&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Простановка нового значения&lt;/span&gt;\n$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/controller_agents/config/user_file_limits &lt;span class=\"hljs-string\"&gt;'{max_size=53687091200}'&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Удостоверяемся, что контроллер-агент подхватил новое значение&lt;/span&gt;\n$ yt get //sys/controller_agents/instances/&amp;lt;controller_agent&amp;gt;/orchid/controller_agent/config/user_file_limits/max_size\n53687091200\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"544\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-544\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-544\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-544.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/admin-guide/cluster-operations.md","sourcePath":"ru/admin-guide/cluster-operations.md"},"headings":[{"title":"Эксплуатация кластера","href":"ru/admin-guide/cluster-operations.html#main","level":2,"items":[{"title":"Управление квотами для хранения данных","href":"ru/admin-guide/cluster-operations.html#upravlenie-kvotami-dlya-hraneniya-dannyh","level":3},{"title":"Управление вычислительными квотами","href":"ru/admin-guide/cluster-operations.html#upravlenie-vychislitelnymi-kvotami","level":3},{"title":"Управление пользователями, группами и правами доступа","href":"ru/admin-guide/cluster-operations.html#upravlenie-polzovatelyami,-gruppami-i-pravami-dostupa","level":3,"items":[{"title":"Рекомендации по управлению правами доступа","href":"ru/admin-guide/cluster-operations.html#rekomendacii-po-upravleniyu-pravami-dostupa","level":4}]},{"title":"Управление нодами кластера","href":"ru/admin-guide/cluster-operations.html#upravlenie-nodami-klastera","level":3},{"title":"Динамические конфиги","href":"ru/admin-guide/cluster-operations.html#ytdyncfgen","level":3,"items":[{"title":"Динамический конфиг нод кластера","href":"ru/admin-guide/cluster-operations.html#dinamicheskij-konfig-nod-klastera","level":4},{"title":"Динамический конфиг планировщика и контроллер-агентов","href":"ru/admin-guide/cluster-operations.html#dinamicheskij-konfig-planirovshika-i-kontroller-agentov","level":4}]}]}],"title":""},"router":{"pathname":"ru/admin-guide/cluster-operations","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
