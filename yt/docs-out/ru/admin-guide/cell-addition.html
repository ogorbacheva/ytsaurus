            {"data":{"leading":false,"html":"&lt;p&gt;Добавление новых мастерных селлов всегда происходит с полным даунтаймом кластера. В упрощенном виде расширение кластера представляет из себя одновременное обновление статического конфига всех компонент кластера с некоторыми дополнительными действиями. Ниже описан подробный план действий, перед тем как приступать к нему, стоит прочитать его до конца.&lt;/p&gt;\n&lt;h2 id=\"podgotovka\"&gt;&lt;a href=\"ru/admin-guide/cell-addition.html#podgotovka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подготовка&lt;/span&gt;&lt;/a&gt;Подготовка&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Нужно подготовить новый статический конфиг, добавив в него информацию о новых селлах.&lt;/li&gt;\n&lt;li&gt;Можно заранее подготовить @cluster_connection с новыми селлами (про @cluster_connection написано ниже в пункте 14).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Cell tags/cell IDs должны быть уникальны и в идеале следовать предсказуемому паттерну. Если у вас мультикластерная инсталяция, сell tags/cell IDs должны быть уникальны среди всех мастерных селлов всех кластеров инсталяции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"detalnyj-plan\"&gt;&lt;a href=\"ru/admin-guide/cell-addition.html#detalnyj-plan\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Детальный план&lt;/span&gt;&lt;/a&gt;Детальный план&lt;/h2&gt;\n&lt;h3 id=\"1-pogasit-shedulery-i-kontroller-agenty\"&gt;&lt;a href=\"ru/admin-guide/cell-addition.html#1-pogasit-shedulery-i-kontroller-agenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. Погасить шедулеры и контроллер-агенты&lt;/span&gt;&lt;/a&gt;1. Погасить шедулеры и контроллер-агенты&lt;/h3&gt;\n&lt;p&gt;Эти компоненты стоит гасить в первую очередь, так как при массовом уходе нод (и вытекающей из этого нехватке ресурсов) они могут абортить пользовательские операции.&lt;/p&gt;\n&lt;h3 id=\"2-vyklyuchit-chunk-refresh-i-chunk-requisition-update\"&gt;&lt;a href=\"ru/admin-guide/cell-addition.html#2-vyklyuchit-chunk-refresh-i-chunk-requisition-update\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Выключить chunk refresh и chunk requisition update&lt;/span&gt;&lt;/a&gt;2. Выключить chunk refresh и chunk requisition update&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/@config/chunk_manager/enable_chunk_refresh %&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/@config/chunk_manager/enable_chunk_requisition_update %&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"40\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-40\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-40\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-40.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;На мастер-серверах есть фоновая активность по репликации чанков. Следующим пунктом мы погасим все ноды, из-за чего чанки, конечно, потеряют свои реплики, что в моменте может спровоцировать всплеск бесполезной работы (на мастер-серверах, конечно, есть защита на случай, если реплик потеряно слишком много, но до того, как этот момент наступит, мастер-сервера будут активно заниматься ненужной в будущем деятельностью). Чтобы это предотвратить, можно заранее переключить описанные флажки.&lt;/p&gt;\n&lt;h3 id=\"3-pogasit-vse-nody\"&gt;&lt;a href=\"ru/admin-guide/cell-addition.html#3-pogasit-vse-nody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Погасить все ноды&lt;/span&gt;&lt;/a&gt;3. Погасить все ноды&lt;/h3&gt;\n&lt;p&gt;(Следить за состоянием нод можно по //sys/nodes/@count и //sys/nodes/@online_node_count).&lt;/p&gt;\n&lt;p&gt;Здесь очень важно убедиться, что все ноды кластера находятся в состоянии offline (проверить состояние можно с помощью //sys/cluster_nodes/{node_address}/@state). В мастер-серверах есть защита, которая остановит новый селл от регистрации в случае, если есть хотя бы одна не offline нода.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Если в кластере уже есть вторичные селлы, то ноды какое-то время могут находиться в состоянии mixed. В таком случае тоже важно дождаться, чтобы все ноды стали offline.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"4-pogasit-vse-proksi\"&gt;&lt;a href=\"ru/admin-guide/cell-addition.html#4-pogasit-vse-proksi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Погасить все прокси&lt;/span&gt;&lt;/a&gt;4. Погасить все прокси&lt;/h3&gt;\n&lt;h3 id=\"5-pogasit-vse-ostavshiesya-servisy-krome-master-serverov\"&gt;&lt;a href=\"ru/admin-guide/cell-addition.html#5-pogasit-vse-ostavshiesya-servisy-krome-master-serverov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Погасить все оставшиеся сервисы кроме мастер-серверов&lt;/span&gt;&lt;/a&gt;5. Погасить все оставшиеся сервисы &lt;strong&gt;кроме&lt;/strong&gt; мастер-серверов&lt;/h3&gt;\n&lt;p&gt;(Скорее всего это  clock-сервера, мастер-кеши, timestamp-провайдеры, discovery-сервера. При наличии других сервисов их тоже стоит погасить на этом шаге).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Замечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сервисы, которые не используют мастер-сервера для своей работы, не обязательно гасить при расширении. Примерами таких сервисов являются clock-сервера, discovery servers и возможно другие сервисы, в статическом конфиге которых не прописаны адреса мастер-серверов.&lt;/p&gt;\n&lt;p&gt;Если вам по каким-то причинам важна живость этих сервисов, можно не гасить их на этом шаге, но важно быть внимательным — если не погасить сервис, в статическом конфиге которого мастер-сервера все же есть (тем самым не обновив его статический конфиг), то кластер может сломаться произвольным образом.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"6-propisat-pustye-roli-novym-masternym-sellam\"&gt;&lt;a href=\"ru/admin-guide/cell-addition.html#6-propisat-pustye-roli-novym-masternym-sellam\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6. Прописать пустые роли новым мастерным селлам&lt;/span&gt;&lt;/a&gt;6. Прописать пустые роли новым мастерным селлам&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/@config/multicell_manager/testing/allow_master_cell_with_empty_role %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/@config/multicell_manager/descriptors/{cell_tag}/roles []\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"88\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-88\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-88\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-88.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если не сделать этого, то новым мастерным селлам автоматически назначатся роли &lt;code&gt;chunk_host&lt;/code&gt; и &lt;code&gt;cypress_node_host&lt;/code&gt; (детальнее про существующие роли можно прочитать в пункте 13), и последующее изменение ролей может привести к потере данных.&lt;/p&gt;\n&lt;h3 id=\"7-postroit-na-master-serverah-snapshot-s-read-only\"&gt;&lt;a href=\"ru/admin-guide/cell-addition.html#7-postroit-na-master-serverah-snapshot-s-read-only\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;7. Построить на мастер-серверах снапшот с read-only&lt;/span&gt;&lt;/a&gt;7. Построить на мастер-серверах снапшот с read-only&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt-admin build-master-snapshots —read-only —wait-for-snapshot-completion\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"95\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-95\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-95\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-95.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Read-only — это специальное состояние кластера, при котором мастер-сервера не могут принимать, планировать и применять мутации. Построение снапшота в таком режиме — это стандартный приём при мажорных обновлениях, он позволяет добиться того, что мастер-сервера новой версии будут восстанавливаться только из снапшота, не применяя ченджлог поверх снапшота (т. к. ченджлог после снапшота будет пуст).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Этот шаг очень важен, его невыполнение может привести к потере данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Можно убедиться, что мастер-сервера перешли в read-only режим и построили снапшот по логам лидера:&lt;br /&gt;\n\"Read-only mode enabled\" и \"Distributed snapshot creation finished\".&lt;/p&gt;\n&lt;h3 id=\"8-pogasit-master-servera\"&gt;&lt;a href=\"ru/admin-guide/cell-addition.html#8-pogasit-master-servera\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;8. Погасить мастер-сервера&lt;/span&gt;&lt;/a&gt;8. Погасить мастер-сервера&lt;/h3&gt;\n&lt;h3 id=\"9-podnyat-master-servera,-clock-servera,-master-keshi,-timestamp-provajdery,-discovery-servera\"&gt;&lt;a href=\"ru/admin-guide/cell-addition.html#9-podnyat-master-servera,-clock-servera,-master-keshi,-timestamp-provajdery,-discovery-servera\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;9. Поднять мастер-сервера, clock-сервера, мастер-кеши, timestamp-провайдеры, discovery сервера&lt;/span&gt;&lt;/a&gt;9. Поднять мастер-сервера, clock-сервера, мастер-кеши, timestamp-провайдеры, discovery сервера&lt;/h3&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Если на шаге 5 были погашены какие-нибудь еще сервисы, кроме перечисленных, то поднимать их пока &lt;strong&gt;не нужно&lt;/strong&gt;!&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"10-vyjti-iz-rezhima-read-only\"&gt;&lt;a href=\"ru/admin-guide/cell-addition.html#10-vyjti-iz-rezhima-read-only\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;10. Выйти из режима read-only&lt;/span&gt;&lt;/a&gt;10. Выйти из режима read-only&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt-admin master-exit-read-only\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"131\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-131\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-131\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-131.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"11-dozhdatsya-registracii-novyh-sellov-i-replikacii-globalnyh-obuektov\"&gt;&lt;a href=\"ru/admin-guide/cell-addition.html#11-dozhdatsya-registracii-novyh-sellov-i-replikacii-globalnyh-obuektov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;11. Дождаться регистрации новых селлов и репликации глобальных объектов&lt;/span&gt;&lt;/a&gt;11. Дождаться регистрации новых селлов и репликации глобальных объектов&lt;/h3&gt;\n&lt;p&gt;По логам мастер-серверов стоит убедиться, что новые селлы успешно зарегистрировались и на них отреплицировались глобальные мастерные объекты.&lt;/p&gt;\n&lt;p&gt;Сообщение об успехе регистрации нужно искать в логах первичного селла: \"Master cell registered\".&lt;br /&gt;\nА сообщения о репликации объектов — в логах новых, только что добавленных, мастерных селлов: \"Foreign object created\" (возможно потребуется подождать пару минут, пока они появятся). Также следует учесть, что объектов на кластере может быть много, и стоит подождать именно окончания репликации глобальных объектов (дождаться, когда фон сообщений \"Foreign object created\" прекратится).&lt;/p&gt;\n&lt;h3 id=\"12-dozhdatsya-shtatnoj-raboty-master-serverov\"&gt;&lt;a href=\"ru/admin-guide/cell-addition.html#12-dozhdatsya-shtatnoj-raboty-master-serverov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;12. Дождаться штатной работы мастер-серверов&lt;/span&gt;&lt;/a&gt;12. Дождаться штатной работы мастер-серверов&lt;/h3&gt;\n&lt;p&gt;Стоит убедиться, что все мастер-сервера находятся в режиме штатной работы, включая другие вторичные селлы, если такие есть.&lt;/p&gt;\n&lt;p&gt;Можно поискать в логах сообщения \"Leader active\"/\"Follower active\".&lt;/p&gt;\n&lt;h3 id=\"13-propisat-novym-sellam-roli\"&gt;&lt;a href=\"ru/admin-guide/cell-addition.html#13-propisat-novym-sellam-roli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;13. Прописать новым селлам роли&lt;/span&gt;&lt;/a&gt;13. Прописать новым селлам роли&lt;/h3&gt;\n&lt;p&gt;Вторичные мастерные селлы нужны для шардирования нагрузки, а шардировать нагрузку мы умеем разными способами. Здесь нужно выбрать, какой именно работой будет заниматься новый селл.&lt;/p&gt;\n&lt;p&gt;Виды ролей на текущий момент:&lt;br /&gt;\n*&lt;code&gt;chunk_host&lt;/code&gt; — шардирование по чанкам, уносит на селл работу с чанками таблиц. Самая популярная и некогда дефолтная роль. После указания роли на селл автоматически начнут селиться новые чанки.&lt;br /&gt;\n*&lt;code&gt;cypress_node_host&lt;/code&gt; — шардирование дерева метаинформации, позволяет уносить на этот селл поддеревья Кипариса (это требует ручных действий, данная роль дает такую возможность, но никакой автоматики в этом месте нет). Изложение процедуры вынесения поддеревьев на отдельный селл выходит за рамки данной статьи.&lt;br /&gt;\n*&lt;code&gt;transaction_coordinator&lt;/code&gt; — шардирование работы с транзакциями.&lt;/p&gt;\n&lt;p&gt;Если вы не знаете, что делать, то скорее всего лучше заставить новые селлы хостить чанки (chunk_host). Две других роли нужны только для очень крупных кластеров.&lt;/p&gt;\n&lt;p&gt;Прописать новые роли нужно в &lt;code&gt;//sys/@config/multicell_manager/cell_descriptors&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;//sys/@config/multicell_manager/cell_descriptors/{cell_tag}/roles\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"165\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-165\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-165\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-165.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Стоит помнить, что прокси-сервера на данный момент недоступны, и любые обращения к Кипарису возможны лишь через корректно сконфигурированный нативный клиент. Обычно такой клиент можно найти в контейнере мастера.&lt;/p&gt;\n&lt;p&gt;Прописать роли можно позже, но важно не забыть об этом — если этого не сделать, то новые селлы ничем полезным заниматься не будут.&lt;/p&gt;\n&lt;h3 id=\"14-podnyat-nody-na-versiyu-s-novym-konfigom\"&gt;&lt;a href=\"ru/admin-guide/cell-addition.html#14-podnyat-nody-na-versiyu-s-novym-konfigom\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;14. Поднять ноды (на версию с новым конфигом)&lt;/span&gt;&lt;/a&gt;14. Поднять ноды (на версию с новым конфигом)&lt;/h3&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Этот шаг — точка невозврата. В теории, до этого момента, если что-то пошло не так, добавление селлов еще можно откатить. После выполнения этого шага откатить добавление селлов без потери данных уже нельзя.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"15-dopisat-novye-selly-v-cluster-connection\"&gt;&lt;a href=\"ru/admin-guide/cell-addition.html#15-dopisat-novye-selly-v-cluster-connection\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;15. Дописать новые селлы в cluster connection&lt;/span&gt;&lt;/a&gt;15. Дописать новые селлы в cluster connection&lt;/h3&gt;\n&lt;p&gt;Cluster connection живет в Кипарисе, по пути &lt;code&gt;//sys/@cluster_connection/secondary_masters&lt;/code&gt;.&lt;br /&gt;\nПрописывать селлы нужно вот в таком формате:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;[\n        {\n            &lt;span class=\"hljs-string\"&gt;\"addresses\"&lt;/span&gt; = [\n                &lt;span class=\"hljs-string\"&gt;\"some_master_address:9010\"&lt;/span&gt;;\n            ];\n            &lt;span class=\"hljs-string\"&gt;\"cell_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"1-2-3-4\"&lt;/span&gt;;\n        };\n];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"191\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-191\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-191\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-191.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Новые селлы нужно именно добавить, в случае, если на кластере уже есть вторичные мастерные селлы, новые стоит просто дописать в конец списка. Рекомендуется на всякий случай сохранить куда-нибудь старый cluster_connection перед его изменением.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"16-vklyuchit-chunk-refresh-i-chunk-requisition-update\"&gt;&lt;a href=\"ru/admin-guide/cell-addition.html#16-vklyuchit-chunk-refresh-i-chunk-requisition-update\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;16. Включить chunk refresh и chunk requisition update&lt;/span&gt;&lt;/a&gt;16. Включить chunk refresh и chunk requisition update&lt;/h3&gt;\n&lt;p&gt;Если вы не выключали их на шаге 2, то этот шаг стоит пропустить.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/@config/chunk_manager/enable_chunk_refresh %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/@config/chunk_manager/enable_chunk_requisition_update %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"208\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-208\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-208\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-208.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"17-dozhdatsya,-poka-vse-nody-zaregistriruyutsya-i-dlya-chankov-sojdetsya-refresh\"&gt;&lt;a href=\"ru/admin-guide/cell-addition.html#17-dozhdatsya,-poka-vse-nody-zaregistriruyutsya-i-dlya-chankov-sojdetsya-refresh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;17. Дождаться, пока все ноды зарегистрируются и для чанков сойдется refresh&lt;/span&gt;&lt;/a&gt;17. Дождаться, пока все ноды зарегистрируются и для чанков сойдется refresh&lt;/h3&gt;\n&lt;p&gt;В зависимости от количества нод и чанков на кластере этот шаг может занимать существенное время.&lt;/p&gt;\n&lt;h3 id=\"18-podnyat-ostalnye-komponenty\"&gt;&lt;a href=\"ru/admin-guide/cell-addition.html#18-podnyat-ostalnye-komponenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;18. Поднять остальные компоненты&lt;/span&gt;&lt;/a&gt;18. Поднять остальные компоненты&lt;/h3&gt;\n&lt;p&gt;Поднять прокси, шедулеры, контроллер-агенты и другие компоненты (если такие остались).&lt;br /&gt;\nКомпоненты нужно поднимать на версию с новым конфигом.&lt;/p&gt;\n&lt;h3 id=\"19-dozhdatsya-perehoda-klastera-v-rezhim-shtatnoj-raboty\"&gt;&lt;a href=\"ru/admin-guide/cell-addition.html#19-dozhdatsya-perehoda-klastera-v-rezhim-shtatnoj-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;19. Дождаться перехода кластера в режим штатной работы&lt;/span&gt;&lt;/a&gt;19. Дождаться перехода кластера в режим штатной работы&lt;/h3&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/admin-guide/cell-addition.md","sourcePath":"ru/admin-guide/cell-addition.md"},"headings":[{"title":"Подготовка","href":"ru/admin-guide/cell-addition.html#podgotovka","level":2},{"title":"Детальный план","href":"ru/admin-guide/cell-addition.html#detalnyj-plan","level":2,"items":[{"title":"1. Погасить шедулеры и контроллер-агенты","href":"ru/admin-guide/cell-addition.html#1-pogasit-shedulery-i-kontroller-agenty","level":3},{"title":"2. Выключить chunk refresh и chunk requisition update","href":"ru/admin-guide/cell-addition.html#2-vyklyuchit-chunk-refresh-i-chunk-requisition-update","level":3},{"title":"3. Погасить все ноды","href":"ru/admin-guide/cell-addition.html#3-pogasit-vse-nody","level":3},{"title":"4. Погасить все прокси","href":"ru/admin-guide/cell-addition.html#4-pogasit-vse-proksi","level":3},{"title":"5. Погасить все оставшиеся сервисы кроме мастер-серверов","href":"ru/admin-guide/cell-addition.html#5-pogasit-vse-ostavshiesya-servisy-krome-master-serverov","level":3},{"title":"6. Прописать пустые роли новым мастерным селлам","href":"ru/admin-guide/cell-addition.html#6-propisat-pustye-roli-novym-masternym-sellam","level":3},{"title":"7. Построить на мастер-серверах снапшот с read-only","href":"ru/admin-guide/cell-addition.html#7-postroit-na-master-serverah-snapshot-s-read-only","level":3},{"title":"8. Погасить мастер-сервера","href":"ru/admin-guide/cell-addition.html#8-pogasit-master-servera","level":3},{"title":"9. Поднять мастер-сервера, clock-сервера, мастер-кеши, timestamp-провайдеры, discovery сервера","href":"ru/admin-guide/cell-addition.html#9-podnyat-master-servera,-clock-servera,-master-keshi,-timestamp-provajdery,-discovery-servera","level":3},{"title":"10. Выйти из режима read-only","href":"ru/admin-guide/cell-addition.html#10-vyjti-iz-rezhima-read-only","level":3},{"title":"11. Дождаться регистрации новых селлов и репликации глобальных объектов","href":"ru/admin-guide/cell-addition.html#11-dozhdatsya-registracii-novyh-sellov-i-replikacii-globalnyh-obuektov","level":3},{"title":"12. Дождаться штатной работы мастер-серверов","href":"ru/admin-guide/cell-addition.html#12-dozhdatsya-shtatnoj-raboty-master-serverov","level":3},{"title":"13. Прописать новым селлам роли","href":"ru/admin-guide/cell-addition.html#13-propisat-novym-sellam-roli","level":3},{"title":"14. Поднять ноды (на версию с новым конфигом)","href":"ru/admin-guide/cell-addition.html#14-podnyat-nody-na-versiyu-s-novym-konfigom","level":3},{"title":"15. Дописать новые селлы в cluster connection","href":"ru/admin-guide/cell-addition.html#15-dopisat-novye-selly-v-cluster-connection","level":3},{"title":"16. Включить chunk refresh и chunk requisition update","href":"ru/admin-guide/cell-addition.html#16-vklyuchit-chunk-refresh-i-chunk-requisition-update","level":3},{"title":"17. Дождаться, пока все ноды зарегистрируются и для чанков сойдется refresh","href":"ru/admin-guide/cell-addition.html#17-dozhdatsya,-poka-vse-nody-zaregistriruyutsya-i-dlya-chankov-sojdetsya-refresh","level":3},{"title":"18. Поднять остальные компоненты","href":"ru/admin-guide/cell-addition.html#18-podnyat-ostalnye-komponenty","level":3},{"title":"19. Дождаться перехода кластера в режим штатной работы","href":"ru/admin-guide/cell-addition.html#19-dozhdatsya-perehoda-klastera-v-rezhim-shtatnoj-raboty","level":3}]}],"title":"Расширение мастер-сервера"},"router":{"pathname":"ru/admin-guide/cell-addition","depth":3,"base":"../../"},"lang":"ru","langs":
