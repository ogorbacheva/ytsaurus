шено. По умолчанию запрашивается одно HyperThreading ядро. Если вы явно установили &lt;code&gt;cpu_limit&lt;/code&gt; выше единицы, это означает, что операция не требует так много и использует CPU-квоту пула неэффективно. В таком случае рекомендуется уменьшить лимит для этой операции. Если же вы не устанавливали &lt;code&gt;cpu_limit&lt;/code&gt; выше единицы, то операция, вероятно, ожидает какой-то другой ресурс, чаще всего дисковый ввод-вывод. Тогда можно изучить &lt;a href=\"user-guide/problems/jobstatistics.html\"&gt;статистики&lt;/a&gt; работы джобов операции, профилировать джоб в процессе работы, чтобы понять, чем он занят.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"operationtoolong\"&gt;&lt;a href=\"ru/faq/index.html#operationtoolong\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: В ходе работы операции появилось предупреждение «Estimated duration of this operation is about ... days». Что это значит?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: В ходе работы операции появилось предупреждение «Estimated duration of this operation is about ... days». Что это значит?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Сообщение означает, что ожидаемое время завершения операции слишком велико. Ожидаемое время завершения рассчитывается на основе оптимистичной оценки завершения бегущих и ожидающих джобов. В силу того, что кластер иногда обновляется, и операции могут запускаться сначала, большое количество потраченных ресурсов могут пропасть зря. Рекомендуется разбивать операции на небольшие или искать способы существенно увеличить квоту, в которой запускается операция.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"schedulejobtimedout\"&gt;&lt;a href=\"ru/faq/index.html#schedulejobtimedout\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: В ходе работы операции появилось предупреждение «Scheduling job in controller of operation &amp;lt;operation_id&amp;gt; timed out». Что это значит?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: В ходе работы операции появилось предупреждение «Scheduling job in controller of operation &amp;lt;operation_id&amp;gt; timed out». Что это значит?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Сообщение означает, что контроллер операции не успевает за отведенное время запустить джоб операции. Такое может происходить, если операция очень тяжелая или планировщик сильно нагружен. Если вы считаете, что операция очень долго выполняется и много находится в starving состоянии, то следует сообщить об этом администратору системы.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"slot-index-collision\"&gt;&lt;a href=\"ru/faq/index.html#slot-index-collision\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: В ходе работы операции появилось предупреждение «Failed to assign slot index to operation». Что это значит?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: В ходе работы операции появилось предупреждение «Failed to assign slot index to operation». Что это значит?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Если такое произошло, то обратиться к администратору.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"unused-tmpfs-space\"&gt;&lt;a href=\"ru/faq/index.html#unused-tmpfs-space\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: В ходе работы операции появилось предупреждение «Operation has jobs that use less than F% of requested tmpfs size» Что это значит?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: В ходе работы операции появилось предупреждение «Operation has jobs that use less than F% of requested tmpfs size» Что это значит?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; В спецификации операции заказывается tmpfs для джобов (в атрибутах предупреждения можно узнать, для каких конкретно джобов), но не используется полностью (с некоторыми порогами). Размер tmpfs входит в memory limit, что означает, что джоб запрашивает много памяти, но в итоге ее не использует. Во-первых, это уменьшает реальную утилизацию памяти на кластере. Во-вторых, большие заказы tmpfs могут замедлять планирование джобов, так как найти на кластере слот с 1 Гб памяти гораздо проще, чем, например, слот на 15 Гб памяти. Следует заказывать столько tmpfs, сколько действительно нужно джобам. Реальное использование tmpfs джобами можно узнать в атрибутах предупреждения или посмотрев на &lt;a href=\"user-guide/problems/jobstatistics.html\"&gt;статистику&lt;/a&gt; &lt;code&gt;user_job/tmpfs_size&lt;/code&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"no-node-satisfy-demand\"&gt;&lt;a href=\"ru/faq/index.html#no-node-satisfy-demand\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При запуске операции получаю ошибку «No online node can satisfy the resource demand», что делать?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При запуске операции получаю ошибку «No online node can satisfy the resource demand», что делать?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Сообщение означает, что в кластере нет ни одного подходящего узла для того, чтобы запустить джобы операции. Такое бывает, например, в следующих случаях:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;У операции очень большие требования по CPU или памяти, такие что не хватит ресурсов целиком одного узла кластера. Например, если заказан 1Tb памяти или 1 000 CPU на джоб, то такая операция не отработает и клиент получит ошибку, так как в кластерах YTsaurus нет узлов с такими характеристиками;&lt;/li&gt;\n&lt;li&gt;Указан &lt;code&gt;scheduling_tag_filter&lt;/code&gt;, под который не подпадает ни один узел кластера.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"allowed-data-limit\"&gt;&lt;a href=\"ru/faq/index.html#allowed-data-limit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При запуске операции Merge, Reduce возникает ошибка «Maximum allowed data weight per sorted job exceeds the limit: xxx &amp;gt; yyy»&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При запуске операции Merge, Reduce возникает ошибка «Maximum allowed data weight per sorted job exceeds the limit: xxx &amp;gt; yyy»&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; При формировании джобов по оценке планировщика в один джоб приходит слишком много данных (сотни гигабайт), и у планировщика не получается сделать более мелкий джоб. Возможны следующие варианты:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;При использовании операции &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt;, если во входной таблице имеется ключ-монстр - когда одной записи в первой таблице соответствует очень большое число строк в другой таблице, то вследствие гарантий операции &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt; все строки с таким ключом обязаны прийти в один джоб, и такой джоб будет работать бесконечно долго. Стоит использовать &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt; с тривиальным mapper и с reduce combiner, чтобы предобработать ключи-монстры;&lt;/li&gt;\n&lt;li&gt;На входе операции много входных таблиц (100 и больше) из-за того, что чанки на границе диапазона учитываются неточно. Общее наблюдение заключается в том, что чем больше входных таблиц, тем меньше пользы от использования сортированного входа. Возможно, стоит воспользоваться операцией &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;При использовании операций &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt; такая ошибка возможна из-за неоптимальности работы планировщика. Следует обратиться на рассылку &lt;code&gt;community_ru@ytsaurus.tech&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Вне зависимости от предыдущих рекомендаций, если вы уверены, что хотите все равно запустить операцию и вы готовы к тому, что она может очень долго работать, можно указать параметр &lt;code&gt;max_data_weight_per_job&lt;/code&gt;, равный большему значению, и тогда операция запустится.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"new-partitions-count-larger\"&gt;&lt;a href=\"ru/faq/index.html#new-partitions-count-larger\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: В ходе работы операции появилось предупреждение «Partition count, estimated by the new partition heuristic, is significantly larger than old heuristic estimation. This may lead to inadequate number of partitions.» Что это значит?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: В ходе работы операции появилось предупреждение «Partition count, estimated by the new partition heuristic, is significantly larger than old heuristic estimation. This may lead to inadequate number of partitions.» Что это значит?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Новый алгоритм партицирования вычислил подозрительное количество партиций. Это может привести к большому количеству джобов, очень долгому исполнению операций, перерасходу квоты на промежуточные данные и т.п. Следует обратить внимание на правильность задания параметров в спеке операции. В первую очередь, на &lt;code&gt;map_selectivity_factor&lt;/code&gt;, &lt;code&gt;partition_data_size&lt;/code&gt; и &lt;code&gt;partition_count&lt;/code&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"legacy-live-preview-suppressed\"&gt;&lt;a href=\"ru/faq/index.html#legacy-live-preview-suppressed\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: В ходе работы операции появилось предупреждение «Legacy live preview suppressed«, а live preview недоступен. Что это значит?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: В ходе работы операции появилось предупреждение «Legacy live preview suppressed«, а live preview недоступен. Что это значит?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Live preview - тяжёлый механизм для мастер-серверов, поэтому он по умолчанию отключен для операций, запущенных от роботных пользователей.&lt;/p&gt;\n&lt;p&gt;Если вы хотите форсировать включение live preview, воспользуйтесь опцией &lt;code&gt;enable_legacy_live_preview = %true&lt;/code&gt; в спеке операции.&lt;/p&gt;\n&lt;p&gt;Если хотите отключить данное предупреждение, воспользуйтесь опцией &lt;code&gt;enable_legacy_live_preview = %false&lt;/code&gt; в спеке операции.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"unicode-above-255\"&gt;&lt;a href=\"ru/faq/index.html#unicode-above-255\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При работе джобов, написанных с использованием пакета ytsaurus-client, возникает ошибка \"Unicode symbols above 255 are not supported\". Что делать?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При работе джобов, написанных с использованием пакета ytsaurus-client, возникает ошибка \"Unicode symbols above 255 are not supported\". Что делать?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Следует прочитать в разделе &lt;a href=\"user-guide/storage/formats.html#json\"&gt;Форматы&lt;/a&gt; про формат JSON. Можно либо отказаться от использования JSON в пользу &lt;a href=\"user-guide/storage/formats.html#yson\"&gt;YSON&lt;/a&gt;, либо указать &lt;code&gt;encode_utf8=false&lt;/code&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"over-dynamic-store-retries\"&gt;&lt;a href=\"ru/faq/index.html#over-dynamic-store-retries\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Из-за чего возникает ошибка «Too many dynamic store locate retries failed»?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Из-за чего возникает ошибка «Too many dynamic store locate retries failed»?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Если во входе операции есть динамическая таблица с установленным атрибутом &lt;code&gt;enable_dynamic_store_read&lt;/code&gt;, джобы будут читать данные напрямую с таблетных нод, на которых расположена динамическая таблица. Подробнее об этой опции можно прочитать в разделе &lt;a href=\"user-guide/dynamic-tables/mapreduce.html\"&gt;MapReduce по динамическим таблицам&lt;/a&gt;. Если таблетные ноды долгое время оказываются недоступны, возникает вышеупомянутая ошибка. Проверьте, не идут ли на кластере работы, затрагивающие динамические таблицы. Также проверьте, что бандл, к которому относится таблица, находится в рабочем состоянии (плашка &lt;strong&gt;Good&lt;/strong&gt; в интерфейсе).&lt;/p&gt;\n&lt;h2 id=\"storage\"&gt;&lt;a href=\"ru/faq/index.html#storage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вопросы по хранению данных&lt;/span&gt;&lt;/a&gt;Вопросы по хранению данных&lt;/h2&gt;\n&lt;h4 id=\"structure-in-cell\"&gt;&lt;a href=\"ru/faq/index.html#structure-in-cell\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Можно ли положить в ячейку таблицы произвольную YSON-структуру?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Можно ли положить в ячейку таблицы произвольную YSON-структуру?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Можно, для этого подходят колонки типа &lt;code&gt;any&lt;/code&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"change-table-schema\"&gt;&lt;a href=\"ru/faq/index.html#change-table-schema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Можно ли изменять схему таблицы?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Можно ли изменять схему таблицы?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Можно, примеры и ограничения можно найти в разделе &lt;a href=\"user-guide/storage/static-schema.html#create\"&gt;Схема таблиц&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"file-size-limit\"&gt;&lt;a href=\"ru/faq/index.html#file-size-limit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Насколько большие файлы поддерживает система?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Насколько большие файлы поддерживает система?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Формально длина файла ограничена лишь 64-битным целым типом. Фактически — размером свободного места на узлах кластера. Поскольку файл делится на чанки, то он не обязан храниться на одном узле, поэтому он может превышать размер одного жесткого диска. Настолько большие файлы не могут обрабатываться одним джобом, поэтому работа с ними будет сводиться к использованию команды read_file и чтению по диапазонам.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"move-table\"&gt;&lt;a href=\"ru/faq/index.html#move-table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как переложить таблицу с HDD на SSD?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как переложить таблицу с HDD на SSD?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Изменение типа носителя для таблицы или файла осуществляется путём редактирования первичного медиума таблицы через атрибут &lt;code&gt;primary_medium&lt;/code&gt;. Перед тем, как изменять данный атрибут, таблицу нужно отмонтировать (а в конце смонтировать назад, чтобы вернуть все в прежнее состояние). Например:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt unmount-table --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt; //home/path/to/table\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/path/to/table/@primary_medium ssd_blobs\nyt mount-table --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt; //home/path/to/table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"861\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-861\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-861\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-861.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Сразу после выставления атрибута новые данные будут записываться на SSD, старые данные будут переложены в фоне. Подробнее о том, как влиять на данный процесс и отслеживать его динамику, в разделе &lt;a href=\"user-guide/storage/static-tables.html#medium\"&gt;статические таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"slow-table-read\"&gt;&lt;a href=\"ru/faq/index.html#slow-table-read\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Что делать, если чтение таблицы тормозит?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Что делать, если чтение таблицы тормозит?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Про это есть &lt;a href=\"user-guide/problems/slow-read.html\"&gt;отдельная страница&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"reduce-chunk-usage\"&gt;&lt;a href=\"ru/faq/index.html#reduce-chunk-usage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как уменьшить число используемых чанков в своей квоте?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как уменьшить число используемых чанков в своей квоте?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Если эти чанки занимают таблицы (а это типичный случай), то следует запустить операцию &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt; с параметром &lt;code&gt;combine_chunks = %true&lt;/code&gt;.&lt;br /&gt;\nТаблица будет пересобрана из более крупных чанков, тем самым можно уменьшить использование чанков в своей квоте. Из командной строки операцию можно запустить командой, заменив &lt;code&gt;src table&lt;/code&gt; и &lt;code&gt;dst table&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;yt merge --src table --dst table --spec \"{combine_chunks=true}\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"879\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-879\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-879\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-879.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Существует возможность контролировать потребление чанков и без запуска отдельной операции, Подробнее можно прочитать в разделе Автоматическое слияние чанков на выходе операций.&lt;/p&gt;\n&lt;p&gt;Также в некоторых случаях большое количество чанков может потребляться файлами. Например, когда к существующим файлам постоянно дописываются небольшие фрагменты. В настоящий момент нет готовых способов, аналогичных операции Merge, для выполнения объединения чанков файлов. Можно выполнить комбинацию &lt;code&gt;yt read-file //path/to/file | yt write-file //path/to/file&lt;/code&gt;. При этом весь поток данных пойдет через клиента.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"yamreddsv-disabled\"&gt;&lt;a href=\"ru/faq/index.html#yamreddsv-disabled\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Получаю ошибку: Format \"YamredDsv\" is disabled. Что делать?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Получаю ошибку: Format \"YamredDsv\" is disabled. Что делать?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Формат &lt;code&gt;YAMRED_DSV&lt;/code&gt; больше не поддерживается. Стоит воспользоваться другим &lt;a href=\"user-guide/storage/formats.html#formaty-predstavleniya-tablichnyh-dannyh\"&gt;форматом&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"dynamic_tables\"&gt;&lt;a href=\"ru/faq/index.html#dynamic_tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вопросы по динамическим таблицам&lt;/span&gt;&lt;/a&gt;Вопросы по динамическим таблицам&lt;/h2&gt;\n&lt;h1&gt;FAQ&lt;/h1&gt;\n&lt;h4 id=\"sticky-transaction\"&gt;&lt;a href=\"ru/faq/index.html#sticky-transaction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При работе с динамическими таблицами из Python API или C++ API получаю ошибку «Sticky transaction 1935-3cb03-4040001-e8723e5a is not found», что делать?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При работе с динамическими таблицами из Python API или C++ API получаю ошибку «Sticky transaction 1935-3cb03-4040001-e8723e5a is not found», что делать?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Ответ зависит от того, как используются транзакции. Если используется мастерная транзакция, то это бессмысленное действие, в таком случае необходимо задавать запрос вне транзакции, для этого можно либо создать отдельный клиент, либо явно указать, что запускаться под нулевой транзакций (&lt;code&gt;with client.Transaction(transaction_id=\"0-0-0-0\"): ...&lt;/code&gt;).&lt;br /&gt;\nПолноценное использование таблетных транзакций в Python API возможно только через RPC-proxy (&lt;code&gt;yt.config['backend'] = 'rpc'&lt;/code&gt;). Использование таблетных транзакций через HTTP невозможно в текущей реализации.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"tablet-memory\"&gt;&lt;a href=\"ru/faq/index.html#tablet-memory\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При записи в динамическую таблицу возникает ошибка «Node is out of tablet memory; all writes disabled» или «Active store is overflown, all writes disabled». Что она означает и как с ней бороться?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При записи в динамическую таблицу возникает ошибка «Node is out of tablet memory; all writes disabled» или «Active store is overflown, all writes disabled». Что она означает и как с ней бороться?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Ошибка возникает, когда на узле кластера заканчивается память для хранения данных, не записанных на диск. Входной поток данных слишком велик, узел кластера не успевает выполнять сжатие и запись на диск. Запросы с подобными ошибками необходимо повторять, возможно с увеличивающейся задержкой. Если ошибка возникает постоянно, то это может означать (помимо случаев нештатной работы), что либо отдельные таблеты перегружены нагрузкой по записи, либо мощности кластера недостаточно, чтобы справиться с данной нагрузкой. Также может помочь увеличение количества таблетов в таблице (команда &lt;code&gt;reshard-table&lt;/code&gt;).&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"overlapping-stores\"&gt;&lt;a href=\"ru/faq/index.html#overlapping-stores\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Что значит сообщение «Too many overlapping stores»? Что делать?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Что значит сообщение «Too many overlapping stores»? Что делать?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Данное сообщение об ошибке значит, что структура таблета такова, что покрытие сторами (dynamic store) обслуживаемого таблетом интервала ключей слишком плотное. Плотное покрытие сторами ведет к деградации производительности чтения, поэтому в данной ситуации включается защитный механизм, препятствующий записи новых данных. Постепенно фоновые процессы компактификации и партицирования должны нормализовать структуру таблета; если этого не происходит, то, возможно, кластер не справляется с нагрузкой.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"block-size-limit\"&gt;&lt;a href=\"ru/faq/index.html#block-size-limit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При запросе в динамическую таблицу получаю ошибку «Maximum block size limit violated»&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При запросе в динамическую таблицу получаю ошибку «Maximum block size limit violated»&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; В запросе участвует динамическая таблица, когда-то сконвертированная из статической. При этом не был указан параметр &lt;code&gt;block_size&lt;/code&gt;. При получении подобной ошибки убедитесь, что выполняете все указания из &lt;a href=\"user-guide/dynamic-tables/mapreduce.html\"&gt;раздела&lt;/a&gt;, посвящённого конвертации статической таблицы в динамическую. Если размер блока получается большим, то следует увеличить &lt;code&gt;max_unversioned_block_size&lt;/code&gt; до 32 мегабайт и перемонтировать таблицу. Так может быть, если в ячейках таблицы хранятся больше бинарные данные, а они целиком попадают в один блок.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"overlapping-stores-tablet\"&gt;&lt;a href=\"ru/faq/index.html#overlapping-stores-tablet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При запросе в динамическую таблицу получаю ошибку «Too many overlapping stores in tablet»&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При запросе в динамическую таблицу получаю ошибку «Too many overlapping stores in tablet»&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Скорее всего, таблет не справляется с потоком записи — новые чанки не успевают компактифицироваться. Следует проверить, пошардирована ли таблица на достаточное число таблетов. При записи данных в пустую таблицу стоит отключить автошардирование, поскольку маленькие таблеты будут объединяться в один.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"active-store-overflown\"&gt;&lt;a href=\"ru/faq/index.html#active-store-overflown\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При запросе в динамическую таблицу получаю ошибку «Active store is overflown, all writes disabled»&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При запросе в динамическую таблицу получаю ошибку «Active store is overflown, all writes disabled»&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Таблет не справляется с потоком записи — либо не успевает сбрасывать данные на диск, либо по каким-то причинам не может этого сделать. Следует проверить, нет ли ошибок в атрибуте таблицы &lt;code&gt;@tablet_errors&lt;/code&gt;, если нет, то, аналогично предыдущему пункту, проверить шардирование.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"too-many-stores\"&gt;&lt;a href=\"ru/faq/index.html#too-many-stores\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При запросе в динамическую таблицу получаю ошибку «Too many stores in tablet, all writes disabled»&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При запросе в динамическую таблицу получаю ошибку «Too many stores in tablet, all writes disabled»&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Слишком большой таблет. Необходимо добиться, того чтобы у таблицы стало больше таблетов. Обратите внимание, что &lt;a href=\"user-guide/dynamic-tables/tablet-balancing.html\"&gt;автошардирование&lt;/a&gt; ограничивает число таблетов числом селлов, умноженном на значение параметра &lt;code&gt;tablet_balancer_config/tablet_to_cell_ratio&lt;/code&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"tablet-not-known\"&gt;&lt;a href=\"ru/faq/index.html#tablet-not-known\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При запросе в динамическую таблицу получаю ошибку «Tablet ... is not known»&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При запросе в динамическую таблицу получаю ошибку «Tablet ... is not known»&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Клиент отправил запрос на узел кластера, таблет на котором уже не обслуживается. Как правило, такое происходит в результате автоматической балансировки таблетов или перезапуска узлов кластера. Необходимо повторно отправить запрос, ошибка исчезнет сама после обновления кеша, либо отключать балансировку.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"service-not-known\"&gt;&lt;a href=\"ru/faq/index.html#service-not-known\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При запросе в динамическую таблицу получаю ошибку «Service is not known»&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При запросе в динамическую таблицу получаю ошибку «Service is not known»&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Клиент отправил запрос на узел кластера, таблет-селл на котором уже не обслуживается. Как правило, такое происходит при перебалансировке селлов. Необходимо повторно отправить запрос, ошибка исчезнет сама после обновления кеша.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"chunk-data-not-preloaded\"&gt;&lt;a href=\"ru/faq/index.html#chunk-data-not-preloaded\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При запросе в динамическую таблицу получаю ошибку «Chunk data is not preloaded yet»&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При запросе в динамическую таблицу получаю ошибку «Chunk data is not preloaded yet»&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Сообщение характерно для таблицы с параметром &lt;code&gt;in_memory_mode&lt;/code&gt;, отличным от &lt;code&gt;none&lt;/code&gt;. Такая таблица в смонтированном состоянии всегда находится в памяти. Для того чтобы читать из такой таблицы, все данные должны быть загружены в память. Если таблица была только что смонтирована, таблет был перемещен в другой селл, или был перезапуск процесса YTsaurus, то данных в памяти нет, и возникает подобная ошибка. Необходимо подождать загрузки данных в память фоновым процессом.&lt;/p&gt;\n&lt;p&gt;Таблеты могут перемещаться в другие селлы в результате &lt;a href=\"user-guide/dynamic-tables/tablet-balancing.html\"&gt;автоматического шардирования&lt;/a&gt;. Такие перемещения можно увидеть на графике \"Tablet balancer moves\" на странице бандла. При необходимости вы можете изменить расписание автоматического шардирования. В этом случае нужно подобрать такое расписание, чтобы таблица продолжила держать вашу нагрузку.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"too-many-timestamps\"&gt;&lt;a href=\"ru/faq/index.html#too-many-timestamps\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: В tablet_errors вижу ошибку «Too many write timestamps in a versioned row» или «Too many delete timestamps in a versioned row»&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: В tablet_errors вижу ошибку «Too many write timestamps in a versioned row» или «Too many delete timestamps in a versioned row»&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; В сортированных динамических таблицах одновременно хранится много версий одного и того же значения. В lookup формате у каждого ключа может быть не более 2^16 версий. В качестве простого решения можно использовать поколоночный формат (&lt;code&gt;@optimize_for = scan&lt;/code&gt;). На практике такое большое число версий не нужно, они возникают вследствие неправильной конфигурации или программной ошибки. Например, при указании &lt;code&gt;atomicity=none&lt;/code&gt; можно обновлять один и тот же ключ таблицы с огромной частотой (в данном режиме не происходит блокировки строк и транзакции с пересекающимся диапазоном времени могут обновлять один и тот же ключ). Так делать не рекомендуется. Если же запись большого числа версий вызвана продуктовой необходимостью, например, частые записи дельт в агрегирующих колонках, стоит выставить атрибут таблицы &lt;code&gt;@merge_rows_on_flush=%true&lt;/code&gt; и корректно &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html#remove_old_data\"&gt;настроить удаление данных по TTL&lt;/a&gt;, чтобы при флаше в чанк записывалось только небольшое число реально необходимых версий.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"excessive-input\"&gt;&lt;a href=\"ru/faq/index.html#excessive-input\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При запросе Select Rows получаю ошибку 'Query terminated prematurely due to excessive input; consider rewriting your query or changing input limit'&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При запросе Select Rows получаю ошибку 'Query terminated prematurely due to excessive input; consider rewriting your query or changing input limit'&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Такая ошибка возникает, если при выполнении запроса было прочитано слишком много данных.&lt;/p&gt;\n&lt;p&gt;Необходимо проверить следующее:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;В секции запроса &lt;code&gt;WHERE&lt;/code&gt; указан префикс первичного ключа таблицы. Если это не сделано, то &lt;a href=\"user-guide/dynamic-tables/dyn-query-language.html#input_data_cut\"&gt;отсечение входных данных&lt;/a&gt; выполнить не получится, и запрос не получится эффективно выполнить (запрос будет выполняться, как full scan);&lt;/li&gt;\n&lt;li&gt;Если в запросе есть &lt;code&gt;JOIN&lt;/code&gt;, убедитесь, что он выполняется &lt;a href=\"user-guide/dynamic-tables/dyn-query-language.html#joins\"&gt;с использованием индекса&lt;/a&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Необходимо переписать запрос так, чтобы он работал эффективно. Для отладки запроса можно воспользоваться командой &lt;a href=\"user-guide/dynamic-tables/dyn-query-language.html#explain_query\"&gt;explain&lt;/a&gt;.&lt;br /&gt;\nПочинить ошибку в моменте можно поднятием &lt;code&gt;input_row_limit&lt;/code&gt;, но это не решит вашу проблему целиком.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"maximum-expression-depth\"&gt;&lt;a href=\"ru/faq/index.html#maximum-expression-depth\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При запросе Select Rows получаю ошибку 'Maximum expression depth exceeded'&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При запросе Select Rows получаю ошибку 'Maximum expression depth exceeded'&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Такая ошибка возникает, если глубина дерева разбора выражения получается слишком большой. Как правило, такое происходит при написании выражений вида&lt;br /&gt;\n&lt;code&gt;FROM [...] WHERE (id1=\"a\" AND id2=\"b\") OR (id1=\"c\" AND id2=\"d\") OR ... &amp;lt;несколько тысяч условий&amp;gt;&lt;/code&gt;&lt;br /&gt;\nВместо этого их нужно задавать в форме &lt;code&gt;FROM [...] WHERE (id1, id2) IN ((\"a\", \"b\"), (\"c\", \"b\"), ...)&lt;/code&gt;&lt;br /&gt;\nС первым вариантом есть несколько проблем. Дело в том, что запросы компилируются в машинный код. Машинный код для запросов кешируются так, что ключом служит структура запроса без учета констант.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;В первом случае при увеличении количества условий структура запроса будет постоянно меняться. Будет кодогенерация на каждый запрос.&lt;/li&gt;\n&lt;li&gt;Первый запрос будет порождать очень большое количество кода.&lt;/li&gt;\n&lt;li&gt;Компиляция запроса будет очень медленной.&lt;/li&gt;\n&lt;li&gt;Первый случай будет работать просто проверкой всех условий. Никакой трансформации в более сложный алгоритм там не предусмотрено.&lt;/li&gt;\n&lt;li&gt;Кроме этого, если колонки ключевые, для них выводятся диапазоны чтения, чтобы читать только нужные данные. Алгоритм вывода диапазонов чтения будет более оптимально работать для варианта с IN.&lt;/li&gt;\n&lt;li&gt;В случае с IN при проверке условия будет поиск по хеш таблице.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"value-too-long\"&gt;&lt;a href=\"ru/faq/index.html#value-too-long\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Работе с динамической таблице получаю ошибку 'Value is too long'&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Работе с динамической таблице получаю ошибку 'Value is too long'&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Есть довольно жесткие лимиты на размер значений в динамических таблицах. Размер одного значения (ячейки таблицы) не должен превосходить 16 МБ, а длина всей строки - 128 МБ и 512 МБ с учётом всех версий. Всего в строке может быть не более 1024 значений с учётом всех версий. Также есть ограничения на количество строк в запросах, которое по умолчанию равно 100000 строк в транзакции при вставке, миллион строк при select и 5 миллионов при lookup. Обратим внимание, что приближение к пороговым значениям может вызвать нестабильную работу. Если вы выходите за ограничение, нужно пересмотреть хранение данных в динамической таблице, не хранить такие длинные строки.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"clear-replicated-table-cli\"&gt;&lt;a href=\"ru/faq/index.html#clear-replicated-table-cli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как очистить реплицированную таблицу с помощью CLI?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как очистить реплицированную таблицу с помощью CLI?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Реплицированную таблицу нельзя очистить атомарно, но вы можете очистить отдельные реплики с помощью операции &lt;a href=\"user-guide/data-processing/operations/erase.html\"&gt;Erase&lt;/a&gt;. Для этого понадобится &lt;a href=\"user-guide/dynamic-tables/bulk-insert.html\"&gt;включить&lt;/a&gt; так называемый «bulk insert» для всего кластера, выставив:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;//sys/@config/tablet_manager/enable_bulk_insert&lt;/code&gt; в &lt;code&gt;%true&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;//sys/controller_agents/config/enable_bulk_insert_for_everyone&lt;/code&gt; в &lt;code&gt;%true&lt;/code&gt; (обратите внимание на отсутствие &lt;code&gt;@&lt;/code&gt;)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Если последний указанный узел не существует, создайте его с помощью команды:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt create document //sys/controller_agents/config --attributes &lt;span class=\"hljs-string\"&gt;'{value={}}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1071\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1071\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1071\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1071.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"timed-out-blocked-row\"&gt;&lt;a href=\"ru/faq/index.html#timed-out-blocked-row\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При чтении из динамической таблицы получаю ошибку 'Timed out waiting on blocked row'&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При чтении из динамической таблицы получаю ошибку 'Timed out waiting on blocked row'&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Ошибка возникает при конфликтах чтения-записи: вы пытаетесь читать по ключу, который затрагивается конкурирующей транзакцией. Система должна дождаться результата транзакции, чтобы гарантировать требуемый уровень изоляции между транзакциями.&lt;/p&gt;\n&lt;p&gt;Если вам не требуется строгая консистентность, вы можете &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables#chtenie-stroki\"&gt;ослабить&lt;/a&gt; уровень изоляции читающей транзакции.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"row-lock-conflict\"&gt;&lt;a href=\"ru/faq/index.html#row-lock-conflict\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При записи в динтаблицу получаю ошибку 'Row lock conflict due to concurrent ... write'&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При записи в динтаблицу получаю ошибку 'Row lock conflict due to concurrent ... write'&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Ошибка возникает при конфликтах записи: вы пытаетесь записать строку, которую заблокировала конкурирующая транзакция (это может быть как запись, так и явное взятие лока в транзакции). В некоторых случаях система может дать подсказку о том, что это за транзакция (например, при конфликтах записи-записи в атрибутах ошибки будет указан идентификатор транзакции).&lt;/p&gt;\n&lt;p&gt;В общем случае для того чтобы избавиться от конфликтов, вам нужно пересмотреть то, как устроена запись в динтаблицу с вашей стороны, чтобы избежать записи в один и тот же ключ из разных мест.&lt;/p&gt;\n&lt;p&gt;В некоторых сценариях может помочь ослабление &lt;a href=\"user-guide/dynamic-tables/transactions#conflicts\"&gt;гарантий&lt;/a&gt;: использование режимов &lt;code&gt;atomicity=none&lt;/code&gt; или shared write lock. Перед тем как пользоваться ослабленными гарантиями, обязательно изучите документацию и убедитесь, что побочные эффекты для вас не страшны.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"no-working-replicas\"&gt;&lt;a href=\"ru/faq/index.html#no-working-replicas\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При чтении из динтаблицы получаю ошибку 'No working in-sync replicas found for table'&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При чтении из динтаблицы получаю ошибку 'No working in-sync replicas found for table'&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Ошибка возникает при чтении из реплицированной или хаосной таблицы, когда не удаётся найти реплику, из которой можно осуществить чтение. Реплика должна удовлетворять следующим критериям:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Она должна содержать достаточно свежие данные. Если при чтении указан timestamp — на реплике должны быть данные до этого таймстампа. Если timestamp не указан, чтение должно производиться из &lt;em&gt;действительно синхронной&lt;/em&gt; реплики: той, у которой &lt;code&gt;mode=sync&lt;/code&gt; и которая точно содержит более старые данные. Более подробно см. в разделе &lt;a href=\"user-guide/dynamic-tables/replicated-dynamic-tables#garantii\"&gt;гарантии реплицированных динтаблиц&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Реплика должна быть работающей. Если клиент недавно получал ошибку от реплики, в следующий раз он попробует обратиться к другой. Реплики, с которых не удалось прочитать данные, указаны в атрибуте &lt;code&gt;banned_replicas&lt;/code&gt; наблюдаемой ошибки.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"chunk-view-cannot-be-remote-copied\"&gt;&lt;a href=\"ru/faq/index.html#chunk-view-cannot-be-remote-copied\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При попытке выполнить remote copy получаю ошибку 'Chunk view cannot be copied to remote cluster'&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При попытке выполнить remote copy получаю ошибку 'Chunk view cannot be copied to remote cluster'&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Некоторые действия с динамической таблицей, такие как решарды, могут ради дешевизны такого действия создавать обертки над чанками -- chunk view. И на текущий момент remote copy умеет копировать только обычные чанки, а не chunk view.&lt;br /&gt;\nЧтобы убрать chunk view из таблицы необходимо сделать специальную форсированную компактификацию, выставив в аттрибут &lt;code&gt;forced_chunk_view_compaction_revision&lt;/code&gt; значение 1, после чего выполнить &lt;code&gt;remount-table&lt;/code&gt;. Более подробно см. в разделе &lt;a href=\"user-guide/dynamic-tables/compaction#forced_compaction\"&gt;Форсированная компактификация&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"chyt\"&gt;&lt;a href=\"ru/faq/index.html#chyt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вопросы по CHYT YTsaurus&lt;/span&gt;&lt;/a&gt;Вопросы по CHYT YTsaurus&lt;/h2&gt;\n&lt;h4 id=\"chyt-cliques-explanation\"&gt;&lt;a href=\"ru/faq/index.html#chyt-cliques-explanation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Почему в CHYT есть клики, тогда как в обычном ClickHouse ничего похожего нет? Что такое клика?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Почему в CHYT есть клики, тогда как в обычном ClickHouse ничего похожего нет? Что такое клика?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Про это есть отдельная &lt;a href=\"user-guide/data-processing/chyt/general.html\"&gt;статья&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"connection-refused-error\"&gt;&lt;a href=\"ru/faq/index.html#connection-refused-error\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Получаю одну из ошибок «DB::NetException: Connection refused», «DB::Exception: Attempt to read after eof: while receiving packet from». Что это значит?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Получаю одну из ошибок «DB::NetException: Connection refused», «DB::Exception: Attempt to read after eof: while receiving packet from». Что это значит?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Типично такое означает, что процесс CHYT внутри операции Vanilla аварийно завершился. Можно посмотреть в UI операции на &lt;a href=\"user-guide/data-processing/chyt/cliques/ui.html\"&gt;счётчики&lt;/a&gt; числа aborted/failed джобов. Если есть недавние aborted-джобы по причине preemption, это значит, что клике не хватает ресурсов. Если есть недавние failed джобы, обратитесь к администратору системы.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"subquery-data-weight-limit\"&gt;&lt;a href=\"ru/faq/index.html#subquery-data-weight-limit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Получаю ошибку «Subquery exceeds data weight limit: XXX &amp;gt; YYY». Что это значит?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Получаю ошибку «Subquery exceeds data weight limit: XXX &amp;gt; YYY». Что это значит?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; смотрите опцию &lt;code&gt;max_data_weight_per_subquery&lt;/code&gt; в документации по &lt;a href=\"user-guide/data-processing/chyt/reference/configuration.html#yt\"&gt;конфигурации&lt;/a&gt; клики.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"save-to-table\"&gt;&lt;a href=\"ru/faq/index.html#save-to-table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как сохранять в таблицу?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как сохранять в таблицу?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Есть функции &lt;strong&gt;INSERT INTO&lt;/strong&gt; и &lt;strong&gt;CREATE TABLE&lt;/strong&gt;, Подробнее можно прочитать в разделе &lt;a href=\"user-guide/data-processing/chyt/yt-tables.html#save\"&gt;Отличие от ClickHouse.&lt;/a&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"load-geodictionaries-chyt\"&gt;&lt;a href=\"ru/faq/index.html#load-geodictionaries-chyt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как загрузить геословари в собственной клике?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как загрузить геословари в собственной клике?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; При старте любой клики можно указать опцию &lt;code&gt;--cypress-geodata-path&lt;/code&gt;, которая позволяет указать путь к геословарям в Кипарисе. Подробнее про эту опцию можно прочитать в статье &lt;a href=\"user-guide/data-processing/chyt/try-chyt.html\"&gt;Как попробовать&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"chyt-tzdatetime-handling\"&gt;&lt;a href=\"ru/faq/index.html#chyt-tzdatetime-handling\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: CHYT умеет обрабатывать даты в формате TzDatetime?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: CHYT умеет обрабатывать даты в формате TzDatetime?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; CHYT умеет обрабатывать даты в формате TzDatetime ровно в той же мере, в какой обычный ClickHouse. Хранить данные придётся в виде строк или чисел и конвертировать при чтении-записи. Пример извлечения даты:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;toDate(reinterpretAsInt64(reverse(unhex(&lt;span class=\"hljs-built_in\"&gt;substring&lt;/span&gt;(hex(payment_dt), &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;8&lt;/span&gt;)))))\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1165\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1165\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1165\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1165.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"how-to-set-ssd\"&gt;&lt;a href=\"ru/faq/index.html#how-to-set-ssd\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как переложить таблицу на SSD?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как переложить таблицу на SSD?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Для начала необходимо убедиться, что в вашем аккаунте в YTsaurus квота в медиуме &lt;strong&gt;ssd_blobs&lt;/strong&gt;. Для этого можно на странице аккаунтов переключить тип медиума на &lt;strong&gt;ssd_blobs&lt;/strong&gt; и ввести название своего аккаунта. Если квоты в медиуме &lt;strong&gt;ssd_blobs&lt;/strong&gt; нет, то ее можно запросить через специальную форму.&lt;/p&gt;\n&lt;p&gt;После получения квоты на медиуме &lt;strong&gt;ssd_blobs&lt;/strong&gt; необходимо изменить значение атрибута &lt;code&gt;primary_medium&lt;/code&gt;, данные будут в фоне переложены на соответствующий медиум. Подробнее можно прочитать в разделе про &lt;a href=\"faq/index.html#storage\"&gt;хранение&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Для статических таблиц можно форсировать перекладывание с помощью операции &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/dev/test_table/@primary_medium ssd_blobs\nyt merge --mode auto --spec &lt;span class=\"hljs-string\"&gt;'{\"force_transform\"=true;}'&lt;/span&gt; --src //home/dev/test_table --dst //home/dev/test_table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1179\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1179\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1179\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1179.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если таблица динамическая, для изменения медиума нужно предварительно отмонтировать таблицу,&lt;br /&gt;\nустановить атрибут, а затем смонтировать обратно:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt unmount-table //home/dev/test_table --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt;\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/dev/test_table/@primary_medium ssd_blobs\nyt mount-table //home/dev/test_table --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1183\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1183\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1183\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1183.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Дополнительно ускорить перекладывание можно с помощью &lt;a href=\"user-guide/dynamic-tables/overview.html#attributes\"&gt;forced_compaction&lt;/a&gt;, однако использование этого метода создаёт большую нагрузку на кластер и крайне не рекомендуется.&lt;/p&gt;\n&lt;p&gt;Для проверки того, что таблица действительно изменила медиум можно воспользоваться командой:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //home/dev/test_table/@chunk_media_statistics\n\n{\n    &lt;span class=\"hljs-string\"&gt;\"ssd_blobs\"&lt;/span&gt; = {\n        &lt;span class=\"hljs-string\"&gt;\"chunk_count\"&lt;/span&gt; = 2126;\n        &lt;span class=\"hljs-string\"&gt;\"uncompressed_data_size\"&lt;/span&gt; = 9667220402266;\n        &lt;span class=\"hljs-string\"&gt;\"compressed_data_size\"&lt;/span&gt; = 4954465956017;\n        &lt;span class=\"hljs-string\"&gt;\"data_weight\"&lt;/span&gt; = 10764306825793;\n        &lt;span class=\"hljs-string\"&gt;\"max_block_size\"&lt;/span&gt; = 6584787;\n    };\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1190\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1190\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1190\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1190.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"chyt-sample-support\"&gt;&lt;a href=\"ru/faq/index.html#chyt-sample-support\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Поддерживается ли конструкция SAMPLE языка ClickHouse?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Поддерживается ли конструкция SAMPLE языка ClickHouse?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; CHYT поддерживает конструкцию Sample. Отличие заключается в том, что CHYT игнорирует команду &lt;code&gt;OFFSET ...&lt;/code&gt;, таким образом нельзя получить выборку из другой части отобранных данных.&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs SQL\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;count&lt;/span&gt;(&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; \"//tmp/sample_table\" SAMPLE &lt;span class=\"hljs-number\"&gt;0.05&lt;/span&gt;;\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;count&lt;/span&gt;(&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; \"//tmp/sample_table\" SAMPLE &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;20&lt;/span&gt;;\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;count&lt;/span&gt;(&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; \"//tmp/sample_table\" SAMPLE &lt;span class=\"hljs-number\"&gt;100500&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1201\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1201\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1201\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1201.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"get-table-name-query\"&gt;&lt;a href=\"ru/faq/index.html#get-table-name-query\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как мне получить имя таблицы в запросе?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как мне получить имя таблицы в запросе?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Можно воспользоваться виртуальными колонками &lt;code&gt;$table_name&lt;/code&gt; и &lt;code&gt;$table_path&lt;/code&gt;. Подробнее про виртуальные колонки читайте в разделе &lt;a href=\"user-guide/data-processing/chyt/yt-tables.html##virtual_columns\"&gt;Работа с таблицами YTsaurus&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/faq/index.md","sourcePath":"ru/faq/index.md"},"headings":[{"title":"Общие вопросы","href":"ru/faq/index.html#common","level":2},{"title":"Вопросы по MapReduce","href":"ru/faq/index.html#map_reduce","level":2},{"title":"Вопросы по хранению данных","href":"ru/faq/index.html#storage","level":2},{"title":"Вопросы по динамическим таблицам","href":"ru/faq/index.html#dynamic_tables","level":2},{"title":"Вопросы по CHYT YTsaurus","href":"ru/faq/index.html#chyt","level":2}],"title":"FAQ"},"router":{"pathname":"ru/faq/index","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
