        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе собраны ответы на вопросы пользователей, возникающие при знакомстве или работе с системой YTsaurus.&lt;/p&gt;\n&lt;p&gt;Если вы не нашли ответа на свой вопрос в данном разделе, следует обратиться к разделу &lt;a href=\"user-guide/problems/howtoreport.html\"&gt;Как сообщать о проблеме&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"common\"&gt;&lt;a href=\"ru/faq/index.html#common\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общие вопросы&lt;/span&gt;&lt;/a&gt;Общие вопросы&lt;/h2&gt;\n&lt;h4 id=\"add-column-to-table\"&gt;&lt;a href=\"ru/faq/index.html#add-column-to-table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как добавить колонку в таблицу YTsaurus?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как добавить колонку в таблицу YTsaurus?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Необходимо получить текущую схему таблицы:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;yt get //home/maps-nmaps/production/pedestrian/address_tasks/@schema --format '&amp;lt;format=text&amp;gt;yson'&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;И заменить схему на новую:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt alter-table //home/maps-nmaps/testing/pedestrian/address_tasks --schema &lt;span class=\"hljs-string\"&gt;'&amp;lt;\"unique_keys\"=%false;\"strict\"=%true;&amp;gt;[{\"name\"=\"timestamp\";\"required\"=%false;\"type\"=\"uint64\";\"sort_order\"=\"ascending\";};{\"name\"=\"lon\";\"required\"=%false;\"type\"=\"double\";};{\"name\"=\"lat\";\"required\"=%false;\"type\"=\"double\";};{\"name\"=\"buildingId\";\"required\"=%false;\"type\"=\"string\";};{\"name\"=\"taskId\";\"required\"=%false;\"type\"=\"string\";};{\"name\"=\"pedestrianType\";\"required\"=%false;\"type\"=\"string\";};{\"name\"=\"buildingPerimeter\";\"required\"=%false;\"type\"=\"double\";};{\"name\"=\"buildingShape\";\"required\"=%false;\"type\"=\"string\";};]'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"21\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-21\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-21\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-21.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В YQL можно использовать выражение &lt;code&gt;UNION ALL&lt;/code&gt; для объединения новых данных с новой колонкой и старых данных из таблицы.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"change-schema-strict-error\"&gt;&lt;a href=\"ru/faq/index.html#change-schema-strict-error\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Получаю ошибку при попытке изменить схему таблицы - Changing «strict» from «false» to «true» is not allowed. Что делать?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Получаю ошибку при попытке изменить схему таблицы - Changing «strict» from «false» to «true» is not allowed. Что делать?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Нельзя поменять схему у непустой таблицы со слабой на строгую, так как для валидации подобного действия необходимо прочитать всю таблицу, чтобы убедиться, что данные соответствуют новой схеме. Проще всего создать новую таблицу и перезаписать данные из старой через read + write или запустив операцию &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"yt-console-authorization\"&gt;&lt;a href=\"ru/faq/index.html#yt-console-authorization\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как авторизоваться при работе с YT из консоли?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как авторизоваться при работе с YT из консоли?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Необходимо сохранить токен нужного пользователя в файл &lt;code&gt;~/.yt/token&lt;/code&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"reduce-replication-factor\"&gt;&lt;a href=\"ru/faq/index.html#reduce-replication-factor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Можно ли уменьшить коэффициент репликации у временных таблиц в native C++ wrapper?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Можно ли уменьшить коэффициент репликации у временных таблиц в native C++ wrapper?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Нет, в wrapper такая возможность не предусмотрена.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"bad-magic-number\"&gt;&lt;a href=\"ru/faq/index.html#bad-magic-number\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При использовании python wrapper возникает ошибка «ImportError: Bad magic number in ./modules/yt/init.pyc». Что делать?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При использовании python wrapper возникает ошибка «ImportError: Bad magic number in ./modules/yt/&lt;strong&gt;init&lt;/strong&gt;.pyc». Что делать?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Такая ошибка возникает при несоответствии версии python у клиента, где запускается скрипт, и на кластере. Используйте для запуска ту же версию python, что и на кластере. Определить текущую версию можно так:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt vanilla --tasks &lt;span class=\"hljs-string\"&gt;'{master = {job_count = 1; command = \"python --version &amp;gt;&amp;amp;2\"}}'&lt;/span&gt;\nPython 2.7.3\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"53\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-53\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-53\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-53.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Версия python может отличаться на разных узлах кластера. Надёжнее всего использовать свой &lt;a href=\"user-guide/data-processing/layers/layer-paths.html\"&gt;образ ФС&lt;/a&gt; для запуска джобов.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"reading-small-ranges-overhead\"&gt;&lt;a href=\"ru/faq/index.html#reading-small-ranges-overhead\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Каковы накладные расходы при чтении небольших диапазонов в таблицах и при чтении небольших таблиц?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Каковы накладные расходы при чтении небольших диапазонов в таблицах и при чтении небольших таблиц?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Небольшие диапазоны не создают накладных расходов, с диска читаются только релевантные блоки. При этом все чтения статических таблиц требуют запроса метаданных на мастер-сервере. Общение с мастер-сервером в данном случае является узким местом. В этом случае стоит читать статические таблицы меньшим числом запросов (более крупными частями), минимизировать нагрузку на мастер-сервер. Или перестроить свой процесс и читать из динамических таблиц.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"store-hex-numbers-keys\"&gt;&lt;a href=\"ru/faq/index.html#store-hex-numbers-keys\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Можно ли эффективно организовать хранение байтовых чисел (hex) в ключах вместо строк?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Можно ли эффективно организовать хранение байтовых чисел (hex) в ключах вместо строк?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Можно при использовании формата &lt;a href=\"user-guide/storage/formats.html#yson\"&gt;YSON&lt;/a&gt; или &lt;a href=\"user-guide/storage/formats.html#json\"&gt;JSON&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"logging-levels-console-client\"&gt;&lt;a href=\"ru/faq/index.html#logging-levels-console-client\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Каковы уровни логирования в консольном клиенте и как они задаются?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Каковы уровни логирования в консольном клиенте и как они задаются?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Уровни логирования в консольном клиенте задаются через переменную окружения &lt;code&gt;YT_LOG_LEVEL&lt;/code&gt;, по умолчанию принято значение &lt;code&gt;INFO&lt;/code&gt;. Изменить уровень логирования можно командой &lt;code&gt;export YT_LOG_LEVEL=WARNING&lt;/code&gt;. Доступны следующие уровни логирования:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;INFO&lt;/code&gt; — выводится прогресс выполнения операции и другая полезная информация;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;WARNING&lt;/code&gt; — выводятся предупреждения. Например, не удалось выполнить запрос, и он отправляется повторно, или входная таблица операции пуста. Подобные ошибки не критичны, и клиент может продолжать успешно работать;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ERROR&lt;/code&gt; — все ошибки, после которых клиент не может продолжить работу. Подобные ошибки приводят к исключению (Exception). Исключение обрабатывается, после чего клиент аварийно завершает работу с ненулевым кодом возврата.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"client-hangs-requeries\"&gt;&lt;a href=\"ru/faq/index.html#client-hangs-requeries\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При чтении с помощью команды read небольшой таблицы клиент повисает при перезапросах. В чем может быть дело?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При чтении с помощью команды read небольшой таблицы клиент повисает при перезапросах. В чем может быть дело?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Одна из возможных частых причин — слишком большое число (мелких) чанков в таблице. Следует запустить операцию &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt;, указав опцию &lt;code&gt;--spec '{force_transform=true}'&lt;/code&gt;. При появлении таких таблиц в результате работы операций консольный клиент выдает предупреждение, содержащее, помимо прочего, команду, которую можно выполнить для укрупнения чанков таблицы. Также можно указать опцию &lt;code&gt;auto_merge_output={action=merge}&lt;/code&gt;, в этом случае слияние будет выполняться автоматически.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"account-tmp-over-limit\"&gt;&lt;a href=\"ru/faq/index.html#account-tmp-over-limit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Операция завершилась с ошибкой «Account \"tmp\" is over disk space (или chunk) limit», в чем дело?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Операция завершилась с ошибкой «Account \"tmp\" is over disk space (или chunk) limit», в чем дело?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; На кластере закончилось место для хранения временных данных (аккаунт tmp), либо чанков в этом аккаунте стало слишком много. К данному аккаунту имеют доступ все пользователи кластера, так что возможно его переполнение. Данное обстоятельство необходимо учитывать и, если переполнение квоты tmp критично для ваших процессов, то для временных данных следует использовать другую директорию в собственном аккаунте. Некоторые API используют &lt;code&gt;//tmp&lt;/code&gt; как путь по умолчанию для хранения различных временных данных. В этом случае следует перенастроить их, чтобы использовались поддиректории внутри директории вашего проекта.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"account-intermediate-over-limit\"&gt;&lt;a href=\"ru/faq/index.html#account-intermediate-over-limit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Операция упала с ошибкой «Account \"intermediate\" is over disk space (или chunk) limit», в чем дело?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Операция упала с ошибкой «Account \"intermediate\" is over disk space (или chunk) limit», в чем дело?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; На кластере закончилось место для хранения промежуточных данных операций (аккаунт &lt;code&gt;intermediate&lt;/code&gt;), либо чанков в этом аккаунте стало слишком много.&lt;br /&gt;\nЕсли вы не указывали &lt;code&gt;intermediate_data_account&lt;/code&gt; (смотрите раздел &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Настройки операций&lt;/a&gt;, &lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;Sort&lt;/a&gt;, &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt;). Это значит, что вы делите данный аккаунт со всеми. Чтобы избежать этой проблемы, укажите &lt;code&gt;intermediate_data_account&lt;/code&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"consistent-read-operation\"&gt;&lt;a href=\"ru/faq/index.html#consistent-read-operation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Является ли чтение таблицы (или файла) в YTsaurus консистентной операцией? Что будет, если читать таблицу и одновременно с этим её удалить?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Является ли чтение таблицы (или файла) в YTsaurus консистентной операцией? Что будет, если читать таблицу и одновременно с этим её удалить?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; С одной стороны, является, то есть если операция чтения завершится успешно, то будут прочитаны ровно те данные, которые были в таблице или файле в момент запуска операции. С другой стороны, чтение может оборваться, если таблицу в это время удалить. Чтобы избежать последнего, необходимо создать транзакцию и взять в ней snapshot-lock на таблицу или файл. При использовании python API, в том числе python CLI и включенных retry при чтении, данная блокировка берется автоматически.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"backend-type-determination\"&gt;&lt;a href=\"ru/faq/index.html#backend-type-determination\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При запуске клиента получаю ошибку \"Cannot determine backend type: either driver config or proxy url should be specified\". Что делать?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При запуске клиента получаю ошибку \"Cannot determine backend type: either driver config or proxy url should be specified\". Что делать?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Проверьте, указана ли переменная окружения &lt;code&gt;YT_PROXY=&amp;lt;cluster-name&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"name-service-unknown\"&gt;&lt;a href=\"ru/faq/index.html#name-service-unknown\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Что делать, если запрос Python обёртки падает с \"gaierror(-2, 'Name or service not known')\"?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Что делать, если запрос Python обёртки падает с \"gaierror(-2, 'Name or service not known')\"?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Если возникла ошибка вида:&lt;br /&gt;\n&lt;code&gt;has failed with error &amp;lt;class 'yt.packages.requests.exceptions.ConnectionError'&amp;gt;, message: '('Connection aborted.', gaierror(-2, 'Name or service not known'))'&lt;/code&gt;,&lt;/p&gt;\n&lt;p&gt;Ошибка «Name or service not known» - это ошибка DNS, сообщающая о том, что запрошенная DNS запись не была найдена. Как правило это означает, что python-клиент попытался порезолвить адрес кластера или одного из его хостов и ему не удалось это сделать.&lt;/p&gt;\n&lt;h4 id=\"account-disk-space-limit\"&gt;&lt;a href=\"ru/faq/index.html#account-disk-space-limit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Что делать, если возникает ошибка «Account \"...\" is over disk space limit (node count limit, etc)»?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Что делать, если возникает ошибка «Account \"...\" is over disk space limit (node count limit, etc)»?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Сообщение говорит о том, что переполнилась одна из квот аккаунта. В системе действуют квоты на ресурсы различных видов. Подробнее о видах квот, а также формы для их изменения читайте в разделе &lt;a href=\"user-guide/storage/quotas.html\"&gt;Квоты&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"find-account-usage\"&gt;&lt;a href=\"ru/faq/index.html#find-account-usage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как найти, кто занимает место в аккаунте или все ноды с определённым аккаунтом?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как найти, кто занимает место в аккаунте или все ноды с определённым аккаунтом?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Попробуйте найти данные одним из этих способом:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Посмотрите в корзину (&lt;code&gt;//tmp/trash/by-account/&amp;lt;account_name&amp;gt;&lt;/code&gt;). Для этого стоит перейти по указанному пути в разделе &lt;strong&gt;Navigation&lt;/strong&gt; в веб-интерфейсе;&lt;/li&gt;\n&lt;li&gt;Поищите с помощью &lt;code&gt;yt find &amp;lt;path&amp;gt; --name \"*\" --account &amp;lt;account_name&amp;gt;&lt;/code&gt; таблицы под вашим аккаунтом в &lt;code&gt;//tmp&lt;/code&gt; и связных с вами проектных директориях. Обратите внимание, что &lt;code&gt;yt find&lt;/code&gt; не заходит в директории, в которые у вас нет доступа;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"change-table-account\"&gt;&lt;a href=\"ru/faq/index.html#change-table-account\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как изменить аккаунт таблицы?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как изменить аккаунт таблицы?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; &lt;code&gt;yt set //path/to/table/@account my-account&lt;/code&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"directory-resource-usage\"&gt;&lt;a href=\"ru/faq/index.html#directory-resource-usage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как узнать, сколько ресурсов занимает директория, включая все содержащиеся в ней таблицы, файлы и т. д.?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как узнать, сколько ресурсов занимает директория, включая все содержащиеся в ней таблицы, файлы и т. д.?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; &lt;code&gt;yt get //path/to/dir/@recursive_resource_usage&lt;/code&gt; или выбрать &lt;strong&gt;Show all resources&lt;/strong&gt; в разделе &lt;strong&gt;Navigation&lt;/strong&gt; в веб-интерфейсе.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"transaction-expired-aborted\"&gt;&lt;a href=\"ru/faq/index.html#transaction-expired-aborted\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При работе с системой возникла ошибка «Transaction has expired or was aborted». Что она означает и как с ней бороться?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При работе с системой возникла ошибка «Transaction has expired or was aborted». Что она означает и как с ней бороться?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; При создании мастер-транзакции указывается &lt;strong&gt;таймаут&lt;/strong&gt;, и пользователь обязуется посылать пинги транзакции не реже раза в указанный промежуток времени. Если с момента создания или последнего пинга проходит время, превышающее таймаут, система прерывает транзакцию. Причины такого поведения могут быть следующие:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Проблемы сетевого взаимодействия между клиентской машиной и кластером;&lt;/li&gt;\n&lt;li&gt;Некорректная работа клиента — отсутствие отправки пингов. Пинги либо не отправляются по коду, либо код, выполняющий такую отправку, не вызывается. Например, в случае использования python такое может случиться, если в программе на долгое время происходит взятие GIL-блокировки при работе с какими-либо нативными библиотеками;&lt;/li&gt;\n&lt;li&gt;Ведутся работы на кластере;&lt;/li&gt;\n&lt;li&gt;Имеются известные проблемы доступности;&lt;/li&gt;\n&lt;li&gt;Транзакция была явно прервана клиентом, в чём можно убедиться, изучив логи сервера.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;В остальных случаях для изучения проблемы необходимы клиентские debug-логи. На серверной стороне лишь известно, что пингов нет, поэтому следует обязательно включить debug-логирование и собрать debug logs. Например, выставив переменную &lt;code&gt;YT_LOG_LEVEL=debug&lt;/code&gt;, что подходит для большинства поддерживаемых API.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"owners-in-spec-ignored\"&gt;&lt;a href=\"ru/faq/index.html#owners-in-spec-ignored\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: На странице операции появилось сообщение «\"owners\" field in spec ignored as it was specified simultaneously with \"acl\"». Что это значит?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: На странице операции появилось сообщение «\"owners\" field in spec ignored as it was specified simultaneously with \"acl\"». Что это значит?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Сообщение означает, что в спецификации операции указаны одновременно устаревшее поле «owners» и поле «acl», при этом приоритет отдан последнему, то есть поле «owners» было проигнорировано.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"rotate-nodes-expiration\"&gt;&lt;a href=\"ru/faq/index.html#rotate-nodes-expiration\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как можно автоматически ротировать узлы, удалять старше определённого времени?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как можно автоматически ротировать узлы, удалять старше определённого времени?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Следует воспользоваться атрибутом &lt;code&gt;expiration_time&lt;/code&gt;. Подробнее можно прочитать в разделе &lt;a href=\"user-guide/storage/cypress.html#TTL\"&gt;Дерево метаинформации&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"delete-unused-nodes\"&gt;&lt;a href=\"ru/faq/index.html#delete-unused-nodes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как можно автоматически удалять узлы, которыми не пользовались дольше определённого времени?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как можно автоматически удалять узлы, которыми не пользовались дольше определённого времени?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Следует воспользоваться атрибутом &lt;code&gt;expiration_timeout&lt;/code&gt;. Подробнее можно прочитать в разделе &lt;a href=\"user-guide/storage/cypress.html#TTL\"&gt;Дерево метаинформации&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"excessive-disk-usage\"&gt;&lt;a href=\"ru/faq/index.html#excessive-disk-usage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: В ходе работы операции появилось предупреждение «Detected excessive disk IO in &amp;lt;job_type&amp;gt; jobs. IO throttling was activated». Что это значит?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: В ходе работы операции появилось предупреждение «Detected excessive disk IO in &amp;lt;job_type&amp;gt; jobs. IO throttling was activated». Что это значит?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Джобы операции совершают много операций ввода/вывода с локальным диском. Чтобы минимизировать негативные последствия такого поведения для кластера, джобы были ограничены через механизм &lt;a href=\"https://www.kernel.org/doc/Documentation/cgroup-v1/blkio-controller.txt\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;троттлинга blkio cgroup&lt;/a&gt;. О возможных причинах подобного поведения в примерах раздела &lt;a href=\"user-guide/problems/jobstatistics.html#excessive_io\"&gt;Статистики джобов&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"enable-path-autocorrection\"&gt;&lt;a href=\"ru/faq/index.html#enable-path-autocorrection\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Какие пути веб-интерфейс исправляет автоматически при включённой настройке Enable path autocorrection?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Какие пути веб-интерфейс исправляет автоматически при включённой настройке Enable path autocorrection?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Веб-интерфейс не сообщает о том, какие ошибки в пути были исправлены.&lt;br /&gt;\nНапример, &lt;code&gt;//home/user/tables/&lt;/code&gt; — путь такого вида всегда невалидный, при отображении пути в веб-интерфейсе неэкранированный слеш в конце пути будет отброшен.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"success-table-download\"&gt;&lt;a href=\"ru/faq/index.html#success-table-download\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как понять, успешно ли скачалась таблица из веб-интерфейса, а если нет, как посмотреть ошибку?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как понять, успешно ли скачалась таблица из веб-интерфейса, а если нет, как посмотреть ошибку?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; При возникновении ошибки она будет записываться в скачиваемый файл. Ошибка может произойти в любой момент во время скачивания — необходимо проверять конец файла. Пример ошибки:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;==================================================================&lt;span class=\"hljs-string\"&gt;\" \"&lt;/span&gt;# &lt;span class=\"hljs-string\"&gt;\"\"&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"\"&lt;/span&gt;#\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"code\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"message\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"Missing key column \\\"key\\\" in record\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"attributes\"&lt;/span&gt; = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-string\"&gt;\"fid\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;18446479488923730601&lt;/span&gt;u;\n        &lt;span class=\"hljs-string\"&gt;\"tid\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;9489286656218008974&lt;/span&gt;u;\n        &lt;span class=\"hljs-string\"&gt;\"datetime\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"2017-08-30T15:49:38.645508Z\"&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"pid\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;864684&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"host\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"&amp;lt;cluster_name&amp;gt;\"&lt;/span&gt;;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n==================================================================&lt;span class=\"hljs-string\"&gt;\" \"&lt;/span&gt;# &lt;span class=\"hljs-string\"&gt;\"\"&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"\"&lt;/span&gt;#\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"258\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-258\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-258\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-258.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"domain-name-not-found\"&gt;&lt;a href=\"ru/faq/index.html#domain-name-not-found\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Вы пытаетесь локально запустить программу, которая обращается через RPC в YTsaurus, и получаете ошибку «Domain name not found»&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Вы пытаетесь локально запустить программу, которая обращается через RPC в YTsaurus, и получаете ошибку «Domain name not found»&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; В логе также можно встретить &lt;code&gt;W Dns DNS resolve failed (HostName: your-local-host-name)&lt;/code&gt;. Ошибка возникает при разрешении имени локального хоста, а в глобальном DNS его нет. Дело в том, что YTsaurus RPC client по умолчанию использует IPv6 и отключает IPv4. Поэтому строка &lt;code&gt;127.0.1.1 your-local-host-name&lt;/code&gt; в локальном файле &lt;code&gt;/etc/hosts&lt;/code&gt; не работает. Если дописать в указанный файл &lt;code&gt;::1 your-local-host-name&lt;/code&gt;, это должно решить проблему.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"copy-table-range\"&gt;&lt;a href=\"ru/faq/index.html#copy-table-range\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как скопировать не всю таблицу, а только некоторый диапазон строк?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как скопировать не всю таблицу, а только некоторый диапазон строк?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; В текущей реализации операция &lt;code&gt;Copy&lt;/code&gt; не поддерживает копирование диапазонов, но можно воспользоваться командой &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt;, она отработает быстро. При использовании режима &lt;code&gt;ordered&lt;/code&gt; сохранится сортировка в простых случаях (например, когда диапазон один). Пример команды:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt merge --src &lt;span class=\"hljs-string\"&gt;'_path/to/src/table[#100:#500]'&lt;/span&gt; --dst _path/to/dst/table --mode ordered\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"273\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-273\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-273\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-273.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"who-access-tables\"&gt;&lt;a href=\"ru/faq/index.html#who-access-tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как узнать, кто работает с моими таблицами?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как узнать, кто работает с моими таблицами?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Для этого можно проанализировать лог доступа к мастер-серверу.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"restore-deleted-data\"&gt;&lt;a href=\"ru/faq/index.html#restore-deleted-data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как восстановить удалённые данные?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как восстановить удалённые данные?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Если удаление было через UI и там не была выбрана опция &lt;code&gt;Delete permanently&lt;/code&gt;, то можно поискать таблицы в мусорке в папке соответствующего аккаунта.&lt;br /&gt;\nЕсли удаление было через &lt;code&gt;yt remove&lt;/code&gt; или аналогичные вызовы API, то восстановление &lt;strong&gt;невозможно&lt;/strong&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"remote-copy-resource-limits\"&gt;&lt;a href=\"ru/faq/index.html#remote-copy-resource-limits\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Ошибка «Operations of type \"remote-copy\" must have small enough specified resource limits in some of ancestor pools»&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Ошибка «Operations of type \"remote-copy\" must have small enough specified resource limits in some of ancestor pools»&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Операции &lt;a href=\"user-guide/data-processing/operations/remote-copy.html\"&gt;RemoteCopy&lt;/a&gt; создают нагрузку на cross-DC сеть.&lt;br /&gt;\nДля ограничения нагрузки было введено искусственное ограничение: операции RemoteCopy должны запускаться в пуле с лимитом на &lt;code&gt;user_slots&lt;/code&gt;. Лимит указан в тексте ошибки и чаще всего равен &lt;code&gt;2000&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Если в пуле планируется запускать только RemoteCopy, то достаточно выставить это ограничение для пула&lt;br /&gt;\n&lt;code&gt;yt set //sys/pools/..../your_pool/@resource_limits '{user_slots=2000}'&lt;/code&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"access-denied-full-read\"&gt;&lt;a href=\"ru/faq/index.html#access-denied-full-read\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При чтении или копировании таблицы получаю ошибку \"Access denied for user \"some_user\": \"full_read\" permission for node //home/some_table is not allowed by any matching ACE\"&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При чтении или копировании таблицы получаю ошибку \"Access denied for user \"some_user\": \"full_read\" permission for node //home/some_table is not allowed by any matching ACE\"&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; В таблице одна или несколько колонок закрыты по ACL, и у вас нет к ним доступа. Чтобы свершить задуманное, необходимо этот доступ получить. Подробнее см. в разделе &lt;a href=\"user-guide/storage/columnar-acl.html\"&gt;Управление доступом к колонкам таблиц&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"map_reduce\"&gt;&lt;a href=\"ru/faq/index.html#map_reduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вопросы по MapReduce&lt;/span&gt;&lt;/a&gt;Вопросы по MapReduce&lt;/h2&gt;\n&lt;h4 id=\"simple-client-mapreduce\"&gt;&lt;a href=\"ru/faq/index.html#simple-client-mapreduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Где взять пример самого простого клиента и пошаговое руководство по запуску MapReduce?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Где взять пример самого простого клиента и пошаговое руководство по запуску MapReduce?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Стоит обратиться к разделу Как попробовать, а также прочитать про работу с YTsaurus из консоли.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"table-numbers-availability\"&gt;&lt;a href=\"ru/faq/index.html#table-numbers-availability\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Всегда ли доступны в операциях номера/названия таблиц?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Всегда ли доступны в операциях номера/названия таблиц?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Номера таблиц доступны во всех операциях, за исключением reduce-фазы в &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt;. В native C++ wrapper номера таблиц тоже доступны.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"slot-distribution-parallel-tasks\"&gt;&lt;a href=\"ru/faq/index.html#slot-distribution-parallel-tasks\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Если в кластере параллельно работает несколько задач, как распределяются слоты между ними?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Если в кластере параллельно работает несколько задач, как распределяются слоты между ними?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; В YTsaurus слоты выдаются в соответствии с алгоритмом fair share, и в процессе выполнения задачи число слотов динамически пересчитывается. Подробнее можно прочитать в разделе &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;Планировщик и пулы&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"merge-overhead-small-delta\"&gt;&lt;a href=\"ru/faq/index.html#merge-overhead-small-delta\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: От чего зависят накладные расходы при merge таблицы с её маленькой дельтой?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: От чего зависят накладные расходы при merge таблицы с её маленькой дельтой?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Накладные расходы зависят от количества затронутых чанков, в которые будут записываться строки из дельты.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"mappers-interactive-shell\"&gt;&lt;a href=\"ru/faq/index.html#mappers-interactive-shell\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Можно ли запускать mapper-ы из python interactive shell?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Можно ли запускать mapper-ы из python interactive shell?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Нет, данная функциональность не поддерживается.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"unavailable-chunk-error\"&gt;&lt;a href=\"ru/faq/index.html#unavailable-chunk-error\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При чтении таблицы или файла получаю сообщение «Chunk ... is unavailable». Что делать?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При чтении таблицы или файла получаю сообщение «Chunk ... is unavailable». Что делать?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;Ответ на этот вопрос читайте &lt;a href=\"ru/faq/index.html#lostintermediatechunks\"&gt;ниже&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"lost-input-chunks\"&gt;&lt;a href=\"ru/faq/index.html#lost-input-chunks\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Запущенная на кластере операция остановилась или замедлилась. Появилось сообщение «Some input chunks are not available». Что делать?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Запущенная на кластере операция остановилась или замедлилась. Появилось сообщение «Some input chunks are not available». Что делать?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;Ответ на этот вопрос читайте &lt;a href=\"ru/faq/index.html#lostintermediatechunks\"&gt;ниже&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"lost-intermediate-chunks\"&gt;&lt;a href=\"ru/faq/index.html#lost-intermediate-chunks\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Запущенная на кластере операция остановилась или замедлилась. Появилось сообщение «Some intermediate outputs were lost and will be regenerated». Что делать?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Запущенная на кластере операция остановилась или замедлилась. Появилось сообщение «Some intermediate outputs were lost and will be regenerated». Что делать?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Это означает, что некоторые чанки входных таблиц, используемых операцией, недоступны. Недоступность может быть вызвана исчезновением реплики с данными (при erasure-кодировании) или полным исчезновением всех реплик (без erasure-кодирования) — из-за выхода из строя узлов кластера или их перегрузки. По умолчанию в таком случае операция ждёт, когда чанки снова станут доступны. При этом вы можете:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Дождаться восстановления данных либо починки сломавшихся узлов кластера. Следите за состоянием кластера в веб-интерфейсе на вкладке &lt;strong&gt;System&lt;/strong&gt; (параметры Lost Chunks, Lost Vital Chunks, Data Missing Chunks, Parity Missing Chunks).&lt;/p&gt;\n&lt;p&gt;Либо:&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Досрочно завершить операцию, ожидающую недоступных данных, и получить частичный результат. Для этого используйте команду &lt;code&gt;complete-op&lt;/code&gt; в CLI или кнопку &lt;strong&gt;Complete&lt;/strong&gt; в веб-интерфейсе на странице операции.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Чтобы изменить поведение системы в случае недоступности чанков, задайте опции &lt;code&gt;unavailable_chunk_tactics&lt;/code&gt; и &lt;code&gt;unavailable_chunk_strategy&lt;/code&gt; в &lt;a href=\"user-guide/data-processing/operations/overview.html#chunk_strategy\"&gt;спецификации операции&lt;/a&gt;. Имейте в виду: поменять опции «на лету» не получится, они задаются перед запуском операции.&lt;/p&gt;\n&lt;p&gt;В случае недоступности erasure-чанков поведение системы можно настроить с помощью опции &lt;code&gt;chunk_availability_policy&lt;/code&gt;. Подробнее в разделе &lt;a href=\"user-guide/data-processing/operations/overview.html#chunk_erasure_strategy\"&gt;Типы операций&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"large-table-row-error\"&gt;&lt;a href=\"ru/faq/index.html#large-table-row-error\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Возникла ошибка «Table row is too large: current weight ..., max weight ... или Row weight is too large». Что это значит и как с этим бороться?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Возникла ошибка «Table row is too large: current weight ..., max weight ... или Row weight is too large». Что это значит и как с этим бороться?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Вес табличной строки (row weight) считается как сумма длин значений всех колонок в данной строке. В системе установлено ограничение на веса строк, что позволяет контролировать объём буферов, используемых при записи таблиц. Ограничение по умолчанию — 16МБ. Чтобы его увеличить, необходимо выставить опцию &lt;code&gt;max_row_weight&lt;/code&gt; в конфигурации table_writer.&lt;/p&gt;\n&lt;p&gt;Длины значений считаются в зависимости от типа:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;int64&lt;/code&gt;, &lt;code&gt;uint64&lt;/code&gt;, &lt;code&gt;double&lt;/code&gt; — 8 байтов;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;boolean&lt;/code&gt; — 1 байт;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;string&lt;/code&gt; — длина строки;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;any&lt;/code&gt; — длина структуры, сериализованной в binary yson, в байтах;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;null&lt;/code&gt; — 0 байтов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Если вы получаете данную ошибку при запуске MapReduce-операции, необходимо настроить конфигурацию конкретного table_writer, обслуживающего соответствующую стадию операции: &lt;code&gt;--spec '{JOB_IO={table_writer={max_row_weight=...}}}'&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Здесь имя секции &lt;code&gt;JOB_IO&lt;/code&gt; выбирается следующим образом:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;для операций с одним типом джобов (&lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt;, &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt;, &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt;, и так далее) &lt;code&gt;JOB_IO = job_io&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;для операций Sort &lt;code&gt;JOB_IO = partition_job_io | sort_job_io | merge_job_io&lt;/code&gt; стоит поднимать все ограничения с шагом x2 до подбора подходящих;&lt;/li&gt;\n&lt;li&gt;для операций &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt; &lt;code&gt;JOB_IO = map_job_io | sort_job_io | reduce_job_io&lt;/code&gt; можно поднять отдельные ограничения, если вы уверены в том, на какой именно стадии формируются большие строки.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Максимальное значение &lt;code&gt;max_row_weight&lt;/code&gt; — 128Мб.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"key-weight-too-large\"&gt;&lt;a href=\"ru/faq/index.html#key-weight-too-large\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Возникла ошибка «Key weight is too large». Что это значит и как с этим бороться?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Возникла ошибка «Key weight is too large». Что это значит и как с этим бороться?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Вес ключа в строке (key weight) считается как сумма длин значений всех ключевых колонок в данной строке. Существуют ограничения на вес ключей в строках. Значение лимита по умолчанию 16k. Лимит можно увеличить через опцию &lt;code&gt;max_key_weight&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Длины значений считаются в зависимости от типа:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;int64&lt;/code&gt;, &lt;code&gt;uint64&lt;/code&gt;, &lt;code&gt;double&lt;/code&gt; — 8 байтов;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;boolean&lt;/code&gt; — 1 байт;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;string&lt;/code&gt; — длина строки;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;any&lt;/code&gt; — длина структуры, сериализованной в binary yson, в байтах;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;null&lt;/code&gt; — 0 байтов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Если вы получаете данную ошибку при запуске MapReduce-операции, то необходимо настроить конфигурацию table_writer, обслуживающего соответствующую стадию операции:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;--spec &lt;span class=\"hljs-string\"&gt;'{JOB_IO={table_writer={max_key_weight=...}}}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"487\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-487\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-487\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-487.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Здесь имя секции &lt;code&gt;JOB_IO&lt;/code&gt; выбирается следующим образом:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;для операций с одним типом джобов (&lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt;, &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt;, &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt;, etc) &lt;code&gt;JOB_IO = job_io&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;для операций sort &lt;code&gt;JOB_IO = partition_job_io | sort_job_io | merge_job_io&lt;/code&gt; стоит сразу поднять все ограничения;&lt;/li&gt;\n&lt;li&gt;для операций &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt; &lt;code&gt;JOB_IO = map_job_io | sort_job_io | reduce_job_io&lt;/code&gt; можно поднять отдельные ограничения, если вы уверены в том, на какой именно стадии формируются большие строки, но лучше также поднять все ограничения.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Максимальное значение &lt;code&gt;max_key_weight&lt;/code&gt; 256Кб.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Граничные ключи чанков хранятся на мастер-серверах, поэтому увеличивать ограничение запрещено за исключением случаев починки продашкена. Перед тем как увеличить ограничение, необходимо написать администратору системы и предупредить об увеличении ограничения, мотивировав свои действия.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;hr /&gt;\n&lt;h4 id=\"reduce-combiner-slow\"&gt;&lt;a href=\"ru/faq/index.html#reduce-combiner-slow\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Почему долго работает reduce_combiner? Что делать?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Почему долго работает reduce_combiner? Что делать?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Вероятно, код джоба достаточно медленный, и стоит уменьшить размер джоба. &lt;code&gt;reduce_combiner&lt;/code&gt; запускается если размер партиции превышает значение&lt;code&gt;data_weight_per_sort_job&lt;/code&gt;. Объём данных в &lt;code&gt;reduce_combiner&lt;/code&gt; равен &lt;code&gt;data_weight_per_sort_job&lt;/code&gt;. Значение по умолчанию для &lt;code&gt;data_weight_per_sort_job&lt;/code&gt; задаётся в конфигурации планировщика YTsaurus, но может быть переопределено в спецификации операции, в байтах.&lt;br /&gt;\n&lt;code&gt;yt map_reduce ... --spec '{data_weight_per_sort_job = N}'&lt;/code&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"missing-input-table-indexes\"&gt;&lt;a href=\"ru/faq/index.html#missing-input-table-indexes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Я подаю на вход операции MapReduce несколько входных таблиц и не указываю mapper. При этом в reducer-е я не могу получить индексы входных таблиц. В чём дело?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Я подаю на вход операции MapReduce несколько входных таблиц и не указываю mapper. При этом в reducer-е я не могу получить индексы входных таблиц. В чём дело?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Индексы входных таблиц доступны лишь для mapper-ов. Если mapper не указать, он будет автоматически заменён на тривиальный. Поскольку индекс таблицы не является частью данных, а лишь атрибутами входных строк, то тривиальный mapper не будет сохранять информацию об индексе таблицы. Для решения задачи необходимо самостоятельно написать mapper, в котором сохранить индекс таблицы в каком-либо поле.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"abort-jobs-without-failure\"&gt;&lt;a href=\"ru/faq/index.html#abort-jobs-without-failure\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как прервать оставшиеся джобы так, чтобы операция не завершилась аварийно?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как прервать оставшиеся джобы так, чтобы операция не завершилась аварийно?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; По одному джобу можно прерывать через веб-интерфейс.&lt;br /&gt;\nВсю операцию целиком можно завершить с помощью CLI &lt;code&gt;yt complete-op &amp;lt;id&amp;gt;&lt;/code&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"ipython-operations-failure\"&gt;&lt;a href=\"ru/faq/index.html#ipython-operations-failure\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Что делать, если не работает запуск операций из IPython Notebook?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Что делать, если не работает запуск операций из IPython Notebook?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; В случае, если текст ошибки похож на следующий:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;Traceback (most recent call last):\n  File &lt;span class=\"hljs-string\"&gt;\"_py_runner.py\"&lt;/span&gt;, line &lt;span class=\"hljs-number\"&gt;113&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; &amp;lt;module&amp;gt;\n    main()\n  File &lt;span class=\"hljs-string\"&gt;\"_py_runner.py\"&lt;/span&gt;, line &lt;span class=\"hljs-number\"&gt;40&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; main\n    (&lt;span class=\"hljs-string\"&gt;''&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'rb'&lt;/span&gt;, imp.__dict__[__main_module_type]))\n  File &lt;span class=\"hljs-string\"&gt;\"_main_module_9_vpP.py\"&lt;/span&gt;, line &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n    PK\n      ^\nSyntaxError: invalid syntax\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"549\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-549\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-549\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-549.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Необходимо сделать перед запуском всех операций следующее:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;custom_md5sum&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;filename&lt;/span&gt;):\n    &lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;open&lt;/span&gt;(filename, mode=&lt;span class=\"hljs-string\"&gt;\"rb\"&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; fin:\n        h = hashlib.md5()\n        h.update(&lt;span class=\"hljs-string\"&gt;\"salt\"&lt;/span&gt;)\n        &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; buf &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; chunk_iter_stream(fin, &lt;span class=\"hljs-number\"&gt;1024&lt;/span&gt;):\n            h.update(buf)\n    &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; h.hexdigest()\n\nyt.wrapper.file_commands.md5sum = custom_md5sum\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"553\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-553\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-553\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-553.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"intermediate-data-account\"&gt;&lt;a href=\"ru/faq/index.html#intermediate-data-account\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Под каким аккаунтом будут храниться промежуточные данные в операциях MapReduce и Sort?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Под каким аккаунтом будут храниться промежуточные данные в операциях MapReduce и Sort?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; По умолчанию используется аккаунт &lt;code&gt;intermediate&lt;/code&gt;, но такое поведение можно изменить, переопределив параметр &lt;code&gt;intermediate_data_account&lt;/code&gt; в спецификации операции. Подробнее можно прочитать в разделе &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Настройки операций&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"operations-input-save\"&gt;&lt;a href=\"ru/faq/index.html#operations-input-save\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Под каким аккаунтом будут храниться выходные данные операций?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Под каким аккаунтом будут храниться выходные данные операций?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Под тем аккаунтом, который окажется на выходных таблицах. Если до запуска операции выходные таблицы не существовали, то будут созданы автоматически, и тогда аккаунт будет унаследован от родительской директории. Для переопределения данных настроек выходные таблицы можно создать заранее и настроить им атрибуты любым образом.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"reduce-jobs-max\"&gt;&lt;a href=\"ru/faq/index.html#reduce-jobs-max\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как увеличить количество джобов в операции Reduce? Опция job_count не помогает.&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как увеличить количество джобов в операции Reduce? Опция job_count не помогает.&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Вероятнее всего, входная таблица слишком маленькая, и планировщику не хватает сэмплов ключей, чтобы сформировать большее количество джобов. Чтобы на маленькой таблице получить больше джобов, придется искусственно переложить таблицу, сделав больше чанков. Это можно сделать командой &lt;code&gt;merge&lt;/code&gt; с помощью опции &lt;code&gt;desired_chunk_size&lt;/code&gt;. Например, чтобы сделать чанки по 5 мегабайтов, необходимо выполнить команду:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt merge --src _table --dst _table --spec &lt;span class=\"hljs-string\"&gt;'{job_io = {table_writer = {desired_chunk_size = 5000000}}; force_transform = %true}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"575\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-575\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-575\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-575.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Альтернативный способ решить проблему — воспользоваться опцией &lt;code&gt;pivot_keys&lt;/code&gt;, чтобы явно задать граничные ключи, между которыми должны быть запущены джобы.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"table-not-sorted\"&gt;&lt;a href=\"ru/faq/index.html#table-not-sorted\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Пытаюсь использовать сортированный выход из операции MapReduce. В качестве ключей на выходе использую ключи на входе. Джобы завершаются аварийно с диагностикой «Output table ... is not sorted: job outputs have overlapping key ranges» или «Sort order violation». В чем дело?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Пытаюсь использовать сортированный выход из операции MapReduce. В качестве ключей на выходе использую ключи на входе. Джобы завершаются аварийно с диагностикой «Output table ... is not sorted: job outputs have overlapping key ranges» или «Sort order violation». В чем дело?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Сортированный выход из операции возможен лишь в том случае, если джобы производят непересекающиеся по диапазонам наборы строк. В операции &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt; входные строки группируются по хешу от ключа. Поэтому в описанном сценарии диапазоны из джобов будут пересекаться. Чтобы обойти проблему, нужно использовать комбинацию операций &lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;Sort&lt;/a&gt; и &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"max-data-exceeded\"&gt;&lt;a href=\"ru/faq/index.html#max-data-exceeded\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При запуске операции возникает ошибка «Maximum allowed data weight ... exceeded». Что с этим делать?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При запуске операции возникает ошибка «Maximum allowed data weight ... exceeded». Что с этим делать?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Ошибка означает, что система сформировала джоб со слишком большим входом — более 200ГБ данных на входе. Такой джоб работал бы слишком долго, поэтому система YTsaurus сразу защищает пользователей от таких ошибок.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"different-data-volume\"&gt;&lt;a href=\"ru/faq/index.html#different-data-volume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: При запуске операции Reduce или MapReduce видно, что объем данных, приходящийся на вход reduce джобам, сильно различается. В чем причина и как сделать разбиение более равномерным?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: При запуске операции Reduce или MapReduce видно, что объем данных, приходящийся на вход reduce джобам, сильно различается. В чем причина и как сделать разбиение более равномерным?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;Причина большого объема может быть в том, что наблюдается перекос во входных данных, то есть каким-то ключам соответствует заметно больший объем данных, чем другим. В таком случае стоит придумать другое решение выполняемой задачи, например попробовать воспользоваться &lt;a href=\"user-guide/data-processing/operations/reduce.html#rabota-s-bolshimi-klyuchami-—-reduce_combiner\"&gt;комбайнерами&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Если ошибка возникла в операции &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt;, на входе которой более одной таблицы (обычно десятки и сотни), то возможно, планировщику не хватает сэмплов, чтобы разбить входные данные точнее и добиться равномерности. В таком случае стоит использовать операцию &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt; вместо операции &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"intermediate-data-skew\"&gt;&lt;a href=\"ru/faq/index.html#intermediate-data-skew\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: В ходе работы операции Sort или MapReduce появилось сообщение «Intermediate data skew is too high (see \"Partitions\" tab). Operation is likely to have stragglers». Что делать?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: В ходе работы операции Sort или MapReduce появилось сообщение «Intermediate data skew is too high (see \"Partitions\" tab). Operation is likely to have stragglers». Что делать?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Это означает, что при партицировании данные оказались разбиты очень неравномерно. Для операции &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt; это с высокой вероятностью означает наличие перекоса во входных данных (каким-то ключам соответствует заметно больший объем данных, чем другим).&lt;/p&gt;\n&lt;p&gt;Для операции &lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;Sort&lt;/a&gt; такая ситуация тоже возможна, её возникновение связано со спецификой данных и метода сэмплирования. Простого способа решения этой проблемы для &lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;Sort&lt;/a&gt; не существует. Стоит обратиться к администратору системы.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"make-limit-low\"&gt;&lt;a href=\"ru/faq/index.html#make-limit-low\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как уменьшить лимит на число падений джобов, начиная с которого вся операция завершается ошибкой?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как уменьшить лимит на число падений джобов, начиная с которого вся операция завершается ошибкой?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Лимит регулируется настройкой &lt;code&gt;max_failed_job_count&lt;/code&gt;. Подробнее можно прочитать в разделе &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Настройки операций&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"shortjobsduration\"&gt;&lt;a href=\"ru/faq/index.html#shortjobsduration\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: На странице операции появляется оповещение «Average job duration is smaller than 25 seconds, try increasing data_weight_per_job in operation spec»?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: На странице операции появляется оповещение «Average job duration is smaller than 25 seconds, try increasing data_weight_per_job in operation spec»?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Сообщение означает, что джобы операции слишком короткие, и накладные расходы на их запуск замедляют операцию и ухудшают утилизацию ресурсов кластера. Для исправления ситуации необходимо увеличить количество данных, подаваемых на вход джобу. Для этого необходимо увеличить соответствующие настройки в спецификации операции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Map, Reduce, JoinReduce, Merge&lt;/strong&gt; — &lt;code&gt;data_weight_per_job&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;MapReduce&lt;/strong&gt;:\n&lt;ul&gt;\n&lt;li&gt;для &lt;code&gt;map&lt;/code&gt;/&lt;code&gt;partition&lt;/code&gt; джобов — &lt;code&gt;data_weight_per_map_job&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;для &lt;code&gt;reduce&lt;/code&gt; джобов — &lt;code&gt;partition_data_size&lt;/code&gt;;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Sort&lt;/strong&gt;:\n&lt;ul&gt;\n&lt;li&gt;для &lt;code&gt;partition&lt;/code&gt; джобов — &lt;code&gt;data_weight_per_partition_job&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;для &lt;code&gt;final_sort&lt;/code&gt; джобов — &lt;code&gt;partition_data_size&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Значения по умолчанию указаны в &lt;a href=\"user-guide/data-processing/operations/overview.html\"&gt;разделах&lt;/a&gt;, посвящённых конкретным типам операций.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"longabortedjobs\"&gt;&lt;a href=\"ru/faq/index.html#longabortedjobs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: На странице операции появляется оповещение «Aborted jobs time ratio ... is is too high. Scheduling is likely to be inefficient. Consider increasing job count to make individual jobs smaller».?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: На странице операции появляется оповещение «Aborted jobs time ratio ... is is too high. Scheduling is likely to be inefficient. Consider increasing job count to make individual jobs smaller».?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Сообщение означает, что джобы слишком длинные. В результате того, что положенная пулу доля ресурсов на кластере постоянно меняется с приходом и уходом других пользователей, которые запускают операции, джобы операции запускаются, а потом вытесняются. Из-за этого доля времени, потраченного впустую джобами операции, оказывается очень большой. Общая рекомендация состоит в том, чтобы джобы были достаточно короткими. Оптимальная длительность джоба составляет единицы минут. Достичь такого значения можно уменьшением количества данных, подаваемых на вход одному джобу, с помощью опции &lt;code&gt;data_weight_per_job&lt;/code&gt;, либо оптимизацией и ускорением кода.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"high-cpu-wait\"&gt;&lt;a href=\"ru/faq/index.html#high-cpu-wait\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: На странице операции появляется оповещение «Average CPU wait time of some of your job types is significantly high...»?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: На странице операции появляется оповещение «Average CPU wait time of some of your job types is significantly high...»?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Сообщение означает, что джобы существенное время (десятки процентов от общего времени работы джобов) ждали данных от YTsaurus, или висели на чтение данных с локального диска/по сети. В общем случае это означает, что вы неэффективно утилизируете CPU. В случае ожидания данных от YTsaurus можно посмотреть в сторону уменьшения &lt;code&gt;cpu_limit&lt;/code&gt; ваших джобов, либо попробовать переложить данные на SSD, чтобы читать их быстрее. Если это является особенностью вашего процесса, потому что он читает что-то тяжелое с локального диска джоба или ходит куда-то по сети, стоит либо рассмотреть возможность оптимизации процесса, либо также уменьшить &lt;code&gt;cpu_limit&lt;/code&gt;. Оптимизация подразумевает перестройку процесса пользователя в джобе таким образом, чтобы чтение с диска или обращение по сети не становилось узким местом.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"simple-sample-table\"&gt;&lt;a href=\"ru/faq/index.html#simple-sample-table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Как проще всего выполнить сэмплирование таблицы?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Как проще всего выполнить сэмплирование таблицы?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; В системе YTsaurus существует возможность заказать семплирование входа для любой операции.&lt;br /&gt;\nВ частности, можно запустить тривиальный map и получить желаемое следующим образом:&lt;br /&gt;\n&lt;code&gt;yt map cat --src _path/to/input --dst _path/to/output --spec '{job_io = {table_reader = {sampling_rate = 0.001}}}' --format yson&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Или просто прочитать данные:&lt;br /&gt;\n&lt;code&gt;yt read '//path/to/input' --table-reader '{sampling_rate=0.001}' --format json&lt;/code&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"operationsuspended\"&gt;&lt;a href=\"ru/faq/index.html#operationsuspended\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: В ходе работы операции появилось предупреждение «Account limit exceeded» и операция остановилась. Что это значит?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: В ходе работы операции появилось предупреждение «Account limit exceeded» и операция остановилась. Что это значит?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Сообщение означает, что в спецификации операции включен параметр &lt;code&gt;suspend_operation_if_account_limit_exceeded&lt;/code&gt;. Также заполнена одна из квот аккаунта, в котором находятся выходные таблицы операции. Например, квота на дисковое пространство. Следует разобраться почему такое произошло и возобновить операцию. Посмотреть квоты аккаунта можно на странице &lt;strong&gt;Accounts&lt;/strong&gt; в веб-интерфейсе.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"operationpending\"&gt;&lt;a href=\"ru/faq/index.html#operationpending\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Запущенная операция долгое время находится в состоянии pending. Когда она будет выполняться?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Запущенная операция долгое время находится в состоянии pending. Когда она будет выполняться?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; В системе YTsaurus существует ограничение на количество одновременно &lt;strong&gt;выполняющихся&lt;/strong&gt; (в отличие от запущенных, то есть принятых к исполнению) операций в каждом пуле. По умолчанию данное ограничение невелико (порядка 10). В случае, когда в пуле ограничение на число выполняющихся операций оказывается достигнуто, новые операции становятся в очередь. Выполнение операций в очереди будет возможно, когда предыдущие операции в том же пуле завершатся. Ограничение на количество выполняющихся операций действует на всех уровнях иерархии пулов, то есть при запуске операции в пуле A она может попасть в состояние pending, если достигается ограничение не только в самом A, но также хотя бы в одном из родителей A. Подробнее про пулы и их настройку в разделе &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;Планировщик и пулы&lt;/a&gt;. В случае наличия обоснованной необходимости выполнять больше операций одновременно, следует отправить запрос администратору системы.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"excessivejobspecthrottling\"&gt;&lt;a href=\"ru/faq/index.html#excessivejobspecthrottling\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: В ходе работы операции появилось предупреждение «Excessive job spec throttling is detected». Что это значит?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: В ходе работы операции появилось предупреждение «Excessive job spec throttling is detected». Что это значит?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Сообщение означает, что операция тяжелая с точки зрения вычислительных ресурсов, потребляемых самим планировщиком при ее подготовке. Такая ситуация является частью нормального поведения нагруженного кластера. Если вы считаете, что операция выполняется непозволительно долго и продолжительное время находится в состоянии starving, следует сообщить об этом администратору системы.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"lowcpuusage\"&gt;&lt;a href=\"ru/faq/index.html#lowcpuusage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: В ходе работы операции появилось предупреждение «Average cpu usage... is lower than requested 'cpu_limit'». Что это значит?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: В ходе работы операции появилось предупреждение «Average cpu usage... is lower than requested 'cpu_limit'». Что это значит?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Сообщение означает, что операция потребляет значительно меньше CPU, чем было запро
