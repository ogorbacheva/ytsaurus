        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе можно узнать об основных возможностях и устройстве системы YTsaurus.&lt;/p&gt;\n&lt;h2 id=\"clusters\"&gt;&lt;a href=\"ru/overview/about.html#clusters\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кластеры&lt;/span&gt;&lt;/a&gt;Кластеры&lt;/h2&gt;\n&lt;p&gt;Кластер YTsaurus — группа инстансов, расположенных в контейнерах на физических хостах и функционирующих как единое целое.&lt;br /&gt;\nИсходя из решаемых задач, кластеры могут делиться на:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;вычислительные кластеры для массивной параллельной обработки больших данных при помощи MapReduce операций;&lt;/li&gt;\n&lt;li&gt;кластеры для динамических таблиц (key-value хранилище);&lt;/li&gt;\n&lt;li&gt;геораспределённые кластеры, выполняющие функции координации.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Вычислительный кластер YTsaurus способен:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;хранить эксабайты данных;&lt;/li&gt;\n&lt;li&gt;использовать HDD, SSD и RAM для хранения данных;&lt;/li&gt;\n&lt;li&gt;обрабатывать данные на сотнях тысяч Hyper Threading ядер;&lt;/li&gt;\n&lt;li&gt;решать задачи машинного обучения на тысячах графических процессоров (GPU);&lt;/li&gt;\n&lt;li&gt;хранить и обрабатывать данные десятков тысяч пользователей.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"arhitektura\"&gt;&lt;a href=\"ru/overview/about.html#arhitektura\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Архитектура&lt;/span&gt;&lt;/a&gt;Архитектура&lt;/h2&gt;\n&lt;p&gt;&lt;img src=\"images/architecture.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;В архитектуре YTsaurus можно выделить три слоя:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;распределённая файловая система и хранилище метаинформации — Кипарис;&lt;/li&gt;\n&lt;li&gt;планировщик для распределённых вычислений с поддержкой модели MapReduce;&lt;/li&gt;\n&lt;li&gt;высокоуровневые вычислительные движки: YQL, CHYT, SPYT.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"cypress\"&gt;&lt;a href=\"ru/overview/about.html#cypress\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кипарис&lt;/span&gt;&lt;/a&gt;Кипарис&lt;/h3&gt;\n&lt;p&gt;Кипарис — отказоустойчивое древовидное хранилище. Возможности Кипариса можно описать следующим образом:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;древовидное пространство имён, узлами которого являются директории, таблицы и файлы;&lt;/li&gt;\n&lt;li&gt;прозрачное шардирование больших табличных данных на чанки, которое позволяет работать с таблицей, как единой сущностью, не думая о деталях её хранения;&lt;/li&gt;\n&lt;li&gt;поддержка колоночного и строчного механизмов хранения табличных данных;&lt;/li&gt;\n&lt;li&gt;поддержка сжатого хранения с использованием различных кодеков — например, lz4 и zstd с настраиваемым уровнем сжатия;&lt;/li&gt;\n&lt;li&gt;поддержка erasure-кодирования с использованием разнообразных стратегий подсчета контрольных сумм, обладающих разными параметрами избыточности и допустимых видов потерь;&lt;/li&gt;\n&lt;li&gt;выразительная схематизация данных с поддержкой иерархических типов и признаков сортированности данных;&lt;/li&gt;\n&lt;li&gt;фоновые репликация и починка erasure-данных, не требующие ручных действий;&lt;/li&gt;\n&lt;li&gt;транзакционная семантика с поддержкой вложенных транзакций и блокировок уровней snapshot/shared/exclusive;&lt;/li&gt;\n&lt;li&gt;транзакции, которые могут затрагивать много объектов Кипариса и длиться неограниченно долго;&lt;/li&gt;\n&lt;li&gt;гибкая система разделения и учёта дискового пространства;&lt;/li&gt;\n&lt;li&gt;гибкая система разграничения прав доступа к данным, включая доступ к колонкам таблиц.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Основа Кипариса — реплицированный и горизонтально-масштабируемый мастер-сервер, который хранит метаинформацию об устройстве дерева Кипариса, а также о составе и местоположении реплик чанков всех таблиц на кластере. Мастер-серверы представляют собой Replicated State Machine, реализованную поверх технологии Hydra — in-house версии алгоритма консенсуса, схожей с Raft.&lt;br /&gt;\nКипарис реализует отказоустойчивый эластичный слой хранения данных.&lt;/p&gt;\n&lt;p&gt;Помимо хранения Кипарис может выступать сервисом координации (lock service), по аналогии с Apache Zookeeper.&lt;/p&gt;\n&lt;p&gt;С пользовательской точки зрения Кипарис похож на дерево файловой системы в Linux. Самый простой способ работать с Кипарисом — использовать веб-интерфейс.&lt;/p&gt;\n&lt;h3 id=\"dyn-tables\"&gt;&lt;a href=\"ru/overview/about.html#dyn-tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Динамические таблицы&lt;/span&gt;&lt;/a&gt;Динамические таблицы&lt;/h3&gt;\n&lt;p&gt;Динамические таблицы — это вид таблиц в YTsaurus, реализующих интерфейс точечного чтения и записи данных по ключу, поддерживающих транзакции и собственный диалект SQL.&lt;/p&gt;\n&lt;p&gt;Ключевые особенности динамических таблиц:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;хранение данных в модели &lt;a href=\"https://en.wikipedia.org/wiki/Multiversion_concurrency_control\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MVCC&lt;/a&gt;, позволяющее читать значения по ключу и таймстемпу;&lt;/li&gt;\n&lt;li&gt;масштабируемость: динамическая таблица делится на таблеты (шарды по диапазонам ключей), которые обслуживаются отдельными узлами кластера;&lt;/li&gt;\n&lt;li&gt;транзакционность: динамические таблицы — это OLTP-хранилища, позволяющие модифицировать в одной транзакции множество строк из разных таблетов различных таблиц;&lt;/li&gt;\n&lt;li&gt;отказоустойчивость: выход отдельного узла кластера, обслуживающего таблет, приводит к тому, что данный таблет переезжает на другой узел кластера без потери данных;&lt;/li&gt;\n&lt;li&gt;изоляция: инстансы, обслуживающие таблеты, группируются в бандлы, находящиеся на отдельных серверах, за счет чего обеспечивается изоляция нагрузки;&lt;/li&gt;\n&lt;li&gt;проверка конфликтов на уровне отдельных ключей или даже отдельных значений;&lt;/li&gt;\n&lt;li&gt;возможность ответа из RAM для горячих данных;&lt;/li&gt;\n&lt;li&gt;удаление данных по &lt;a href=\"https://ru.wikipedia.org/wiki/Time_to_live\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TTL&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;встроенный SQL-like язык для сканирующих аналитических запросов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Помимо динамических таблиц с интерфейсом k-v storage в системе есть поддержка динамических таблиц, реализующих абстракцию очереди сообщений — а именно топика и потока. Указанные очереди также можно считать таблицами, потому что они состоят из строк и обладают собственной схемой. В одной транзакции можно одновременно изменять строки в k-v динамической таблице, а также в очереди. Это позволяет строить потоковую обработку данных поверх динамических таблиц YTsaurus с exactly-once семантикой.&lt;/p&gt;\n&lt;h3 id=\"mapreduce\"&gt;&lt;a href=\"ru/overview/about.html#mapreduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MapReduce&lt;/span&gt;&lt;/a&gt;MapReduce&lt;/h3&gt;\n&lt;p&gt;В основе вычислительной архитектуры YTsaurus лежит модель распределённых вычислений MapReduce. Операция Map обрабатывает входные данные, разделённые на части между узлами кластера, без обмена данными между узлами. Операция Reduce выполняет группировку данных с разных узлов кластера.&lt;br /&gt;\nМодель позволяет обрабатывать большие объемы данных с высокой надежностью и автоматически перезапускать часть вычислений в случае недоступности отдельных узлов кластера.&lt;/p&gt;\n&lt;p&gt;MapReduce в YTsaurus обладает следующими отличительными чертами:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;богатая модель базовых операций: классический MapReduce (с разными стратегиями shuffle и поддержкой многофазного партиционирования), Map, Erase, Sort, и разнообразные расширения модели с учётом сортированности входных данных;&lt;/li&gt;\n&lt;li&gt;горизонтальная масштабируемость вычислительных операций: операции дробятся на джобы, которые работают на отдельных узлах кластера;&lt;/li&gt;\n&lt;li&gt;поддержка до сотен тысяч джобов в одной операции;&lt;/li&gt;\n&lt;li&gt;гибкая модель иерархических вычислительных пулов с мгновенными и интегральными гарантиями, а также fair_share распределением недоутилизированных ресурсов между потребителями без гарантий;&lt;/li&gt;\n&lt;li&gt;векторная модель ресурсов, позволяющая заказывать различные вычислительные ресурсы (CPU, RAM, GPU) в разных пропорциях;&lt;/li&gt;\n&lt;li&gt;запуск джобов на вычислительных узлах в контейнерах, изолированных друг от друга по CPU, RAM, файловой системе и process namespace с использованием механизма контейнеризации Porto;&lt;/li&gt;\n&lt;li&gt;масштабирующийся планировщик, способный обслуживать кластеры с миллионом одновременно исполняемых задач;&lt;/li&gt;\n&lt;li&gt;сохранение практически всего прогресса вычислений при обновлениях или выходе отдельных узлов планировщика из строя.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Следует отметить возможность запускать не только MapReduce-джобы, но и произвольный код. В терминологии YTsaurus запуск произвольного кода достигается с помощью ванильных (Vanilla) операций.&lt;/p&gt;\n&lt;h3 id=\"yql\"&gt;&lt;a href=\"ru/overview/about.html#yql\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YQL&lt;/span&gt;&lt;/a&gt;YQL&lt;/h3&gt;\n&lt;p&gt;YQL — универсальный, декларативный, основанный на SQL язык запросов к системам хранения и обработки данных, а также инфраструктура для их выполнения.&lt;/p&gt;\n&lt;p&gt;К преимуществам YQL можно отнести:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;мощный графовый движок исполнения, который строит MapReduce-pipelines из сотен узлов и может адаптивно перестраиваться по ходу вычисления;&lt;/li&gt;\n&lt;li&gt;возможность построения сложного конвейера обработки данных на SQL с сохранением подзапросов в переменные в виде цепочек зависимых запросов и транзакций;&lt;/li&gt;\n&lt;li&gt;предсказуемое параллельное исполнение запросов произвольной сложности;&lt;/li&gt;\n&lt;li&gt;эффективная реализация join-ов, подзапросов и оконных функций без ограничений на их топологию и вложенность;&lt;/li&gt;\n&lt;li&gt;богатая библиотека функций;&lt;/li&gt;\n&lt;li&gt;поддержка пользовательских функций на C++, Python и JavaScript;&lt;/li&gt;\n&lt;li&gt;поддержка функций использования моделей машинного обучения с применением CatBoost и TensorFlow;&lt;/li&gt;\n&lt;li&gt;автоматическое исполнение небольших частей запросов на заранее подготовленных вычислительных инстансах в обход MapReduce-операций для уменьшения времени выполнения.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"chyt\"&gt;&lt;a href=\"ru/overview/about.html#chyt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CHYT&lt;/span&gt;&lt;/a&gt;CHYT&lt;/h3&gt;\n&lt;p&gt;ClickHouse over YTsaurus (CHYT) — это технология, которая позволяет поднять кластер из серверов ClickHouse непосредственно на вычислительных узлах YTsaurus.&lt;br /&gt;\nClickHouse поднимается внутри Vanilla-операции и работает с данными, которые находятся в YTsaurus. Кластер YTsaurus выступает compute-облаком по отношению к запущенным в нём кластерам CHYT.&lt;br /&gt;\nТехнология позволяет разным пользователям запустить на одном кластере YTsaurus несколько кластеров CHYT, которые будут абсолютно изолированы друг от друга, и решить тем самым задачу разделения ресурсов в облачном стиле.&lt;/p&gt;\n&lt;p&gt;В экосистеме YTsaurus CHYT отвечает:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;за быстрые аналитические запросы поверх статических таблиц в YTsaurus со временем ответа менее секунды;&lt;/li&gt;\n&lt;li&gt;переиспользование уже имеющихся данных в кластере YTsaurus без необходимости копировать их в отдельный кластер ClickHouse;&lt;/li&gt;\n&lt;li&gt;возможность интеграции через ODBC и JDBC-драйверы ClickHouse, например, со сторонними системами визуализации такими как: Tableau, Qlik, Power BI, Oracle Bi и DataLens.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Интеграция произведена на довольно низком уровне. Это позволяет получить максимум возможностей как от YTsaurus, так от ClickHouse. В данной интеграции реализована:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;поддержка чтения как статических, так и динамических таблиц;&lt;/li&gt;\n&lt;li&gt;частичная поддержка транзакционной модели YTsaurus;&lt;/li&gt;\n&lt;li&gt;поддержка распределённых вставок;&lt;/li&gt;\n&lt;li&gt;CPU-efficient-преобразование колоночных данных из внутреннего формата YTsaurus в in-memory представление ClickHouse;&lt;/li&gt;\n&lt;li&gt;агрессивное кэширование данных, позволяющее в ряде случаев читать данные для исполнения запросов исключительно из памяти инстансов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"spyt\"&gt;&lt;a href=\"ru/overview/about.html#spyt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SPYT&lt;/span&gt;&lt;/a&gt;SPYT&lt;/h3&gt;\n&lt;p&gt;SPYT — технология, интегрирующая Apache Spark в качестве вычислительного движка поверх данных в YTsaurus. Как и в случае с CHYT, в качестве вычислительных ресурсов под кластер SPYT используются Vanilla операции YTsaurus.&lt;br /&gt;\nИспользование SPYT позволяет минимизировать расходы на IO и достичь многократного роста производительности для сложных аналитических процессов обработки данных.&lt;br /&gt;\nSPYT может читать как статические, так и динамические таблицы в YTsaurus, выполнять расчёты на них и записывать результат в статическую таблицу YTsaurus.&lt;/p&gt;\n&lt;h3 id=\"sdk\"&gt;&lt;a href=\"ru/overview/about.html#sdk\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SDK&lt;/span&gt;&lt;/a&gt;SDK&lt;/h3&gt;\n&lt;p&gt;Все API на популярных языках программирования (С++, Python, Java, Go) разработаны командой YTsaurus, поэтому в них учтены и продуманы все тонкости взаимодействия с системой. Клиентская часть YTsaurus для упомянутых языков позволяет записать или прочитать большой объем данных несмотря на возможные сетевые сбои и другие ошибки.&lt;/p&gt;\n&lt;h3 id=\"ui\"&gt;&lt;a href=\"ru/overview/about.html#ui\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Веб-интерфейс&lt;/span&gt;&lt;/a&gt;Веб-интерфейс&lt;/h3&gt;\n&lt;p&gt;В системе YTsaurus реализован единый веб-интерфейс для пользователей и администраторов. С его помощью можно:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;перемещаться по Кипарису и просматривать данные;&lt;/li&gt;\n&lt;li&gt;производить операции с таблицами, папками и файлами;&lt;/li&gt;\n&lt;li&gt;запускать и просматривать MapReduce-вычисления;&lt;/li&gt;\n&lt;li&gt;запускать и просматривать историю SQL-запросов во всех вычислительных движках — в YQL, CHYT, SQL динамических таблиц;&lt;/li&gt;\n&lt;li&gt;администрировать систему:\n&lt;ul&gt;\n&lt;li&gt;следить за состоянием компонент кластера;&lt;/li&gt;\n&lt;li&gt;создавать, удалять пользователей и группы;&lt;/li&gt;\n&lt;li&gt;управлять квотами;&lt;/li&gt;\n&lt;li&gt;просматривать настройки контроля доступа;&lt;/li&gt;\n&lt;li&gt;просматривать версии компонент кластера и многое другое.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/overview/about.md","sourcePath":"ru/overview/about.md"},"headings":[{"title":"Кластеры","href":"ru/overview/about.html#clusters","level":2},{"title":"Архитектура","href":"ru/overview/about.html#arhitektura","level":2,"items":[{"title":"Кипарис","href":"ru/overview/about.html#cypress","level":3},{"title":"Динамические таблицы","href":"ru/overview/about.html#dyn-tables","level":3},{"title":"MapReduce","href":"ru/overview/about.html#mapreduce","level":3},{"title":"YQL","href":"ru/overview/about.html#yql","level":3},{"title":"CHYT","href":"ru/overview/about.html#chyt","level":3},{"title":"SPYT","href":"ru/overview/about.html#spyt","level":3},{"title":"SDK","href":"ru/overview/about.html#sdk","level":3},{"title":"Веб-интерфейс","href":"ru/overview/about.html#ui","level":3}]}],"title":"Обзор"},"router":{"pathname":"ru/overview/about","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
