title: " {{product-name}} "
when: audience == "public"
href: index.md
analytics:
  text: 'We use <a href="https://yandex.com/legal/cookies_policy_eng">cookies</a> to ensure that you have the best experience on our website. If you continue to use our website, we assume that you are happy with it.'
  buttons:
    accept:
      text: "Ok"
      theme: "accent"
      size: "xl"
navigation:
  logo:
    url: "https://ytsaurus.tech/"
    dark:
      icon: "https://ytsaurus.tech/assets/logo-dark.svg"
    light:
      icon: "https://ytsaurus.tech/assets/logo-light.svg"
  header:
    leftItems:
      - text: "Как всё устроено"
        type: "dropdown"
        items:
          - text: "Архитектура YTsaurus"
            href: overview/about
          - text: "Кипарис"
            href: overview/about
          - text: "Планировщик и пулы"
            href: overview/about
          - text: "Обработка данных"
            href: overview/about
          - text: "Глоссарий"
            href: overview/about
          - text: "Версии продукта"
            href: overview/about
      - text: "Разработчикам"
        type: "dropdown"
        items:
          - text: "Запустить свой первый MapReduce"
            href: overview/about
          - text: Работа с динамическими таблицами
            href: overview/about
          - text: "Транзакции и конкурентный доступ"
            href: overview/about
          - text: "SDK и API"
            href: overview/about
          - text: "Очереди (Queue API)"
            href: overview/about
          - text: "Локальное тестирование и CI/CD"
            href: overview/about
      - text: "Администраторам"
        type: "dropdown"
        items:
          - text: "Развертывание кластера"
            href: overview/about
          - text: "Управление вычислительными пулами"
            href: overview/about
          - text: "Контроль доступа (ACL и Аккаунты)"
            href: overview/about
          - text: "Управление динамическими таблицами"
            href: overview/about
          - text: "Мониторинг и метрики"
            href: overview/about
          - text: "Траблшутинг"
            href: overview/about
      - text: "ML / AI"
        type: "dropdown"
        items:
          - text: "SPYT (Spark поверх YT)"
            href: overview/about
          - text: "Запуск SPYT из Jupyter Notebook"
            href: overview/about
          - text: "Управление Python-окружениями"
            href: overview/about
          - text: "Работа с GPU-пулами"
            href: overview/about
          - text: "Интеграция с ML-фреймворками"
            href: overview/about
      - text: "Инструменты"
        type: "dropdown"
        items:
          - text: "Справочник YQL"
            href: overview/about
          - text: "Справочник CHYT"
            href: overview/about
          - text: "CLI интерфейс (yt-утилита)"
            href: overview/about
          - text: "Python SDK (yt-wrapper)"
            href: overview/about
          - text: "Query Tracker API"
            href: overview/about
      - text: "Telegram"
        type: "link"
        url: "https://t.me/ytsaurus"
        icon: "https://storage.yandexcloud.net/ytsaurus-www/assets/favicon-telegram.svg"
      - text: "GitHub"
        type: "link"
        url: "https://github.com/ytsaurus/ytsaurus"
        icon: "https://storage.yandexcloud.net/ytsaurus-www/assets/favicon-github.svg"

items:
   - name: " Начало работы "
     labeled: true
     items:
       - name: Обзор {{product-name}}
         href: overview/about.md
       - name: Архитектура
         href: overview/about.md
       - name: Как попробовать
         href: overview/about.md
       - name: Глоссарий
         href: overview/about.md
       - name: Сообщить о проблеме
         href: overview/about.md
       - name: Полезные материалы
         href: overview/about.md
   - name: "Хранение данных"
     labeled: true
     items:
        - name: "Кипарис"
          href: overview/about.md
        - name: "Форматы"
          href: overview/about.md
   - name: "Обработка данных"
     labeled: true
     items:
        - name: "Планировщик"
          href: overview/about.md
