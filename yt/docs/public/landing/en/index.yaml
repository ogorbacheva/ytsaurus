fullScreen: true
blocks:
  - type: header-block
    width: s
    offset: default
    title: 'YTsaurus documentation'
    description: 'A scalable big data platform that brings distributed storage, MapReduce, SQL, Spark, and ClickHouse together in one cluster.'
    verticalOffset: l
    buttons:
      - text: 'Get started'
        primary: true
        theme: action
        size: xl
        url: '{{ core-docs-root }}/{{ lang }}/user-guide/tutorials/quick-start{{ docs-revision-query }}'
      - text: 'GitHub'
        theme: outlined
        size: xl
        url: 'https://github.com/ytsaurus/ytsaurus'

  - type: card-layout-block
    title: 'Choose by task'
    colSizes:
      all: 12
      md: 4
      sm: 6
    children:
      - type: basic-card
        title: 'Get started with YTsaurus'
        text: 'Run a local cluster and execute your first commands.'
        url: '{{ core-docs-root }}/{{ lang }}/user-guide/tutorials/quick-start{{ docs-revision-query }}'
      - type: basic-card
        title: 'Store and organize data'
        text: 'Cypress, static tables, schemas, transactions, and files.'
        url: '{{ core-docs-root }}/{{ lang }}/user-guide/explanation/storage/cypress{{ docs-revision-query }}'
      - type: basic-card
        title: 'Build a low-latency service or queue'
        text: 'Dynamic tables, transactions, replication, and queues.'
        url: '{{ core-docs-root }}/{{ lang }}/user-guide/explanation/dynamic-tables/overview{{ docs-revision-query }}'
      - type: basic-card
        title: 'Run batch computations'
        text: 'Map, Reduce, MapReduce, Sort, Merge, and Vanilla.'
        url: '{{ core-docs-root }}/{{ lang }}/user-guide/reference/data-processing/operations/overview{{ docs-revision-query }}'
      - type: basic-card
        title: 'Run an SQL query'
        text: 'Run queries and inspect their history with Query Tracker.'
        url: '{{ core-docs-root }}/{{ lang }}/user-guide/explanation/query-tracker/about{{ docs-revision-query }}'
      - type: basic-card
        title: 'Work with Spark'
        text: 'Run Spark workloads over data stored in YTsaurus.'
        url: '{{ spyt-docs-root }}/{{ lang }}/concepts/index{{ docs-revision-query }}'
      - type: basic-card
        title: 'Build a streaming pipeline'
        text: 'Process streams with Spark Structured Streaming.'
        url: '{{ spyt-docs-root }}/{{ lang }}/concepts/structured-streaming/index{{ docs-revision-query }}'
      - type: basic-card
        title: 'Connect through APIs and tools'
        text: 'Get started with the Python API and client libraries.'
        url: '{{ core-docs-root }}/{{ lang }}/user-guide/how-to-guides/api/python/start{{ docs-revision-query }}'
      - type: basic-card
        title: 'Install and operate the platform'
        text: 'Deploy a cluster, configure components, and run it in production.'
        url: '{{ core-docs-root }}/{{ lang }}/admin-guide/how-to-guides/cluster-operations{{ docs-revision-query }}'

  - type: card-layout-block
    title: 'Choose a component'
    colSizes:
      all: 12
      md: 4
      sm: 6
    children:
      - type: layout-item
        content:
          title: 'YTsaurus Core'
          text: 'Cypress, storage, dynamic tables, MapReduce, APIs, and operation of the core cluster.'
          links:
            - text: 'Open documentation'
              url: '{{ core-docs-root }}/{{ lang }}/user-guide/explanation/overview{{ docs-revision-query }}'
              theme: normal
              arrow: true
        media:
          image: '_assets/hub/pict1.svg'
        border: true
      - type: layout-item
        content:
          title: 'CHYT'
          text: 'ClickHouse on YTsaurus: OLAP queries, cliques, APIs, installation, and operation.'
          links:
            - text: 'Open documentation'
              url: '{{ chyt-docs-root }}/{{ lang }}/user-guide/explanation/about-chyt{{ docs-revision-query }}'
              theme: normal
              arrow: true
        media:
          image: '_assets/hub/pict3.svg'
        border: true
      - type: layout-item
        content:
          title: 'SPYT'
          text: 'Apache Spark on YTsaurus: Spark SQL, Structured Streaming, clusters, and Jupyter.'
          links:
            - text: 'Open documentation'
              url: '{{ spyt-docs-root }}/{{ lang }}/concepts/index{{ docs-revision-query }}'
              theme: normal
              arrow: true
        media:
          image: '_assets/hub/pict4.svg'
        border: true
