  core-user-guide-reference-data-processing-operations-overview-md-audience-1: "\n Например, чтобы читать с кластера `my-cluster`, нужно указать `<cluster=my-cluster>//path/to/table` или `my-cluster://path/to/table` качестве входной таблицы (см. также [RichYPath](https://ytsaurus.tech/docs/core/reference/storage/ypath#rich_ypath)).\n Для того, чтобы кластер мог быть использован в качестве входного, он должен быть добавлен администратором в `//sys/clusters`.\n"
  core-user-guide-reference-data-processing-operations-remote-copy-md-audience-1: ""
  core-user-guide-reference-data-processing-operations-remote-copy-md-audience-2: ""
  core-user-guide-reference-dynamic-tables-hunks-guide-md-audience-1: "\n- К таблице применяется versioned remote copy (или скрипт по добавлению реплик к реплицированной таблице). Сейчас для таблиц с ханковыми чанками не поддержана возможность делать versioned remote copy. Эта функциональность доступна начиная с версии 25.1. Тем не менее, в ручном режиме это возможно, см. [FAQ](#faq).\n"
  core-user-guide-reference-dynamic-tables-hunks-guide-md-audience-2: ""
  core-user-guide-reference-dynamic-tables-hunks-guide-md-audience-3: "\n#### Как применить versioned remote copy к таблице, содержащей ханковые чанки?\n\nПрименение versioned remote copy к таблицам, содержащим ханковые чанки, доступно начиная с версии 25.1. До этой версии для использования versioned remote copy необходимо сначала избавиться от ханковых чанков в таблице:\n- Заменяем значения `max_inline_hunk_size` в схеме на 9223372036854775807 (I64_MAX).\n- Запускаем forced compaction на таблице (если таблица большая, то потаблетно).\n- Убеждаемся, что ханковых чанков не осталось: например, с помощью чтения атрибута таблицы `@chunk_format_statistics` проверяем, что не осталось чанков типа `hunk_default`.\n"
  core-user-guide-reference-dynamic-tables-queues-md-audience-1: ""
  core-user-guide-reference-dynamic-tables-queues-md-audience-2: ""
  core-user-guide-reference-dynamic-tables-queues-md-audience-3: ""
  core-user-guide-reference-dynamic-tables-queues-md-audience-4: "\n### Экспорты очередей в статические таблицы\n\nQueue Agent позволяет настроить регулярный процесс экспорта данных из очереди в статические таблицы. При экспорте не происходит физического перекладывания данных из очереди в статическую таблицу, поскольку экспорт реализован на уровне метаинформации. Экспортированная таблица ссылается на те же чанки, что и в очереди, вместо создания новых чанков с теми же данными.\n\n#### Параметры экспорта\n- `export_directory` (обязательный) - директория, в которую будут попадать создаваемые статические таблицы.\n- `export_period` (обязательный) - регулярность экспорта. Должна быть кратна 1 секунде. Выражается числом миллисекунд, например, `export_period=300000` задает экспорт каждые 300 секунд.\n- `export_ttl` - [`expiration_timeout`](https://ytsaurus.tech/docs/core/concepts/storage/cypress#TTL) для создаваемых таблиц.\n- `output_table_name_pattern`: шаблон имени таблицы. Значение по умолчанию - `%UNIX_TS-%PERIOD`. При использования значения, отличного от значения по умолчанию, для корректной работы экспортов необходимо, чтобы разные итерации экспорта генерировали различные имена таблиц, иначе поведение не определено. `output_table_name_pattern` поддерживает формат `strftime`, а так же дополнительно:\n  - `%UNIX_TS` - Unix Timestamp границы экспорта, конкретная граница определяется параметром `use_upper_bound_for_table_names`.\n  - `%PERIOD` - `export_period` в секундах\n  - `%ISO` - ISO 8601 форматированное время экспорта, например, `2015-11-21T23:30:27Z`.\n- `use_upper_bound_for_table_names` - определяет, какая временная граница используется в имени таблицы.  По умолчанию `false`. Значение `false` использует нижнюю границу экспорта, `true` - верхнюю.\n\nПолная конфигурация экспортов очереди выглядит как маппинг из названия экспорта в его параметры, например:\n```\n{\n    default={\n        export_period=60000;\n        export_directory=\"//path/to/export/dir\";\n    };\n    another_export={\n        export_period=300000;\n        export_directory=\"//path/to/another/export/dir\";\n    };\n}\n```\n\nДанная конфигурация выставляется в атрибут `static_export_config` очереди или в этот же атрибут реплики очереди в случае реплицированных и хаосных таблиц, например,\n```bash\n$ yt set //path/to/some/queue/@static_export_config '...'\n```\n\n#### Настройка директории экспорта\n\nДля проверки прав на создание статических таблиц в директорию экспорта необходимо на директорию выставить атрибут `queue_static_export_destination` с указанием id очереди:\n```bash\n$ yt get //path/to/your/queue/@id\n\"18f-50544-3ea0191-fc6c51c5\" # пример id очереди\n\n$ yt set //path/to/your/export/directory/@queue_static_export_destination \\\n    '{originating_queue_id=\"18f-50544-3ea0191-fc6c51c5\"}' # в originating_queue_id должен быть id вашей очереди\n```\n\n#### Прогресс экспортов\n\nQueue Agent использует атрибут `queue_static_export_progress` на директории экспорта для хранения внутренней информации о том, какие данные уже были экспортированы. Содержание этого атрибута не является частью публичного API. В нормальных случаях пользователь не должен никак менять этот атрибут или завязываться на его содержимое. При этом в случае изменения `originating_queue_id` директории экспорта для гарантии корректной работы стоит удалить этот атрибут:\n```bash\n$ yt remove //path/to/your/export/directory/@queue_static_export_progress\n```\n\n#### Автоматический трим по экспортам\n\nЭкспорт можно считать виртуальным витальным консьюмером очереди и при включении автоматического трима данные будут удаляться только если их прочли все витальные консьюмеры и они были экспортированы.\n\n#### Внутреннее устройство экспортов\n\nВременные границы итерации экспорта: данные для экспорта бьются по unix timestamp кратным `export_period`. Верхняя граница берется включительно, нижняя невключительно.\n\nС учетом этого в экспорт попадают все неэкспортированные (для этого экспорта) пофлашеные чанки с `max_timestamp` менее верхней границы итерации экспорта.\n\nВ силу этого включение экспорта для очереди, в которой уже есть большое количество данных, создаст первый большой экспорт, потому что все чанки не экспортированы, а начиная со следующей итерации, Queue Agent будет экспортировать пофлашенные данные записанные в очередь после предыдущего экспорта.\n\n{% note info %}\n\nТребования флаша данных подразумевает, что экспортировать данные можно не чаще, чем они флашатся. По умолчанию dynamic store flush происходит раз в 15 минут и без изменения параметров флаша очереди экспорты с периодом меньше 15 минут не имеют смысла и лишь создают лишнюю нагрузку на мастер сервер. [Документация](https://ytsaurus.tech/docs/core/how-to-guides/dynamic-tables/compaction#flush_attributes) по настройке flush динамических таблиц.\n\n{% endnote %}\n\nДругое следствие внутреннего устройства экспортов в том, что Queue Agent не может предоставить строгие гарантии на timestamp данных, попадаемых в экспорты.  Чанк для экспорта берется целиком и может содержать данные, которые логически принадлежат различным итерациям экспорта.\n\nВ случае если очередная итерация экспорта завершилась неуспешно, данные будут экспортированы в следующей итерации экспорта и таблица-экспорт будет содержать данные за 2 итерации экспорта.\n\n"
