  core-user-guide-reference-storage-quotas-md-audience-1: "\n\nВ том случае, когда проект использует динамические таблицы в production, для изоляции от других пользователей необходимо завести отдельный [таблет-селл бандл](https://ytsaurus.tech/docs/core/concepts/dynamic-tables/concepts#tablet_cell_bundles). Таблет-селл бандл представляет собой группу контейнеров (инстансов), которая отвечает за обработку запросов к динамическим таблицам проекта.\n\n"
