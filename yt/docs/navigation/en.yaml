navigation:
  logo:
    url: "{{ landing-docs-root }}/{{ lang }}/{{ docs-revision-query }}"
    urlTitle: "Go to the documentation home page"
    dark:
      icon: "https://ytsaurus.tech/assets/logo-dark.svg"
    light:
      icon: "https://ytsaurus.tech/assets/logo-light.svg"
  header:
    leftItems:
      - type: dropdown
        text: "Get started"
        items:
          - type: column
            items:
              - type: section
                title: "YTsaurus Core"
                items:
                  - type: link
                    text: "Platform overview"
                    url: "{{ core-docs-root }}/{{ lang }}/user-guide/explanation/overview{{ docs-revision-query }}"
                  - type: link
                    text: "Quick start"
                    url: "{{ core-docs-root }}/{{ lang }}/user-guide/tutorials/quick-start{{ docs-revision-query }}"
                  - type: link
                    text: "Architecture and core concepts"
                    url: "{{ core-docs-root }}/{{ lang }}/user-guide/explanation/concepts/general{{ docs-revision-query }}"
          - type: column
            items:
              - type: section
                title: "Processing engines"
                items:
                  - type: link
                    text: "Run your first YQL query"
                    url: "{{ yql-docs-root }}/{{ lang }}/yql/"
                  - type: link
                    text: "Run a Spark job"
                    url: "{{ spyt-docs-root }}/{{ lang }}/how-to-guides/run-spark-jobs{{ docs-revision-query }}"
                  - type: link
                    text: "Run your first CHYT query"
                    url: "{{ chyt-docs-root }}/{{ lang }}/user-guide/how-to-guides/try-chyt{{ docs-revision-query }}"
      - type: dropdown
        text: "Guides"
        items:
          - type: column
            items:
              - type: section
                title: "Development"
                items:
                  - type: link
                    text: "Python API"
                    url: "{{ core-docs-root }}/{{ lang }}/user-guide/how-to-guides/api/python/start{{ docs-revision-query }}"
                  - type: link
                    text: "Dynamic tables"
                    url: "{{ core-docs-root }}/{{ lang }}/user-guide/explanation/dynamic-tables/overview{{ docs-revision-query }}"
                  - type: link
                    text: "Develop SPYT applications"
                    url: "{{ spyt-docs-root }}/{{ lang }}/how-to-guides/development/index{{ docs-revision-query }}"
                  - type: link
                    text: "CHYT CLI and Python API"
                    url: "{{ chyt-docs-root }}/{{ lang }}/user-guide/reference/cli-and-api{{ docs-revision-query }}"
          - type: column
            items:
              - type: section
                title: "Data processing"
                items:
                  - type: link
                    text: "MapReduce and distributed compute"
