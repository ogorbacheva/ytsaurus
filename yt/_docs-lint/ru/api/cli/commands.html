--attach&lt;/code&gt;    Attach to the logs stream&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--rate&lt;/code&gt;    Logs reading period in seconds, default: &lt;code&gt;1.0&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--print-host&lt;/code&gt;    Print controller’s hostname&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"generate-timestamp\"&gt;&lt;a href=\"ru/api/cli/commands.html#generate-timestamp\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;generate-timestamp&lt;/span&gt;&lt;/a&gt;generate-timestamp&lt;/h3&gt;\n&lt;p&gt;generates timestamp&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;usage: yt generate-timestamp [-h] [--params PARAMS]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6469\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6469\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6469\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6469.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"named-arguments138\"&gt;&lt;a href=\"ru/api/cli/commands.html#named-arguments138\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named Arguments&lt;/span&gt;&lt;/a&gt;Named Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--params&lt;/code&gt;    specify additional params. structured params in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"get-features\"&gt;&lt;a href=\"ru/api/cli/commands.html#get-features\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;get-features&lt;/span&gt;&lt;/a&gt;get-features&lt;/h3&gt;\n&lt;p&gt;retrieves supported cluster features (data types, codecs etc.). Get cluster features (types, codecs etc.)&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;usage: yt get-features [-h] [--params PARAMS] [--format FORMAT]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6484\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6484\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6484\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6484.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"named-arguments139\"&gt;&lt;a href=\"ru/api/cli/commands.html#named-arguments139\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named Arguments&lt;/span&gt;&lt;/a&gt;Named Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--params&lt;/code&gt;    specify additional params. structured params in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--format&lt;/code&gt;    response or input format: yson or json, for example: «&amp;lt;format=binary&amp;gt;yson». See also: &lt;a href=\"user-guide/storage/formats.html\"&gt;Formats&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"jupyt\"&gt;&lt;a href=\"ru/api/cli/commands.html#jupyt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;jupyt&lt;/span&gt;&lt;/a&gt;jupyt&lt;/h3&gt;\n&lt;p&gt;Jupyter over YTsaurus commands&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;usage: yt jupyt [-h] jupyter_command ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6504\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6504\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6504\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6504.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"positional-arguments116\"&gt;&lt;a href=\"ru/api/cli/commands.html#positional-arguments116\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Positional Arguments&lt;/span&gt;&lt;/a&gt;Positional Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;jupyter_command&lt;/code&gt;    Possible choices: ctl&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h4 id=\"sub-commands6\"&gt;&lt;a href=\"ru/api/cli/commands.html#sub-commands6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sub-commands&lt;/span&gt;&lt;/a&gt;Sub-commands&lt;/h4&gt;\n&lt;h5 id=\"ctl2\"&gt;&lt;a href=\"ru/api/cli/commands.html#ctl2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ctl&lt;/span&gt;&lt;/a&gt;ctl&lt;/h5&gt;\n&lt;p&gt;JUPYT controller&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt jupyt ctl [--address ADDRESS] [--stage STAGE] [--cluster-name CLUSTER_NAME] &lt;span class=\"hljs-built_in\"&gt;command&lt;/span&gt; ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6522\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6522\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6522\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6522.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h6 id=\"positional-arguments117\"&gt;&lt;a href=\"ru/api/cli/commands.html#positional-arguments117\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Positional Arguments&lt;/span&gt;&lt;/a&gt;Positional Arguments&lt;/h6&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;command&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h6 id=\"named-arguments140\"&gt;&lt;a href=\"ru/api/cli/commands.html#named-arguments140\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named Arguments&lt;/span&gt;&lt;/a&gt;Named Arguments&lt;/h6&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--address&lt;/code&gt;    controller service address; may contain {stage}, {family} and {host_suffix} parameters; the default value is fetched from the remote client config&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--stage&lt;/code&gt;    controller stage, default: &lt;code&gt;«production»&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--cluster-name&lt;/code&gt;    cluster name under which the cluster is configured in the strawberry controller; the default value is fetched from the remote client config&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"remove-maintenance\"&gt;&lt;a href=\"ru/api/cli/commands.html#remove-maintenance\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;remove-maintenance&lt;/span&gt;&lt;/a&gt;remove-maintenance&lt;/h3&gt;\n&lt;p&gt;removes maintenance requests from given node by id or filter&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;usage: yt remove-maintenance [-h] [--params PARAMS] [-c COMPONENT] [-a ADDRESS] [--&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt; ID] [--ids IDS] [-t TYPE] [-u USER] [--mine MINE] [--all ALL]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6555\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6555\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6555\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6555.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"named-arguments141\"&gt;&lt;a href=\"ru/api/cli/commands.html#named-arguments141\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named Arguments&lt;/span&gt;&lt;/a&gt;Named Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--params&lt;/code&gt;    specify additional params. structured params in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;-c, --component&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;-a, --address&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--id&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--ids&lt;/code&gt;    structured ids in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;-t, --type&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;-u, --user&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--mine&lt;/code&gt;    Default: &lt;code&gt;False&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--all&lt;/code&gt;    Default: &lt;code&gt;False&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"run-command-with-lock\"&gt;&lt;a href=\"ru/api/cli/commands.html#run-command-with-lock\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run-command-with-lock&lt;/span&gt;&lt;/a&gt;run-command-with-lock&lt;/h3&gt;\n&lt;p&gt;. Run command under lock&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;usage: yt run-command-with-lock [-h] [--params PARAMS] [--shell] [--poll-period POLL_PERIOD] [--conflict-exit-code CONFLICT_EXIT_CODE] [--set-address] [--address-path ADDRESS_PATH] [--recursive]\n                                path &lt;span class=\"hljs-built_in\"&gt;command&lt;/span&gt; [&lt;span class=\"hljs-built_in\"&gt;command&lt;/span&gt; ...]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6610\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6610\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6610\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6610.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"positional-arguments118\"&gt;&lt;a href=\"ru/api/cli/commands.html#positional-arguments118\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Positional Arguments&lt;/span&gt;&lt;/a&gt;Positional Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;path&lt;/code&gt;    Path to the lock in Cypress&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;command&lt;/code&gt;    Command to execute&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h4 id=\"named-arguments142\"&gt;&lt;a href=\"ru/api/cli/commands.html#named-arguments142\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named Arguments&lt;/span&gt;&lt;/a&gt;Named Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--params&lt;/code&gt;    specify additional params. structured params in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--shell&lt;/code&gt;    Run command in subshell&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--poll-period&lt;/code&gt;    Poll period for command process in seconds, default: &lt;code&gt;1.0&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--conflict-exit-code&lt;/code&gt;    Exit code in case of lock conflict, default: &lt;code&gt;1&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--set-address&lt;/code&gt;    Set address of current host (in lock attribute by default)&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--address-path&lt;/code&gt;    Path to set host address&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&g
