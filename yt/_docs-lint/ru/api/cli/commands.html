  yson map fragment with filtering attributes, e.g. k1=v1;k2=v2&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--depth&lt;/code&gt;    recursion depth (infinite by default)&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;-l, --long-format&lt;/code&gt;    print some extra information about nodes&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--recursive-resource-usage&lt;/code&gt;    use recursive resource usage for in long format mode&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--time-type&lt;/code&gt;    Possible choices: access_time, modification_time, creation_time&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;type of time to use in long-format, default: &lt;code&gt;«modification_time»&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--read-from&lt;/code&gt;    Can be set to «cache» to enable reads from system cache&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--cache-sticky-group-size&lt;/code&gt;    Size of sticky group size for read_from=»cache» mode&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"get\"&gt;&lt;a href=\"ru/api/cli/commands.html#get\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;get&lt;/span&gt;&lt;/a&gt;get&lt;/h3&gt;\n&lt;p&gt;gets Cypress node content (attribute tree)&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;usage: yt get [-h] [--params PARAMS] [--path PATH] [--max-size MAX_SIZE] [--format FORMAT] [--attribute ATTRIBUTES] [--suppress-transaction-coordinator-sync] [--read-from READ_FROM]\n              [--cache-sticky-group-size CACHE_STICKY_GROUP_SIZE]\n              [path]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"543\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-543\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-543\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-543.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"positional-arguments7\"&gt;&lt;a href=\"ru/api/cli/commands.html#positional-arguments7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Positional Arguments&lt;/span&gt;&lt;/a&gt;Positional Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;path&lt;/code&gt;    address in Cypress. See also: &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPATH&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h4 id=\"named-arguments8\"&gt;&lt;a href=\"ru/api/cli/commands.html#named-arguments8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named Arguments&lt;/span&gt;&lt;/a&gt;Named Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--params&lt;/code&gt;    specify additional params. structured params in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--path&lt;/code&gt;    address in Cypress. See also: &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPATH&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--max-size&lt;/code&gt;    maximum size of entries returned by get; if actual directory size exceeds that value only subset of entries will be listed (it’s not specified which subset); default value is enough to list any nonsystem directory.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--format&lt;/code&gt;    response or input format: yson or json, for example: «&amp;lt;format=binary&amp;gt;yson». See also: &lt;a href=\"user-guide/storage/formats.html\"&gt;Formats&lt;/a&gt;, default: &lt;code&gt;«&amp;lt;format=pretty&amp;gt;yson»&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--attribute&lt;/code&gt;    desired node attributes in the response Accepted multiple times.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--suppress-transaction-coordinator-sync&lt;/code&gt;    suppress transaction coordinator sync&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--read-from&lt;/code&gt;    Can be set to «cache» to enable reads from system cache&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--cache-sticky-group-size&lt;/code&gt;    Size of sticky group size for read_from=»cache» mode&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"internalize\"&gt;&lt;a href=\"ru/api/cli/commands.html#internalize\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;internalize&lt;/span&gt;&lt;/a&gt;internalize&lt;/h3&gt;\n&lt;p&gt;internalize cypress node&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;usage: yt internalize [-h] [--params PARAMS] [--path PATH] --cell-tag CELL_TAG [path]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"601\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-601\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-601\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-601.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"positional-arguments8\"&gt;&lt;a href=\"ru/api/cli/commands.html#positional-arguments8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Positional Arguments&lt;/span&gt;&lt;/a&gt;Positional Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;path&lt;/code&gt;    address in Cypress. See also: &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPATH&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h4 id=\"named-arguments9\"&gt;&lt;a href=\"ru/api/cli/commands.html#named-arguments9\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named Arguments&lt;/span&gt;&lt;/a&gt;Named Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--params&lt;/code&gt;    specify additional params. structured params in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--path&lt;/code&gt;    address in Cypress. See also: &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPATH&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--cell-tag&lt;/code&gt;    (Required)&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"link\"&gt;&lt;a href=\"ru/api/cli/commands.html#link\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;link&lt;/span&gt;&lt;/a&gt;link&lt;/h3&gt;\n&lt;p&gt;makes link to Cypress node&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;usage: yt &lt;span class=\"hljs-built_in\"&gt;link&lt;/span&gt; [-h] [--params PARAMS] [--target-path TARGET_PATH] [--link-path LINK_PATH] [-r] [-i] [-l] [-f] [--attributes ATTRIBUTES] [target_path] [link_path]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"634\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-634\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-634\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-634.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"positional-arguments9\"&gt;&lt;a href=\"ru/api/cli/commands.html#positional-arguments9\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Positional Arguments&lt;/span&gt;&lt;/a&gt;Positional Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;target_path&lt;/code&gt;    address of original node to link, path must exist. See also: &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPATH&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;link_path&lt;/code&gt;    address of resulting link, path must not exist. See also: &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPATH&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h4 id=\"named-arguments10\"&gt;&lt;a href=\"ru/api/cli/commands.html#named-arguments10\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named Arguments&lt;/span&gt;&lt;/a&gt;Named Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--params&lt;/code&gt;    specify additional params. structured params in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--target-path&lt;/code&gt;    address of original node to link, path must exist. See also: &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPATH&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--link-path&lt;/code&gt;    address of resulting link, path must not exist. See also: &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPATH&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;-r, --recursive&lt;/code&gt;    create parent nodes recursively&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;-i, --ignore-existing&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;-l, --lock-existing&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;-f, --force&lt;/code&gt;    force create link even if destination already exists (supported only on cluster with 19+ version)&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--attributes&lt;/code&gt;    structured attributes in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"list\"&gt;&lt;a href=\"ru/api/cli/commands.html#list\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;list&lt;/span&gt;&lt;/a&gt;list&lt;/h3&gt;\n&lt;p&gt;lists directory (map_node) content. Node type must be «map_node»&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;usage: yt list [-h] [--params PARAMS] [--path PATH] [-l] [--format FORMAT] [--attribute ATTRIBUTES] [--max-size MAX_SIZE] [--recursive-resource-usage] [--suppress-transaction-coordinator-sync]\n               [--read-from READ_FROM] [--cache-sticky-group-size CACHE_STICKY_GROUP_SIZE] [--absolute]\n               [path]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"697\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-697\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-697\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-697.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"positional-arguments10\"&gt;&lt;a href=\"ru/api/cli/commands.html#positional-arguments10\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Positional Arguments&lt;/span&gt;&lt;/a&gt;Positional Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;path&lt;/code&gt;    address in Cypress. See also: &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPATH&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h4 id=\"named-arguments11\"&gt;&lt;a href=\"ru/api/cli/commands.html#named-arguments11\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named Arguments&lt;/span&gt;&lt;/a&gt;Named Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--params&lt;/code&gt;    specify additional params. structured params in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--path&lt;/code&gt;    address in Cypress. See also: &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPATH&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;-l, --long-format&lt;/code&gt;    print some extra information about nodes&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--format&lt;/code&gt;    response or input format: yson or json, for example: «&amp;lt;format=binary&amp;gt;yson». See also: &lt;a href=\"user-guide/storage/formats.html\"&gt;Formats&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--attribute&lt;/code&gt;    node attributes to add into response Accepted multiple times.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--max-size&lt;/code&gt;    maximum size of entries returned by list; if actual directory size exceeds that value only subset of entries will be listed (it’s not specified which subset); default value is enough to list any nonsystem directory.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--recursive-resource-usage&lt;/code&gt;    use recursive resource usage for in long format mode&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--suppress-transaction-coordinator-sync&lt;/code&gt;    suppress transaction coordinator sync&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--read-from&lt;/code&gt;    Can be set to «cache» to enable reads from system cache&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--cache-sticky-group-size&lt;/code&gt;    Size of sticky group size for read_from=»cache» mode&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--absolute&lt;/code&gt;    print absolute paths&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"move\"&gt;&lt;a href=\"ru/api/cli/commands.html#move\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;move&lt;/span&gt;&lt;/a&gt;move&lt;/h3&gt;\n&lt;p&gt;moves (renames) Cypress node&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;usage: yt move [-h] [--params PARAMS] [--source-path SOURCE_PATH] [--destination-path DESTINATION_PATH] [--preserve-account | --no-preserve-account] [--preserve-owner | --no-preserve-owner]\n               [--preserve-creation-time] [--preserve-modification-time] [--preserve-expiration-time] [--preserve-expiration-timeout] [-r] [-f] [--no-pessimistic-quota-check]\n               [source_path] [destination_path]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"770\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-770\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-770\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-770.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"positional-arguments11\"&gt;&lt;a href=\"ru/api/cli/commands.html#positional-arguments11\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Positional Arguments&lt;/span&gt;&lt;/a&gt;Positional Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;source_path&lt;/code&gt;    old node address, path must exist. See also: &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPATH&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;destination_path&lt;/code&gt;    new node address, path must not exist. See also: &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPATH&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h4 id=\"named-arguments12\"&gt;&lt;a href=\"ru/api/cli/commands.html#named-arguments12\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named Arguments&lt;/span&gt;&lt;/a&gt;Named Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--params&lt;/code&gt;    specify additional params. structured params in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--source-path&lt;/code&gt;    old node address, path must exist. See also: &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPATH&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--destination-path&lt;/code&gt;    new node address, path must not exist. See also: &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPATH&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--preserve-account&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--no-preserve-account&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--preserve-owner&lt;/code&gt;&lt;/p&gt;\n&lt;/ ,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1339\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1339\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1339.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h6 id=\"named-arguments23\"&gt;&lt;a href=\"ru/api/cli/commands.html#named-arguments23\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named Arguments&lt;/span&gt;&lt;/a&gt;Named Arguments&lt;/h6&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--directory&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--store-full-path&lt;/code&gt;    Storing files\" full path as provided in –directory&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--part-size&lt;/code&gt;    Default: &lt;code&gt;4194304&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--recursive&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--no-recursive&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--yt-table&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--process-count&lt;/code&gt;    Default: &lt;code&gt;4&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--exact-filenames&lt;/code&gt;    Files to upload (separated by comma)&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--filter-by-regexp&lt;/code&gt;    Files with name matching that regexp will be uploaded&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--exclude-by-regexp&lt;/code&gt;    Files with name matching that regexp will not be uploaded&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--force&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--prepare-for-sky-share&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h5 id=\"download1\"&gt;&lt;a href=\"ru/api/cli/commands.html#download1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;download&lt;/span&gt;&lt;/a&gt;download&lt;/h5&gt;\n&lt;p&gt;Download directory from YTsaurus&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt dirtable download [-h] --directory DIRECTORY --yt-table YT_TABLE [--process-count PROCESS_COUNT] [--exact-filenames EXACT_FILENAMES] [--filter-by-regexp FILTER_BY_REGEXP]\n                     [--exclude-by-regexp EXCLUDE_BY_REGEXP]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1409\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1409\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1409\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1409.end+1\" fill=\"freeze\"&gt;&lt;/ ent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2970\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2970\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2970.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"named-arguments57\"&gt;&lt;a href=\"ru/api/cli/commands.html#named-arguments57\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named Arguments&lt;/span&gt;&lt;/a&gt;Named Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--params&lt;/code&gt;    specify additional params. structured params in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--mapper&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--reducer&lt;/code&gt;    (Required)&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--reduce-combiner&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--src&lt;/code&gt;    (Required)  Accepted multiple times.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--dst&lt;/code&gt;    (Required)  Accepted multiple times.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--map-file&lt;/code&gt;    &amp;gt; Accepted multiple times.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--map-local-file&lt;/code&gt;    &amp;gt; Accepted multiple times.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--reduce-file&lt;/code&gt;    &amp;gt; Accepted multiple times.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--reduce-local-file&lt;/code&gt;    &amp;gt; Accepted multiple times.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--reduce-combiner-file&lt;/code&gt;    &amp;gt; Accepted multiple times.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--reduce-combiner-local-file&lt;/code&gt;    &amp;gt; Accepted multiple times.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--mapper-memory-limit, --map-memory-limit&lt;/code&gt;    in MB&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--reducer-memory-limit, --reduce-memory-limit&lt;/code&gt;    in MB&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--reduce-combiner-memory-limit&lt;/code&gt;    in MB&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--reduce-by&lt;/code&gt;    (Required) Columns to reduce by. In order to choose descending sort order, provide a map of form \"{name=foo; sort_order=descending}\"&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--sort-by&lt;/code&gt;    Columns to sort by. Must be superset of reduce-by columns. By default is equal to –reduce-by option. In order to choose descending sort order, provide a map of form \"{name=foo; sort_order=descending}\"&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--spec&lt;/code&gt;    structured spec in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--format&lt;/code&gt;    (yson string), one of «yson», «json», «yamr», «dsv», «yamred_dsv», «schemaful_dsv» with modifications. See also: &lt;a href=\"user-guide/storage/formats.html\"&gt;Formats&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--map-input-format&lt;/code&gt;    see –format help&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--map-output-format&lt;/code&gt;    see –format help&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--reduce-input-format&lt;/code&gt;    see –format help&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--reduce-output-format&lt;/code&gt;    see –format help&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--reduce-combiner-input-format&lt;/code&gt;    see –format help&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--reduce-combiner-output-format&lt;/code&gt;    see –format help&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--async&lt;/code&gt;    do not track operation progress&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"merge\"&gt;&lt;a href=\"ru/api/cli/commands.html#merge\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;merge&lt;/span&gt;&lt;/a&gt;merge&lt;/h3&gt;\n&lt;p&gt;merges source tables to destination table&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;usage: yt merge [-h] [--params PARAMS] --src SOURCE_TABLE [SOURCE_TABLE ...] --dst DESTINATION_TABLE [--mode {unordered,ordered,sorted,auto}] [--print-statistics] [--async] [--spec SPEC]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3110\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3110\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3110\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3110.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"named-arguments58\"&gt;&lt;a href=\"ru/api/cli/commands.html#named-arguments58\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named Arguments&lt;/span&gt;&lt;/a&gt;Named Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--params&lt;/code&gt;    specify additional params. structured params in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--src&lt;/code&gt;    (Required)  Accepted multiple times.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--dst&lt;/code&gt;    (Required) path to destination table. For append mode add &amp;lt;append=true&amp;gt; before path. See also: &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPATH&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--mode&lt;/code&gt;    Possible choices: unordered, ordered, sorted, auto&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;use sorted mode for saving sortedness. unordered mode by default, ordered for saving order of chunks. Mode auto chooses from sorted and unordered modes depending on sortedness of source tables., default: &lt;code&gt;«auto»&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--print-statistics&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--async&lt;/code&gt;    do not track operation progress&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--spec&lt;/code&gt;    structured spec in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"reduce\"&gt;&lt;a href=\"ru/api/cli/commands.html#reduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;reduce&lt;/span&gt;&lt;/a&gt;reduce&lt;/h3&gt;\n&lt;p&gt;runs reduce operation&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;usage: yt reduce [-h] [--params PARAMS] [--binary &lt;span class=\"hljs-built_in\"&gt;command&lt;/span&gt;] --src SOURCE_TABLE [SOURCE_TABLE ...] --dst DESTINATION_TABLE [--file YT_FILES] [--local-file LOCAL_FILES] [--job-count JOB_COUNT]\n                 [--memory-limit MEMORY_LIMIT] [--spec SPEC] [--format FORMAT] [--input-format INPUT_FORMAT] [--output-format OUTPUT_FORMAT] [--print-statistics] [--async] [--reduce-by REDUCE_BY]\n                 [--sort-by SORT_BY] [--join-by JOIN_BY]\n                 [&lt;span class=\"hljs-built_in\"&gt;command&lt;/span&gt;]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3160\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3160\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3160\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3160.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"positional-arguments47\"&gt;&lt;a href=\"ru/api/cli/commands.html#positional-arguments47\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Positional Arguments&lt;/span&gt;&lt;/a&gt;Positional Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;command&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h4 id=\"named-arguments59\"&gt;&lt;a href=\"ru/api/cli/commands.html#named-arguments59\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named Arguments&lt;/span&gt;&lt;/a&gt;Named Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--params&lt;/code&gt;    specify additional params. structured params in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--binary&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--src&lt;/code&gt;    (Required)  Accepted multiple times.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--dst&lt;/code&gt;    (Required)  Accepted multiple times.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--file&lt;/code&gt;    &amp;gt; Accepted multiple times.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--local-file&lt;/code&gt;    &amp;gt; Accepted multiple times.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--job-count&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--memory-limit&lt;/code&gt;    in MB&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--spec&lt;/code&gt;    structured spec in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--format&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--input-format&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--output-format&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--print-statistics&lt;/code&gt;&lt;/p&gt;\n&lt; rguments&lt;/span&gt;&lt;/a&gt;Named Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--params&lt;/code&gt;    specify additional params. structured params in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--operation&lt;/code&gt;    operation id&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--job-type&lt;/code&gt;    filter jobs by job type&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--job-state&lt;/code&gt;    filter jobs by job state&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--address&lt;/code&gt;    filter jobs by node address&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--job-competition-id&lt;/code&gt;    filter jobs by job competition id&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--sort-field&lt;/code&gt;    Possible choices: type, state, start_time, finish_time, address, duration, progress, id&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;field to sort jobs by&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--sort-order&lt;/code&gt;    sort order. Can be either «ascending» or «descending»&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--limit&lt;/code&gt;    output limit&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--offset&lt;/code&gt;    offset starting from zero&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--with-spec&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--with-stderr&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--with-fail-context&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--with-competitors&lt;/code&gt;    with competitive jobs&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--with-monitoring-descriptor&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--with-interruption-info&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--include-cypress&lt;/code&gt;    include jobs from Cypress in result. Have effect only if –data-source is set to «manual»&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--include-runtime&lt;/code&gt;    include jobs from controller agents in result. Have effect only if –data-source is set to «manual»&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--include-archive&lt;/code&gt;    include jobs from archive in result. Have effect only if –data-source is set to «manual»&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--data-source&lt;/code&gt;    Possible choices: auto, runtime, archive, manual&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;data sources to list jobs from&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--format&lt;/code&gt;    response or input format: yson or json, for example: «&amp;lt;format=binary&amp;gt;yson». See also: &lt;a href=\"user-guide/storage/formats.html\"&gt;Formats&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"run-job-shell\"&gt;&lt;a href=\"ru/api/cli/commands.html#run-job-shell\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run-job-shell&lt;/span&gt;&lt;/a&gt;run-job-shell&lt;/h3&gt;\n&lt;p&gt;runs interactive shell in the job sandbox&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;usage: yt run-job-shell [-h] [--params PARAMS] [--shell-name SHELL_NAME] [--&lt;span class=\"hljs-built_in\"&gt;timeout&lt;/span&gt; TIMEOUT] [--&lt;span class=\"hljs-built_in\"&gt;command&lt;/span&gt; COMMAND] job_id [&lt;span class=\"hljs-built_in\"&gt;command&lt;/span&gt;]\n&lt;/code&gt;&lt;/pre&gt;\n\n -params&lt;/code&gt;    specify additional params. structured params in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--operation-id&lt;/code&gt;    Operation id (should be specified if proper core file naming is needed)&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--core-table-path&lt;/code&gt;    A path to the core table&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--job-id&lt;/code&gt;    Id of a job that produced core dump. If not specified, an arbitrary job with core dumps is taken&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--core-index&lt;/code&gt;    Indices of core dumps to download (indexing inside single job). Several indices may be specified. If not specified, all core dumps will be downloaded. Requires –job-id to be specified Accepted multiple times.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--output-directory&lt;/code&gt;    A directory to save the core dumps. Defaults to the current working directory, default: &lt;code&gt;«.»&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"job-tool\"&gt;&lt;a href=\"ru/api/cli/commands.html#job-tool\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;job-tool&lt;/span&gt;&lt;/a&gt;job-tool&lt;/h3&gt;\n&lt;p&gt;Tool helps to debug user job code by preparing job environment on local machine.&lt;/p&gt;\n&lt;p&gt;It downloads all necessary job files, fail context (small portion of job input data)&lt;br /&gt;\nand prepares run script.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;usage: yt job-tool [-h] [--params PARAMS] &lt;span class=\"hljs-built_in\"&gt;command&lt;/span&gt; ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"4652\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-4652\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-4652\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-4652.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"positional-arguments75\"&gt;&lt;a href=\"ru/api/cli/commands.html#positional-arguments75\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Positional Arguments&lt;/span&gt;&lt;/a&gt;Positional Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;command&lt;/code&gt;    Possible choices: prepare-job-environment, run-job&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h4 id=\"named-arguments94\"&gt;&lt;a href=\"ru/api/cli/commands.html#named-arguments94\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named Arguments&lt;/span&gt;&lt;/a&gt;Named Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--params&lt;/code&gt;    specify additional params. structured params in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h4 id=\"sub-commands1\"&gt;&lt;a href=\"ru/api/cli/commands.html#sub-commands1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sub-commands&lt;/span&gt;&lt;/a&gt;Sub-commands&lt;/h4&gt;\n&lt;h5 id=\"prepare-job-environmen ckquote&gt;\n&lt;p&gt;&lt;code&gt;job_id&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h6 id=\"named-arguments95\"&gt;&lt;a href=\"ru/api/cli/commands.html#named-arguments95\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named Arguments&lt;/span&gt;&lt;/a&gt;Named Arguments&lt;/h6&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--operation-id&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--job-id&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--job-path&lt;/code&gt;    output directory to store job environment. Default: &lt;code&gt;&amp;lt;cwd&amp;gt;/job_&amp;lt;job_id&amp;gt;&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--run&lt;/code&gt;    run job when job environment is prepared&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--full-input, --full&lt;/code&gt;    download input context of a job&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--context&lt;/code&gt;    download fail context of a job&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h5 id=\"run-job\"&gt;&lt;a href=\"ru/api/cli/commands.html#run-job\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run-job&lt;/span&gt;&lt;/a&gt;run-job&lt;/h5&gt;\n&lt;p&gt;runs job binary&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt job-tool run-job [-h] [--job-path JOB_PATH] [--&lt;span class=\"hljs-built_in\"&gt;env&lt;/span&gt; ENV] [job_path]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"4731\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-4731\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-4731\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-4731.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h6 id=\"positional-arguments77\"&gt;&lt;a href=\"ru/api/cli/commands.html#positional-arguments77\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Positional Arguments&lt;/span&gt;&lt;/a&gt;Positional Arguments&lt;/h6&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;job_path&lt;/code&gt;    path to prepared job environment&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h6 id=\"named-arguments96\"&gt;&lt;a href=\"ru/api/cli/commands.html#named-arguments96\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named Arguments&lt;/span&gt;&lt;/a&gt;Named Arguments&lt;/h6&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--job-path&lt;/code&gt;    path to prepared job environment&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--env&lt;/code&gt;    environment to use in script run in YSON format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"parquet-commands\"&gt;&lt;a href=\"ru/api/cli/commands.html#parquet-commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Parquet commands&lt;/span&gt;&lt;/a&gt;Parquet commands&lt;/h2&gt;\n&lt;h3 id=\"dump-orc\"&gt;&lt;a href=\"ru/api/cli/commands.html#dump-orc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;dump-orc&lt;/span&gt;&lt;/a&gt;dump-orc&lt;/h3&gt;\n&lt;p&gt;dump table with a strict schema as ORC &lt;a href=\"https://orc.apache.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;https://orc.apache.org/&lt;/a&gt; file&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;usage: yt dump-orc [-h] [--params PARAMS] [--table TABLE] --output-file OUTPUT_FILE [table]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"4762\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-4762\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-4762\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-4762.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"positional-arguments78\"&gt;&lt;a href=\"ru/api/cli/commands.html#positional-arguments78\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Positional Arguments&lt;/span&gt;&lt;/a&gt;Positional Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;table&lt;/code&gt;    address in Cypress. See also: &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPATH&lt;/a&gt;&lt;/p&gt;\n&lt \n&lt;p&gt;start query&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;usage: yt start-query [-h] [--params PARAMS] [--settings SETTINGS] [--files FILES] [--access-control-object ACCESS_CONTROL_OBJECT] [--access-control-objects ACCESS_CONTROL_OBJECTS] [--stage STAGE] engine query\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"5475\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-5475\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-5475\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-5475.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"positional-arguments92\"&gt;&lt;a href=\"ru/api/cli/commands.html#positional-arguments92\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Positional Arguments&lt;/span&gt;&lt;/a&gt;Positional Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;engine&lt;/code&gt;    engine of a query, one of «ql», «yql», «chyt», «spyt»&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;query&lt;/code&gt;    query text&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h4 id=\"named-arguments113\"&gt;&lt;a href=\"ru/api/cli/commands.html#named-arguments113\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named Arguments&lt;/span&gt;&lt;/a&gt;Named Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--params&lt;/code&gt;    specify additional params. structured params in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--settings&lt;/code&gt;    additional settings of a query in structured form. structured settings in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--files&lt;/code&gt;    query files, a YSON list of files, each of which is represented by a map with keys «name», «content», «type». Field «type» is one of «raw_inline_data», «url». structured files in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--access-control-object&lt;/code&gt;    optional access control object name (deprecated)&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--access-control-objects&lt;/code&gt;    access control objects, a YSON list of ACO names. structured access-control-objects in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--stage&lt;/code&gt;    query tracker stage, defaults to «production»&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"other-commands\"&gt;&lt;a href=\"ru/api/cli/commands.html#other-commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Other commands&lt;/span&gt;&lt;/a&gt;Other commands&lt;/h2&gt;\n&lt;h3 id=\"add-maintenance\"&gt;&lt;a href=\"ru/api/cli/commands.html#add-maintenance\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;add-maintenance&lt;/span&gt;&lt;/a&gt;add-maintenance&lt;/h3&gt;\n&lt;p&gt;adds maintenance request for a given node&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt; cli/commands.html#admin\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;admin&lt;/span&gt;&lt;/a&gt;admin&lt;/h3&gt;\n&lt;p&gt;Administer commands&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;usage: yt admin [-h] admin_command ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"5566\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-5566\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-5566\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-5566.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"positional-arguments93\"&gt;&lt;a href=\"ru/api/cli/commands.html#positional-arguments93\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Positional Arguments&lt;/span&gt;&lt;/a&gt;Positional Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;admin_command&lt;/code&gt;    Possible choices: switch-leader&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h4 id=\"sub-commands2\"&gt;&lt;a href=\"ru/api/cli/commands.html#sub-commands2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sub-commands&lt;/span&gt;&lt;/a&gt;Sub-commands&lt;/h4&gt;\n&lt;h5 id=\"switch-leader\"&gt;&lt;a href=\"ru/api/cli/commands.html#switch-leader\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;switch-leader&lt;/span&gt;&lt;/a&gt;switch-leader&lt;/h5&gt;\n&lt;p&gt;Switch master cell leader&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt admin switch-leader [-h] [--cell-id CELL_ID] [--new-leader-address NEW_LEADER_ADDRESS]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"5584\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-5584\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-5584\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-5584.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h6 id=\"named-arguments115\"&gt;&lt;a href=\"ru/api/cli/commands.html#named-arguments115\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named Arguments&lt;/span&gt;&lt;/a&gt;Named Arguments&lt;/h6&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--cell-id&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--new-leader-address&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"chyt\"&gt;&lt;a href=\"ru/api/cli/commands.html#chyt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;chyt&lt;/span&gt;&lt;/a&gt;chyt&lt;/h3&gt;\n&lt;p&gt;ClickHouse over YTsaurus commands&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;usage: yt chyt [-h] clickhouse_command ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"5604\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-5604\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-5604\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-5604.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"positional-arguments94\"&gt;&lt;a href=\"ru/api/cli/commands.html#positional-arguments94\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Positional Arguments&lt;/span&gt;&lt;/a&gt;Positional Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;clickhouse_command&lt;/code&gt;    Possible choices: start-clique, execute, ctl&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h4 id=\"sub-commands3\"&gt;&lt;a href=\"ru/api/cli/commands.html#sub-commands3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sub-commands&lt;/span&gt;&lt;/a&gt;Sub-commands&lt;/h4&gt;\n&lt;h5 id=\"start-clique\"&gt;&lt;a href=\"ru/api/cli/commands.html#start-clique\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;start-clique&lt;/span&gt;&lt;/a&gt;start-clique&lt;/h5&gt;\n&lt;p&gt;starts a CHYT clique consisting of a given number of instances&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt chyt start-clique [-h] --instance-count INSTANCE_COUNT [--&lt;span class=\"hljs-built_in\"&gt;alias&lt;/span&gt; ALIAS] [--cypress-ytserver-clickhouse-path CYPRESS_YTSERVER_CLICKHOUSE_PATH]\n                     [--cypress-clickhouse-trampoline-path CYPRESS_CLICKHOUSE_TRAMPOLINE_PATH] [--cypress-ytserver-log-tailer-path CYPRESS_YTSERVER_LOG_TAILER_PATH]\n                     [--cypress-base-config-path CYPRESS_BASE_CONFIG_PATH] [--cpu-limit CPU_LIMIT] [--cypress-geodata-path CYPRESS_GEODATA_PATH] [--abort-existing] [--artifact-path ARTIFACT_PATH]\n                     [--skip-version-compatibility-validation] [--spec SPEC] [--clickhouse-config CLICKHOUSE_CONFIG] [--memory-config MEMORY_CONFIG]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"5622\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-5622\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-5622\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-5622.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h6 id=\"named-arguments116\"&gt;&lt;a href=\"ru/api/cli/commands.html#named-arguments116\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named Arguments&lt;/span&gt;&lt;/a&gt;Named Arguments&lt;/h6&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--instance-count&lt;/code&gt;    (Required)&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--alias, --operation-alias&lt;/code&gt;    Alias for clique; may be also specified via CHYT_PROXY env variable&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--cypress-ytserver-clickhouse-path&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--cypress-clickhouse-trampoline-path&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--cypress-ytserver-log-tailer-path&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--cypress-base-config-path&lt;/code&gt;    Default: &lt;code&gt;«//sys/clickhouse/config»&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--cpu-limit&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--cypress-geodata-path&lt;/code&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--abort-existing&lt;/code&gt;    Abort existing operation under same alias&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--artifact-path&lt;/code&gt;    path for artifact directory; by default equals to //sys/clickhouse/kolkhoz/&amp;lt;operation_alias&amp;gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n ue\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Named Arguments&lt;/span&gt;&lt;/a&gt;Named Arguments&lt;/h4&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--params&lt;/code&gt;    specify additional params. structured params in yson format&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;--local&lt;/code&gt;    Do not gather info from cluster&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"flow\"&gt;&lt;a href=\"ru/api/cli/commands.html#flow\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;flow&lt;/span&gt;&lt;/a&gt;flow&lt;/h3&gt;\n&lt;p&gt;YTsaurus Flow commands&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;usage: yt flow [-h] flow_command ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6030\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6030\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6030\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6030.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"positional-arguments103\"&gt;&lt;a href=\"ru/api/cli/commands.html#positional-arguments103\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;spa
