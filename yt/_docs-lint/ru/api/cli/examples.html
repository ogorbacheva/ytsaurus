            {"data":{"leading":false,"html":"&lt;h2 id=\"zapusk-prostejshej-operacii\"&gt;&lt;a href=\"ru/api/cli/examples.html#zapusk-prostejshej-operacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск простейшей операции&lt;/span&gt;&lt;/a&gt;Запуск простейшей операции&lt;/h2&gt;\n&lt;p&gt;Для краткости в примерах ниже опущен параметр &lt;code&gt;--proxy &amp;lt;cluster_name&amp;gt;&lt;/code&gt; или предполагается, что установлена переменная окружения &lt;code&gt;YT_PROXY&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Создаем директорию, в которой будут храниться выходные таблицы&lt;/span&gt;\n$ yt create map_node //tmp/yt_cli_examples\n\n&lt;span class=\"hljs-comment\"&gt;# Запускаем grep по данным из логов; необходимо обязательно указать формат, в котором данные поступят на вход операции&lt;/span&gt;\n$ yt map &lt;span class=\"hljs-string\"&gt;'grep \"domain.com\" || exit 0'&lt;/span&gt; --src //home/logs/search/2017-Q3 --dst //tmp/yt_cli_examples/grep_result_table --format dsv\n\n....\n\n&lt;span class=\"hljs-comment\"&gt;# Смотрим, сколько получилось строк в выходной таблице&lt;/span&gt;\n$ yt get //tmp/yt_cli_examples/grep_result_table/@row_count\n\n&lt;span class=\"hljs-comment\"&gt;# Смотрим на первые 10 строк, указание формата обязательно&lt;/span&gt;\n$ yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'//tmp/yt_cli_examples/grep_result_table[:#10]'&lt;/span&gt; --format dsv\n\n&lt;span class=\"hljs-comment\"&gt;# Считываем 6 и 7 строчки (нумерация с нуля) — в квадратных скобках задаётся полуинтервал, включающий левую границу и не включающий правую&lt;/span&gt;\n$ yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'//tmp/yt_cli_examples/grep_result_table[#5:#7]'&lt;/span&gt; --format dsv\n\n&lt;span class=\"hljs-comment\"&gt;# Поколоночное чтение&lt;/span&gt;\n$ yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'//tmp/yt_cli_examples/grep_result_table{column1,column2}'&lt;/span&gt; --format dsv\n\n&lt;span class=\"hljs-comment\"&gt;# Только для сортированной таблицы&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# Смотрим диапазон ключей в таблице c \"key_begin\" по \"key_end\" (полуинтервал, включающий левую границу и не включающий правую)&lt;/span&gt;\n$ yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'//tmp/yt_cli_examples/grep_result_table[\"key_begin\":\"key_end\"]'&lt;/span&gt; --format dsv\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"komandy-get,-set-i-remove\"&gt;&lt;a href=\"ru/api/cli/examples.html#komandy-get,-set-i-remove\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Команды get, set и remove&lt;/span&gt;&lt;/a&gt;Команды get, set и remove&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //home/@count\n36\n$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/@custom_attribute &lt;span class=\"hljs-string\"&gt;'{x=y}'&lt;/span&gt;\n$ yt get //home/@custom_attribute\n{\n    &lt;span class=\"hljs-string\"&gt;\"x\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"y\"&lt;/span&gt;\n}\n$ yt remove //home/@custom_attribute\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"10\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-10\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-10\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-10.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"komandy-find-i-list\"&gt;&lt;a href=\"ru/api/cli/examples.html#komandy-find-i-list\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Команды find и list&lt;/span&gt;&lt;/a&gt;Команды find и list&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt find / --name &lt;span class=\"hljs-string\"&gt;\"dev\"&lt;/span&gt;\n//home/dev\n//tmp/images/dev\n//tmp/music/dev\n...\n$ yt list //home\nabc_feedback\nabt\nabt-dev\nabt-viewers\nacid\n...\n$ yt list //home -l\nmap_node  abc_feedback 0.0B 2017-02-28 09:40 abc_feedback\nmap_node  abt          0.0B 2019-05-28 08:37 abt\nmap_node  abt-dev      0.0B 2019-04-28 20:23 abt-dev\nmap_node  abt-viewers  0.0B 2019-03-26 12:55 abt-viewers\nmap_node  dev          0.0B 2016-10-21 11:34 acid\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"14\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-14\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-14\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-14.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"komandy-read-i-write\"&gt;&lt;a href=\"ru/api/cli/examples.html#komandy-read-i-write\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Команды read и write&lt;/span&gt;&lt;/a&gt;Команды read и write&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ &lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"x=10\"&lt;/span&gt; | yt write //tmp/yt_cli_examples/table --format dsv\n$ yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; //tmp/yt_cli_examples/table --format dsv\nx=10\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"18\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-18\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-18\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-18.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ &lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; -e &lt;span class=\"hljs-string\"&gt;\"x=10\\ty=20\"&lt;/span&gt; | yt write //tmp/yt_cli_examples/table --format dsv\n$ yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; //tmp/yt_cli_examples/table --format dsv\nx=10   y=20\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"19\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-19\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-19\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-19.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опция &lt;code&gt;--format&lt;/code&gt; является обязательной и регулирует &lt;a href=\"user-guide/storage/formats.html\"&gt;формат&lt;/a&gt;, в котором будут прочитаны данные.&lt;/p&gt;\n&lt;p&gt;Используя &lt;code&gt;--format \"&amp;lt;format=text&amp;gt;yson\" --control-attributes '{enable_row_index=%true}'&lt;/code&gt; можно узнать номер первой строки в заказанном диапазоне.&lt;/p&gt;\n&lt;h2 id=\"komandy-write-file-i-read-file\"&gt;&lt;a href=\"ru/api/cli/examples.html#komandy-write-file-i-read-file\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Команды write-file и read-file&lt;/span&gt;&lt;/a&gt;Команды write-file и read-file&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; binary | yt write-file //tmp/yt_cli_examples/binary --executable\n$ yt read-file //tmp/yt_cli_examples/binary &amp;gt; binary_copy\n$ diff binary binary_copy\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"29\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-29\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-29\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-29.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"zapusk-operacij\"&gt;&lt;a href=\"ru/api/cli/examples.html#zapusk-operacij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск операций&lt;/span&gt;&lt;/a&gt;Запуск операций&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt map &lt;span class=\"hljs-string\"&gt;\"./binary\"&lt;/span&gt; --src //tmp/yt_cli_examples/table --dst //tmp/yt_cli_examples/output --format dsv --local-file binary\n2013-03-28 16:23:35.797 ( 0 min): operation 1535429-8d795980-9f7f5a9f-44bec919 initializing\n...\n\n&lt;span class=\"hljs-comment\"&gt;# Сортируем по колонке x (по возрастанию)&lt;/span&gt;\n$ yt &lt;span class=\"hljs-built_in\"&gt;sort&lt;/span&gt; --src //tmp/yt_cli_examples/table --dst //tmp/yt_cli_examples/output --sort-by &lt;span class=\"hljs-string\"&gt;\"x\"&lt;/span&gt;\n...\n\n&lt;span class=\"hljs-comment\"&gt;# Сортируем по колонке x (по убыванию, доступно только на кластерах с мастерами версии 21.2+)&lt;/span&gt;\n$ yt &lt;span class=\"hljs-built_in\"&gt;sort&lt;/span&gt; --src //tmp/yt_cli_examples/table --dst //tmp/yt_cli_examples/output --sort-by &lt;span class=\"hljs-string\"&gt;\"{name=x; sort_order=descending;}\"&lt;/span&gt;\n...\n\n&lt;span class=\"hljs-comment\"&gt;# Сортируем по колонке x по убыванию, в случае равенства — по колонке y по возрастанию (сортировка по убыванию доступна только на кластерах с мастерами версии 21.2+)&lt;/span&gt;\n$ yt &lt;span class=\"hljs-built_in\"&gt;sort&lt;/span&gt; --src //tmp/yt_cli_examples/table --dst //tmp/yt_cli_examples/output --sort-by &lt;span class=\"hljs-string\"&gt;\"{name=x; sort_order=descending;}\"&lt;/span&gt; --sort-by &lt;span class=\"hljs-string\"&gt;\"y\"&lt;/span&gt;\n...\n\n$ yt map-reduce --mapper &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; --reducer &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; --src //tmp/yt_cli_examples/table --dst //tmp/yt_cli_examples/output --format dsv --reduce-by &lt;span class=\"hljs-string\"&gt;\"x\"&lt;/span&gt;\n...\n\n$ yt map &lt;span class=\"hljs-string\"&gt;\"cat\"&lt;/span&gt; --spec &lt;span class=\"hljs-string\"&gt;\"{pool=example_pool; weight=10.0}\"&lt;/span&gt; --src //tmp/yt_cli_examples/table --dst //tmp/yt_cli_examples/output --format yson\n...\n\n$ yt vanilla --tasks &lt;span class=\"hljs-string\"&gt;'{task={job_count=10; command=\"sleep 60\"; cpu_limit=2};}'&lt;/span&gt; --spec &lt;span class=\"hljs-string\"&gt;'{resource_limits={user_slots=2}}'&lt;/span&gt;\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"33\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-33\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-33\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-33.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/api/cli/examples.md","sourcePath":"ru/api/cli/examples.md"},"headings":[{"title":"Запуск простейшей операции","href":"ru/api/cli/examples.html#zapusk-prostejshej-operacii","level":2},{"title":"Команды get, set и remove","href":"ru/api/cli/examples.html#komandy-get,-set-i-remove","level":2},{"title":"Команды find и list","href":"ru/api/cli/examples.html#komandy-find-i-list","level":2},{"title":"Команды read и write","href":"ru/api/cli/examples.html#komandy-read-i-write","level":2},{"title":"Команды write-file и read-file","href":"ru/api/cli/examples.html#komandy-write-file-i-read-file","level":2},{"title":"Запуск операций","href":"ru/api/cli/examples.html#zapusk-operacij","level":2}],"title":"Примеры"},"router":{"pathname":"ru/api/cli/examples","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
