        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Для использования возможностей системы YTsaurus существует &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;C++ клиент&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Посмотреть &lt;a href=\"api/cpp/examples.html\"&gt;Примеры использования&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;C++ клиент предоставляется в текущем виде как есть, поэтому:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;интерфейс клиента может меняться без обратной совместимости;&lt;/li&gt;\n&lt;li&gt;в текущей версии поддерживается только статическая линковка;&lt;/li&gt;\n&lt;li&gt;напишите на info@ytsaurus.tech если возникнут вопросы по сборке клиента.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"obshaya-informaciya\"&gt;&lt;a href=\"ru/api/cpp/description.html#obshaya-informaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общая информация&lt;/span&gt;&lt;/a&gt;Общая информация&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Весь код находится в пространстве имён &lt;code&gt;NYT&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Все необходимые пользователю интерфейсы находятся &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/interface\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;по ссылке&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Реализация всех интерфейсов доступна &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/client\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;по ссылке&lt;/a&gt;, соответственно, библиотеки необходимо связывать с &lt;code&gt;interface&lt;/code&gt;, а конечные цели сборки (программы) с &lt;code&gt;client&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ISomethingPtr&lt;/code&gt; обычно определены для интерфейсов как &lt;code&gt;TIntrusivePtr&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Все обязательные параметры присутствуют явно в сигнатурах соответствующих функций. Все опциональные параметры команд вынесены во вспомогательные структуры &lt;code&gt;TOptions&lt;/code&gt;. Эти структуры имеют builder-like интерфейс, позволяющий задавать параметры в виде &lt;code&gt;TWhateverOptions().Parameter1(value1).Parameter2(value2)&lt;/code&gt; для однострочной записи, если это удобно.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"logging\"&gt;&lt;a href=\"ru/api/cpp/description.html#logging\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Логирование&lt;/span&gt;&lt;/a&gt;Логирование&lt;/h2&gt;\n&lt;p&gt;Логирование включается переменной окружения &lt;code&gt;YT_LOG_LEVEL&lt;/code&gt;, которая может принимать одно из следующих значений: &lt;code&gt;ERROR&lt;/code&gt;, &lt;code&gt;WARNING&lt;/code&gt; (для совместимости с &lt;a href=\"api/python/userdoc.html\"&gt;Python API&lt;/a&gt;, эквивалентен &lt;code&gt;ERROR&lt;/code&gt;), &lt;code&gt;INFO&lt;/code&gt;, &lt;code&gt;DEBUG&lt;/code&gt;.&lt;br /&gt;\nКроме того, в начале программы должна быть вызвана функция &lt;code&gt;NYT::Initialize()&lt;/code&gt; (см. следующий раздел).&lt;/p&gt;\n&lt;p&gt;По возможности, рекомендуется сохранять логи на уровне &lt;code&gt;DEBUG&lt;/code&gt;, особенно для production процессов. Такие логи многократно упростят и ускорят исправление проблем с API, если они возникнут. Эти же логи рекомендуется прикладывать к письмам о проблемах использования API.&lt;/p&gt;\n&lt;h2 id=\"init\"&gt;&lt;a href=\"ru/api/cpp/description.html#init\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Инициализация&lt;/span&gt;&lt;/a&gt;Инициализация&lt;/h2&gt;\n&lt;p&gt;Перед началом клиентских действий необходимо вызвать метод &lt;code&gt;Initialize&lt;/code&gt;. Этот метод выполняет инициализацию требуемых подсистем (логирование и т. д.), а также проверяет, запускается ли бинарник на YTsaurus ноде внутри джоба, и, если это так, переключает выполнение в режим джоба.&lt;/p&gt;\n&lt;p&gt;Точкой входа на клиенте является функция &lt;code&gt;CreateClient(serverName)&lt;/code&gt;, возвращающая указатель на интерфейс &lt;code&gt;IClient&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Пример минимальной программы (файл &lt;code&gt;main.cpp&lt;/code&gt;):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-meta\"&gt;#&lt;span class=\"hljs-keyword\"&gt;include&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;&amp;lt;yt/cpp/mapreduce/interface/client.h&amp;gt;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;int&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;main&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;()&lt;/span&gt;\n&lt;/span&gt;{\n    NYT::&lt;span class=\"hljs-built_in\"&gt;Initialize&lt;/span&gt;();\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; client = NYT::&lt;span class=\"hljs-built_in\"&gt;CreateClient&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"cluster_name\"&lt;/span&gt;);\n    client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Create&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;, NYT::NT_TABLE);\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"84\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-84\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-84\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-84.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если нужно в рамках одной программы иметь клиенты, работающие под разными &lt;a href=\"user-guide/storage/auth.html\"&gt;токенами авторизации&lt;/a&gt;, можно воспользоваться опциями:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;auto client = CreateClient(serverName, TCreateClientOptions().Token(userToken));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"88\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-88\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-88\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-88.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"transactions\"&gt;&lt;a href=\"ru/api/cpp/description.html#transactions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Транзакции&lt;/span&gt;&lt;/a&gt;Транзакции&lt;/h2&gt;\n&lt;p&gt;Существуют два интерфейса (&lt;code&gt;IClient&lt;/code&gt; и &lt;code&gt;ITransaction&lt;/code&gt;), имеющие почти одинаковый набор методов, которые наследуются от &lt;code&gt;IClientBase&lt;/code&gt;. В первом случае соответствующие команды исполняются без какой-либо клиентской транзакции, во втором - исполняются под транзакцией указанного класса. Для получения экземпляра &lt;code&gt;ITransaction&lt;/code&gt; используется метод &lt;code&gt;IClientBase::StartTransaction()&lt;/code&gt;. При использовании переменной окружения &lt;code&gt;YT_TRANSACTION&lt;/code&gt; даже &lt;code&gt;IClient&lt;/code&gt; начинает работать из-под родительской транзакции.&lt;/p&gt;\n&lt;p&gt;Пример работы с транзакциями:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-meta\"&gt;#&lt;span class=\"hljs-keyword\"&gt;include&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;&amp;lt;yt/cpp/mapreduce/interface/client.h&amp;gt;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;int&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;main&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;()&lt;/span&gt;\n&lt;/span&gt;{\n    NYT::&lt;span class=\"hljs-built_in\"&gt;Initialize&lt;/span&gt;();\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; client = NYT::&lt;span class=\"hljs-built_in\"&gt;CreateClient&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"cluster_name\"&lt;/span&gt;);\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; tx = client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;StartTransaction&lt;/span&gt;();\n    tx-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Remove&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;);\n    tx-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Commit&lt;/span&gt;();\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"98\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-98\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-98\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-98.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;У транзакции есть явные методы &lt;code&gt;Commit()&lt;/code&gt; и &lt;code&gt;Abort()&lt;/code&gt;. Если транзакция уничтожается без явного вызова одного из этих методов, в деструкторе будет предпринята попытка вызвать &lt;code&gt;Abort()&lt;/code&gt;, но без гарантий, что метод действительно выполнится.&lt;/p&gt;\n&lt;p&gt;Транзакции могут быть иерархическими:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; tx = client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;StartTransaction&lt;/span&gt;();\n&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; innerTx = tx-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;StartTransaction&lt;/span&gt;();\ninnerTx-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Create&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/double\"&lt;/span&gt;, NT_DOUBLE);\ninnerTx-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Commit&lt;/span&gt;();\ntx-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Commit&lt;/span&gt;();\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"105\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-105\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-105\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-105.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Метод &lt;code&gt;ITransaction::GetId()&lt;/code&gt; возвращает &lt;code&gt;TGUID&lt;/code&gt; — идентификатор данной транзакции.&lt;/p&gt;\n&lt;p&gt;Транзакция, создаваемая через &lt;code&gt;StartTransaction()&lt;/code&gt;, автоматически пингуется и управляется C++ клиентом.&lt;/p&gt;\n&lt;p&gt;Существует способ работать из-под транзакции, созданной извне. Для этого необходимо вызвать метод &lt;code&gt;IClient::AttachTransaction(transactionId)&lt;/code&gt;. Все команды, вызываемые в таком объекте, будут выполняться в контексте транзакции с этим идентификатором, но пинговаться клиентом эта транзакция не будет.&lt;/p&gt;\n&lt;p&gt;Более подробно об устройстве транзакций можно почитать в разделе &lt;a href=\"user-guide/storage/transactions.html\"&gt;Транзакции&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"tnode\"&gt;&lt;a href=\"ru/api/cpp/description.html#tnode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TNode&lt;/span&gt;&lt;/a&gt;TNode&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/interface/node.h\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TNode&lt;/a&gt;  — это основной класс, обеспечивающий динамическое DOM-представление &lt;a href=\"user-guide/storage/yson-docs.html\"&gt;YSON-документа&lt;/a&gt;. Используется для работы с Кипарисом, передачи дополнительных спецификаций операций, как один из способов кодирования строк таблицы и т. д.&lt;/p&gt;\n&lt;p&gt;Примеры использования:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;TNode i = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;; &lt;span class=\"hljs-comment\"&gt;// all signed types -&amp;gt; int64&lt;/span&gt;\nTNode u = &lt;span class=\"hljs-number\"&gt;8u&lt;/span&gt;; &lt;span class=\"hljs-comment\"&gt;// all unsigned types -&amp;gt; uint64&lt;/span&gt;\nTNode b = &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;; &lt;span class=\"hljs-comment\"&gt;// boolean&lt;/span&gt;\nTNode d = &lt;span class=\"hljs-number\"&gt;2.5&lt;/span&gt;; &lt;span class=\"hljs-comment\"&gt;// double&lt;/span&gt;\nTNode s = &lt;span class=\"hljs-string\"&gt;\"foo\"&lt;/span&gt;; &lt;span class=\"hljs-comment\"&gt;// string&lt;/span&gt;\n\nTNode l = TNode::&lt;span class=\"hljs-built_in\"&gt;CreateList&lt;/span&gt;();\nl.&lt;span class=\"hljs-built_in\"&gt;Add&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;5&lt;/span&gt;);\nl.&lt;span class=\"hljs-built_in\"&gt;Add&lt;/span&gt;(&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;);\nCout &amp;lt;&amp;lt; l[&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;].&lt;span class=\"hljs-built_in\"&gt;AsBool&lt;/span&gt;() &amp;lt;&amp;lt; Endl;\n\nTNode m = TNode::&lt;span class=\"hljs-built_in\"&gt;CreateMap&lt;/span&gt;();\nm[&lt;span class=\"hljs-string\"&gt;\"abc\"&lt;/span&gt;] = &lt;span class=\"hljs-number\"&gt;255u&lt;/span&gt;;\n&lt;span class=\"hljs-built_in\"&gt;m&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"foo\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"bar\"&lt;/span&gt;);\nCout &amp;lt;&amp;lt; m[&lt;span class=\"hljs-string\"&gt;\"foo\"&lt;/span&gt;].&lt;span class=\"hljs-built_in\"&gt;AsString&lt;/span&gt;() &amp;lt;&amp;lt; Endl;\n\nTNode e = TNode::&lt;span class=\"hljs-built_in\"&gt;CreateEntity&lt;/span&gt;();\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; (e.&lt;span class=\"hljs-built_in\"&gt;IsEntity&lt;/span&gt;()) {\n    Cout &amp;lt;&amp;lt; &lt;span class=\"hljs-string\"&gt;\"entity!\"&lt;/span&gt; &amp;lt;&amp;lt; Endl;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"127\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-127\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-127\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-127.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;Значения элементарных типов необходимо извлекать методами &lt;code&gt;TNode::AsType()&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Проверки типов можно производить методами &lt;code&gt;TNode::IsType()&lt;/code&gt;;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Конструктор по умолчанию создаёт &lt;code&gt;TNode&lt;/code&gt; с типом &lt;code&gt;TNode::Undefined&lt;/code&gt;: такой объект не может быть сериализован в YSON без явной инициализации.&lt;/p&gt;\n&lt;p&gt;Для сокращения записи методы вставки в map и list сразу переводят &lt;code&gt;TNode&lt;/code&gt; в нужный тип:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; mapNode = &lt;span class=\"hljs-built_in\"&gt;TNode&lt;/span&gt;()(&lt;span class=\"hljs-string\"&gt;\"key1\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"value1\"&lt;/span&gt;)(&lt;span class=\"hljs-string\"&gt;\"key2\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"value2\"&lt;/span&gt;);\n&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; listNode = &lt;span class=\"hljs-built_in\"&gt;TNode&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;Add&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;100&lt;/span&gt;).&lt;span class=\"hljs-built_in\"&gt;Add&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;500&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"146\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-146\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-146\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-146.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"cypress\"&gt;&lt;a href=\"ru/api/cpp/description.html#cypress\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с Кипарисом&lt;/span&gt;&lt;/a&gt;Работа с Кипарисом&lt;/h2&gt;\n&lt;p&gt;Подробнее о командах для работы см. в разделе &lt;a href=\"user-guide/storage/cypress-example.html\"&gt;Работа с деревом метаинформации&lt;/a&gt;. Реализовано в виде интерфейса &lt;code&gt;ICypressClient&lt;/code&gt;, от которого &lt;code&gt;IClientBase&lt;/code&gt; наследуется.&lt;/p&gt;\n&lt;p&gt;Примеры использования:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;TString &lt;span class=\"hljs-title\"&gt;node&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/node\"&lt;/span&gt;)&lt;/span&gt;&lt;/span&gt;;\n\nclient-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Create&lt;/span&gt;(node, NYT::NT_STRING);\n\nCout &amp;lt;&amp;lt; client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Exists&lt;/span&gt;(node) &amp;lt;&amp;lt; Endl;\n\nclient-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Set&lt;/span&gt;(node, &lt;span class=\"hljs-string\"&gt;\"foo\"&lt;/span&gt;);\nCout &amp;lt;&amp;lt; client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Get&lt;/span&gt;(node).&lt;span class=\"hljs-built_in\"&gt;AsString&lt;/span&gt;() &amp;lt;&amp;lt; Endl;\n\n&lt;span class=\"hljs-function\"&gt;TString &lt;span class=\"hljs-title\"&gt;otherNode&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/other_node\"&lt;/span&gt;)&lt;/span&gt;&lt;/span&gt;;\nclient-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Copy&lt;/span&gt;(node, otherNode);\nclient-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Remove&lt;/span&gt;(otherNode);\n\nclient-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Link&lt;/span&gt;(node, otherNode);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"156\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-156\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-156\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-156.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Пример работы с атрибутами таблиц:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Set&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table/@user_attr\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;25&lt;/span&gt;);\n\nCout &amp;lt;&amp;lt; client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Get&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table/@row_count\"&lt;/span&gt;).&lt;span class=\"hljs-built_in\"&gt;AsInt64&lt;/span&gt;() &amp;lt;&amp;lt; Endl;\nCout &amp;lt;&amp;lt; client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Get&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table/@sorted\"&lt;/span&gt;).&lt;span class=\"hljs-built_in\"&gt;AsBool&lt;/span&gt;() &amp;lt;&amp;lt; Endl;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"160\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-160\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-160\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-160.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"create\"&gt;&lt;a href=\"ru/api/cpp/description.html#create\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Create&lt;/span&gt;&lt;/a&gt;Create&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"api/commands.html#create\"&gt;Создать&lt;/a&gt; узел. &lt;a href=\"user-guide/storage/cypress-example.html#create\"&gt;См. аналог в CLI&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;TNodeId &lt;span class=\"hljs-title\"&gt;Create&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; path,\n    ENodeType type,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TCreateOptions&amp;amp; options)&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"167\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-167\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-167\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-167.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TYPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Путь до узла&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ENodeType&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/objects.html#object_types\"&gt;Тип&lt;/a&gt; создаваемого узла: &lt;br /&gt;  &lt;code&gt;NT_STRING&lt;/code&gt; — строка (&lt;code&gt;string_node&lt;/code&gt;);&lt;br /&gt; &lt;code&gt;NT_INT64&lt;/code&gt; — целое знаковое число (&lt;code&gt;int64_node&lt;/code&gt;); &lt;br /&gt;&lt;code&gt;NT_UINT64&lt;/code&gt; — целое беззнаковое число (&lt;code&gt;uint64_node&lt;/code&gt;); &lt;br /&gt;&lt;code&gt;NT_DOUBLE&lt;/code&gt; — вещественное число (&lt;code&gt;double_node&lt;/code&gt;); &lt;br /&gt;&lt;code&gt;NT_BOOLEAN&lt;/code&gt; — булево значение (&lt;code&gt;boolean_node&lt;/code&gt;); &lt;br /&gt;&lt;code&gt;NT_MAP&lt;/code&gt; — словарь в Кипарисе (ключи — строки, значения — другие узлы, &lt;code&gt;map_node&lt;/code&gt;); &lt;br /&gt; &lt;code&gt;NT_FILE&lt;/code&gt; — &lt;a href=\"user-guide/storage/objects.html#files\"&gt;файл&lt;/a&gt; (&lt;code&gt;file&lt;/code&gt;); &lt;br /&gt;&lt;code&gt;NT_TABLE&lt;/code&gt; — &lt;a href=\"user-guide/storage/objects.html#tables\"&gt;таблица&lt;/a&gt; (&lt;code&gt;table&lt;/code&gt;);&lt;br /&gt; &lt;code&gt;NT_DOCUMENT&lt;/code&gt; — &lt;a href=\"user-guide/storage/objects.html#yson_doc\"&gt;документ&lt;/a&gt; (&lt;code&gt;document&lt;/code&gt;); &lt;br /&gt;&lt;code&gt;NT_REPLICATED_TABLE&lt;/code&gt; — &lt;a href=\"user-guide/dynamic-tables/replicated-dynamic-tables.html\"&gt;реплицированная таблица&lt;/a&gt; (&lt;code&gt;replicated_table&lt;/code&gt;); &lt;br /&gt;&lt;code&gt;NT_TABLE_REPLICA&lt;/code&gt; — (&lt;code&gt;table_replica&lt;/code&gt;);&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — необязательные опции:&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Recursive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Создавать ли промежуточные директории.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;IgnoreExisting&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Если узел существует, не делать ничего и не выдавать ошибку.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Если узел существует, пересоздать его вместо ошибки.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TNode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/attributes.html\"&gt;Атрибуты&lt;/a&gt; создаваемого узла.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"remove\"&gt;&lt;a href=\"ru/api/cpp/description.html#remove\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Remove&lt;/span&gt;&lt;/a&gt;Remove&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"api/commands.html#remove\"&gt;Удалить&lt;/a&gt; узел. &lt;a href=\"user-guide/storage/cypress-example.html#remove\"&gt;См. аналог в CLI&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;Remove&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; path,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TRemoveOptions&amp;amp; options)&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"292\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-292\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-292\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-292.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TYPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Путь до узла.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — необязательные опции:&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Recursive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Рекурсивно удалить детей составного узла.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Не прекращать работу, если указанного узла уже нет.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"exists\"&gt;&lt;a href=\"ru/api/cpp/description.html#exists\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Exists&lt;/span&gt;&lt;/a&gt;Exists&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"api/commands.html#exists\"&gt;Проверить существование&lt;/a&gt; объекта по указанному пути.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;Exists&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type t;Get&lt;/span&gt;&lt;/a&gt;Get&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"api/commands.html#get\"&gt;Получить содержимое узла Кипариса&lt;/a&gt; в формате  &lt;code&gt;TNode&lt;/code&gt;. &lt;a href=\"user-guide/storage/cypress-example.html#get\"&gt;См. аналог в CLI&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;TNode &lt;span class=\"hljs-title\"&gt;Get&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; path,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TGetOptions&amp;amp; options)&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"430\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-430\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-430\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-430.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TYPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Путь до узла или атрибута.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — необязательные опции:&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;AttributeFilter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;TAttributeFilter&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Список атрибутов, которые нужно получить.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;MaxSize&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;i64&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Ограничение на количество детей (для составных узлов).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"set\"&gt;&lt;a href=\"ru/api/cpp/description.html#set\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Set&lt;/span&gt;&lt;/a&gt;Set&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"api/commands.html#set\"&gt;Записать новое содержимое узла Кипариса&lt;/a&gt;. &lt;a href=\"user-guide/storage/cypress-example.html#set\"&gt;См. аналог в CLI&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;Set&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; path,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TNode&amp;amp; value,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TSetOptions&amp;amp; options)&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipbo и создавать промежуточные директории для &lt;code&gt;destinationPath&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;TNodeId &lt;span class=\"hljs-title\"&gt;Copy&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; sourcePath,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; destinationPath,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TCopyOptions&amp;amp; options)&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"689\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-689\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-689\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-689.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n code&gt;expiration_timeout&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"move\"&gt;&lt;a href=\"ru/api/cpp/description.html#move\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Move&lt;/span&gt;&lt;/a&gt;Move&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"api/commands.html#move\"&gt;Перенести узел по новому адресу&lt;/a&gt;. &lt;a href=\"user-guide/storage/cypress-example.html#copy_move\"&gt;См. аналог в CLI&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;TNodeId &lt;span class=\"hljs-title\"&gt;Move&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; sourcePath,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; destinationPath,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TMoveOptions&amp;amp; options)&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"828\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-828\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-828\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-828.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;sourcePath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TYPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Путь до исходного узла.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;destinationPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TYPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Путь для создания копии (без опции &lt;code&gt;Force&lt;/code&gt; — не должен существовать).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — необязательные опции:&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Recursive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Создавать ли промежуточные директории для &lt;code&gt;destinationPath&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Если &lt;code&gt;destinationPath&lt;/code&gt; существует, заменить на новое содержимое.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;PreserveAccount&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Сохранять ли аккаунты исходных узлов.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;PreserveExpirationTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Копировать ли атрибут &lt;code&gt;expiration_time&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;PreserveExpirationTimeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Копировать ли атрибут &lt;code&gt;expiration_timeout&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"link\"&gt;&lt;a href=\"ru/api/cpp/description.html#link\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Link&lt;/span&gt;&lt;/a&gt;Link&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"api/commands.html#link\"&gt;Создать&lt;/a&gt; &lt;a href=\"user-guide/storage/links.html\"&gt;символическую ссылку&lt;/a&gt; на объект по новому адресу. &lt;a href=\"user-guide/storage/cypress-example.html#link\"&gt;См. аналог в CLI&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;TNodeId &lt;span class=\"hljs-title\"&gt;Link&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; targetPath,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; linkPath,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TLinkOptions&amp;amp; options)&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"967\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-967\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-967\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-967.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;targetPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TYPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Путь до исходного узла, на который будет идти ссылка.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;linkPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TYPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Путь, по которому будет создана ссылка (без опции &lt;code&gt;Force&lt;/code&gt; — не должен существовать).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — необязательные опции&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Recursive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Создавать ли промежуточные директории.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;IgnoreExisting&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Если &lt;code&gt;linkPath&lt;/code&gt; существует и  &lt;em&gt;является ссылкой&lt;/em&gt;, не делать ничего и не показывать ошибку&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Если узел &lt;code&gt;linkPath&lt;/code&gt; существует, на его месте создать ссылку заново.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TNode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/attributes.html\"&gt;Атрибуты&lt;/a&gt; для &lt;code&gt;linkPath&lt;/code&gt; виде &lt;code&gt;TNode&lt;/code&gt;, записываются в случае создания.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"concatenate\"&gt;&lt;a href=\"ru/api/cpp/description.html#concatenate\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Concatenate&lt;/span&gt;&lt;/a&gt;Concatenate&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"api/commands.html#concatenate\"&gt;Склеить&lt;/a&gt; набор файлов или таблиц (в том порядке, в котором указаны пути). &lt;a href=\"user-guide/storage/cypress-example.html#concatenate\"&gt;См. аналог в CLI&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Слияние данных происходит на уровне метаинформации исключительно на мастер-сервере &lt;a href=\"user-guide/storage/cypress.html\"&gt;Кипариса&lt;/a&gt; .&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;Concatenate&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TVector&amp;lt;TYPath&amp;gt;&amp;amp; sourcePaths,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; destinationPath,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TConcatenateOptions&amp;amp; options)&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1095\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1095\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1095\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1095.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;sourcePaths&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TVector&amp;lt;TYPath&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Пути до входных файлов или таблиц.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;destinationPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TYPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Путь до объединённого файла или таблицы, должен существовать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — необязательные опции:&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Append&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Сохранить ли содержимое &lt;code&gt;destinationPath&lt;/code&gt;, новые данные добавить в конец. Без этого флага старое содержимое &lt;code&gt;destinationPath&lt;/code&gt; пропадёт.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"chtenie/zapis-fajlov\"&gt;&lt;a href=\"ru/api/cpp/description.html#chtenie/zapis-fajlov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чтение/запись файлов&lt;/span&gt;&lt;/a&gt;Чтение/запись файлов&lt;/h2&gt;\n&lt;p&gt;Для записи файла в YT необходимо вызвать метод клиента/транзакции &lt;code&gt;CreateFileWriter(filePath)&lt;/code&gt;.&lt;br /&gt;\nВозвращаемый интерфейс &lt;code&gt;IFileWriter&lt;/code&gt; является наследником &lt;code&gt;IOutputStream&lt;/code&gt;. Если файл ранее не существовал, он будет создан.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; writer = client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;CreateFileWriter&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/file\"&lt;/span&gt;);\n*writer &amp;lt;&amp;lt; &lt;span class=\"hljs-string\"&gt;\"something\"&lt;/span&gt;;\nwriter-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Finish&lt;/span&gt;();\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1178\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1178\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1178\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1178.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Для чтения используется интерфейс &lt;code&gt;IFileReader&lt;/code&gt;, который, предоставляет методы &lt;code&gt;IInputStream&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; reader = client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;CreateFileReader&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/file\"&lt;/span&gt;);\nTString anything;\n*reader &amp;gt;&amp;gt; anything;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1182\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1182\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1182\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1182.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Дополнительные опции пробрасываются через структуры &lt;code&gt;TFileWriterOptions&lt;/code&gt; и &lt;code&gt;TFileReaderOptions&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"struktury-dlya-predstavleniya-strok-tablic\"&gt;&lt;a href=\"ru/api/cpp/description.html#struktury-dlya-predstavleniya-strok-tablic\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Структуры для представления строк таблиц&lt;/span&gt;&lt;/a&gt;Структуры для представления строк таблиц&lt;/h2&gt;\n&lt;p&gt;Существует несколько способов представления отдельных записей таблицы в операциях и во время ввода/вывода.&lt;/p&gt;\n&lt;h3 id=\"tnode1\"&gt;&lt;a href=\"ru/api/cpp/description.html#tnode1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TNode&lt;/span&gt;&lt;/a&gt;TNode&lt;/h3&gt;\n&lt;p&gt;Для представления записи TNode должен иметь тип &lt;a href=\"user-guide/storage/objects.html#primitive_types\"&gt;map&lt;/a&gt; и представлять собой отображение имён колонок в YSON-значения.&lt;/p&gt;\n&lt;h3 id=\"protobuf\"&gt;&lt;a href=\"ru/api/cpp/description.html#protobuf\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Protobuf&lt;/span&gt;&lt;/a&gt;Protobuf&lt;/h3&gt;\n&lt;p&gt;Подробнее о Protobuf см. &lt;a href=\"api/cpp/protobuf.html\"&gt;Protobuf-представление таблиц&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;В этом случае предоставляется возможность определить пользовательский protobuf тип. Для отображения protobuf полей в имена колонок используются расширения:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"yt/yt_proto/yt/formats/extension.proto\"&lt;/span&gt;;\nmessage TSampleProto {\n    optional int64  a = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt; [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"column_a\"&lt;/span&gt;];\n    optional &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; b = &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt; [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"column_b\"&lt;/span&gt;];\n    optional string c = &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt; [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"column_c\"&lt;/span&gt;];\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1207\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1207\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1207\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1207.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Есть поддержка вложенных структур, в этом случае используется бинарная протобуфная сериализация, т.е. в колонке таблицы будет храниться строка с бинарной protobuf сериализацией &lt;a href=\"api/cpp/protobuf.html#embedded\"&gt;вложенного сообщения&lt;/a&gt;. Во вложенных структурах могут быть &lt;code&gt;repeated&lt;/code&gt; поля, они будут сериализованы бинарно вместе с остальной частью вложенного сообщения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Не следует использовать версию &lt;code&gt;proto3&lt;/code&gt;. Ввиду &lt;a href=\"https://developers.google.com/protocol-buffers/docs/proto3#default\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;особенностей реализации proto3&lt;/a&gt;, значения полей по умолчанию неотличимы от отсутствующих полей. Это приводит, например, к тому, что значение &lt;code&gt;0&lt;/code&gt; типа &lt;code&gt;int&lt;/code&gt; не будет записано в таблицу.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"chtenie-i-zapis-tablic\"&gt;&lt;a href=\"ru/api/cpp/description.html#chtenie-i-zapis-tablic\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чтение и запись таблиц&lt;/span&gt;&lt;/a&gt;Чтение и запись таблиц&lt;/h2&gt;\n&lt;p&gt;См. &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/interface/io.h\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/interface/io.h&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; writer = client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;CreateTableWriter&lt;/span&gt;&amp;lt;TNode&amp;gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;);\nwriter-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;AddRow&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TNode&lt;/span&gt;()(&lt;span class=\"hljs-string\"&gt;\"x\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;1.&lt;/span&gt;)(&lt;span class=\"hljs-string\"&gt;\"y\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;0.&lt;/span&gt;));\nwriter-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;AddRow&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TNode&lt;/span&gt;()(&lt;span class=\"hljs-string\"&gt;\"x\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;0.&lt;/span&gt;)(&lt;span class=\"hljs-string\"&gt;\"y\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;1.&lt;/span&gt;));\nwriter-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Finish&lt;/span&gt;();\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1227\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1227\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1227\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1227.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Запись блочная. При вызове &lt;code&gt;AddRow()&lt;/code&gt; данные сохраняются во внутреннем буфере, и, если размер этого буфера превысит 64 MB, запускается отдельный тред, посылающий накопленные данные.&lt;/p&gt;\n&lt;p&gt;Метод &lt;code&gt;Finish()&lt;/code&gt; гарантированно вызовет сброс всех накопленных записей или выдаст ошибку. При уничтожении writer без вызова &lt;code&gt;Finish()&lt;/code&gt; в деструкторе будет произведена попытка сброса без гарантии результата. Если таблица не существовала до создания writer, она будет создана в контексте того же клиента или транзакции со всеми атрибутами по умолчанию. Если необходим другой коэффициент репликации, следует создать таблицу и добавить ей необходимые атрибуты заранее.&lt;/p&gt;\n&lt;p&gt;При чтении основными методами являются &lt;code&gt;GetRow()&lt;/code&gt;, &lt;code&gt;IsValid()&lt;/code&gt;, &lt;code&gt;Next()&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; reader = client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;CreateTableReader&lt;/span&gt;&amp;lt;TYaMRRow&amp;gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/ksv_table\"&lt;/span&gt;);\n&lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; (; reader-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;IsValid&lt;/span&gt;(); reader-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Next&lt;/span&gt;()) {\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; row = reader-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;GetRow&lt;/span&gt;();\n    Cout &amp;lt;&amp;lt; row.Key &amp;lt;&amp;lt; &lt;span class=\"hljs-string\"&gt;\"; \"&lt;/span&gt; &amp;lt;&amp;lt; row.SubKey &amp;lt;&amp;lt; &lt;span class=\"hljs-string\"&gt;\"; \"&lt;/span&gt; &amp;lt;&amp;lt; row.Value &amp;lt;&amp;lt; Endl;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1237\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1237\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1237\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1237.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Возвращаемый из &lt;code&gt;GetRow()&lt;/code&gt; объект можно использовать только до вызова &lt;code&gt;Next()&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Метод &lt;code&gt;GetRowIndex()&lt;/code&gt; позволяет получить абсолютный индекс текущей записи.&lt;/p&gt;\n&lt;p&gt;Пример с protobuf:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; writer = client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;CreateTableWriter&lt;/span&gt;&amp;lt;TSampleProto&amp;gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;);\nTSampleProto row;\nrow.&lt;span class=\"hljs-built_in\"&gt;set_a&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;42&lt;/span&gt;);\nwriter-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;AddRow&lt;/span&gt;(row);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1247\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1247\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1247\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1247.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"trichypath\"&gt;&lt;a href=\"ru/api/cpp/description.html#trichypath\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TRichYPath&lt;/span&gt;&lt;/a&gt;TRichYPath&lt;/h3&gt;\n&lt;p&gt;Структура &lt;code&gt;TRichYPath&lt;/code&gt; позволяет передавать вместе с путём к таблице различные флаги. Это применимо как к функциям чтения и записи, так и к входным и выходным таблицам &lt;a href=\"ru/api/cpp/description.html#operations\"&gt;операций&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Если необходима запись в режиме append:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;CreateTableWriter&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TRichYPath&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;).&lt;span class=\"hljs-built_in\"&gt;Append&lt;/span&gt;(&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1257\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1257\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1257\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1257.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если необходимо, чтобы результат записи был сортированным, используется атрибут &lt;code&gt;SortedBy&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; path = &lt;span class=\"hljs-built_in\"&gt;TRichYPath&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;).&lt;span class=\"hljs-built_in\"&gt;SortedBy&lt;/span&gt;({&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;});\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1261\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1261\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1261\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1261.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;По protobuf-сообщению можно создать схему таблицы:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; path = &lt;span class=\"hljs-built_in\"&gt;WithSchema&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1265\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1265\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1265\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1265.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;При наличии схемы указывать сортировку с помощью &lt;code&gt;SortedBy&lt;/code&gt; уже нельзя. Можно указать сортировку при создании схемы:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; path = &lt;span class=\"hljs-built_in\"&gt;WithSchema&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;, {&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;});\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1269\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1269\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1269\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1269.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Или отсортировать схему позже: &lt;code&gt;path.Schema_.SortBy({\"a\", \"b\"});&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Кроме этого, при чтении &lt;code&gt;TRichYPath&lt;/code&gt; предоставляет возможность задавать горизонтальные и вертикальные выборки:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; path = &lt;span class=\"hljs-built_in\"&gt;TRichYPath&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;).&lt;span class=\"hljs-built_in\"&gt;AddRange&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TReadRange&lt;/span&gt;()\n    .&lt;span class=\"hljs-built_in\"&gt;LowerLimit&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TReadLimit&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;RowIndex&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;))\n    .&lt;span class=\"hljs-built_in\"&gt;UpperLimit&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TReadLimit&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;RowIndex&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;20&lt;/span&gt;)));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1276\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1276\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1276\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1276.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Синонимично можно написать:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; path = &lt;span class=\"hljs-built_in\"&gt;TRichYPath&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;).&lt;span class=\"hljs-built_in\"&gt;AddRange&lt;/span&gt;(TReadRange::&lt;span class=\"hljs-built_in\"&gt;FromRowIndices&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;20&lt;/span&gt;));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1280\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;
