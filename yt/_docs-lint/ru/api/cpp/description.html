animate id=\"visibileAnimation-1280\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1280\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1280.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если таблица отсортирована, можно задавать диапазон по ключам. Для этого используется класс &lt;code&gt;TKey&lt;/code&gt;, который представляет собой последовательность значений ключевых колонок или их префикс. В примере ниже подразумевается, что у таблицы &lt;code&gt;\"//tmp/table\"&lt;/code&gt; есть две ключевые колонки типа &lt;code&gt;string&lt;/code&gt; и &lt;code&gt;int64&lt;/code&gt; (либо больше двух, в таком случае также работает лексикографическое сравнение).&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; path = &lt;span class=\"hljs-built_in\"&gt;TRichYPath&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;).&lt;span class=\"hljs-built_in\"&gt;AddRange&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TReadRange&lt;/span&gt;()\n    .&lt;span class=\"hljs-built_in\"&gt;LowerLimit&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TReadLimit&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;Key&lt;/span&gt;({&lt;span class=\"hljs-string\"&gt;\"foo\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;100&lt;/span&gt;}))\n    .&lt;span class=\"hljs-built_in\"&gt;UpperLimit&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TReadLimit&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;Key&lt;/span&gt;({&lt;span class=\"hljs-string\"&gt;\"foo\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;200&lt;/span&gt;})));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1284\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1284\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1284\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1284.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если необходимы строка (строки) с заданным ключом или индексом, можно использовать &lt;code&gt;TReadRange::Exact&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; path = &lt;span class=\"hljs-built_in\"&gt;TRichYPath&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;).&lt;span class=\"hljs-built_in\"&gt;AddRange&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TReadRange&lt;/span&gt;()\n    .&lt;span class=\"hljs-built_in\"&gt;Exact&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TReadLimit&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;Key&lt;/span&gt;({&lt;span class=\"hljs-string\"&gt;\"foo\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;100&lt;/span&gt;})));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1288\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1288\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1288\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1288.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Вертикальная выборка:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; path = &lt;span class=\"hljs-built_in\"&gt;TRichYPath&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;).&lt;span class=\"hljs-built_in\"&gt;Columns&lt;/span&gt;({&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;});\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1292\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1292\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1292\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1292.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Переименование колонок:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; path = &lt;span class=\"hljs-built_in\"&gt;TRichYPath&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;).&lt;span class=\"hljs-built_in\"&gt;RenameColumns&lt;/span&gt;({{&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;}, {&lt;span class=\"hljs-string\"&gt;\"c\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"d\"&lt;/span&gt;}});\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1296\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1296\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1296\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1296.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Колонка таблицы &lt;em&gt;a&lt;/em&gt; будет видна под именем &lt;em&gt;b&lt;/em&gt;, а &lt;em&gt;c&lt;/em&gt; — под именем &lt;em&gt;d&lt;/em&gt;. Функция переустанавливает полный список переименованных колонок, т.е. повторный вызов &lt;code&gt;RenameColumns&lt;/code&gt; сотрет результаты предыдущего. &lt;code&gt;Columns&lt;/code&gt; применяется после &lt;code&gt;RenameColumns&lt;/code&gt;, т.е. в данном случае &lt;em&gt;b&lt;/em&gt; и &lt;em&gt;d&lt;/em&gt; будут пригодны, &lt;em&gt;a&lt;/em&gt; и &lt;em&gt;c&lt;/em&gt; — не пригодны для &lt;code&gt;Columns&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Чтение с удаленного кластера:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; path = &lt;span class=\"hljs-built_in\"&gt;TRichYPath&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;).&lt;span class=\"hljs-built_in\"&gt;Cluster&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"my-remote-cluster\"&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1303\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1303\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1303\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1303.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Также остаётся возможность использовать ненормализованные пути, например:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; path = &lt;span class=\"hljs-built_in\"&gt;TRichYPath&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table[#0:#100500]\"&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1307\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1307\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1307\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1307.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"nastrojki-formatov\"&gt;&lt;a href=\"ru/api/cpp/description.html#nastrojki-formatov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройки форматов&lt;/span&gt;&lt;/a&gt;Настройки форматов&lt;/h3&gt;\n&lt;p&gt;Для более тонкой настройки форматов существует класс &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/interface/client_method_options.h\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TFormatHints&lt;/a&gt;. Его можно передавать в полях &lt;code&gt;TTableReaderOptions::FormatHints&lt;/code&gt; и &lt;code&gt;TTableWriterOptions::FormatHints&lt;/code&gt; при создании reader/writer.&lt;br /&gt;\nЕсли данная настройка имеет смысл для запрошенного формата, то она будет применена, иначе возникнет соответствующее исключение.&lt;/p&gt;\n&lt;p&gt;Доступные настройки:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;SkipNullValuesForTNode&lt;/code&gt; — для полей со значением &lt;code&gt;#&lt;/code&gt;  не создавать ключи в хеш-мапе.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/data-types.html\"&gt;Преобразования типов&lt;/a&gt; при записи: &lt;code&gt;EnableStringToAllConversion&lt;/code&gt;, &lt;code&gt;EnableAllToStringConversion&lt;/code&gt;, &lt;code&gt;EnableIntegralTypeConversion%&lt;/code&gt; (&lt;code&gt;uint64&lt;/code&gt; &amp;lt;-&amp;gt; &lt;code&gt;int64&lt;/code&gt;, включена по умолчанию), &lt;code&gt;EnableIntegralToDoubleConversion&lt;/code&gt;, &lt;code&gt;EnableTypeConversion&lt;/code&gt; (все указанные выше одновременно).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"dopolnitelnye-opcii\"&gt;&lt;a href=\"ru/api/cpp/description.html#dopolnitelnye-opcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дополнительные опции&lt;/span&gt;&lt;/a&gt;Дополнительные опции&lt;/h3&gt;\n&lt;p&gt;Если необходима ещё более тонкая настройка параметров чтения/записи, можно использовать структуры &lt;code&gt;TTableWriterOptions&lt;/code&gt; и &lt;code&gt;TTableReaderOptions&lt;/code&gt;. В них присутствует поле &lt;code&gt;Config&lt;/code&gt;, в него в формате &lt;code&gt;TNode&lt;/code&gt; можно передавать дополнительные настройки, соответствующие параметрам &lt;a href=\"user-guide/storage/io-configuration.html#table_writer\"&gt;table_writer&lt;/a&gt; и &lt;a href=\"user-guide/storage/io-configuration.html#table_reader\"&gt;table_reader&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; writer = client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;CreateTableWriter&lt;/span&gt;&amp;lt;TNode&amp;gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;,\n    &lt;span class=\"hljs-built_in\"&gt;TTableWriterOptions&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;Config&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TNode&lt;/span&gt;()(&lt;span class=\"hljs-string\"&gt;\"max_row_weight\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;128&lt;/span&gt; &amp;lt;&amp;lt; &lt;span class=\"hljs-number\"&gt;20&lt;/span&gt;)));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1335\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1335\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1335\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1335.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"parallel_read\"&gt;&lt;a href=\"ru/api/cpp/description.html#parallel_read\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Параллельное чтение&lt;/span&gt;&lt;/a&gt;Параллельное чтение&lt;/h3&gt;\n&lt;p&gt;Для параллельного чтения таблиц есть &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/library/parallel_io/parallel_reader.h\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;библиотека&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"operations\"&gt;&lt;a href=\"ru/api/cpp/description.html#operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск операций&lt;/span&gt;&lt;/a&gt;Запуск операций&lt;/h2&gt;\n&lt;p&gt;См. &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/interface/operation.h\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;по ссылке&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Чтобы запустить операцию, содержащую пользовательский код, необходимо:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;унаследоваться от одного из интерфейсов &lt;code&gt;IMapper&lt;/code&gt;, &lt;code&gt;IReducer&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;определить функцию &lt;code&gt;Do()&lt;/code&gt;, в которой должен содержаться обработчик записей;&lt;/li&gt;\n&lt;li&gt;определить конструктор по умолчанию или убедиться, что у класса есть неявный конструктор по умолчанию (подробнее в разделе &lt;a href=\"ru/api/cpp/description.html#init_jobs\"&gt;Инициализация и сериализация джобов&lt;/a&gt;);&lt;/li&gt;\n&lt;li&gt;использовать один из макросов &lt;code&gt;REGISTER_*&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;вызвать в клиентском коде метод клиента/транзакции, соответствующий типу операции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Интерфейсы &lt;code&gt;IMapper&lt;/code&gt; и &lt;code&gt;IReducer&lt;/code&gt; принимают в качестве шаблонных параметров типы &lt;code&gt;TTableReader&amp;lt;тип входных записей&amp;gt;&lt;/code&gt; и &lt;code&gt;TTableWriter&amp;lt;тип выходных записей&amp;gt;&lt;/code&gt;. Указатели на эти типы принимает функция &lt;code&gt;Do()&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-meta\"&gt;#&lt;span class=\"hljs-keyword\"&gt;include&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;&amp;lt;yt/cpp/mapreduce/interface/operation.h&amp;gt;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TExtractKeyMapper&lt;/span&gt;\n    : &lt;span class=\"hljs-keyword\"&gt;public&lt;/span&gt; IMapper&amp;lt;TTableReader&amp;lt;TYaMRRow&amp;gt;, TTableWriter&amp;lt;TNode&amp;gt;&amp;gt;\n{\n&lt;span class=\"hljs-keyword\"&gt;public&lt;/span&gt;:\n    &lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;Do&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(TTableReader&amp;lt;TYaMRRow&amp;gt;* input, TTableWriter&amp;lt;TNode&amp;gt;* output)&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;override&lt;/span&gt; &lt;/span&gt;{\n        &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; (; input-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;IsValid&lt;/span&gt;(); input-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Next&lt;/span&gt;()) {\n            output-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;AddRow&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TNode&lt;/span&gt;()(&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;, input-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;GetRow&lt;/span&gt;().Key));\n        }\n    }\n};\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1381\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1381\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1381\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1381.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Далее необходимо создать макрос, выполняющий регистрацию пользовательского класса:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-built_in\"&gt;REGISTER_MAPPER&lt;/span&gt;(TExtractKeyMapper);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1385\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1385\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1385\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1385.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Отсутствует необходимость в генерации уникальных id, для идентификации будет использован механизм type_info. Тип джоба будет явно виден в веб-интерфейсе операции в строке запуска пользовательских джобов:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;./cppbinary --yt-map &lt;span class=\"hljs-string\"&gt;\"TExtractKeyMapper\"&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1389\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1389\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1389\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1389.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если пользователь желает идентифицировать свои джобы другим способом, он должен позаботиться об уникальности имён в рамках одного приложения и использовать макросы &lt;code&gt;REGISTER_NAMED_*&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-built_in\"&gt;REGISTER_NAMED_MAPPER&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"The best extract key mapper in the world\"&lt;/span&gt;, TExtractKeyMapper);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1393\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1393\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1393\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1393.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Функции для запуска отдельных видов операций приведены ниже:&lt;/p&gt;\n&lt;p&gt;Map:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;IOperationPtr &lt;span class=\"hljs-title\"&gt;Map&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TMapOperationSpec&amp;amp; spec,\n    ::TIntrusivePtr&amp;lt;IMapperBase&amp;gt; mapper,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TOperationOptions&amp;amp; options = TOperationOptions())&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1402\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1402\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1402\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1402.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Reduce:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;IOperationPtr &lt;span class=\"hljs-title\"&gt;Reduce&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TReduceOperationSpec&amp;amp; spec,\n    ::TIntrusivePtr&amp;lt;IReducerBase&amp;gt; reducer,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TOperationOptions&amp;amp; options = TOperationOptions())&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1410\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1410\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1410\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1410.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Join-Reduce:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;IOperationPtr &lt;span class=\"hljs-title\"&gt;JoinReduce&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TJoinReduceOperationSpec&amp;amp; spec,\n    ::TIntrusivePtr&amp;lt;IReducerBase&amp;gt; reducer,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TOperationOptions&amp;amp; options = TOperationOptions())&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1418\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1418\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1418\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1418.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;MapReduce:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;IOperationPtr &lt;span class=\"hljs-title\"&gt;MapReduce&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TMapReduceOperationSpec&amp;amp; spec,\n    ::TIntrusivePtr&amp;lt;IMapperBase&amp;gt; mapper,\n    ::TIntrusivePtr&amp;lt;IReducerBase&amp;gt; reducer,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TOperationOptions&amp;amp; options = TOperationOptions())&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1426\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1426\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1426\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1426.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;IOperationPtr &lt;span class=\"hljs-title\"&gt;MapReduce&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TMapReduceOperationSpec&amp;amp; spec,\n    ::TIntrusivePtr&amp;lt;IMapperBase&amp;gt; mapper,\n    ::TIntrusivePtr&amp;lt;IReducerBase&amp;gt; reduceCombiner,\n    ::TIntrusivePtr&amp;lt;IReducerBase&amp;gt; reducer,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TOperationOptions&amp;amp; options = TOperationOptions())&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1427\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1427\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1427\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1427.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В качестве &lt;code&gt;mapper&lt;/code&gt; можно указать нулевой указатель, тогда операция запустится без стадии Map, вторая версия функции дополнительно запустит стадию &lt;a href=\"user-guide/data-processing/operations/reduce.html#reduce_combiner\"&gt;reduce_combiner&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;В параметры вызова запуска операции обычно входят:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;структура с необходимыми параметрами спецификации;&lt;/li&gt;\n&lt;li&gt;указатели на экземпляры классов джобов;&lt;/li&gt;\n&lt;li&gt;дополнительные опции (&lt;code&gt;TOperationOptions&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Обязательно добавьте пути (&lt;a href=\"ru/api/cpp/description.html#trichypath\"&gt;TRichYPath&lt;/a&gt;) ко входным и выходным таблицам. Поскольку в общем случае (в частности, в protobuf бэкенде) типы записей в таблицах могут быть разными, функции &lt;code&gt;AddInput()&lt;/code&gt; и &lt;code&gt;AddOutput()&lt;/code&gt; у спецификации шаблонные:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;TMapOperationSpec spec;\nspec.&lt;span class=\"hljs-built_in\"&gt;AddInput&lt;/span&gt;&amp;lt;TYaMRRow&amp;gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;)\n    .&lt;span class=\"hljs-built_in\"&gt;AddInput&lt;/span&gt;&amp;lt;TYaMRRow&amp;gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/other_table\"&lt;/span&gt;)\n    .&lt;span class=\"hljs-built_in\"&gt;AddOutput&lt;/span&gt;&amp;lt;TNode&amp;gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/output_table\"&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1456\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1456\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1456\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1456.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Расхождение типов спецификации с типами, указанными в IMapper/IReducer, будет по возможности отловлено в рантайме.&lt;/p&gt;\n&lt;p&gt;Непосредственный вызов без дополнительных параметров выглядит так:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Map&lt;/span&gt;(spec, &lt;span class=\"hljs-keyword\"&gt;new&lt;/span&gt; TExtractKeyMapper);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1463\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1463\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1463\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1463.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Это безопасно, поскольку внутри на объект джоба создаётся &lt;code&gt;TIntrusivePtr&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"peredacha-polzovatelskih-fajlov\"&gt;&lt;a href=\"ru/api/cpp/description.html#peredacha-polzovatelskih-fajlov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Передача пользовательских файлов&lt;/span&gt;&lt;/a&gt;Передача пользовательских файлов&lt;/h3&gt;\n&lt;p&gt;Для передачи в sandbox джоба пользовательских файлов используется структура &lt;code&gt;TUserJobSpec&lt;/code&gt;, входящая в состав основной спецификации. Наборы файлов могут быть разными для разных типов джобов в одной операции:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;TMapReduceOperationSpec spec;\nspec.&lt;span class=\"hljs-built_in\"&gt;MapperSpec&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TUserJobSpec&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;AddLocalFile&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"./file_for_mapper\"&lt;/span&gt;))\n    .&lt;span class=\"hljs-built_in\"&gt;ReducerSpec&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TUserJobSpec&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;AddLocalFile&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"./file_for_reducer\"&lt;/span&gt;));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1473\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1473\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1473\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1473.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Для использования файлов, уже имеющихся в системе, нужно вызвать метод &lt;code&gt;TUserJobSpec::AddFile(fileName)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Важным дополнительным параметром является &lt;code&gt;TOperationOptions::Spec&lt;/code&gt;. Это &lt;code&gt;TNode&lt;/code&gt;, который может содержать любые параметры спецификации, объединяемые с основной спецификацией, формируемой клиентом. Многие из этих параметров описаны в разделе &lt;a href=\"user-guide/data-processing/operations/overview.html\"&gt;Типы операций&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"neskolko-tablic-na-vhode-i-vyhode\"&gt;&lt;a href=\"ru/api/cpp/description.html#neskolko-tablic-na-vhode-i-vyhode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Несколько таблиц на входе и выходе&lt;/span&gt;&lt;/a&gt;Несколько таблиц на входе и выходе&lt;/h3&gt;\n&lt;p&gt;Если операция пишет в несколько выходных таблиц, используется метод &lt;code&gt;AddRow()&lt;/code&gt; c двумя параметрами:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;writer-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;AddRow&lt;/span&gt;(row, tableIndex);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1486\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1486\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1486\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1486.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если операция читает из нескольких таблиц, индекс таблицы может быть получен из &lt;code&gt;TTableReader&lt;/code&gt; с помощью метода &lt;code&gt;GetTableIndex()&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"osobennosti-protobuf-bekenda\"&gt;&lt;a href=\"ru/api/cpp/description.html#osobennosti-protobuf-bekenda\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Особенности protobuf бэкенда&lt;/span&gt;&lt;/a&gt;Особенности protobuf бэкенда&lt;/h3&gt;\n&lt;p&gt;При использовании protobuf есть возможность задавать разные типы записей для входных и выходных таблиц. В этом случае в объявлении базового класса джоба используется &lt;code&gt;TTableReader&lt;/code&gt; или &lt;code&gt;TTableWriter&lt;/code&gt; не от конкретного пользовательского protobuf класса, а от базового &lt;code&gt;Message&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TProtoReducer&lt;/span&gt;\n    : &lt;span class=\"hljs-keyword\"&gt;public&lt;/span&gt; IReducer&amp;lt;TTableReader&amp;lt;Message&amp;gt;, TTableWriter&amp;lt;Message&amp;gt;&amp;gt;\n{ ... }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1496\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1496\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1496\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1496.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;При этом в спецификации операции не следует писать &lt;code&gt;AddInput/AddOutput()&lt;/code&gt;: необходимо указывать конкретный тип.&lt;/p&gt;\n&lt;p&gt;В этом случае методы &lt;code&gt;GetRow()&lt;/code&gt; и &lt;code&gt;AddRow()&lt;/code&gt; становятся шаблонными и должны использовать конкретные пользовательские типы. При чтении выбор вызываемой функции можно делать, применяя &lt;code&gt;GetTableIndex()&lt;/code&gt; текущей записи перед вызовом &lt;code&gt;GetRow()&lt;/code&gt;. При записи вызывается &lt;code&gt;AddRow(row, tableIndex)&lt;/code&gt;. Есть контроль соответствия типов индексам таблиц.&lt;/p&gt;\n&lt;h3 id=\"init_jobs\"&gt;&lt;a href=\"ru/api/cpp/description.html#init_jobs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Инициализация и сериализация джобов&lt;/span&gt;&lt;/a&gt;Инициализация и сериализация джобов&lt;/h3&gt;\n&lt;p&gt;Методы &lt;code&gt;Start()&lt;/code&gt; и &lt;code&gt;Finish()&lt;/code&gt; похожи на аналоги из общего интерфейса, принимают указатель на соответствующий &lt;code&gt;TTableWriter&lt;/code&gt; в качестве параметра.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-keyword\"&gt;virtual&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;Save&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(IOutputStream&amp;amp; stream)&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt;&lt;/span&gt;;\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-keyword\"&gt;virtual&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;Load&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(IInputStream&amp;amp; stream)&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1509\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1509\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1509\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1509.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Сериализация отвязана от каких-либо фреймворков. Содержимое сериализованного джоба сохраняется в sandbox в файле &lt;code&gt;jobstate&lt;/code&gt;. Если при &lt;code&gt;Save()&lt;/code&gt; не было записано ни одного байта, файл будет отсутствовать. &lt;code&gt;Load()&lt;/code&gt; в джобе, тем не менее, будет вызван от пустого потока.&lt;/p&gt;\n&lt;p&gt;Есть хелпер &lt;code&gt;Y_SAVELOAD_JOB&lt;/code&gt;, который оборачивает сериализацию из &lt;code&gt;util/ysaveload.h&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Порядок вызова методов в джобе: &lt;code&gt;default ctor; Load(); Start(); Do(); Finish()&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"prepare_operation\"&gt;&lt;a href=\"ru/api/cpp/description.html#prepare_operation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подготовка операции из класса джоба&lt;/span&gt;&lt;/a&gt;Подготовка операции из класса джоба&lt;/h3&gt;\n&lt;p&gt;В классе &lt;code&gt;IJob&lt;/code&gt; (базовом классе для всех джобов) добавлен виртуальный метод &lt;code&gt;void PrepareOperation(const IOperationPreparationContext&amp;amp; context, TJobOperationPreparer&amp;amp; preparer) const&lt;/code&gt;, который можно перегружать в своих джобах:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;context&lt;/code&gt; позволяет получать информацию о входных и выходных таблицах, в частности, их схемах.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;preparer&lt;/code&gt; нужен для собственно контроля над параметрами спецификации.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Можно задавать:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Схему выходных таблиц: &lt;code&gt;preparer.OutputSchema(tableIndex, schema)&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Типы сообщений для входного и выходного формата protobuf: &lt;code&gt;preparer.InputDescription&amp;lt;TYourMessage&amp;gt;(tableIndex)&lt;/code&gt; и &lt;code&gt;preparer.OutputDescription&amp;lt;TYourMessage&amp;gt;(tableIndex)&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Фильтрацию колонок входных таблиц: &lt;code&gt;preparer.InputColumnFilter(tableIndex, {\"foo\", \"bar\"})&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Возможность переименования колонок входных таблиц: &lt;code&gt;preparer.InputColumnRenaming(tableIndex, {{\"foo\", \"not_foo\"}})&lt;/code&gt;. Переименование применяется &lt;em&gt;после&lt;/em&gt; фильтрации.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Все методы возвращают &lt;code&gt;*this&lt;/code&gt;, что позволяет использовать chaining.&lt;/p&gt;\n&lt;p&gt;Обычно при использовании protobuf достаточно указывать только &lt;code&gt;.OutputDescription&lt;/code&gt;, схема выходной таблицы выведется автоматически.&lt;br /&gt;\nЕсли это поведение не устраивает, можно указать вторым параметром (&lt;code&gt;inferSchema&lt;/code&gt;) &lt;code&gt;false&lt;/code&gt;, например, &lt;code&gt;preparer.OutputDescription&amp;lt;TRow&amp;gt;(tableIndex, false)&lt;/code&gt;.&lt;br /&gt;\nДля джобов, размечающих &lt;code&gt;OutputDescription&lt;/code&gt;, можно использовать короткие варианты запуска операций вроде &lt;code&gt;client-&amp;gt;Map(new TMapper, input, output)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Если есть несколько похожих таблиц, их описание можно объединять в группы, используя методы &lt;code&gt;.(Begin|End)(Input|Output)Group&lt;/code&gt;.&lt;br /&gt;\n&lt;code&gt;.Begin(Input|Output)Group&lt;/code&gt; принимает описание индексов таблиц, которые объединяет данная группа.&lt;br /&gt;\nЭто может быть либо пара &lt;code&gt;[begin, end)&lt;/code&gt;, либо контейнер с &lt;code&gt;int&lt;/code&gt;, например:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;preparer\n    .&lt;span class=\"hljs-built_in\"&gt;BeginInputGroup&lt;/span&gt;({&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;,&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;,&lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;,&lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;})\n        .&lt;span class=\"hljs-built_in\"&gt;Description&lt;/span&gt;&amp;lt;TInputRow&amp;gt;()\n        .&lt;span class=\"hljs-built_in\"&gt;ColumnFilter&lt;/span&gt;({&lt;span class=\"hljs-string\"&gt;\"foo\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"bar\"&lt;/span&gt;})\n        .&lt;span class=\"hljs-built_in\"&gt;ColumnRenaming&lt;/span&gt;({{&lt;span class=\"hljs-string\"&gt;\"foo\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"not_foo\"&lt;/span&gt;}})\n    .&lt;span class=\"hljs-built_in\"&gt;EndInputGroup&lt;/span&gt;()\n    .&lt;span class=\"hljs-built_in\"&gt;BeginOutputGroup&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;7&lt;/span&gt;)\n        .&lt;span class=\"hljs-built_in\"&gt;Description&lt;/span&gt;&amp;lt;TOutputRow&amp;gt;()\n    .&lt;span class=\"hljs-built_in\"&gt;EndOutputGroup&lt;/span&gt;();\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1571\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1571\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1571\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1571.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"zamechaniya\"&gt;&lt;a href=\"ru/api/cpp/description.html#zamechaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Замечания&lt;/span&gt;&lt;/a&gt;Замечания&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;Функция &lt;code&gt;IMapper::Do()&lt;/code&gt; принимает на вход все записи, попадающие в данный джоб. Это отличается от логики общего интерфейса.&lt;/li&gt;\n&lt;li&gt;Функция &lt;code&gt;IReducer::Do()&lt;/code&gt; принимает диапазон записей по одному ключу, как и раньше. В случае операции Reduce это определяется параметром спецификации &lt;code&gt;ReduceBy&lt;/code&gt;, в случае JoinReduce — &lt;code&gt;JoinBy&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Если класс джоба шаблонный от пользовательских параметров, необходимо вызвать &lt;code&gt;REGISTER_*&lt;/code&gt; на каждый инстанс, который необходимо запустить на кластере.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"poluchenie-informacii-ob-operaciyah-i-dzhobah\"&gt;&lt;a href=\"ru/api/cpp/description.html#poluchenie-informacii-ob-operaciyah-i-dzhobah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Получение информации об операциях и джобах&lt;/span&gt;&lt;/a&gt;Получение информации об операциях и джобах&lt;/h2&gt;\n&lt;h3 id=\"getoperation\"&gt;&lt;a href=\"ru/api/cpp/description.html#getoperation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GetOperation&lt;/span&gt;&lt;/a&gt;GetOperation&lt;/h3&gt;\n&lt;p&gt;Получить &lt;a href=\"api/commands.html#get_operation\"&gt;информацию об операции&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;TOperationAttributes &lt;span class=\"hljs-title\"&gt;GetOperation&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TOperationId&amp;amp; operationId,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TGetOperationOptions&amp;amp; options)&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1601\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1601\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1601\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1601.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;t  0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1670\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1670\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1670.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — необязательные опции:&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;FromTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;TInstant&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Начало временн&lt;em&gt;о&lt;/em&gt;го интервала поиска.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ToTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;TInstant&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Конец временн&lt;em&gt;о&lt;/em&gt;го интервала поиска.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;CursorTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;TInstant&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Положение курсора (для пагинации).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;CursorDirection&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;ECursorDirection&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;С какого конца временн&lt;em&gt;о&lt;/em&gt;го интервала начинать перечислять операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Filter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;TString&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;\"Текстовые факторы\" (в частности, title и пути до входных/выходных таблиц) операции включают &lt;code&gt;Filter&lt;/code&gt; как подстроку.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Pool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;TString&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Операция запущена в пуле &lt;code&gt;Pool&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;User&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;TString&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Операция запущена пользователем &lt;code&gt;User&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;State&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;TString&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Операция находится в состоянии &lt;code&gt;State&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;EOperationType&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Операция имеет тип &lt;code&gt;Type&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;WithFailedJobs&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;bool&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;У операции есть (&lt;code&gt;WithFailedJobs == true&lt;/code&gt;) или нет (&lt;code&gt;WithFailedJobs == false&lt;/code& gt;\n&lt;td&gt;&lt;code&gt;Offset&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;i64&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Пропустить первые &lt;code&gt;Offset&lt;/code&gt; джобов (в порядке сортировки).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"getjobinput\"&gt;&lt;a href=\"ru/api/cpp/description.html#getjobinput\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GetJobInput&lt;/span&gt;&lt;/a&gt;GetJobInput&lt;/h3&gt;\n&lt;p&gt;Получить вход &lt;a href=\"api/commands.html#get_job_input\"&gt;запущенного или упавшего джоба&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;IFileReaderPtr &lt;span class=\"hljs-title\"&gt;GetJobInput&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TJobId&amp;amp; jobId,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TGetJobInputOptions&amp;amp; options)&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2328\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2328\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2328\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2328.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;jobId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Id джоба.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — необязательные опции (пока нет)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"getjobfailcontext\"&gt;&lt;a href=\"ru/api/cpp/description.html#getjobfailcontext\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GetJobFailContext&lt;/span&gt;&lt;/a&gt;GetJobFailContext&lt;/h3&gt;\n&lt;p&gt;Получить fail context &lt;a href=\"api/commands.html#get_job_fail_context\"&gt;упавшего джоба&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;IFileReaderPtr &lt;span class=\"hljs-title\"&gt;GetJobFailContext&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TOperationId&amp;amp; operationId,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TJobId&amp;amp; jobId,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TGetJobFailContextOptions&amp;amp; options)&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2365\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2365\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2365\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2365.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operationId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Id операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;jobId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Id джоба.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; —  необязательные опции (пока нет)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"getjobstderr\"&gt;&lt;a href=\"ru/api/cpp/description.html#getjobstderr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GetJobStderr&lt;/span&gt;&lt;/a&gt;GetJobStderr&lt;/h3&gt;\n&lt;p&gt;Получить stderr &lt;a href=\"api/commands.html#get_job_stderr\"&gt;запущенного или упавшего джоба&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;IFileReaderPtr &lt;span class=\"hljs-title\"&gt;GetJobStderr&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TOperationId&amp;amp; operationId,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TJobId&amp;amp; jobId,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TGetJobStderrOptions&amp;amp; options)&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2410\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2410\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2410\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2410.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operationId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Id операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;jobId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Id джоба.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — необязательные опции (пока нет)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"rabota-s-fajlovym-keshom\"&gt;&lt;a href=\"ru/api/cpp/description.html#rabota-s-fajlovym-keshom\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с файловым кэшом&lt;/span&gt;&lt;/a&gt;Работа с файловым кэшом&lt;/h2&gt;\n&lt;p&gt;На кластерах есть общий файловый кеш, хранящий файлы по ключу — их MD5-хэшу. Сейчас&lt;br /&gt;\nон находится по пути &lt;code&gt;//tmp/yt_wrapper/file_storage/new_cache&lt;/code&gt;.&lt;br /&gt;\nДля работы с ним можно использовать методы &lt;code&gt;PutFileToCache&lt;/code&gt; и &lt;code&gt;GetFileFromCache&lt;/code&gt;.&lt;br /&gt;\nЭти же методы можно использовать и для работы со своим кешем, живущим по другому пути (однако очищать его придётся также самостоятельно).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Все команды для работы с файловым кешем нетранзакционны, поэтому являются методами &lt;code&gt;IClient&lt;/code&gt;, но не &lt;code&gt;IClientBase&lt;/code&gt; и не &lt;code&gt;ITransaction&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"putfiletocache\"&gt;&lt;a href=\"ru/api/cpp/description.html#putfiletocache\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PutFileToCache&lt;/span&gt;&lt;/a&gt;PutFileToCache&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"api/commands.html#put_file_to_cache\"&gt;Скопировать файл в кеш&lt;/a&gt;. Возвращает путь к файлу в кеше.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;TYPath &lt;span class=\"hljs-title\"&gt;PutFileToCache&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n        &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; filePath,\n        &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TString&amp;amp; md5Signature,\n        &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; cachePath,\n        &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TPutFileToCacheOptions&amp;amp; options)&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2471\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2471\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2471\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2471.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;filePath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Путь к файлу в Кипарисе (файл должен иметь атрибут &lt;code&gt;md5&lt;/code&gt;, для этого он должен быть записан с опцией &lt;code&gt;TFileWriterOptions::ComputeMD5&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;md5Signature&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;MD5-хэш файла.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;cachePath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Путь в Кипарисе к корню файлового кеша.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — необязательные опции (пока нет)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"getfilefromcache\"&gt;&lt;a href=\"ru/api/cpp/description.html#getfilefromcache\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GetFileFromCache&lt;/span&gt;&lt;/a&gt;GetFileFromCache&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"api/commands.html#get_file_from_cache\"&gt;Получить путь к файлу в кеше&lt;/a&gt;. Возвращает путь или &lt;code&gt;Nothing&lt;/code&gt;, если файла с таким MD5 нет.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;TMaybe&amp;lt;TYPath&amp;gt; &lt;span class=\"hljs-title\"&gt;GetFileFromCache&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n        &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TString&amp;amp; md5Signature,\n        &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; cachePath,\n        &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TGetFileFromCacheOptions&amp;amp; options)&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2524\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2524\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2524\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2524.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;md5Signature&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;MD5-хэш файла.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;cachePath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Путь в Кипарисе к корню файлового кеша.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — необязательные опции (пока нет)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"peremennye-okruzheniya\"&gt;&lt;a href=\"ru/api/cpp/description.html#peremennye-okruzheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Переменные окружения&lt;/span&gt;&lt;/a&gt;Переменные окружения&lt;/h2&gt;\n&lt;p&gt;Сейчас эти настройки доступны только из переменных окружения и одни и те же для всех экземпляров &lt;code&gt;IClient&lt;/code&gt;. однако мы собираемся переработать эту функциональность, чтобы можно было почти всё настраивать непосредственно из кода и менять на уровне отдельных &lt;code&gt;IClient&lt;/code&gt;.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;em&gt;Переменная&lt;/em&gt;&lt;/th&gt;\n&lt;th&gt;&lt;em&gt;Тип&lt;/em&gt;&lt;/th&gt;\n&lt;th&gt;&lt;em&gt;Значение&lt;/em&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_TOKEN&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Значение пользовательского токена.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_TOKEN_PATH&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Путь к файлу с пользовательским токеном.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_PREFIX&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Путь, дописываемый префиксом ко всем путям в Кипарисе.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_TRANSACTION&lt;/td&gt;\n&lt;td&gt;guid&lt;/td&gt;\n&lt;td&gt;Id внешней транзакции. При наличии этого параметра &lt;code&gt;CreateClient()&lt;/code&gt;будет создавать экземпляр &lt;code&gt;IClient&lt;/code&gt;, работающий в контексте данной транзакции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_POOL&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Пул для запуска пользовательских операций.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_FORCE_IPV4&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Использовать только IPv4.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_FORCE_IPV6&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Использовать только IPv6.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_CONTENT_ENCODING&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;HTTP-заголовок Content-Encoding: поддерживается &lt;code&gt;identity&lt;/code&gt;, &lt;code&gt;gzip&lt;/code&gt;, &lt;code&gt;y-lzo&lt;/code&gt;, &lt;code&gt;y-lzf&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_ACCEPT_ENCODING&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;HTTP-заголовок Accept-Encoding.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_USE_HOSTS&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Использовать ли тяжёлые прокси.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_HOSTS&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Путь в запросе списка тяжёлых прокси.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_RETRY_COUNT&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;Количество попыток на HTTP-запрос.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_START_OPERATION_RETRY_COUNT&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;Количество попыток старта операции при превышении лимита одновременно идущих операций.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_VERSION&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Версия HTTP API.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_SPEC&lt;/td&gt;\n&lt;td&gt;json&lt;/td&gt;\n&lt;td&gt;Спецификация, присоединяемая к каждой спецификации операции. Порядок: основная спецификация, &lt;code&gt;YT_SPEC&lt;/code&gt;, &lt;code&gt;TOperationOptions::Spec&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_CONNECT_TIMEOUT&lt;/td&gt;\n&lt;td&gt;seconds&lt;/td&gt;\n&lt;td&gt;Таймаут на подключение к сокету.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_SOCKET_TIMEOUT&lt;/td&gt;\n&lt;td&gt;seconds&lt;/td&gt;\n&lt;td&gt;Таймаут на работу с сокетом.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_TX_TIMEOUT&lt;/td&gt;\n&lt;td&gt;seconds&lt;/td&gt;\n&lt;td&gt;Таймаут транзакции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_PING_INTERVAL&lt;/td&gt;\n&lt;td&gt;seconds&lt;/td&gt;\n&lt;td&gt;Интервал между последовательными пингами транзакции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_RETRY_INTERVAL&lt;/td&gt;\n&lt;td&gt;seconds&lt;/td&gt;\n&lt;td&gt;Интервал между попытками HTTP-запроса.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_RATE_LIMIT_EXCEEDED_RETRY_INTERVAL&lt;/td&gt;\n&lt;td&gt;seconds&lt;/td&gt;\n&lt;td&gt;Интервал между попытками в случае превышения лимита на request rate.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_START_OPERATION_RETRY_INTERVAL&lt;/td&gt;\n&lt;td&gt;seconds&lt;/td&gt;\n&lt;td&gt;Интервал между попытками старта операции.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"potokobezopasnost\"&gt;&lt;a href=\"ru/api/cpp/description.html#potokobezopasnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Потокобезопасность&lt;/span&gt;&lt;/a&gt;Потокобезопасность&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;IClient&lt;/code&gt; и &lt;code&gt;ITransaction&lt;/code&gt; не имеют изменяемого состояния. Потокобезопасно.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/api/cpp/description.md","sourcePath":"ru/api/cpp/description.md"},"headings":[{"title":"Общая информация","href":"ru/api/cpp/description.html#obshaya-infor
