        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Перед запуском примеров рекомендуется прочитать &lt;a href=\"user-guide/storage/auth.html\"&gt;инструкцию&lt;/a&gt; по получению токена.&lt;/p&gt;\n&lt;p&gt;Все программы рекомендуется запускать из-под &lt;code&gt;Linux&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"base\"&gt;&lt;a href=\"ru/api/python/examples.html#base\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Базовый уровень&lt;/span&gt;&lt;/a&gt;Базовый уровень&lt;/h2&gt;\n&lt;p&gt;Современный способ работы с Python API — типизированный.&lt;br /&gt;\nДанные, хранящиеся в таблицах и обрабатываемые операциями, представляются в коде &lt;a href=\"api/python/userdoc.html#dataclass\"&gt;классами&lt;/a&gt; с типизированными полями (аналог &lt;a href=\"https://docs.python.org/3/library/dataclasses.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;dataclasses&lt;/a&gt;). Нерекомендуемый (но иногда неизбежный, особенно при работе со старыми таблицами) способ — нетипизированный, когда строки таблиц представляются словарями.&lt;br /&gt;\nТакой способ гораздо более медленный, чреват ошибками и неудобен при работе со сложными типами. Поэтому в данном разделе документации приведены примеры работы с типизированным API, а нетипизированные примеры можно найти в &lt;a href=\"ru/api/python/examples.html#untyped_tutorial\"&gt;соответствующем разделе&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"read_write\"&gt;&lt;a href=\"ru/api/python/examples.html#read_write\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чтение и запись таблиц&lt;/span&gt;&lt;/a&gt;Чтение и запись таблиц&lt;/h3&gt;\n&lt;p&gt;YTsaurus позволяет записывать данные в таблицы, а также дописывать данные в конец существующих таблиц. Для чтения таблиц доступны несколько режимов: чтение всей таблицы, чтение отдельных диапазонов по номеру строки или ключу.&lt;/p&gt;\n&lt;p&gt;Пример находится в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/table_read_write_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/table_read_write_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"simple_map\"&gt;&lt;a href=\"ru/api/python/examples.html#simple_map\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Простой map&lt;/span&gt;&lt;/a&gt;Простой map&lt;/h3&gt;\n&lt;p&gt;Предположим, имеется таблица с колонками login, name, uid по адресу //home/dev/tutorial/staff_unsorted.&lt;br /&gt;\nНеобходимо сделать таблицу с email адресами, вычислив их из логина: &lt;code&gt;email = login + \"@ytsaurus.tech\"&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Для решения задачи подойдёт простой mapper.&lt;/p&gt;\n&lt;p&gt;Пример находится в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/simple_map_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/simple_map_typed&lt;/a&gt;&lt;/p&gt;\n&lt;h3 id=\"sort_and_reduce\"&gt;&lt;a href=\"ru/api/python/examples.html#sort_and_reduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сортировка таблицы и простая операция reduce&lt;/span&gt;&lt;/a&gt;Сортировка таблицы и простая операция reduce&lt;/h3&gt;\n&lt;p&gt;По той же таблице, что и в предыдущем примере, можно посчитать статистику — сколько раз встречается то или иное имя и самый длинный логин среди всех людей с одним именем. Для решения данной задачи хорошо подходит операция Reduce. Так как операцию Reduce можно запускать только на сортированных таблицах, сначала необходимо отсортировать исходную таблицу.&lt;/p&gt;\n&lt;p&gt;Пример находится в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/simple_reduce_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/simple_reduce_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"reduce_multiple_output\"&gt;&lt;a href=\"ru/api/python/examples.html#reduce_multiple_output\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reduce с несколькими входными таблицами&lt;/span&gt;&lt;/a&gt;Reduce с несколькими входными таблицами&lt;/h3&gt;\n&lt;p&gt;Предположим, кроме таблицы с пользователями есть другая таблице, в которой записано какой пользователь является служебным. Поле is_robot принимает значения true или false.&lt;/p&gt;\n&lt;p&gt;Следующая программа формирует таблицу, в которой остаются только служебные пользователи.&lt;/p&gt;\n&lt;p&gt;Пример находится в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/multiple_input_reduce_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/multiple_input_reduce_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"reduce_multiple_input_output\"&gt;&lt;a href=\"ru/api/python/examples.html#reduce_multiple_input_output\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reduce с несколькими входными и несколькими выходными таблицами&lt;/span&gt;&lt;/a&gt;Reduce с несколькими входными и несколькими выходными таблицами&lt;/h3&gt;\n&lt;p&gt;Данный пример повторяет предыдущий с той разницей, что запись будет производиться сразу в две выходные таблицы — и с пользователями-людьми, и со служебными пользователями.&lt;/p&gt;\n&lt;p&gt;Пример находится в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/multiple_input_multiple_output_reduce_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/multiple_input_multiple_output_reduce_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"table_schema\"&gt;&lt;a href=\"ru/api/python/examples.html#table_schema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схемы таблиц&lt;/span&gt;&lt;/a&gt;Схемы таблиц&lt;/h3&gt;\n&lt;p&gt;У всех таблиц в YTsaurus есть &lt;a href=\"api/python/userdoc.html#table_schema\"&gt;схема&lt;/a&gt;.&lt;br /&gt;\nВ коде продемонстрированы примеры работы со схемой таблиц.&lt;/p&gt;\n&lt;p&gt;Пример находится в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/table_schema_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/table_schema_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"map_reduce\"&gt;&lt;a href=\"ru/api/python/examples.html#map_reduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MapReduce&lt;/span&gt;&lt;/a&gt;MapReduce&lt;/h3&gt;\n&lt;p&gt;В YTsaurus реализована слитная операция MapReduce, которая работает быстрее, нежели Map + Sort + Reduce. Попробуем по таблице с пользователями ещё раз посчитать статистику, сколько раз встречается то или иное имя. Перед подсчётом статистики нормализируем имена, приведя их к нижнему регистру, чтобы люди с именами &lt;code&gt;АРКАДИЙ&lt;/code&gt; и &lt;code&gt;Аркадий&lt;/code&gt; склеились в нашей статистике.&lt;/p&gt;\n&lt;p&gt;Пример находится в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/map_reduce_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/map_reduce_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"map_reduce_multiple_intermediate_streams\"&gt;&lt;a href=\"ru/api/python/examples.html#map_reduce_multiple_intermediate_streams\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MapReduce с несколькими промежуточными таблицами&lt;/span&gt;&lt;/a&gt;MapReduce с несколькими промежуточными таблицами&lt;/h3&gt;\n&lt;p&gt;Промежуточные данные (между стадиями map и reduce) в операции MapReduce могут \"течь\" в несколько потоков и иметь разные типы. В данном примере на входе операции две таблицы: первая отображает uid в имя, а вторая содержит информация о событиях, связанных с пользователем с данным uid. Mapper отбирает события типа \"клик\" и посылает их в один выходной поток, а всех пользователей отправляет в другой. Reducer считает все клики по данному пользователю.&lt;/p&gt;\n&lt;p&gt;Пример находится в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/map_reduce_multiple_intermediate_streams_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/map_reduce_multiple_intermediate_streams_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"job_decorators\"&gt;&lt;a href=\"ru/api/python/examples.html#job_decorators\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Декораторы для классов-джобов&lt;/span&gt;&lt;/a&gt;Декораторы для классов-джобов&lt;/h3&gt;\n&lt;p&gt;Существует возможность пометить функции или классы джобов специальными декораторами, меняющими ожидаемый интерфейс взаимодействия с джобами.&lt;br /&gt;\nПримеры декораторов: &lt;code&gt;with_context&lt;/code&gt;, &lt;code&gt;aggregator&lt;/code&gt;, &lt;code&gt;reduce_aggregator&lt;/code&gt;, &lt;code&gt;raw&lt;/code&gt;, &lt;code&gt;raw_io&lt;/code&gt;. Полное описание можно найти в &lt;a href=\"api/python/userdoc.html#python_decorators\"&gt;документации&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;Пример находится в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/job_decorators_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/job_decorators_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"files\"&gt;&lt;a href=\"ru/api/python/examples.html#files\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с файлами на клиенте и в операциях&lt;/span&gt;&lt;/a&gt;Работа с файлами на клиенте и в операциях&lt;/h3&gt;\n&lt;p&gt;Более полная информация в &lt;a href=\"api/python/userdoc.html#file_commands\"&gt;документации&lt;/a&gt;.&lt;br /&gt;\nПодробнее про файлы в Кипарисе можно прочитать в &lt;a href=\"user-guide/storage/files.html\"&gt;разделе&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Пример находится в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/files_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/files_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"grep\"&gt;&lt;a href=\"ru/api/python/examples.html#grep\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Генеричный grep&lt;/span&gt;&lt;/a&gt;Генеричный grep&lt;/h3&gt;\n&lt;p&gt;Типизированное API позволяет работать с достаточно произвольными данными, используя один датакласс и один класс операции. В качестве примера рассмотрим задачу фильтрации таблицы по условию совпадения регулярного выражения с заданным строковым полем.&lt;/p&gt;\n&lt;p&gt;Пример находится в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/grep_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/grep_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"advanced\"&gt;&lt;a href=\"ru/api/python/examples.html#advanced\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Продвинутый уровень&lt;/span&gt;&lt;/a&gt;Продвинутый уровень&lt;/h2&gt;\n&lt;h3 id=\"batch_queries\"&gt;&lt;a href=\"ru/api/python/examples.html#batch_queries\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batch запросы&lt;/span&gt;&lt;/a&gt;Batch запросы&lt;/h3&gt;\n&lt;p&gt;Существует возможность исполнять \"лёгкие\" запросы (создать/удалить таблицу, проверить её существование и так далее) группами. Разумно пользоваться данным способом, если необходимо выполнить большое количество однотипных операций, batch запросы могут заметно сэкономить время выполнения.&lt;/p&gt;\n&lt;p&gt;Пример находится в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/batch_client\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/batch_client&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"rpc\"&gt;&lt;a href=\"ru/api/python/examples.html#rpc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование RPC&lt;/span&gt;&lt;/a&gt;Использование RPC&lt;/h3&gt;\n&lt;p&gt;Использование RPC с помощью CLI.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt list / --proxy cluster_name --config &lt;span class=\"hljs-string\"&gt;'{backend=rpc}'&lt;/span&gt;\ncooked_logs\nhome\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"135\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-135\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-135\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-135.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Аналогичный пример (полный код в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/simple_rpc\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/simple_rpc&lt;/a&gt;) можно соорудить из питона (в аркадийной сборке):&lt;/p&gt;\n&lt;p&gt;Обратите внимание на дополнительный &lt;code&gt;PEERDIR(yt/python/client_with_rpc)&lt;/code&gt; в &lt;code&gt;ya.make&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;C помощью RPC можно работать с динамическими таблицами.&lt;br /&gt;\nПример находится в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/dynamic_tables_rpc\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/dynamic_tables_rpc&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"prepare_operation\"&gt;&lt;a href=\"ru/api/python/examples.html#prepare_operation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Указание типов строк с помощью prepare_operation&lt;/span&gt;&lt;/a&gt;Указание типов строк с помощью prepare_operation&lt;/h3&gt;\n&lt;p&gt;Помимо использования type hints, для указания Python-типов строк таблиц можно определить метод &lt;code&gt;prepare_operation&lt;/code&gt;, где все типы указываются с использованием специальных методов. При наличии в классе джоба метода &lt;code&gt;prepare_operation&lt;/code&gt; библиотека будет использовать типы, указанные внутри метода, и попытка вывести типы строк из type hints производиться не будет.&lt;/p&gt;\n&lt;p&gt;Пример находится в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/prepare_operation_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/prepare_operation_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"misc\"&gt;&lt;a href=\"ru/api/python/examples.html#misc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Разные примеры&lt;/span&gt;&lt;/a&gt;Разные примеры&lt;/h2&gt;\n&lt;h3 id=\"dataclass\"&gt;&lt;a href=\"ru/api/python/examples.html#dataclass\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Датаклассы&lt;/span&gt;&lt;/a&gt;Датаклассы&lt;/h3&gt;\n&lt;p&gt;В данном примере более подробно продемонстрированы возможности и особенности работы с &lt;a href=\"api/python/userdoc.html#dataclass\"&gt;датаклассами&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Пример находится в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/dataclass_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/dataclass_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"table_switches\"&gt;&lt;a href=\"ru/api/python/examples.html#table_switches\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Контекст и управление записью в выходные таблицы&lt;/span&gt;&lt;/a&gt;Контекст и управление записью в выходные таблицы&lt;/h3&gt;\n&lt;p&gt;Для выбора, в какую выходную таблицу записать строку, необходимо использовать класс-обёртку &lt;code&gt;OutputRow&lt;/code&gt;, а именно аргумент &lt;code&gt;table_index&lt;/code&gt; его конструктора. Имея любой итератор на датаклассы (который вернулся из &lt;code&gt;read_table_structured()&lt;/code&gt; или передан в метод &lt;code&gt;__call__()&lt;/code&gt; джоба), с помощью метода &lt;code&gt;.with_context()&lt;/code&gt; можно сделать из него итератор на пары &lt;code&gt;(row, context)&lt;/code&gt;. Объект &lt;code&gt;context&lt;/code&gt; имеет методы &lt;code&gt;.get_table_index()&lt;/code&gt;, &lt;code&gt;.get_row_index()&lt;/code&gt; и &lt;code&gt;.get_range_index()&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;При написании класса джоба, в метод &lt;code&gt;__call__()&lt;/code&gt; которого передаётся не итератор, а отдельная строка (например, mapper-ы), можно добавить к классу декоратор &lt;code&gt;@yt.wrapper.with_context&lt;/code&gt;, в таком случае метод &lt;code&gt;__call__()&lt;/code&gt; должен принимать третьим аргументом &lt;code&gt;context&lt;/code&gt; (смотрите &lt;a href=\"api/python/userdoc.html#python_decorators\"&gt;документацию&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;В reducer, mapper-агрегаторах и при чтении таблиц — всегда, когда есть итератор на строки, используйте метод &lt;code&gt;with_context&lt;/code&gt; итератора.&lt;/p&gt;\n&lt;p&gt;Пример находится в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/table_switches_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/table_switches_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"spec_builder\"&gt;&lt;a href=\"ru/api/python/examples.html#spec_builder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Spec builders&lt;/span&gt;&lt;/a&gt;Spec builders&lt;/h3&gt;\n&lt;p&gt;Используйте &lt;a href=\"api/python/userdoc.html#spec_builder\"&gt;spec builder&lt;/a&gt; для описания спецификации операций чтобы избегать ошибок.&lt;/p&gt;\n&lt;p&gt;Пример находится в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/spec_builder_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/spec_builder_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gevent\"&gt;&lt;a href=\"ru/api/python/examples.html#gevent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование gevent&lt;/span&gt;&lt;/a&gt;Использование gevent&lt;/h3&gt;\n&lt;p&gt;Документация содержится &lt;a href=\"api/python/userdoc.html#gevent\"&gt;в отдельном разделе&lt;/a&gt;.&lt;br /&gt;\nПример находится в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/gevent\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/gevent&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/api/python/examples.md","sourcePath":"ru/api/python/examples.md"},"headings":[{"title":"Базовый уровень","href":"ru/api/python/examples.html#base","level":2,"items":[{"title":"Чтение и запись таблиц","href":"ru/api/python/examples.html#read_write","level":3},{"title":"Простой map","href":"ru/api/python/examples.html#simple_map","level":3},{"title":"Сортировка таблицы и простая операция reduce","href":"ru/api/python/examples.html#sort_and_reduce","level":3},{"title":"Reduce с несколькими входными таблицами","href":"ru/api/python/examples.html#reduce_multiple_output","level":3},{"title":"Reduce с несколькими входными и несколькими выходными таблицами","href":"ru/api/python/examples.html#reduce_multiple_input_output","level":3},{"title":"Схемы таблиц","href":"ru/api/python/examples.html#table_schema","level":3},{"title":"MapReduce","href":"ru/api/python/examples.html#map_reduce","level":3},{"title":"MapReduce с несколькими промежуточными таблицами","href":"ru/api/python/examples.html#map_reduce_multiple_intermediate_streams","level":3},{"title":"Декораторы для классов-джобов","href":"ru/api/python/examples.html#job_decorators","level":3},{"title":"Работа с файлами на клиенте и в операциях","href":"ru/api/python/examples.html#files","level":3},{"title":"Генеричный grep","href":"ru/api/python/examples.html#grep","level":3}]},{"title":"Продвинутый уровень","href":"ru/api/python/examples.html#advanced","level":2,"items":[{"title":"Batch запросы","href":"ru/api/python/examples.html#batch_queries","level":3},{"title":"Использование RPC","href":"ru/api/python/examples.html#rpc","level":3},{"title":"Указание типов строк с помощью prepare_operation","href":"ru/api/python/examples.html#prepare_operation","level":3}]},{"title":"Разные примеры","href":"ru/api/python/examples.html#misc","level":2,"items":[{"title":"Датаклассы","href":"ru/api/python/examples.html#dataclass","level":3},{"title":"Контекст и управление записью в выходные таблицы","href":"ru/api/python/examples.html#table_switches","level":3},{"title":"Spec builders","href":"ru/api/python/examples.html#spec_builder","level":3},{"title":"Использование gevent","href":"ru/api/python/examples.html#gevent","level":3}]}],"title":"Python API на примерах"},"router":{"pathname":"ru/api/python/examples","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-d
