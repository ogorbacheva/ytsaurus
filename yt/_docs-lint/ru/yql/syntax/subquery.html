        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"define-subquery\"&gt;&lt;a href=\"ru/yql/syntax/subquery.html#define-subquery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DEFINE SUBQUERY&lt;/span&gt;&lt;/a&gt;DEFINE SUBQUERY&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;DEFINE SUBQUERY&lt;/code&gt; позволяет объявить шаблон подзапроса (subquery), который представляет собой параметризуемый блок из нескольких выражений верхнего уровня (statements), и затем многократно его использовать путём применения в секции &lt;code&gt;FROM&lt;/code&gt; выражения &lt;a href=\"ru/yql/syntax/select/index.html\"&gt;SELECT&lt;/a&gt; или входных данных в &lt;a href=\"ru/yql/syntax/process.html\"&gt;PROCESS&lt;/a&gt;/&lt;a href=\"ru/yql/syntax/reduce.html\"&gt;REDUCE&lt;/a&gt; с указанием параметров.&lt;/p&gt;\n&lt;p&gt;В отличие от &lt;a href=\"ru/yql/syntax/action.html\"&gt;действий&lt;/a&gt; шаблон подзапроса должен заканчиваться выражением &lt;code&gt;SELECT&lt;/code&gt;/&lt;code&gt;PROCESS&lt;/code&gt;/&lt;code&gt;REDUCE&lt;/code&gt;, чей результат и является возвращаемым значением подзапроса. При этом выражение верхнего уровня &lt;code&gt;SELECT&lt;/code&gt;/&lt;code&gt;PROCESS&lt;/code&gt;/&lt;code&gt;REDUCE&lt;/code&gt; нельзя использовать более одного раза, как и модифицирующие выражения (например, &lt;code&gt;INSERT&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;После &lt;code&gt;DEFINE SUBQUERY&lt;/code&gt; указывается:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/expressions.html#named-nodes\"&gt;Именованное выражение&lt;/a&gt;, по которому объявляемый шаблон будет доступен далее в запросе.&lt;/li&gt;\n&lt;li&gt;В круглых скобках список именованных выражений, по которым внутри шаблона подзапроса можно обращаться к параметрам.&lt;/li&gt;\n&lt;li&gt;Ключевое слово &lt;code&gt;AS&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Сам список выражений верхнего уровня.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;END DEFINE&lt;/code&gt; выступает в роли маркера, обозначающего последнее выражение внутри шаблона подзапроса.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Один или более последних параметров subquery могут быть помечены вопросиком как необязательные — если они не были указаны при вызове subquery, то им будет присвоено значение &lt;code&gt;NULL&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В больших запросах объявление шаблонов подзапросов можно выносить в отдельные файлы и подключать их в основной запрос с помощью &lt;a href=\"ru/yql/syntax/export_import.html#export\"&gt;EXPORT&lt;/a&gt; + &lt;a href=\"ru/yql/syntax/export_import.html#import\"&gt;IMPORT&lt;/a&gt;, чтобы вместо одного длинного текста получилось несколько логических частей, в которых проще ориентироваться. Важный нюанс: директива &lt;code&gt;USE my_cluster;&lt;/code&gt; в импортирующем запросе не влияет на поведение объявленных в других файлах подзапросов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Даже если список параметров в определении шаблона подзапроса пустой при использовании его во &lt;code&gt;FROM&lt;/code&gt; секции нужно указать скобки &lt;code&gt;()&lt;/code&gt;. Такое может быть удобно использовать, чтобы ограничить область видимости именованных выражений, используемых только в одном подзапросе.&lt;/p&gt;\n&lt;p&gt;В некоторых случаях вместо операции &lt;code&gt;DEFINE SUBQUERY&lt;/code&gt; удобнее использовать эквивалентную форму в виде &lt;a href=\"ru/yql/syntax/expressions.html#lambda\"&gt;лямбда функции&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;В этом случае лямбда функция должна принимать первым аргументом специальный объект &lt;code&gt;world&lt;/code&gt;, через который передаются зависимости о том, какие видны &lt;a href=\"ru/yql/syntax/pragma/index.html\"&gt;PRAGMA&lt;/a&gt; или &lt;a href=\"ru/yql/syntax/commit.html\"&gt;COMMIT&lt;/a&gt; в точке использования шаблона запроса. Также этот объект нужно передавать первым аргументом вместе с остальными аргументами при их наличии другим шаблонам запросов, если они используются в лямбда функции.&lt;/p&gt;\n&lt;p&gt;Возвращаемым значением лямбда функции должно быть значение с типом список структур (выходная таблица) или список вариантов над кортежом из структур (несколько выходных таблиц). В последнем случае в точке использования шаблона запроса обычно используется распаковка вида&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$out1, $out2 = PROCESS $mySubquery($myParam1, $myParam2);\n-- используем далее $out1 и $out2 как отдельные таблицы.\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"64\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-64\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-64\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-64.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"primery\"&gt;&lt;a href=\"ru/yql/syntax/subquery.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DEFINE SUBQUERY $hello_world($name, $suffix?) AS\n    $name = $name ?? ($suffix ?? \"world\");\n    SELECT \"Hello, \" || $name || \"!\";\nEND DEFINE;\n\nSELECT * FROM $hello_world(NULL); -- Hello, world!\nSELECT * FROM $hello_world(\"John\"); -- Hello, John!\nSELECT * FROM $hello_world(NULL, \"Earth\"); -- Hello, Earth!\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"68\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-68\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-68\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-68.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DEFINE SUBQUERY $dup($x) AS\n   SELECT * FROM $x(1)  -- применяем переданный шаблон запроса с одним аргументом\n   UNION ALL\n   SELECT * FROM $x(2); -- ... и с другим аргументом\nEND DEFINE;\n\nDEFINE SUBQUERY $sub($n) AS\n   SELECT $n * 10;\nEND DEFINE;\n\nSELECT * FROM $dup($sub); -- передаем шаблон запроса $sub как параметр\n-- Результат:\n-- 10\n-- 20\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"69\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-69\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-69\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-69.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;/* Уберем используемые именованные выражения $a и $b в отдельную область видимости */\nDEFINE SUBQUERY $clean() AS\n   $a = 10;\n   $b = $a * $a;\n   SELECT $a AS a, $b AS b;\nEND DEFINE;\n\nSELECT * FROM $clean(); -- a: 10, b: 100\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"70\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-70\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-70\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-70.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE hahn;\n\nDEFINE SUBQUERY $input() as\n    SELECT * FROM `home/yql/tutorial/users`;\nEND DEFINE;\n\nDEFINE SUBQUERY $myProcess1($nestedQuery, $lambda) AS\n    PROCESS $nestedQuery() -- использование скобок () тут обязательно\n    USING $lambda(TableRow());\nEND DEFINE;\n\n$myProcess2 = ($world, $nestedQuery, $lambda) -&amp;gt; {\n    -- Если использовать ListFlatMap или YQL::OrderedFlatMap, то получится Ordered YTsaurus Map операция\n    return YQL::FlatMap($nestedQuery($world), $lambda);\n};\n\n-- При таком использовании реализации $myProcess1 и $myProcess2 идентичны\nSELECT * FROM $myProcess1($input, ($x) -&amp;gt; { RETURN AsList($x, $x) });\nSELECT * FROM $myProcess2($input, ($x) -&amp;gt; { RETURN AsList($x, $x) });\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"71\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-71\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-71\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-71.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE hahn;\n\nDEFINE SUBQUERY $runPartition($table) AS\n    $paritionByAge = ($row) -&amp;gt; {\n        $recordType = TypeOf($row);\n        $varType = VariantType(TupleType($recordType, $recordType));\n        RETURN If($row.age % 2 == 0,\n            Variant($row, \"0\", $varType),\n            Variant($row, \"1\", $varType),\n        );\n    };\n\n    PROCESS $table USING $paritionByAge(TableRow());\nEND DEFINE;\n\n-- Распаковка двух результатов\n$i, $j = (PROCESS $runPartition(\"home/yql/tutorial/users\"));\n\nSELECT * FROM $i;\n\nSELECT * FROM $j;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"72\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-72\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-72\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-72.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"subquery-extend\"&gt;&lt;a id=\"subquery-unionmerge\" href=\"ru/yql/syntax/subquery.html#subquery-unionmerge\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SubqueryExtend, SubqueryUnionAll, SubqueryMerge, SubqueryUnionMerge&lt;/span&gt;&lt;/a&gt;&lt;a id=\"subquery-merge\" href=\"ru/yql/syntax/subquery.html#subquery-merge\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SubqueryExtend, SubqueryUnionAll, SubqueryMerge, SubqueryUnionMerge&lt;/span&gt;&lt;/a&gt;&lt;a id=\"subquery-unionall\" href=\"ru/yql/syntax/subquery.html#subquery-unionall\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SubqueryExtend, SubqueryUnionAll, SubqueryMerge, SubqueryUnionMerge&lt;/span&gt;&lt;/a&gt;&lt;a href=\"ru/yql/syntax/subquery.html#subquery-extend\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SubqueryExtend, SubqueryUnionAll, SubqueryMerge, SubqueryUnionMerge&lt;/span&gt;&lt;/a&gt;SubqueryExtend, SubqueryUnionAll, SubqueryMerge, SubqueryUnionMerge&lt;/h2&gt;\n&lt;p&gt;Объединение шаблонов подзапросов &lt;code&gt;SubqueryExtend&lt;/code&gt;, &lt;code&gt;SubqueryUnionAll&lt;/code&gt;, &lt;code&gt;SubqueryMerge&lt;/code&gt;, &lt;code&gt;SubqueryUnionMerge&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Функции объединяют результаты одного и более шаблонов подзапросов, переданных аргументами. Требуется совпадение количества параметров в этих шаблонах подзапросов.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;SubqueryExtend&lt;/code&gt; требует совпадения схем подзапросов;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;SubqueryUnionAll&lt;/code&gt; работает по тем же правилам, что и &lt;a href=\"ru/yql/builtins/list.html#ListUnionAll\"&gt;ListUnionAll&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;SubqueryMerge&lt;/code&gt; использует те же ограничения, что и &lt;code&gt;SubqueryExtend&lt;/code&gt;, а также выдаёт сортированный результат в случае если все подзапросы одинаково отсортированы;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;SubqueryUnionMerge&lt;/code&gt; использует те же ограничения, что и &lt;code&gt;SubqueryUnionAll&lt;/code&gt;, а также выдаёт сортированный результат в случае если все подзапросы одинаково отсортированы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery1\"&gt;&lt;a href=\"ru/yql/syntax/subquery.html#primery1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DEFINE SUBQUERY $sub1() as\n    SELECT 1 as x;\nEND DEFINE;\n\nDEFINE SUBQUERY $sub2() as\n    SELECT 2 as x;\nEND DEFINE;\n\n$s = SubqueryExtend($sub1,$sub2);\nPROCESS $s();\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"107\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-107\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-107\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-107.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"subquery-extend-for\"&gt;&lt;a id=\"subquery-unionmerge-for\" href=\"ru/yql/syntax/subquery.html#subquery-unionmerge-for\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SubqueryExtendFor, SubqueryUnionAllFor, SubqueryMergeFor, SubqueryUnionMergeFor&lt;/span&gt;&lt;/a&gt;&lt;a id=\"subquery-merge-for\" href=\"ru/yql/syntax/subquery.html#subquery-merge-for\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SubqueryExtendFor, SubqueryUnionAllFor, SubqueryMergeFor, SubqueryUnionMergeFor&lt;/span&gt;&lt;/a&gt;&lt;a id=\"subquery-unionall-for\" href=\"ru/yql/syntax/subquery.html#subquery-unionall-for\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SubqueryExtendFor, SubqueryUnionAllFor, SubqueryMergeFor, SubqueryUnionMergeFor&lt;/span&gt;&lt;/a&gt;&lt;a href=\"ru/yql/syntax/subquery.html#subquery-extend-for\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SubqueryExtendFor, SubqueryUnionAllFor, SubqueryMergeFor, SubqueryUnionMergeFor&lt;/span&gt;&lt;/a&gt;SubqueryExtendFor, SubqueryUnionAllFor, SubqueryMergeFor, SubqueryUnionMergeFor&lt;/h2&gt;\n&lt;p&gt;Объединение шаблонов подзапросов после подстановки элемента списка &lt;code&gt;SubqueryExtendFor&lt;/code&gt;, &lt;code&gt;SubqueryUnionAllFor&lt;/code&gt;, &lt;code&gt;SubqueryMergeFor&lt;/code&gt;, &lt;code&gt;SubqueryUnionMergeFor&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Функции принимают аргументы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;непустой список значений;&lt;/li&gt;\n&lt;li&gt;шаблон подзапроса, в котором должен быть ровно один параметр.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;И выполняют подстановку в шаблон подзапроса в качестве параметра каждый элемент из списка, после чего объединяют полученные подзапросы.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;SubqueryExtendFor&lt;/code&gt; требует совпадения схем подзапросов;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;SubqueryUnionAllFor&lt;/code&gt; работает по тем же правилам, что и &lt;a href=\"ru/yql/builtins/list.html#ListUnionAll\"&gt;ListUnionAll&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;SubqueryMergeFor&lt;/code&gt; использует те же ограничения, что и &lt;code&gt;SubqueryExtendFor&lt;/code&gt;, а также выдаёт сортированный результат в случае, если все подзапросы одинаково отсортированы;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;SubqueryUnionMergeFor&lt;/code&gt; использует те же ограничения, что и &lt;code&gt;SubqueryUnionAllFor&lt;/code&gt;, а также выдаёт сортированный результат в случае, если все подзапросы одинаково отсортированы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery2\"&gt;&lt;a href=\"ru/yql/syntax/subquery.html#primery2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DEFINE SUBQUERY $sub($i) as\n    SELECT $i as x;\nEND DEFINE;\n\n$s = SubqueryExtendFor([1,2,3],$sub);\nPROCESS $s();\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"157\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-157\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-157\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-157.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"subqueryorderby,-subqueryassumeorderby\"&gt;&lt;a href=\"ru/yql/syntax/subquery.html#subqueryorderby,-subqueryassumeorderby\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SubqueryOrderBy, SubqueryAssumeOrderBy&lt;/span&gt;&lt;/a&gt;SubqueryOrderBy, SubqueryAssumeOrderBy&lt;/h2&gt;\n&lt;p&gt;Добавление сортировки в шаблон подзапроса &lt;code&gt;SubqueryOrderBy&lt;/code&gt; или указание о наличии таковой &lt;code&gt;SubqueryAssumeOrderBy&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Данные функции принимают аргументы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;шаблон подзапроса без параметров;&lt;/li&gt;\n&lt;li&gt;список пар &lt;code&gt;(&amp;lt;string&amp;gt;, &amp;lt;boolean&amp;gt;)&lt;/code&gt;, где:\n&lt;ul&gt;\n&lt;li&gt;первое значение — это имя колонки;&lt;/li&gt;\n&lt;li&gt;второе значение — направление сортировки. &lt;code&gt;true&lt;/code&gt; для сортировки по возрастанию и &lt;code&gt;false&lt;/code&gt; для сортировки по убыванию.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Функции выполняют построение нового шаблона запроса без параметров, в котором выполняется сортировка или добавляется указание о наличии сортировки к результату. Для использования полученного шаблона запроса необходимо использовать функцию &lt;code&gt;PROCESS&lt;/code&gt;, так как при использовании &lt;code&gt;SELECT&lt;/code&gt; сортировка будет проигнорирована.&lt;/p&gt;\n&lt;h4 id=\"primery3\"&gt;&lt;a href=\"ru/yql/syntax/subquery.html#primery3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DEFINE SUBQUERY $sub() as\n   SELECT * FROM (VALUES (1,'c'), (1,'a'), (3,'b')) AS a(x,y);\nend define;\n\n$sub2 = SubqueryOrderBy($sub, [('x',false), ('y',true)]);\n\nPROCESS $sub2();\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"197\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-197\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-197\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-197.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/syntax/subquery.md","sourcePath":"ru/yql/syntax/subquery.md"},"headings":[{"title":"DEFINE SUBQUERY","href":"ru/yql/syntax/subquery.html#define-subquery","level":2},{"title":"SubqueryExtend, SubqueryUnionAll, SubqueryMerge, SubqueryUnionMerge","href":"ru/yql/syntax/subquery.html#subquery-extend","level":2},{"title":"SubqueryExtendFor, SubqueryUnionAllFor, SubqueryMergeFor, SubqueryUnionMergeFor","href":"ru/yql/syntax/subquery.html#subquery-extend-for","level":2},{"title":"SubqueryOrderBy, SubqueryAssumeOrderBy","href":"ru/yql/syntax/subquery.html#subqueryorderby,-subqueryassumeorderby","level":2}],"title":"Шаблоны подзапросов (subquery)"},"router":{"pathname":"ru/yql/syntax/subquery","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
