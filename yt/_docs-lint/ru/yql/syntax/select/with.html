            {"data":{"leading":false,"html":"&lt;p&gt;Задается после источника данных во &lt;code&gt;FROM&lt;/code&gt; и используется для указания дополнительных подсказок использования таблиц. Подсказки нельзя задать для подзапросов и &lt;a href=\"ru/yql/syntax/expressions.html#named-nodes\"&gt;именованных выражений&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Поддерживаются следующие значения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;INFER_SCHEMA&lt;/code&gt; — задает флаг вывода схемы таблицы. Поведение аналогично заданию &lt;a href=\"ru/yql/syntax/pragma/yt.html#inferschema\"&gt;прагмы yt.InferSchema&lt;/a&gt;, только для конкретного источника данных. Можно задать число строк для выведения (число от 1 до 1000).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;FORCE_INFER_SCHEMA&lt;/code&gt; — задает флаг вывода схемы таблицы. Поведение аналогично заданию &lt;a href=\"ru/yql/syntax/pragma/yt.html#inferschema\"&gt;прагмы yt.ForceInferSchema&lt;/a&gt;, только для конкретного источника данных. Можно задать число строк для выведения (число от 1 до 1000).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DIRECT_READ&lt;/code&gt; — подавляет работу некоторых оптимизаторов и заставляет использовать содержимое таблицы как есть. Поведение аналогично заданию отладочной &lt;a href=\"ru/yql/syntax/pragma/debug.html\"&gt;прагмы DirectRead&lt;/a&gt;, только для конкретного источника данных.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;INLINE&lt;/code&gt; — указание на то, что содержимое таблицы небольшое и нужно использовать его представление в памяти для обработки запроса. Реальный объем таблицы при этом не контролируется, и если он большой, то запрос может упасть по превышению памяти.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;UNORDERED&lt;/code&gt; — подавляет использование исходной сортировки таблицы.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;XLOCK&lt;/code&gt; — указание на то, что нужно брать эксклюзивный лок на таблицу. Полезен, когда чтение таблицы происходит на стадии обработки &lt;a href=\"ru/yql/syntax/action.html\"&gt;метапрограммы запроса&lt;/a&gt;, а затем ее содержимое обновляется в основном запросе. Позволяет избежать потери данных, если между исполнением фазы метапрограммы и основной частью запроса внешний процесс успел изменить таблицу.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;SCHEMA&lt;/code&gt; type — указание на то, что следует использовать указанную схему таблицы целиком, игнорируя схему в метаданных.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;COLUMNS&lt;/code&gt; type — указание на то, что следует использовать указанные типы для колонок, чьи имена совпадают с именами колонок таблицы в метаданных, а также какие колонки дополнительно присутствуют в таблице.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;IGNORETYPEV3&lt;/code&gt;, &lt;code&gt;IGNORE_TYPE_V3&lt;/code&gt; — задает флаг игнорирования type_v3 типов в таблице. Поведение аналогично заданию &lt;a href=\"ru/yql/syntax/pragma/yt.html#ignoretypev3\"&gt;прагмы yt.IgnoreTypeV3&lt;/a&gt;, только для конкретного источника данных.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;При задании подсказок &lt;code&gt;SCHEMA&lt;/code&gt; и &lt;code&gt;COLUMNS&lt;/code&gt; в качестве значения типа type должен быть задан тип &lt;a href=\"ru/yql/types/containers.html\"&gt;структуры&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Если задана подсказка &lt;code&gt;SCHEMA&lt;/code&gt;, то при использовании табличных функций &lt;a href=\"ru/yql/syntax/select/concat.html\"&gt;EACH&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/select/concat.html\"&gt;RANGE&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/select/concat.html\"&gt;LIKE&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/select/concat.html\"&gt;REGEXP&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/select/concat.html\"&gt;FILTER&lt;/a&gt; допускается пустой список таблиц, который обрабатывается как пустая таблица с колонками, описанными в &lt;code&gt;SCHEMA&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"primery\"&gt;&lt;a href=\"ru/yql/syntax/select/with.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;
