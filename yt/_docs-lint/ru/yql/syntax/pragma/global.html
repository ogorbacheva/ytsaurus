        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"pragmascope\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#pragmascope\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Область действия&lt;/span&gt;&lt;/a&gt;Область действия&lt;/h2&gt;\n&lt;p&gt;Если не указано иное, глобальная прагма влияет на все идущие следом выражения вплоть до конца модуля, в котором она встречается. При необходимости и логической возможности можно менять значение настройки несколько раз в одном запросе, чтобы оно было разным на разных этапах выполнения.&lt;/p&gt;\n&lt;p&gt;Существуют также специальные scoped-прагмы, область действия которых определяется по тем же правилам, что и область видимости &lt;a href=\"ru/yql/syntax/expressions.html#named-nodes\"&gt;именованных выражений&lt;/a&gt;. Их область видимости ограничена некоторыми SQL-блоками: ACTION, SUBQUERY, лямбда.&lt;/p&gt;\n&lt;p&gt;В отличие от scoped прагм, глобальные прагмы могут использоваться только в глобальной области видимости (не внутри &lt;a href=\"ru/yql/syntax/action.html#define-action\"&gt;DEFINE ACTION&lt;/a&gt; и &lt;a href=\"ru/yql/syntax/subquery.html#define-subquery\"&gt;DEFINE SUBQUERY&lt;/a&gt;).&lt;/p&gt;\n&lt;h2 id=\"autocommit\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#autocommit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AutoCommit&lt;/span&gt;&lt;/a&gt;AutoCommit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Автоматически выполнять &lt;a href=\"ru/yql/syntax/commit.html\"&gt;COMMIT&lt;/a&gt; после каждого выражения.&lt;/p&gt;\n&lt;h2 id=\"table-path-prefix\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#table-path-prefix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TablePathPrefix&lt;/span&gt;&lt;/a&gt;TablePathPrefix&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Добавить указанный префикс к путям таблиц внутри кластеров. Работает по принципу объединения путей в файловой системе: поддерживает ссылки на родительский каталог &lt;code&gt;..&lt;/code&gt; и не требует добавления слеша справа. Например,&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;PRAGMA TablePathPrefix = \"home/yql\";\nSELECT * FROM test;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"68\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-68\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-68\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-68.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Префикс не добавляется, если имя таблицы указано как абсолютный путь (начинается с /).&lt;/p&gt;\n&lt;h2 id=\"udf\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#udf\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;UDF&lt;/span&gt;&lt;/a&gt;UDF&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка — имя префикса, добавляемого ко всем модулям&lt;/td&gt;\n&lt;td&gt;\"\"&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Импорт всех UDF из указанной библиотеки. Чтобы прагма сработала, библиотеку необходимо приложить к запросу через иконку &lt;img src=\"images/qt-ui-attach.png\" alt=\"иконка\" width=\"30\" height=\"30\" /&gt;. Обратите внимание: библиотека должна быть разделяемой (.so) и она должна быть скомпилирована под Linux x64.&lt;/p&gt;\n&lt;p&gt;При указании префикса, он добавляется перед названием всех загруженных модулей, например, CustomPrefixIp::IsIPv4 вместо Ip::IsIPv4. Указание префикса позволяет подгрузить одну и ту же UDF разных версий.&lt;/p&gt;\n&lt;h2 id=\"runtime-log-level\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#runtime-log-level\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RuntimeLogLevel&lt;/span&gt;&lt;/a&gt;RuntimeLogLevel&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка, одно из &lt;code&gt;Trace&lt;/code&gt;, &lt;code&gt;Debug&lt;/code&gt;, &lt;code&gt;Info&lt;/code&gt;, &lt;code&gt;Notice&lt;/code&gt;, &lt;code&gt;Warn&lt;/code&gt;, &lt;code&gt;Error&lt;/code&gt;, &lt;code&gt;Fatal&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Info&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Позволяет поменять уровень логирования вычислений (например, для UDF) во время выполнения запроса или на этапе декларации сигнатуры UDF.&lt;/p&gt;\n&lt;h2 id=\"use-table-prefix-for-each\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#use-table-prefix-for-each\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;UseTablePrefixForEach&lt;/span&gt;&lt;/a&gt;UseTablePrefixForEach&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;code&gt;EACH&lt;/code&gt; использует &lt;a href=\"ru/yql/syntax/pragma/global.html#table-path-prefix\"&gt;TablePathPrefix&lt;/a&gt; для каждого элемента списка.&lt;/p&gt;\n&lt;h2 id=\"warning\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#warning\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Warning&lt;/span&gt;&lt;/a&gt;Warning&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1. Действие&lt;br /&gt;2. Код предупреждения либо символ \"*\"&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Действие:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;disable&lt;/code&gt; — отключить;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;error&lt;/code&gt; — приравнять к ошибке;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;default&lt;/code&gt; — вернуть поведение по умолчанию.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Код предупреждения возвращается вместе с самим текстом (в веб-интерфейсе отображается справа).&lt;/p&gt;\n&lt;p&gt;Примеры:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;PRAGMA Warning(\"error\", \"*\");&lt;/code&gt;&lt;br /&gt;\n&lt;code&gt;PRAGMA Warning(\"disable\", \"1101\");&lt;/code&gt;&lt;br /&gt;\n&lt;code&gt;PRAGMA Warning(\"default\", \"4503\");&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;В данном случае все предупреждения будут считаться ошибками, за исключением предупреждения с кодом &lt;code&gt;1101&lt;/code&gt;, которое будет отключено, и &lt;code&gt;4503&lt;/code&gt;, которое будет обрабатываться по умолчанию (то есть останется предупреждением). Поскольку предупреждения могут добавляться в новых релизах YQL, следует с осторожностью пользоваться конструкцией &lt;code&gt;PRAGMA Warning(\"error\", \"*\");&lt;/code&gt; (как минимум покрывать такие запросы автотестами).&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/yql/essentials/core/issue/protos/issue_id.proto\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Список кодов предупреждений и ошибок&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"greetings\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#greetings\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Greetings&lt;/span&gt;&lt;/a&gt;Greetings&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Текст&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Выдать указанный текст в качестве Info сообщения запроса.&lt;/p&gt;\n&lt;p&gt;Пример: &lt;code&gt;PRAGMA Greetings(\"It's a good day!\");&lt;/code&gt;&lt;/p&gt;\n&lt;h2 id=\"warningmsg\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#warningmsg\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;WarningMsg&lt;/span&gt;&lt;/a&gt;WarningMsg&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Текст&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Выдать указанный текст в качестве Warning сообщения запроса.&lt;/p&gt;\n&lt;p&gt;Пример: &lt;code&gt;PRAGMA WarningMsg(\"Attention!\");&lt;/code&gt;&lt;/p&gt;\n&lt;h2 id=\"dqengine\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#dqengine\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DqEngine&lt;/span&gt;&lt;/a&gt;DqEngine&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка disable/auto/force&lt;/td&gt;\n&lt;td&gt;\"auto\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;При значении \"auto\" включает новый движок вычислений. Вычисления по возможности делаются без создания map/reduce операций. При значении \"force\" вычисление идёт в новый движок безусловно.&lt;/p&gt;\n&lt;h2 id=\"simplecolumns\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#simplecolumns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SimpleColumns&lt;/span&gt;&lt;/a&gt;SimpleColumns&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;SimpleColumns&lt;/code&gt; / &lt;code&gt;DisableSimpleColumns&lt;/code&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;При использовании &lt;code&gt;SELECT foo.* FROM ... AS foo&lt;/code&gt; убрать префикс  &lt;code&gt;foo.&lt;/code&gt; у имён результирующих колонок.&lt;/p&gt;\n&lt;p&gt;Работает в том числе и для &lt;a href=\"ru/yql/syntax/join.html\"&gt;JOIN&lt;/a&gt;, но в этом случае имеет право упасть в случае конфликта имён (который можно разрешить с помощью &lt;a href=\"ru/yql/syntax/select/without.html\"&gt;WITHOUT&lt;/a&gt; и переименования колонок). Для JOIN в режиме SimpleColumns производится неявный Coalesce для ключевых колонок: запрос &lt;code&gt;SELECT * FROM T1 AS a JOIN T2 AS b USING(key)&lt;/code&gt; в режиме SimpleColumns работает как &lt;code&gt;SELECT a.key ?? b.key AS key, ... FROM T1 AS a JOIN T2 AS b USING(key)&lt;/code&gt;&lt;/p&gt;\n&lt;h2 id=\"coalescejoinkeysonqualifiedall\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#coalescejoinkeysonqualifiedall\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CoalesceJoinKeysOnQualifiedAll&lt;/span&gt;&lt;/a&gt;CoalesceJoinKeysOnQualifiedAll&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;CoalesceJoinKeysOnQualifiedAll&lt;/code&gt; / &lt;code&gt;DisableCoalesceJoinKeysOnQualifiedAll&lt;/code&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Управляет неявным Coalesce для ключевых колонок &lt;code&gt;JOIN&lt;/code&gt; в режиме SimpleColumns. Если флаг установлен, то Coalesce ключевых колонок происходит при наличии хотя бы одного выражения вида &lt;code&gt;foo.*&lt;/code&gt; или &lt;code&gt;*&lt;/code&gt; в SELECT — например &lt;code&gt;SELECT a.* FROM T1 AS a JOIN T2 AS b USING(key)&lt;/code&gt;. Если флаг сброшен, то Coalesce ключей JOIN происходит только при наличии '*' после &lt;code&gt;SELECT&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"strictjoinkeytypes\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#strictjoinkeytypes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;StrictJoinKeyTypes&lt;/span&gt;&lt;/a&gt;StrictJoinKeyTypes&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;StrictJoinKeyTypes&lt;/code&gt; / &lt;code&gt;DisableStrictJoinKeyTypes&lt;/code&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Если флаг установлен, то &lt;a href=\"ru/yql/syntax/join.html\"&gt;JOIN&lt;/a&gt; будет требовать строгого совпадения типов ключей.&lt;br /&gt;\nПо умолчанию JOIN предварительно конвертирует ключи к общему типу, что может быть нежелательно с точки зрения производительности.&lt;/p&gt;\n&lt;p&gt;StrictJoinKeyTypes является &lt;a href=\"ru/yql/syntax/pragma/global.html#pragmascope\"&gt;scoped&lt;/a&gt; настройкой.&lt;/p&gt;\n&lt;h2 id=\"ansiinforemptyornullableitemscollections\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#ansiinforemptyornullableitemscollections\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AnsiInForEmptyOrNullableItemsCollections&lt;/span&gt;&lt;/a&gt;AnsiInForEmptyOrNullableItemsCollections&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Наличие этой прагмы приводит поведение оператора &lt;code&gt;IN&lt;/code&gt; в соответствие со стандартом в случае наличия &lt;code&gt;NULL&lt;/code&gt; в левой или правой части оператора &lt;code&gt;IN&lt;/code&gt;. Также изменено поведение &lt;code&gt;IN&lt;/code&gt; в случае, когда справа был Tuple с элементами разных типов. Примеры:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;1 IN (2, 3, NULL) = NULL (было Just(False))&lt;/code&gt;&lt;br /&gt;\n&lt;code&gt;NULL IN () = Just(False) (было NULL)&lt;/code&gt;&lt;br /&gt;\n&lt;code&gt;(1, null) IN ((2, 2), (3, 3)) = Just(False) (было NULL)&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Подробнее про поведение &lt;code&gt;IN&lt;/code&gt; при наличии NULL-ов в операндах можно почитать &lt;a href=\"ru/yql/syntax/expressions.html#in\"&gt;здесь&lt;/a&gt;. Явным образом выбрать старое поведение можно, указав прагму &lt;code&gt;DisableAnsiInForEmptyOrNullableItemsCollections&lt;/code&gt;. Если никакой прагмы не задано, то выдаётся предупреждение и работает старый вариант.&lt;/p&gt;\n&lt;h2 id=\"ansirankfornullablekeys\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#ansirankfornullablekeys\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AnsiRankForNullableKeys&lt;/span&gt;&lt;/a&gt;AnsiRankForNullableKeys&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Приводит поведение RANK/DENSE_RANK в соответствие со стандартом при наличии опциональных типов в ключах сортировки окна или в аргументе этих оконных функций. А именно:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;типом результата всегда является Uint64, а не Uint64?;&lt;/li&gt;\n&lt;li&gt;null-ы в ключах считаются равными друг другу (текущая реализация возвращает NULL).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Явным образом выбрать старое поведение можно, указав прагму &lt;code&gt;DisableAnsiRankForNullableKeys&lt;/code&gt;. Если никакой прагмы не задано, то выдаётся предупреждение и работает старый вариант.&lt;/p&gt;\n&lt;h2 id=\"ansicurrentrow\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#ansicurrentrow\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AnsiCurrentRow&lt;/span&gt;&lt;/a&gt;AnsiCurrentRow&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Приводит неявное задание рамки окна при наличии &lt;a href=\"ru/yql/syntax/select/order_by.html\"&gt;ORDER BY&lt;/a&gt; в соответствие со стандартом.&lt;/p&gt;\n&lt;p&gt;Если AnsiCurrentRow не установлен, то окно &lt;code&gt;(ORDER BY key)&lt;/code&gt; эквивалентно &lt;code&gt;(ORDER BY key ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)&lt;/code&gt;. Стандарт же требует, чтобы такое окно вело себя как &lt;code&gt;(ORDER BY key RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Разница состоит в трактовке &lt;code&gt;CURRENT ROW&lt;/code&gt;. В режиме &lt;code&gt;ROWS&lt;/code&gt; &lt;code&gt;CURRENT ROW&lt;/code&gt; трактуется буквально – текущая строка в партиции.&lt;br /&gt;\nА в режиме &lt;code&gt;RANGE&lt;/code&gt; конец рамки &lt;code&gt;CURRENT ROW&lt;/code&gt; означает \"последняя строка в партиции с ключом сортировки, равным текущей строке\".&lt;/p&gt;\n&lt;h2 id=\"orderedcolumns\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#orderedcolumns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;OrderedColumns&lt;/span&gt;&lt;/a&gt;OrderedColumns&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;OrderedColumns&lt;/code&gt; / &lt;code&gt;DisableOrderedColumns&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Выводить &lt;a href=\"ru/yql/syntax/select/index.html#orderedcolumns\"&gt;порядок колонок&lt;/a&gt; в &lt;code&gt;SELECT&lt;/code&gt; / &lt;code&gt;JOIN&lt;/code&gt; / &lt;code&gt;UNION [ALL]&lt;/code&gt; / &lt;code&gt;INTERSECT [ALL]&lt;/code&gt; / &lt;code&gt;EXCEPT [ALL]&lt;/code&gt; и сохранять его при записи результатов. По умолчанию порядок колонок не определен.&lt;/p&gt;\n&lt;h2 id=\"positionalunionall\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#positionalunionall\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PositionalUnionAll&lt;/span&gt;&lt;/a&gt;PositionalUnionAll&lt;/h2&gt;\n&lt;p&gt;Включить соответствующий стандарту поколоночный режим выполнения &lt;a href=\"ru/yql/syntax/select/operators.html#union\"&gt;UNION [ALL]&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/select/operators.html#intersect\"&gt;INTERSECT [ALL]&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/select/operators.html#except\"&gt;EXCEPT [ALL]&lt;/a&gt;. При этом автоматически включается &lt;a href=\"ru/yql/syntax/pragma/global.html#orderedcolumns\"&gt;упорядоченность колонок&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"regexusere2\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#regexusere2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RegexUseRe2&lt;/span&gt;&lt;/a&gt;RegexUseRe2&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Использовать Re2 UDF вместо Pcre для выполнения SQL операторов &lt;code&gt;REGEX&lt;/code&gt;,&lt;code&gt;MATCH&lt;/code&gt;,&lt;code&gt;RLIKE&lt;/code&gt;. Re2 UDF поддерживает корректную обработку Unicode-символов в отличие от используемой по умолчанию Pcre UDF.&lt;/p&gt;\n&lt;h2 id=\"classicdivision\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#classicdivision\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ClassicDivision&lt;/span&gt;&lt;/a&gt;ClassicDivision&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;В классическом варианте результат целочисленного деления остаётся целочисленным (по умолчанию). Если отключить — результат всегда становится Double.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;ClassicDivision&lt;/code&gt; является &lt;a href=\"ru/yql/syntax/pragma/global.html#pragmascope\"&gt;scoped&lt;/a&gt; настройкой.&lt;/p&gt;\n&lt;h2 id=\"checkedops\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#checkedops\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CheckedOps&lt;/span&gt;&lt;/a&gt;CheckedOps&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;При включённом режиме: если в результате выполнения агрегационных функций SUM/SUM_IF, бинарных операций &lt;code&gt;+&lt;/code&gt;,&lt;code&gt;-&lt;/code&gt;,&lt;code&gt;*&lt;/code&gt;,&lt;code&gt;/&lt;/code&gt;,&lt;code&gt;%&lt;/code&gt; или унарной операции &lt;code&gt;-&lt;/code&gt; над целыми числами происходит выход за границы целевого типа аргументов или результата, то возвращается &lt;code&gt;NULL&lt;/code&gt;. Если отключить — переполнение не проверяется.&lt;/p&gt;\n&lt;p&gt;Не влияет на операции с числами с  плавающей точкой или &lt;code&gt;Decimal&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;CheckedOps&lt;/code&gt; является &lt;a href=\"ru/yql/syntax/pragma/global.html#pragmascope\"&gt;scoped&lt;/a&gt; настройкой.&lt;/p&gt;\n&lt;h2 id=\"unicodeliterals\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#unicodeliterals\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;UnicodeLiterals&lt;/span&gt;&lt;/a&gt;UnicodeLiterals&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;UnicodeLiterals&lt;/code&gt;/&lt;code&gt;DisableUnicodeLiterals&lt;/code&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;При включённом режиме строковые литералы без суффиксов вида \"foo\"/'bar'/@@multiline@@ будут иметь тип &lt;code&gt;Utf8&lt;/code&gt;, при выключенном — &lt;code&gt;String&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;UnicodeLiterals&lt;/code&gt; является &lt;a href=\"ru/yql/syntax/pragma/global.html#pragmascope\"&gt;scoped&lt;/a&gt; настройкой.&lt;/p&gt;\n&lt;h2 id=\"warnuntypedstringliterals\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#warnuntypedstringliterals\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;WarnUntypedStringLiterals&lt;/span&gt;&lt;/a&gt;WarnUntypedStringLiterals&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;WarnUntypedStringLiterals&lt;/code&gt;/&lt;code&gt;DisableWarnUntypedStringLiterals&lt;/code&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;При включённом режиме для строковых литералов без суффиксов вида \"foo\"/'bar'/@@multiline@@ будет генерироваться предупреждение. Его можно подавить, если явно выбрать суффикс &lt;code&gt;s&lt;/code&gt; для типа &lt;code&gt;String&lt;/code&gt;, либо &lt;code&gt;u&lt;/code&gt; для типа &lt;code&gt;Utf8&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;WarnUntypedStringLiterals&lt;/code&gt; является &lt;a href=\"ru/yql/syntax/pragma/global.html#pragmascope\"&gt;scoped&lt;/a&gt; настройкой.&lt;/p&gt;\n&lt;h2 id=\"allowdotinalias\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#allowdotinalias\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AllowDotInAlias&lt;/span&gt;&lt;/a&gt;AllowDotInAlias&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Разрешить использовать точку в именах результирующих колонок. По умолчанию отключено, т. к. дальнейшее использование таких колонок в JOIN полностью не реализовано.&lt;/p&gt;\n&lt;h2 id=\"warnunnamedcolumns\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#warnunnamedcolumns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;WarnUnnamedColumns&lt;/span&gt;&lt;/a&gt;WarnUnnamedColumns&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Генерировать предупреждение, если для безымянного выражения в &lt;code&gt;SELECT&lt;/code&gt; было автоматически сгенерировано имя колонки (вида &lt;code&gt;column[0-9]+&lt;/code&gt;).&lt;/p&gt;\n&lt;h2 id=\"groupbylimit\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#groupbylimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GroupByLimit&lt;/span&gt;&lt;/a&gt;GroupByLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Положительное число&lt;/td&gt;\n&lt;td&gt;32&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Увеличение лимита на число группировок в &lt;a href=\"ru/yql/syntax/group_by.html\"&gt;GROUP BY&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"groupbycubelimit\"&gt;&lt;a href=\"ru/yql/syntax/pragma/global.html#groupbycubelimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GroupByCubeLimit&lt;/span&gt;&lt;/a&gt;GroupByCubeLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Положительное число&lt;/td&gt;\n&lt;td&gt;5&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Увеличение лимита на число размерностей &lt;a href=\"ru/yql/syntax/group_by.html#rollup-cube-group-sets\"&gt;GROUP BY&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Использовать нужно аккуратно, так как вычислительная сложность запроса растёт экспоненциально по отношению к числу размерностей.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/syntax/pragma/global.md","sourcePath":"ru/yql/syntax/pragma/global.md"},"headings":[{"title":"Область действия","href":"ru/yql/syntax/pragma/global.html#pragmascope","level":2},{"title":"AutoCommit","href":"ru/yql/syntax/pragma/global.html#autocommit","level":2},{"title":"TablePathPrefix","href":"ru/yql/syntax/pragma/global.html#table-path-prefix","level":2},{"title":"UDF","href":"ru/yql/syntax/pragma/global.html#udf","level":2},{"title":"RuntimeLogLevel","href":"ru/yql/syntax/pragma/global.html#runtime-log-level","level":2},{"title":"UseTablePrefixForEach","href":"ru/yql/syntax/pragma/global.html#use-table-prefix-for-each","level":2},{"title":"Warning","href":"ru/yql/syntax/pragma/global.html#warning","level":2},{"title":"Greetings","href":"ru/yql/syntax/pragma/global.html#greetings","level":2},{"title":"WarningMsg","href":"ru/yql/syntax/pragma/global.html#warningmsg","level":2},{"title":"DqEngine","href":"ru/yql/syntax/pragma/global.html#dqengine","level":2},{"title":"SimpleColumns","href":"ru/yql/syntax/pragma/global.html#
