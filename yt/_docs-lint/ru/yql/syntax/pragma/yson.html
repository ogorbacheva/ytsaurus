        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Управление поведением Yson UDF по умолчанию, подробнее см. в &lt;a href=\"ru/yql/udf/list/yson.html\"&gt;документации&lt;/a&gt; и в частности &lt;a href=\"ru/yql/udf/list/yson.html#ysonoptions\"&gt;Yson::Options&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Yson-прагма влияет на все идущие следом выражения вплоть до конца модуля, в котором она встречается.&lt;/p&gt;\n&lt;h2 id=\"ysonautoconvert\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yson.html#ysonautoconvert\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yson.AutoConvert&lt;/span&gt;&lt;/a&gt;yson.AutoConvert&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Автоматическая конвертация значений в требуемый тип данных во всех вызовах Yson UDF, в том числе и неявных.&lt;/p&gt;\n&lt;h2 id=\"ysonstrict\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yson.html#ysonstrict\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yson.Strict&lt;/span&gt;&lt;/a&gt;yson.Strict&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Управление строгим режимом во всех вызовах Yson UDF, в том числе и неявных. Без значения или при значении &lt;code&gt;\"true\"&lt;/code&gt; — включает строгий режим. Со значением &lt;code&gt;\"false\"&lt;/code&gt; — отключает.&lt;/p&gt;\n&lt;h2 id=\"ysondisablestrict\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yson.html#ysondisablestrict\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yson.DisableStrict&lt;/span&gt;&lt;/a&gt;yson.DisableStrict&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Инвертированная версия &lt;code&gt;yson.Strict&lt;/code&gt;. Без значения или при значении &lt;code&gt;\"true\"&lt;/code&gt; — отключает строгий режим. Со значением &lt;code&gt;\"false\"&lt;/code&gt; — включает.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/syntax/pragma/yson.md","sourcePath":"ru/yql/syntax/pragma/yson.md"},"headings":[{"title":"yson.AutoConvert","href":"ru/yql/syntax/pragma/yson.html#ysonautoconvert","level":2},{"title":"yson.Strict","href":"ru/yql/syntax/pragma/yson.html#ysonstrict","level":2},{"title":"yson.DisableStrict","href":"ru/yql/syntax/pragma/yson.html#ysondisablestrict","level":2}],"title":"Yson"},"router":{"pathname":"ru/yql/syntax/pragma/yson","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
