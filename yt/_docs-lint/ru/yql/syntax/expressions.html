;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$f = ($y) -&amp;gt; {\n    $prefix = \"x\";\n    RETURN $prefix || $y;\n};\n\n$g = ($y) -&amp;gt; (\"x\" || $y);\n\n$h = ($x, $y?) -&amp;gt; ($x + ($y ?? 0));\n\nSELECT $f(\"y\"), $g(\"z\"), $h(1), $h(2, 3); -- \"xy\", \"xz\", 1, 5\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"711\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-711\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-711\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-711.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;-- если результат лямбды вычисляется единственным выражением, то можно использовать более компактный вариант синтаксиса:\n$f = ($x, $_) -&amp;gt; ($x || \"suffix\"); -- второй аргумент не используется\nSELECT $f(\"prefix_\", \"whatever\");\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"712\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-712\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-712\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-712.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"items-access\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#items-access\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обращение к контейнерам&lt;/span&gt;&lt;/a&gt;Обращение к контейнерам&lt;/h2&gt;\n&lt;p&gt;Для адресации к значениям внутри контейнеров:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Struct&amp;lt;&amp;gt;&lt;/code&gt;, &lt;code&gt;Tuple&amp;lt;&amp;gt;&lt;/code&gt; и &lt;code&gt;Variant&amp;lt;&amp;gt;&lt;/code&gt; — используется &lt;strong&gt;точка&lt;/strong&gt;. Набор ключей (для кортежа и соответствующего варианта — индексов) известен в момент компиляции запроса. Валидность ключа &lt;strong&gt;проверяется&lt;/strong&gt; до начала выполнения запроса.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;List&amp;lt;&amp;gt;&lt;/code&gt; и &lt;code&gt;Dict&amp;lt;&amp;gt;&lt;/code&gt; — используются &lt;strong&gt;квадратные скобки&lt;/strong&gt;. Набор ключей (для списка — индексов) известен только во время выполнения запроса. Валидность ключа &lt;strong&gt;не проверяется&lt;/strong&gt; до начала выполнения запроса. Если значение не найдено — будет возвращено пустое значение (NULL)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;a href=\"ru/yql/types/containers.html\"&gt;Описание и список доступных контейнеров&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;При использовании этого синтаксиса для обращения к контейнерам в столбцах таблиц обязательно нужно указывать полное имя столбца, включая имя или алиас таблицы через точку (см. первый пример ниже).&lt;/p&gt;\n&lt;h4 id=\"primery15\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#primery15\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  t.struct.member,\n  t.tuple.7,\n  t.dict[\"key\"],\n  t.list[7]\nFROM my_table AS t;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"740\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-740\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-740\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-740.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  Sample::ReturnsStruct().member;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"741\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-741\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-741\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-741.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"style":["_bundle/latex-extension.css"],"script":["_bundle/latex-extension.js"],"vcsPath":"ru/yql/syntax/expressions.md","sourcePath":"ru/yql/syntax/expressions.md"},"headings":[{"title":"Конкатенация строк","href":"ru/yql/syntax/expressions.html#concatenation","level":2},{"title":"Проверка строки на соответствие шаблону","href":"ru/yql/syntax/expressions.html#check-match","level":2},{"title":"Операторы","href":"ru/yql/syntax/expressions.html#operatory","level":2,"items":[{"title":"Арифметические операторы","href":"ru/yql/syntax/expressions.html#math-operators","level":3,"items":[{"title":"Примеры","href":"ru/yql/syntax/expressions.html#primery2","level":4}]},{"title":"Операторы сравнения","href":"ru/yql/syntax/expressions.html#comparison-operators","level":3,"items":[{"title":"Примеры","href":"ru/yql/syntax/expressions.html#primery3","level":4}]},{"title":"Логические операторы","href":"ru/yql/syntax/expressions.html#logic-operators","level":3,"items":[{"title":"Примеры","href":"ru/yql/syntax/expressions.html#primery4","level":4}]},{"title":"Битовые операторы","href":"ru/yql/syntax/expressions.html#bit-operators","level":3,"items":[{"title":"Примеры","href":"ru/yql/syntax/expressions.html#primery5","level":4}]},{"title":"Приоритет и ассоциативность операторов","href":"ru/yql/syntax/expressions.html#operator-priority","level":3}]},{"title":"IS [NOT]NULL","href":"ru/yql/syntax/expressions.html#is-null","level":2},{"title":"IS [NOT]DISTINCT FROM","href":"ru/yql/syntax/expressions.html#is-distinct-from","level":2},{"title":"BETWEEN","href":"ru/yql/syntax/expressions.html#between","level":2},{"title":"IN","href":"ru/yql/syntax/expressions.html#in","level":2},{"title":"AS","href":"ru/yql/syntax/expressions.html#as","level":2},{"title":"CAST","href":"ru/yql/syntax/expressions.html#cast","level":2},{"title":"BITCAST","href":"ru/yql/syntax/expressions.html#bitcast","level":2},{"title":"CASE","href":"ru/yql/syntax/expressions.html#case","level":2},{"title":"Именованные выражения","href":"ru/yql/syntax/expressions.html#named-nodes","level":2},{"title":"Табличные выражения","href":"ru/yql/syntax/expressions.html#table-contexts","level":2},{"title":"Lambda функции","href":"ru/yql/syntax/expressions.html#lambda","level":2},{"title":"Обращение к контейнерам","href":"ru/yql/syntax/expressions.html#items-access","level":2}],"title":"Выражения"},"router":{"pathname":"ru/yql/syntax/expressions","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
