        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"concatenation\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#concatenation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конкатенация строк&lt;/span&gt;&lt;/a&gt;Конкатенация строк&lt;/h2&gt;\n&lt;p&gt;Выполняется через бинарный оператор &lt;code&gt;||&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Как и у других бинарных операторов, если в данных с одной из сторон оказался &lt;code&gt;NULL&lt;/code&gt;, то и результат будет &lt;code&gt;NULL&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Не следует путать этот оператор с логическим «или», в SQL оно обозначается ключевым словом &lt;code&gt;OR&lt;/code&gt;. Также не стоит пытаться делать конкатенацию через &lt;code&gt;+&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"primery\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT \"fo\" || \"o\";\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"15\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-15\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-15\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-15.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"check-match\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#check-match\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Проверка строки на соответствие шаблону&lt;/span&gt;&lt;/a&gt;Проверка строки на соответствие шаблону&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;REGEXP&lt;/code&gt; и &lt;code&gt;RLIKE&lt;/code&gt; являются алиасами и представляют собой короткий способ записи для вызова &lt;a href=\"ru/yql/udf/list/re2.html#match\"&gt;Re2::Grep&lt;/a&gt;. &lt;code&gt;MATCH&lt;/code&gt; — аналогично для &lt;a href=\"ru/yql/udf/list/re2.html#match\"&gt;Re2::Match&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;LIKE&lt;/code&gt; работает по следующим принципам:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;В шаблонах используется два спецсимвола:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;%&lt;/code&gt; — ноль и более любых символов;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;_&lt;/code&gt; — ровно один любой символ.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Все остальные символы выступают как литералы, то есть обозначают сами себя.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;В отличие от &lt;code&gt;REGEXP&lt;/code&gt;, с шаблоном &lt;code&gt;LIKE&lt;/code&gt; строка должна совпасть полностью. Например, для поиска подстроки в середине нужно добавить &lt;code&gt;%&lt;/code&gt; в начале и в конце шаблона.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;ILIKE&lt;/code&gt; является не чувствительной к регистру версией &lt;code&gt;LIKE&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Если &lt;code&gt;LIKE&lt;/code&gt; применяется к ключевой колонке сортированной таблицы и шаблон начинается не со спецсимвола, то фильтрация по префиксу опускается прямо до кластера, что в некоторых случаях позволяет не сканировать всю таблицу целиком. Для &lt;code&gt;ILIKE&lt;/code&gt; данная оптимизация отключена.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Чтобы заэкранировать спецсимволы, необходимо после шаблона указать символ для экранирования с помощью ключевого слова &lt;code&gt;ESCAPE '?'&lt;/code&gt;. Вместо &lt;code&gt;?&lt;/code&gt; можно использовать любой символ, кроме &lt;code&gt;%&lt;/code&gt;, &lt;code&gt;_&lt;/code&gt; и &lt;code&gt;\\&lt;/code&gt;. Например, если в качестве экранирующего символа используется знак вопроса, то выражения &lt;code&gt;?%&lt;/code&gt;, &lt;code&gt;?_&lt;/code&gt; и &lt;code&gt;??&lt;/code&gt; в шаблоне совпадут со своим вторым символом: процент, подчеркивание и знак вопроса, соответственно. По умолчанию экранирующий символ не определен.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Наиболее популярный способ использования ключевых слов &lt;code&gt;LIKE&lt;/code&gt; и &lt;code&gt;REGEXP&lt;/code&gt; — фильтрация таблицы в выражениях с &lt;code&gt;WHERE&lt;/code&gt;. Однако ограничения на использование шаблонов именно в этом контексте нет, и их можно использовать в большинстве контекстов при работе со строками, наравне, например, с конкатенацией с помощью &lt;code&gt;||&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"primery1\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#primery1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT * FROM my_table\nWHERE string_column REGEXP '\\\\d+';\n-- второй слеш нужен, так как все\n-- стандартные строковые литералы в SQL\n-- могут принимать С-escaped строки\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"73\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-73\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-73\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-73.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    string_column LIKE '___!_!_!_!!!!!!' ESCAPE '!'\n    -- ищет строку из ровно 9 символов:\n    --   3 произвольных,\n    --   затем 3 подчеркивания\n    --   и 3 восклицательных знака\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"74\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-74\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-74\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-74.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT * FROM my_table\nWHERE key LIKE 'foo%bar';\n-- при наличии сортировки таблицы по key просканирует только ключи,\n-- начинающиеся на foo, и затем среди них\n-- оставит только заканчивающиеся на bar\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"75\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-75\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-75\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-75.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"operatory\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#operatory\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Операторы&lt;/span&gt;&lt;/a&gt;Операторы&lt;/h2&gt;\n&lt;h3 id=\"math-operators\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#math-operators\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Арифметические операторы&lt;/span&gt;&lt;/a&gt;Арифметические операторы&lt;/h3&gt;\n&lt;p&gt;Операторы &lt;code&gt;+&lt;/code&gt;, &lt;code&gt;-&lt;/code&gt;, &lt;code&gt;*&lt;/code&gt;, &lt;code&gt;/&lt;/code&gt;, &lt;code&gt;%&lt;/code&gt; определены для &lt;a href=\"ru/yql/types/primitive.html\"&gt;примитивных типов данных&lt;/a&gt;, являющихся разновидностями чисел.&lt;/p&gt;\n&lt;p&gt;Для типа данных Decimal используется банковское округление (до ближайшего четного).&lt;/p&gt;\n&lt;h4 id=\"primery2\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#primery2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT 2 + 2;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"91\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-91\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-91\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-91.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT 0.0 / 0.0;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"92\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-92\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-92\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-92.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"comparison-operators\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#comparison-operators\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Операторы сравнения&lt;/span&gt;&lt;/a&gt;Операторы сравнения&lt;/h3&gt;\n&lt;p&gt;Операторы &lt;code&gt;=&lt;/code&gt;, &lt;code&gt;==&lt;/code&gt;, &lt;code&gt;!=&lt;/code&gt;, &lt;code&gt;&amp;lt;&amp;gt;&lt;/code&gt;, &lt;code&gt;&amp;gt;&lt;/code&gt;, &lt;code&gt;&amp;lt;&lt;/code&gt; определены для:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Примитивных типов данных за исключением Yson и Json.&lt;/li&gt;\n&lt;li&gt;Кортежей и структур с одинаковым набором полей. Для структур не определен порядок, но можно проверять на (не-)равенство, а кортежи сравниваются поэлементно слева направо.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery3\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#primery3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT 2 &amp;gt; 1;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"114\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-114\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-114\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-114.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"logic-operators\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#logic-operators\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Логические операторы&lt;/span&gt;&lt;/a&gt;Логические операторы&lt;/h3&gt;\n&lt;p&gt;С помощью операторов &lt;code&gt;AND&lt;/code&gt;, &lt;code&gt;OR&lt;/code&gt;, &lt;code&gt;XOR&lt;/code&gt; осуществляются логические операции над булевыми значениями (&lt;code&gt;Bool&lt;/code&gt;).&lt;/p&gt;\n&lt;h4 id=\"primery4\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#primery4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT 3 &amp;gt; 0 AND false;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"124\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-124\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-124\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-124.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"bit-operators\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#bit-operators\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Битовые операторы&lt;/span&gt;&lt;/a&gt;Битовые операторы&lt;/h3&gt;\n&lt;p&gt;Битовые операции над числами:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;&amp;amp;&lt;/code&gt;, &lt;code&gt;|&lt;/code&gt;, &lt;code&gt;^&lt;/code&gt; — AND, OR и XOR соответственно. Не следует путать битовые операции с аналогичными ключевыми словами. Ключевые слова &lt;code&gt;AND&lt;/code&gt;, &lt;code&gt;OR&lt;/code&gt; и &lt;code&gt;XOR&lt;/code&gt; используются &lt;em&gt;только для булевых значений&lt;/em&gt;, но не для чисел;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;~&lt;/code&gt; — отрицание;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;&amp;lt;&lt;/code&gt;, &lt;code&gt;&amp;gt;&amp;gt;&lt;/code&gt; — сдвиги влево-вправо;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;|&amp;lt;&amp;lt;&lt;/code&gt;, &lt;code&gt;&amp;gt;&amp;gt;|&lt;/code&gt; — кольцевые сдвиги влево-вправо.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery5\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#primery5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    key &amp;lt;&amp;lt; 10 AS key,\n    ~value AS value\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"156\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-156\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-156\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-156.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"operator-priority\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#operator-priority\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Приоритет и ассоциативность операторов&lt;/span&gt;&lt;/a&gt;Приоритет и ассоциативность операторов&lt;/h3&gt;\n&lt;p&gt;Приоритет оператора определяет порядок вычисления выражения содержащего разные операторы.&lt;br /&gt;\nНапример, выражение &lt;code&gt;1 + 2 * 3&lt;/code&gt; вычисляется как &lt;code&gt;1 + (2 * 3)&lt;/code&gt;,&lt;br /&gt;\nпоскольку приоритет оператора умножения больше приоритета оператора сложения.&lt;/p&gt;\n&lt;p&gt;Ассоциативность определяет порядок вычисления в выражениях содержащих операторы одного типа.&lt;br /&gt;\nНапример, выражение &lt;code&gt;1 + 2 + 3&lt;/code&gt; вычисляется как &lt;code&gt;(1 + 2) + 3&lt;/code&gt;, поскольку оператор сложения является лево-ассоциативным.&lt;br /&gt;\nС другой стороны, выражение &lt;code&gt;a ?? b ?? c&lt;/code&gt; вычисляется как &lt;code&gt;a ?? (b ?? c)&lt;/code&gt; из-за право-ассоциативности оператора &lt;code&gt;??&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;В таблице ниже указаны приоритет и ассоциативность операторов языка YQL.&lt;br /&gt;\nОператоры в таблице перечислены в порядке убывания приоритета.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Приоритет&lt;/th&gt;\n&lt;th&gt;Оператор&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;th&gt;Ассоциативность&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;a[], a.foo, a()&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Обращение к элементу контейнера, вызов функции&lt;/td&gt;\n&lt;td&gt;Левая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;+a, -a, ~a, NOT a&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Унарные операторы: плюс, минус, битовое и логическое отрицание&lt;/td&gt;\n&lt;td&gt;Правая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;a||b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/yql/syntax/expressions.html#concatenation\"&gt;Конкатенация строк&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;Левая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;4&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;a*b, a/b, a%b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Умножение,деление, остаток от деления&lt;/td&gt;\n&lt;td&gt;Левая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;5&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;a+b, a-b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Сложение / вычитание&lt;/td&gt;\n&lt;td&gt;Левая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;6&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;a ?? b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Операторная форма записи &lt;a href=\"ru/yql/builtins/basic.html#coalesce\"&gt;NVL/COALESCE&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;Правая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;7&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;a&amp;lt;&amp;lt;b, a&amp;gt;&amp;gt;b, a|&amp;lt;&amp;lt;b, a&amp;gt;&amp;gt;|b,&lt;/code&gt; &lt;code&gt;a|b, a^b, a&amp;amp;b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Сдвиговые и логические битовые операторы&lt;/td&gt;\n&lt;td&gt;Левая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;8&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;a&amp;lt;b, a&amp;lt;=b, a&amp;gt;=b, a&amp;gt;b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Сравнение&lt;/td&gt;\n&lt;td&gt;Левая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;9&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;a IN b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Вхождение элемента в множество&lt;/td&gt;\n&lt;td&gt;Левая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;9&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;a==b, a=b, a!=b, a&amp;lt;&amp;gt;b,&lt;/code&gt; &lt;code&gt;a is (not) distinct from b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Сравнение на (не)равенство&lt;/td&gt;\n&lt;td&gt;Левая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;10&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;a XOR b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Логическое XOR&lt;/td&gt;\n&lt;td&gt;Левая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;11&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;a AND b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Логическое AND&lt;/td&gt;\n&lt;td&gt;Левая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;12&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;a OR b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Логическое OR&lt;/td&gt;\n&lt;td&gt;Левая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"is-null\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#is-null\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;IS NOT NULL&lt;/span&gt;&lt;/a&gt;IS [NOT]NULL&lt;/h2&gt;\n&lt;p&gt;Проверка на пустое значение (&lt;code&gt;NULL&lt;/code&gt;). Так как &lt;code&gt;NULL&lt;/code&gt; является особым значением, которое &lt;a href=\"ru/yql/types/optional.html#null_expr\"&gt;ничему не равно&lt;/a&gt;, то обычные &lt;a href=\"ru/yql/syntax/expressions.html#comparison-operators\"&gt;операторы сравнения&lt;/a&gt; для этой задачи не подходят.&lt;/p&gt;\n&lt;h4 id=\"primery6\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#primery6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT key FROM my_table\nWHERE value IS NOT NULL;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"380\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-380\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-380\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-380.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"is-distinct-from\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#is-distinct-from\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;IS NOT DISTINCT FROM&lt;/span&gt;&lt;/a&gt;IS [NOT]DISTINCT FROM&lt;/h2&gt;\n&lt;p&gt;Сравнение двух значений. В отличие от обычных &lt;a href=\"ru/yql/syntax/expressions.html#comparison-operators\"&gt;операторов сравнения&lt;/a&gt;, &lt;code&gt;NULL&lt;/code&gt;-значения считаются равными друг другу.&lt;/p&gt;\n&lt;p&gt;Сравнение осуществляется по следующим правилам:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Операторы &lt;code&gt;IS DISTINCT FROM&lt;/code&gt;/&lt;code&gt;IS NOT DISTINCT FROM&lt;/code&gt; определены для тех и только для тех аргументов, для которых определены операторы &lt;code&gt;!=&lt;/code&gt; и &lt;code&gt;=&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Результат &lt;code&gt;IS NOT DISTINCT FROM&lt;/code&gt; равен логическому отрицанию результата &lt;code&gt;IS DISTINCT FROM&lt;/code&gt; для данных аргументов.&lt;/li&gt;\n&lt;li&gt;Если результат оператора &lt;code&gt;==&lt;/code&gt; не равен &lt;code&gt;NULL&lt;/code&gt; для некоторых аргументов, то он совпадает с результатом оператора &lt;code&gt;IS NOT DISTINCT FROM&lt;/code&gt; для тех же аргументов.&lt;/li&gt;\n&lt;li&gt;Если оба аргумента являются незаполненными &lt;code&gt;Optional&lt;/code&gt; или &lt;code&gt;NULL&lt;/code&gt;, то значение &lt;code&gt;IS NOT DISTINCT FROM&lt;/code&gt; равно &lt;code&gt;True&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Результат &lt;code&gt;IS NOT DISTINCT FROM&lt;/code&gt; от незаполненного &lt;code&gt;Optional&lt;/code&gt; или &lt;code&gt;NULL&lt;/code&gt; и заполненного &lt;code&gt;Optional&lt;/code&gt; или не-&lt;code&gt;Optional&lt;/code&gt; значения равен &lt;code&gt;False&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Для значений композитных типов эти правила применяются рекурсивно.&lt;/p&gt;\n&lt;h2 id=\"between\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#between\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BETWEEN&lt;/span&gt;&lt;/a&gt;BETWEEN&lt;/h2&gt;\n&lt;p&gt;Проверка на вхождение значения в диапазон. Cинтаксис: &lt;code&gt;expr [NOT] BETWEEN [ASYMMETRIC | SYMMETRIC] expr AND expr&lt;/code&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;BETWEEN&lt;/code&gt; и &lt;code&gt;BETWEEN ASYMMETRIC&lt;/code&gt; эквивалентны, &lt;code&gt;x BETWEEN a AND b&lt;/code&gt; эквивалентно &lt;code&gt;a &amp;lt;= x AND x &amp;lt;= b&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;BETWEEN SYMMETRIC&lt;/code&gt; автоматически переставляет аргументы местами так чтобы диапазон получился непустым,&lt;br /&gt;\n&lt;code&gt;x BETWEEN SYMMETRIC a AND b&lt;/code&gt; эквивалентно &lt;code&gt;(x BETWEEN a AND b) OR (x BETWEEN b AND a)&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;NOT&lt;/code&gt; инвертирует результат проверки.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery7\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#primery7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT * FROM my_table\nWHERE key BETWEEN 10 AND 20;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"446\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-446\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-446\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-446.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT * FROM my_table\nWHERE key NOT BETWEEN SYMMETRIC 20 AND 10;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"447\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-447\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-447\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-447.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"in\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#in\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;IN&lt;/span&gt;&lt;/a&gt;IN&lt;/h2&gt;\n&lt;p&gt;Проверка вхождения одного значения в набор значений. Логически эквивалентно цепочке сравнений на равенство через &lt;code&gt;OR&lt;/code&gt;, но реализовано более эффективно.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В отличие от аналогичного ключевого слова в Python, в YQL &lt;code&gt;IN&lt;/code&gt; &lt;strong&gt;НЕ&lt;/strong&gt; является поиском подстроки в строке. Для поиска подстроки можно использовать функцию &lt;a href=\"ru/yql/udf/list/string.html\"&gt;String::Contains&lt;/a&gt; или описанные выше &lt;a href=\"ru/yql/syntax/expressions.html#check-match\"&gt;LIKE / REGEXP&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сразу после &lt;code&gt;IN&lt;/code&gt; можно указать &lt;a href=\"ru/yql/syntax/lexer.html#sql-hints\"&gt;хинт&lt;/a&gt; &lt;code&gt;COMPACT&lt;/code&gt;.&lt;br /&gt;\nЕсли &lt;code&gt;COMPACT&lt;/code&gt; не указан, то &lt;code&gt;IN&lt;/code&gt; с подзапросом по возможности выполняется как соответствующий &lt;code&gt;JOIN&lt;/code&gt; (&lt;code&gt;LEFT SEMI&lt;/code&gt; для &lt;code&gt;IN&lt;/code&gt; и &lt;code&gt;LEFT ONLY&lt;/code&gt; для &lt;code&gt;NOT IN&lt;/code&gt;).&lt;br /&gt;\nНаличие &lt;code&gt;COMPACT&lt;/code&gt; форсирует in-memory стратегию выполнения: из содержимого правой части &lt;code&gt;IN&lt;/code&gt; в памяти сразу строится хеш-таблица, по которой затем фильтруется левая часть.&lt;/p&gt;\n&lt;p&gt;Хинтом &lt;code&gt;COMPACT&lt;/code&gt; следует пользоваться с осторожностью. Поскольку хеш-таблица строится в памяти, то запрос может завершиться с ошибкой, если правая часть &lt;code&gt;IN&lt;/code&gt; содержит много больших и/или различных элементов.&lt;/p&gt;\n&lt;p&gt;Так как в YQL есть лимит на размер запроса в байтах (порядка 1Мб), для больших списков значений нужно прикладывать их к запросу через URL и использовать функцию &lt;a href=\"ru/yql/builtins/basic.html#parsefile\"&gt;ParseFile&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"primery8\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#primery8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT column IN (1, 2, 3)\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"476\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-476\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-476\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-476.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT * FROM my_table\nWHERE string_column IN (\"a\", \"b\", \"c\");\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"477\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-477\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-477\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-477.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$foo = AsList(1, 2, 3);\nSELECT 1 IN $foo;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"478\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-478\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-478\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-478.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$values = (SELECT column + 1 FROM table);\nSELECT * FROM my_table WHERE\n    -- фильтрация по in-memory хеш-таблице на основе table\n    column1 IN /*+ COMPACT() */ $values AND\n    -- с последующим LEFT ONLY JOIN с other_table\n    column2 NOT IN (SELECT other_column FROM other_table);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"479\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-479\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-479\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-479.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"as\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#as\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AS&lt;/span&gt;&lt;/a&gt;AS&lt;/h2&gt;\n&lt;p&gt;Может использоваться в следующих сценариях:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Присвоение короткого имени (алиаса) столбцам или таблицам в рамках запроса.&lt;/li&gt;\n&lt;li&gt;Указание именованных аргументов при вызове функций.&lt;/li&gt;\n&lt;li&gt;При явном приведении типов данных для указания целевого типа, см. &lt;a href=\"ru/yql/syntax/expressions.html#cast\"&gt;CAST&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery9\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#primery9\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT key AS k FROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"506\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-506\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-506\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-506.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT t.key FROM my_table AS t;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"507\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-507\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-507\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-507.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    MyFunction(key, 123 AS my_optional_arg)\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"508\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-508\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-508\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-508.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"cast\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#cast\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CAST&lt;/span&gt;&lt;/a&gt;CAST&lt;/h2&gt;\n&lt;p&gt;Пробует привести значение к указанному типу. Попытка может оказаться неуспешной и вернуть &lt;code&gt;NULL&lt;/code&gt;. Для чисел может потерять точность или старшие биты.&lt;/p&gt;\n&lt;p&gt;Для списков и словарей может либо удалить, либо заменить на &lt;code&gt;NULL&lt;/code&gt; элементы, преобразование которых неудачно.&lt;br /&gt;\nДля структур и кортежей удаляет элементы, которых нет в целевом типе. Подробнее правила преобразований описаны &lt;a href=\"ru/yql/types/cast.html\"&gt;здесь&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Для параметрического типа данных Decimal дополнительно указывается два аргумента:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;общее число десятичных знаков (до 35, включительно);&lt;/li&gt;\n&lt;li&gt;число десятичных знаков после запятой (из общего числа, то есть строго не больше предыдущего аргумента).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery10\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#primery10\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    CAST(\"12345\" AS Double),                -- 12345.0\n    CAST(1.2345 AS Uint8),                  -- 1\n    CAST(12345 AS String),                  -- \"12345\"\n    CAST(\"1.2345\" AS Decimal(5, 2)),        -- 1.23\n    CAST(\"xyz\" AS Uint64) IS NULL,          -- true, так как не удалось\n    CAST(-1 AS Uint16) IS NULL,             -- true, отрицательное в беззнаковое\n    CAST([-1, 0, 1] AS List&amp;lt;Uint8?&amp;gt;),             -- [null, 0, 1]\n        --Тип элемента опциональный: неудачный элемент в null.\n    CAST([\"3.14\", \"bad\", \"42\"] AS List&amp;lt;Float&amp;gt;),   -- [3.14, 42]\n        --Тип элемента не опциональный: неудачный элемент удалён.\n    CAST(255 AS Uint8),                     -- 255\n    CAST(256 AS Uint8) IS NULL              -- true, выходит за диапазон\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"536\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-536\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-536\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-536.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"bitcast\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#bitcast\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BITCAST&lt;/span&gt;&lt;/a&gt;BITCAST&lt;/h2&gt;\n&lt;p&gt;Выполняет побитное преобразование целочисленного значения к указанному целочисленному типу. Преобразование всегда успешно, но может потерять точность или старшие биты.&lt;/p&gt;\n&lt;h4 id=\"primery11\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#primery11\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    BITCAST(100000ul AS Uint32),     -- 100000\n    BITCAST(100000ul AS Int16),      -- -31072\n    BITCAST(100000ul AS Uint16),     -- 34464\n    BITCAST(-1 AS Int16),            -- -1\n    BITCAST(-1 AS Uint16);           -- 65535\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"546\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-546\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-546\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-546.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"case\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#case\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CASE&lt;/span&gt;&lt;/a&gt;CASE&lt;/h2&gt;\n&lt;p&gt;Условные выражения и ветвление. Аналог &lt;code&gt;if&lt;/code&gt;, &lt;code&gt;switch&lt;/code&gt; и тернарных операторов в императивных языках программирования.&lt;br /&gt;\nЕсли результатом выражения &lt;code&gt;WHEN&lt;/code&gt; оказывается &lt;code&gt;true&lt;/code&gt;, значением выражения &lt;code&gt;CASE&lt;/code&gt; становится результат,&lt;br /&gt;\nследующий за условием, а остальная часть выражения &lt;code&gt;CASE&lt;/code&gt; не вычисляется. Если же условие не выполняется,&lt;br /&gt;\nза ним таким же образом проверяются все последующие предложения &lt;code&gt;WHEN&lt;/code&gt;. Если не выполняется&lt;br /&gt;\nни одно из условий &lt;code&gt;WHEN&lt;/code&gt;, значением &lt;code&gt;CASE&lt;/code&gt; становится результат, записанный в предложении &lt;code&gt;ELSE&lt;/code&gt;.&lt;br /&gt;\nВетка &lt;code&gt;ELSE&lt;/code&gt; является обязательной в выражении &lt;code&gt;CASE&lt;/code&gt;. Выражения в &lt;code&gt;WHEN&lt;/code&gt; проверяются последовательно, сверху вниз.&lt;/p&gt;\n&lt;p&gt;Так как синтаксис достаточно громоздкий, зачастую удобнее пользоваться встроенной функцией &lt;a href=\"ru/yql/builtins/basic.html#if\"&gt;IF&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"primery12\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#primery12\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  CASE\n    WHEN value &amp;gt; 0\n    THEN \"positive\"\n    ELSE \"negative\"\n  END\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"559\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-559\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-559\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-559.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  CASE value\n    WHEN 0 THEN \"zero\"\n    WHEN 1 THEN \"one\"\n    ELSE \"not zero or one\"\n  END\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"560\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-560\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-560\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-560.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"named-nodes\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#named-nodes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Именованные выражения&lt;/span&gt;&lt;/a&gt;Именованные выражения&lt;/h2&gt;\n&lt;p&gt;Сложные запросы могут выглядеть громоздко и содержать много уровней вложенности и/или повторяющихся частей. В YQL имеется возможность использовать именованные выражения – способ назначить имя произвольному выражению или подзапросу. На это именованное выражение можно ссылаться в других выражениях или подзапросах. При этом фактически происходит подстановка исходного выражения/подзапроса по месту использования.&lt;/p&gt;\n&lt;p&gt;Именованное выражение определяется следующим образом:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;named-expr&amp;gt; = &amp;lt;expression&amp;gt; | &amp;lt;subquery&amp;gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"570\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-570\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-570\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-570.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Здесь &lt;code&gt;&amp;lt;named-expr&amp;gt;&lt;/code&gt; состоит из символа $ и произвольного непустого идентификатора (например &lt;code&gt;$foo&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Если выражение в правой части представляет собой кортеж, то его можно автоматически распаковать, указав в левой части несколько именованных выражений через запятую:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;named-expr1&amp;gt;, &amp;lt;named-expr2&amp;gt;, &amp;lt;named-expr3&amp;gt; ... = &amp;lt;expression-returning-tuple&amp;gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"577\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-577\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-577\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-577.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В этом случае число выражений должно совпадать с размером кортежа.&lt;/p&gt;\n&lt;p&gt;У каждого именованного выражения есть область видимости. Она начинается сразу после определения именованного выражения и заканчивается в конце ближайшего охватывающего scope имён (например, в конце запроса либо в конце тела &lt;a href=\"ru/yql/syntax/expressions.html#lambda\"&gt;лямбда-функции&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/action.html#define-action\"&gt;ACTION&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/subquery.html#define-subquery\"&gt;SUBQUERY&lt;/a&gt; или цикла &lt;a href=\"ru/yql/syntax/action.html#evaluate-for\"&gt;EVALUATE FOR&lt;/a&gt;).&lt;br /&gt;\nПовторное определение именованного выражения с тем же именем приводит к сокрытию предыдущего выражения из текущей области видимости.&lt;/p&gt;\n&lt;p&gt;Если именованное выражение ни разу не использовалось, то генерируется предупреждение. Для того, чтобы избавиться от такого предупреждения, достаточно использовать символ подчеркивания в качестве первого символа идентификатора (например &lt;code&gt;$_foo&lt;/code&gt;).&lt;br /&gt;\nИменованное выражение &lt;code&gt;$_&lt;/code&gt; называется анонимным именованным выражением и обрабатывается специальным образом: оно работает, как если бы &lt;code&gt;$_&lt;/code&gt; автоматически заменялось на &lt;code&gt;$_&amp;lt;some_uniq_name&amp;gt;&lt;/code&gt;.&lt;br /&gt;\nАнонимными именованными выражениями удобно пользоваться в тех случаях, когда мы не интересуемся его значением. Например, для извлечения второго элемента из кортежа из трех элементов можно написать:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$_, $second, $_ = AsTuple(1, 2, 3);\nselect $second;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"587\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-587\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-587\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-587.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Попытка сослаться на анонимное именованное выражение приводит к ошибке:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$_ = 1;\nselect $_; --- ошибка: Unable to reference anonymous name $_\nexport $_; --- ошибка: Can not export anonymous name $_\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"591\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-591\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-591\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-591.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Кроме того, нельзя импортировать именованное выражение под анонимным алиасом:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;import utils symbols $sqrt as $_; --- ошибка: Can not import anonymous name $_\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"595\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-595\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-595\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-595.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Анонимные имена аргументов поддерживаются также для &lt;a href=\"ru/yql/syntax/expressions.html#lambda\"&gt;лямбда-функций&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/action.html#define-action\"&gt;ACTION&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/subquery.html#define-subquery\"&gt;SUBQUERY&lt;/a&gt; и в &lt;a href=\"ru/yql/syntax/action.html#evaluate-for\"&gt;EVALUATE FOR&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Если в результате подстановки именованных выражений в графе выполнения запроса получились полностью одинаковые подграфы, они объединяются, чтобы такой подграф выполнялся только один раз.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"primery13\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#primery13\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$multiplier = 712;\nSELECT\n  a * $multiplier, -- $multiplier is 712\n  b * $multiplier,\n  (a + b) * $multiplier\nFROM abc_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"612\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-612\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-612\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-612.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$intermediate = (\n  SELECT\n    value * value AS square,\n    value\n  FROM my_table\n);\nSELECT a.square * b.value\nFROM $intermediate AS a\nINNER JOIN $intermediate AS b\nON a.value == b.square;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"613\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-613\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-613\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-613.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$a, $_, $c = AsTuple(1, 5u, \"test\"); -- распаковка кортежа\nSELECT $a, $c;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"614\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-614\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-614\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-614.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$x, $y = AsTuple($y, $x); -- swap значений выражений\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"615\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-615\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-615\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-615.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"table-contexts\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#table-contexts\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Табличные выражения&lt;/span&gt;&lt;/a&gt;Табличные выражения&lt;/h2&gt;\n&lt;p&gt;Табличное выражения – это выражение, которое возвращает таблицу. Табличными выражениями в YQL являются:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;подзапросы: &lt;code&gt;(SELECT key, subkey FROM T)&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/expressions.html#named-nodes\"&gt;именованные подзапросы&lt;/a&gt;: &lt;code&gt;$foo = SELECT * FROM T;&lt;/code&gt; (использование именованного подзапроса &lt;code&gt;$foo&lt;/code&gt; является табличным выражением)&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/subquery.html#define-subquery\"&gt;шаблоны подзапросов&lt;/a&gt;: &lt;code&gt;DEFINE SUBQUERY $foo($name) AS ... END DEFINE;&lt;/code&gt; (вызов &lt;code&gt;$foo(\"InputTable\")&lt;/code&gt; является табличным выражением).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Семантика табличного выражения зависит от контекста в котором оно используется. В YQL табличные выражения могут применяться в следующих контекстах:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;табличный контекст — после &lt;a href=\"ru/yql/syntax/select/from.html\"&gt;FROM&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Здесь табличные выражения работают как ожидается – например &lt;code&gt;$input = SELECT a, b, c FROM T; SELECT * FROM $input&lt;/code&gt; вернет таблицу с тремя колонками.&lt;/p&gt;\n&lt;p&gt;Табличный контекст также возникает после &lt;a href=\"ru/yql/syntax/select/operators.html#union\"&gt;UNION [ALL]&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/select/operators.html#intersect\"&gt;INTERSECT [ALL]&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/select/operators.html#except\"&gt;EXCEPT [ALL]&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/join.html#join\"&gt;JOIN&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/process.html#process\"&gt;PROCESS&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/reduce.html#reduce\"&gt;REDUCE&lt;/a&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;векторный контекст — после &lt;a href=\"ru/yql/syntax/expressions.html#in\"&gt;IN&lt;/a&gt;. В этом контексте табличное выражение обязано содержать ровно одну колонку (имя этой колонки никак не влияет на результат выражения).&lt;/p&gt;\n&lt;p&gt;Табличное выражение в векторном контексте типизируется как список (тип элемента списка при этом совпадает с типом колонки). Пример: &lt;code&gt;SELECT * FROM T WHERE key IN (SELECT k FROM T1)&lt;/code&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;скалярный контекст возникает &lt;em&gt;во всех остальных случаях&lt;/em&gt;. Как и в векторном контексте, табличное выражение должно содержать ровно одну колонку, но значением табличного выражения будет скаляр – произвольно выбранное значение этой колонки (если получилось ноль строк, то результатом будет &lt;code&gt;NULL&lt;/code&gt;). Пример: &lt;code&gt;$count = SELECT COUNT(*) FROM T; SELECT * FROM T ORDER BY key LIMIT $count / 2&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Порядок строк в табличном контексте, порядок элементов в векторном контексте и правило выбора значения в скалярном контексте (в случае если значений несколько) не определены. На этот порядок также нельзя повлиять с помощью &lt;code&gt;ORDER BY&lt;/code&gt;: &lt;code&gt;ORDER BY&lt;/code&gt; без &lt;code&gt;LIMIT&lt;/code&gt; в табличных выражениях будет игнорироваться с выдачей предупреждения, а использование &lt;code&gt;ORDER BY&lt;/code&gt; с &lt;code&gt;LIMIT&lt;/code&gt; определяет множество элементов, но не порядок внутри этого множества.&lt;/p&gt;\n&lt;p&gt;Из этого правила есть исключение. Именованное выражение с &lt;a href=\"ru/yql/syntax/process.html#process\"&gt;PROCESS&lt;/a&gt;, будучи использованным в скалярном контексте, ведет себя как в табличном:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$input = SELECT 1 AS key, 2 AS value;\n$process = PROCESS $input;\n\nSELECT FormatType(TypeOf($process)); -- $process используется в скалярном контексте,\n                                     -- но результат SELECT при этом — List&amp;lt;Struct&amp;lt;'key':Int32,'value':Int32&amp;gt;&amp;gt;\n\nSELECT $process[0].key; -- вернет 1\n\nSELECT FormatType(TypeOf($input)); -- ошибка: $input в скалярном контексте должен содержать одну колонку\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"674\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-674\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-674\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-674.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Часто встречающейся ошибкой является использование выражения в скалярном контексте вместо табличного или векторного. Например:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$dict = SELECT key, value FROM T1;\n\nDEFINE SUBQUERY $merge_dict($table, $dict) AS\nSELECT * FROM $table LEFT JOIN $dict USING(key);\nEND DEFINE;\n\nSELECT * FROM $merge_dict(\"Input\", $dict); -- $dict здесь используется в скалярном контексте.\n                                           -- ошибка — в скалярном контексте ожидается ровно одна колонка\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"683\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-683\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-683\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-683.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Правильное решение в данном случае выглядит так:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DEFINE SUBQUERY $dict() AS\nSELECT key, value FROM T1;\nEND DEFINE;\n\nDEFINE SUBQUERY $merge_dict($table, $dict) AS\nSELECT * FROM $table LEFT JOIN $dict() USING(key); -- использование табличного выражения $dict()\n                                                   -- (вызов шаблона подзапроса) в табличном контексте\nEND DEFINE;\n\nSELECT * FROM $merge_dict(\"Input\", $dict); -- $dict — шаблон позапроса (не табличное выражение)\n                                           -- передаваемый в качестве аргумента табличного выражения\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"687\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-687\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-687\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-687.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"lambda\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#lambda\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Lambda функции&lt;/span&gt;&lt;/a&gt;Lambda функции&lt;/h2&gt;\n&lt;p&gt;Позволяют комбинировать несколько выражений в одно вызываемое значение.&lt;/p&gt;\n&lt;p&gt;В круглых скобках перечисляются аргументы, далее после стрелки указывается тело lambda. Тело lambda состоит либо из выражения в круглых скобках, либо из фигурных скобок вокруг необязательной цепочки выражений с присвоением &lt;a href=\"ru/yql/syntax/expressions.html#named-nodes\"&gt;именованных выражений&lt;/a&gt; и результата вызова после ключевого слова &lt;code&gt;RETURN&lt;/code&gt; в последнем выражении.&lt;/p&gt;\n&lt;p&gt;Область видимости для тела lambda — сначала локальные именованные выражения, затем аргументы, затем именованные выражения, определенные выше lambda на верхнем уровне запроса.&lt;/p&gt;\n&lt;p&gt;В теле lambda можно использовать только чистые выражения — в том числе другие lambda, возможно, переданные через аргументы. Но нельзя использовать &lt;a href=\"ru/yql/syntax/select/index.html\"&gt;SELECT&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/insert_into.html\"&gt;INSERT INTO&lt;/a&gt; и прочие выражения верхнего уровня.&lt;/p&gt;\n&lt;p&gt;Один или более последних параметров lambda могут быть помечены вопросиком как необязательные — если они не были указаны при вызове lambda, то им будет присвоено значение &lt;code&gt;NULL&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"primery14\"&gt;&lt;a href=\"ru/yql/syntax/expressions.html#primery14\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt
