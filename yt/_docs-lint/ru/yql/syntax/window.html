            {"data":{"leading":false,"html":"&lt;p&gt;Механизм оконных функций, появившийся в стандарте SQL:2003 и расширенный в стандарте SQL:2011, позволяет выполнять вычисления над набором строк таблицы, который некоторым образом соотносится с текущей строкой.&lt;/p&gt;\n&lt;p&gt;В отличие от &lt;a href=\"ru/yql/builtins/aggregation.html\"&gt;агрегатных функций&lt;/a&gt; при этом не происходит группировка нескольких строк в одну – после применения оконных функций число строк в результирующей таблице всегда совпадает с числом строк в исходной.&lt;/p&gt;\n&lt;p&gt;При наличии в запросе агрегатных и оконных функций сначала производится группировка и вычисляются значения агрегатных функций. Вычисленные значения агрегатных функций могут использоваться в качестве аргументов оконных (но не наоборот). Порядок, в котором вычисляются оконные функции относительно других элементов запроса, описан в разделе &lt;a href=\"ru/yql/syntax/select/index.html\"&gt;SELECT&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"syntax\"&gt;&lt;a href=\"ru/yql/syntax/window.html#syntax\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Синтаксис&lt;/span&gt;&lt;/a&gt;Синтаксис&lt;/h2&gt;\n&lt;p&gt;Общий синтаксис вызова оконной функции имеет вид&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;function_name([expression [, expression ...]]) OVER (window_definition)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"15\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-15\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-15\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-15.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;или&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;function_name([expression [, expression ...]]) OVER window_name\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"19\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-19\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-19\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-19.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Здесь &lt;code&gt;window_name&lt;/code&gt; (&lt;em&gt;имя окна&lt;/em&gt;) – произвольный идентификатор, уникальный в рамках запроса, &lt;code&gt;expression&lt;/code&gt; – произвольное выражение не содержащее вызова оконных функций.&lt;/p&gt;\n&lt;p&gt;В запросе каждому имени окна должно быть сопоставлено &lt;em&gt;определение окна&lt;/em&gt; (&lt;code&gt;window_definition&lt;/code&gt;):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    F0(...) OVER (window_definition_0),\n    F1(...) OVER w1,\n    F2(...) OVER w2,\n    ...\nFROM my_table\nWINDOW\n    w1 AS (window_definition_1),\n    ...\n    w2 AS (window_definition_2)\n;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"26\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-26\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-26\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-26.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Здесь &lt;code&gt;window_definition&lt;/code&gt; записывается в виде&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[ PARTITION BY (expression AS column_identifier | column_identifier) [, ...] ]\n[ ORDER BY expression [ASC | DESC] ]\n[ frame_definition ]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"30\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-30\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-30\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-30.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Необязательное &lt;em&gt;определение рамки&lt;/em&gt; (&lt;code&gt;frame_definition&lt;/code&gt;) может быть задано одним из двух способов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;ROWS frame_begin&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ROWS BETWEEN frame_begin AND frame_end&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;em&gt;Начало рамки&lt;/em&gt; (&lt;code&gt;frame_begin&lt;/code&gt;) и &lt;em&gt;конец рамки&lt;/em&gt; (&lt;code&gt;frame_end&lt;/code&gt;) задаются одним из следующих способов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;UNBOUNDED PRECEDING&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;offset PRECEDING&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;CURRENT ROW&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;offset FOLLOWING&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;UNBOUNDED FOLLOWING&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Здесь &lt;em&gt;смещение рамки&lt;/em&gt; (&lt;code&gt;offset&lt;/code&gt;) – неотрицательный числовой литерал. Если конец рамки не задан, то подразумевается &lt;code&gt;CURRENT ROW&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Все выражения внутри определения окна не должны содержать вызовов оконных функций.&lt;/p&gt;\n&lt;h2 id=\"algoritm-vychisleniya\"&gt;&lt;a href=\"ru/yql/syntax/window.html#algoritm-vychisleniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Алгоритм вычисления&lt;/span&gt;&lt;/a&gt;Алгоритм вычисления&lt;/h2&gt;\n&lt;h3 id=\"partition\"&gt;&lt;a href=\"ru/yql/syntax/window.html#partition\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Разбиение&lt;/span&gt;&lt;/a&gt;Разбиение&lt;/h3&gt;\n&lt;p&gt;Указание &lt;code&gt;PARTITION BY&lt;/code&gt; группирует строки исходной таблицы в &lt;em&gt;разделы&lt;/em&gt;, которые затем обрабатываются независимо друг от друга. Если &lt;code&gt;PARTITION BY&lt;/code&gt; не указан, то все строки исходной таблицы попадают в один раздел. Указание &lt;code&gt;ORDER BY&lt;/code&gt; определяет порядок строк в разделе.&lt;/p&gt;\n&lt;p&gt;В &lt;code&gt;PARTITION BY&lt;/code&gt;, как и в &lt;a href=\"ru/yql/syntax/group_by.html\"&gt;GROUP BY&lt;/a&gt; можно использовать алиасы и &lt;a href=\"ru/yql/syntax/group_by.html#session-window\"&gt;SessionWindow&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;При отсутствии &lt;code&gt;ORDER BY&lt;/code&gt; порядок строк в разделе не определён.&lt;/p&gt;\n&lt;h3 id=\"frame\"&gt;&lt;a href=\"ru/yql/syntax/window.html#frame\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Рамка&lt;/span&gt;&lt;/a&gt;Рамка&lt;/h3&gt;\n&lt;p&gt;Определение рамки &lt;code&gt;frame_definition&lt;/code&gt; задаёт множество строк раздела, попадающих в &lt;em&gt;рамку окна&lt;/em&gt;, связанную с текущей строкой.&lt;/p&gt;\n&lt;p&gt;В режиме &lt;code&gt;ROWS&lt;/code&gt; (в YQL пока поддерживается только он) в рамку окна попадают строки с указанными смещениями относительно текущей строки раздела. Например, для &lt;code&gt;ROWS BETWEEN 3 PRECEDING AND 5 FOLLOWING&lt;/code&gt; в рамку окна попадут три строки перед текущей, текущая строка и пять строк после текущей строки.&lt;/p&gt;\n&lt;p&gt;Множество строк в рамке окна может меняться в зависимости от того, какая строка является текущей. Например, для первой строки раздела в рамку окна &lt;code&gt;ROWS BETWEEN 3 PRECEDING AND 1 PRECEDING&lt;/code&gt; не попадет ни одной строки.&lt;/p&gt;\n&lt;p&gt;Указание &lt;code&gt;UNBOUNDED PRECEDING&lt;/code&gt; в качестве начала рамки означает \"от первой строки раздела\", &lt;code&gt;UNBOUNDED FOLLOWING&lt;/code&gt; в качестве конца рамки – \"до последней строки раздела\", &lt;code&gt;CURRENT ROW&lt;/code&gt; – \"от/до текущей строки\".&lt;/p&gt;\n&lt;p&gt;Если &lt;code&gt;определение_рамки&lt;/code&gt; не указано, то в множество строк попадающих в рамку окна определяется наличием &lt;code&gt;ORDER BY&lt;/code&gt; в &lt;code&gt;определении_окна&lt;/code&gt;.&lt;br /&gt;\nА именно, при наличии &lt;code&gt;ORDER BY&lt;/code&gt; неявно подразумевается &lt;code&gt;ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW&lt;/code&gt;, а при отсутствии – &lt;code&gt;ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Далее, в зависимости от конкретной оконной функции производится ее вычисление либо на множестве строк раздела, либо на множестве строк рамки окна.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"ru/yql/builtins/window.html\"&gt;Список доступных оконных функций&lt;/a&gt;&lt;/p&gt;\n&lt;h4 id=\"primery\"&gt;&lt;a href=\"ru/yql/syntax/window.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    COUNT(*) OVER w AS rows_count_in_window,\n    some_other_value -- доступ к текущей строке\nFROM `my_table`\nWINDOW w AS (\n    PARTITION BY partition_key_column\n    ORDER BY int_column\n);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"124\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-124\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-124\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-124.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    LAG(my_column, 2) OVER w AS row_before_previous_one\nFROM `my_table`\nWINDOW w AS (\n    PARTITION BY partition_key_column\n);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"125\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-125\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-125\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-125.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    -- AVG (как и все агрегатные функции, используемые в качестве оконных)\n    -- вычисляется на рамке окна\n    AVG(some_value) OVER w AS avg_of_prev_current_next,\n    some_other_value -- доступ к текущей строке\nFROM my_table\nWINDOW w AS (\n    PARTITION BY partition_key_column\n    ORDER BY int_column\n    ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING\n);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"126\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-126\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-126\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-126.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    -- LAG не зависит от положения рамки окна\n    LAG(my_column, 2) OVER w AS row_before_previous_one\nFROM my_table\nWINDOW w AS (\n    PARTITION BY partition_key_column\n    ORDER BY my_column\n);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"127\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-127\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-127\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-127.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"osobennosti-realizacii\"&gt;&lt;a href=\"ru/yql/syntax/window.html#osobennosti-realizacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Особенности реализации&lt;/span&gt;&lt;/a&gt;Особенности реализации&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Функции, вычисляемые на рамке окна &lt;code&gt;ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING&lt;/code&gt; либо &lt;code&gt;ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW&lt;/code&gt;, реализованы эффективно (не требуют дополнительной памяти и вычисляются на разделе за O(размер раздела)).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Для рамки окна &lt;code&gt;ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING&lt;/code&gt; есть возможность выбрать стратегию выполнения в оперативной памяти, указав &lt;a href=\"ru/yql/syntax/lexer.html#sql-hints\"&gt;хинт&lt;/a&gt; &lt;code&gt;COMPACT&lt;/code&gt; после ключевого слова &lt;code&gt;PARTITION&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Например: &lt;code&gt;PARTITION /*+ COMPACT() */ BY key&lt;/code&gt; или &lt;code&gt;PARTITION /*+ COMPACT() */ BY ()&lt;/code&gt; (в случае если &lt;code&gt;PARTITION BY&lt;/code&gt; изначально отсутствовал).&lt;/p&gt;\n&lt;p&gt;При наличии хинта &lt;code&gt;COMPACT&lt;/code&gt; потребуется дополнительная память в размере O(размер раздела), но при этом не возникнет дополнительной &lt;code&gt;JOIN&lt;/code&gt; операции.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Если рамка окна не начинается с &lt;code&gt;UNBOUNDED PRECEDING&lt;/code&gt;, то для вычисления оконных функций на таком окне потребуется дополнительная память в размере O(максимальное расстояние от границ окна до текущей строки), а время вычисления будет равно O(число_строк_в_разделе * размер_окна).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Для рамки окна, начинающейся с &lt;code&gt;UNBOUNDED PRECEDING&lt;/code&gt; и заканчивающейся на &lt;code&gt;N&lt;/code&gt;, где &lt;code&gt;N&lt;/code&gt; не равен &lt;code&gt;CURRENT ROW&lt;/code&gt; или &lt;code&gt;UNBOUNDED FOLLOWING&lt;/code&gt;, потребуется дополнительная память в размере O(N), а время вычисления будет O(N * число_строк_в_разделе).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Функции &lt;code&gt;LEAD(expr, N)&lt;/code&gt; и &lt;code&gt;LAG(expr, N)&lt;/code&gt; всегда потребуют O(N) памяти.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Учитывая вышесказанное, запрос с &lt;code&gt;ROWS BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING&lt;/code&gt; по возможности стоит переделать в &lt;code&gt;ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW&lt;/code&gt;, поменяв порядок сортировки в &lt;code&gt;ORDER BY&lt;/code&gt; на обратный.&lt;/p&gt;\n&lt;p&gt;В терминах MapReduce оконные функции физически выполняются через Reduce по ключам &lt;code&gt;PARTITION BY&lt;/code&gt;, что может означать длительное выполнение для разделов большого размера, а также жёсткий лимит в 200 Гб на раздел для основных кластеров YTsaurus.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/syntax/window.md","sourcePath":"ru/yql/syntax/window.md"},"headings":[{"title":"Синтаксис","href":"ru/yql/syntax/window.html#syntax","level":2},{"title":"Алгоритм вычисления","href":"ru/yql/syntax/window.html#algoritm-vychisleniya","level":2,"items":[{"title":"Разбиение","href":"ru/yql/syntax/window.html#partition","level":3},{"title":"Рамка","href":"ru/yql/syntax/window.html#frame","level":3,"items":[{"title":"Примеры","href":"ru/yql/syntax/window.html#primery","level":4}]}]},{"title":"Особенности реализации","href":"ru/yql/syntax/window.html#osobennosti-realizacii","level":2}],"title":"OVER, PARTITION BY и WINDOW"},"router":{"pathname":"ru/yql/syntax/window","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
