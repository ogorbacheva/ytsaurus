        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Преобразовать входную таблицу с помощью UDF на &lt;a href=\"ru/yql/udf/cpp.html\"&gt;C++&lt;/a&gt;, &lt;a href=\"ru/yql/udf/python.html\"&gt;Python&lt;/a&gt; или &lt;a href=\"ru/yql/syntax/expressions.html#lambda\"&gt;лямбда функции&lt;/a&gt;, которая применяется последовательно к каждой строке входа и имеет возможность для каждой строки входа создать ноль, одну или несколько строк результата (аналог Map в терминах MapReduce).&lt;/p&gt;\n&lt;p&gt;Таблица ищется по имени в базе данных, заданной оператором &lt;a href=\"ru/yql/syntax/use.html\"&gt;USE&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;В параметрах вызова функции после ключевого слова &lt;code&gt;USING&lt;/code&gt; явно указывается, значения из каких колонок и в каком порядке передавать для каждой строки входа.&lt;/p&gt;\n&lt;p&gt;Допустимы функции, которые возвращают результат одного из трех составных типов от &lt;code&gt;OutputType&lt;/code&gt; (возможные варианты &lt;code&gt;OutputType&lt;/code&gt; описаны ниже):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;OutputType&lt;/code&gt; — на каждую строку входа всегда должна быть строка выхода, схема которой определяется типом структуры.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;OutputType?&lt;/code&gt; — функции оставляет за собой право пропускать строки, возвращая пустые значения (&lt;code&gt;TUnboxedValue()&lt;/code&gt; в C++, &lt;code&gt;None&lt;/code&gt; в Python или &lt;code&gt;null&lt;/code&gt; в JavaScript).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Stream&amp;lt;OutputType&amp;gt;&lt;/code&gt; или &lt;code&gt;List&amp;lt;OutputType&amp;gt;&lt;/code&gt; — возможность вернуть несколько строк.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Вне зависимости от того, какой вариант из перечисленных выше трех выбран, результат преобразовывается к плоской таблице с колонками, определяемыми типом &lt;code&gt;OutputType&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В качестве &lt;code&gt;OutputType&lt;/code&gt; может выступать один из типов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Struct&amp;lt;...&amp;gt;&lt;/code&gt; — у &lt;code&gt;PROCESS&lt;/code&gt; будет ровно один выход с записями заданной структуры, представляющий собой плоскую таблицу с колонками соответствующими полям &lt;code&gt;Struct&amp;lt;...&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Variant&amp;lt;Struct&amp;lt;...&amp;gt;,...&amp;gt;&lt;/code&gt; — у &lt;code&gt;PROCESS&lt;/code&gt; число выходов будет равно числу альтернатив в &lt;code&gt;Variant&lt;/code&gt;. Записи каждого выхода представлены плоской таблицей с колонками по полям из соответствующей альтернативы. Ко множеству выходов &lt;code&gt;PROCESS&lt;/code&gt; в этом случае можно обратиться как к кортежу (&lt;code&gt;Tuple&lt;/code&gt;) списков, который можно распаковать в отдельные &lt;a href=\"ru/yql/syntax/expressions.html#named-nodes\"&gt;именованные выражения&lt;/a&gt; и использовать независимо.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В списке аргументов функции после ключевого слова &lt;code&gt;USING&lt;/code&gt; можно передать одно из двух специальных именованных выражений:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;TableRow()&lt;/code&gt; — текущая строка целиком в виде структуры;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;TableRows()&lt;/code&gt; — ленивый итератор по строкам, с точки зрения типов — &lt;code&gt;Stream&amp;lt;Struct&amp;lt;...&amp;gt;&amp;gt;&lt;/code&gt;. В этом случае выходным типом функции может быть только &lt;code&gt;Stream&amp;lt;OutputType&amp;gt;&lt;/code&gt; или &lt;code&gt;List&amp;lt;OutputType&amp;gt;&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;После выполнения &lt;code&gt;PROCESS&lt;/code&gt; в рамках того же запроса по результирующей таблице (или таблицам) можно выполнить &lt;a href=\"ru/yql/syntax/select/index.html\"&gt;SELECT&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/reduce.html\"&gt;REDUCE&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/insert_into.html\"&gt;INSERT INTO&lt;/a&gt;, ещё один &lt;code&gt;PROCESS&lt;/code&gt; и так далее в зависимости от необходимого результата.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ключевое слово &lt;code&gt;USING&lt;/code&gt; и указание функции необязательны: если они не указаны, то возвращается исходная таблица. Это может быть удобно для применения &lt;a href=\"ru/yql/syntax/subquery.html\"&gt;шаблона подзапроса&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;В &lt;code&gt;PROCESS&lt;/code&gt; можно передать несколько входов (под входом здесь подразумевается таблица, &lt;a href=\"ru/yql/syntax/select/concat.html\"&gt;диапазон таблиц&lt;/a&gt;, подзапрос, &lt;a href=\"ru/yql/syntax/expressions.html#named-nodes\"&gt;именованное выражение&lt;/a&gt;), разделенных запятой. В функцию из &lt;code&gt;USING&lt;/code&gt; в этом случае можно передать только специальные именованные выражения &lt;code&gt;TableRow()&lt;/code&gt; или  &lt;code&gt;TableRows()&lt;/code&gt;, которые будут иметь следующий тип:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;TableRow()&lt;/code&gt; — альтернатива (&lt;code&gt;Variant&lt;/code&gt;), где каждый элемент имеет тип структуры записи из соответствущего входа. Для каждой входной строки в альтернативе заполнен элемент, соответствущий номеру входа этой строки&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;TableRows()&lt;/code&gt; — ленивый итератор по альтернативам, с точки зрения типов — &lt;code&gt;Stream&amp;lt;Variant&amp;lt;...&amp;gt;&amp;gt;&lt;/code&gt;. Альтернатива имеет такую же семантику, что и для &lt;code&gt;TableRow()&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;После &lt;code&gt;USING&lt;/code&gt; в &lt;code&gt;PROCESS&lt;/code&gt; можно опционально указать &lt;code&gt;ASSUME ORDER BY&lt;/code&gt; со списком столбцов. Результат такого &lt;code&gt;PROCESS&lt;/code&gt; будет считаться сортированным, но без выполнения фактической сортировки. Проверка сортированности осуществляется на этапе исполнения запроса. Поддерживается задание порядка сортировки с помощью ключевых слов &lt;code&gt;ASC&lt;/code&gt; (по возрастанию) и &lt;code&gt;DESC&lt;/code&gt; (по убыванию). Выражения в &lt;code&gt;ASSUME ORDER BY&lt;/code&gt; не поддерживается.&lt;/p&gt;\n&lt;h2 id=\"primery\"&gt;&lt;a href=\"ru/yql/syntax/process.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;PROCESS my_table\nUSING MyUdf::MyProcessor(value)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"96\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-96\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-96\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-96.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$udfScript = @@\ndef MyFunc(my_list):\n    return [(int(x.key) % 2, x) for x in my_list]\n@@;\n\n-- Функция возвращает итератор альтернатив\n$udf = Python3::MyFunc(Callable&amp;lt;(Stream&amp;lt;Struct&amp;lt;...&amp;gt;&amp;gt;) -&amp;gt; Stream&amp;lt;Variant&amp;lt;Struct&amp;lt;...&amp;gt;, Struct&amp;lt;...&amp;gt;&amp;gt;&amp;gt;&amp;gt;,\n    $udfScript\n);\n\n-- На выходе из PROCESS получаем кортеж списков\n$i, $j = (PROCESS my_table USING $udf(TableRows()));\n\nSELECT * FROM $i;\nSELECT * FROM $j;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"97\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-97\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-97\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-97.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$udfScript = @@\ndef MyFunc(stream):\n    for r in stream:\n        yield {\"alt\": r[0], \"key\": r[1].key}\n@@;\n\n-- Функция принимает на вход итератор альтернатив\n$udf = Python::MyFunc(Callable&amp;lt;(Stream&amp;lt;Variant&amp;lt;Struct&amp;lt;...&amp;gt;, Struct&amp;lt;...&amp;gt;&amp;gt;&amp;gt;) -&amp;gt; Stream&amp;lt;Struct&amp;lt;...&amp;gt;&amp;gt;&amp;gt;,\n    $udfScript\n);\n\nPROCESS my_table1, my_table2 USING $udf(TableRows());\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"98\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-98\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-98\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-98.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/syntax/process.md","sourcePath":"ru/yql/syntax/process.md"},"headings":[{"title":"Примеры","href":"ru/yql/syntax/process.html#primery","level":2}],"title":"PROCESS"},"router":{"pathname":"ru/yql/syntax/process","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
