            {"data":{"leading":false,"html":"&lt;p&gt;YQL (Yandex Query Language) — универсальный декларативный язык запросов к системам хранения и обработки данных, а также инфраструктура для их выполнения. К преимуществам YQL можно отнести:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;мощный графовый движок исполнения, который строит MapReduce-pipelines из сотен узлов и может адаптивно перестраиваться по ходу вычисления;&lt;/li&gt;\n&lt;li&gt;возможность построения сложного конвейера обработки данных на SQL с сохранением подзапросов в переменные в виде цепочек зависимых запросов и транзакций;&lt;/li&gt;\n&lt;li&gt;предсказуемое параллельное исполнение запросов произвольной сложности;&lt;/li&gt;\n&lt;li&gt;эффективная реализация join-ов, подзапросов и оконных функций без ограничений на их топологию и вложенность;&lt;/li&gt;\n&lt;li&gt;богатая библиотека функций;&lt;/li&gt;\n&lt;li&gt;поддержка пользовательских функций на &lt;a href=\"ru/yql/udf/cpp.html\"&gt;C++&lt;/a&gt;, &lt;a href=\"ru/yql/udf/python.html\"&gt;Python&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;автоматическое исполнение небольших частей запросов на заранее подготовленных вычислительных инстансах в обход MapReduce-операций для уменьшения времени выполнения.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;YQL предоставляет функциональный веб-интерфейс, в котором среди прочего можно:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;писать код запросов;&lt;/li&gt;\n&lt;li&gt;запускать и останавливать выполнение запросов;&lt;/li&gt;\n&lt;li&gt;просматривать результат выполнения запросов;&lt;/li&gt;\n&lt;li&gt;просматривать историю запросов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"kak-poprobovat\"&gt;&lt;a href=\"ru/yql/index.html#kak-poprobovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как попробовать&lt;/span&gt;&lt;/a&gt;Как попробовать&lt;/h2&gt;\n&lt;p&gt;Чтобы запустить свой первый YQL-запрос:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Откройте веб-интерфейс YTsaurus кластера  и перейдите на вкладку &lt;strong&gt;Queries&lt;/strong&gt; — на неё можно попасть из меню слева.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Введите запрос и нажмите кнопку запуска:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT \"Hello, World!\";\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"81\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-81\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-81\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-81.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;img src=\"images/yql-how-to-try.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"glossarij\"&gt;&lt;a href=\"ru/yql/index.html#glossarij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Глоссарий&lt;/span&gt;&lt;/a&gt;Глоссарий&lt;/h2&gt;\n&lt;table&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;strong&gt;Термин&lt;/strong&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;strong&gt;Перевод на английский&lt;/strong&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;Запрос&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Query&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Текст программы на YQL&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;Операция&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Operation&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Процесс выполнения конкретного запроса (query). Запрос и операция в терминологии YQL соотносятся примерно так же, как программа и процесс в операционной системе&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;Таблица&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Table&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Логически таблица — список структур (&lt;code&gt;List&amp;lt;Struct&amp;lt;...&amp;gt;&amp;gt;&lt;/code&gt;), который является базовым примитивом при обработке больших объемов данных на YQL.&lt;/p&gt;\n&lt;p&gt;Элементы списка образуют строки (row), а элементы каждой структуры (member) являются ячейками таблиц. А множество находящихся друг под другом ячеек, соответственно, образуют колонку таблицы (column)&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;Выражение&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Expression&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Любое вычисляемое значение. Как правило принимают на вход одну или несколько ячеек таблицы и результат становится ячейкой другой таблицы. Примеры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;2 * 2;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;String::ToUpper(\"hi, \" \\|\\| name \\|\\| \"!\")&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;Выражение верхнего уровня&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Statement&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Составные части запроса (query), разделенные точкой с запятой и начинающиеся с глагола. Примеры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;SELECT ...;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;INSERT INTO ... SELECT ... ;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;REDUCE ... USING ... ON ...;&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;Подзапрос&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Subquery&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Составная часть запроса, которая наравне с таблицами может использоваться как вход для выражений верхнего уровня (statements) или других подзапросов. Опционально подзапросы могут быть &lt;a href=\"ru/syntax/subquery.html\"&gt;параметризованными&lt;/a&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;Именованное выражение&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Named node&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Механизм для повторного использования выражений (expression) и подзапросов (subquery) в рамках одного запроса (query). &lt;a href=\"ru/syntax/expressions.html#named-nodes\"&gt;Подробнее&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;Примеры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;$foo = 2 + 2;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;$bar = (SELECT bar FROM my_table);&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;Лямбда функция&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Lambda&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Параметризуемый блок из одного или нескольких именованных выражений (только с expression, не верхнего уровня), результат последнего из которых становится результатом вызова всей лямбды. Вызов осуществляется с помощью передачи параметров в круглые скобки. &lt;a href=\"ru/syntax/expressions.html#lambda\"&gt;Подробнее&lt;/a&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;Пользовательская функция&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;UDF (User Defined Function)&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Возможность встроить в запрос бизнес-логику на одном из поддерживаемых распространённых языков программирования.&lt;/p&gt;\n&lt;p&gt;UDF на &lt;a href=\"ru/udf/cpp.html\"&gt;C++&lt;/a&gt; подключаются в скомпилированном в &lt;code&gt;.so&lt;/code&gt; виде, а также доступен широкий набор &lt;a href=\"ru/udf/list/pcre.html\"&gt;предустановленных&lt;/a&gt;. UDF на &lt;a href=\"ru/udf/python.html\"&gt;Python&lt;/a&gt; могут использовать скрипт из любой строки внутри запроса, но требуют дополнительного описания своей сигнатуры.&lt;/p&gt;\n&lt;p&gt;Так как оптимизатор YQL не умеет «заглядывать» внутрь интерпретатора Python, то с точки зрения производительности &lt;strong&gt;рекомендуется предпочитать использовать лямбда функции и C++ UDF&lt;/strong&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;Действие&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Action&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Параметризуемый блок из одного нескольких выражений верхнего уровня (statements), который затем может вызвать необходимое число раз с помощью специальных предназначенных для этого ключевых слов. В отличие от лямбда функций &lt;strong&gt;не&lt;/strong&gt; возвращают никакого результата. &lt;a href=\"ru/syntax/action.html\"&gt;Подробнее&lt;/a&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;Библиотека&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Library&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Часть запроса, вынесенная в отдельный файл для повторного использования или просто удобства. &lt;a href=\"ru/syntax/export_import.html\"&gt;Подробнее&lt;/a&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/index.md","sourcePath":"ru/yql/index.md"},"headings":[{"title":"Как попробовать","href":"ru/yql/index.html#kak-poprobovat","level":2},{"title":"Глоссарий","href":"ru/yql/index.html#glossarij","level":2}],"title":"Введение"},"router":{"pathname":"ru/yql/index","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
