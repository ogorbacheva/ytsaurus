        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"vvedenie\"&gt;&lt;a href=\"ru/yql/recipes/metaprogramming.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h2&gt;\n&lt;p&gt;Из-за отсутствия в YTsaurus нативной поддержки партиционированных таблиц, типовой ситуацией является хранение логически единой таблицы в виде множества физических таблиц, разбитых по датам, часам или остатку от деления хеша какого-либо из полей. Таким образом, в YQL over YTsaurus запросы часто работают с огромным количеством таблиц (десятки, сотни и тысячи).&lt;/p&gt;\n&lt;p&gt;По меркам стандарта SQL это исключительная ситуация и общепринятых механизмов для описания таких запросов им не предоставляется. YQL обладает многими расширениями стандарта, спроектированных специально для подобных специфичных задач. Также для регулярно или многократно запускаемых запросов в большинстве случаев они позволяют обойтись совсем без генерации текстов запросов на клиенте. Каждый механизм в отдельности &lt;a href=\"yql/syntax/index.html\"&gt;подробно описан в основном руководстве по синтаксису YQL&lt;/a&gt;, а цель данной статьи — продемонстрировать, как их можно комбинировать для достижения практически полезных результатов на приближенных к реальности примерах.&lt;/p&gt;\n&lt;h2 id=\"scenarii\"&gt;&lt;a href=\"ru/yql/recipes/metaprogramming.html#scenarii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сценарии&lt;/span&gt;&lt;/a&gt;Сценарии&lt;/h2&gt;\n&lt;h3 id=\"vybor-tablic-po-datam\"&gt;&lt;a href=\"ru/yql/recipes/metaprogramming.html#vybor-tablic-po-datam\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выбор таблиц по датам&lt;/span&gt;&lt;/a&gt;Выбор таблиц по датам&lt;/h3&gt;\n&lt;p&gt;Архив подавляющего большинства логов хранится на YTsaurus в плоской директории, где каждой дате соответствует отдельная таблица. Чтобы выполнить расчёт по интересующим датам и при этом не подставлять их в текст запроса вручную, можно воспользоваться табличной функцией &lt;code&gt;FILTER&lt;/code&gt; в сочетании с выбирающей нужные даты lambda функцией.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE &amp;lt;cluster-name&amp;gt;;\n\n$log_type = \"yql-log\";\n$base_folder = \"logs/\" || $log_type || \"/1d\";\n$today = CurrentUtcDate();\n$yesterday = $today - Interval(\"P1D\");\n$a_week_ago = $today - Interval(\"P1W\");\n\n$is_during_last_week = ($table_name) -&amp;gt; {\n    $date = CAST($table_name AS Date);\n    RETURN ($date BETWEEN $a_week_ago AND $yesterday) ?? false;\n};\n\nSELECT COUNT(*)\nFROM FILTER($base_folder, $is_during_last_week);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"18\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-18\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-18\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-18.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Ссылки на документацию:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"yql/builtins/basic.html#currentutcdate\"&gt;CurrentUtcDate&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/syntax/expressions.html#lambda\"&gt;Lambda функции&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/syntax/select/index.html\"&gt;FILTER&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"obrabotka-tablic-skolzyashim-oknom-s-keshirovaniem\"&gt;&lt;a href=\"ru/yql/recipes/metaprogramming.html#obrabotka-tablic-skolzyashim-oknom-s-keshirovaniem\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обработка таблиц скользящим окном с кешированием&lt;/span&gt;&lt;/a&gt;Обработка таблиц скользящим окном с кешированием&lt;/h3&gt;\n&lt;p&gt;Допустим, вам необходимо ежедневно считать какой-то агрегат по данным за последнюю неделю примерно как в предыдущем примере. Так как по своей природе большинство таблиц с логами перестают меняться уже начиная с ночи следующего дня, то условно 6/7-х вычислительных ресурсов каждый день тратилось на повторное вычисление того, что уже считалось в предыдущий раз. В YQL есть механизм &lt;a href=\"yql/syntax/pragma/yt.html#yt.querycachemode\"&gt;автоматического кеширования промежуточных результатов вычислений&lt;/a&gt;, но так как он оперирует на уровне MapReduce операций целиком, то в предыдущем запросе cache hit был бы нулевой: каждый день получался бы свой набор входных таблиц в первую Map операцию, а он участвует в вычислении ключа в кеше.&lt;/p&gt;\n&lt;p&gt;Чтобы дать механизму автоматического кеширования шанс на успех (или даже гарантировать его, если переопределить &lt;a href=\"yql/syntax/pragma/yt.html#yt.tmpfolder\"&gt;PRAGMA yt.TmpFolder&lt;/a&gt; в свою директорию/квоту вместо &lt;code&gt;//tmp&lt;/code&gt;), необходимо считать агрегат по каждому дню по отдельности, а затем объединять их в одно значения для получения требуемого результата, благо для большинства агрегатных функций это возможно.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE &amp;lt;cluster-name&amp;gt;;\n\n$log_type = \"visit-log\";\n$base_folder = \"logs/\" || $log_type || \"/1d/\";\n$today = CurrentUtcDate();\n$range = ListFromRange(1, 9);\n\n$shift_back_by_days = ($days_count) -&amp;gt; {\n    RETURN Unwrap(\n        $today - $days_count * Interval(\"P1D\"),\n        \"Failed to shift today back by \" || CAST($days_count AS String) || \" days\"\n    );\n};\n$dates = ListMap($range, $shift_back_by_days);\n\nDEFINE ACTION $max_income($date) AS\n    $table_path = $base_folder || CAST($date AS String);\n    INSERT INTO @daily_results\n    SELECT MAX(CAST(Income AS Double)) AS MaxIncome\n    FROM $table_path;\nEND DEFINE;\n\nEVALUATE FOR $date IN $dates DO $max_income($date);\n\nCOMMIT;\n\nSELECT MAX(MaxIncome) AS MaxIncome\nFROM @daily_results;\n\nDISCARD SELECT\n    Ensure(\n        NULL,\n        COUNT(*) == 7,\n        \"Unexpected number of aggregates to be merged: \" || CAST(COUNT(*) AS String) || \" instead of 7\"\n    )\nFROM @daily_results;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"48\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-48\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-48\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-48.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В данном примере, в отличие от предыдущего пути к таблицам не выбираются из содержимого директории, а генерируются «из воздуха», основываясь на принятой для данного лога схеме именования таблиц. Объявляется «действие» для обработки каждой таблицы в отдельности (&lt;code&gt;DEFINE ACTION&lt;/code&gt;), которое затем в цикле применяется к каждой дате, которая должна попасть в расчет (&lt;code&gt;EVALUATE FOR&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Также в данном запросе демонстрируется несколько способов «уронить» запрос с содержательной ошибкой вместо выдачи некорректного результата, если вдруг начало получаться что-то странное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Арифметика над датами может вернуть NULL в практически невозможных для данного сценария ситуациях выхода за диапазон поддерживаемых значений, что делает достаточно безопасным использование Unwrap — превращения Optional значения в не-Optional (точно не NULL), с ошибкой времени выполнения если в Optional таки лежал NULL.&lt;/li&gt;\n&lt;li&gt;Ensure позволяет проверить выполнение произвольных условий во время выполнения запроса и вернуть ошибку, если условие не выполнено. Его можно вставлять и прямо по ходу вычисления, но в сочетании с &lt;code&gt;DISCARD&lt;/code&gt; (посчитать что-то и выкинуть результат) можно и сделать отдельную проверку сбоку, например по агрегату от временной или итоговой таблицы как здесь. В варианте с &lt;code&gt;DISCARD&lt;/code&gt; первый аргумент Ensure, который обычно становится результатом его вызова, особого смысла не имеет и туда можно писать любую константу, например NULL.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ссылки на документацию:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"yql/syntax/expressions.html#lambda\"&gt;Lambda функции&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/builtins/basic.html#currentutcdate\"&gt;CurrentUtcDate&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/builtins/list.html#listfromrange\"&gt;ListFromRange&lt;/a&gt; / &lt;a href=\"yql/builtins/list.html#listmap\"&gt;ListMap&lt;/a&gt; / &lt;a href=\"yql/builtins/list.html#listlength\"&gt;ListLength&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/builtins/basic.html#unwrap\"&gt;Unwrap&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/syntax/action.html\"&gt;DEFINE ACTION&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/syntax/action.html#evaluate-for\"&gt;EVALUATE FOR&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/syntax/select/temporary_table.html\"&gt;@foo&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/syntax/commit.html\"&gt;COMMIT&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/syntax/discard.html\"&gt;DISCARD&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/builtins/basic.html#ensure\"&gt;Ensure&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"scenarij-s-obrabotkoj-zadanij\"&gt;&lt;a href=\"ru/yql/recipes/metaprogramming.html#scenarij-s-obrabotkoj-zadanij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сценарий с обработкой заданий&lt;/span&gt;&lt;/a&gt;Сценарий с обработкой заданий&lt;/h3&gt;\n&lt;p&gt;Допустим у вас есть некий внешний процесс, записывающий в определённую директорию таблицы, которые по сути являются заданиями для обработки: необходимо запускать на основе содержимого какой такой таблицы вычисление, записывать результат в другую директорию, а обработанные таблицы удалять — и всё это транзакционно.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Как можно сэмулировать такой внешний процесс на YQL для теста&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE &amp;lt;cluster-name&amp;gt;;\n\n$root_folder = \"//tmp/tasks/\";\n$values = ListFromRange(1, 10);\n\nDEFINE ACTION $create_task($i) AS\n    $path = $root_folder || CAST($i AS String);\n    INSERT INTO $path SELECT $i AS Task;\nEND DEFINE;\n\nEVALUATE FOR $value IN $values DO $create_task($value);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"133\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-133\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-133\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-133.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Собственно запуск обработки:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE &amp;lt;cluster-name&amp;gt;;\n\n$tasks_folder = \"tmp/tasks\";\n$results_folder = \"tmp/results\";\n\nDEFINE ACTION $process_task($input_path) AS\n    $output_path = String::ReplaceAll($input_path, $tasks_folder, $results_folder);\n\n    INSERT INTO $output_path WITH TRUNCATE\n    SELECT Task * Task AS Result\n    FROM $input_path;\n    COMMIT;\n    DROP TABLE $input_path;\nEND DEFINE;\n\n$tasks = (\n    SELECT AGGREGATE_LIST(Path)\n    FROM FOLDER($tasks_folder, \"row_count\")\n    WHERE Type == \"table\" AND\n        Yson::LookupInt64(Attributes, \"row_count\") == 1\n);\n\nEVALUATE FOR $task IN $tasks ?? ListCreate(TypeOf($tasks)) DO $process_task($task);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"139\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-139\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-139\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-139.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Здесь также используется механизм «действий» с циклом по списку, но при этом список входных таблиц берётся не «из воздуха», а из табличной функции &lt;code&gt;FOLDER&lt;/code&gt;, которая предоставляет доступ к содержимому произвольной директории в YTsaurus. Так как &lt;code&gt;FOLDER&lt;/code&gt; выдаёт не только таблицы, но и другие виды узлов, то если нет уверенности, что в директории лежат только таблицы, то лучше добавлять фильтр по Type или по произвольным мета атрибутам таблицы (здесь row_count для примера). Для этого надо заказать их во втором аргументе &lt;code&gt;FOLDER&lt;/code&gt; (если несколько, то через точку с запятой) и затем обратиться к колонке Attributes типа Yson.&lt;/p&gt;\n&lt;p&gt;ListExtract делает из списка структур с одним элементом список сразу строк с путями, а можно было бы доставать Path и уже внутри действия.&lt;/p&gt;\n&lt;p&gt;Ссылки на документацию:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"yql/udf/list/string.html\"&gt;String UDF&lt;/a&gt; / &lt;a href=\"yql/udf/list/yson.html\"&gt;Yson UDF&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/builtins/list.html#listfromrange\"&gt;ListFromRange&lt;/a&gt; / &lt;a href=\"yql/builtins/list.html#listextract\"&gt;ListExtract&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/syntax/select/folder.html\"&gt;FOLDER&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/syntax/drop_table.html\"&gt;DROP TABLE&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/recipes/metaprogramming.md","sourcePath":"ru/yql/recipes/metaprogramming.md"},"headings":[{"title":"Введение","href":"ru/yql/recipes/metaprogramming.html#vvedenie","level":2},{"title":"Сценарии","href":"ru/yql/recipes/metaprogramming.html#scenarii","level":2,"items":[{"title":"Выбор таблиц по датам","href":"ru/yql/recipes/metaprogramming.html#vybor-tablic-po-datam","level":3},{"title":"Обработка таблиц скользящим окном с кешированием","href":"ru/yql/recipes/metaprogramming.html#obrabotka-tablic-skolzyashim-oknom-s-keshirovaniem","level":3},{"title":"Сценарий с обработкой заданий","href":"ru/yql/recipes/metaprogramming.html#scenarij-s-obrabotkoj-zadanij","level":3}]}],"title":"Практическое применение метапрограммирования на YQL"},"router":{"pathname":"ru/yql/recipes/metaprogramming","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
