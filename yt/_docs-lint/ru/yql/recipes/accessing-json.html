        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;YQL предоставляет два основных способа извлечения значений из JSON:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Использование &lt;a href=\"ru/yql/builtins/json.html\"&gt;&lt;strong&gt;JSON-функций из SQL стандарта&lt;/strong&gt;&lt;/a&gt;. Этот подход рекомендуется для простых случаев и для команд, которые знакомы с ними по другим СУБД.&lt;/li&gt;\n&lt;li&gt;Использование &lt;a href=\"ru/yql/udf/list/yson.html\"&gt;&lt;strong&gt;Yson UDF&lt;/strong&gt;&lt;/a&gt;, встроенных функций для работы со &lt;a href=\"ru/yql/builtins/list.html\"&gt;списками&lt;/a&gt; и &lt;a href=\"ru/yql/builtins/dict.html\"&gt;словарями&lt;/a&gt;, а также &lt;a href=\"ru/yql/syntax/expressions.html#lambda\"&gt;лямбд&lt;/a&gt;. Этот подход более гибкий и тесно интегрирован с системой типов данных YQL, поэтому рекомендуется для сложных случаев.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ниже приведены рецепты, которые используют один и тот же входной JSON, чтобы показать, как использовать каждый из этих вариантов для проверки существования ключа, получения конкретного значения и извлечения поддерева.&lt;/p&gt;\n&lt;h2 id=\"json-funkcii\"&gt;&lt;a href=\"ru/yql/recipes/accessing-json.html#json-funkcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;JSON-функции&lt;/span&gt;&lt;/a&gt;JSON-функции&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$json = @@{\n    \"friends\": [\n        {\n            \"name\": \"James Holden\",\n            \"age\": 35\n        },\n        {\n            \"name\": \"Naomi Nagata\",\n            \"age\": 30\n        }\n    ]\n}@@j;\n\nSELECT\n    JSON_EXISTS($json, \"$.friends[*].name\"), -- True\n    CAST(JSON_VALUE($json, \"$.friends[0].age\") AS Int32), -- 35\n    JSON_QUERY($json, \"$.friends[0]\"); -- {\"name\": \"James Holden\", \"age\": 35}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"21\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-21\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-21\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-21.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Функции &lt;code&gt;JSON_*&lt;/code&gt; ожидают на вход данные типа &lt;code&gt;Json&lt;/code&gt;. В этом примере строковый литерал имеет суффикс &lt;code&gt;j&lt;/code&gt;, обозначающий его как &lt;code&gt;Json&lt;/code&gt;. В таблицах данные могут храниться либо в формате JSON, либо как строковое представление. Для преобразования данных из &lt;code&gt;String&lt;/code&gt; в тип данных &lt;code&gt;JSON&lt;/code&gt; используйте функцию &lt;code&gt;CAST&lt;/code&gt;, например &lt;code&gt;CAST(my_string AS JSON)&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"yson-udf\"&gt;&lt;a href=\"ru/yql/recipes/accessing-json.html#yson-udf\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson UDF&lt;/span&gt;&lt;/a&gt;Yson UDF&lt;/h2&gt;\n&lt;p&gt;Этот подход обычно сочетает в себе несколько функций и выражений, поэтому запрос может использовать различные конкретные стратегии.&lt;/p&gt;\n&lt;h3 id=\"preobrazovanie-vsego-json-v-yql-kontejnery\"&gt;&lt;a href=\"ru/yql/recipes/accessing-json.html#preobrazovanie-vsego-json-v-yql-kontejnery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Преобразование всего JSON в YQL контейнеры&lt;/span&gt;&lt;/a&gt;Преобразование всего JSON в YQL контейнеры&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$json = @@{\n    \"friends\": [\n        {\n            \"name\": \"James Holden\",\n            \"age\": 35\n        },\n        {\n            \"name\": \"Naomi Nagata\",\n            \"age\": 30\n        }\n    ]\n}@@j;\n\n$containers = Yson::ConvertTo($json, Struct&amp;lt;friends:List&amp;lt;Struct&amp;lt;name:String?,age:Int32?&amp;gt;&amp;gt;&amp;gt;);\n$has_name = ListAny(\n    ListMap($containers.friends, ($friend) -&amp;gt; {\n        return $friend.name IS NOT NULL;\n    })\n);\n$get_age = $containers.friends[0].age;\n$get_first_friend = Yson::SerializeJson(Yson::From($containers.friends[0]));\n\nSELECT\n    $has_name, -- True\n    $get_age, -- 35\n    $get_first_friend; -- {\"name\": \"James Holden\", \"age\": 35}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"34\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-34\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-34\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-34.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;strong&gt;Не&lt;/strong&gt; обязательно преобразовывать весь JSON объект в структурированное сочетание контейнеров. Некоторые поля могут быть опущены, если они не используются, в то время как некоторые поддеревья могут быть оставлены в неструктурированном типе данных, таком как &lt;code&gt;Json&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"rabota-s-predstavleniem-v-pamyati\"&gt;&lt;a href=\"ru/yql/recipes/accessing-json.html#rabota-s-predstavleniem-v-pamyati\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с представлением в памяти&lt;/span&gt;&lt;/a&gt;Работа с представлением в памяти&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$json = @@{\n    \"friends\": [\n        {\n            \"name\": \"James Holden\",\n            \"age\": 35\n        },\n        {\n            \"name\": \"Naomi Nagata\",\n            \"age\": 30\n        }\n    ]\n}@@j;\n\n$has_name = ListAny(\n    ListMap(Yson::ConvertToList($json.friends), ($friend) -&amp;gt; {\n        return Yson::Contains($friend, \"name\");\n    })\n);\n$get_age = Yson::ConvertToInt64($json.friends[0].age);\n$get_first_friend = Yson::SerializeJson($json.friends[0]);\n\nSELECT\n    $has_name, -- True\n    $get_age, -- 35\n    $get_first_friend; -- {\"name\": \"James Holden\", \"age\": 35}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"41\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-41\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-41\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-41.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"smotrite-takzhe\"&gt;&lt;a href=\"ru/yql/recipes/accessing-json.html#smotrite-takzhe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Смотрите также&lt;/span&gt;&lt;/a&gt;Смотрите также&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/recipes/modifying-json.html\"&gt;Изменение JSON с помощью YQL&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/recipes/accessing-json.md","sourcePath":"ru/yql/recipes/accessing-json.md"},"headings":[{"title":"JSON-функции","href":"ru/yql/recipes/accessing-json.html#json-funkcii","level":2},{"title":"Yson UDF","href":"ru/yql/recipes/accessing-json.html#yson-udf","level":2,"items":[{"title":"Преобразование всего JSON в YQL контейнеры","href":"ru/yql/recipes/accessing-json.html#preobrazovanie-vsego-json-v-yql-kontejnery","level":3},{"title":"Работа с представлением в памяти","href":"ru/yql/recipes/accessing-json.html#rabota-s-predstavleniem-v-pamyati","level":3}]},{"title":"Смотрите также","href":"ru/yql/recipes/accessing-json.html#smotrite-takzhe","level":2}],"title":"Доступ к значениям в JSON с помощью YQL"},"router":{"pathname":"ru/yql/recipes/accessing-json","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
