        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"vvedenie\"&gt;&lt;a href=\"ru/yql/recipes/codegen.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h2&gt;\n&lt;p&gt;При работе с таблицами, в которых содержится большое количество колонок, бывает утомительно перечислять их снова и снова в разных частях SQL запроса, в том случае, когда невозможно использовать выборку всех колонок через &lt;code&gt;*&lt;/code&gt; и, опционально, &lt;code&gt;WITHOUT&lt;/code&gt;. Также иногда выбор колонок может основываться кроме имени еще и на их типе данных. Для того, чтобы не генерировать текст SQL запроса можно воспользоваться механизмами &lt;a href=\"ru/yql/builtins/types.html\"&gt;интроспекции типов&lt;/a&gt; и &lt;a href=\"ru/yql/builtins/codegen.html\"&gt;кодогенерации&lt;/a&gt;. При этом сама генерация кода проводится до начала выполнения основного запроса и полученные программы полностью эквивалентны написанным вручную.&lt;/p&gt;\n&lt;p&gt;При использовании кодогенерации важно учитывать то, что из-за того, что она выполняется до начала основного запроса, в процессе кодогенерации можно использовать только типы колонок таблиц, но не их значения. Также без ограничений можно использовать константы и выражения, не зависящие от колонок таблиц.&lt;/p&gt;\n&lt;p&gt;Далее мы рассмотрим типовые сценарии и способы их решения.&lt;/p&gt;\n&lt;h2 id=\"scenarii\"&gt;&lt;a href=\"ru/yql/recipes/codegen.html#scenarii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сценарии&lt;/span&gt;&lt;/a&gt;Сценарии&lt;/h2&gt;\n&lt;h3 id=\"deklarirovat-tip-udf-s-pomoshyu-vychislenij\"&gt;&lt;a href=\"ru/yql/recipes/codegen.html#deklarirovat-tip-udf-s-pomoshyu-vychislenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Декларировать тип UDF с помощью вычислений&lt;/span&gt;&lt;/a&gt;Декларировать тип UDF с помощью вычислений&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$tuple = AsTuple(1, \"foo\", AsList(-1.2, 3.0));\n\n$tupleType = TypeOf($tuple);\n$reverseTupleType = EvaluateType(TupleTypeHandle(\n    ListReverse(TupleTypeComponents(TypeHandle($tupleType)))));\n\n$script = @@\ndef reverse_any_tuple(t):\n   return tuple(reversed(list(t)))\n@@;\n\n\n$udfType = CallableType(0, $reverseTupleType, $tupleType);\n$udf = SystemPython3_8::reverse_any_tuple($udfType, $script);\n\nSELECT $udf($tuple);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"18\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-18\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-18\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-18.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Ссылки на документацию:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/types.html#evaluatetype\"&gt;EvaluateType&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"filtraciya-kolonok-po-spisku-imen\"&gt;&lt;a href=\"ru/yql/recipes/codegen.html#filtraciya-kolonok-po-spisku-imen\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Фильтрация колонок по списку имен&lt;/span&gt;&lt;/a&gt;Фильтрация колонок по списку имен&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE &amp;lt;cluster-name&amp;gt;;\n\n$makeFieldsSelector = ($fields) -&amp;gt; {\n    RETURN EvaluateCode(LambdaCode(($row) -&amp;gt; {\n        $items = ListMap($fields, ($f) -&amp;gt; {\n            $atom = AtomCode($f);\n            RETURN ListCode($atom, FuncCode(\"Member\", $row, $atom));\n        });\n\n        RETURN FuncCode(\"AsStruct\", $items);\n    }))\n};\n\n$selectFields1 = $makeFieldsSelector(AsList(\"age\", \"name\", \"region\"));\n$selectFields2 = $makeFieldsSelector(AsList(\"age\", \"name\"));\n\nINSERT INTO @tmp1\nSELECT * FROM (\n    SELECT $selectFields1(TableRow()) FROM `home/yql/tutorial/users`\n    WHERE region != 225\n) FLATTEN COLUMNS;\n\nINSERT INTO @tmp2\nSELECT * FROM (\n    SELECT $selectFields2(TableRow()) FROM `home/yql/tutorial/users`\n    WHERE region = 225\n) FLATTEN COLUMNS;\n\nCOMMIT;\n\nSELECT * FROM @tmp1;\nSELECT * FROM @tmp2;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"32\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-32\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-32\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-32.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Ссылки на документацию:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/codegen.html#evaluatecode\"&gt;EvaluateCode&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/list.html#listmap\"&gt;ListMap&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/expressions.html#lambda\"&gt;Lambda функции&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/basic.html#tablerow\"&gt;TableRow&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"poisk-vo-vseh-strokovyh-kolonkah\"&gt;&lt;a href=\"ru/yql/recipes/codegen.html#poisk-vo-vseh-strokovyh-kolonkah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поиск во всех строковых колонках&lt;/span&gt;&lt;/a&gt;Поиск во всех строковых колонках&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE &amp;lt;cluster-name&amp;gt;;\n\n$containsAnyColumns = ($strValue, $needle) -&amp;gt; {\n    -- Лямбда функция - предикат, которая будет применяться к значению в каждой колонки\n    $func = ($where) -&amp;gt; {\n        RETURN String::Contains($where, $needle);\n    };\n\n    $code = EvaluateCode(LambdaCode(($strCode) -&amp;gt; {\n        -- Выбираем список полей структуры\n        $members = StructTypeComponents(TypeHandle(TypeOf($strValue)));\n\n        $filteredMembers = ListFilter($members, ($x) -&amp;gt; {\n             $type = $x.Type;\n             -- Убираем опциональный тип верхнего уровня\n             $cleanType = If (TypeKind($type) == \"Optional\", OptionalItemType($type), $type);\n             -- Оставляем только колонки с типом String или String?\n             RETURN TypeKind($cleanType) == \"Data\" AND\n                DataTypeComponents($cleanType)[0] == \"String\";\n        });\n\n        -- Генерируем выражение вида $func(column1) OR $func(column2)...\n        RETURN Yql::Fold($filteredMembers, ReprCode(false), ($item, $state) -&amp;gt; {\n            $member = FuncCode(\"Member\", $strCode, AtomCode($item.Name));\n            $apply = FuncCode(\"Apply\", QuoteCode($func), $member);\n            RETURN FuncCode(\"Or\", $state, $apply);\n        });\n    }));\n\n    RETURN $code($strValue);\n};\n\nSELECT * FROM `home/yql/tutorial/users`\nWHERE $containsAnyColumns(TableRow(), \"comment\");\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"61\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-61\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-61\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-61.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Ссылки на документацию:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/codegen.html#evaluatecode\"&gt;EvaluateCode&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/list.html#listmap\"&gt;ListFilter&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/expressions.html#lambda\"&gt;Lambda функции&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/basic.html#tablerow\"&gt;TableRow&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"sliyanie-struktur-sleva-napravo\"&gt;&lt;a href=\"ru/yql/recipes/codegen.html#sliyanie-struktur-sleva-napravo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Слияние структур слева направо&lt;/span&gt;&lt;/a&gt;Слияние структур слева направо&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;\n-- Удаляет из типа данных Optional верхнего уровня\n$removeOptional = ($type) -&amp;gt; {\n    RETURN IF(TypeKind($type) == \"Optional\", OptionalItemType($type), $type);\n};\n\n$combineMembersLeft = ($str1, $str2) -&amp;gt; {\n    $code = EvaluateCode(LambdaCode(($str1code, $str2code) -&amp;gt; {\n        -- Получаем списки полей обоих структур\n        $leftMembers = StructTypeComponents($removeOptional(TypeHandle(TypeOf($str1))));\n        $rightMembers = StructTypeComponents($removeOptional(TypeHandle(TypeOf($str2))));\n\n        -- Генерируем получение полей из левой структуры\n        $members1 = ListMap($leftMembers, ($x) -&amp;gt; {\n            $atom = AtomCode($x.Name);\n            RETURN ListCode($atom, FuncCode(\"Member\", $str1code, $atom));\n        });\n\n        -- Собираем в множество имена полей левой структуры для удобного поиска\n        $leftNames = ToSet(ListExtract($leftMembers, \"Name\"));\n\n        -- Генерируем получение полей из правой структуры, если их еще не было в левой\n        $members2 = ListFlatMap($rightMembers, ($x) -&amp;gt; {\n            $atom = AtomCode($x.Name);\n            $member = ListCode($atom, FuncCode(\"Member\", $str2code, $atom));\n            RETURN IF(DictContains($leftNames, $x.Name), NULL, $member);\n        });\n\n        -- Формируем финальную структуру\n        RETURN FuncCode(\"AsStruct\", ListExtend($members1, $members2));\n    }));\n\n    RETURN $code($str1, $str2);\n};\n\nSELECT $combineMembersLeft(\n    Just(AsStruct(1 as a, 2 as b)),\n    AsStruct(3 as c, 4 as b)\n);\n-- (a:1, b:2, c:3)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"90\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-90\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-90\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-90.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Ссылки на документацию:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/codegen.html#evaluatecode\"&gt;EvaluateCode&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/list.html#listmap\"&gt;ListMap&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/expressions.html#lambda\"&gt;Lambda функции&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"prochitat-kolonku-po-imeni,-zapisannom-v-drugoj-kolonke\"&gt;&lt;a href=\"ru/yql/recipes/codegen.html#prochitat-kolonku-po-imeni,-zapisannom-v-drugoj-kolonke\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Прочитать колонку по имени, записанном в другой колонке&lt;/span&gt;&lt;/a&gt;Прочитать колонку по имени, записанном в другой колонке&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$input = AsList(\n    AsStruct(1 as key, \"value1\" as index, \"foo\" as value1),\n    AsStruct(2 as key, \"value2\" as index, \"bar\" as value2),\n    AsStruct(3 as key, \"value3\" as index)\n);\n\n-- Построить лямбду, которая для входной строки таблицы возвращает\n-- две колонки - ключ, копируемый без изменений, и значение,\n-- которое извлекается из колонки, чье имя записано в индексной колонке.\n$makeDynamicAccessor = ($keyColumn, $indexColumn, $valueColumn) -&amp;gt; {\n    RETURN ($row) -&amp;gt; {\n        RETURN EvaluateCode(LambdaCode(($rowCode) -&amp;gt; {\n            -- Строим список всех полей кроме ключевого и индексного\n            $names = ListExtract(StructTypeComponents(TypeHandle(TypeOf($row))), \"Name\");\n            $names = ListFilter($names, ($x) -&amp;gt; {\n                    return $x != $keyColumn and $x != $indexColumn\n            });\n\n            -- Строим словарь из имени колонки в variant\n            $dict = EvaluateCode(FuncCode(\"AsDict\",\n                ListMap($names,\n                    ($x) -&amp;gt; {\n                        RETURN ListCode(ReprCode($x),\n                            FuncCode(\"Variant\", FuncCode(\"Void\"), AtomCode($x),\n                            FuncCode(\"VariantType\", FuncCode(\"StructType\",\n                                ListMap($names, ($x) -&amp;gt; {\n                                    RETURN ListCode(AtomCode($x), FuncCode(\"VoidType\")) })))))\n                    })));\n\n            -- Значение индексной колонки\n            $indexValue = FuncCode(\"Member\", $rowCode, AtomCode($indexColumn));\n\n            -- Ключевую колонку берем без изменений\n            $keyMember = ListCode(AtomCode($keyColumn),\n                FuncCode(\"Member\", $rowCode, AtomCode($keyColumn)));\n\n            -- Выполняем поиск в словаре\n            $enumLookup = FuncCode(\"Lookup\", ReprCode($dict), $indexValue);\n\n            -- Обрабатываем найденное в словаре значение\n            $value = FuncCode(\"FlatMap\", $enumLookup, LambdaCode(($x) -&amp;gt; {\n                -- Строим список обработчиков для каждого имени колонки\n                $handlers = ListFlatMap($names, ($name) -&amp;gt; {\n                    RETURN AsList(AtomCode($name),\n                        LambdaCode(($u) -&amp;gt; {\n                            RETURN FuncCode(\"Member\", $rowCode, AtomCode($name));\n                        }));\n                });\n\n                -- Применяем визитор к найденному значению\n                RETURN FuncCode(\"Visit\", $x, $handlers);\n            }));\n\n            $valueMember = ListCode(AtomCode($valueColumn), $value);\n\n            -- Собираем выходную структуру из ключа и значения\n            RETURN FuncCode(\"AsStruct\", AsList($keyMember, $valueMember));\n        }))($row);\n    };\n};\n\nSELECT * FROM (\n    SELECT $makeDynamicAccessor(\"key\",\"index\",\"value\")(TableRow())\n    FROM AS_TABLE($input)\n) FLATTEN COLUMNS\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"114\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-114\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-114\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-114.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Ссылки на документацию:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/codegen.html#evaluatecode\"&gt;EvaluateCode&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/list.html#listmap\"&gt;ListMap&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/expressions.html#lambda\"&gt;Lambda функции&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"poschitat-summu-po-elementam-kortezha\"&gt;&lt;a href=\"ru/yql/recipes/codegen.html#poschitat-summu-po-elementam-kortezha\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Посчитать сумму по элементам кортежа&lt;/span&gt;&lt;/a&gt;Посчитать сумму по элементам кортежа&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$t = AsTuple(1,2,3);\n\n$sumTuple = ($tupleValue) -&amp;gt; {\n    $code = EvaluateCode(LambdaCode(($tupleCode) -&amp;gt; {\n        -- Вычисляем размер кортежа\n        $count = ListLength(TupleTypeComponents(TypeHandle(TypeOf($tupleValue))));\n        -- Генерируем сумму\n        $pair = Yql::Fold(ListFromRange(0ul, $count), AsTuple(ReprCode(0), 0), ($item, $state) -&amp;gt; {\n            -- $state это пара из кода для суммы и текущего индекса\n            RETURN AsTuple(\n                FuncCode(\"+\", $state.0, FuncCode(\"Nth\", $tupleCode, AtomCode(\n                    CAST($state.1 as string)))),\n                $state.1 + 1\n            )\n        });\n\n        RETURN $pair.0;\n    }));\n\n    RETURN $code($tupleValue);\n};\n\nSELECT $sumTuple($t);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"138\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-138\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-138\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-138.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Ссылки на документацию:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/codegen.html#evaluatecode\"&gt;EvaluateCode&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/expressions.html#lambda\"&gt;Lambda функции&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"agregaciya-nad-vsemi-chislovymi-kolonkami\"&gt;&lt;a href=\"ru/yql/recipes/codegen.html#agregaciya-nad-vsemi-chislovymi-kolonkami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Агрегация над всеми числовыми колонками&lt;/span&gt;&lt;/a&gt;Агрегация над всеми числовыми колонками&lt;/h3&gt;\n&lt;p&gt;Выбрать все числовые колонки в таблице, применить к ним несколько агрегационных функций, и записать в выходные колонки, добавив к имени название агрегационной функции.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE &amp;lt;cluster-name&amp;gt;;\n\n-- Удаляет из типа данных Optional верхнего уровня\n$removeOptional = ($type) -&amp;gt; {\n    RETURN IF(TypeKind($type) == \"Optional\", OptionalItemType($type), $type);\n};\n\n-- Фильтруем только колонки с числами и кладем в структуру nums\n$filterOnlyNumericColumns = ($strValue) -&amp;gt; {\n    $code = EvaluateCode(LambdaCode(($str) -&amp;gt; {\n        $members = StructTypeComponents(TypeHandle(TypeOf($strValue)));\n        $filteredMembers = ListFilter($members, ($x) -&amp;gt; {\n            $type = $x.Type;\n            $cleanType = $removeOptional($type);\n            RETURN TypeKind($cleanType) == \"Data\" AND\n                DataTypeComponents($cleanType)[0] REGEXP \"Int[0-9]+|Uint[0-9]+|Float|Double\"\n        });\n\n        $list = ListMap($filteredMembers, ($x) -&amp;gt; {\n            RETURN ListCode(AtomCode($x.Name), FuncCode(\"Member\", $str, AtomCode($x.Name)));\n        });\n\n        RETURN FuncCode(\"AsStruct\",$list);\n    }));\n\n    RETURN $code($strValue);\n};\n\n$nums = (SELECT $filterOnlyNumericColumns(TableRow()) as nums FROM `home/yql/tutorial/users`);\n\nSELECT * FROM $nums;\n\n-- Применяем заданную агрегационную функцию одновременно ко всей структуре nums.\n-- Результаты агрегаций - вложенные структуры для колонок count/min/...\n$agg = (SELECT\n    MULTI_AGGREGATE_BY(nums, AggregationFactory(\"count\")) as count,\n    MULTI_AGGREGATE_BY(nums, AggregationFactory(\"min\")) as min,\n    MULTI_AGGREGATE_BY(nums, AggregationFactory(\"max\")) as max,\n    MULTI_AGGREGATE_BY(nums, AggregationFactory(\"avg\")) as avg,\n    MULTI_AGGREGATE_BY(nums, AggregationFactory(\"percentile\", 0.9)) as p90\nFROM $nums);\n\nSELECT * FROM $agg;\n\n-- Развернем структуры так, чтобы колонки были вида originalcolumn_aggrfunc.\n-- Просто FLATTEN COLUMNS тут не справится, т.к. есть конфликты - в count/min и т.п.\n-- вложенные поля одинаковые.\n\n$rotateStruct = ($value) -&amp;gt; {\n    $code = EvaluateCode(LambdaCode(($strValue) -&amp;gt; {\n        -- Получаем колонки-структуры верхнего уровня\n        $topMembers = StructTypeComponents(TypeHandle(TypeOf($value)));\n        $list = ListFlatMap($topMembers, ($x) -&amp;gt; {\n            $topMember = FuncCode(\"Member\", $strValue, AtomCode($x.Name));\n            -- Обходим поля в структурах\n            $nestedMembers = StructTypeComponents($removeOptional($x.Type));\n            RETURN ListMap($nestedMembers, ($y) -&amp;gt; {\n                RETURN ListCode(AtomCode($y.Name || \"_\" || $x.Name),\n                    FuncCode(\"Member\", $topMember, AtomCode($y.Name)));\n            })\n        });\n\n        RETURN FuncCode(\"AsStruct\", $list);\n    }));\n\n    RETURN $code($value);\n};\n\n$rotate = (SELECT $rotateStruct(TableRow()) FROM $agg);\n\nSELECT * FROM $rotate;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"160\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-160\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-160\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-160.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Ссылки на документацию:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/codegen.html#evaluatecode\"&gt;EvaluateCode&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/list.html#listfilter\"&gt;ListFilter&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/list.html#listmap\"&gt;ListMap&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/expressions.html#lambda\"&gt;Lambda функции&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/aggregation.html#multiaggregateby\"&gt;MULTI_AGGREGATE_BY&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/basic.html#aggregationfactory\"&gt;AggregationFactory&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"transponirovat-tablicu-pivot\"&gt;&lt;a href=\"ru/yql/recipes/codegen.html#transponirovat-tablicu-pivot\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Транспонировать таблицу (PIVOT)&lt;/span&gt;&lt;/a&gt;Транспонировать таблицу (PIVOT)&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;-- Пример данных\n$input = AsList(\n    AsStruct(\"2012\" as year, 1 as key, 3.0 as value),\n    AsStruct(\"2013\" as year, 1 as key, 4.0 as value),\n    AsStruct(\"2013\" as year, 2 as key, 5.0 as value),\n    AsStruct(\"2014\" as year, 1 as key, 6.0 as value),\n    AsStruct(\"2014\" as year, 1 as key, 7.0 as value)\n);\n\n$makePivot = ($nameColumn, $valueColumn, $nameList) -&amp;gt; {\n    RETURN EvaluateCode(LambdaCode(($row) -&amp;gt; {\n        $name = FuncCode(\"Member\", $row, AtomCode($nameColumn));\n        $value = FuncCode(\"Member\", $row, AtomCode($valueColumn));\n        $row = FuncCode(\"RemoveMember\", $row, AtomCode($nameColumn));\n        $row = FuncCode(\"RemoveMember\", $row, AtomCode($valueColumn));\n\n        $ensureOptional = ($x) -&amp;gt; {\n            RETURN YQL::MatchType($x, AsAtom(\"Optional\"), () -&amp;gt; { RETURN $x }, () -&amp;gt; { RETURN Just($x) });\n        };\n\n        $structItems = ListMap($nameList, ($item) -&amp;gt; {\n            $adjustedValue = FuncCode(\"Apply\", QuoteCode($ensureOptional), $value);\n            $ifValue = FuncCode(\"FlatOptionalIf\",\n                FuncCode(\"Coalesce\", FuncCode(\"==\", $name, ReprCode($item)), ReprCode(false)),\n                $adjustedValue);\n            RETURN ListCode(AtomCode($item), $ifValue);\n        });\n\n        $struct = FuncCode(\"AsStruct\", $structItems);\n        RETURN FuncCode(\"AddMember\", $row, AtomCode($valueColumn), $struct);\n    }));\n};\n\n-- Строим PIVOT-операцию:\n-- 1. Значение поля `value` меняется на структуру, в которой созданы колонки, указанные в последнем списке.\n-- 2. Согласно значению в поле `year` заполняется та или иная ячейка в выходной структуре `value`.\n-- 3. После этого поле `year` удаляется.\n\n$pivot = $makePivot(\"year\", \"value\", AsList(\"2012\", \"2013\", \"2014\"));\n\n-- Исходные данные\nSELECT * FROM AS_TABLE($input);\n\n$x = (SELECT * FROM (\n    SELECT $pivot(TableRow()) FROM AS_TABLE($input)\n) FLATTEN COLUMNS);\n\n-- Результат\nSELECT * FROM (\n    SELECT\n        AsStruct(key as key),\n        MULTI_AGGREGATE_BY(value, AggregationFactory(\"sum\"))\n    FROM $x GROUP BY key\n) FLATTEN COLUMNS;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"199\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-199\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-199\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-199.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Ссылки на документацию:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/codegen.html#evaluatecode\"&gt;EvaluateCode&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/list.html#listmap\"&gt;ListMap&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/expressions.html#lambda\"&gt;Lambda функции&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/aggregation.html#multiaggregateby\"&gt;MULTI_AGGREGATE_BY&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/basic.html#aggregationfactory\"&gt;AggregationFactory&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"obuedinit-shablony-podzaprosov\"&gt;&lt;a href=\"ru/yql/recipes/codegen.html#obuedinit-shablony-podzaprosov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Объединить шаблоны подзапросов&lt;/span&gt;&lt;/a&gt;Объединить шаблоны подзапросов&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$combineQueries = ($query, $list) -&amp;gt; {\n    RETURN EvaluateCode(LambdaCode(($world) -&amp;gt; {\n        -- Неявным параметром шаблона подзапроса является аргумент world, через который передаются\n        -- зависимости, например, видимые PRAGMA или операции COMMIT в точке использования шаблона подзапроса.\n        $queries = ListMap($list, ($arg) -&amp;gt; {\n                -- Передаем world дальше первым аргументом шаблона подзапроса\n                RETURN FuncCode(\"Apply\", QuoteCode($query), $world, ReprCode($arg))\n            });\n\n        -- Объединяем все результаты в общий список, при этом требуется совпадение типов.\n        -- Для более слабого объединения можно воспользоваться функцией UnionAll.\n        RETURN FuncCode(\"Extend\", $queries);\n    }));\n};\n\nDEFINE SUBQUERY $sub($n) AS\n   SELECT $n;\nEND DEFINE;\n\n-- Построить шаблон запроса, который получается если объединить\n-- результаты подстановки шаблона подзапроса $sub для каждого значения от 0 до 9 включительно.\n$fullQuery = $combineQueries($sub, ListFromRange(0, 10));\nSELECT * FROM $fullQuery();\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"233\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-233\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-233\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-233.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Ссылки на документацию:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/codegen.html#evaluatecode\"&gt;EvaluateCode&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/list.html#listmap\"&gt;ListMap&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/expressions.html#lambda\"&gt;Lambda функции&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/subquery.html\"&gt;Шаблоны подзапросов&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"postroit-shablon-podzaprosa-s-sortirovkoj-po-spisku-kolonok\"&gt;&lt;a href=\"ru/yql/recipes/codegen.html#postroit-shablon-podzaprosa-s-sortirovkoj-po-spisku-kolonok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Построить шаблон подзапроса с сортировкой по списку колонок&lt;/span&gt;&lt;/a&gt;Построить шаблон подзапроса с сортировкой по списку колонок&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE &amp;lt;cluster-name&amp;gt;;\n\n$sorted = ($world, $input, $orderByColumns, $asc) -&amp;gt; {\n    $n = ListLength($orderByColumns);\n\n    $keySelector = LambdaCode(($row) -&amp;gt; {\n        $items = ListMap($orderByColumns,\n            ($x) -&amp;gt; {\n                RETURN FuncCode(\"Member\", $row, AtomCode($x));\n            });\n        RETURN ListCode($items);\n    });\n\n    $sort = EvaluateCode(LambdaCode(($x) -&amp;gt; {\n        return FuncCode(\"Sort\",\n            $x,\n            ListCode(ListReplicate(ReprCode($asc), $n)),\n            $keySelector)\n    }));\n\n    RETURN $sort($input($world));\n};\n\nDEFINE SUBQUERY $source() AS\n    PROCESS `home/yql/tutorial/users`;\nEND DEFINE;\n\nPROCESS $sorted($source, AsList(\"name\",\"age\"), true);\nPROCESS $sorted($source, AsList(\"name\"), true);\nPROCESS $sorted($source, ListCreate(TypeOf(\"\")), true);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"262\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-262\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-262\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-262.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Ссылки на документацию:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/codegen.html#evaluatecode\"&gt;EvaluateCode&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/builtins/list.html#listmap\"&gt;ListMap&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/expressions.html#lambda\"&gt;Lambda функции&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/subquery.html\"&gt;Шаблоны подзапросов&lt;/a&gt;&lt;/li&gt;\
