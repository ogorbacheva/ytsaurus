        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"intro\"&gt;&lt;a href=\"ru/yql/types/type_string.html#intro\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h2&gt;\n&lt;p&gt;Так как YQL является строго типизированным языком, во многих аспектах работы с ним тип данных имеет большое значение. Для удобства работы с типами существует конвенция описания типов данных YQL в текстовом виде. Она используется в разных местах документации, а также существует библиотека, предоставляющая функции для построения типа данных по текстовому описанию (например, при ручном описании сигнатуры вызываемого значения) или для сериализации типа данных в строку для отладки.&lt;/p&gt;\n&lt;p&gt;Функции для работы с типами данных &lt;a href=\"ru/yql/builtins/types.html\"&gt;описаны в статье&lt;/a&gt;, а ниже описан сам формат текстового представления типов данных.&lt;/p&gt;\n&lt;h2 id=\"rules\"&gt;&lt;a href=\"ru/yql/types/type_string.html#rules\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общие правила&lt;/span&gt;&lt;/a&gt;Общие правила&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/types/primitive.html\"&gt;Примитивные типы данных&lt;/a&gt; представляются в текстовом виде просто своим именем.&lt;/li&gt;\n&lt;li&gt;Сложный тип данных представляет собой композицию из других типов данных. Если представить эту композицию в виде дерева, то на листьях окажутся &lt;a href=\"ru/yql/types/primitive.html\"&gt;примитивные типы данных&lt;/a&gt;, а в остальных узлах — &lt;a href=\"ru/yql/types/containers.html\"&gt;контейнеры&lt;/a&gt;. &lt;a href=\"ru/yql/types/special.html\"&gt;Специальные типы данных&lt;/a&gt; можно рассматривать как исключение, они могут находиться и там и там.&lt;/li&gt;\n&lt;li&gt;Текстовое представление повторяет структуру этого дерева в порядке от корня к листьям: в каждом узле дерева указывается имя текущего типа данных, а переход на уровень глубже обозначается различными видами скобок.&lt;/li&gt;\n&lt;li&gt;Допустимо использование пробелов и переносов строк, если это облегчает чтение.&lt;/li&gt;\n&lt;li&gt;Если идентификатор состоит не только из английских букв и цифр, то его нужно записывать в одиночных кавычках и использовать C-escaping.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"containers\"&gt;&lt;a href=\"ru/yql/types/type_string.html#containers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Контейнеры&lt;/span&gt;&lt;/a&gt;Контейнеры&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Для указания типов элементов контейнера используются угловые скобки.&lt;/p&gt;\n&lt;p&gt;Пример: &lt;code&gt;List&amp;lt;Int32&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Если контейнер предполагает несколько разнородных элементов, то они перечисляются внутри угловых скобок через запятую.&lt;/p&gt;\n&lt;p&gt;Пример: &lt;code&gt;Tuple&amp;lt;Int32, String&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Если контейнер предполагает именованные элементы, то вместо типов данных через запятую используются пары из имени и типа через двоеточие.&lt;/p&gt;\n&lt;p&gt;Пример: &lt;code&gt;Struct&amp;lt;a:Int32, b:String&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Нижележащий тип контейнера &lt;code&gt;Variant&lt;/code&gt; выбирается в зависимости от наличия имён в аргументах.&lt;/p&gt;\n&lt;p&gt;Пример: &lt;code&gt;Variant&amp;lt;Int32, String&amp;gt;&lt;/code&gt; — вариант над кортежем, &lt;code&gt;Variant&amp;lt;a:Int32, b:String&amp;gt;&lt;/code&gt; — вариант над структурой.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"optional\"&gt;&lt;a href=\"ru/yql/types/type_string.html#optional\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типы, допускающие NULL&lt;/span&gt;&lt;/a&gt;Типы, допускающие NULL&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;В терминах YQL это называется &lt;code&gt;Optional&lt;/code&gt;, в терминах классического SQL — nullable.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Формально этот тип является контейнером, т.е. запись &lt;code&gt;Optional&amp;lt;...&amp;gt;&lt;/code&gt; допустима, но обычно вместо неё используется shortcut в виде суффикса из знака вопроса.&lt;/p&gt;\n&lt;p&gt;Пример: &lt;code&gt;String?&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"callable\"&gt;&lt;a href=\"ru/yql/types/type_string.html#callable\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызываемые значения&lt;/span&gt;&lt;/a&gt;Вызываемые значения&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Базовая форма вызываемых значений выглядит следующим образом: &lt;code&gt;(arg1, arg2, ...) -&amp;gt; result&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Пример описания сигнатуры функции, принимающей две строки и возвращающей число: &lt;code&gt;(String, String) -&amp;gt; Int64&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Вызываемые значения могут возвращать вызываемые значения, в этом случае они образуют цепочку необходимой длины.&lt;/p&gt;\n&lt;p&gt;Пример: &lt;code&gt;(String, String) -&amp;gt; (String, String) -&amp;gt; Int64&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Опциональные аргументы должны иметь на верхнем уровне тип &lt;code&gt;Optional&lt;/code&gt; и обрамляются в квадратные скобки.&lt;/p&gt;\n&lt;p&gt;Пример: &lt;code&gt;(String, [String?, Double?]) -&amp;gt; Int64&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;У аргументов вызываемых значений могут быть указаны флаги.&lt;/p&gt;\n&lt;p&gt;На текущий момент возможен только один флаг — &lt;code&gt;AutoMap&lt;/code&gt;, который означает, что если в этот аргумент передали NULL, то результат нужно сделать тоже NULL, а саму функцию не запускать.&lt;/p&gt;\n&lt;p&gt;Пример: &lt;code&gt;(String{Flags: AutoMap}) -&amp;gt; Int64&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Если нужен &lt;code&gt;Optional&amp;lt;Callable&amp;lt;...&amp;gt;&amp;gt;&lt;/code&gt;, то нужно использовать именно такую форму, т.к. знак вопроса в конце относится к результату вызываемого значения.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"resources\"&gt;&lt;a href=\"ru/yql/types/type_string.html#resources\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ресурсы&lt;/span&gt;&lt;/a&gt;Ресурсы&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;В отличие от контейнеров, ресурс параметризуется не типом элемента (ресурс является указателем в памяти и YQL ничего не знает о его содержимом), а строковой меткой, которая может использоваться для защиты от передачи ресурсов между несовместимыми функциями.&lt;/p&gt;\n&lt;p&gt;Пример: &lt;code&gt;Resource&amp;lt;Foo&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/types/type_string.md","sourcePath":"ru/yql/types/type_string.md"},"headings":[{"title":"Введение","href":"ru/yql/types/type_string.html#intro","level":2},{"title":"Общие правила","href":"ru/yql/types/type_string.html#rules","level":2},{"title":"Контейнеры","href":"ru/yql/types/type_string.html#containers","level":2},{"title":"Типы, допускающие NULL","href":"ru/yql/types/type_string.html#optional","level":2},{"title":"Вызываемые значения","href":"ru/yql/types/type_string.html#callable","level":2},{"title":"Ресурсы","href":"ru/yql/types/type_string.html#resources","level":2}],"title":"Работа с текстовым представлением типов данных"},"router":{"pathname":"ru/yql/types/type_string","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e8161         </script>
