        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"perf_join\"&gt;&lt;a href=\"ru/yql/faq/performance.html#perf_join\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Почему так долго работает запрос с JOIN?&lt;/span&gt;&lt;/a&gt;Почему так долго работает запрос с JOIN?&lt;/h2&gt;\n&lt;p&gt;Все основные виды &lt;a href=\"ru/yql/syntax/join.html\"&gt;JOIN&lt;/a&gt; (кроме SEMI/ONLY) строят декартово произведение строк по совпадающим значениям ключей. Если одно или несколько значений ключа являются особенными, то по нему может оказаться большое число строк с каждой из сторон и, как следствие, гигантское декартово произведение. В большинстве случаев JOIN работает медленно именно из-за этого, а такие особые значения с прикладной точки зрения оказываются не так интересны, и достаточно их исключить в &lt;code&gt;WHERE&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Найти аномально часто встречающиеся значения можно с помощью двух запросов по каждой из таблиц с GROUP BY по тем же ключам, что и у &lt;code&gt;JOIN&lt;/code&gt;, используя агрегатную функцию &lt;code&gt;COUNT&lt;/code&gt; и убывающую сортировку по её результату. Ещё можно добавить &lt;code&gt;LIMIT 100&lt;/code&gt;, чтобы отработало ещё быстрее.&lt;/p&gt;\n&lt;p&gt;Также бывают запросы, где на самом деле декартово произведение в &lt;code&gt;JOIN&lt;/code&gt; не нужно, т. к. потом всё равно от значений тем или иным способом оставляют только уникальные значения. В этом случае стоит убрать дубли в подзапросе через &lt;a href=\"ru/yql/syntax/group_by.html\"&gt;GROUP BY&lt;/a&gt; или &lt;a href=\"ru/yql/syntax/select/distinct.html\"&gt;SELECT DISTINCT&lt;/a&gt; ещё до &lt;code&gt;JOIN&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"perf_slowdown\"&gt;&lt;a href=\"ru/yql/faq/performance.html#perf_slowdown\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мой запрос раньше работал за N часов, а теперь стал работать за M часов. В чем причина?&lt;/span&gt;&lt;/a&gt;Мой запрос раньше работал за N часов, а теперь стал работать за M часов. В чем причина?&lt;/h2&gt;\n&lt;p&gt;При анализе производительности стоит обратить внимание на следующие моменты:&lt;/p&gt;\n&lt;h3 id=\"pomenyalsya-li-vhodnoj-obuyom-dannyh\"&gt;&lt;a href=\"ru/yql/faq/performance.html#pomenyalsya-li-vhodnoj-obuyom-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поменялся ли входной объём данных&lt;/span&gt;&lt;/a&gt;Поменялся ли входной объём данных&lt;/h3&gt;\n&lt;p&gt;Например, в запрос стало попадать больше таблиц или существенно изменился их объём. Чтобы проверить, поменялся ли входной объём данных, можно кликнуть в плане запроса на первую YTsaurus операцию и посмотреть в интерфейсе YTsaurus на &lt;code&gt;Data flow&lt;/code&gt;/&lt;code&gt;Data weight&lt;/code&gt;:&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/data_weight.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;h3 id=\"pomenyali-li-plan-ispolneniya-zaprosa\"&gt;&lt;a href=\"ru/yql/faq/performance.html#pomenyali-li-plan-ispolneniya-zaprosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поменяли ли план исполнения запроса&lt;/span&gt;&lt;/a&gt;Поменяли ли план исполнения запроса&lt;/h3&gt;\n&lt;p&gt;Если план изменился, то это могло произойти по нескольким причинам:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Стала применяться другая стратегия &lt;code&gt;JOIN&lt;/code&gt;. Про критерии срабатывания той или иной стратегии смотри &lt;a href=\"ru/yql/syntax/join.html#join_strategy\"&gt;отдельную статью&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Изменилась схема некоторых входных таблиц в папке. YQL выравнивает схему входных таблиц, что приводит к появлению дополнительных операций.&lt;/li&gt;\n&lt;li&gt;Поменялись оптимизаторы YQL с релизом новой версии.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"ispolzuetsya-li-v-zaprose-pul-s-vydelennymi-garantiyami\"&gt;&lt;a href=\"ru/yql/faq/performance.html#ispolzuetsya-li-v-zaprose-pul-s-vydelennymi-garantiyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Используется ли в запросе пул с выделенными гарантиями&lt;/span&gt;&lt;/a&gt;Используется ли в запросе пул с выделенными гарантиями&lt;/h3&gt;\n&lt;p&gt;В запросе должна быть указана прагма &lt;a href=\"ru/yql/syntax/pragma/yt.html#ytstaticpool\"&gt;yt.StaticPool&lt;/a&gt; для применения пула. Если её нет, то время исполнения запроса никак не гарантируется. На него могут повлиять как соседние запросы, так и сезонные колебания нагрузки на кластера (перед ревью нагрузка на кластера, как правило, возрастает). Также стоит убедиться, что пул задаётся прагмой &lt;a href=\"ru/yql/syntax/pragma/yt.html#ytstaticpool\"&gt;yt.StaticPool&lt;/a&gt;, а не &lt;a href=\"ru/yql/syntax/pragma/yt.html#ytpool\"&gt;yt.Pool&lt;/a&gt;. Последняя является динамической прагмой, применяемой уже в рантайме. Из-за этого служебные операции, запущенные на этапе оптимизации, не используют её значение и запускаются в пуле по умолчанию, что может приводить к их существенному замедлению. Прагма &lt;a href=\"ru/yql/syntax/pragma/yt.html#ytstaticpool\"&gt;yt.StaticPool&lt;/a&gt; применяется для всех операций, в том числе и служебных.&lt;/p&gt;\n&lt;h3 id=\"proverka-summarnyh-statistik-zaprosa\"&gt;&lt;a href=\"ru/yql/faq/performance.html#proverka-summarnyh-statistik-zaprosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Проверка суммарных статистик запроса&lt;/span&gt;&lt;/a&gt;Проверка суммарных статистик запроса&lt;/h3&gt;\n&lt;p&gt;На вкладке &lt;code&gt;Statistics&lt;/code&gt; YQL-запроса можно посмотреть его суммарные статистики:&lt;br /&gt;\n&lt;img src=\"images/stat.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;Здесь в первую очередь нужно обратить внимание и сравнить значения следующих статистик:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;yt/total/Job_CalcTime&lt;/code&gt; (Sum) — полезное время, проведенное во всех джобах с пользовательским кодом всех YTsaurus-операций запроса. Изменение этого значения при отсутствии изменения входного объёма данных говорит об изменениях производительности в YQL-рантайме.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt/total/Job_InputDecodeTime&lt;/code&gt; (Sum) — время, потраченное YQL декодером на чтение входных данных во всех джобах всех YTsaurus-операций запроса. Изменение этого значения при отсутствии изменения входного объёма данных говорит об изменениях производительности в YQL декодере.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt/total/Job_OutputEncodeTime&lt;/code&gt; (Sum) — время, потраченное YQL энкодером на запись данных во всех джобах всех YTsaurus-операций запроса. Изменение этого значения при отсутствии изменения входного объёма данных говорит об изменениях производительности в YQL энкодере.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt/total/CodeGen_FullTime&lt;/code&gt; (Sum) — время, потраченное на кодогенерацию во всех джобах всех YTsaurus-операций запроса. Изменение этого значения при том же числе YTsaurus-джобов говорит об изменениях производительности кодогенерации YQL-рантайма. Если это время составляет существенную долю от &lt;code&gt;Job_CalcTime&lt;/code&gt;, то стоит рассмотреть вариант отключения LLVM в запросе через &lt;code&gt;pragma config.flags(\"LLVM\", \"OFF\")&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt/total/Join_Spill_Count&lt;/code&gt; (Sum) — ненулевое значение этой статистики говорит о проблемах производительности &lt;code&gt;JOIN&lt;/code&gt; в запросе. Если ключи по первой стороне джойна имеют очень много записей, то они не помещаются в памяти и сохраняются на диск. Это приводит к существенной деградации времени YTsaurus-джобов, выполняющих &lt;code&gt;JOIN&lt;/code&gt;. Для решения этой проблемы можно увеличить значение прагмы &lt;a href=\"ru/yql/syntax/pragma/yt.html#ytcommonjoincorelimit\"&gt;yt.CommonJoinCoreLimit&lt;/a&gt;, либо поменять местами стороны &lt;code&gt;JOIN&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt/total/data/input/data_weight&lt;/code&gt; (Sum) — суммарный объём данных, обработанный всеми джобами всех YTsaurus-операций запроса. При отсутствии изменений в плане запроса, изменение этой статистики говорит об изменении входного объёма данных запроса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"poisk-samoj-medlennoj-ytsaurus-operacii-zaprosa\"&gt;&lt;a href=\"ru/yql/faq/performance.html#poisk-samoj-medlennoj-ytsaurus-operacii-zaprosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поиск самой медленной YTsaurus-операции запроса&lt;/span&gt;&lt;/a&gt;Поиск самой медленной YTsaurus-операции запроса&lt;/h3&gt;\n&lt;p&gt;На вкладке &lt;code&gt;Progress&lt;/code&gt; YQL-запроса нужно переключиться в режим &lt;code&gt;Timeline&lt;/code&gt;:&lt;br /&gt;\n&lt;img src=\"images/timeline.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;В этом режиме наглядно видно, какая YTsaurus-операция больше всего повлияла на время исполнения YQL-запроса. Можно также раскрыть детали исполнения разных стадий операции:&lt;br /&gt;\n&lt;img src=\"images/pending.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;Здесь видно, что операция долго стояла в статусе &lt;code&gt;Pending&lt;/code&gt;, т. е. ей не хватало лимитов на число работающих операций в пуле.&lt;/p&gt;\n&lt;p&gt;Для дальнейшего анализа можно открыть медленную операцию в YTsaurus интерфейсе, кликнув на её название в левой колонке timeline. В YTsaurus-операции в первую очередь стоит обратить внимание на &lt;code&gt;Total job wall time&lt;/code&gt; и &lt;code&gt;Total CPU time spent&lt;/code&gt;. Если эти значения для двух запусков YQL-запроса существенно не изменились, но при этом изменился &lt;code&gt;Duration&lt;/code&gt;, то это сигнализирует о проблемах в пуле запроса. Нужно кликнуть на название пула&lt;br /&gt;\n&lt;img src=\"images/pool.png\" alt=\"\" /&gt;&lt;br /&gt;\nи открыть его в интерфейсе YTsaurus на вкладке &lt;code&gt;Monitoring&lt;/code&gt; для анализа его нагрузки.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/faq/performance.md","sourcePath":"ru/yql/faq/performance.md"},"headings":[{"title":"Почему так долго работает запрос с JOIN?","href":"ru/yql/faq/performance.html#perf_join","level":2},{"title":"Мой запрос раньше работал за N часов, а теперь стал работать за M часов. В чем причина?","href":"ru/yql/faq/performance.html#perf_slowdown","level":2,"items":[{"title":"Поменялся ли входной объём данных","href":"ru/yql/faq/performance.html#pomenyalsya-li-vhodnoj-obuyom-dannyh","level":3},{"title":"Поменяли ли план исполнения запроса","href":"ru/yql/faq/performance.html#pomenyali-li-plan-ispolneniya-zaprosa","level":3},{"title":"Используется ли в запросе пул с выделенными гарантиями","href":"ru/yql/faq/performance.html#ispolzuetsya-li-v-zaprose-pul-s-vydelennymi-garantiyami","level":3},{"title":"Проверка суммарных статистик запроса","href":"ru/yql/faq/performance.html#proverka-summarnyh-statistik-zaprosa","level":3},{"title":"Поиск самой медленной YTsaurus-операции запроса","href":"ru/yql/faq/performance.html#poisk-samoj-medlennoj-ytsaurus-operacii-zaprosa","level":3}]}],"title":"Производительность"},"router":{"pathname":"ru/yql/faq/performance","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
