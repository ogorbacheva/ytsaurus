        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;YQL относится к сильно типизированным (strongly typed) языкам программирования. Это, в частности, означает следующее — перед тем, как YQL запрос начнёт выполняться, он должен быть типизирован (т. е. для каждого узла в графе вычислений должен быть вычислен его тип). При нажатии на кнопку &lt;strong&gt;Validate&lt;/strong&gt; в веб-интерфейсе как раз и происходит типизация.&lt;/p&gt;\n&lt;p&gt;Например, запрос&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT key + 1 AS new_key FROM T;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;типизируется следующим образом (тут есть некоторые упрощения):&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Загружаются метаданные таблицы &lt;code&gt;T&lt;/code&gt;, из которых выясняется, что тип колонки &lt;code&gt;key&lt;/code&gt; — Uint32.&lt;/li&gt;\n&lt;li&gt;Тип литерала всегда известен: тип 1 — Int32.&lt;/li&gt;\n&lt;li&gt;Вычисляется тип операции &lt;code&gt;+&lt;/code&gt; по типам аргументов. Для аргументов Int32,Uint32 результат — Int32.&lt;/li&gt;\n&lt;li&gt;В результате получается, что тип запроса — список структур с одним Int32 элементом, а именно &lt;code&gt;List&amp;lt;Struct&amp;lt;new_key:Int32&amp;gt;&amp;gt;&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Однако YQL поддерживает и более сложные для типизации случаи, когда тип запроса зависит от &lt;em&gt;значений&lt;/em&gt; некоторых выражений, причём эти значения, в свою очередь, могут зависеть от &lt;em&gt;содержимого&lt;/em&gt; таблиц. Типичный пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$from = \"2022-02-01\";\n$to = SELECT MAX(dt) FROM T1;\n\nINSERT INTO Result\nSELECT * FROM RANGE(Dir, $from, $to);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"35\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-35\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-35\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-35.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Для того чтобы вывести тип &lt;a href=\"ru/yql/syntax/select/concat.html\"&gt;RANGE&lt;/a&gt; (т. е. вывести общий тип для таблиц), следует посчитать значение &lt;code&gt;$to&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Другой пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$cols = SELECT AGGREGATE_LIST(DISTINCT name) FROM T1 WHERE &amp;lt;condition&amp;gt;; -- динамически формируем интересный нам список колонок\n\n -- выбираем колонки из списка\nSELECT * FROM (SELECT ChooseMembers(TableRow(), $cols) FROM T2) FLATTEN COLUMNS;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"42\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-42\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-42\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-42.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Для того чтобы типизировать &lt;a href=\"ru/yql/builtins/struct.html#choosemembers\"&gt;ChooseMembers&lt;/a&gt;, необходимо вычислить &lt;em&gt;значение&lt;/em&gt; (не тип) &lt;code&gt;$cols&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Таким образом, можно сделать выводы:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Некоторые запросы на YQL требуют вычислений для типизации.&lt;/li&gt;\n&lt;li&gt;Иногда эти вычисления требуют чтений из таблиц.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Для типизации подобных запросов в YQL есть отдельная Evaluation стадия, на которой и производятся необходимые вычисления.&lt;/p&gt;\n&lt;p&gt;Однако у вычислений на этой стадии есть ограничения. Главное из них — суммарный размер таблиц, от которых зависит Evaluation стадия, ограничен. Ограничение по умолчанию составляет 1Мб, но его можно расширить до 10Мб с помощью прагмы &lt;a href=\"ru/yql/syntax/pragma/yt.html#ytevaluationtablesizelimit\"&gt;yt.EvaluationTableSizeLimit&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Причина таких ограничений — стремление избежать долгой Evaluation стадии, на которой ещё нельзя показать план выполнения запроса и после которой всё ещё возможны пользовательские ошибки типизации. Обидно запустить расчёт на несколько часов, после чего увидеть, что запрос упал с ошибкой 'No such column'.&lt;/p&gt;\n&lt;p&gt;Единственный способ обойти это ограничение — разбить запрос на два. В первом запросе считается evaluation часть и записывается в таблицу. Второй запрос уже будет зависеть от этой (маленькой по размерам) таблицы.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/misc/exec_steps.md","sourcePath":"ru/yql/misc/exec_steps.md"},"headings":[],"title":"Этапы исполнения запроса"},"router":{"pathname":"ru/yql/misc/exec_steps","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
