        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"vvedenie\"&gt;&lt;a href=\"ru/yql/udf/cpp.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h2&gt;\n&lt;p&gt;На данный момент в YQL поддерживаются пользовательские функции (UDF) на C++, Python. Ниже речь пойдет только о C++, про &lt;a href=\"ru/yql/udf/python.html\"&gt;Python&lt;/a&gt; есть отдельная статья.&lt;/p&gt;\n&lt;p&gt;На сервисе YQL уже установлен набор базовых функций — рекомендуем ознакомиться со &lt;a href=\"ru/yql/udf/list/index.html\"&gt;списком&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"terminologiya\"&gt;&lt;a href=\"ru/yql/udf/cpp.html#terminologiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Терминология&lt;/span&gt;&lt;/a&gt;Терминология&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Вызываемое значение&lt;/strong&gt; &lt;span style=\"color:gray\"&gt;callable&lt;/span&gt; — сущность с фиксированной, строго типизированной сигнатурой, которая при вызове способна вернуть результат по своим аргументам.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Пользовательская функция&lt;/strong&gt; &lt;span style=\"color:gray\"&gt;(function, user defined function, UDF)&lt;/span&gt; — фабрика по созданию вызываемых значений.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Модуль&lt;/strong&gt; &lt;span style=\"color:gray\"&gt;(module)&lt;/span&gt; — набор тесно связанных функций с общим префиксом; все функции модуля распространяются вместе в одной разделяемой библиотеке (&lt;code&gt;.so&lt;/code&gt;). Если модуль специфичен для какого-либо проекта, то крайне желательно отразить это в его имени в виде префикса.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Регистратор&lt;/strong&gt; &lt;span style=\"color:gray\"&gt;(registrator)&lt;/span&gt; — интерфейс для внесения модулей и функций в общий реестр.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Группа модулей&lt;/strong&gt; &lt;span style=\"color:gray\"&gt;(group)&lt;/span&gt; — группа модулей, принадлежащих структурному подразделению или крупному проекту; служит лишь для логического разделения исходного кода (см. следующий раздел), из YQL/SQL не видна.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Конфигурационные параметры&lt;/strong&gt; — опциональный механизм для настройки пользовательской функции (фабрики вызываемых значений). Позволяют изменить поведение вызываемых значений без перекомпиляции:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Type Config&lt;/code&gt;, &lt;code&gt;User Type&lt;/code&gt; — по ним функция должна определить и объявить сигнатуру вызываемого значения; используется при построении графа вычислений. Должны быть известны в момент компиляции, поэтому &lt;code&gt;Type Config&lt;/code&gt; обязательно должен быть атомом, а &lt;code&gt;User Type&lt;/code&gt; — некоторым типом, например полученным с помощью операции TypeOf.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Run Config&lt;/code&gt; — по нему функция должна вернуть вызываемое значение с объявленной ранее сигнатурой. Тип значения Run Config указывается в коде UDF при объявлении сигнатуры вызываемого значения. Отличается от обычного аргумента тем, что он передается при инициализации, а не при каждом вызове.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"primery\"&gt;&lt;a href=\"ru/yql/udf/cpp.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h2&gt;\n&lt;p&gt;Примеры готовых модулей можно посмотреть здесь: &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yql/essentials/udfs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;https://github.com/ytsaurus/ytsaurus/tree/main/yql/essentials/udfs&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Совсем простые примеры см. в поддиректории &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yql/essentials/udfs/examples\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;examples&lt;/a&gt;, приближенные к реальности — в остальных, например &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yql/essentials/udfs/common\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;common&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Перед изучением следующего раздела рекомендуем открыть один или несколько примеров, так как в разделе даны только пояснения к коду, но полные листинги не приводятся.&lt;/p&gt;\n&lt;h2 id=\"interfejsy-s\"&gt;&lt;a href=\"ru/yql/udf/cpp.html#interfejsy-s\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интерфейсы (С++)&lt;/span&gt;&lt;/a&gt;Интерфейсы (С++)&lt;/h2&gt;\n&lt;h3 id=\"tunboxedvalue-udfvalueh\"&gt;&lt;a href=\"ru/yql/udf/cpp.html#tunboxedvalue-udfvalueh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TUnboxedValue (udfvalue.h)&lt;/span&gt;&lt;/a&gt;TUnboxedValue (udf_value.h)&lt;/h3&gt;\n&lt;p&gt;Класс-обертка вокруг типизированных данных. Предоставляет набор конструкторов для создания сложных типов данных из простых типов данных и набор хелперов для работы со сложными типами данных.&lt;/p&gt;\n&lt;p&gt;Числа, интервалы, даты, включая даты с временной зоной и короткие строки до 14 байт хранятся по значению, метод &lt;code&gt;IsEmbedded()&lt;/code&gt; для них вернет &lt;code&gt;true&lt;/code&gt;. Строки длиннее 14 байт хранятся по указателю.&lt;/p&gt;\n&lt;h3 id=\"tunboxedvaluepodudfvalueh\"&gt;&lt;a href=\"ru/yql/udf/cpp.html#tunboxedvaluepodudfvalueh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TUnboxedValuePod(udfvalue.h)&lt;/span&gt;&lt;/a&gt;TUnboxedValuePod(udf_value.h)&lt;/h3&gt;\n&lt;p&gt;Является базовым классом для TUnboxedValue. Не&lt;br /&gt;\nпроизводит автоматический подсчет ссылок на свое значение, в отличие от своего наследника, который осуществляет это в конструкторе и деструкторе - ключевым моментом здесь является отсутсвие конструкторов и деструкторов у класса TUnboxedValuePod. Реализует всю логику работы с&lt;br /&gt;\nтипизированными данными.&lt;/p&gt;\n&lt;h3 id=\"ivaluebuilder-udfvaluebuilderh\"&gt;&lt;a href=\"ru/yql/udf/cpp.html#ivaluebuilder-udfvaluebuilderh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;IValueBuilder (udfvaluebuilder.h)&lt;/span&gt;&lt;/a&gt;IValueBuilder (udf_value_builder.h)&lt;/h3&gt;\n&lt;p&gt;Метод Run должен возвращать TUnboxedValue. Для числовых типов можно воспользоваться конструктором типа, например &lt;code&gt;return TUnboxedValue&amp;lt;ui32&amp;gt;(123);&lt;/code&gt;. Для создания TUnboxedValue с более сложным содержимым в метод Run передается IValueBuilder. На нем можно вызвать один из методов &lt;code&gt;New***&lt;/code&gt; для получения интерфейса &lt;code&gt;I***ValueBuilder&lt;/code&gt;, где *** — одно из String/Struct/Dict/пр. С его помощью можно добавить специфичных для каждого типа элементов и в конце вызвать &lt;code&gt;Build&lt;/code&gt; для получения заполненного TUnboxedValue.&lt;br /&gt;\nЕсть вариант создать Struct/Tuple с преаллокацией для хранения содержимого, для этого надо вызвать соответствующий метод &lt;code&gt;New***(const TType* type, TUnboxedValue*&amp;amp; items)&lt;/code&gt; и заполнить элементы items на месте.&lt;/p&gt;\n&lt;p&gt;См. &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yql/essentials/udfs/examples/structs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yql/essentials/udfs/examples/structs&lt;/a&gt; для примера со структурами.&lt;/p&gt;\n&lt;h3 id=\"tboxedvalue-udfvalueh\"&gt;&lt;a href=\"ru/yql/udf/cpp.html#tboxedvalue-udfvalueh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TBoxedValue (udfvalue.h)&lt;/span&gt;&lt;/a&gt;TBoxedValue (udf_value.h)&lt;/h3&gt;\n&lt;p&gt;Класс типичного UDF наследуется от TBoxedValue и помимо конструктора переопределяет метод Run, в котором должна размещаться основная логика по обработке одного конкретного вызова. В аргументы Run передается интерфейс IValueBuilder, о котором ниже, а также сами переданные аргументы в виде массива TUnboxedValue.&lt;/p&gt;\n&lt;p&gt;В конструкторе можно сохранить какое-то состояние в приватные переменные класса, таким образом конкретный объект нашего класса-наследника TBoxedValue превращается в вызываемое значение с потенициально уникальным поведением.&lt;/p&gt;\n&lt;p&gt;Для простых UDF (без использования YQL-структур, C++ шаблонов, наследования и т. п.), можно воспользоваться макросом &lt;code&gt;SIMPLE_UDF(udfName, signature)&lt;/code&gt; (находится в &lt;code&gt;udf_helpers.h&lt;/code&gt;). &lt;code&gt;signature&lt;/code&gt; задается в виде &lt;code&gt;returnType(arg1, arg2, ..., argN)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Пример использования:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs cpp\"&gt;&lt;span class=\"hljs-built_in\"&gt;SIMPLE_UDF&lt;/span&gt;(TAbs, &lt;span class=\"hljs-built_in\"&gt;ui64&lt;/span&gt;(i64)) {\n    i64 input = args[&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;].&lt;span class=\"hljs-built_in\"&gt;Get&lt;/span&gt;&amp;lt;i64&amp;gt;();\n    ui64 result = &lt;span class=\"hljs-built_in\"&gt;static_cast&lt;/span&gt;&amp;lt;ui64&amp;gt;(input &amp;gt;= &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt; ? input : -input);\n    &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;TUnboxedValue&lt;/span&gt;(result);\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"110\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-110\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-110\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-110.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Функция будет зарегистрирована под именем &lt;code&gt;Abs&lt;/code&gt;, аргумент типа &lt;code&gt;i64&lt;/code&gt;, результат — &lt;code&gt;ui64&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Пример, когда успех не гарантируется:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs cpp\"&gt;&lt;span class=\"hljs-built_in\"&gt;SIMPLE_UDF&lt;/span&gt;(TParseDuration, &lt;span class=\"hljs-built_in\"&gt;TOptional&lt;/span&gt;&amp;lt;ui64&amp;gt;(&lt;span class=\"hljs-type\"&gt;char&lt;/span&gt;*)) {\n    TDuration result;\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; input = args[&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;].&lt;span class=\"hljs-built_in\"&gt;AsStringRef&lt;/span&gt;();\n    &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; success = TDuration::&lt;span class=\"hljs-built_in\"&gt;TryParse&lt;/span&gt;(input, result);\n    &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; success ? TUnboxedValue::&lt;span class=\"hljs-built_in\"&gt;Optional&lt;/span&gt;(result.&lt;span class=\"hljs-built_in\"&gt;Seconds&lt;/span&gt;()) : &lt;span class=\"hljs-built_in\"&gt;TUnboxedValue&lt;/span&gt;();\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"117\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-117\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-117\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-117.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Под &lt;code&gt;Optional (type)&lt;/code&gt; (&lt;a href=\"ru/yql/types/optional.html\"&gt;тип, допускающий значение NULL&lt;/a&gt;) подразумевается возможность отсутствия значения указанного типа, например в случае какой-то ошибки. Из SQL такого типа наличие в результате  можно проверить с помощью конструкции &lt;code&gt;IS [NOT] NULL&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"iudfmodule-udfregistratorh\"&gt;&lt;a href=\"ru/yql/udf/cpp.html#iudfmodule-udfregistratorh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;IUdfModule (udfregistrator.h)&lt;/span&gt;&lt;/a&gt;IUdfModule (udf_registrator.h)&lt;/h3&gt;\n&lt;p&gt;Для типовых модулей можно воспользоваться макросом &lt;code&gt;SIMPLE_MODULE(moduleName, udfs...)&lt;/code&gt; (находится в &lt;code&gt;udf_helpers.h&lt;/code&gt;):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Первым аргументом — имя класса-модуля, при регистрации префикс &lt;code&gt;T&lt;/code&gt; и суффикс &lt;code&gt;Module&lt;/code&gt; будут отброшены.&lt;/li&gt;\n&lt;li&gt;Далее — список из N входящих в него UDF, при регистрации которых будет отброшен только префикс &lt;code&gt;T&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Таким образом, в примере &lt;code&gt;SIMPLE_MODULE(TFooModule, TBar, TBaz)&lt;/code&gt; после регистрации (о которой ниже) из YQL будет доступен модуль &lt;code&gt;Foo&lt;/code&gt; с двумя UDF — &lt;code&gt;Bar&lt;/code&gt; и &lt;code&gt;Baz&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"realizaciya-modulya-vruchnuyu\"&gt;&lt;a href=\"ru/yql/udf/cpp.html#realizaciya-modulya-vruchnuyu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Реализация модуля вручную&lt;/span&gt;&lt;/a&gt;Реализация модуля вручную&lt;/h4&gt;\n&lt;p&gt;Класс типичного модуля наследуется от IUdfModule и должен реализовать два метода:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;GetAllFunctionNames&lt;/code&gt; — в переданном &lt;code&gt;IFunctionNamesSink&lt;/code&gt; нужно вызвать метод &lt;code&gt;Add(name)&lt;/code&gt; для каждой из UDF, входящей в модуль.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;BuildFunctionTypeInfo&lt;/code&gt; — по переданному имени UDF и Type Config нужно на переданном &lt;code&gt;IFunctionTypeInfoBuilder&lt;/code&gt; вызвать:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Args()-&amp;gt;Add&amp;lt;ui32&amp;gt;()[-&amp;gt;Add(foo)-&amp;gt;Add...].Done()&lt;/code&gt;:\n&lt;ul&gt;\n&lt;li&gt;для указания аргументов и их типов, для чисел и строк тип аргумента можно указать шаблоном;&lt;/li&gt;\n&lt;li&gt;сложный тип вроде Struct/Dict/etc можно описать с помощью одноименного метода &lt;code&gt;IFunctionTypeInfoBuilder&lt;/code&gt;, затем передав его в аргумент &lt;code&gt;Add&lt;/code&gt;, пример:&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs cpp\"&gt;ui32 a = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\nui32 b = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; foo = builder.&lt;span class=\"hljs-built_in\"&gt;Struct&lt;/span&gt;()-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;AddField&lt;/span&gt;&amp;lt;&lt;span class=\"hljs-type\"&gt;char&lt;/span&gt;*&amp;gt;(&lt;span class=\"hljs-string\"&gt;\"A\"&lt;/span&gt;, &amp;amp;a).&lt;span class=\"hljs-built_in\"&gt;AddField&lt;/span&gt;&amp;lt;ui32&amp;gt;(&lt;span class=\"hljs-string\"&gt;\"B\"&lt;/span&gt;, &amp;amp;b).&lt;span class=\"hljs-built_in\"&gt;Build&lt;/span&gt;();\nbuilder.&lt;span class=\"hljs-built_in\"&gt;Args&lt;/span&gt;()-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Add&lt;/span&gt;(foo);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"179\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-179\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-179\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-179.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;При описании типов наподобие &lt;code&gt;builder.List()-&amp;gt;...&lt;/code&gt; следует максимально внимательно копировать чужие примеры, так как часто вызов цепочки методов билдера в неправильной последовательности или с неправильными аргументами нормально компилируется, но в рантайме падает в корку с нетривиальным бектрейсом. Пример такой цепочки:&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs cpp\"&gt;&lt;span class=\"hljs-comment\"&gt;// udf returns list of lists of char*&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; retType = buider.&lt;span class=\"hljs-built_in\"&gt;List&lt;/span&gt;()-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Item&lt;/span&gt;(builder.&lt;span class=\"hljs-built_in\"&gt;List&lt;/span&gt;()-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Item&lt;/span&gt;&amp;lt;&lt;span class=\"hljs-type\"&gt;char&lt;/span&gt;*&amp;gt;().&lt;span class=\"hljs-built_in\"&gt;Build&lt;/span&gt;()).&lt;span class=\"hljs-built_in\"&gt;Build&lt;/span&gt;(); &lt;span class=\"hljs-comment\"&gt;// Correct&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; retType = buider.&lt;span class=\"hljs-built_in\"&gt;List&lt;/span&gt;()-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Item&lt;/span&gt;&amp;lt;&lt;span class=\"hljs-type\"&gt;char&lt;/span&gt;*&amp;gt;().&lt;span class=\"hljs-built_in\"&gt;Build&lt;/span&gt;(); &lt;span class=\"hljs-comment\"&gt;// Wrong type, coredump with backtrace in casting to string deep in validating&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; retType = buider.&lt;span class=\"hljs-built_in\"&gt;List&lt;/span&gt;()-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Build&lt;/span&gt;(); &lt;span class=\"hljs-comment\"&gt;// No type at all, coredump with attempt to dereference nullptr deep in type machinery&lt;/span&gt;\nbuilder.&lt;span class=\"hljs-built_in\"&gt;Returns&lt;/span&gt;(retType);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"187\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-187\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-187\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-187.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;Также в аргументах передается битовая маска &lt;code&gt;ui32 flags&lt;/code&gt;, в которой на момент написания может присутствовать только &lt;code&gt;(cpp)TFlags::TypesOnly&lt;/code&gt;, при наличии которого не обязательно вызвать &lt;code&gt;builder.Implementation(new TMyUdf);&lt;/code&gt; для UDF, соответствующей переданному имени.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"iregistrator-udfregistratorh\"&gt;&lt;a href=\"ru/yql/udf/cpp.html#iregistrator-udfregistratorh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;IRegistrator (udfregistrator.h)&lt;/span&gt;&lt;/a&gt;IRegistrator (udf_registrator.h)&lt;/h3&gt;\n&lt;p&gt;Для упрощенной регистрации модуля в системе рекомендуется использовать макрос:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs cpp\"&gt;&lt;span class=\"hljs-built_in\"&gt;REGISTER_MODULES&lt;/span&gt;(\n    TFooModule,\n    TBarModule&amp;lt;&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;&amp;gt;,\n    TBarModule&amp;lt;&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;&amp;gt;\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"201\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-201\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-201\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-201.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Имя модуля в этом случае берется из метода &lt;code&gt;Name()&lt;/code&gt;, который должен вернуть &lt;code&gt;TStringRef&lt;/code&gt; по значению, макрос &lt;code&gt;SIMPLE_MODULE&lt;/code&gt; создает его автоматически.&lt;/p&gt;\n&lt;h4 id=\"alternativnyj-variant-dlya-prodvinutyh-polzovatelej\"&gt;&lt;a href=\"ru/yql/udf/cpp.html#alternativnyj-variant-dlya-prodvinutyh-polzovatelej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Альтернативный вариант для продвинутых пользователей&lt;/span&gt;&lt;/a&gt;Альтернативный вариант для продвинутых пользователей&lt;/h4&gt;\n&lt;p&gt;Нужно объявить функцию &lt;code&gt;Register&lt;/code&gt; следующего вида и в переданном интерфейсе зарегистрировать модуль(-и), а также экспортировать версию ABI:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs cpp\"&gt;&lt;span class=\"hljs-keyword\"&gt;extern&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"C\"&lt;/span&gt; &lt;span class=\"hljs-function\"&gt;YQL_UDF_API &lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;Register&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(NKikimr::NUdf::IRegistrator&amp;amp; registrator, ui32 flags)&lt;/span&gt;\n&lt;/span&gt;{\n     registrator-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;AddModule&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"Foo\"&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;new&lt;/span&gt; NDetail::&lt;span class=\"hljs-built_in\"&gt;TFooModule&lt;/span&gt;(flags));\n}\n\n&lt;span class=\"hljs-keyword\"&gt;extern&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"C\"&lt;/span&gt; &lt;span class=\"hljs-function\"&gt;YQL_UDF_API ui32 &lt;span class=\"hljs-title\"&gt;AbiVersion&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;()&lt;/span&gt;\n&lt;/span&gt;{\n    &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;CurrentAbiVersion&lt;/span&gt;();\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"211\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-211\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-211\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-211.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Список флагов перечислен в &lt;code&gt;IUdfModule::TFlags&lt;/code&gt;. На момент написания реализован только &lt;code&gt;TypesOnly&lt;/code&gt;, который используется как указание на то, что реальных вычислений пока производиться не будет, так как ещё идет построение графа вычислений, и на данном этапе нужны только сигнатуры функций.&lt;/p&gt;\n&lt;h3 id=\"obrabotka-isklyuchenij/oshibok\"&gt;&lt;a href=\"ru/yql/udf/cpp.html#obrabotka-isklyuchenij/oshibok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обработка исключений/ошибок&lt;/span&gt;&lt;/a&gt;Обработка исключений/ошибок&lt;/h3&gt;\n&lt;p&gt;Чтобы возвращать пользователю фатальные исключения, нужно использовать следующую конструкцию:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs cpp\"&gt;&lt;span class=\"hljs-keyword\"&gt;try&lt;/span&gt; {\n   ...\n} &lt;span class=\"hljs-built_in\"&gt;catch&lt;/span&gt; (&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; std::exception&amp;amp; e) {\n    &lt;span class=\"hljs-built_in\"&gt;UdfTerminate&lt;/span&gt;(e.&lt;span class=\"hljs-built_in\"&gt;what&lt;/span&gt;());\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"221\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-221\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-221\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-221.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Вместо &lt;code&gt;e.what()&lt;/code&gt; можно написать человекочитаемое описание ошибки, если это возможно.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Завершать выполнение программы целиком с помощью &lt;code&gt;abort&lt;/code&gt;, &lt;code&gt;exit&lt;/code&gt;, &lt;code&gt;Y_ABORT_UNLESS&lt;/code&gt;, &lt;code&gt;Y_ABORT&lt;/code&gt; и подобных механизмов из кода UDF крайне не рекомендуется, так как это ограничит область её применения только теми окружениями, где под каждый расчет создается отдельный процесс. Реализация &lt;code&gt;UdfTerminate&lt;/code&gt; знает о текущем окружении и вызовет ожидаемый им механизм обработки ошибок.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/udf/cpp.md","sourcePath":"ru/yql/udf/cpp.md"},"headings":[{"title":"Введение","href":"ru/yql/udf/cpp.html#vvedenie","level":2},{"title":"Терминология","href":"ru/yql/udf/cpp.html#terminologiya","level":2},{"title":"Примеры","href":"ru/yql/udf/cpp.html#primery","level":2},{"title":"Интерфейсы (С++)","href":"ru/yql/udf/cpp.html#interfejsy-s","level":2,"items":[{"title":"TUnboxedValue (udf_value.h)","href":"ru/yql/udf/cpp.html#tunboxedvalue-udfvalueh","level":3},{"title":"TUnboxedValuePod(udf_value.h)","href":"ru/yql/udf/cpp.html#tunboxedvaluepodudfvalueh","level":3},{"title":"IValueBuilder (udf_value_builder.h)","href":"ru/yql/udf/cpp.html#ivaluebuilder-udfvaluebuilderh","level":3},{"title":"TBoxedValue (udf_value.h)","href":"ru/yql/udf/cpp.html#tboxedvalue-udfvalueh","level":3},{"title":"IUdfModule (udf_registrator.h)","href":"ru/yql/udf/cpp.html#iudfmodule-udfregistratorh","level":3,"items":[{"title":"Реализация модуля вручную","href":"ru/yql/udf/cpp.html#realizaciya-modulya-vruchnuyu","level":4}]},{"title":"IRegistrator (udf_registrator.h)","href":"ru/yql/udf/cpp.html#iregistrator-udfregistratorh","level":3,"items":[{"title":"Альтернативный вариант для продвинутых пользователей","href":"ru/yql/udf/cpp.html#alternativnyj-variant-dlya-prodvinutyh-polzovatelej","level":4}]},{"title":"Обработка исключений/ошибок","href":"ru/yql/udf/cpp.html#obrabotka-isklyuchenij/oshibok","level":3}]}],"title":"Разработка UDF на C++"},"router":{"pathname":"ru/yql/udf/cpp","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
