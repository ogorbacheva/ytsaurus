            {"data":{"leading":false,"html":"&lt;h2 id=\"vvedenie\"&gt;&lt;a href=\"ru/yql/udf/python.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h2&gt;\n&lt;p&gt;Не все задачи хорошо укладываются в полностью декларативное описание результата в стиле SQL. Зачастую удобнее декларативно выразить, над какими данными выполнить join и как сгруппировать, а прикладную логику обработки фрагментов данных описать в императивном стиле. Для этого сценария использования YQL предоставляет механизм написания и вызова пользовательских функций (UDF) на Python 3.6 или Python 2.7.&lt;/p&gt;\n&lt;h2 id=\"opredelenie-i-vyzov-udf\"&gt;&lt;a href=\"ru/yql/udf/python.html#opredelenie-i-vyzov-udf\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение и вызов UDF&lt;/span&gt;&lt;/a&gt;Определение и вызов UDF&lt;/h2&gt;\n&lt;p&gt;Чтобы использовать UDF на Python в YQL запросе, нужно выполнить три шага:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Передать в запрос строку, содержащую скрипт на Python, в котором определена функция, которая будет вызвана в качестве UDF;&lt;/li&gt;\n&lt;li&gt;Объявить в запросе имя и сигнатуру функции (типы принимаемых и возвращаемых значений);&lt;/li&gt;\n&lt;li&gt;Вызвать функцию в теле запроса и передать ей аргументы.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;В последующих разделах каждый из трех шагов описан подробно.&lt;/p&gt;\n&lt;h3 id=\"stroka,-soderzhashaya-skript-na-python\"&gt;&lt;a href=\"ru/yql/udf/python.html#stroka,-soderzhashaya-skript-na-python\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Строка, содержащая скрипт на Python&lt;/span&gt;&lt;/a&gt;Строка, содержащая скрипт на Python&lt;/h3&gt;\n&lt;p&gt;Скрипт можно задать тремя способами:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Обыкновенный строковый литерал. Например: &lt;code&gt;\"def foo(): return 'bar'\"&lt;/code&gt;. Этот вариант неудобен для сложных многострочных скриптов.&lt;/li&gt;\n&lt;li&gt;Многострочный строковый литерал (расширение YQL). Такой литерал ограничивается символами &lt;code&gt;@@&lt;/code&gt; и работает примерно как тройные кавычки в Python, а комментарий &lt;code&gt;#py&lt;/code&gt; включает в редакторе YQL подсветку синтаксиса языка Python:\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;@@#py\ndef foo():\n    return b'bar'\n@@\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"48\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-48\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-48\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-48.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;Приложенный к запросу именованный файл. Содержимое файла скрипта встраивается в запрос с помощью функции &lt;code&gt;FileContent(\"foo.py\")&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n\n&lt;h3 id=\"obuyavlenie-imeni-i-signatury-funkcii\"&gt;&lt;a href=\"ru/yql/udf/python.html#obuyavlenie-imeni-i-signatury-funkcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Объявление имени и сигнатуры функции&lt;/span&gt;&lt;/a&gt;Объявление имени и сигнатуры функции&lt;/h3&gt;\n&lt;p&gt;Так как Python является динамически типизированным языком, а YQL — статически типизированным, необходим способ зафиксировать типы на их стыке.&lt;br /&gt;\n&lt;strong&gt;Имя и сигнатура&lt;/strong&gt; вызываемой из Python-скрипта функции должны быть известны заранее до выполнения YQL запроса. Потенциальное несоответствие объявленной сигнатуры и возвращаемых из указанной функции данных приведет к ошибке времени исполнения (runtime error) в ходе выполнения запроса, то есть лежит на совести пользователя.&lt;br /&gt;\nЕсть три способа указания &lt;strong&gt;сигнатуры&lt;/strong&gt; функции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;в самом запросе;&lt;/li&gt;\n&lt;li&gt;в виде аннотации аргументов и выходного значения (только для Python 3);&lt;/li&gt;\n&lt;li&gt;в виде docstring в Python функции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Так как в YQL небезопасно запускать произвольный Python код, второй и третий варианты требуют запуска отдельной Map операции на YT, что занимает порядка 30-60 секунд.&lt;/p&gt;\n&lt;p&gt;Вызов отдельной функции из тела скрипта, а не запуск скрипта целиком, реализован, чтобы обеспечить возможность вернуть в UDF не только строковое значение, но более сложные типы данных (подробнее о типах данных см. ниже). Поэтому популярный в консольных утилитах на Python подход &lt;code&gt;if __name__ == '__main__': ...&lt;/code&gt; здесь не подходит, так как в этом случае возвращаемое значение можно получить только через стандартный вывод (stdout) скрипта.&lt;/p&gt;\n&lt;p&gt;&lt;/p&gt;\n&lt;p&gt;Синтаксис объявления имени и сигнатуры функции рассмотрим на примере:&lt;br /&gt;\n&lt;code&gt;$f = Python3::foo(Callable&amp;lt;()-&amp;gt;String&amp;gt;, $script);&lt;/code&gt;&lt;br /&gt;\nГде&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;$f&lt;/code&gt; и &lt;code&gt;$script&lt;/code&gt; — &lt;a href=\"ru/yql/syntax/expressions.html#named-nodes\"&gt;именованные выражения YQL&lt;/a&gt;. В данном примере значения выражений:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;$f&lt;/code&gt; — готовая к использованию в запросе функция (содержит имя функции, ее сигнатуру и тело скрипта);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;$script&lt;/code&gt; — заданное одним из описанных в предыдущем разделе способов тело скрипта на Python.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Python3::&lt;/code&gt; — фиксированное пространство имен (namespace) для функций на Python версии 3.x; нужно, чтобы отличать эту конструкцию от UDF на других интерпретируемых языках или на C++. Также доступен алиас &lt;code&gt;Python::&lt;/code&gt;. Для использования Python 2.7 необходимо указывать &lt;code&gt;Python2::&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;foo&lt;/code&gt; — имя функции внутри скрипта &lt;code&gt;$script&lt;/code&gt;, которая будет вызываться.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Callable&amp;lt;()-&amp;gt;String&amp;gt;&lt;/code&gt; — описание сигнатуры функции. В данном случае пустые скобки означают отсутствие аргументов, а String после стрелки — строковый результат. Пример сигнатуры функции с аргументами: &lt;code&gt;Callable&amp;lt;(String, Uint32)-&amp;gt;Double&amp;gt;&lt;/code&gt;. &lt;a href=\"ru/yql/types/type_string.html\"&gt;Подробная документация о формате описания типов данных&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;На правах альтернативы вместо строки с описанием сигнатуры функции можно передать сам тип вызываемого выражения, составленный через &lt;a href=\"ru/yql/builtins/types.html\"&gt;функции для работы с типами данных&lt;/a&gt;. Как правило, этот вариант удобнее, если в запросе используется несколько функций, оперирующих одинаковыми сложными типами данных, или если сложный тип данных может быть получен через &lt;a href=\"ru/yql/builtins/types.html#typeof\"&gt;TypeOf&lt;/a&gt; от колонки или строки таблицы.&lt;/p&gt;\n&lt;p&gt;Если опустить описание сигнатуры функции, то YQL будет извлекать ее либо из аннотаций, либо из начала docstring функции до первой пустой строки или завершения docstring.&lt;/p&gt;\n&lt;p&gt;При описании функции с аннотациями должны быть аннотированы все аргументы и выходное значение, нельзя использовать &lt;code&gt;*args&lt;/code&gt; и &lt;code&gt;**kwargs&lt;/code&gt;, а значениями по умолчанию могут быть только &lt;code&gt;None&lt;/code&gt;, при этом соответствующие типы аргументов должны быть &lt;code&gt;Optional&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"annotacii-tipov\"&gt;&lt;a href=\"ru/yql/udf/python.html#annotacii-tipov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аннотации типов&lt;/span&gt;&lt;/a&gt;Аннотации типов&lt;/h3&gt;\n&lt;p&gt;В аннотациях типов в Python 3 должны использоваться типы из модуля &lt;code&gt;yql.typing&lt;/code&gt; - &lt;a href=\"ru/yql/types/primitive.html\"&gt;примитивные типы&lt;/a&gt; и, в основном, одноименные функции-конструкторы типов из &lt;a href=\"ru/yql/types/type_string.html\"&gt;текстового описания типа&lt;/a&gt; за исключением того, что из-за ограничений Python вместо угловых скобок используются квадратные.&lt;/p&gt;\n&lt;p&gt;Для задания типов &lt;code&gt;кортежа&lt;/code&gt; или &lt;code&gt;структуры&lt;/code&gt; без элементов используются аннотации &lt;code&gt;EmptyTuple&lt;/code&gt; и &lt;code&gt;EmptyStruct&lt;/code&gt; соответственно.&lt;/p&gt;\n&lt;p&gt;Для описания типа вызываемого значения используется аннотация &lt;code&gt;Callable&lt;/code&gt;, в которой в квадратных скобках передается число опциональных аргментов, тип выходного значения и описания аргументов. Описание аргумента это либо тип, либо &lt;code&gt;slice&lt;/code&gt; в форме &lt;code&gt;имя-аргумента:тип:флаги&lt;/code&gt;. Если не нужно задавать имя аргументу, то следует использовать пустую строку. Можно опускать последний компонент &lt;code&gt;slice&lt;/code&gt;-а, но, если он задан, то должен быть &lt;code&gt;set&lt;/code&gt;-ом флагов. В настоящее время возможным значением флага может быть только &lt;code&gt;AutoMap&lt;/code&gt;. Если нужно задать флаги или имя для аргумента самой UDF, в аннотации указывается объект &lt;code&gt;slice&lt;/code&gt; в такой же форме.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Пример использования аннотаций:&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$script = @@#py\nfrom yql.typing import *\n\n\ndef foo(\n    x:Optional[Int32],\n    y:Struct['a':Int32, 'b':Int32],\n    z:slice(\"name\", Int32, {AutoMap})) -&amp;gt; Optional[Int32]:\n    \"\"\"\n       foo function description\n    \"\"\"\n    return x + y.a + z\n@@;\n\n$udf = Python3::foo($script);\nSELECT $udf(1, AsStruct(2 AS a, 3 AS b), 10 AS name); -- 13\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"150\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-150\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-150\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-150.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;strong&gt;Пример использования docstring:&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$script = @@#py\ndef foo():\n    \"\"\"\n       ()-&amp;gt;String\n\n       foo function description\n    \"\"\"\n    return b\"bar\"\n@@;\n\n$udf = Python3::foo($script);\nSELECT $udf(); -- bar\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"154\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-154\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-154\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-154.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"vyzov-udf-v-zaprose\"&gt;&lt;a href=\"ru/yql/udf/python.html#vyzov-udf-v-zaprose\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов UDF в запросе&lt;/span&gt;&lt;/a&gt;Вызов UDF в запросе&lt;/h3&gt;\n&lt;p&gt;Полученную после объявления сигнатуры функцию можно вызывать так же, как и любую встроенную функцию YQL, передавая аргументы в круглых скобках. Например: &lt;code&gt;$f()&lt;/code&gt; или &lt;code&gt;$udf(\"test\", 123)&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"tipy-dannyh\"&gt;&lt;a href=\"ru/yql/udf/python.html#tipy-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типы данных&lt;/span&gt;&lt;/a&gt;Типы данных&lt;/h2&gt;\n&lt;h3 id=\"prostye-data-type\"&gt;&lt;a href=\"ru/yql/udf/python.html#prostye-data-type\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Простые (Data type)&lt;/span&gt;&lt;/a&gt;Простые (Data type)&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"ru/yql/types/primitive.html\"&gt;Простые типы данных&lt;/a&gt;&lt;/p&gt;\n&lt;h3 id=\"tipy,-dopuskayushie-znachenie-null\"&gt;&lt;a href=\"ru/yql/udf/python.html#tipy,-dopuskayushie-znachenie-null\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типы, допускающие значение NULL&lt;/span&gt;&lt;/a&gt;Типы, допускающие значение NULL&lt;/h3&gt;\n&lt;p&gt;В YQL столбцы таблиц, да и просто любые значения, бывают как гарантированно имеющие значение, так и &lt;a href=\"ru/yql/types/optional.html\"&gt;потенциально пустые&lt;/a&gt; (в терминах SQL — nullable, допускающие значение &lt;code&gt;NULL&lt;/code&gt;). Функции в YQL, в том числе и на Python, в своей сигнатуре должны объявить, умеют ли они обрабатывать потенциально пустые входные значения, и нужна ли им возможность вернуть пустое значение (то есть &lt;code&gt;NULL&lt;/code&gt;, он же «пустой Optional»).&lt;/p&gt;\n&lt;p&gt;При указании сигнатуры для UDF на Python тип, допускающий значение &lt;code&gt;NULL&lt;/code&gt;, обозначается добавлением к имени типа суффикса &lt;code&gt;?&lt;/code&gt;, например &lt;code&gt;String?&lt;/code&gt; или &lt;code&gt;Double?&lt;/code&gt;. Для Python пустые значения (&lt;code&gt;NULL&lt;/code&gt;) соответствуют &lt;code&gt;None&lt;/code&gt; в аргументе или в возвращаемом значении функции.&lt;/p&gt;\n&lt;p&gt;Если аргумент помечен как допускающий значение &lt;code&gt;NULL&lt;/code&gt; (Optional/Nullable), это &lt;strong&gt;не означает&lt;/strong&gt;, что при вызове функции его можно не указывать.&lt;/p&gt;\n&lt;p&gt;Необязательные аргументы при описании сигнатуры функции указываются в квадратных скобках после обязательных. В качестве значений всех не указанных при вызове функции необязательных аргументов для Python будет передано &lt;code&gt;None&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Например, если аргументы функции объявлены так: &lt;code&gt;(String, [Int32?, Bool?])&lt;/code&gt;, это означает, что функция принимает три аргумента — обязательный типа String и два необязательных типа Int32 и Bool соответственно.&lt;/p&gt;\n&lt;h3 id=\"kontejnery\"&gt;&lt;a href=\"ru/yql/udf/python.html#kontejnery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Контейнеры&lt;/span&gt;&lt;/a&gt;Контейнеры&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Название&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Объявление сигнатуры&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Пример сигнатуры&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Как представлен в Python&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Список&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;List&amp;lt;Type&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;List&amp;lt;Int32&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list-like object&lt;/code&gt; &lt;a href=\"ru/yql/udf/python.html#python-container-wrappers\"&gt;(подробнее)&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Словарь&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Dict&amp;lt;KeyType,ValueType&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Dict&amp;lt;String,Int32&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;dict-like object&lt;/code&gt; &lt;a href=\"ru/yql/udf/python.html#python-container-wrappers\"&gt;(подробнее)&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Множество&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Set&amp;lt;KeyType&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Set&amp;lt;String&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;dict-like object&lt;/code&gt; &lt;a href=\"ru/yql/udf/python.html#python-container-wrappers\"&gt;(подробнее)&lt;/a&gt;, тип значения - &lt;code&gt;yql.Void&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Кортеж&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Tuple&amp;lt;Type1,...,TypeN&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Tuple&amp;lt;Int32,Int32&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tuple&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Структура&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Struct&amp;lt;Name1:Type1,...,NameN:TypeN&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Struct&amp;lt;Name:String,Age:Int32&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Python2 : &lt;code&gt;object&lt;/code&gt; /  Python3 : &lt;code&gt;StructSequence&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Поток&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Stream&amp;lt;Type&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Stream&amp;lt;Int32&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;generator&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Вариант над кортежем&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Variant&amp;lt;Type1,Type2&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Variant&amp;lt;Int32,String&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tuple с индексом и объектом&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Вариант над структурой&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Variant&amp;lt;Name1:Type1,Name2:Type2&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Variant&amp;lt;value:Int32,error:String&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tuple с именем поля и объектом&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Перечисление&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Enum&amp;lt;Name1, Name2&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Enum&amp;lt;Foo,Bar&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tuple с именем поля и yql.Void&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;При необходимости, контейнеры можно вкладывать друг в друга, например &lt;code&gt;List&amp;lt;Tuple&amp;lt;Int32,Int32&amp;gt;&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"specialnye-tipy\"&gt;&lt;a href=\"ru/yql/udf/python.html#specialnye-tipy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Специальные типы&lt;/span&gt;&lt;/a&gt;Специальные типы&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Callable&lt;/strong&gt; — вызываемое значение, которое можно исполнить, передав аргументы через круглые скобки в SQL-синтаксисе или через Apply в s-expressions. Так как сигнатура вызываемых выражений должна быть статически известна, то все Python UDF, возвращающие вызываемые значения, должны указывать и их сигнатуру. Например, &lt;code&gt;(Double)-&amp;gt;(Bool)-&amp;gt;Int64&lt;/code&gt; — UDF принимает на вход Double, а возвращает вызываемое значение с сигнатурой &lt;code&gt; (Bool)-&amp;gt;Int64&lt;/code&gt;. При необходимости таким образом можно выстраивать и более длинные цепочки вызываемых значений.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Resource&lt;/strong&gt; — непрозрачный указатель на некий ресурс, который можно передавать между пользовательскими функциями. Тип возвращаемого и принимаемого ресурса объявляется внутри функции строковой меткой, которая используется, чтобы сопоставив их заранее предотвратить передачу ресурсов между несовместимыми функциями. В C++ UDF имя ресурса можно задавать, а для Python UDF сейчас доступно только фиксированное имя ресурса — &lt;code&gt;Python2&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Void&lt;/strong&gt; — отсутствие какого-либо другого типа; является типом литерала &lt;code&gt;NULL&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"avtomaticheskoe-privedenie-tipov-pri-vzaimodejstvii-s-python-udf\"&gt;&lt;a href=\"ru/yql/udf/python.html#avtomaticheskoe-privedenie-tipov-pri-vzaimodejstvii-s-python-udf\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Автоматическое приведение типов при взаимодействии с Python UDF&lt;/span&gt;&lt;/a&gt;Автоматическое приведение типов при взаимодействии с Python UDF&lt;/h2&gt;\n&lt;p&gt;На входе:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;String&lt;/code&gt;,&lt;code&gt;Yson&lt;/code&gt; в &lt;code&gt;bytes&lt;/code&gt; (&lt;code&gt;str&lt;/code&gt; для Python 2);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Utf8&lt;/code&gt;,&lt;code&gt;Json&lt;/code&gt; в &lt;code&gt;str&lt;/code&gt; (&lt;code&gt;unicode&lt;/code&gt; для Python 2);&lt;/li&gt;\n&lt;li&gt;объект типа &lt;code&gt;Void&lt;/code&gt;: в &lt;code&gt;yql.Void&lt;/code&gt; (нужен &lt;code&gt;import yql&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;На выходе:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;long/int&lt;/code&gt; в &lt;code&gt;Int8&lt;/code&gt;, &lt;code&gt;Int16&lt;/code&gt;, &lt;code&gt;Int32&lt;/code&gt;, &lt;code&gt;Int64&lt;/code&gt;, &lt;code&gt;Uint8&lt;/code&gt;, &lt;code&gt;Uint16&lt;/code&gt;, &lt;code&gt;Uint32&lt;/code&gt;, &lt;code&gt;Uint64&lt;/code&gt;, &lt;code&gt;Float&lt;/code&gt;, &lt;code&gt;Double&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;float&lt;/code&gt; в &lt;code&gt;Float&lt;/code&gt;, &lt;code&gt;Double&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;str&lt;/code&gt; (&lt;code&gt;unicode&lt;/code&gt; в Python 2) в &lt;code&gt;String&lt;/code&gt;, &lt;code&gt;Utf8&lt;/code&gt;, &lt;code&gt;Yson&lt;/code&gt;, &lt;code&gt;Json&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;bytes&lt;/code&gt; (&lt;code&gt;str&lt;/code&gt; в Python 2) в &lt;code&gt;String&lt;/code&gt;, &lt;code&gt;Yson&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;dict&lt;/code&gt; или объект в &lt;code&gt;Struct&amp;lt;...&amp;gt;&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;tuple&lt;/code&gt; в &lt;code&gt;List&amp;lt;...&amp;gt;&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;любой объект в &lt;code&gt;Bool&lt;/code&gt; по &lt;a href=\"https://docs.python.org/3/library/stdtypes.html?#truth-value-testing\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;правилам Python&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;генераторы, итераторы и iterable-объекты в &lt;code&gt;Stream&amp;lt;...&amp;gt;&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;iterable-объекты в ленивые &lt;code&gt;List&amp;lt;...&amp;gt;&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Основные представления контейнеров см. в таблице выше.&lt;/p&gt;\n&lt;p&gt;Существует возможность настроить автоматическую распаковку Yson на границах UDF с помощью свойства &lt;code&gt;_yql_convert_yson&lt;/code&gt; на Python функции, в которое надо положить кортеж с функциями для десериализации и сериализации.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Пример:&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$script = @@#py\nimport cyson\n\ndef f(s):\n    abc = s.get(b\"abc\", 0)\n    return (abc, s)\n\nf._yql_convert_yson = (cyson.loads, cyson.dumps)\n@@;\n\n$udf = Python3::f(Callable&amp;lt;(Yson?)-&amp;gt;Tuple&amp;lt;Int64,Yson?&amp;gt;&amp;gt;, $script);\n\nSELECT $udf(CAST(@@{\"abc\"=1}@@ as Yson));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"442\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-442\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-442\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-442.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;/p&gt;\n&lt;p&gt;Строка в Python 3 соответствует типу &lt;code&gt;Utf8&lt;/code&gt; в YQL, а тип &lt;code&gt;String&lt;/code&gt; соответствует &lt;code&gt;bytes&lt;/code&gt; в Python 3.&lt;/p&gt;\n&lt;p&gt;Несоблюдение этого правила может приводить к непонятному и ошибочному, на первый взгляд, поведению во многих ситуациях, например:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$script = @@#py\ndef getDict():\n    return {'Key': 123}\n@@;\n$utfDict = Python::getDict(Callable&amp;lt;()-&amp;gt; Dict&amp;lt;Utf8, Int32&amp;gt;&amp;gt;,  $script);\n$strDict = Python::getDict(Callable&amp;lt;()-&amp;gt; Dict&amp;lt;String, Int32&amp;gt;&amp;gt;, $script);\nSELECT $utfDict()['Key'] AS good, $strDict()['Key'] AS bad, $strDict() AS strange;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"452\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-452\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-452\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-452.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В Python2 различий между текстовой строкой и байтовой последовальностью по сути не было.&lt;/p&gt;\n&lt;p&gt;&lt;/p&gt;\n&lt;h2 id=\"python-struct-fields\"&gt;&lt;a href=\"ru/yql/udf/python.html#python-struct-fields\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Получение списка полей структуры&lt;/span&gt;&lt;/a&gt;Получение списка полей структуры&lt;/h2&gt;\n&lt;p&gt;В некоторых случаях удобно вместо обращения к полям структуры через точку написать цикл по всем полям, используя &lt;code&gt;getattr&lt;/code&gt; для доступа к значению полей. Этого можно добиться через доступ к &lt;code&gt;__class__.__match_args__&lt;/code&gt; на объекте структуры.&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$script = @@#py\ndef f(s):\n    return \",\".join(str(getattr(s,name)) for name in s.__class__.__match_args__)\n@@;\n\n$f = ($s)-&amp;gt;{\n    return Python::f(CallableType(0,Utf8,TypeOf($s)),$script)($s);\n};\n\nselect $f(&amp;lt;|a:\"foo\"u,b:\"bar\"u|&amp;gt;); -- \"foo,bar\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"468\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-468\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-468\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-468.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"python-container-wrappers\"&gt;&lt;a href=\"ru/yql/udf/python.html#python-container-wrappers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Особенности передаваемых в функции объектов для списков и словарей&lt;/span&gt;&lt;/a&gt;Особенности передаваемых в функции объектов для списков и словарей&lt;/h2&gt;\n&lt;p&gt;При передаче в Python UDF списков и словарей, в аргументы подаются не настоящие python-объекты типа list или dict, а специальные read-only объекты &lt;code&gt;yql.TList&lt;/code&gt; и &lt;code&gt;yql.TDict&lt;/code&gt;, которые позволяют избежать возможно не нужного полного копирования данных в памяти.&lt;/p&gt;\n&lt;p&gt;Особенности обоих объектов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Read-only: в них нельзя что-то поменять не скопировав, так как тем же объектом может пользоваться какая-то другая часть текущего запроса, например соседняя функция.&lt;/li&gt;\n&lt;li&gt;Ценой потенциально медленного копирования можно получить из них настоящий объект типа list (set, frozenset и пр. тоже возможны при необходимости), проитерировавшись для частичного копирования или выполнения каких-либо преобразований при копировании. Для словарей нужно дополнительно вызвать &lt;code&gt;iteritems()&lt;/code&gt;. Установив значение атрибута &lt;code&gt;_yql_lazy_input&lt;/code&gt; в False на самой python функции можно включить автоматическое копирование списков и словарей в list и dict, соответственно. Данный механизм работает рекурсивно для вложенных контейнеров, а также поддерживает и другие их виды, в частности Struct и Tuple.&lt;/li&gt;\n&lt;li&gt;Для получения количества элементов можно вызвать &lt;code&gt;len(my_arg)&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Нижеизложенные задокументированные наборы методов могут немного отставать от действительности, текущий набор можно узнать с помощью &lt;code&gt;dir(my_arg)&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Особенности &lt;code&gt;yql.TList&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Метод &lt;code&gt;has_fast_len()&lt;/code&gt; — узнать, можно ли быстро получить длину. Если вернулось False, то список «ленивый».&lt;/li&gt;\n&lt;li&gt;Метод &lt;code&gt;has_items()&lt;/code&gt; — проверка на пустоту.&lt;/li&gt;\n&lt;li&gt;Метод &lt;code&gt;reversed()&lt;/code&gt; — получить перевернутую копию списка.&lt;/li&gt;\n&lt;li&gt;Методы &lt;code&gt;skip(n)&lt;/code&gt; и &lt;code&gt;take(n)&lt;/code&gt; — аналоги срезов &lt;code&gt;[n:]&lt;/code&gt; и &lt;code&gt;[:n]&lt;/code&gt;, соответственно. При некорректном индексе (значении n) могут кидать исключение &lt;code&gt;IndexError&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Метод &lt;code&gt;to_index_dict()&lt;/code&gt; - получить словарь с номерами элементов в качестве ключей, что позволяет осуществлять случайный доступ. На самом объекте &lt;code&gt;yql.TList&lt;/code&gt; он запрещён.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;** Внимание! Данные особенности более не рекомендуются к использованию и будут удалены в будущих обновлениях.**&lt;br /&gt;\nДля организации произвольного доступа к списку теперь можно использовать стандартные для python методы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;list[index] - доступ по индексу&lt;/li&gt;\n&lt;li&gt;list[start:stop:step] - срез списка&lt;/li&gt;\n&lt;li&gt;reversed(list) - разворот списка&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Пример с _yql_lazy_input:&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$u = Python3::list_func(Callable&amp;lt;(List&amp;lt;Int32&amp;gt;)-&amp;gt;Int32&amp;gt;, @@#py\ndef list_func(lst):\n  return lst.count(1)\nlist_func._yql_lazy_input = False\n@@);\nSELECT $u(AsList(1,2,3));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"553\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-553\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-553\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-553.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"stoit-imet-v-vidu\"&gt;&lt;a href=\"ru/yql/udf/python.html#stoit-imet-v-vidu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стоит иметь в виду&lt;/span&gt;&lt;/a&gt;Стоит иметь в виду&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;При работе на YT стандартный вывод (stdout) используется для служебных целей, поэтому пользоваться им из UDF нельзя.&lt;/li&gt;\n&lt;li&gt;Всю тяжелую инициализацию стоит выполнять вне часто вызываемых функций, на уровне модуля или с использованием замыкания (&lt;a href=\"ru/yql/udf/python.html#separate-init-example\"&gt;см. пример ниже&lt;/a&gt;). В противном случае операция может не только занять неопределенно много времени, но и мешать соседям на MapReduce-кластере.&lt;/li&gt;\n&lt;li&gt;Из одного скрипта можно зарегистрировать несколько функций, повторив объявление имени и сигнатуры функции нужное количество раз.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"primery\"&gt;&lt;a href=\"ru/yql/udf/python.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h2&gt;\n&lt;h3 id=\"hello-world\"&gt;&lt;a href=\"ru/yql/udf/python.html#hello-world\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hello World&lt;/span&gt;&lt;/a&gt;Hello World&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$script = @@#py\ndef hello(name):\n    return b'Hello, %s!' % name\n@@;\n\n$udf = Python3::hello(Callable&amp;lt;(String)-&amp;gt;String&amp;gt;, $script);\n\nSELECT $udf(\"world\");\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"580\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-580\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-580\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-580.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"generatory-dlya-sozdaniya-spiskov\"&gt;&lt;a href=\"ru/yql/udf/python.html#generatory-dlya-sozdaniya-spiskov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Генераторы для создания списков&lt;/span&gt;&lt;/a&gt;Генераторы для создания списков&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$script = @@#py\ndef gen():\n    for x in range(1, 10):\n        yield x\n@@;\n$udf = Python::gen(Callable&amp;lt;()-&amp;gt;Stream&amp;lt;Int64&amp;gt;&amp;gt;, $script);\nSELECT Yql::Collect($udf());\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"584\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-584\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-584\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-584.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Можно использовать в сочетании с &lt;a href=\"ru/yql/syntax/process.html\"&gt;PROCESS&lt;/a&gt; для потоковой обработки таблиц, например:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$udf = Python::process(\nCallable&amp;lt;\n    (List&amp;lt;Struct&amp;lt;\n        age:Int64,\n        name:String?\n    &amp;gt;&amp;gt;)-&amp;gt;Stream&amp;lt;Struct&amp;lt;result:Int64&amp;gt;&amp;gt;\n&amp;gt;, @@\ndef process(rows):\n    for row in rows:\n        result = row.age ** len(row.name or '')\n        yield locals()\n@@);\n\n$users = (\n    SELECT age, name FROM &amp;lt;table_name&amp;gt;\n);\n\nPROCESS $users\nUSING $udf(TableRows());\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"588\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-588\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-588\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-588.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"separate-init-example\"&gt;&lt;a href=\"ru/yql/udf/python.html#separate-init-example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Разделение инициализации и вызова функции&lt;/span&gt;&lt;/a&gt;Разделение инициализации и вызова функции&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$script = @@#py\ndef multiply_by_filesize(path):\n    with open(path, 'r') as f:\n        size = len(f.read())\n\n        def multiply(arg):\n            return arg * size  # closure\n\n        return multiply\n@@;\n$udf = Python3::multiply_by_filesize(\n    Callable&amp;lt;(String)-&amp;gt;Callable&amp;lt;(Int64)-&amp;gt;Int64&amp;gt;&amp;gt;,\n    $script\n);\n$callable = $udf(FilePath(\"foo.txt\")); -- expensive initialization\nSELECT $callable(123);                 -- cheap call of already initialized function\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"592\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-592\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-592\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-592.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"ispolzovanie-tipa-dannyh-vhoda-pri-obuyavlenii-signatury\"&gt;&lt;a href=\"ru/yql/udf/python.html#ispolzovanie-tipa-dannyh-vhoda-pri-obuyavlenii-signatury\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование типа данных входа при объявлении сигнатуры&lt;/span&gt;&lt;/a&gt;Использование типа данных входа при объявлении сигнатуры&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$func = ($obj) -&amp;gt; {\n    $udf = Python3::func(\n        CallableType(0, ParseType(\"String?\"), TypeOf($obj)),\n        FileContent(\"my_func.py\")\n    );\n    RETURN $udf($obj);\n};\n\nSELECT $func(TableRow()) FROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"596\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-596\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-596\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-596.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"secureparam\"&gt;&lt;a href=\"ru/yql/udf/python.html#secureparam\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SecureParam&lt;/span&gt;&lt;/a&gt;SecureParam&lt;/h3&gt;\n\n&lt;p&gt;Для использования SecureParam в Python нужно обратиться к атрибуту &lt;code&gt;_yql_secure_param(token)&lt;/code&gt; функции, сигнатура которой объявлена в запросе, где &lt;code&gt;token&lt;/code&gt; (строка) - имя токена, значение которого нужно получить. Имя токена обязательно стоит передавать через обертку &lt;code&gt;SecureParam()&lt;/code&gt;, иначе значение не будет найдено. Если токен не будет найден по имени, то функция завершится с ошибкой.&lt;br /&gt;\nПример использования SecureParam&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$secParLen = @@#py\ndef MyFunc(token):\n    return len(MyFunc._yql_secure_param(token))\n@@;\n$udf = Python::MyFunc(Callable&amp;lt;(String)-&amp;gt;Int&amp;gt;, $secParLen);\nSELECT $udf(SecureParam(\"token:default_yt\"));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"604\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-604\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-604\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-604.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;См. &lt;a href=\"ru/yql/builtins/types.html\"&gt;функции для работы с типами данных&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/udf/python.md","sourcePath":"ru/yql/udf/python.md"},"headings":[{"title":"Введение","href":"ru/yql/udf/python.html#vvedenie","level":2},{"title":"Определение и вызов UDF","href":"ru/yql/udf/python.html#opredelenie-i-vyzov-udf","level":2,"items":[{"title":"Строка, содержащая скрипт на Python","href":"ru/yql/udf/python.html#stroka,-soderzhashaya-skript-na-python","level":3},{"title":"Объявление имени и сигнатуры функции","href":"ru/yql/udf/python.html#obuyavlenie-imeni-i-signatury-funkcii","level":3},{"title":"Аннотации типов","href":"ru/yql/udf/python.html#annotacii-tipov","level":3},{"title":"Вызов UDF в запросе","href":"ru/yql/udf/python.html#vyzov-udf-v-zaprose","level":3}]},{"title":"Типы данных","href":"ru/yql/udf/python.html#tipy-dannyh","level":2,"items":[{"title":"Простые (Data type)","href":"ru/yql/udf/python.html#prostye-data-type","level":3},{"title":"Типы, допускающие значение NULL","href":"ru/yql/udf/python.html#tipy,-dopuskayushie-znachenie-null","level":3},{"title":"Контейнеры","href":"ru/yql/udf/python.html#kontejnery","level":3},{"title":"С
