        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"spisok-funkcij\"&gt;&lt;a href=\"ru/yql/udf/list/pire.html#spisok-funkcij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Pire::Grep(pattern:String) -&amp;gt; (string:String?) -&amp;gt; Bool&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Pire::Match(pattern:String) -&amp;gt; (string:String?) -&amp;gt; Bool&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Pire::MultiGrep(pattern:String) -&amp;gt; (string:String?) -&amp;gt; Tuple&amp;lt;Bool, Bool, ...&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Pire::MultiMatch(pattern:String) -&amp;gt; (string:String?) -&amp;gt; Tuple&amp;lt;Bool, Bool, ...&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Pire::Capture(pattern:String) -&amp;gt; (string:String?) -&amp;gt; String?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Pire::Replace(pattern:String) -&amp;gt; (string:String?, replacement:String) -&amp;gt; String?&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Одной из опций для поиска по регулярным выражениям в YQL является библиотека &lt;a href=\"https://github.com/yandex/pire\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Pire&lt;/a&gt; (Perl Incompatible Regular Expressions). Это разработанная в Яндексе очень быстрая библиотека регулярных выражений: на нижнем уровне она просматривает входную строку один раз, подряд, без откатов, и тратит (на x86 и x86_64) по 5 инструкций на символ.&lt;/p&gt;\n&lt;p&gt;Скорость работы достигается за счет некоторых разумных ограничений:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Библиотека Pire ориентирована прежде всего на проверку на совпадение строки с регулярным выражением (Match).&lt;/li&gt;\n&lt;li&gt;Возможность вернуть совпавшую подстроку тоже поддерживается (Capture), но с ограничениями (возвращает совпадение только с одной группой).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;По умолчанию все функции работают в однобайтовом режиме, но если регулярное выражение является валидной UTF-8 строкой, но не является валидной ASCII строкой, — автоматически включается режим UTF-8.&lt;/p&gt;\n&lt;p&gt;Чтобы включить Unicode-режим, можно вставить в выражение один символ за пределами ASCII с оператором &lt;code&gt;?&lt;/code&gt;, например &lt;code&gt;\\\\w+я?&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"call-syntax\"&gt;&lt;a href=\"ru/yql/udf/list/pire.html#call-syntax\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Синтаксис вызова&lt;/span&gt;&lt;/a&gt;Синтаксис вызова&lt;/h2&gt;\n&lt;p&gt;Чтобы избежать компиляции регулярного выражения на каждой строке таблицы, необходимо обернуть вызов функции в &lt;a href=\"ru/yql/syntax/expressions.html#named-nodes\"&gt;именованное выражение&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$re = Pire::Grep(\"\\\\d+\"); -- создаем вызываемое значение для проверки конкретного регулярного выражения\nSELECT * FROM table WHERE $re(key); -- используем его для фильтрации таблицы\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"65\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-65\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-65\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-65.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При экранировании спецсимволов в регулярном выражении нужен второй слеш, так как все стандартные строковые литералы в SQL могут принимать С-escaped строки, а последовательность &lt;code&gt;\\d&lt;/code&gt; не является валидной последовательностью, и даже если бы являлась — не приводила бы к ожидаемому эффекту поиска чисел.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Есть возможность отключить чувствительность к регистру (то есть включить case-insensitive режим), указав в начале регулярного выражения флаг &lt;code&gt;(?i)&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"primery\"&gt;&lt;a href=\"ru/yql/udf/list/pire.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$value = \"xaaxaaxaa\";\n$match = Pire::Match(\"a.*\");\n$grep = Pire::Grep(\"axa\");\n$insensitive_grep = Pire::Grep(\"(?i)axa\");\n$multi_match = Pire::MultiMatch(@@a.*\n.*a.*\n.*a\n.*axa.*@@);\n$capture = Pire::Capture(\".*x(a).*\");\n$capture_many = Pire::Capture(\".*x(a+).*\");\n$replace = Pire::Replace(\".*x(a).*\");\n\nSELECT\n  $match($value) AS match,                        -- false\n  $grep($value) AS grep,                          -- true\n  $insensitive_grep($value) AS insensitive_grep,  -- true\n  $multi_match($value) AS multi_match,            -- (false, true, true, true)\n  $multi_match($value).0 AS some_multi_match,     -- false\n  $capture($value) AS capture,                    -- \"a\"\n  $capture_many($value) AS capture_many,          -- \"aa\"\n  $replace($value, \"b\") AS replace;               -- \"xaaxaaxba\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"82\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-82\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-82\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-82.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"grep\"&gt;&lt;a href=\"ru/yql/udf/list/pire.html#grep\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Grep&lt;/span&gt;&lt;/a&gt;Grep&lt;/h2&gt;\n&lt;p&gt;Проверяет совпадение регулярного выражения с &lt;strong&gt;частью строки&lt;/strong&gt; (произвольной подстрокой).&lt;/p&gt;\n&lt;h2 id=\"match\"&gt;&lt;a href=\"ru/yql/udf/list/pire.html#match\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Match&lt;/span&gt;&lt;/a&gt;Match&lt;/h2&gt;\n&lt;p&gt;Проверяет совпадение регулярного выражения &lt;strong&gt;со строкой целиком&lt;/strong&gt;.&lt;br /&gt;\nЧтобы получить результат, аналогичный &lt;code&gt;Grep&lt;/code&gt; (где учитывается совпадение с подстрокой), нужно обернуть регулярное выражение с обоих сторон в &lt;code&gt;.*&lt;/code&gt;, например &lt;code&gt;.*foo.*&lt;/code&gt; вместо &lt;code&gt;foo&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"multigrep\"&gt;&lt;a href=\"ru/yql/udf/list/pire.html#multigrep\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MultiGrep / MultiMatch&lt;/span&gt;&lt;/a&gt;MultiGrep / MultiMatch&lt;/h2&gt;\n&lt;p&gt;Библиотека Pire предоставляет возможность за один проход по тексту проверить несколько регулярных выражений и получить по каждому из них отдельный ответ.&lt;br /&gt;\nС помощью функций MultiGrep/MultiMatch можно оптимизировать скорость выполнения запроса, но это нужно делать осмотрительно, поскольку размер используемого для проверки конечного автомата растет экспоненциально с числом регулярных выражений:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Если вас интересует совпадение строки с любым из перечисленных выражений (результаты объединяются через «или»), то намного эффективнее сделать одно регулярное выражение, объединив части с помощью оператора &lt;code&gt;|&lt;/code&gt;, и использовать для поиска обычный Grep или Match.&lt;/li&gt;\n&lt;li&gt;В библиотеке Pire установлен лимит на размер конечного автомата (в YQL используется значение этого лимита, установленное по умолчанию в библиотеке). Если лимит превышен, при запуске запроса вернется ошибка &lt;code&gt;Failed to glue up regexes, probably the finite state machine appeared to be too large&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;При вызове функций MultiGrep/MultiMatch регулярные выражения передаются по одному на строку с использованием &lt;a href=\"ru/yql/syntax/lexer.html#multiline-string-literals\"&gt;многострочных строковых литералов&lt;/a&gt;:&lt;/p&gt;\n&lt;h3 id=\"primery1\"&gt;&lt;a href=\"ru/yql/udf/list/pire.html#primery1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$multi_match = Pire::MultiMatch(@@a.*\n.*x.*\n.*axa.*@@);\n\nSELECT\n    $multi_match(\"a\") AS a,      -- (true, false, false)\n    $multi_match(\"axa\") AS axa;  -- (true, true, true)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"119\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-119\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-119\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-119.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"capture\"&gt;&lt;a href=\"ru/yql/udf/list/pire.html#capture\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Capture&lt;/span&gt;&lt;/a&gt;Capture&lt;/h2&gt;\n&lt;p&gt;При совпадении строки с указанным регулярным выражением возвращает подстроку, совпавшую с группой, отмеченной в регулярном выражении круглыми скобками.&lt;br /&gt;\nCapture работает НЕ в жадном режиме, то есть возвращается самая короткая подстрока из возможных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В выражении должна быть ровно &lt;strong&gt;одна&lt;/strong&gt; группа, обозначенная круглыми скобками. В случае отсутствия совпадения возвращается &lt;code&gt;NULL&lt;/code&gt; (пустой Optional).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Если описанные выше ограничения и особенности по каким-либо причинам выглядят неприемлемыми, рекомендуется рассмотреть возможность использования &lt;a href=\"ru/yql/udf/list/re2.html#capture\"&gt;Re2::Capture&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"replace\"&gt;&lt;a href=\"ru/yql/udf/list/pire.html#replace\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Replace&lt;/span&gt;&lt;/a&gt;Replace&lt;/h2&gt;\n&lt;p&gt;В библиотеке Pire отсутствует функция замены по регулярному выражению. Функция &lt;code&gt;Pire::Replace&lt;/code&gt; в YQL представляет собой упрощенную эмуляцию, реализованную с помощью &lt;code&gt;Capture&lt;/code&gt;. Может работать некорректно, если найденная подстрока встречается в исходной более одного раза.&lt;/p&gt;\n&lt;p&gt;Как правило, лучше воспользоваться &lt;a href=\"ru/yql/udf/list/re2.html#replace\"&gt;Re2::Replace&lt;/a&gt; вместо неё.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/udf/list/pire.md","sourcePath":"ru/yql/udf/list/pire.md"},"headings":[{"title":"Список функций","href":"ru/yql/udf/list/pire.html#spisok-funkcij","level":2},{"title":"Синтаксис вызова","href":"ru/yql/udf/list/pire.html#call-syntax","level":2,"items":[{"title":"Примеры","href":"ru/yql/udf/list/pire.html#primery","level":3}]},{"title":"Grep","href":"ru/yql/udf/list/pire.html#grep","level":2},{"title":"Match","href":"ru/yql/udf/list/pire.html#match","level":2},{"title":"MultiGrep / MultiMatch","href":"ru/yql/udf/list/pire.html#multigrep","level":2,"items":[{"title":"Примеры","href":"ru/yql/udf/list/pire.html#primery1","level":3}]},{"title":"Capture","href":"ru/yql/udf/list/pire.html#capture","level":2},{"title":"Replace","href":"ru/yql/udf/list/pire.html#replace","level":2}],"title":"Pire"},"router":{"pathname":"ru/yql/udf/list/pire","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
