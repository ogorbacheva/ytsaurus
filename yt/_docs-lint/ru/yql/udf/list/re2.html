        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"spisok-funkcij\"&gt;&lt;a href=\"ru/yql/udf/list/re2.html#spisok-funkcij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Re2::Grep(pattern:String, options:Struct&amp;lt;...&amp;gt;?) -&amp;gt; (string:String?) -&amp;gt; Bool\nRe2::Match(pattern:String, options:Struct&amp;lt;...&amp;gt;?) -&amp;gt; (string:String?) -&amp;gt; Bool\nRe2::Capture(pattern:String, options:Struct&amp;lt;...&amp;gt;?) -&amp;gt; (string:String?) -&amp;gt; Struct&amp;lt;_1:String?,foo:String?,...&amp;gt;\nRe2::FindAndConsume(pattern:String, options:Struct&amp;lt;...&amp;gt;?) -&amp;gt; (string:String?) -&amp;gt; List&amp;lt;String&amp;gt;\nRe2::Replace(pattern:String, options:Struct&amp;lt;...&amp;gt;?) -&amp;gt; (string:String?, replacement:String) -&amp;gt; String?\nRe2::Count(pattern:String, options:Struct&amp;lt;...&amp;gt;?) -&amp;gt; (string:String?) -&amp;gt; Uint32\nRe2::Options([CaseSensitive:Bool?,DotNl:Bool?,Literal:Bool?,LogErrors:Bool?,LongestMatch:Bool?,MaxMem:Uint64?,NeverCapture:Bool?,NeverNl:Bool?,OneLine:Bool?,PerlClasses:Bool?,PosixSyntax:Bool?,Utf8:Bool?,WordBoundary:Bool?]) -&amp;gt; Struct&amp;lt;CaseSensitive:Bool,DotNl:Bool,Literal:Bool,LogErrors:Bool,LongestMatch:Bool,MaxMem:Uint64,NeverCapture:Bool,NeverNl:Bool,OneLine:Bool,PerlClasses:Bool,PosixSyntax:Bool,Utf8:Bool,WordBoundary:Bool&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Модуль Re2 реализует поддержку регулярных выражений на основе &lt;a href=\"https://github.com/google/re2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;google::RE2&lt;/a&gt;, где предоставляется широкий ассортимент возможностей (&lt;a href=\"https://github.com/google/re2/wiki/Syntax\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;см. официальную документацию&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;По умолчанию UTF-8 режим включается автоматически, если регулярное выражение является валидной строкой в кодировке UTF-8, но не является валидной ASCII-строкой. Вручную настройками библиотеки re2 можно управлять с помощью передачи результата функции &lt;code&gt;Re2::Options&lt;/code&gt; вторым аргументом другим функциям модуля, рядом с регулярным выражением.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Все регулярные выражения, переданные в функции, должны быть валидными. Иначе ваш запрос может упасть. Начиная с версии &lt;a href=\"ru/yql/changelog/2025.03.html#re2-module\"&gt;2025.03&lt;/a&gt; такой запрос гарантированно завершится с ошибкой.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Все обратные слеши в регулярных выражениях (если они записаны в строке с кавычками) нужно удваивать, так как стандартные строковые литералы в SQL рассматриваются как С-escaped строки. Также можно записывать регулярное выражение в форме raw строки &lt;code&gt;@@regexp@@&lt;/code&gt; — в этом случае удвоение слешей не требуется.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"primery\"&gt;&lt;a href=\"ru/yql/udf/list/re2.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$value = \"xaaxaaxaa\";\n$options = Re2::Options(false AS CaseSensitive);\n$match = Re2::Match(\"[ax]+\\\\d\");\n$grep = Re2::Grep(\"a.*\");\n$capture = Re2::Capture(\".*(?P&amp;lt;foo&amp;gt;xa?)(a{2,}).*\");\n$replace = Re2::Replace(\"x(a+)x\");\n$count = Re2::Count(\"a\", $options);\n\nSELECT\n  $match($value) AS match,                -- false\n  $grep($value) AS grep,                  -- true\n  $capture($value) AS capture,            -- (_0: 'xaaxaaxaa', _1: 'aa', foo: 'x')\n  $capture($value)._1 AS capture_member,  -- \"aa\"\n  $replace($value, \"b\\\\1z\") AS replace,   -- \"baazaaxaa\"\n  $count($value) AS count;                -- 6\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"33\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-33\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-33\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-33.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"match\"&gt;&lt;a href=\"ru/yql/udf/list/re2.html#match\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Re2::Grep / Re2::Match&lt;/span&gt;&lt;/a&gt;Re2::Grep / Re2::Match&lt;/h2&gt;\n&lt;p&gt;Если вынести за скобки детали реализации и синтаксиса регулярных выражений, эти функции полностью аналогичны &lt;a href=\"ru/yql/udf/list/pire.html#match\"&gt;одноименным функциям&lt;/a&gt; из модуля Pire. При прочих равных и отсутствии каких-либо специфических предпочтений мы рекомендуем пользоваться &lt;code&gt;Pire::Grep / Pire::Match&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Функцию &lt;code&gt;Re2::Grep&lt;/code&gt; можно вызвать с помощью выражения &lt;code&gt;REGEXP&lt;/code&gt; (см. &lt;a href=\"ru/yql/syntax/expressions.html#regexp\"&gt;описание базового синтаксиса выражений&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;Например, следующие два запроса эквивалентны (в том числе по эффективности вычислений):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;$grep = Re2::Grep(\"b+\"); SELECT $grep(\"aaabccc\");&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;SELECT \"aaabccc\" REGEXP \"b+\";&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"capture\"&gt;&lt;a href=\"ru/yql/udf/list/re2.html#capture\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Re2::Capture&lt;/span&gt;&lt;/a&gt;Re2::Capture&lt;/h2&gt;\n&lt;p&gt;В отличие от &lt;a href=\"ru/yql/udf/list/pire.html#capture\"&gt;Pire::Capture&lt;/a&gt; в &lt;code&gt;Re2::Capture&lt;/code&gt; поддерживаются множественные и именованные группы захвата (capturing groups).&lt;br /&gt;\nТип результата: структура с полями типа &lt;code&gt;String?&lt;/code&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Каждое поле соответствует группе захвата с соответствующим именем.&lt;/li&gt;\n&lt;li&gt;Для неименованных групп генерируются имена вида: &lt;code&gt;_1&lt;/code&gt;, &lt;code&gt;_2&lt;/code&gt; и т.д.&lt;/li&gt;\n&lt;li&gt;В результат всегда включается поле &lt;code&gt;_0&lt;/code&gt;, в котором доступна вся совпавшая с регулярным выражением подстрока.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Подробнее про работу со структурами в YQL см. в &lt;a href=\"ru/yql/types/containers.html\"&gt;разделе про контейнеры&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"findandconsume\"&gt;&lt;a href=\"ru/yql/udf/list/re2.html#findandconsume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Re2::FindAndConsume&lt;/span&gt;&lt;/a&gt;Re2::FindAndConsume&lt;/h2&gt;\n&lt;p&gt;Ищет все вхождения регулярного выражения в переданный текст и возвращает список значений, соответствующих обрамленной в круглые скобки части регулярного выражения для каждого вхождения.&lt;/p&gt;\n&lt;h2 id=\"replace\"&gt;&lt;a href=\"ru/yql/udf/list/re2.html#replace\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Re2::Replace&lt;/span&gt;&lt;/a&gt;Re2::Replace&lt;/h2&gt;\n&lt;p&gt;Работает следующим образом:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Во входной строке (первый аргумент) все непересекающиеся подстроки, совпавшие с регулярным выражением, заменяются на указанную строку (второй аргумент).&lt;/li&gt;\n&lt;li&gt;В строке с заменой можно использовать содержимое групп захвата (capturing groups) из регулярного выражения с помощью ссылок вида: &lt;code&gt;\\\\1&lt;/code&gt;, &lt;code&gt;\\\\2&lt;/code&gt; и т.д. Ссылка &lt;code&gt;\\\\0&lt;/code&gt; обозначает всю совпавшую с регулярным выражением подстроку.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"count\"&gt;&lt;a href=\"ru/yql/udf/list/re2.html#count\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Re2::Count&lt;/span&gt;&lt;/a&gt;Re2::Count&lt;/h2&gt;\n&lt;p&gt;Возвращает количество совпавших с регулярным выражением непересекающихся подстрок во входной строке.&lt;/p&gt;\n&lt;h2 id=\"options\"&gt;&lt;a href=\"ru/yql/udf/list/re2.html#options\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Re2::Options&lt;/span&gt;&lt;/a&gt;Re2::Options&lt;/h2&gt;\n&lt;p&gt;Пояснения к параметрам Re2::Options из официального &lt;a href=\"https://github.com/google/re2/blob/main/re2/re2.h#L595-L617\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;репозитория&lt;/a&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Параметр&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Комментарий&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;CaseSensitive:Bool?&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;td&gt;match is case-sensitive (regexp can override with (?i) unless in posix_syntax mode)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;DotNl:Bool?&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;let &lt;code&gt;.&lt;/code&gt; match &lt;code&gt;\\n&lt;/code&gt; (default )&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Literal:Bool?&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;interpret string as literal, not regexp&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;LogErrors:Bool?&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;td&gt;this option is ignored&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;LongestMatch:Bool?&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;search for longest match, not first match&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;MaxMem:Uint64?&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;(see below)  approx. max memory footprint of RE2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;NeverCapture:Bool?&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;parse all parens as non-capturing&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;NeverNl:Bool?&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;never match \\n, even if it is in regexp&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;PosixSyntax:Bool?&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;restrict regexps to POSIX egrep syntax&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Utf8:Bool?&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;td&gt;text and pattern are UTF-8; otherwise Latin-1&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;The following options are only consulted when PosixSyntax == true. When PosixSyntax == false, these features are always enabled and cannot be turned off; to perform multi-line matching in that case, begin the regexp with (?m).&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;PerlClasses:Bool?&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;allow Perl's \\d \\s \\w \\D \\S \\W&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;WordBoundary:Bool?&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;allow Perl's \\b \\B (word boundary and not)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;OneLine:Bool?&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;^ and $ only match beginning and end of text&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Не рекомендуется Re2::Options использовать в коде. Большинство параметров можно заменить на флаги регулярного выражения.&lt;/p&gt;\n&lt;h3 id=\"primer-ispolzovaniya-flagov\"&gt;&lt;a href=\"ru/yql/udf/list/re2.html#primer-ispolzovaniya-flagov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример использования флагов&lt;/span&gt;&lt;/a&gt;Пример использования флагов&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$value = \"Foo bar FOO\"u;\n-- включить режим без учета регистра\n$capture = Re2::Capture(@@(?i)(foo)@@);\n\nSELECT\n    $capture($value) AS capture; -- (\"_0\": \"Foo\", \"_1\": \"Foo\")\n\n$capture = Re2::Capture(@@(?i)(?P&amp;lt;foo&amp;gt;FOO).*(?P&amp;lt;bar&amp;gt;bar)@@);\n\nSELECT\n    $capture($value) AS capture; -- (\"_0\": \"Foo bar\", \"bar\": \"bar\", \"foo\": \"Foo\")\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"297\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-297\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-297\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-297.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В обоих случаях слово FOO будет найдено. Применение raw строки @@regexp@@ позволяет не удваивать слеши.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"style":["_bundle/latex-extension.css"],"script":["_bundle/latex-extension.js"],"vcsPath":"ru/yql/udf/list/re2.md","sourcePath":"ru/yql/udf/list/re2.md"},"headings":[{"title":"Список функций","href":"ru/yql/udf/list/re2.html#spisok-funkcij","level":2},{"title":"Примеры","href":"ru/yql/udf/list/re2.html#primery","level":2},{"title":"Re2::Grep / Re2::Match","href":"ru/yql/udf/list/re2.html#match","level":2},{"title":"Re2::Capture","href":"ru/yql/udf/list/re2.html#capture","level":2},{"title":"Re2::FindAndConsume","href":"ru/yql/udf/list/re2.html#findandconsume","level":2},{"title":"Re2::Replace","href":"ru/yql/udf/list/re2.html#replace","level":2},{"title":"Re2::Count","href":"ru/yql/udf/list/re2.html#count","level":2},{"title":"Re2::Options","href":"ru/yql/udf/list/re2.html#options","level":2,"items":[{"title":"Пример использования флагов","href":"ru/yql/udf/list/re2.html#primer-ispolzovaniya-flagov","level":3}]}],"title":"Re2"},"router":{"pathname":"ru/yql/udf/list/re2","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
