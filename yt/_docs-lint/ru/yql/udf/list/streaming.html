            {"data":{"leading":false,"html":"&lt;p&gt;Функции для запуска произвольного скрипта или исполняемого файла в потоковом режиме:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Streaming::Process(List&amp;lt;Struct&amp;lt;Data:String&amp;gt;&amp;gt;, String, List&amp;lt;String&amp;gt;) -&amp;gt; List&amp;lt;Struct&amp;lt;Data:String&amp;gt;&amp;gt;\nStreaming::ProcessInline(List&amp;lt;Struct&amp;lt;Data:String&amp;gt;&amp;gt;, String, List&amp;lt;String&amp;gt;) -&amp;gt; List&amp;lt;Struct&amp;lt;Data:String&amp;gt;&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Описание аргументов:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Входные данные (&lt;code&gt;List&amp;lt;Struct&amp;lt;Data:String&amp;gt;&amp;gt;&lt;/code&gt;):\n&lt;ul&gt;\n&lt;li&gt;Дочерний процесс запускается один раз в начале обработки списка (или его части, см. следующий пункт) и каждый элемент подается ему на stdin на отдельной строке.&lt;/li&gt;\n&lt;li&gt;Если входной список физически является большой таблицей, то будет запущено много одинаковых процессов для параллельной обработки её частей. Обработка всех данных таблицы в одном процессе и порядок обработки строк не гарантируются.&lt;/li&gt;\n&lt;li&gt;Функции &lt;code&gt;Process&lt;/code&gt; и &lt;code&gt;ProcessInline&lt;/code&gt; ожидают, что каждая строка в списке входных данных обернута в структуру. Это сделано, чтобы упростить связку с &lt;code&gt;SELECT&lt;/code&gt; — именно такой тип получается у результата &lt;code&gt;SELECT ... AS Data FROM ...&lt;/code&gt;, а также чтобы не провоцировать пользователя на крайне неэффективный сценарий использования, предполагающий запуск отдельного процесса на каждой строке исходной MapReduce-таблицы.&lt;/li&gt;\n&lt;li&gt;Имя &lt;code&gt;Data&lt;/code&gt; для структуры элемента списка на момент написания фиксировано.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Второй аргумент (&lt;code&gt;String&lt;/code&gt;):\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Streaming::Process&lt;/code&gt; — имя программы из &lt;code&gt;$PATH&lt;/code&gt; (нужно убедиться, что она установлена на целевом кластере), либо путь к исполняемому файлу, который можно приложить к запросу, а путь получить через встроенную функцию &lt;code&gt;FilePath(\"file alias\")&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Streaming::ProcessInline&lt;/code&gt; — строка со скриптом, который будет запущен через интерпретатор, указанный в &lt;a href=\"https://en.wikipedia.org/wiki/Shebang_(Unix)\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;shebang&lt;/a&gt; (то есть в первой строке скрипта должно быть написано, например, &lt;code&gt;#!/usr/bin/env bash&lt;/code&gt;). Базовые интерпретаторы вроде sh, bash, awk, perl или python, как правило, уже установлены, а что-то экзотическое можно также приложить к запросу. Скрипт можно задать как inline с использованием многострочного строкового литерала (&lt;code&gt;@@&lt;/code&gt;), либо в отдельном файле (вкладке в веб-интерфейсе), во втором случае получить содержимое файла в виде строки можно с помощью встроенной функции &lt;code&gt;FileContent(\"file alias\")&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Список аргументов, которые будут переданы скрипту или исполняемому файлу при запуске (&lt;code&gt;List&amp;lt;String&amp;gt;&lt;/code&gt;, необязательный аргумент):\n&lt;ul&gt;\n&lt;li&gt;Чтобы сформировать список аргументов из литералов, удобно воспользоваться встроенной функцией &lt;code&gt;AsList&lt;/code&gt; (принимает 1 или более аргументов и формирует из них список).&lt;/li&gt;\n&lt;li&gt;Если передавать аргументы не нужно — можно не указывать этот аргумент.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Если вас интересует какой-либо формат взаимодействия с дочерним процессом, отличный от описанного выше построчного, расскажите нам о своём сценарии использования в &lt;a href=\"https://t.me/ytsaurus_ru\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;коммьюнити-чате&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Особенности реализации:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;При использовании &lt;code&gt;Streaming::ProcessInline&lt;/code&gt;, как правило, задействуется интерпретатор, установленный на целевом кластере, что в случае различия версий может приводить к неожиданным спецэффектам. Для избежания этого можно или прикладывать свой интерпретатор к запросу (что не всегда тривиально), или договариваться с эксплуатацией кластера об установке нужного интерпретатора или его версии (лучше напрямую, но можно и через нас).&lt;/li&gt;\n&lt;li&gt;Поток стандартного вывода ошибок (stderr) можно использовать для диагностики проблемных ситуаций: его ограниченная по объему часть сохраняется и возвращается на клиент в случае ошибки времени исполнения (runtime error) при выполнении запроса. Размер сохраняемого фрагмента stderr настраивается на стороне кластера и обычно составляет несколько килобайт.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery\"&gt;&lt;a href=\"ru/yql/udf/list/streaming.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$input = [\n  &amp;lt;| \"Data\":\"a\" |&amp;gt;,\n  &amp;lt;| \"Data\":\"b\" |&amp;gt;,\n  &amp;lt;| \"Data\":\"c\" |&amp;gt;,\n];\n\nPROCESS AS_TABLE($input) USING Streaming::Process(TableRows(), \"cat\", [\"-n\"]);\n\n/*\n[(Data: ' 1 a'),\n(Data: ' 2 b'),\n(Data: ' 3 c')]\n*/\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"91\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-91\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-91\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-91.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$ips = (SELECT COALESCE(ip, \"\") AS Data FROM &amp;lt;cluster-name&amp;gt;.`home/yql/tutorial/users`);\n\n$script = @@#!/usr/bin/awk -f\nBEGIN { FS=\".\"; }\n$2 ~ /170/ { print $0\" has 170 in second octet!\"; }\n@@;\n\nPROCESS $ips\nUSING Streaming::ProcessInline(\n  TableRows(),\n  $script\n);\n/*\n\"93.170.111.29 has 170 in second octet!\"\n\"93.170.111.28 has 170 in second octet!\"\n*/\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"92\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-92\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-92\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-92.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/udf/list/streaming.md","sourcePath":"ru/yql/udf/list/streaming.md"},"headings":[],"title":"Streaming UDF"},"router":{"pathname":"ru/yql/udf/list/streaming","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
