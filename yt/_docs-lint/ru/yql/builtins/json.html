&gt; &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Josephus\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"surname\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Miller\"&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1516\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1516\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1516\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1516.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;exists ($.profile.name)&lt;/code&gt; возвращает &lt;code&gt;true&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;exists ($.friends.profile.name)&lt;/code&gt; возвращает &lt;code&gt;false&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;strict exists ($.friends.profile.name)&lt;/code&gt; возвращает &lt;code&gt;null&lt;/code&gt;, потому что в &lt;code&gt;strict&lt;/code&gt; режиме обращение к несуществующим ключам объекта это ошибка&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"is-unknown\"&gt;&lt;a href=\"ru/yql/builtins/json.html#is-unknown\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;is unknown&lt;/span&gt;&lt;/a&gt;&lt;code&gt;is unknown&lt;/code&gt;&lt;/h4&gt;\n&lt;p&gt;Предикат &lt;code&gt;is unknown&lt;/code&gt; позволяет проверить, является ли булевское значение &lt;code&gt;null&lt;/code&gt;.&lt;/p&gt;\n&lt;h6 id=\"sintaksis3\"&gt;&lt;a href=\"ru/yql/builtins/json.html#sintaksis3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Синтаксис&lt;/span&gt;&lt;/a&gt;Синтаксис&lt;/h6&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;(&amp;lt;expression&amp;gt;) is unknown\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1543\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1543\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1543\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1543.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Где &lt;code&gt;&amp;lt;expression&amp;gt;&lt;/code&gt; - это JsonPath выражение, которое нужно проверить. Допускаются только выражения, возвращающие булевское значение. Скобки вокруг выражения обязательны.&lt;/p&gt;\n&lt;h5 id=\"ispolnenie3\"&gt;&lt;a href=\"ru/yql/builtins/json.html#ispolnenie3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Исполнение&lt;/span&gt;&lt;/a&gt;Исполнение&lt;/h5&gt;\n&lt;ol&gt;\n&lt;li&gt;Если переданное выражение возвращает &lt;code&gt;null&lt;/code&gt;, предикат возвращает &lt;code&gt;true&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Иначе предикат возвращает &lt;code&gt;false&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h5 id=\"primery7\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primery7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h5&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;(1 == 2) is unknown&lt;/code&gt; возвращает &lt;code&gt;false&lt;/code&gt;. Выражение &lt;code&gt;1 == 2&lt;/code&gt; вернуло &lt;code&gt;false&lt;/code&gt;, что не является &lt;code&gt;null&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;(1 == \"string\") is unknown&lt;/code&gt; возвращает &lt;code&gt;true&lt;/code&gt;. Выражение &lt;code&gt;1 == \"string\"&lt;/code&gt; вернуло &lt;code&gt;null&lt;/code&gt;, поскольку в JsonPath строки и числа не сравнимы&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"filtry\"&gt;&lt;a href=\"ru/yql/builtins/json.html#filtry\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Фильтры&lt;/span&gt;&lt;/a&gt;Фильтры&lt;/h3&gt;\n&lt;p&gt;JsonPath позволяет фильтровать значения, полученные в ходе выполнения запроса.&lt;/p&gt;\n&lt;p&gt;Выражение в фильтре должно возвращать булевское значение.&lt;br /&gt;\nПеред фильтрацией производится автоматическая распаковка массивов во входной последовательности.&lt;/p&gt;\n&lt;p&gt;Для каждого элемента входной последовательности:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Значение текущего фильтруемого объекта &lt;code&gt;@&lt;/code&gt; становится равным текущему элементу входной последовательности&lt;/li&gt;\n&lt;li&gt;Исполняется выражение в фильтре&lt;/li&gt;\n&lt;li&gt;Если в ходе выполнения выражения возникла ошибка, текущий элемент входной последовательности пропускается&lt;/li&gt;\n&lt;li&gt;Если результат исполнения выражения это единственное значение &lt;code&gt;true&lt;/code&gt;, текущий элемент добавляется в результат фильтра&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"primer6\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primer6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h4&gt;\n&lt;p&gt;Пусть у нас есть JSON документ, описывающий друзей пользователя&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"friends\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"James Holden\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"age\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;35&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"money\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;500&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Naomi Nagata\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"age\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;30&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"money\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;345&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1617\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1617\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1617\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1617.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;и мы хотим получить с помощью JsonPath запроса друзей которые старше 32 лет. Для этого можно написать следующий запрос:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$.friends ? (@.age &amp;gt; 32)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1621\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1621\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1621\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1621.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Разберем запрос по частям:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;$.friends&lt;/code&gt; - обращение к массиву &lt;code&gt;friends&lt;/code&gt; в JSON документе&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;? ( ... )&lt;/code&gt; - синтаксис фильтра. Выражение внутри скобок называется предикатом&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;@&lt;/code&gt; - обращение к текущему фильтруемому объекту. В нашем примере это объект, описывающий друга пользователя&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;@.age&lt;/code&gt; - обращение к полю &lt;code&gt;age&lt;/code&gt; текущего фильтруемого объекта&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;@.age &amp;gt; 32&lt;/code&gt; - сравнение поля &lt;code&gt;age&lt;/code&gt; со значением 32. В результате выполнения запроса останутся только те значения, для которых данный предикат вернул истину&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В результате выполнения этого запроса будет получен только первый друг из массива друзей пользователя.&lt;/p&gt;\n&lt;p&gt;Как и многие другие операторы языка JsonPath, фильтры можно выстраивать в цепочки. Разберем более сложный запрос, который отбирает имена друзей которые старше 20 лет и которые имеют меньше чем 400 единиц валюты:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$.friends ? (@.age &amp;gt; 20) ? (@.money &amp;lt; 400) . name\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1658\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1658\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1658\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1658.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Разберем запрос по частям:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;$.friends&lt;/code&gt; - обращение к массиву &lt;code&gt;friends&lt;/code&gt; в JSON документе&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;? (@.age &amp;gt; 20)&lt;/code&gt; - первый фильтр. Поскольку все друзья старше 20, он просто вернет все элементы массива &lt;code&gt;friends&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;? (@.money &amp;lt; 400)&lt;/code&gt; - второй фильтр. Вернет только второй элемент массива &lt;code&gt;friends&lt;/code&gt;, поскольку только у него поле &lt;code&gt;money&lt;/code&gt; имеет значение меньше 400&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;.name&lt;/code&gt; - обращение к полю &lt;code&gt;name&lt;/code&gt; у отфильтрованных объектов&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В результате выполнения этого запроса будет получена последовательность из одного элемента - &lt;code&gt;\"Naomi Nagata\"&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;На практике рекомендуется объединять несколько фильтров в один если есть такая возможность. Рассмотренный запрос эквивалентен &lt;code&gt;$.friends ? (@.age &amp;gt; 20 &amp;amp;&amp;amp; @.money &amp;lt; 400) . name&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"ru/yql/builtins/json.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;p&gt;JsonPath поддерживает методы - функции, которые преобразуют одни последовательности значений в другие. Синтаксис вызова метода похож на обращение к ключу объекта:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$.friends.size()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1696\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1696\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1696\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1696.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Также как и обращение к ключам объекта, вызовы методов можно выстраивать в цепочки:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$.numbers.double().floor()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1700\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1700\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1700\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1700.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"type\"&gt;&lt;a href=\"ru/yql/builtins/json.html#type\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;type&lt;/span&gt;&lt;/a&gt;&lt;code&gt;type&lt;/code&gt;&lt;/h4&gt;\n&lt;p&gt;Метод &lt;code&gt;type&lt;/code&gt; возвращает строчку с названием типа переданного значения.&lt;/p&gt;\n&lt;p&gt;Для каждого элемента входной последовательности метод добавляет строчку в выходную последовательность в соответствии с табличкой:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;Строка с названием типа&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Null&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"null\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Булевское значение&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"boolean\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Число&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"number\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"string\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Массив&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"array\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Объект&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"object\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h5 id=\"primery8\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primery8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h5&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;\"Naomi\".type()&lt;/code&gt; возвращает &lt;code&gt;\"string\"&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;false.type()&lt;/code&gt; возвращает &lt;code&gt;\"boolean\"&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"size\"&gt;&lt;a href=\"ru/yql/builtins/json.html#size\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;size&lt;/span&gt;&lt;/a&gt;&lt;code&gt;size&lt;/code&gt;&lt;/h4&gt;\n&lt;p&gt;Метод &lt;code&gt;size&lt;/code&gt; возвращает размер массива.&lt;/p&gt;\n&lt;p&gt;Для каждого элемента входной последовательности метод добавляет в выходную последовательность:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Размер массива, если тип элемента это массив&lt;/li&gt;\n&lt;li&gt;Для всех остальных типов (включая объекты) &lt;code&gt;1&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"primery9\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primery9\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n&lt;p&gt;Рассмотрим JSON документ:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"array\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"object\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"a\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"b\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"scalar\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"string\"&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1814\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1814\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1814\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1814.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;И запросы к нему:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;$.array.size()&lt;/code&gt; возвращает &lt;code&gt;3&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;$.object.size()&lt;/code&gt; возвращает &lt;code&gt;1&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;$.scalar.size()&lt;/code&gt; возвращает &lt;code&gt;1&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"double\"&gt;&lt;a href=\"ru/yql/builtins/json.html#double\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;double&lt;/span&gt;&lt;/a&gt;&lt;code&gt;double&lt;/code&gt;&lt;/h4&gt;\n&lt;p&gt;Метод &lt;code&gt;double&lt;/code&gt; конвертирует строки в числа.&lt;/p&gt;\n&lt;p&gt;Перед выполнением производится автоматическая распаковка массивов во входной последовательности.&lt;/p&gt;\n&lt;p&gt;Все элементы во входной последовательности должны быть строками, которые содержат числа в десятичной записи. Допускается указание дробной части и экспоненты.&lt;/p&gt;\n&lt;h5 id=\"primery10\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primery10\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h5&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;\"125\".double()&lt;/code&gt; возвращает &lt;code&gt;125&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;\"125.456\".double()&lt;/code&gt; возвращает &lt;code&gt;125.456&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;\"125.456e-3\".double()&lt;/code&gt; возвращает &lt;code&gt;0.125456&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"ceiling\"&gt;&lt;a href=\"ru/yql/builtins/json.html#ceiling\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ceiling&lt;/span&gt;&lt;/a&gt;&lt;code&gt;ceiling&lt;/code&gt;&lt;/h4&gt;\n&lt;p&gt;Метод &lt;code&gt;ceiling&lt;/code&gt; округляет числа вверх.&lt;/p&gt;\n&lt;p&gt;Перед выполнением производится автоматическая распаковка массивов во входной последовательности.&lt;/p&gt;\n&lt;p&gt;Все элементы во входной последовательности должны быть числами.&lt;/p&gt;\n&lt;h5 id=\"primery11\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primery11\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h5&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;(1.3).ceiling()&lt;/code&gt; возвращает &lt;code&gt;2&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;(1.8).ceiling()&lt;/code&gt; возвращает &lt;code&gt;2&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;(1.5).ceiling()&lt;/code&gt; возвращает &lt;code&gt;2&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;(1.0).ceiling()&lt;/code&gt; возвращает &lt;code&gt;1&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"floor\"&gt;&lt;a href=\"ru/yql/builtins/json.html#floor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;floor&lt;/span&gt;&lt;/a&gt;&lt;code&gt;floor&lt;/code&gt;&lt;/h4&gt;\n&lt;p&gt;Метод &lt;code&gt;floor&lt;/code&gt; округляет числа вниз.&lt;/p&gt;\n&lt;p&gt;Перед выполнением производится автоматическая распаковка массивов во входной последовательности.&lt;/p&gt;\n&lt;p&gt;Все элементы во входной последовательности должны быть числами.&lt;/p&gt;\n&lt;h5 id=\"primery12\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primery12\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h5&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;(1.3).floor()&lt;/code&gt; возвращает &lt;code&gt;1&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;(1.8).floor()&lt;/code&gt; возвращает &lt;code&gt;1&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;(1.5).floor()&lt;/code&gt; возвращает &lt;code&gt;1&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;(1.0).floor()&lt;/code&gt; возвращает &lt;code&gt;1&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"abs\"&gt;&lt;a href=\"ru/yql/builtins/json.html#abs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;abs&lt;/span&gt;&lt;/a&gt;&lt;code&gt;abs&lt;/code&gt;&lt;/h4&gt;\n&lt;p&gt;Метод &lt;code&gt;abs&lt;/code&gt; вычисляет абсолютное значение числа (убирает знак).&lt;/p&gt;\n&lt;p&gt;Перед выполнением производится автоматическая распаковка массивов во входной последовательности.&lt;/p&gt;\n&lt;p&gt;Все элементы во входной последовательности должны быть числами.&lt;/p&gt;\n&lt;h5 id=\"primery13\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primery13\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h5&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;(0.0).abs()&lt;/code&gt; возвращает &lt;code&gt;0&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;(1.0).abs()&lt;/code&gt; возвращает &lt;code&gt;1&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;(-1.0).abs()&lt;/code&gt; возвращает &lt;code&gt;1&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"keyvalue\"&gt;&lt;a href=\"ru/yql/builtins/json.html#keyvalue\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;keyvalue&lt;/span&gt;&lt;/a&gt;&lt;code&gt;keyvalue&lt;/code&gt;&lt;/h4&gt;\n&lt;p&gt;Метод &lt;code&gt;keyvalue&lt;/code&gt; конвертирует объект в последовательность пар ключ-значение.&lt;/p&gt;\n&lt;p&gt;Перед выполнением производится автоматическая распаковка массивов во входной последовательности.&lt;/p&gt;\n&lt;p&gt;Все элементы во входной последовательности должны быть объектами.&lt;/p&gt;\n&lt;p&gt;Для каждого элемента входной последовательности:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Рассматривается каждая пара ключ-значение в элементе&lt;/li&gt;\n&lt;li&gt;Для каждой такой пары формируется объект с ключами &lt;code&gt;name&lt;/code&gt; и &lt;code&gt;value&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;name&lt;/code&gt; хранит строку с названием ключа из пары&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;value&lt;/code&gt; хранит значение из пары&lt;/li&gt;\n&lt;li&gt;Все объекты для этого элемента добавляются в выходную последовательность&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h5 id=\"primery14\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primery14\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h5&gt;\n&lt;p&gt;Рассмотрим JSON документ:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Chrisjen\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"surname\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Avasarala\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"age\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;70&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2021\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2021\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2021\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2021.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Для него запрос &lt;code&gt;$.keyvalue()&lt;/code&gt; вернет последовательность:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"age\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"value\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;70&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"value\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Chrisjen\"&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"surname\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"value\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Avasarala\"&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2025\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2025\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2025\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2025.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"peremennye\"&gt;&lt;a href=\"ru/yql/builtins/json.html#peremennye\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Переменные&lt;/span&gt;&lt;/a&gt;Переменные&lt;/h3&gt;\n&lt;p&gt;Функции использующие JsonPath могут передавать значения внутрь запроса, они называются переменными. Чтобы обратиться к переменной, нужно написать символ &lt;code&gt;$&lt;/code&gt; и название переменной: &lt;code&gt;$variable&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"primer7\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primer7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h4&gt;\n&lt;p&gt;Пусть переменная &lt;code&gt;planet&lt;/code&gt; равна&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Mars\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"gravity\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0.376&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2038\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2038\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2038\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2038.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Тогда запрос &lt;code&gt;strict $planet.name&lt;/code&gt; даст &lt;code&gt;\"Mars\"&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В отличии от многих языков программирования, JsonPath не поддерживает создание новых переменных или изменение существующих.&lt;/p&gt;\n&lt;h2 id=\"obshie-argumenty\"&gt;&lt;a href=\"ru/yql/builtins/json.html#obshie-argumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общие аргументы&lt;/span&gt;&lt;/a&gt;Общие аргументы&lt;/h2&gt;\n&lt;p&gt;Все функции для работы с JSON принимают:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;JSON значение (может быть произвольным выражением типа &lt;code&gt;Json&lt;/code&gt; или &lt;code&gt;Json?&lt;/code&gt;)&lt;/li&gt;\n&lt;li&gt;JsonPath запрос (должен быть явно указан строковым литералом)&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;(Опционально)&lt;/strong&gt; &lt;code&gt;PASSING&lt;/code&gt; секция&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"passing-sekciya\"&gt;&lt;a href=\"ru/yql/builtins/json.html#passing-sekciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PASSING секция&lt;/span&gt;&lt;/a&gt;PASSING секция&lt;/h3&gt;\n&lt;p&gt;Позволяет передавать значения в JsonPath запрос в качестве переменных.&lt;/p&gt;\n&lt;h5 id=\"sintaksis4\"&gt;&lt;a href=\"ru/yql/builtins/json.html#sintaksis4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Синтаксис&lt;/span&gt;&lt;/a&gt;Синтаксис&lt;/h5&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;PASSING\n    &amp;lt;expression 1&amp;gt; AS &amp;lt;variable name 1&amp;gt;,\n    &amp;lt;expression 2&amp;gt; AS &amp;lt;variable name 2&amp;gt;,\n    ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2077\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2077\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2077\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2077.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code&gt;&amp;lt;expression&amp;gt;&lt;/code&gt; может быть следующих типов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Числа, &lt;code&gt;Date&lt;/code&gt;, &lt;code&gt;DateTime&lt;/code&gt; и &lt;code&gt;Timestamp&lt;/code&gt; (будет произведен &lt;code&gt;CAST&lt;/code&gt; в тип &lt;code&gt;Double&lt;/code&gt; перед передачей в JsonPath)&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Utf8&lt;/code&gt;, &lt;code&gt;Bool&lt;/code&gt; и &lt;code&gt;Json&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Имя переменной &lt;code&gt;&amp;lt;variable name&amp;gt;&lt;/code&gt; можно указать несколькими способами:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Как SQL имя, например &lt;code&gt;variable&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;В кавычках, например &lt;code&gt;\"variable\"&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primer8\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primer8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;JSON_VALUE(\n    $json,\n    \"$.timestamp - $Now + $Hour\"\n    PASSING\n        24 * 60 as Hour,\n        CurrentUtcTimestamp() as \"Now\"\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2111\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2111\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2111\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2111.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"json_exists\"&gt;&lt;a href=\"ru/yql/builtins/json.html#json_exists\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;JSON_EXISTS&lt;/span&gt;&lt;/a&gt;JSON_EXISTS&lt;/h2&gt;\n&lt;p&gt;Функция &lt;code&gt;JSON_EXISTS&lt;/code&gt; позволяет проверить, удовлетворяет ли JSON значение указанному JsonPath.&lt;/p&gt;\n&lt;h4 id=\"sintaksis5\"&gt;&lt;a href=\"ru/yql/builtins/json.html#sintaksis5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Синтаксис&lt;/span&gt;&lt;/a&gt;Синтаксис&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;JSON_EXISTS(\n    &amp;lt;JSON expression&amp;gt;,\n    &amp;lt;JsonPath query&amp;gt;,\n    [&amp;lt;PASSING clause&amp;gt;]\n    [{TRUE | FALSE | UNKNOWN | ERROR} ON ERROR]\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2121\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2121\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2121\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2121.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Возвращаемое значение: &lt;code&gt;Bool?&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Значения по умолчанию: если &lt;code&gt;ON ERROR&lt;/code&gt; секция не указана, используется &lt;code&gt;FALSE ON ERROR&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Поведение:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Если &lt;code&gt;&amp;lt;JSON expression&amp;gt;&lt;/code&gt; это &lt;code&gt;NULL&lt;/code&gt; или пустой &lt;code&gt;Json?&lt;/code&gt;, то возвращается пустой &lt;code&gt;Bool?&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Если при выполнении JsonPath возникла ошибка, то возвращаемое значение зависит от &lt;code&gt;ON ERROR&lt;/code&gt; секции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;TRUE&lt;/code&gt; - вернуть &lt;code&gt;True&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;FALSE&lt;/code&gt; - вернуть &lt;code&gt;False&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;UNKNOWN&lt;/code&gt; - вернуть пустой &lt;code&gt;Bool?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ERROR&lt;/code&gt; - завершить весь запрос с ошибкой&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Если результат выполнения JsonPath - это одно или несколько значений, возвращается &lt;code&gt;True&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Иначе возвращается &lt;code&gt;False&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"primery15\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primery15\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$json = CAST(@@{\n    \"title\": \"Rocinante\",\n    \"crew\": [\n        \"James Holden\",\n        \"Naomi Nagata\",\n        \"Alex Kamai\",\n        \"Amos Burton\"\n    ]\n}@@ as Json);\n\nSELECT\n    JSON_EXISTS($json, \"$.title\"), -- True\n    JSON_EXISTS($json, \"$.crew[*]\"), -- True\n    JSON_EXISTS($json, \"$.nonexistent\"); -- False, так как JsonPath вернет пустой результат\n\nSELECT\n    -- Ошибка JsonPath, вернет False, так как по умолчанию используется FALSE ON ERROR\n    JSON_EXISTS($json, \"strict $.nonexistent\");\n\nSELECT\n    -- Ошибка JsonPath, весь YQL запрос завершится ошибкой\n    JSON_EXISTS($json, \"strict $.nonexistent\" ERROR ON ERROR);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2178\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2178\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2178\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2178.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"json_value\"&gt;&lt;a href=\"ru/yql/builtins/json.html#json_value\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;JSON_VALUE&lt;/span&gt;&lt;/a&gt;JSON_VALUE&lt;/h2&gt;\n&lt;p&gt;Функция &lt;code&gt;JSON_VALUE&lt;/code&gt; позволяет извлечь из JSON скалярное значение (все что не массив и не объект).&lt;/p&gt;\n&lt;h4 id=\"sintaksis6\"&gt;&lt;a href=\"ru/yql/builtins/json.html#sintaksis6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Синтаксис&lt;/span&gt;&lt;/a&gt;Синтаксис&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;JSON_VALUE(\n    &amp;lt;JSON expression&amp;gt;,\n    &amp;lt;JsonPath query&amp;gt;,\n    [&amp;lt;PASSING clause&amp;gt;]\n    [RETURNING &amp;lt;type&amp;gt;]\n    [{ERROR | NULL | DEFAULT &amp;lt;expr&amp;gt;} ON EMPTY]\n    [{ERROR | NULL | DEFAULT &amp;lt;expr&amp;gt;} ON ERROR]\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2188\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2188\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2188\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2188.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Возвращаемое значение: &lt;code&gt;&amp;lt;type&amp;gt;?&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Значения по умолчанию:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Если &lt;code&gt;ON EMPTY&lt;/code&gt; секция не указана, используется &lt;code&gt;NULL ON EMPTY&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Если &lt;code&gt;ON ERROR&lt;/code&gt; секция не указана, используется &lt;code&gt;NULL ON ERROR&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Если &lt;code&gt;RETURNING&lt;/code&gt; секция не указана, в качестве &lt;code&gt;&amp;lt;type&amp;gt;&lt;/code&gt; используется &lt;code&gt;Utf8&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Поведение:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Если &lt;code&gt;&amp;lt;JSON expression&amp;gt;&lt;/code&gt; это &lt;code&gt;NULL&lt;/code&gt; или пустой &lt;code&gt;Json?&lt;/code&gt;, то возвращается пустой &lt;code&gt;&amp;lt;type&amp;gt;?&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Если возникла ошибка, то возвращаемое значение зависит от &lt;code&gt;ON ERROR&lt;/code&gt; секции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;NULL&lt;/code&gt; - вернуть пустой &lt;code&gt;&amp;lt;type&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ERROR&lt;/code&gt; - завершить весь запрос с ошибкой&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DEFAULT &amp;lt;expr&amp;gt;&lt;/code&gt; - вернуть &lt;code&gt;&amp;lt;expr&amp;gt;&lt;/code&gt;, предварительно сделав &lt;code&gt;CAST&lt;/code&gt; в тип &lt;code&gt;&amp;lt;type&amp;gt;?&lt;/code&gt;. Если &lt;code&gt;CAST&lt;/code&gt; не удастся, весь запрос завершится с ошибкой&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Если в результате выполнения JsonPath получился пустой результат, то возвращаемое значение зависит от &lt;code&gt;ON EMPTY&lt;/code&gt; секции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;NULL&lt;/code&gt; - вернуть пустой &lt;code&gt;&amp;lt;type&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ERROR&lt;/code&gt; - завершить весь запрос с ошибкой&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DEFAULT &amp;lt;expr&amp;gt;&lt;/code&gt; - вернуть &lt;code&gt;&amp;lt;expr&amp;gt;&lt;/code&gt;, предварительно сделав &lt;code&gt;CAST&lt;/code&gt; в тип &lt;code&gt;&amp;lt;type&amp;gt;?&lt;/code&gt;. Если &lt;code&gt;CAST&lt;/code&gt; не удастся, то поведение соответствует &lt;code&gt;ON ERROR&lt;/code&gt; секции&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Если результат выполнения JsonPath - это одно значение, то:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Если &lt;code&gt;RETURNING&lt;/code&gt; секция не была указана, значение конвертируется в &lt;code&gt;Utf8&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Иначе производится &lt;code&gt;CAST&lt;/code&gt; значения в &lt;code&gt;&amp;lt;type&amp;gt;&lt;/code&gt;. Если &lt;code&gt;CAST&lt;/code&gt; не удастся, то поведение соответствует &lt;code&gt;ON ERROR&lt;/code&gt; секции. При этом значение из JSON должно \"соответствовать\" типу &lt;code&gt;&amp;lt;type&amp;gt;&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Вернуть полученный результат&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Определим соответствие JSON типов YQL типам:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;JSON Number - числовые типы, &lt;code&gt;Date&lt;/code&gt;, &lt;code&gt;DateTime&lt;/code&gt; и &lt;code&gt;Timestamp&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;JSON Bool - &lt;code&gt;Bool&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;JSON String - &lt;code&gt;Utf8&lt;/code&gt; и &lt;code&gt;String&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ошибками при выполнении &lt;code&gt;JSON_VALUE&lt;/code&gt; считаются:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Ошибки во время вычисления JsonPath&lt;/li&gt;\n&lt;li&gt;Результат выполнения JsonPath - это несколько значений или не скалярное значение&lt;/li&gt;\n&lt;li&gt;Тип полученного из JSON значения не совпадает с ожидаемым&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;code&gt;RETURNING&lt;/code&gt; секция поддерживает типы чисел, &lt;code&gt;Date&lt;/code&gt;, &lt;code&gt;DateTime&lt;/code&gt;, &lt;code&gt;Timestamp&lt;/code&gt;, &lt;code&gt;Utf8&lt;/code&gt;, &lt;code&gt;String&lt;/code&gt; и &lt;code&gt;Bool&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"primery16\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primery16\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$json = CAST(@@{\n    \"friends\": [\n        {\n            \"name\": \"James Holden\",\n            \"age\": 35\n        },\n        {\n            \"name\": \"Naomi Nagata\",\n            \"age\": 30\n        }\n    ]\n}@@ as Json);\n\nSELECT\n    JSON_VALUE($json, \"$.friends[0].age\"), -- \"35\" (тип Utf8?)\n    JSON_VALUE($json, \"$.friends[0].age\" RETURNING Uint64), -- 35 (тип Uint64?)\n    JSON_VALUE($json, \"$.friends[0].age\" RETURNING Utf8); -- пустой Utf8?, так как произошла ошибка. Тип JSON значения Number не соответствует строковому типу Utf8\n\nSELECT\n    -- \"empty\" (тип String?)\n    JSON_VALUE(\n        $json,\n        \"$.friends[50].name\"\n        RETURNING String\n        DEFAULT \"empty\" ON EMPTY\n    );\n\nSELECT\n    -- 20 (тип Uint64?). Результат выполнения JsonPath пустой, но значение\n    -- по умолчанию из секции ON EMPTY не может быть приведено к Uint64.\n    -- Поэтому используется значение из ON ERROR\n    JSON_VALUE(\n        $json,\n        \"$.friends[50].age\"\n        RETURNING Uint64\n        DEFAULT -1 ON EMPTY\n        DEFAULT 20 ON ERROR\n    );\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2334\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2334\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2334\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2334.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"json_query\"&gt;&lt;a href=\"ru/yql/builtins/json.html#json_query\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;JSON_QUERY&lt;/span&gt;&lt;/a&gt;JSON_QUERY&lt;/h2&gt;\n&lt;p&gt;Функция &lt;code&gt;JSON_QUERY&lt;/code&gt; позволяет извлекать из JSON массивы и объекты.&lt;/p&gt;\n&lt;h4 id=\"sintaksis7\"&gt;&lt;a href=\"ru/yql/builtins/json.html#sintaksis7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Синтаксис&lt;/span&gt;&lt;/a&gt;Синтаксис&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;JSON_QUERY(\n    &amp;lt;JSON expression&amp;gt;,\n    &amp;lt;JsonPath query&amp;gt;,\n    [&amp;lt;PASSING clause&amp;gt;]\n    [WITHOUT [ARRAY] | WITH [CONDITIONAL | UNCONDITIONAL] [ARRAY] WRAPPER]\n    [{ERROR | NULL | EMPTY ARRAY | EMPTY OBJECT} ON EMPTY]\n    [{ERROR | NULL | EMPTY ARRAY | EMPTY OBJECT} ON ERROR]\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2344\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2344\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2344\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2344.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Возвращаемое значение &lt;code&gt;Json?&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Значения по умолчанию&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Если &lt;code&gt;ON EMPTY&lt;/code&gt; секция не указана, используется &lt;code&gt;NULL ON EMPTY&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Если &lt;code&gt;ON ERROR&lt;/code&gt; секция не указана, используется &lt;code&gt;NULL ON ERROR&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Если &lt;code&gt;WRAPPER&lt;/code&gt; секция не указана, используется &lt;code&gt;WITHOUT WRAPPER&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Если указана секция &lt;code&gt;WITH WRAPPER&lt;/code&gt;, но не указано &lt;code&gt;CONDITIONAL&lt;/code&gt; или &lt;code&gt;UNCONDITIONAL&lt;/code&gt;, используется &lt;code&gt;UNCONDITIONAL&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Поведение:&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Указывать секции &lt;code&gt;WITH ... WRAPPER&lt;/code&gt; и &lt;code&gt;ON EMPTY&lt;/code&gt; одновременно нельзя&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Если &lt;code&gt;&amp;lt;JSON expression&amp;gt;&lt;/code&gt; это &lt;code&gt;NULL&lt;/code&gt; или пустой &lt;code&gt;Json?&lt;/code&gt;, то возвращается пустой &lt;code&gt;Json?&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Если указана &lt;code&gt;WRAPPER&lt;/code&gt; секция, то:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;WITHOUT WRAPPER&lt;/code&gt; или &lt;code&gt;WITHOUT ARRAY WRAPPER&lt;/code&gt; - никак не преобразовывать результат выполнения JsonPath&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;WITH UNCONDITIONAL WRAPPER&lt;/code&gt; или &lt;code&gt;WITH UNCONDITIONAL ARRAY WRAPPER&lt;/code&gt; - обернуть результат выполнения JsonPath в массив&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;WITH CONDITIONAL WRAPPER&lt;/code&gt; или &lt;code&gt;WITH CONDITIONAL ARRAY WRAPPER&lt;/code&gt; - обернуть результат выполнения JsonPath в массив если он не является единственным массивом или объектом&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Если в результате выполнения JsonPath получился пустой результат, то возвращаемое значение зависит от &lt;code&gt;ON EMPTY&lt;/code&gt; секции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;NULL&lt;/code&gt; - вернуть пустой &lt;code&gt;Json?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ERROR&lt;/code&gt; - завершить весь запрос с ошибкой&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;EMPTY ARRAY&lt;/code&gt; - вернуть пустой JSON массив, &lt;code&gt;[]&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;EMPTY OBJECT&lt;/code&gt; - вернуть пустой JSON объект, &lt;code&gt;{}&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Если возникла ошибка, то возвращаемое значение зависит от &lt;code&gt;ON ERROR&lt;/code&gt; секции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;NULL&lt;/code&gt; - вернуть пустой &lt;code&gt;Json?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ERROR&lt;/code&gt; - завершить весь запрос с ошибкой&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;EMPTY ARRAY&lt;/code&gt; - вернуть пустой JSON массив, &lt;code&gt;[]&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;EMPTY OBJECT&lt;/code&gt; - вернуть пустой JSON объект, &lt;code&gt;{}&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Вернуть полученный результат&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Ошибками при выполнении &lt;code&gt;JSON_QUERY&lt;/code&gt; считаются:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Ошибки во время вычисления JsonPath&lt;/li&gt;\n&lt;li&gt;Результат выполнения JsonPath - это несколько значений (даже после применения секции &lt;code&gt;WRAPPER&lt;/code&gt;) или скалярное значение&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery17\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primery17\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$json = CAST(@@{\n    \"friends\": [\n        {\n            \"name\": \"James Holden\",\n            \"age\": 35\n        },\n        {\n            \"name\": \"Naomi Nagata\",\n            \"age\": 30\n        }\n    ]\n}@@ as Json);\n\nSELECT\n    JSON_QUERY($json, \"$.friends[0]\"); -- {\"name\": \"James Holden\", \"age\": 35}\n\nSELECT\n    JSON_QUERY($json, \"$.friends.name\" WITH UNCONDITIONAL WRAPPER); -- [\"James Holden\", \"Naomi Nagata\"]\n\nSELECT\n    JSON_QUERY($json, \"$.friends[0]\" WITH CONDITIONAL WRAPPER), -- {\"name\": \"James Holden\", \"age\": 35}\n    JSON_QUERY($json, \"$.friends.name\" WITH CONDITIONAL WRAPPER); -- [\"James Holden\", \"Naomi Nagata\"]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2492\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2492\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2492\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2492.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/builtins/json.md","sourcePath":"ru/yql/builtins/json.md"},"headings":[{"title":"Cookbook","href":"ru/yql/builtins/json.html#cookbook","level":2,"items":[{"title":"Обращение к полю в базе данных","href":"ru/yql/builtins/json.html#obrashenie-k-polyu-v-baze-dannyh","level":3}]},{"title":"JsonPath","href":"ru/yql/builtins/json.html#jsonpath","level":2,"items":[{"title":"Quick reference","href":"ru/yql/builtins/json.html#quick-reference","level":3},{"title":"Модель данных","href":"ru/yql/builtins/json.html#model-dannyh","level":3},{"title":"Режим выполнения","href":"ru/yql/builtins/json.html#rezhim-vypolneniya","level":3,"items":[{"title":"Автоматическая распаковка массива","href":"ru/yql/builtins/json.html#avtomaticheskaya-raspakovka-massiva","level":4,"items":[{"title":"Пример","href":"ru/yql/builtins/json.html#primer","level":5}]},{"title":"Обертка в массив","href":"ru/yql/builtins/json.html#obertka-v-massiv","level":4,"items":[{"title":"Пример","href":"ru/yql/builtins/json.html#primer1","level":5}]},{"title":"Обработка ошибок","href":"ru/yql/builtins/json.html#obrabotka-oshibok","level":4}]},{"title":"Литералы","href":"ru/yql/builtins/json.html#literaly","level":3},{"title":"Обращение к ключу JSON объекта","href":"ru/yql/builtins/json.html#obrashenie-k-klyuchu-json-obuekta","level":3,"items":[{"title":"Пример","href":"ru/yql/builtins/json.html#primer2","level":4}]},{"title":"Обращение ко всем ключам JSON объекта","href":"ru/yql/builtins/json.html#obrashenie-ko-vsem-klyucham-json-obuekta","level":3,"items":[{"title":"Пример","href":"ru/yql/builtins/json.html#primer3","level":4}]},{"title":"Обращение к элементу массива","href":"ru/yql/builtins/json.html#obrashenie-k-elementu-massiva","level":3,"items":[{"title":"Примеры","href":"ru/yql/builtins/json.html#primery","level":4}]},{"title":"Обращение ко всем элементам массива","href":"ru/yql/builtins/json.html#obrashenie-ko-vsem-elementam-massiva","level":3,"items":[{"title":"Примеры","href":"ru/yql/builtins/json.html#primery1","level":4}]},{"title":"Арифметические операции","href":"ru/yql/builtins/json.html#arifmeticheskie-operacii","level":3,"items":[{"title":"Унарные операции","href":"ru/yql/builtins/json.html#unarnye-operacii","level":4,"items":[{"title":"Пример","href":"ru/yql/builtins/json.html#primer4","level":5}]},{"title":"Бинарные операции","href":"ru/yql/builtins/json.html#binarnye-operacii","level":4,"items":[{"title":"Примеры","href":"ru/yql/builtins/json.html#primery2","level":5}]}]},{"title":"Булевские значения","href":"ru/yql/builtins/json.html#bulevskie-znacheniya","level":3},{"title":"Логические операции","href":"ru/yql/builtins/json.html#logicheskie-operacii","level":3,"items":[{"title":"Логическое отрицание !","href":"ru/yql/builtins/json.html#logicheskoe-otricanie","level":4},{"title":"Логическое И &amp;&amp;","href":"ru/yql/builtins/json.html#logicheskoe-i-andand","level":4},{"title":"Логическое ИЛИ ||","href":"ru/yql/builtins/json.html#logicheskoe-ili-oror","level":4,"items":[{"title":"Примеры","href":"ru/yql/builtins/json.html#primery3","level":5}]}]},{"title":"Операторы сравнения","href":"ru/yql/builtins/json.html#operatory-sravneniya","level":3,"items":[{"title":"Пример","href":"ru/yql/builtins/json.html#primer5","level":4}]},{"title":"Предикаты","href":"ru/yql/builtins/json.html#predikaty","level":3,"items":[{"title":"like_regex","href":"ru/yql/builtins/json.html#like_regex","level":4,"items":[{"title":"Исполнение","href":"ru/yql/builtins/json.html#ispolnenie","level":5}]},{"title":"Примеры","href":"ru/yql/builtins/json.html#primery4","level":4},{"title":"starts with","href":"ru/yql/builtins/json.html#starts-with","level":4,"items":[{"title":"Исполнение","href":"ru/yql/builtins/json.html#ispolnenie1","level":5},{"title":"Примеры","href":"ru/yql/builtins/json.html#primery5","level":5}]},{"title":"exists","href":"ru/yql/builtins/json.html#exists","level":4,"items":[{"title":"Исполнение","href":"ru/yql/builtins/json.html#ispolnenie2","level":5},{"title":"Примеры","href":"ru/yql/builtins/json.html#primery6","level":5}]},{"title":"is unknown","href":"ru/yql/builtins/json.html#is-unknown","level":4,"items":[{"title":"Исполнение","href":"ru/yql/builtins/json.html#ispolnenie3","level":5},{"title":"Примеры","href":"ru/yql/builtins/json.html#primery7","level":5}]}]},{"title":"Фильтры","href":"ru/yql/builtins/json.html#filtry","level":3,"items":[{"title":"Пример","href":"ru/yql/builtins/json.html#primer6","level":4}]},{"title":"Методы","href":"ru/yql/builtins/json.html#metody","level":3,"items":[{"title":"type","href":"ru/yql/builtins/json.html#type","level":4,"items":[{"title":"Примеры","href":"ru/yql/builtins/json.html#primery8","level":5}]},{"title":"size","href":"ru/yql/builtins/json.html#size","level":4},{"title":"Примеры","href":"ru/yql/builtins/json.html#primery9","level":4},{"title":"double","href":"ru/yql/builtins/json.html#double","level":4,"items":[{"title":"Примеры","href":"ru/yql/builtins/json.html#primery10","level":5}]},{"title":"ceiling","href":"ru/yql/builtins/json.html#ceiling","level":4,"items":[{"title":"Примеры","href":"ru/yql/builtins/json.html#primery11","level":5}]},{"title":"floor","href":"ru/yql/builtins/json.html#floor","level":4,"items":[{"title":"Примеры","href":"ru/yql/builtins/json.html#primery12","level":5}]},{"title":"abs","href":"ru/yql/builtins/json.html#abs","level":4,"items":[{"title":"Примеры","href":"ru/yql/builtins/json.html#primery13","level":5}]},{"title":"keyvalue","href":"ru/yql/builtins/json.html#keyvalue","level":4,"items":[{"title":"Примеры","href":"ru/yql/builtins/json.html#primery14","level":5}]}]},{"title":"Переменные","href":"ru/yql/builtins/json.html#peremennye","level":3,"items":[{"title":"Пример","href":"ru/yql/builtins/json.html#primer7","level":4}]}]},{"title":"Общие аргументы","href":"ru/yql/builtins/json.html#obshie-argumenty","level":2,"items":[{"title":"PASSING секция","href":"ru/yql/builtins/json.html#passing-sekciya","level":3,"items":[{"title":"Пример","href":"ru/yql/builtins/json.html#primer8","level":4}]}]},{"title":"JSON_EXISTS","href":"ru/yql/builtins/json.html#json_exists","level":2},{"title":"JSON_VALUE","href":"ru/yql/builtins/json.html#json_value","level":2},{"title":"JSON_QUERY","href":"ru/yql/builtins/json.html#json_query","level":2}],"title":"Функции для работы с JSON"},"router":{"pathname":"ru/yql/builtins/json","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f66619
