        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;JSON&lt;/strong&gt; - слабо схематизированный &lt;a href=\"https://www.json.org\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;формат данных&lt;/a&gt;, представленный в YQL типом &lt;code&gt;Json&lt;/code&gt;. В отличии от реляционных таблиц, JSON может хранить данные, для которых схема не определена. Вот пример валидного JSON:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Jim Holden\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"age\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;30&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Naomi Nagata\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"age\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"twenty years old\"&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"4\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-4\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-4\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-4.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Несмотря на то, что в первом объекте поле &lt;code&gt;age&lt;/code&gt; имеет тип &lt;code&gt;Number&lt;/code&gt; (&lt;code&gt;\"age\": 21&lt;/code&gt;), а во втором &lt;code&gt;String&lt;/code&gt; (&lt;code&gt;\"age\": \"twenty years old\"&lt;/code&gt;), это полностью валидный JSON.&lt;/p&gt;\n&lt;p&gt;Для работы с JSON, YQL реализует подмножество стандарта &lt;a href=\"https://www.iso.org/standard/67367.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;SQL support for JavaScript Object Notation (JSON)&lt;/a&gt;, являющегося частью общепринятого стандарта ANSI SQL.&lt;/p&gt;\n&lt;h2 id=\"cookbook\"&gt;&lt;a href=\"ru/yql/builtins/json.html#cookbook\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cookbook&lt;/span&gt;&lt;/a&gt;Cookbook&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$json = CAST(@@{\n    \"friends\": [\n        {\n            \"name\": \"James Holden\",\n            \"age\": 35\n        },\n        {\n            \"name\": \"Naomi Nagata\",\n            \"age\": 30\n        }\n    ]\n}@@ AS Json);\n\nSELECT\n    JSON_EXISTS($json, \"$.friends[*].name\"), -- True,\n    JSON_VALUE($json, \"$.friends[0].age\"), -- \"35\" (тип Utf8?)\n    JSON_QUERY($json, \"$.friends[0]\"); -- {\"name\": \"James Holden\", \"age\": 35}\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"14\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-14\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-14\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-14.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"obrashenie-k-polyu-v-baze-dannyh\"&gt;&lt;a href=\"ru/yql/builtins/json.html#obrashenie-k-polyu-v-baze-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обращение к полю в базе данных&lt;/span&gt;&lt;/a&gt;Обращение к полю в базе данных&lt;/h3&gt;\n&lt;p&gt;В таблицах данные могут хранить в JSON или в строковом представлении. Функции &lt;code&gt;JSON_*&lt;/code&gt; для работы ожидают на вход JSON. Для преобразования &lt;code&gt;String-&amp;gt;JSON&lt;/code&gt; нужно воспользоваться функцией &lt;code&gt;CAST&lt;/code&gt;, например &lt;code&gt;CAST (my_string AS JSON)&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"jsonpath\"&gt;&lt;a href=\"ru/yql/builtins/json.html#jsonpath\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;JsonPath&lt;/span&gt;&lt;/a&gt;JsonPath&lt;/h2&gt;\n&lt;p&gt;Для обращения к значениям внутри JSON используется язык запросов JsonPath. Все функции для работы с JSON принимают JsonPath запрос в качестве аргумента.&lt;/p&gt;\n&lt;p&gt;Сразу разберем пример. Пусть у нас есть JSON:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"comments\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"id\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;123&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"text\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"A whisper will do, if it's all that you can manage.\"&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"id\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;456&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"text\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"My life has become a single, ongoing revelation that I haven’t been cynical enough.\"&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"30\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-30\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-30\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-30.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Тогда чтобы получить текст второго комментария можно написать JsonPath запрос:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$.comments[1].text\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"34\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-34\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-34\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-34.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В этом запросе:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;$&lt;/code&gt; - это способ обратиться ко всему JSON&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;$.comments&lt;/code&gt; - обращение к ключу &lt;code&gt;comments&lt;/code&gt; объекта JSON&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;$.comments[1]&lt;/code&gt; - обращение ко второму элементу массива JSON (нумерация с элементов начинается с 0)&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;$.comments[1].text&lt;/code&gt; - обращение к ключу &lt;code&gt;text&lt;/code&gt; объекта JSON&lt;/li&gt;\n&lt;li&gt;Результат выполнения: &lt;code&gt;\"My life has become a single, ongoing revelation that I haven’t been cynical enough.\"&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"quick-reference\"&gt;&lt;a href=\"ru/yql/builtins/json.html#quick-reference\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Quick reference&lt;/span&gt;&lt;/a&gt;Quick reference&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Операция&lt;/th&gt;\n&lt;th&gt;Пример&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Извлечь ключ JSON объекта&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$.key&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Извлечь все ключи JSON объекта&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$.*&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Обращение к элементу массива&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$[25]&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Извлечение подотрезка массива&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$[2 to 5]&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Обращение к последнему элементу массива&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$[last]&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Обращение ко всем элементам массива&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$[*]&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Унарные операции&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;- 1&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Бинарные операции&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;(12 * 3) % 4 + 8&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Обращение к переменной&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$variable&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Логические операции&lt;/td&gt;\n&lt;td&gt;`(1 &amp;gt; 2) || (3 &amp;lt;= 4) &amp;amp;&amp;amp; (\"string\" == \"another\")|&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Соответствие регулярному выражению&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$.name like_regex \"^[A-Za-z]+$\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Проверка префикса строки&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$.name starts with \"Bobbie\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Проверка существования пути&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;exists ($.profile.name)&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Проверка булевского выражения на null&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;($.age &amp;gt; 20) is unknown&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Фильтрация значений&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$.friends ? (@.age &amp;gt;= 18 &amp;amp;&amp;amp; @.gender == \"male\")&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Получение типа значения&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$.name.type()&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Получение размера массива&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$.friends.size()&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Преобразование строки в число&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$.number.double()&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Округление числа вверх&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$.number.ceiling()&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Округление числа вниз&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$.number.floor()&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Абсолютное значение числа&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$.number.abs()&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Получение пар ключ-значения из объекта&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$.profile.keyvalue()&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"model-dannyh\"&gt;&lt;a href=\"ru/yql/builtins/json.html#model-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модель данных&lt;/span&gt;&lt;/a&gt;Модель данных&lt;/h3&gt;\n&lt;p&gt;Результат выполнения всех JsonPath выражений - это последовательность JSON значений. Например:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Результат выражения &lt;code&gt;\"Bobbie\"&lt;/code&gt; - это последовательность длины 1 с единственным элементом &lt;code&gt;\"Bobbie\"&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Результат выражения &lt;code&gt;$&lt;/code&gt; (взятие всего JSON объекта) на JSON &lt;code&gt;[1, 2, 3]&lt;/code&gt; - это &lt;code&gt;[1, 2, 3]&lt;/code&gt;. Последовательность из 1 элемента, массива &lt;code&gt;[1, 2, 3]&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Результат выражения &lt;code&gt;$[*]&lt;/code&gt; (извлечение всех элементов массива) на JSON &lt;code&gt;[1, 2, 3]&lt;/code&gt; - это &lt;code&gt;1, 2, 3&lt;/code&gt;. Последовательность из трех элементов &lt;code&gt;1&lt;/code&gt;, &lt;code&gt;2&lt;/code&gt; и &lt;code&gt;3&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Если входная последовательность состоит из нескольких значений, некоторые операции исполнятся для каждого элемента (например, доступ к ключу JSON объекта). При этом другие операции требуют последовательности из одного элемента на вход (например, бинарные арифметические операции).&lt;/p&gt;\n&lt;p&gt;Поведение конкретной операции описано в соответствующей секции документации.&lt;/p&gt;\n&lt;h3 id=\"rezhim-vypolneniya\"&gt;&lt;a href=\"ru/yql/builtins/json.html#rezhim-vypolneniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Режим выполнения&lt;/span&gt;&lt;/a&gt;Режим выполнения&lt;/h3&gt;\n&lt;p&gt;JsonPath поддерживает два режима выполнения - &lt;code&gt;lax&lt;/code&gt; и &lt;code&gt;strict&lt;/code&gt;. Указание режима не обязательно, по умолчанию используется &lt;code&gt;lax&lt;/code&gt;. Режим указывается в начале запроса, например: &lt;code&gt;strict $.key&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Поведение при каждом режиме описано в разделе соответствующих JsonPath операций.&lt;/p&gt;\n&lt;h4 id=\"avtomaticheskaya-raspakovka-massiva\"&gt;&lt;a href=\"ru/yql/builtins/json.html#avtomaticheskaya-raspakovka-massiva\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Автоматическая распаковка массива&lt;/span&gt;&lt;/a&gt;Автоматическая распаковка массива&lt;/h4&gt;\n&lt;p&gt;При обращении к ключу JSON объекта в &lt;code&gt;lax&lt;/code&gt; режиме массивы автоматически распаковываются.&lt;/p&gt;\n&lt;h5 id=\"primer\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h5&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"key\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;123&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"key\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;456&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"305\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-305\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-305\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-305.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Запрос &lt;code&gt;lax $.key&lt;/code&gt; успешно выполнится с результатом &lt;code&gt;123, 456&lt;/code&gt;. Поскольку &lt;code&gt;$&lt;/code&gt; является массивом, он автоматически распакуется, и обращение к ключу JSON объекта &lt;code&gt;$.key&lt;/code&gt; будет выполнено для каждого элемента массива.&lt;/p&gt;\n&lt;p&gt;При этом запрос &lt;code&gt;strict $.key&lt;/code&gt; завершится с ошибкой. В &lt;code&gt;strict&lt;/code&gt; режиме нет автоматической распаковки массивов. &lt;code&gt;$&lt;/code&gt; является массивом, а не объектом, поэтому обращение к ключу объекта &lt;code&gt;$.key&lt;/code&gt; не может быть выполнено. Это можно исправить, написав &lt;code&gt;strict $[*].key&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Распаковка происходит только на 1 уровень вглубь. В случае вложенных массивов распаковывается только самый внешний из них.&lt;/p&gt;\n&lt;h4 id=\"obertka-v-massiv\"&gt;&lt;a href=\"ru/yql/builtins/json.html#obertka-v-massiv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обертка в массив&lt;/span&gt;&lt;/a&gt;Обертка в массив&lt;/h4&gt;\n&lt;p&gt;При обращении к элементу массива в &lt;code&gt;lax&lt;/code&gt; режиме JSON значения автоматически оборачиваются в массив.&lt;/p&gt;\n&lt;h5 id=\"primer1\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primer1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h5&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Avasarala\"&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"324\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-324\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-324\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-324.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Запрос &lt;code&gt;lax $[0].name&lt;/code&gt; выполнится успешно с результатом &lt;code&gt;\"Avasarala\"&lt;/code&gt;. Поскольку &lt;code&gt;$&lt;/code&gt; не является массивом, он будет автоматически обернут в массив длины один. Обращение к первому элементу &lt;code&gt;$[0]&lt;/code&gt; вернет исходный JSON объект, в котором будет взят ключ &lt;code&gt;name&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;При этом запрос &lt;code&gt;strict $[0].name&lt;/code&gt; завершится с ошибкой. В &lt;code&gt;strict&lt;/code&gt; режиме нет автоматической обертки в массив. &lt;code&gt;$&lt;/code&gt; является объектом, а не массивом, поэтому обращение к элементу &lt;code&gt;$[0]&lt;/code&gt; не может быть выполнено. Это можно исправить, написав &lt;code&gt;strict $.name&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"obrabotka-oshibok\"&gt;&lt;a href=\"ru/yql/builtins/json.html#obrabotka-oshibok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обработка ошибок&lt;/span&gt;&lt;/a&gt;Обработка ошибок&lt;/h4&gt;\n&lt;p&gt;Некоторые ошибки конвертируются в пустой результат при выполнении в &lt;code&gt;lax&lt;/code&gt; режиме.&lt;/p&gt;\n&lt;h3 id=\"literaly\"&gt;&lt;a href=\"ru/yql/builtins/json.html#literaly\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Литералы&lt;/span&gt;&lt;/a&gt;Литералы&lt;/h3&gt;\n&lt;p&gt;Значения некоторых типов можно указать в JsonPath запросе используя литералы:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;Пример&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Числа&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;42&lt;/code&gt;, &lt;code&gt;-1.23e-5&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Булевские значения&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;, &lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Null&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Строки&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Belt\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"obrashenie-k-klyuchu-json-obuekta\"&gt;&lt;a href=\"ru/yql/builtins/json.html#obrashenie-k-klyuchu-json-obuekta\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обращение к ключу JSON объекта&lt;/span&gt;&lt;/a&gt;Обращение к ключу JSON объекта&lt;/h3&gt;\n&lt;p&gt;JsonPath поддерживает обращение к ключам JSON объектов: &lt;code&gt;$.session.user.name&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Обращение без кавычек можно использовать только для ключей, которые начинаются с буквы английского алфавита или подчеркивания, и содержат в себе только буквы английского алфавита, подчеркивания, цифры и знак доллара. Для всех остальных ключей необходимо использовать кавычки. Например: &lt;code&gt;$.profile.\"this string has spaces\"&lt;/code&gt;, &lt;code&gt;$.user.\"42 is the answer\"&lt;/code&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для каждого значения из входной последовательности:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Если значение является массивом, в &lt;code&gt;lax&lt;/code&gt; режиме происходит автоматическая распаковка массива&lt;/li&gt;\n&lt;li&gt;Если значение не является JSON объектом или указанный ключ в этом JSON объекте отсутствует, в &lt;code&gt;strict&lt;/code&gt; режиме запрос завершается ошибкой. В &lt;code&gt;lax&lt;/code&gt; режиме для этого значения возвращается пустой результат&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Результат выражения - конкатенация результатов для каждого значения из входной последовательности.&lt;/p&gt;\n&lt;h4 id=\"primer2\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primer2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Amos\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"friends\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Jim\"&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Alex\"&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"426\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-426\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-426\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-426.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;lax&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;strict&lt;/code&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;$.name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Amos\"&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Amos\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;$.surname&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Пустой результат&lt;/td&gt;\n&lt;td&gt;Ошибка&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;$.friends.name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Jim\", \"Alex\"&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ошибка&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"obrashenie-ko-vsem-klyucham-json-obuekta\"&gt;&lt;a href=\"ru/yql/builtins/json.html#obrashenie-ko-vsem-klyucham-json-obuekta\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обращение ко всем ключам JSON объекта&lt;/span&gt;&lt;/a&gt;Обращение ко всем ключам JSON объекта&lt;/h3&gt;\n&lt;p&gt;JsonPath поддерживает обращение ко всем ключам JSON объектов сразу: &lt;code&gt;$.*&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Для каждого значения из входной последовательности:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Если значение является массивом, в &lt;code&gt;lax&lt;/code&gt; режиме происходит автоматическая распаковка массива&lt;/li&gt;\n&lt;li&gt;Если значение не является JSON объектом, в &lt;code&gt;strict&lt;/code&gt; режиме запрос завершается ошибкой. В &lt;code&gt;lax&lt;/code&gt; режиме для этого значения возвращается пустой результат&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Результат выражения - конкатенация результатов для каждого значения из входной последовательности.&lt;/p&gt;\n&lt;h4 id=\"primer3\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primer3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"profile\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"id\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;123&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Amos\"&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"friends\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Jim\"&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Alex\"&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"504\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-504\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-504\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-504.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;lax&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;strict&lt;/code&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;$.profile.*&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;123, \"Amos\"&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;123, \"Amos\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;$.friends.*&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Jim\", \"Alex\"&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ошибка&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"obrashenie-k-elementu-massiva\"&gt;&lt;a href=\"ru/yql/builtins/json.html#obrashenie-k-elementu-massiva\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обращение к элементу массива&lt;/span&gt;&lt;/a&gt;Обращение к элементу массива&lt;/h3&gt;\n&lt;p&gt;JsonPath поддерживает обращение к элементам массивов: &lt;code&gt;$.friends[1, 3 to last - 1]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Для каждого значения из входной последовательности:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Если значение не является массивом, то в &lt;code&gt;strict&lt;/code&gt; режиме запрос завершается ошибкой. В &lt;code&gt;lax&lt;/code&gt; режиме происходит автоматическая обертка в массив&lt;/li&gt;\n&lt;li&gt;Ключевое слово &lt;code&gt;last&lt;/code&gt; заменяется на последний индекс массива. Использование &lt;code&gt;last&lt;/code&gt; вне обращения к массиву - это ошибка в обоих режимах&lt;/li&gt;\n&lt;li&gt;Вычисляются указанные индексы. Каждый из них должен быть единственным числом, иначе запрос завершается ошибкой в обоих режимах&lt;/li&gt;\n&lt;li&gt;Если индекс является дробным числом, он округляется вниз&lt;/li&gt;\n&lt;li&gt;Если индекс выходит за границы массива, то в &lt;code&gt;strict&lt;/code&gt; режиме запрос завершается ошибкой. В &lt;code&gt;lax&lt;/code&gt; режиме такой индекс игнорируется&lt;/li&gt;\n&lt;li&gt;Если указан отрезок и его стартовый индекс больше конечного индекса (например &lt;code&gt;$[20 to 1]&lt;/code&gt;), то в &lt;code&gt;strict&lt;/code&gt; режиме запрос завершается ошибкой. В &lt;code&gt;lax&lt;/code&gt; режиме такой отрезок игнорируется.&lt;/li&gt;\n&lt;li&gt;К результату добавляются все элементы по указанным индексам. Отрезки включают в себя &lt;strong&gt;оба конца&lt;/strong&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"primery\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Camina\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"surname\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Drummer\"&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Josephus\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"surname\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Miller\"&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Bobbie\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"surname\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Draper\"&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Julie\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"surname\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Mao\"&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"593\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-593\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-593\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-593.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;lax&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;strict&lt;/code&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;$[0].name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Camina\"&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Camina\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;$[1, 2 to 3].name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Josephus\", \"Bobbie\", \"Julie\"&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Josephus\", \"Bobbie\", \"Julie\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;$[last - 2].name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Josephus\"&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Josephus\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;$[2, last + 200 to 50].name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Bobbie\"&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ошибка&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;$[50].name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Пустой результат&lt;/td&gt;\n&lt;td&gt;Ошибка&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"obrashenie-ko-vsem-elementam-massiva\"&gt;&lt;a href=\"ru/yql/builtins/json.html#obrashenie-ko-vsem-elementam-massiva\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обращение ко всем элементам массива&lt;/span&gt;&lt;/a&gt;Обращение ко всем элементам массива&lt;/h3&gt;\n&lt;p&gt;JsonPath поддерживает обращение ко всем элементам массива сразу: &lt;code&gt;$[*]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Для каждого значения из входной последовательности:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Если значение не является массивом, то в &lt;code&gt;strict&lt;/code&gt; режиме запрос завершается ошибкой. В &lt;code&gt;lax&lt;/code&gt; режиме происходит автоматическая обертка в массив&lt;/li&gt;\n&lt;li&gt;К результату добавляются все элементы текущего массива&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"primery1\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primery1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"class\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Station\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"title\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Medina\"&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"class\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Corvette\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"title\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Rocinante\"&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"690\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-690\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-690\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-690.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;lax&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;strict&lt;/code&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;$[*].title&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Medina\", \"Rocinante\"&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Medina\", \"Rocinante\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;lax $[0][*].class&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Station\"&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ошибка&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Разберем последний пример по шагам:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;$[0]&lt;/code&gt; возвращает первый элемент массива, то есть &lt;code&gt;{\"class\": \"Station\", \"title\": \"Medina\"}&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;$[0][*]&lt;/code&gt; ожидает массив на вход, но был дан объект. Происходит автоматическая обертка в массив, получается &lt;code&gt;[ {\"class\": \"Station\", \"title\": \"Medina\"} ]&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Теперь &lt;code&gt;$[0][*]&lt;/code&gt; может выполниться и возвращает все элементы массива, то есть &lt;code&gt;{\"class\": \"Station\", \"title\": \"Medina\"}&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;$[0][*].class&lt;/code&gt; возвращает поле &lt;code&gt;class&lt;/code&gt;, то есть &lt;code&gt;\"Station\"&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"arifmeticheskie-operacii\"&gt;&lt;a href=\"ru/yql/builtins/json.html#arifmeticheskie-operacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Арифметические операции&lt;/span&gt;&lt;/a&gt;Арифметические операции&lt;/h3&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Все арифметические операции работают с числами как с Double. Возможна &lt;a href=\"https://docs.oracle.com/cd/E19957-01/806-3568/ncg_goldberg.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;потеря точности&lt;/a&gt; при вычислениях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"unarnye-operacii\"&gt;&lt;a href=\"ru/yql/builtins/json.html#unarnye-operacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Унарные операции&lt;/span&gt;&lt;/a&gt;Унарные операции&lt;/h4&gt;\n&lt;p&gt;JsonPath поддерживает унарный &lt;code&gt;+&lt;/code&gt; и &lt;code&gt;-&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Унарная операция применяется ко всем значениям из входной последовательности. Если унарной операции подать на вход не число, запрос завершится ошибкой в обоих режимах.&lt;/p&gt;\n&lt;h5 id=\"primer4\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primer4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h5&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;4&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"780\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-780\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-780\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-780.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Запрос &lt;code&gt;strict -$[*]&lt;/code&gt; завершится успешно с результатом &lt;code&gt;-1, -2, -3, -4&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Запрос &lt;code&gt;lax -$&lt;/code&gt; завершится с ошибкой, потому что &lt;code&gt;$&lt;/code&gt; является массивом, а не числом.&lt;/p&gt;\n&lt;h4 id=\"binarnye-operacii\"&gt;&lt;a href=\"ru/yql/builtins/json.html#binarnye-operacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бинарные операции&lt;/span&gt;&lt;/a&gt;Бинарные операции&lt;/h4&gt;\n&lt;p&gt;JsonPath поддерживает бинарные арифметические операции (в порядке убывания приоритета):&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Умножение &lt;code&gt;*&lt;/code&gt;, деление чисел с плавающей точкой &lt;code&gt;/&lt;/code&gt;, взятие остатка &lt;code&gt;%&lt;/code&gt; (работает как функция &lt;code&gt;MOD&lt;/code&gt; в &lt;code&gt;SQL&lt;/code&gt;)&lt;/li&gt;\n&lt;li&gt;Сложение &lt;code&gt;+&lt;/code&gt;, вычитание &lt;code&gt;-&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Порядок выполнения операций можно поменять используя скобочки.&lt;/p&gt;\n&lt;p&gt;В случае если каждый аргумент бинарной операции не является единственным числом или происходит деление на ноль, запрос завершается ошибкой в обоих режимах.&lt;/p&gt;\n&lt;h5 id=\"primery2\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primery2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h5&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;(1 + 2) * 3&lt;/code&gt; даст &lt;code&gt;9&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;1 / 2&lt;/code&gt; даст &lt;code&gt;0.5&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;5 % 2&lt;/code&gt; даст &lt;code&gt;1&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;1 / 0&lt;/code&gt; завершится ошибкой&lt;/li&gt;\n&lt;li&gt;При JSON &lt;code&gt;[-32.4, 5.2]&lt;/code&gt; запрос &lt;code&gt;$[0] % $[1]&lt;/code&gt; даст &lt;code&gt;-1.2&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;При JSON &lt;code&gt;[1, 2, 3, 4]&lt;/code&gt; запрос &lt;code&gt;lax $[*] + $[*]&lt;/code&gt; завершится ошибкой, так как результат выражения &lt;code&gt;$[*]&lt;/code&gt; - это &lt;code&gt;1, 2, 3, 4&lt;/code&gt;, несколько чисел. Бинарная операция требует только одно число для каждого своего аргумента.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"bulevskie-znacheniya\"&gt;&lt;a href=\"ru/yql/builtins/json.html#bulevskie-znacheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Булевские значения&lt;/span&gt;&lt;/a&gt;Булевские значения&lt;/h3&gt;\n&lt;p&gt;В отличии от некоторых языков программирования, в JsonPath булевскими значениями считаются не только &lt;code&gt;true&lt;/code&gt; (истина) и &lt;code&gt;false&lt;/code&gt; (ложь), но и &lt;code&gt;null&lt;/code&gt; (неопределенность).&lt;/p&gt;\n&lt;p&gt;JsonPath считает все значения, полученные из JSON документа, не булевскими. Например, запрос &lt;code&gt;! $.is_valid_user&lt;/code&gt; (логическое отрицание, примененное к полю &lt;code&gt;is_valid_user&lt;/code&gt;), является синтаксически неверным поскольку поле &lt;code&gt;is_valid_user&lt;/code&gt; не является булевским значением (даже если по факту в нем хранится &lt;code&gt;true&lt;/code&gt; или &lt;code&gt;false&lt;/code&gt;). Правильный способ написать такой запрос - это явно использовать сравнение с булевским значением, например &lt;code&gt;$.is_valid_user == false&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"logicheskie-operacii\"&gt;&lt;a href=\"ru/yql/builtins/json.html#logicheskie-operacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Логические операции&lt;/span&gt;&lt;/a&gt;Логические операции&lt;/h3&gt;\n&lt;p&gt;JsonPath поддерживает некоторые логические операции для работы с булевскими значениями.&lt;/p&gt;\n&lt;p&gt;Аргументы всех логических операций должны являться единственным булевским значением.&lt;br /&gt;\nВсе логические операции возвращают булевское значение.&lt;/p&gt;\n&lt;h4 id=\"logicheskoe-otricanie\"&gt;&lt;a href=\"ru/yql/builtins/json.html#logicheskoe-otricanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Логическое отрицание !&lt;/span&gt;&lt;/a&gt;Логическое отрицание !&lt;/h4&gt;\n&lt;p&gt;Таблица истинности:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;code&gt;x&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;!x&lt;/code&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"logicheskoe-i-andand\"&gt;&lt;a href=\"ru/yql/builtins/json.html#logicheskoe-i-andand\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Логическое И &amp;amp;&amp;amp;&lt;/span&gt;&lt;/a&gt;Логическое И &amp;amp;&amp;amp;&lt;/h4&gt;\n&lt;p&gt;Таблица истинности, первый столбец это левый аргумент, первая строка это правый аргумент, каждая клетка это результат применения логического И с левым и правым аргументами:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;code&gt;&amp;amp;&amp;amp;&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;true&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;false&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;null&lt;/code&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"logicheskoe-ili-oror\"&gt;&lt;a href=\"ru/yql/builtins/json.html#logicheskoe-ili-oror\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Логическое ИЛИ ||&lt;/span&gt;&lt;/a&gt;Логическое ИЛИ ||&lt;/h4&gt;\n&lt;p&gt;Таблица истинности, первый столбец это левый аргумент, первая строка это правый аргумент, каждая клетка это результат применения логического ИЛИ с левым и правым аргументами:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;code&gt;||&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;true&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;false&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;null&lt;/code&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h5 id=\"primery3\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primery3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h5&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;! (true == true)&lt;/code&gt;, результат &lt;code&gt;false&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;(true == true) &amp;amp;&amp;amp; (true == false)&lt;/code&gt;, результат &lt;code&gt;false&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;(true == true) || (true == false)&lt;/code&gt;, результат &lt;code&gt;true&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"operatory-sravneniya\"&gt;&lt;a href=\"ru/yql/builtins/json.html#operatory-sravneniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Операторы сравнения&lt;/span&gt;&lt;/a&gt;Операторы сравнения&lt;/h3&gt;\n&lt;p&gt;JsonPath реализует операторы сравнения для значений:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Равенство, &lt;code&gt;==&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Неравенство, &lt;code&gt;!=&lt;/code&gt; и &lt;code&gt;&amp;lt;&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Меньше и меньше либо равно, &lt;code&gt;&amp;lt;&lt;/code&gt; и &lt;code&gt;&amp;lt;=&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Больше и больше либо равно, &lt;code&gt;&amp;gt;&lt;/code&gt; и &lt;code&gt;&amp;gt;=&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Все операторы сравнения возвращают булевское значение. Оба аргумента оператора поддерживают наличие нескольких значений.&lt;/p&gt;\n&lt;p&gt;Если при вычислении аргументов оператора возникла ошибка, оператор возвращает &lt;code&gt;null&lt;/code&gt;. При этом выполнение JsonPath запроса продолжается.&lt;/p&gt;\n&lt;p&gt;Для каждого из аргументов производится автоматическая распаковка массивов. После этого для каждой пары, где первый элемент берется из последовательности левого аргумента, а второй элемент из последовательности правого аргумента:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Выполняется сравнение элементов пары&lt;/li&gt;\n&lt;li&gt;Если при сравнении возникла ошибка, устанавливается флаг &lt;code&gt;ERROR&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Если результат сравнения это истина, устанавливается флаг &lt;code&gt;FOUND&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Если один из флагов &lt;code&gt;ERROR&lt;/code&gt; или &lt;code&gt;FOUND&lt;/code&gt; установлен и запрос исполняется в &lt;code&gt;lax&lt;/code&gt; режиме, больше никакие пары не рассматриваются&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Если после рассмотрения пар:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Установлен флаг &lt;code&gt;ERROR&lt;/code&gt;, оператор возвращает &lt;code&gt;null&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Установлен флаг &lt;code&gt;FOUND&lt;/code&gt;, оператор возвращает &lt;code&gt;true&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Иначе оператор возвращает &lt;code&gt;false&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Можно сказать что данный алгоритм рассматривает все пары из декартового произведения левого и правого аргумента, пытаясь найти ту, сравнение которой вернет истину.&lt;/p&gt;\n&lt;p&gt;Сравнение элементов в паре производится по следующим правилам:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Если левый или правый аргумент являются массивом или объектом, сравнение завершается с ошибкой&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;null == null&lt;/code&gt; возвращает истину&lt;/li&gt;\n&lt;li&gt;Во всех остальных случаях если один из аргументов &lt;code&gt;null&lt;/code&gt;, возвращается ложь&lt;/li&gt;\n&lt;li&gt;Если левый и правый аргумент разных типов, сравнение завершается с ошибкой&lt;/li&gt;\n&lt;li&gt;Строки сравниваются побайтово&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;true&lt;/code&gt; считается больше &lt;code&gt;false&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Числа сравниваются с точностью &lt;code&gt;1e-20&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"primer5\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primer5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h4&gt;\n&lt;p&gt;Для примера рассмотрим JSON документ&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"left\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"right\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;4&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Inaros\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1192\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1192\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1192\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1192.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;и разберем по шагам выполнение запроса &lt;code&gt;lax $.left &amp;lt; $.right&lt;/code&gt;:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Автоматическая распаковка массивов в левом и правом аргументе. В качестве левого аргумента получаем последовательность &lt;code&gt;1, 2&lt;/code&gt;, в качестве правого &lt;code&gt;4, \"Iranos\"&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Рассматриваем пару &lt;code&gt;(1, 4)&lt;/code&gt;. Сравнение проходит успешно, &lt;code&gt;1 &amp;lt; 4&lt;/code&gt; это истина. Устанавливаем флаг &lt;code&gt;FOUND&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Поскольку выполнение происходит в &lt;code&gt;lax&lt;/code&gt; режиме и установлен флаг &lt;code&gt;FOUND&lt;/code&gt;, больше никакие пары мы не рассматриваем&lt;/li&gt;\n&lt;li&gt;Поскольку установлен флаг &lt;code&gt;FOUND&lt;/code&gt;, оператор возвращает истину&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Разберем тот же запрос, но в другом режиме выполнения: &lt;code&gt;strict $.left &amp;lt; $.right&lt;/code&gt;:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Автоматическая распаковка массивов в левом и правом аргументе. В качестве левого аргумента получаем последовательность &lt;code&gt;1, 2&lt;/code&gt;, в качестве правого &lt;code&gt;4, \"Iranos\"&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Рассматриваем пару &lt;code&gt;(1, 4)&lt;/code&gt;. Сравнение проходит успешно, &lt;code&gt;1 &amp;lt; 4&lt;/code&gt; это истина. Устанавливаем флаг &lt;code&gt;FOUND&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Рассматриваем пару &lt;code&gt;(2, 4)&lt;/code&gt;. Сравнение проходит успешно, &lt;code&gt;2 &amp;lt; 4&lt;/code&gt; это истина. Устанавливаем флаг &lt;code&gt;FOUND&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Рассматриваем пару &lt;code&gt;(1, \"Iranos\")&lt;/code&gt;. Сравнение завершается ошибкой (число нельзя сравнить со строкой). Устанавливаем флаг &lt;code&gt;ERROR&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Рассматриваем пару &lt;code&gt;(2, \"Iranos\")&lt;/code&gt;. Сравнение завершается ошибкой (число нельзя сравнить со строкой). Устанавливаем флаг &lt;code&gt;ERROR&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Поскольку установлен флаг &lt;code&gt;ERROR&lt;/code&gt;, оператор возвращает &lt;code&gt;null&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"predikaty\"&gt;&lt;a href=\"ru/yql/builtins/json.html#predikaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Предикаты&lt;/span&gt;&lt;/a&gt;Предикаты&lt;/h3&gt;\n&lt;p&gt;JsonPath поддерживает предикаты - выражения, возвращающие булевское значение, и проверяющие некоторое условие. Их можно использовать, например, в фильтрах.&lt;/p&gt;\n&lt;h4 id=\"like_regex\"&gt;&lt;a href=\"ru/yql/builtins/json.html#like_regex\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;like_regex&lt;/span&gt;&lt;/a&gt;&lt;code&gt;like_regex&lt;/code&gt;&lt;/h4&gt;\n&lt;p&gt;Предикат &lt;code&gt;like_regex&lt;/code&gt; позволяет проверить строку на соответствие регулярному выражению. Синтаксис регулярных выражений такой же как в &lt;a href=\"ru/yql/udf/list/hyperscan.html\"&gt;Hyperscan UDF&lt;/a&gt; и &lt;a href=\"ru/yql/syntax/expressions.html#regexp\"&gt;REGEXP&lt;/a&gt;.&lt;/p&gt;\n&lt;h6 id=\"sintaksis\"&gt;&lt;a href=\"ru/yql/builtins/json.html#sintaksis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Синтаксис&lt;/span&gt;&lt;/a&gt;Синтаксис&lt;/h6&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;expression&amp;gt; like_regex &amp;lt;regexp string&amp;gt; [flag &amp;lt;flag string&amp;gt;]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1268\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1268\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1268\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1268.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Где:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;expression&amp;gt;&lt;/code&gt; - это JsonPath выражение, содержащее строки, которые следует проверить на соответствие регулярному выражению&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;regexp string&amp;gt;&lt;/code&gt; - это строка, содержащая регулярное выражение&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;flag &amp;lt;flag string&amp;gt;&lt;/code&gt; - это опциональная секция, в которой &lt;code&gt;&amp;lt;flag string&amp;gt;&lt;/code&gt; является строкой с флагами для исполнения регулярного выражения&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Поддерживаемые флаги:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;i&lt;/code&gt; - отключение чувствительности к регистру&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h5 id=\"ispolnenie\"&gt;&lt;a href=\"ru/yql/builtins/json.html#ispolnenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Исполнение&lt;/span&gt;&lt;/a&gt;Исполнение&lt;/h5&gt;\n&lt;p&gt;Перед проверкой производится автоматическая распаковка массивов во входной последовательности.&lt;/p&gt;\n&lt;p&gt;После этого для каждого элемента входной последовательности:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Выполняется проверка на соответствие элемента регулярному выражению&lt;/li&gt;\n&lt;li&gt;Если элемент не является строкой, устанавливается флаг &lt;code&gt;ERROR&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Если результат проверки это истина, устанавливается флаг &lt;code&gt;FOUND&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Если один из флагов &lt;code&gt;ERROR&lt;/code&gt; или &lt;code&gt;FOUND&lt;/code&gt; установлен и запрос исполняется в &lt;code&gt;lax&lt;/code&gt; режиме, больше никакие пары не рассматриваются&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Если после рассмотрения пар:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Установлен флаг &lt;code&gt;ERROR&lt;/code&gt;, предикат возвращает &lt;code&gt;null&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Установлен флаг &lt;code&gt;FOUND&lt;/code&gt;, предикат возвращает &lt;code&gt;true&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Иначе предикат возвращает &lt;code&gt;false&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"primery4\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primery4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;\"123456\" like_regex \"^[0-9]+$\"&lt;/code&gt; возвращает &lt;code&gt;true&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;\"123abcd456\" like_regex \"^[0-9]+$\"&lt;/code&gt; возвращает &lt;code&gt;false&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;\"Naomi Nagata\" like_regex \"nag\"&lt;/code&gt; возвращает &lt;code&gt;false&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;\"Naomi Nagata\" like_regex \"nag\" flag \"i\"&lt;/code&gt; возвращает &lt;code&gt;true&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"starts-with\"&gt;&lt;a href=\"ru/yql/builtins/json.html#starts-with\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;starts with&lt;/span&gt;&lt;/a&gt;&lt;code&gt;starts with&lt;/code&gt;&lt;/h4&gt;\n&lt;p&gt;Предикат &lt;code&gt;starts with&lt;/code&gt; позволяет проверить является ли одна строка префиксом другой.&lt;/p&gt;\n&lt;h6 id=\"sintaksis1\"&gt;&lt;a href=\"ru/yql/builtins/json.html#sintaksis1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Синтаксис&lt;/span&gt;&lt;/a&gt;Синтаксис&lt;/h6&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;string expression&amp;gt; starts with &amp;lt;prefix expression&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1384\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1384\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1384\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1384.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Где:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;string expression&amp;gt;&lt;/code&gt; - это JsonPath выражение, содержащее строку, которую нужно проверить&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;prefix expression&amp;gt;&lt;/code&gt; - это JsonPath выражение, содержащее строку-префикс&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;То есть предикат будет проверять что &lt;code&gt;&amp;lt;string expression&amp;gt;&lt;/code&gt; начинается со строки &lt;code&gt;&amp;lt;prefix expression&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;h5 id=\"ispolnenie1\"&gt;&lt;a href=\"ru/yql/builtins/json.html#ispolnenie1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Исполнение&lt;/span&gt;&lt;/a&gt;Исполнение&lt;/h5&gt;\n&lt;p&gt;Первый аргумент предиката должен быть единственной строкой.&lt;/p&gt;\n&lt;p&gt;Второй аргумент предиката должен быть последовательностью (возможно, из нескольких) строк.&lt;/p&gt;\n&lt;p&gt;Для каждого элемента из последовательности строк-префиксов:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Выполняется проверка \"является ли элемент префиксом входной строки\"&lt;/li&gt;\n&lt;li&gt;Если элемент не является строкой, устанавливается флаг &lt;code&gt;ERROR&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Если результат проверки это истина, устанавливается флаг &lt;code&gt;FOUND&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Если один из флагов &lt;code&gt;ERROR&lt;/code&gt; или &lt;code&gt;FOUND&lt;/code&gt; установлен и запрос исполняется в &lt;code&gt;lax&lt;/code&gt; режиме, больше никакие пары не рассматриваются&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Если после рассмотрения пар:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Установлен флаг &lt;code&gt;ERROR&lt;/code&gt;, предикат возвращает &lt;code&gt;null&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Установлен флаг &lt;code&gt;FOUND&lt;/code&gt;, предикат возвращает &lt;code&gt;true&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Иначе предикат возвращает &lt;code&gt;false&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h5 id=\"primery5\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primery5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h5&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;\"James Holden\" starts with \"James\"&lt;/code&gt; возвращает &lt;code&gt;true&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;\"James Holden\" starts with \"Amos\"&lt;/code&gt; возвращает &lt;code&gt;false&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"exists\"&gt;&lt;a href=\"ru/yql/builtins/json.html#exists\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;exists&lt;/span&gt;&lt;/a&gt;&lt;code&gt;exists&lt;/code&gt;&lt;/h4&gt;\n&lt;p&gt;Предикат &lt;code&gt;exists&lt;/code&gt; позволяет проверить, возвращает ли JsonPath выражение хотя бы один элемент.&lt;/p&gt;\n&lt;h6 id=\"sintaksis2\"&gt;&lt;a href=\"ru/yql/builtins/json.html#sintaksis2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Синтаксис&lt;/span&gt;&lt;/a&gt;Синтаксис&lt;/h6&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;exists (&amp;lt;expression&amp;gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1481\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1481\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1481\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1481.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Где &lt;code&gt;&amp;lt;expression&amp;gt;&lt;/code&gt; - это JsonPath выражение, которое нужно проверить. Скобки вокруг выражения обязательны.&lt;/p&gt;\n&lt;h5 id=\"ispolnenie2\"&gt;&lt;a href=\"ru/yql/builtins/json.html#ispolnenie2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Исполнение&lt;/span&gt;&lt;/a&gt;Исполнение&lt;/h5&gt;\n&lt;ol&gt;\n&lt;li&gt;Исполняется переданное JsonPath выражение&lt;/li&gt;\n&lt;li&gt;Если в результате исполнения возникла ошибка, предикат возвращает &lt;code&gt;null&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Если в результате исполнения была получена пустая последовательность, предикат возвращает &lt;code&gt;false&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Иначе предикат возвращает &lt;code&gt;true&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h5 id=\"primery6\"&gt;&lt;a href=\"ru/yql/builtins/json.html#primery6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h5&gt;\n&lt;p&gt;Рассмотрим JSON документ:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"profile\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span
