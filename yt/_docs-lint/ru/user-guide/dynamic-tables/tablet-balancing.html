        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Шардирование и балансировка необходимы для равномерного распределения нагрузки по кластеру. Оно включает в себя:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Шардирование таблиц.&lt;/li&gt;\n&lt;li&gt;Перераспределение таблетов между &lt;a href=\"user-guide/dynamic-tables/concepts.html#tablet_cells\"&gt;таблет-селлами&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Шардирование необходимо для того, чтобы таблеты у таблицы стали примерно одинакового размера. Перераспределение между таблет-селлами — чтобы на таблет-селлы приходилось примерно поровну данных и/или нагрузки. Равномерность распределения данных особенно важна для таблиц, находящихся в памяти (c &lt;code&gt;@in_memory_mode&lt;/code&gt; отличным от &lt;code&gt;none&lt;/code&gt;), так как память на кластере весьма ограниченный ресурс и при неудачном распределении некоторые узлы кластера могут оказаться перегружены. Равномерность нагрузки особенно важна, если нагрузка не является равномерной по ключам таблицы, а также если определенный вид нагрузки является для вашего бандла ограниченным ресурсом.&lt;/p&gt;\n&lt;p&gt;Балансировку можно настраивать как потаблично, так и для каждого &lt;a href=\"user-guide/dynamic-tables/concepts.html#tablet_cell_bundles\"&gt;таблет-селл бандла&lt;/a&gt;. Также балансировку можно настраивать для групп таблиц. Конфигурация на таблице приоритетнее конфигурации группы, которая, в свою очередь, приоритетнее конфигурации бандла.&lt;/p&gt;\n&lt;p&gt;В системе есть два вида балансировщиков: legacy, живущий в процессе мастера и поддерживающий только балансировку по размерам таблетов и ограниченное число опций, и выделенный, в котором доступна также балансировка по нагрузке. В данный момент в opensource внешний балансировщик не поддерживается.&lt;/p&gt;\n&lt;h2 id=\"strategii-balansirovki\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#strategii-balansirovki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стратегии балансировки&lt;/span&gt;&lt;/a&gt;Стратегии балансировки&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Решардирование по размеру&lt;/strong&gt;. Для равномерного разложения таблетов таблицы по таблет-селлам необходимо, чтобы каждый таблет был не очень большого размера. Таблеты большого размера подвергаются делению на несколько, таблеты маленького размера объединяются с соседними;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Решардирование по параметру и размеру&lt;/strong&gt; (доступно только на кластерах с выделенным балансировщиком). Для равномерной балансировки по параметру необходимо, чтобы все таблеты таблицы были примерно одного размера и имели относительно одинаковую нагрузку. Таблеты с большой нагрузкой или большим размером решардируются, таблеты небольшого размера с маленькой нагрузкой подвергаются объединению с соседними;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Балансировка между таблет-селлами&lt;/strong&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Таблицы в памяти&lt;/strong&gt;. Балансируются по размеру путем минимизации загрузки максимально загруженного селла (для таблиц с ханками — по их неханковой части). Учитывается только суммарное потребление памяти нод всеми таблицами, распределение таблетов каждой таблицы в отдельности не оптимизируется;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Таблицы на диске&lt;/strong&gt;. Балансируются по количеству таблетов таблицы по таблет-селлам бандла;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Параметризованная балансировка между нодами&lt;/strong&gt; (она же балансировка по нагрузке, доступна только на кластерах с выделенным балансировщиком). Минимизирует дисперсию заданной метрики по нодам и, в меньшей степени, по селлам. Потабличная равномерность не учитывается, все таблеты считаются равнозначными.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"quick-start\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#quick-start\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Быстрый старт для параметризованной балансировки&lt;/span&gt;&lt;/a&gt;Быстрый старт для параметризованной балансировки&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Доступно только на кластерах с выделенным балансировщиком.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;Если в бандле не была включена параметризованная балансировка и не были настроены специальные группы балансировки, достаточно создать группу с нужными настройками и определить в нее таблицы.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Чтобы проверить, что можно следовать этой инструкции, достаточно убедиться, что список групп в конфиге бандла отсутствует (в словаре &lt;code&gt;//sys/tablet_cell_bundles/&amp;lt;bundle_name&amp;gt;/@tablet_balancer_config&lt;/code&gt; отсутствует поле &lt;code&gt;groups&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;Выбрать метрику, по которой нужно балансировать таблицы. Для метакластера при равномерной записи в таблеты реплицированных таблиц рекомендуется балансировать по количеству таблетов (&lt;code&gt;metric = \"1\"&lt;/code&gt;). Список метрик перечислен в &lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#parameterized\"&gt;разделе про конфигурацию параметризованной балансировки&lt;/a&gt;, метрики можно складывать используя оператор + в формуле. Если в бандле существуют группы таблиц, которые имеют разную по характеру нагрузку, их может быть полезно балансировать по разным метрикам. Для этого существует возможность сделать несколько разных групп с собственными настройками, подробнее про это можно прочесть в &lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#group\"&gt;разделе про группы таблиц&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Если группа для балансировки достаточно большая, то есть содержит более 50000 таблетов, может понадобиться настройка параметра &lt;code&gt;max_action_count&lt;/code&gt; — количество перемещений для одной итерации балансировки. Об этом подробнее можно прочесть в &lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#parameterized\"&gt;разделе про конфигурацию параметризованной балансировки&lt;/a&gt;. Если вы включаете параметризованную балансировку на весь бандл, то количество таблетов во всех таблицах можно посмотреть на странице бандла.&lt;/li&gt;\n&lt;li&gt;Создать &lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#system-groups\"&gt;группу&lt;/a&gt; &lt;code&gt;default&lt;/code&gt; с нужным конфигом для параметризованной балансировки и подставить нужную метрику в команде создания. При необходимости аналогично задать значение для &lt;code&gt;max_action_count&lt;/code&gt;.\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;yt set //sys/tablet_cell_bundles/&amp;lt;bundle_name&amp;gt;/@tablet_balancer_config/groups\n'{default = {parameterized = {metric = \"&amp;lt;metric_formula&amp;gt;\"}}}'\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"92\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-92\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-92\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-92.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;Включить на нужных таблицах.\n&lt;ul&gt;\n&lt;li&gt;если необходимо включить на весь бандл, то достаточно включить параметризованную балансировку на всем бандле:&lt;br /&gt;\n&lt;code&gt;yt set //sys/tablet_cell_bundles/&amp;lt;bundle_name&amp;gt;/@tablet_balancer_config/enable_parameterized_by_default %true&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;если необходимо включить только на некоторых таблицах, то для каждой таблицы включить параметризованную балансировку:&lt;br /&gt;\n&lt;code&gt;yt set //path/to/table/@tablet_balancer_config/enable_parameterized %true&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;За действиями балансировщика можно следить на странице бандла на вкладке Monitoring в разделе Maintenance.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"konfiguraciya-balansirovki\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#konfiguraciya-balansirovki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конфигурация балансировки&lt;/span&gt;&lt;/a&gt;Конфигурация балансировки&lt;/h2&gt;\n&lt;h3 id=\"group\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#group\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Группы таблиц&lt;/span&gt;&lt;/a&gt;Группы таблиц&lt;/h3&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Доступно только на кластерах с выделенным балансировщиком.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;Для удобства конфигурации существуют группы балансировки. Их конфиги лежат в поле &lt;code&gt;groups&lt;/code&gt; в конфиге бандла. Если такого параметра нет (автоматически он не создаётся) — его нужно создать. Внутри группы все таблицы балансируются вместе.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Как создать группу балансировки с определёнными значениями&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Необходимо создать в поле &lt;code&gt;groups&lt;/code&gt; пустой словарь, аналогично создаются конфиги для групп балансировки, подконфиги и т. д.&lt;br /&gt;\n&lt;code&gt;yt set //sys/tablet_cell_bundles/&amp;lt;bundle_name&amp;gt;/@tablet_balancer_config/groups '{}'&lt;/code&gt;&lt;br /&gt;\nили создать сразу группу с нужной конфигурацией&lt;br /&gt;\n&lt;code&gt;yt set //sys/tablet_cell_bundles/&amp;lt;bundle_name&amp;gt;/@tablet_balancer_config/groups '{alpha={parameterized={max_action_count=5}; schedule=\"minutes % 45 == 0\"}}'&lt;/code&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Чтобы определить таблицу в группу с именем &lt;code&gt;alpha&lt;/code&gt;, необходимо в атрибуте &lt;code&gt;@tablet_balancer_config&lt;/code&gt; таблицы установить поле &lt;code&gt;group&lt;/code&gt; в &lt;code&gt;alpha&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"parametry-konfiguracii-grupp\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#parametry-konfiguracii-grupp\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Параметры конфигурации групп&lt;/span&gt;&lt;/a&gt;Параметры конфигурации групп&lt;/h4&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Имя&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;type&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;legacy&lt;/code&gt; / &lt;code&gt;parameterized&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;legacy&lt;/code&gt; для групп &lt;code&gt;legacy&lt;/code&gt; и &lt;code&gt;legacy_in_memory&lt;/code&gt;, &lt;code&gt;parameterized&lt;/code&gt; для остальных&lt;/td&gt;\n&lt;td&gt;Тип балансировки. &lt;code&gt;legacy&lt;/code&gt; не может быть установлен для новых групп&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;parameterized&lt;/td&gt;\n&lt;td&gt;yson&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Конфигурация для параметризованной балансировки. Подробнее в разделе про конфигурацию параметризованной балансировки&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;schedule&lt;/td&gt;\n&lt;td&gt;Арифметическая формула с использованием &lt;code&gt;minutes&lt;/code&gt;, &lt;code&gt;hours&lt;/code&gt; и числовыми значениями&lt;/td&gt;\n&lt;td&gt;Берется из конфига бандла, если значение установлено, иначе зависит от конфигурации на кластере&lt;/td&gt;\n&lt;td&gt;Расписание балансировки. В тот момент, когда формула становится истинной, запускается решардирование всех таблиц группы, а через некоторое время (типично порядка 10 минут) — перемещение между селлами. Примеры можно посмотреть в &lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#schedule\"&gt;разделе с расписанием&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_move&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;%true&lt;/td&gt;\n&lt;td&gt;Разрешает перемещение между таблет-селлами. Тип балансировки зависит от группы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_reshard&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;%true&lt;/td&gt;\n&lt;td&gt;Разрешает автоматическое решардирование. Тип балансировки зависит от группы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Пример конфигурации группы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Не является рекомендацией, это лишь перечисление возможных опций со случайными значениями.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-string\"&gt;\"in_memory_stable\"&lt;/span&gt; = {\n    &lt;span class=\"hljs-string\"&gt;\"enable_move\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"enable_reshard\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"schedule\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"minutes % 30 == 5\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"parameterized\"&lt;/span&gt; = {\n        &lt;span class=\"hljs-string\"&gt;\"max_action_count\"&lt;/span&gt; = 100;\n        &lt;span class=\"hljs-string\"&gt;\"metric\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"double([/statistics/memory_size])\"&lt;/span&gt;;\n    };\n};\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"252\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-252\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-252\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-252.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"system-groups\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#system-groups\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Системные группы&lt;/span&gt;&lt;/a&gt;Системные группы&lt;/h4&gt;\n&lt;p&gt;С точки зрения балансировщика системные группы существуют по умолчанию, даже если в &lt;code&gt;@tablet_balancer_config/groups&lt;/code&gt; не перечислены явно конфиги этих групп. Значения по умолчанию для них берутся из таблицы выше. Ниже перечислены все системные группы.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;legacy&lt;/code&gt;: балансировка между таблет-селлами таблиц на диске;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;legacy_in_memory&lt;/code&gt;: балансировка между таблет-селлами таблиц в памяти;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;default&lt;/code&gt;: в эту группу попадают все таблицы, для которых включена параметризованная балансировка, но группа не указана явно.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В первую и вторую группы таблицы определяются автоматически, если на них не стоит никаких указаний про группы и параметризованную балансировку. Таблицы в группу &lt;code&gt;default&lt;/code&gt; попадают в следующих случаях:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;на таблице явно указана группа &lt;code&gt;default&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;на таблице не указана группа, но в конфиге балансировки выставлено &lt;code&gt;enable_parameterized=true&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;на таблице явно не указана группа и на бандле включена параметризованная балансировка по умолчанию (&lt;code&gt;enable_parameterized_by_default=%true&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Если в конфиге бандла указано имя группы для балансировки таблиц в памяти по умолчанию (атрибут &lt;code&gt;default_in_memory_group&lt;/code&gt;), тогда таблицы в памяти, которые должны были быть определены в &lt;code&gt;default&lt;/code&gt;, определяются в указанную в конфиге группу.&lt;/p&gt;\n&lt;h3 id=\"potablichnye-nastrojki\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#potablichnye-nastrojki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Потабличные настройки&lt;/span&gt;&lt;/a&gt;Потабличные настройки&lt;/h3&gt;\n&lt;p&gt;Список доступных настроек для таблицы (&lt;code&gt;//path/to/table/@tablet_balancer_config&lt;/code&gt;) приведён в таблице:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Имя&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_auto_reshard&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;%true&lt;/td&gt;\n&lt;td&gt;Включение/отключение решардирования&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_auto_tablet_move&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;%true&lt;/td&gt;\n&lt;td&gt;Включение/отключение перемещения таблетов таблицы между селлами&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;min_tablet_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Минимальный размер таблета для решардирования по размеру&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;desired_tablet_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Желаемый размер таблета для решардирования по размеру&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_tablet_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Максимальный размер таблета для решардирования по размеру&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;desired_tablet_count&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Желаемое количество таблетов для решардирования&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;min_tablet_count&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Минимальное количество таблетов для решардирования по размеру, &lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#reshard-config\"&gt;смотрите пояснение в тексте&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;group*&lt;/td&gt;\n&lt;td&gt;str&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Определяет таблицу в группу балансировки, подробнее смотрите в разделе &lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#group\"&gt;Группы таблиц&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_parameterized*&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Включение/отключение перемещения таблетов по нагрузке&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;* — доступна только на кластерах с выделенным балансировщиком&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Пример конфигурации таблицы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Не является рекомендацией, это лишь перечисление возможных опций со случайными значениями.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;{\n    &lt;span class=\"hljs-string\"&gt;\"enable_auto_reshard\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"enable_auto_tablet_move\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"group\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"writes\"&lt;/span&gt;;\n\n&lt;span class=\"hljs-comment\"&gt;# use the rest wisely&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"enable_verbose_logging\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"enable_parameterized\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"desired_tablet_count\"&lt;/span&gt; = 100;\n    &lt;span class=\"hljs-string\"&gt;\"min_tablet_count\"&lt;/span&gt; = 5;\n    &lt;span class=\"hljs-string\"&gt;\"min_tablet_size\"&lt;/span&gt; = 1000;\n    &lt;span class=\"hljs-string\"&gt;\"desired_tablet_size\"&lt;/span&gt; = 5000;\n    &lt;span class=\"hljs-string\"&gt;\"max_tablet_size\"&lt;/span&gt; = 10000;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"471\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-471\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-471\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-471.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h3 id=\"pobandlovye-nastrojki\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#pobandlovye-nastrojki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Побандловые настройки&lt;/span&gt;&lt;/a&gt;Побандловые настройки&lt;/h3&gt;\n&lt;p&gt;Настройки указываются в &lt;code&gt;//sys/tablet_cell_bundles/&amp;lt;bundle_name&amp;gt;/@tablet_balancer_config&lt;/code&gt;.&lt;br /&gt;\nЕсли на бандле и на таблице указаны противоречащие друг другу настройки, при балансировке будут использоваться настройки таблицы, так как их приоритет выше.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Имя&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;min_tablet_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;128 MB&lt;/td&gt;\n&lt;td&gt;Минимальный размер таблета таблицы на диске&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;desired_tablet_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;10 GB&lt;/td&gt;\n&lt;td&gt;Желаемый размер таблета таблицы на диске&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_tablet_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;20 GB&lt;/td&gt;\n&lt;td&gt;Максимальный размер таблета таблицы на диске&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;min_in_memory_tablet_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;512 MB&lt;/td&gt;\n&lt;td&gt;Минимальный размер таблета таблицы в памяти&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;desired_in_memory_tablet_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;1 GB&lt;/td&gt;\n&lt;td&gt;Желаемый размер таблета таблицы в памяти&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_in_memory_tablet_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;2 GB&lt;/td&gt;\n&lt;td&gt;Максимальный размер таблета таблицы в памяти&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_tablet_size_balancer&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;%true&lt;/td&gt;\n&lt;td&gt;Включение/отключение решардирования по размеру&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_in_memory_cell_balancer&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;%true&lt;/td&gt;\n&lt;td&gt;Включение/отключение балансировки таблетов таблиц в памяти между таблет-селлами&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_cell_balancer&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;%false&lt;/td&gt;\n&lt;td&gt;Включение/отключение балансировки таблетов таблиц на диске между таблет-селлами&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tablet_to_cell_ratio&lt;/td&gt;\n&lt;td&gt;double&lt;/td&gt;\n&lt;td&gt;5.&lt;/td&gt;\n&lt;td&gt;Решардирование по размеру ограничивает сверху количество таблетов в таблице числом таблет-селлов, умноженным на значение этого параметра&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_parameterized_by_default*&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;%false&lt;/td&gt;\n&lt;td&gt;Определение таблиц без явного указания &lt;code&gt;group&lt;/code&gt; в группу &lt;code&gt;default&lt;/code&gt; для параметризованной балансировки&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;groups*&lt;/td&gt;\n&lt;td&gt;dictionary&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Конфиги групп балансировки&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;default_in_memory_group*&lt;/td&gt;\n&lt;td&gt;str&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Имя группы по умолчанию для in memory таблиц для параметризованной балансировки&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;* — доступно только на кластерах с выделенным балансировщиком&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Пример конфигурации бандла&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Не является рекомендацией, это лишь перечисление возможных опций со случайными значениями.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;{\n    &lt;span class=\"hljs-string\"&gt;\"enable_cell_balancer\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"enable_in_memory_cell_balancer\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"enable_tablet_size_balancer\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"min_tablet_size\"&lt;/span&gt; = 500;\n    &lt;span class=\"hljs-string\"&gt;\"desired_tablet_size\"&lt;/span&gt; = 1000;\n    &lt;span class=\"hljs-string\"&gt;\"max_tablet_size\"&lt;/span&gt; = 2000;\n    &lt;span class=\"hljs-string\"&gt;\"min_in_memory_tablet_size\"&lt;/span&gt; = 50;\n    &lt;span class=\"hljs-string\"&gt;\"desired_in_memory_tablet_size\"&lt;/span&gt; = 100;\n    &lt;span class=\"hljs-string\"&gt;\"max_in_memory_tablet_size\"&lt;/span&gt; = 1000;\n    &lt;span class=\"hljs-string\"&gt;\"hard_in_memory_cell_balance_threshold\"&lt;/span&gt; = 0.15;\n    &lt;span class=\"hljs-string\"&gt;\"soft_in_memory_cell_balance_threshold\"&lt;/span&gt; = 0.05;\n    &lt;span class=\"hljs-string\"&gt;\"tablet_balancer_schedule\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"(hours * 60 + minutes) % 80 == 10\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"tablet_to_cell_ratio\"&lt;/span&gt; = 5.;\n    &lt;span class=\"hljs-string\"&gt;\"enable_verbose_logging\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"enable_parameterized_by_default\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"groups\"&lt;/span&gt; = {\n        &lt;span class=\"hljs-string\"&gt;\"in_memory_stable\"&lt;/span&gt; = {\n            &lt;span class=\"hljs-comment\"&gt;# ... parameterized balancing only&lt;/span&gt;\n        };\n        &lt;span class=\"hljs-string\"&gt;\"legacy\"&lt;/span&gt; = {\n            &lt;span class=\"hljs-comment\"&gt;# ...&lt;/span&gt;\n        };\n        &lt;span class=\"hljs-string\"&gt;\"default\"&lt;/span&gt; = {\n            &lt;span class=\"hljs-comment\"&gt;# ... parameterized balancing only&lt;/span&gt;\n        };\n        &lt;span class=\"hljs-string\"&gt;\"legacy_in_memory\"&lt;/span&gt; = {\n            &lt;span class=\"hljs-comment\"&gt;# ...&lt;/span&gt;\n        };\n    };\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"700\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-700\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-700\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-700.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h3 id=\"parameterized\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#parameterized\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конфигурация параметризованной балансировки&lt;/span&gt;&lt;/a&gt;Конфигурация параметризованной балансировки&lt;/h3&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Доступно только на кластерах с выделенным балансировщиком.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Имя&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;metric&lt;/td&gt;\n&lt;td&gt;str&lt;/td&gt;\n&lt;td&gt;объем записи&lt;/td&gt;\n&lt;td&gt;Метрика (параметр) балансировки&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_action_count&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Максимальное количество таблетов, которые будут перемещены за одну итерацию&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_reshard&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Включение алгоритма решардирования по параметру и размеру вместо решардирования по размеру&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;per_table_uniform&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Включение алгоритма балансировки перемещениями, стремящегося в том числе обеспечить равномерное распределение таблиц по нодам и целлам. Рекомендуется для групп из не более чем 50 таблиц&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Метрика для параметризованной балансировки задается арифметической формулой с использованием потаблетных метрик. Метрика должна быть неотрицательной для любого таблета. Для корректной работы алгоритма балансировки величина метрики должна быть прямо пропорциональна нагрузке на таблет. В формуле могут участвовать метрики размеров таблетов. Каждая из метрик нагрузки может иметь один из двух суффиксов на выбор: &lt;code&gt;_10m_rate&lt;/code&gt; и &lt;code&gt;_1h_rate&lt;/code&gt;, которые считаются как экспоненциальное затухание запросов за 10 минут и за 1 час. В таблице все метрики приведены для 10-минутного окна.&lt;/p&gt;\n&lt;p&gt;Ниже перечислены потаблетные метрики, которые могут быть полезны.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Объём записи&lt;br /&gt;\n&lt;code&gt;write_10m&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Количество данных, читаемых lookup-запросами, с учетом чтений из ханковых чанков&lt;br /&gt;\n&lt;code&gt;lookup_10m&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Количество данных, читаемых select-запросами, с учетом чтений из ханковых чанков&lt;br /&gt;\n&lt;code&gt;read_10m&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Количество данных, читаемых lookup-запросами, без учета чтений из ханковых чанков&lt;br /&gt;\n&lt;code&gt;double([/performance_counters/dynamic_row_lookup_data_weight_10m_rate]) + double([/performance_counters/static_chunk_row_lookup_data_weight_10m_rate])&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Количество данных, читаемых select-запросами, без учета чтений из ханковых чанков&lt;br /&gt;\n&lt;code&gt;double([/performance_counters/dynamic_row_read_data_weight_10m_rate]) + double([/performance_counters/static_chunk_row_read_data_weight_10m_rate])&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Uncompressed size&lt;br /&gt;\n&lt;code&gt;double([/statistics/uncompressed_data_size])&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Compressed size&lt;br /&gt;\n&lt;code&gt;double([/statistics/compressed_data_size])&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Memory size (объём данных, занимаемых таблицей в памяти; в зависимости от &lt;code&gt;in_memory_mode&lt;/code&gt; равен либо compressed, либо uncompressed size)&lt;br /&gt;\n&lt;code&gt;double([/statistics/memory_size])&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;CPU time, потребляемое lookup-запросами&lt;br /&gt;\n&lt;code&gt;lookup_cpu_10m&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;CPU time, потребляемое select-запросами&lt;br /&gt;\n&lt;code&gt;select_cpu_10m&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Количество таблетов (имеет смысл, если таблеты необходимо разложить по нодам поровну без учёта нагрузки)&lt;br /&gt;\n&lt;code&gt;1&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Может появиться необходимость настройки параметра &lt;code&gt;max_action_count&lt;/code&gt; — количества перемещений для одной итерации балансировки. Такое количество таблетов будет недоступно в момент балансировки. Если ваш бандл достаточно большой или стандартные значения не подходят по каким-то причинам, то для начала подбора этого параметра можно руководствоваться следующим принципом:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;для бандлов до 100 таблетных нод — не меньше количества нод, но не меньше 10;&lt;/li&gt;\n&lt;li&gt;для группы до 100 таблетов — 10;&lt;/li&gt;\n&lt;li&gt;для группы до 1000 таблетов — 50;&lt;/li&gt;\n&lt;li&gt;для группы до 10000 таблетов — 100;&lt;/li&gt;\n&lt;li&gt;для группы до 50000 таблетов — 250;&lt;/li&gt;\n&lt;li&gt;для группы до 100000 таблетов — 500;&lt;br /&gt;\nЕсли все таблицы бандла балансируются параметризованно и существует лишь одна параметризованная группа для балансировки, то количество таблетов во всех таблицах можно посмотреть на странице бандла.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный список алиасов метрик балансировки&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;write_10m&lt;/code&gt;, &lt;code&gt;write_1h&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;lookup_10m&lt;/code&gt;, &lt;code&gt;lookup_1h&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;read_10m&lt;/code&gt;, &lt;code&gt;read_1h&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;lookup_cpu_10m&lt;/code&gt;, &lt;code&gt;lookup_cpu_1h&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;select_cpu_10m&lt;/code&gt;, &lt;code&gt;select_cpu_1h&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h3 id=\"konfiguraciya-reshardirovaniya\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#konfiguraciya-reshardirovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конфигурация решардирования&lt;/span&gt;&lt;/a&gt;Конфигурация решардирования&lt;/h3&gt;\n&lt;h4 id=\"reshard-config\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#reshard-config\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Решардирование по размеру&lt;/span&gt;&lt;/a&gt;Решардирование по размеру&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Если в настройках таблицы указан параметр &lt;code&gt;desired_tablet_count&lt;/code&gt;, то балансировщик будет пытаться шардировать таблицу на указанное число таблетов.&lt;/li&gt;\n&lt;li&gt;Иначе, если в настройках таблицы указаны все три параметра &lt;code&gt;min_tablet_size&lt;/code&gt;, &lt;code&gt;desired_tablet_size&lt;/code&gt;, &lt;code&gt;max_tablet_size&lt;/code&gt; и их значения допустимы (т. е. выполнено &lt;code&gt;min_tablet_size &amp;lt; desired_tablet_size &amp;lt; max_tablet_size&lt;/code&gt;),  будут использоваться значения указанных параметров.&lt;/li&gt;\n&lt;li&gt;В противном случае будут использоваться настройки таблет-селл бандла.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При явном указании всех трех параметров размеров таблетов (min, desired и max) для корректной работы алгоритма необходимо соблюдать следующую рекомендацию: отношение &lt;code&gt;max&lt;/code&gt; / &lt;code&gt;min&lt;/code&gt; должно быть как минимум 2.5, а лучше хотя бы 3. При меньших значениях отношения алгоритм не сможет достичь оптимального размера за счет решардирования и будет постоянно пытаться подогнать таблеты по размеру, тем самым мешая работе с таблицей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алгоритм работы автоматического шардирования следующий: фоновый процесс следит за примонтированными таблетами и как только обнаруживает таблет меньше &lt;code&gt;min_tablet_size&lt;/code&gt; или больше &lt;code&gt;max_tablet_size&lt;/code&gt;, то пытается привести его к &lt;code&gt;desired_tablet_size&lt;/code&gt;, возможно, затронув соседние таблеты. Если указан параметр &lt;code&gt;desired_tablet_count&lt;/code&gt;, то пользовательские настройки размера таблетов будут проигнорированы, а значения будут вычислены исходя из размера таблицы и &lt;code&gt;desired_tablet_count&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Если установлен параметр &lt;code&gt;min_tablet_count&lt;/code&gt;, балансировщик не будет объединять таблеты, если в результате их объединения количество станет меньше ограничения. Однако эта опция не гарантирует, что балансировщик уменьшит таблеты, если сейчас их слишком мало: при её использовании необходимо предварительно самостоятельно решардировать таблицу на желаемое число таблетов.&lt;/p&gt;\n&lt;h4 id=\"parameterized-reshard-config\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#parameterized-reshard-config\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Решардирование по размеру и параметру&lt;/span&gt;&lt;/a&gt;Решардирование по размеру и параметру&lt;/h4&gt;\n&lt;p&gt;Данный вид решардирования предназначен для совместной работы с параметризованной балансировкой. Оба алгоритма используют одну и ту же метрику (параметр), который указывается в конфиге группы балансировки. Для включения этого вида решардирования в конфиге на таблице необходимо указать желаемое количество таблетов &lt;code&gt;desired_tablet_count&lt;/code&gt;. Без этого значения алгоритм не может предугадать желаемые значения параметра для метрики каждого таблета. Также для включения нужно выставить в &lt;code&gt;%true&lt;/code&gt; значение флага &lt;code&gt;enable_reshard&lt;/code&gt; в конфиге параметризованной балансировки группы.&lt;/p&gt;\n&lt;p&gt;Алгоритм похож на алгоритм решардирования по размеру за исключением условий, при которых таблеты подвергаются делению и объединению. При обнаружении таблета, который по размеру или по параметру не подходит хотя бы под одно из min/max ограничений, таблет подвергается делению или объединению с соседними, чтобы по возможности привести его к желаемым размерам и значениям параметра. Упомянутые ограничения вычисляются из желаемого количества таблетов таблицы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В отличие от решардирования по размеру данный вид не учитывает параметр &lt;code&gt;min_tablet_count&lt;/code&gt;, вследствие чего количество таблетов в таблице может стать меньше заданного.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"shutdown\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#shutdown\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Отключение&lt;/span&gt;&lt;/a&gt;Отключение&lt;/h3&gt;\n&lt;p&gt;Чтобы отключить определённый вид блокировки, следует выставить значение &lt;code&gt;%false&lt;/code&gt; для соответствующего атрибута (см. таблицу ниже). Это значение необходимо указывать в конфиге:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Для бандла: &lt;code&gt;//sys/tablet_cell_bundles/&amp;lt;bundle&amp;gt;/@tablet_balancer_config/&amp;lt;attribute&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Для группы: &lt;code&gt;//sys/tablet_cell_bundles/&amp;lt;bundle&amp;gt;/@tablet_balancer_config/groups/&amp;lt;group&amp;gt;/&amp;lt;attribute&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Для таблицы: &lt;code&gt;//path/to/table/@tablet_balancer_config/&amp;lt;attribute&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Тип балансировки&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Бандл&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Группа&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Таблица&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;i class=\"yfm yfm-term_title\" term-key=\":in-memory-move\" role=\"button\" aria-describedby=\":in-memory-move_element\" tabindex=\"0\" id=\"66mjl3rs\"&gt;in-memory move&lt;/i&gt;&lt;/td&gt;\n&lt;td&gt;enable_in_memory_cell_balancer&lt;/td&gt;\n&lt;td&gt;enable_move&lt;/td&gt;\n&lt;td&gt;enable_auto_tablet_move&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;i class=\"yfm yfm-term_title\" term-key=\":ordinary-move\" role=\"button\" aria-describedby=\":ordinary-move_element\" tabindex=\"0\" id=\"6kmgfk9p\"&gt;ordinary move&lt;/i&gt;&lt;/td&gt;\n&lt;td&gt;enable_cell_balancer&lt;/td&gt;\n&lt;td&gt;enable_move&lt;/td&gt;\n&lt;td&gt;enable_auto_tablet_move&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;i class=\"yfm yfm-term_title\" term-key=\":parameterized-move\" role=\"button\" aria-describedby=\":parameterized-move_element\" tabindex=\"0\" id=\"hwcod2m9\"&gt;parameterized move&lt;/i&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;enable_move&lt;/td&gt;\n&lt;td&gt;enable_auto_tablet_move&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;i class=\"yfm yfm-term_title\" term-key=\":reshard\" role=\"button\" aria-describedby=\":reshard_element\" tabindex=\"0\" id=\"z5mtjpem\"&gt;reshard&lt;/i&gt;&lt;/td&gt;\n&lt;td&gt;enable_tablet_size_balancer&lt;/td&gt;\n&lt;td&gt;enable_reshard&lt;/td&gt;\n&lt;td&gt;enable_auto_reshard&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;i class=\"yfm yfm-term_title\" term-key=\":parameterized-reshard\" role=\"button\" aria-describedby=\":parameterized-reshard_element\" tabindex=\"0\" id=\"moan8bif\"&gt;parameterized reshard&lt;/i&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;enable_reshard&lt;/td&gt;\n&lt;td&gt;enable_auto_reshard&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"schedule\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#schedule\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Расписание автоматического шардирования&lt;/span&gt;&lt;/a&gt;Расписание автоматического шардирования&lt;/h3&gt;\n&lt;p&gt;Шардирование неизбежно отмонтирует часть таблетов таблицы. Чтобы сделать этот процесс более предсказуемым, существует возможность настроить, в какое время должен работать балансировщик. Настройка бывает per-cluster, per-bundle и per-group.&lt;/p&gt;\n&lt;p&gt;Расписание для бандла находится в атрибуте &lt;code&gt;//sys/tablet_cell_bundles//@tablet_balancer_config/tablet_balancer_schedule&lt;/code&gt;. Расписание для группы находится в атрибуте &lt;code&gt;schedule&lt;/code&gt; в конфиге &lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#group\"&gt;группы&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;В качестве формата можно указать любую арифметическую формулу от целочисленных переменных &lt;code&gt;hours&lt;/code&gt; и &lt;code&gt;minutes&lt;/code&gt;. Балансировка таблиц бандла будет происходить только в те моменты времени, когда значение формулы истинно (т. е. отлично от нуля).&lt;/p&gt;\n&lt;p&gt;Фоновый процесс балансировки запускается раз в несколько минут, поэтому стоит рассчитывать, что таблеты могут находиться в отмонтированном состоянии в течение 10 минут после того, как формула становилась истинной.&lt;/p&gt;\n&lt;p&gt;Примеры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;minutes % 20 == 0&lt;/code&gt; — балансировка в 0-ю, 20-ю и 40-ю минуту каждого часа;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;hours % 2 == 0 &amp;amp;&amp;amp; minutes == 30&lt;/code&gt; — балансировка в 00:30, 02:30, ...&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Если значение атрибута для бандла не указано, используется значение по умолчанию для кластера. Пример настройки балансировки на уровне кластеров представлен в таблице ниже:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Кластер&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Расписание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;first-cluster&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;(hours * 60 + minutes) % 40 == 0&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;second-cluster&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;(hours * 60 + minutes) % 40 == 10&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;third-cluster&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;(hours * 60 + minutes) % 40 == 20&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"details\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#details\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Детали реализации&lt;/span&gt;&lt;/a&gt;Детали реализации&lt;/h2&gt;\n&lt;h3 id=\"balansirovka-peremesheniyami\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#balansirovka-peremesheniyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Балансировка перемещениями&lt;/span&gt;&lt;/a&gt;Балансировка перемещениями&lt;/h3&gt;\n&lt;h4 id=\"parametrizovannaya-balansirovka\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#parametrizovannaya-balansirovka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Параметризованная балансировка&lt;/span&gt;&lt;/a&gt;Параметризованная балансировка&lt;/h4&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Все таблеты группы для алгоритма являются равнозначными, распределение по таблицам не учитывается.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Балансировка применяется для таблиц, определенных в &lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#system-groups\"&gt;группы&lt;/a&gt;, &lt;strong&gt;отличные&lt;/strong&gt; от &lt;code&gt;legacy_in_memory&lt;/code&gt; и &lt;code&gt;legacy&lt;/code&gt;.&lt;/p&gt;\n&lt;h5 id=\"opisanie-algoritma\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#opisanie-algoritma\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Описание алгоритма&lt;/span&gt;&lt;/a&gt;Описание алгоритма&lt;/h5&gt;\n&lt;p&gt;Алгоритм вычисляет &lt;code&gt;metric&lt;/code&gt; для каждого таблета, дальше в зависимости от распределения таблетов по селлам и нодам вычисляются метрики по селлам и по нодам как сумма метрик таблетов на них. После пошагово минимизируется&lt;br /&gt;\n&lt;span class=\"yfm-latex\" data-content=\"%5Csum_%7Bnode%7D%7BNodeMetric%5E2%7D%20%2B%20%5Csum_%7Bcell%7D%7BCellMetric%5E2%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;&lt;/p&gt;\n&lt;p&gt;За шаг parameterized балансировки может произойти перемещение таблета с его селла на другой селл.&lt;/p&gt;\n&lt;p&gt;Алгоритм не будет запущен, если распределение и по селлам, и по нодам достаточно хорошее.&lt;/p&gt;\n&lt;h4 id=\"balansirovka-mezhdu-tablet-sellami-na-diske\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#balansirovka-mezhdu-tablet-sellami-na-diske\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Балансировка между таблет-селлами на диске&lt;/span&gt;&lt;/a&gt;Балансировка между таблет-селлами на диске&lt;/h4&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Все таблеты таблицы для алгоритма являются равнозначными, размеры таблетов не учитываются.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#system-groups\"&gt;Группа&lt;/a&gt; балансировки: &lt;code&gt;legacy&lt;/code&gt;&lt;/p&gt;\n&lt;h5 id=\"opisanie-algoritma1\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#opisanie-algoritma1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Описание алгоритма&lt;/span&gt;&lt;/a&gt;Описание алгоритма&lt;/h5&gt;\n&lt;p&gt;Независимо для каждой таблицы таблеты раскладываются на селлы бандла равномерно по количеству. При появлении пустых селлов в бандле таблеты раскладываются так, чтобы во всех селлах было примерно одинаковое количество таблетов.&lt;/p&gt;\n&lt;h4 id=\"balansirovka-mezhdu-tablet-sellami-v-pamyati\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#balansirovka-mezhdu-tablet-sellami-v-pamyati\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Балансировка между таблет-селлами в памяти&lt;/span&gt;&lt;/a&gt;Балансировка между таблет-селлами в памяти&lt;/h4&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Все таблеты группы для алгоритма являются равнозначными, распределение по таблицам не учитывается.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#system-groups\"&gt;Группа&lt;/a&gt;  балансировки: &lt;code&gt;legacy_in_memory&lt;/code&gt;&lt;/p&gt;\n&lt;h5 id=\"opisanie-algoritma2\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#opisanie-algoritma2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Описание алгоритма&lt;/span&gt;&lt;/a&gt;Описание алгоритма&lt;/h5&gt;\n&lt;p&gt;Таблеты раскладываются равномерно на селлы бандла по &lt;code&gt;memory_size&lt;/code&gt;. Распределение по таблицам не учитывается.&lt;/p&gt;\n&lt;h3 id=\"shardirovanie\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#shardirovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шардирование&lt;/span&gt;&lt;/a&gt;Шардирование&lt;/h3&gt;\n&lt;h4 id=\"reshardirovanie-po-razmeru\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#reshardirovanie-po-razmeru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Решардирование по размеру&lt;/span&gt;&lt;/a&gt;Решардирование по размеру&lt;/h4&gt;\n&lt;p&gt;Осуществляется посредством деления таблетов и склеивания соседних. Решардирование различных таблиц производится независимо.&lt;/p&gt;\n&lt;h5 id=\"opisanie-algoritma3\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#opisanie-algoritma3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Описание алгоритма&lt;/span&gt;&lt;/a&gt;Описание алгоритма&lt;/h5&gt;\n&lt;p&gt;Для каждой таблицы независимо алгоритм итерируется по таблетам и делит слишком большие или объединяет соседние таблеты. Таблет считается слишком большим, если его размер больше &lt;code&gt;max_tablet_size&lt;/code&gt;. В таком случае таблет может быть разделен на несколько или поделен вместе с соседними на несколько таблетов так, чтобы размер новых таблетов был примерно &lt;code&gt;desired_tablet_size&lt;/code&gt;. Также происходит объединение, если таблеты меньше &lt;code&gt;min_tablet_size&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Если на таблице указан &lt;code&gt;min_tablet_count&lt;/code&gt; и таблетов не более этого количества, они не будут объединены, даже если они меньше &lt;code&gt;min_tablet_size&lt;/code&gt;. Этот параметр не влияет на &lt;code&gt;min/desired/max tablet_size&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Если на таблице указан &lt;code&gt;desired_tablet_count&lt;/code&gt;, то ограничения вычисляются как:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;desired_tablet_size = table_size / desired_tablet_count&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;min_tablet_size = desired_tablet_size / 1.9&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_tablet_size = desired_tablet_size * 1.9&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Для корректной работы алгоритма требуется, чтобы &lt;strong&gt;max_tablet_size / min_tablet_size &amp;gt; 2&lt;/strong&gt;. Иначе балансер будет по циклу делать бесполезные действия, которые будут мешать работе таблицы. Остальные рекомендации по конфигурации можно посмотреть в &lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#reshard-config\"&gt;соответствующем разделе&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"reshardirovanie-po-razmeru-i-metrike\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#reshardirovanie-po-razmeru-i-metrike\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Решардирование по размеру и метрике&lt;/span&gt;&lt;/a&gt;Решардирование по размеру и метрике&lt;/h4&gt;\n&lt;p&gt;Осуществляется посредством деления таблетов и склеивания соседних. Решардирование различных таблиц производится независимо, за исключением этапа сортировки планируемых действий по полезности.&lt;/p&gt;\n&lt;h5 id=\"opisanie-algoritma4\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#opisanie-algoritma4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Описание алгоритма&lt;/span&gt;&lt;/a&gt;Описание алгоритма&lt;/h5&gt;\n&lt;p&gt;Для работы требует указания &lt;code&gt;desired_tablet_count&lt;/code&gt;. С помощью этого значения для каждой таблицы вычисляются следующие значения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;desired_tablet_size = table_size / desired_tablet_count&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;min_tablet_size = desired_tablet_size / 1.9&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_tablet_size = desired_tablet_size * 1.9&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;desired_tablet_metric = table_metric / desired_tablet_count&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;min_tablet_metric = desired_tablet_metric / 1.9&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_tablet_metric = desired_tablet_metric * 1.9&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Алгоритм итерируется по таблетам и делит слишком большие или объединяет соседние таблеты. Таблет считается слишком большим, если его размер больше &lt;code&gt;max_tablet_size&lt;/code&gt; или метрика больше &lt;code&gt;max_tablet_metric&lt;/code&gt;. В таком случае таблет может быть разделен на несколько так, чтобы новые таблеты укладывались в заданные ограничения. Алгоритм поделит слишком большой таблет даже в том случае, если его значение по оставшемуся параметру меньше желаемого. Объединение происходит в том случае, если таблет меньше &lt;code&gt;min_tablet_size&lt;/code&gt; или &lt;code&gt;min_tablet_metric&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Если решардирование таблиц создает слишком много действий и превышает максимально допустимое за итерацию количество, то все планируемые решарды данной группы сортируются по метрике полезности и выполняются лишь самые «полезные». Остальные рекомендации по конфигурации можно посмотреть в &lt;a href=\"ru/user-guide/dynamic-tables/tablet-balancing.html#parameterized-reshard-config\"&gt;соответствующем разделе&lt;/a&gt;&lt;/p&gt;\n&lt;dfn class=\"yfm yfm-term_dfn\" id=\":in-memory-move_element\" role=\"dialog\"&gt;&lt;p&gt;Балансировка таблиц в памяти между таблет-селлами.&lt;/p&gt;\n&lt;/dfn&gt;&lt;dfn class=\"yfm yfm-term_dfn\" id=\":ordinary-move_element\" role=\"dialog\"&gt;&lt;p&gt;Балансировка таблиц на диске между таблет-селлами.&lt;/p&gt;\n&lt;/dfn&gt;&lt;dfn class=\"yfm yfm-term_dfn\" id=\":parameterized-move_element\" role=\"dialog\"&gt;&lt;p&gt;Балансировка таблиц по нагрузке.&lt;/p&gt;\n&lt;/dfn&gt;&lt;dfn class=\"yfm yfm-term_dfn\" id=\":reshard_element\" role=\"dialog\"&gt;&lt;p&gt;Решардирование по размеру.&lt;/p&gt;\n&lt;/dfn&gt;&lt;dfn class=\"yfm yfm-term_dfn\" id=\":parameterized-reshard_element\" role=\"dialog\"&gt;&lt;p&gt;Решардирование по размеру и нагрузке.&lt;/p&gt;\n&lt;/dfn&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/dynamic-tables/tablet-balancing.md","sourcePath":"ru/user-guide/dynamic-tables/tablet-balancing.md"},"headings":[{"title":"Стратегии балансировки","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#strategii-balansirovki","level":2},{"title":"Быстрый старт для параметризованной балансировки","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#quick-start","level":2},{"title":"Конфигурация балансировки","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#konfiguraciya-balansirovki","level":2,"items":[{"title":"Группы таблиц","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#group","level":3,"items":[{"title":"Параметры конфигурации групп","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#parametry-konfiguracii-grupp","level":4},{"title":"Системные группы","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#system-groups","level":4}]},{"title":"Потабличные настройки","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#potablichnye-nastrojki","level":3},{"title":"Побандловые настройки","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#pobandlovye-nastrojki","level":3},{"title":"Конфигурация параметризованной балансировки","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#parameterized","level":3},{"title":"Конфигурация решардирования","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#konfiguraciya-reshardirovaniya","level":3,"items":[{"title":"Решардирование по размеру","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#reshard-config","level":4},{"title":"Решардирование по размеру и параметру","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#parameterized-reshard-config","level":4}]},{"title":"Отключение","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#shutdown","level":3},{"title":"Расписание автоматического шардирования","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#schedule","level":3}]},{"title":"Детали реализации","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#details","level":2,"items":[{"title":"Балансировка перемещениями","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#balansirovka-peremesheniyami","level":3,"items":[{"title":"Параметризованная балансировка","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#parametrizovannaya-balansirovka","level":4,"items":[{"title":"Описание алгоритма","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#opisanie-algoritma","level":5}]},{"title":"Балансировка между таблет-селлами на диске","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#balansirovka-mezhdu-tablet-sellami-na-diske","level":4,"items":[{"title":"Описание алгоритма","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#opisanie-algoritma1","level":5}]},{"title":"Балансировка между таблет-селлами в памяти","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#balansirovka-mezhdu-tablet-sellami-v-pamyati","level":4,"items":[{"title":"Описание алгоритма","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#opisanie-algoritma2","level":5}]}]},{"title":"Шардирование","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#shardirovanie","level":3,"items":[{"title":"Решардирование по размеру","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#reshardirovanie-po-razmeru","level":4,"items":[{"title":"Описание алгоритма","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#opisanie-algoritma3","level":5}]},{"title":"Решардирование по размеру и метрике","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#reshardirovanie-po-razmeru-i-metrike","level":4,"items":[{"title":"Описание алгоритма","href":"ru/user-guide/dynamic-tables/tablet-balancing.html#opisanie-algoritma4","level":5}]}]}]}],"title":"Автоматическое шардирование и балансировка динамических таблиц"},"router":{"pathname":"ru/user-guide/dynamic-tables/tablet-balancing","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
