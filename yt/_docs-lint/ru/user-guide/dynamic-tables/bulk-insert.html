        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;YTsaurus позволяет указывать &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html\"&gt;сортированные динамические таблицы&lt;/a&gt; в качестве выходных таблиц map-reduce операций (так называемый «bulk insert»).&lt;/p&gt;\n&lt;p&gt;Применение:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;поставка данных в таблицы;&lt;/li&gt;\n&lt;li&gt;клиентская реализация &lt;code&gt;DELETE WHERE&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;фоновый процесс очистки строк с нетривиальным TTL.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Если вы впервые запускаете map-reduce операцию с выводом в динамическую таблицу, пожалуйста, прочитайте эту страницу, особенно раздел «Когда bulk insert не нужен». Возможно, вашу задачу правильно решать иным образом.&lt;/p&gt;\n&lt;p&gt;Для запуска операций на production-кластерах необходимо указать параметр &lt;code&gt;{allow_output_dynamic_tables=%true}&lt;/code&gt; в спецификации операции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"kogda-bulk-insert-ne-nuzhen\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/bulk-insert.html#kogda-bulk-insert-ne-nuzhen\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Когда bulk insert не нужен&lt;/span&gt;&lt;/a&gt;Когда bulk insert не нужен&lt;/h2&gt;\n&lt;p&gt;Часто вставка из операций в динамические таблицы не является оптимальным способом решить задачу. Если вы попали сюда из алерта операции, прочитайте, пожалуйста, этот абзац. Возможно, вашу задачу нужно решать иначе.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Запись небольшого объёма данных в динамическую таблицу&lt;/strong&gt;. Обычный способ вставки в динамическую таблицу — метод &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables#insert_rows\"&gt;insert_rows&lt;/a&gt;. Если ваша задача — просто писать в таблицу небольшие объёмы, рекомендуется пользоваться этим API.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Создание динамической таблицы из готовых данных&lt;/strong&gt;. YTsaurus позволяет конвертировать статические таблицы в динамические. Если есть готовые данные, из которых нужно создать динамическую таблицу один раз, стоит создать статическую таблицу, а затем сконвертировать её в динамическую командой alter-table. Подробности можно прочитать в разделе &lt;a href=\"user-guide/dynamic-tables/mapreduce#convert_table\"&gt;Конвертация статической таблицы в динамическую&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Изменение формата чанка, кодека компресии и т. д.&lt;/strong&gt; При изменении атрибутов хранения &lt;strong&gt;статической&lt;/strong&gt; таблицы рекомендуется использовать операцию Merge, чтобы применить изменения к существующим чанкам. В случае динамических таблиц для этого правильно использовать &lt;a href=\"user-guide/dynamic-tables/compaction#forced_compaction\"&gt;форсированную компактификацию&lt;/a&gt;. Если в динамическую таблицу регулярно записываются данные, компактификация и так будет запускаться регулярно, поэтому обычно необходимости явно вызывать форсированную компактификацию нет.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"features\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/bulk-insert.html#features\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Особенности&lt;/span&gt;&lt;/a&gt;Особенности&lt;/h2&gt;\n&lt;p&gt;У операций, в которых есть динамические выходные таблицы, есть ряд особенностей.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Операцию нельзя запускать под пользовательской транзакцией.&lt;/li&gt;\n&lt;li&gt;Выходные динамические таблицы могут быть только сортированными.&lt;/li&gt;\n&lt;li&gt;В динамическую таблицу можно писать как в режиме добавления данных, так и в режиме перезаписи. Это регулируется атрибутом &lt;code&gt;&amp;lt;append=%true&amp;gt;&lt;/code&gt; на пути. В отличие от сортированных статических таблиц, при добавлении данных в динамическую таблицу на неё берётся shared-блокировка, поэтому несколько операций могут писать в таблицу одновременно. Отметим, что запись в режиме добавления — это upsert, а не append, то есть записывать данные не обязательно в конец таблицы.&lt;/li&gt;\n&lt;li&gt;Можно писать только в примонтированную или замороженную динамическую таблицу. Запись в замороженную таблицу настоятельно не рекомендуется по причине того, что в замороженных таблицах не работает компактификация; без неё чтение вскоре станет неэффективным, а запись &lt;a href=\"ru/user-guide/dynamic-tables/bulk-insert.html#compaction\"&gt;заблокируется&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Писать в динамическую таблицу можно только сортированные данные с &lt;code&gt;unique_keys=%true&lt;/code&gt;. Если пользовательские джобы таким свойством не обладают, стоит использовать промежуточную статическую таблицу, которую затем отсортировать с выходом в динамическую операцией sort.&lt;/li&gt;\n&lt;li&gt;Транзакция операции не похожа на классические таблетные транзакции. В частности, во время работы операции в выходную таблицу можно писать при помощи &lt;code&gt;insert_rows&lt;/code&gt;, и если операция затрагивает те же строки, они будут перезатёрты.&lt;/li&gt;\n&lt;li&gt;Из операции можно писать данные в расширенном формате, который позволяет удалять строки и указывать режим агрегации.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"efficiency_hints\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/bulk-insert.html#efficiency_hints\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Рекомендации по эффективности&lt;/span&gt;&lt;/a&gt;Рекомендации по эффективности&lt;/h2&gt;\n&lt;p&gt;Алгоритмы динамических таблиц сконфигурированы для работы с определённым размером чанков (порядка 50-200 MB). Если чанки будут сильно меньше или больше, компактификация может работать неэффективно, а в ряде случаев таблица может временно стать недоступной для записи. Для соблюдения размеров чанков есть ряд рекомендаций.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;При запуске merge-операции в динамическую таблицу из статической таблицы с совместимой схемой чанки входной таблицы могут быть «телепортированы» в выходную таблицу. Совместимость схемы означает, что входная таблица отсортирована как минимум по тем же колонкам, что и выходная, и в схеме указан атрибут &lt;code&gt;unique_keys=%true&lt;/code&gt;. Поскольку чанки статических таблиц имеют больший размер, стоит использовать один из двух вариантов:\n&lt;ul&gt;\n&lt;li&gt;указывать опцию &lt;code&gt;{force_transform=%true}&lt;/code&gt; в спецификации merge-операции: эта опция запрещает телепортацию, данные будут перезаписаны в формате, подходящем для динамических таблиц;&lt;/li&gt;\n&lt;li&gt;использовать специальные параметры job_io при подготовке статической таблицы, которую предполагается вставлять в динамическую. Подробнее об этих параметрах можно прочитать в разделе &lt;a href=\"user-guide/dynamic-tables/mapreduce#convert_table\"&gt;Конвертация статической таблицы в динамическую&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Если каждый джоб операции порождает мало выходных данных, это приведёт к маленьким чанкам на выходе операции. В этом случае следует либо уменьшать число джобов в операции, либо вставлять данные в промежуточную статическую таблицу, а затем с помощью merge-операции с &lt;code&gt;{force_transform=%true}&lt;/code&gt; вставлять данные в динамическую таблицу.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"transactional_model\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/bulk-insert.html#transactional_model\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Транзакционная модель&lt;/span&gt;&lt;/a&gt;Транзакционная модель&lt;/h2&gt;\n&lt;p&gt;Как и в случае обычных операций, коммит bulk insert атомарный: изменения либо целиком попадут во все выходные таблицы, либо не попадут ни в одну.&lt;/p&gt;\n&lt;p&gt;В момент коммита операции все динамические таблицы, в которые происходит вставка, блокируются. Блокировка распространяется на любые записи, а также на чтения с timestamp, большим времени начала блокировки, и SyncLastCommittedTimestamp. Чтения с AsyncLastCommittedTimestamp заблокированы не будут. Если коммит операции завершается успешно, таблица разблокируется и в ней появляются данные. Timestamp всех вставленных строк равен timestamp коммита операции. В частности, timestamp вставленных строк во всех затронутых таблицах будет одинаковым.&lt;/p&gt;\n&lt;p&gt;Bulk insert конфликтует только с теми таблетными транзакциями, которые затрагивают момент коммита (блокировки). Если таблетная транзакция началась до блокировки, то она не сможет закоммититься после. Либо (скоре всего) произойдёт abort, либо коммит операции будет дожидаться коммита транзакции.&lt;/p&gt;\n&lt;p&gt;Несколько bulk insert операций c &lt;code&gt;&amp;lt;append=%true&amp;gt;&lt;/code&gt; могут работать и даже быть закоммичены параллельно. Построчных блокировок нет: система позволяет редактировать одну и ту же строку разным операциям.&lt;/p&gt;\n&lt;h2 id=\"udaleniya-i-rasshirennyj-format-zapisi\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/bulk-insert.html#udaleniya-i-rasshirennyj-format-zapisi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Удаления и расширенный формат записи&lt;/span&gt;&lt;/a&gt;Удаления и расширенный формат записи&lt;/h2&gt;\n&lt;p&gt;Расширенный формат позволяет удалять строки из таблицы, устанавливать режим агрегации (&lt;code&gt;aggregate&lt;/code&gt; в insert_rows) и режим перезаписи (&lt;code&gt;update&lt;/code&gt; в insert_rows). Чтобы им воспользоваться, нужно указать на пути к выходной таблице атрибут &lt;code&gt;schema_modification=unversioned_update&lt;/code&gt; и писать из операции в специальной схеме:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;ключевые колонки остаются без изменений;&lt;/li&gt;\n&lt;li&gt;добавляется обязательная колонка с именем &lt;code&gt;$change_type&lt;/code&gt;, указывающая, является ли строка записью или удалением;&lt;/li&gt;\n&lt;li&gt;каждая неключевая колонка с именем &lt;code&gt;name&lt;/code&gt; заменяется на две колонки с именами &lt;code&gt;$value:name&lt;/code&gt; и &lt;code&gt;$flags:name&lt;/code&gt;. Первая будет содержать непосредственно значение, а вторая управлять режимами агрегации и перезаписи.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Названия служебных колонок можно взять из &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/879946a82c766da78612ab4fe3637f7ea4da8292/yt/yt/client/tablet_client/public.h#L152\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;api&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;$change_type&lt;/code&gt; принимает значения из enum-а &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/879946a82c766da78612ab4fe3637f7ea4da8292/yt/yt/client/api/public.h#L53\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ERowModificationType&lt;/a&gt;. Допустимы только значения &lt;code&gt;Write&lt;/code&gt; и &lt;code&gt;Delete&lt;/code&gt;.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th style=\"text-align:left\"&gt;Название&lt;/th&gt;\n&lt;th style=\"text-align:left\"&gt;Значение&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;&lt;code&gt;ERowModificationType::Write&lt;/code&gt;&lt;/td&gt;\n&lt;td style=\"text-align:left\"&gt;0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;&lt;code&gt;ERowModificationType::Delete&lt;/code&gt;&lt;/td&gt;\n&lt;td style=\"text-align:left\"&gt;1&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Флаги значений принимают битовую маску значений enum-а &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/879946a82c766da78612ab4fe3637f7ea4da8292/yt/yt/client/tablet_client/public.h#L142\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;EUnversionedUpdateDataFlags&lt;/a&gt;. Комбинация &lt;code&gt;missing | aggregate&lt;/code&gt; не имеет смысла, хотя и допустима. Если флаги для колонки не указаны, они считаются равными 0.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th style=\"text-align:left\"&gt;Название&lt;/th&gt;\n&lt;th style=\"text-align:left\"&gt;Значение&lt;/th&gt;\n&lt;th style=\"text-align:left\"&gt;Пояснение&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;&lt;code&gt;EUnversionedUpdateDataFlags::Missing&lt;/code&gt;&lt;/td&gt;\n&lt;td style=\"text-align:left\"&gt;1&lt;/td&gt;\n&lt;td style=\"text-align:left\"&gt;Если бит установлен, значение будет проигнорировано, иначе перезаписано (если значение отсутствует, в таблицу будет записан Null).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;&lt;code&gt;EUnversionedUpdateDataFlags::Aggregate&lt;/code&gt;&lt;/td&gt;\n&lt;td style=\"text-align:left\"&gt;2&lt;/td&gt;\n&lt;td style=\"text-align:left\"&gt;Если бит установлен, будет применена агрегация, иначе значение обновится.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Предположим, у нас есть таблица с ключевой колонкой &lt;em&gt;user_name&lt;/em&gt; (string), колонкой &lt;em&gt;age&lt;/em&gt; (uint64) и агрегирующей колонкой &lt;em&gt;balance&lt;/em&gt; (int64). Тогда расширенная схема будет выглядеть так:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{name=\"user_name\"; type=string; sort_order=ascending}\n{name=\"$change_type\"; type=uint64; required=%true}\n{name=\"$value:age\"; type=uint64}\n{name=\"$flags:age\"; type=uint64}\n{name=\"$value:balance\"; type=int64}\n{name=\"$flags:balance\"; type=uint64}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"251\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-251\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-251\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-251.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Тогда для удаления строки нужна запись вида&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{\n  \"user_name\"=\"vasya\";\n  \"$change_type\"=1; // delete\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"255\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-255\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-255\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-255.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;А для обновления баланса (и сохранения возраста) — запись вида&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{\n  \"user_name\"=\"vasya\";\n  \"$change_type\"=0; // write\n  \"$flags:age\"=1; // missing\n  \"$value:balance\"=100500;\n  \"$flags:balance\"=2; // aggregate\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"259\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-259\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-259\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-259.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;/p&gt;\n&lt;p&gt;В расширенном формате также можно создавать промежуточные статические таблицы, которые потом будут вставлены в динамические с помощью sort или merge. Это может быть нужно крайне редко.&lt;/p&gt;\n&lt;h3 id=\"delete-where-cherez-input-query\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/bulk-insert.html#delete-where-cherez-input-query\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DELETE WHERE через input query&lt;/span&gt;&lt;/a&gt;DELETE WHERE через input query&lt;/h3&gt;\n&lt;p&gt;С помощью bulk insert можно эффективно удалять много строк из таблицы по условию, используя &lt;a href=\"user-guide/dynamic-tables/dyn-query-language\"&gt;input query&lt;/a&gt;. С помощью SQL-подобного языка запросов можно фильтровать строки, подающиеся на вход операции. Используется такой же синтаксис, как в select-rows. Например, так можно удалить из таблицы все строки с чётным ключом.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;input_query = &lt;span class=\"hljs-string\"&gt;\"1u as [$change_type], key1, key2 where key1 % 2 = 0\"&lt;/span&gt;\nyt.run_merge(\n    table,\n    yt.TablePath(\n        table,\n        append=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;,\n        attributes={&lt;span class=\"hljs-string\"&gt;\"schema_modification\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"unversioned_update\"&lt;/span&gt;}),\n    mode=&lt;span class=\"hljs-string\"&gt;\"ordered\"&lt;/span&gt;,\n    spec={&lt;span class=\"hljs-string\"&gt;\"input_query\"&lt;/span&gt;: input_query})\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"272\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-272\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-272\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-272.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Операция прочитает все строки из таблицы, оставит подходящие под условие, преобразует в формат удаления и запишет обратно в таблицу.&lt;/p&gt;\n&lt;p&gt;Если при фильтрации остаётся малое число строк, рекомендуется запускать операцию в две стадии: сначала сформировать список ключей, подлежащих удалению, а затем merge-операцией с input query и расширенной схемой вставить удаления в динамическую таблицу. Подробнее читайте в разделе &lt;a href=\"ru/user-guide/dynamic-tables/bulk-insert.html#efficiency_hints\"&gt;Рекомендации по эффективности&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Как и в случае delete_rows, удаление не удаляет строки из таблицы, а записывает tombstone, которые впоследствии будут скомпактифицированы. Если удалить из таблицы большую долю данных, запросы могут начать произвольно тормозить, потому что на каждую полезную строку придётся прочитать много лишних удалённых.&lt;/p&gt;\n&lt;p&gt;При регулярных удалениях в большинстве сценариев компактификация будет запускаться автоматически, но в некоторых случаях может понадобиться настройка таблицы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"additional_fields\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/bulk-insert.html#additional_fields\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дополнительные поля в спецификации&lt;/span&gt;&lt;/a&gt;Дополнительные поля в спецификации&lt;/h2&gt;\n&lt;p&gt;Спецификация операции может содержать все те же поля, что и обычно, за небольшими исключениями.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;для указания конфига &lt;a href=\"user-guide/storage/io-configuration#table_writer\"&gt;table writer&lt;/a&gt; используйте опцию &lt;code&gt;dynamic_table_writer&lt;/code&gt;, которая указывается там же, где и обычный &lt;code&gt;table_writer&lt;/code&gt; (в &lt;code&gt;*_job_io&lt;/code&gt;). Чанки и блоки динамических таблиц должны быть меньше, чем чанки статических таблиц. Значение по умолчанию — &lt;code&gt;{desired_chunk_size=100MB; block_size=256KB}&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"compaction\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/bulk-insert.html#compaction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Особенности компактификации&lt;/span&gt;&lt;/a&gt;Особенности компактификации&lt;/h2&gt;\n&lt;p&gt;&lt;em&gt;Этот раздел посвящён деталям реализации. Если вы хотите использовать bulk insert для больших объёмов, стоит его прочитать.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Сортированные динамические таблицы внутри напоминают &lt;a href=\"https://ru.wikipedia.org/wiki/LSM-%D0%B4%D0%B5%D1%80%D0%B5%D0%B2%D0%BE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;LSM-дерево&lt;/a&gt;. Используемая структура данных эффективно работает с равномерным, пусть и достаточно большим, потоком записи. Записанные данные компактифицируются в фоновом режиме, укладываясь в чанки предсказуемым образом.&lt;/p&gt;\n&lt;p&gt;При вставке из операции в таблицу добавляется сразу много новых чанков, минимум по одному на джоб. Эти чанки не согласованы со структурой таблицы, а «свалены в кучу». После нескольких операций доступ к данным станет неэффективным, поэтому их надо переложить.&lt;/p&gt;\n&lt;p&gt;С компактификацией есть две проблемы. Во-первых, нужны ресурсы. Одна нода может компактифицировать со скоростью порядка 100 Mb/s, при этом обрабатываются не только свежие данные, но и старые. Поэтому, если в бандле одна нода, то делать bulk insert по десяткам гигабайт в минуту скорее всего не получится, поскольку структура не будет успевать восстанавливаться.&lt;/p&gt;\n&lt;p&gt;Во-вторых, эвристики компактификации не идеальны. Если в таблице окажется много очень маленьких чанков, алгоритм станет менее эффективным. Если в таблице окажется очень большой чанк с широким диапазоном ключей — тоже. В худшем случае таблица залипнет, и починить её можно будет только вручную.&lt;/p&gt;\n&lt;p&gt;Bulk insert может привести к ряду необычных сценариев. Для многих из них предусмотрены правильные эвристики, но вряд ли учтено абсолютно всё. Поэтому тестовый запуск на реальных объёмах — это важный шаг.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/dynamic-tables/bulk-insert.md","sourcePath":"ru/user-guide/dynamic-tables/bulk-insert.md"},"headings":[{"title":"Когда bulk insert не нужен","href":"ru/user-guide/dynamic-tables/bulk-insert.html#kogda-bulk-insert-ne-nuzhen","level":2},{"title":"Особенности","href":"ru/user-guide/dynamic-tables/bulk-insert.html#features","level":2},{"title":"Рекомендации по эффективности","href":"ru/user-guide/dynamic-tables/bulk-insert.html#efficiency_hints","level":2},{"title":"Транзакционная модель","href":"ru/user-guide/dynamic-tables/bulk-insert.html#transactional_model","level":2},{"title":"Удаления и расширенный формат записи","href":"ru/user-guide/dynamic-tables/bulk-insert.html#udaleniya-i-rasshirennyj-format-zapisi","level":2,"items":[{"title":"DELETE WHERE через input query","href":"ru/user-guide/dynamic-tables/bulk-insert.html#delete-where-cherez-input-query","level":3}]},{"title":"Дополнительные поля в спецификации","href":"ru/user-guide/dynamic-tables/bulk-insert.html#additional_fields","level":2},{"title":"Особенности компактификации","href":"ru/user-guide/dynamic-tables/bulk-insert.html#compaction","level":2}],"title":"Вставка из операций в динамические таблицы"},"router":{"pathname":"ru/user-guide/dynamic-tables/bulk-insert","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
