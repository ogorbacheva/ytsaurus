            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе рассматриваются способы шардирования динамических таблиц. Приводится описание алгоритма автоматического шардирования.&lt;/p&gt;\n&lt;p&gt;Динамические таблицы делятся на &lt;a href=\"user-guide/dynamic-tables/overview.html#tablets\"&gt;таблеты&lt;/a&gt; (шарды), являющиеся единицей параллелизма.&lt;/p&gt;\n&lt;h4 id=\"sortirovannye-tablicy\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/resharding.html#sortirovannye-tablicy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сортированные таблицы&lt;/span&gt;&lt;/a&gt;Сортированные таблицы&lt;/h4&gt;\n&lt;p&gt;Каждый таблет &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html\"&gt;сортированной таблицы&lt;/a&gt; отвечает за некоторый диапазон ключей. Граничные ключи таблетов (также называемые pivot-ключами) доступны в атрибуте &lt;code&gt;pivot_keys&lt;/code&gt; таблицы. Таблет с индексом &lt;em&gt;k&lt;/em&gt; отвечает за ключи, лежащие между &lt;em&gt;k&lt;/em&gt;-м граничным ключом (включительно) и &lt;em&gt;k&lt;/em&gt;+1-м (не включительно).&lt;/p&gt;\n&lt;p&gt;Каждый граничный ключ состоит из некоторого префикса ключевых колонок таблицы. Например, для таблицы с тремя ключевыми колонками типов int64, string, double допустимы граничные ключи &lt;code&gt;[]&lt;/code&gt;, &lt;code&gt;[10]&lt;/code&gt;, &lt;code&gt;[50; foo]&lt;/code&gt;, &lt;code&gt;[100; bar; 1.234]&lt;/code&gt;. Граничные ключи таблетов должны строго возрастать. Первый граничный ключ обязательно должен быть пустым.&lt;/p&gt;\n&lt;p&gt;При решардировании сортированной таблицы можно как явно указать желаемые граничные ключи, так и передать параметр &lt;code&gt;tablet_count&lt;/code&gt;. Во втором случае система попробует самостоятельно равномерно разбить таблицу на требуемое число таблетов.&lt;/p&gt;\n&lt;h4 id=\"uporyadochennye-tablicy\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/resharding.html#uporyadochennye-tablicy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Упорядоченные таблицы&lt;/span&gt;&lt;/a&gt;Упорядоченные таблицы&lt;/h4&gt;\n&lt;p&gt;Каждый таблет &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables.html\"&gt;упорядоченной таблицы&lt;/a&gt; является независимой очередью. Решардирование упорядоченной таблицы возможно только с указанием желаемого числа таблетов. Подробнее см. в разделе &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables.html\"&gt;Шардирование упорядоченных таблиц&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"replicirovannye-tablicy\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/resharding.html#replicirovannye-tablicy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Реплицированные таблицы&lt;/span&gt;&lt;/a&gt;Реплицированные таблицы&lt;/h4&gt;\n&lt;p&gt;Физически каждый таблет &lt;a href=\"user-guide/dynamic-tables/replicated-dynamic-tables.html\"&gt;реплицированной таблицы&lt;/a&gt; является очередью и хранит лог репликации. Несмотря на это, логически шардирование происходит так же, как и для обычных таблиц.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Каждый таблет сортированной реплицированной таблицы отвечает за диапазон ключей и хранит лог репликации ключей из этого диапазона.&lt;/li&gt;\n&lt;li&gt;Каждый таблет упорядоченной реплицированной таблицы является независимой очередью. Для соответствия таблетов реплицированной таблицы и реплик необходимо использовать атрибут &lt;a href=\"user-guide/dynamic-tables/replicated-dynamic-tables#sohranenie-indeksa-tableta-pri-replikacii-uporyadochennoj-tablicy\"&gt;preserve_tablet_index&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Шардирование сортированной реплицированной таблицы не обязано совпадать с шардированием реплик. Разные реплики одной таблицы также могут быть шардированы по-разному.&lt;/p&gt;\n&lt;p&gt;Непустую реплицированную таблицу решардировать невозможно. При необходимости это сделать нужно пересоздать таблицу с нужными граничными ключами.&lt;/p&gt;\n&lt;h2 id=\"ruchnoe-shardirovanie\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/resharding.html#ruchnoe-shardirovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ручное шардирование&lt;/span&gt;&lt;/a&gt;Ручное шардирование&lt;/h2&gt;\n&lt;p&gt;Для решардирования таблицы используется команда &lt;a href=\"api/commands.html#reshard_table\"&gt;reshard-table&lt;/a&gt;. Перед выполнением команды таблица должна быть отмонтирована.&lt;/p&gt;\n&lt;div class=\"yfm-tabs\" data-diplodoc-group=\"defaultTabsGroup-p56lljgg\" data-diplodoc-variant=\"regular\"&gt;\n&lt;div class=\"yfm-tab-list\" role=\"tablist\"&gt;\n&lt;div data-diplodoc-id=\"cli\" data-diplodoc-key=\"cli\" class=\"yfm-tab yfm-tab-group active\" role=\"tab\" tabindex=\"0\" data-diplodoc-is-active=\"true\"&gt;CLI&lt;/div&gt;\n&lt;div data-diplodoc-id=\"python\" data-diplodoc-key=\"python\" class=\"yfm-tab yfm-tab-group\" role=\"tab\" tabindex=\"-1\" data-diplodoc-is-active=\"false\"&gt;Python&lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"nf4vvwqh\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"CLI\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt unmount-table //path --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Reshard with tablet count&lt;/span&gt;\nyt reshard-table //path --tablet-count 10 --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# --enable-slicing is used to pick pivots more precisely in case of small tables&lt;/span&gt;\nyt reshard-table //path --tablet-count 100 --enable-slicing --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# Reshard with pivot keys&lt;/span&gt;\nyt reshard-table //path &lt;span class=\"hljs-string\"&gt;'[]'&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'[10;foo]'&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'[20]'&lt;/span&gt; --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt;\n\nyt mount-table //path --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"64\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-64\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-64\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-64.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"noypy6gt\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"Python\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.unmount_table(&lt;span class=\"hljs-string\"&gt;\"//path\"&lt;/span&gt;, sync=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n\n&lt;span class=\"hljs-comment\"&gt;# Reshard with tablet count&lt;/span&gt;\nyt.reshard_table(&lt;span class=\"hljs-string\"&gt;\"//path\"&lt;/span&gt;, tablet_count=&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;, sync=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n\n&lt;span class=\"hljs-comment\"&gt;# enable_slicing is used to pick pivots more precisely in case of small tables&lt;/span&gt;\nyt.reshard_table(&lt;span class=\"hljs-string\"&gt;\"//path\"&lt;/span&gt;, tablet_count=&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;, enable_slicing=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;, sync=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n\n&lt;span class=\"hljs-comment\"&gt;# Reshard with pivot keys&lt;/span&gt;\nyt.reshard_table(&lt;span class=\"hljs-string\"&gt;\"//path\"&lt;/span&gt;, [[], [&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"foo\"&lt;/span&gt;], [&lt;span class=\"hljs-number\"&gt;20&lt;/span&gt;]], sync=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n\nyt.mount_table(&lt;span class=\"hljs-string\"&gt;\"//path\"&lt;/span&gt;, sync=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"67\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-67\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-67\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-67.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Про параметр sync&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Команды unmount-table, reshard-table и mount-table асинхронные, поэтому при их использовании рекомендуется дожидаться завершения выполнения. Для этого используется флаг &lt;code&gt;--sync&lt;/code&gt; или параметр &lt;code&gt;sync=True&lt;/code&gt;. Unmount-table на практике может выполняться долго, поэтому ожидание для неё необходимо. Reshard-table и mount-table типично завершаются мгновенно, поэтому при ручных запусках ожидание можно опускать, однако в скриптах рекомендуется использовать sync.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;При указании параметра &lt;code&gt;tablet_count&lt;/code&gt; система попробует автоматически выбрать подходящие граничные ключи. Если таблица достаточно маленькая (меньше 200 МБ на таблет), итоговых таблетов может оказаться меньше, чем запрошено. В этом случае для уточнения поиска граничных ключей рекомендуется использовать опцию &lt;a href=\"api/commands.html#reshard_table\"&gt;enable_slicing&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Узнать число таблетов можно через атрибут &lt;code&gt;@tablet_count&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"hash\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/resharding.html#hash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шардирование по хешу&lt;/span&gt;&lt;/a&gt;Шардирование по хешу&lt;/h2&gt;\n&lt;p&gt;Для равномерного распределения нагрузки можно воспользоваться стандартным приёмом: добавить первой вспомогательную ключевую колонку, в которую записывать хеш от той части ключа, по которой выполнять шардирование (например, хеш от первой колонки). В результате получится таблица, ключи которой равномерно распределены в диапазоне [0, 2&lt;sup&gt;64&lt;/sup&gt; – 1].&lt;/p&gt;\n&lt;p&gt;Для разбиения такой таблицы на &lt;em&gt;k&lt;/em&gt; таблетов достаточно разбить диапазон [0, 2&lt;sup&gt;64&lt;/sup&gt;-1] на &lt;em&gt;k&lt;/em&gt; частей. Для этого можно использовать команду reshard-table с флагом &lt;code&gt;--uniform&lt;/code&gt;: при указании &lt;code&gt;tablet_count&lt;/code&gt; система выставит граничные ключи [], [2&lt;sup&gt;64&lt;/sup&gt; / &lt;em&gt;k&lt;/em&gt;], [2&lt;sup&gt;64&lt;/sup&gt; * 2 / &lt;em&gt;k&lt;/em&gt;] и т. д.&lt;/p&gt;\n&lt;p&gt;Значение ключевой колонки можно вычислять на клиентской стороне и передавать при записи в таблицу, но в качестве альтернативы можно использовать вычисляемые колонки.&lt;/p&gt;\n&lt;h3 id=\"expression\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/resharding.html#expression\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вычисляемые колонки&lt;/span&gt;&lt;/a&gt;Вычисляемые колонки&lt;/h3&gt;\n&lt;p&gt;Система YTsaurus поддерживает возможность автоматического вычисления значения ключевой колонки по формуле. Данную формулу необходимо указать в схеме этой колонки в поле &lt;code&gt;expression&lt;/code&gt;. Ключевая колонка может зависеть только от невычисляемых ключевых колонок. При записи строки или поиска строки по ключу вычисляемые колонки необходимо пропускать.&lt;/p&gt;\n&lt;p&gt;Для равномерного распределения будет лучше указать &lt;code&gt;\"expression\" = \"farm_hash(key)\"&lt;/code&gt;, где &lt;code&gt;key&lt;/code&gt; — префикс исходного ключа (&lt;code&gt;farm_hash&lt;/code&gt; — это встроенная функция, вычисляющая &lt;a href=\"https://code.google.com/p/farmhash\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;FarmHash&lt;/a&gt; от аргументов).&lt;/p&gt;\n&lt;p&gt;При использовании автоматически вычисляемых колонок стоит учитывать, что для оптимизации работы операция &lt;code&gt;select_rows&lt;/code&gt; выводит из предиката диапазон затрагиваемых ключей. Если в предикате некоторые значения вычисляемых колонок не заданы явно, то YTsaurus попробует дополнить условие значением вычисляемых колонок. В текущей реализации результат будет успешным, только в том случае если те колонки, от которых зависит вычисляемая, в предикате определяются равенством или с помощью оператора &lt;code&gt;IN&lt;/code&gt;. Вычисление явно заданных значений вычисляемых колонок в выводе диапазонов не происходит.&lt;/p&gt;\n&lt;h4 id=\"primer-ispolzovaniya-vychislyaemyh-kolonok\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/resharding.html#primer-ispolzovaniya-vychislyaemyh-kolonok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример использования вычисляемых колонок&lt;/span&gt;&lt;/a&gt;Пример использования вычисляемых колонок&lt;/h4&gt;\n&lt;p&gt;Пусть имеется таблица с колонками &lt;code&gt;hash, key, value&lt;/code&gt;, причём &lt;code&gt;hash&lt;/code&gt; и &lt;code&gt;key&lt;/code&gt; ключевые, а для &lt;code&gt;hash&lt;/code&gt; в схеме указана формула &lt;code&gt;expression = \"farm_hash(key)\"&lt;/code&gt;. Тогда для операций вставки, удаления и чтения по ключу нужно указывать только &lt;code&gt;key&lt;/code&gt; и &lt;code&gt;value&lt;/code&gt;. Чтобы операция &lt;code&gt;select_rows&lt;/code&gt; работала эффективно, в предикате нужно точно определить &lt;code&gt;key&lt;/code&gt;, тогда система YTsaurus сможет вычислить какие значения &lt;code&gt;hash&lt;/code&gt; нужно рассматривать. Например, в запросе можно указать &lt;code&gt;WHERE key = key_value&lt;/code&gt; или &lt;code&gt;WHERE key IN (key_value1, key_value2)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Если же указать &lt;code&gt;WHERE key &amp;gt; key_lower_bound and key &amp;lt; key_upper_bound&lt;/code&gt;, то, диапазон для &lt;code&gt;hash&lt;/code&gt; вывести нельзя. В некоторых случаях возможен перебор значений вычисляемых колонок. Перебор происходит в следующих случаях:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Выражение вычисляемой колонки имеет вид &lt;code&gt;expression = \"f(key / divisor)\"&lt;/code&gt; , при этом &lt;code&gt;key&lt;/code&gt; и &lt;code&gt;divisor&lt;/code&gt; должны быть целочисленными. В данном случае происходит перебор всех таких значений &lt;code&gt;key&lt;/code&gt;, которые порождают различные значения &lt;code&gt;expression&lt;/code&gt;. Такое поведение обобщается на случай с несколькими вычисляемыми колонками и несколькими вхождениями &lt;code&gt;key&lt;/code&gt;c различными делителями.&lt;/li&gt;\n&lt;li&gt;Выражение имеет вид &lt;code&gt;expression = \"f(key) % mod\"&lt;/code&gt;. В данном случае происходит перебор значений &lt;code&gt;expression&lt;/code&gt; в пределах значения &lt;code&gt;mod&lt;/code&gt;, а также в перебор включается значение &lt;code&gt;null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Если существует возможность переборов обоими способами, выбирается тот, который порождает наименьшее количество значений. Общее количество ключей, порождаемых перебором, ограничено параметром &lt;code&gt;range_expansion_limit&lt;/code&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/dynamic-tables/resharding.md","sourcePath":"ru/user-guide/dynamic-tables/resharding.md"},"headings":[{"title":"Ручное шардирование","href":"ru/user-guide/dynamic-tables/resharding.html#ruchnoe-shardirovanie","level":2},{"title":"Шардирование по хешу","href":"ru/user-guide/dynamic-tables/resharding.html#hash","level":2,"items":[{"title":"Вычисляемые колонки","href":"ru/user-guide/dynamic-tables/resharding.html#expression","level":3,"items":[{"title":"Пример использования вычисляемых колонок","href":"ru/user-guide/dynamic-tables/resharding.html#primer-ispolzovaniya-vychislyaemyh-kolonok","level":4}]}]}],"title":"Шардирование"},"router":{"pathname":"ru/user-guide/dynamic-tables/resharding","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
