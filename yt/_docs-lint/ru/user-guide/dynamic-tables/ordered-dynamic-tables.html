        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе рассмотрено устройство упорядоченных динамических таблиц и описаны действия, которые можно выполнять с данным видом таблиц.&lt;/p&gt;\n&lt;h2 id=\"model\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#model\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модель данных&lt;/span&gt;&lt;/a&gt;Модель данных&lt;/h2&gt;\n&lt;p&gt;Упорядоченные динамические таблицы — это разновидность таблиц в YTsaurus, представляющая собой простую упорядоченную последовательность строк. Каждая строка упорядоченной таблицы состоит из колонок и подчинена схеме таблицы, указываемой при создании. Ключевые колонки в таких таблицах отсутствуют.&lt;/p&gt;\n&lt;p&gt;Упорядоченные динамические таблицы поддерживают добавление новых строк в конец в рамках транзакции, а также чтение строк по их индексам без транзакционной изоляции.&lt;/p&gt;\n&lt;p&gt;Ближайшим аналогом упорядоченных динамических таблиц является &lt;a href=\"https://kafka.apache.org\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apache Kafka&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Как и в случае &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html\"&gt;сортированных динамических таблиц&lt;/a&gt;, пространство ключей упорядоченной динамической таблицы делится на &lt;a href=\"user-guide/dynamic-tables/overview.html#tablets\"&gt;таблеты&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Разделение данных на таблеты произвольно. Каждый таблет содержит упорядоченную последовательность строк таблицы. При записи строк в таблет они попадают в конец этой последовательности. Тем самым упорядоченность гарантируется лишь в пределах таблета.&lt;/p&gt;\n&lt;p&gt;Упорядоченная динамическая таблица исходно состоит из одного таблета. Множество таблетов можно менять с помощью команды &lt;code&gt;reshard_table&lt;/code&gt;. Она позволяет изменить структуру для набора таблетов, идущих подряд. В упорядоченных динамических таблицах при &lt;a href=\"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#reshard\"&gt;перешардировании&lt;/a&gt; указывается новое количество таблетов, на которые следует заменить исходные. Указание &lt;code&gt;pivot_keys&lt;/code&gt; не требуется. Существующие данные перераспределяются между новыми таблетами неспецифицированным образом.&lt;/p&gt;\n&lt;h2 id=\"methods\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#methods\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поддерживаемые операции&lt;/span&gt;&lt;/a&gt;Поддерживаемые операции&lt;/h2&gt;\n&lt;h3 id=\"sozdanie\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#sozdanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создание&lt;/span&gt;&lt;/a&gt;Создание&lt;/h3&gt;\n&lt;p&gt;Для создания динамической упорядоченной таблицы необходимо выполнить команду &lt;code&gt;create table&lt;/code&gt;, указав в атрибутах схему и настройку &lt;code&gt;dynamic=True&lt;/code&gt;. Схема должна соответствовать схеме упорядоченной таблицы, в частности, среди её колонок не должно быть ключевых.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt create table //path/to/table --attributes \\\n&lt;span class=\"hljs-string\"&gt;'{dynamic=%true;schema=[{name=first_name;type=string};{name=last_name;type=string}]}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"33\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-33\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-33\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-33.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;При создании таблицы можно указать начальный индекс строки в каждом таблете. Это имеет смысл, например, при пересоздании очереди, если потребители полагаются на значения &lt;code&gt;row_index&lt;/code&gt;. Для этого используется атрибут &lt;code&gt;trimmed_row_counts&lt;/code&gt;. Если он передаётся, необходимо также указывать атрибут &lt;code&gt;tablet_count&lt;/code&gt;, который должен быть равен длине списка &lt;code&gt;trimmed_row_counts&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt create table //path/to/table --attributes \\\n&lt;span class=\"hljs-string\"&gt;'{dynamic=%true;schema=[{name=first_name;type=string};{name=last_name;type=string}]}; \\\ntablet_count=5; \\\ntrimmed_row_counts=[10;20;30;40;50]}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"37\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-37\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-37\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-37.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"zapis-strok\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#zapis-strok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запись строк&lt;/span&gt;&lt;/a&gt;Запись строк&lt;/h3&gt;\n&lt;p&gt;Для записи в упорядоченную динамическую таблицу служит команда &lt;code&gt;insert_rows&lt;/code&gt;. По умолчанию данные записываются в случайный замонтированный таблет. Для того чтобы управлять распределением данных в ручном режиме, можно в записываемых строках использовать специальную системную колонку &lt;code&gt;$tablet_index&lt;/code&gt;, имеющую тип &lt;code&gt;int64&lt;/code&gt;. Значения в этой колонке должны представлять собой числа от 0 до N - 1, где N — число таблетов в таблице. Соответствующие строки будут записаны строго в указанный таблет. Строки, для которых такая аннотация отсутствует, будут записаны в случайный примонтированный таблет.&lt;/p&gt;\n&lt;p&gt;Запись, произведённая в рамках транзакции, транзакционна: если транзакция завершается успешно, то строки появляются в соответствующих таблицах, если неудачно, то не появляются. При этом в рамках одной транзакции можно работать как с сортированными, так и с упорядоченными таблицами.&lt;/p&gt;\n&lt;h3 id=\"chtenie-strok\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#chtenie-strok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чтение строк&lt;/span&gt;&lt;/a&gt;Чтение строк&lt;/h3&gt;\n&lt;p&gt;Читать данные из упорядоченных таблиц можно с помощью &lt;a href=\"user-guide/dynamic-tables/dyn-query-language.html\"&gt;SQL-подобного языка запросов&lt;/a&gt; и команды &lt;code&gt;select_rows&lt;/code&gt;. При этом каждая упорядоченная динамическая таблица предстаёт как сортированная с системными ключевыми колонками &lt;code&gt;($tablet_index, $row_index)&lt;/code&gt; (оба типа &lt;code&gt;int64&lt;/code&gt;), а также всеми указанными в схеме таблицы колонками данных.&lt;/p&gt;\n&lt;p&gt;Например, так выглядит запрос, читающий диапазон строк из фиксированного таблета упорядоченной таблицы:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; [&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;path&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;to&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;table&lt;/span&gt;] &lt;span class=\"hljs-keyword\"&gt;where&lt;/span&gt; [$tablet_index] &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;10&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;and&lt;/span&gt; [$row_index] &lt;span class=\"hljs-keyword\"&gt;between&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;100&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;and&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;200&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"56\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-56\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-56\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-56.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"izmenenie-shemy-i-tipa-tablicy\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#izmenenie-shemy-i-tipa-tablicy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Изменение схемы и типа таблицы&lt;/span&gt;&lt;/a&gt;Изменение схемы и типа таблицы&lt;/h3&gt;\n&lt;p&gt;Изменить схему уже существующей динамической таблицы можно с помощью команды &lt;code&gt;alter-table&lt;/code&gt;. Для успешного выполнения команды таблица должна быть &lt;a href=\"user-guide/dynamic-tables/overview.html#mount_table\"&gt;отмонтирована&lt;/a&gt;, а новая схема должна быть совместима со старой. При этом никаких изменений в записанных на диск данных не происходит, поскольку старые данные удовлетворяют новой схеме.&lt;/p&gt;\n&lt;p&gt;С помощью &lt;code&gt;alter-table&lt;/code&gt; можно превратить упорядоченную динамическую таблицу в статическую и обратно. Подробности можно узнать в разделе &lt;a href=\"user-guide/dynamic-tables/mapreduce.html#convert_table\"&gt;MapReduce по динамическим таблицам&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"trim\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#trim\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Trim&lt;/span&gt;&lt;/a&gt;Trim&lt;/h3&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование reshard вместе с trim запрещено, так как может приводить к непредвиденным последствиям.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В общем случае из упорядоченной динамической таблицы нельзя удалить данные. Но существует исключение: в каждом таблете можно удалить начальный отрезок строк. Для этого необходимо использовать команду &lt;code&gt;trim_rows&lt;/code&gt;. В качестве аргументов ей передаётся путь к таблице, номер таблета, а также аргумент &lt;code&gt;trimmed_row_count&lt;/code&gt;, показывающий сколько строк в таблице будет удалено после выполнения данной команды. При таком удалении нумерация строк сохраняется. Например, при первом вызове для &lt;code&gt;trimmed_row_count = 10&lt;/code&gt; будут удалены строки с номерами с 0 по 9 включительно. Затем при вызове с &lt;code&gt;trimmed_row_count = 30&lt;/code&gt; — строки с 10 по 29 включительно и т. д. &lt;code&gt;trimmed_row_count&lt;/code&gt; имеет не относительный смысл, а абсолютный и указывает не количество строк, которые будут дополнительно удалены при очередном вызове, а какие именно начальные строки будут удалены после вызова.&lt;/p&gt;\n&lt;p&gt;Команда &lt;code&gt;trim_rows&lt;/code&gt; выполняется вне транзакций. После того как она отработала, удалённые данные уже нельзя прочитать командой &lt;code&gt;select_rows&lt;/code&gt;. Как только оказывается, что в таблете удалено столько строк, что они образуют целый начальный чанк, узел кластера, обслуживающий таблет, посылает сигнал мастер-серверу, и данный чанк удаляется целиком. Именно в этот момент освобождается дисковое пространство.&lt;/p&gt;\n&lt;p&gt;Количество удалённых строк в любом таблете можно узнать из атрибута &lt;code&gt;trimmed_row_count&lt;/code&gt; таблета. Данный параметр обновляется асинхронно, то есть между выполнением &lt;code&gt;trim_rows&lt;/code&gt; и его изменением может пройти некоторое время.&lt;/p&gt;\n&lt;p&gt;При отмонтировании и последующем монтировании таблета число начальных удалённых строк сохраняется, что гарантирует неизменность нумерации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При превращении динамической таблицы в статическую с помощью команды &lt;code&gt;alter_table&lt;/code&gt; информация о том, какие строки были удалены, теряется. Также теряется и порядок следования строк в таблице. Порядок строк внутри чанков остаётся неизменным, но на это сложно опираться. Действительно, у динамической таблицы удалёнными могут быть помечены некоторые начальные строки некоторых чанков, и эта информация не может быть сохранена при превращении таблицы в статическую. В итоге получается, что при конвертации динамической таблицы в статическую возможно появление в таблице некоторых из ранее удалённых строк.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"reshard\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#reshard\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Решардирование&lt;/span&gt;&lt;/a&gt;Решардирование&lt;/h3&gt;\n&lt;p&gt;Если при шардировании число таблетов увеличивается, то существующие таблеты не меняются, а новые таблеты создаются пустыми. Если же при решардировании требуется уменьшить число таблетов, таблеты в конце диапазона склеиваются с последним из результирующего списка таблетов, который не входит в диапазон.&lt;/p&gt;\n&lt;p&gt;При этом система старается сохранить инвариант «то, что удалено, более не становится доступно». Поскольку при решардировании система добавляет чанки из удаляемых таблетов в конец последнего сохраняющегося, то при наличии удалённых строк в удаляемых таблетах решардирование затруднено. Для успешного завершения решардирования требуется, чтобы в удаляемых таблетах удалённые строки образовывали префикс по чанкам.&lt;/p&gt;\n&lt;p&gt;Практически данное ограничение сложно соблюдать, поэтому можно считать, что решардирование с уменьшением числа таблетов невозможно, если в удаляемых таблетах есть удалённые строки. Чтобы обойти указанное ограничение, можно воспользоваться двумя вызовами &lt;code&gt;alter_table&lt;/code&gt;, превратив таблицу сначала в статическую, а потом в динамическую. Но важно помнить, что при таком способе в таблице вновь станут видны некоторые из удалённых строк.&lt;/p&gt;\n&lt;p&gt;Если при решардировании число таблетов увеличивается, в каждом создаваемом таблете можно указать начальный индекс строки. Для этого нужно передать аргументом команды список &lt;code&gt;trimmed_row_counts&lt;/code&gt;. Его длина должна быть равна числу создаваемых таблетов, то есть &lt;code&gt;tablet_count - (last_tablet_index - first_tablet_index + 1)&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt reshard-table //path/to/table --tablet-count 5 --first-tablet-index 1 --last-tablet-index 3 --trimmed-row-counts 10 20\n&lt;span class=\"hljs-comment\"&gt;# Resulting offsets, assuming table had 5 tablets:&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# (old tablet #0) (old tablet #1) (old tablet #2) (old tablet #3) 10 20 (old tablet #4)&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"116\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-116\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-116\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-116.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"remove_old_data\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#remove_old_data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Автоматическое удаление старых строк (TTL)&lt;/span&gt;&lt;/a&gt;Автоматическое удаление старых строк (TTL)&lt;/h3&gt;\n&lt;p&gt;К данным упорядоченных таблиц применяются те же настройки удаления старых данных, что и у сортированных таблиц. Подробнее можно прочитать в разделе &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html#remove_old_data\"&gt;Удаление старых данных&lt;/a&gt;. Существенное отличие состоит в том, что в упорядоченных таблицах у строки всегда есть только одна версия. Тогда настройки по очистке можно интерпретировать следующим образом:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;если &lt;code&gt;min_data_versions &amp;gt; 0&lt;/code&gt; (по умолчанию значение 1), то автоматического удаления не происходит;&lt;/li&gt;\n&lt;li&gt;система YTsaurus не удаляет строки, записанные менее чем за &lt;code&gt;min_data_ttl&lt;/code&gt; до текущего момента;&lt;/li&gt;\n&lt;li&gt;если &lt;code&gt;max_data_versions = 0&lt;/code&gt;, можно удалять строки, записанные позднее &lt;code&gt;min_data_ttl&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;если &lt;code&gt;max_data_versions &amp;gt; 0&lt;/code&gt;, можно удалять строки, записанные позднее &lt;code&gt;max_data_ttl&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Автоматическое удаление (trim) применяется сразу ко всему чанку. Пока в чанке есть строки, которые нельзя удалить, все строки из чанка будут доступны.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"max_data_weight\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#max_data_weight\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничение на размер данных&lt;/span&gt;&lt;/a&gt;Ограничение на размер данных&lt;/h3&gt;\n&lt;p&gt;Для ограничения размера данных в упорядоченной таблице можно выставить максимальный допустимый размер таблета. Для этого достаточно указать его в байтах в &lt;code&gt;@mount_config/max_ordered_tablet_data_weight&lt;/code&gt; на таблице.&lt;/p&gt;\n&lt;h2 id=\"kolonka-dollartimestamp\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#kolonka-dollartimestamp\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Колонка $timestamp&lt;/span&gt;&lt;/a&gt;Колонка $timestamp&lt;/h2&gt;\n&lt;p&gt;В схеме упорядоченной динамической таблицы можно указать специальную системную колонку &lt;code&gt;$timestamp&lt;/code&gt; типа &lt;code&gt;uint64&lt;/code&gt;. Значение в данной колонке формируется системой автоматически при записи, оно равно commit timestamp для транзакции, в которой строки оказались добавлены в таблицу.&lt;/p&gt;\n&lt;h2 id=\"cumulative_data_weight_column\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#cumulative_data_weight_column\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Колонка $cumulative_data_weight&lt;/span&gt;&lt;/a&gt;Колонка $cumulative_data_weight&lt;/h2&gt;\n&lt;p&gt;В схеме упорядоченной динамической таблицы можно указать специальную системную колонку &lt;code&gt;$cumulative_data_weight&lt;/code&gt; типа &lt;code&gt;int64&lt;/code&gt;. Значение в данной колонке формируется автоматически при записи. Оно равно суммарному логическому весу строк в байтах в таблете, считая от начальной строки с индексом ноль до текущей, включительно. Вес самой колонки &lt;code&gt;$cumulative_data_weight&lt;/code&gt; также учитывается в этом значении.&lt;/p&gt;\n&lt;p&gt;При добавлении этой колонки в схему уже существующей таблицы (через отмонтирование и запрос &lt;code&gt;alter_table&lt;/code&gt;), начальное значение &lt;code&gt;$cumulative_data_weight&lt;/code&gt; берётся из метаданных чанков таблицы.&lt;/p&gt;\n&lt;h2 id=\"commit_ordering\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#commit_ordering\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Видимость изменений, strong/weak commit ordering&lt;/span&gt;&lt;/a&gt;Видимость изменений, strong/weak commit ordering&lt;/h2&gt;\n&lt;p&gt;Уровень консистентности упорядоченных динамических таблиц принципиально ниже такового для сортированных: закоммиченные данные в общем случае могут быть видны не сразу после коммита, а также могут добавиться не в том порядке, в котором коммиты происходили.&lt;/p&gt;\n&lt;p&gt;При использовании распределённого коммита — когда его участниками оказываются несколько таблет-селлов — оказывается, что непосредственное появление данных в таблетах различных таблет-селлов происходит в различные моменты времени. Действительно, вторая фаза протокола (коммит) выполняется физически распределёнными участниками. Более того: один и тот же таблет-селл может быть участником нескольких распределённых транзакций, причём значения их &lt;code&gt;commit-ts&lt;/code&gt; и фактическая последовательность, в которой данный таблет-селл выполняет коммит, в общем случае не подчинены никаким условиям. Участник может выполнить коммит транзакции &lt;code&gt;A&lt;/code&gt; до коммита транзакции &lt;code&gt;B&lt;/code&gt; даже когда &lt;code&gt;commit-ts(A) &amp;gt; commit-ts(B)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В случае динамических сортированных таблиц указанная деталь реализации скрыта от пользователя snapshot-изоляцией: несмотря на то что данные из транзакции &lt;code&gt;A&lt;/code&gt; уже добавлены в таблицу, прочитать их можно, лишь заказав &lt;code&gt;ts&lt;/code&gt;, не меньший &lt;code&gt;commit-ts(A)&lt;/code&gt;. Кроме того, система блокировок строк гарантирует, что подобная инверсия не будет наблюдаться на одном и том же ключе в случае, когда интервалы &lt;code&gt;[start-ts,commit-ts]&lt;/code&gt; для транзакций пересекаются.&lt;/p&gt;\n&lt;p&gt;Для динамических упорядоченных таблиц ситуация иная: обычно они не хранят commit timestamps, исключая случай поля &lt;code&gt;$timestamp&lt;/code&gt;, и не поддерживают snapshot-изоляцию. Поэтому порядок, в котором записи будут добавляться в конец упорядоченной динамической таблицы, не имеет ничего общего с порядком на commit timestamps.&lt;/p&gt;\n&lt;p&gt;В случае, когда упорядоченная динамическая таблица участвует в двухфазном коммите, подтверждение успешного коммита от координатора не значит, что все участники также произвели коммит и данные действительно добавлены в конец таблицы (двухфазный коммит — это коммит, который задевает более одного таблет-селла; таковы, например, все коммиты, в которых упорядоченная динамическая таблица является синхронной репликой). Попытка найти закоммиченные строки на участнике сразу после успешного окончания двухфазного коммита может закончиться неудачей: эти строки станут видны лишь через некоторое время.&lt;/p&gt;\n&lt;p&gt;Можно получить определённые гарантии монотонности для добавленных строк. У таблицы есть системный атрибут &lt;code&gt;commit_ordering&lt;/code&gt;, который управляет порядком занесения строк в таблицу:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;weak&lt;/code&gt; — режим по умолчанию, строки попадают в упорядоченную таблицу сразу в момент коммита участника, который запаздывает относительно координатора, порядок относительно commit timestamps не гарантируется;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;strong&lt;/code&gt; — гарантируется, что строки попадают в таблицу в порядке commit timestamps.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В режиме &lt;code&gt;strong&lt;/code&gt; при наличии поля &lt;code&gt;$timestamp&lt;/code&gt; таблица оказывается упорядоченной по этому полю. Обратите внимание — это не делает данное поле ключевым.&lt;/p&gt;\n&lt;p&gt;Режим &lt;code&gt;strong&lt;/code&gt; реализован следующим образом: каждый таблет-селл отслеживает специальный &lt;code&gt;barrier-ts&lt;/code&gt;, который постоянно монотонно возрастает и про который известно, что ни одна транзакция не может получить &lt;code&gt;commit-ts&lt;/code&gt; меньше &lt;code&gt;barrier-ts&lt;/code&gt;. Строки, записанные в рамках транзакции в упорядоченную динамическую таблицу с режимом &lt;code&gt;strong&lt;/code&gt;, попадают в неё не сразу в момент коммита, когда &lt;code&gt;barrier-ts&lt;/code&gt; становится больше &lt;code&gt;commit-ts&lt;/code&gt; данной транзакции. Тем самым система сериализует все транзакции по &lt;code&gt;commit-ts&lt;/code&gt;, но только те, для которых &lt;code&gt;commit-ts &amp;lt; barrier-ts&lt;/code&gt;. Для транзакций с &lt;code&gt;commit-ts &amp;gt; barrier-ts&lt;/code&gt; система может определить относительный порядок, но не может гарантировать, что в будущем не появится новой транзакции, которая нарушит установленный порядок.&lt;/p&gt;\n&lt;p&gt;Для статических таблиц атрибут &lt;code&gt;commit_ordering&lt;/code&gt; также присутствует, но он всегда равен &lt;code&gt;weak&lt;/code&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/dynamic-tables/ordered-dynamic-tables.md","sourcePath":"ru/user-guide/dynamic-tables/ordered-dynamic-tables.md"},"headings":[{"title":"Модель данных","href":"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#model","level":2},{"title":"Поддерживаемые операции","href":"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#methods","level":2,"items":[{"title":"Создание","href":"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#sozdanie","level":3},{"title":"Запись строк","href":"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#zapis-strok","level":3},{"title":"Чтение строк","href":"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#chtenie-strok","level":3},{"title":"Изменение схемы и типа таблицы","href":"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#izmenenie-shemy-i-tipa-tablicy","level":3},{"title":"Trim","href":"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#trim","level":3},{"title":"Решардирование","href":"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#reshard","level":3},{"title":"Автоматическое удаление старых строк (TTL)","href":"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#remove_old_data","level":3},{"title":"Ограничение на размер данных","href":"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#max_data_weight","level":3}]},{"title":"Колонка $timestamp","href":"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#kolonka-dollartimestamp","level":2},{"title":"Колонка $cumulative_data_weight","href":"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#cumulative_data_weight_column","level":2},{"title":"Видимость изменений, strong/weak commit ordering","href":"ru/user-guide/dynamic-tables/ordered-dynamic-tables.html#commit_ordering","level":2}],"title":"Упорядоченные динамические таблицы"},"router":{"pathname":"ru/user-guide/dynamic-tables/ordered-dynamic-tables","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
