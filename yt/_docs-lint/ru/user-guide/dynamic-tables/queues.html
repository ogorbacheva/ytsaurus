        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе описана экосистема очередей YTsaurus, специальные методы работы с ними, способы конфигурации и использования.&lt;/p&gt;\n&lt;h2 id=\"data_model\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/queues.html#data_model\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модель данных&lt;/span&gt;&lt;/a&gt;Модель данных&lt;/h2&gt;\n&lt;p&gt;&lt;em&gt;Очередью (queue)&lt;/em&gt; в YTsaurus называется любая упорядоченная динамическая таблица. Партиция очереди — таблет динамической таблицы, её индекс соответствует индексу таблета.&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Консьюмером (queue_consumer)&lt;/em&gt; в YTsaurus называется сортированная таблица с некоторой фиксированной схемой. Консьюмер находится в соотношении many-to-many с очередями и представляет из себя потребителя одной или нескольких очередей. Задача консьюмера — хранить оффсеты по партициям читаемых очередей.&lt;/p&gt;\n&lt;p&gt;Связь между консьюмерами и очередями обеспечивается объектами &lt;em&gt;регистраций&lt;/em&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Таблица 1 — Схема таблицы консьюмера&lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Имя&lt;/th&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;queue_cluster&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Имя кластера очереди&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;queue_path&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Путь к динамической таблице-очереди&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;partition_index&lt;/td&gt;\n&lt;td&gt;uint64&lt;/td&gt;\n&lt;td&gt;Номер партиции, он же &lt;code&gt;tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;offset&lt;/td&gt;\n&lt;td&gt;uint64&lt;/td&gt;\n&lt;td&gt;Номер &lt;strong&gt;первой необработанной&lt;/strong&gt; консьмером строки указанной партиции указанной очереди&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;meta&lt;/td&gt;\n&lt;td&gt;any&lt;/td&gt;\n&lt;td&gt;Системная мета-информация&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Продьюсером (queue_producer)&lt;/em&gt; в YTsaurus так же называется сортированная таблица с некоторой фиксированной схемой. Продьюсер хранит порядковые номера для последних записанных строчек в рамках сессий записи в очереди, что позволяет не писать дублирующиеся строчки в очередь.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Таблица 2 — Схема таблицы продьюсера&lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Имя&lt;/th&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;queue_cluster&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Имя кластера очереди&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;queue_path&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Путь к динамической таблице-очереди&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;session_id&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Идентификатор сессии&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;sequence_number&lt;/td&gt;\n&lt;td&gt;int64&lt;/td&gt;\n&lt;td&gt;Порядковый номер последней записанной строчки&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;epoch&lt;/td&gt;\n&lt;td&gt;int64&lt;/td&gt;\n&lt;td&gt;Номер текущей эпохи&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;user_meta&lt;/td&gt;\n&lt;td&gt;any&lt;/td&gt;\n&lt;td&gt;Пользовательская мета-информация&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;system_meta&lt;/td&gt;\n&lt;td&gt;any&lt;/td&gt;\n&lt;td&gt;Системная мета-информация&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"api\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/queues.html#api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;API&lt;/span&gt;&lt;/a&gt;API&lt;/h2&gt;\n&lt;h3 id=\"sozdanie-ocheredi\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/queues.html#sozdanie-ocheredi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создание очереди&lt;/span&gt;&lt;/a&gt;Создание очереди&lt;/h3&gt;\n&lt;p&gt;Создание очереди ничем не отличается от создания обычной упорядоченной динамической таблицы.&lt;/p&gt;\n&lt;p&gt;Для наибольшей полноты графиков/статистик рекомендуется добавлять в схему таблицы колонки &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables.html#timestamp_column\"&gt;timestamp&lt;/a&gt; и &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables.html#cumulative_data_weight_column\"&gt;cumulative_data_weight&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Проверить, что автоматика подцепила очередь, можно по появлению вкладки &lt;strong&gt;Queue&lt;/strong&gt; на странице объекта динамической таблицы.&lt;/p&gt;\n&lt;h3 id=\"sozdanie-konsyumera\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/queues.html#sozdanie-konsyumera\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создание консьюмера&lt;/span&gt;&lt;/a&gt;Создание консьюмера&lt;/h3&gt;\n&lt;p&gt;Создать консьюмер можно через алиас &lt;code&gt;create queue_consumer&lt;/code&gt;, или явно создав сортированную динамическую таблицу со схемой, &lt;a href=\"ru/user-guide/dynamic-tables/queues.html#data_model\"&gt;указанной выше&lt;/a&gt;, выставив на неё атрибут &lt;code&gt;@treat_as_queue_consumer = %true&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Проверить, что автоматика подцепила консьюмер, можно по появлению вкладки &lt;strong&gt;Consumers&lt;/strong&gt; на странице объекта динамической таблицы.&lt;/p&gt;\n&lt;h3 id=\"registraciya-konsyumera-k-ocheredi\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/queues.html#registraciya-konsyumera-k-ocheredi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Регистрация консьюмера к очереди&lt;/span&gt;&lt;/a&gt;Регистрация консьюмера к очереди&lt;/h3&gt;\n&lt;p&gt;Регистрация консьюмера к очереди производится с помощью метода &lt;code&gt;register_queue_consumer&lt;/code&gt;. Обязательно указывать булевый параметр &lt;code&gt;vital&lt;/code&gt;, который играет роль для настроек автоматического тримминга очередей (см. &lt;a href=\"ru/user-guide/dynamic-tables/queues.html#automatic_trimming\"&gt;секцию&lt;/a&gt; про автоматический тримминг).&lt;/p&gt;\n&lt;p&gt;Для того чтобы выполнять команду выше, нужно иметь право &lt;code&gt;register_queue_consumer&lt;/code&gt; с указанием &lt;code&gt;vital=True/False&lt;/code&gt; на директорию, содержащую очередь. Запросить это право можно аналогично остальным правам в UI YTsaurus на странице директории. Право &lt;code&gt;register_queue_consumer&lt;/code&gt; с &lt;code&gt;vital=True&lt;/code&gt; даёт возможность регистрировать как vital-консьюмеры, так и non-vital.&lt;/p&gt;\n&lt;p&gt;Удаление регистрации производится с помощью метода &lt;code&gt;unregister_queue_consumer&lt;/code&gt;. Для выполнения команды нужно иметь write-доступ к очереди или консьюмеру.&lt;/p&gt;\n&lt;p&gt;Оба Cypress аргумента обеих команд имеют тип &lt;a href=\"user-guide/storage/ypath.html#rich_ypath\"&gt;rich YPath&lt;/a&gt; и поддерживают указание имени кластера. В ином случае используется кластер, на котором выполняется команда.&lt;/p&gt;\n&lt;h3 id=\"chtenie-dannyh\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/queues.html#chtenie-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чтение данных&lt;/span&gt;&lt;/a&gt;Чтение данных&lt;/h3&gt;\n&lt;p&gt;Для чтения данных из очередей доступно два схожих метода.&lt;/p&gt;\n&lt;p&gt;Метод &lt;code&gt;pull_queue&lt;/code&gt; позволяет вычитать порцию строк указанной партиции указанной очереди, ограничив её по числу строк (&lt;code&gt;max_row_count&lt;/code&gt;) или по объёму данных в байтах (&lt;code&gt;max_data_weight&lt;/code&gt;). Для выполнения этого запроса нужно иметь право на чтение очереди.&lt;/p&gt;\n&lt;p&gt;Метод &lt;code&gt;pull_queue_consumer&lt;/code&gt; аналогичен предыдущему, но принимает первым аргументом путь до таблицы консьюмера. Для выполнения этого запроса должны быть выполнено два свойства: у пользователя есть право на чтение консьюмера &lt;strong&gt;и&lt;/strong&gt; присутствует регистрация указанного консьюмера к указанной очереди.&lt;br /&gt;\nПараметр очереди в данном методе представляет из себя &lt;a href=\"user-guide/storage/ypath.html#rich_ypath\"&gt;rich YPath&lt;/a&gt; и поддерживает указание кластера, на котором она расположена. В ином случае используется кластер, на котором выполняется команда.&lt;/p&gt;\n&lt;p&gt;Чтение данных из очереди также можно делать обычным способом, через метод &lt;code&gt;select_rows&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Методы &lt;code&gt;pull_queue&lt;/code&gt; и &lt;code&gt;pull_queue_consumer&lt;/code&gt; могут вернуть меньше строк, чем указано в &lt;code&gt;max_row_count&lt;/code&gt;, даже если столько строк есть в партиции очереди и их объем меньше &lt;code&gt;max_data_weight&lt;/code&gt;. Лишь возврат пустого множества строк означает, что в партиции нет строк по указанному оффсету.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"rabota-s-konsyumerom\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/queues.html#rabota-s-konsyumerom\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с консьюмером&lt;/span&gt;&lt;/a&gt;Работа с консьюмером&lt;/h3&gt;\n&lt;p&gt;Для работы с консьюмером доступен метод &lt;code&gt;advance_queue_consumer&lt;/code&gt;, продвигающий оффсет консьюмера по указанной партиции указанной очереди. В переданной транзакции делается изменение соответствующей строки консьюмера с оффсетом. В той же транзакции могут быть произведены иные действия в рамках динамических таблиц.&lt;/p&gt;\n&lt;p&gt;При указании non-null параметра &lt;code&gt;old_offset&lt;/code&gt;, в той же транзакции сначала производится чтение текущего оффсета и его сравнение с переданным значением — при их неравенстве выбрасывается исключение.&lt;/p&gt;\n&lt;p&gt;Оффсеты очередей YTsaurus интерпретируются как индекс &lt;em&gt;первой непрочитанной строки&lt;/em&gt;.&lt;/p&gt;\n&lt;h3 id=\"sozdanie-prodyusera\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/queues.html#sozdanie-prodyusera\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создание продьюсера&lt;/span&gt;&lt;/a&gt;Создание продьюсера&lt;/h3&gt;\n&lt;p&gt;Создать продьюсер можно через алиас &lt;code&gt;create queue_producer&lt;/code&gt;, или явно создав сортированную динамическую таблицу со схемой, &lt;a href=\"ru/user-guide/dynamic-tables/queues.html#data_model\"&gt;указанной выше&lt;/a&gt;, выставив на неё атрибут &lt;code&gt;@treat_as_queue_producer = %true&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"zapis-dannyh\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/queues.html#zapis-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запись данных&lt;/span&gt;&lt;/a&gt;Запись данных&lt;/h3&gt;\n&lt;p&gt;Для записи данных в очередь можно либо использовать API динамических таблиц, а именно метод &lt;code&gt;insert_rows&lt;/code&gt;, либо воспользоваться API продьюсеров для записи без дубликатов.&lt;/p&gt;\n&lt;p&gt;Чтобы писать через продьюсер, нужно иметь право &lt;code&gt;write&lt;/code&gt; как для очереди, так и для продьюсера.&lt;/p&gt;\n&lt;p&gt;Перед началом записи нужно позвать метод &lt;code&gt;create_queue_producer_session&lt;/code&gt;, который принимает путь до очереди, путь до продьюсера, а также идентификатор сессии записи (&lt;code&gt;session_id&lt;/code&gt;). В качестве &lt;code&gt;session_id&lt;/code&gt; можно передать произвольную строку, например, имя хоста, откуда производится запись. В результате, если такой сессии ранее не было, то в таблице-продьюсере создастся сессия с &lt;code&gt;epoch&lt;/code&gt; равным &lt;code&gt;0&lt;/code&gt; и &lt;code&gt;sequence_number&lt;/code&gt; равным &lt;code&gt;-1&lt;/code&gt;. Если же сессия с таким идентификатором уже ранее создавалась, то для нее будет увеличено значение &lt;code&gt;epoch&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Метод &lt;code&gt;create_queue_producer_session&lt;/code&gt; вернет текущее (обновленное) значение эпохи, а также порядковый номер последнего записанного сообщение, то есть актуальное состояние сессии записи, хранящееся в продьюсере.&lt;/p&gt;\n&lt;p&gt;Затем, с помощью метода &lt;code&gt;push_queue_producer&lt;/code&gt; можно писать данные в очередь. Метод принимает путь до очереди, путь до продьюсера, идентификатор сессии, эпоху, а также сами записываемые данные. В каждой строчке необходимо передать значение &lt;code&gt;$sequence_number&lt;/code&gt;, соответствующее порядковому номеру этой строчки. Либо, можно не передавать порядковый номер в каждой строчке в самих данных, а указать лишь порядковый номер, соответствующий первой строчке, в опциях метода - в таком случае мы будем считать, что для остальных строк он инкрементально увеличивается на единицу.&lt;/p&gt;\n&lt;p&gt;Эпоха (&lt;code&gt;epoch&lt;/code&gt;) сессии может использоваться для того, чтобы бороться с зомби-процессами.&lt;/p&gt;\n&lt;h2 id=\"queue-agent\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/queues.html#queue-agent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Queue Agent&lt;/span&gt;&lt;/a&gt;Queue Agent&lt;/h2&gt;\n&lt;p&gt;Queue Agent — выделенный микросервис, следящий за очередями, консьюмерами и регистрациями.&lt;/p&gt;\n&lt;h3 id=\"automatic_trimming\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/queues.html#automatic_trimming\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Автоматические политики очистки очередей&lt;/span&gt;&lt;/a&gt;Автоматические политики очистки очередей&lt;/h3&gt;\n&lt;p&gt;Для очереди можно настроить автоматическую политику очистки (тримминга), выставив на ней атрибут &lt;code&gt;@auto_trim_config&lt;/code&gt; с конфигурацией &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/yt/client/queue_client/config.h?rev=11720161#L41\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;соответствующего формата&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Доступные опции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;enable: True&lt;/code&gt; — включает тримминг по vital консьюмерам. Если есть хотя бы один vital-консьюмер, то Queue Agent будет с периодичностью в единицы секунд звать Trim по партиции вплоть до минимума по оффсетам vital-консьюмеров.&lt;br /&gt; &lt;strong&gt;NB:&lt;/strong&gt; Если vital-консьюмеров нет, то тримминг не производится.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;retained_rows: x&lt;/code&gt; — гарантирует, что в каждой партиции безусловно будут держаться последние x строк. Предназначен для использования в совокупности с предыдущей опцией.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;retained_lifetime_duration: x&lt;/code&gt; — гарантирует, что в каждой партиции безусловно будут держаться строки, которые были записаны в очередь не более x миллисекунд назад, при этом указанное количество миллисекунд должно быть кратно одной секунде. Предназначен для использования в совокупности с включённой опцией тримминга (&lt;code&gt;enable: True&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Такая настройка не конфликтует с &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables.html#remove_old_data\"&gt;существующими&lt;/a&gt; настройками TTL динамических таблиц: можно настроить тримминг по vital consumers и &lt;code&gt;max_data_ttl=36h, min_data_versions=0&lt;/code&gt;, чтобы, помимо удаления данных по оффсетам, всегда хранить не более трёх дней данных.&lt;/p&gt;\n&lt;h3 id=\"grafiki-i-statusy\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/queues.html#grafiki-i-statusy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Графики и статусы&lt;/span&gt;&lt;/a&gt;Графики и статусы&lt;/h3&gt;\n&lt;p&gt;С помощью атрибутов &lt;code&gt;@queue_status&lt;/code&gt;, &lt;code&gt;@queue_partitions&lt;/code&gt; на таблицах очередей и &lt;code&gt;@queue_consumer_status&lt;/code&gt;, &lt;code&gt;@queue_consumer_partitions&lt;/code&gt; на таблицах консьюмеров можно узнать текущее состояние и мета-информацию очередей/консьюмеров с точки зрения Queue Agent, как в целом, так и по отдельным партициям.&lt;/p&gt;\n&lt;p&gt;Эти атрибуты не предназначены для высоконагруженных сервисов и их стоит использовать исключительно для интроспекции.&lt;/p&gt;\n&lt;h2 id=\"primer-ispolzovaniya\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/queues.html#primer-ispolzovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример использования&lt;/span&gt;&lt;/a&gt;Пример использования&lt;/h2&gt;\n&lt;p&gt;Представленные примеры используют гипотетическую конфигурацию из нескольких кластеров, с адресам &lt;code&gt;freud&lt;/code&gt; и &lt;code&gt;pythia&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Листинг 1 — Пример использования API очередей&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Create queue on pythia.&lt;/span&gt;\n$ yt --proxy pythia create table //tmp/&lt;span class=\"hljs-variable\"&gt;$USER&lt;/span&gt;-test-queue --attributes &lt;span class=\"hljs-string\"&gt;'{dynamic=true;schema=[{name=data;type=string};{name=\"$timestamp\";type=uint64};{name=\"$cumulative_data_weight\";type=int64}]}'&lt;/span&gt;\n2826e-2b1e4-3f30191-dcd2013e\n\n&lt;span class=\"hljs-comment\"&gt;# Create queue_consumer on freud.&lt;/span&gt;\n$ yt --proxy freud create queue_consumer //tmp/&lt;span class=\"hljs-variable\"&gt;$USER&lt;/span&gt;-test-consumer\n\n&lt;span class=\"hljs-comment\"&gt;# OR: Create queue_consumer on freud as table with explicit schema specification.&lt;/span&gt;\n$ yt --proxy freud create table //tmp/&lt;span class=\"hljs-variable\"&gt;$USER&lt;/span&gt;-test-consumer --attributes &lt;span class=\"hljs-string\"&gt;'{dynamic=true;treat_as_queue_consumer=true;schema=[{name=queue_cluster;type=string;sort_order=ascending;required=true};{name=queue_path;type=string;sort_order=ascending;required=true};{name=partition_index;type=uint64;sort_order=ascending;required=true};{name=offset;type=uint64;required=true};{name=meta;type=any;required=false}]}'&lt;/span&gt;\n18a5b-28931-3ff0191-35282540\n\n&lt;span class=\"hljs-comment\"&gt;# Register consumer for queue.&lt;/span&gt;\n$ yt --proxy pythia register-queue-consumer //tmp/&lt;span class=\"hljs-variable\"&gt;$USER&lt;/span&gt;-test-queue &lt;span class=\"hljs-string\"&gt;\"&amp;lt;cluster=freud&amp;gt;//tmp/&lt;span class=\"hljs-variable\"&gt;$USER&lt;/span&gt;-test-consumer\"&lt;/span&gt; --vital\n\n&lt;span class=\"hljs-comment\"&gt;# Check registrations for queue.&lt;/span&gt;\n$ yt --proxy pythia list-queue-consumer-registrations --queue-path //tmp/&lt;span class=\"hljs-variable\"&gt;$USER&lt;/span&gt;-test-queue\n[\n  {\n    &lt;span class=\"hljs-string\"&gt;\"queue_path\"&lt;/span&gt; = &amp;lt;\n      &lt;span class=\"hljs-string\"&gt;\"cluster\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"pythia\"&lt;/span&gt;;\n    &amp;gt; &lt;span class=\"hljs-string\"&gt;\"//tmp/bob-test-queue\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"consumer_path\"&lt;/span&gt; = &amp;lt;\n      &lt;span class=\"hljs-string\"&gt;\"cluster\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"freud\"&lt;/span&gt;;\n    &amp;gt; &lt;span class=\"hljs-string\"&gt;\"//tmp/bob-test-consumer\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"vital\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"partitions\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n  };\n]\n\n&lt;span class=\"hljs-comment\"&gt;# Check queue status provided by Queue Agent.&lt;/span&gt;\n$ yt --proxy pythia get //tmp/&lt;span class=\"hljs-variable\"&gt;$USER&lt;/span&gt;-test-queue/@queue_status\n{\n    &lt;span class=\"hljs-string\"&gt;\"partition_count\"&lt;/span&gt; = 1;\n    &lt;span class=\"hljs-string\"&gt;\"has_cumulative_data_weight_column\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"family\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"ordered_dynamic_table\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"exports\"&lt;/span&gt; = {\n        &lt;span class=\"hljs-string\"&gt;\"progress\"&lt;/span&gt; = {};\n    };\n    &lt;span class=\"hljs-string\"&gt;\"alerts\"&lt;/span&gt; = {};\n    &lt;span class=\"hljs-string\"&gt;\"queue_agent_host\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"yt-queue-agent-1.ytsaurus.tech\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"has_timestamp_column\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"write_row_count_rate\"&lt;/span&gt; = {\n        &lt;span class=\"hljs-string\"&gt;\"1m_raw\"&lt;/span&gt; = 0.;\n        &lt;span class=\"hljs-string\"&gt;\"1h\"&lt;/span&gt; = 0.;\n        &lt;span class=\"hljs-string\"&gt;\"current\"&lt;/span&gt; = 0.;\n        &lt;span class=\"hljs-string\"&gt;\"1d\"&lt;/span&gt; = 0.;\n        &lt;span class=\"hljs-string\"&gt;\"1m\"&lt;/span&gt; = 0.;\n    };\n    &lt;span class=\"hljs-string\"&gt;\"registrations\"&lt;/span&gt; = [\n        {\n            &lt;span class=\"hljs-string\"&gt;\"consumer\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"freud://tmp/bob-test-consumer\"&lt;/span&gt;;\n            &lt;span class=\"hljs-string\"&gt;\"vital\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n            &lt;span class=\"hljs-string\"&gt;\"queue\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"pythia://tmp/bob-test-queue\"&lt;/span&gt;;\n        };\n    ];\n    &lt;span class=\"hljs-string\"&gt;\"write_data_weight_rate\"&lt;/span&gt; = {\n        &lt;span class=\"hljs-string\"&gt;\"1m_raw\"&lt;/span&gt; = 0.;\n        &lt;span class=\"hljs-string\"&gt;\"1h\"&lt;/span&gt; = 0.;\n        &lt;span class=\"hljs-string\"&gt;\"current\"&lt;/span&gt; = 0.;\n        &lt;span class=\"hljs-string\"&gt;\"1d\"&lt;/span&gt; = 0.;\n        &lt;span class=\"hljs-string\"&gt;\"1m\"&lt;/span&gt; = 0.;\n    };\n}\n\n$ yt --proxy pythia get //tmp/&lt;span class=\"hljs-variable\"&gt;$USER&lt;/span&gt;-test-queue/@queue_partitions\n[\n    {\n        &lt;span class=\"hljs-string\"&gt;\"error\"&lt;/span&gt; = {\n            &lt;span class=\"hljs-string\"&gt;\"attributes\"&lt;/span&gt; = {\n                &lt;span class=\"hljs-string\"&gt;\"trace_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"21503942-85d82a3a-2c9ea16d-e2149d9c\"&lt;/span&gt;;\n                &lt;span class=\"hljs-string\"&gt;\"span_id\"&lt;/span&gt; = 17862985281506116291u;\n                &lt;span class=\"hljs-string\"&gt;\"thread\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"Controller:4\"&lt;/span&gt;;\n                &lt;span class=\"hljs-string\"&gt;\"datetime\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"2025-01-23T13:42:21.839124Z\"&lt;/span&gt;;\n                &lt;span class=\"hljs-string\"&gt;\"tid\"&lt;/span&gt; = 9166196934387883291u;\n                &lt;span class=\"hljs-string\"&gt;\"pid\"&lt;/span&gt; = 481;\n                &lt;span class=\"hljs-string\"&gt;\"host\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"yt-queue-agent-1.ytsaurus.tech\"&lt;/span&gt;;\n                &lt;span class=\"hljs-string\"&gt;\"state\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"unmounted\"&lt;/span&gt;;\n                &lt;span class=\"hljs-string\"&gt;\"fid\"&lt;/span&gt; = 18445202819181375616u;\n            };\n            &lt;span class=\"hljs-string\"&gt;\"code\"&lt;/span&gt; = 1;\n            &lt;span class=\"hljs-string\"&gt;\"message\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"Tablet 3d3c-50e7d-7db02be-7e178361 is not mounted or frozen\"&lt;/span&gt;;\n        };\n    };\n]\n\n&lt;span class=\"hljs-comment\"&gt;# Check queue consumer status provided by Queue Agent.&lt;/span&gt;\n$ yt --proxy freud get //tmp/&lt;span class=\"hljs-variable\"&gt;$USER&lt;/span&gt;-test-consumer/@queue_consumer_status\n{\n    &lt;span class=\"hljs-string\"&gt;\"queues\"&lt;/span&gt; = {\n        &lt;span class=\"hljs-string\"&gt;\"pythia://tmp/bob-test-queue\"&lt;/span&gt; = {\n            &lt;span class=\"hljs-string\"&gt;\"error\"&lt;/span&gt; = {\n                &lt;span class=\"hljs-string\"&gt;\"attributes\"&lt;/span&gt; = {\n                    &lt;span class=\"hljs-string\"&gt;\"trace_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"623ba99c-b2dce5fe-50174949-5f508824\"&lt;/span&gt;;\n                    &lt;span class=\"hljs-string\"&gt;\"span_id\"&lt;/span&gt; = 14498308957160432715u;\n                    &lt;span class=\"hljs-string\"&gt;\"thread\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"Controller:1\"&lt;/span&gt;;\n                    &lt;span class=\"hljs-string\"&gt;\"datetime\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"2025-01-23T13:42:55.747430Z\"&lt;/span&gt;;\n                    &lt;span class=\"hljs-string\"&gt;\"tid\"&lt;/span&gt; = 627435960759374310u;\n                    &lt;span class=\"hljs-string\"&gt;\"pid\"&lt;/span&gt; = 481;\n                    &lt;span class=\"hljs-string\"&gt;\"host\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"yt-queue-agent-1.ytsaurus.tech\"&lt;/span&gt;;\n                    &lt;span class=\"hljs-string\"&gt;\"fid\"&lt;/span&gt; = 18442
