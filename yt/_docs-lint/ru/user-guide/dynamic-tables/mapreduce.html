            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе описано, как запускать MapReduce операции по динамическим таблицам, сказано о консистентности данных. Приведены примеры конвертации статической таблицы в динамическую и обратно.&lt;/p&gt;\n&lt;p&gt;Всё описанное в равной степени относится ко всем типам операций — map, merge и т.д., а не только непосредственно map-reduce, а также к команде read-table.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/mapreduce.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;В системе YTsaurus существует возможность запускать MapReduce операции поверх &lt;a href=\"user-guide/dynamic-tables/overview.html#types\"&gt;сортированных и упорядоченных&lt;/a&gt; динамических таблиц. Также возможно быстро (на уровне метаданных) преобразовать статическую таблицу в динамическую.&lt;/p&gt;\n&lt;p&gt;Поскольку статические и динамические таблицы изначально создавались под разные сценарии работы, существует несколько принципиальных отличий статических таблиц от динамических (как сортированных, так и упорядоченных).&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;При вставке в динамическую таблицу данные в первую очередь попадают в журнал и специальное хранилище в памяти (т. н. dynamic store), и только после этого записываются в чанки на дисках в виде версионированых строк (пока данные не записаны в чанки, отказоустойчивость гарантируется журналом). Данные статических таблиц всегда записываются сразу в чанки на дисках;&lt;/li&gt;\n&lt;li&gt;Все ключи в динамической &lt;em&gt;сортированной&lt;/em&gt; таблице уникальны. Строки таблицы однозначно определяются своим ключом;&lt;/li&gt;\n&lt;li&gt;Все данные в динамической &lt;em&gt;сортированной&lt;/em&gt; таблице версионированы: при вставке в динамическую сортированную таблицу данным присваивается метка времени коммита. При чтении можно указать временную метку для получения версии строки таблицы на указанный временной срез;&lt;/li&gt;\n&lt;li&gt;В &lt;em&gt;сортированных&lt;/em&gt; динамических таблицах периодически происходит компактификация: старые версии данных удаляются, чанки перезаписываются;&lt;/li&gt;\n&lt;li&gt;Ни &lt;em&gt;сортированные&lt;/em&gt;, ни &lt;em&gt;упорядоченные&lt;/em&gt; динамические таблицы не позволяют делать сквозную индексацию по номерам строк: в сортированных это полностью невозможно, в упорядоченных возможно внутри каждого таблета отдельно.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"running_operations_over_dyn_tables\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/mapreduce.html#running_operations_over_dyn_tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск операций по динамическим таблицам&lt;/span&gt;&lt;/a&gt;Запуск операций по динамическим таблицам&lt;/h2&gt;\n&lt;p&gt;&lt;em&gt;Данная секция относится как к сортированным, так и к упорядоченным таблицам.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Динамическая таблица может быть указана как входная (или одна из входных) для MapReduce операции. Интерфейс MapReduce операции такой же как и у статических таблиц с тем отличием, что вместо пути к статической таблице указывается путь к динамической. Динамическая таблица при этом может быть как примонтирована, так и отмонтирована. Использованию динамических таблиц как выходных для операции посвящена &lt;a href=\"user-guide/dynamic-tables/bulk-insert.html\"&gt;отдельная статья&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Поскольку обычные MapReduce операции работают с чанками, а динамические таблицы хранят часть данных в памяти в dynamic stores, в запуске операций по динамическим таблицам есть некоторая специфика. По умолчанию данные из dynamic stores из операций не видны. Есть несколько способов это обойти.&lt;/p&gt;\n&lt;p&gt;Подходящий в большинстве случаев способ — указать на таблице атрибут &lt;code&gt;@enable_dynamic_store_read=%true&lt;/code&gt; (предварительно её отмонтировав), после чего все данные будут видны из операций. Это принятый подход, если вам нужны свежие данные, однако есть побочные эффекты:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;результат последовательных запусков одной и той же операции поверх одной таблицы (даже под snapshot lock) может отличаться, поскольку второй запуск прочитает больше свежих строк. По этой причине в YQL отключено кеширование для таблиц с &lt;code&gt;@enable_dynamic_store_read&lt;/code&gt;. Для идемпотентности стоит &lt;a href=\"ru/user-guide/dynamic-tables/mapreduce.html#dyntable_mr_timestamp\"&gt;явно указывать timestamp&lt;/a&gt; или &lt;a href=\"ru/user-guide/dynamic-tables/mapreduce.html#dyntable_mr_ordered\"&gt;набор row index-ов&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;если на таблице установлен атрибут &lt;code&gt;@merge_rows_on_flush&lt;/code&gt;, обеспечить консистентное чтение по timestamp при включённом &lt;code&gt;@enable_dynamic_store_read&lt;/code&gt; на данный момент невозможно;&lt;/li&gt;\n&lt;li&gt;если один таблет будут читать сотни джобов, есть риск перегрузить таблетные ноды.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Если по каким-то причинам этот режим использовать не хочется, есть ещё ряд способов:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Отмонтировать таблицу. В отмонтированном состоянии все данные динамической таблицы хранятся в чанках;&lt;/li&gt;\n&lt;li&gt;Заморозить таблицу командой &lt;code&gt;freeze-table&lt;/code&gt; и дождаться когда все таблеты будут находиться в состоянии &lt;code&gt;frozen&lt;/code&gt;. В таком состоянии таблицы все данные записаны в чанки, запись новых данных запрещена, но таблица доступна на чтение командами &lt;code&gt;lookup-rows&lt;/code&gt; и &lt;code&gt;select-rows&lt;/code&gt;. Можно выполнять MapReduce операции;&lt;/li&gt;\n&lt;li&gt;Заказать состояние таблицы на такой момент времени в прошлом, чтобы все данные уже попали в чанки;&lt;/li&gt;\n&lt;li&gt;Ничего не предпринимать и получить данные из чанков как в пункте 3, но без гарантии, что все ключи будут относиться к одной версии таблицы (в разных таблетах данные записываются на диск в разное время, синхронизации между ними нет).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Над таблицей с включённым &lt;code&gt;@enable_dynamic_store_read&lt;/code&gt; можно запускать операции, игнорирующие dynamic stores и читающие только из чанков. Для этого надо явно указать &lt;code&gt;enable_dynamic_store_read = %false&lt;/code&gt; в корне спеки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"dyntable_mr_timestamp\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/mapreduce.html#dyntable_mr_timestamp\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск операций по состоянию сортированной динамической таблицы на определённый момент времени&lt;/span&gt;&lt;/a&gt;Запуск операций по состоянию сортированной динамической таблицы на определённый момент времени&lt;/h2&gt;\n&lt;p&gt;По умолчанию в MapReduce операцию попадает самая последняя версия строки, которая содержится в чанках. Если таблица примонтирована, то версии в чанках могут быть неконсистентны: для двух разных строк из одной и той же транзакции может оказаться, что одна строка уже находится в чанке, а вторая всё ещё находится в оперативной памяти. В итоге в MapReduce операции будет видна только часть строк данной транзакции. В случае включённого &lt;code&gt;@enable_dynamic_store_read&lt;/code&gt; неконсистентность также возможна, поскольку джобы читают разные части таблицы в разное время, и между чтениями могла произойти запись. В тех случаях, когда важно иметь консистентное состояние таблицы в MapReduce операции, необходимо указать временную метку в специальном атрибуте YPath: &lt;code&gt;&amp;lt;timestamp=123456789&amp;gt;//path/to/dynamic/sorted/table&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;На &lt;code&gt;timestamp&lt;/code&gt; есть нижнее и верхнее ограничения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;поскольку данные периодически компактифицируются, &lt;code&gt;timestamp&lt;/code&gt; должен быть не меньше чем значение атрибута &lt;code&gt;@retained_timestamp&lt;/code&gt;. Компактификация очищает старые данные, но только те, что предшествуют  &lt;code&gt;@retained_timestamp&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;если на таблице указан атрибут &lt;code&gt;@enable_dynamic_store_read&lt;/code&gt;, то верхнего ограничения нет. Однако если указать &lt;code&gt;timestamp&lt;/code&gt; из будущего, то консистентность обеспечена не будет;&lt;/li&gt;\n&lt;li&gt;если &lt;code&gt;@enable_dynamic_store_read&lt;/code&gt; не указан, то &lt;code&gt;timestamp&lt;/code&gt; должен быть меньше чем временная метка тех строк, которые ещё не были записаны на диск. Узнать временную метку можно через атрибут таблицы &lt;code&gt;unflushed_timestamp&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Таким образом, в случае включённого чтения из dynamic stores рекомендуется брать текущий timestamp (его можно получить командой &lt;a href=\"api/commands#generate_timestamp\"&gt;generate_timestamp&lt;/a&gt;). При чтении из таблицы-реплики генерировать &lt;code&gt;timestamp&lt;/code&gt; нужно на метакластере. Если чтение из dynamic stores не включено, нужно использовать &lt;code&gt;unflushed_timestamp - 1&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;При указании &lt;code&gt;timestamp&lt;/code&gt; планировщик проверит, что значение временной метки попадает в допустимый интервал.&lt;/p&gt;\n&lt;p&gt;У примонтированной таблицы значения атрибутов &lt;code&gt;unflushed_timestamp&lt;/code&gt; и &lt;code&gt;retained_timestamp&lt;/code&gt; постоянно меняются, поэтому при работе с таблицей на неё стоит брать snapshot lock. Нет гарантий, что &lt;code&gt;retained_timestamp&lt;/code&gt; всегда меньше &lt;code&gt;unflushed_timestamp&lt;/code&gt;. Перечисленные значения зависят от настроек компактификации и процесса записи данных в чанки и, если указанное условие слишком часто нарушается, придётся поменять настройки таблицы.&lt;/p&gt;\n&lt;p&gt;Полезно обратить внимание на следующие атрибуты:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;dynamic_store_auto_flush_period&lt;/code&gt; — периодичность сброса данных на диск. Имеет смысл при отключённом &lt;code&gt;@enable_dynamic_store_read&lt;/code&gt;. Значение по умолчанию — 15 минут;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;min_data_ttl&lt;/code&gt; — определяет, насколько старые данные не должны подвергаться компактификации. Подробнее можно прочитать в разделе &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html#remove_old_data\"&gt;Динамические сортированные таблицы&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В текущей реализации не поддерживаются операции с указанием timestamp над таблицами, примонтированными в неатомарном режиме.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"dyntable_mr_ordered\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/mapreduce.html#dyntable_mr_ordered\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск операций по упорядоченным таблицам&lt;/span&gt;&lt;/a&gt;Запуск операций по упорядоченным таблицам&lt;/h2&gt;\n&lt;p&gt;Упорядоченные динамические таблицы довольно похожи на статические. Отличия с точки зрения операций в том, что индексация по номерам строк происходит внутри каждого таблета отдельно (причём индексация может начинаться не с нуля из-за &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables.html#trim\"&gt;trim'а&lt;/a&gt;), а также что свежие данные в каждом таблете находятся в dynamic store.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффект trim'а может быть заметен в операции не сразу. Ситуация, при которой в операцию попали строки, удалённые через trim, считается допустимой.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"indeksaciya\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/mapreduce.html#indeksaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Индексация&lt;/span&gt;&lt;/a&gt;Индексация&lt;/h3&gt;\n&lt;p&gt;В операциях по упорядоченным таблицам доступен &lt;a href=\"user-guide/storage/io-configuration.html#control_attributes\"&gt;контрольный атрибут&lt;/a&gt; &lt;code&gt;enable_tablet_index&lt;/code&gt;. Атрибут &lt;code&gt;enable_row_index&lt;/code&gt; же имеет иную семантику, нежели в статических таблицах: возвращаемый индекс строки считается относительно начала таблета. Нумерация строк внутри таблета логическая, то есть даже если сделать trim, то номера существующих строк не изменятся.&lt;/p&gt;\n&lt;p&gt;Row index и tablet index также можно указывать в &lt;a href=\"user-guide/storage/ypath.html#known_attributes\"&gt;диапазонах ypath&lt;/a&gt;. Каждая строчка в упорядоченной таблице индексируется парой &lt;code&gt;(tablet_index, row_index)&lt;/code&gt;. Нижняя граница &lt;code&gt;lower_limit = {tablet_index = a; row_index = b}&lt;/code&gt; допускает строки из таблета &lt;code&gt;a&lt;/code&gt; с номерами &lt;code&gt;b&lt;/code&gt; и больше, а также все строки из таблетов с номерами больше &lt;code&gt;a&lt;/code&gt;. Верхняя граница &lt;code&gt;upper_limit = {tablet_index = c; row_index = d}&lt;/code&gt; допускает все строки из таблетов с номерами меньше &lt;code&gt;c&lt;/code&gt;, а также строки из таблета &lt;code&gt;c&lt;/code&gt; с номером строго меньше &lt;code&gt;d&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В границе можно указать только &lt;code&gt;tablet_index&lt;/code&gt;. Нижняя граница вида &lt;code&gt;{tablet_index = e}&lt;/code&gt; допускает все строки таблетов с номерами не менее &lt;code&gt;e&lt;/code&gt;; верхняя граница такого вида допускает все строки таблетов с номерами строго меньше &lt;code&gt;e&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Есть ограничение на количество диапазонов в YPath. Если количество таблетов упорядоченной таблицы превышает 100 и вы планируете указывать в операции по одному диапазону на каждый таблет упорядоченной таблицы, стоит обсудить это с администраторами кластера.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"dopustimye-granicy-indeksov\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/mapreduce.html#dopustimye-granicy-indeksov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Допустимые границы индексов&lt;/span&gt;&lt;/a&gt;Допустимые границы индексов&lt;/h3&gt;\n&lt;p&gt;Как и в случае с timestamp для сортированных таблиц, на row index в упорядоченной таблице есть верхнее и нижнее ограничения в пределах таблета. Нижнее ограничение связано с удалением строк через trim. Верхнее связано с хранением строк в dynamic store и имеет смысл, если вам не подходит &lt;a href=\"ru/user-guide/dynamic-tables/mapreduce.html#running_operations_over_dyn_tables\"&gt;enable_dynamic_store_read&lt;/a&gt; и вы хотите запускать операцию по примонтированной таблице.&lt;/p&gt;\n&lt;p&gt;Ограничения можно получить из атрибута таблицы &lt;code&gt;@tablets&lt;/code&gt;. В значении, соответствующем каждому таблету, есть поля &lt;code&gt;trimmed_row_count&lt;/code&gt; и &lt;code&gt;flushed_row_count&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В отличие от timestamp, корректность индексов для упорядоченных таблиц &lt;strong&gt;не валидирируется&lt;/strong&gt;: если указать индексы за пределами указанных ограничений, операция просто прочитает меньше данных, чем ожидалось.&lt;/p&gt;\n&lt;h2 id=\"convert_table\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/mapreduce.html#convert_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конвертация статической таблицы в динамическую&lt;/span&gt;&lt;/a&gt;Конвертация статической таблицы в динамическую&lt;/h2&gt;\n&lt;p&gt;Для конвертации статической таблицы в динамическую необходимо выполнить команду &lt;code&gt;alter-table&lt;/code&gt;:&lt;/p&gt;\n&lt;div class=\"yfm-tabs\" data-diplodoc-group=\"defaultTabsGroup-qddd60wb\" data-diplodoc-variant=\"regular\"&gt;\n&lt;div class=\"yfm-tab-list\" role=\"tablist\"&gt;\n&lt;div data-diplodoc-id=\"cli\" data-diplodoc-key=\"cli\" class=\"yfm-tab yfm-tab-group active\" role=\"tab\" tabindex=\"0\" data-diplodoc-is-active=\"true\"&gt;CLI&lt;/div&gt;\n&lt;div data-diplodoc-id=\"python\" data-diplodoc-key=\"python\" class=\"yfm-tab yfm-tab-group\" role=\"tab\" tabindex=\"-1\" data-diplodoc-is-active=\"false\"&gt;Python&lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"oew9gbia\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"CLI\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt alter-table --dynamic //tmp/t\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"235\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-235\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-235\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-235.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"3lmf32nq\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"Python\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.alter_table(&lt;span class=\"hljs-string\"&gt;\"//tmp/t\"&lt;/span&gt;, dynamic=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"238\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-238\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-238\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-238.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;p&gt;После конвертации в динамической таблице будет один таблет, поэтому полученную таблицу следует решардировать вручную командой &lt;code&gt;reshard-table&lt;/code&gt; с указанием числа таблетов.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;В случае сортированных таблиц следует выбирать число таблетов следует исходя из 5 GB (compressed size) на таблет.&lt;/li&gt;\n&lt;li&gt;В случае упорядоченных таблиц (очередей) все данные останутся в первом таблете, а новые таблеты будут созданы пустыми. Распределить чанки по разным таблетам после конвертации невозможно.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-tabs\" data-diplodoc-group=\"defaultTabsGroup-suxlqe8q\" data-diplodoc-variant=\"regular\"&gt;\n&lt;div class=\"yfm-tab-list\" role=\"tablist\"&gt;\n&lt;div data-diplodoc-id=\"cli-1\" data-diplodoc-key=\"cli\" class=\"yfm-tab yfm-tab-group active\" role=\"tab\" tabindex=\"0\" data-diplodoc-is-active=\"true\"&gt;CLI&lt;/div&gt;\n&lt;div data-diplodoc-id=\"python-1\" data-diplodoc-key=\"python\" class=\"yfm-tab yfm-tab-group\" role=\"tab\" tabindex=\"-1\" data-diplodoc-is-active=\"false\"&gt;Python&lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"agqb02ml\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"CLI\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt reshard-table //tmp/t --tablet-count $(($(yt get //tmp/t/@compressed_data_size) / (&lt;span class=\"hljs-number\"&gt;5&lt;/span&gt; &amp;lt;&amp;lt; &lt;span class=\"hljs-number\"&gt;30&lt;/span&gt;) + &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;)) --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"266\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-266\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-266\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-266.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"mcicsmch\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"Python\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;data_size = yt.get(&lt;span class=\"hljs-string\"&gt;\"//tmp/t/@compressed_data_size\"&lt;/span&gt;)\nyt.reshard_table(&lt;span class=\"hljs-string\"&gt;\"//tmp/t\"&lt;/span&gt;, tablet_count=data_size / (&lt;span class=\"hljs-number\"&gt;5&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;**&lt;span class=\"hljs-number\"&gt;30&lt;/span&gt;) + &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;, sync=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"269\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-269\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-269\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-269.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;p&gt;В конвертации есть несколько тонкостей, на которые стоит обратить внимание.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Команда &lt;code&gt;alter-table&lt;/code&gt; выполнится и для несортированной таблицы. В результате получится &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables.html\"&gt;динамическая упорядоченная таблица&lt;/a&gt;. Для таких таблиц команда &lt;code&gt;insert-rows&lt;/code&gt; работает не так, как для сортированных, а команда &lt;code&gt;select-rows&lt;/code&gt; на тех же запросах будет работать значительно медленнее.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Все ключи динамической сортированной таблицы уникальны, поэтому статическая таблица также должна содержать только уникальные ключи. Система определяет данный факт по атрибуту &lt;code&gt;@unique_keys&lt;/code&gt; у схемы. Выставить данный атрибут на схему существующей непустой таблицы с помощью команды &lt;code&gt;alter-table&lt;/code&gt; нельзя. Необходимо специально создавать таблицу с указанным атрибутом &lt;code&gt;unique_keys=true&lt;/code&gt; у схемы. Уникальность ключей будет провалидирована при записи. В случае, когда таблица уже создана, все ключи в ней уникальны, но у схемы выставлен атрибут &lt;code&gt;unique_keys=false&lt;/code&gt;, необходимо создать новую таблицу с исправленной схемой и скопировать в неё данные с помощью операции &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Типичные размеры чанков и блоков для динамических таблиц меньше, чем для статических. Если таблицу предполагается конвертировать в динамическую, стоит выставить определённые параметры в спеке операции, порождающей эту таблицу:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-string\"&gt;\"job_io\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"table_writer\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"block_size\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;256&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;**&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"desired_chunk_size\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;100&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;**&lt;span class=\"hljs-number\"&gt;20&lt;/span&gt;}}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"290\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-290\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-290\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-290.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если в операции несколько типов джобов, конфиг необходимо указывать только для &lt;code&gt;job_io&lt;/code&gt; последнего типа джобов в операции (&lt;code&gt;merge_job_io&lt;/code&gt; для операции Sort, &lt;code&gt;reduce_job_io&lt;/code&gt; для операции MapReduce). Если в операции используется &lt;a href=\"user-guide/data-processing/operations/automerge.html\"&gt;автоматическое слияние чанков&lt;/a&gt;, аналогичный конфиг необходимо указать в секции &lt;code&gt;\"automerge\": {\"job_io\": {...}}&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Подробнее про &lt;code&gt;job_io&lt;/code&gt; для различных типов операций можно прочитать в разделе &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Настройки операций&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Проверить размеры чанков и блоков получившейся таблицы можно с помощью следующих атрибутов таблицы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;чанки: &lt;code&gt;@compressed_data_size&lt;/code&gt; / &lt;code&gt;@chunk_count&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;блоки: &lt;code&gt;@chunk_format_statistics/*/max_block_size&lt;/code&gt; (значение атрибута – это словарь, содержащий значение max_block_size для каждого типа чанков в таблице).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробнее про размеры чанков и блоков&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Динамические таблицы, как правило, используются для быстрого поиска по ключу. Данные в чанках разбиты на блоки, и при чтении с диска читается сразу весь блок. Таблица по умолчанию сжата определённым кодеком, разжатие будет применяться также для всего блока. Чтобы не тратить слишком много вычислений на поиск одной строки, стоит уменьшить размер блока. Блоки статических таблиц по умолчанию имеют размер 16 мегабайт, тогда как блоки динамических таблиц — 256 килобайт. Но если статическую таблицу конвертировать в динамическую, то размер блока останется прежним как у исходной статической таблицы. Поэтому при создании статической таблицы необходимо принудительно уменьшить размер блока, указав в спецификации настройки &lt;code&gt;block_size&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В текущей реализации системы YTsaurus при попытке сделать запрос в динамическую таблицу выполняется проверка, что максимальный размер блока не превышает 512 килобайт. В противном случае запрос завершится с ошибкой \"Maximum block size limit violated\". Это сделано для того, чтобы избежать медленных чтений из таблиц. Такая же ошибка возникнет и у динамической таблицы, подгружаемой в память, при попытке загрузить чанк с большими блоками. Для решения проблемы можно либо компактифицировать таблицу, либо увеличить ограничение на размер блока до 32 мегабайт с помощью атрибута &lt;code&gt;max_unversioned_block_size&lt;/code&gt; (необходимо установить атрибут на таблице, после чего вызвать &lt;code&gt;remount_table&lt;/code&gt;).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Таблеты в динамических таблицах делятся на партиции. Типичный размер партиции составляет несколько сотен мегабайт. В том случае, если чанки становятся больше чем размер партиции, запускается фоновый процесс, принудительно разбивающий чанки на более мелкие. Полезно при создании динамической таблицы также указать в спецификации настройки &lt;code&gt;desired_chunk_size&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В таком случае чанки получатся достаточно мелкими (по 100 мегабайт). В противном случае чанки будут по умолчанию большими (512Мб и более). Когда таблица пошардирована на шарды (таблеты), такие чанки могут попадать в несколько таблетов и при вычислении размера таблицы будут учитываться несколько раз, в результате размер динамической таблицы может оказаться в несколько раз больше исходной статической.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;В том случае, когда таблицу предполагается держать в памяти (управляется атрибутом &lt;code&gt;@in_memory_mode&lt;/code&gt;), для достижения наибольшей производительности рекомендуется выполнить форсированную компактификацию. Необходимость вызвана следующим:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;один и тот же чанк попадает в разные таблеты, а чанки разных таблетов подгружаются в память независимо (таблеты могут быть на разных узлах кластера). В результате затрачивается больше памяти, чем необходимо;&lt;/li&gt;\n&lt;li&gt;ридеры для чанков статических таблиц не оптимизированы для случая, когда данные уже в памяти.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Если динамическую таблицу предполагается использовать только для чтения, стоит примонтировать её в «замороженном» состоянии (управляется флагом &lt;code&gt;--freeze&lt;/code&gt; команды &lt;code&gt;mount-table&lt;/code&gt;). Это запретит запись, отключит компактификацию и снизит накладные расходы на обслуживание таблицы. Стоит делать это лишь в случае, когда размеры чанков и блоков соответствуют рекомендованным.&lt;/p&gt;\n&lt;h3 id=\"primer\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/mapreduce.html#primer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h3&gt;\n&lt;p&gt;Ниже приведён пример скрипта, демонстрирующий, как можно сохранить сортированную динамическую таблицу в статическую и вспоследствии восстановить обратно. Данную операцию можно осуществлять для создания резервных копий динамических таблиц.&lt;/p&gt;\n&lt;p&gt;Обратите внимание, что скрипт не является production-ready и приведён только для ознакомления. В частности, он сохраняет только некоторые атрибуты таблиц и никак не обратабывает ошибки.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Преобразование динамической таблицы в статическую и обратно&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-comment\"&gt;#!/usr/bin/python3&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; argparse\n\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;dump&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;src, dst&lt;/span&gt;):\n    &lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; yt.Transaction():\n        &lt;span class=\"hljs-comment\"&gt;# Take snapshot lock for source table.&lt;/span&gt;\n        node_id = yt.lock(src, mode=&lt;span class=\"hljs-string\"&gt;\"snapshot\"&lt;/span&gt;)[&lt;span class=\"hljs-string\"&gt;\"node_id\"&lt;/span&gt;]\n        &lt;span class=\"hljs-comment\"&gt;# Get timestamp of flushed data&lt;/span&gt;\n        &lt;span class=\"hljs-comment\"&gt;# (not required if @enable_dynamic_store_read is set).&lt;/span&gt;\n        ts = yt.get(&lt;span class=\"hljs-string\"&gt;f\"#&lt;span class=\"hljs-subst\"&gt;{node_id}&lt;/span&gt;/@unflushed_timestamp\"&lt;/span&gt;) - &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n        &lt;span class=\"hljs-comment\"&gt;# Create table and save vital attributes.&lt;/span&gt;\n        yt.create(&lt;span class=\"hljs-string\"&gt;\"table\"&lt;/span&gt;, dst, attributes={\n            &lt;span class=\"hljs-string\"&gt;\"optimize_for\"&lt;/span&gt;: yt.get(&lt;span class=\"hljs-string\"&gt;f\"#&lt;span class=\"hljs-subst\"&gt;{node_id}&lt;/span&gt;/@optimize_for\"&lt;/span&gt;),\n            &lt;span class=\"hljs-string\"&gt;\"schema\"&lt;/span&gt;: yt.get(&lt;span class=\"hljs-string\"&gt;f\"#&lt;span class=\"hljs-subst\"&gt;{node_id}&lt;/span&gt;/@schema\"&lt;/span&gt;),\n            &lt;span class=\"hljs-string\"&gt;\"_yt_dump_restore_pivot_keys\"&lt;/span&gt;: yt.get(&lt;span class=\"hljs-string\"&gt;f\"#&lt;span class=\"hljs-subst\"&gt;{node_id}&lt;/span&gt;/@pivot_keys\"&lt;/span&gt;),\n        })\n        &lt;span class=\"hljs-comment\"&gt;# Dump table contents.&lt;/span&gt;\n        yt.run_merge(yt.TablePath(&lt;span class=\"hljs-string\"&gt;f\"#&lt;span class=\"hljs-subst\"&gt;{node_id}&lt;/span&gt;\"&lt;/span&gt;, attributes={&lt;span class=\"hljs-string\"&gt;\"timestamp\"&lt;/span&gt;: ts}), dst, mode=&lt;span class=\"hljs-string\"&gt;\"ordered\"&lt;/span&gt;)\n\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;restore&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;src, dst&lt;/span&gt;):\n    &lt;span class=\"hljs-comment\"&gt;# Create destination table.&lt;/span&gt;\n    yt.create(&lt;span class=\"hljs-string\"&gt;\"table\"&lt;/span&gt;, dst, attributes={\n        &lt;span class=\"hljs-string\"&gt;\"optimize_for\"&lt;/span&gt;: yt.get(&lt;span class=\"hljs-string\"&gt;f\"&lt;span class=\"hljs-subst\"&gt;{src}&lt;/span&gt;/@optimize_for\"&lt;/span&gt;),\n        &lt;span class=\"hljs-string\"&gt;\"schema\"&lt;/span&gt;: yt.get(&lt;span class=\"hljs-string\"&gt;f\"&lt;span class=\"hljs-subst\"&gt;{src}&lt;/span&gt;/@schema\"&lt;/span&gt;),\n    })\n    &lt;span class=\"hljs-comment\"&gt;# Make blocks smaller (required for real-time lookups).&lt;/span&gt;\n    yt.run_merge(src, dst, mode=&lt;span class=\"hljs-string\"&gt;\"ordered\"&lt;/span&gt;, spec={\n        &lt;span class=\"hljs-string\"&gt;\"job_io\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"table_writer\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"block_size\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;256&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;**&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"desired_chunk_size\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;100&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;**&lt;span class=\"hljs-number\"&gt;20&lt;/span&gt;}},\n        &lt;span class=\"hljs-string\"&gt;\"force_transform\"&lt;/span&gt;: &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;,\n    })\n    &lt;span class=\"hljs-comment\"&gt;# Make table dynamic.&lt;/span&gt;\n    yt.alter_table(dst, dynamic=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n    &lt;span class=\"hljs-comment\"&gt;# Restore tablet structure.&lt;/span&gt;\n    yt.reshard_table(dst, yt.get(&lt;span class=\"hljs-string\"&gt;f\"&lt;span class=\"hljs-subst\"&gt;{src}&lt;/span&gt;/@_yt_dump_restore_pivot_keys\"&lt;/span&gt;), sync=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; __name__ ==  &lt;span class=\"hljs-string\"&gt;\"__main__\"&lt;/span&gt;:\n    parser = argparse.ArgumentParser(description=&lt;span class=\"hljs-string\"&gt;\"Dynamic tables dump-restore tool\"&lt;/span&gt;)\n    mode = parser.add_mutually_exclusive_group(required=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n    mode.add_argument(&lt;span class=\"hljs-string\"&gt;\"--dump\"&lt;/span&gt;, nargs=&lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;, metavar=(&lt;span class=\"hljs-string\"&gt;\"SOURCE\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"DESTINATION\"&lt;/span&gt;), &lt;span class=\"hljs-built_in\"&gt;help&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"Dump dynamic table to static\"&lt;/span&gt;)\n    mode.add_argument(&lt;span class=\"hljs-string\"&gt;\"--restore\"&lt;/span&gt;, nargs=&lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;, metavar=(&lt;span class=\"hljs-string\"&gt;\"SOURCE\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"DESTINATION\"&lt;/span&gt;), &lt;span class=\"hljs-built_in\"&gt;help&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"Restore dynamic table from static\"&lt;/span&gt;)\n    args = parser.parse_args()\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; args.dump:\n        dump(*args.dump)\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; args.restore:\n        restore(*args.restore)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"374\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-374\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-374\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-374.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"ispolzovanie-vychislyaemyh-kolonok\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/mapreduce.html#ispolzovanie-vychislyaemyh-kolonok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование вычисляемых колонок&lt;/span&gt;&lt;/a&gt;Использование вычисляемых колонок&lt;/h2&gt;\n&lt;p&gt;Для более равномерного распределения нагрузки по кластеру, динамические таблицы необходимо шардировать (разбивать на таблеты).  Для равномерного распределения нагрузки между таблетами может оказаться удобным добавить перед всеми ключевыми колонками дополнительную колонку, в которую записывать хеш от той части ключа, по которой логично выполнять шардирование, например, хеш от первой колонки. В результате получится таблица, ключи которой равномерно распределены в диапазоне &lt;code&gt;[0, 2^64-1]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Добавленная таким образом колонка является вычисляемой. Формулу для вычисления необходимо указывать в схеме колонки в поле &lt;code&gt;expression&lt;/code&gt;. При записи в таблицу значение таких колонок будет вычисляться. Чтобы подготовить статическую таблицу для конвертации в динамическую, необходимо отсортировать её с помощью операции &lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;Sort&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Ниже приведён пример создания динамической таблицы с вычисляемыми колонками из статической. Вместо &lt;code&gt;write_rows&lt;/code&gt; запись в таблицу могла бы быть осуществлена с помощью операций Map, Reduce, MapReduce или Merge. В последнем случае в спецификации необходимо указать &lt;code&gt;{'schema_inference_mode': 'from_output'}&lt;/code&gt;, чтобы данные валидировались по схеме выходной таблицы. Также при указании &lt;code&gt;schema_inference_mode&lt;/code&gt; необходимо создавать выходную таблицу операции вручную, явно указывая требуемую схему. Если этого не сделать, используемое API попробует самостоятельно создать выходную таблицу, используя схему, выведенную из входной таблицы, что в данном случае приведёт к ошибкам.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Создание динамической таблицы с вычисляемыми колонками&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.yson &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yson\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; time\n\n&lt;span class=\"hljs-comment\"&gt;# Unsorted schema.&lt;/span&gt;\nschema = [\n    {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"hash\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"uint64\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"expression\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"farm_hash(key)\"&lt;/span&gt;},\n    {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"uint64\"&lt;/span&gt;},\n    {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"string\"&lt;/span&gt;}]\n\n&lt;span class=\"hljs-comment\"&gt;# Sorted schema with unique keys attribute.&lt;/span&gt;\nsorted_schema = yson.YsonList([\n    {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"hash\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"uint64\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"expression\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"farm_hash(key)\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"sort_order\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"ascending\"&lt;/span&gt;},\n    {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"uint64\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"sort_order\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"ascending\"&lt;/span&gt;},\n    {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"string\"&lt;/span&gt;}])\nsorted_schema.attributes[&lt;span class=\"hljs-string\"&gt;\"unique_keys\"&lt;/span&gt;] = &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Create table&lt;/span&gt;\ntable = &lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;\nyt.remove(table, force=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\nyt.create_table(table, attributes={&lt;span class=\"hljs-string\"&gt;\"schema\"&lt;/span&gt;: schema})\n\n&lt;span class=\"hljs-comment\"&gt;# Write rows into table. Computed columns are omitted: YTsaurus will evaluate them.&lt;/span&gt;\nyt.write_table(table, [{&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"2\"&lt;/span&gt;}, {&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"1\"&lt;/span&gt;}])\n\n&lt;span class=\"hljs-comment\"&gt;# Sort table. Resulting table schema has unique_keys=True.&lt;/span&gt;\nyt.run_sort(table, yt.TablePath(table, attributes={&lt;span class=\"hljs-string\"&gt;\"schema\"&lt;/span&gt;: sorted_schema}), sort_by=[&lt;span class=\"hljs-string\"&gt;\"hash\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;], spec={\n    &lt;span class=\"hljs-string\"&gt;\"partition_job_io\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"table_writer\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"block_size\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;256&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;**&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;}},\n    &lt;span class=\"hljs-string\"&gt;\"merge_job_io\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"table_writer\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"block_size\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;256&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;**&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;}},\n    &lt;span class=\"hljs-string\"&gt;\"sort_job_io\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"table_writer\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"block_size\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;256&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;**&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;}}})\n\n&lt;span class=\"hljs-comment\"&gt;# Alter table into dynamic.&lt;/span&gt;\nyt.alter_table(table, dynamic=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n\n&lt;span class=\"hljs-comment\"&gt;# Mount table and wait until all tablets are mounted.&lt;/span&gt;\nyt.mount_table(table, sync=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n\n&lt;span class=\"hljs-comment\"&gt;# Print rows.&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; row &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; yt.select_rows(&lt;span class=\"hljs-string\"&gt;\"* from [{}]\"&lt;/span&gt;.&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(table)):\n    &lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt; row\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"394\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-394\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-394\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-394.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"primery-zapuska-operacij\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/mapreduce.html#primery-zapuska-operacij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры запуска операций&lt;/span&gt;&lt;/a&gt;Примеры запуска операций&lt;/h2&gt;\n&lt;p&gt;Запуск Map операции:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt map &lt;span class=\"hljs-string\"&gt;'grep some_value'&lt;/span&gt; --src //path/to/dynamic/table --dst //tmp/output --spec &lt;span class=\"hljs-string\"&gt;'{pool = \"project-pool\"; job_count = 100; }'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"403\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-403\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-403\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-403.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Запуск Reduce операции:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt reduce &lt;span class=\"hljs-string\"&gt;'python my_reducer.py'&lt;/span&gt; --src //path/to/dynamic/table --dst &lt;span class=\"hljs-string\"&gt;'&amp;lt;sorted_by = [\"key\"]&amp;gt;'&lt;/span&gt;//tmp/output\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"407\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-407\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-407\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-407.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/dynamic-tables/mapreduce.md","sourcePath":"ru/user-guide/dynamic-tables/mapreduce.md"},"headings":[{"title":"Обзор","href":"ru/user-guide/dynamic-tables/mapreduce.html#obzor","level":2},{"title":"Запуск операций по динамическим таблицам","href":"ru/user-guide/dynamic-tables/mapreduce.html#running_operations_over_dyn_tables","level":2},{"title":"Запуск операций по состоянию сортированной динамической таблицы на определённый момент времени","href":"ru/user-guide/dynamic-tables/mapreduce.html#dyntable_mr_timestamp","level":2},{"title":"Запуск операций по упорядоченным таблицам","href":"ru/user-guide/dynamic-tables/mapreduce.html#dyntable_mr_ordered","level":2,"items":[{"title":"Индексация","href":"ru/user-guide/dynamic-tables/mapreduce.html#indeksaciya","level":3},{"title":"Допустимые границы индексов","href":"ru/user-guide/dynamic-tables/mapreduce.html#dopustimye-granicy-indeksov","level":3}]},{"title":"Конвертация статической таблицы в динамическую","href":"ru/user-guide/dynamic-tables/mapreduce.html#convert_table","level":2,"items":[{"title":"Пример","href":"ru/user-guide/dynamic-tables/mapreduce.html#primer","level":3}]},{"title":"Использование вычисляемых колонок","href":"ru/user-guide/dynamic-tables/mapreduce.html#ispolzovanie-vychislyaemyh-kolonok","level"
