        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"vvedenie\"&gt;&lt;a href=\"ru/user-guide/query-tracker/system-python-udf.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h2&gt;\n&lt;p&gt;Не все задачи можно выразить в чисто декларативном стиле, как в SQL. Иногда удобнее описать обработку данных в императивном стиле. Для этого YQL поддерживает создание и использование пользовательских функций (UDF).&lt;/p&gt;\n&lt;h2 id=\"python-udf\"&gt;&lt;a href=\"ru/user-guide/query-tracker/system-python-udf.html#python-udf\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Python UDF&lt;/span&gt;&lt;/a&gt;Python UDF&lt;/h2&gt;\n&lt;p&gt;Python UDF позволяет описывать функции на языке Python в самом запросе и использовать их.&lt;/p&gt;\n&lt;h2 id=\"ispolzovanie\"&gt;&lt;a href=\"ru/user-guide/query-tracker/system-python-udf.html#ispolzovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование&lt;/span&gt;&lt;/a&gt;Использование&lt;/h2&gt;\n&lt;p&gt;Для использования Python UDF в YQL запросе нужно выполнить три шага:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Включить в запрос строку с Python-скриптом, в котором определена функция для вызова в качестве UDF.&lt;/li&gt;\n&lt;li&gt;Объявить в запросе имя функции и её сигнатуру (типы входных и выходных данных).&lt;/li&gt;\n&lt;li&gt;Вызвать функцию в теле запроса, передав ей необходимые аргументы.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Каждый из этих шагов подробно описан в следующих разделах.&lt;/p&gt;\n&lt;h3 id=\"napisanie-python-skripta\"&gt;&lt;a href=\"ru/user-guide/query-tracker/system-python-udf.html#napisanie-python-skripta\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Написание Python скрипта&lt;/span&gt;&lt;/a&gt;Написание Python скрипта&lt;/h3&gt;\n&lt;p&gt;Скрипт можно задать тремя способами:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Обычный строковый литерал. Например: &lt;code&gt;$script = \"def foo(): return 'bar'\"&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Многострочный строковый литерал (расширение YQL). Такой литерал ограничивается символами &lt;code&gt;@@&lt;/code&gt; и работает аналогично тройным кавычкам в Python. Комментарий &lt;code&gt;#py&lt;/code&gt; включает подсветку синтаксиса Python в редакторе YQL:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$script = @@#py\ndef foo():\n    return b'bar'\n@@\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"54\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-54\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-54\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-54.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Именованный файл, приложенный к запросу. Содержимое файла встраивается в запрос с помощью функции &lt;a href=\"yql/builtins/basic.html#file-content-path\"&gt;FileContent&lt;/a&gt;: &lt;code&gt;$script = FileContent(\"foo.py\")&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"obuyavlenie-imeni-i-signatury-funkcii\"&gt;&lt;a href=\"ru/user-guide/query-tracker/system-python-udf.html#obuyavlenie-imeni-i-signatury-funkcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Объявление имени и сигнатуры функции&lt;/span&gt;&lt;/a&gt;Объявление имени и сигнатуры функции&lt;/h3&gt;\n&lt;p&gt;Поскольку Python является динамически типизированным языком, а YQL — статически типизированным, необходимо заранее зафиксировать типы на их стыке. Имя и сигнатура вызываемой из Python-скрипта функции должны быть известны до выполнения YQL запроса. Если типы, объявленные в сигнатуре, не будут соответствовать фактическим данным, возвращаемым функцией, это приведет к ошибке во время исполнения.&lt;/p&gt;\n&lt;p&gt;Синтаксис объявления имени и сигнатуры функции рассмотрим на примере:&lt;br /&gt;\n&lt;code&gt;$f = SystemPython3_8::foo(Callable&amp;lt;()-&amp;gt;String&amp;gt;, $script);&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;$f&lt;/code&gt; и &lt;code&gt;$script&lt;/code&gt; — &lt;a href=\"yql/syntax/expressions.html#named-nodes\"&gt;именованные выражения YQL&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;$f&lt;/code&gt; — готовая для использования функция.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;$script&lt;/code&gt; — скрипт на Python из предыдущего раздела.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;SystemPython3_8::&lt;/code&gt; — фиксированный префикс для объявления функции на Python. &lt;code&gt;System&lt;/code&gt; означает, что Python будет взят из окружения во время исполнения. &lt;code&gt;3_8&lt;/code&gt; указывает на версию Python, которая будет использована.\n&lt;ul&gt;\n&lt;li&gt;На момент написания доступны версии &lt;code&gt;3_8&lt;/code&gt; - &lt;code&gt;3_12&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;foo&lt;/code&gt; — имя функции внутри скрипта &lt;code&gt;$script&lt;/code&gt;, которая будет вызываться.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Callable&amp;lt;()-&amp;gt;String&amp;gt;&lt;/code&gt; — описание сигнатуры функции. Пустые скобки означают отсутствие аргументов, а &lt;code&gt;String&lt;/code&gt; после стрелки — строковый результат. Пример сигнатуры функции с аргументами: &lt;code&gt;Callable&amp;lt;(String, Uint32)-&amp;gt;Double&amp;gt;&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"ispolzovanie-udf-v-zaprose\"&gt;&lt;a href=\"ru/user-guide/query-tracker/system-python-udf.html#ispolzovanie-udf-v-zaprose\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование UDF в запросе&lt;/span&gt;&lt;/a&gt;Использование UDF в запросе&lt;/h3&gt;\n&lt;p&gt;Полученную после объявления сигнатуры функцию можно вызывать так же, как и любую встроенную функцию YQL. Например: &lt;code&gt;$f()&lt;/code&gt; или &lt;code&gt;$udf(\"test\", 123)&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"tipy-dannyh\"&gt;&lt;a href=\"ru/user-guide/query-tracker/system-python-udf.html#tipy-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типы данных&lt;/span&gt;&lt;/a&gt;Типы данных&lt;/h2&gt;\n&lt;p&gt;Доступные типы данных для указания в сигнатуре функций можно помотреть в разделе &lt;a href=\"yql/types/index.html\"&gt;Типы данных YQL&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"kontejnery\"&gt;&lt;a href=\"ru/user-guide/query-tracker/system-python-udf.html#kontejnery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Контейнеры&lt;/span&gt;&lt;/a&gt;Контейнеры&lt;/h3&gt;\n&lt;p&gt;Контейнеры преобразуются в Python объекты по следующим правилам:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Название&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Объявление сигнатуры&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Пример сигнатуры&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Представление в Python&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Список&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;List&amp;lt;Type&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;List&amp;lt;Int32&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list-like object&lt;/code&gt; &lt;a href=\"ru/user-guide/query-tracker/system-python-udf.html#python-container-wrappers\"&gt;(подробнее)&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Словарь&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Dict&amp;lt;KeyType,ValueType&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Dict&amp;lt;String,Int32&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;dict-like object&lt;/code&gt; &lt;a href=\"ru/user-guide/query-tracker/system-python-udf.html#python-container-wrappers\"&gt;(подробнее)&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Кортеж&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Tuple&amp;lt;Type1,...,TypeN&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Tuple&amp;lt;Int32,Int32&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tuple&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Структура&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Struct&amp;lt;Name1:Type1,...,NameN:TypeN&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Struct&amp;lt;Name:String,Age:Int32&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;StructSequence&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Поток&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Stream&amp;lt;Type&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Stream&amp;lt;Int32&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;generator&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Вариант над кортежем&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Variant&amp;lt;Type1,Type2&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Variant&amp;lt;Int32,String&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tuple с индексом и объектом&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Вариант над структурой&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Variant&amp;lt;Name1:Type1,Name2:Type2&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Variant&amp;lt;value:Int32,error:String&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tuple с именем поля и объектом&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Контейнеры можно вкладывать друг в друга. Пример: &lt;code&gt;List&amp;lt;Tuple&amp;lt;Int32,Int32&amp;gt;&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"python-container-wrappers\"&gt;&lt;a href=\"ru/user-guide/query-tracker/system-python-udf.html#python-container-wrappers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Особенности передаваемых в функции объектов для списков и словарей&lt;/span&gt;&lt;/a&gt;Особенности передаваемых в функции объектов для списков и словарей&lt;/h3&gt;\n&lt;p&gt;При использовании &lt;code&gt;List&lt;/code&gt; и &lt;code&gt;Dict&lt;/code&gt;, в аргументы функции передаются специальные read-only объекты &lt;code&gt;yql.TList&lt;/code&gt; и &lt;code&gt;yql.TDict&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Их особенности:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Read-only: в них нельзя что-то поменять не скопировав, так как тем же объектом может пользоваться какая-то другая часть текущего запроса, например соседняя функция.&lt;/li&gt;\n&lt;li&gt;Ценой потенциально медленного копирования можно получить из них настоящий объект типа list, проитерировавшись для частичного копирования. Для словарей нужно дополнительно вызвать &lt;code&gt;iteritems()&lt;/code&gt;. Установив значение атрибута &lt;code&gt;_yql_lazy_input&lt;/code&gt; в False на самой функции можно включить автоматическое копирование списков и словарей в list и dict. Данный механизм работает рекурсивно для вложенных контейнеров.&lt;/li&gt;\n&lt;li&gt;Для получения количества элементов можно вызвать &lt;code&gt;len(my_arg)&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Актуальный набор доступных методов можно узнать с помощью вызова &lt;code&gt;dir(my_arg)&lt;/code&gt;. &lt;a href=\"ru/user-guide/query-tracker/system-python-udf.html#tlist-methods\"&gt;Пример&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Методы &lt;code&gt;yql.TList&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;has_fast_len()&lt;/code&gt; — можно ли быстро получить длину. Если вернулось False, то список \"ленивый\".&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;has_items()&lt;/code&gt; — проверка на пустоту.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;reversed()&lt;/code&gt; — получить перевернутую копию списка.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;skip(n)&lt;/code&gt; и &lt;code&gt;take(n)&lt;/code&gt; — аналоги срезов &lt;code&gt;[n:]&lt;/code&gt; и &lt;code&gt;[:n]&lt;/code&gt;, соответственно.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;to_index_dict()&lt;/code&gt; - получить словарь с номерами элементов в качестве ключей, что позволяет осуществлять доступ по индексу.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример с &lt;code&gt;_yql_lazy_input&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$u = SystemPython3_8::list_func(Callable&amp;lt;(List&amp;lt;Int32&amp;gt;)-&amp;gt;Int32&amp;gt;, @@#py\ndef list_func(lst):\n  return lst.count(1)\nlist_func._yql_lazy_input = False\n@@);\nSELECT $u(AsList(1,2,3));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"315\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-315\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-315\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-315.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"environment\"&gt;&lt;a href=\"ru/user-guide/query-tracker/system-python-udf.html#environment\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Изменение окружения&lt;/span&gt;&lt;/a&gt;Изменение окружения&lt;/h2&gt;\n&lt;h3 id=\"vzaimodejstvie-s-python-iz-okruzheniya\"&gt;&lt;a href=\"ru/user-guide/query-tracker/system-python-udf.html#vzaimodejstvie-s-python-iz-okruzheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Взаимодействие с Python из окружения&lt;/span&gt;&lt;/a&gt;Взаимодействие с Python из окружения&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;SystemPython&lt;/code&gt; UDF будет вызываться в отдельной операции в рамках пользовательского скрипта.&lt;/p&gt;\n&lt;p&gt;Взаимодействие с Python происходит через динамическую библиотеку &lt;code&gt;libpython3.N.so&lt;/code&gt;, линковка с которой происходит во время исполнения. Подмена этой библиотеки в окружении приведёт к изменению используемого Python и доступных библиотек.&lt;/p&gt;\n&lt;p&gt;Изменение окружения из YQL операции возможно при помощи прагм &lt;code&gt;yt.DockerImage&lt;/code&gt; и &lt;a href=\"yql/syntax/pragma/yt.html#ytlayerpaths\"&gt;yt.LayerPaths&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Они повлияют на соответствующие параметры пользовательского скрипта, описание которых можно посмотреть в разделе &lt;a href=\"user-guide/data-processing/operations/operations-options.html#user_script_options\"&gt;Настройки операций - Параметры пользовательского скрипта&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Окружение по умолчанию&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;По умолчанию используется дефолтное окружение для джобов, настраиваемое администратором кластера. Оно может не содержать Python требуемой версии.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Пример использования библиотеки tensorflow с помощью &lt;code&gt;pragma yt.DockerImage&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;pragma yt.DockerImage = \"docker.io/tensorflow/tensorflow:2.16.1\";\n\n$script = @@#py\nimport sys\nimport tensorflow\n\ndef foo():\n    return \"Python version: \" + sys.version + \".\\nTensorflow version: \" + tensorflow.__version__\n@@;\n\n$udf = SystemPython3_11::foo(Callable&amp;lt;()-&amp;gt;String&amp;gt;, $script);\nSELECT $udf();\n-- Python version: 3.11.0rc1 (main, Aug 12 2022, 10:02:14) [GCC 11.2.0].\n-- Tensorflow version: 2.16.1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"347\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-347\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-347\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-347.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"osobennosti\"&gt;&lt;a href=\"ru/user-guide/query-tracker/system-python-udf.html#osobennosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Особенности&lt;/span&gt;&lt;/a&gt;Особенности&lt;/h2&gt;\n&lt;p&gt;При использовании UDF стандартный вывод (stdout) используется для служебных целей, поэтому пользоваться им нельзя.&lt;/p&gt;\n&lt;h2 id=\"primery\"&gt;&lt;a href=\"ru/user-guide/query-tracker/system-python-udf.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h2&gt;\n&lt;h3 id=\"hello-world\"&gt;&lt;a href=\"ru/user-guide/query-tracker/system-python-udf.html#hello-world\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hello World&lt;/span&gt;&lt;/a&gt;Hello World&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$script = @@#py\ndef hello(name):\n    return b'Hello, %s!' % name\n@@;\n\n$udf = SystemPython3_8::hello(Callable&amp;lt;(String)-&amp;gt;String&amp;gt;, $script);\n\nSELECT $udf(\"world\"); -- \"Hello, world!\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"360\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-360\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-360\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-360.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"konkatenaciya-stroki-i-chisla\"&gt;&lt;a href=\"ru/user-guide/query-tracker/system-python-udf.html#konkatenaciya-stroki-i-chisla\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конкатенация строки и числа&lt;/span&gt;&lt;/a&gt;Конкатенация строки и числа&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$script = @@#py\ndef concat(a, b):\n    return a.decode(\"utf-8\") + str(b)\n@@;\n$concat = SystemPython3_8::concat(Callable&amp;lt;(String?, Int64?)-&amp;gt;String&amp;gt;, $script);\n\nSELECT $concat(name, age) FROM `//tmp/sample`;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"364\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-364\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-364\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-364.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"tlist-methods\"&gt;&lt;a href=\"ru/user-guide/query-tracker/system-python-udf.html#tlist-methods\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Получение актуального списка методов &lt;/span&gt;&lt;/a&gt;Получение актуального списка методов &lt;code&gt;yql.TList&lt;/code&gt;&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$u = SystemPython3_8::get_dir(Callable&amp;lt;(List&amp;lt;Int32&amp;gt;)-&amp;gt;List&amp;lt;String&amp;gt;&amp;gt;, @@#py\ndef get_dir(lst):\n  return dir(lst)\n@@);\nSELECT $u(AsList());\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"368\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-368\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-368\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-368.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"vyzov-llama\"&gt;&lt;a href=\"ru/user-guide/query-tracker/system-python-udf.html#vyzov-llama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вызов Llama&lt;/span&gt;&lt;/a&gt;Вызов Llama&lt;/h3&gt;\n&lt;p&gt;Необходимо правильное окружение, которое может быть получено с помощью следующего Dockerfile:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs dockerfile\"&gt;&lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ollama/ollama:&lt;span class=\"hljs-number\"&gt;0.3&lt;/span&gt;.&lt;span class=\"hljs-number\"&gt;9&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;RUN&lt;/span&gt;&lt;span class=\"language-bash\"&gt; apt install -y python3.11 libpython3.11 python3-pip&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;RUN&lt;/span&gt;&lt;span class=\"language-bash\"&gt; python3.11 -m pip install ollama&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"375\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-375\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-375\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-375.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Используя указанный образ, можно вызывать Llama из Python:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;pragma yt.DockerImage = \"my.docker.registry/ollama/ollama:0.3.9-with-python3.11-2\";\npragma yt.DefaultMemoryLimit = \"30G\";\npragma yt.OperationSpec = \"{max_failed_job_count=1;mapper={cpu_limit=64}}\";\n\n$script = @@#py\nfrom ollama import Client\nimport subprocess\n\ndef infer_llama(prompt):\n    proc = subprocess.Popen([\"/bin/ollama\", \"serve\"], stdout=subprocess.DEVNULL)\n    client = Client(host='http://localhost:11434')\n    client.pull('llama3.1')\n    response = client.chat(model='llama3.1', messages=[\n        {\n            'role': 'user',\n            'content': str(prompt),\n        },\n    ])\n    proc.kill()\n    return response['message']['content']\n@@;\n$infer_llama = SystemPython3_11::infer_llama(Callable&amp;lt;(String?)-&amp;gt;String&amp;gt;, $script);\n\nselect $infer_llama(\"Why is the sky blue?\");\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"379\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-379\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-379\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-379.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"faq\"&gt;&lt;a href=\"ru/user-guide/query-tracker/system-python-udf.html#faq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FAQ&lt;/span&gt;&lt;/a&gt;FAQ&lt;/h2&gt;\n&lt;h3 id=\"module-is-missing-error\"&gt;&lt;a href=\"ru/user-guide/query-tracker/system-python-udf.html#module-is-missing-error\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Я получаю ошибку  или &lt;/span&gt;&lt;/a&gt;Я получаю ошибку &lt;code&gt;Module not loaded for script type: SystemPython3_8&lt;/code&gt; или &lt;code&gt;Module SystemPython3_8 is not registered&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Это означает, что функциональность не поддержана на кластере. На кластере должны присутствовать QueryTracker и YqlAgents с минимальной версией образа &lt;a href=\"https://github.com/ytsaurus/ytsaurus/releases/tag/docker%2Fquery-tracker%2F0.0.8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YTsaurus QueryTracker 0.0.8&lt;/a&gt;. Попросите администраторов кластера обновить данные компоненты.&lt;/p&gt;\n&lt;h3 id=\"libpython-is-missing-error\"&gt;&lt;a href=\"ru/user-guide/query-tracker/system-python-udf.html#libpython-is-missing-error\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Я получаю ошибку &lt;/span&gt;&lt;/a&gt;Я получаю ошибку &lt;code&gt;libpython3.8.so.1.0: cannot open shared object file: No such file or directory&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Это означает, что в окружении джоба, исполняющего функцию, нет динамической библиотеки &lt;code&gt;libpython3.8.so.1.0&lt;/code&gt;. Необходимо использовать ту версию Python, которая присутствует в окружении джоба. &lt;a href=\"ru/user-guide/query-tracker/system-python-udf.html#environment\"&gt;Подробнее&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Если используется прагма &lt;a href=\"yql/syntax/pragma/yt.html#ytdockerimage\"&gt;yt.DockerImage&lt;/a&gt;, то необходимо убедиться, что кластер поддерживает такой способ изменения окружения. &lt;a href=\"admin-guide/prepare-spec.html#job-environment\"&gt;Подробнее&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"},{"property":"og:title","content":"Python UDF в YQL"},{"property":"og:description","content":"Python UDF позволяет описывать функции на языке Python в самом YQL запросе и использовать их."},{"property":"og:type","content":"article"},{"property":"og:url","content":"https://ytsaurus.tech/docs/ru/user-guide/query-tracker/system-python-udf"},{"property":"article:section","content":"QT"},{"property":"article:tag","content":"UDF"},{"property":"article:tag","content":"Python"},{"property":"article:modified_time","content":"2024-09-13T20:00:00+03:00"},{"property":"article:author","content":"Александр Гаев"}],"vcsPath":"ru/user-guide/query-tracker/system-python-udf.md","sourcePath":"ru/user-guide/query-tracker/system-python-udf.md"},"headings":[{"title":"Введение","href":"ru/user-guide/query-tracker/system-python-udf.html#vvedenie","level":2},{"title":"Python UDF","href":"ru/user-guide/query-tracker/system-python-udf.html#python-udf","level":2},{"title":"Использование","href":"ru/user-guide/query-tracker/system-python-udf.html#ispolzovanie","level":2,"items":[{"title":"Написание Python скрипта","href":"ru/user-guide/query-tracker/system-python-udf.html#napisanie-python-skripta","level":3},{"title":"Объявление имени и сигнатуры функции","href":"ru/user-guide/query-tracker/system-python-udf.html#obuyavlenie-imeni-i-signatury-funkcii","level":3},{"title":"Использование UDF в запросе","href":"ru/user-guide/query-tracker/system-python-udf.html#ispolzovanie-udf-v-zaprose","level":3}]},{"title":"Типы данных","href":"ru/user-guide/query-tracker/system-python-udf.html#tipy-dannyh","level":2,"items":[{"title":"Контейнеры","href":"ru/user-guide/query-tracker/system-python-udf.html#kontejnery","level":3},{"title":"Особенности передаваемых в функции объектов для списков и словарей","href":"ru/user-guide/query-tracker/system-python-udf.html#python-container-wrappers","level":3}]},{"title":"Изменение окружения","href":"ru/user-guide/query-tracker/system-python-udf.html#environment","level":2,"items":[{"title":"Взаимодействие с Python из окружения","href":"ru/user-guide/query-tracker/system-python-udf.html#vzaimodejstvie-s-python
