"&gt;&lt;/path&gt;&lt;path d=\"M 399.21 55.79 L 396.73 63.22 L 395.5 59.5 L 391.78 58.27 Z\" fill=\"rgb(0, 0, 0)\" stroke=\"rgb(0, 0, 0)\" stroke-miterlimit=\"10\"&gt;&lt;/path&gt;&lt;path d=\"M 270 315 L 396.89 88.06\" fill=\"none\" stroke=\"rgb(0, 0, 0)\" stroke-miterlimit=\"10\"&gt;&lt;/path&gt;&lt;path d=\"M 399.45 83.48 L 399.09 91.29 L 396.89 88.06 L 392.98 87.88 Z\" fill=\"rgb(0, 0, 0)\" stroke=\"rgb(0, 0, 0)\" stroke-miterlimit=\"10\"&gt;&lt;/path&gt;&lt;path d=\"M 270 55 L 394.89 147.7\" fill=\"none\" stroke=\"rgb(0, 0, 0)\" stroke-miterlimit=\"10\"&gt;&lt;/path&gt;&lt;path d=\"M 399.1 150.83 L 391.4 149.47 L 394.89 147.7 L 395.57 143.85 Z\" fill=\"rgb(0, 0, 0)\" stroke=\"rgb(0, 0, 0)\" stroke-miterlimit=\"10\"&gt;&lt;/path&gt;&lt;path d=\"M 490 55 L 614.04 101.75\" fill=\"none\" stroke=\"rgb(0, 0, 0)\" stroke-miterlimit=\"10\"&gt;&lt;/path&gt;&lt;path d=\"M 618.95 103.61 L 611.17 104.41 L 614.04 101.75 L 613.64 97.86 Z\" fill=\"rgb(0, 0, 0)\" stroke=\"rgb(0, 0, 0)\" stroke-miterlimit=\"10\"&gt;&lt;/path&gt;&lt;path d=\"M 490 179 L 614.14 126.48\" fill=\"none\" stroke=\"rgb(0, 0, 0)\" stroke-miterlimit=\"10\"&gt;&lt;/path&gt;&lt;path d=\"M 618.97 124.44 L 613.89 130.39 L 614.14 126.48 L 611.16 123.94 Z\" fill=\"rgb(0, 0, 0)\" stroke=\"rgb(0, 0, 0)\" stroke-miterlimit=\"10\"&gt;&lt;/path&gt;&lt;g transform=\"translate(-0.5 -0.5)\"&gt;&lt;switch&gt;&lt;div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display:flex;width:1px;height:1px;padding-top:194px;margin-left:580px\"&gt;&lt;div style=\"box-sizing:border-box;font-size:0px;text-align:center\" data-drawio-colors=\"color: rgb(0, 0, 0); background-color: rgb(255, 255, 255); \"&gt;&lt;div style=\"display:inline-block;font-size:11px;font-family:Helvetica;color:rgb(0, 0, 0);background-color:rgb(255, 255, 255)\"&gt;Requested format,&lt;br /&gt;compressed by network codec&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;text x=\"580\" y=\"197\" fill=\"rgb(0, 0, 0)\" font-family=\"Helvetica\" font-size=\"11px\" text-anchor=\"middle\"&gt;Requested...&lt;/text&gt;&lt;/switch&gt;&lt;/g&gt;&lt;path d=\"M 270 27.5 L 393.63 27.5\" fill=\"none\" stroke=\"rgb(0, 0, 0)\" stroke-miterlimit=\"10\"&gt;&lt;/path&gt;&lt;path d=\"M 398.88 27.5 L 391.88 31 L 393.63 27.5 L 391.88 24 Z\" fill=\"rgb(0, 0, 0)\" stroke=\"rgb(0, 0, 0)\" stroke-miterlimit=\"10\"&gt;&lt;/path&gt;&lt;/g&gt;&lt;switch&gt;&lt;g&gt;&lt;/g&gt;&lt;a transform=\"translate(0,-5)\" xlink:href=\"https://www.diagrams.net/doc/faq/svg-export-text-problems\" target=\"_blank\"&gt;&lt;text text-anchor=\"middle\" font-size=\"10px\" x=\"50%\" y=\"100%\"&gt;Text is not SVG - cannot display&lt;/text&gt;&lt;/a&gt;&lt;/switch&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;h2 id=\"kak-proishodit-chtenie\"&gt;&lt;a href=\"ru/user-guide/problems/slow-read.html#kak-proishodit-chtenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как происходит чтение&lt;/span&gt;&lt;/a&gt;Как происходит чтение&lt;/h2&gt;\n&lt;p&gt;Чанки таблицы лежат на дисках нод в нативном формате, сжатые &lt;code&gt;compression_codec&lt;/code&gt;.&lt;br /&gt;\nОттуда они перемещаются на дата-прокси, где распаковываются, перекодирутся в заказанный пользователем формат (YSON, Protobuf или Skiff), далее как часть HTTP-ответа сжимаются указанным сетевым кодеком и попадают на машину пользователя.&lt;/p&gt;\n&lt;h2 id=\"chto-vliyaet-na-skorost-chteniya\"&gt;&lt;a href=\"ru/user-guide/problems/slow-read.html#chto-vliyaet-na-skorost-chteniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что влияет на скорость чтения&lt;/span&gt;&lt;/a&gt;Что влияет на скорость чтения&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"user-guide/storage/media.html\"&gt;&lt;strong&gt;Медиум&lt;/strong&gt;&lt;/a&gt;. Это вид дисков, на котором хранятся чанки таблицы. Находится в атрибуте &lt;code&gt;@primary_medium&lt;/code&gt;. Скорость SSD, выше, чем HDD, но квота на них более ограничена. Чтобы поменять медиум, нужно сначала завести новую запись в атрибуте &lt;code&gt;@media&lt;/code&gt; таблицы, например, &lt;code&gt;yt set //path/to/table/@media/ssd_blobs '{replication_factor=3}'&lt;/code&gt;, а затем перенести таблицу в новый медиум: &lt;code&gt;yt set //path/to/table/@primary_medium ssd_blobs&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"user-guide/storage/compression.html\"&gt;&lt;strong&gt;Алгоритмы сжатия&lt;/strong&gt;&lt;/a&gt; подразумевают компромисс между скоростью и качеством сжатия. Самый быстрый - &lt;code&gt;lz4&lt;/code&gt;, медленнее и компактнее - от &lt;code&gt;brotli_1&lt;/code&gt; до &lt;code&gt;brotli_11&lt;/code&gt; (больше число - лучше сжатие). Нужно помнить, что есть два алгоритма:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тот, с которым хранится таблица (&lt;code&gt;yt get //path/to/table/@compression_codec&lt;/code&gt;). Для его изменения нужно установить атрибут &lt;code&gt;@compression_codec&lt;/code&gt; и пережать все чанки таблицы (смотрите &lt;a href=\"user-guide/storage/compression.html#set_compression\"&gt;команды&lt;/a&gt;).&lt;/li&gt;\n&lt;li&gt;Тот, который используется при пересылке по сети. Он зависит от используемого клиента.\n&lt;ul&gt;\n&lt;li&gt;В C++ API нужно выставлять опцию глобальной конфигурации &lt;code&gt;TConfig::Get()-&amp;gt;AcceptEncoding&lt;/code&gt;. Название алгоритмов из &lt;a href=\"user-guide/storage/compression.html#compression_codecs\"&gt;раздела&lt;/a&gt; нужно префиксировать &lt;code&gt;\"z-\"&lt;/code&gt;, например, &lt;code&gt;\"z-snappy\"&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;В Python API нужно выставить опцию &lt;code&gt;yt.wrapper.config[\"proxy\"][\"accept_encoding\"]&lt;/code&gt;. Поддерживаются алгоритмы &lt;code&gt;gzip&lt;/code&gt;, &lt;code&gt;br&lt;/code&gt; (brotli) и &lt;code&gt;identity&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Параллельность&lt;/strong&gt;. Если вы достигли ограничения на скорость чтения с дисков или форматы/компрессию на нодах, то может помочь параллельное чтение.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;В Python API используйте секцию конфига &lt;code&gt;yt.wrapper.config[\"read_parallel\"]&lt;/code&gt;, там есть &lt;code&gt;\"enable\"&lt;/code&gt;, &lt;code&gt;\"data_size_per_thread\"&lt;/code&gt; и &lt;code&gt;\"max_thread_count\"&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;В C++ API нужно использовать функцию &lt;code&gt;CreateParallelTableReader&lt;/code&gt; из особой &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/library/parallel_io\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;библиотеки&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Сеть&lt;/strong&gt;. Если данные лежат в одном дата-центре, а чтение производится из другого, то можно упереться в пропускную способность сети.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"user-guide/storage/formats.html\"&gt;&lt;strong&gt;Формат&lt;/strong&gt;&lt;/a&gt; Самый быстрый - skiff, далее идёт Protobuf, затем YSON.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Нагрузка на дата-прокси&lt;/strong&gt;. Прокси разделены на группы (роли), по умолчанию все ходят через прокси с ролью &lt;code&gt;data&lt;/code&gt;, поэтому такие прокси нагружены сильнее.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Работы на кластере&lt;/strong&gt;. При обновлении узлов кластера, например, диски могут быть загружены сильнее.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"s-chego-nachat\"&gt;&lt;a href=\"ru/user-guide/problems/slow-read.html#s-chego-nachat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;С чего начать?&lt;/span&gt;&lt;/a&gt;С чего начать?&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Увеличьте параллельность (смотрите выше). Это может решить большинство проблем с чтением. Если это не помогло или недостаточно помогло, нужна дальнейшая диагностика.&lt;/li&gt;\n&lt;li&gt;Посмотрите в &lt;a href=\"https://en.wikipedia.org/wiki/Perf_(Linux)\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;профилировщике&lt;/a&gt; или в &lt;a href=\"https://ru.wikipedia.org/wiki/Top\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;top-е&lt;/a&gt; загрузку по CPU. Если видна деятельность, связанная с чтением, возможные причины:\n&lt;ul&gt;\n&lt;li&gt;HTTP-кодек. Например, Python API по умолчанию использует gzip, который может оказаться узким местом из-за скорости сжатия. В последнем случае в top-е может быть видно высокую загрузку CPU процессом python. Можно попробовать заменить на &lt;code&gt;identity&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Формат. Например, парсинг YSON и раскладывание его по объектам в памяти.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Попробуйте для эксперимента переложить часть данных на SSD (смотрите выше) и читать оттуда. Это позволит понять, упираетесь ли вы ограничение дисков нодов.&lt;/li&gt;\n&lt;li&gt;Если перечисленные шаги не помогли увеличить скорость, обратитесь к администратору системы. Если проблема связана с ограничением возможностей системы, напишите на рассылку  YTsaurus  с описанием того, что вы предприняли, какие результаты получили и какие ожидали бы получить.&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/problems/slow-read.md","sourcePath":"ru/user-guide/problems/slow-read.md"},"headings":[{"title":"Как происходит чтение","href":"ru/user-guide/problems/slow-read.html#kak-proishodit-chtenie","level":2},{"title":"Что влияет на скорость чтения","href":"ru/user-guide/problems/slow-read.html#chto-vliyaet-na-skorost-chteniya","level":2},{"title":"С чего начать?","href":"ru/user-guide/problems/slow-read.html#s-chego-nachat","level":2}],"title":"Медленное чтение таблиц и файлов"},"router":{"pathname":"ru/user-guide/problems/slow-read","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
