        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"lokalnaya-emulyaciya-zapuska-dzhoba\"&gt;&lt;a href=\"ru/user-guide/problems/mapreduce-debug.html#lokalnaya-emulyaciya-zapuska-dzhoba\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Локальная эмуляция запуска джоба&lt;/span&gt;&lt;/a&gt;Локальная эмуляция запуска джоба&lt;/h2&gt;\n&lt;p&gt;Вы можете эмулировать запуск джоба на любом компьютере, например на разработческом сервере. Подробнее о локальной эмуляции джоба см. в разделах &lt;a href=\"../user-guide/problems/jobtool.html\"&gt;Утилита для локальной отладки джобов&lt;/a&gt; и &lt;a href=\"../user-guide/problems/jobshell-and-slowjobs.html\"&gt;Диагностика медленных джобов&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"poluchenie-tekushego-stderr-vypolnyayushegosya-dzhoba\"&gt;&lt;a href=\"ru/user-guide/problems/mapreduce-debug.html#poluchenie-tekushego-stderr-vypolnyayushegosya-dzhoba\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Получение текущего stderr выполняющегося джоба&lt;/span&gt;&lt;/a&gt;Получение текущего stderr выполняющегося джоба&lt;/h2&gt;\n&lt;p&gt;В ходе выполнения операции может получиться, что завершились все джобы, кроме одного. В системе YTsaurus можно получить stderr, который джоб написал к текущему моменту.&lt;/p&gt;\n&lt;p&gt;В команде &lt;code&gt;yt&lt;/code&gt; для этого реализован режим &lt;code&gt;yt get-job-stderr&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt get-job-stderr --operation-id 35060d89-f9328e09-3f403e8-6f4eb4b5 --job-id fe270b54-a938652-3fc0384-2144\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"15\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-15\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-15\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-15.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Stderr в выводе обрезается по тем же правилам, как для сохранения в файлах в Кипарисе: несколько первых мегабайт плюс несколько последних мегабайт.&lt;/p&gt;\n&lt;h2 id=\"poluchenie-polnyh-stderr-vseh-dzhobov-operacii\"&gt;&lt;a href=\"ru/user-guide/problems/mapreduce-debug.html#poluchenie-polnyh-stderr-vseh-dzhobov-operacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Получение полных stderr всех джобов операции&lt;/span&gt;&lt;/a&gt;Получение полных stderr всех джобов операции&lt;/h2&gt;\n&lt;p&gt;В системе YTsaurus существует возможность сохранить полные stderr всех джобов в таблицу. Можно выгрузить stderr тех джобов, которые не были прерваны (aborted).&lt;/p&gt;\n&lt;p&gt;Для включения описанного поведения:&lt;/p&gt;\n&lt;div class=\"yfm-tabs\" data-diplodoc-group=\"defaultTabsGroup-a4s5a4x6\" data-diplodoc-variant=\"regular\"&gt;\n&lt;div class=\"yfm-tab-list\" role=\"tablist\"&gt;\n&lt;div data-diplodoc-id=\"вpython\" data-diplodoc-key=\"%d0%92%c2%a0python\" class=\"yfm-tab yfm-tab-group active\" role=\"tab\" tabindex=\"0\" data-diplodoc-is-active=\"true\"&gt;В Python&lt;/div&gt;\n&lt;div data-diplodoc-id=\"вс\" data-diplodoc-key=\"%d0%92%c2%a0%d0%a1%2b%2b\" class=\"yfm-tab yfm-tab-group\" role=\"tab\" tabindex=\"-1\" data-diplodoc-is-active=\"false\"&gt;В С++&lt;/div&gt;\n&lt;div data-diplodoc-id=\"вsdk-надругих-языках\" data-diplodoc-key=\"%d0%92%c2%a0sdk%20%d0%bd%d0%b0%c2%a0%d0%b4%d1%80%d1%83%d0%b3%d0%b8%d1%85%20%d1%8f%d0%b7%d1%8b%d0%ba%d0%b0%d1%85\" class=\"yfm-tab yfm-tab-group\" role=\"tab\" tabindex=\"-1\" data-diplodoc-is-active=\"false\"&gt;В SDK на других языках&lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"dygshd4v\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"В Python\"&gt;\n&lt;p&gt;Используйте параметр &lt;code&gt;stderr_table&lt;/code&gt;. Например:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.wrapper.run_map_reduce( mapper, reducer, &lt;span class=\"hljs-string\"&gt;'//path/to/input'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'//path/to/output'&lt;/span&gt;, reduce_by=[&lt;span class=\"hljs-string\"&gt;'some_key'&lt;/span&gt;], stderr_table=&lt;span class=\"hljs-string\"&gt;'//path/to/stderr/table'&lt;/span&gt;, )\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"44\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-44\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-44\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-44.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"2rd2vx5g\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"В С++\"&gt;\n&lt;p&gt;Используйте настройку &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/07c9c385ae116f56d8ecce9fa6765fa1a90e95cc/yt/cpp/mapreduce/interface/operation.h#L563\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;StderrTablePath&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;\n&lt;div id=\"debcg8hj\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"В SDK на других языках\"&gt;\n&lt;p&gt;Можно передать настройку &lt;code&gt;stderr_table_path&lt;/code&gt; напрямую в спецификацию операции. Описание данной опции см. в разделе &lt;a href=\"ru/user-guide/data-processing/operations/operations-options.html\"&gt;Настройки операций&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;p&gt;Stderr-таблица имеет следующие колонки:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;job_id&lt;/code&gt; — id джоба.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;part_index&lt;/code&gt; — если stderr одного джоба большой, он разбивается на части. Значение &lt;code&gt;part_index&lt;/code&gt; указывает на номер конкретной части stderr.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;data&lt;/code&gt; — непосредственно сами данные stderr.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Таблица отсортирована по &lt;code&gt;job_id&lt;/code&gt;, &lt;code&gt;part_index&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Прочитать такую таблицу можно с помощью команды &lt;a href=\"../user-guide/storage/blobtables.html#read_blob_table\"&gt;read_blob_table&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"style":["_assets/tabs-extension.css"],"script":["_assets/tabs-extension.js"],"vcsPath":"ru/user-guide/problems/mapreduce-debug.md","sourcePath":"ru/user-guide/problems/mapreduce-debug.md"},"headings":[{"title":"Локальная эмуляция запуска джоба","href":"ru/user-guide/problems/mapreduce-debug.html#lokalnaya-emulyaciya-zapuska-dzhoba","level":2},{"title":"Получение текущего stderr выполняющегося джоба","href":"ru/user-guide/problems/mapreduce-debug.html#poluchenie-tekushego-stderr-vypolnyayushegosya-dzhoba","level":2},{"title":"Получение полных stderr всех джобов операции","href":"ru/user-guide/problems/mapreduce-debug.html#poluchenie-polnyh-stderr-vseh-dzhobov-operacii","level":2}],"title":"Отладка MapReduce программ"},"router":{"pathname":"ru/user-guide/problems/mapreduce-debug","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
