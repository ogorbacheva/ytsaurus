        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе приведено описание диагностики медленных джобов с использованием инструмента &lt;code&gt;Job Shell&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Время от времени может случаться так, что один или несколько джобов операции выполняются долго и без видимого прогресса. Чтобы разобраться в причине, можно воспользоваться инструментом &lt;code&gt;Job Shell&lt;/code&gt;. С помощью данного инструмента можно открыть консоль непосредственно в окружении джоба от имени того же пользователя, от которого выполняется джоб. После этого можно исследовать работу джоба с помощью вызовов &lt;strong&gt;gdb&lt;/strong&gt; или &lt;strong&gt;strace&lt;/strong&gt;.&lt;/p&gt;\n&lt;h2 id=\"zapusk-job-shell\"&gt;&lt;a href=\"ru/user-guide/problems/jobshell-and-slowjobs.html#zapusk-job-shell\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск Job Shell&lt;/span&gt;&lt;/a&gt;Запуск Job Shell&lt;/h2&gt;\n&lt;p&gt;Для запуска Job Shell необходимо выполнить команду &lt;code&gt;yt --proxy &amp;lt;cluster name&amp;gt; run-job-shell &amp;lt;job id&amp;gt;&lt;/code&gt;, подставив вместо &lt;code&gt;&amp;lt;...&amp;gt;&lt;/code&gt; имя кластера и идентификатор джоба. Идентификатор джоба можно узнать на странице операции, на вкладке &lt;strong&gt;Jobs&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Подробное описание запуска Job Shell:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt --proxy cluster-name run-job-shell fcebe6b9-e06ab2e1-3fe0384-d0b66453\nUse ^F to terminate shell.\n\nJob environment:\nTMPDIR=/yt/disk2/cluster-data/slots/11/sandbox\nPYTHONPATH=/yt/disk2/cluster-data/slots/11/sandbox\nPYTHONUSERBASE=/yt/disk2/cluster-data/slots/11/sandbox/.python-site-packages\nPYTHON_EGG_CACHE=/yt/disk2/cluster-data/slots/11/sandbox/.python-eggs\nHOME=/yt/disk2/cluster-data/slots/11/sandbox\nYT_OPERATION_ID=78b048b5-8055fabe-3fe03e8-d5b74b2a\nYT_JOB_INDEX=120\nYT_JOB_ID=fcebe6b9-e06ab2e1-3fe0384-d0b66453\nYT_START_ROW_INDEX=202133578\n\nUID          PID    PPID  C STIME TTY          TIME CMD\n19911     257386  239675  0 02:24 pts/1    00:00:00 /bin/bash\n19911     257397  257386  0 02:24 pts/1    00:00:00  \\_ ps -fu 19911 --forest\n19911     240043  239675  0 02:21 ?        00:00:00 /bin/bash -c :; ./my_mapper\n19911     240073  240043 91 02:21 ?        00:02:37  \\_ ./my_mapper\n\nyt_slot_11@n1757-sas:~$\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"15\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-15\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-15\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-15.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В выводе команды отображена различная информация о джобе:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;путь к рабочей директории джоба — /yt/disk2/cluster-data/slots/11/sandbox;&lt;/li&gt;\n&lt;li&gt;имя пользователя, от которого запущен джоб — yt_slot_11;&lt;/li&gt;\n&lt;li&gt;список процессов, которые выполняются от имени текущего пользователя.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Первый и второй процессы из приведённого примера относятся к Job Shell, третий процесс — сессия командной оболочки bash, в которой запускается исследуемый джоб, четвёртый — это непосредственно пользовательский процесс.&lt;/p&gt;\n&lt;h2 id=\"analiz-polzovatelskogo-processa\"&gt;&lt;a href=\"ru/user-guide/problems/jobshell-and-slowjobs.html#analiz-polzovatelskogo-processa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ пользовательского процесса&lt;/span&gt;&lt;/a&gt;Анализ пользовательского процесса&lt;/h2&gt;\n&lt;p&gt;В первую очередь следует запустить команду &lt;code&gt;top -p &amp;lt;PID&amp;gt;&lt;/code&gt;, указав в качестве аргумента идентификатор пользовательского процесса. Ниже приведен пример и результат вызова:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt_slot_11@n1757-sas:~$ top -p 240073\ntop - 02:30:52 up 6 days,  7:11,  0 &lt;span class=\"hljs-built_in\"&gt;users&lt;/span&gt;,  load average: 41.26, 37.59, 39.23\nTasks:   1 total,   1 running,   0 sleeping,   0 stopped,   0 zombie\nCpu(s): 48.9%us,  5.6%sy,  0.0%ni, 31.1%&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;, 14.3%wa,  0.0%hi,  0.2%si,  0.0%st\nMem:  132001796k total, 130937776k used,  1064020k free,   296488k buffers\nSwap:        0k total,        0k used,        0k free, 107424768k cached\n\n    PID USER      PR  NI  VIRT  RES  SHR S %CPU %MEM    TIME+  COMMAND\n 240073 yt_slot_  20   0  4164  632  552 R   98  0.0   8:08.05 my_mapper\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"45\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-45\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-45\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-45.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;По использованию CPU (48.9%) в приведенном примере видно, что пользовательский процесс выполняет вычисления и, вероятно, причина медленной работы джоба в пользовательском коде. Следует подключиться к процессу джоба с помощью &lt;strong&gt;gdb&lt;/strong&gt; и попытаться понять, что он в данный момент делает.&lt;/p&gt;\n&lt;p&gt;Если потребление CPU близко к нулю, то это скорее всего означает, что процесс завис на системном вызове. Стоит вызвать &lt;strong&gt;strace&lt;/strong&gt; на пользовательский процесс.&lt;br /&gt;\nПример вызова:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt_slot_11@n1757-sas:~$ strace -p 240073\nProcess 240073 attached - interrupt to quit\nwrite(4\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"52\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-52\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-52\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-52.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если процесс постоянно производит системные вызовы (а не висит на каком-то одном), то будьте готовы, что указанная выше команда выдаст на консоль сразу поток информации. В такой ситуации может быть полезен вариант &lt;code&gt;strace -p &amp;lt;PID&amp;gt; 2&amp;gt;&amp;amp;1 | head&lt;/code&gt;, позволяющий увидеть лишь один вызов.&lt;/p&gt;\n&lt;p&gt;Также если ваш код многопоточный, то может быть полезно добавить опцию &lt;code&gt;-f&lt;/code&gt;, позволяющую перехватывать системные вызовы изо всех потоков.&lt;/p&gt;\n&lt;p&gt;Если процесс завис на системном вызове read или &lt;strong&gt;write&lt;/strong&gt;, стоит обратить внимание на значение первого аргумента, который обозначает файловый дескриптор потока. Нулевое значение аргумента для системного вызова &lt;strong&gt;read&lt;/strong&gt; и небольшое целое число для системного вызова &lt;strong&gt;write&lt;/strong&gt; (1, 4, 7), означает, что по каким-то причинам служебный процесс YTsaurus Job Proxy не отдаёт или не принимает очередную порцию данных в направлении к пользовательскому процессу или от него. В таком случае следует сообщить о проблеме администратору системы, приложив детали о проведенной вами диагностике. Подробнее о проведении диагностики можно прочитать в разделе &lt;a href=\"user-guide/problems/howtoreport.html\"&gt;How To Report&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;В случае зависаний на системных вызовах &lt;strong&gt;futex&lt;/strong&gt;, &lt;strong&gt;connect&lt;/strong&gt;, &lt;strong&gt;open&lt;/strong&gt;, &lt;strong&gt;stat&lt;/strong&gt; и др. причина не связана с работой  &lt;code&gt;Job Proxy&lt;/code&gt; и системы YTsaurus в целом. Проблему необходимо искать в пользовательском коде. Стоит воспользоваться &lt;strong&gt;gdb&lt;/strong&gt;, чтобы понять чем вызвана блокировка. Например, если пользовательский код многопоточный и в нём по каким-то причинам возникает блокировка, то вывод &lt;strong&gt;strace&lt;/strong&gt; может выглядеть так:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt_slot_11@n1757-sas:~$ strace -p 240073 2&amp;gt;&amp;amp;1 | &lt;span class=\"hljs-built_in\"&gt;head&lt;/span&gt;\nProcess 240073 attached - interrupt to quit\nfutex(0x7ffff79b3e00, FUTEX_WAIT, 2, NULL\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"65\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-65\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-65\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-65.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Возможна ситуация, когда пользовательский процесс не потребляет CPU, а &lt;strong&gt;strace&lt;/strong&gt; не показывает никаких системных вызовов. Часто это означает, что код использует &lt;strong&gt;memory mapping&lt;/strong&gt; и производит чтение (или запись) из файла, находящегося на диске. При этом происходит &lt;strong&gt;major page fault&lt;/strong&gt; и процесс ожидает, пока операционная система загрузит данные с диска в память.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование &lt;strong&gt;memory mapping&lt;/strong&gt; в джобах &lt;strong&gt;категорически не рекомендуется&lt;/strong&gt;, а джобы, совершающие такие действия, сильно нагружают диски случайными чтениями и записями. Такие джобы также можно распознать по высоким значениям &lt;a href=\"user-guide/problems/jobstatistics.html\"&gt;статистик&lt;/a&gt; &lt;code&gt;/user_job/block_io/[io_read,io_write]&lt;/code&gt;. Помните, что обычный жесткий диск способен совершить не более 100 операций со случайным доступом в секунду, в то время как на узле кластера одновременно работают несколько десятков джобов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Частным случаем большого &lt;strong&gt;memory mapped&lt;/strong&gt; файла, читаемого в джобах, является исполняемый файл операции и его зависимости, загружаемые динамическим линковщиком во время запуска операции. Код загрузчика написан так, что возникающие при этом &lt;strong&gt;page faults&lt;/strong&gt; обычно не составляют проблемы. Стоит помнить, что уменьшение размеров исполняемого файла и его зависимостей всегда положительно сказывается на производительности. В частности, с точки зрения производительности лучше использовать исполняемые файлы без отладочных символов.&lt;/p&gt;\n&lt;h2 id=\"imenovannye-job-shells\"&gt;&lt;a href=\"ru/user-guide/problems/jobshell-and-slowjobs.html#imenovannye-job-shells\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Именованные Job Shells&lt;/span&gt;&lt;/a&gt;Именованные Job Shells&lt;/h2&gt;\n&lt;p&gt;Иногда пользовательские процессы могут создавать внутри джобов свои подконтейнеры.&lt;/p&gt;\n&lt;p&gt;Чтобы иметь возможность подключаться и отлаживать джобы во вложенных контейнерах, в YT есть специальные именованные Job Shells. Их можно указать в спеке операции с привязкой к конкретному контейнеру.&lt;/p&gt;\n&lt;p&gt;Для этого в спеке операции можно указать &lt;code&gt;job_shells&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;spec = {\n    \"job_shells\" = [\n        {\n            \"name\" = \"inner\";\n            \"subcontainer\" = \"/N\";\n            \"owners\" = [\"user1\", \"user2\", \"admin\"];\n        };\n        {\n            \"name\" = \"default\";\n            \"subcontainer\" = \"\";\n            \"owners\" = [\"admin\"];\n        };\n    ];\n};\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"94\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-94\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-94\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-94.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Использование именованных Job Shells практически ничем не отличается от обычных. Если нужно подключиться к конкретному Job Shell, нужно указать параметр &lt;code&gt;--shell-name&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt --proxy cluster-name run-job-shell fcebe6b9-e06ab2e1-3fe0384-d0b66453 --shell-name N\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"98\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-98\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-98\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-98.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;По умолчанию запускается Job Shell с именем &lt;code&gt;default&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"prava-na-zapusk-job-shell\"&gt;&lt;a href=\"ru/user-guide/problems/jobshell-and-slowjobs.html#prava-na-zapusk-job-shell\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Права на запуск Job Shell&lt;/span&gt;&lt;/a&gt;Права на запуск Job Shell&lt;/h2&gt;\n&lt;p&gt;Для запуска Job Shell нужно иметь права на чтение (&lt;strong&gt;read&lt;/strong&gt;) и управление (&lt;strong&gt;manage&lt;/strong&gt;) операцией.&lt;/p&gt;\n&lt;p&gt;Для этого при запуске операции в спецификации нужно указывать &lt;a href=\"user-guide/storage/access-control.html\"&gt;ACL&lt;/a&gt;, описывающий пользователей и группы, которые могут выполнять действия над операцией и джобами.&lt;br /&gt;\nПо умолчанию список ACL пустой, права на операцию выдаются только пользователю, запустившему операцию, а также администраторам системы YTsaurus.&lt;/p&gt;\n&lt;p&gt;Пример настройки ACL в Python:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;spec={&lt;span class=\"hljs-string\"&gt;\"acl\"&lt;/span&gt;: [{&lt;span class=\"hljs-string\"&gt;\"permissions\"&lt;/span&gt;: [&lt;span class=\"hljs-string\"&gt;\"read\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"manage\"&lt;/span&gt;], &lt;span class=\"hljs-string\"&gt;\"subjects\"&lt;/span&gt;: [&lt;span class=\"hljs-string\"&gt;\"user1\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"user2\"&lt;/span&gt;], &lt;span class=\"hljs-string\"&gt;\"action\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"allow\"&lt;/span&gt;}]}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"114\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-114\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-114\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-114.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Пользователь из переменных окружения YT_TOKEN/YT_TOKEN_PATH (authenticated_user) добавляется автоматически.&lt;/p&gt;\n&lt;p&gt;Для изменения прав доступа к уже работающей операции нужно использовать команду &lt;code&gt;update_operation_parameters&lt;/code&gt; с новым ACL.&lt;/p&gt;\n&lt;p&gt;Чтобы иметь доступ до именованных Job Shells, нужно также указать им правильные настройки &lt;code&gt;owners&lt;/code&gt;. &lt;code&gt;owners&lt;/code&gt; – это упрощенная версия &lt;code&gt;acl&lt;/code&gt;, который представляет собой список субъектов (пользователей или групп), которым будет разрешен доступ до Job Shell.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;\"owners\" = [\"user1\", \"user2\"];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"124\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-124\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-124\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-124.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если вам захочется поменять &lt;code&gt;owners&lt;/code&gt; какого-то Job Shell уже запущенной операции, можно воспользоваться командой &lt;a href=\"api/commands.html#update_operation_parameters--update_operation_parameters\"&gt;update_operation_parameters&lt;/a&gt;, указав новый список &lt;code&gt;owners&lt;/code&gt; конкретного Job Shell:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;PARAMETERS {\"operation_id\" = \"&amp;lt;op-id&amp;gt;\"; \"parameters\" = {\"options_per_job_shell\" = {\"shell_name\": {\"owners\": [\"user3\"]}}}}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"128\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-128\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-128\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-128.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/problems/jobshell-and-slowjobs.md","sourcePath":"ru/user-guide/problems/jobshell-and-slowjobs.md"},"headings":[{"title":"Запуск Job Shell","href":"ru/user-guide/problems/jobshell-and-slowjobs.html#zapusk-job-shell","level":2},{"title":"Анализ пользовательского процесса","href":"ru/user-guide/problems/jobshell-and-slowjobs.html#analiz-polzovatelskogo-processa","level":2},{"title":"Именованные Job Shells","href":"ru/user-guide/problems/jobshell-and-slowjobs.html#imenovannye-job-shells","level":2},{"title":"Права на запуск Job Shell","href":"ru/user-guide/problems/jobshell-and-slowjobs.html#prava-na-zapusk-job-shell","level":2}],"title":"Диагностика медленных джобов"},"router":{"pathname":"ru/user-guide/problems/jobshell-and-slowjobs","depth":4,"b
