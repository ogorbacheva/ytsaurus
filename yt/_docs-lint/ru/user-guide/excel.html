            {"data":{"leading":false,"html":"&lt;p&gt;Веб-интерфейс YTsaurus позволяет загружать небольшие Microsoft Excel таблицы в статические таблицы YTsaurus, а также выгружать данные статических таблиц со строгой схемой в виде таблиц Microsoft Excel.&lt;/p&gt;\n&lt;h2 id=\"zagruzka-v-novuyu-tablicu\"&gt;&lt;a href=\"ru/user-guide/excel.html#zagruzka-v-novuyu-tablicu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Загрузка в новую таблицу&lt;/span&gt;&lt;/a&gt;Загрузка в новую таблицу&lt;/h2&gt;\n&lt;p&gt;Чтобы загрузить данные с одновременным созданием YTsaurus таблицы, следует нажать кнопку &lt;strong&gt;Create object&lt;/strong&gt; на странице директории. Из выпадающего меню выбрать &lt;strong&gt;Upload xlsx&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/excel_upload_create.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;p&gt;В меню загрузки важно установить правильные значения переключателей &lt;strong&gt;Column names&lt;/strong&gt; и &lt;strong&gt;Types&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Включенный &lt;strong&gt;Column names&lt;/strong&gt; соответствует наличию имён колонок в первой строке Excel таблицы. Если в таблице нет заголовка, в качестве имён колонок YTsaurus таблицы будут использоваться имена колонок из Excel: A, B, C и т. д.&lt;/p&gt;\n&lt;p&gt;Включенный &lt;strong&gt;Types&lt;/strong&gt; соответствует наличию строки с типами. Строка с типами должна идти за строкой с именами колонок (при её наличии). Типы задаются в формате &lt;code&gt;type&lt;/code&gt; (смотрите &lt;a href=\"ru/user-guide/excel.html#type-mapping\"&gt;соответствие типов&lt;/a&gt;).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Если типы не заданы, для всех колонок будет использоваться &lt;code&gt;any&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"images/excel_upload.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;h2 id=\"zagruzka-v-sushestvuyushuyu-tablicu\"&gt;&lt;a href=\"ru/user-guide/excel.html#zagruzka-v-sushestvuyushuyu-tablicu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Загрузка в существующую таблицу&lt;/span&gt;&lt;/a&gt;Загрузка в существующую таблицу&lt;/h2&gt;\n&lt;p&gt;Чтобы загрузить данные в существующую YTsaurus таблицу, следует нажать кнопку &lt;strong&gt;Upload&lt;/strong&gt; на странице таблицы.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/excel_upload_existing.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Колонки из схемы YTsaurus таблицы должны обязательно присутствовать в Excel таблице. Дополнительные колонки Excel таблицы будут проигнорированы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В меню загрузки с помощью переключателя &lt;strong&gt;Append&lt;/strong&gt; можно выбрать режим загрузки. Включенное значение соответствует дописыванию строк в конец YTsaurus таблицы, выключенное — перезаписыванию таблицы.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/excel_upload_append.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-zagruzki\"&gt;&lt;a href=\"ru/user-guide/excel.html#ogranicheniya-zagruzki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения загрузки&lt;/span&gt;&lt;/a&gt;Ограничения загрузки&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Загружается только первый лист Excel таблицы;&lt;/li&gt;\n&lt;li&gt;Максимальное число строк — &lt;code&gt;1048576&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Максимальное число столбцов — &lt;code&gt;16384&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Максимальный размер входного файла — 50 Mb.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"skachivanie\"&gt;&lt;a href=\"ru/user-guide/excel.html#skachivanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Скачивание&lt;/span&gt;&lt;/a&gt;Скачивание&lt;/h2&gt;\n&lt;p&gt;Интерфейс позволяет указать интересующее подмножество строк и колонок.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/excel_download.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;p&gt;В первой строке результата будут названия колонок, во второй — их типы.&lt;/p&gt;\n&lt;h3 id=\"ogranicheniya\"&gt;&lt;a href=\"ru/user-guide/excel.html#ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения&lt;/span&gt;&lt;/a&gt;Ограничения&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;Статические таблицы со строгой схемой;&lt;/li&gt;\n&lt;li&gt;Максимальное число строк — &lt;code&gt;1048574&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Максимальное число колонок — &lt;code&gt;16384&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Максимальный размер выходного файла — 50 Mb;&lt;/li&gt;\n&lt;li&gt;Максимальная длина строки в ячейке — &lt;code&gt;32767&lt;/code&gt;; строки длиннее &lt;code&gt;32767&lt;/code&gt; обрезаются.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"type-mapping\"&gt;&lt;a href=\"ru/user-guide/excel.html#type-mapping\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Соответствие типов&lt;/span&gt;&lt;/a&gt;Соответствие типов&lt;/h3&gt;\n&lt;p&gt;В Microsoft Excel поддерживается &lt;a href=\"http://johnatten.com/2011/10/03/microsoft-excel-basics-part-ii-data-types-in-excel/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;4 типа данных&lt;/a&gt;: &lt;code&gt;Logical&lt;/code&gt;, &lt;code&gt;Number&lt;/code&gt;, &lt;code&gt;Text&lt;/code&gt;, &lt;code&gt;Error&lt;/code&gt;.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Описание типа данных YTsaurus&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Представление в &lt;code&gt;type&lt;/code&gt;&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Представление в &lt;code&gt;type_v3&lt;/code&gt;&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Представление в Excel&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Целое число в диапазоне &lt;code&gt;[-2^63, 2^63-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/user-guide/excel.html#number*\"&gt;Number*&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Целое число в диапазоне &lt;code&gt;[-2^31, 2^31-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int32&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int32&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Number&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Целое число в диапазоне &lt;code&gt;[-2^15, 2^15-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int16&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int16&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Number&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Целое число в диапазоне &lt;code&gt;[-2^7, 2^7-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Number&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Целое число в диапазоне &lt;code&gt;[0, 2^64-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/user-guide/excel.html#number*\"&gt;Number*&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Целое число в диапазоне &lt;code&gt;[0, 2^32-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint32&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint32&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Number&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Целое число в диапазоне &lt;code&gt;[0, 2^16-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint16&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint16&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Number&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Целое число в диапазоне &lt;code&gt;[0, 2^8-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Number&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Вещественное 4-байтное число&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;float&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;float&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/user-guide/excel.html#number*\"&gt;Number*&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Вещественное 8-байтное число&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;double&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;double&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/user-guide/excel.html#number*\"&gt;Number*&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Стандартный булев тип &lt;code&gt;true/false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;boolean&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt; (отличие от &lt;code&gt;type&lt;/code&gt;)&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Logical&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Произвольная последовательность байт&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/user-guide/excel.html#text*\"&gt;Text*&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Корректная UTF-8 последовательность&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;utf8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;utf8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/user-guide/excel.html#text*\"&gt;Text*&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Целое число в диапазоне &lt;code&gt;[0, 49673 - 1]&lt;/code&gt;,&lt;br /&gt; выражает число дней, прошедших с unix-эпохи;&lt;br /&gt; выражаемый диапазон дат: &lt;code&gt;[1970-01-01, 2105-12-31]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;date&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;date&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/user-guide/excel.html#number**\"&gt;Number**&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Целое число в диапазоне &lt;code&gt;[0, 49673 * 86400 - 1]&lt;/code&gt;,&lt;br /&gt; выражает число секунд, прошедших с unix-эпохи;&lt;br /&gt; выражаемый диапазон времен:&lt;br /&gt;&lt;code&gt;[1970-01-01T00:00:00Z, 2105-12-31T23:59:59Z]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;datetime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;datetime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/user-guide/excel.html#number**\"&gt;Number**&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Целое число в диапазоне &lt;code&gt;[0, 49673 * 86400 * 10^6 - 1]&lt;/code&gt;,&lt;br /&gt; выражает число микросекунд, прошедших с unix-эпохи;&lt;br /&gt; выражаемый диапазон времен:&lt;br /&gt;&lt;code&gt;[1970-01-01T00:00:00Z, 2105-12-31T23:59:59.999999Z]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;timestamp&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;timestamp&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/user-guide/excel.html#number***\"&gt;Number***&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Целое число в диапазоне&lt;br /&gt;&lt;code&gt;[-49673 * 86400 * 10^6 + 1, 49673 * 86400 * 10^6 - 1]&lt;/code&gt;,&lt;br /&gt; выражает число микросекунд между двумя таймстемпами&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;interval&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;interval&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/user-guide/excel.html#number*\"&gt;Number*&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Произвольная YSON-структура,&lt;br /&gt; физически представляется последовательностью байт,&lt;br /&gt; не может иметь атрибут &lt;code&gt;required=%true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;any&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;yson&lt;/code&gt; (отличие от &lt;code&gt;type&lt;/code&gt;)&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/user-guide/excel.html#text**\"&gt;Text**&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"number*\"&gt;&lt;a href=\"ru/user-guide/excel.html#number*\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Number*&lt;/span&gt;&lt;/a&gt;Number*&lt;/h4&gt;\n&lt;p&gt;&lt;code&gt;Number&lt;/code&gt; — это Double-Precision Floating Point value.&lt;/p&gt;\n&lt;p&gt;В числе может быть только &lt;a href=\"https://stackoverflow.com/questions/38522197/converting-the-text-data-to-a-int64-format-in-excel\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;15 цифр&lt;/a&gt;, при попытке вставить &lt;code&gt;99999999999999999&lt;/code&gt; (&lt;code&gt;10^17-1&lt;/code&gt;) в ячейке появится &lt;code&gt;99999999999999900&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Числа, не удовлетворяющие этому ограничению, экспортируются как строки.&lt;/p&gt;\n&lt;h4 id=\"number**\"&gt;&lt;a href=\"ru/user-guide/excel.html#number**\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Number**&lt;/span&gt;&lt;/a&gt;Number**&lt;/h4&gt;\n&lt;p&gt;Значение из YTsaurus таблицы будет записано в ячейку Excel таблицы с типом &lt;code&gt;Number&lt;/code&gt;, без потери точности. Значения с типом &lt;code&gt;date&lt;/code&gt; и &lt;code&gt;datetime&lt;/code&gt; экспортируются как &lt;code&gt;Number&lt;/code&gt; со специальными стилями отображения и в Excel выглядят следующим образом:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;date&lt;/code&gt; — &lt;code&gt;2020-12-05&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;datetime&lt;/code&gt; — &lt;code&gt;2000-12-10 10:22:17&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"number***\"&gt;&lt;a href=\"ru/user-guide/excel.html#number***\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Number***&lt;/span&gt;&lt;/a&gt;Number***&lt;/h4&gt;\n&lt;p&gt;Значение может не поместиться в &lt;code&gt;Number&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;Timestamp&lt;/code&gt; с миллисекундным разрешением экспортируется в виде &lt;code&gt;Number&lt;/code&gt; со специальным стилем отображения (&lt;code&gt;1969-12-30 00:00:00&lt;/code&gt;), с меньшим — в виде строки формата: &lt;code&gt;2006-01-02T15:04:05.999999Z&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"text*\"&gt;&lt;a href=\"ru/user-guide/excel.html#text*\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Text*&lt;/span&gt;&lt;/a&gt;Text*&lt;/h4&gt;\n&lt;p&gt;&lt;code&gt;Text&lt;/code&gt; — это строковый тип. Максимальная длина строки в ячейке — &lt;code&gt;32768&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В YTsaurus длина строки может быть больше (вплоть до &lt;code&gt;128 * 10^6&lt;/code&gt;). Длинные строки обрезаются.&lt;/p&gt;\n&lt;h4 id=\"text**\"&gt;&lt;a href=\"ru/user-guide/excel.html#text**\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Text**&lt;/span&gt;&lt;/a&gt;Text**&lt;/h4&gt;\n&lt;p&gt;Значения сериализуются в &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON&lt;/a&gt;. Длинные строки, как и в &lt;code&gt;Text*&lt;/code&gt;, обрезаются.&lt;/p&gt;\n&lt;h3 id=\"otsutstvuyushie-znacheniya\"&gt;&lt;a href=\"ru/user-guide/excel.html#otsutstvuyushie-znacheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Отсутствующие значения&lt;/span&gt;&lt;/a&gt;Отсутствующие значения&lt;/h3&gt;\n&lt;p&gt;Для &lt;code&gt;optional&lt;/code&gt; типов, в случае отсутствия значения, в ячейку будет записана пустая строка.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/excel.md","sourcePath":"ru/user-guide/excel.md"},"headings":[{"title":"Загрузка в новую таблицу","href":"ru/user-guide/excel.html#zagruzka-v-novuyu-tablicu","level":2},{"title":"Загрузка в существующую таблицу","href":"ru/user-guide/excel.html#zagruzka-v-sushestvuyushuyu-tablicu","level":2},{"title":"Ограничения загрузки","href":"ru/user-guide/excel.html#ogranicheniya-zagruzki","level":2},{"title":"Скачивание","href":"ru/user-guide/excel.html#skachivanie","level":2,"items":[{"title":"Ограничения","href":"ru/user-guide/excel.html#ogranicheniya","level":3},{"title":"Соответствие типов","href":"ru/user-guide/excel.html#type-mapping","level":3,"items":[{"title":"Number*","href":"ru/user-guide/excel.html#number*","level":4},{"title":"Number**","href":"ru/user-guide/excel.html#number**","level":4},{"title":"Number***","href":"ru/user-guide/excel.html#number***","level":4},{"title":"Text*","href":"ru/user-guide/excel.html#text*","level":4},{"title":"Text**","href":"ru/user-guide/excel.html#text**","level":4}]},{"title":"Отсутствующие значения","href":"ru/user-guide/excel.html#otsutstvuyushie-znacheniya","level":3}]}],"title":"Работа с данными Microsoft Excel"},"router":{"pathname":"ru/user-guide/excel","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
