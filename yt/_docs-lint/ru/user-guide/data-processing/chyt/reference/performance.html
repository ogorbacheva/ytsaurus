        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;При выборе между CH и CHYT возникает вопрос — что быстрее и насколько?&lt;/p&gt;\n&lt;p&gt;Ответить на этот вопрос в общем случае невозможно, так как скорость выполнения запроса зависит от множества факторов, в том числе от самого запроса, количества ресурсов и схемы хранения данных.&lt;/p&gt;\n&lt;p&gt;Данные в YTsaurus изначально не предназначены для выполнения OLAP-запросов. Чтобы получить нормальную скорость, нужно их подготовить.&lt;br /&gt;\nДобиться скорости CH, скорее всего, не получится, но можно приблизиться, правильно выбирая схему хранения данных и запросов к ним.&lt;br /&gt;\nЗато неправильным хранением данных легко можно добиться скорости запросов в сотни раз ниже чем в CH.&lt;/p&gt;\n&lt;h2 id=\"where_my_time\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/performance.html#where_my_time\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;На что уходит время&lt;/span&gt;&lt;/a&gt;На что уходит время&lt;/h2&gt;\n&lt;p&gt;Ниже приведены этапы выполнения запроса, которые могут быть \"узким местом\".&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Чтение метаинформации таблиц и чанков, распределение запроса по инстансам.&lt;/li&gt;\n&lt;li&gt;Чтение данных с диска.&lt;/li&gt;\n&lt;li&gt;Передача данных по сети.&lt;/li&gt;\n&lt;li&gt;Расжатие данных и декодирование.&lt;/li&gt;\n&lt;li&gt;Merge версий (только для &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;динамических&lt;/a&gt; таблиц).&lt;/li&gt;\n&lt;li&gt;Конвертация данных из формата YTsaurus в формат CH.&lt;/li&gt;\n&lt;li&gt;Обработка данных движком ClickHouse.&lt;/li&gt;\n&lt;li&gt;Конвертирование данных из формата CH в формат YTsaurus (только для операций записи).&lt;/li&gt;\n&lt;li&gt;Запись данных в YTsaurus (только для операций записи).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;В зависимости от того, как данные хранятся и какими запросами обрабатываются, разные этапы могут быть узким местом.&lt;/p&gt;\n&lt;h2 id=\"read\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/performance.html#read\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чтение данных&lt;/span&gt;&lt;/a&gt;Чтение данных&lt;/h2&gt;\n&lt;p&gt;Далее описаны факторы, влияющие на скорость запросов чтения.&lt;/p&gt;\n&lt;h3 id=\"data_weight\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/performance.html#data_weight\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Размер обрабатываемых данных&lt;/span&gt;&lt;/a&gt;Размер обрабатываемых данных&lt;/h3&gt;\n&lt;p&gt;В первую очередь CHYT заточен для быстрой обработки (порядка секунд) данных малого (порядка ГБ) и среднего (порядка десятков ГБ) размера. Эффективно использовать CHYT для обработки ТБ данных не получится. Уменьшить количество обрабатываемых данных можно с помощью правильной &lt;a href=\"user-guide/storage/static-schema.html\"&gt;схемы&lt;/a&gt; хранения данных (используя поколоночность и сортированность).&lt;/p&gt;\n&lt;p&gt;Для построения дашбордов поверх большого объема данных рекомендуется делать отдельные таблицы с \"выжимкой\" нужных данных, а так же предагрегированными значениями. Например, если данные в миллисекундах, а аналитику нужно строить по дням, то нужно предагрегировать данные до дня.&lt;/p&gt;\n&lt;p&gt;Как уменьшить количество вычислений налету:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Например, дату можно считать по полю &lt;code&gt;datetime&lt;/code&gt;, но фильтрация по этому полю будет медленнее.&lt;/li&gt;\n&lt;li&gt;Избегать выполнения неоправданно тяжелых запросов. Например, сортировка 100ГБ, &lt;code&gt;SELECT DISTINCT&lt;/code&gt; или &lt;code&gt;GROUP BY&lt;/code&gt; по колонке, которая имеет миллионы различных значений, или использование оператора &lt;code&gt;JOIN&lt;/code&gt; для больших таблиц. Такие запросы всегда будут обрабатываться медленно.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Чтение больших таблиц может упереться в любой пункт исполнения запроса из списка выше.&lt;/p&gt;\n&lt;h3 id=\"erasure\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/performance.html#erasure\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Erasure кодирование&lt;/span&gt;&lt;/a&gt;Erasure кодирование&lt;/h3&gt;\n&lt;p&gt;Erasure кодирование предназначено для \"холодных\" таблиц. Данные в erasure кодировании занимают меньше дискового пространства, но это негативно сказывается на скорости чтении таких данных:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Каждый чанк разбит на 16 (или 9 в зависимости от алгоритма кодирования) частей, что увеличивает количество метаинформации (пункт 1).&lt;/li&gt;\n&lt;li&gt;Данные хранятся в одной копии, поэтому чтение нельзя распараллелить (пункт 2).&lt;/li&gt;\n&lt;li&gt;В случае, если диск на ноде загружен, не будет возможности переключиться на чтение данных с другой ноды. А так как чанк разбит на 16 частей, то вероятность что чтение хотя бы одного их них зависнет сильно увеличивается.&lt;/li&gt;\n&lt;li&gt;Если данные недоступны из-за сбоя узла кластера, их необходимо восстанавливать. Это достаточно долгий и ресурсозатратный процесс. (пункт 2, 4?).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Как результат, чтение данных с erasure кодированием занимает в разы больше времени, а задержки при чтении становятся более вероятными и менее предсказуемыми. Строить дашборды или делать другие регулярные запросы поверх данных в erasure кодированием &lt;strong&gt;крайне не рекомендуется&lt;/strong&gt;.&lt;/p&gt;\n&lt;h3 id=\"optimize_for\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/performance.html#optimize_for\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Формат хранения данных&lt;/span&gt;&lt;/a&gt;Формат хранения данных&lt;/h3&gt;\n&lt;p&gt;Данные в YTsaurus таблицах могут храниться как в построчном (&lt;code&gt;optimize_for=lookup&lt;/code&gt;), так и в поколоночном (&lt;code&gt;optimize_for=scan&lt;/code&gt;) формате.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ClickHouse — это колоночная СУБД, поэтому настоятельно рекомендуется использовать именно поколоночное хранение.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Поколоночное хранение данных имеет следующие преимущества:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Конвертация данных в формат CH из поколоночного формата YTsaurus в разы (если не в десятки раз) эффективнее, чем из построчного (пункт 6).&lt;/li&gt;\n&lt;li&gt;При поколоночном хранении данных во время запроса будут считаны только запрошенные колонки. (пункты 2, 3 и 4).&lt;/li&gt;\n&lt;li&gt;Данные, хранящиеся поколоночно, лучше сжимаются, поэтому занимают меньше места (пункты 2, 3).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Обычная смена аттрибутов &lt;code&gt;optimize_for/erasure_codec&lt;/code&gt; не перекладывает старые данные в новый формат. Чтобы изменение формата случилось, запустите операцию &lt;code&gt;merge&lt;/code&gt; с опцией &lt;code&gt;force_transform=%true&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"key_columns\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/performance.html#key_columns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ключевые колонки&lt;/span&gt;&lt;/a&gt;Ключевые колонки&lt;/h3&gt;\n&lt;p&gt;Для эффективного чтения в ClickHouse существуют индексы и ключи шардирования. В YTsaurus модель хранения данных немного иная, привычных индексов нет. Но есть сортированные таблицы. Запросы над сортированными таблицами используют ключ сортировки как первичный индекс (Primary key) и ключ шардирования (Sharding key).&lt;/p&gt;\n&lt;p&gt;Это позволяет:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;эффективно фильтровать и не читать лишние данные с диска (пункт 2).&lt;/li&gt;\n&lt;li&gt;эффективнее делать запрос, в частности, &lt;code&gt;Sorted Join&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;лучше сжимать сортированные таблицы, в результате чего они занимают меньше места (пункт 2).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выбирать ключ сортировки нужно в зависимости от запросов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Например, если запросы выглядит как&lt;br /&gt;\n&lt;code&gt; ... where date between '2021-01-01' and '2021-02-01'&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Хорошим ключом будет &lt;code&gt;date&lt;/code&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Для запросов вида&lt;br /&gt;\n&lt;code&gt; ... where user_id = 1234&lt;/code&gt;&lt;br /&gt;\nХорошим ключом будет &lt;code&gt;user_id&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В некоторых случаях, если отсортировать таблицу, эффективной фильтрации не будет. Колонка строковая и конвертация &lt;code&gt;DateTime&lt;/code&gt; &amp;lt;-&amp;gt; &lt;code&gt;String&lt;/code&gt; не является монотонной и однозначной. Преобразование &lt;code&gt;Int&lt;/code&gt; &amp;lt;-&amp;gt; &lt;code&gt;DateTime&lt;/code&gt; монотонное, но со строковым представлением применять такую оптимизацию в общем случае нельзя. Например, &lt;code&gt;2020-01-01 00:00:00&lt;/code&gt; и &lt;code&gt;2020-01-01T00:00:00&lt;/code&gt; — корректное представление одного и того же момента времени в ClickHouse, но при сортировке со строковым представлением между ними может появиться значение &lt;code&gt;2020-01-01 00:00:01&lt;/code&gt;, поэтому преобразование &lt;code&gt;String&lt;/code&gt; -&amp;gt; &lt;code&gt;DateTime&lt;/code&gt; не является монотонным и использовать эту оптимизацию нельзя.&lt;/p&gt;\n&lt;h3 id=\"chunk_count\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/performance.html#chunk_count\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Количество чанков&lt;/span&gt;&lt;/a&gt;Количество чанков&lt;/h3&gt;\n&lt;p&gt;Количество чанков влияет на несколько этапов выполнения запроса.&lt;/p&gt;\n&lt;p&gt;Чем больше количество чанков у таблицы, тем больше необходимо считать метаинформации на шаге 1. Если у таблицы тысячи чанков — считывание метаинформации может затянуться на несколько секунд. Если чанков много у очень маленькой таблицы, то чтение каждого чанка превращается в random read и может работать медленно (шаг 2).&lt;br /&gt;\nС другой стороны, если чанков слишком мало (например, 1 чанк на 10 GB), то все данных хранятся на одних и тех же дисках, что ограничит параллельность чтения на шаге 2.&lt;/p&gt;\n&lt;p&gt;Для укрупнения чанков используйте операцию &lt;code&gt;Merge&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"table_count\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/performance.html#table_count\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Количество входных таблиц&lt;/span&gt;&lt;/a&gt;Количество входных таблиц&lt;/h3&gt;\n&lt;p&gt;Аналогично количеству чанков, но метаинформация для таблицы в разы тяжелее чем метаинформация для чанка. Кроме того, для каждой таблицы нужно отдельно проверить права доступа. Рекомендуем делать не более сотен таблиц. Желательно объединять много таблиц в одну большую.&lt;/p&gt;\n&lt;h3 id=\"column_count\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/performance.html#column_count\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Количество колонок&lt;/span&gt;&lt;/a&gt;Количество колонок&lt;/h3&gt;\n&lt;p&gt;Количество колонок в таблице тоже влияет на скорость работы с данными, даже если данные хранятся в поколоночном формате. Размер блока подбирается так, что бы ридер мог считать по блоку для каждой колонки и выдать результат. Что бы при таком чтении данные влезали в память, при увеличении числа колонок размер блоков уменьшается. При совсем маленьких блоках чтение превращается в random read (шаг 2). Рекомендуем иметь десятки, максимум 100 колонок. Тысячи колонок гарантированно будут работать плохо.&lt;br /&gt;\nКроме того, большое количество колонок увеличивает количество метаинформации на шаге 1.&lt;/p&gt;\n&lt;h3 id=\"dyn-vs-stat\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/performance.html#dyn-vs-stat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Динамические vs Статические таблицы&lt;/span&gt;&lt;/a&gt;Динамические vs Статические таблицы&lt;/h3&gt;\n&lt;p&gt;Данные в динамических таблицах хранятся по-другому и не предназначены для full-scan-чтения. Это накладывает дополнительные расходы на их чтение:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Во-первых, нужно читать для каждого значения его версию.&lt;/li&gt;\n&lt;li&gt;Во-вторых, для каждой строчки необходимо прочитать все ключевые колонки, даже если они не используются в запросе.&lt;/li&gt;\n&lt;li&gt;Далее, необходимо сделать объединение всех строчек с одинаковым ключом, оставив только 1 самую свежую версию. Это очень тяжелый процесс с большим количеством сравнений. Кроме того, процесс сугубо построчный, поэтому даже если данные хранятся поколоночно, их придется переложить построчно.&lt;/li&gt;\n&lt;li&gt;После этого необходимо переложить данные обратно в поколоночный формат.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;code&gt;Merge&lt;/code&gt; может добавлять x10 к времени чтения данных.&lt;/p&gt;\n&lt;p&gt;Строить дашборды или делать другие регулярные запросы поверх динамических таблиц большого размера крайне не рекомендуется ввиду неэффективности чтения.&lt;/p&gt;\n&lt;h3 id=\"ssd_vs_hdd\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/performance.html#ssd_vs_hdd\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SSD vs HDD&lt;/span&gt;&lt;/a&gt;SSD vs HDD&lt;/h3&gt;\n&lt;p&gt;SSD диски обладают очевидным преимуществом — большей скоростью чтения и меньшими задержками на шаге 2.&lt;/p&gt;\n&lt;h3 id=\"optional_columns\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/performance.html#optional_columns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Optional колонки&lt;/span&gt;&lt;/a&gt;Optional колонки&lt;/h3&gt;\n&lt;p&gt;Большинство колонок в YTsaurus являются опциональными (&lt;code&gt;required: false&lt;/code&gt;), то есть вместо значения может храниться &lt;code&gt;Null&lt;/code&gt;. В CH это не так, большинство колонок не являются &lt;code&gt;Nullable&lt;/code&gt;. Использования опциональных колонок замедляет практически все стадии, от чтения и конвертации данных до обработки в CH.&lt;/p&gt;\n&lt;p&gt;Рекомендуется ставить более жесткую схему и избавляться от optional колонок там, где нет такой необходимости.&lt;/p&gt;\n&lt;h3 id=\"data_caches\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/performance.html#data_caches\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кеши данных&lt;/span&gt;&lt;/a&gt;Кеши данных&lt;/h3&gt;\n&lt;p&gt;В CHYT есть большое количество кешей, ускоряющих те или иные стадии выполнения запроса.&lt;br /&gt;\nСамые главные — &lt;code&gt;compressed_block_cache&lt;/code&gt; и &lt;code&gt;uncompressed_block_cache&lt;/code&gt;. Использование второго избавляет от этапов 2 и 3. Использование первого — от этапов 2, 3 и 4 (разжатие).&lt;br /&gt;\nМаленькие таблицы скорее всего будут всегда читаться из кеша.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/chyt/reference/performance.md","sourcePath":"ru/user-guide/data-processing/chyt/reference/performance.md"},"headings":[{"title":"На что уходит время","href":"ru/user-guide/data-processing/chyt/reference/performance.html#where_my_time","level":2},{"title":"Чтение данных","href":"ru/user-guide/data-processing/chyt/reference/performance.html#read","level":2,"items":[{"title":"Размер обрабатываемых данных","href":"ru/user-guide/data-processing/chyt/reference/performance.html#data_weight","level":3},{"title":"Erasure кодирование","href":"ru/user-guide/data-processing/chyt/reference/performance.html#erasure","level":3},{"title":"Формат хранения данных","href":"ru/user-guide/data-processing/chyt/reference/performance.html#optimize_for","level":3},{"title":"Ключевые колонки","href":"ru/user-guide/data-processing/chyt/reference/performance.html#key_columns","level":3},{"title":"Количество чанков","href":"ru/user-guide/data-processing/chyt/reference/performance.html#chunk_count","level":3},{"title":"Количество входных таблиц","href":"ru/user-guide/data-processing/chyt/reference/performance.html#table_count","level":3},{"title":"Количество колонок","href":"ru/user-guide/data-processing/chyt/reference/performance.html#column_count","level":3},{"title":"Динамические vs Статические таблицы","href":"ru/user-guide/data-processing/chyt/reference/performance.html#dyn-vs-stat","level":3},{"title":"SSD vs HDD","href":"ru/user-guide/data-processing/chyt/reference/performance.html#ssd_vs_hdd","level":3},{"title":"Optional колонки","href":"ru/user-guide/data-processing/chyt/reference/performance.html#optional_columns","level":3},{"title":"Кеши данных","href":"ru/user-guide/data-processing/chyt/reference/performance.html#data_caches","level":3}]}],"title":"Производительность и рекомендации"},"router":{"pathname":"ru/user-guide/data-processing/chyt/reference/performance","depth":6,"base":"../../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7
