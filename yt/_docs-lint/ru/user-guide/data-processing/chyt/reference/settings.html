            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе содержится информация о настройках, специфичных для CHYT. Напомним, что в ClickHouse есть большое количество различных настроек, которые можно задавать различными способами: через GET-параметр запроса, непосредственно в запросе через клаузу SETTINGS, при использовании YQL через pragma или иными способами. Список оригинальных настроек ClickHouse доступен в &lt;a href=\"https://clickhouse.com/docs/ru/operations/settings/settings/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;документации&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Настройки, относящиеся к CHYT, начинаются с префикса &lt;code&gt;chyt.&lt;/code&gt;. Некоторые настройки унесены в отдельные подсекции: в таком случае название настройки будет состоять из нескольких токенов, разделённых точками, например &lt;code&gt;chyt.composite.enable_conversion&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Как обычно в ClickHouse, для логических настроек используются значения &lt;code&gt;1&lt;/code&gt; и &lt;code&gt;0&lt;/code&gt; в качестве &lt;code&gt;True&lt;/code&gt; и &lt;code&gt;False&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Как обычно, многие настройки включают те или иные оптимизации, которые по умолчанию включены и перечислены только для того, чтобы подчеркнуть возможность их отключения в случае некорректной оптимизации.&lt;/p&gt;\n&lt;h2 id=\"dostupnye-nastrojki\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/settings.html#dostupnye-nastrojki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Доступные настройки&lt;/span&gt;&lt;/a&gt;Доступные настройки&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;enable_columnar_read&lt;/code&gt; [&lt;code&gt;%true&lt;/code&gt;] — включает использование быстрого поколоночного интерфейса чтения для таблиц в scan-формате.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;enable_computed_column_deduction&lt;/code&gt; [&lt;code&gt;%true&lt;/code&gt;] — включает выведение значений для вычислимых ключевых колонок с использованием предиката в WHERE. Например, если ключевая колонка &lt;code&gt;key_hash&lt;/code&gt; задана в схеме как результат выражения &lt;code&gt;farm_hash(key)&lt;/code&gt;, то при наличии в условии запроса выражения &lt;code&gt;key = 'xyz'&lt;/code&gt; в предикат автоматически будет добавлено следствие &lt;code&gt;key_hash = 16518849956333482075&lt;/code&gt;. Поддерживаются только условий типа &lt;code&gt;колонка = константное выражение&lt;/code&gt;, &lt;code&gt;кортеж колонок = кортеж константных выражений&lt;/code&gt;, &lt;code&gt;колонка IN кортеж константных выражений&lt;/code&gt; и &lt;code&gt;кортеж колонок IN кортеж кортежей константных выражений&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;infer_dynamic_table_ranges_from_pivot_keys&lt;/code&gt; [&lt;code&gt;%true&lt;/code&gt;] — включает дополнительный шаг выведение диапазонов при запросе по динамической таблице с использованием &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;tablet pivot keys&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;composite&lt;/code&gt; — секция с настройками, относящимися к сложным типам &lt;code&gt;type_v3&lt;/code&gt; и &lt;code&gt;YSON any/composite&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;default_yson_format&lt;/code&gt; [&lt;code&gt;binary&lt;/code&gt;] — формат по умолчанию для представления YSON-строк. Возможные значения - &lt;code&gt;binary, text, pretty&lt;/code&gt;. Обратите внимание, что варианты, отличные от &lt;code&gt;binary&lt;/code&gt;, менее эффективны, так как требуют явного преобразования из бинарного формата. &lt;a href=\"user-guide/data-processing/chyt/reference/functions.html\"&gt;Функции работы с YSON&lt;/a&gt; работают с любым из возможных форматов YSON.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;dynamic_table&lt;/code&gt; — секция с настройками, относящимися к работе с динамическими таблицами.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;enable_dynamic_store_read&lt;/code&gt; [&lt;code&gt;%true&lt;/code&gt;] — работать с динамическими таблицами, читая данные из dynamic stores. При выставлении данной опции не получится прочитать таблицу, которая не была примонтирована с атрибутом &lt;code&gt;enable_dynamic_store_read = %true&lt;/code&gt;. Попытка чтения приведёт к ошибке. Если данная опция отключена, то любой запрос будет принудительно читать только данные из chunk stores, т.е. не включая самые свежие данные из memory store (вне зависимости от того, примонтирована ли таблица с &lt;code&gt;enable_dynamic_store_read = %true&lt;/code&gt; или нет).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;execution&lt;/code&gt; — секция с настройками, влияющими на процесс планирования и выполнения запроса:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;query_depth_limit&lt;/code&gt; [0] — ограничение на максимальную глубину распределенного запроса. При достижении заданной глубины запрос завершается ошибкой. Значение 0 означает отсутствие ограничения.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;join_policy&lt;/code&gt; [&lt;code&gt;distribute_initial&lt;/code&gt;] — режим работы запросов JOIN над YTsaurus-таблицей. Возможные варианты:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;local&lt;/code&gt; — сам JOIN выполняется локально на координаторе запроса. Левая и правая таблица (или подзапрос) читаются согласно режиму &lt;code&gt;select_policy&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;distribute_initial&lt;/code&gt; (по умолчанию) — &lt;code&gt;JOIN&lt;/code&gt; в изначальном (initial) запросе выполняется распределенно, при этом JOIN в системных (secondary) запросах выполняются локально.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;distribute&lt;/code&gt; — &lt;code&gt;JOIN&lt;/code&gt; во всех запросах (initial и secondary) выполняется распределенно. Не рекомендуется использоваться данный режим, так как при множественном &lt;code&gt;JOIN&lt;/code&gt; это может привести к экспоненциальному количеству системных (secondary) запросов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;select_policy&lt;/code&gt; [&lt;code&gt;distribute_initial&lt;/code&gt;]&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;local&lt;/code&gt; — запрос &lt;code&gt;SELECT&lt;/code&gt; полностью читается и обрабатывается только на одном инстансе (координаторе).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;distribute_initial&lt;/code&gt; (по умолчанию) — &lt;code&gt;SELECT&lt;/code&gt; выполняется распределенно на инстансах клики в изначальном (initial) запросе. В системных (secondary) запросах выполнение происходит локально.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;distribute&lt;/code&gt; — &lt;code&gt;SELECT&lt;/code&gt; во всех запросах (initial и secondary) выполняется распределенно. Не рекомендуется использоваться данный режим, так как это может привести к экспоненциальному количеству системных (secondary) запросов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;join_node_limit&lt;/code&gt; [0] — максимальное количество узлов клики, на которых допускается выполнение распределенного запроса &lt;code&gt;JOIN&lt;/code&gt;. Значение 0 означает отсутствие ограничения (по умолчанию).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;select_node_limit&lt;/code&gt; [0] — максимальное количество узлов клики, на которых допускается выполнение распределенного запроса &lt;code&gt;SELECT&lt;/code&gt;. Значение 0 означает отсутствие ограничения (по умолчанию).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;distribution_seed&lt;/code&gt; [42] — сид, используемый для детерминированного распределения запроса по узлам клики.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;input_streams_per_secondary_query&lt;/code&gt; [0] — ограничение на количество параллельных потоков чтения таблицы на каждом узле клики при выполнении запроса. При значении 0 в качестве ограничения используется значение clickhouse настройки &lt;code&gt;max_threads&lt;/code&gt; (по умолчанию).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;filter_joined_subquery_by_sort_key&lt;/code&gt; [&lt;code&gt;%true&lt;/code&gt;] — включает оптимизацию, предварительно фильтрующую правую таблицу (или поздапрос) JOIN по ключу сортировки левой таблицы.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;keep_nulls_in_right_or_full_join&lt;/code&gt; [&lt;code&gt;%true&lt;/code&gt;] — регулирует поведение &lt;code&gt;RIGHT&lt;/code&gt; и &lt;code&gt;FULL JOIN&lt;/code&gt; в случае, когда в правой таблице (подзапросе) присутствуют значения &lt;code&gt;Null&lt;/code&gt; в ключевых колонках. При значении &lt;code&gt;%true&lt;/code&gt; запрос исполняется как обычно, в результате запроса будут присутствовать все строки со значением &lt;code&gt;Null&lt;/code&gt; в ключевых колонках (по умолчанию). При значении &lt;code&gt;%false&lt;/code&gt; допускается отсутствие всех или некоторых строк из правой таблицы со значением &lt;code&gt;Null&lt;/code&gt; в ключевых колонках, при этом запрос может быть исполнен более эффективно. Если в ключевых колонках правой таблицы (подзапроса) нет значений &lt;code&gt;Null&lt;/code&gt;, то результат выполнения запроса не зависит от значений данной опции.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;distributed_insert_stage&lt;/code&gt; [&lt;code&gt;with_mergeable_state&lt;/code&gt; (может быть изменено в будущем)] — минимальная стадия выполнения запроса, после которой допускается распределенная запись в таблицу при включенной ClickHouse-настройке &lt;code&gt;parallel_distributed_insert_select&lt;/code&gt;. Возможные значения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;none&lt;/code&gt; — никогда не использовать распределенную запись.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;with_mergeable_state&lt;/code&gt; (по умолчанию, может быть изменено в будущем) — использовать распределенную запись, если запрос может быть исполнен распределенно хотя бы до стадии &lt;code&gt;with_mergeable_state&lt;/code&gt;. Агрегация данных (&lt;code&gt;GROUP BY&lt;/code&gt;, &lt;code&gt;DISTINCT&lt;/code&gt;, &lt;code&gt;LIMIT BY&lt;/code&gt;) и клаузы &lt;code&gt;ORDER BY&lt;/code&gt; и &lt;code&gt;LIMIT&lt;/code&gt; могут исполняться независимо на каждом узле клики, поэтому при распределенной записи результат выполнения запроса может содержать несколько строк с одним ключем агрегации, строки могут быть не отсортированы в порядке ORDER BY, а количество строк может превышать заданный LIMIT (но суммарное количество строк будет не больше, чем &lt;code&gt;количество инстансов в клике&lt;/code&gt; * &lt;code&gt;заданный LIMIT&lt;/code&gt;).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;after_aggregation&lt;/code&gt; — использовать распределенную запись, если запрос может быть исполнен распределенно хотя бы до стадии &lt;code&gt;after_aggregation&lt;/code&gt;. Гарантируется, что агрегация данных (&lt;code&gt;GROUP BY&lt;/code&gt;, &lt;code&gt;DISTINCT&lt;/code&gt;, &lt;code&gt;LIMIT BY&lt;/code&gt;) будет выполнена до конца, при этом клаузы &lt;code&gt;ORDER BY&lt;/code&gt; и &lt;code&gt;LIMIT&lt;/code&gt; могут исполняться независимо на каждом узле клики (что может приводить к нарушению сортировки и превышению заданного лимита строк, как описано выше). Если исполнить запрос до стадии &lt;code&gt;after_aggregation&lt;/code&gt; распределенно невозможно, запись данных будет выполнена локально с координатора запроса.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;complete&lt;/code&gt; — использовать распределенную запись, только если запрос может быть полностью выполнен распределенно. Результат выполнения запроса с распределенной записью в данном случае не отличим от обычного запроса, все клаузы (агрегация, &lt;code&gt;ORDER BY&lt;/code&gt; и &lt;code&gt;LIMIT&lt;/code&gt;) будут выполнены до конца. Если выполнить запрос распределенно до стадии &lt;code&gt;complete&lt;/code&gt; невозможно, запись данных будет выполнена локально с координатора запроса.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;caching&lt;/code&gt; — секция с настройками, относящимися к различным кешам, используемым в CHYT:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;table_attributes_invalidate_mode&lt;/code&gt; [&lt;code&gt;sync&lt;/code&gt;] — режим работы механизма инвалидации данных в кеше атрибутов таблиц при изменении таблицы (запросы &lt;code&gt;CREATE TABLE/INSERT INTO/DROP TABLE&lt;/code&gt;). Возможные значения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;none&lt;/code&gt; — инвалидации данных в кеше не происходит. Чтение таблиц сразу после изменения может возвращать старые данные, либо приводить к ошибке.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;local&lt;/code&gt; — инвалидация данных происходит только в локальном кеше инстанса, без каких-либо rpc запросов. Чтение таблиц на других инстансах сразу после изменения может возвращать старые данные, либо приводить к ошибке.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;async&lt;/code&gt; — инвалидация данных происходит синхронно в локальном кеше и асинхронно на всех инстансах клики. Запрос завершается не дожидаясь инвалидации данных на остальных инстансах клики. Ошибки во время инвалидации данных в кеше не приводят к ошибке выполнения запроса. Чтение таблиц на других инстансах сразу после изменения все еще может возвращать старые данные или приводить к ошибке, но такой промежуток времени после изменения данных сильно меньше, чем в случаях &lt;code&gt;none&lt;/code&gt; и &lt;code&gt;local&lt;/code&gt;. Рекомендуется использовать режим инвалидации не ниже данного.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;sync&lt;/code&gt; (по умолчанию) — инвалидация данных происходит синхронно на всех инстансах клики. Время выполнения запроса может быть немного дольше, так как перед завершением необходимо дождаться подтверждения инвалидации кеша на всех инстансах. Ошибки во время инвалидации кеша будут приводить к ошибке выполнения запроса. После успешного выполнения модифицирующего запроса можно сразу же читать измененные таблицы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;invalidate_request_timeout&lt;/code&gt; [5000] — таймаут в миллисекундах (мс.) для rpc-запросов к инстансам клики на стадии инвалидации кеша. При превышении данного таймаута будет показана ошибка.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;concat_tables&lt;/code&gt; — секция с настройками, относящимися к функциям объединения таблиц семейства &lt;code&gt;concatYtTables*&lt;/code&gt; и &lt;code&gt;ytTables&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;missing_column_mode&lt;/code&gt; [&lt;code&gt;read_as_null&lt;/code&gt;] — режим вывода общей схемы колонки, если в одной из таблиц она отсутствует. Возможные значения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;throw&lt;/code&gt; — запрос завершится с ошибкой.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;drop&lt;/code&gt; — колонка будет отсутствовать в общей схеме. Прочитать такую колонку будет невозможно.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;read_as_null&lt;/code&gt; (по умолчанию) — тип колонки будет заменен на &lt;code&gt;Optional(T)&lt;/code&gt;. В строках из таблиц, где данная колонка отсутствует, значение в колонке будет равно &lt;code&gt;Null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;type_mismatch_mode&lt;/code&gt; [&lt;code&gt;throw&lt;/code&gt;] — режим вывода общей схемы колонки, если типы колонки в разных таблицах различаются и не могут быть приведены друг к другу. Возможные значения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;throw&lt;/code&gt; (по умолчанию) — запрос завершится ошибкой.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;drop&lt;/code&gt; — колонка будет отсутствовать в общей схеме. Прочитать такую колонку будет невозможно.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;read_as_any&lt;/code&gt; — тип колонки будет заменен на &lt;code&gt;Any&lt;/code&gt;. Все значения будут представлены в виде YSON-строк, с которыми можно работать с помощью функций семейства &lt;code&gt;YSONExtract*&lt;/code&gt; и &lt;code&gt;YPath*&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;allow_empty_schema_intersection&lt;/code&gt; [&lt;code&gt;%false&lt;/code&gt;] — разрешает объединение нескольких таблиц, если у них нет ни одной общей колонки.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;max_tables&lt;/code&gt; [250] — максимальное количество таблиц, которые могут быть объединены для чтения. При превышении данного ограничения запрос завершится ошибкой.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/chyt/reference/settings.md","sourcePath":"ru/user-guide/data-processing/chyt/reference/settings.md"},"headings":[{"title":"Доступные настройки","href":"ru/user-guide/data-processing/chyt/reference/settings.html#dostupnye-nastrojki","level":2}],"title":"Настройки запроса"},"router":{"pathname":"ru/user-guide/data-processing/chyt/reference/settings","depth":6,"base":"../../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
