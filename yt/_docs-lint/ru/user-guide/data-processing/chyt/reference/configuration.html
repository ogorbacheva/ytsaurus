        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Вся конфигурация клики описывается одним &lt;a href=\"user-guide/storage/yson-docs.html\"&gt;YSON-документом&lt;/a&gt;, называемым &lt;em&gt;спеклет&lt;/em&gt; (speclet).&lt;/p&gt;\n&lt;p&gt;Спеклет клики хранится в Кипарисе по пути &lt;code&gt;//sys/strawberry/chyt/&amp;lt;alias&amp;gt;/speclet&lt;/code&gt;. Также его можно получить с помощью команды CLI &lt;code&gt;yt clickhouse ctl get-speclet&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Спеклет представляет собой набор &lt;a href=\"ru/user-guide/data-processing/chyt/reference/configuration.html#options\"&gt;опций&lt;/a&gt;, которые интерпретируются контроллером во время запуска клики. В частности, на основе данных опций контроллер генерирует конечную конфигурацию CHYT-инстансов.&lt;/p&gt;\n&lt;p&gt;Важным отличием CHYT от оригинального ClickHouse является то, что настройки задаются не в XML-формате, а в родном для системы YTsaurus YSON-формате. &lt;a href=\"ru/user-guide/data-processing/chyt/reference/configuration.html#clickhouse_config\"&gt;Ниже&lt;/a&gt; описан принцип, по которому интерпретируются настройки в таком формате.&lt;/p&gt;\n&lt;h2 id=\"how-form\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/configuration.html#how-form\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как формируется конфигурация&lt;/span&gt;&lt;/a&gt;Как формируется конфигурация&lt;/h2&gt;\n&lt;p&gt;При составлении конфигурации используется следующая информация:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Базовый конфиг из Кипариса &lt;code&gt;//sys/clickhouse/config&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Опции, описанные в спеклете.&lt;/li&gt;\n&lt;li&gt;Конфигурация нативного подключения к кластеру, которая берётся из содержимого &lt;code&gt;//sys/@cluster_connection&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Все инстансы клики всегда работают с одной и той же конфигурацией. Поменять конфигурацию без перезапуска клики невозможно.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"options\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/configuration.html#options\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Доступные опции&lt;/span&gt;&lt;/a&gt;Доступные опции&lt;/h2&gt;\n&lt;p&gt;Ниже перечислены опции клики, доступные для установки через команду &lt;code&gt;set-option&lt;/code&gt; (в квадратных скобках указаны значения по умолчанию):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;active&lt;/code&gt; [&lt;code&gt;%false&lt;/code&gt;] — если выставлена, контроллер будет пытаться запустить соответствующую клике Vanilla операцию. При значении &lt;code&gt;%false&lt;/code&gt; клика будет неактивной — то есть она не будет обрабатывать запросы, при этом также не будет тратить ресурсов вычислительного пула. Опция может быть полезна для временного выключения клики с сохранением её конфигурации.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;pool&lt;/code&gt; — название вычислительного пула, в котором необходимо запускать операцию клики. Для выставления данной опции пользователю необходимо иметь право &lt;code&gt;Use&lt;/code&gt; на указанный вычислительный пул. Выставление данной опции является обязательным для запуска операции клики под контроллером.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;enable_geodata&lt;/code&gt; [&lt;code&gt;%true&lt;/code&gt;] — автоматически настроить системные словари, необходимые для работы &lt;a href=\"https://clickhouse.com/docs/en/sql-reference/functions/ym-dict-functions/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;некоторых Geo-функций clickhouse&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;restart_on_speclet_change&lt;/code&gt; [&lt;code&gt;%true&lt;/code&gt;] — если выставлено, клика будет автоматически перезапускаться при любой реконфигурации (изменении спеклета). В противном случае для применения настроек клики необходимо перезапустить клику вручную.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;query_settings&lt;/code&gt; — словарь с настройками по умолчанию для всех запросов в клику. Про настройки запроса подробнее можно прочитать &lt;a href=\"user-guide/data-processing/chyt/reference/settings\"&gt;в соответствующем разделе документации&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;yt_config&lt;/code&gt; — словарь с &lt;a href=\"ru/user-guide/data-processing/chyt/reference/configuration.html#yt_config\"&gt;конфигурацией YTsaurus части&lt;/a&gt; инстансов CHYT. Данная часть конфигурации будет записана в сгенерированную конфигурацию инстансов as is. Настройка предназначена для продвинутых пользователей. Использование данной опции не рекомендуется, так как структура данной конфигурации очень запутанна. По возможности необходимо пользоваться другими опциями, которые будут задавать необходимые изменения в конфигурации более простым способом.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;clickhouse_config&lt;/code&gt; — словарь с &lt;a href=\"ru/user-guide/data-processing/chyt/reference/configuration.html#clickhouse_config\"&gt;конфигурацией ClickHouse части&lt;/a&gt; инстансов CHYT. Эти настройки влияют на логику вычислительного движка ClickHouse и не отличаются от его оригинальных настроек. Аналогично &lt;code&gt;yt_config&lt;/code&gt;, эта опция предназначена для продвинутых пользователей. Использовать её не рекомендуется.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;instance_count&lt;/code&gt; [1] — количество инстансов клики.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;preemption_mode&lt;/code&gt; [&lt;code&gt;normal&lt;/code&gt;] — режим вытеснения, с которым будет запущена YTsaurus-операция клики. Настройка предназначена только для продвинутых пользователей. Если вы не уверены, что она вам нужна, то рекомендуется оставить значение по умолчанию.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;instance_cpu&lt;/code&gt; [16] — количество CPU, которое будет выделено под каждый инстанс клики. Настройка предназначена только для продвинутых пользователей. Если вы не уверены, что она вам нужна, то рекомендуется оставить значение по умолчанию.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;instance_total_memory&lt;/code&gt; [71940702208 (67 Gib)] — количество оперативной памяти в байтах, которое будет выделено под каждый инстанс клики. Настройка предназначена только для продвинутых пользователей. Если вы не уверены, что она вам нужна, то рекомендуется оставить значение по умолчанию.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;enable_sticky_query_distribution&lt;/code&gt; [&lt;code&gt;%false&lt;/code&gt;] — распределить запросы по инстансам с учётом хешей этих запросов. Это позволяет увеличить эффективность использования кеша.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;query_sticky_group_size&lt;/code&gt; [2] — размер группы инстансов, выбранных детерменированно по хешу запроса. Среди этих инстансов будет равномерно выбран координатор для исполнения запроса. Имеет смысл только при &lt;code&gt;enable_sticky_query_distribution=%true&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"yt_config\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/configuration.html#yt_config\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Продвинутая конфигурация YTsaurus-части инстанса&lt;/span&gt;&lt;/a&gt;Продвинутая конфигурация YTsaurus-части инстанса&lt;/h2&gt;\n&lt;p&gt;YTsaurus-часть конфигурации инстанса живёт в опции &lt;code&gt;yt_config&lt;/code&gt;. Через данную опцию можно задать продвинутые настройки, которые не вынесены в отдельные опции спеклета. Поддерживаются следующие подопции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;settings&lt;/code&gt; — CHYT-специфичные &lt;a href=\"user-guide/data-processing/chyt/reference/settings.html\"&gt;настройки&lt;/a&gt; запросов по умолчанию. Изменение настройки в данном разделе приводит к изменению значения по умолчанию для этой настройки для всех запросов в клике.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;table_writer&lt;/code&gt; — &lt;a href=\"user-guide/storage/io-configuration.html#table_writer\"&gt;конфигурация Table Writer&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;table_attribute_cache&lt;/code&gt; — конфигурация кеша атрибутов таблиц. Данный кеш существенно повышает отзывчивость CHYT, но на текущий момент потенциально может приводить к неконсистентным чтениям (в таблице данные уже появились, а CHYT их еще не видит). Чтобы отключить данный кеш, можно воспользоваться конфигурацией:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{read_from=follower;expire_after_successful_update_time=0;expire_after_failed_update_time=0;refresh_time=0;expire_after_access_time=0}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"139\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-139\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-139\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-139.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;create_table_default_attributes&lt;/code&gt; [&lt;code&gt;{optimize_for = scan}&lt;/code&gt;] — атрибуты по умолчанию, с которыми будут создаваться таблицы при &lt;code&gt;CREATE&lt;/code&gt;-запросах в CHYT.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;health_checker&lt;/code&gt; — конфигурация Health Checker. Состоит из 3 полей:&lt;/p&gt;\n&lt;p&gt;— &lt;code&gt;queries&lt;/code&gt; [&lt;code&gt;[\"select * from `//sys/clickhouse/sample_table`\"]&lt;/code&gt;] — список тестовых запросов, работоспособность которых будет регулярно проверяться.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Запросы от Health Checker на данный момент исполняются от имени пользователя &lt;code&gt;yt-clickhouse&lt;/code&gt;, который должен иметь права &lt;code&gt;read&lt;/code&gt; на доступ к таблице.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;— &lt;code&gt;period&lt;/code&gt; [60000] — период срабатывания проверки в миллисекундах.&lt;/p&gt;\n&lt;p&gt;— &lt;code&gt;timeout&lt;/code&gt; [&lt;code&gt;0.9 * period / len(queries)&lt;/code&gt;] — таймаут на срабатывание каждого из сконфигурированных запросов. Если запрос не укладывается в таймаут, он считается &lt;code&gt;failed&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;subquery&lt;/code&gt; — конфигурация основной части системы, которая координирует исполнение ClickHouse-запросов поверх таблиц YTsaurus. Перед конфигурированием этой части прочитайте статью об &lt;a href=\"user-guide/data-processing/chyt/queries/anatomy.html#query-execution\"&gt;исполнении запроса внутри клики&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;— &lt;code&gt;min_data_weight_per_thread&lt;/code&gt; [64 MiB] — (в байтах) при нарезании входа на подзапросы координатор будет пытаться выдать на каждое ядро каждого инстанса не меньше, чем заданный объем.&lt;/p&gt;\n&lt;p&gt;— &lt;code&gt;max_data_weight_per_subquery&lt;/code&gt; [50 GiB] — (в байтах) максимальный допустимый объем данных, обрабатываемый на одном ядре одного инстанса. Данное ограничение является защитным и защищает пользователей клики от случайного запуска огромного запроса, обрабатывающего петабайты. Константа 50 GiB выбрана из соображения, что такой объем обрабатывается на одном ядре примерно за десятки минут.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;show_tables&lt;/code&gt; — конфигурация поведения запроса &lt;code&gt;SHOW TABLES&lt;/code&gt;. Позволяет настроить список директорий, в которых &lt;code&gt;SHOW TABLES&lt;/code&gt; будет показывать список таблиц.&lt;/p&gt;\n&lt;p&gt;— &lt;code&gt;roots&lt;/code&gt; — список YPath-путей директорий в Кипарисе, из которых будут собираться таблицы для показа по &lt;code&gt;SHOW TABLES&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ограничение на &lt;code&gt;max_data_weight_per_subquery&lt;/code&gt; использует поколоночные статистики для учета колоночной выборки из обрабатываемых таблиц. Поколоночная статистика может отсутствовать для старых таблиц, созданных до ее появления. Для таких таблиц поколоночность в ограничении не учитывается. Это означает, что при обработке очень узкого среза колонок, образующего 1% от общего объема таблицы и составляющего 1 GiB в пересчете на ядро, CHYT посчитает, что обрабатывается 100 GiB на ядро. CHYT не запустит такой запрос с настройками по умолчанию.&lt;/p&gt;\n&lt;p&gt;Если необходим именно такой сценарий, либо необходимо обрабатывать большие объемы данных, стоит выставить эту настройку в произвольно большее значение.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"clickhouse_config\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/configuration.html#clickhouse_config\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Продвинутая конфигурация ClickHouse-части инстанса&lt;/span&gt;&lt;/a&gt;Продвинутая конфигурация ClickHouse-части инстанса&lt;/h2&gt;\n&lt;p&gt;Для настройки конфигурации ClickHouse-части предназначена опция &lt;code&gt;clickhouse_config&lt;/code&gt;. Задавать эту опцию необходимо таким образом, чтобы она соответствовала стандартной XML конфигурации ClickHouse.&lt;/p&gt;\n&lt;p&gt;Правила преобразования XML конфигурации ClickHouse в YSON конфигурацию CHYT можно описать следующим образом:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Любой не множественный по смыслу в конфигурации ClickHouse узел конфигурации является словарем (&lt;code&gt;map&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;Множественный узел представлен списком (&lt;code&gt;list&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ниже представлен пример преобразования искусственной XML конфигурации в YSON конфигурацию:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs xml\"&gt;&lt;span class=\"hljs-tag\"&gt;&amp;lt;&lt;span class=\"hljs-name\"&gt;foo&lt;/span&gt;&amp;gt;&lt;/span&gt;42&lt;span class=\"hljs-tag\"&gt;&amp;lt;/&lt;span class=\"hljs-name\"&gt;foo&lt;/span&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-tag\"&gt;&amp;lt;&lt;span class=\"hljs-name\"&gt;bar&lt;/span&gt;&amp;gt;&lt;/span&gt;qwe&lt;span class=\"hljs-tag\"&gt;&amp;lt;/&lt;span class=\"hljs-name\"&gt;bar&lt;/span&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-tag\"&gt;&amp;lt;&lt;span class=\"hljs-name\"&gt;baz&lt;/span&gt;&amp;gt;&lt;/span&gt;\n    &lt;span class=\"hljs-tag\"&gt;&amp;lt;&lt;span class=\"hljs-name\"&gt;quux&lt;/span&gt;&amp;gt;&lt;/span&gt;3.14&lt;span class=\"hljs-tag\"&gt;&amp;lt;/&lt;span class=\"hljs-name\"&gt;quux&lt;/span&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-tag\"&gt;&amp;lt;/&lt;span class=\"hljs-name\"&gt;baz&lt;/span&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-tag\"&gt;&amp;lt;&lt;span class=\"hljs-name\"&gt;baz&lt;/span&gt;&amp;gt;&lt;/span&gt;&lt;span class=\"hljs-tag\"&gt;&amp;lt;/&lt;span class=\"hljs-name\"&gt;baz&lt;/span&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-tag\"&gt;&amp;lt;&lt;span class=\"hljs-name\"&gt;baz&lt;/span&gt;&amp;gt;&lt;/span&gt;hi!&lt;span class=\"hljs-tag\"&gt;&amp;lt;/&lt;span class=\"hljs-name\"&gt;baz&lt;/span&gt;&amp;gt;&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"227\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-227\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-227\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-227.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    foo = &lt;span class=\"hljs-number\"&gt;42&lt;/span&gt;;\n    bar = &lt;span class=\"hljs-string\"&gt;\"qwe\"&lt;/span&gt;;\n    baz = &lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;quux = &lt;span class=\"hljs-number\"&gt;3.14&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"hi!\"&lt;/span&gt;;\n    &lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"228\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-228\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-228\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-228.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Отметим подопции &lt;code&gt;clickhouse_config&lt;/code&gt;, которые могут оказаться удобны в CHYT:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;dictionaries&lt;/code&gt; (&lt;code&gt;[]&lt;/code&gt;) — конфигурация внешних словарей. Значением должен быть список конфигураций словарей. Каждый словарь конфигурируется map'ом со следующими полями, сохраняющими смысл оригинальной конфигурации ClickHouse:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;name&lt;/code&gt; — имя внешнего словаря;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;source&lt;/code&gt; — &lt;a href=\"https://clickhouse.com/docs/en/sql-reference/dictionaries/external-dictionaries/external-dicts-dict-sources/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;источник данных&lt;/a&gt; для внешнего словаря;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;layout&lt;/code&gt; — &lt;a href=\"https://clickhouse.com/docs/en/sql-reference/dictionaries/external-dictionaries/external-dicts-dict-layout/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;представление&lt;/a&gt; внешнего словаря в памяти инстанса;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;structure&lt;/code&gt; — &lt;a href=\"https://clickhouse.com/docs/en/sql-reference/dictionaries/external-dictionaries/external-dicts-dict-structure/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;схема данных&lt;/a&gt;, хранящихся в словаре;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;lifetime&lt;/code&gt; — &lt;a href=\"https://clickhouse.com/docs/en/sql-reference/dictionaries/external-dictionaries/external-dicts-dict-lifetime/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;время жизни&lt;/a&gt; словаря.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"external-dict\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/configuration.html#external-dict\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Внешние словари&lt;/span&gt;&lt;/a&gt;Внешние словари&lt;/h2&gt;\n&lt;p&gt;CHYT поддерживает все настройки &lt;code&gt;layout&lt;/code&gt;, &lt;code&gt;structure&lt;/code&gt; и &lt;code&gt;lifetime&lt;/code&gt; обычного ClickHouse.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В качестве &lt;code&gt;source&lt;/code&gt; можно указывать источники от оригинального ClickHouse, но их работоспособность не гарантируется. В частности, источники, требующие сетевого взаимодействия, технически должны работать, но на практике могут столкнуться с отсутствием сетевых доступов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Также есть дополнительный тип источника данных, в котором можно использовать статические таблицы в YTsaurus. Данный тип называется &lt;code&gt;yt&lt;/code&gt; и имеет один параметр:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path&lt;/code&gt; — путь к статической таблице на кластере, которая будет служить источником данных для словаря.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В качестве примера подключения YTsaurus таблицы как внешнего словаря ClickHouse можно посмотреть на:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"user-guide/data-processing/chyt/reference/configuration.html#configuration_example\"&gt;Пример конфигурации&lt;/a&gt; CHYT, подключающий данную таблицу как внешний словарь ClickHouse.&lt;/li&gt;\n&lt;li&gt;Пример использования внешнего словаря в запросах:&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;select&lt;/span&gt; dictGet(&lt;span class=\"hljs-string\"&gt;'OS'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'OS'&lt;/span&gt;, toUInt64(&lt;span class=\"hljs-number\"&gt;38&lt;/span&gt;)) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; os_name,\n    dictGetHierarchy(&lt;span class=\"hljs-string\"&gt;'OS'&lt;/span&gt;, toUInt64(&lt;span class=\"hljs-number\"&gt;38&lt;/span&gt;)) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; hierarchy,\n    dictGetChildren(&lt;span class=\"hljs-string\"&gt;'OS'&lt;/span&gt;, toUInt64(&lt;span class=\"hljs-number\"&gt;101&lt;/span&gt;)) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; children\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"307\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-307\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-307\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-307.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"configuration_example\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/configuration.html#configuration_example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример конфигурации&lt;/span&gt;&lt;/a&gt;Пример конфигурации&lt;/h2&gt;\n&lt;p&gt;Ниже приведен пример полной конфигурации, которую можно указать c помощью команды &lt;code&gt;set-speclet&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    instance_count = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n    query_settings = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        extremes = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n    yt_config = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        subquery = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n            max_data_weight_per_subquery = &lt;span class=\"hljs-number\"&gt;1000000000000&lt;/span&gt;;\n        &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n    clickhouse_config = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        dictionaries = &lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n            &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n                name = OS;\n                layout = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;flat = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n                structure = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n                    id = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;name = Id&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n                    attribute = &lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n                        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n                            name = &lt;span class=\"hljs-string\"&gt;\"OS\"&lt;/span&gt;;\n                            type = &lt;span class=\"hljs-string\"&gt;\"Nullable(String)\"&lt;/span&gt;;\n                            null_value = &lt;span class=\"hljs-string\"&gt;\"NULL\"&lt;/span&gt;;\n                        &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n                        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n                            name = &lt;span class=\"hljs-string\"&gt;\"ParentId\"&lt;/span&gt;;\n                            type = &lt;span class=\"hljs-string\"&gt;\"Nullable(UInt64)\"&lt;/span&gt;;\n                            null_value = &lt;span class=\"hljs-string\"&gt;\"NULL\"&lt;/span&gt;;\n                            hierarchical = %&lt;span class=\"hljs-literal\"&gt;&lt;span class=\"hljs-keyword\"&gt;true&lt;/span&gt;&lt;/span&gt;;\n                        &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n                        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n                            name = &lt;span class=\"hljs-string\"&gt;\"RootId\"&lt;/span&gt;;\n                            type = &lt;span class=\"hljs-string\"&gt;\"Nullable(UInt64)\"&lt;/span&gt;;\n                            null_value = &lt;span class=\"hljs-string\"&gt;\"NULL\"&lt;/span&gt;;\n                        &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n                    &lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;;\n                &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n                lifetime = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n                source = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;yt = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;path = &lt;span class=\"hljs-string\"&gt;\"//sys/clickhouse/dictionaries/OS\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n            &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n        &lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"314\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-314\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-314\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-314.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/chyt/reference/configuration.md","sourcePath":"ru/user-guide/data-processing/chyt/reference/configuration.md"},"headings":[{"title":"Как формируется конфигурация","href":"ru/user-guide/data-processing/chyt/reference/configuration.html#how-form","level":2},{"title":"Доступные опции","href":"ru/user-guide/data-processing/chyt/reference/configuration.html#options","level":2},{"title":"Продвинутая конфигурация YTsaurus-части инстанса","href":"ru/user-guide/data-processing/chyt/reference/configuration.html#yt_config","level":2},{"title":"Продвинутая конфигурация ClickHouse-части инстанса","href":"ru/user-guide/data-processing/chyt/reference/configuration.html#clickhouse_config","level":2},{"title":"Внешние словари","href":"ru/user-guide/data-processing/chyt/reference/configuration.html#external-dict","level":2},{"title":"Пример конфигурации","href":"ru/user-guide/data-processing/chyt/reference/configuration.html#configuration_example","level":2}],"title":"Конфигурация клики"},"router":{"pathname":"ru/user-guide/data-processing/chyt/reference/configuration","depth":6,"base":"../../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
