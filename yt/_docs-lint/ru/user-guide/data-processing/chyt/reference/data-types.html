        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В ClickHouse доступно большое количество разнообразных &lt;a href=\"https://clickhouse.com/docs/ru/sql-reference/data-types\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;типов данных&lt;/a&gt;. В YTsaurus используется своя система типов данных, сильно пересекающаяся с системой типов ClickHouse, но отдельные типы данных YTsaurus могут отсутствовать в CH и наоборот. Полный список поддерживаемых в системе YTsaurus типов доступен в разделе &lt;a href=\"user-guide/storage/data-types.html\"&gt;типы данных YTsaurus&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"primitivnye-tipy-dannyh\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/data-types.html#primitivnye-tipy-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примитивные типы данных&lt;/span&gt;&lt;/a&gt;Примитивные типы данных&lt;/h2&gt;\n&lt;p&gt;Ниже в таблице приведено соответствие между &lt;strong&gt;примитивными&lt;/strong&gt; (не составными) типами ClickHouse и YTsaurus.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип YTsaurus&lt;/th&gt;\n&lt;th&gt;Тип ClickHouse&lt;/th&gt;\n&lt;th&gt;Комментарий&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;intN, uintN&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;IntN, UIntN&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Целочисленные числовые колонки с точки ClickHouse выглядят как (U)Int соответствующей разрядности.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;boolean&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;YtBoolean&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;В обычном ClickHouse не бывает Boolean'ов, они представляются как однобайтные беззнаковые числа (&lt;code&gt;UInt8&lt;/code&gt;) со значениями 0 и 1. В CHYT поддержан дополнительный тип &lt;code&gt;YtBoolean&lt;/code&gt;, который аналогичен типу &lt;code&gt;UInt8&lt;/code&gt; в вычислениях в ClickHouse, но при записи в YTsaurus-таблицу интерпретируется как &lt;code&gt;boolean&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;string, utf8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;String&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Строки доступны как string&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;double&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Float64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;date&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Date&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;datetime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;DateTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;any&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;String&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Any-колонки читаются движком ClickHouse как строковые колонки, содержащие данные в YSON. Смотрите также: &lt;a href=\"user-guide/data-processing/chyt/reference/settings.html\"&gt;&lt;code&gt;chyt.composite.default_yson_format&lt;/code&gt;&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;T&lt;/code&gt; с &lt;code&gt;required = %false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Nullable(T)&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Если колонка некоторого типа &lt;code&gt;T&lt;/code&gt; не является &lt;code&gt;required&lt;/code&gt;, то она видна как Nullable-колонка&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"sostavnye-tipy-dannyh\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/data-types.html#sostavnye-tipy-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Составные типы данных&lt;/span&gt;&lt;/a&gt;Составные типы данных&lt;/h2&gt;\n&lt;p&gt;Полезные ссылки:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/objects.html\"&gt;Система типов YTsaurus&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В YTsaurus доступны составные типы данных: списки, словари, опциональные типы, структуры, кортежи. По умолчанию составные значения видны движком CH так же, как и тип &lt;code&gt;Any&lt;/code&gt;, т.е. в виде YSON-строки.&lt;/p&gt;\n&lt;p&gt;Если установить настройку &lt;code&gt;chyt.composite.enable_conversion&lt;/code&gt; в 1, CHYT начнёт преобразовывать составные типы (указанные в схеме, то есть, обладающие &lt;code&gt;type_v3&lt;/code&gt; типом) в соответствующие составные типы ClickHouse.&lt;/p&gt;\n&lt;p&gt;Пример запроса:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Запрос без включенного преобразования составных типов. Составные типы&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# видны как строки в binary YSON.&lt;/span&gt;\nyt --proxy &amp;lt;cluster_name&amp;gt; clickhouse execute &lt;span class=\"hljs-string\"&gt;'select * from `//home/user/sample_table_composite`'&lt;/span&gt; --format Vertical\nRow 1:\n──────\nlist:   [foo;bar;]\ndict:   [(бинарные нечитаемые символы)]\nstruct: [(бинарные нечитаемые символы)]\n\nRow 2:\n──────\nlist:   []\ndict:   []\nstruct: [(бинарные нечитаемые символы)]\n\n&lt;span class=\"hljs-comment\"&gt;# Запрос со включённым преобразованием.&lt;/span&gt;\nyt --proxy &amp;lt;cluster_name&amp;gt; clickhouse execute &lt;span class=\"hljs-string\"&gt;'select * from `//home/user/sample_table_composite`'&lt;/span&gt; --format Vertical --setting chyt.composite.enable_conversion=1 --format Vertical\nRow 1:\n──────\nlist:   [&lt;span class=\"hljs-string\"&gt;'foo'&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;'bar'&lt;/span&gt;]\ndict:   [(&lt;span class=\"hljs-string\"&gt;'key1'&lt;/span&gt;,42),(&lt;span class=\"hljs-string\"&gt;'key2'&lt;/span&gt;,-17)]\nstruct: (3.14,&lt;span class=\"hljs-string\"&gt;'pi'&lt;/span&gt;)\n\nRow 2:\n──────\nlist:   []\ndict:   []\nstruct: (0,&lt;span class=\"hljs-string\"&gt;''&lt;/span&gt;)\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"136\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-136\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-136\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-136.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;К сожалению, в отношении составных типов данных системы типов ClickHouse и YTsaurus довольно сильно разнятся. Перечислим ниже основные отличия.&lt;/p&gt;\n&lt;h3 id=\"optional\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/data-types.html#optional\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Optional-типы&lt;/span&gt;&lt;/a&gt;Optional-типы&lt;/h3&gt;\n&lt;p&gt;В системе типов YTsaurus любой тип &lt;code&gt;T&lt;/code&gt; может быть сделан опциональным путём окружения в &lt;code&gt;optional&amp;lt;T&amp;gt;&lt;/code&gt;, например, возможны типы данных &lt;code&gt;optional&amp;lt;optional&amp;lt;int64&amp;gt;&amp;gt;&lt;/code&gt;, &lt;code&gt;optional&amp;lt;list&amp;lt;string&amp;gt;&amp;gt;&lt;/code&gt; и &lt;code&gt;optional&amp;lt;tuple&amp;lt;int64, string&amp;gt;&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В ClickHouse возможности по помещению значений в &lt;code&gt;Nullable&lt;/code&gt; сильно ограничены. В частности, невозможно поместить в &lt;code&gt;Nullable&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;тип, который уже является &lt;code&gt;Nullable&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;массив (&lt;code&gt;Array&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;кортеж (&lt;code&gt;Tuple&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Таким образом, ни один из трёх примеров типов выше не имеет своего представления в системе типов ClickHouse.&lt;/p&gt;\n&lt;p&gt;Чтобы иметь возможность обрабатывать такие типы в CHYT, используется следующее преобразование.&lt;/p&gt;\n&lt;p&gt;Если тип &lt;code&gt;T&lt;/code&gt; соответствует типу &lt;code&gt;T'&lt;/code&gt; системе типов ClickHouse, а типа &lt;code&gt;Nullable(T')&lt;/code&gt; в CH не существует, &lt;code&gt;optional&amp;lt;T&amp;gt;&lt;/code&gt; отображается в &lt;code&gt;T'&lt;/code&gt; с заменой null на дефолтное значение для &lt;code&gt;T'&lt;/code&gt;. Примеры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;optional&amp;lt;optional&amp;lt;int64&amp;gt;&amp;gt;&lt;/code&gt; отображается в &lt;code&gt;Nullable(Int64)&lt;/code&gt;, причём два вида различных исходных &lt;code&gt;null&lt;/code&gt; склеиваются в один.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;optional&amp;lt;list&amp;lt;string&amp;gt;&amp;gt;&lt;/code&gt; отображается в &lt;code&gt;Array(String)&lt;/code&gt;, причём исходный &lt;code&gt;null&lt;/code&gt; превращается в пустой массив &lt;code&gt;[]&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;optional&amp;lt;tuple&amp;lt;int64, string&amp;gt;&amp;gt;&lt;/code&gt; отображается в &lt;code&gt;Tuple(Int64, String)&lt;/code&gt;, причём исходный &lt;code&gt;null&lt;/code&gt; превращается в кортеж из двух значений по умолчанию для Int64 и String, т.е. в кортеж &lt;code&gt;(0, '')&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"dict\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/data-types.html#dict\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Словари&lt;/span&gt;&lt;/a&gt;Словари&lt;/h3&gt;\n&lt;p&gt;В системе типов Яндекса для любых двух типов &lt;code&gt;K&lt;/code&gt; и &lt;code&gt;V&lt;/code&gt; возможно составить тип &lt;code&gt;dict&amp;lt;K, V&amp;gt;&lt;/code&gt;. В ClickHouse нет ничего, похожего на словари, поэтому &lt;code&gt;dict&amp;lt;K, V&amp;gt;&lt;/code&gt; отображается в &lt;code&gt;Array(Tuple(K', V'))&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;смотрите пример запроса выше: в первом значении в колонке &lt;code&gt;dict&lt;/code&gt; находится словарь &lt;code&gt;{'key1' -&amp;gt; 42, 'key2' -&amp;gt; -17}&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"tuple\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/data-types.html#tuple\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кортежи&lt;/span&gt;&lt;/a&gt;Кортежи&lt;/h3&gt;\n&lt;p&gt;Кортежи системы типов Яндекса отображаются в кортежи ClickHouse тривиальным образом.&lt;/p&gt;\n&lt;h3 id=\"structures\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/data-types.html#structures\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Структуры&lt;/span&gt;&lt;/a&gt;Структуры&lt;/h3&gt;\n&lt;p&gt;Структуры из системы типов Яндекса можно было бы отображать в именованные кортежи (&lt;code&gt;Named Tuple&lt;/code&gt;) CH. К сожалению, в ClickHouse есть проблемы с поддержкой именованных кортежей. Сейчас они поддерживаются только на внешнем уровне описания сложного типа (смотрите релевантный &lt;a href=\"https://github.com/ClickHouse/ClickHouse/issues/15587\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;issue&lt;/a&gt;). Таким образом, погрузить &lt;code&gt;Named Tuple&lt;/code&gt; внутрь, например, списка, не получится. Для упрощения реализации на текущий момент было принято решение отображать структуры в обычные кортежи.&lt;/p&gt;\n&lt;p&gt;Таким образом, со структурами можно работать как с кортежами, т.е. доставать из них элементы по индексу через &lt;code&gt;.1&lt;/code&gt;, &lt;code&gt;.2&lt;/code&gt;, и так далее, либо используя функцию &lt;code&gt;tupleElement&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt; yt --proxy &amp;lt;cluster_name&amp;gt; clickhouse execute &lt;span class=\"hljs-string\"&gt;'select toTypeName(struct), struct.1, struct.2  from `//home/user/sample_table_composite`'&lt;/span&gt; --format Vertical --setting chyt.composite.enable_conversion=1\nRow 1:\n──────\ntoTypeName(struct):      Tuple(Float64, String)\ntupleElement(struct, 1): 3.14\ntupleElement(struct, 2): pi\n\nRow 2:\n──────\ntoTypeName(struct):      Tuple(Float64, String)\ntupleElement(struct, 1): 0\ntupleElement(struct, 2):\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"216\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-216\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-216\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-216.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"tagged\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/data-types.html#tagged\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tagged типы&lt;/span&gt;&lt;/a&gt;Tagged типы&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;Tagged&lt;/code&gt; типы из общей системы типов Яндекса отображаются в соответствующие типы без тега. Информация о теге теряется.&lt;/p&gt;\n&lt;h3 id=\"var-any\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/data-types.html#var-any\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Variants, Named variants, Any&lt;/span&gt;&lt;/a&gt;Variants, Named variants, Any&lt;/h3&gt;\n&lt;p&gt;Варианты и именованные варианты никак не поддержаны, логика их отображения такая же, как если бы где-то внутри сложного типа встретилось значение типа &lt;code&gt;Any&lt;/code&gt;. А именно, любое значение типа &lt;code&gt;Variant&lt;/code&gt;, &lt;code&gt;Named Variant&lt;/code&gt;, &lt;code&gt;Any&lt;/code&gt; просто превращается в YSON-строку с представлением значения.&lt;/p&gt;\n&lt;h2 id=\"schema\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/data-types.html#schema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Советы по работе с недостаточно схематизированными данными&lt;/span&gt;&lt;/a&gt;Советы по работе с недостаточно схематизированными данными&lt;/h2&gt;\n&lt;p&gt;Ниже описано несколько приёмов, которые позволяют обходить некоторые проблемы с типами данных.&lt;/p&gt;\n&lt;p&gt;Многие таблицы содержат даты и времена в текстовом или числовом представлении (например, в формате ISO или Unix ts). Чтобы привести их к временн&lt;strong&gt;о&lt;/strong&gt;му типу данных, можно воспользоваться стандартными &lt;a href=\"https://clickhouse.com/docs/ru/sql-reference/functions/date-time-functions\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;функциями ClickHouse для работы с датой и временем&lt;/a&gt;, &lt;a href=\"https://clickhouse.com/docs/ru/sql-reference/functions/type-conversion-functions/#reinterpretasdate\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;reinterpret&lt;/a&gt;, а также &lt;a href=\"https://clickhouse.com/docs/ru/sql-reference/functions/type-conversion-functions/#type_conversion_function-cast\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;CAST&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Для работы с композитными данными (массивами, словарями, структурами) в YTsaurus исторически использовался тип данных &lt;code&gt;Any&lt;/code&gt;. Несмотря на появление поддержки составных типов в системе типов YTsaurus, многие старые данные по-прежнему остаются представленными в &lt;code&gt;Any&lt;/code&gt;: движку ClickHouse они будут доступны в виде бинарного YSON.&lt;/p&gt;\n&lt;p&gt;В свою очередь, для движка ClickHouse представление &lt;code&gt;Any&lt;/code&gt; в виде бинарного YSON почти ни о чём не говорит, так как поддержка YSON не встроена в ClickHouse. ClickHouse интерпретирует подобные данные просто в виде бинарной строки с каким-то пользовательским форматом. Поэтому слой совместимости ClickHouse и YTsaurus предоставляет ряд вспомогательных функций, позволяющих адресоваться по YSON-структуре с помощью &lt;a href=\"user-guide/storage/yson-docs.html\"&gt;языка YPath&lt;/a&gt;. А также интерпретировать её узлы как примитивные типы YTsaurus (&lt;code&gt;Int64&lt;/code&gt;, &lt;code&gt;UInt64&lt;/code&gt;, &lt;code&gt;Double&lt;/code&gt;, &lt;code&gt;Boolean&lt;/code&gt;), как строки (&lt;code&gt;String&lt;/code&gt;), либо как списки примитивных типов YTsaurus (&lt;code&gt;Array(Int64)&lt;/code&gt;, &lt;code&gt;Array(UInt64)&lt;/code&gt;, &lt;code&gt;Array(Double)&lt;/code&gt;, &lt;code&gt;Array(Boolean)&lt;/code&gt;) с приведением к соответствующему встроенному типу ClickHouse. Подробнее о данных функциях можно прочесть в разделе &lt;a href=\"user-guide/data-processing/chyt/reference/functions.html#yson_functions\"&gt;Функции для работы с YSON&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Конвертация из представления YTsaurus в представление ClickHouse неизбежно будет приводить к увеличению времени выполнения запроса.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/chyt/reference/data-types.md","sourcePath":"ru/user-guide/data-processing/chyt/reference/data-types.md"},"headings":[{"title":"Примитивные типы данных","href":"ru/user-guide/data-processing/chyt/reference/data-types.html#primitivnye-tipy-dannyh","level":2},{"title":"Составные типы данных","href":"ru/user-guide/data-processing/chyt/reference/data-types.html#sostavnye-tipy-dannyh","level":2,"items":[{"title":"Optional-типы","href":"ru/user-guide/data-processing/chyt/reference/data-types.html#optional","level":3},{"title":"Словари","href":"ru/user-guide/data-processing/chyt/reference/data-types.html#dict","level":3},{"title":"Кортежи","href":"ru/user-guide/data-processing/chyt/reference/data-types.html#tuple","level":3},{"title":"Структуры","href":"ru/user-guide/data-processing/chyt/reference/data-types.html#structures","level":3},{"title":"Tagged типы","href":"ru/user-guide/data-processing/chyt/reference/data-types.html#tagged","level":3},{"title":"Variants, Named variants, Any","href":"ru/user-guide/data-processing/chyt/reference/data-types.html#var-any","level":3}]},{"title":"Советы по работе с недостаточно схематизированными данными","href":"ru/user-guide/data-processing/chyt/reference/data-types.html#schema","level":2}],"title":"Типы данных"},"router":{"pathname":"ru/user-guide/data-processing/chyt/reference/data-types","depth":6,"base":"../../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T",
