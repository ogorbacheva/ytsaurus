        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Controller — это сервис, который берет на себя задачи по администрированию и поддержанию работоспособности приватных клик.&lt;/p&gt;\n&lt;h2 id=\"why\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/controller.html#why\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Решаемые задачи&lt;/span&gt;&lt;/a&gt;Решаемые задачи&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Персистентное хранение конфигурации клики.&lt;/li&gt;\n&lt;li&gt;Правильная генерация &lt;a href=\"user-guide/data-processing/chyt/reference/configuration.html\"&gt;конфигурации инстансов&lt;/a&gt; из предоставленной конфигурации клики и из конфигурации кластера YTsaurus.&lt;/li&gt;\n&lt;li&gt;Запуск и перезапуск Vanilla-операций клики в случае их аварийного завершения из-за неполадок или работ на кластере.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"cli\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/controller.html#cli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Controller CLI&lt;/span&gt;&lt;/a&gt;Controller CLI&lt;/h2&gt;\n&lt;p&gt;Работать с контроллером можно через Command Line Interface (CLI), предоставляемый в составе пакета &lt;code&gt;ytsaurus-client&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Множество &lt;a href=\"ru/user-guide/data-processing/chyt/cliques/controller.html#commands\"&gt;команд&lt;/a&gt; для работы с контроллером постоянно расширяется, и данная документация может не отражать всех доступных на данный момент команд. Посмотреть все доступные на данный момент команды можно с помощью &lt;code&gt;yt clickhouse ctl --help&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;У всех команд присутствует опциональный параметр &lt;code&gt;--proxy&lt;/code&gt;, через который можно задать кластер YTsaurus, на котором происходит работа с кликами:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt --proxy &amp;lt;cluster_name&amp;gt; clickhouse ctl list\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"42\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-42\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-42\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-42.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если аргумент пропущен, будет использовано значение по умолчанию из переменной окружения &lt;code&gt;YT_PROXY&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"access\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/controller.html#access\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Права на клику&lt;/span&gt;&lt;/a&gt;Права на клику&lt;/h2&gt;\n&lt;p&gt;Права на клику хранятся по пути &lt;code&gt;//sys/access_control_object_namespaces/chyt/&amp;lt;alias&amp;gt;/@principal_acl&lt;/code&gt;. Атрибут &lt;code&gt;@principal_acl&lt;/code&gt; замените на необходимые права:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;use&lt;/code&gt; — использовать клику (делать запросы);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;read&lt;/code&gt; — читать конфигурацию клики;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;manage&lt;/code&gt; — менять конфигурацию клики;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;remove&lt;/code&gt; — удалять клику.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"commands\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/controller.html#commands\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Команды&lt;/span&gt;&lt;/a&gt;Команды&lt;/h2&gt;\n&lt;h3 id=\"create\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/controller.html#create\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Create&lt;/span&gt;&lt;/a&gt;Create&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;yt clickhouse ctl create &amp;lt;alias&amp;gt;&lt;/code&gt; — создать клику с заданным алиасом (названием). Алиас клики должен удовлетворять свойствам идентификатора, т.е. состоять только из символов латинского алфавита, цифр и знака подчеркивания (&lt;code&gt;_&lt;/code&gt;), при этом алиас не может начинаться с цифры. Также допускается использование знака &lt;code&gt;*&lt;/code&gt; в начале (он просто игнорируется) и знака &lt;code&gt;-&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;После успешного выполнения команды в Кипарисе будет создан узел &lt;code&gt;//sys/strawberry/chyt/&amp;lt;alias&amp;gt;/speclet&lt;/code&gt;, в котором будет храниться конфигурация клики.&lt;/p&gt;\n&lt;p&gt;Также в веб интерфейсе у узла  &lt;code&gt;//sys/strawberry/chyt/&amp;lt;alias&amp;gt;&lt;/code&gt; будет отображаться текущее состояние клики, в том числе возможные ошибки, из-за которых не может быть запущена Vanilla-операция с инстансами клики.&lt;/p&gt;\n&lt;p&gt;После создания клики она находится в неактивном состоянии и еще не готова принимать и обрабатывать запросы. Чтобы активировать клику, ее необходимо сначала настроить с помощью соответствующих команд.&lt;/p&gt;\n&lt;h3 id=\"remove\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/controller.html#remove\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Remove&lt;/span&gt;&lt;/a&gt;Remove&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;yt clickhouse ctl remove &amp;lt;alias&amp;gt;&lt;/code&gt; — полностью удалить клику и ее персистентное состояние. После успешного завершения операции восстановить клику будет невозможно. Для выполнения операции необходимо обладать ролью &lt;strong&gt;Manage&lt;/strong&gt; на данную клику.&lt;/p&gt;\n&lt;h3 id=\"exists\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/controller.html#exists\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Exists&lt;/span&gt;&lt;/a&gt;Exists&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;yt clickhouse ctl exists &amp;lt;alias&amp;gt;&lt;/code&gt; — проверить существование клики на кластере. Результатом работы команды будет значение типа &lt;code&gt;bool&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Пример результата:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt clickhouse ctl exists test_clique_name\n%&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"107\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-107\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-107\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-107.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"status\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/controller.html#status\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Status&lt;/span&gt;&lt;/a&gt;Status&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;yt clickhouse ctl status &amp;lt;alias&amp;gt;&lt;/code&gt; — вернуть текущий статус клики.&lt;/p&gt;\n&lt;p&gt;Пример результата:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt clickhouse ctl status test_clique_name\n{\n    &lt;span class=\"hljs-string\"&gt;\"status\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"Waiting for restart: speclet changed\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"operation_state\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"running\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"operation_url\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"https://ytsaurus.ru/&amp;lt;cluster_name&amp;gt;/operations/de569537-f8cded7d-3fe03e8-b5278252\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"speclet_diff\"&lt;/span&gt; = {\n        &lt;span class=\"hljs-string\"&gt;\"enable_geodata\"&lt;/span&gt; = {\n            &lt;span class=\"hljs-string\"&gt;\"new_value\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n            &lt;span class=\"hljs-string\"&gt;\"old_value\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;;\n        };\n    };\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"117\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-117\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-117\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-117.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"list\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/controller.html#list\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List&lt;/span&gt;&lt;/a&gt;List&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;yt clickhouse ctl list&lt;/code&gt; — посмотреть алиасы все существующих на кластере клик.&lt;/p&gt;\n&lt;p&gt;Пример результата:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt clickhouse ctl list\n[\n    &lt;span class=\"hljs-string\"&gt;\"&amp;lt;clique_name_1&amp;gt;\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"&amp;lt;clique_name_2&amp;gt;\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"&amp;lt;clique_name_3&amp;gt;\"&lt;/span&gt;;\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"127\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-127\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-127\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-127.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"set_option\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/controller.html#set_option\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Set-option&lt;/span&gt;&lt;/a&gt;Set-option&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;yt clickhouse ctl set-option &amp;lt;key&amp;gt; &amp;lt;value&amp;gt; [--alias &amp;lt;alias&amp;gt;]&lt;/code&gt; — установить опцию &lt;code&gt;key&lt;/code&gt; в спеклете клики в значение &lt;code&gt;value&lt;/code&gt;. Для выполнения команды необходимо обладать ролью &lt;strong&gt;Manage&lt;/strong&gt; на данную клику.&lt;/p&gt;\n&lt;p&gt;Значение &lt;code&gt;value&lt;/code&gt; задается в виде произвольного YSON-значения. В частности, значение может быть:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;числом:&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt clickhouse ctl set-option instance_count 1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"144\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-144\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-144\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-144.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;boolean-значением. В синтаксисе YSON такие значения начинаются со знака &lt;code&gt;%&lt;/code&gt;:&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt clickhouse ctl set-option enable_geodata %&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"152\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-152\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-152\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-152.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;строкой-идентификатором:&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt clickhouse ctl set-option query_settings/chyt.execution.join_policy &lt;span class=\"hljs-built_in\"&gt;local&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"160\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-160\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-160\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-160.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;произвольной строкой. Если строка содержит символы, отличные от символов алфавита/цифр и знаков &lt;code&gt;_&lt;/code&gt; и &lt;code&gt;-&lt;/code&gt;, то чтобы значение было корректно распаршено как строка, необходимо обернуть его в двойные кавычки (&lt;code&gt;\"vot tak\"&lt;/code&gt;). При этом большинство популярных реализаций командной строки, такие как bash, zsh и т. д., парсят символ &lt;code&gt;\"&lt;/code&gt; как управляющий и могут передать в CLI значение без обрамляющих двойных кавычек. Чтобы обойти данную проблему, необходимо дополнительно обернуть аргумент в одинарные кавычки:&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt clickhouse ctl set-option chyt_version &lt;span class=\"hljs-string\"&gt;'\"stable-2.08\"'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"168\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-168\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-168\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-168.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опциональный аргумент &lt;code&gt;--alias &amp;lt;alias&amp;gt;&lt;/code&gt; задает алиас клики, к которой необходимо применить изменения. Данный аргумент может быть опущен, в таком случае его значение будет взято из переменной окружения &lt;code&gt;CHYT_ALIAS&lt;/code&gt;. Если и оно пусто, то будет возвращена ошибка.&lt;/p&gt;\n&lt;p&gt;Все выставленные опции можно посмотреть с помощью команды &lt;a href=\"ru/user-guide/data-processing/chyt/cliques/controller.html#get-speclet\"&gt;get-speclet&lt;/a&gt;. Описание всех доступных опций приведено в разделе &lt;a href=\"user-guide/data-processing/chyt/reference/configuration.html#options\"&gt;Конфигурация&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"remove_option\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/controller.html#remove_option\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Remove-option&lt;/span&gt;&lt;/a&gt;Remove-option&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;yt clickhouse ctl remove-option &amp;lt;key&amp;gt; [--alias &amp;lt;alias&amp;gt;]&lt;/code&gt; — удалить выставленное ранее значение опции в конфигурации клики. Отсутствующие опции в конфигурации клики будут заданы значениями по умолчанию при запуске операции клики.&lt;/p&gt;\n&lt;h3 id=\"get-speclet\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/controller.html#get-speclet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Get-speclet&lt;/span&gt;&lt;/a&gt;Get-speclet&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;yt clickhouse ctl get-speclet [--alias &amp;lt;alias&amp;gt;]&lt;/code&gt; — получить все выставленные для клики опции.&lt;/p&gt;\n&lt;p&gt;Пример результата:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt clickhouse ctl get-speclet --&lt;span class=\"hljs-built_in\"&gt;alias&lt;/span&gt; test_clique_name\n{\n    &lt;span class=\"hljs-string\"&gt;\"family\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"chyt\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"stage\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"production\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"instance_count\"&lt;/span&gt; = 8;\n    &lt;span class=\"hljs-string\"&gt;\"active\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"pool\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"chyt\"&lt;/span&gt;;\n    ...\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"190\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-190\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-190\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-190.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"set-speclet\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/controller.html#set-speclet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Set-speclet&lt;/span&gt;&lt;/a&gt;Set-speclet&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;yt clickhouse ctl set-speclet &amp;lt;speclet&amp;gt; [--alias &amp;lt;alias&amp;gt;]&lt;/code&gt; — задать спеклет клики в формате YSON-строки. Для выполнения команды необходимо обладать ролью &lt;strong&gt;manage&lt;/strong&gt; на данную клику.&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt clickhouse ctl set-speclet &lt;span class=\"hljs-string\"&gt;'{instance_count=2;pool=\"chyt\";}'&lt;/span&gt; --&lt;span class=\"hljs-built_in\"&gt;alias&lt;/span&gt; test_clique_name\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"200\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-200\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-200\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-200.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"start\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/controller.html#start\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Start&lt;/span&gt;&lt;/a&gt;Start&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;yt clickhouse ctl start &amp;lt;alias&amp;gt; [--untracked]&lt;/code&gt; — запустить ранее созданную клику.&lt;/p&gt;\n&lt;p&gt;Опция &lt;code&gt;untracked&lt;/code&gt; позволяет запустить клику без привязки к контроллеру и без каких-либо гарантий. Опция предназначена для запуска тестовых клик без использования вычислительного пула. Запуск production клик без указания вычислительного пула крайне не рекомендуется, так как клика может работать нестабильно. Клика будет запущена из-под имени пользователя. Контроллер не будет следить за состоянием такой клики и перезапускать ее в случае ошибок. В случае завершения операции клики с какими-либо ошибками необходимо будет самостоятельно перезапустить клику повторным выполнением данной команды.&lt;/p&gt;\n&lt;p&gt;Для выполнения команды необходимо обладать ролью &lt;strong&gt;manage&lt;/strong&gt; на данную клику.&lt;/p&gt;\n&lt;p&gt;Пример результата:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt clickhouse ctl start test_clique_name\n{\n    &lt;span class=\"hljs-string\"&gt;\"status\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"Ok\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"operation_state\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"initializing\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"operation_url\"&lt;/span&gt; = ...;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"216\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-216\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-216\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-216.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"stop\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/controller.html#stop\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Stop&lt;/span&gt;&lt;/a&gt;Stop&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;yt clickhouse ctl stop &amp;lt;alias&amp;gt;&lt;/code&gt; — остановить клику. Операция клики будет остановлена, все выделенные под клику ресурсы из пула будут освобождены. Конфигурация клики не будет удалена, в дальнейшем клика может быть перезапущена пользователем с помощью команды &lt;code&gt;start&lt;/code&gt;. Для выполнения команды необходимо обладать ролью &lt;strong&gt;manage&lt;/strong&gt; на данную клику.&lt;/p&gt;\n&lt;h2 id=\"options\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/controller.html#options\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Доступные опции&lt;/span&gt;&lt;/a&gt;Доступные опции&lt;/h2&gt;\n&lt;p&gt;Опции клики, доступные для установки через команду &lt;code&gt;set-option&lt;/code&gt;, можно посмотреть в разделе &lt;a href=\"user-guide/data-processing/chyt/reference/configuration.html#options\"&gt;Конфигурация&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/chyt/cliques/controller.md","sourcePath":"ru/user-guide/data-processing/chyt/cliques/controller.md"},"headings":[{"title":"Решаемые задачи","href":"ru/user-guide/data-processing/chyt/cliques/controller.html#why","level":2},{"title":"Controller CLI","href":"ru/user-guide/data-processing/chyt/cliques/controller.html#cli","level":2},{"title":"Права на клику","href":"ru/user-guide/data-processing/chyt/cliques/controller.html#access","level":2},{"title":"Команды","href":"ru/user-guide/data-processing/chyt/cliques/controller.html#commands","level":2,"items":[{"title":"Create","href":"ru/user-guide/data-processing/chyt/cliques/controller.html#create","level":3},{"title":"Remove","href":"ru/user-guide/data-processing/chyt/cliques/controller.html#remove","level":3},{"title":"Exists","href":"ru/user-guide/data-processing/chyt/cliques/controller.html#exists","level":3},{"title":"Status","href":"ru/user-guide/data-processing/chyt/cliques/controller.html#status","level":3},{"title":"List","href":"ru/user-guide/data-processing/chyt/cliques/controller.html#list","level":3},{"title":"Set-option","href":"ru/user-guide/data-processing/chyt/cliques/controller.html#set_option","level":3},{"title":"Remove-option","href":"ru/user-guide/data-processing/chyt/cliques/controller.html#remove_option","level":3},{"title":"Get-speclet","href":"ru/user-guide/data-processing/chyt/cliques/controller.html#get-speclet","level":3},{"title":"Set-speclet","href":"ru/user-guide/data-processing/chyt/cliques/controller.html#set-speclet","level":3},{"title":"Start","href":"ru/user-guide/data-processing/chyt/cliques/controller.html#start","level":3},{"title":"Stop","href":"ru/user-guide/data-processing/chyt/cliques/controller.html#stop","level":3}]},{"title":"Доступные опции","href":"ru/user-guide/data-processing/chyt/cliques/controller.html#options","level":2}],"title":"Controller"},"router":{"pathname":"ru/user-guide/data-processing/chyt/cliques/controller","depth":6,"base":"../../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
