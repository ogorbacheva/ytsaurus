        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Клика CHYT является Vanilla-операцией YTsaurus, а инстансы запускаются в джобах этой операции и потребляют ресурсы. Типичный инстанс CHYT запускается примерно на 10 ядрах CPU и около 60 ГБ оперативной памяти.&lt;/p&gt;\n&lt;p&gt;Перед чтением этой статьи рекомендуется ознакомиться со статьей &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;Планировщик и пулы&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"preemption\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/resources.html#preemption\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вытеснение&lt;/span&gt;&lt;/a&gt;Вытеснение&lt;/h2&gt;\n&lt;p&gt;Основополагающий механизм обеспечения честности распределения ресурсов в планировщике YTsaurus — вытеснение. Это означает, что если в какой-то момент операция начинает потреблять больше ресурсов, чем ей полагается, то любой ее джоб будет «вытеснен», то есть принудительно остановлен, а на его месте будет запущен кто-то, кому на самом деле полагаются ресурсы. Такой джоб называется &lt;em&gt;aborted-джобом&lt;/em&gt;, а причиной &lt;code&gt;abort&lt;/code&gt; указывается &lt;code&gt;preemption&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Для джобов обычных операций YTsaurus такой подход работает хорошо, т. к. типичный джоб в YTsaurus обладает продолжительностью в единицы минут, и потеря прогресса джоба не страшна — планировщик самостоятельно перезапустит джоб позже, когда под него найдутся ресурсы. Map-Reduce обладает задержками порядка минут, поэтому подобная ситуация абсолютно терпима.&lt;/p&gt;\n&lt;p&gt;В обстоятельствах CHYT всё несколько сложнее. Родной протокол ClickHouse не предусматривает механизма восстановления запросов, которые не выполнились из-за отказа какого-либо компонента во время исполнения. Это означает, что если на инстансе сейчас бегут запросы, а джобу, в котором запущен инстанс, прилетает &lt;code&gt;abort&lt;/code&gt;, то все исполняющиеся запросы упадут с ошибкой сетевого уровня (&lt;code&gt;NetException&lt;/code&gt;, &lt;code&gt;Attempt to read after eof&lt;/code&gt;, &lt;code&gt;Connection refused&lt;/code&gt; и другие). Клиенту к тому времени мог вернуться произвольный набор строк из ответа на запрос, что только усложняет задачу по перезапуску запроса.&lt;/p&gt;\n&lt;h2 id=\"interruption\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/resources.html#interruption\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Interruption&lt;/span&gt;&lt;/a&gt;Interruption&lt;/h2&gt;\n&lt;p&gt;В MR-джобах довольно давно используется механизм под названием &lt;em&gt;Interruption&lt;/em&gt;: если YTsaurus понимает, что скоро нужно прервать джоб, то он просто прекращает подавать джобу данные на вход. Если джоб успевает доработать за некоторый &lt;code&gt;interruption_timeout&lt;/code&gt;, то считается &lt;code&gt;completed&lt;/code&gt;, а недообработанные им данные будут поданы на вход какому-то другому новому джобу. Если же джоб не вписывается в &lt;code&gt;interruption_timeout&lt;/code&gt;, то он просто абортится, а его вход будет полностью обработан другим джобом.&lt;/p&gt;\n&lt;p&gt;Инстансы ClickHouse не обрабатывают никакой вход обычным для YTsaurus образом, самостоятельно исполняя запросы, приходящие из внешнего мира, поэтому информация о предстоящем interruption таким джобам приходит по-другому. Для CHYT поддерживается опция &lt;code&gt;interruption_signal&lt;/code&gt; в спецификации операции — сигнал, который будет послан джобу, чтобы уведомить его о скором завершении.&lt;/p&gt;\n&lt;p&gt;При получении сигнала инстанс переходит в режим завершения, рассылает с помощью gossip эту информацию остальным и больше не принимает никаких новых запросов, но продолжает исполнять уже выполняющиеся. После исполнения всех текущих запросов инстанс завершится со статусом &lt;code&gt;completed&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"preemption-dif\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/cliques/resources.html#preemption-dif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обычный preemption и graceful preemption&lt;/span&gt;&lt;/a&gt;Обычный preemption и graceful preemption&lt;/h2&gt;\n&lt;p&gt;В планировщике YTsaurus заложена следующая логика вытеснения джобов: если на ноде есть джобы, &lt;code&gt;fair_share&lt;/code&gt; операции которых меньше чем &lt;code&gt;usage_share&lt;/code&gt;, то данный джоб считается &lt;code&gt;preemptible&lt;/code&gt;. Если у планировщика есть джоб страдающей операции, который можно запустить на ноде при условии вытеснения preemptible джобов, то он так и делает — вытесняет нужное количество preemtable джобов и планирует новые на их месте. В такой модели непозволительно ждать вытеснения джобов очень долго, поэтому стандартный &lt;code&gt;interruption_timeout&lt;/code&gt; равняется всего 15 секундам.&lt;/p&gt;\n&lt;p&gt;Типичный сценарий использования CHYT — маленькие и средние запросы, которые выполняются от единиц секунд до нескольких минут; &lt;code&gt;interruption_timeout = 15 sec&lt;/code&gt; часто оказывается меньше времени работы стандартного запроса, а это значит, что многие запросы, которые выполнялись на данном инстансе, завершатся ошибкой.&lt;/p&gt;\n&lt;p&gt;Для борьбы с вытеснением инстансов можно запускать клику в пуле с гарантиями, но не у всех пользователей есть гарантии. Кроме того, некоторым пользователям важно, чтобы клика не мешала другим операциям в пуле — была маленькой, когда есть спрос на ресурсы в пуле, и раздувалась, когда есть лишние ресурсы.&lt;/p&gt;\n&lt;p&gt;Для решения данной задачи был добавлен новый режим планирования операций — &lt;em&gt;Graceful Preemption&lt;/em&gt;. Чтобы избежать проблемы вытеснения в данном режиме, вытеснение происходит заранее — если есть &lt;code&gt;preemptible&lt;/code&gt; джобы, им посылается сигнал завершения независимо от того, есть ли кандидат на эти ресурсы. Таким образом, операция самостоятельно стремится к тому, что &lt;code&gt;usage_share = fair_share&lt;/code&gt;, догоняя честное количество ресурсов, которое ей полагается в моменте. Благодаря этому можно повысить таймаут на вытеснение до 10 минут, так как никто не простаивает, ожидая освобождения ресурсов.&lt;/p&gt;\n&lt;p&gt;Ниже представлен пример изменения &lt;code&gt;usage_share&lt;/code&gt; (оранжевый график) и &lt;code&gt;fair_share&lt;/code&gt; (зеленый график) после старта операции с большим весом в том же пуле, что и клика.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/chyt_graceful_preemption.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;p&gt;Чтобы воспользоваться &lt;em&gt;Graceful Preemption&lt;/em&gt;, следует указать в параметре &lt;code&gt;--spec {preemption_mode = graceful}&lt;/code&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/chyt/cliques/resources.md","sourcePath":"ru/user-guide/data-processing/chyt/cliques/resources.md"},"headings":[{"title":"Вытеснение","href":"ru/user-guide/data-processing/chyt/cliques/resources.html#preemption","level":2},{"title":"Interruption","href":"ru/user-guide/data-processing/chyt/cliques/resources.html#interruption","level":2},{"title":"Обычный preemption и graceful preemption","href":"ru/user-guide/data-processing/chyt/cliques/resources.html#preemption-dif","level":2}],"title":"Ресурсы и вытеснение"},"router":{"pathname":"ru/user-guide/data-processing/chyt/cliques/resources","depth":6,"base":"../../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
