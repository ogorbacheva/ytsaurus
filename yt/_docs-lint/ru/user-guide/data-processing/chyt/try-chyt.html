        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Попробовать CHYT можно несколькими способами.&lt;/p&gt;\n&lt;p&gt;Самый простой способ — запустить запрос через веб-интерфейс Query Tracker. В качестве клики можно взять публичную клику c алиасом &lt;code&gt;ch_public&lt;/code&gt;. Это главная общедоступная клика, есть на каждом кластере присутствия CHYT.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В версиях YTsaurus 24.1 и ранее алиас клики указывается со звёздочкой в начале, например, &lt;code&gt;*ch_public&lt;/code&gt;. В текущей версии &lt;code&gt;*ch_public&lt;/code&gt; и &lt;code&gt;ch_public&lt;/code&gt; соответствуют одному алиасу.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;К публичной клике есть доступ у всех пользователей YTsaurus, поэтому есть риск, что она может быть недоступна из-за запросов других пользователей или занята чужими расчетами. В связи с этим не надо основывать важные процессы и дашборды на публичной клике. Публичная клика по сути является демо-версией CHYT. Для своей команды настоятельно рекомендуется поднимать отдельную клику.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"http\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/try-chyt.html#http\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HTTP-интерфейс&lt;/span&gt;&lt;/a&gt;HTTP-интерфейс&lt;/h2&gt;\n&lt;p&gt;Доступ к клике осуществляется через тяжёлые HTTP-прокси YTsaurus. Самый удобный способ обратиться к клике — отправить запрос на имя соответствующего кластера и обработать перенаправление (redirect). В случае утилиты cURL это означает, что необходимо указать флаг &lt;code&gt;--location-trusted&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Ниже смотрите пример, как задать с помощью утилиты cURL командной строки запрос к клике, зная имя кластера (&lt;code&gt;YT_PROXY&lt;/code&gt;), токен доступа к YTsaurus (&lt;code&gt;YT_TOKEN&lt;/code&gt;) и алиас клики (&lt;code&gt;CHYT_ALIAS&lt;/code&gt;).&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ curl --location-trusted -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/chyt?chyt.clique_alias=&lt;span class=\"hljs-variable\"&gt;$CHYT_ALIAS&lt;/span&gt;\"&lt;/span&gt; -d &lt;span class=\"hljs-string\"&gt;'SELECT Avg(a) FROM \"//sys/clickhouse/sample_table\"'&lt;/span&gt;\n224.30769230769232\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"35\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-35\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-35\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-35.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"clique_alias_specification\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/try-chyt.html#clique_alias_specification\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как указать алиас клики&lt;/span&gt;&lt;/a&gt;Как указать алиас клики&lt;/h3&gt;\n&lt;p&gt;Алиас клики можно указать в специальном url-параметре &lt;code&gt;chyt.clique_alias&lt;/code&gt; (см. пример выше), либо в поле &lt;code&gt;user&lt;/code&gt; любым из способов авторизации (информация о фактическом пользователе содержится внутри токена). Например &lt;code&gt;http://cluster.domain.com/chyt?user=my-clique&amp;amp;password=my-token&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Не допускается аутентификация (алиас клики + токен) через разные связки параметров. Например, следующий запрос содержит ошибку: &lt;code&gt;-H 'X-ClickHouse-User: my-clique' 'http://cluster.domain.com/chyt?password=my-token'&lt;/code&gt; (алиас указан в заголовках &lt;code&gt;X-ClickHouse-User/Key&lt;/code&gt;, а токен url-параметрах &lt;code&gt;user/password&lt;/code&gt;)&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В старой версии запросы идут по пути &lt;code&gt;http://$YT_PROXY/query&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;При обращении к CHYT по устаревшему пути &lt;code&gt;/query&lt;/code&gt; алиас передаётся через url-параметр &lt;code&gt;database&lt;/code&gt;. При обращении по актуальному пути &lt;code&gt;/chyt&lt;/code&gt; алиас берётся из &lt;code&gt;user&lt;/code&gt; или из url-параметра &lt;code&gt;chyt.clique_alias&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"chyt_port\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/try-chyt.html#chyt_port\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эксклюзивный порт для подключения&lt;/span&gt;&lt;/a&gt;Эксклюзивный порт для подключения&lt;/h3&gt;\n&lt;p&gt;Не все клиенты поддерживают кастомные пути. Поэтому, на HTTP Proxy могут быть сконфигурированы специальные порты для обращения к CHYT, которые не требуют указания кастомных путей. Конкретные номера выделенных портов стоит уточнить у администратора YTsaurus кластера. Про то, как настроить такие порты, будет написано в ближайшее время.&lt;/p&gt;\n&lt;h2 id=\"odbc\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/try-chyt.html#odbc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ODBC-интерфейс&lt;/span&gt;&lt;/a&gt;ODBC-интерфейс&lt;/h2&gt;\n&lt;p&gt;CHYT можно пользоваться из Tableau посредством &lt;a href=\"https://github.com/ClickHouse/clickhouse-odbc\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Clickhouse ODBC Driver&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Для этого достаточно составить ODBC-конфигурацию, представленную ниже. Переменная &lt;code&gt;YT_TOKEN&lt;/code&gt; обозначает токен доступа к YTsaurus (&lt;code&gt;AQAD-qJ…&lt;/code&gt;), &lt;code&gt;CHYT_ALIAS&lt;/code&gt; — алиас клики (&lt;code&gt;ch_public&lt;/code&gt;), &lt;code&gt;YT_PROXY&lt;/code&gt; — имя кластера.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;[ClickHouse]\nDriver = &amp;lt;path to driver libclickhouseodbc&amp;gt;\n&lt;span class=\"hljs-comment\"&gt;# For example /usr/local/opt/clickhouse-odbc/lib/libclickhouseodbc.dylib&lt;/span&gt;\nuser = &lt;span class=\"hljs-variable\"&gt;$CHYT_ALIAS&lt;/span&gt;\npassword = &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\nurl = http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/chyt\nport = 80\n&lt;span class=\"hljs-comment\"&gt;# trace = 1&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# TraceFile=/tmp/odbc.log&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"80\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-80\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-80\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-80.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Ниже представлен пример, как обратиться к CHYT через ODBC-интерфейс из командной строки, используя утилиту &lt;a href=\"https://en.wikipedia.org/wiki/UnixODBC\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;isql&lt;/a&gt;. Для этого необходимо записать файл с конфигурацией &lt;code&gt;~/.odbc.ini&lt;/code&gt;, поставить Clickhouse ODBC драйвер из официального репозитория и воспользоваться утилитой isql.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;isql -v clickhouse\n+---------------------------------------+\n| Connected!                            |\n|                                       |\n| sql-statement                         |\n| &lt;span class=\"hljs-built_in\"&gt;help&lt;/span&gt; [tablename]                      |\n| quit                                  |\n|                                       |\n+---------------------------------------+\nSQL&amp;gt; SELECT * FROM &lt;span class=\"hljs-string\"&gt;\"//tmp/sample_table\"&lt;/span&gt;\n+--+\n| a|\n+--+\n| 2|\n| 9|\n| 6|\n| 4|\n| 8|\n| 3|\n| 1|\n| 5|\n| 7|\n| 0|\n+--+\nSQLRowCount returns 10\n10 rows fetched\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"84\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-84\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-84\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-84.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"jdbc\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/try-chyt.html#jdbc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;JDBC-интерфейс&lt;/span&gt;&lt;/a&gt;JDBC-интерфейс&lt;/h2&gt;\n&lt;p&gt;JDBC-драйвер конфигурируется схожим образом с ODBC-драйвером, смотрите пример ниже. Переменная &lt;code&gt;YT_TOKEN&lt;/code&gt; обозначает токен доступа к YTsaurus (&lt;code&gt;AQAD-qJ…&lt;/code&gt;),  &lt;code&gt;CHYT_ALIAS&lt;/code&gt; — идентификатор либо алиас клики (&lt;code&gt;ch_public&lt;/code&gt;), &lt;code&gt;YT_PROXY&lt;/code&gt; — имя кластера.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;JDBC URL = jdbc:clickhouse://{host}:{port}/chyt?chyt.clique_alias={clique_alias}\nhost = &lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;\nuser = &lt;span class=\"hljs-variable\"&gt;$CHYT_ALIAS&lt;/span&gt;\npassword = &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\nport = 80\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"91\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-91\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-91\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-91.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Кроме того, необходимо изменить свойства драйвера:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;check_for_redirects=true&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;use_path_as_db=false&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;JDBC-драйвер можно использовать как основу при использовании open-source программы для работы с базами данных &lt;a href=\"https://dbeaver.io\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;DBeaver&lt;/a&gt;. Тестирование проводилось на версии DBeaver 6.1.5. В случае если ClickHouse-JDBC драйвер не устанавливается автоматически, его необходимо &lt;a href=\"https://github.com/yandex/clickhouse-jdbc\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;скачать&lt;/a&gt; вручную. При этом необходимо использовать версию драйвера старше 0.1.55.&lt;/p&gt;\n&lt;h2 id=\"cli-and-api\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/try-chyt.html#cli-and-api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CLI и Python API&lt;/span&gt;&lt;/a&gt;CLI и Python API&lt;/h2&gt;\n&lt;p&gt;У CHYT есть официальный API для языка Python и официальная утилита командной строки. Подробнее можно прочитать &lt;a href=\"user-guide/data-processing/chyt/cli-and-api.html\"&gt;CLI и Python API&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/chyt/try-chyt.md","sourcePath":"ru/user-guide/data-processing/chyt/try-chyt.md"},"headings":[{"title":"HTTP-интерфейс","href":"ru/user-guide/data-processing/chyt/try-chyt.html#http","level":2,"items":[{"title":"Как указать алиас клики","href":"ru/user-guide/data-processing/chyt/try-chyt.html#clique_alias_specification","level":3},{"title":"Эксклюзивный порт для подключения","href":"ru/user-guide/data-processing/chyt/try-chyt.html#chyt_port","level":3}]},{"title":"ODBC-интерфейс","href":"ru/user-guide/data-processing/chyt/try-chyt.html#odbc","level":2},{"title":"JDBC-интерфейс","href":"ru/user-guide/data-processing/chyt/try-chyt.html#jdbc","level":2},{"title":"CLI и Python API","href":"ru/user-guide/data-processing/chyt/try-chyt.html#cli-and-api","level":2}],"title":"Как попробовать"},"router":{"pathname":"ru/user-guide/data-processing/chyt/try-chyt","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
