        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;CHYT powered by ClickHouse&lt;/strong&gt; — это технология, которая позволяет поднять кластер из серверов ClickHouse непосредственно на вычислительных узлах YTsaurus.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://clickhouse.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ClickHouse&lt;/a&gt; поднимается внутри Vanilla-операции и работает с данными, которые лежат в YTsaurus. Такая операция называется &lt;em&gt;кликой&lt;/em&gt; (подробнее можно прочитать в разделе &lt;a href=\"user-guide/data-processing/chyt/general.html#what-is\"&gt;Концепции&lt;/a&gt;). Клики бывают публичные (доступные всем пользователям) и приватные (личная клика пользователя или команды). Публичная клика &lt;code&gt;ch_public&lt;/code&gt; — основная общедоступная клика, запущенная на каждом кластере YTsaurus.&lt;/p&gt;\n&lt;h2 id=\"advantages\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/about-chyt.html#advantages\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основные преимущества&lt;/span&gt;&lt;/a&gt;Основные преимущества&lt;/h2&gt;\n&lt;p&gt;Подавляющее большинство родной функциональности ClickHouse доступно в CHYT. Ознакомиться с богатыми возможностями ClickHouse можно в &lt;a href=\"https://clickhouse.com/docs/ru/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;официальной документации&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Помимо этого есть следующие плюсы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Не нужно копировать данные из YTsaurus в ClickHouse.&lt;/li&gt;\n&lt;li&gt;Можно использовать вычислительную квоту в YTsaurus для быстрых вычислений.&lt;/li&gt;\n&lt;li&gt;Можно быстро проводить вычисления над данными в YTsaurus небольшого и среднего объемов (до 1 ТБ), до 100 раз быстрее чем запуск MapReduce операции.&lt;/li&gt;\n&lt;li&gt;Поддерживается работа со &lt;a href=\"user-guide/storage/static-tables.html\"&gt;статическими таблицами&lt;/a&gt; и &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;динамическими таблицами&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"disadvantages\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/about-chyt.html#disadvantages\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения&lt;/span&gt;&lt;/a&gt;Ограничения&lt;/h2&gt;\n&lt;p&gt;Обрабатываемые таблицы должны быть &lt;a href=\"user-guide/storage/static-schema.html\"&gt;схематизированы&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/chyt/about-chyt.md","sourcePath":"ru/user-guide/data-processing/chyt/about-chyt.md"},"headings":[{"title":"Основные преимущества","href":"ru/user-guide/data-processing/chyt/about-chyt.html#advantages","level":2},{"title":"Ограничения","href":"ru/user-guide/data-processing/chyt/about-chyt.html#disadvantages","level":2}],"title":"CHYT"},"router":{"pathname":"ru/user-guide/data-processing/chyt/about-chyt","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
