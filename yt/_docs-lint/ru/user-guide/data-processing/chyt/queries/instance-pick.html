        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Тяжёлая прокси получает запрос от пользователя и делегирует его одному из инстансов, который называется «координатором». Пользователь может повлиять на стратегию выбора, например, для эффективного использования кеша.&lt;/p&gt;\n&lt;p&gt;Ниже перечислены различные стратегии выбора координатора в порядке убывания приоритетности (при попытке включить несколько стратегий будет выбрана более приоритетная):&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Выбор конкретного инстанса.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Нужно добавить &lt;code&gt;job-cookie&lt;/code&gt; интересующего инстанса к алиасу клики через символ &lt;code&gt;@&lt;/code&gt;. Например, для инстанса с &lt;code&gt;job-cookie=3&lt;/code&gt; получится запрос такого вида &lt;code&gt;http://cluster.domain.com/chyt?chyt.clique_alias=my-clique@3&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Выбор инстанса в пределах сессии.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;В пределах одной ClickHouse-сессии прокси будет* выбирать один и тот же инстанс.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;*Если в последние несколько минут не происходило перезапуска инстансов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сессия определяется url-параметром &lt;code&gt;session_id&lt;/code&gt; (так же как в оригинальном ClickHouse). Таким образом получается запрос вида &lt;code&gt;http://cluster.domain.com/chyt?chyt.clique_alias=my-clique&amp;amp;session_id=abracadabra&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Стратегия StickyGroup.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Параметр &lt;code&gt;QueryStickyGroupSize&lt;/code&gt; можно указать либо в конфигурации клики, либо передавать вместе в запросом в url-параметре &lt;code&gt;chyt.query_sticky_group_size&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В таком случае прокси будет делегировать одинаковые запросы группе инстансов размера &lt;code&gt;QueryStickyGroupSize&lt;/code&gt;, то есть один и тот же запрос будет попадать в случайный инстанс из этой группы.&lt;/p&gt;\n&lt;p&gt;Выбор значения &lt;code&gt;QueryStickyGroupSize&lt;/code&gt; может быть основан на следующих рассуждениях: при маленьких значениях кеш в выделенной группе прогревается быстро, а при больших — группа почти не страдает в случае выпадения одного инстанса, т. к. кеш большинства инстансов сохранится.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Выбор случайного инстанса.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;За отсутствием других стратегий координатор выбирается равновероятно среди всех доступных инстансов.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/chyt/queries/instance-pick.md","sourcePath":"ru/user-guide/data-processing/chyt/queries/instance-pick.md"},"headings":[],"title":"Выбор координатора"},"router":{"pathname":"ru/user-guide/data-processing/chyt/queries/instance-pick","depth":6,"base":"../../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
