        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"obrabotka-dannyh\"&gt;&lt;a href=\"ru/user-guide/data-processing/overview.html#obrabotka-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обработка данных&lt;/span&gt;&lt;/a&gt;Обработка данных&lt;/h2&gt;\n&lt;p&gt;В данном разделе рассказывается, как устроен запуск вычислений и обработка данных в кластере YTsaurus.&lt;/p&gt;\n&lt;p&gt;Вычисления в кластере производятся распределённо, логической единицей вычисления является &lt;strong&gt;операция&lt;/strong&gt;. Большинство операций имеет набор входных и выходных таблиц и производит некоторую обработку данных из входных таблиц с сохранением результатов в выходную таблицу. Например, операция может производить сортировку таблицы &lt;code&gt;A&lt;/code&gt; c cохранением результата в таблицу &lt;code&gt;B&lt;/code&gt;, или операция может исполнять пользовательский код, обрабатывающий данные построчно из таблицы &lt;code&gt;A&lt;/code&gt; с записью результата в таблицу &lt;code&gt;B&lt;/code&gt;. Также YTsaurus позволяет запускать операции, которые распределённо выполняют указанную bash-команду, например запуск указанного пользователем исполняемого файла. Такая возможность полезна, например, для запуска распределённых ML-обучений в кластере.&lt;/p&gt;\n&lt;p&gt;Операции бывают &lt;a href=\"ru/user-guide/data-processing/operations/overview#obzor\"&gt;разных типов&lt;/a&gt;, в частности они реализуют парадигму &lt;a href=\"https://en.wikipedia.org/wiki/MapReduce\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MapReduce&lt;/a&gt; распределённой обработки данных.&lt;/p&gt;\n&lt;p&gt;Операция состоит из &lt;strong&gt;джобов&lt;/strong&gt;, которые исполняются на кластере параллельно и, как правило, независимо. Каждый джоб исполняется на одной из нод кластера и представляет из себя изолированный процесс, выполняющий часть общего вычисления. Для запуска джоба выделяется &lt;strong&gt;аллокация&lt;/strong&gt; на ноде. Аллокация – это логическая сущность, характеризующаяся набором вычислительных ресурсов: оперативной памятью, CPU и прочими. Дальше в рамках аллокации происходит исполнение джоба данной операции.&lt;/p&gt;\n&lt;p&gt;Общая концепция и устройство системы обработки данных YTsaurus имеет сходство с такими системами как:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://hadoop.apache.org/docs/r1.2.1/mapred_tutorial.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Hadoop MapReduce&lt;/a&gt; и &lt;a href=\"https://hadoop.apache.org/docs/stable/hadoop-yarn/hadoop-yarn-site/YARN.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apache YARN&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://mesos.apache.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apache Mesos&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Обратите внимание на терминологические различия YTsaurus и Hadoop: операция в YTsaurus соответствует понятию Job в системе Hadoop, а джоб в YTsaurus соответствует понятию Task в системе Hadoop.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"arhitektura\"&gt;&lt;a href=\"ru/user-guide/data-processing/overview.html#arhitektura\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Архитектура&lt;/span&gt;&lt;/a&gt;Архитектура&lt;/h2&gt;\n&lt;p&gt;В выполнении вычислений на кластере участвуют следующие компоненты: планировщик, контроллер-агенты и exec-ноды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/data_processing_overview.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Планировщик&lt;/strong&gt; является центральной точкой: он хранит информацию обо всех операциях, решает задачу выделения новых аллокаций для операций и реализует модель иерархического распределения ресурсов.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Контроллер-агенты&lt;/strong&gt; отвечают за планирование джобов конкретных операций. В них сосредоточена логика, которая формирует план исполнения операции, то есть разбиение операции на конкретные джобы. Текущая реализация позволяет корректно переживать потерю отдельных джобов и обеспечивает транзакционность выполнения операций.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Exec-нода&lt;/strong&gt; – это процесс, который запущен на всех вычислительных узлах кластера. Он занимается выполнением конкретных джобов в рамках аллокаций, подготавливает окружение для исполнения джоба и обеспечивает изоляцию джобов между собой.&lt;/p&gt;\n&lt;p&gt;В любой момент времени в кластере есть:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;один активный планировщик, который выполняет всю работу по выделению новых аллокаций;&lt;/li&gt;\n&lt;li&gt;несколько независимых контроллер-агентов, которые занимаются планированием операций;&lt;/li&gt;\n&lt;li&gt;набор exec-нод, отвечающих за непосредственное выполнение вычислений.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Планировщик и контроллер-агенты хранят своё состояние в Кипарисе, exec-ноды фактически не имеют персистентного состояния и могут сводобно добавляться и удаляться из кластера.&lt;/p&gt;\n&lt;p&gt;Упрощенно опишем общую схему взаимодействия компонент.&lt;/p&gt;\n&lt;p&gt;Планировщик предоставляет API для запуска новых операций и управления уже выполняющимися операциями. Также он с некоторой периодичностью зачитывает свою конфигурацию и иерархию &lt;a href=\"ru/user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;пулов&lt;/a&gt; из Кипариса. Кроме того, планировщик использует Кипарис как persistent storage для хранения мета-состояния операции. Мета-состояние – это небольшой набор атрибутов операции, которые необходимы для обеспечения транзакционности и отказоустойчивости.&lt;/p&gt;\n&lt;p&gt;При запуске операции планировщик инициализирует состояние операции в Кипарисе и назначает операции контроллер-агента, который будет заниматься планированием джобов этой операции.&lt;/p&gt;\n&lt;p&gt;Каждая exec-нода кластера периодически посылает хартбиты (heartbeats) в планировщик, сообщает ему о статусе выделенных аллокаций и получает информацию о новых аллокациях, а также о необходимости вытеснить какие-то имеющиеся аллокации и прервать соответствующие джобы. Кроме того, exec-нода отправляет хартбиты в каждый из контроллер-агентов, сообщает им статус текущих запущенных джобов и получает спецификации для запуска новых джобов.&lt;/p&gt;\n&lt;h2 id=\"vozmozhnosti-i-svojstva\"&gt;&lt;a href=\"ru/user-guide/data-processing/overview.html#vozmozhnosti-i-svojstva\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Возможности и свойства&lt;/span&gt;&lt;/a&gt;Возможности и свойства&lt;/h2&gt;\n&lt;p&gt;Ниже описано, какими свойствами обладает система обработки данных YTsaurus и какие возможности она предоставляет пользователям.&lt;/p&gt;\n&lt;h3 id=\"otkazoustojchivost\"&gt;&lt;a href=\"ru/user-guide/data-processing/overview.html#otkazoustojchivost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Отказоустойчивость&lt;/span&gt;&lt;/a&gt;Отказоустойчивость&lt;/h3&gt;\n&lt;p&gt;YTsaurus гарантирует надёжность и доступность системы обработки данных. Это означает, что при выходе из строя отдельных компонент система умеет восстанавливаться и продолжать свою работу. При этом может теряться прогресс конкретных операций, но сами операции надёжно сохраняются в Кипарисе и при восстановлении учитываются планировщиком.&lt;/p&gt;\n&lt;p&gt;Также система стремится минимизировать потерю прогресса запущенных вычислений. Детальнее про это написано в отдельном &lt;a href=\"ru/user-guide/data-processing/reliability\"&gt;документе&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"masshtabiruemost\"&gt;&lt;a href=\"ru/user-guide/data-processing/overview.html#masshtabiruemost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Масштабируемость&lt;/span&gt;&lt;/a&gt;Масштабируемость&lt;/h3&gt;\n&lt;p&gt;Система позволяет прозрачно добавлять в кластер новые exec-ноды и тем самым наращивать объём вычислительных мощностей. Кроме того, имеется возможность наращивать группировку контроллер-агентов — это необходимо при масштабировании числа исполняемых операций в кластере.&lt;/p&gt;\n&lt;p&gt;Крупнейшие инсталляции YTsaurus кластеров обслуживают более 1M CPU и позволяют исполнять одновременно десятки тысяч операций.&lt;/p&gt;\n&lt;p&gt;Отметим, что так как активный планировщик представляет из себя один процесс, то система все же ограничена в возможностях к масштабированию. Подробней узнать про масштабируемость планировщика можно в &lt;a href=\"https://smartdataconf.ru/talks/4ea723aa063743abbf850571446f9695\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;докладе&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"upravlenie-resursami\"&gt;&lt;a href=\"ru/user-guide/data-processing/overview.html#upravlenie-resursami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Управление ресурсами&lt;/span&gt;&lt;/a&gt;Управление ресурсами&lt;/h3&gt;\n&lt;p&gt;Планировщик предоставляет богатый API для распределения ресурсов между пользователями и проектами. Единицей управления является &lt;strong&gt;пул&lt;/strong&gt;, все пулы образуют иерархию, называемую &lt;strong&gt;деревом пулов&lt;/strong&gt;. В рамках пула можно настраивать гарантированные ресурсы, управлять весами, указывать лимиты и различные настройки &lt;a href=\"ru/user-guide/data-processing/scheduler/preemption.html\"&gt;вытеснения&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Детальнее про алгоритм распределения ресурсов написано в разделе &lt;a href=\"ru/user-guide/data-processing/scheduler/scheduler-and-pools\"&gt;Планировщик и пулы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"geterogennost-resursov\"&gt;&lt;a href=\"ru/user-guide/data-processing/overview.html#geterogennost-resursov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гетерогенность ресурсов&lt;/span&gt;&lt;/a&gt;Гетерогенность ресурсов&lt;/h3&gt;\n&lt;p&gt;Кластер YTsaurus умеет работать с гетерогенными exec-нодами и гетерогенными требованиями ресурсов в запускаемых джобах. Например, в кластере могут одновременно исполняться и вычисления, требующие большого количества оперативной памяти, и CPU-intensive вычисления.&lt;/p&gt;\n&lt;p&gt;При этом система стремится быть реактивной, то есть как можно быстрее запускать джобы на свободных ресурсах, а задача эффективной упаковки решается во вторую очередь. Поэтому в случае сильных перекосов нагрузки возможна фрагментация ресурсов на кластере.&lt;/p&gt;\n&lt;h3 id=\"podderzhka-gpu\"&gt;&lt;a href=\"ru/user-guide/data-processing/overview.html#podderzhka-gpu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поддержка GPU&lt;/span&gt;&lt;/a&gt;Поддержка GPU&lt;/h3&gt;\n&lt;p&gt;Exec-ноды кластера умеют исполнять вычисления, требующие GPU. Кроме того, планировщику можно сообщить топологию GPU-хостов и он будет учитывать её при планировании &lt;a href=\"https://en.wikipedia.org/wiki/Gang_scheduling\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;gang-операций&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;В модели ресурсов планировщика GPU представлены целым числом, обозначающим количество устройств, — например, общее количество GPU на ноде или количество GPU, требуемое джобом. По этой причине, ноды с разными типами GPU рекомендуется выделять в отдельные &lt;a href=\"ru/user-guide/data-processing/scheduler/scheduler-and-pools#puly-i-derevya-pulov\"&gt;деревья пулов&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"raznoobraznye-interfejsy-obrabotki-dannyh\"&gt;&lt;a href=\"ru/user-guide/data-processing/overview.html#raznoobraznye-interfejsy-obrabotki-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Разнообразные интерфейсы обработки данных&lt;/span&gt;&lt;/a&gt;Разнообразные интерфейсы обработки данных&lt;/h3&gt;\n&lt;p&gt;Система обработки данных YTsaurus не только реализует парадигму MapReduce, но и позволяет поверх общих вычислительных ресурсов запускать другие приложения для обработки данных. Например, поверх YTsaurus можно запускать &lt;a href=\"ru/yql\"&gt;YQL&lt;/a&gt;-запросы, поднимать &lt;a href=\"ru/user-guide/data-processing/chyt/about-chyt\"&gt;ClickHouse-клики&lt;/a&gt; и &lt;a href=\"ru/user-guide/data-processing/spyt/overview\"&gt;Spark-кластеры&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/overview.md","sourcePath":"ru/user-guide/data-processing/overview.md"},"headings":[{"title":"Обработка данных","href":"ru/user-guide/data-processing/overview.html#obrabotka-dannyh","level":2},{"title":"Архитектура","href":"ru/user-guide/data-processing/overview.html#arhitektura","level":2},{"title":"Возможности и свойства","href":"ru/user-guide/data-processing/overview.html#vozmozhnosti-i-svojstva","level":2,"items":[{"title":"Отказоустойчивость","href":"ru/user-guide/data-processing/overview.html#otkazoustojchivost","level":3},{"title":"Масштабируемость","href":"ru/user-guide/data-processing/overview.html#masshtabiruemost","level":3},{"title":"Управление ресурсами","href":"ru/user-guide/data-processing/overview.html#upravlenie-resursami","level":3},{"title":"Гетерогенность ресурсов","href":"ru/user-guide/data-processing/overview.html#geterogennost-resursov","level":3},{"title":"Поддержка GPU","href":"ru/user-guide/data-processing/overview.html#podderzhka-gpu","level":3},{"title":"Разнообразные интерфейсы обработки данных","href":"ru/user-guide/data-processing/overview.html#raznoobraznye-interfejsy-obrabotki-dannyh","level":3}]}],"title":""},"router":{"pathname":"ru/user-guide/data-processing/overview","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
