        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"limity-na-kolichestvo-operacij\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/operations-limits.html#limity-na-kolichestvo-operacij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Лимиты на количество операций&lt;/span&gt;&lt;/a&gt;Лимиты на количество операций&lt;/h2&gt;\n&lt;p&gt;В системе YTsaurus существуют лимиты на число запускаемых операций в вычислительных пулах. Данные лимиты выступают защитным механизмом, ограничивая нагрузку на планировщик. Лимиты на количество операций бывают двух типов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Лимит на общее количество операций (&lt;code&gt;total_operation_count&lt;/code&gt;). Ограничивает нагрузку на поддержание состояния дерева пулов и периодический пересчет fair share.&lt;/li&gt;\n&lt;li&gt;Лимит на количество выполняющихся операций (&lt;code&gt;running_operation_count&lt;/code&gt;). Ограничивает нагрузку на планирование запуска новых аллокаций.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Если при запуске операции в пуле достигнут лимит на общее количество операций, то команда &lt;code&gt;start_operation&lt;/code&gt; завершится ошибкой. Если операция успешно запустилась, но при этом в пуле достигнут лимит на количество выполняющихся операций, операция перейдет в состояние &lt;code&gt;pending&lt;/code&gt;, добавится в очередь и будет ждать завершения текущих выполняющихся операций. В иерархической структуре пулов операция учитывается в лимитах всех своих пулов-предков, и описанные правила применяются, если достигнут лимит хотя бы в одном из них. В общем случае лимиты в разных пулах не зависят друг от друга. Возможна ситуация, при которой сумма лимитов в дочерних пулах превосходит лимит в родительском пуле.&lt;/p&gt;\n&lt;h3 id=\"legkovesnye-operacii\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/operations-limits.html#legkovesnye-operacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Легковесные операции&lt;/span&gt;&lt;/a&gt;Легковесные операции&lt;/h3&gt;\n&lt;p&gt;Основную нагрузку на планировщик создает обработка хартбитов от exec-нод и планирование новых аллокаций. Объем этой работы напрямую зависит от количества операций, которые в данный момент участвуют в процессе планирования. Такие операции называются &lt;code&gt;schedulable&lt;/code&gt;. К примеру, выполняющаяся операция может не быть &lt;code&gt;schedulable&lt;/code&gt;, если у неё уже запущены все необходимые аллокации. Поскольку статус &lt;code&gt;schedulable&lt;/code&gt; может меняться в ходе выполнения операции, сложно ограничить количество таких операций. Поэтому для ограничения нагрузки используется консервативный лимит на количество выполняющихся операций.&lt;/p&gt;\n&lt;p&gt;Некоторые операции могут не быть &lt;code&gt;schedulable&lt;/code&gt; большую часть времени своей работы. К примеру, операция может состоять из единственного небольшого джоба, который запускается планировщиком достаточно быстро. В вышеописанной схеме подобные операции будут “вхолостую” занимать место в лимите на выполняющиеся операции, которое может быть ценным ресурсом в крупных инсталляциях YTsaurus. Специально для такого случая существует особый тип операций — &lt;em&gt;легковесные операции&lt;/em&gt;. Такие операции не учитываются в счетчике &lt;code&gt;running_operation_count&lt;/code&gt;, соответственно, к ним не применяется лимит на количество выполняющихся операций. Легковесные операции по-прежнему учитываются в &lt;code&gt;total_operation_count&lt;/code&gt;, а также в специальном счетчике &lt;code&gt;lightweight_running_operation_count&lt;/code&gt;, на который нет ограничений.&lt;/p&gt;\n&lt;p&gt;Для того, чтобы операция стала легковесной, необходимо выполнить несколько условий:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Операция должна иметь тип &lt;a href=\"user-guide/data-processing/operations/vanilla.html\"&gt;Vanilla&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Пул, в котором запущена операция, должен быть настроен в режиме &lt;code&gt;fifo&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Для пула должны быть включены легковесные операции. За это отвечает настройка &lt;code&gt;enable_lightweight_operations&lt;/code&gt;, которая управляется администратором кластера YTsaurus.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"rekomendacii-po-ispolzovaniyu\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/operations-limits.html#rekomendacii-po-ispolzovaniyu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Рекомендации по использованию&lt;/span&gt;&lt;/a&gt;Рекомендации по использованию&lt;/h4&gt;\n&lt;p&gt;В пуле, для которого включены легковесные операции, допустимо запускать и не легковесные операции. Такие операции будут учитываться в счётчике &lt;code&gt;running_operation_count&lt;/code&gt; и для них будет применяться соответствующий лимит. Тем не менее, смешивание операций разных типов является антипаттерном и настоятельно не рекомендуется.&lt;/p&gt;\n&lt;p&gt;Алгоритм планировщика специальным образом учитывает легковесные операции и ожидает, что их джобы действительно смогут быть запущены за короткое время. В связи с этим не рекомендуется злоупотреблять и запускать в легковесных пулах тяжелые &lt;code&gt;Vanilla&lt;/code&gt; операции, состоящие более чем из одного джоба. Формально такие операции будут считаться легковесными, но время их запуска может быть выше обычного.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/scheduler/operations-limits.md","sourcePath":"ru/user-guide/data-processing/scheduler/operations-limits.md"},"headings":[{"title":"Лимиты на количество операций","href":"ru/user-guide/data-processing/scheduler/operations-limits.html#limity-na-kolichestvo-operacij","level":2,"items":[{"title":"Легковесные операции","href":"ru/user-guide/data-processing/scheduler/operations-limits.html#legkovesnye-operacii","level":3,"items":[{"title":"Рекомендации по использованию","href":"ru/user-guide/data-processing/scheduler/operations-limits.html#rekomendacii-po-ispolzovaniyu","level":4}]}]}],"title":""},"router":{"pathname":"ru/user-guide/data-processing/scheduler/operations-limits","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
