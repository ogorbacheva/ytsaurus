            {"data":{"leading":false,"html":"&lt;p&gt;Базовый механизм предоставления гарантий на вычислительные ресурсы в системе YTsaurus предполагает выдачу константного количества ресурсов (строгая гарантия), выраженного чаще всего в ядрах CPU. Такой вид гарантии хорошо подходит для задач, способных постоянно утилизировать ресурсы. В реальности встречаются и другие сценарии, в которых требуется бо́льшая гибкость.&lt;/p&gt;\n&lt;p&gt;Например, когда продакшен процессу необходимо выполнить расчёты за сравнительно короткий промежуток времени, но в пике ему нужно много вычислительной квоты, остальное время уровень потребления может быть значительно ниже. В случае использования базового механизма предоставления гарантии, процессу необходимо выделять ресурсы по максимальному значению потребления и заказывать больше ресурсов при планировании, чем реально требуется.&lt;/p&gt;\n&lt;p&gt;Существуют процессы, для которых не столь важно получить вычислительные ресурсы в моменте, но важно, чтобы в течение некоторого длительного промежутка времени процессы смогли завершиться. В таком случае речь идёт о некотором среднем значении вычислительной квоты за продолжительное время. Например, исследовательские и аналитические задачи, эксперименты.&lt;/p&gt;\n&lt;p&gt;Механизм интегральных гарантий позволяет найти баланс между описанными сценариями.&lt;/p&gt;\n&lt;h2 id=\"integralnye-puly\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/integral-guarantees.html#integralnye-puly\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интегральные пулы&lt;/span&gt;&lt;/a&gt;Интегральные пулы&lt;/h2&gt;\n&lt;p&gt;В системе YTsaurus существует возможность включить накопление ресурсов для пула. В такие пулы с постоянной скоростью поступает некоторый объём виртуальных ресурсов — &lt;code&gt;accumulated_resource_ratio_volume&lt;/code&gt;. Объём ресурса хранится в доле кластера в секунду — &lt;code&gt;fair_share*sec&lt;/code&gt;, но для простоты можно считать, что значение приведено в ядрах в секунду — &lt;code&gt;cpu*sec&lt;/code&gt;. Пул может расходовать виртуальный ресурс, чтобы запускать операции, а может накапливать его до определённого лимита.&lt;/p&gt;\n&lt;p&gt;Пример: пусть в пуле накопилось &lt;code&gt;accumulated_resource_ratio_volume = 60 fair_share*sec&lt;/code&gt;, на кластере 1000 ядер, и доминантный ресурс пользовательского процесса — CPU. Данный объём можно пересчитать в &lt;code&gt;ядра * секунды&lt;/code&gt; — &lt;code&gt;60000 cpu*sec&lt;/code&gt;. Операция, потребляющая в моменте 100 CPU, истратит данный объём за 10 минут, а потребляющая 50 CPU — за 20 минут. В данном примере не учитывается, что с течением времени объём виртуального ресурса в пуле пополняется.&lt;/p&gt;\n&lt;p&gt;Скорость накопления ресурса настраивается в атрибуте пула &lt;code&gt;integral-guarantees/resource_flow&lt;/code&gt;. В значении атрибута должен быть указан тип ресурса и его объём:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/pools/root-pool/burst/@integral-guarantees/resource_flow &lt;span class=\"hljs-string\"&gt;\"{cpu=100}\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"24\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-24\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-24\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-24.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Поскольку &lt;code&gt;resource_flow&lt;/code&gt; — это скорость увеличения &lt;code&gt;accumulated_resource_ratio_volume&lt;/code&gt;, который представляет собой мгновенное количество ресурса умноженное на время, то &lt;code&gt;resource_flow/cpu&lt;/code&gt; измеряется в ядрах, проще говоря, &lt;code&gt;cpu*sec/sec = cpu&lt;/code&gt;. Например, &lt;code&gt;resource_flow/cpu = 100&lt;/code&gt; позволяет бесконечно долго выполняться операции, потребляющей 100 CPU в моменте.&lt;/p&gt;\n&lt;p&gt;Накопление &lt;code&gt;accumulated_resource_ratio_volume&lt;/code&gt; происходит до определённого предела, который равен &lt;code&gt;k*resource_flow_ratio&lt;/code&gt;, где &lt;code&gt;k&lt;/code&gt; — единый для всех пулов параметр планировщика, а &lt;code&gt;resource_flow_ratio&lt;/code&gt; — &lt;code&gt;resource_flow&lt;/code&gt; как доля от всех ресурсов кластера. Значение для параметра &lt;code&gt;k&lt;/code&gt; настраивается администратором кластера.&lt;/p&gt;\n&lt;p&gt;Описанная идея накопления и расходования ресурсов во многом похожа на алгоритм &lt;a href=\"https://en.wikipedia.org/wiki/Token_bucket\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Token bucket&lt;/a&gt;. Не стоит путать с &lt;a href=\"https://en.wikipedia.org/wiki/Leaky_bucket\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Leaky bucket&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"vidy-garantij\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/integral-guarantees.html#vidy-garantij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Виды гарантий&lt;/span&gt;&lt;/a&gt;Виды гарантий&lt;/h2&gt;\n&lt;p&gt;В системе YTsaurus существует три вида гарантий на вычислительные ресурсы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;strong_guarantee&lt;/strong&gt; — строгая гарантия доли ресурсов кластера. Выставляется в том числе в абсолютном значении (в ядрах), автоматически пересчитывается в долю кластера. Позволяет в любой момент времени получить гарантию и использовать её бесконечно долго;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;burst_integral&lt;/strong&gt; — гарантия в моменте («пиковая гарантия») в ядрах, позволяет получать фиксированную гарантию в течение промежутка времени. Например, получать 2000 ядер в течение двух часов в сутки;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;relaxed_integral&lt;/strong&gt; — интегральная гарантия (в ядрах) позволяет получить фиксированный объём ресурса в среднем за сутки.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"tipy-integralnyh-pulov\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/integral-guarantees.html#tipy-integralnyh-pulov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типы интегральных пулов&lt;/span&gt;&lt;/a&gt;Типы интегральных пулов&lt;/h3&gt;\n&lt;p&gt;Для поддержки двух сценариев, описанных в начале раздела, в системе YTsaurus реализованы два типа интегральных пулов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Burst pool&lt;/strong&gt; — пул, который имеет приоритет при расходовании &lt;code&gt;accumulated_resource_ratio_volume&lt;/code&gt;. У таких пулов должны быть указаны &lt;code&gt;resource_flow&lt;/code&gt; и &lt;code&gt;burst_guarantee_resources&lt;/code&gt;. При наличии операций в пуле, требующих ресурсов (demand), планировщик обязан выдать не менее &lt;code&gt;burst_guarantee_resources&lt;/code&gt; пулу, если в пуле накоплено достаточно &lt;code&gt;accumulated_resource_ratio_volume&lt;/code&gt;. Данный тип пулов обеспечивает &lt;code&gt;burst_integral&lt;/code&gt; гарантию.&lt;/p&gt;\n&lt;p&gt;Пример конфигурации burst пула:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/pools/root-pool/burst/@integral-guarantees &lt;span class=\"hljs-string\"&gt;\"\n{\n  guarantee_type=burst;\n  resource_flow={cpu=1000};\n  burst_guarantee_resources={cpu=2000}\n}\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"71\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-71\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-71\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-71.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В приведённом примере пользователь может рассчитывать, что пулу гарантированы 1000 ядер всегда или 2000 \"половину\" времени (например, 12 часов в сутки), если в течение второй половины ничего не запускается.&lt;/p&gt;\n&lt;p&gt;Burst гарантия одновременно является и ограничением скорости потребления накопленного ресурса. Если гарантия burst_gurantee_resources/cpu равна 2000, то по умолчанию планировщик не даст пулу потребить более 2000 ядер в моменте. Такое поведение обеспечивает защиту от случайного быстрого расходования накопленного интегрального ресурса.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Relaxed pool&lt;/strong&gt; — пул, для которого нет гарантии получить все ресурсы за &lt;code&gt;accumulated_resource_ratio_volume&lt;/code&gt; в заданный момент, но есть гарантия получить их в итоге (в течение суток). Для relaxed пула можно задать только &lt;code&gt;resource_flow&lt;/code&gt;. Предполагается, что в таких пулах будут запускаться операции, которые не требуют мгновенного получения ресурсов, которые им полагаются. Данный тип пулов обеспечивает &lt;code&gt;relaxed_integral&lt;/code&gt; гарантию.&lt;br /&gt;\nПример конфигурации relaxed пула:&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Листинг 3&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/pools/root-pool/relaxed/@integral-guarantees &lt;span class=\"hljs-string\"&gt;\"\n{\n  guarantee_type=relaxed;\n  resource_flow={cpu=1000}\n}\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"86\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-86\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-86\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-86.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В relaxed пулах, также как и в burst пулах, существует ограничение на потребление ресурсов. В случае relaxed пулов ограничение в три раза превышает значение flow гарантии. Например, при гарантии resource_flow/cpu равной 1000, планировщик по умолчанию ограничит потребление пула тремя тысячами ядер в моменте.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Описанные типы пулов дополняют друг друга, позволяя использовать одни и те же ресурсы и приоритетным процессам, требующим значительных гарантий на ограниченные промежутки времени, и менее значимым процессам, для которых допустимо подождать выделения ресурсов.&lt;/p&gt;\n&lt;h3 id=\"primer\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/integral-guarantees.html#primer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h3&gt;\n&lt;p&gt;Пусть есть продакшен процесс, требующий 2000 CPU 12 часов в сутки, и исследовательский (research) процесс, которому достаточно 1000 CPU в среднем. С помощью механизма интегральных гарантий можно сконфигурировать для таких процессов burst и relaxed пулы, и для обеспечения гарантий потребуется 2000 ядер. Указанные пулы должны находиться в одном дереве пулов, других ограничений нет. При использовании базового механизма выдачи гарантий (строгая гарантии) для строго соблюдения таких гарантий пришлось бы заказать 3000 ядер.&lt;/p&gt;\n&lt;p&gt;На рисунке приведён график потребления (usage) и потребности (demand) в CPU для burst пула, для которого &lt;code&gt;burst_integral&lt;/code&gt; гарантия равна 500 CPU, а &lt;code&gt;resource_flow&lt;/code&gt; равен 100 CPU.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/pool_consumption.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;На рисунке ниже приведён график объёма накопленного ресурса для того же пула. Видно, как объём виртуального ресурса уменьшается при запущенных операциях в пуле, а после ресурс вновь накапливается до заданного предела.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/pool_accumulated_resource_ratio_volume.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;h2 id=\"sochetanie-so-strogimi-garantiyami\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/integral-guarantees.html#sochetanie-so-strogimi-garantiyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сочетание со строгими гарантиями&lt;/span&gt;&lt;/a&gt;Сочетание со строгими гарантиями&lt;/h2&gt;\n&lt;p&gt;Оба вида интегральных пулов естественным образом совместимы со строгими гарантиями. При выдаче ресурсов планировщик сперва будет выдавать ресурсы в счёт строгих гарантий. Если их достаточно для покрытия текущей потребности пула, то &lt;code&gt;accumulated_resource_ratio_volume&lt;/code&gt; расходоваться не будет. Если потребность в ресурсах превышает строгие гарантии, то для удовлетворения превышающей части будет потрачен &lt;code&gt;accumulated_resource_ratio_volume&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Интегральные пулы наравне с соседними пулами участвуют в получении ресурсов сверх своих гарантий от пулов выше по иерархии пропорционально выставленным весам.&lt;/p&gt;\n&lt;h2 id=\"dopolnitelnye-atributy-integralnyh-pulov\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/integral-guarantees.html#dopolnitelnye-atributy-integralnyh-pulov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дополнительные атрибуты интегральных пулов&lt;/span&gt;&lt;/a&gt;Дополнительные атрибуты интегральных пулов&lt;/h2&gt;\n&lt;p&gt;Существует возможность запрашивать у планировщика значение служебных атрибутов, которые доступны в специальном поддереве Кипариса, называемом Орхидеей.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;accumulated_resource_ratio_volume&lt;/code&gt; — накопленные интегральные ресурсы в терминах доли кластера * секунду;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;accumulated_resource_volume&lt;/code&gt; — &lt;code&gt;accumulated_resource_ratio_volume&lt;/code&gt; в виде словаря со всеми ресурсами. Например, &lt;code&gt;accumulated_resource_volume/cpu&lt;/code&gt; — это объём накопленного интегрального ресурса, выраженного в ядро * секунду;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;integral_pool_capacity&lt;/code&gt; — предел накопления &lt;code&gt;accumulated_resource_ratio_volume&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;specified_burst_ratio&lt;/code&gt; — &lt;code&gt;burst_guarantee_resources&lt;/code&gt;, переведённые в долю кластера;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;specified_resource_flow_ratio&lt;/code&gt; — &lt;code&gt;resource_flow&lt;/code&gt;, переведённый в долю кластера;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;total_burst_ratio&lt;/code&gt; — сумма &lt;code&gt;specified_burst_ratio&lt;/code&gt; по всем потомкам (включая текущий пул);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;total_resource_flow_ratio&lt;/code&gt; — сумма &lt;code&gt;specified_resource_flow_ratio&lt;/code&gt; по всем потомкам (включая текущий пул);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;estimated_burst_usage_duration_seconds&lt;/code&gt; — предполагаемый промежуток времени, на который хватит накопленного ресурса (с учётом продолжающегося поступления ресурсов со скоростью &lt;code&gt;resource_flow&lt;/code&gt;), при потреблении &lt;code&gt;burst_guarantee_resources&lt;/code&gt; (есть только у burst пулов).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример запроса атрибута представлен в листинге 4.&lt;br /&gt;\n&lt;small&gt;Листинг 4&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt get //sys/scheduler/orchid/scheduler/scheduling_info_per_pool_tree/default/fair_share_info/pools/pool_name/integral_pool_capacity\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"173\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-173\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-173\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-173.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Орхидея планировщика не является частью стабильного API и может изменяться без анонсов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/scheduler/integral-guarantees.md","sourcePath":"ru/user-guide/data-processing/scheduler/integral-guarantees.md"},"headings":[{"title":"Интегральные пулы","href":"ru/user-guide/data-processing/scheduler/integral-guarantees.html#integralnye-puly","level":2},{"title":"Виды гарантий","href":"ru/user-guide/data-processing/scheduler/integral-guarantees.html#vidy-garantij","level":2,"items":[{"title":"Типы интегральных пулов","href":"ru/user-guide/data-processing/scheduler/integral-guarantees.html#tipy-integralnyh-pulov","level":3},{"title":"Пример","href":"ru/user-guide/data-processing/scheduler/integral-guarantees.html#primer","level":3}]},{"title":"Сочетание со строгими гарантиями","href":"ru/user-guide/data-processing/scheduler/integral-guarantees.html#sochetanie-so-strogimi-garantiyami","level":2},{"title":"Дополнительные атрибуты интегральных пулов","href":"ru/user-guide/data-processing/scheduler/integral-guarantees.html#dopolnitelnye-atributy-integralnyh-pulov","level":2}],"title":"Интегральные гарантии"},"router":{"pathname":"ru/user-guide/data-processing/scheduler/integral-guarantees","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
