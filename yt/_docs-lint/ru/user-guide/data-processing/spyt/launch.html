        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"install\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/launch.html#install\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка пакета ytsaurus-spyt и необходимых зависимостей&lt;/span&gt;&lt;/a&gt;Установка пакета ytsaurus-spyt и необходимых зависимостей&lt;/h2&gt;\n&lt;p&gt;Установите пакет &lt;code&gt;ytsaurus-spyt&lt;/code&gt; и все необходимые зависимости:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ pip install ytsaurus-spyt[all]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В этом случае помимо пакета &lt;code&gt;ytsaurus-spyt&lt;/code&gt; также будут установлены &lt;code&gt;pyspark&lt;/code&gt; и &lt;code&gt;ytsaurus-client&lt;/code&gt; последней совместимой версии. При необходимости использования других версий &lt;code&gt;pyspark&lt;/code&gt; их можно будет установить отдельно с явным указанием версии, например &lt;code&gt;pip install pyspark==3.2.2&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Совместимость SPYT с различными версиями Spark приведена &lt;a href=\"user-guide/data-processing/spyt/overview.html#spyt-compatibility\"&gt;в этой таблице&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;При запуске задач будет использован дистрибутив Spark, номер версии которого совпадает с версией пакета &lt;code&gt;pyspark&lt;/code&gt; на машине, с которой выполняется запуск. Для загрузки Spark дистрибутива на кластер можно воспользоваться скриптом &lt;code&gt;tools/release/publisher/spark-distrib.py&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"submit\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/launch.html#submit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск задачи напрямую в YTsaurus (доступно с версии SPYT 1.76.0)&lt;/span&gt;&lt;/a&gt;Запуск задачи напрямую в YTsaurus (доступно с версии SPYT 1.76.0)&lt;/h2&gt;\n&lt;p&gt;Данный способ подходит для случаев, когда нет потребности в непрерывной работе кластера. Он позволяет использовать ресурсы кластера только в случае реальной потребности в них. В сравнении с запуском приложений во внутреннем Standalone Spark кластере данный способ работает чуть дольше за счет того, что каждый раз необходимо поднимать отдельную операцию для запуска приложения, однако с другой стороны он позволяет освободить ресурсы сразу же, как только в них больше не будет необходимости.&lt;/p&gt;\n&lt;p&gt;Запуск задач напрямую в YTsaurus рекомендуется в следующих случаях:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Выполнение разовых расчетов.&lt;/li&gt;\n&lt;li&gt;Запуск задач, имеющих низкую периодичность (реже 1 раза в час).&lt;/li&gt;\n&lt;li&gt;Ad-hoc аналитика при помощи консольных утилит &lt;code&gt;spark-shell&lt;/code&gt;, &lt;code&gt;pyspark&lt;/code&gt; или &lt;code&gt;Jupyter&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Для того чтобы воспользоваться данным способом, необходимо выполнить следующие шаги:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Активируйте конфигурацию SPYT при помощи команды &lt;code&gt;source spyt-env&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Загрузите исполняемый файл и его зависимости в Кипарис. Начиная с версии 2.4.0 также можно указывать локальные файлы как для исполняемого файла, так и для зависимостей.&lt;/li&gt;\n&lt;li&gt;Запустите задачу на выполнение при помощи следующей команды.&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ spark-submit --master ytsaurus://&amp;lt;cluster-name&amp;gt; --deploy-mode cluster --num-executors 5 --queue research yt:/&amp;lt;path to .py file or .jar file on cypress&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"62\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-62\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-62\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-62.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;При использовании локальных файлов:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ spark-submit --master ytsaurus://&amp;lt;cluster-name&amp;gt; --deploy-mode cluster --num-executors 5 --queue research &amp;lt;path to .py file or .jar file on &lt;span class=\"hljs-built_in\"&gt;local&lt;/span&gt; drive&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"66\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-66\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-66\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-66.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;--master&lt;/code&gt; — адрес прокси кластера;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--queue&lt;/code&gt; — название пула в планировщике, в котором нужно запустить расчёт&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Назначение остальных опций соответствует их описанию в документации &lt;code&gt;spark-submit&lt;/code&gt; (полный список выводится по команде &lt;code&gt;spark-submit --help&lt;/code&gt;). Можно использовать почти все доступные опции за исключением следующих:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;--conf spark.dynamicAllocation.enabled&lt;/code&gt; — в настоящий момент поддержка динамического выделения ресурсов не реализована, поэтому эту опцию лучше не выставлять в &lt;code&gt;true&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--py-files, --files, --archives&lt;/code&gt; — с локальными файлами не работают, можно использовать только те, которые были предварительно загружены в Кипарис.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Для использования History server в этом режиме его необходимо поднять отдельно согласно &lt;a href=\"user-guide/data-processing/spyt/cluster/shs.html\"&gt;инструкции&lt;/a&gt;. Для получения диагностической информации также можно воспользоваться логами YTsaurus операций. Следует учесть следующее:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Доступны только логи, которые пишутся в stderr, поэтому нужно сделать соответствующие настройки логирования в запускаемом Spark приложении.&lt;/li&gt;\n&lt;li&gt;В настоящий момент драйвер и экзекьюторы запускаются в разных YTsaurus операциях, соответственно логи нужно смотреть и в той, и в другой.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Конфигурационные параметры, доступные при запуске задач напрямую, можно найти &lt;a href=\"user-guide/data-processing/spyt/thesaurus/configuration.html#direct-submit\"&gt;здесь&lt;/a&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Начиная с версии Spark 3.4.0 при использовании сети с IPv6 адресами необходимо устанавливать переменную окружения &lt;code&gt;SPARK_PREFER_IPV6=true&lt;/code&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"submit-local\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/launch.html#submit-local\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выполнение локальных файлов&lt;/span&gt;&lt;/a&gt;Выполнение локальных файлов&lt;/h2&gt;\n&lt;p&gt;Начиная с версии SPYT 2.4.0 при запуске задач напрямую в YTsaurus можно указывать локальные файлы в качестве исполняемых модулей и зависимостей без их предварительной загрузки на Кипарис. В этом случае локальные файлы будут предварительно загружены в файловый кеш на Кипарисе и затем будут оттуда использованы в приложении. При повторном запуске будут использоваться уже закешированные файлы. Пример команды &lt;code&gt;spark-submit&lt;/code&gt; для данного способа приведен ниже:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-submit --master ytsaurus://&amp;lt;cluster name&amp;gt; \\\n             --deploy-mode cluster \\\n             --num-executors 5 \\\n             --executor-cores 4 \\\n             --py-files ~/path/to/my/dependencies.py \\\n             ~/path/to/my/script.py\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"131\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-131\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-131\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-131.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"standalone\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/launch.html#standalone\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск standalone Spark кластера&lt;/span&gt;&lt;/a&gt;Запуск standalone Spark кластера&lt;/h2&gt;\n&lt;p&gt;Данный способ подходит при интенсивном использовании кластера. В данном режиме YTsaurus выделяет ресурсы под внутренний Standalone Spark кластер, который занимается выполнением расчетов. Для запуска в этом режиме необходимо использовать обёртки над стандартными командами Spark &lt;code&gt;spark-submit-yt&lt;/code&gt; и &lt;code&gt;spark-shell-yt&lt;/code&gt;, входящими в состав пакета &lt;code&gt;ytsaurus-spyt&lt;/code&gt;. Этот режим рекомендуется использовать в следующих случаях:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Запуск задач с высокой периодичностью (более 1 раза в час). Эффективность достигается за счет того, что время запуска задачи в standalone кластере существенно меньше, чем время запуска операции в YTsaurus.&lt;/li&gt;\n&lt;li&gt;Ad-hoc аналитика в Jupyter-ноутбуках.&lt;/li&gt;\n&lt;li&gt;Ad-hoc аналитика с использованием Query tracker и livy.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Для запуска внутреннего standalone Spark кластера необходимо выполнить следующие шаги:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Выберите пользователя, от имени которого необходимо запустить кластер. Код, который регулярно запускается на Spark, нужно загрузить в систему YTsaurus. У пользователя, от имени которого запущен кластер, должны быть права на чтение кода.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Создайте директорию для служебных данных Spark, например &lt;code&gt;my_discovery_path&lt;/code&gt;. Пользователь, от имени которого запущен кластер, должен иметь права на запись в директорию. Пользователи, которые будут запускать джобы на Spark, должны иметь права на чтение директории.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Запустите кластер:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ spark-launch-yt \\\n--proxy &amp;lt;cluster-name&amp;gt; \\\n--pool  my_pool \\\n--discovery-path my_discovery_path \\\n--worker-cores 16 \\\n--worker-num 5 \\\n--worker-memory 64G\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"173\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-173\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-173\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-173.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;spark-launch-yt&lt;/code&gt; — запуск в Vanilla-операции YTsaurus с клиентского хоста;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--proxy&lt;/code&gt; — имя кластера;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--pool&lt;/code&gt; — вычислительный пул YTsaurus;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--spyt-version&lt;/code&gt; — директория для служебных данных Spark;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--worker-cores&lt;/code&gt; — количество ядер у &lt;a href=\"user-guide/data-processing/spyt/cluster/cluster-desc.html#spark-standalone-в-yt--spark-standalone\"&gt;воркера&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--worker-num&lt;/code&gt; — количество воркеров;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--worker-memory&lt;/code&gt; — количество памяти у каждого воркера;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--spark-cluster-version&lt;/code&gt; — &lt;a href=\"user-guide/data-processing/spyt/version.html\"&gt;версия&lt;/a&gt; кластера (опционально).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Запустите тестовый джоб на кластере:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ spark-submit-yt \\\n--proxy &amp;lt;cluster-name&amp;gt; \\\n--discovery-path my_discovery_path \\\n--deploy-mode cluster \\\nyt:///sys/spark/examples/smoke_test.py\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"224\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-224\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-224\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-224.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;spark-submit-yt&lt;/code&gt; — обертка над &lt;a href=\"https://spark.apache.org/docs/latest/submitting-applications.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;spark-submit&lt;/a&gt;, позволяет определить адрес мастера Spark из Vanilla-операции. Поиск производится по аргументам: &lt;code&gt;proxy&lt;/code&gt;, &lt;code&gt;id&lt;/code&gt;, &lt;code&gt;discovery-path&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--proxy&lt;/code&gt; — имя кластера;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--discovery-path&lt;/code&gt; — директория для служебных данных Spark;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--deploy-mode&lt;/code&gt; (&lt;code&gt;cluster&lt;/code&gt; или &lt;code&gt;client&lt;/code&gt;) — &lt;a href=\"user-guide/data-processing/spyt/cluster/cluster-desc.html#cluster-mode--cluster-mode\"&gt;режим&lt;/a&gt; запуска кластера;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--spyt-version&lt;/code&gt; — версия SPYT (опционально);&lt;/li&gt;\n&lt;li&gt;адрес файла с кодом в YTsaurus.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"use\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/launch.html#use\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с использованием внутреннего Spark кластера&lt;/span&gt;&lt;/a&gt;Работа с использованием внутреннего Spark кластера&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;spark-launch-yt&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Запуск Spark кластера внутри YTsaurus:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ spark-launch-yt \\\n--proxy &amp;lt;cluster-name&amp;gt; \\\n--pool my_pool \\\n--discovery-path my_discovery_path \\\n--worker-cores 16 \\\n--worker-num 5 \\\n--worker-memory 64G \\\n--spyt-version 2.7.1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"273\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-273\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-273\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-273.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;spark-discovery-yt&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Получить ссылки на UI мастера, операцию, Spark History Server:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ spark-discovery-yt \\\n--proxy &amp;lt;cluster-name&amp;gt; \\\n--discovery-path my_discovery_path\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"282\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-282\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-282\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-282.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;spark-submit-yt&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Запуск задач на кластере:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ spark-submit-yt \\\n--proxy &amp;lt;cluster-name&amp;gt; \\\n--discovery-path my_discovery_path \\\n--deploy-mode cluster \\\nyt:///sys/spark/examples/smoke_test.py\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"291\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-291\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-291\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-291.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Вместо некоторых аргументов команд можно установить переменные окружения, например: &lt;code&gt;YT_PROXY&lt;/code&gt; — вместо &lt;code&gt;--proxy&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ &lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_PROXY=&amp;lt;cluster-name&amp;gt;\n\n$ spark-submit-yt \\\n--discovery-path my_discovery_path \\\n--deploy-mode cluster \\\nyt:///sys/spark/examples/smoke_test.py\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"300\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-300\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-300\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-300.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"ispolzovanie-opredelyonnoj-versii-jdk\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/launch.html#ispolzovanie-opredelyonnoj-versii-jdk\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование определённой версии JDK&lt;/span&gt;&lt;/a&gt;Использование определённой версии JDK&lt;/h2&gt;\n&lt;p&gt;Начиная с версии SPYT 2.6.0 поддерживаются JDK 11 и JDK 17. Более ранние версии поддерживают только JDK 11. JDK 17 можно использовать только в случае, если версия Spark 3.3.0 и выше, Spark 3.2.x JDK 17 не поддерживает. По умолчанию на кластере будет использоваться та же версия JDK, что и на машине, с которой выполняется запуск задачи.&lt;/p&gt;\n&lt;h2 id=\"dopolnitelnye-parametry\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/launch.html#dopolnitelnye-parametry\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дополнительные параметры&lt;/span&gt;&lt;/a&gt;Дополнительные параметры&lt;/h2&gt;\n&lt;p&gt;О дополнительных параметрах при запуске кластера можно узнать в разделе &lt;a href=\"user-guide/data-processing/spyt/cluster/cluster-start.html\"&gt;Запуск кластера Spark&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/spyt/launch.md","sourcePath":"ru/user-guide/data-processing/spyt/launch.md"},"headings":[{"title":"Установка пакета ytsaurus-spyt и необходимых зависимостей","href":"ru/user-guide/data-processing/spyt/launch.html#install","level":2},{"title":"Запуск задачи напрямую в YTsaurus (доступно с версии SPYT 1.76.0)","href":"ru/user-guide/data-processing/spyt/launch.html#submit","level":2},{"title":"Выполнение локальных файлов","href":"ru/user-guide/data-processing/spyt/launch.html#submit-local","level":2},{"title":"Запуск standalone Spark кластера","href":"ru/user-guide/data-processing/spyt/launch.html#standalone","level":2},{"title":"Работа с использованием внутреннего Spark кластера","href":"ru/user-guide/data-processing/spyt/launch.html#use","level":2},{"title":"Использование определённой версии JDK","href":"ru/user-guide/data-processing/spyt/launch.html#ispolzovanie-opredelyonnoj-versii-jdk","level":2},{"title":"Дополнительные параметры","href":"ru/user-guide/data-processing/spyt/launch.html#dopolnitelnye-parametry","level":2}],"title":"Запуск Spark задач на выполнение в YTsaurus"},"router":{"pathname":"ru/user-guide/data-processing/spyt/launch","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
