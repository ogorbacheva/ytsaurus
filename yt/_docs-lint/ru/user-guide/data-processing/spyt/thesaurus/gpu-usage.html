        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;При исполнении задач некоторые вычисления могут быть произведены на GPU устройствах. Про планирование GPU ресурсов в YTsaurus можно прочесть в соответствующей &lt;a href=\"user-guide/data-processing/overview#podderzhka-gpu\"&gt;статье&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Исполнение задач с использованием GPU опирается на плагин &lt;a href=\"https://docs.nvidia.com/spark-rapids/user-guide/23.08/getting-started/on-premise.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;RAPIDS Accelerator&lt;/a&gt;. Он переносит часть операций, для которых описаны преобразования, на GPU. Основные параметры описаны в документации плагина.&lt;/p&gt;\n&lt;h2 id=\"nastrojka-gpu-pri-zapuske-zadach-napryamuyu\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/thesaurus/gpu-usage.html#nastrojka-gpu-pri-zapuske-zadach-napryamuyu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройка GPU при запуске задач напрямую&lt;/span&gt;&lt;/a&gt;Настройка GPU при запуске задач напрямую&lt;/h2&gt;\n&lt;p&gt;При запуске задач напрямую необходимо правильно сконфигурировать пулы. Зачастую кроме пула необходимо переопределить и дерево пулов.&lt;/p&gt;\n&lt;p&gt;Драйверу для работы не требуется GPU, поэтому можно использовать произвольный пул (опция &lt;code&gt;--queue&lt;/code&gt;). Но экзекьюторам GPU устройства необходимы, поэтому им следует указать дерево пулов и пул с GPU ресурсами отдельно.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-submit \\\n    ... \\\n    --queue no_gpu_pool \\\n    --conf spark.executor.resource.gpu.amount=1 \\\n    --conf spark.task.resource.gpu.amount=0.5 \\\n    --conf spark.rapids.memory.pinnedPool.size=2G \\\n    --conf spark.plugins=com.nvidia.spark.SQLPlugin \\\n    --jars yt:///home/spark/lib/rapids-4-spark_2.12-23.12.2-cuda11.jar \\\n    --conf spark.ytsaurus.executor.operation.parameters=&lt;span class=\"hljs-string\"&gt;\"{pool=gpu_pool;pool_trees=[gpu_tree]}\"&lt;/span&gt; \\\n    yt:///home/spark/examples/smoke_test_raw.py\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"15\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-15\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-15\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-15.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Каждому экзекьютору может быть выделено только целое количество GPU устройств, однако таски могут делить GPU между собой.&lt;/p&gt;\n&lt;p&gt;Библиотека должна быть скомпилирована для версии CUDA, поставляемой в окружение джобов. Она указана в &lt;code&gt;//home/spark/conf/global/cuda_toolkit_version&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Также в репозитории доступен пример задачи в клиентском режиме:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;python python-examples/gpu_example/main.py &amp;lt;cluster-name&amp;gt; gpu_pool gpu_tree\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"25\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-25\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-25\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-25.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"vychisleniya-na-standalone-klastere\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/thesaurus/gpu-usage.html#vychisleniya-na-standalone-klastere\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вычисления на Standalone кластере&lt;/span&gt;&lt;/a&gt;Вычисления на Standalone кластере&lt;/h2&gt;\n&lt;h3 id=\"zapusk-klastera\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/thesaurus/gpu-usage.html#zapusk-klastera\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск кластера&lt;/span&gt;&lt;/a&gt;Запуск кластера&lt;/h3&gt;\n&lt;p&gt;При &lt;a href=\"user-guide/data-processing/spyt/launch#standalone\"&gt;старте кластера&lt;/a&gt; каждому воркеру будет выделено целое количество GPU, указанное в опции &lt;code&gt;--worker-gpu-limit&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;spark-launch-yt ... --pool gpu_pool --params '{operation_spec={pool_trees=[gpu_tree]}}' --worker-gpu-limit 2\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"35\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-35\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-35\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-35.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Все компоненты кластера будут запущены в указанном пуле, при этом GPU устройства будут запрошены только для воркеров.&lt;/p&gt;\n&lt;h3 id=\"zapusk-zadach\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/thesaurus/gpu-usage.html#zapusk-zadach\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск задач&lt;/span&gt;&lt;/a&gt;Запуск задач&lt;/h3&gt;\n&lt;p&gt;Пример конфигурации Spark задачи:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-submit-yt \\\n    ... \\\n    --conf spark.executor.resource.gpu.amount=1 \\\n    --conf spark.task.resource.gpu.amount=0.25 \\\n    --conf spark.rapids.memory.pinnedPool.size=2G \\\n    --conf spark.plugins=com.nvidia.spark.SQLPlugin \\\n    --jars yt:///home/spark/lib/rapids-4-spark_2.12-23.12.2-cuda11.jar \\\n    yt:///home/spark/examples/smoke_test_raw.py\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"45\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-45\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-45\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-45.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/spyt/thesaurus/gpu-usage.md","sourcePath":"ru/user-guide/data-processing/spyt/thesaurus/gpu-usage.md"},"headings":[{"title":"Настройка GPU при запуске задач напрямую","href":"ru/user-guide/data-processing/spyt/thesaurus/gpu-usage.html#nastrojka-gpu-pri-zapuske-zadach-napryamuyu","level":2},{"title":"Вычисления на Standalone кластере","href":"ru/user-guide/data-processing/spyt/thesaurus/gpu-usage.html#vychisleniya-na-standalone-klastere","level":2,"items":[{"title":"Запуск кластера","href":"ru/user-guide/data-processing/spyt/thesaurus/gpu-usage.html#zapusk-klastera","level":3},{"title":"Запуск задач","href":"ru/user-guide/data-processing/spyt/thesaurus/gpu-usage.html#zapusk-zadach","level":3}]}],"title":"Использование GPU"},"router":{"pathname":"ru/user-guide/data-processing/spyt/thesaurus/gpu-usage","depth":6,"base":"../../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
