            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе приведена расширенная инструкция по запуску кластера Spark. Базовые операции по запуску описаны в разделе &lt;a href=\"user-guide/data-processing/spyt/launch.html#standalone\"&gt;Быстрый старт&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Запущенный кластер Spark статически занимает выданные ему ресурсы. По этой причине рекомендуется запускать кластер в отдельном вычислительном пуле с гарантированными ресурсами. Целесообразно поднимать один кластер на команду и переиспользовать ресурсы между несколькими пользователями. Если не планируется высокой интенсивности запуска Spark задач (чаще одного раза в час) — рекомендуется воспользоваться способом &lt;a href=\"user-guide/data-processing/spyt/launch.html#submit\"&gt;запуска задач напрямую&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"auto-scale\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/cluster-start.html#auto-scale\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Автоскейлер&lt;/span&gt;&lt;/a&gt;Автоскейлер&lt;/h2&gt;\n&lt;p&gt;Для экономии ресурсов вычислительного пула в случае низкой нагрузки на Spark возможно включить специальный режим работы, обеспечивающий пропорциональное уменьшение потребляемых ресурсов – автоскейлер.&lt;/p&gt;\n&lt;h3 id=\"how-works\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/cluster-start.html#how-works\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это работает&lt;/span&gt;&lt;/a&gt;Как это работает&lt;/h3&gt;\n&lt;p&gt;У операций YTsaurus есть метод &lt;code&gt;update_operation_parameters&lt;/code&gt;, позволяющий изменять параметры операции. Можно менять число джобов в операции через параметр &lt;code&gt;user_slots&lt;/code&gt;. При изменении параметра планировщик остановит часть джобов или наоборот запустит новые (в пределах лимита, заданного при старте операции). Поскольку планировщик считает, что все джобы в операции одинаковы, в обычном режиме работы Spark подобный способ масштабирования мог бы привести к потере мастера или history-сервера, а так же воркеров, на которых выполняются драйверы джобов Spark. Чтобы недопустить нарушение работы Spark-кластера, реализован механизм его запуска не в виде одной YTsaurus-операции, а в виде нескольких. В этом случае одна операция выделяется под динамически изменяемый набор воркеров и может масштабироваться в заданных при старте лимитах. В одной или двух других операциях выполняются мастер и history-server (одна операция), драйвер (при запуске драйверов на кластере, вторая операция).&lt;/p&gt;\n&lt;h3 id=\"start-auto\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/cluster-start.html#start-auto\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как запустить кластер с автоскейлером&lt;/span&gt;&lt;/a&gt;Как запустить кластер с автоскейлером&lt;/h3&gt;\n&lt;p&gt;Используются дополнительные параметры для скрипта запуска &lt;code&gt;spark-launch-yt&lt;/code&gt; или аналогичные параметры клиентской библиотеки SPYT:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;autoscaler-period &amp;lt;период&amp;gt;&lt;/code&gt; — частота запуска автоскейлера и (потенциально) смены настройки операции, период задается в виде &lt;code&gt;&amp;lt;длина&amp;gt;&amp;lt;единица измерения [d|h|min|s|ms|µs|ns]&amp;gt;&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;enable-multi-operation-mode&lt;/code&gt; — включить режим запуска Spark в нескольких YTsaurus-операциях;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;enable-dedicated-driver-operation-mode&lt;/code&gt; — запускать воркеры для драйверов в отдельной YTsaurus-операции;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;driver-num &amp;lt;кол-во воркеров&amp;gt;&lt;/code&gt; — выделить под драйвер определенное количество воркеров;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;autoscaler-max-free-workers&lt;/code&gt; — максимальное значение свободных воркеров (все лишние воркеры будут остановлены);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;autoscaler-slot-increment-step&lt;/code&gt; — шаг увеличения количества воркеров при автоматическом расширении кластера.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ spark-launch-yt\n--proxy &amp;lt;cluster_name&amp;gt;\n--autoscaler-period 1s\n--enable-multi-operation-mode\n--discovery-path //discovery/path\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"66\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-66\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-66\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-66.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"update-cluster\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/cluster-start.html#update-cluster\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как обновить кластер&lt;/span&gt;&lt;/a&gt;Как обновить кластер&lt;/h2&gt;\n&lt;p&gt;Для того чтобы обновить Spark-кластер, необходимо проделать следующие шаги:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Остановить операцию с текущим кластером в YTsaurus. Ссылку на операцию можно найти с помощью &lt;code&gt;spark-discovery-yt&lt;/code&gt;. Также можно воспользоваться флагом &lt;code&gt;--abort-existing&lt;/code&gt; команды &lt;code&gt;spark-launch-yt&lt;/code&gt;, в этом случае текущий кластер будет остановлен перед стартом нового кластера.&lt;/li&gt;\n&lt;li&gt;Запустить кластер с помощью &lt;code&gt;spark-launch-yt&lt;/code&gt;. Можно указать в аргументе &lt;code&gt;spark-cluster-version&lt;/code&gt; нужную версию. Если версия не указана, то будет запущена последняя версия.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"spark-launch-yt-params\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/cluster-start.html#spark-launch-yt-params\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Параметры команды spark-launch-yt&lt;/span&gt;&lt;/a&gt;Параметры команды spark-launch-yt&lt;/h2&gt;\n&lt;p&gt;Для запуска внутреннего Spark кластера используется команда &lt;code&gt;spark-launch-yt&lt;/code&gt;, которой необходимо передавать ряд параметров. Они описаны в таблице ниже:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение по умолчанию&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;С какой версии&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--discovery-path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;да&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Путь к директории для служебных данных на Кипарисе (Discovery path)&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--proxy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;Значение из переменной окружения &lt;code&gt;YT_PROXY&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Адрес YTsaurus кластера&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--pool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Вычислительный пул YTsaurus, который будет использован для запуска кластера&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--operation-alias&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Алиас YTsaurus операции со Spark кластером&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--params&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Дополнительные параметры YTsaurus операции, указываются в виде YSON строки. Подробнее - на странице &lt;a href=\"user-guide/data-processing/spyt/cluster/configuration.html#add\"&gt;конфигурации&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--spyt-version&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;Версия пакета &lt;code&gt;ytsaurus-spyt&lt;/code&gt; на клиенте&lt;/td&gt;\n&lt;td&gt;Версия SPYT, которая будет использована для запуска кластера&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--preemption-mode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;normal&lt;/td&gt;\n&lt;td&gt;Режим вытеснения, используемый планировщиком YTsaurus, допустимые значения 'normal' или 'graceful'&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--enable-mtn&lt;/code&gt;, &lt;code&gt;--disable-mtn&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;--disable-mtn&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Использовать Multi-Tenant Network (MTN) для запуска кластера. При использовании MTN также должен быть указан сетевой проект через параметр &lt;code&gt;--network-project&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--network-project&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Название сетевого проекта, в котором будет запущена операция с кластером&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--prefer-ipv6&lt;/code&gt;, &lt;code&gt;--prefer-ipv4&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;--prefer-ipv4&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип IP адресов, используемых при работе с кластером. В случае использования IPv6 адресации при работе со Spark 3.4.0 и выше необходимо выставлять переменную окружения &lt;code&gt;SPARK_PREFER_IPV6=true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--enable-tmpfs&lt;/code&gt;, &lt;code&gt;--disable-tmpfs&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;--disable-tmpfs&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Использовать часть RAM, выделенной Spark worker-у для монтирования tmpfs. При использовании tmpfs необходимо также указать объём через параметр &lt;code&gt;--tmpfs-limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--tmpfs-limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;8G&lt;/td&gt;\n&lt;td&gt;Объём памяти, используемой для tmpfs&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--enable-tcp-proxy&lt;/code&gt;, &lt;code&gt;--disable-tcp-proxy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;--disable-tcp-proxy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Использовать TCP proxy для доступа на кластер извне&lt;/td&gt;\n&lt;td&gt;1.72.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--tcp-proxy-range-start&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;30000&lt;/td&gt;\n&lt;td&gt;Начало диапазона портов, используемых для TCP proxy&lt;/td&gt;\n&lt;td&gt;1.72.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--tcp-proxy-range-size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;100&lt;/td&gt;\n&lt;td&gt;Размер диапазона портов для TCP proxy&lt;/td&gt;\n&lt;td&gt;1.72.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--enable-rpc-job-proxy&lt;/code&gt;, &lt;code&gt;--disable-rpc-job-proxy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;--enable-rpc-job-proxy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Использовать rpc прокси, встроенный в job прокси. При отключении этой опции будет использована общая rpc прокси, что может привести к деградации производительности кластера&lt;/td&gt;\n&lt;td&gt;1.77.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--rpc-job-proxy-thread-pool-size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;4&lt;/td&gt;\n&lt;td&gt;Размер пула потоков для rpc job proxy&lt;/td&gt;\n&lt;td&gt;1.77.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--group-id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Идентификатор discovery группы. Используется при запуске кластера с использованием нескольких операций&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--enable-squashfs&lt;/code&gt;, &lt;code&gt;--disable-squashfs&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;--disable-squashfs&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Использовать предварительно подготовленные слои Squash FS в YTsaurus джобах&lt;/td&gt;\n&lt;td&gt;2.6.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--cluster-java-home&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;/opt/jdk11&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Путь к JAVA HOME в YTsaurus контейнерах кластера&lt;/td&gt;\n&lt;td&gt;2.6.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--master-memory-limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;4G&lt;/td&gt;\n&lt;td&gt;Объём памяти, выделяемой контейнеру с Master сервером&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--master-port&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;27001&lt;/td&gt;\n&lt;td&gt;Порт для Spark RPC вызовов у Master сервера&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--worker-cores&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;да&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Количество ядер CPU, выделяемых одному воркеру&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--worker-memory&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;да&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Объём памяти, выделяемый воркеру. Этот объём будет в дальнейшем распределяться между Spark процессами, такими как драйвер и экзекьюторы, запускаемыми на этом воркере&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--worker-num&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;да&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Количество воркеров в кластере&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--worker-cores-overhead&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;0&lt;/td&gt;\n&lt;td&gt;Дополнительный объём ядер CPU, выделяемых воркеру. Эти ядра не будут использоваться непосредственно Spark приложениями, а требуются для вспомогательных процессов, запущенных вместе с воркером&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--worker-memory-overhead&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;2G&lt;/td&gt;\n&lt;td&gt;Дополнительный объём памяти, выделяемой воркеру. Данный объём необходим для работы дополнительных процессов, запускаемых в контейнере воркера, например для дочерних процессов, запускаемых экзекьюторами. Также этот объём нужен в случае использования &lt;code&gt;pyspark&lt;/code&gt;, особенно при работе с &lt;code&gt;Python udf&lt;/code&gt;. В этом случае экзекьютор будет запускать дочерний &lt;code&gt;Python&lt;/code&gt; процесс, в котором будет исполняться код &lt;code&gt;udf&lt;/code&gt;, и которому также будет требоваться дополнительная память. Стандартная рекомендация значения для &lt;code&gt;--worker-memory-overhead&lt;/code&gt; при работе с Python udf - 40% от объёма, выделяемого воркеру через параметр &lt;code&gt;--worker-memory&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--worker-timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;10 min&lt;/td&gt;\n&lt;td&gt;Максимальное время, которое воркер будет ожидать регистрацию на Spark мастере. По истечении этого времени процесс воркера будет завершён с ошибкой. Доступны следующие единицы времени: s (секунды), m или min (минуты), h (часы), d (сутки). Если единица не указана - значение берётся в секундах&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--worker-gpu-limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;0&lt;/td&gt;\n&lt;td&gt;Количество GPU на воркере&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--worker-disk-name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;default&lt;/td&gt;\n&lt;td&gt;Название диска для заказа в спецификации операции, подробнее в разделе &lt;a href=\"user-guide/data-processing/operations/operations-options.html#disk_request\"&gt;заказ диска в джобах&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--worker-disk-limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Максимальный объём диска при заказе в спецификации операции, подробнее в разделе &lt;a href=\"user-guide/data-processing/operations/operations-options.html#disk_request\"&gt;заказ диска в джобах&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--worker-disk-account&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/accounts.html\"&gt;Аккаунт&lt;/a&gt;, используемый при заказе диска в спецификации операции, подробнее в разделе &lt;a href=\"user-guide/data-processing/operations/operations-options.html#disk_request\"&gt;заказ диска в джобах&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--worker-port&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;27001&lt;/td&gt;\n&lt;td&gt;Порт для Spark RPC вызовов у Worker сервера&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--enable-history-server&lt;/code&gt;, &lt;code&gt;--disable-history-server&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;--enable-history-server&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Флаг для запуска History Server в составе кластера&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--history-server-memory-limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;4G&lt;/td&gt;\n&lt;td&gt;Объём памяти для процесса History Server&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--history-server-memory-overhead&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;2G&lt;/td&gt;\n&lt;td&gt;Дополнительный объём памяти, выделяемой для вспомогательных процессов в контейнере с History Server&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--history-server-cpu-limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;Количество ядер CPU, выделяемых для History Server-а&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--shs-location&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;--discovery-path&lt;/code&gt;/logs&lt;/td&gt;\n&lt;td&gt;Путь к директории с event log-ами, используемый в History Server&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--ssd-account&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;YTsaurus &lt;a href=\"user-guide/storage/accounts.html\"&gt;Аккаунт&lt;/a&gt;, используемый для выделения SSD&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--ssd-limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;0&lt;/td&gt;\n&lt;td&gt;Объём SSD диска, выделяемый для YTsaurus джобы&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--abort-existing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Остановка запущенного Spark кластера на указанном &lt;code&gt;--discovery-path&lt;/code&gt; перед запуском нового&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--cluster-log-level&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;INFO&lt;/td&gt;\n&lt;td&gt;Уровень логирования на кластере&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--enable-stderr-table&lt;/code&gt;, &lt;code&gt;--disable-stderr-table&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;--disable-stderr-table&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Запись логов YTsaurus операции в таблицу. Таблица находится внутри &lt;code&gt;--discovery-path&lt;/code&gt; в директории &lt;code&gt;logs&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--enable-advanced-event-log&lt;/code&gt;, &lt;code&gt;--disable-advanced-event-log&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;--disable-advanced-event-log&lt;/td&gt;\n&lt;td&gt;Запись event log-ов Spark приложений в динамические таблицы YTsaurus&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--enable-worker-log-transfer&lt;/code&gt;, &lt;code&gt;--disable-worker-log-transfer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;--disable-worker-log-transfer&lt;/td&gt;\n&lt;td&gt;Трансфер логов Spark приложений из контейнера с воркером в таблицу на Кипарисе&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--enable-worker-log-json-mode&lt;/code&gt;, &lt;code&gt;--disable-worker-log-json-mode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;--disable-worker-log-json-mode&lt;/td&gt;\n&lt;td&gt;Запись логов воркера в формате JSON&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--worker-log-update-interval&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;10 min&lt;/td&gt;\n&lt;td&gt;Периодичность переноса логов Spark приложений с воркера на Кипарис&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--worker-log-table-ttl&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;7d&lt;/td&gt;\n&lt;td&gt;Время жизни таблицы с логами Spark приложений на Кипарисе&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--enable-dedicated-driver-operation-mode&lt;/code&gt;, &lt;code&gt;--disable-dedicated-driver-operation-mode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;--disable-dedicated-driver-operation-mode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Запуск выделенной YTsaurus операции для драйвера&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--driver-cores&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;--worker-cores&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Число ядер CPU, выделяемых для воркера, используемого для запуска драйверов&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--driver-memory&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;--worker-memory&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Объём памяти, выделяемой для воркера, используемого для запуска драйверов&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--driver-num&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;--worker-num&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Количество воркеров, запускаемых специально для драйверов&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--driver-cores-overhead&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;--worker-cores-overhead&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Дополнительное количество ядер, выделяемое воркерам для драйверов, см. &lt;code&gt;--worker-cores-overhead&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--driver-timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;--worker-timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Максимальное время, которое воркер будет ожидать регистрацию на Spark мастере. По истечении этого времени процесс воркера будет завершён с ошибкой&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--autoscaler-period&lt;/code&gt;, &lt;code&gt;--autoscaler-metrics-port&lt;/code&gt;, &lt;code&gt;--autoscaler-sliding-window&lt;/code&gt;, &lt;code&gt;--autoscaler-max-free-workers&lt;/code&gt;, &lt;code&gt;--autoscaler-slot-increment-step&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Параметры, используемые для работы с &lt;a href=\"user-guide/data-processing/spyt/cluster/cluster-start.html#auto-scale\"&gt;автоскейлером&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--enable-livy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;Запустить Livy сервер в составе кластера. Подробнее про Livy сервер описано &lt;a href=\"user-guide/data-processing/spyt/cluster/livy.html\"&gt;на соответвтвующей странице&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;1.74.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--livy-driver-cores&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;Количество ядер CPU, выделяемых драйверу, запускаемому через Livy&lt;/td&gt;\n&lt;td&gt;1.74.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--livy-driver-memory&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;1G&lt;/td&gt;\n&lt;td&gt;Объём памяти CPU, выделяемых драйверу, запускаемому через Livy&lt;/td&gt;\n&lt;td&gt;1.74.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--livy-max-sessions&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;td&gt;Максимальное количество сессий, которые одновременно можно запустить на Livy сервере&lt;/td&gt;\n&lt;td&gt;1.74.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Deprecated. Оставлено для обратной совместимости&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--discovery-dir&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Deprecated. Оставлено для обратной совместимости&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;-h&lt;/code&gt;, &lt;code&gt;--help&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Справка по параметрам команды&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/spyt/cluster/cluster-start.md","sourcePath":"ru/user-guide/data-processing/spyt/cluster/cluster-start.md"},"headings":[{"title":"Автоскейлер","href":"ru/user-guide/data-processing/spyt/cluster/cluster-start.html#auto-scale","level":2,"items":[{"title":"Как это работает","href":"ru/us
