        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе приводится верхнеуровневое описание кластера SPYT, его компонент и структуры приложения на Spark.&lt;/p&gt;\n&lt;p&gt;Запуск кластера описан в отдельном &lt;a href=\"user-guide/data-processing/spyt/cluster/cluster-start.html\"&gt;разделе&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"spark-app\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/cluster-desc.html#spark-app\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Spark-приложение&lt;/span&gt;&lt;/a&gt;Spark-приложение&lt;/h2&gt;\n&lt;p&gt;Spark-приложение состоит из &lt;em&gt;драйвера&lt;/em&gt; (driver) и &lt;em&gt;экзекьюторов&lt;/em&gt; (executor).&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Драйвер выполняет основной код, планирует SQL-запросы и разбивает их на &lt;em&gt;таски&lt;/em&gt;, которые можно выполнять параллельно.&lt;/li&gt;\n&lt;li&gt;Драйвер не выполняет таски сам, а \"поручает\" эту работу экзекьюторам. Драйвер направляет запрос на создание экзекьюторов планировщику (scheduler).&lt;/li&gt;\n&lt;li&gt;Планировщик выделяет на узлах кластера контейнеры необходимого размера и запускает в них экзекьюторы.&lt;/li&gt;\n&lt;li&gt;Экзекьюторы создаются в кластере и обмениваются сообщениями с драйвером по сети.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;img src=\"images/cluster_structure.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;p&gt;При запуске приложения необходимо указать характеристики экзекьюторов (ядра и память) и ограничение на число экзекьюторов.&lt;/p&gt;\n&lt;p&gt;По умолчанию во всех клиентах SPYT указаны экзекьюторы с 4 ядрами и 16 ГБ памяти (4 ГБ на ядро). Данная настройка должна подходить для большинства задач.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Экзекьютор может выполнять несколько подзадач одновременно. Как правило число подзадач, которое может выполнять экзекьютор, равно числу его ядер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"number-cores\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/cluster-desc.html#number-cores\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Число ядер в экзекьюторе&lt;/span&gt;&lt;/a&gt;Число ядер в экзекьюторе&lt;/h3&gt;\n&lt;p&gt;Spark не может изменять характеристики экзекьютора \"на лету\", но может работать с меньшим числом экзекьюторов, чем изначально предполагалось.&lt;br /&gt;\nЭкзекьютор – это один процесс, одна JVM. Если в кластере нет воркеров со свободными 16 ГБ памяти, экзекьютор не будет создан, даже если в кластере доступен меньший объем памяти. Необходимо, чтобы было свободно 16 ГБ памяти единоразово.&lt;/p&gt;\n&lt;p&gt;На каждое ядро экзекьтора в его JVM создается отдельный тред, который будет выполнять задачи. Со всеми вытекающими последствиями мультитредовости: чем больше тредов, тем больше накладные расходы.&lt;/p&gt;\n&lt;p&gt;Экзекьюторы с одним ядром невыгодны из-за расходов на общение экзекьюторов между собой, на широковещательные сообщения, на объекты-синглтоны, которые треды-исполнители могут переиспользовать между собой. Например, чтобы сделать map-side join, копия маленькой таблицы присоединяется к каждому экзекьютору. В случае одного экзекьютора с 4-мя ядрами потребуется хранить одну копию таблицы. В случае четырёх экзекьюторов по одному ядру потребуется четыре копии таблицы и как следствие больше памяти.&lt;/p&gt;\n&lt;p&gt;Более подробное описание содержится в &lt;a href=\"https://spark.apache.org/docs/latest/cluster-overview.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;документации Spark&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"spark-standalone\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/cluster-desc.html#spark-standalone\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Spark Standalone в YTsaurus&lt;/span&gt;&lt;/a&gt;Spark Standalone в YTsaurus&lt;/h2&gt;\n&lt;p&gt;Чтобы получить экзекьюторы, драйвер делает запрос &lt;em&gt;планировщику&lt;/em&gt; (scheduler) ресурсов.&lt;/p&gt;\n&lt;p&gt;Для создания контейнеров нужного размера необходимо знать, какие узлы кластера существуют и сколько в них ресурсов. Обычно функции создания контейнеров выполняет &lt;a href=\"https://hadoop.apache.org/docs/current/hadoop-yarn/hadoop-yarn-site/YARN.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YARN&lt;/a&gt; или &lt;a href=\"https://mesos.apache.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Mesos&lt;/a&gt;, в системе YTsaurus существует свой планировщик ресурсов.&lt;/p&gt;\n&lt;p&gt;В текущей реализации есть два варианта запуска Spark задач: &lt;a href=\"user-guide/data-processing/spyt/launch.html#submit\"&gt;с использованием планировщика YTsaurus&lt;/a&gt;, либо с использованием внутреннего Spark Standalone кластера, который разворачивается внутри Vanilla операции.&lt;/p&gt;\n&lt;p&gt;Spark Standalone состоит из &lt;em&gt;мастера&lt;/em&gt; и &lt;em&gt;воркеров&lt;/em&gt;. Каждый воркер знает, сколько ресурсов можно занять на узле кластера где запущен воркер, и умеет предоставлять ресурсы по запросу. Мастер координирует работу: он получает запросы от драйвера и решает, на каких воркерах создать экзекьюторы.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/cluster_scheme.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;p&gt;Для запроса ресурса у мастера драйверу необходимо знать хост и порт мастера. При запуске в Vanilla-операции Spark-мастер попадает на случайный узел кластера YTsaurus и открывает там порт в диапазоне от 27000 до 27200. После этого Spark-мастер прописывает свой хост и порт в Кипарисе в специальную директорию &lt;code&gt;discovery-path&lt;/code&gt;. В драйвере существует код, который обращается к Кипарису, узнаёт хост и порт Spark-мастера и обращается к нему.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/cluster_scheme_cyp.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;p&gt;Кластер планировщика запускается командой &lt;code&gt;spark-launch-yt&lt;/code&gt;. В аргументах команды необходимо указать:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;сколько ресурсов будет у каждого воркера (ядра / память);&lt;/li&gt;\n&lt;li&gt;число воркеров;&lt;/li&gt;\n&lt;li&gt;какую директорию Кипариса использовать как &lt;code&gt;discovery-path&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Разница между приложением и кластером:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Драйвер и экзекьюторы образуют Spark-приложение. Spark приложение решает прикладную задачу пользователя, например: сделать join двух таблиц, записать результат.&lt;/li&gt;\n&lt;li&gt;Мастер и воркеры образуют Spark-кластер. Spark-кластер отвечает на запросы приложений по запуску новых экзекьюторов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"cluster-mode\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/cluster/cluster-desc.html#cluster-mode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cluster mode&lt;/span&gt;&lt;/a&gt;Cluster mode&lt;/h2&gt;\n&lt;p&gt;На схемах в предыдущем пункте драйвер был изображен внутри Jupyter. Это один из вариантов запуска Spark – &lt;em&gt;client mode&lt;/em&gt;. В данном варианте драйвер выполняется на клиентском хосте (внешней по отношению к кластеру). А экзекьюторы создаются в кластере.&lt;/p&gt;\n&lt;p&gt;Существует и другой вариант запуска, который называется &lt;em&gt;cluster mode&lt;/em&gt;. В данном варианте драйвер запускается в кластере, так же как и экзекьюторы. Для работы в режиме cluster mode мастеру Spark Standalone необходимо сообщить что он должен запустить драйвер из заранее подготовленного и собранного кода приложения. Для этого существует утилита &lt;code&gt;spark-submit-yt&lt;/code&gt;. Мастер создает контейнер для драйвера на одном из воркеров. Воркер скачивает в контейнер код и запускает драйвер. После этого драйвер работает так же, как и в &lt;em&gt;client mode&lt;/em&gt;. Драйвер запрашивает экзекьюторов у мастера, выполняет код, распределяет задания.&lt;/p&gt;\n&lt;p&gt;По умолчанию воркеры могут скачивать код драйвера по протоколам HTTP, FTP и других. В случае SPYT воркеры могут загрузить код драйвера из YTsaurus.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/cluster_mode.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/spyt/cluster/cluster-desc.md","sourcePath":"ru/user-guide/data-processing/spyt/cluster/cluster-desc.md"},"headings":[{"title":"Spark-приложение","href":"ru/user-guide/data-processing/spyt/cluster/cluster-desc.html#spark-app","level":2,"items":[{"title":"Число ядер в экзекьюторе","href":"ru/user-guide/data-processing/spyt/cluster/cluster-desc.html#number-cores","level":3}]},{"title":"Spark Standalone в YTsaurus","href":"ru/user-guide/data-processing/spyt/cluster/cluster-desc.html#spark-standalone","level":2},{"title":"Cluster mode","href":"ru/user-guide/data-processing/spyt/cluster/cluster-desc.html#cluster-mode","level":2}],"title":"Описание кластера SPYT"},"router":{"pathname":"ru/user-guide/data-processing/spyt/cluster/cluster-desc","depth":6,"base":"../../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
