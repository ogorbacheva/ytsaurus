        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе собраны рекомендации по использованию системы YTsaurus для сценариев массивно-параллельной обработки данных.&lt;/p&gt;\n&lt;h2 id=\"slishkom-melkie-chanki\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/recommendations.html#slishkom-melkie-chanki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Слишком мелкие чанки&lt;/span&gt;&lt;/a&gt;Слишком мелкие чанки&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ситуация с мелкими чанками релевантна для статических таблиц. Сценарии работы с динамическими таблицами предполагают мелкогранулярные чтения для снижения времени ответа на запрос, поэтому небольшие чанки в случае динамических таблиц допустимы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Маленьким можно считать &lt;a href=\"user-guide/storage/chunks.html\"&gt;чанк&lt;/a&gt; размером менее 100 Мб. Чтобы чанков в системе не становилось слишком много, стоит стремиться к тому, чтобы средний размер чанка был не менее 512 Мб.&lt;/p&gt;\n&lt;p&gt;Мелкие чанки затрудняют работу кластера по нескольким причинам:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Мелкие чанки создают дополнительную нагрузку на мастер-серверы. Чем больше чанков, тем больше памяти мастер-серверов требуется для хранения мета-информации о чанках, и тем медленней они работают: медленнее пишут snapshot, дольше восстанавливаются из него в случае проблем.&lt;/li&gt;\n&lt;li&gt;Большое число мелких чанков приводит к медленному чтению данных. Если, например, 100 Мб данных расположены в миллионе чанков по одной записи в каждом, чтобы прочитать все данные, необходимо сделать миллион операций &lt;code&gt;seek&lt;/code&gt; по диску, что очень медленно, даже если выполнять их параллельно.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В результате выполнения операций или мелкогранулярной записи данных могут возникать таблицы с большим количеством мелких чанков. Чтобы бороться с подобной проблемой чанки таких таблиц необходимо укрупнять. Укрупнение чанков можно выполнить вызвав команду:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt merge --src //your/table --dst //your/table --spec &lt;span class=\"hljs-string\"&gt;'{combine_chunks=true;mode=&amp;lt;mode&amp;gt;}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"37\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-37\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-37\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-37.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Следует установить значение атрибута &lt;code&gt;&amp;lt;mode&amp;gt;&lt;/code&gt; в &lt;code&gt;sorted&lt;/code&gt;, для &lt;a href=\"user-guide/storage/static-tables.html#sorted_tables\"&gt;сортированной таблицы&lt;/a&gt; и &lt;code&gt;ordered&lt;/code&gt;, для &lt;a href=\"user-guide/storage/static-tables.html#unsorted_tables\"&gt;несортированной&lt;/a&gt;. Подробнее о типах таблиц в разделе &lt;a href=\"user-guide/storage/static-tables.html\"&gt;Статические таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;В обоих случаях merge сохранит порядок данных. Но в случае &lt;code&gt;sorted&lt;/code&gt; он также сохранит сортированность таблицы с точки зрения системы: таблица останется &lt;code&gt;sorted&lt;/code&gt; и сохранит все соответствующие атрибуты).&lt;/p&gt;\n&lt;p&gt;Если вы используете &lt;a href=\"api/python/userdoc.html\"&gt;Python-библиотеку&lt;/a&gt;, можно указать опцию конфигурации &lt;code&gt;auto_merge_output={action=merge}&lt;/code&gt;, и тогда библиотека сама будет укрупнять получающиеся таблицы, если в них слишком мелкие чанки.&lt;/p&gt;\n&lt;h2 id=\"mapreduce-vs-mapsortreduce\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/recommendations.html#mapreduce-vs-mapsortreduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MapReduce vs Map+Sort+Reduce&lt;/span&gt;&lt;/a&gt;MapReduce vs Map+Sort+Reduce&lt;/h2&gt;\n&lt;p&gt;Подробнее про устройство операции MapReduce, а также про то, почему она обычно быстрее цепочки Map+Sort+Reduce, в разделе &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Далее будут описаны случаи, когда &lt;strong&gt;не рекомендуется&lt;/strong&gt; использовать слитную операцию MapReduce.&lt;/p&gt;\n&lt;h3 id=\"tyazhyolyj-i-silno-filtruyushij-mapper\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/recommendations.html#tyazhyolyj-i-silno-filtruyushij-mapper\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тяжёлый и сильно фильтрующий mapper&lt;/span&gt;&lt;/a&gt;Тяжёлый и сильно фильтрующий mapper&lt;/h3&gt;\n&lt;p&gt;В качестве условного ориентира можно принять то, что тяжёлый mapper тратит более 100мс CPU на обработку одной строки. Для сильно фильтрующего mapper-а характерно, если объем входных данных в пять и более раз превышает объём выходных данных по строкам или байтам.&lt;/p&gt;\n&lt;p&gt;В таком случае необходимо, чтобы в map-фазе было как можно больше джобов, чтобы каждый из них выполнялся быстрее. У операции MapReduce существует ограничение на количество map-джобов, вызванное тем, что если их слишком много, то после из-за большого количества мелких случайных чтений с диска будет дорого выполнять фазу сортировки.&lt;/p&gt;\n&lt;p&gt;Правильное решение в данном случае — сначала запустить операцию Map, указав как можно больше джобов. После этого на полученных данных запустить слитную операцию MapReduce с пустым mapper-ом.&lt;/p&gt;\n&lt;h3 id=\"chastoe-ispolzovanie-mapreduce-po-odnomu-i-tomu-zhe-naboru-klyuchevyh-polej\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/recommendations.html#chastoe-ispolzovanie-mapreduce-po-odnomu-i-tomu-zhe-naboru-klyuchevyh-polej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Частое использование MapReduce по одному и тому же набору ключевых полей&lt;/span&gt;&lt;/a&gt;Частое использование MapReduce по одному и тому же набору ключевых полей&lt;/h3&gt;\n&lt;p&gt;Если данные необходимо обработать в Reduce несколько раз, то скорее всего будет выгоднее предварительно их отсортировать, и после этого выполнять обычные Reduce-операции. Типичный случай таких данных — логи.&lt;/p&gt;\n&lt;p&gt;Данная схема будет хорошо работать только в двух случаях:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Данные не меняются.&lt;/li&gt;\n&lt;li&gt;Данные дописываются в конец (append). Например, таблица отсортирована по времени. Приходит дополнительная порция данных, для которой все значения ключа (времени) больше, чем все значения ключа (времени) в таблице. Тогда порцию данных можно отсортировать, после запустить Reduce с параметром &lt;code&gt;teleport=%true&lt;/code&gt; Подробнее об опции в разделе &lt;a href=\"user-guide/data-processing/operations/reduce.html#foreign_tables\"&gt;Reduce&lt;/a&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"tyazhyolyj-reducer\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/recommendations.html#tyazhyolyj-reducer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тяжёлый reducer&lt;/span&gt;&lt;/a&gt;Тяжёлый reducer&lt;/h3&gt;\n&lt;p&gt;Аналогично случаю с тяжёлым mapper-ом, требуется запустить как можно больше reduce-джобов. Но у операции существует ограничение на количество партиций, а значит и на количество reduce-джобов.&lt;/p&gt;\n&lt;p&gt;Правильное решение в данном случае — это отсортировать таблицу, а затем запускать Reduce с как можно большим количеством джобов.&lt;/p&gt;\n&lt;h2 id=\"bolshoe-kolichestvo-zapisej-s-odinakovym-klyuchom-v-reduce-faze\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/recommendations.html#bolshoe-kolichestvo-zapisej-s-odinakovym-klyuchom-v-reduce-faze\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Большое количество записей с одинаковым ключом в reduce-фазе&lt;/span&gt;&lt;/a&gt;Большое количество записей с одинаковым ключом в reduce-фазе&lt;/h2&gt;\n&lt;p&gt;Для борьбы с данной проблемой в YTsaurus существуют &lt;a href=\"user-guide/data-processing/operations/mapreduce#reduce_combiner.md\"&gt;Reduce-комбайнеры&lt;/a&gt;, которые позволяют обрабатывать большие ключи в нескольких джобах в reduce-фазе.&lt;/p&gt;\n&lt;h3 id=\"map-kombajnery\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/recommendations.html#map-kombajnery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Map-комбайнеры&lt;/span&gt;&lt;/a&gt;Map-комбайнеры&lt;/h3&gt;\n&lt;p&gt;Идея map-комбайнера заключается в том, чтобы агрегировать данные в map-фазе.&lt;/p&gt;\n&lt;p&gt;Классический пример использования map-комбайнеров — это &lt;a href=\"http://wiki.apache.org/hadoop/WordCount\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;задача WordCount&lt;/a&gt;. В данной задаче на map-стадии необходимо выписывать не пары &lt;code&gt;(word, 1)&lt;/code&gt;, а пары &lt;code&gt;(word, count)&lt;/code&gt;, где &lt;code&gt;count&lt;/code&gt; — количество вхождений данного слова в рамках данного джоба. То есть агрегацию данных полезно выполнять не только в reduce-фазе, но и сразу в map-фазе.&lt;/p&gt;\n&lt;p&gt;Специальной поддержки map-комбайнеров в системе YTsaurus нет. Причиной больших ключей зачастую является отсутствие агрегации в map-стадии. Поэтому если агрегация возможна, то рекомендуется её выполнять.&lt;/p&gt;\n&lt;h2 id=\"bolshoe-chislo-vyhodnyh-tablic-operacii\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/recommendations.html#bolshoe-chislo-vyhodnyh-tablic-operacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Большое число выходных таблиц операции&lt;/span&gt;&lt;/a&gt;Большое число выходных таблиц операции&lt;/h2&gt;\n&lt;p&gt;Для каждой выходной таблицы операции резервируется буфер в оперативной памяти. На этапе запуска операции размер буферов под все выходные таблицы суммируется и прибавляется к тому объёму памяти, который пользователь указал в спецификации операции.&lt;/p&gt;\n&lt;p&gt;Технически размер буфера под выходные таблицы неявно учитывается в памяти процесса &lt;code&gt;JobProxy&lt;/code&gt; и зависит от настроек кластера, а также значения атрибута &lt;code&gt;erasure_codec&lt;/code&gt; выходной таблицы. &lt;/p&gt;\n&lt;p&gt;Если выходных таблиц много, суммарный объём памяти может оказаться довольно большим, так что планировщик не сможет быстро найти узел кластера с подходящим объёмом свободной памяти, а может не найти его вовсе. В таком случае операция будет прервана, пользователь получит ошибку &lt;code&gt;No online node can satisfy the resource demand&lt;/code&gt;. В сообщении об ошибке будет указано, какой объём памяти был запрошен.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Рекомендуется указывать не более нескольких десятков выходных таблиц для операции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/operations/recommendations.md","sourcePath":"ru/user-guide/data-processing/operations/recommendations.md"},"headings":[{"title":"Слишком мелкие чанки","href":"ru/user-guide/data-processing/operations/recommendations.html#slishkom-melkie-chanki","level":2},{"title":"MapReduce vs Map+Sort+Reduce","href":"ru/user-guide/data-processing/operations/recommendations.html#mapreduce-vs-mapsortreduce","level":2,"items":[{"title":"Тяжёлый и сильно фильтрующий mapper","href":"ru/user-guide/data-processing/operations/recommendations.html#tyazhyolyj-i-silno-filtruyushij-mapper","level":3},{"title":"Частое использование MapReduce по одному и тому же набору ключевых полей","href":"ru/user-guide/data-processing/operations/recommendations.html#chastoe-ispolzovanie-mapreduce-po-odnomu-i-tomu-zhe-naboru-klyuchevyh-polej","level":3},{"title":"Тяжёлый reducer","href":"ru/user-guide/data-processing/operations/recommendations.html#tyazhyolyj-reducer","level":3}]},{"title":"Большое количество записей с одинаковым ключом в reduce-фазе","href":"ru/user-guide/data-processing/operations/recommendations.html#bolshoe-kolichestvo-zapisej-s-odinakovym-klyuchom-v-reduce-faze","level":2,"items":[{"title":"Map-комбайнеры","href":"ru/user-guide/data-processing/operations/recommendations.html#map-kombajnery","level":3}]},{"title":"Большое число выходных таблиц операции","href":"ru/user-guide/data-processing/operations/recommendations.html#bolshoe-chislo-vyhodnyh-tablic-operacii","level":2}],"title":"Как правильно и эффективно использовать систему YTsaurus"},"router":{"pathname":"ru/user-guide/data-processing/operations/recommendations","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
