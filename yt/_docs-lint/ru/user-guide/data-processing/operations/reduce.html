            {"data":{"leading":false,"html":"&lt;p&gt;Операция Reduce может состоять из одного или нескольких джобов. На вход каждому джобу поступает часть данных из входных таблиц, которые обрабатываются пользовательским скриптом, результат записывается в выходную таблицу. Входные данные группируются по набору колонок, указанному параметром &lt;code&gt;reduce_by&lt;/code&gt;. Группировка гарантирует, что все данные с одним и тем же значением в колонках &lt;code&gt;reduce_by&lt;/code&gt; попадут на вход одному джобу. Гарантию можно ослабить с помощью опции &lt;code&gt;enable_key_guarantee&lt;/code&gt;. Для запуска операции необходимо, чтобы каждая входная таблица была отсортирована по набору колонок, начинающемуся с &lt;code&gt;reduce_by&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Общие параметры для всех типов операций описаны в разделе &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Настройки операций&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;У операции Reduce поддерживаются следующие параметры (в скобках указаны значения по умолчанию, если заданы):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;reducer&lt;/code&gt; — пользовательский скрипт.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;input_table_paths&lt;/code&gt; — список входных таблиц с указанием полных путей (не может быть пустым).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;output_table_paths&lt;/code&gt; — список выходных таблиц.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;reduce_by&lt;/code&gt; — набор колонок, по которым осуществляется группировка.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;sort_by&lt;/code&gt; (по умолчанию совпадает с &lt;code&gt;reduce_by&lt;/code&gt;) —  набор колонок, по которым должны быть отсортированы первичные входные таблицы. Опция включает дополнительную проверку на сортированность входных таблиц и дает гарантии на сортированность строк по заданному набору колонок внутри пользовательского скрипта. Последовательность &lt;code&gt;reduce_by&lt;/code&gt; полей должна быть префиксом последовательности &lt;code&gt;sort_by&lt;/code&gt; полей.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;job_count&lt;/code&gt;, &lt;code&gt;data_weight_per_job&lt;/code&gt; (256 Mb) — опции, которые указывают, сколько джобов должно быть запущено. Имеют рекомендательный характер. Опция &lt;code&gt;job_count&lt;/code&gt; имеет приоритет над &lt;code&gt;data_weight_per_job&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;pivot_keys&lt;/code&gt; — с помощью данной опции можно производить ручное партицирование данных, то есть определять, в какие джобы попадут определенные диапазоны данных. В качестве значения опции нужно указать сортированный список ключей таблицы, которые будут пограничными.&lt;br /&gt;\nНапример, если &lt;code&gt;pivot_keys = [[\"a\", 3], [\"c\", -1], [\"x\", 42]]&lt;/code&gt;, то запустится не более четырёх джобов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;на ключи строго до  &lt;code&gt;[\"a\", 3]&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;на ключи от &lt;code&gt;[\"a\", 3]&lt;/code&gt; (включительно) до &lt;code&gt;[\"c\", -1]&lt;/code&gt; (не включительно);&lt;/li&gt;\n&lt;li&gt;на ключи от &lt;code&gt;[\"c\", -1]&lt;/code&gt; (включительно) до &lt;code&gt;[\"x\", 42]&lt;/code&gt; (не включительно);&lt;/li&gt;\n&lt;li&gt;на ключи от &lt;code&gt;[\"x\", 42]&lt;/code&gt; до конца.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Планировщик не будет пытаться разбивать такие джобы на более мелкие, при этом, если какие-то из диапазонов не содержат ключей, то соответствующие джобы могут быть не запущены. Но гарантировать незапуск нельзя, так как планировщик видит не данные полностью, а только выборки из них.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;enable_key_guarantee&lt;/code&gt; — опция, включающая/отключающая гарантию того, что все записи с одним ключом будут поданы на вход одному джобу (по умолчанию &lt;code&gt;true&lt;/code&gt;). Существует специальный сценарий использования данной опции в &lt;a href=\"user-guide/data-processing/operations/reduce.html#foreign_tables\"&gt;Reduce с внешними таблицами&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;auto_merge&lt;/code&gt; — словарь, содержащий настройки автоматического объединения выходных чанков небольшого размера. По умолчанию автоматическое слияние отключено.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Имеются следующие гарантии о порядке входных данных в операции Reduce:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Данные из каждой входной таблицы разбиваются по джобам непрерывными частями по &lt;code&gt;reduce_by&lt;/code&gt; колонкам. То есть в один джоб не может попасть ключ &lt;code&gt;A&lt;/code&gt; и ключ &lt;code&gt;C&lt;/code&gt;, а в другой джоб — ключ &lt;code&gt;B&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;В рамках джоба данные из всех входных таблиц объединяются и оказываются отсортированы сперва по полям, указанным в параметре &lt;code&gt;sort_by&lt;/code&gt;, а затем по индексу входной таблицы (&lt;code&gt;table_index&lt;/code&gt;). Для внешних (&lt;code&gt;foreign&lt;/code&gt;) таблиц внутри одного &lt;code&gt;join_by&lt;/code&gt;-ключа сортировка выполняется по индексу внешней таблицы. Подробнее о внешних таблицах рассказано &lt;a href=\"user-guide/data-processing/operations/reduce.html#foreign_tables\"&gt;далее&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Операция Reduce специальным образом обрабатывает входные таблицы с атрибутом &lt;code&gt;teleport=%true&lt;/code&gt; на пути. Чанки таких таблиц, не пересекающиеся по диапазону ключей с чанками других входных таблиц, не подаются в пользовательский скрипт. Такие чанки без обработки записываются в выходную таблицу, на пути которой выставлен атрибут &lt;code&gt;teleport=%true&lt;/code&gt;. Подобных выходных таблиц может быть не более одной. На выходной таблице по-прежнему можно указать атрибут &lt;code&gt;sorted_by&lt;/code&gt;, чтобы таблица была сортирована. В таком случае пользователь должен следить за тем, чтобы диапазон ключей на выходе пользовательского скрипта был не шире, чем диапазон ключей на входе операции.&lt;/p&gt;\n&lt;h2 id=\"primer-ispolzovaniya\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/reduce.html#primer-ispolzovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример использования&lt;/span&gt;&lt;/a&gt;Пример использования&lt;/h2&gt;\n&lt;p&gt;Характерный пример использования — обновления справочника или агрегатов.&lt;br /&gt;\nПусть имеется таблица &lt;code&gt;//some_user/stat&lt;/code&gt;, в которой хранится статистика посещений по дням. В таблице две колонки: &lt;code&gt;time&lt;/code&gt; и &lt;code&gt;count&lt;/code&gt; , данные отсортированы по колонке &lt;code&gt;time&lt;/code&gt;. Данные в таблице хранятся в двух чанках: в первом чанке — даты с 2013-06-01 по 2013-08-15, во втором чанке — даты c 2013-08-16 по 2013-09-16. Также пусть имеется сортированная таблица &lt;code&gt;//some_user/update&lt;/code&gt; с обновлениями статистики за сентябрь. Тогда можно запустить операцию Reduce для обновления основной таблицы, как показано ниже.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;yt reduce --src &amp;lt;teleport=%true&amp;gt;//some_user/stat --src //some_user/update --dst &amp;lt;teleport=%true, sorted_by=[time]&amp;gt;//some_user/stat\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"105\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-105\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-105\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-105.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В результате первый чанк таблицы &lt;code&gt;//some_user/stat&lt;/code&gt; будет «телепортирован» в выходную таблицу в исходном виде, без обработки.&lt;/p&gt;\n&lt;p&gt;Ещё один частный способ применения: отфильтровать из маленькой сортированной таблицы строки, совпадающие ключами с большой сортированной таблицей: в этом случае можно добавить выходную таблицу с атрибутом &lt;code&gt;&amp;lt;teleport=%true&amp;gt;&lt;/code&gt; и удалить её после выполнения. Выходная таблица будет содержать только чанки большой таблицы, которых не было в маленькой.&lt;br /&gt;\nПример запуска Reduce-операции с подобной фильтрацией:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;yt reduce --src &amp;lt;teleport=%true&amp;gt;//fat_table --src //small/table --dst //results --dst &amp;lt;teleport=%true&amp;gt;//temp_table_to_throw_out ...; yt remove //temp_table_to_throw_out\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"112\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-112\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-112\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-112.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"foreign_tables\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/reduce.html#foreign_tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reduce с внешними таблицами&lt;/span&gt;&lt;/a&gt;Reduce с внешними таблицами&lt;/h2&gt;\n&lt;p&gt;Reduce с внешними таблицами — это модификация операции Reduce, в которой часть входных таблиц помечены как внешние (&lt;code&gt;foreign&lt;/code&gt;) таблицы и выполняют роль справочников, данные которых добавляются к потоку данных из «обычных» (первичных, &lt;code&gt;primary&lt;/code&gt;) таблиц. Для внешних таблиц используется специальный набор ключевых колонок &lt;code&gt;join_by&lt;/code&gt;, который должен быть префиксом набора колонок &lt;code&gt;reduce_by&lt;/code&gt;. Возможна ситуация, когда записи с одним и тем же &lt;code&gt;join_by&lt;/code&gt; ключом, но разными &lt;code&gt;reduce_by&lt;/code&gt; ключами попали в разные джобы — в таком случае соответствующие записи из внешних таблиц будут поданы на вход всем джобам, а значит, обработаны более одного раза. Возможна обратная ситуация, если таблица справочник может содержать больше различных комбинаций значений, чем основная таблица. Если записи из внешней таблицы не соответствует ни одна запись из основных, то такая запись может не попасть ни в один джоб.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Поскольку чанки внешних таблиц читаются много раз, категорически не рекомендуется использовать для них &lt;a href=\"https://en.wikipedia.org/wiki/Erasure_code\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;erasure-кодирование&lt;/a&gt;. Напротив, если внешняя таблица маленькая, стоит выставить для неё повышенный коэффициент репликации. Использование &lt;code&gt;erasure&lt;/code&gt; для внешней таблицы может привести к перекосу нагрузки на чтение по узлам кластера и деградации производительности всего кластера.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Важным отличием Reduce с внешними таблицами от обычной Reduce-операции является гранулярность вызова пользовательского скрипта в python-wrapper и C++ wrapper. В отличие от обычной Reduce-операции, пользовательский скрипт (метод &lt;code&gt;IReducer::Do&lt;/code&gt; в С++ API и функция-обработчик в python) вызывается на каждый &lt;code&gt;join_by&lt;/code&gt; ключ, а не &lt;code&gt;reduce_by&lt;/code&gt; ключ.&lt;br /&gt;\nТребования к спецификации для Reduce с внешними таблицами:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;должна быть указана хотя бы одна первичная таблица (отсутствует атрибут &lt;code&gt;foreign&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;должна быть указана хотя бы одна внешняя таблица при помощи атрибута &lt;code&gt;&amp;lt;foreign=%true&amp;gt;&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;должно быть указано значение &lt;code&gt;join_by&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;join_by&lt;/code&gt; должен быть префиксом или совпадать с &lt;code&gt;reduce_by&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;нельзя использовать &lt;code&gt;join_by&lt;/code&gt; без внешних таблиц и внешние таблицы без &lt;code&gt;join_by&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;нельзя устанавливать атрибут &lt;code&gt;teleport&lt;/code&gt; на внешнюю таблицу;&lt;/li&gt;\n&lt;li&gt;нельзя задавать множественные диапазоны (ranges) для внешней таблицы, но одна и та же внешняя таблица может быть указана несколько раз с разными диапазонами.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Также для операции Reduce с внешними таблицами доступна опция &lt;code&gt;consider_only_primary_size&lt;/code&gt; (по умолчанию &lt;code&gt;%false&lt;/code&gt;), при включении которой при разбивке джобов будет учитываться только объем данных в первичных (&lt;code&gt;primary&lt;/code&gt;) таблицах.&lt;/p&gt;\n&lt;p&gt;Выставление опции &lt;code&gt;enable_key_guarantee=%false&lt;/code&gt; в Reduce с внешними таблицами имеет особую семантику:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Отключается гарантия на то, что все записи с одинаковым ключом из первичной таблицы попадут в один джоб. При этом сохраняется гарантия того, что если в джоб попала запись из первичной таблицы с некоторым ключом, то все записи с таким же ключом из всех внешних таблиц попадут в тот же джоб.&lt;/li&gt;\n&lt;li&gt;Список ключей пользователь должен передавать в &lt;code&gt;join_by&lt;/code&gt;, указывать &lt;code&gt;reduce_by&lt;/code&gt; запрещено.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Рекомендуется использовать операцию Reduce с опцией &lt;code&gt;enable_key_guarantee=%false&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"primer-specifikacii\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/reduce.html#primer-specifikacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример спецификации&lt;/span&gt;&lt;/a&gt;Пример спецификации&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;{\n  &lt;span class=\"hljs-string\"&gt;data_weight_per_job&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1000000&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;reduce_by&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;sort_by&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"subkey\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;input_table_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/input_table\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;output_table_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/unsorted_output_table\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;&amp;lt;sorted_by&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;]&lt;span class=\"hljs-string\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"//tmp/sorted_output_table\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;reducer&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; {\n    &lt;span class=\"hljs-string\"&gt;command&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"python my_reducer.py\"&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;file_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/my_reducer.py\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  }&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;job_io&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; {\n    &lt;span class=\"hljs-string\"&gt;table_writer&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; {\n      &lt;span class=\"hljs-string\"&gt;max_row_weight&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;10000000&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n    }\n  }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"193\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-193\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-193\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-193.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/operations/reduce.md","sourcePath":"ru/user-guide/data-processing/operations/reduce.md"},"headings":[{"title":"Пример использования","href":"ru/user-guide/data-processing/operations/reduce.html#primer-ispolzovaniya","level":2},{"title":"Reduce с внешними таблицами","href":"ru/user-guide/data-processing/operations/reduce.html#foreign_tables","level":2},{"title":"Пример спецификации","href":"ru/user-guide/data-processing/operations/reduce.html#primer-specifikacii","level":2}],"title":"Reduce"},"router":{"pathname":"ru/user-guide/data-processing/operations/reduce","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"W
