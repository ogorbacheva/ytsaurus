            {"data":{"leading":false,"html":"&lt;p&gt;Операция Erase удаляет указанный диапазон строк из таблицы. В случае, когда для входной таблицы не указан диапазон (range), из таблицы будут удалены все данные (сама таблица при этом останется).&lt;/p&gt;\n&lt;p&gt;Общие параметры для всех типов операций описаны в разделе &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Настройки операций&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;У операции Erase поддерживаются следующие параметры (в скобках указаны значения по умолчанию, если заданы):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;table_path&lt;/code&gt; — путь к входной таблице. Поддерживается указание диапазонов строк на входной таблице, например, &lt;code&gt;//path/table[#10:#100]&lt;/code&gt;. Можно удалить не все данные в таблице, а лишь определенный диапазон строк;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;combine_chunks&lt;/code&gt; (false) — объединить оставшиеся чанки в таблице, чтобы они были достаточно большими;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;schema_inference_mode&lt;/code&gt; (auto) — режим определения схемы. Доступные значения: auto, from_input, from_output. Подробности в разделе &lt;a href=\"user-guide/storage/static-schema.html#schema_inference\"&gt;Схема данных&lt;/a&gt;;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"primer-specifikacii\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/erase.html#primer-specifikacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример спецификации&lt;/span&gt;&lt;/a&gt;Пример спецификации&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;{\n  &lt;span class=\"hljs-string\"&gt;table_path&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"//tmp/input_table[#10:#100]\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;combine_chunks&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;%true;&lt;/span&gt;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"29\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-29\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-29\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-29.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/operations/erase.md","sourcePath":"ru/user-guide/data-processing/operations/erase.md"},"headings":[{"title":"Пример спецификации","href":"ru/user-guide/data-processing/operations/erase.html#primer-specifikacii","level":2}],"title":"Erase"},"router":{"pathname":"ru/user-guide/data-processing/operations/erase","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
