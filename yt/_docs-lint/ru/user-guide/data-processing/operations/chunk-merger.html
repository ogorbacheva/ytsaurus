        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Для статических таблиц YTsaurus поддерживает возможность автоматического укрупнения чанков на стороне мастер-сервера. В отличие от операции &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt;, данный способ не использует вычислительные ресурсы пула.&lt;/p&gt;\n&lt;p&gt;Для того чтобы включить автоматическое укрупнение чанков, достаточно выставить у таблицы атрибут &lt;code&gt;@chunk_merger_mode&lt;/code&gt; в одно из значений ниже:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;shallow&lt;/strong&gt; — объединение чанков на уровне метаданных, без распаковки. Такой подход работает, только если чанки достаточно «похожи» (в плане сортированности, колонок, compression-кодека и т. д.). Также в какой-то момент у результирующего чанка может стать слишком много &lt;a href=\"user-guide/storage/chunks.html#chunk-size\"&gt;блоков&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;deep&lt;/strong&gt; — объединение чанков с полным пережатием (путём вычитывания всех входных чанков и записи в новый). Этот режим существенно более дорогой, чем предыдущий, но позволяет объединить чанки с разными характеристиками, которые оказались в одной таблице. Этот режим можно также использовать, чтобы избавиться от мелких блоков или чанков в старых форматах.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;auto&lt;/strong&gt; (рекомендуется) — объединение чанков в shallow режиме с откатом в deep в случае неудачи.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;По умолчанию рекомендуется использовать &lt;code&gt;auto&lt;/code&gt; (другие режимы тоже разрешены, но переключаться на них стоит, только хорошо понимая, зачем):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/dir_with_tables/table_i_want_to_merge/@chunk_merger_mode auto\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"26\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-26\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-26\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-26.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если необходимо мержить все таблицы в определённом поддереве, атрибут можно выставить на всю директорию:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/dir_with_tables/@chunk_merger_mode auto\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"30\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-30\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-30\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-30.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данный механизм работает только для статических таблиц. Динамические таблицы имеют собственные механизмы укрупнения чанков. Выставление атрибута &lt;code&gt;chunk_merger_mode&lt;/code&gt; для них ни к чему не приведёт.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Следует заметить, что &lt;code&gt;chunk_merger_mode&lt;/code&gt; — это &lt;a href=\"user-guide/storage/chunks.html#common\"&gt;наследуемый атрибут&lt;/a&gt;. Это означает, что после его установки его значение будут наследовать все новые таблицы в директории, но для старых ничего не поменяется, поэтому в момент включения следует дополнительно пройтись по всем таблицам.&lt;/p&gt;\n&lt;p&gt;Укрупнение чанков инициируется в момент установки атрибута и каждый раз при записи в таблицу (при этом, в случае дозаписи в качестве оптимизации система попытается перемержить лишь хвост таблицы).&lt;/p&gt;\n&lt;h2 id=\"atributy-ukrupneniya-na-akkaunte\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/chunk-merger.html#atributy-ukrupneniya-na-akkaunte\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атрибуты укрупнения на аккаунте&lt;/span&gt;&lt;/a&gt;Атрибуты укрупнения на аккаунте&lt;/h2&gt;\n&lt;p&gt;Каждый аккаунт содержит атрибуты, позволяющие управлять механизмом укрупнения чанков:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;allow_using_chunk_merger&lt;/code&gt; — разрешено ли мержить чанки для таблиц этого аккаунта;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;chunk_merger_node_traversal_concurrency&lt;/code&gt; — количество таблиц, для которых можно одновременно запланировать мерж-джобы;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;merge_job_rate_limit&lt;/code&gt; — количество джобов, которое можно планировать в секунду.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;По умолчанию эти настройки выставлены так, что автоматическое укрупнение чанков для каждого аккаунта будет включено.&lt;/p&gt;\n&lt;h2 id=\"pro-diagnostiku\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/chunk-merger.html#pro-diagnostiku\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Про диагностику&lt;/span&gt;&lt;/a&gt;Про диагностику&lt;/h2&gt;\n&lt;p&gt;У таблиц есть несколько системных атрибутов, позволяющих узнать о текущем статусе укрупнения чанков. Эти атрибуты не отображаются в веб-интерфейсе — чтобы посмотреть их, следует запросить их через CLI.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;@chunk_merger_status&lt;/code&gt; — статус таблицы в пайплайне мержа, может принимать значения &lt;code&gt;not_in_merge_pipeline&lt;/code&gt;, &lt;code&gt;awaiting_merge&lt;/code&gt; и &lt;code&gt;in_merge_pipeline&lt;/code&gt;. С момента срабатывания триггера для укрупнения чанков и до момента, когда мержер перестанет с таблицей что-либо делать, может пройти существенное количество времени. Если вы выставили &lt;code&gt;chunk_merger_mode&lt;/code&gt; на таблицу, но чанки в ней всё ещё мелки, то стоит посмотреть на &lt;code&gt;chunk_merger_status&lt;/code&gt; и дождаться, пока он станет &lt;code&gt;not_in_merge_pipeline&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;@chunk_merger_traversal_info/chunk_count&lt;/code&gt; — количество уже обработанных мержером чанков, укрупнять которые больше не планируется. Может быть полезно для понимания, какие чанки уже не помержатся.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пусть для некоторой таблицы было включено автоматическое укрупнение, после которого в ней осталась 1000 чанков, а теперь необходимо дописывать данные в конец таблицы. Рассматривать чанки с самого начала после каждой записи в таблицу нет смысла — если их не объединили до этого, то скорее всего, это не потребуется и сейчас. При этом может понадобиться склеить свежедобавленный чанк с некоторым количеством последних из старых. Так, если &lt;code&gt;@chunk_merger_traversal_info/chunk_count&lt;/code&gt; равен, к примеру, 980, то в дальнейшем будут рассматриваться лишь последние 20 чанков, и именно их имеет смысл пытаться перемержить с новыми при будущих дозаписях.&lt;/p&gt;\n&lt;p&gt;Автоматическое укрупнение чанков не берёт локи на таблицы, поэтому перемерживание должно быть полностью незаметно и не мешать остальным процессам. Однако, у этого есть неприятное следствие: иногда такие мержи могут завершаться неудачей (например, если за время выполнения мержа таблица была полностью перезаписана новыми данными). Система автоматически ретраит неудавшиеся мержи в случае, если это возможно (это может быть невозможно, если таблица была удалена или стала динамической). Однако, если таблица часто перезаписывается новыми данными, такой процесс может сходиться долго.&lt;/p&gt;\n&lt;h2 id=\"metriki-v-prometheus\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/chunk-merger.html#metriki-v-prometheus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метрики в Prometheus&lt;/span&gt;&lt;/a&gt;Метрики в Prometheus&lt;/h2&gt;\n&lt;p&gt;Для сбора метрик по укрупнению чанков в Prometheus используются следующие временные ряды:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;yt.chunk_server.chunk_merger_account_queue_size&lt;/code&gt; — поаккаунтные очереди на укрупнение чанков. Если очередь аккаунта пуста, стоит убедиться, что выставлен правильный атрибут для всех нужных таблиц. Также следует убедиться, что настройки аккаунта позволяют мержить таблицы: атрибут &lt;code&gt;allow_using_chunk_merger&lt;/code&gt; переключен в &lt;code&gt;true&lt;/code&gt;, а в атрибутах &lt;code&gt;chunk_merger_node_traversal_concurrency&lt;/code&gt; и &lt;code&gt;merge_job_rate_limit&lt;/code&gt; не выставлен 0.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;yt.chunk_server.chunk_merger_chunk_replacements_succeeded&lt;/code&gt; — количество успешных мержей.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;yt.chunk_server.chunk_merger_chunk_replacements_failed&lt;/code&gt; — количество неудавшихся мержей.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Наличие определённого количества неудавшихся мержей — это нормально и полностью избавиться от них не получится, но если оно превышает количество успешных, то стоит обратить на это внимание. Возможно, мерж включен для таблиц, которые постоянно перезаписываются с нуля новыми данными, или очень недолгоживущих таблиц. В таком случае, автоматическое укрупнение для них лучше отключить.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/operations/chunk-merger.md","sourcePath":"ru/user-guide/data-processing/operations/chunk-merger.md"},"headings":[{"title":"Атрибуты укрупнения на аккаунте","href":"ru/user-guide/data-processing/operations/chunk-merger.html#atributy-ukrupneniya-na-akkaunte","level":2},{"title":"Про диагностику","href":"ru/user-guide/data-processing/operations/chunk-merger.html#pro-diagnostiku","level":2},{"title":"Метрики в Prometheus","href":"ru/user-guide/data-processing/operations/chunk-merger.html#metriki-v-prometheus","level":2}],"title":"Автоматическое укрупнение чанков"},"router":{"pathname":"ru/user-guide/data-processing/operations/chunk-merger","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
