        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Существует возможность общаться с YTsaurus кластером по gRPC протоколу.&lt;/p&gt;\n&lt;p&gt;Плюсы данной возможности:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Полноценная поддержка динамических таблиц, есть возможность работать с транзакциями.&lt;/li&gt;\n&lt;li&gt;Поддержка всех основных команд для работы с Кипарисом.&lt;/li&gt;\n&lt;li&gt;gRPC — промышленный стандарт для общения с сервисом, легко устанавливать через pip или deb-пакеты. Также имеется документация в интернете.&lt;br /&gt;\nМинусы:&lt;/li&gt;\n&lt;li&gt;Протокол более низкоуровневый. Более сложная работа с табличными данными, требуется сериализовывать/десериализовывать строки вручную.&lt;/li&gt;\n&lt;li&gt;В данный момент отсутствует интеграции с готовыми HTTP клиентами YTsaurus (C++ или Python).&lt;/li&gt;\n&lt;li&gt;Написание полноценной удобной клиентской библиотеки поверх API — это сложная и объемная задача. Для части языков (C++, Python, Java) она отчасти решена нами.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;gRPC запросы обслуживают &lt;a href=\"user-guide/proxy/rpc.html\"&gt;RPC-прокси&lt;/a&gt; YTsaurus. Как следует из названия прокси (RPC) — от клиента сервер ожидает &lt;a href=\"https://developers.google.com/protocol-buffers/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;protobuf&lt;/a&gt; сообщение. Ответом сервера также будет сообщение. Каждая команда YTsaurus, такая как «создать узел в Кипарисе», «записать строки» представлена в виде пары сообщений (с префиксами TReq и TRsp для запроса и ответа соответственно). Пример: &lt;code&gt;TReqCreateNode, TRspCreateNode&lt;/code&gt; —  создание узла в Кипарисе. Сообщения и их описания можно посмотреть в proto файле.&lt;/p&gt;\n&lt;h2 id=\"ustanovka-i-kompilyaciya-proto-soobshenij\"&gt;&lt;a href=\"ru/user-guide/proxy/grpc.html#ustanovka-i-kompilyaciya-proto-soobshenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка и компиляция proto сообщений&lt;/span&gt;&lt;/a&gt;Установка и компиляция proto сообщений&lt;/h2&gt;\n&lt;p&gt;Скомпилированные сообщения можно установить через pip: &lt;code&gt;pip install ytsaurus-proto&lt;/code&gt;. Также необходимо установить gRPC и protobuf следующих версий (более свежие версии тоже можно, но на более свежих пакетах функциональность не тестировалась):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;protobuf&amp;gt;=3.2.1\ngrpcio==1.2.0rc1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"47\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-47\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-47\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-47.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"primery\"&gt;&lt;a href=\"ru/user-guide/proxy/grpc.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h2&gt;\n&lt;p&gt;Короткий пример get запроса к Кипарису через gRPC:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt_proto.yt.client.api.rpc_proxy.proto.api_service_pb2 &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; api_service_pb2\n\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.yson &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yson\n\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\n\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; grpc\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; random\n\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; __name__ == &lt;span class=\"hljs-string\"&gt;\"__main__\"&lt;/span&gt;:\n    &lt;span class=\"hljs-comment\"&gt;# Будем делать запрос к кластеру&lt;/span&gt;\n    yt.config[&lt;span class=\"hljs-string\"&gt;\"proxy\"&lt;/span&gt;][&lt;span class=\"hljs-string\"&gt;\"url\"&lt;/span&gt;] = &lt;span class=\"hljs-string\"&gt;\"cluster-name\"&lt;/span&gt;\n\n    &lt;span class=\"hljs-comment\"&gt;# Получаем список gRPC прокси, команда \"discover_proxies\" доступна с четвертой версии API.&lt;/span&gt;\n    yt.config[&lt;span class=\"hljs-string\"&gt;\"api_version\"&lt;/span&gt;] = &lt;span class=\"hljs-string\"&gt;\"v4\"&lt;/span&gt;\n    proxies = yt.driver.make_formatted_request(&lt;span class=\"hljs-string\"&gt;\"discover_proxies\"&lt;/span&gt;, {&lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"grpc\"&lt;/span&gt;}, &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=&lt;span class=\"hljs-literal\"&gt;None&lt;/span&gt;)[&lt;span class=\"hljs-string\"&gt;\"proxies\"&lt;/span&gt;]\n\n    &lt;span class=\"hljs-comment\"&gt;# Создаем gRPC соединение к случайной прокси из списка.&lt;/span&gt;\n    channel = grpc.insecure_channel(&lt;span class=\"hljs-built_in\"&gt;str&lt;/span&gt;(random.choice(proxies)))\n\n    &lt;span class=\"hljs-comment\"&gt;# Заполняем proto сообщение, делаем get на путь //home/username.&lt;/span&gt;\n    get_req = api_service_pb2.TReqGetNode(path=&lt;span class=\"hljs-string\"&gt;\"//home/username\"&lt;/span&gt;)\n\n    &lt;span class=\"hljs-comment\"&gt;# Передаем минимальную версию протокола (подробнее об этом ниже) и токен доступа.&lt;/span&gt;\n    metadata = [\n        (&lt;span class=\"hljs-string\"&gt;\"yt-protocol-version\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"1.0\"&lt;/span&gt;),\n        (&lt;span class=\"hljs-string\"&gt;\"yt-auth-token\"&lt;/span&gt;, yt._get_token())\n    ]\n\n    &lt;span class=\"hljs-comment\"&gt;# Инициируем unary-unary запрос (то есть одно сообщение от клиента - запрос и одно сообщение от сервера - ответ).&lt;/span&gt;\n    unary = channel.unary_unary(\n        &lt;span class=\"hljs-string\"&gt;\"/ApiService/GetNode\"&lt;/span&gt;,\n        request_serializer=api_service_pb2.TReqGetNode.SerializeToString,\n        response_deserializer=api_service_pb2.TRspGetNode.FromString)\n\n    &lt;span class=\"hljs-comment\"&gt;# Делаем запрос.&lt;/span&gt;\n    _, call = unary.with_call(get_req, metadata=metadata)\n\n    &lt;span class=\"hljs-comment\"&gt;# Печатаем ответ.&lt;/span&gt;\n    &lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt; yson.loads(call.result().value)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"54\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-54\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-54\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-54.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"versionirovanie-soobshenij-i-versiya-protokola\"&gt;&lt;a href=\"ru/user-guide/proxy/grpc.html#versionirovanie-soobshenij-i-versiya-protokola\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Версионирование сообщений и версия протокола&lt;/span&gt;&lt;/a&gt;Версионирование сообщений и версия протокола&lt;/h2&gt;\n&lt;p&gt;Клиент должен передавать &lt;code&gt;yt-protocol-version&lt;/code&gt; в заголовках каждого запроса. Это поле представляет собой строку вида \"Major.Minor\". При получении запроса gRPC сервер проверяет следующее:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Major версия клиента и сервера должны в точности совпадать.&lt;/li&gt;\n&lt;li&gt;Minor версия сервера должна быть больше или равна Minor версии клиента.&lt;br /&gt;\nЕсли условия не выполнены, то будет ошибка.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Major версия может меняться при серьезных изменениях протокола и такие изменения будут редки. Внутри одной Major версии поддерживается обратная совместимость: старые клиенты будут работать с новыми версиями сервера.&lt;/p&gt;\n&lt;p&gt;Minor версия может меняться при пересборке пакета со скомпилированными proto файлами (например, при добавлении опциональных полей в proto сообщения). На плечах клиента лежит ответственность за указание нужной версии протокола. Например, допустим, в сообщение есть optional параметр:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;// Since 1.42\noptional int64 some_important_value = 42;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"79\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-79\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-79\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-79.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Этот параметр, как можно видеть из комментария, появился в версии сервера \"1.42\". Если вы, как клиент, этот параметр используете, то необходимо указать &lt;code&gt;yt-protocol-version = \"1.42\"&lt;/code&gt;, иначе можно получить спецэффект: старый сервер просто проигнорирует этот параметр.&lt;/p&gt;\n&lt;h2 id=\"protokol-grpc-v-ytsaurus\"&gt;&lt;a href=\"ru/user-guide/proxy/grpc.html#protokol-grpc-v-ytsaurus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Протокол gRPC в YTsaurus&lt;/span&gt;&lt;/a&gt;Протокол gRPC в YTsaurus&lt;/h2&gt;\n&lt;p&gt;YTsaurus использует протокол gRPC следующим образом:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;В YTsaurus не используются gRPC описания сервисов в proto файлах.&lt;/li&gt;\n&lt;li&gt;В YTsaurus к proto сообщению может добавляться произвольный блоб бинарных данных (так называемый attachment, про это ниже).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Эти отличия не требуют модификации кода gRPC, можно использовать обычный стоковый клиент.&lt;/p&gt;\n&lt;h3 id=\"attachment-v-grpc\"&gt;&lt;a href=\"ru/user-guide/proxy/grpc.html#attachment-v-grpc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Attachment в gRPC&lt;/span&gt;&lt;/a&gt;Attachment в gRPC&lt;/h3&gt;\n&lt;p&gt;Для передачи бинарных данных (таких как строки для вставки в динамическую таблицу) YTsaurus добавляет поддержку так называемых attachments.&lt;/p&gt;\n&lt;p&gt;Attachment - блок бинарных данных, привязанный к одному сообщению. Attachment может быть как в запросе (например, строки для вставки), так и в ответе. В ответе и запросе может быть несколько attachments.&lt;/p&gt;\n&lt;p&gt;Для формального описания обратимся к &lt;a href=\"https://github.com/grpc/grpc/blob/master/doc/PROTOCOL-HTTP2.md\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;описанию&lt;/a&gt; протокола gRPC поверх HTTP/2 и рассмотрим пример запроса и ответа.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Запрос&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;HEADERS (flags = END_HEADERS)\n:method = POST\n:scheme = http\n:path = /google.pubsub.v2.PublisherService/CreateTopic\n:authority = pubsub.googleapis.com\ngrpc-timeout = 1S\ncontent-type = application/grpc+proto\ngrpc-encoding = gzip\nauthorization = Bearer y235.wef315yfh138vh31hv93hv8h3v\n\nDATA (flags = END_STREAM)\n&amp;lt;Length-Prefixed Message&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"119\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-119\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-119\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-119.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;strong&gt;Ответ&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;HEADERS (flags = END_HEADERS)\n:status = 200\ngrpc-encoding = gzip\ncontent-type = application/grpc+proto\n\nDATA\n&amp;lt;Length-Prefixed Message&amp;gt;\n\nHEADERS (flags = END_STREAM, END_HEADERS)\ngrpc-status = 0 # OK\ntrace-proto-bin = jher831yy13JHy3hc\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"123\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-123\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-123\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-123.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Как в запросе, так и в ответе есть различная метаинформация (&lt;code&gt;grpc-encoding&lt;/code&gt;, &lt;code&gt;content-type&lt;/code&gt;, &lt;code&gt;grpc-status&lt;/code&gt; и тд). Секция данных, которая помечена как &lt;code&gt;DATA &amp;lt;Length-Prefixed Message&amp;gt;&lt;/code&gt;, описывается в нотации &lt;a href=\"https://en.wikipedia.org/wiki/Augmented_Backus%E2%80%93Naur_form\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ABNF&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Length-Prefixed-Message → Compressed-Flag Message-Length Message\nCompressed-Flag → 0 / 1 # encoded as 1 byte unsigned integer\nMessage-Length → {length of Message} # encoded as 4 byte unsigned integer\nMessage → *{binary octet}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"127\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-127\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-127\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-127.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Это флаг сжатия (занимает один байт, в случае с RPC Proxy YTsaurus он должен быть всегда равен 0), затем идет длина сообщения, кодированная четырьмя байтами, а затем следует сообщение в виде произвольной байтовой последовательности длины &lt;code&gt;Message-Length&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;YTsaurus уточняет Message, теперь это не произвольная байтовая последовательность. Сообщение описывается следующим образом:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Message → SerializedProtoMessage *Length-Prefixed-Attachment\nLength-Prefixed-Attachment → Attachment-Length [Attachment]\nAttachment-Length → {length of Attachment} # encoded as 4 byte unsigned integer, can be 0xFFFFFFFF if Attachment is omitted\nAttachment → *{binary octet}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"134\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-134\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-134\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-134.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Сначала идёт часть &lt;code&gt;SerializedProtoMessage&lt;/code&gt;, которая представляет собой сериализованное proto сообщение. Далее следует количество (возможно, нулевое) attachments. Каждый attachment — это длина (&lt;code&gt;Attachment-Length&lt;/code&gt;, кодируется четырьмя байтами) + произвольная байтовая последовательность длины &lt;code&gt;Attachment-Length&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Отметим, что если attachments нет, то протокол полностью идентичен стоковому gRPC протоколу.&lt;/p&gt;\n&lt;p&gt;Система не может отличить, где заканчивается &lt;code&gt;SerializedProtoMessage&lt;/code&gt;. Для этого вводится специальный ключ в метаданных в заголовке: &lt;code&gt;yt-message-body-size&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Таким образом, система вычитывает &lt;code&gt;yt-message-body-size&lt;/code&gt; байт, превращает их в proto сообщение, а остальные байты до конца потока рассматриваются как attachments. Если заголовок &lt;code&gt;yt-message-body-size&lt;/code&gt; не указан, то, в целях совместимости, весь поток считается сериализованным proto сообщением.&lt;/p&gt;\n&lt;h2 id=\"wire-format\"&gt;&lt;a href=\"ru/user-guide/proxy/grpc.html#wire-format\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Wire format&lt;/span&gt;&lt;/a&gt;Wire format&lt;/h2&gt;\n&lt;p&gt;Для передачи строк YTsaurus использует wire format, сериализованные строки передаются в attachments. Разбиение сериализованного потока строк на аттачменты произвольно, стоит рассматривать несколько последовательных attachments как один поток байт.&lt;/p&gt;\n&lt;p&gt;Каждый запрос, который может принимать или возвращать строки, имеет &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/yt/yt_proto/yt/client/api/rpc_proxy/proto/api_service.proto\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;rowset descriptor&lt;/a&gt;. Дескриптор описывает, каким образом строки должны быть десериализованы или сериализованы. В данной секции описывается, как устроен unversioned rowset (&lt;code&gt;RK_UNVERSIONED&lt;/code&gt;). Если вы хотите использовать &lt;code&gt;RK_VERSIONED&lt;/code&gt; тип, то напишите на &lt;a href=\"mailto:community_ru@ytsaurus.tech\"&gt;рассылку&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Для описания воспользуемся уже знакомой ABNF нотацией (endianness - little):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;UnversionedRowset → RowCount *UnversionedRow\nRowCount → {row count} # encoded as 8 byte unsigned integer\nUnversionedRow → ValueCount *UnversionedValue\nValueCount → {value count} # encoded as 8 byte unsigned integer\nUnversionedValue → ValueIndex ValueType AggregateFlag Length Content\nValueIndex → {index of column to which value belong, should match `columns` field in TColumnDescriptor} # encoded as 2 byte unsigned integer\nValueType → 0x02 {Null} / 0x03 {Int64} / 0x04 {Uint64} / 0x05 {Double} / 0x06 {Boolean} / 0x10 {String} / 0x11 {Any} # encoded as unsigned byte\nAggregateFlag → {is value aggregate?} # encoded as unsigned byte\nLength → {length of Content} # encoded as 4 byte unsigned integer\nContent → *{binary octet} # must be 8-byte aligned!\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"159\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-159\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-159\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-159.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Таким образом, минимальная содержательная длина &lt;code&gt;Content&lt;/code&gt; может быть 8 байт (для всех значений, кроме String и Any).&lt;/p&gt;\n&lt;p&gt;Для примера рассмотрим словарь &lt;code&gt;{\"a\": 1, \"b\": {\"x\": \"y\"}}&lt;/code&gt;. Это одна строка (&lt;code&gt;UnversionedRow&lt;/code&gt; в терминах выше), состоящая из двух &lt;code&gt;UnversionedValue&lt;/code&gt;, одно (ключ &lt;code&gt;a&lt;/code&gt;) типа &lt;code&gt;int64&lt;/code&gt;, другое (ключ &lt;code&gt;b&lt;/code&gt;) типа &lt;code&gt;any&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Имена колонок не передаются в строках, они передаются в &lt;code&gt;TColumnDescriptor&lt;/code&gt; в proto сообщении, а в строках есть только их индекс &lt;code&gt;ValueIndex&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Пример реализации такого формата в Python можно найти &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/yt/wire_format\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;тут&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/proxy/grpc.md","sourcePath":"ru/user-guide/proxy/grpc.md"},"headings":[{"title":"Установка и компиляция proto сообщений","href":"ru/user-guide/proxy/grpc.html#ustanovka-i-kompilyaciya-proto-soobshenij","level":2},{"title":"Примеры","href":"ru/user-guide/proxy/grpc.html#primery","level":2},{"title":"Версионирование сообщений и версия протокола","href":"ru/user-guide/proxy/grpc.html#versionirovanie-soobshenij-i-versiya-protokola","level":2},{"title":"Протокол gRPC в YTsaurus","href":"ru/user-guide/proxy/grpc.html#protokol-grpc-v-ytsaurus","level":2,"items":[{"title":"Attachment в gRPC","href":"ru/user-guide/proxy/grpc.html#attachment-v-grpc","level":3}]},{"title":"Wire format","href":"ru/user-guide/proxy/grpc.html#wire-format","level":2}],"title":"gRPC-прокси"},"router":{"pathname":"ru/user-guide/proxy/grpc","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
