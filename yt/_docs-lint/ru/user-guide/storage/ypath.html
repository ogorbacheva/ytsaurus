        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе собрана информация про YPath — язык, описывающий пути к объектам в системе YTsaurus.&lt;/p&gt;\n&lt;p&gt;YPath представляет собой язык описания путей, которые идентифицируют объекты в системе YTsaurus. Язык позволяет обращаться к узлам и указывать аннотации, которые могут быть полезны при совершении операций над узлами, например, при записи в таблицу. При помощи аннотаций можно определить, будут ли новые данные дописаны в конце таблицы, или таблица будет полностью перезаписана.&lt;/p&gt;\n&lt;p&gt;Например:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;//home/user/table&lt;/code&gt; — путь к таблице &lt;code&gt;table&lt;/code&gt; в домашнем каталоге пользователя;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;#0-25-3ec012f-406daf5c/@type&lt;/code&gt; — путь к атрибуту &lt;code&gt;type&lt;/code&gt; объекта с идентификатором &lt;code&gt;0-25-3ec012f-406daf5c&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;//home/user/table[#10:#20]&lt;/code&gt; — строки с 10-ю по 19-ю включительно таблицы &lt;code&gt;table&lt;/code&gt; в домашнем каталоге пользователя.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Существует несколько разновидностей YPath. В самом простом случае YPath представляет собой строку, кодирующую путь.&lt;/p&gt;\n&lt;h2 id=\"simple_ypath\"&gt;&lt;a href=\"ru/user-guide/storage/ypath.html#simple_ypath\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Простой YPath&lt;/span&gt;&lt;/a&gt;Простой YPath&lt;/h2&gt;\n&lt;h3 id=\"simple_ypath_lexis\"&gt;&lt;a href=\"ru/user-guide/storage/ypath.html#simple_ypath_lexis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Лексика&lt;/span&gt;&lt;/a&gt;Лексика&lt;/h3&gt;\n&lt;p&gt;Строка, кодирующая простой YPath, разбивается на следующие &lt;strong&gt;токены&lt;/strong&gt;:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Специальные символы&lt;/strong&gt;: прямой слеш (&lt;code&gt;/&lt;/code&gt;), «собака» (&lt;code&gt;@&lt;/code&gt;), амперсанд (&lt;code&gt;&amp;amp;&lt;/code&gt;), звёздочка (&lt;code&gt;*&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Литералы&lt;/strong&gt;: максимальная непустая последовательность неспециальных символов. В литералах разрешен escaping вида &lt;code&gt;\\&amp;lt;escape-sequence&amp;gt;&lt;/code&gt;, где в качестве &lt;code&gt;&amp;lt;escape-sequence&amp;gt;&lt;/code&gt; может выступать один из символов &lt;code&gt;\\&lt;/code&gt;, &lt;code&gt;/&lt;/code&gt;, &lt;code&gt;@&lt;/code&gt;, &lt;code&gt;&amp;amp;&lt;/code&gt;, &lt;code&gt;*&lt;/code&gt;, &lt;code&gt;[&lt;/code&gt;, &lt;code&gt;{&lt;/code&gt;, а также выражение вида &lt;code&gt;x&amp;lt;hex1&amp;gt;&amp;lt;hex2&amp;gt;&lt;/code&gt;, где &lt;code&gt;&amp;lt;hex1&amp;gt;&lt;/code&gt; и &lt;code&gt;&amp;lt;hex2&amp;gt;&lt;/code&gt; — шестнадцатеричные цифры.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"simple_ypath_syntax\"&gt;&lt;a href=\"ru/user-guide/storage/ypath.html#simple_ypath_syntax\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Синтаксис и семантика&lt;/span&gt;&lt;/a&gt;Синтаксис и семантика&lt;/h3&gt;\n&lt;p&gt;Структурно YPath имеет вид &lt;code&gt;&amp;lt;root-designator&amp;gt;&amp;lt;relative-path&amp;gt;&lt;/code&gt;. Здесь &lt;code&gt;&amp;lt;root-designator&amp;gt;&lt;/code&gt; бывает двух видов:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Корень Кипариса&lt;/strong&gt;: токен &lt;code&gt;/&lt;/code&gt;.&lt;br /&gt;\nПример: &lt;code&gt;//home/user&lt;/code&gt;; здесь &lt;code&gt;&amp;lt;root-designator&amp;gt;&lt;/code&gt; равен &lt;code&gt;/&lt;/code&gt;, а &lt;code&gt;&amp;lt;relative-path&amp;gt;&lt;/code&gt; равен &lt;code&gt;/home/user&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Объектный корень&lt;/strong&gt;: токен-литерал, кодирующий строку вида &lt;code&gt;#&amp;lt;id&amp;gt;&lt;/code&gt;.&lt;br /&gt;\nПример: &lt;code&gt;#1-2-3-4/@type&lt;/code&gt;; здесь &lt;code&gt;&amp;lt;root-designator&amp;gt;&lt;/code&gt; равен &lt;code&gt;#1-2-3-4&lt;/code&gt;, а &lt;code&gt;&amp;lt;relative-path&amp;gt;&lt;/code&gt; равен &lt;code&gt;/@type&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Тем самым, &lt;code&gt;&amp;lt;root-designator&amp;gt;&lt;/code&gt; определяет начальную точку отсчета, к которой применяется &lt;code&gt;&amp;lt;relative-path&amp;gt;&lt;/code&gt;. Последний разбирается последовательно слева направо, в результате чего возникают шаги перемещения по дереву следующих видов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Переход к потомку&lt;/strong&gt;: последовательность из токена &lt;code&gt;/&lt;/code&gt; и литерала.&lt;br /&gt;\nДанный тип шагов применим к словарям и спискам. В случае словаря литерал должен содержать имя потомка. Пример: &lt;code&gt;/child&lt;/code&gt; — переход к потомку с именем &lt;code&gt;child&lt;/code&gt;.&lt;br /&gt;\nВ случае списка литерал должен содержать целое число в десятичной системе счисления — номер потомка. Потомки в списке нумеруются с нуля. Разрешены также отрицательные номера, которые нумеруют потомков с конца списка. Примеры: &lt;code&gt;/1&lt;/code&gt; — переход ко второму потомку в списке, &lt;code&gt;/-1&lt;/code&gt; — переход к последнему потомку в списке;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Переход к атрибуту&lt;/strong&gt;: последовательность из токенов &lt;code&gt;/@&lt;/code&gt; и литерала.&lt;br /&gt;\nДанный тип шагов применим в любой точке пути и означает переход к атрибуту с данными именем. Пример: &lt;code&gt;/@attr&lt;/code&gt; — переход к атрибуту с именем &lt;code&gt;attr&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В YPath относительные пути начинаются со слешей. Тем самым, слеш служит не разделителем как в случае файловых систем, а полноправным членом команды перемещения по дереву метаинформации. В частности, для склейки двух YPath достаточно обычной конкатенации строк.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"simple_ypath_examples\"&gt;&lt;a href=\"ru/user-guide/storage/ypath.html#simple_ypath_examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;% Корень Кипариса\n/\n\n% В корневой директории узел home, в ней — узел user.\n//home/user\n\n% Начальный элемент в списке //home/user/list\n//home/user/list/0\n\n% Последний элемент в списке //home/user/list\n//home/user/list/-1\n\n% Атрибут attr узла //home/user\n//home/user/@attr\n\n% Объект с идентификатором 1-2-a-b\n#1-2-a-b\n\n% Потомок child объекта с идентификатором 1-2-a-b\n#1-2-a-b/child\n\n% Атрибут attr объекта с идентификатором 1-2-a-b\n#1-2-a-b/@attr\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"96\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-96\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-96\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-96.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"simple_ypath_behavior\"&gt;&lt;a href=\"ru/user-guide/storage/ypath.html#simple_ypath_behavior\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Особенности поведения&lt;/span&gt;&lt;/a&gt;Особенности поведения&lt;/h3&gt;\n&lt;p&gt;Помимо указанных выше правил действует ряд специальных соглашений. Большинство из них связано с тем, что YPath может идентифицировать не только уже существующие метаинформационные сущности, но и новые, создаваемые в момент выполнения команды, аргументом которой служит данный YPath.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Указание всех потомков&lt;/strong&gt;: в команде &lt;code&gt;remove_node&lt;/code&gt; есть возможность удалить всех потомков словаря или списка, для этого следует использовать вместо имени токен &lt;code&gt;*&lt;/code&gt;.&lt;br /&gt;\nПример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;% Очистить домашний каталог пользователя\nyt remove //home/user/*\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"108\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-108\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-108\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-108.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Указание всех атрибутов&lt;/strong&gt;: в командах чтения (&lt;code&gt;get_node&lt;/code&gt;, &lt;code&gt;list_nodes&lt;/code&gt;) есть возможность обратиться к коллекции всех атрибутов объекта, для чего в качестве пути надо использовать путь вида &lt;code&gt;/@&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Примеры:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;% Получить значения всех атрибутов домашнего каталога пользователя\nyt get //home/user/@\n\n% Получить имена всех атрибутов домашнего каталога пользователя\nyt list //home/user/@\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"117\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-117\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-117\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-117.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Также есть возможность &lt;em&gt;изменения&lt;/em&gt; коллекции всех атрибутов с помощью команды &lt;code&gt;set_node&lt;/code&gt;, однако следует понимать, что атрибуты, не перечисленные в устанавливаемом значении, будут удалены.&lt;/p&gt;\n&lt;p&gt;Примеры:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;% Удалить все атрибуты\nyt set //home/user/@ '{}'\n\n% Выставить два атрибута, удалив все остальные имеющиеся\nyt set //home/user/@ '{attr1=value1; attr2=value2}'\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"124\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-124\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-124\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-124.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;При работе с Кипарисом (а не с абстрактным yson-документом) описанной возможностью пользоваться не следует, поскольку это может привести к непреднамеренному удалению системных атрибутов узла. Вместо этого стоит модифицировать необходимые атрибуты индивидуально.&lt;/p&gt;\n&lt;p&gt;Примеры:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;% Выставить один пользовательский атрибут, не трогать остальные\nyt set //home/user/@attr value\n\n% Выставить вложенный пользовательский атрибут\nyt set //home/user/@attr/some/key value\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"131\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-131\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-131\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-131.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Указание позиции вставки в список&lt;/strong&gt;: в командах, создающих новые узлы (например &lt;code&gt;set_node&lt;/code&gt;) есть возможность указать положение создаваемого узла в списке относительно уже имеющихся. Для этого нужно вместо номера потомка использовать специальные строки &lt;code&gt;begin&lt;/code&gt; (начало списка), &lt;code&gt;end&lt;/code&gt; (конец списка), &lt;code&gt;before:&amp;lt;index&amp;gt;&lt;/code&gt; (позиция перед потомком с номером &lt;code&gt;&amp;lt;index&amp;gt;&lt;/code&gt;), а также &lt;code&gt;after:&amp;lt;index&amp;gt;&lt;/code&gt; (позиция после потомка с номером &lt;code&gt;&amp;lt;index&amp;gt;&lt;/code&gt;). Примеры:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;% Добавить элемент \"value\" в конец списка //home/user/list\nyt set //home/user/list/end value\n\n% Вставить элемент \"value\" в начало списка //home/user/list\nyt set //home/user/list/before:0 value\n% Или\nyt set //home/user/list/begin value\n\n% Вставить элемент \"value\" перед вторым элементом списка //home/user/list\nyt set //home/user/list/before:2 value\n\n% Вставить элемент \"value\" после пятого элемента списка //home/user/list\nyt set //home/user/list/after:5 value\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"137\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-137\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-137\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-137.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Отключение перенаправления&lt;/strong&gt;: токен &lt;code&gt;&amp;amp;&lt;/code&gt; может использоваться для подавления перенаправления по &lt;a href=\"user-guide/storage/links.html\"&gt;символической ссылке&lt;/a&gt;.&lt;br /&gt;\nПримеры:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;% Узнать идентификатор самого объекта-ссылки, а не объекта, на который ссылка указывает\nyt get //home/user/link&amp;amp;/@id\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"143\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-143\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-143\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-143.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"rich_ypath\"&gt;&lt;a href=\"ru/user-guide/storage/ypath.html#rich_ypath\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сложный YPath&lt;/span&gt;&lt;/a&gt;Сложный YPath&lt;/h2&gt;\n&lt;p&gt;&lt;strong&gt;Сложный&lt;/strong&gt; (&lt;strong&gt;rich&lt;/strong&gt;) YPath представляет собой расширенный YPath, имеющий вид строки с дополнительными аннотациями. Эти аннотации могут быть заданы двумя способами: в виде &lt;strong&gt;атрибутов&lt;/strong&gt; (пар вида ключ-значение), а также &lt;strong&gt;синтаксически&lt;/strong&gt; с помощью добавления специальных префиксов и суффиксов к простому YPath, из-за чего он превращается в строку вида &lt;code&gt;&amp;lt;prefix&amp;gt;&amp;lt;simple-ypath&amp;gt;&amp;lt;suffix&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;При отсутствии префикса &lt;code&gt;&amp;lt;prefix&amp;gt;&lt;/code&gt; и суффикса &lt;code&gt;&amp;lt;suffix&amp;gt;&lt;/code&gt; сложный YPath может иметь, например, такой вид:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;\n  append = %true;\n  compression_codec = lz4;\n&amp;gt;\n//home/user/table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"155\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-155\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-155\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-155.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Данный путь указывает на домашний каталог пользователя и несет в себе два атрибута.&lt;/p&gt;\n&lt;p&gt;На любом пути можно указать произвольный набор атрибутов. Точный их смысл зависит от того, как данный путь используется в системе. Например, при записи в таблицу имеет смысл атрибут &lt;code&gt;append&lt;/code&gt;, позволяющий дописывать в конец, а не перезаписать результат. Для входных таблиц некоторых mapreduce-операций можно указать флаг &lt;code&gt;foreign&lt;/code&gt;, означающий, что данная таблица является вторичной (таблицей-справочником), поэтому системе необходимо выполнять join специального вида.&lt;/p&gt;\n&lt;p&gt;Атрибуты, имена которых системе неизвестны, или которые не имеют смысла в заданном контексте, системой игнорируются.&lt;/p&gt;\n&lt;p&gt;Префикс и суффикс пути позволяют закодировать атрибуты в более компактном виде. Обе эти части используют лексику &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON&lt;/a&gt;. Подробнее об их устройстве:&lt;/p&gt;\n&lt;h3 id=\"rich_ypath_prefix\"&gt;&lt;a href=\"ru/user-guide/storage/ypath.html#rich_ypath_prefix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Префикс&lt;/span&gt;&lt;/a&gt;Префикс&lt;/h3&gt;\n&lt;p&gt;Часть &lt;code&gt;&amp;lt;prefix&amp;gt;&lt;/code&gt; либо пуста, либо задает атрибуты в виде map-fragment в формате &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON&lt;/a&gt;.&lt;br /&gt;\nПример: &lt;code&gt;&amp;lt;append=%true&amp;gt;//home/user/table&lt;/code&gt; задает путь к таблице в домашнем каталоге пользователя, а также сообщает нам дополнительный атрибут &lt;code&gt;append&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Вдобавок к словарю произвольных атрибутов, поддерживается также короткая запись вида &lt;code&gt;my_cluster://path/to/object&lt;/code&gt;. Такая запись полностью эквивалентна указанию атрибута &lt;code&gt;cluster&lt;/code&gt; в словаре атрибутов (&lt;code&gt;&amp;lt;cluster=my_cluster&amp;gt;//path/to/object&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;В случае, когда кластер указан и через атрибуты, и через короткую запись, приоритет отдается кластеру, указанному через короткую запись.&lt;/p&gt;\n&lt;p&gt;Основное предназначение префикса — упростить передачу атрибутов при использовании команд из консоли.&lt;/p&gt;\n&lt;h3 id=\"rich_ypath_suffix\"&gt;&lt;a href=\"ru/user-guide/storage/ypath.html#rich_ypath_suffix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Суффикс&lt;/span&gt;&lt;/a&gt;Суффикс&lt;/h3&gt;\n&lt;p&gt;Часть &lt;code&gt;&amp;lt;suffix&amp;gt;&lt;/code&gt; либо пуста, либо указывает колонки и/или диапазоны строк обрабатываемой таблицы.&lt;/p&gt;\n&lt;p&gt;Сначала всегда указываются модификатор выбора колонок, если он есть, а затем модификатор выбора строк, если он есть.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Модификатор выбора колонок&lt;/strong&gt; представляет собой разделенный запятыми и взятый в фигурные скобки набор имен колонок. Каждое имя представлено YSON-строкой.&lt;/p&gt;\n&lt;p&gt;Примеры модификаторов выбора колонок: &lt;code&gt;{a}&lt;/code&gt;, &lt;code&gt;{a,b}&lt;/code&gt;, &lt;code&gt;{}&lt;/code&gt; .&lt;/p&gt;\n&lt;p&gt;Формальная грамматика модификаторов выбора колонок:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;column-selector&amp;gt; = '{' { &amp;lt;column-selector-item&amp;gt; ',' } [ &amp;lt;column-selector-item&amp;gt; ] '}'\n&amp;lt;column-selector-item&amp;gt; = &amp;lt;string&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"201\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-201\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-201\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-201.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;strong&gt;Модификатор выбора строк&lt;/strong&gt; представляет собой разделенный запятыми и взятый в квадратные скобки набор диапазонов строк таблицы. Каждый диапазон — пара из нижней и верхней границы диапазона, разделенных двоеточием, либо точное значение границы, которую нужно прочитать. В случае пары одна или обе границы могут отсутствовать.&lt;br /&gt;\nГраница может быть либо числом с приписанным слева символом &lt;code&gt;#&lt;/code&gt; — тогда это номер строки в таблице, либо списком значений — тогда это граница по значениям ключевых колонок, по которым таблица отсортирована. Указанный список может быть короче, чем количество полей, по котором отсортирована таблица. В случае, если список состоит из одного элемента, его можно не обрамлять в круглые скобки. Элемент должен быть корректным YSON-значением скалярного типа &lt;code&gt;int64&lt;/code&gt;, &lt;code&gt;uint64&lt;/code&gt;, &lt;code&gt;string&lt;/code&gt;, &lt;code&gt;double&lt;/code&gt;, &lt;code&gt;bool&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Семантика модификатора выбора строк описана в &lt;a href=\"ru/user-guide/storage/ypath.html#key_selectors\"&gt;разделе&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Примеры модификаторов выбора строк: &lt;code&gt;[:]&lt;/code&gt;, &lt;code&gt;[#10:#100]&lt;/code&gt;, &lt;code&gt;[a:m]&lt;/code&gt;, &lt;code&gt;[(abc,8):(xyz,5)]&lt;/code&gt;, &lt;code&gt;[:5.0,10.0:]&lt;/code&gt;, &lt;code&gt;[#10]&lt;/code&gt;, &lt;code&gt;[a,#100,#1:#2]&lt;/code&gt;, &lt;code&gt;[100u:200u]&lt;/code&gt;. В последнем случае данные содержат беззнаковые числа.&lt;/p&gt;\n&lt;p&gt;Формальная грамматика модификаторов выбора строк:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;row-selector&amp;gt; = '[' { &amp;lt;row-range&amp;gt; ',' } [ &amp;lt;row-range&amp;gt; ] ']'\n\n&amp;lt;row-range&amp;gt; = &amp;lt;row-index-range-selector&amp;gt; | &amp;lt;row-key-range-selector&amp;gt; | &amp;lt;row-index&amp;gt; | &amp;lt;row-composite-key&amp;gt; | ''\n\n&amp;lt;row-index-range-selector&amp;gt; = [ &amp;lt;row-index&amp;gt; ] ':' [ &amp;lt;row-index&amp;gt; ]\n\n&amp;lt;row-index&amp;gt; = '#' &amp;lt;int64&amp;gt;\n\n&amp;lt;row-key-range-selector&amp;gt; = [ &amp;lt;row-composite-key&amp;gt; ] ':' [ &amp;lt;row-composite-key&amp;gt; ]\n\n&amp;lt;row-composite-key&amp;gt; = &amp;lt;row-key&amp;gt; | &amp;lt;row-key-tuple&amp;gt;\n\n&amp;lt;row-key-tuple&amp;gt; = '(' { &amp;lt;row-key&amp;gt; ',' } [ &amp;lt;row-key&amp;gt; ] ')'\n\n&amp;lt;row-key&amp;gt; = &amp;lt;string&amp;gt; | &amp;lt;int64&amp;gt; | &amp;lt;uint64&amp;gt; | &amp;lt;bool&amp;gt; | &amp;lt;double&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"214\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-214\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-214\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-214.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"rich_ypath_examples\"&gt;&lt;a href=\"ru/user-guide/storage/ypath.html#rich_ypath_examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры &lt;/span&gt;&lt;/a&gt;Примеры &lt;/h3&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сложные пути взяты в одинарные кавычки для надлежащего парсинга шеллом.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;% Прочитать целиком таблицу '//home/user/table'\nyt read '//home/user/table'\n\n% Прочитать все строки таблицы '//home/user/table', но не выбрать ни одной колонки\nyt read '//home/user/table{}'\n\n% Прочитать колонку 'a'\nyt read '//home/user/table{a}'\n\n% Прочитать колонки 'a', 'b'\nyt read '//home/user/table{a,b}'\n\n% Прочитать первые 100 строк таблицы '//home/user/table' (и выбрать все колонки)\nyt read '//home/user/table[#0:#100]'\n\n% Прочитать все строки, пропустив первые 100\nyt read '//home/user/table[#100:]'\n\n% Прочитать строку с номером 100 (считая с 0)\nyt read '//home/user/table[#100]'\n\n% Прочитать строки с ключом (или первой координатой ключа) 'abc'\nyt read '//home/user/table[\"abc\":\"abc\\x00\"]'\n\n% Запрос выше можно также выразить короче:\nyt read '//home/user/table[\"abc\"]'\n\n% Прочитать строки с ключами, не меньшими '(a,1)'\nyt read '//home/user/table[(a,1):]'\n\n% Прочитать строки у которых первые две компоненты ключа равны 'a' и '1' соответственно\nyt read '//home/user/table[(a,1)]'\n\n% Прочитать строки, у которых первый ключ 'a', второй ключ начинается с 'b', и, если второй ключ равен 'b', то третий ключ не меньше '1'.\nyt read '//home/user/table[(a,b,1):(a,c)]'\n\n% Прочитать строки, у которых первый ключ начинается с 'a', а также строки, у которых первый ключ 'b', а второй - меньше '1'.\nyt read '//home/user/table[a:(b,1)]'\n\n% Прочитать строки, у которых первый ключ начинается с 'a', а также строки, у которых первый ключ 'b', а второй - меньше '1', а также строки, у которых первый ключ 'b', второй ключ - '1', а третий - отрицательный типа double. Выбрать колонки 'ab', 'ac'\nyt read '//home/user/table{ab,ac}[a:(b,1,0.0)]'\n\n% Преобразовать table1 со столбцами a,b,c,d в table2 со столбцами a,b,c и сортировкой по полям a,b\nyt sort --src '//home/users/table1{a,b,c}' --dst //home/users/table2 --sort-by a --sort-by b --spec '{schema_inference_mode = from_output}'\n\n% Преобразовать table1 со столбцами a,b,c,d в table2 со столбцами a,b,c\nyt merge --src '//home/users/table1{a,b,c}' --dst //home/users/table2 --spec '{schema_inference_mode = from_output}'\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"228\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-228\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-228\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-228.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"ypath_canonical_form\"&gt;&lt;a href=\"ru/user-guide/storage/ypath.html#ypath_canonical_form\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Каноническая форма YPath&lt;/span&gt;&lt;/a&gt;Каноническая форма YPath&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"ru/user-guide/storage/ypath.html#rich_ypath\"&gt;Сложный YPath&lt;/a&gt; может быть приведен к &lt;strong&gt;канонической форме&lt;/strong&gt;, в которой отсутствуют префикс и суффикс, вся информация из которых явно вынесена в атрибуты, назначенные строке — &lt;a href=\"ru/user-guide/storage/ypath.html#simple_ypath\"&gt;простому YPath&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Пример: после канонизации пути &lt;code&gt;&amp;lt;append=true&amp;gt;//home/user/table[#10:#20]&lt;/code&gt; получается следующая YSON-структура:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;\n  append = true;\n  ranges = [\n    {\n      lower_limit = {row_index = 10};\n      upper_limit = {row_index = 20}\n    }\n  ]\n&amp;gt;\n\"//home/user/table\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"238\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-238\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-238\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-238.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Внутри система YTsaurus предпочитает работать с канонической формой путей. Эта форма более громоздка, поэтому во всех путях, принимаемых системой на вход, разрешается использовать более удобную форму с префиксом и суффиксом:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;append=true&amp;gt;//home/user/table[#10:#20]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"242\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-242\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-242\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-242.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Префикс — &lt;code&gt;&amp;lt;append=true&amp;gt;&lt;/code&gt;;&lt;/p&gt;\n&lt;p&gt;Суффикс — &lt;code&gt;[#10:#20]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Внутри системы это будет развернуто в широкую запись:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;  ranges = [\n    {\n      lower_limit = {row_index = 10};\n      upper_limit = {row_index = 20}\n    }\n  ]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"252\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-252\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-252\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-252.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Существует &lt;a href=\"api/commands.html#parse_ypath\"&gt;команда&lt;/a&gt; &lt;code&gt;parse_ypath&lt;/code&gt; драйвера, позволяющая канонизировать сложный YPath.&lt;/p&gt;\n&lt;h2 id=\"known_attributes\"&gt;&lt;a href=\"ru/user-guide/storage/ypath.html#known_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поддерживаемые атрибуты&lt;/span&gt;&lt;/a&gt;Поддерживаемые атрибуты&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"ru/user-guide/storage/ypath.html#rich_ypath\"&gt;Сложный YPath&lt;/a&gt; может быть проаннотирован произвольными атрибутами, что дает возможность расширения. В таблице представлен список атрибутов, которые поддерживает система.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Атрибут&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;append&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Распознается командами записи данных (&lt;code&gt;write_table&lt;/code&gt; и &lt;code&gt;write_file&lt;/code&gt;) и означает, что новые данные дописываются в конец существующих, а не перезаписывают их. Также распознается на выходных путях таблиц в спецификациях всех операций планировщика и имеет аналогичную семантику.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;sorted_by&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Распознается командой записи табличных данных ( &lt;code&gt;write_table&lt;/code&gt;). При указании этого атрибута пользователь обещает, что записываемые данные упорядочены по указанному набору колонок. Система проверяет это свойство. Ключи должны идти в порядке неубывания, а в случае записи с добавлением проверяется также, что первый записываемый ключ не меньше последнего уже существующего. Атрибут также распознается системой на выходных путях таблиц в спецификациях всех операций планировщика и имеет там аналогичную семантику. В последнем случае также дополнительно требуется, чтобы диапазоны ключей, порождаемые различными джобами, не имели пересечения по внутренней точке, пересечения по границам разрешаются.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ranges&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;ReadRange&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Распознается командами чтения данных (&lt;code&gt;read_table&lt;/code&gt; и &lt;code&gt;read_file&lt;/code&gt;) и задает список читаемых диапазонов. Если отсутствует, читаются данные целиком. Также распознается на входных путях таблиц в спецификациях всех операций планировщика. Описание структуры словаря &lt;code&gt;ReadRange&lt;/code&gt; представлено в таблице ниже.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;columns&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Распознается командой чтения табличных данных ( &lt;code&gt;read_table&lt;/code&gt; ) и задает список имен читаемых колонок. Если отсутствует, то читаются все колонки. Также распознается на входных путях таблиц в спецификациях всех операций планировщика.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;optimize_for&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Устанавливает формат хранения для создаваемой таблицы. Атрибут можно указывать c командой &lt;code&gt;write_table&lt;/code&gt; и на выходных путях операций. Данный атрибут &lt;strong&gt;не совместим&lt;/strong&gt; с &lt;code&gt;&amp;lt;append=true&amp;gt;&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;compression_codec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Устанавливает формат сжатия для создаваемой таблицы. Атрибут можно указывать с командами &lt;code&gt;write_file&lt;/code&gt; , &lt;code&gt;write_table&lt;/code&gt; и на выходных путях операций. Данный атрибут &lt;strong&gt;несовместим&lt;/strong&gt; с &lt;code&gt;&amp;lt;append=true&amp;gt;&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;erasure_codec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Выключает erasure-кодирование для создаваемой таблицы. Атрибут можно указывать с командами &lt;code&gt;write_file&lt;/code&gt; , &lt;code&gt;write_table&lt;/code&gt; и на выходных путях операций. Данный атрибут &lt;strong&gt;несовместим&lt;/strong&gt; с &lt;code&gt;&amp;lt;append=true&amp;gt;&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;schema&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;yson-list&lt;/code&gt; с валидной схемой&lt;/td&gt;\n&lt;td&gt;Валидирует данные относительно указанной схемы и проставляет данную схему на таблицу по окончании операции. Атрибут можно указывать с командой &lt;code&gt;write_table&lt;/code&gt; и на выходных путях операций. Данный атрибут &lt;strong&gt;несовместим&lt;/strong&gt; с &lt;code&gt;&amp;lt;append=true&amp;gt;&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt; вида id&lt;/td&gt;\n&lt;td&gt;Указание планировщику, под какой транзакцией необходимо обращаться к входной таблице, если на ней указан данный атрибут.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;rename_columns&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;yson-map&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Распознается на входящих путях таблиц. Переименовывает названия колонок согласно маппингу перед подачей таблицы на вход операции. Данный атрибут &lt;strong&gt;несовместим&lt;/strong&gt; с &lt;code&gt;teleport&lt;/code&gt; таблицами.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;cluster&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Распознается на путях входных таблиц. Позволяет читать данные по указанному пути, но с другого кластера.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Атрибут &lt;code&gt;ranges&lt;/code&gt; указывает, какие диапазоны строк таблицы следует прочитать. Указанные диапазоны будут читаться последовательно, в том порядке, в котором они указаны в атрибутах команды. В частности, если диапазоны пересекаются, то на выходе строки будут повторены соответствующее число раз.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Атрибут&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;lower_limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ReadLimit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нижняя граница чтения&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;upper_limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ReadLimit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Верхняя граница чтения&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;exact&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ReadLimit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Точное значение границы чтения (не может быть указано вместе с lower_limit или upper_limit)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;За исключением ограничений типа &lt;code&gt;key_bound&lt;/code&gt; все виды ограничений в &lt;code&gt;lower_limit&lt;/code&gt; являются включительными, а все виды ограничений в &lt;code&gt;upper_limit&lt;/code&gt; — исключительными. Включительность или исключительность ограничения типа &lt;code&gt;key_bound&lt;/code&gt; указывается явно в самом key bound. См. также раздел, посвящённый &lt;a href=\"ru/user-guide/storage/ypath.html#key_selectors\"&gt;срезам по ключам&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;ReadLimit&lt;/code&gt; описывает отдельную границу чтения. Граница может определяться одним из шести &lt;strong&gt;селекторов&lt;/strong&gt;: ключом, ключевым ограничением (key bound), номером строки, номером чанка, номером таблета или байтовым смещением. В границе может быть указано несколько селекторов, при этом они все действуют одновременно, усиливая друг друга.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Атрибут&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;key&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список значений, образующих ключ (только для сортированных таблиц). См. подробнее в &lt;a href=\"ru/user-guide/storage/ypath.html#key_selectors\"&gt;разделе&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;key_bound&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;list&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Включительное либо невключительное ограничение на префикс ключа; не может присутствовать в exact-границе. См. подробнее в &lt;a href=\"ru/user-guide/storage/ypath.html#key_selectors\"&gt;разделе&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;row_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Номер строки (только для таблиц)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;offset&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Байтовое смещение (только для файлов)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Номер чанка&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Номер таблета (только для упорядоченных динамических таблиц)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Поддерживаемые системой YTsaurus YPath атрибуты на путях &lt;strong&gt;файлов&lt;/strong&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Атрибут&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;file_name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Распознается при заказе файла в &lt;code&gt;sandbox&lt;/code&gt; джоба. Атрибут задает относительный путь, по которому надо положить файл.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;executable&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Распознается при заказе файла в &lt;code&gt;sandbox&lt;/code&gt; джоба. Атрибут указывает системе необходимость проставить executable-бит на заказанный файл.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;bypass_artifact_cache&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Распознается при заказе файла в &lt;code&gt;sandbox&lt;/code&gt; джоба. Атрибут включает прямое скачивание файла в &lt;code&gt;sandbox&lt;/code&gt; джоба минуя файловый кэш на ноде.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;format&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Распознается при заказе табличного файла в &lt;code&gt;sandbox&lt;/code&gt; джоба. Атрибут обозначает формат, в котором надо сформатировать таблицу при её скачивании в &lt;code&gt;sandbox&lt;/code&gt; джоба.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"key_selectors\"&gt;&lt;a href=\"ru/user-guide/storage/ypath.html#key_selectors\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Срезы сортированных таблиц по ключам&lt;/span&gt;&lt;/a&gt;Срезы сортированных таблиц по ключам&lt;/h2&gt;\n&lt;p&gt;Система поддерживает два вида селекторов по значениям ключевых колонок таблицы, которые внешне напоминают друг друга, но отличаются по поведению. Первый вид является исторически более старым и реализуется селектором &lt;code&gt;key&lt;/code&gt;, а также возможен для указания в &lt;a href=\"ru/user-guide/storage/ypath.html#rich_ypath_suffix\"&gt;суффиксе YPath&lt;/a&gt;. Второй вид является более новым и реализуется селектору &lt;code&gt;key_bound&lt;/code&gt;; он доступен только через атрибут &lt;code&gt;ranges&lt;/code&gt; в префиксе YPath.&lt;/p&gt;\n&lt;p&gt;В новых приложениях рекомендуется использовать селектор типа &lt;code&gt;key_bound&lt;/code&gt;, так как он обладает большей прозрачностью в поведении и гибкостью в использовании, хотя и более многословен.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Напомним, что YTsaurus задаёт некоторый линейный порядок сравнения на всевозможных значениях, которые могут встретиться в таблице. В частности, значения типов int64, uint64, double, boolean внутри каждого из этих типов упорядочены естественным образом, значения типа string упорядочены лексикографически, а два значения разных типов данных сравниваются так, как сравниваются их типы в некотором implementation defined порядке. Например, любой int64 меньше любого uint64, а любой null меньше любого не null (&lt;code&gt;#&lt;/code&gt;) значения.&lt;/p&gt;\n&lt;p&gt;Поэтому при сравнении значений всегда обязательно следить за типом данных; в частности, беззнаковые целые числа нужно указывать с суфииксом &lt;code&gt;u&lt;/code&gt;, а дробные числа с десятичной точкой.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"selektor\"&gt;&lt;a href=\"ru/user-guide/storage/ypath.html#selektor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Селектор &lt;/span&gt;&lt;/a&gt;Селектор &lt;code&gt;key&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Селектор &lt;code&gt;key&lt;/code&gt; доступен к использованию только для сортированных таблиц, у которых все ключевые колонки отсортированы по возрастанию. Селектор &lt;code&gt;key&lt;/code&gt; имеет тип \"список значений\", а его поведение определяется следующим образом.&lt;/p&gt;\n&lt;p&gt;Рассмотрим множество всевозможных кортежей, состоящих из значений системы типов YTsaurus. Определим на этих кортежах линейный порядок по лексикографическому принципу, например:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;[] &amp;lt; [\"a\"] &amp;lt; [\"a\"; 3] &amp;lt; [\"a\"; 4] &amp;lt; [\"b\"] &amp;lt; [\"b\"; 2]&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;В таком порядке можно сравнивать между собой два кортежа любой длины. Порядок сравнения определяется тем, как сравниваются первые различающиеся компоненты кортежей, если такие есть; в противном случае меньшим является более короткий кортеж.&lt;/p&gt;\n&lt;p&gt;Если селектор &lt;code&gt;key&lt;/code&gt; указан как часть ограничения &lt;code&gt;lower_limit&lt;/code&gt; (или в качестве нижней границы перед двоеточием в модификаторе выбора строк в суффиксе YPath), то он оставляет из множества всех строк только те, у которых &lt;strong&gt;полный&lt;/strong&gt; ключ как кортеж больше либо равен кортежу &lt;code&gt;key&lt;/code&gt; в смысле порядка сравнения выше. В частности, это означает, что селектор &lt;code&gt;key&lt;/code&gt; может содержать кортеж, состоящий из меньшего или большего числа значений, чем число ключевых колонок в таблице, и это не нарушает корректности определения.&lt;/p&gt;\n&lt;p&gt;Если селектор &lt;code&gt;key&lt;/code&gt; указан как часть ограничения &lt;code&gt;upper_limit&lt;/code&gt; (или в качестве верхней границы после двоеточия в модификаторе выбора строк в суффиксе YPath), то он оставляет из множества всех строк только те, у которых &lt;strong&gt;полный&lt;/strong&gt; ключ как кортеж &lt;strong&gt;строго&lt;/strong&gt; меньше кортежа &lt;code&gt;key&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Если селектор &lt;code&gt;key&lt;/code&gt; указан как часть ограничения &lt;code&gt;exact&lt;/code&gt; (или в качестве единственной границы без двоеточия в модификаторе выбора строк в суффиксе YPath), то он оставляет из множества всех строк только те, у которых полный ключ содержит кортеж &lt;code&gt;key&lt;/code&gt; в качестве префикса.&lt;/p&gt;\n&lt;h4 id=\"primery\"&gt;&lt;a href=\"ru/user-guide/storage/ypath.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n&lt;p&gt;Пусть таблица &lt;code&gt;//tmp/t&lt;/code&gt; имеет две ключевые колонки и содержит следующие ключи:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[\"a\"; 1];\n[\"a\"; 3];\n[\"a\"; 5];\n[\"b\"; 2];\n[\"b\"; 4];\n[\"c\"; 0];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"658\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-658\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-658\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-658.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Срез &lt;code&gt;//tmp/t[(b):]&lt;/code&gt;, он же &lt;code&gt;&amp;lt;ranges = [{lower_limit = {key = [b]}}]&amp;gt;//tmp/t&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[\"b\"; 2];\n[\"b\"; 4];\n[\"c\"; 0];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"662\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-662\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-662\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-662.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Срез &lt;code&gt;//tmp/t[(b, 2, 56):]&lt;/code&gt; (обратите внимание, что ключ в срезе может иметь больше значений, чем количество ключевых колонок в таблице):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[\"b\"; 4];\n[\"c\"; 0];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"666\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-666\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-666\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-666.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Срез &lt;code&gt;//tmp/t[:(c, 0)]&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[\"a\"; 1];\n[\"a\"; 3];\n[\"a\"; 5];\n[\"b\"; 2];\n[\"b\"; 4];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"670\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-670\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-670\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-670.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Срез &lt;code&gt;//tmp/t[(b)]&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[\"b\"; 2];\n[\"b\"; 4];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"674\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-674\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-674\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-674.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Для того, чтобы с использованием селектора типа &lt;code&gt;key&lt;/code&gt; получить исключительную нижнюю границу или включительную верхнюю, необходимо вместо соответствующего кортежа указывать его последователя (successor) в смысле линейного порядка, определённого на кортежах выше, что в общем случае может быть непростой задачей. Данное обстоятельство послужило мотивацией для появления селектора типа &lt;code&gt;key_bound&lt;/code&gt;, который обсуждается в следующем разделе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"selektor1\"&gt;&lt;a href=\"ru/user-guide/storage/ypath.html#selektor1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Селектор &lt;/span&gt;&lt;/a&gt;Селектор &lt;code&gt;key_bound&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Селектор &lt;code&gt;key_bound&lt;/code&gt; доступен к использованию в сортированных таблицах, ключевые колонки которых могут быть сортированы как по убыванию, так и по возрастанию. Значение селектора типа &lt;code&gt;key_bound&lt;/code&gt; имеет вид списка, состоящего из двух значений, первое из которых задаёт &lt;strong&gt;отношение&lt;/strong&gt; и представляется одной из четырёх строк &lt;code&gt;\"&amp;gt;\", \"&amp;gt;=\", \"&amp;lt;\", \"&amp;lt;=\"&lt;/code&gt;, а второе задаёт &lt;strong&gt;префикс&lt;/strong&gt; ключа и является списком значений. Отношения &lt;code&gt;&amp;gt;&lt;/code&gt; и &lt;code&gt;&amp;gt;=&lt;/code&gt; могут встречаться только в ограничении &lt;code&gt;lower_limit&lt;/code&gt;, а &lt;code&gt;&amp;lt;&lt;/code&gt; и &lt;code&gt;&amp;lt;=&lt;/code&gt; только в ограничении &lt;code&gt;upper_limit&lt;/code&gt;; в ограничении &lt;code&gt;exact&lt;/code&gt; селекторы типа &lt;code&gt;key_bound&lt;/code&gt; не допускаются.&lt;/p&gt;\n&lt;p&gt;Примеры селекторов типа &lt;code&gt;key_bound&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;[\"&amp;gt;\"; [\"a\"; 3]]&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;[\"&amp;lt;=\"; [\"b\"]]&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;[\"&amp;gt;=\"; []]&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Семантика данного селектора следующая. Рассмотрим таблицу, содержащую &lt;code&gt;N&lt;/code&gt; ключевых колонок, а также некоторый key bound. Пусть длина префикса ключа в key bound равна &lt;code&gt;K&lt;/code&gt;. Для использования key bound в применении к данной таблице, &lt;code&gt;K&lt;/code&gt; должно находиться в пределах 0 до &lt;code&gt;N&lt;/code&gt;; попытка указать более длинный префикс в key bound приведёт к ошибке.&lt;/p&gt;\n&lt;p&gt;Для того, чтобы понять, подходит ли строка с некоторым ключом под селектор, необходимо оставить от ключа префикс длины &lt;code&gt;K&lt;/code&gt;, и сравнить результат с префиксом ключа из key bound лексикографически. Если результат сравнения соответствует указанному отношению, то строка попадает в результат, в противном случае нет.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Если некоторая колонка является ключевой и отсортирована в обратном порядке (&lt;code&gt;sort_order = descending&lt;/code&gt;), то результаты всех сравнений соответствующей компоненты кортежа ключа инвертируются; в частности, будут верны соотношения &lt;code&gt;5u &amp;lt; 2u&lt;/code&gt; и &lt;code&gt;\"foo\" &amp;lt; #&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Также обратите внимание, что в определении поведения селектора &lt;code&gt;key_bound&lt;/code&gt; сравниваются только кортежи одинаковой длины &lt;code&gt;K&lt;/code&gt;, поэтому вопрос определения сравнения кортежей разной длины в присутствии обратного порядка сортировки не возникает.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В частности, по определению выше селекторы &lt;code&gt;[\"&amp;gt;=\"; []]&lt;/code&gt;, &lt;code&gt;[\"&amp;lt;=\"; []]&lt;/code&gt; допускают любую строку (так как после оставления префикса ключа длины 0 получается кортеж &lt;code&gt;[]&lt;/code&gt;), а селекторы &lt;code&gt;[\"&amp;gt;\"; []]&lt;/code&gt;, &lt;code&gt;[\"&amp;lt;\"; []]&lt;/code&gt; не допускают никакую строку.&lt;/p&gt;\n&lt;h4 id=\"primery1\"&gt;&lt;a href=\"ru/user-guide/storage/ypath.html#primery1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n&lt;p&gt;Рассмотрим таблицу &lt;code&gt;//tmp/t&lt;/code&gt; с теми же ключами, что и в примере выше:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[\"a\"; 1];\n[\"a\"; 3];\n[\"a\"; 5];\n[\"b\"; 2];\n[\"b\"; 4];\n[\"c\"; 0];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"739\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-739\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-739\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-739.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Срез &lt;code&gt;&amp;lt;ranges = [{lower_limit = {key_bound = [\"&amp;gt;\"; [\"a\"; 3]]}}]&amp;gt;//tmp/t&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[\"a\"; 5];\n[\"b\"; 2];\n[\"b\"; 4];\n[\"c\"; 0];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"743\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-743\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-743\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-743.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Срез &lt;code&gt;&amp;lt;ranges = [{upper_limit = {key_bound = [\"&amp;lt;=\"; [\"b\"]]}}]&amp;gt;//tmp/t&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[\"a\"; 1];\n[\"a\"; 3];\n[\"a\"; 5];\n[\"b\"; 2];\n[\"b\"; 4];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"747\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-747\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-747\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-747.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Обратите внимание, что несмотря на то, что кортеж &lt;code&gt;[\"b\"; 2]&lt;/code&gt; лексикографически превосходит кортеж &lt;code&gt;[\"b\"]&lt;/code&gt;, ключ &lt;code&gt;[\"b\"; 2]&lt;/code&gt; при усечении до длины 1 превращается в кортеж &lt;code&gt;[\"b\"]&lt;/code&gt;, и поэтому он допускается key bound &lt;code&gt;[\"&amp;lt;=\"; [\"b\"]]&lt;/code&gt;. Это отличает поведение селектора &lt;code&gt;key_bound&lt;/code&gt; в от селектора &lt;code&gt;key&lt;/code&gt;, и расширяет возможности первого по сравнению со вторым, так как с помощью селектора &lt;code&gt;key&lt;/code&gt; задать аналогичный срез нетривиально.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Срез &lt;code&gt;&amp;lt;ranges = [{lower_limits = {key_bound = [\"&amp;gt;=\"; [\"b\"; 2; 56]]}}]&amp;gt;//tmp/t&lt;/code&gt; не является допустимым, и его использованием приведёт к ошибке &lt;code&gt;Key bound length must not exceed schema key prefix length&lt;/code&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/storage/ypath.md","sourcePath":"ru/user-guide/storage/ypath.md"},"headings":[{"title":"Простой YPath","href":"ru/user-guide/storage/ypath.html#simple_ypath","level":2,"items":[{"title":"Лексика","href":"ru/user-guide/storage/ypath.html#simple_ypath_lexis","level":3},{"title":"Синтаксис и семантика","href":"ru/user-guide/storage/ypath.html#simple_ypath_syntax","level":3},{"title":"Примеры","href":"ru/user-guide/storage/ypath.html#simple_ypath_examples","level":3},{"title":"Особенности поведения","href":"ru/user-guide/storage/ypath.html#simple_ypath_behavior","level":3}]},{"title":"Сложный YPath","href":"ru/user-guide/storage/ypath.html#rich_ypath","level":2,"items":[{"title":"Префикс","href":"ru/user-guide/storage/ypath.html#rich_ypath_prefix","level":3},{"title":"Суффикс","href":"ru/user-guide/storage/ypath.html#rich_ypath_suffix","level":3},{"title":"Примеры ","href":"ru/user-guide/storage/ypath.html#rich_ypath_examples","level":3}]},{"title":"Каноническая форма YPath","href":"ru/user-guide/storage/ypath.html#ypath_canonical_form","level":2},{"title":"Поддерживаемые атрибуты","href":"ru/user-guide/sto
