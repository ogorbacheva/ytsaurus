        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В разделе описаны типы данных и форматы представления табличных данных, поддерживаемые системой YTsaurus.&lt;/p&gt;\n&lt;h2 id=\"data_types\"&gt;&lt;a href=\"ru/user-guide/storage/formats.html#data_types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типы данных&lt;/span&gt;&lt;/a&gt;Типы данных&lt;/h2&gt;\n&lt;p&gt;В системе YTsaurus хранятся данные следующих типов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/user-guide/storage/formats.html#structured_data\"&gt;Структурированные данные&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/user-guide/storage/formats.html#table_data\"&gt;Табличные данные&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/user-guide/storage/formats.html#binary_data\"&gt;Бинарные данные&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Разные форматы позволяют работать с разными типами данных.&lt;/p&gt;\n&lt;h3 id=\"structured_data\"&gt;&lt;a href=\"ru/user-guide/storage/formats.html#structured_data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Структурированные данные&lt;/span&gt;&lt;/a&gt;Структурированные данные&lt;/h3&gt;\n&lt;p&gt;Структурированные данные — дерево узлов с атрибутами, в котором узлы соответствуют &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON-типам&lt;/a&gt; (map, list, простые типы) с атрибутами.&lt;br /&gt;\nСтруктурированные данные можно получить при помощи команды &lt;a href=\"api/commands.html#get\"&gt;&lt;code&gt;get&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Поддерживаемые форматы: &lt;code&gt;json&lt;/code&gt;, &lt;code&gt;yson&lt;/code&gt;, &lt;code&gt;yaml&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Пример: узлы &lt;a href=\"user-guide/storage/cypress.html\"&gt;Кипариса&lt;/a&gt;, их атрибуты.&lt;/p&gt;\n&lt;h3 id=\"table_data\"&gt;&lt;a href=\"ru/user-guide/storage/formats.html#table_data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Табличные данные&lt;/span&gt;&lt;/a&gt;Табличные данные&lt;/h3&gt;\n&lt;p&gt;Табличные данные — последовательность строк, в которой каждая строка логически представляет собой пару ключ-значение, где ключ — строка, значение — структурированные данные.&lt;/p&gt;\n&lt;p&gt;Поддерживаемые форматы: &lt;code&gt;json&lt;/code&gt;, &lt;code&gt;yson&lt;/code&gt;, &lt;code&gt;dsv&lt;/code&gt;,  &lt;code&gt;schemaful_dsv&lt;/code&gt;, &lt;code&gt;protobuf&lt;/code&gt;, &lt;code&gt;arrow&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Примеры: входные и выходные данные операций, входные данные команды &lt;a href=\"api/commands.html#write_table\"&gt;&lt;code&gt;write_table&lt;/code&gt;&lt;/a&gt;, выходные данные команды &lt;a href=\"api/commands.html#read_table\"&gt;&lt;code&gt;read_table&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"binary_data\"&gt;&lt;a href=\"ru/user-guide/storage/formats.html#binary_data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бинарные данные&lt;/span&gt;&lt;/a&gt;Бинарные данные&lt;/h3&gt;\n&lt;p&gt;Бинарные данные — последовательность байтов. Например, в файлах хранятся бинарные данные.&lt;/p&gt;\n&lt;p&gt;Поддерживаемые форматы: задать формат нельзя. Представление только в виде массива байтов.&lt;/p&gt;\n&lt;p&gt;Примеры: входные данные команды &lt;a href=\"api/commands.html#write_file\"&gt;&lt;code&gt;upload&lt;/code&gt;&lt;/a&gt; и выходные данные команды &lt;a href=\"api/commands.html#read_file\"&gt;&lt;code&gt;download&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"table_formats\"&gt;&lt;a href=\"ru/user-guide/storage/formats.html#table_formats\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Форматы представления табличных данных&lt;/span&gt;&lt;/a&gt;Форматы представления табличных данных&lt;/h2&gt;\n&lt;p&gt;В YTsaurus поддерживается несколько форматов данных, которые определяют, в каком виде данные будут переданы системе или получены от нее.&lt;br /&gt;\nДля всех команд &lt;a href=\"api/cli/cli.html\"&gt;утилиты &lt;code&gt;yt&lt;/code&gt;&lt;/a&gt;, которые возвращают или принимают данные, необходимо указывать формат.&lt;/p&gt;\n&lt;p&gt;Чтение таблицы в формате DSV:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; //some/table --format dsv\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"74\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-74\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-74\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-74.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;YTsaurus поддерживает следующие форматы представления данных:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/user-guide/storage/formats.html#yson\"&gt;YSON&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/user-guide/storage/formats.html#json\"&gt;JSON&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/user-guide/storage/formats.html#dsv\"&gt;DSV (TSKV)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/user-guide/storage/formats.html#schemaful_dsv\"&gt;SCHEMAFUL_DSV&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"example\"&gt;&lt;a href=\"ru/user-guide/storage/formats.html#example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h2&gt;\n&lt;p&gt;В примерах будет использована данная таблица:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th style=\"text-align:left\"&gt;name&lt;/th&gt;\n&lt;th style=\"text-align:center\"&gt;uid&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;Elena&lt;/td&gt;\n&lt;td style=\"text-align:center\"&gt;95792365232151958&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;Denis&lt;/td&gt;\n&lt;td style=\"text-align:center\"&gt;78086244452810046&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;Mikhail&lt;/td&gt;\n&lt;td style=\"text-align:center\"&gt;70609792906901286&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;Ilya&lt;/td&gt;\n&lt;td style=\"text-align:center\"&gt;15696008603902587&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;Oxana&lt;/td&gt;\n&lt;td style=\"text-align:center\"&gt;76840674253209974&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;Alexey&lt;/td&gt;\n&lt;td style=\"text-align:center\"&gt;15943558469181404&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;Roman&lt;/td&gt;\n&lt;td style=\"text-align:center\"&gt;37865805882228106&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;Anna&lt;/td&gt;\n&lt;td style=\"text-align:center\"&gt;35039450424270744&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;Nikolai&lt;/td&gt;\n&lt;td style=\"text-align:center\"&gt;45320538587295288&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;Karina&lt;/td&gt;\n&lt;td style=\"text-align:center\"&gt;20364947097122776&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"yson\"&gt;&lt;a href=\"ru/user-guide/storage/formats.html#yson\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YSON&lt;/span&gt;&lt;/a&gt;YSON&lt;/h2&gt;\n&lt;p&gt;Формат YSON является основным форматом YTsaurus, в нем хранятся табличные данные, атрибуты узлов Кипариса и многие другие объекты. YSON является аналогом формата JSON, но включает понятие атрибутов узла и поддерживает бинарные данные.&lt;br /&gt;\nПодробная спецификация в разделе &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Для чтения таблицы в формате YSON выполните:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; --proxy &amp;lt;cluster-name&amp;gt; --format &lt;span class=\"hljs-string\"&gt;'&amp;lt;format=pretty&amp;gt;yson'&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'//home/tutorial/staff_unsorted_sample'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"209\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-209\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-209\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-209.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Представление таблицы в формате YSON:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{\n    \"name\" = \"Elena\";\n    \"uid\" = 95792365232151958;\n};\n{\n    \"name\" = \"Denis\";\n    \"uid\" = 78086244452810046;\n};\n{\n    \"name\" = \"Mikhail\";\n    \"uid\" = 70609792906901286;\n};\n{\n    \"name\" = \"Ilya\";\n    \"uid\" = 15696008603902587;\n};\n{\n    \"name\" = \"Oxana\";\n    \"uid\" = 76840674253209974;\n};\n{\n    \"name\" = \"Alexey\";\n    \"uid\" = 15943558469181404;\n};\n{\n    \"name\" = \"Roman\";\n    \"uid\" = 37865805882228106;\n};\n{\n    \"name\" = \"Anna\";\n    \"uid\" = 35039450424270744;\n};\n{\n    \"name\" = \"Nikolai\";\n    \"uid\" = 45320538587295288;\n};\n{\n    \"name\" = \"Karina\";\n    \"uid\" = 20364947097122776;\n};\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"213\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-213\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-213\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-213.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;strong&gt;Параметры&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;В скобках указаны значения по умолчанию.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;format&lt;/strong&gt; (&lt;code&gt;binary&lt;/code&gt;) — описывает вид YSON, в котором будут сформированы данные. Указание вида имеет значение только при указании выходного по отношению к системе формата, для входного формата все разновидности YSON читаются системой гомогенно:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;binary&lt;/code&gt; — бинарный,&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;text&lt;/code&gt; — текстовый, без форматирования,&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;pretty&lt;/code&gt; — текстовый, с форматированием.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;skip_null_values&lt;/strong&gt; (&lt;code&gt;%false&lt;/code&gt;) - включить пропуск значений &lt;code&gt;null&lt;/code&gt; в схематизированных таблицах. По умолчанию все значения записываются.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_string_to_all_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — включить приведение строковых значений к численным и boolean типам. Например, &lt;code&gt;\"42u\"&lt;/code&gt; преобразуется в &lt;code&gt;42u&lt;/code&gt;, а &lt;code&gt;\"false\"&lt;/code&gt; преобразуется в &lt;code&gt;%false&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_all_to_string_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — включить приведение численных и boolean значений к строковому типу. Например, число &lt;code&gt;3.14&lt;/code&gt; превратится в &lt;code&gt;\"3.14\"&lt;/code&gt;, а &lt;code&gt;%false&lt;/code&gt; в &lt;code&gt;\"false\"&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_integral_type_conversion&lt;/strong&gt; (&lt;code&gt;true&lt;/code&gt;) — включить приведение &lt;code&gt;uint64&lt;/code&gt; к &lt;code&gt;int64&lt;/code&gt; и наоборот. Обратите внимание, эта опция включена по умолчанию. Если при преобразовании происходит переполнение, то возникает соответствующая ошибка.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_integral_to_double_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — включить приведение &lt;code&gt;uint64&lt;/code&gt; и &lt;code&gt;int64&lt;/code&gt; к &lt;code&gt;double&lt;/code&gt;. Например, целое число &lt;code&gt;42&lt;/code&gt; превратится в дробное число &lt;code&gt;42.0&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_type_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — включить все опции выше. В большинстве случаев достаточно пользоваться только этой опцией.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;complex_type_mode&lt;/strong&gt; (&lt;code&gt;named&lt;/code&gt;) — режим представления композитных типов, структур и вариантов,&lt;br /&gt;\nвозможные значения &lt;code&gt;named&lt;/code&gt; или &lt;code&gt;positional&lt;/code&gt;, подробнее в &lt;a href=\"user-guide/storage/data-types.html#yson\"&gt;разделе&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;string_keyed_dict_mode&lt;/strong&gt; (&lt;code&gt;positional&lt;/code&gt;) - режим представления словарей со строковыми ключами, возможные значения &lt;code&gt;named&lt;/code&gt; или &lt;code&gt;positional&lt;/code&gt;, подробнее в &lt;a href=\"user-guide/storage/data-types.html#yson\"&gt;специальном разделе&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;decimal_mode&lt;/strong&gt; (&lt;code&gt;binary&lt;/code&gt;) — режим представления типа &lt;code&gt;decimal&lt;/code&gt;,&lt;br /&gt;\nвозможные значения &lt;code&gt;text&lt;/code&gt;, &lt;code&gt;binary&lt;/code&gt;, подробнее в &lt;a href=\"user-guide/storage/data-types.html#yson\"&gt;разделе&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;time_mode&lt;/strong&gt; (&lt;code&gt;binary&lt;/code&gt;) — режим представления типов &lt;code&gt;date&lt;/code&gt;, &lt;code&gt;datetime&lt;/code&gt;, &lt;code&gt;timestamp&lt;/code&gt;, возможные значения &lt;code&gt;text&lt;/code&gt; или &lt;code&gt;binary&lt;/code&gt;, подробнее в &lt;a href=\"user-guide/storage/data-types.html#yson\"&gt;разделе&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;uuid_mode&lt;/strong&gt; (&lt;code&gt;binary&lt;/code&gt;) — режим представления типа &lt;code&gt;uuid&lt;/code&gt;, возможные значения &lt;code&gt;binary&lt;/code&gt;, &lt;code&gt;text_yql&lt;/code&gt; или &lt;code&gt;text_yt&lt;/code&gt; подробнее в &lt;a href=\"user-guide/storage/data-types.html#yson\"&gt;разделе&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;sort_keys&lt;/strong&gt; (&lt;code&gt;%false&lt;/code&gt;) — выводить ключи в словарях в сортированном порядке, возможные значения &lt;code&gt;%true&lt;/code&gt; или &lt;code&gt;%false&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"json\"&gt;&lt;a href=\"ru/user-guide/storage/formats.html#json\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;JSON&lt;/span&gt;&lt;/a&gt;JSON&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"https://en.wikipedia.org/wiki/JSON\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;JSON&lt;/a&gt; — широко распространенный формат для отображения структурированных данных.&lt;/p&gt;\n&lt;p&gt;Работать с JSON удобно, используя популярные инструменты, например &lt;a href=\"https://stedolan.github.io/jq/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;jq&lt;/a&gt;. Кроме того, нет необходимости устанавливать дополнительные библиотеки для поддержки YSON.&lt;br /&gt;\nПодробная спецификация &lt;a href=\"https://www.json.org/json-en.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;JSON&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Основным форматом YTsaurus является YSON. В отличие от JSON он имеет атрибуты. Поэтому для преобразования данных из YSON в JSON необходимо закодировать атрибуты в JSON.&lt;br /&gt;\nДля этого конвертируйте узел с атрибутами в map-node c двумя ключами:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;\\$value&lt;/code&gt; — его значением становится весь текущий узел без атрибутов;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;\\$attributes&lt;/code&gt; — его значением становится &lt;code&gt;map&lt;/code&gt; атрибутов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Например, &lt;code&gt;&amp;lt;attr=10&amp;gt;{x=y}&lt;/code&gt; представляется в виде &lt;code&gt;{\"$value\": {\"x\": \"y\"}, \"$attributes\": {\"attr\": 10}}&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Строки в YTsaurus — YSON-строки — являются байтовыми, в то время как JSON использует кодирование Unicode.&lt;br /&gt;\nУ формата есть настройка &lt;code&gt;encode_utf8&lt;/code&gt;, позволяющая управлять конверсией. &lt;code&gt;encode_utf8&lt;/code&gt; по умолчанию равен &lt;code&gt;%true&lt;/code&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li id=\"utf8-true\"&gt;encode_utf8=%true&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Чтобы преобразовать YSON-строку в JSON-строку, нужно перевести каждый байт в unicode-символ с соответствующим номером и закодировать в UTF-8. Такое преобразование происходит, например, при чтении табличных данных командой &lt;a href=\"api/commands.html#read_table\"&gt;&lt;code&gt;read_table&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;При преобразовании JSON-строки в YSON-строку происходит проверка последовательности unicode-символов JSON-строки: каждый из них должен находиться в диапазоне от 0 до 255. Затем они конвертируются в соответствующие байты. Такое преобразование выполняется при записи табличных данных командой &lt;a href=\"api/commands.html#write_table\"&gt;&lt;code&gt;write_table&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При &lt;code&gt;encode_utf8=%true&lt;/code&gt; unicode-символы вне диапазона 0..255 в JSON-строке не допускаются.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;ul&gt;\n&lt;li id=\"utf8-false\"&gt;encode_utf8=%false&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Чтобы преобразовать YSON-строку в JSON-строку требуется, чтобы в YSON-строке находилась последовательность, допустимая UTF-8. Она будет преобразована в unicode-строку JSON.&lt;/p&gt;\n&lt;p&gt;При преобразовании JSON-строки в YSON-строку выполняется UTF8-кодирование unicode-символов в байтовые последовательности. Такое преобразование выполняется командой &lt;a href=\"api/commands.html#write_table\"&gt;&lt;code&gt;write_table&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В общем случае байтовые последовательности в таблицах не всегда являются UTF8-последовательностями. Поэтому при &lt;code&gt;encode_utf8=%false&lt;/code&gt; не все YSON-строки доступны для чтения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Запись UTF-8 строки:&lt;/p&gt;\n&lt;div class=\"yfm-tabs\" data-diplodoc-group=\"defaultTabsGroup-c8maqkmo\" data-diplodoc-variant=\"regular\"&gt;\n&lt;div class=\"yfm-tab-list\" role=\"tablist\"&gt;\n&lt;div data-diplodoc-id=\"python\" data-diplodoc-key=\"python\" class=\"yfm-tab yfm-tab-group active\" role=\"tab\" tabindex=\"0\" data-diplodoc-is-active=\"true\"&gt;Python&lt;/div&gt;\n&lt;div data-diplodoc-id=\"cli\" data-diplodoc-key=\"cli\" class=\"yfm-tab yfm-tab-group\" role=\"tab\" tabindex=\"-1\" data-diplodoc-is-active=\"false\"&gt;CLI&lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"ubycwh4l\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"Python\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.write_table(&lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt;, [{&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"Иван\"&lt;/span&gt;}], &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=yt.JsonFormat(attributes={&lt;span class=\"hljs-string\"&gt;\"encode_utf8\"&lt;/span&gt;: &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;}))\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"393\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-393\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-393\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-393.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"y926hmj7\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"CLI\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'{\"key\": \"Иван\"}{\"key\":\"Иванов\"}'&lt;/span&gt; | YT_PROXY=&amp;lt;cluster-name&amp;gt; yt write --table &lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt; --format=&lt;span class=\"hljs-string\"&gt;\"&amp;lt;encode_utf8=%false&amp;gt;json\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"396\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-396\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-396\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-396.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При чтении пользователем таблицы в формате JSON каждая запись будет сделана в отдельной строке. При этом формат &lt;code&gt;pretty&lt;/code&gt; не поддерживается.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтение таблицы в формате JSON:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; --proxy &amp;lt;cluster-name&amp;gt; --format json &lt;span class=\"hljs-string\"&gt;'//home/tutorial/staff_unsorted_sample'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"412\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-412\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-412\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-412.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Представление таблицы в формате JSON:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"Elena\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"uid\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;95792365232151958&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"Denis\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"uid\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;78086244452810046&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"Mikhail\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"uid\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;70609792906901286&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"Ilya\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"uid\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;15696008603902587&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"Oxana\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"uid\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;76840674253209974&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"Alexey\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"uid\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;15943558469181404&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"Roman\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"uid\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;37865805882228106&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"Anna\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"uid\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;35039450424270744&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"Nikolai\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"uid\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;45320538587295288&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;\"Karina\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;&lt;span class=\"hljs-attr\"&gt;\"uid\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;20364947097122776&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"416\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-416\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-416\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-416.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;strong&gt;Параметры&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;В скобках указаны значения по умолчанию.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;format&lt;/strong&gt; (&lt;code&gt;text&lt;/code&gt;) — описывает формат JSON, в котором будут сформированы данные. Имеет значение только при указании выходного по отношению к системе формата. Для входного формата все разновидности JSON читаются системой гомогенно:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;text&lt;/code&gt; — текстовый без форматирования;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;pretty&lt;/code&gt; — текстовый с форматированием.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;attributes_mode&lt;/strong&gt; (&lt;code&gt;on_demand&lt;/code&gt;) — режим работы с атрибутами:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;always&lt;/code&gt; — каждый узел превращается в map с &lt;code&gt;\\$value&lt;/code&gt; и &lt;code&gt;\\$attributes&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;never&lt;/code&gt; — атрибуты игнорируются;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;on_demand&lt;/code&gt; — только узлы с непустыми атрибутами превращаются в map с &lt;code&gt;\\$value&lt;/code&gt; и &lt;code&gt;\\$attributes&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;encode_utf8&lt;/strong&gt; (&lt;code&gt;true&lt;/code&gt;) — включить интерпретацию UTF-8 символов в байты с соответствующими номерами.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;string_length_limit&lt;/strong&gt; — ограничение на длину строки в байтах. При превышении лимита строка будет обрезана, а результат записан в виде &lt;code&gt;{$incomplete: true, $value:...}&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;stringify&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — включить преобразование всех скалярных типов в строки.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;stringify_nan_and_infinity&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) - включить преобразование &lt;code&gt;Nan&lt;/code&gt; и &lt;code&gt;Infinity&lt;/code&gt; в строки. Не может быть указан вместе с &lt;code&gt;support_infinity&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;support_infinity&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) - разрешить значение &lt;code&gt;Nan&lt;/code&gt; в типе &lt;code&gt;double&lt;/code&gt;. Не может быть указан вместе с &lt;code&gt;stringify_nan_and_infinity&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;annotate_with_types&lt;/strong&gt; — включить аннотацию типов &lt;code&gt;{$type: \"uint64\", $value: 100500}&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;plain&lt;/strong&gt; — включить опцию парсера JSON, которая отключает учет логики про специальные ключи &lt;code&gt;\\$attributes&lt;/code&gt;, &lt;code&gt;\\$value&lt;/code&gt;, &lt;code&gt;\\$type&lt;/code&gt; и разбирает JSON как есть. При включенной опции парсер работает существенно быстрее.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_string_to_all_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — включить приведение строковых значений к численным и &lt;code&gt;boolean&lt;/code&gt;-типам. Например, &lt;code&gt;\"42u\"&lt;/code&gt; преобразуется в &lt;code&gt;42u&lt;/code&gt;, а &lt;code&gt;\"false\"&lt;/code&gt; преобразуется в &lt;code&gt;%false&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_all_to_string_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — включить приведение численных и &lt;code&gt;boolean&lt;/code&gt;-значений к строковому типу. Например, число &lt;code&gt;3.14&lt;/code&gt; превратится в &lt;code&gt;\"3.14\"&lt;/code&gt;, а &lt;code&gt;%false&lt;/code&gt; в &lt;code&gt;\"false\"&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_integral_type_conversion&lt;/strong&gt; (&lt;code&gt;true&lt;/code&gt;) — включить приведение &lt;code&gt;uint64&lt;/code&gt; к &lt;code&gt;int64&lt;/code&gt; и наоборот. Если при преобразовании происходит переполнение, возникает соответствующая ошибка.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_integral_to_double_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — включить приведение &lt;code&gt;uint64&lt;/code&gt; и &lt;code&gt;int64&lt;/code&gt; к &lt;code&gt;double&lt;/code&gt;. Например, целое число &lt;code&gt;42&lt;/code&gt; превратится в дробное число &lt;code&gt;42.0&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_type_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — включить все перечисленные опции. В большинстве случаев достаточно пользоваться только этой опцией.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;JSON имеет некомпактное представление байтов с номерами 0-32 (а именно \\u00XX). При попытке записать длинную строку из таких данных может возникнуть ошибка &lt;strong&gt;Out of memory&lt;/strong&gt; в библиотеке Yajl, так как ограничение на объем памяти равно &lt;code&gt;2 * row_weight&lt;/code&gt;. В таком случае не рекомендуется использовать формат JSON.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"yaml\"&gt;&lt;a href=\"ru/user-guide/storage/formats.html#yaml\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YAML&lt;/span&gt;&lt;/a&gt;YAML&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"https://yaml.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YAML&lt;/a&gt; — это формат сериализации данных, удобный для чтения человеком, который стал стандартом для конфигурационных файлов и инфраструктуры как кода. Он предлагает более компактный и читаемый синтаксис по сравнению с JSON, а также поддерживает комментарии и якоря.&lt;/p&gt;\n&lt;p&gt;YAML доступен в YTsaurus начиная с версии 24.2.&lt;/p&gt;\n&lt;p&gt;Чтение узла Кипариса в формате YAML:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt get //path/to/some_table/@ --format yaml\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"546\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-546\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-546\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-546.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Пример вывода:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;id:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;7b7-154e6-13440191-489067e7&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;type:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;table&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;ref_counter:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;foreign:&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;native_cell_tag:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;4932&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;revision:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;8482560616109&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;acl:&lt;/span&gt; []\n&lt;span class=\"hljs-attr\"&gt;owner:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;max&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;null&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;key:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;squirrels&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;creation_time:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'2023-12-06T22:03:43.498610Z'&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;modification_time:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'2023-12-06T22:20:05.142350Z'&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;access_time:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'2024-11-05T23:39:45.599145Z'&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;access_counter:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1012&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;resource_usage:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;node_count:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;chunk_count:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;disk_space_per_medium:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;default:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;560736&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;disk_space:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;560736&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;chunk_host_cell_master_memory:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;master_memory:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;detailed_master_memory:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;nodes:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;chunks:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;attributes:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;tablets:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;schemas:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;tablet_count:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;tablet_static_memory:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;recursive_resource_usage:&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;null&lt;/span&gt;\n&lt;span class=\"hljs-string\"&gt;...&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"550\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-550\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-550\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-550.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"sistema-tipov\"&gt;&lt;a href=\"ru/user-guide/storage/formats.html#sistema-tipov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Система типов&lt;/span&gt;&lt;/a&gt;Система типов&lt;/h3&gt;\n&lt;p&gt;Формат YAML в YTsaurus использует подход на основе &lt;a href=\"https://yaml.org/spec/1.2.2/#schema\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;схемы YAML&lt;/a&gt; для определения типов. Реализация следует &lt;a href=\"https://yaml.org/spec/1.2.2/#core-schema\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Core схеме&lt;/a&gt;, которая широко используется большинством парсеров YAML:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;При разборе система соблюдает специфические теги и определяет неспецифические теги с помощью регулярных выражений Core схемы, которые обнаруживают целочисленные/числа с плавающей точкой/строковые/логические/null значения\n&lt;ul&gt;\n&lt;li&gt;Например, &lt;code&gt;123&lt;/code&gt;, &lt;code&gt;3.14&lt;/code&gt;, &lt;code&gt;true&lt;/code&gt;, &lt;code&gt;null&lt;/code&gt; определяются как целое число, число с плавающей точкой, логическое значение и null соответственно, а &lt;code&gt;foo&lt;/code&gt;, &lt;code&gt;bar&lt;/code&gt;, &lt;code&gt;baz&lt;/code&gt; определяются как строки&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;При записи:\n&lt;ul&gt;\n&lt;li&gt;Нестроковые скаляры сериализуются в простом (без кавычек) виде, например &lt;code&gt;123&lt;/code&gt;, &lt;code&gt;3.14&lt;/code&gt;, &lt;code&gt;true&lt;/code&gt;, &lt;code&gt;false&lt;/code&gt;, &lt;code&gt;null&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Строковые скаляры сериализуются в простом (без кавычек) виде, если это синтаксически возможно и если представление без кавычек не соответствует регулярным выражениям для null/bool/int/float, например &lt;code&gt;foo&lt;/code&gt;, &lt;code&gt;bar&lt;/code&gt;, &lt;code&gt;baz&lt;/code&gt;, но &lt;code&gt;\"null\"&lt;/code&gt;, &lt;code&gt;\"true\"&lt;/code&gt;, &lt;code&gt;\"false\"&lt;/code&gt;, &lt;code&gt;\"123\"&lt;/code&gt;, &lt;code&gt;\"3.14\"&lt;/code&gt; (иначе они будут интерпретированы большинством парсеров YAML как типы, отличные от строк)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"obrabotka-znakovyh/bezznakovyh-celyh-chisel\"&gt;&lt;a href=\"ru/user-guide/storage/formats.html#obrabotka-znakovyh/bezznakovyh-celyh-chisel\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обработка знаковых/беззнаковых целых чисел&lt;/span&gt;&lt;/a&gt;Обработка знаковых/беззнаковых целых чисел&lt;/h3&gt;\n&lt;p&gt;Для явной обработки беззнаковых целых чисел введен пользовательский тег &lt;code&gt;!yt/uint&lt;/code&gt;. Формат имеет опцию &lt;code&gt;write_uint_tag&lt;/code&gt; (по умолчанию false), которая заставляет записывать все uint64 скаляры с этим тегом.&lt;/p&gt;\n&lt;p&gt;При разборе:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Если присутствует тег &lt;code&gt;!yt/uint&lt;/code&gt;, значение интерпретируется как uint64&lt;/li&gt;\n&lt;li&gt;Если тег отсутствует или является стандартным YAML &lt;code&gt;!!int&lt;/code&gt;:\n&lt;ul&gt;\n&lt;li&gt;Для десятичной формы числа в диапазоне [-2^63, 2^63) интерпретируются как int64, а числа в диапазоне [2^63, 2^64) как uint64&lt;/li&gt;\n&lt;li&gt;Для шестнадцатеричной/восьмеричной формы значения всегда интерпретируются как uint64&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;При записи:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Если &lt;code&gt;write_uint_tag = %false&lt;/code&gt;, все целые числа выводятся в простом (без кавычек) виде без тегов&lt;/li&gt;\n&lt;li&gt;Если &lt;code&gt;write_uint_tag = %true&lt;/code&gt;, int64 выводится в простом виде без тегов в десятичной форме, а uint64 в простой десятичной форме с тегом &lt;code&gt;!yt/uint&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"predstavlenie-atributov\"&gt;&lt;a href=\"ru/user-guide/storage/formats.html#predstavlenie-atributov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Представление атрибутов&lt;/span&gt;&lt;/a&gt;Представление атрибутов&lt;/h3&gt;\n&lt;p&gt;Узлы с атрибутами представляются как 2-элементная последовательность с тегом &lt;code&gt;!yt/attrnode&lt;/code&gt;, чтобы отличать их от обычных списков:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;YSON:\n{\n    \"foo\" = &amp;lt;\n        \"x\" = 1;\n        \"y\" = 2;\n    &amp;gt; {\n        \"bar\" = 3;\n    };\n}\nYAML:\nfoo: !yt/attrnode\n- x: 1\n  y: 2\n- bar: 3\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"642\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-642\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-642\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-642.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"ogranicheniya\"&gt;&lt;a href=\"ru/user-guide/storage/formats.html#ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения&lt;/span&gt;&lt;/a&gt;Ограничения&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Комментарии&lt;/strong&gt;: комментарии YAML отбрасываются при записи, так как они не являются частью структуры узла&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Якоря и псевдонимы&lt;/strong&gt;: поддерживаются только нерекурсивные якоря и псевдонимы, также псевдонимы должны ссылаться на узел, определенный где-то перед ними; псевдонимы не сохраняются при разборе, т.е. они сразу разрешаются&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Оператор слияния&lt;/strong&gt;: оператор слияния YAML 1.1 (\"&amp;lt;&amp;lt;\") не поддерживается и обрабатывается как обычный скалярный ключ&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Параметры&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Значения указаны в скобках по умолчанию.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;write_uint_tag&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — включить использование тега &lt;code&gt;!yt/uint&lt;/code&gt; для всех uint64 скаляров при записи&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"dsv\"&gt;&lt;a href=\"ru/user-guide/storage/formats.html#dsv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DSV (TSKV)&lt;/span&gt;&lt;/a&gt;DSV (TSKV)&lt;/h2&gt;\n&lt;p&gt;&lt;strong&gt;DSV&lt;/strong&gt; — Delimiter-Separated Values.&lt;br /&gt;\n&lt;strong&gt;TSKV&lt;/strong&gt; — Tab-Separated Key-Value.&lt;/p&gt;\n&lt;p&gt;Формат, широко используемый для хранения логов и работы с ними. DSV и TSKV — это два названия одного и того же формата.&lt;br /&gt;\nДанный формат поддерживает только плоские записи с произвольным набором колонок и строковыми значениями. Записи разделены символом переноса строки &lt;code&gt;\\n&lt;/code&gt;.&lt;br /&gt;\nПоля в записи разделяются символом табуляции &lt;code&gt;\\t&lt;/code&gt;.&lt;br /&gt;\nПодробнее можно прочитать ниже.&lt;/p&gt;\n&lt;p&gt;Пример записи: &lt;code&gt;time=10\\tday=monday\\n&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Формат не поддерживает атрибуты и типизированные значения. В примере &lt;code&gt;10&lt;/code&gt; будет распознано системой как строка, а не как число.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтение таблицы в формате DSV:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; --proxy &amp;lt;cluster-name&amp;gt; --format dsv &lt;span class=\"hljs-string\"&gt;'//home/tutorial/staff_unsorted_sample'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"701\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-701\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-701\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-701.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Представление таблицы в формате DSV:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;name=Elena      uid=95792365232151958\nname=Denis\tuid=78086244452810046\nname=Mikhail\tuid=70609792906901286\nname=Ilya\tuid=15696008603902587\nname=Oxana\tuid=76840674253209974\nname=Alexey\tuid=15943558469181404\nname=Roman\tuid=37865805882228106\nname=Anna\tuid=35039450424270744\nname=Nikolai\tuid=45320538587295288\nname=Karina\tuid=20364947097122776\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"705\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-705\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-705\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-705.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Чтение таблицы с некоторыми параметрами:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; --proxy &amp;lt;cluster-name&amp;gt; --format &lt;span class=\"hljs-string\"&gt;'&amp;lt;field_separator=\";\";key_value_separator=\":\"&amp;gt;dsv'&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'//home/tutorial/staff_unsorted_sample'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"709\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-709\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-709\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-709.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;strong&gt;Параметры:&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;В скобках указаны значения по умолчанию.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;record_separator&lt;/strong&gt; (&lt;code&gt;\\n&lt;/code&gt;) — разделитель записей.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;key_value_separator&lt;/strong&gt; (&lt;code&gt;=&lt;/code&gt;) — разделитель пары ключ-значение.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;field_separator&lt;/strong&gt; (&lt;code&gt;\\t&lt;/code&gt;) — разделитель полей в записи.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;line_prefix&lt;/strong&gt; (по умолчанию колонка отсутствует) — обязательная колонка в начале каждой записи.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_escaping&lt;/strong&gt; (&lt;code&gt;true&lt;/code&gt;) — включить escaping записей.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;escape_carriage_return&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — включить escaping символа &lt;code&gt;\\r&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;escaping_symbol&lt;/strong&gt; (&lt;code&gt;\\&lt;/code&gt;) — символ экранирования.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_table_index&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) – включить вывод индекса входной таблицы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;table_index_column&lt;/strong&gt;  (&lt;code&gt;@table_index&lt;/code&gt;) – название колонки, в которой будет находиться индекс таблицы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_string_to_all_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — включить приведение строковых значений к численным и boolean-типам. Например, &lt;code&gt;\"42u\"&lt;/code&gt; преобразуется в &lt;code&gt;42u&lt;/code&gt;, а &lt;code&gt;\"false\"&lt;/code&gt; преобразуется в &lt;code&gt;%false&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_all_to_string_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — включить приведение численных и boolean-значений к строковому типу. Например, число &lt;code&gt;3.14&lt;/code&gt; преобразуется в &lt;code&gt;\"3.14\"&lt;/code&gt;, а &lt;code&gt;%false&lt;/code&gt; в &lt;code&gt;\"false\"&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_integral_type_conversion&lt;/strong&gt; (&lt;code&gt;true&lt;/code&gt;) — включить приведение &lt;code&gt;uint64&lt;/code&gt; к &lt;code&gt;int64&lt;/code&gt; и наоборот. Если при преобразовании происходит переполнение, возникает соответствующая ошибка.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_integral_to_double_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — включить приведение &lt;code&gt;uint64&lt;/code&gt; и &lt;code&gt;int64&lt;/code&gt; к &lt;code&gt;double&lt;/code&gt;. Например, целое число &lt;code&gt;42&lt;/code&gt; преобразуется в дробное число &lt;code&gt;42.0&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_type_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — включить все перечисленные выше опции. В большинстве случаев достаточно пользоваться только этой опцией.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Практически произвольная строка является валидной DSV-записью. Если после ключа нет key-value разделителя, поле игнорируется.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"schemaful_dsv\"&gt;&lt;a href=\"ru/user-guide/storage/formats.html#schemaful_dsv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SCHEMAFUL_DSV&lt;/span&gt;&lt;/a&gt;SCHEMAFUL_DSV&lt;/h2&gt;\n&lt;p&gt;Формат является разновидностью DSV. При использовании SCHEMAFUL_DSV данные формируются в виде набора значений, разделенных табами.&lt;br /&gt;\nУ формата есть обязательный атрибут &lt;code&gt;columns&lt;/code&gt;, в котором через точку с запятой необходимо задать имена интересующих колонок. Если хотя бы в одной из записей отсутствует значение одной из колонок, возникнет ошибка (смотрите &lt;strong&gt;missing_value_mode&lt;/strong&gt;).&lt;/p&gt;\n&lt;p&gt;Например, если в таблице есть две записи &lt;code&gt;{a=10;b=11} {c=100}&lt;/code&gt; и указан формат &lt;code&gt;&amp;lt;columns=[a]&amp;gt;schemaful_dsv&lt;/code&gt;, возникнет ошибка вида &lt;code&gt;Column \"a\" is in schema but missing&lt;/code&gt;.&lt;br /&gt;\nЕсли в таблице будет только первая запись, на вход джобу пришла бы запись&lt;code&gt;10&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При работе с YTsaurus CLI необходимо писать атрибуты в кавычках. Например: &lt;code&gt;--format=\"&amp;lt;columns=[a;b]&amp;gt;schemaful_dsv\"&lt;/code&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтение таблицы в формате SCHEMAFUL_DSV:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; --proxy &amp;lt;cluster-name&amp;gt; --format &lt;span class=\"hljs-string\"&gt;'&amp;lt;columns=[name;uid]&amp;gt;schemaful_dsv'&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'//home/tutorial/staff_unsorted_sample'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"820\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-820\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-820\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-820.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Представление таблицы в формате SCHEMAFUL_DSV:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Elena   95792365232151958\nDenis\t78086244452810046\nMikhail\t70609792906901286\nIlya\t15696008603902587\nOxana\t76840674253209974\nAlexey\t15943558469181404\nRoman\t37865805882228106\nAnna\t35039450424270744\nNikolai\t45320538587295288\nKarina\t20364947097122776\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"824\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-824\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-824\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-824.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;strong&gt;Параметры:&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;В скобках указаны значения по умолчанию.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;record_separator&lt;/strong&gt; (&lt;code&gt;\\n&lt;/code&gt;) — разделитель записей.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;field_separator&lt;/strong&gt; (&lt;code&gt;\\t&lt;/code&gt;) — разделитель полей.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_table_index&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) – включить печать переключения таблиц во входных данных.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_escaping&lt;/strong&gt; (&lt;code&gt;true&lt;/code&gt;) – включает escaping служебных символов &lt;code&gt;\\n&lt;/code&gt;, &lt;code&gt;\\t&lt;/code&gt; и &lt;code&gt;\\&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;escaping_symbol&lt;/strong&gt; (&lt;code&gt;\\&lt;/code&gt;) – символ экранирования.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;columns&lt;/strong&gt; – список колонок, которые будут форматироваться, например &lt;code&gt;&amp;lt;columns=[columnA;columnB]&amp;gt;schemaful_dsv&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;missing_value_mode&lt;/strong&gt; (&lt;code&gt;fail&lt;/code&gt;) — поведение при отсутствии значения – &lt;code&gt;NULL&lt;/code&gt;:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;skip_row&lt;/code&gt; — пропустить строку;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;fail&lt;/code&gt; — прекратить выполнение операции, если указанной колонки нет в одной из строк;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;print_sentinel&lt;/code&gt; — вместо отсутствующих значений задать &lt;code&gt;missing_value_sentinel&lt;/code&gt;, который по умолчанию равен пустой строке.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;missing_value_sentinel&lt;/strong&gt; (&lt;code&gt;пустая строка&lt;/code&gt;) — значение отсутствующей колонки для режима &lt;strong&gt;print_sentinel&lt;/strong&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_column_names_header&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — может быть использовано только при формировании данных в формате SCHEMAFUL_DSV, но не при разборе таких данных. Если значение равно &lt;code&gt;%true&lt;/code&gt;, то в первой строке вместо значений будут имена колонок. &lt;strong&gt;Важно&lt;/strong&gt; - имена колонок могут дублироваться в теле ответа при включенном параллельном чтении или ретраях.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_string_to_all_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — включить приведение строковых значений к численным и boolean-типам. Например, &lt;code&gt;\"42u\"&lt;/code&gt; преобразуется в &lt;code&gt;42u&lt;/code&gt;, а &lt;code&gt;\"false\"&lt;/code&gt; преобразуется в &lt;code&gt;%false&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_all_to_string_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — включить приведение численных и boolean-значений к строковому типу. Например, число &lt;code&gt;3.14&lt;/code&gt; превратится в &lt;code&gt;\"3.14\"&lt;/code&gt;, а &lt;code&gt;%false&lt;/code&gt; в &lt;code&gt;\"false\"&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_integral_type_conversion&lt;/strong&gt; (&lt;code&gt;true&lt;/code&gt;) — включить приведение &lt;code&gt;uint64&lt;/code&gt; к &lt;code&gt;int64&lt;/code&gt; и наоборот. Обратите внимание, эта опция включена по умолчанию. Если при преобразовании происходит переполнение, то возникает соответствующая ошибка.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_integral_to_double_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — включить приведение &lt;code&gt;uint64&lt;/code&gt; и &lt;code&gt;int64&lt;/code&gt; к &lt;code&gt;double&lt;/code&gt;. Например, целое число &lt;code&gt;42&lt;/code&gt; превратится в дробное число &lt;code&gt;42.0&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;enable_type_conversion&lt;/strong&gt; (&lt;code&gt;false&lt;/code&gt;) — включить все перечисленные выше опции. В большинстве случаев достаточно пользоваться только этой опцией.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"Arrow\"&gt;&lt;a href=\"ru/user-guide/storage/formats.html#Arrow\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ARROW&lt;/span&gt;&lt;/a&gt;ARROW&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"https://arrow.apache.org/overview\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Arrow&lt;/a&gt; (apache arrow) - бинарный формат, разработанный как универсальный стандарт для эффективного представления и обмена поколоночными данными в памяти между различными системами.&lt;/p&gt;\n&lt;p&gt;Преимущества формата:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;В отличие от строкового представления, где данные каждой строки хранятся вместе, arrow организует данные в столбцы. Это позволяет более эффективно выполнять некоторые аналитические запросы.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Arrow поддерживает сложные типы данных, такие как структуры, списки, словари и другие.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"arrow-v-ytsaurus\"&gt;&lt;a href=\"ru/user-guide/storage/formats.html#arrow-v-ytsaurus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Arrow в YTsaurus&lt;/span&gt;&lt;/a&gt;Arrow в YTsaurus&lt;/h3&gt;\n&lt;p&gt;При чтении таблицы в формате arrow возвращается конкатенация нескольких &lt;a href=\"https://arrow.apache.org/docs/format/Columnar.html#ipc-streaming-format\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;IPC Streaming Format&lt;/a&gt; потоков.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;SCHEMA&amp;gt;\n&amp;lt;DICTIONARY 0&amp;gt;\n...\n&amp;lt;DICTIONARY k - 1&amp;gt;\n&amp;lt;RECORD BATCH 0&amp;gt;\n...\n&amp;lt;DICTIONARY x DELTA&amp;gt;\n...\n&amp;lt;DICTIONARY y DELTA&amp;gt;\n...\n&amp;lt;RECORD BATCH n - 1&amp;gt;\n&amp;lt;EOS 0x00000000&amp;gt;\n&amp;lt;SCHEMA&amp;gt;\n...\n&amp;lt;EOS 0x00000000&amp;gt;\n...\n&amp;lt;EOS 0x00000000&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"947\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-947\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-947\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-947.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Возвращается несколько сконкатенированных потоков, а не один общий из-за того, что в YTsaurus одна и та же колонка может храниться по-разному в разных чанках. Например, данные колонки могут храниться как явно целиком, так и в виде словаря (аналогично &lt;a href=\"https://arrow.apache.org/docs/format/Columnar.html#dictionary-encoded-layout\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;словарю в arrow&lt;/a&gt;). При представлении данных в arrow формате мы сохраняем кодировку в виде словаря, и отдаем несколько сконкатенированных потоков, если какая-то колонка в одном чанке закодирована целиком, а в другом как словарь.&lt;/p&gt;\n&lt;p&gt;Ограничения и особенности:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Чтение и запись можно производить только со схематизированными таблицами.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Рекомендуется читать в arrow таблицы с поколоночным форматом хранения чанков &lt;code&gt;optimize_for = scan&lt;/code&gt;, чтобы чтение было эффективно.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Запись в arrow пока не оптимизирована для таблиц с поколоночным форматом хранения чанков, происходит двойная трансформация данных, из поколоночного представления трансформируется в построчное и обратно.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"tipy\"&gt;&lt;a href=\"ru/user-guide/storage/formats.html#tipy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типы&lt;/span&gt;&lt;/a&gt;Типы&lt;/h3&gt;\n&lt;p&gt;Для чтения таблиц сейчас поддержаны такие типы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;string&lt;/code&gt; отображается в &lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type6BINARYE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::binary&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;integer&lt;/code&gt; отображается в какой-то из &lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type5UINT8E\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::integer&lt;/a&gt; в зависимости от&lt;br /&gt;\nбитности и знака&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;boolean&lt;/code&gt; отображается в &lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type4BOOLE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::bool&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;float&lt;/code&gt; отображается в &lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type5FLOATE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::float&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;double&lt;/code&gt; отображается в &lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type6DOUBLEE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::double&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;date&lt;/code&gt; отображается в &lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type6DATE32E\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::date32&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;datetime&lt;/code&gt; отображается в &lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type6DATE64E\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::date64&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;timestamp&lt;/code&gt; отображается в &lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type9TIMESTAMPE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::timestamp&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;interval&lt;/code&gt; отображается в &lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type5INT64E\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::int64&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;cложные типы&lt;/code&gt; представляются в виде &lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type6BINARYE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::binary&lt;/a&gt;, где хранится &lt;a href=\"https://yt.yandex-team.ru/docs/user-guide/storage/data-types#yson\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yson представление&lt;/a&gt; этих типов&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;На запись поддержаны те же типы, что и на чтение, а также дополнительно поддержаны:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type4LISTE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::list&lt;/a&gt; представляется, как &lt;code&gt;list&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type3MAPE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::map&lt;/a&gt; представляется, как &lt;code&gt;dict&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type6STRUCTE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::struct&lt;/a&gt; представляется, как &lt;code&gt;struct&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Другие особенности работы с типами:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;При чтении таблицы почти любой из типов может прийти, как &lt;a href=\"https://arrow.apache.org/docs/cpp/api/datatype.html#_CPPv4N5arrow4Type4type10DICTIONARYE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arrow::dictionary&lt;/a&gt;, где элементы словаря будут значениями, которые встречаются в колонке, а индексы указывают на порядок значений, подробнее &lt;a href=\"https://arrow.apache.org/docs/format/Columnar.html#dictionary-encoded-layout\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;тут&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;формат arrow поддерживает одну вложенность optional, более глубокая вложенность при чтении будет возвращена бинарным типом, так же как и для остальных сложных типов.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"primer-operacij\"&gt;&lt;a href=\"ru/user-guide/storage/formats.html#primer-operacij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример операций&lt;/span&gt;&lt;/a&gt;Пример операций&lt;/h3&gt;\n&lt;p&gt;Чтение таблицы в arrow:&lt;/p&gt;\n&lt;div class=\"yfm-tabs\" data-diplodoc-group=\"defaultTabsGroup-18aayw8l\" data-diplodoc-variant=\"regular\"&gt;\n&lt;div class=\"yfm-tab-list\" role=\"tablist\"&gt;\n&lt;div data-diplodoc-id=\"python-1\" data-diplodoc-key=\"python\" class=\"yfm-tab yfm-tab-group active\" role=\"tab\" tabindex=\"0\" data-diplodoc-is-active=\"true\"&gt;Python&lt;/div&gt;\n&lt;div data-diplodoc-id=\"cli-1\" data-diplodoc-key=\"cli\" class=\"yfm-tab yfm-tab-group\" role=\"tab\" tabindex=\"-1\" data-diplodoc-is-active=\"false\"&gt;CLI&lt;/div&gt;\n&lt;/div&gt;\
