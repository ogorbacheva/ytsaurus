n&lt;div id=\"31qddvmv\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"Python\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.read_table(&lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt;, &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=yt.&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;.ArrowFormat(), raw=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1085\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1085\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1085\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1085.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"f1o49ne8\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"CLI\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt; yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; --table &lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt; --format arrow\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1088\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1088\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1088\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1088.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;p&gt;Map операция с arrow:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt map --input-format arrow --output-format arrow  --src &lt;span class=\"hljs-string\"&gt;\"//path/to/input_table\"&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"cat\"&lt;/span&gt; --dst &lt;span class=\"hljs-string\"&gt;'&amp;lt;schema=[{name=item_1;type=int64};{name=item_2;type=string}]&amp;gt;//path/to/output_table'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1094\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1094\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1094\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1094.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"operacii-s-neskolkimi-tablicami\"&gt;&lt;a href=\"ru/user-guide/storage/formats.html#operacii-s-neskolkimi-tablicami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Операции с несколькими таблицами&lt;/span&gt;&lt;/a&gt;Операции с несколькими таблицами&lt;/h3&gt;\n&lt;p&gt;Если на вход операции в формате arrow передать несколько таблиц, то внутри операции будет получен поток так же в виде конкатенации нескольких IPC Streaming Format потоков, где каждая часть может принадлежать одной из таблиц. Индекс таблицы передается в виде &lt;a href=\"https://arrow.apache.org/docs/format/Columnar.html#schema-message\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;метаданных схемы&lt;/a&gt; с именем &lt;code&gt;TableId&lt;/code&gt;, подробнее о метаданных в arrow можно почитать &lt;a href=\"https://arrow.apache.org/docs/format/Columnar.html#custom-application-metadata\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;тут&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"BLOB\"&gt;&lt;a href=\"ru/user-guide/storage/formats.html#BLOB\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BLOB&lt;/span&gt;&lt;/a&gt;BLOB&lt;/h2&gt;\n&lt;p&gt;BLOB формат предоставляет удобный способ доставки бинарных данных из BLOB-таблицы в джобу (см. &lt;a href=\"https://yt.yandex-team.ru/docs/user-guide/storage/blobtables\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Бинарные данные&lt;/a&gt;). Данные в формате BLOB представляют собой конкатенацию бинарных данных из колонки таблицы &lt;code&gt;data_column_name&lt;/code&gt;. При использовании формата проверяется, что номера BLOB в колонке &lt;code&gt;part_index_column_name&lt;/code&gt; последовательно возрастают начиная с какого-то числа.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Параметры:&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;В скобках указаны значения по умолчанию.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;part_index_column_name&lt;/strong&gt; (&lt;code&gt;part_index&lt;/code&gt;) — имя колонки с номерами BLOB&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;data_column_name&lt;/strong&gt; (&lt;code&gt;data&lt;/code&gt;) — имя колонки с данными BLOB.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"primer\"&gt;&lt;a href=\"ru/user-guide/storage/formats.html#primer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th style=\"text-align:left\"&gt;part_index&lt;/th&gt;\n&lt;th style=\"text-align:center\"&gt;data&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;0&lt;/td&gt;\n&lt;td style=\"text-align:center\"&gt;hel&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;1&lt;/td&gt;\n&lt;td style=\"text-align:center\"&gt;lo&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\"text-align:left\"&gt;2&lt;/td&gt;\n&lt;td style=\"text-align:center\"&gt;world&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Чтение в формате BLOB:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; --table &lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt; --format blob\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1169\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1169\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1169\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1169.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Представление в формате BLOB:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;helloworld\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1173\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1173\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1173\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1173.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"PARQUET\"&gt;&lt;a href=\"ru/user-guide/storage/formats.html#PARQUET\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PARQUET&lt;/span&gt;&lt;/a&gt;PARQUET&lt;/h2&gt;\n&lt;p&gt;Поддержана работа с &lt;a href=\"https://parquet.apache.org/docs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;parquet&lt;/a&gt; из командной строки:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.cli.html#yt.cli.yt_binary.dump_parquet\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;dump-parquet&lt;/a&gt; позволяет скачать таблицу локально в виде файла в формате parquet.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://pydoc.ytsaurus.tech/yt.cli.html#yt.cli.yt_binary.upload_parquet\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;upload-parquet&lt;/a&gt; позволяет загрузить в YT локальный файл в формате parquet в виде статической схематизированной таблицы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"PROTOBUF\"&gt;&lt;a href=\"ru/user-guide/storage/formats.html#PROTOBUF\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PROTOBUF&lt;/span&gt;&lt;/a&gt;PROTOBUF&lt;/h2&gt;\n&lt;p&gt;Protobuf - протокол передачи структурированных данных для работы с таблицами в С++ API.&lt;/p&gt;\n&lt;p&gt;Подробнее можно прочитать в разделе &lt;a href=\"api/cpp/protobuf.html\"&gt;Protobuf&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/storage/formats.md","sourcePath":"ru/user-guide/storage/formats.md"},"headings":[{"title":"Типы данных","href":"ru/user-guide/storage/formats.html#data_types","level":2,"items":[{"title":"Структурированные данные","href":"ru/user-guide/storage/formats.html#structured_data","level":3},{"title":"Табличные данные","href":"ru/user-guide/storage/formats.html#table_data","level":3},{"title":"Бинарные данные","href":"ru/user-guide/storage/formats.html#binary_data","level":3}]},{"title":"Форматы представления табличных данных","href":"ru/user-guide/storage/formats.html#table_formats","level":2},{"title":"Пример","href":"ru/user-guide/storage/formats.html#example","level":2},{"title":"YSON","href":"ru/user-guide/storage/formats.html#yson","level":2},{"title":"JSON","href":"ru/user-guide/storage/formats.html#json","level":2},{"title":"YAML","href":"ru/user-guide/storage/formats.html#yaml","level":2,"items":[{"title":"Система типов","href":"ru/user-guide/storage/formats.html#sistema-tipov","level":3},{"title":"Обработка знаковых/беззнаковых целых чисел","href":"ru/user-guide/storage/formats.html#obrabotka-znakovyh/bezznakovyh-celyh-chisel","level":3},{"title":"Представление атрибутов","href":"ru/user-guide/storage/formats.html#predstavlenie-atributov","level":3},{"title":"Ограничения","href":"ru/user-guide/storage/formats.html#ogranicheniya","level":3}]},{"title":"DSV (TSKV)","href":"ru/user-guide/storage/formats.html#dsv","level":2},{"title":"SCHEMAFUL_DSV","href":"ru/user-guide/storage/formats.html#schemaful_dsv","level":2},{"title":"ARROW","href":"ru/user-guide/storage/formats.html#Arrow","level":2,"items":[{"title":"Arrow в YTsaurus","href":"ru/user-guide/storage/formats.html#arrow-v-ytsaurus","level":3},{"title":"Типы","href":"ru/user-guide/storage/formats.html#tipy","level":3},{"title":"Пример операций","href":"ru/user-guide/storage/formats.html#primer-operacij","level":3},{"title":"Операции с несколькими таблицами","href":"ru/user-guide/storage/formats.html#operacii-s-neskolkimi-tablicami","level":3}]},{"title":"BLOB","href":"ru/user-guide/storage/formats.html#BLOB","level":2,"items":[{"title":"Пример","href":"ru/user-guide/storage/formats.html#primer","level":3}]},{"title":"PARQUET","href":"ru/user-guide/storage/formats.html#PARQUET","level":2},{"title":"PROTOBUF","href":"ru/user-guide/storage/formats.html#PROTOBUF","level":2}],"title":"Форматы"},"router":{"pathname":"ru/user-guide/storage/formats","depth":4,"base":"../../../"},"la
