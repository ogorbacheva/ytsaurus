        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе собрана информация о том, как использовать таблицы для хранения бинарных данных.&lt;/p&gt;\n&lt;h2 id=\"common\"&gt;&lt;a href=\"ru/user-guide/storage/blobtables.html#common\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общие сведения&lt;/span&gt;&lt;/a&gt;Общие сведения&lt;/h2&gt;\n&lt;p&gt;Иногда необходимо сохранять бинарные данные из джобов.&lt;br /&gt;\nОчевидное решение заключается в том, чтобы писать из каждого джоба файл в Кипарис.&lt;br /&gt;\nНо у этого способа есть недостатки:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Создается высокая нагрузка на прокси.&lt;/li&gt;\n&lt;li&gt;Появляется большое количество объектов в Кипарисе, что негативно сказывается на эффективности работы с ними.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Поэтому предпочтительнее записывать бинарные данные в одну таблицу:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Данные разбиваются на части и сохраняются в отдельные строки таблицы. У этой таблицы должен быть набор ключевых колонок, которые однозначно определяют файл: имя и путь. Кроме того, должна быть колонка, отвечающая за номер &lt;a href=\"https://ru.wikipedia.org/wiki/BLOB\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;BLOB&lt;/a&gt; с данными и колонка, отвечающая за сами данные. Таблица должна быть отсортирована по набору ключевых колонок и по колонке с номером BLOB, чтобы были возможны точечные чтения по ключу, задающему имя файла.&lt;/li&gt;\n&lt;li&gt;Для файла все BLOB, кроме последнего, должны иметь одинаковый размер. Рекомендуемый размер — 4 МБ, его по умолчанию ожидают некоторые команды, например &lt;code&gt;read_blob_table&lt;/code&gt;. Колонки с данными и номером BLOB должны иметь имена &lt;code&gt;data&lt;/code&gt; и &lt;code&gt;part_index&lt;/code&gt; соответственно.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Таблицы, удовлетворяющие описанным условиям, — BLOB-таблицы.&lt;/p&gt;\n&lt;p&gt;Внутри YTsaurus BLOB-таблицы используются для хранения stderr и core-файлов, порождаемых джобами операций.&lt;br /&gt;\nНапример, в таблице с stderr операции имеется 3 колонки: &lt;code&gt;job_id&lt;/code&gt;, &lt;code&gt;part_index&lt;/code&gt; и &lt;code&gt;data&lt;/code&gt;, таблица отсортирована по &lt;code&gt;job_id&lt;/code&gt; и &lt;code&gt;part_index&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"read_blob_table\"&gt;&lt;a href=\"ru/user-guide/storage/blobtables.html#read_blob_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Команда read_blob_table&lt;/span&gt;&lt;/a&gt;Команда read_blob_table&lt;/h2&gt;\n&lt;p&gt;Для удобного чтения данных из BLOB-таблиц реализована специальная команда &lt;code&gt;read_blob_table&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Команда принимает на вход путь к таблице. На выход данная команда передает поток бинарных данных.&lt;br /&gt;\nТакже команда проверяет, что индексы читаемых BLOB начинаются с нуля и идут без пропусков.&lt;/p&gt;\n&lt;p&gt;Команда имеет параметры &lt;code&gt;part_index_column_name&lt;/code&gt; и &lt;code&gt;data_column_name&lt;/code&gt;, позволяющие задать имена колонок с номером BLOB и данными соответственно. По умолчанию эти имена равны &lt;code&gt;part_index&lt;/code&gt; и &lt;code&gt;data&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Пример запуска операции и чтения stderr джоба из таблицы с BLOB:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Запускаем Map операцию&lt;/span&gt;\n$ yt --proxy &amp;lt;cluster-name&amp;gt; map --src &lt;span class=\"hljs-string\"&gt;'//tmp/table_in'&lt;/span&gt; --dst &lt;span class=\"hljs-string\"&gt;'//tmp/table_mapped'&lt;/span&gt; --format yson &lt;span class=\"hljs-string\"&gt;'cat; echo something &amp;gt;&amp;amp;2'&lt;/span&gt; --spec=&lt;span class=\"hljs-string\"&gt;'{stderr_table_path=\"//tmp/stderr_table\";}'&lt;/span&gt;\n\n2023-12-07 16:25:19,463\tINFO\tOperation started: http://&amp;lt;cluster-name&amp;gt;/?page=operation&amp;amp;mode=detail&amp;amp;&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=11788844-52f37dd2-3ff03e8-ff3bf1e4&amp;amp;tab=details\n2023-12-07 16:25:19,561\tINFO\t( 0 min) operation 11788844-52f37dd2-3ff03e8-ff3bf1e4 initializing\n2023-12-07 16:25:22,961\tINFO\t( 0 min) Unrecognized spec: {&lt;span class=\"hljs-string\"&gt;'mapper'&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;'title'&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'cat;'&lt;/span&gt;}}\n2023-12-07 16:25:24,230\tINFO\t( 0 min) operation 11788844-52f37dd2-3ff03e8-ff3bf1e4: running=0     completed=0     pending=1     failed=0     aborted=0     lost=0     total=1     blocked=0    \n2023-12-07 16:25:25,353\tINFO\t( 0 min) operation 11788844-52f37dd2-3ff03e8-ff3bf1e4 completing\n2023-12-07 16:25:27,527\tINFO\t( 0 min) operation 11788844-52f37dd2-3ff03e8-ff3bf1e4 completed\n\n&lt;span class=\"hljs-comment\"&gt;# Узнаём job id&lt;/span&gt;\n$ yt --proxy &amp;lt;cluster-name&amp;gt; list-jobs 11788844-52f37dd2-3ff03e8-ff3bf1e4 --format json | jq &lt;span class=\"hljs-string\"&gt;'.jobs[] | select(.type==\"map\").id'&lt;/span&gt;\n\n&lt;span class=\"hljs-string\"&gt;\"4c3fc84d-884fbde5-3ff0384-94b1\"&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Читаем «ошибки» только этого джоба&lt;/span&gt;\n$ yt --proxy &amp;lt;cluster-name&amp;gt; read-blob-table &lt;span class=\"hljs-string\"&gt;'//tmp/stderr_table[\"4c3fc84d-884fbde5-3ff0384-94b1\"]'&lt;/span&gt;\nsomething\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"57\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-57\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-57\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-57.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/storage/blobtables.md","sourcePath":"ru/user-guide/storage/blobtables.md"},"headings":[{"title":"Общие сведения","href":"ru/user-guide/storage/blobtables.html#common","level":2},{"title":"Команда read_blob_table","href":"ru/user-guide/storage/blobtables.html#read_blob_table","level":2}],"title":"Бинарные данные в таблицах"},"router":{"pathname":"ru/user-guide/storage/blobtables","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
