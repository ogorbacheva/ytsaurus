        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе содержится информация об объектах системы YTsaurus, которые предназначены для хранения больших бинарных данных. Также, бинарные данные можно хранить в &lt;a href=\"user-guide/storage/blobtables.html\"&gt;таблицах&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"common\"&gt;&lt;a href=\"ru/user-guide/storage/files.html#common\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общие сведения&lt;/span&gt;&lt;/a&gt;Общие сведения&lt;/h2&gt;\n&lt;p&gt;Файл — это узел &lt;a href=\"user-guide/storage/cypress.html\"&gt;Кипариса&lt;/a&gt;, имеющий тип &lt;strong&gt;file&lt;/strong&gt; и предназначенный для хранения больших бинарных данных в системе.&lt;/p&gt;\n&lt;p&gt;Бинарные данные можно хранить не только в файлах, но и в таблицах.&lt;/p&gt;\n&lt;p&gt;Иногда необходимо из джобов сохранять бинарные данные. Очевидное решение заключается в том, чтобы записывать из каждого джоба файл в Кипарис. Однако данный способ имеет ряд недостатков:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Создается высокая нагрузку на прокси-сервер;&lt;/li&gt;\n&lt;li&gt;Появляется большое количество объектов в Кипарисе, что негативно сказывается на эффективности работы с ними.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В качестве решения предлагается другой способ — писать бинарные данные в одну таблицу.&lt;/p&gt;\n&lt;h2 id=\"usage\"&gt;&lt;a href=\"ru/user-guide/storage/files.html#usage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование&lt;/span&gt;&lt;/a&gt;Использование&lt;/h2&gt;\n&lt;p&gt;Файлы поддерживают операцию записи в конец: &lt;a href=\"api/commands.html#write_file\"&gt;команда&lt;/a&gt; &lt;code&gt;write_file&lt;/code&gt;. При этом запись производится путем добавления &lt;a href=\"user-guide/storage/chunks.html\"&gt;чанков&lt;/a&gt;, поэтому делать много мелких записей не рекомендуется.&lt;/p&gt;\n&lt;p&gt;Для чтения файлов используется &lt;a href=\"api/commands.html#read_file\"&gt;команда&lt;/a&gt; &lt;code&gt;read_file&lt;/code&gt;. Можно читать файл либо целиком, либо указав диапазон чтения в виде смещений в байтах. Для этого используйте селектор &lt;code&gt;offset&lt;/code&gt; языка &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPath&lt;/a&gt;.&lt;br /&gt;\nКаждое чтение требует запроса метаданных мастер-сервера, поэтому не рекомендуется делать много чтений.&lt;/p&gt;\n&lt;h3 id=\"usage_in_jobs\"&gt;&lt;a href=\"ru/user-guide/storage/files.html#usage_in_jobs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование в джобах &lt;/span&gt;&lt;/a&gt;Использование в джобах &lt;/h3&gt;\n&lt;p&gt;Одно из применений файлов — доставка одних и тех же данных, например, справочников, для &lt;a href=\"user-guide/data-processing/operations/overview.html\"&gt;джобов&lt;/a&gt;. При этом чанки файла скачиваются в локальный кэш на каждом узле, где потребовался файл.&lt;/p&gt;\n&lt;p&gt;Когда файл состоит из двух и более чанков или для него задан &lt;code&gt;compression_codec&lt;/code&gt;, из &lt;a href=\"user-guide/storage/chunks.html\"&gt;чанков&lt;/a&gt; формируется оригинальный файл в кэше. Такой файл называется артефактом. Существует два способа доставки артефакта в файл в &lt;code&gt;sandbox&lt;/code&gt; джоба — специальную директорию, созданную для каждого джоба:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;По умолчанию в &lt;code&gt;sandbox&lt;/code&gt; джоба будет создана &lt;a href=\"user-guide/storage/links.html\"&gt;ссылка&lt;/a&gt; на артефакт. Такое поведение является предпочтительным, так как работает быстрее и создает меньше IO-нагрузки на жесткие диски.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Если в спецификации указана опция &lt;code&gt;copy_file&lt;/code&gt;, файл будет скопирован в &lt;code&gt;sandbox&lt;/code&gt;. Такое поведение стоит использовать, только если требуется смонтировать весь &lt;code&gt;sandbox&lt;/code&gt; в &lt;a href=\"https://ru.wikipedia.org/wiki/Tmpfs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;tmpfs&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Если для файла атрибут &lt;code&gt;executable&lt;/code&gt; имеет значение &lt;code&gt;true&lt;/code&gt;, в &lt;code&gt;sandbox&lt;/code&gt; джоба он будет исполняемым. По умолчанию атрибут имеет значение &lt;code&gt;false&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;С помощью атрибута &lt;code&gt;file_name&lt;/code&gt; можно контролировать имя файла или ссылки, созданных в &lt;code&gt;sandbox&lt;/code&gt;. При отсутствии этого атрибута используется имя файла из &lt;a href=\"user-guide/storage/cypress.html\"&gt;Кипариса&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"attributes\"&gt;&lt;a href=\"ru/user-guide/storage/files.html#attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Системные атрибуты&lt;/span&gt;&lt;/a&gt;Системные атрибуты&lt;/h2&gt;\n&lt;p&gt;Любой файл имеет атрибуты, представленные в таблице ниже.&lt;br /&gt;\nКоличество байт в файле содержится в атрибуте &lt;code&gt;uncompressed_data_size&lt;/code&gt;, который есть у всех владельцев чанков.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Атрибут&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;executable&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Является ли файл исполнимым.&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;file_name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя файла при перемещении его в &lt;code&gt;sandbox&lt;/code&gt; к джобу.&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Все файлы являются владельцами чанков, поэтому получают соответствующие &lt;a href=\"user-guide/storage/chunks.html#attributes\"&gt;атрибуты&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/storage/files.md","sourcePath":"ru/user-guide/storage/files.md"},"headings":[{"title":"Общие сведения","href":"ru/user-guide/storage/files.html#common","level":2},{"title":"Использование","href":"ru/user-guide/storage/files.html#usage","level":2,"items":[{"title":"Использование в джобах ","href":"ru/user-guide/storage/files.html#usage_in_jobs","level":3}]},{"title":"Системные атрибуты","href":"ru/user-guide/storage/files.html#attributes","level":2}],"title":"Файлы"},"router":{"pathname":"ru/user-guide/storage/files","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
