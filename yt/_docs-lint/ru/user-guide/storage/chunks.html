        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе собрана информация о чанках - частях таблицы или файла, которые хранят данные.&lt;/p&gt;\n&lt;h2 id=\"common\"&gt;&lt;a href=\"ru/user-guide/storage/chunks.html#common\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общие сведения&lt;/span&gt;&lt;/a&gt;Общие сведения&lt;/h2&gt;\n&lt;p&gt;Данные, хранящиеся в &lt;a href=\"user-guide/storage/static-tables.html\"&gt;таблицах&lt;/a&gt;, &lt;a href=\"user-guide/storage/files.html\"&gt;файлах&lt;/a&gt; и журналах, разбиты на части, называемые чанками. Чанк хранит непрерывный диапазон данных.&lt;br /&gt;\nВ частности, в каждом чанке таблицы содержится некоторый диапазон ее строк.&lt;br /&gt;\nЧанк — неизменяемая сущность: после создания чанка данные в нем нельзя изменить.&lt;/p&gt;\n&lt;p&gt;Физически данные чанков хранятся на узлах кластера. Мастер-сервера YTsaurus отслеживают расположение чанков, а также поддерживают их в &lt;a href=\"user-guide/storage/replication.html\"&gt;реплицированном&lt;/a&gt; состоянии.&lt;/p&gt;\n&lt;p&gt;Мастер-сервера YTsaurus хранят только метаданные. Тем не менее, метаданные имеют существенный размер, поэтому, чтобы ограничить потребление памяти мастер-серверами, количество чанков, доступных аккаунту, &lt;a href=\"user-guide/storage/quotas.html\"&gt;квотируется&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"chunk-size\"&gt;&lt;a href=\"ru/user-guide/storage/chunks.html#chunk-size\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Размер чанков&lt;/span&gt;&lt;/a&gt;Размер чанков&lt;/h3&gt;\n&lt;p&gt;Чанки не монолитны, они состоят из блоков, чтобы можно было читать и записывать чанк частями.&lt;br /&gt;\nБлоки статических таблиц по умолчанию имеют размер 16 мегабайт, а блоки динамических таблиц — 256 килобайт.&lt;/p&gt;\n&lt;p&gt;Размер блока можно изменить в настройках &lt;a href=\"user-guide/storage/io-configuration.html\"&gt;&lt;code&gt;table_writer&lt;/code&gt;&lt;/a&gt;, атрибут &lt;code&gt;block_size&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Как правило, чанк занимает на узле кластера сотни мегабайт или единицы гигабайт.&lt;br /&gt;\nРазмер создаваемых чанков можно настраивать через секцию &lt;a href=\"user-guide/storage/io-configuration.html\"&gt;&lt;code&gt;table_writer&lt;/code&gt;&lt;/a&gt;, атрибут &lt;code&gt;desired_chunk_size&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Не рекомендуется делать чанки слишком маленькими. Это приводит к увеличению их количества, что расходует память мастер-серверов. Также, мелкие чанки замедляют чтение: возрастает количество запросов к мастеру и к диску, которые необходимо сделать, чтобы прочитать все данные.&lt;/p&gt;\n&lt;h3 id=\"reading\"&gt;&lt;a href=\"ru/user-guide/storage/chunks.html#reading\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чтение данных&lt;/span&gt;&lt;/a&gt;Чтение данных&lt;/h3&gt;\n&lt;p&gt;Когда клиент вызывает процедуру чтения данных из статической таблицы, на прокси-сервере выполняются следующие шаги:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Получение от мастер-сервера списка чанков, из которых состоит таблица.&lt;/li&gt;\n&lt;li&gt;Получение от мастер-сервера списка узлов кластера, на которых находятся реплики чанка.&lt;/li&gt;\n&lt;li&gt;Скачивание данных с узлов кластера и передача клиенту.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"writing\"&gt;&lt;a href=\"ru/user-guide/storage/chunks.html#writing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запись данных&lt;/span&gt;&lt;/a&gt;Запись данных&lt;/h3&gt;\n&lt;p&gt;Запись осуществляется схожим образом:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Разделение потока входных данных на части.&lt;/li&gt;\n&lt;li&gt;Оформление каждой части в виде чанка.&lt;/li&gt;\n&lt;li&gt;Передача данных на узлы кластера и привязка к таблице.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"optimize_for\"&gt;&lt;a href=\"ru/user-guide/storage/chunks.html#optimize_for\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Формат чанка&lt;/span&gt;&lt;/a&gt;Формат чанка&lt;/h2&gt;\n&lt;p&gt;В YTsaurus существуют два формата чанков: построчный и поколоночный.&lt;br /&gt;\nФормат чанка задает параметр &lt;code&gt;optimize_for&lt;/code&gt;. Для построчного формата &lt;code&gt;optimize_for&lt;/code&gt; имеет значение &lt;code&gt;lookup&lt;/code&gt;, для поколоночного — &lt;code&gt;scan&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"lines\"&gt;&lt;a href=\"ru/user-guide/storage/chunks.html#lines\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Построчный формат: optimize_for=lookup&lt;/span&gt;&lt;/a&gt;Построчный формат: optimize_for=lookup&lt;/h3&gt;\n&lt;p&gt;В построчном формате каждая строка целиком хранится в одном блоке.&lt;br /&gt;\nПострочный формат подходит для &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;динамических таблиц&lt;/a&gt;, из которых данные выбирают по ключу.&lt;/p&gt;\n&lt;h3 id=\"columns\"&gt;&lt;a href=\"ru/user-guide/storage/chunks.html#columns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поколоночный формат: optimize_for=scan&lt;/span&gt;&lt;/a&gt;Поколоночный формат: optimize_for=scan&lt;/h3&gt;\n&lt;p&gt;Поколоночный формат не хранит информацию о типе рядом с каждым значением и использует легковесные техники сжатия колонок.&lt;br /&gt;\nПо умолчанию данные каждой колонки, указанной в схеме, попадают в отдельную последовательность блоков внутри чанка. Это ускоряет чтение небольшого числа колонок.&lt;/p&gt;\n&lt;p&gt;Если требуется прочитать одну строку или небольшой диапазон строк по ключу, потребуется совершить столько обращений к диску, сколько в таблице колонок. Для минимизации обращений к диску можно использовать атрибут &lt;code&gt;group&lt;/code&gt; в описании колонок в схеме, который позволит хранить связанные данные в одном блоке. Подробнее можно прочитать в разделе &lt;a href=\"user-guide/storage/static-schema.html\"&gt;Схема данных&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование поколоночного формата без схемы бессмысленно.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"format-example\"&gt;&lt;a href=\"ru/user-guide/storage/chunks.html#format-example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример указания формата&lt;/span&gt;&lt;/a&gt;Пример указания формата&lt;/h3&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //tmp/table/@optimize_for scan\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"113\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-113\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-113\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-113.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Установка атрибута влияет только на будущие чанки и не конвертирует таблицы (аналогично установка атрибутов &lt;code&gt;@erasure_codec&lt;/code&gt; и &lt;code&gt;@compression_codec&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Чтобы конвертировать уже записанные данные в новый формат, выполните операцию Merge:&lt;/p&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt merge --mode ordered --src //tmp/table --dst //tmp/table --spec &lt;span class=\"hljs-string\"&gt;'{force_transform = %true}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"123\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-123\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-123\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-123.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Для &lt;strong&gt;динамической таблицы&lt;/strong&gt; аналогичную задачу решает forced compaction. Перед его использованием обязательно изучите статью &lt;a href=\"user-guide/dynamic-tables/compaction.html#forced_compaction\"&gt;Фоновая компактификация&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Пример запуска операции через CLI:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //tmp/table/@forced_compaction_revision 1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"130\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-130\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-130\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-130.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Также в случае поколоночного формата у &lt;strong&gt;динамической таблицы&lt;/strong&gt; стоит обратить внимание на атрибут &lt;code&gt;group&lt;/code&gt; на схеме колонки. Если из таблицы часто лукапятся строчки без фильтрации колонок, то имеет смысл выставить на все колонки одну и ту же группу. Про группы подробнее в документации про &lt;a href=\"user-guide/storage/static-schema.html#schema_overview\"&gt;схему таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"attributes\"&gt;&lt;a href=\"ru/user-guide/storage/chunks.html#attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Владельцы чанков&lt;/span&gt;&lt;/a&gt;Владельцы чанков&lt;/h2&gt;\n&lt;p&gt;Узлы Кипариса, состоящие из чанков, — таблицы, файлы и журналы, называются владельцами чанков.&lt;br /&gt;\nМножество чанков, принадлежащих владельцам чанков, организовано в виде древовидной структуры данных. Листьями структуры являются чанки, а промежуточными вершинами — чанк-листы (&lt;code&gt;chunk_list&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Помимо атрибутов, присущих всем узлам Кипариса, владельцы чанков имеют следующие дополнительные атрибуты:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Имя&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk_list_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Guid&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор корневого списка чанков.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk_ids&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;Guid&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список идентификаторов всех чанков.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Количество чанков.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;compression_statistics&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;CompressionStatistics&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Статистика по типам использованных &lt;a href=\"user-guide/storage/compression.html\"&gt;кодеков сжатия&lt;/a&gt; и размерам данных.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;erasure_statistics&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ErasureStatistics&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Статистика по типам использованных &lt;a href=\"user-guide/storage/replication.html\"&gt;erasure-кодеков&lt;/a&gt; и размерам данных.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;optimize_for_statistics&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;OptimizeForStatistics&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Статистика по типам использованных &lt;a href=\"ru/user-guide/storage/chunks.html#optimize_for\"&gt;типов чанков&lt;/a&gt; (&lt;code&gt;optimize_for&lt;/code&gt;).&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;multicell_statistics&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;MulticellStatistics&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Статистика распределения чанков по мастер-серверам.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;uncompressed_data_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Общий несжатый объем данных всех чанков (без учета репликации и erasure-кодирования).&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;compressed_data_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Общий сжатый объем данных всех чанков (без учета репликации и erasure-кодирования).&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;compression_ratio&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;double&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Коэффициент сжатия, отношение сжатого объема к несжатому.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;update_mode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Способ изменения данных под транзакцией: &lt;code&gt;none&lt;/code&gt;, &lt;code&gt;append&lt;/code&gt; или &lt;code&gt;overwrite&lt;/code&gt;; для узлов вне транзакции это &lt;code&gt;none&lt;/code&gt;.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;replication_factor&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;integer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Коэффициент &lt;a href=\"user-guide/storage/replication.html\"&gt;репликации&lt;/a&gt; (для erasure-кодирования равен 1).&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;compression_codec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя &lt;a href=\"user-guide/storage/compression.html\"&gt;кодека сжатия&lt;/a&gt;.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;erasure_codec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя &lt;a href=\"user-guide/storage/replication.html\"&gt;erasure-кодека&lt;/a&gt;.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;vital&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Являются ли чанки этого узла &lt;a href=\"ru/user-guide/storage/chunks.html#vitality\"&gt;витальными&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;media&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Media&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Коэффициенты репликации и другие настройки &lt;a href=\"user-guide/storage/media.html\"&gt;медиумов&lt;/a&gt;.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;primary_medium&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/media.html#primary\"&gt;Первичный медиум&lt;/a&gt;.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"vitality\"&gt;&lt;a href=\"ru/user-guide/storage/chunks.html#vitality\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Витальность данных&lt;/span&gt;&lt;/a&gt;Витальность данных&lt;/h2&gt;\n&lt;p&gt;Система YTsaurus разделяет чанки на два вида: витальные и невитальные. По умолчанию данные в системе витальные (атрибут &lt;code&gt;vital&lt;/code&gt; равен &lt;code&gt;true&lt;/code&gt;) и их потеря — серьезный инцидент. Потеря данных может произойти из-за выпадения узлов кластера.&lt;/p&gt;\n&lt;p&gt;Невитальные данные - это те данные, потеря которых не является критичной. Настройки кластеров YTsaurus таковы, что недоступность невитальных чанков не вызывает срабатывания мониторингов и вмешательства эксплуатации. Типичными примерами невитальных данных являются промежуточные результаты операций: планировщик сам заметит потери и выполнит пересчет. Для невитальных данных атрибут &lt;code&gt;vital&lt;/code&gt; равен &lt;code&gt;false&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система не считает витальными чанки, записанные без erasure-кодирования и имеющие единичный коэффициент репликации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Данные могут быть утрачены при выпадении узлов кластера. Чтобы этого избежать, по умолчанию данные в YTsaurus хранятся в трёх копиях.&lt;br /&gt;\nОднако, при выпадении нескольких хостов система может потерять доступ ко всем копиям. Если при утрате витальных данных были прерваны вычисления, перезапустите их.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/storage/chunks.md","sourcePath":"ru/user-guide/storage/chunks.md"},"headings":[{"title":"Общие сведения","href":"ru/user-guide/storage/chunks.html#common","level":2,"items":[{"title":"Размер чанков","href":"ru/user-guide/storage/chunks.html#chunk-size","level":3},{"title":"Чтение данных","href":"ru/user-guide/storage/chunks.html#reading","level":3},{"title":"Запись данных","href":"ru/user-guide/storage/chunks.html#writing","level":3}]},{"title":"Формат чанка","href":"ru/user-guide/storage/chunks.html#optimize_for","level":2,"items":[{"title":"Построчный формат: optimize_for=lookup","href":"ru/user-guide/storage/chunks.html#lines","level":3},{"title":"Поколоночный формат: optimize_for=scan","href":"ru/user-guide/storage/chunks.html#columns","level":3},{"title":"Пример указания формата","href":"ru/user-guide/storage/chunks.html#format-example","level":3}]},{"title":"Владельцы чанков","href":"ru/user-guide/storage/chunks.html#attributes","level":2},{"title":"Витальность данных","href":"ru/user-guide/storage/chunks.html#vitality","level":2}],"title":"Чанки"},"router":{"pathname":"ru/user-guide/storage/chunks","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
