            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе собрана информация о системе контроля доступа к таблицам и другим узлам &lt;a href=\"user-guide/storage/cypress.html\"&gt;Кипариса&lt;/a&gt; (пользователям, группам, аккаунтам, чанкам, транзакциям и т. д.).&lt;/p&gt;\n&lt;p&gt;Любой пользовательский запрос проходит через прокси, которые &lt;a href=\"https://ru.wikipedia.org/wiki/Authentication\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;&lt;strong&gt;аутентифицируют&lt;/strong&gt;&lt;/a&gt; пользователя, то есть проверяют его подлинность. На основе содержащегося в запросе токена, полученного с помощью протокола &lt;a href=\"https://ru.wikipedia.org/wiki/OAuth\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;OAuth&lt;/a&gt;, прокси определяет имя пользователя, инициировавшего запрос. Если токен в запросе не указан, то считается, что запрос задан от пользователя &lt;code&gt;guest&lt;/code&gt;. После прохождения аутентификации, на последующих этапах обработки пользовательского запроса токен не используется. Подробнее о токенах можно прочитать в разделе &lt;a href=\"user-guide/storage/auth.html\"&gt;Аутентификация&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Авторизацией&lt;/strong&gt; (выдачей разрешений) занимается мастер-сервер Кипариса. Решение о предоставлении или отказе в доступе зависит от:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Вида доступа (чтение, запись и т.д.);&lt;/li&gt;\n&lt;li&gt;Пользователя, инициировавшего запрос;&lt;/li&gt;\n&lt;li&gt;Объекта, к которому запрашивается доступ.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;В случае отказа в праве доступа формируется сообщение в котором указаны детали: имя пользователя, которому отказано в доступе, объект, к которому запрашивался доступ, и тип доступа.&lt;/p&gt;\n&lt;p&gt;Если от прокси приходит запрос, помеченный именем несуществующего пользователя, то мастер-сервер вернёт ошибку &lt;code&gt;No such user&lt;/code&gt;. Такая ситуация потенциально возможна, поскольку получение токена и регистрация пользователя в системе — два действия, выполняемые на различных сервисах (получение токена происходит с помощью сервиса OAuth, а регистрация — на мастер-сервере YTsaurus).&lt;/p&gt;\n&lt;p&gt;В системе YTsaurus поддерживаются списки &lt;strong&gt;пользователей&lt;/strong&gt; и &lt;strong&gt;групп&lt;/strong&gt;. Обобщенно пользователи и группы называются &lt;strong&gt;субъектами&lt;/strong&gt;. Членами групп могут быть произвольные субъекты: как пользователи, так и другие группы. Система гарантирует, что отношение «вхождение в группу» не содержит циклов. При авторизации решения принимаются на основе транзитивного замыкания. Таким образом, пользователь &lt;code&gt;A&lt;/code&gt; может быть членом группы &lt;code&gt;C&lt;/code&gt; как напрямую (входить непосредственно в состав группы &lt;code&gt;С&lt;/code&gt;), так и косвенно (&lt;code&gt;A&lt;/code&gt; входит в группу &lt;code&gt;B&lt;/code&gt;, а группа &lt;code&gt;B&lt;/code&gt; — в группу &lt;code&gt;C&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;У каждого объекта в системе YTsaurus существует список контроля доступа (&lt;strong&gt;Access Control List&lt;/strong&gt; или &lt;strong&gt;ACL&lt;/strong&gt;). Данный список хранится в атрибуте &lt;code&gt;@acl&lt;/code&gt; объекта и состоит из отдельных записей (&lt;strong&gt;Access Control Entry&lt;/strong&gt; или &lt;strong&gt;ACE&lt;/strong&gt;), где каждая запись содержит перечень субъектов, тип доступа и ряд других параметров, приведённых в таблице раздела &lt;a href=\"user-guide/storage/access-control.html#authorization\"&gt;Авторизация&lt;/a&gt;. Подробнее читайте в секции &lt;a href=\"ru/user-guide/storage/access-control.html#acl_usage\"&gt;Как правильно использовать ACL&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"users_groups\"&gt;&lt;a href=\"ru/user-guide/storage/access-control.html#users_groups\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пользователи, группы&lt;/span&gt;&lt;/a&gt;Пользователи, группы&lt;/h2&gt;\n&lt;p&gt;В Кипарисе хранятся:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Список всех зарегистрированных пользователей. Список хранится по адресу &lt;code&gt;//sys/users&lt;/code&gt; и представляет собой узел типа &lt;code&gt;user_map&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Список всех зарегистрированных групп. Хранится по адресу &lt;code&gt;//sys/groups&lt;/code&gt; и представляет собой узел типа &lt;code&gt;group_map&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Каждый пользователь и группа определяется уникальным именем. При этом пользователи и группы располагаются в одном пространстве имён, то есть имена пользователей и групп не могут совпадать.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kak-posmotret-spiski-polzovatelej-i-grupp\"&gt;&lt;a href=\"ru/user-guide/storage/access-control.html#kak-posmotret-spiski-polzovatelej-i-grupp\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как посмотреть списки пользователей и групп&lt;/span&gt;&lt;/a&gt;Как посмотреть списки пользователей и групп&lt;/h4&gt;\n&lt;div class=\"yfm-tabs\" data-diplodoc-group=\"defaultTabsGroup-41aus1jn\" data-diplodoc-variant=\"regular\"&gt;\n&lt;div class=\"yfm-tab-list\" role=\"tablist\"&gt;\n&lt;div data-diplodoc-id=\"через-веб-интерфейс\" data-diplodoc-key=\"%d0%a7%d0%b5%d1%80%d0%b5%d0%b7%20%d0%b2%d0%b5%d0%b1-%d0%b8%d0%bd%d1%82%d0%b5%d1%80%d1%84%d0%b5%d0%b9%d1%81\" class=\"yfm-tab yfm-tab-group active\" role=\"tab\" tabindex=\"0\" data-diplodoc-is-active=\"true\"&gt;Через веб-интерфейс&lt;/div&gt;\n&lt;div data-diplodoc-id=\"через-cli\" data-diplodoc-key=\"%d0%a7%d0%b5%d1%80%d0%b5%d0%b7%20cli\" class=\"yfm-tab yfm-tab-group\" role=\"tab\" tabindex=\"-1\" data-diplodoc-is-active=\"false\"&gt;Через CLI&lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"or1d84im\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"Через веб-интерфейс\"&gt;\n&lt;ul&gt;\n&lt;li&gt;Чтобы просмотреть список пользователей, на боковой панели перейдите в раздел &lt;strong&gt;Users&lt;/strong&gt; или введите в адресной строке браузера: &lt;code&gt;https://&amp;lt;host-root&amp;gt;/&amp;lt;cluster-name&amp;gt;/users&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Чтобы просмотреть список групп, перейдите в раздел &lt;strong&gt;Groups&lt;/strong&gt; или введите в адресной строке браузера: &lt;code&gt;https://&amp;lt;host-root&amp;gt;/&amp;lt;cluster-name&amp;gt;/groups&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;\n&lt;div id=\"7kqkl77x\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"Через CLI\"&gt;\n&lt;ul&gt;\n&lt;li&gt;Получить список пользователей:\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt --proxy &amp;lt;cluster-name&amp;gt; list //sys/users\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"98\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-98\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-98\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-98.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;Получить список групп:\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt --proxy &amp;lt;cluster-name&amp;gt; list //sys/groups\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"104\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-104\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-104\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-104.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Узлы &lt;code&gt;//sys/users&lt;/code&gt; и &lt;code&gt;//sys/groups&lt;/code&gt; не являются таблицами, поэтому списки пользователей и групп нельзя получить с помощью &lt;code&gt;SELECT&lt;/code&gt; запроса.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Пользователи имеют тип системного объекта &lt;code&gt;user&lt;/code&gt;. Группы имеют тип объекта &lt;code&gt;group&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"kak-poluchit-informaciyu-o-polzovatele-ili-gruppe\"&gt;&lt;a href=\"ru/user-guide/storage/access-control.html#kak-poluchit-informaciyu-o-polzovatele-ili-gruppe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как получить информацию о пользователе или группе&lt;/span&gt;&lt;/a&gt;Как получить информацию о пользователе или группе&lt;/h4&gt;\n&lt;div class=\"yfm-tabs\" data-diplodoc-group=\"defaultTabsGroup-ce4ywma2\" data-diplodoc-variant=\"regular\"&gt;\n&lt;div class=\"yfm-tab-list\" role=\"tablist\"&gt;\n&lt;div data-diplodoc-id=\"через-веб-интерфейс-1\" data-diplodoc-key=\"%d0%a7%d0%b5%d1%80%d0%b5%d0%b7%20%d0%b2%d0%b5%d0%b1-%d0%b8%d0%bd%d1%82%d0%b5%d1%80%d1%84%d0%b5%d0%b9%d1%81\" class=\"yfm-tab yfm-tab-group active\" role=\"tab\" tabindex=\"0\" data-diplodoc-is-active=\"true\"&gt;Через веб-интерфейс&lt;/div&gt;\n&lt;div data-diplodoc-id=\"через-cli-1\" data-diplodoc-key=\"%d0%a7%d0%b5%d1%80%d0%b5%d0%b7%20cli\" class=\"yfm-tab yfm-tab-group\" role=\"tab\" tabindex=\"-1\" data-diplodoc-is-active=\"false\"&gt;Через CLI&lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"49nvpcy4\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"Через веб-интерфейс\"&gt;\n&lt;p&gt;Перейдите на страницу пользователя или группы и нажмите значок &lt;img src=\"images/attrs-icon.png\" alt=\"\" width=\"20\" height=\"20\" /&gt; справа.&lt;/p&gt;\n&lt;/div&gt;\n&lt;div id=\"xt755lum\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"Через CLI\"&gt;\n&lt;p&gt;Чтобы получить сведения о конкретном пользователе, используйте команду &lt;code&gt;yt --proxy &amp;lt;cluster-name&amp;gt; get //sys/users/&amp;lt;user-name&amp;gt;/@&amp;lt;attr-name&amp;gt;&lt;/code&gt;. Например:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$ yt --proxy &amp;lt;cluster-name&amp;gt; get //sys/users/vasya/@type\n\"user\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"143\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-143\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-143\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-143.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Посмотреть список всех доступных атрибутов у пользователя можно командой:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt --proxy &amp;lt;cluster-name&amp;gt; get //sys/users/vasya/@\n{\n  &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"ffffffff-fffffffe-101f5-1407420e\"&lt;/span&gt;;\n  &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"user\"&lt;/span&gt;;\n  &lt;span class=\"hljs-string\"&gt;\"builtin\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n  ...\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"147\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-147\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-147\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-147.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Аналогично, чтобы получить сведения о конкретной группе, используйте команду &lt;code&gt;yt --proxy &amp;lt;cluster-name&amp;gt; get //sys/groups/&amp;lt;group-name&amp;gt;/@&amp;lt;attr-name&amp;gt;&lt;/code&gt;. Например:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt --proxy &amp;lt;cluster-name&amp;gt; get //sys/groups/admins/@&lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt;\n&lt;span class=\"hljs-string\"&gt;\"group\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"151\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-151\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-151\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-151.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;h2 id=\"system_subjects\"&gt;&lt;a href=\"ru/user-guide/storage/access-control.html#system_subjects\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Системные субъекты&lt;/span&gt;&lt;/a&gt;Системные субъекты&lt;/h2&gt;\n&lt;p&gt;В системе YTsaurus присутствует набор субъектов, выполняющих системные функции. Таких субъектов нельзя удалить. К системным субъектам относятся:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Пользователи &lt;code&gt;guest&lt;/code&gt;, &lt;code&gt;root&lt;/code&gt;, &lt;code&gt;scheduler&lt;/code&gt; и &lt;code&gt;job&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Группы &lt;code&gt;everyone&lt;/code&gt;, &lt;code&gt;users&lt;/code&gt;, &lt;code&gt;superusers&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"subject_attributes\"&gt;&lt;a href=\"ru/user-guide/storage/access-control.html#subject_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атрибуты субъектов&lt;/span&gt;&lt;/a&gt;Атрибуты субъектов&lt;/h2&gt;\n&lt;p&gt;В таблице ниже представлен список атрибутов, которые имеются у всех субъектов.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Атрибут&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя субъекта (непустая строка)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;member_of&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список имен групп, которым непосредственно принадлежит данный субъект&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;member_of_closure&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список имен групп, которым принадлежит субъект (прямо или косвенно)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;aliases&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список имен, которые могут использоваться в ACL в качестве ссылки на данный субъект&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"user_attributes\"&gt;&lt;a href=\"ru/user-guide/storage/access-control.html#user_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атрибуты пользователей&lt;/span&gt;&lt;/a&gt;Атрибуты пользователей&lt;/h2&gt;\n&lt;p&gt;Помимо атрибутов, присущих всем субъектам, пользователи имеют атрибуты, представленные в таблице ниже.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Атрибут&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;banned&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Заблокирован ли пользователь&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;access_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;DateTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время последнего запроса от пользователя.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;access_counter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;integer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Общее число запросов, заданных пользователем.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;request_rate&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;double&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Количество запросов в секунду от пользователя.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;request_rate_limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;double&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ограничение на количество запросов в секунду от пользователя. По умолчанию 100.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;request_queue_size_limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;double&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Длина очереди запросов. По умолчанию 100.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;usable_accounts&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список аккаунтов, которые пользователю разрешено использовать.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"group_attributes\"&gt;&lt;a href=\"ru/user-guide/storage/access-control.html#group_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атрибуты групп&lt;/span&gt;&lt;/a&gt;Атрибуты групп&lt;/h2&gt;\n&lt;p&gt;Помимо атрибутов, присущих всем субъектам, группы имеют атрибуты, представленные в таблице ниже.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Атрибут&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;members&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список имен членов группы (пользователей и других групп).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"group_control\"&gt;&lt;a href=\"ru/user-guide/storage/access-control.html#group_control\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Управление группами&lt;/span&gt;&lt;/a&gt;Управление группами&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;На больших кластерах управление группами напрямую доступно только администраторам YTsaurus.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы создать новую группу, используется команда &lt;code&gt;create&lt;/code&gt;. При создании не нужно указывать путь объекта, но требуется указать атрибут &lt;code&gt;name&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt create group --attributes &lt;span class=\"hljs-string\"&gt;'{name=my_group}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"413\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-413\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-413\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-413.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Удаляются группы командой &lt;code&gt;remove&lt;/code&gt;. При удалении группа автоматически удаляется из всех ACL, где она участвовала.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt remove //sys/groups/my_group\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"417\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-417\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-417\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-417.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"authorization\"&gt;&lt;a href=\"ru/user-guide/storage/access-control.html#authorization\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Авторизация&lt;/span&gt;&lt;/a&gt;Авторизация&lt;/h2&gt;\n&lt;p&gt;Модуль авторизации на мастер-сервере решает следующую задачу: разрешить ли пользователю &lt;code&gt;U&lt;/code&gt; доступ типа &lt;code&gt;P&lt;/code&gt; для объекта &lt;code&gt;O&lt;/code&gt;? Вариантов ответа может быть два: разрешить или не разрешать. Разберем все три компонента (U, P и O) по-отдельности.&lt;/p&gt;\n&lt;p&gt;В качестве &lt;code&gt;U&lt;/code&gt; может выступать любой пользователь системы. Отметим, что &lt;code&gt;U&lt;/code&gt; не может быть группой, хотя членство в группах учитывается при принятии решения. Если &lt;code&gt;U&lt;/code&gt; — это &lt;code&gt;root&lt;/code&gt;, то запрос доступа автоматически удовлетворяется.&lt;/p&gt;\n&lt;p&gt;Тип доступа &lt;code&gt;P&lt;/code&gt; иначе также называется &lt;strong&gt;правом&lt;/strong&gt; (permission). Права, которые поддерживаются системой YTsaurus представлены в таблице.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Право&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;read&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Обозначает чтение значения или получение информации об объекте либо его атрибутах.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;write&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Обозначает изменение состояния объекта или его атрибутов.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;use&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Применяется к аккаунтам, пулам и бандлам и означает использование (то есть возможность вписать новые объекты в квоту данного аккаунта, запустить операции в пуле или переложить динамическую таблицу в бандл).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;administer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Обозначает изменение дескриптора доступа объекта.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;create&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Применяется только к схемам и обозначает создание объектов данного типа.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;remove&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Обозначает удаление объекта.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;mount&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Обозначает монтирование, размонтирование, перемонтирование и решардирование динамической таблицы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;manage&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Применяется только к операциям (не к узлам Кипариса) и обозначает управление состоянием этой операции или её джобов.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Объект &lt;code&gt;O&lt;/code&gt; означает произвольный объект системы: узел Кипариса, пользователя, группу, аккаунт, чанк, транзакцию и так далее.&lt;/p&gt;\n&lt;p&gt;Чтобы принять решение, система неявно строит &lt;strong&gt;эффективный список управления доступом&lt;/strong&gt; (effective ACL) для объекта &lt;code&gt;O&lt;/code&gt;. Эффективный список управления доступом — это объединение указанного на узле списка управления доступом и списков управления доступами, унаследованных от родителей. Любой &lt;strong&gt;список управления доступом&lt;/strong&gt; (ACL) представляет собой список &lt;strong&gt;записей управления доступом&lt;/strong&gt; (ACE). Порядок записей в этом списке не играет роли. Объект может наследовать свой ACL, за это отвечает атрибут &lt;code&gt;inherit_acl = %true&lt;/code&gt;. При наследовании для каждой ACE определяется режим наследования (ключ &lt;code&gt;inheritance_mode&lt;/code&gt; в записи &lt;code&gt;acl&lt;/code&gt;). Последний может быть равен &lt;code&gt;object_only&lt;/code&gt;, &lt;code&gt;object_and_descendants&lt;/code&gt;, &lt;code&gt;descendants_only&lt;/code&gt; и &lt;code&gt;immediate_descendants_only&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Значение &lt;code&gt;object_only&lt;/code&gt; означает, что данная запись влияет только на сам объект. При значении &lt;code&gt;object_and_descendants&lt;/code&gt; — на объект и всех его потомков, включая непрямых. При значении &lt;code&gt;descendants_only&lt;/code&gt; — только на потомков, включая непрямых. При значении &lt;code&gt;immediate_descendants_only&lt;/code&gt; — только на прямых потомков (сыновей). Каждая запись имеет структуру представленную в таблице.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Атрибут&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;action&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;SecurityAction&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Либо &lt;code&gt;allow&lt;/code&gt; (разрешающая запись), либо &lt;code&gt;deny&lt;/code&gt; (запрещающая запись).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;subjects&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список имен субъектов, на которые распространяется запись.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;permissions&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;Permission&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список прав доступа, на которые распространяется действие, указанное в атрибуте &lt;code&gt;action&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;inheritance_mode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;InheritanceMode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Режим наследования данной ACE, по умолчанию &lt;code&gt;object_and_descendants&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Как только эффективный список построен, решение о предоставлении или непредоставлении доступа принимается по следующей схеме:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Если в списке есть хотя бы одна разрешающая запись для &lt;code&gt;U&lt;/code&gt; и &lt;code&gt;P&lt;/code&gt; и нет ни одной запрещающей записи для &lt;code&gt;U&lt;/code&gt; и &lt;code&gt;P&lt;/code&gt;, то доступ выдается.&lt;/li&gt;\n&lt;li&gt;Иначе доступ запрещается.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;«Запись для &lt;code&gt;U&lt;/code&gt; и &lt;code&gt;P&lt;/code&gt;» означает, что &lt;code&gt;P&lt;/code&gt; упомянуто в списке &lt;code&gt;permissions&lt;/code&gt;, а пользователь &lt;code&gt;U&lt;/code&gt; (либо хотя бы одна группа, в которой он числится прямо или косвенно) — в списке &lt;code&gt;subjects&lt;/code&gt;. Из представленного описания в частности следует, что если эффективный список пуст, то доступ будет запрещен.&lt;/p&gt;\n&lt;h2 id=\"owner\"&gt;&lt;a href=\"ru/user-guide/storage/access-control.html#owner\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Владелец объекта и пользователь owner&lt;/span&gt;&lt;/a&gt;Владелец объекта и пользователь owner&lt;/h2&gt;\n&lt;p&gt;При создании объекта пользователем &lt;code&gt;U&lt;/code&gt;, он также становится владельцем данного объекта, что находит отражение в атрибуте &lt;code&gt;owner&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Изменить владельца может лишь суперпользователь (член группы &lt;code&gt;superusers&lt;/code&gt;).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Также в системе есть специальный фиктивный пользователь &lt;code&gt;owner&lt;/code&gt;. Им невозможно аутентифицироваться, однако на него можно ссылаться в ACL в качестве субъекта. При этом в момент проверки прав &lt;code&gt;owner&lt;/code&gt; заменяется на фактического владельца объекта. Это позволяет, например, описать ограничение «в данном каталоге удалять узлы могут только те, кто их создал» таким ACE:&lt;code&gt;{action=allow; permissions=[remove]; subjects=[owner]; inheritance_mode = descendants_only}&lt;/code&gt;, при этом важно не забыть отключить наследование прав, указав &lt;code&gt;inherit_acl = %false&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"upravlenie-operaciyami\"&gt;&lt;a href=\"ru/user-guide/storage/access-control.html#upravlenie-operaciyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Управление операциями&lt;/span&gt;&lt;/a&gt;Управление операциями&lt;/h2&gt;\n&lt;p&gt;Любая операция имеет связанный с ней ACL аналогично узлам Кипариса. Данный ACL можно получить из атрибута по пути &lt;code&gt;runtime_parameters/acl&lt;/code&gt; операции.&lt;/p&gt;\n&lt;p&gt;Права доступа имеют следующую семантику:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;право &lt;code&gt;read&lt;/code&gt; отвечает за чтение live preview выходных и промежуточных данных операции, а также «артефактов» её джобов: stderr, fail context, входных данных отдельных джобов;&lt;/li&gt;\n&lt;li&gt;право &lt;code&gt;manage&lt;/code&gt; отвечает управлению операцией, влияющему на её состояние, то есть действиям &lt;code&gt;Abort&lt;/code&gt;, &lt;code&gt;Complete&lt;/code&gt;, &lt;code&gt;Suspend&lt;/code&gt; и &lt;code&gt;Resume&lt;/code&gt; (кнопки для них находятся в правом верхнем углу страницы операции в веб-интерфейсе); а также действиям с джобами: &lt;code&gt;Abort&lt;/code&gt;, &lt;code&gt;Abandon&lt;/code&gt; и &lt;code&gt;Send signal&lt;/code&gt; (кнопки для них находятся в выпадающем меню в правой части страницы &lt;code&gt;Jobs&lt;/code&gt; в веб-интерфейсе YTsaurus);&lt;/li&gt;\n&lt;li&gt;использование &lt;a href=\"user-guide/problems/jobshell-and-slowjobs.html\"&gt;Job Shell&lt;/a&gt; требует одновременно прав &lt;code&gt;read&lt;/code&gt; и &lt;code&gt;manage&lt;/code&gt; , так как наличие доступа через консоль позволяет читать или произвольным образом менять состояние джоба.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Существует возможность указать ACL для операции при её запуске. Для этого в спецификации операции необходимо указать секцию &lt;code&gt;\"acl\"&lt;/code&gt; следующего содержания:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.run_map(..., spec={&lt;span class=\"hljs-string\"&gt;\"acl\"&lt;/span&gt;: [{\n &lt;span class=\"hljs-string\"&gt;\"action\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"allow\"&lt;/span&gt;,\n &lt;span class=\"hljs-string\"&gt;\"subjects\"&lt;/span&gt;: [&lt;span class=\"hljs-string\"&gt;\"u1\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"u2\"&lt;/span&gt;],\n &lt;span class=\"hljs-string\"&gt;\"permissions\"&lt;/span&gt;: [&lt;span class=\"hljs-string\"&gt;\"read\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"manage\"&lt;/span&gt;],\n}]})\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"644\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-644\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-644\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-644.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Пользователь, запустивший операцию, и администраторы по умолчанию добавляются в результирующий ACL операции.&lt;/p&gt;\n&lt;h2 id=\"acl_usage\"&gt;&lt;a href=\"ru/user-guide/storage/access-control.html#acl_usage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как правильно использовать ACL&lt;/span&gt;&lt;/a&gt;Как правильно использовать ACL&lt;/h2&gt;\n&lt;p&gt;Представленная выше схема управления доступом весьма общая и гибкая. При ее использовании важно стараться ставить роли на максимально высоком уровне с наследованием один раз, а не управлять доступом на уровне отдельных таблиц. Наследование ACL поощряет группировать данные с общими правилами доступа в каталоги.&lt;/p&gt;\n&lt;p&gt;В нормальном режиме следует иметь исключительно разрешающие записи. Запрещающие записи можно выставлять для быстрого решения проблемы, если оказалось, что доступ чрезмерно расширен, затем следует проводить ревизию ACL, и решать проблему, корректируя разрешающие записи.&lt;/p&gt;\n&lt;p&gt;Не рекомендуется упоминать в ACL конкретных пользователей. При выдаче доступа вместо отдельных пользователей рекомендуется использовать группы с однотипными потребностями.&lt;/p&gt;\n&lt;p&gt;Наследование ACL следует использовать везде, кроме мест, где характер доступа радикально меняется. Например, на корне Кипариса по умолчанию установлена запись, разрешающая всем пользователям (кроме &lt;code&gt;guest&lt;/code&gt;) выполнять чтение. В тех местах Кипариса, где хранится чувствительная с точки зрения безопасности информация, например списки токенов, доступ переопределяется с нуля.&lt;/p&gt;\n&lt;h2 id=\"check_acl\"&gt;&lt;a href=\"ru/user-guide/storage/access-control.html#check_acl\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Проверка ACL&lt;/span&gt;&lt;/a&gt;Проверка ACL&lt;/h2&gt;\n&lt;p&gt;Проверить наличие у пользователя определённого права на определённый узел Кипариса можно командой &lt;code&gt;check-permission&lt;/code&gt;. Пример запуска команды:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt check-permission yql write //tmp\n{\n  &lt;span class=\"hljs-string\"&gt;\"action\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"allow\"&lt;/span&gt;;\n  &lt;span class=\"hljs-string\"&gt;\"object_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"1-3-411012f-1888ce1f\"&lt;/span&gt;;\n  &lt;span class=\"hljs-string\"&gt;\"object_name\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"node //tmp\"&lt;/span&gt;;\n  &lt;span class=\"hljs-string\"&gt;\"subject_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"c4-8aaa-41101f6-bec6113b\"&lt;/span&gt;;\n  &lt;span class=\"hljs-string\"&gt;\"subject_name\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"YTsaurus\"&lt;/span&gt;;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"669\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-669\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-669\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-669.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"request_access\"&gt;&lt;a href=\"ru/user-guide/storage/access-control.html#request_access\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запрос доступа&lt;/span&gt;&lt;/a&gt;Запрос доступа&lt;/h2&gt;\n&lt;p&gt;Для получения доступа к существующему аккаунту или директории в YTsaurus обратитесь к администратору системы.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/storage/access-control.md","sourcePath":"ru/user-guide/storage/access-control.md"},"headings":[{"title":"Пользователи, группы","href":"ru/user-guide/storage/access-control.html#users_groups","level":2},{"title":"Системные субъекты","href":"ru/user-guide/storage/access-control.html#system_subjects","level":2},{"title":"Атрибуты субъектов","href":"ru/user-guide/storage/access-control.html#subject_attributes","level":2},{"title":"Атрибуты пользователей","href":"ru/user-guide/storage/access-control.html#user_attributes","level":2},{"title":"Атрибуты групп","href":"ru/user-guide/storage/access-control.html#group_attributes","level":2},{"title":"Управление группами","href":"ru/user-guide/storage/access-control.html#group_control","level":2},{"title":"Авторизация","href":"ru/user-guide/storage/access-control.html#authorization","level":2},{"title":"Владелец объекта и пользователь owner","href":"ru/user-guide/storage/access-control.html#owner","level":2},{"title":"Управление операциями","href":"ru/user-guide/storage/access-control.html#upravlenie-operaciyami","level":2},{"title":"Как правильно использовать ACL","href":"ru/user-guide/storage/access-control.html#acl_usage","level":2},{"title":"Проверка ACL","href":"ru/user-guide/storage/access-control.html#check_acl","level":2},{"title":"Запрос доступа","href":"ru/user-guide/storage/access-control.html#request_access","level":2}],"title":"Общие сведения"},"router":{"pathname":"ru/user-guide/storage/access-control","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
