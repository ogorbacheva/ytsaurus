        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"schema_overview\"&gt;&lt;a href=\"ru/user-guide/storage/static-schema.html#schema_overview\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общее описание&lt;/span&gt;&lt;/a&gt;Общее описание&lt;/h2&gt;\n&lt;p&gt;Схема таблицы описывает известные колонки и их типы.&lt;/p&gt;\n&lt;p&gt;Схему можно прочитать из системного атрибута &lt;code&gt;@schema&lt;/code&gt;, который есть у каждой таблицы.&lt;br /&gt;\nЧтобы задать схему, установите этот атрибут при создании таблицы.&lt;br /&gt;\nЧтобы изменить схему у существующей таблицы используйте команду &lt;code&gt;alter_table&lt;/code&gt;.&lt;br /&gt;\nПодробнее можно прочитать в разделе &lt;a href=\"ru/user-guide/storage/static-schema.html#examples\"&gt;Примеры работы со схемой&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Тип &lt;code&gt;TableSchema&lt;/code&gt; — это список элементов &lt;code&gt;ColumnSchema&lt;/code&gt;.&lt;br /&gt;\nКаждый такой элемент — словарь с фиксированной структурой:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Имя&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;Обязательный&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя колонки.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип элементов колонки.&lt;/td&gt;\n&lt;td&gt;Да, если не указан &lt;code&gt;type_v3&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type_v3&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;any&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Альтернативное представление типа. Это поле позволяет задавать колонки со &lt;a href=\"user-guide/storage/data-types.html#schema\"&gt;сложными типами&lt;/a&gt;.&lt;/td&gt;\n&lt;td&gt;Да, если не указан &lt;code&gt;type&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;sort_order&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Порядок сортировки колонки, допускается либо отсутствующее значение, либо значение &lt;code&gt;ascending&lt;/code&gt;. Если значение выставлено, то колонка является ключевой. (Примечание: порядок сортировки &lt;code&gt;descending&lt;/code&gt; сейчас находится в альфа-версии, может быть недоступен на кластерах и не рекомендуется для использования пользователями)&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;lock&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя блокировки. Только для неключевых колонок.&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;expression&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Выражение, определяющее значение поля вычислимой колонки. Только для ключевых колонок. Подробнее можно прочитать в разделе &lt;a href=\"user-guide/dynamic-tables/resharding.html\"&gt;Шардирование&lt;/a&gt;.&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;aggregate&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя агрегирующей функции. Только для неключевых колонок.&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;required&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;boolean&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Если выставлено в &lt;code&gt;%true&lt;/code&gt;, то значение в колонке не должно быть &lt;code&gt;null&lt;/code&gt;. По умолчанию &lt;code&gt;required=%false&lt;/code&gt;. Колонка типа &lt;code&gt;any&lt;/code&gt; не может быть &lt;code&gt;required=%true&lt;/code&gt;.&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;group&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Если две колонки имеют одинаковое имя группы, то данные этих колонок попадут в одни и те же блоки. Менять атрибут &lt;code&gt;group&lt;/code&gt; можно в любой момент с помощью команды &lt;code&gt;alter-table&lt;/code&gt;, изменения будут применяться к новым чанкам.&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Свойства схемы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;имя колонки должно быть непустой строкой. Максимальная длина — 256 символов;&lt;/li&gt;\n&lt;li&gt;имя колонки не может начинаться с системного префикса &lt;code&gt;@&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;имена колонок не могут повторяться в пределах таблицы;&lt;/li&gt;\n&lt;li&gt;ключевые колонки должны образовывать префикс схемы;&lt;/li&gt;\n&lt;li&gt;все ключевые колонки должны быть указаны в схеме;&lt;/li&gt;\n&lt;li&gt;поддерживается до 32 000 колонок, но рекомендуется ограничиться единицами тысяч;&lt;/li&gt;\n&lt;li&gt;у колонки всегда должен быть явно указан тип: в атрибуте &lt;code&gt;type&lt;/code&gt; или &lt;code&gt;type_v3&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;при чтении схемы всегда возвращаются оба атрибута: и &lt;code&gt;type&lt;/code&gt;, и &lt;code&gt;type_v3&lt;/code&gt; независимо от того, как схема была создана;&lt;/li&gt;\n&lt;li&gt;вычислимые колонки могут быть только ключевыми. Вычислимые колонки могут зависеть только от ключевых невычислимых колонок.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Атрибуты схемы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;strict&lt;/code&gt; типа &lt;code&gt;boolean&lt;/code&gt;. По умолчанию &lt;code&gt;true&lt;/code&gt;. Если таблица строгая, то есть атрибут имеет значение &lt;code&gt;true&lt;/code&gt;, то в таблицу нельзя записать данные в отсутствующую в схеме колонку. В противном случае допускается запись в отсутствующую колонку, которая автоматически появится, но только у новой строки.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;unique_keys&lt;/code&gt; типа &lt;code&gt;boolean&lt;/code&gt;. По умолчанию &lt;code&gt;false&lt;/code&gt;. Если атрибут имеет значение &lt;code&gt;true&lt;/code&gt; и таблица сортирована, то все ключи в таблице должны быть уникальны.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"types\"&gt;&lt;a href=\"ru/user-guide/storage/static-schema.html#types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поддерживаемые типы колонок&lt;/span&gt;&lt;/a&gt;Поддерживаемые типы колонок&lt;/h3&gt;\n&lt;p&gt;YTsaurus поддерживает типы колонок, описанные в разделе &lt;a href=\"user-guide/storage/data-types.html\"&gt;Типы данных&lt;/a&gt;.&lt;br /&gt;\nСреди них есть как примитивные, так и композитные типы.&lt;/p&gt;\n&lt;p&gt;Значения в ячейках таблицы всегда имеют тот тип, который указан в схеме.&lt;/p&gt;\n&lt;p&gt;Задать тип в схеме таблицы можно одним из способов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;с помощью ключей &lt;code&gt;type&lt;/code&gt; и (необязательно) &lt;code&gt;required&lt;/code&gt; можно задать только примитивные или опциональные примитивные типы;&lt;/li&gt;\n&lt;li&gt;с помощью ключа &lt;code&gt;type_v3&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В ключе &lt;code&gt;type&lt;/code&gt; ожидается строка.&lt;/p&gt;\n&lt;p&gt;В ключе &lt;code&gt;type_v3&lt;/code&gt; ожидается либо строка (для примитивных типов), либо yson-словарь.&lt;br /&gt;\nYson-словарь всегда имеет ключ &lt;code&gt;type_name&lt;/code&gt;, в котором хранится имя типа.&lt;/p&gt;\n&lt;p&gt;Остальные ключи зависят от конкретного типа и описаны на странице &lt;a href=\"user-guide/storage/data-types.html\"&gt;Типы данных&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Для примитивных типов кроме &lt;code&gt;any&lt;/code&gt; / &lt;code&gt;yson&lt;/code&gt; действуют стандартные отношения порядка.&lt;/p&gt;\n&lt;p&gt;Отношения порядка действуют так же для типов &lt;code&gt;optional&amp;lt;T&amp;gt;&lt;/code&gt;, где &lt;code&gt;T&lt;/code&gt; — это примитивный сравнимый тип.&lt;br /&gt;\nГарантируется, что отсутствующие значения — значения типа &lt;code&gt;null&lt;/code&gt; — меньше любого значения любого типа.&lt;/p&gt;\n&lt;p&gt;Поддерживается возможность сравнивать элементы сравнимых типов.&lt;br /&gt;\nСравнение сначала выполняется по типу, а затем, при совпадении типов, происходит сравнение значений.&lt;br /&gt;\nПорядок между различными типами не специфицирован. Например, не имеет смысла сравнивать &lt;code&gt;100&lt;/code&gt; и &lt;code&gt;3.14&lt;/code&gt;, так как результат не специфицирован.&lt;/p&gt;\n&lt;h3 id=\"schema_examples\"&gt;&lt;a href=\"ru/user-guide/storage/static-schema.html#schema_examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры схем&lt;/span&gt;&lt;/a&gt;Примеры схем&lt;/h3&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема статической таблицы после создания (если явно не указано иное)&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;strict=%false&amp;gt;[]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"273\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-273\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-273\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-273.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Автоматически выведенная схема для таблицы сортированной по &lt;code&gt;key1; key2&lt;/code&gt;.&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;strict=%false&amp;gt;[\n  {\n      name = \"key1\";\n      type = \"any\";\n      sort_order = \"ascending\"\n      type_v3= {\n          type_name=optional;\n          item=yson;\n      };\n  };{\n      name = \"key2\";\n      type = \"any\";\n      sort_order = \"ascending\"\n      type_v3= {\n          type_name=optional;\n          item=yson;\n      };\n  }\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"281\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-281\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-281\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-281.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Пример схемы для сортированной таблицы.&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[\n  {\n    name = \"key\";\n    type = \"string\";\n    sort_order = \"ascending\"\n  };{\n    name = \"subkey\";\n    type = \"string\";\n    sort_order = \"ascending\"\n  };{\n    name = \"value\";\n    type = \"string\"\n  }\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"289\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-289\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-289\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-289.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Пример схемы с группировкой для колонок, которые часто используются вместе.&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[\n  {\n    name = \"key\";\n    type = \"string\";\n    sort_order = \"ascending\";\n    group = \"g1\"\n  };{\n    name = \"subkey\";\n    type = \"string\";\n    sort_order = \"ascending\";\n    group = \"g1\"\n  };{\n    name = \"value\";\n    type = \"string\";\n    sort_order = \"ascending\";\n  }\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"297\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-297\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-297\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-297.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Пример схемы для таблицы с логами.&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;strict=%false&amp;gt;[\n {\n    \"name\" = \"id\";\n    \"type\" = \"int64\";\n };{\n    \"name\" = \"class\";\n    \"type\" = \"int64\";\n };{\n    \"name\" = \"uid\";\n    \"type\" = \"string\";\n };{\n    \"name\" = \"ip\";\n    \"type\" = \"int64\";\n };{\n    \"name\" = \"iso_eventtime\";\n    \"type\" = \"string\";\n };{\n    \"name\" = \"error\";\n    \"type\" = \"string\"\n };{\n    \"name\" = \"ip6\";\n    \"type\" = \"string\"\n };{\n    \"name\" = \"port\";\n    \"type\" = \"int64\"\n };{\n    \"name\" = \"comment\";\n    \"type\" = \"string\"\n }\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"305\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-305\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-305\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-305.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"schema_mode\"&gt;&lt;a href=\"ru/user-guide/storage/static-schema.html#schema_mode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Слабая и сильная схема&lt;/span&gt;&lt;/a&gt;Слабая и сильная схема&lt;/h2&gt;\n&lt;p&gt;У таблицы существует атрибут &lt;code&gt;schema_mode&lt;/code&gt;, который определяет источник происхождения схемы.&lt;/p&gt;\n&lt;p&gt;Если схема не была установлена пользователем явно, атрибут &lt;code&gt;@schema_mode&lt;/code&gt; будет иметь значение &lt;code&gt;weak&lt;/code&gt;. Это означает, что схема таблицы создана автоматически и нужна только для разметки ключевых колонок.&lt;br /&gt;\nТакая схема автоматически изменяется, если таблица теряет свойство сортированности или меняет набор ключевых колонок.&lt;/p&gt;\n&lt;p&gt;Например, запись с флагом &lt;code&gt;&amp;lt;append=%true&amp;gt;&lt;/code&gt; в сортированную таблицу без указания атрибута &lt;code&gt;sorted_by&lt;/code&gt; приводит к тому, что таблица теряет свойство сортированности, а значит, меняется ее схема — как минимум, атрибут &lt;code&gt;sort_order&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Если схема таблицы установлена пользователем явно, то &lt;code&gt;@schema_mode == strong&lt;/code&gt;. Схема такой таблицы сохраняется и проверяется при записи, как в режиме &lt;code&gt;append&lt;/code&gt;, так и в режиме &lt;code&gt;overwrite&lt;/code&gt;. Неявные преобразования с сильной схемой невозможны.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Создать таблицу без схемы&lt;/span&gt;\n$ yt --proxy &amp;lt;cluster-name&amp;gt; create table //tmp/table_1\n213c-a01da-3fc0191-54a9a802\n$ yt --proxy &amp;lt;cluster-name&amp;gt; get //tmp/table_1/@schema_mode\n&lt;span class=\"hljs-string\"&gt;\"weak\"&lt;/span&gt;\n$ yt --proxy &amp;lt;cluster-name&amp;gt; get //tmp/table_1/@schema\n&amp;lt;\n    &lt;span class=\"hljs-string\"&gt;\"unique_keys\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"strict\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;;\n&amp;gt; []\n&lt;span class=\"hljs-comment\"&gt;# Создать таблицу с явным указанием схемы&lt;/span&gt;\n$ yt --proxy &amp;lt;cluster-name&amp;gt; create table //tmp/table_2 --attributes &lt;span class=\"hljs-string\"&gt;'{schema = [{name = a; type = int64}; {name = b; type = string}]}'&lt;/span&gt;\n213c-b75ef-3fc0191-1e85fe66\n$ yt --proxy &amp;lt;cluster-name&amp;gt; get //tmp/table_2/@schema_mode\n&lt;span class=\"hljs-string\"&gt;\"strong\"&lt;/span&gt;\n$ yt --proxy &amp;lt;cluster-name&amp;gt; get //tmp/table_2/@schema\n&amp;lt;\n    &lt;span class=\"hljs-string\"&gt;\"unique_keys\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"strict\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n&amp;gt; [\n    {\n        &lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"int64\"&lt;/span&gt;;\n    };\n    {\n        &lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"string\"&lt;/span&gt;;\n    };\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"323\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-323\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-323\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-323.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"strict_schematization_advantages\"&gt;&lt;a href=\"ru/user-guide/storage/static-schema.html#strict_schematization_advantages\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Преимущества строгой схематизации&lt;/span&gt;&lt;/a&gt;Преимущества строгой схематизации&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Производительность:\n&lt;ul&gt;\n&lt;li&gt;Если дополнительно включить поколоночный формат хранения &lt;a href=\"user-guide/storage/chunks.html\"&gt;чанков&lt;/a&gt; &lt;code&gt;optimize_for = scan&lt;/code&gt;, то данные будут храниться компактнее, а чтение подмножества колонок будет быстрее.&lt;/li&gt;\n&lt;li&gt;Некоторые табличные ридеры могут работать быстрее для таблиц со схемой.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Удобство и более широкие возможности:\n&lt;ul&gt;\n&lt;li&gt;В YQL удобнее работать со схематизированными таблицами;&lt;/li&gt;\n&lt;li&gt;В &lt;a href=\"user-guide/data-processing/chyt/about-chyt.html\"&gt;CHYT&lt;/a&gt; нельзя работать с несхематизированными данными.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"schema_inference\"&gt;&lt;a href=\"ru/user-guide/storage/static-schema.html#schema_inference\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Наследование схемы в системных операциях&lt;/span&gt;&lt;/a&gt;Наследование схемы в системных операциях&lt;/h2&gt;\n&lt;p&gt;Системные операции Sort, Erase, Merge и Remote copy могут самостоятельно выводить схему выходной таблицы. Правила вывода схемы для операций регулируются опцией спецификации &lt;code&gt;schema_inference_mode = (auto|from_input|from_output)&lt;/code&gt;. Примеры использования опций можно найти в разделе &lt;a href=\"ru/user-guide/storage/static-schema.html#examples\"&gt;Примеры&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"ordered-merge,-erase\"&gt;&lt;a href=\"ru/user-guide/storage/static-schema.html#ordered-merge,-erase\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ordered merge, Erase&lt;/span&gt;&lt;/a&gt;Ordered merge, Erase&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Опция&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from_input&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Схемы всех таблиц должны совпадать с точностью до атрибута &lt;code&gt;sort_order&lt;/code&gt; и порядка колонок. Тогда схема выходной таблицы совпадает со схемой входных таблиц. Если входная таблица одна, сортированность сохраняется. Если входные таблицы имели сильную схему, то и выходная таблица будет иметь сильную схему.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from_output&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Используется схема выходной таблицы, данные валидируются относительно этой схемы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;auto&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;При наличии сильной схемы у выходной таблицы проверяется, что она совместима по типам со схемой всех сильно схематизированных входных таблиц. При наличии слабой схемы у выходной таблицы, схема выводится из схем входных таблиц аналогично опции &lt;code&gt;from_input&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"unordered-merge\"&gt;&lt;a href=\"ru/user-guide/storage/static-schema.html#unordered-merge\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Unordered merge&lt;/span&gt;&lt;/a&gt;Unordered merge&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Опция&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from_input&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Должны совпадать количество и типы колонок, тогда схема выходной таблицы совпадает со схемой входных таблиц за исключением сортированности. Если входные таблицы имели сильную схему, то и выходная таблица будет иметь сильную схему.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from_output&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Используется схема выходной таблицы, данные валидируются относительно этой схемы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;auto&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;При наличии сильной схемы у выходной таблицы проверяется, что она совместима по типам со схемой всех сильно схематизированных входных таблиц. При наличии слабой схемы у выходной таблицы, схема выводится из схем входных таблиц (аналогично опции &lt;code&gt;from_input&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"sorted-merge\"&gt;&lt;a href=\"ru/user-guide/storage/static-schema.html#sorted-merge\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sorted merge&lt;/span&gt;&lt;/a&gt;Sorted merge&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Опция&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from_input&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Должны совпадать количество и типы колонок, тогда схема выходной таблицы совпадает со схемой входных таблиц, ключевые колонки проставляются в соответствии с параметром &lt;code&gt;merge_by&lt;/code&gt; спецификации. Если входные таблицы имели сильную схему, то и выходная таблица будет иметь сильную схему.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from_output&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Проверяется что ключевые колонки выходной таблицы совпадают с ключевыми колонками &lt;code&gt;merge_by&lt;/code&gt; из спецификации.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;auto&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;При наличии сильной схемы у выходной таблицы проверяется, что она совместима по типам со схемой всех сильно схематизированных входных таблиц. Проверяется соответствие ключевых колонок параметру &lt;code&gt;merge_by&lt;/code&gt;. При наличии слабой схемы у выходной таблицы, схема выводится из схем входных таблиц аналогично опции &lt;code&gt;from_input&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"sort\"&gt;&lt;a href=\"ru/user-guide/storage/static-schema.html#sort\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sort&lt;/span&gt;&lt;/a&gt;Sort&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;Sort&lt;/code&gt; — единственная операция которая может поменять сильную схему таблицы. Меняется порядок колонок: ключевые колонки переставляются в начало и проставляется атрибут &lt;code&gt;sort_order&lt;/code&gt;. Это обусловлено распространенным сценарием замены таблицы на ее сортированную копию.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Опция&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from_input&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Если все входные таблицы имеют сильные схемы, и схемы совпадают с точностью атрибута &lt;code&gt;sort_order&lt;/code&gt; и порядка колонок, тогда типы колонок выходной таблицы совпадает с типами в схемах входных таблиц. Ключевые колонки берутся из спецификации операции (&lt;code&gt;sort_by&lt;/code&gt;). Если все входные таблицы имеют слабую схему, схема будет выведена из ключевых колонок.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from_output&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Сохраняется схема выходной таблицы, ключевые колонки меняются в соответствии с параметром спецификации &lt;code&gt;sort_by&lt;/code&gt;. Все ключевые колонки должны присутствовать в схеме.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;auto&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;При наличии сильной схемы у выходной таблицы проверяется, что она совместима по типам со схемой всех сильно схематизированных входных таблиц. Ключевые колонки меняются в соответствии со спецификацией. При наличии слабой схемы у выходной таблицы, схема выводится из схем входных таблиц (аналогично опции &lt;code&gt;from_input&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"izmenenie-shemy\"&gt;&lt;a href=\"ru/user-guide/storage/static-schema.html#izmenenie-shemy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Изменение схемы&lt;/span&gt;&lt;/a&gt;Изменение схемы&lt;/h2&gt;\n&lt;p&gt;Изменение схемы — легкая операция над метаинформацией, не требующая чтения данных. Для изменения схемы используйте команду &lt;code&gt;alter_table&lt;/code&gt;.&lt;br /&gt;\nСхему пустой таблицы можно менять произвольным образом. Для непустых таблиц существует несколько разрешенных сценариев изменения схемы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;добавление неключевой колонки в строгую схему — &lt;code&gt;strict = %true&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;добавление ключевой колонки в конец ключа в строгую схему — &lt;code&gt;strict = %true&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;удаление колонки из нестрогой схемы — &lt;code&gt;strict = %false&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;изменение схемы из строгой (&lt;code&gt;strict = %true&lt;/code&gt;) на нестрогую (&lt;code&gt;strict = %false&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Прочие изменения схемы запрещены, так как они требует перевалидации данных, и такие изменения можно выполнить через операции &lt;code&gt;Merge&lt;/code&gt; или &lt;code&gt;Map&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;На изменение схемы действует ряд ограничений:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Изменение схемы не должно вызывать необходимость изменения содержимого таблицы. Например, изменение атрибута &lt;code&gt;strict&lt;/code&gt; таблицы с &lt;code&gt;false&lt;/code&gt; на &lt;code&gt;true&lt;/code&gt; требует проверки, что каждая строка в таблице содержит только значения, относящиеся к столбцам, упомянутым в схеме, а подобная проверка эквивалентна полному прочтению таблицы.&lt;/li&gt;\n&lt;li&gt;Нельзя удалять столбцы при условии, что &lt;code&gt;strict = true&lt;/code&gt;: нет возможности очистить соответствующее значение в каждой строке. Нельзя добавлять столбцы при условии &lt;code&gt;strict = false&lt;/code&gt;: добавляя столбец некоторого типа, нельзя быть уверенным, что в таблице нет строк, уже содержащих значение, отвечающее этому столбцу, а оно уже может относиться к другому типу данных.&lt;/li&gt;\n&lt;li&gt;Нельзя удалять ключевые столбцы из середины, так как это может потенциально нарушить порядок сортировки.&lt;/li&gt;\n&lt;li&gt;Нельзя вводить новые вычислимые колонки или менять выражение или функцию агрегации у имеющихся, так как это бы потребовало пересчёта во всех строках таблицы. Но, например, удалять последние ключевые колонки можно, так как это лишь ослабляет условие сортировки для будущих вставок, не меняя его для имеющегося набора строк.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"ru/user-guide/storage/static-schema.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры работы со схемой&lt;/span&gt;&lt;/a&gt;Примеры работы со схемой&lt;/h2&gt;\n&lt;h3 id=\"chtenie-shemy\"&gt;&lt;a href=\"ru/user-guide/storage/static-schema.html#chtenie-shemy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чтение схемы&lt;/span&gt;&lt;/a&gt;Чтение схемы&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt --proxy &amp;lt;cluster-name&amp;gt; get //home/tutorial/links_sorted_schematized/@schema\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"603\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-603\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-603\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-603.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Python&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.get(&lt;span class=\"hljs-string\"&gt;\"//home/tutorial/links_sorted_schematized/@schema\"&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"609\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-609\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-609\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-609.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"sozdanie-tablicy-so-shemoj\"&gt;&lt;a href=\"ru/user-guide/storage/static-schema.html#sozdanie-tablicy-so-shemoj\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создание таблицы со схемой&lt;/span&gt;&lt;/a&gt;Создание таблицы со схемой&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt --proxy &amp;lt;cluster-name&amp;gt; create table //tmp/table --attributes &lt;span class=\"hljs-string\"&gt;'{schema = [{name = a; type = int64}; {name = b; type = string}]}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"620\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-620\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-620\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-620.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Python&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.create_table(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;, attributes={&lt;span class=\"hljs-string\"&gt;\"schema\"&lt;/span&gt; : [{&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt; : &lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt; : &lt;span class=\"hljs-string\"&gt;\"int64\"&lt;/span&gt;}, {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt; : &lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt; : &lt;span class=\"hljs-string\"&gt;\"string\"&lt;/span&gt;}]})\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"626\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-626\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-626\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-626.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;C++&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; schemaNode = TNode::&lt;span class=\"hljs-built_in\"&gt;CreateList&lt;/span&gt;()\n  .&lt;span class=\"hljs-built_in\"&gt;Add&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TNode&lt;/span&gt;()(&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;)(&lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"int64\"&lt;/span&gt;))\n  .&lt;span class=\"hljs-built_in\"&gt;Add&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TNode&lt;/span&gt;()(&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;)(&lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"string\"&lt;/span&gt;));\nclient-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Create&lt;/span&gt;(\n  &lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;,\n  NYT::NT_TABLE,\n  &lt;span class=\"hljs-built_in\"&gt;TCreateOptions&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;Attributes&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TNode&lt;/span&gt;()(&lt;span class=\"hljs-string\"&gt;\"schema\"&lt;/span&gt;, schemaNode)));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"632\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-632\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-632\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-632.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"atribut-schema-v-richypath\"&gt;&lt;a href=\"ru/user-guide/storage/static-schema.html#atribut-schema-v-richypath\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атрибут schema в RichYPath&lt;/span&gt;&lt;/a&gt;Атрибут schema в RichYPath&lt;/h3&gt;\n&lt;p&gt;При записи данных c помощью команды &lt;code&gt;write_table&lt;/code&gt; или на выходе MapReduce операций можно использовать атрибут &lt;code&gt;@schema&lt;/code&gt; пути.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;CLI\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; data | yt write &lt;span class=\"hljs-string\"&gt;'&amp;lt;schema=[{name = a; type = int64}; {name = b; type = string}]&amp;gt;//tmp/table'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"646\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-646\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-646\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-646.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"ustanovka-shemy-i-izmenenie-formata-dlya-tipizirovannyh-i-razlozhennyh-dannyh\"&gt;&lt;a href=\"ru/user-guide/storage/static-schema.html#ustanovka-shemy-i-izmenenie-formata-dlya-tipizirovannyh-i-razlozhennyh-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка схемы и изменение формата для типизированных и разложенных данных&lt;/span&gt;&lt;/a&gt;Установка схемы и изменение формата для типизированных и разложенных данных&lt;/h3&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Включить поколоночный формат хранения&lt;/span&gt;\nyt --proxy &amp;lt;cluster-name&amp;gt; &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //tmp/table/@optimize_for scan\n&lt;span class=\"hljs-comment\"&gt;# Установить новую схему и переложить данные в новый формат хранения&lt;/span&gt;\nyt --proxy &amp;lt;cluster-name&amp;gt; merge --mode ordered --src //tmp/table --dst &lt;span class=\"hljs-string\"&gt;'&amp;lt;schema=[{name = a; type = int64; sort_order = ascending}; {name = b; type = string}]&amp;gt;//tmp/table'&lt;/span&gt; --spec &lt;span class=\"hljs-string\"&gt;'{schema_inference_mode = from_output; force_transform = %true}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"655\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-655\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-655\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-655.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Существуют более автоматические решения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Через YQL задать запрос вида &lt;code&gt;INSERT INTO
