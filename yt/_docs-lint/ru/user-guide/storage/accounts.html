        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе рассказывается об аккаунтах и связанных с ними квотах в системе YTsaurus. Приводится описание иерархии аккаунтов, даются примеры действий с аккаунтами, приводится перечень атрибутов аккаунта.&lt;/p&gt;\n&lt;h2 id=\"common\"&gt;&lt;a href=\"ru/user-guide/storage/accounts.html#common\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общие сведения&lt;/span&gt;&lt;/a&gt;Общие сведения&lt;/h2&gt;\n&lt;p&gt;Все типы квот для хранения данных привязаны к &lt;strong&gt;аккаунту&lt;/strong&gt; проекта. Аккаунт — это служебный объект в &lt;a href=\"user-guide/storage/cypress.html\"&gt;Кипарисе&lt;/a&gt;. Все аккаунты имеют уникальные имена. При этом они находятся в отдельном пространстве имён, так что имя пользователя и аккаунта могут совпадать. Имя аккаунта хранится в атрибуте &lt;code&gt;name&lt;/code&gt;, доступном как на чтение, так и на запись.&lt;/p&gt;\n&lt;p&gt;Все известные системе аккаунты можно найти в &lt;code&gt;//sys/accounts&lt;/code&gt;. Создание и удаление аккаунтов производится командами &lt;code&gt;create&lt;/code&gt; и &lt;code&gt;remove&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"attributes\"&gt;&lt;a href=\"ru/user-guide/storage/accounts.html#attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атрибуты узлов&lt;/span&gt;&lt;/a&gt;Атрибуты узлов&lt;/h2&gt;\n&lt;p&gt;Каждый узел Кипариса имеет атрибут &lt;code&gt;account&lt;/code&gt;, доступный на чтение и запись. Этот атрибут хранит имя аккаунта, к которому привязан данный узел. В случае файлов и таблиц назначение аккаунта влечет за собой расход его дисковой квоты. При этом учитывается пространство, физически выделенное на узлах кластера для хранения данных, поэтому оно зависит от степени репликации (атрибут &lt;code&gt;replication_factor&lt;/code&gt;), способа erasure-кодирования (атрибут &lt;code&gt;erasure_codec&lt;/code&gt;) и используемой компрессии (атрибут &lt;code&gt;compression_codec&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Различные узлы Кипариса (файлы или таблицы) могут ссылаться на одни и те же чанки. Кроме того, один и тот же узел может ссылаться на чанк несколько раз. Подобное повторное использование может возникнуть, например, в результате работы команды &lt;code&gt;copy&lt;/code&gt; для таблиц и файлов, а также команд &lt;code&gt;merge&lt;/code&gt; и &lt;code&gt;erase&lt;/code&gt; для таблиц. Такие чанки учитываются в квоте единожды (с максимальным среди ссылающихся на них таблиц коэффициентом репликации).&lt;/p&gt;\n&lt;p&gt;Узлы всех остальных типов (отличных от файлов и таблиц) не требуют хранения данных на нодах кластера и потому не расходуют дисковую квоту аккаунта.&lt;/p&gt;\n&lt;p&gt;В случае композитных узлов потомки при создании автоматически наследуют аккаунт родителя (если не указано иное). Выставление правильного значения атрибута &lt;code&gt;account&lt;/code&gt; на домашней директории пользователя гарантирует, что созданные им таблицы и файлы по умолчанию будут отнесены к правильному аккаунту.&lt;/p&gt;\n&lt;p&gt;Чтобы узнать, сколько и каких ресурсов потребляет данный узел Кипариса, следует использовать его атрибут &lt;code&gt;resource_usage&lt;/code&gt;. Также существует вычисляемый атрибут &lt;code&gt;recursive_resource_usage&lt;/code&gt;, отмеряющий использование ресурсов с учетом потомков. Данные атрибуты имеют структуру &lt;code&gt;ClusterResources&lt;/code&gt;, смотрите далее.&lt;/p&gt;\n&lt;p&gt;Чтобы выставить аккаунт &lt;code&gt;A&lt;/code&gt; некоторому узлу Кипариса, пользователь, инициировавший данное изменение, должен иметь право &lt;code&gt;use&lt;/code&gt; на аккаунте &lt;code&gt;A&lt;/code&gt;. Кроме того, у него должно быть право &lt;code&gt;write&lt;/code&gt;. Аккаунт для узла можно также указать сразу в момент создания узла; в этом случае также необходимо иметь право &lt;code&gt;use&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;При копировании частей Кипариса командой &lt;code&gt;copy&lt;/code&gt;, а также при перемещении командой &lt;code&gt;move&lt;/code&gt; аккаунты, а также владельцы в копируемом поддереве изменяются — они становятся равными аккаунту каталога, куда происходит копирование, и пользователю, выполняющему копирование, соответственно. Чтобы предотвратить изменение аккаунта, существует опция &lt;code&gt;preserve_account&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В случае превышения пользователем квоты аккаунта по отдельным видам ресурсов система начинает отказывать в дальнейшем использовании аккаунта по превышенному виду ресурса. Это не означает, что использование аккаунта никогда не превышает лимитов. Например, лимиты могли быть принудительно выставлены ниже использования. Кроме того, отслеживание потребления дисковой и чанковой квот работает асинхронно, что также может выливаться в превышение отведенных лимитов.&lt;/p&gt;\n&lt;h2 id=\"account_tree\"&gt;&lt;a href=\"ru/user-guide/storage/accounts.html#account_tree\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Иерархия аккаунтов&lt;/span&gt;&lt;/a&gt;Иерархия аккаунтов&lt;/h2&gt;\n&lt;p&gt;Аккаунты могут быть вложены в другие аккаунты. Это позволяет гибко настраивать квоты и естественным образом отражать в них организационную структуру, которой принадлежат пользователи и проекты. Например, может существовать общая квота отдела и вложенные в нее проектные квоты или, например, аккаунт сервиса и подаккаунты входящих в него групп. Основным преимуществом представления аккаунтов в виде дерева является то, что пользователи получают возможность самостоятельно управлять выданными им квотами, разделяя их на части и объединяя воедино по необходимости.&lt;/p&gt;\n&lt;p&gt;Далее в разделе описывается иерархическая организация аккаунтов и принципы работы с этой иерархией — из командной строки и веб-интерфейса.&lt;/p&gt;\n&lt;h3 id=\"account_tree_algo\"&gt;&lt;a href=\"ru/user-guide/storage/accounts.html#account_tree_algo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Квотирование&lt;/span&gt;&lt;/a&gt;Квотирование&lt;/h3&gt;\n&lt;p&gt;Квота, выданная любому неверхнеуровневому аккаунту, не может превышать квоту его родителя (и, по индукции, любого предка).&lt;/p&gt;\n&lt;p&gt;По умолчанию сумма квот подаккаунтов не может превышать квоту родителя. Но иногда такая переподписка может быть удобной, поэтому её можно включить:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/account_tree/my_account/@allow_children_limit_overcommit %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"57\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-57\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-57\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-57.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В таком режиме сумма лимитов детей может превышать лимит родителя. Тем не менее, лимит индивидуального подаккаунта по-прежнему должен быть меньше либо равен лимиту родительского аккаунта.&lt;/p&gt;\n&lt;p&gt;Написанное выше относится к лимитам потребления (&lt;code&gt;limits&lt;/code&gt;), а не к используемым ресурсам (&lt;code&gt;usage&lt;/code&gt;). Ресурсы, использованные в некотором аккаунте, учитываются в его квоте, а также в квотах всех его предков. Валидация работает так же: если увеличение потребления привело бы к исчерпанию квоты в аккаунте или в любом из его предков, генерируется ошибка.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Можно ли занимать ресурсы в нелистовых аккаунтах?&lt;/strong&gt;&lt;br /&gt;\nТехнически возможно, но пользователю будет сложнее оценить, где расходуется квота.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Верно ли, что аккаунт не может переполниться, если на нем не включен флаг, разрешающий оверкоммит дочерним аккаунтам?&lt;/strong&gt;&lt;br /&gt;\nВерно тогда и только тогда, когда непосредственно в данном аккаунте не используются ресурсы.&lt;/p&gt;\n&lt;h3 id=\"account_tree_viewing\"&gt;&lt;a href=\"ru/user-guide/storage/accounts.html#account_tree_viewing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Просмотр дерева аккаунтов&lt;/span&gt;&lt;/a&gt;Просмотр дерева аккаунтов&lt;/h3&gt;\n&lt;p&gt;Несмотря на иерархическую организацию, аккаунты обладают глобально уникальными именами. Данное обстоятельство существенно упрощает работу с ними, т.к. позволяет ссылаться на аккаунт, не указывая полный путь к нему.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;В веб-интерфейсе YTsaurus&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Иерархия аккаунтов представлена на странице &lt;strong&gt;Accounts&lt;/strong&gt; (а также в разделе &lt;strong&gt;Dashboard&lt;/strong&gt;). Благодаря глобальной уникальности имен, редактируя путь к аккаунту, достаточно указать лишь его имя.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/account_tree_view.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;В командной строке&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Дерево аккаунтов в Кипарисе находится по пути &lt;code&gt;//sys/account_tree&lt;/code&gt;. Полный плоский список доступен по пути &lt;code&gt;//sys/accounts&lt;/code&gt; (имена аккаунтов глобально уникальны, несмотря на иерархическую организацию).&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt list //sys/account_tree/my_account\nmy_subaccount1\nmy_subaccount2\n\n$ yt list //sys/accounts\nmy_account\nmy_subaccount1\nmy_subaccount2\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"97\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-97\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-97\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-97.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h3 id=\"account_tree_creating\"&gt;&lt;a href=\"ru/user-guide/storage/accounts.html#account_tree_creating\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создание аккаунта&lt;/span&gt;&lt;/a&gt;Создание аккаунта&lt;/h3&gt;\n&lt;p&gt;Максимальная допустимая высота дерева аккаунтов равна 10.&lt;/p&gt;\n&lt;p&gt;Создать аккаунт верхнего уровня можно в веб-интерфейсе YTsaurus, нажав &lt;strong&gt;Create account&lt;/strong&gt; на странице &lt;strong&gt;Accounts&lt;/strong&gt;. Вложенные аккаунты создаются из командой строки или в веб-интерфейсе YTsaurus.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;В веб-интерфейсе YTsaurus&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Для создания нового аккаунта необходимо:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;На странице &lt;strong&gt;Accounts&lt;/strong&gt; нажать &lt;strong&gt;Create account&lt;/strong&gt;.&lt;/li&gt;\n&lt;li&gt;Указать название нового аккаунта, имя родительского аккаунта, в который будет вложен создаваемый аккаунт, а также ответственных за новый аккаунт пользователей. При необходимости можно также запросить автоматическое создание домашней директории, соответствующей аккаунту.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;img src=\"images/account_tree_create.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;В командной строке&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Чтобы создать аккаунт, в атрибуте &lt;code&gt;name&lt;/code&gt; необходимо указать его имя, а в &lt;code&gt;parent_name&lt;/code&gt; — имя родителя. Если имя родителя не указано, будет создан аккаунт верхнего уровня.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt create account --attributes=&lt;span class=\"hljs-string\"&gt;'{ name = \"my_subaccount3\"; parent_name = \"my_account\" }'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"142\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-142\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-142\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-142.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h3 id=\"account_tree_removing\"&gt;&lt;a href=\"ru/user-guide/storage/accounts.html#account_tree_removing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Удаление аккаунта&lt;/span&gt;&lt;/a&gt;Удаление аккаунта&lt;/h3&gt;\n&lt;p&gt;Аккаунты можно перемещать и переименовывать, так что удалять аккаунт следует лишь в том случае, когда действительно отпала необходимость в его существовании.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Перед удалением аккаунта обязательно нужно убедиться, что в нем нет данных. В противном случае, аккаунт вместо удаления будет переведен в специальное состояние ожидания до тех пор, пока все ассоциированные с ним узлы Кипариса не будут удалены, после чего удаление произойдёт автоматически. Использовать аккаунт в таком состоянии невозможно, равно как и вернуть его в штатное состояние.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;В веб-интерфейсе YTsaurus&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Для удаления аккаунта необходимо:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;На странице &lt;strong&gt;Accounts&lt;/strong&gt; найти аккаунт в списке и нажать значок с карандашом для редактирования аккаунта.&lt;/li&gt;\n&lt;li&gt;В появившемся диалоге перейти в раздел &lt;strong&gt;Delete&lt;/strong&gt;, нажать кнопку &lt;strong&gt;Delete&lt;/strong&gt; и подтвердить действие.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;В командной строке&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Чтобы удалить аккаунт, достаточно указать путь к нему:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt remove //sys/accounts/my_subaccount3\n\n&lt;span class=\"hljs-comment\"&gt;# или&lt;/span&gt;\n\nyt remove //sys/account_tree/my_account/my_subaccount3\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"191\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-191\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-191\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-191.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h3 id=\"account_tree_moving\"&gt;&lt;a href=\"ru/user-guide/storage/accounts.html#account_tree_moving\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Перемещение или переименование аккаунта&lt;/span&gt;&lt;/a&gt;Перемещение или переименование аккаунта&lt;/h3&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;В веб-интерфейсе YTsaurus&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Для перемещения аккаунта необходимо:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;На странице &lt;strong&gt;Accounts&lt;/strong&gt; найти аккаунт в списке и нажать значок с карандашом для редактирования аккаунта.&lt;/li&gt;\n&lt;li&gt;В появившемся диалоге в разделе &lt;strong&gt;General&lt;/strong&gt; в выпадающем списке &lt;strong&gt;Parent&lt;/strong&gt; выбрать, куда переместить аккаунт.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;В командной строке&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Переместить аккаунт можно двумя способами:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Перемещение аккаунта с помощью атрибута &lt;code&gt;parent_name&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/account_tree/my_account/my_subaccount3/@parent_name my_subaccount2\n$ yt exists //sys/account_tree/my_account/my_subaccount3\n%&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;\n$ yt exists //sys/account_tree/my_account/my_subaccount2/my_subaccount3\n%&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"234\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-234\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-234\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-234.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Благодаря глобальной уникальности имен аккаунтов, достаточно указать только имя родителя, а не полный путь к нему.&lt;/p&gt;\n&lt;ol start=\"2\" style=\"--hier-list-start:1\"&gt;\n&lt;li&gt;Перемещение аккаунта с помощью команды &lt;code&gt;move&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt move //sys/account_tree/my_account/my_subaccount3 //sys/account_tree/my_account/my_subaccount2/my_subaccount3\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"245\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-245\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-245\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-245.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Следует обратить внимание, что в качестве пути назначения указывается полный путь к аккаунту, включая его имя. В частности, это позволяет переименовать аккаунт одновременно с перемещением.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h3 id=\"account_tree_transferring_resources\"&gt;&lt;a href=\"ru/user-guide/storage/accounts.html#account_tree_transferring_resources\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Передача ресурсов одного аккаунта другому&lt;/span&gt;&lt;/a&gt;Передача ресурсов одного аккаунта другому&lt;/h3&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;В веб-интерфейсе YTsaurus&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Для передачи ресурсов необходимо:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;На странице &lt;strong&gt;Accounts&lt;/strong&gt; найти аккаунт, которому нужно передать ресурсы, и нажать значок с карандашом для редактирования аккаунта.&lt;/li&gt;\n&lt;li&gt;В появившемся диалоге перейти в раздел, соответствующий типу ресурса, который необходимо передать.&lt;/li&gt;\n&lt;li&gt;Указать аккаунт, чьи ресурсы будут перераспределены (по умолчанию предлагается аккаунт-родитель), и новый лимит.&lt;/li&gt;\n&lt;li&gt;Нажать &lt;strong&gt;Save&lt;/strong&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;img src=\"images/account_tree_transfer_resources.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;В командной строке&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Передача ресурсов аккаунта с помощью команды &lt;code&gt;transfer-account-resources&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# yt transfer-account-resources &amp;lt;src_account&amp;gt; &amp;lt;dst_account&amp;gt; --resource-delta &amp;lt;resource_delta&amp;gt;&lt;/span&gt;\nyt transfer-account-resources my_subaccount1 my_subaccount2 --resource-delta &lt;span class=\"hljs-string\"&gt;'{node_count=10}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"297\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-297\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-297\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-297.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Аргумент &lt;code&gt;resource-delta&lt;/code&gt; представляет собой YSON-структуру типа &lt;code&gt;ClusterResources&lt;/code&gt; (смотрите ниже). Например: &lt;code&gt;{node_count=5;disk_space_per_medium={default=1024}}&lt;/code&gt;. Необходимо указывать именно объём передаваемых ресурсов, а не новые лимиты. Отсутствующие квоты можно пропускать.&lt;/p&gt;\n&lt;p&gt;В случае ошибки &lt;code&gt;argument command: invalid choice&lt;/code&gt; следует обновить утилиту &lt;code&gt;yt&lt;/code&gt;. Подробнее можно прочитать в разделе &lt;a href=\"overview/try-yt.html\"&gt;Как попробовать&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"builtin_accounts\"&gt;&lt;a href=\"ru/user-guide/storage/accounts.html#builtin_accounts\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Встроенные аккаунты&lt;/span&gt;&lt;/a&gt;Встроенные аккаунты&lt;/h2&gt;\n&lt;p&gt;Данные аккаунты появляются в системе в момент инициализации. Их нельзя удалить.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Аккаунт &lt;code&gt;tmp&lt;/code&gt;. При инициализации назначается каталогу &lt;code&gt;//tmp&lt;/code&gt;, а значит и всем его потомкам. По умолчанию правом пользоваться данным аккаунтом имеют все аутентифицированные пользователи системы (группа &lt;code&gt;users&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;Аккаунт &lt;code&gt;sys&lt;/code&gt;. При инициализации назначается всем остальным узлам. Явных разрешений на его использование по умолчанию никому не выдаётся. Аккаунт используется для внутренних нужд системы YTsaurus.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"account_attributes\"&gt;&lt;a href=\"ru/user-guide/storage/accounts.html#account_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атрибуты аккаунта&lt;/span&gt;&lt;/a&gt;Атрибуты аккаунта&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Атрибут&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;name&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Имя аккаунта (непустая строка)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;parent_name&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Имя родительского аккаунта&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;resource_limits&lt;/td&gt;\n&lt;td&gt;ClusterResources&lt;/td&gt;\n&lt;td&gt;Лимиты ресурсов для аккаунта&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;allow_children_limit_overcommit&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Может ли сумма лимитов подаккаунтов превышать лимит данного аккаунта (см. выше)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;resource_usage&lt;/td&gt;\n&lt;td&gt;ClusterResources&lt;/td&gt;\n&lt;td&gt;Занятые непосредственно данным аккаунтом ресурсы (включая незакоммиченные транзакции)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;committed_resource_usage&lt;/td&gt;\n&lt;td&gt;ClusterResources&lt;/td&gt;\n&lt;td&gt;Занятые непосредственно данным аккаунтом ресурсы (без учёта активных транзакций)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;recursive_resource_usage&lt;/td&gt;\n&lt;td&gt;ClusterResources&lt;/td&gt;\n&lt;td&gt;Занятые данным поддеревом аккаунтов ресурсы (включая незакоммиченные транзакции)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;recursive_committed_resource_usage&lt;/td&gt;\n&lt;td&gt;ClusterResources&lt;/td&gt;\n&lt;td&gt;Занятые данным поддеревом аккаунтов ресурсы (без учёта активных транзакций)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;violated_resource_limits&lt;/td&gt;\n&lt;td&gt;ViolatedClusterResources&lt;/td&gt;\n&lt;td&gt;Флаги превышения ресурсов для аккаунта&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;recursive_violated_resource_limits&lt;/td&gt;\n&lt;td&gt;RecursiveViolatedClusterResources&lt;/td&gt;\n&lt;td&gt;Для каждого типа ресурса — количество аккаунтов, превысивших лимит, в данном поддереве&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;code&gt;ClusterResources&lt;/code&gt; представляет собой следующую структуру:&lt;/p&gt;\n&lt;h3 id=\"struktura-clusterresources\"&gt;&lt;a href=\"ru/user-guide/storage/accounts.html#struktura-clusterresources\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Структура ClusterResources&lt;/span&gt;&lt;/a&gt;Структура ClusterResources&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Атрибут&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;disk_space&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Суммарное дисковое пространство в байтах&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;disk_space_per_medium&lt;/td&gt;\n&lt;td&gt;string-&amp;gt;integer&lt;/td&gt;\n&lt;td&gt;Дисковое пространство в байтах (для каждого медиума)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;node_count&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Количество узлов Кипариса&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;master_memory&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Объем потребленной оперативной памяти мастер-серверов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;chunk_count&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Количество чанков&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tablet_count&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Количество таблетов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tablet_static_memory&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Объём памяти для динамических таблиц, поднятых в память&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Поле &lt;code&gt;disk_space&lt;/code&gt; доступно только для чтения. Для изменения лимитов следует следует изменять значения словаря &lt;code&gt;disk_space_per_medium&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;ViolatedClusterResources&lt;/code&gt; представляет собой следующую структуру:&lt;/p&gt;\n&lt;h3 id=\"struktura-violatedclusterresources\"&gt;&lt;a href=\"ru/user-guide/storage/accounts.html#struktura-violatedclusterresources\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Структура ViolatedClusterResources&lt;/span&gt;&lt;/a&gt;Структура ViolatedClusterResources&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Атрибут&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;disk_space&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;Превышен ли лимит на дисковое пространство хотя бы по одному медиуму&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;disk_space_per_medium&lt;/td&gt;\n&lt;td&gt;string-&amp;gt;boolean&lt;/td&gt;\n&lt;td&gt;Превышен ли лимит на дисковое пространство (по каждому медиуму)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;node_count&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;Превышен ли лимит на количество узлов Кипариса&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;chunk_count&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;Превышен ли лимит на количество чанков&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tablet_count&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;Превышен ли лимит на количество таблетов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tablet_static_memory&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;Превышено ли ограничение на объём памяти, занимаемой динамическими таблицами, поднятыми в память&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;code&gt;RecursiveViolatedClusterResources&lt;/code&gt; представляет собой следующую структуру:&lt;/p&gt;\n&lt;h3 id=\"struktura-recursiveviolatedclusterresources\"&gt;&lt;a href=\"ru/user-guide/storage/accounts.html#struktura-recursiveviolatedclusterresources\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Структура RecursiveViolatedClusterResources&lt;/span&gt;&lt;/a&gt;Структура RecursiveViolatedClusterResources&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Атрибут&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;disk_space&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Количество аккаунтов в поддереве, превысивших лимит на дисковое пространство хотя бы по одному медиуму&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;disk_space_per_medium&lt;/td&gt;\n&lt;td&gt;string-&amp;gt;integer&lt;/td&gt;\n&lt;td&gt;Количество аккаунтов в поддереве, превысивших лимит на дисковое пространство (по каждому медиуму)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;node_count&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Количество аккаунтов в поддереве, превысивших лимит на количество узлов Кипариса&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;chunk_count&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Количество аккаунтов в поддереве, превысивших лимит на количество чанков&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tablet_count&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Количество аккаунтов в поддереве, превысивших лимит на количество таблетов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tablet_static_memory&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Количество аккаунтов в поддереве, превысивших ограничение на объём памяти, занимаемую динамическими таблицами, поднятыми в память&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/storage/accounts.md","sourcePath":"ru/user-guide/storage/accounts.md"},"headings":[{"title":"Общие сведения","href":"ru/user-guide/storage/accounts.html#common","level":2},{"title":"Атрибуты узлов","href":"ru/user-guide/storage/accounts.html#attributes","level":2},{"title":"Иерархия аккаунтов","href":"ru/user-guide/storage/accounts.html#account_tree","level":2,"items":[{"title":"Квотирование","href":"ru/user-guide/storage/accounts.html#account_tree_algo","level":3},{"title":"Просмотр дерева аккаунтов","href":"ru/user-guide/storage/accounts.html#account_tree_viewing","level":3},{"title":"Создание аккаунта","href":"ru/user-guide/storage/accounts.html#account_tree_creating","level":3},{"title":"Удаление аккаунта","href":"ru/user-guide/storage/accounts.html#account_tree_removing","level":3},{"title":"Перемещение или переименование аккаунта","href":"ru/user-guide/storage/accounts.html#account_tree_moving","level":3},{"title":"Передача ресурсов одного аккаунта другому","href":"ru/user-guide/storage/accounts.html#account_tree_transferring_resources","level":3}]},{"title":"Встроенные аккаунты","href":"ru/user-guide/storage/accounts.html#builtin_accounts","level":2},{"title":"Атрибуты аккаунта","href":"ru/user-guide/storage/accounts.html#account_attributes","level":2,"items":[{"title":"Структура ClusterResources","href":"ru/user-guide/storage/accounts.html#struktura-clusterresources","level":3},{"title":"Структура ViolatedClusterResources","href":"ru/user-guide/storage/accounts.html#struktura-violatedclusterresources","level":3},{"title":"Структура RecursiveViolatedClusterResources","href":"ru/user-guide/storage/accounts.html#struktura-recursiveviolatedclusterresources","level":3}]}],"title":"Аккаунты"},"router":{"pathname":"ru/user-guide/storage/accounts","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
