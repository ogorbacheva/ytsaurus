        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе описаны транзакции, применительно к &lt;a href=\"user-guide/storage/cypress.html\"&gt;Кипарису&lt;/a&gt; и &lt;a href=\"user-guide/storage/static-tables.html\"&gt;статическим таблицам&lt;/a&gt;, &lt;a href=\"ru/user-guide/storage/transactions.html#locks\"&gt;блокировки&lt;/a&gt; и &lt;a href=\"ru/user-guide/storage/transactions.html#versioning\"&gt;версионированность&lt;/a&gt; объектов Кипариса.&lt;br /&gt;\nТранзакционная модель динамических таблиц описана в разделе &lt;a href=\"user-guide/dynamic-tables/transactions.html\"&gt;Мультиверсионность и транзакционность динамических таблиц&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"transactions\"&gt;&lt;a href=\"ru/user-guide/storage/transactions.html#transactions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общие сведения&lt;/span&gt;&lt;/a&gt;Общие сведения&lt;/h2&gt;\n&lt;p&gt;Система YTsaurus поддерживает транзакции, но имеет ряд отличий от классической &lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A2%D1%80%D0%B0%D0%BD%D0%B7%D0%B0%D0%BA%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F_%D1%81%D0%B8%D1%81%D1%82%D0%B5%D0%BC%D0%B0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;транзакционной системы&lt;/a&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;транзакции могут длиться минуты и часы;&lt;/li&gt;\n&lt;li&gt;изолированность можно настраивать;&lt;/li&gt;\n&lt;li&gt;внешние ключи таблиц отсутствуют;&lt;/li&gt;\n&lt;li&gt;помимо таблиц транзакции могут затрагивать другие узлы Кипариса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;YTsaurus обеспечивает следующие свойства транзакционной системы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Атомарность (Atomicity)&lt;/strong&gt;. YTsaurus гарантирует, что транзакция не будет зафиксирована в системе частично. Будут либо выполнены все её подоперации, либо не выполнено ни одной. Изменение данных одного узла Кипариса в рамках одной команды (например, команды set) атомарно.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Согласованность (Consistency)&lt;/strong&gt;. Транзакция, фиксирующая свои результаты, сохраняет согласованность данных в узлах Кипариса и статических таблицах.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Изолированность (Isolation)&lt;/strong&gt;. В отличие от традиционных транзакционных систем, YTsaurus позволяет управлять изолированностью на уровне транзакции за счет разных режимов блокировок. Поведение YTsaurus соответствует уровню изоляции &lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A3%D1%80%D0%BE%D0%B2%D0%B5%D0%BD%D1%8C_%D0%B8%D0%B7%D0%BE%D0%BB%D0%B8%D1%80%D0%BE%D0%B2%D0%B0%D0%BD%D0%BD%D0%BE%D1%81%D1%82%D0%B8_%D1%82%D1%80%D0%B0%D0%BD%D0%B7%D0%B0%D0%BA%D1%86%D0%B8%D0%B9\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Read committed&lt;/a&gt; при взаимодействии с Кипарисом и &lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A3%D1%80%D0%BE%D0%B2%D0%B5%D0%BD%D1%8C_%D0%B8%D0%B7%D0%BE%D0%BB%D0%B8%D1%80%D0%BE%D0%B2%D0%B0%D0%BD%D0%BD%D0%BE%D1%81%D1%82%D0%B8_%D1%82%D1%80%D0%B0%D0%BD%D0%B7%D0%B0%D0%BA%D1%86%D0%B8%D0%B9\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Serializable&lt;/a&gt; при взаимодействии со статическими таблицами в рамках транзакций.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Долговечность (Durability)&lt;/strong&gt;. YTsaurus гарантирует сохранность изменений после фиксации транзакции. Сбои в оборудовании одного сервера, обесточивание или выключение системы не могут привести к потере сделанных изменений. Транзакции в системе могут переживать отключение системы и продолжать выполнение после восстановления системы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;При выполнении большинства действий в системе можно указать, в какой транзакции следует выполнять эти действия. Если транзакция не указана явно, элементарные действия с тем или иным узлом Кипариса, например, создание узла, чтение и запись его атрибутов, выполняются атомарно, однако для более сложных действий транзакцию нужно начинать явно. Одним таким примером является чтение таблицы: в отсутствие транзакции и snapshot-лока на таблицу нет гарантиии, что данные не удалят «под ногами». Тем не менее, если данные физически существуют и их удается прочитать (одним запросом), то прочитано будет консистентное состояние таблицы.&lt;/p&gt;\n&lt;p&gt;Транзакции представляют собой объекты типа &lt;code&gt;transaction&lt;/code&gt;. Список всех транзакций системы можно найти в Кипарисе, по адресу &lt;code&gt;//sys/transactions&lt;/code&gt;.&lt;br /&gt;\nУ транзакции может быть родитель — другая транзакция. Транзакции образуют дерево, корнями которого являются транзакции без родителей, называемые также транзакциями верхнего уровня. Список всех транзакций верхнего уровня доступен по адресу &lt;code&gt;//sys/topmost_transactions&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Транзакции делятся на &lt;strong&gt;мастер-транзакции&lt;/strong&gt; и &lt;strong&gt;таблет-транзакции&lt;/strong&gt;. Мастер-транзакции позволяют выполнять операции с метаинформацией мастера. Таблет-транзакции — только записывать данные в динамические таблицы.&lt;/p&gt;\n&lt;h2 id=\"master_transactions\"&gt;&lt;a href=\"ru/user-guide/storage/transactions.html#master_transactions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мастер-транзакции&lt;/span&gt;&lt;/a&gt;Мастер-транзакции&lt;/h2&gt;\n&lt;p&gt;Транзакционность в пределах мастер-серверов распространяется на версионируемые &lt;a href=\"user-guide/storage/objects.html\"&gt;объекты&lt;/a&gt;. В качестве примера таких объектов могут выступать файлы, таблицы и каталоги.&lt;/p&gt;\n&lt;h3 id=\"create\"&gt;&lt;a href=\"ru/user-guide/storage/transactions.html#create\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создание транзакции&lt;/span&gt;&lt;/a&gt;Создание транзакции&lt;/h3&gt;\n&lt;p&gt;Чтобы создать транзакцию, выполните команду &lt;code&gt;start_tx&lt;/code&gt;.&lt;br /&gt;\nПри этом можно указать родительскую транзакцию в опции &lt;code&gt;parent_id&lt;/code&gt;, и время жизни транзакции — в опции &lt;code&gt;timeout&lt;/code&gt;.&lt;br /&gt;\nВерхнее ограничение времени жизни транзакции в системе по умолчанию равно одному часу. Если указать &lt;code&gt;timeout&lt;/code&gt; более часа, оно окажется равным ограничению.&lt;br /&gt;\nВремя жизни отсчитывается с момента вызова &lt;code&gt;start_tx&lt;/code&gt; или с момента последнего вызова &lt;a href=\"ru/user-guide/storage/transactions.html#ping\"&gt;&lt;code&gt;ping_tx&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"ping\"&gt;&lt;a href=\"ru/user-guide/storage/transactions.html#ping\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Продление времени жизни транзакции&lt;/span&gt;&lt;/a&gt;Продление времени жизни транзакции&lt;/h3&gt;\n&lt;p&gt;Чтобы продлить время жизни транзакции, выполните команду &lt;code&gt;ping_tx&lt;/code&gt;.&lt;br /&gt;\nКаждое выполнение продлевает время жизни транзакции на интервал времени, равный &lt;code&gt;timeout&lt;/code&gt;. Если время с момента создания транзакции или последнего выполнения команды &lt;code&gt;ping_tx&lt;/code&gt; превысит &lt;code&gt;timeout&lt;/code&gt;, транзакция будет отменена.&lt;/p&gt;\n&lt;h3 id=\"commit\"&gt;&lt;a href=\"ru/user-guide/storage/transactions.html#commit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Завершение транзакции&lt;/span&gt;&lt;/a&gt;Завершение транзакции&lt;/h3&gt;\n&lt;p&gt;Транзакцию можно отменить командой &lt;code&gt;abort_tx&lt;/code&gt; или успешно завершить командой &lt;code&gt;commit_tx&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;При отмене транзакции, все вложенные транзакции тоже будут отменены.&lt;br /&gt;\nДля успешного завершения транзакции с вложенными транзакциями, сначала выполните команду &lt;code&gt;commit_tx&lt;/code&gt; на всех вложенных транзакциях. Попытка выполнить &lt;code&gt;commit_tx&lt;/code&gt; сразу на родительской транзакции вызовет ошибку.&lt;br /&gt;\nВо всех остальных случаях завершение транзакции не может привести к ошибке.&lt;/p&gt;\n&lt;p&gt;В YTsaurus используются &lt;a href=\"ru/user-guide/storage/transactions.html#locks\"&gt;пессимистические блокировки&lt;/a&gt;, поэтому возможные конфликты обнаруживаются по мере их возникновения — при взятии блокировок и создании объектов внутри транзакций, а не в момент завершения транзакции.&lt;/p&gt;\n&lt;h3 id=\"attributes\"&gt;&lt;a href=\"ru/user-guide/storage/transactions.html#attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атрибуты транзакций&lt;/span&gt;&lt;/a&gt;Атрибуты транзакций&lt;/h3&gt;\n&lt;p&gt;Помимо атрибутов, &lt;a href=\"user-guide/storage/objects.html#attributes\"&gt;присущих всем объектам&lt;/a&gt;, транзакции имеют следующие атрибуты:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Атрибут&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;integer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Таймаут транзакции в мс Может отсутствовать для некоторых системных транзакций.&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;title&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Текстовая строка-описание. Данный атрибут заполняется автоматически для всех системных транзакций, а для пользовательских — только если пользователь самостоятельно укажет его при создании транзакции.&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;last_ping_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;DateTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время последнего продления жизни транзакции. Может отсутствовать для некоторых системных транзакций.&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parent_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Guid&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор родительской транзакции.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;start_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;DateTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время создания транзакции.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;nested_transaction_ids&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;Guid&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список идентификаторов вложенных транзакций.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;staged_object_ids&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;Guid&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список идентификаторов объектов, которыми временно владеет транзакция.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;branched_node_ids&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;Guid&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список идентификаторов ответвленных узлов Кипариса.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;locked_node_ids&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;Guid&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список идентификаторов заблокированных узлов Кипариса.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;lock_ids&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;Guid&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список идентификаторов блокировок, созданных в транзакции.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;resource_usage&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ResourceUsageMap&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Атрибут, показывающий использование ресурсов в данной транзакции для каждого затронутого аккаунта.&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Транзакции, созданные системой, всегда имеют заполненный атрибут &lt;code&gt;title&lt;/code&gt;. Он содержит описание процесса, создавшего транзакцию.&lt;br /&gt;\nПользователям также рекомендуется использовать данный атрибут для описания назначения транзакции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"locks\"&gt;&lt;a href=\"ru/user-guide/storage/transactions.html#locks\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Блокировки&lt;/span&gt;&lt;/a&gt;Блокировки&lt;/h2&gt;\n&lt;p&gt;Версионирование узлов Кипариса связано с понятием блокировки. Беря блокировку на узел, транзакция выражает намерение работать с узлом в соответствии с &lt;a href=\"ru/user-guide/storage/transactions.html#locking_mode\"&gt;режимом блокировки&lt;/a&gt; и в случае успеха гарантируется, что:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;работать указанным образом с данным узлом разрешается;&lt;/li&gt;\n&lt;li&gt;узел для данной транзакции ответвлен.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Обратим внимание, что при взятии блокировки на узел возникает его ответвленная версия. При этом данный узел мог быть уже ответвлен ранее.&lt;/p&gt;\n&lt;p&gt;Из наличия блокировки на узле всегда следует наличие ответвленной версии этого узла. Однако обратное верно не всегда: в определенных сценариях могут возникать ответвленные, но не заблокированные узлы. При этом попытка работать с таким узлом всегда приведет к взятию блокировки над ним. Ответвление и взятие блокировки — связанные, но разные вещи.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Блокировка является полноценным объектом и обладает идентификатором. Список всех блокировок в системе доступен по адресу &lt;code&gt;//sys/locks&lt;/code&gt;. Для обращения к конкретной блокировке рекомендуется использовать адрес вида &lt;code&gt;#lock-id&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Список блокировок, взятых транзакцией, отображается в ее атрибуте &lt;code&gt;lock_ids&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"locking_mode\"&gt;&lt;a href=\"ru/user-guide/storage/transactions.html#locking_mode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Режимы блокировок&lt;/span&gt;&lt;/a&gt;Режимы блокировок&lt;/h3&gt;\n&lt;p&gt;Существуют следующие режимы блокировок: &lt;code&gt;snapshot&lt;/code&gt;, &lt;code&gt;exclusive&lt;/code&gt; и &lt;code&gt;shared&lt;/code&gt;.&lt;br /&gt;\nРежим блокировки определяет список допустимых действий транзакции, а также возможность взять другие блокировки:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;snapshot&lt;/code&gt; - транзакция получает возможность читать, но не модифицировать узел. Блокировка используется, чтобы взять read-only копию состояния узла Кипариса в контексте транзакции и зафиксировать состояние данного узла.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;​    Snapshot-блокировка берется только на сам узел, но не на путь до него в Кипарисе. Если продолжать обращаться к узлу по его пути, можно получить новый узел, размещенный по тому же пути.&lt;br /&gt;\nЧтобы гарантированно обратиться к snapshot-версии узла, используйте &lt;code&gt;id&lt;/code&gt; данного узла, который возвращает &lt;a href=\"api/commands.html#lock\"&gt;команда&lt;/a&gt; &lt;code&gt;lock&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;exclusive&lt;/code&gt; - транзакция получает возможность модифицировать состояние узла. При этом другие транзакции не могут менять узел.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;shared&lt;/code&gt; - транзакция получает возможность модифицировать определенную часть состояния узла. У других транзакций при этом остается возможность изменять другие части этого узла.&lt;/p&gt;\n&lt;p&gt;Существует три стандартных сценария использования данной блокировки:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Одновременное добавление данных в таблицу или файл из нескольких транзакций. При этом возможно только добавление, перезапись невозможна.&lt;/li&gt;\n&lt;li&gt;Одновременное создание нескольких различающихся по имени подкаталогов в пределах одного каталога из нескольких транзакций. Например, транзакция T1 может начаться и создать (или удалить) узел &lt;code&gt;//tmp/a&lt;/code&gt;, а транзакция T2 — начаться и создать (или удалить) &lt;code&gt;//tmp/b&lt;/code&gt;. При этом каждая из них возьмет по отдельной &lt;code&gt;shared&lt;/code&gt;-блокировке на &lt;code&gt;//tmp&lt;/code&gt;. Для выявления конфликтов каждая блокировка имеет атрибут &lt;code&gt;child_key&lt;/code&gt;, указывающий на то, какой ключ (подкаталог) ей заблокирован.&lt;/li&gt;\n&lt;li&gt;Одновременное создание нескольких различающихся по имени атрибутов в пределах одного узла из нескольких транзакций. Например, транзакция T1 может начаться и установить (изменить, удалить) атрибут &lt;code&gt;//tmp/@a&lt;/code&gt;, а транзакция T2 — начаться и установить (изменить, удалить) атрибут &lt;code&gt;//tmp/@b&lt;/code&gt;. Для выявления конфликтов каждая блокировка имеет атрибут &lt;code&gt;attribute_key&lt;/code&gt;, указывающий на то, какой ключ (имя атрибута) ей заблокирован.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Транзакции бывают вложенными. Под «другими транзакциями» здесь понимаются транзакции, неродственные данной, т. е. не имеющие с ней общего предка. Из-за вложенных транзакций, в частности, на узле может быть более одной &lt;code&gt;exclusive&lt;/code&gt; блокировки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"implicit_locks\"&gt;&lt;a href=\"ru/user-guide/storage/transactions.html#implicit_locks\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Неявные блокировки&lt;/span&gt;&lt;/a&gt;Неявные блокировки&lt;/h3&gt;\n&lt;p&gt;Транзакция может брать блокировки как явно, с помощью команды &lt;code&gt;lock&lt;/code&gt;, так и неявно. Неявное взятие блокировок может возникать при определенных взаимодействиях с узлами Кипариса, например:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Создание узла сопровождается взятием &lt;code&gt;exclusive&lt;/code&gt; блокировки.&lt;/li&gt;\n&lt;li&gt;Запись в таблицу или файл означает взятие &lt;code&gt;shared&lt;/code&gt; блокировки, если происходит добавление данных в таблицу, и &lt;code&gt;exclusive&lt;/code&gt; блокировки, если происходит ее перезапись.&lt;/li&gt;\n&lt;li&gt;Создание новой записи в каталоге, а также изменение или удаление существующей записи сопровождаются взятием &lt;code&gt;shared&lt;/code&gt; блокировки с соответствующим &lt;code&gt;child_key&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Создание нового атрибута узла, а также изменение или удаление существующего атрибута сопровождаются взятием &lt;code&gt;shared&lt;/code&gt; блокировки с соответствующим &lt;code&gt;attribute_key&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"locks_compatibility\"&gt;&lt;a href=\"ru/user-guide/storage/transactions.html#locks_compatibility\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Совместимость блокировок&lt;/span&gt;&lt;/a&gt;Совместимость блокировок&lt;/h3&gt;\n&lt;p&gt;Некоторые комбинации блокировок могут быть взяты одновременно. Формальные правила следующие:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;snapshot&lt;/code&gt; блокировку можно взять всегда. Если данной транзакцией &lt;code&gt;snapshot&lt;/code&gt; блокировка уже взята, попытка повторного взятия завершается без ошибок и не имеет эффекта.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;shared&lt;/code&gt; или &lt;code&gt;exclusive&lt;/code&gt; блокировку нельзя взять, если транзакцией или любым ее предком уже взята &lt;code&gt;snapshot&lt;/code&gt; блокировка.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;shared&lt;/code&gt; или &lt;code&gt;exclusive&lt;/code&gt; блокировку нельзя взять, если другой транзакцией, не являющейся предком данной, уже взята &lt;code&gt;exclusive&lt;/code&gt; блокировка.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;exclusive&lt;/code&gt; блокировку нельзя взять, если другой транзакцией, не являющейся предком данной, уже взята &lt;code&gt;shared&lt;/code&gt; блокировка.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;shared&lt;/code&gt; блокировку с заданным &lt;code&gt;child_key&lt;/code&gt; нельзя взять, если другой транзакцией, не являющейся предком данной, уже взята &lt;code&gt;shared&lt;/code&gt; блокировка с тем же &lt;code&gt;child_key&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;shared&lt;/code&gt; блокировку с заданным &lt;code&gt;attribute_key&lt;/code&gt; нельзя взять, если другой транзакцией, не являющейся предком данной, уже взята &lt;code&gt;shared&lt;/code&gt; блокировка с тем же &lt;code&gt;attribute_key&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;shared&lt;/code&gt; блокировку без &lt;code&gt;child_key&lt;/code&gt; и &lt;code&gt;attribute_key&lt;/code&gt; можно взять, несмотря на любые другие &lt;code&gt;shared&lt;/code&gt; блокировки.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"lock_operations\"&gt;&lt;a href=\"ru/user-guide/storage/transactions.html#lock_operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Операции над блокировками&lt;/span&gt;&lt;/a&gt;Операции над блокировками&lt;/h3&gt;\n&lt;p&gt;Для работы с блокировками существуют две команды: &lt;code&gt;lock&lt;/code&gt; и &lt;code&gt;unlock&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Команда &lt;code&gt;lock&lt;/code&gt; позволяет взять блокировку на узел Кипариса в указанной транзакции.&lt;/p&gt;\n&lt;p&gt;Команда &lt;code&gt;unlock&lt;/code&gt; выполняет обратное действие: снимает все явные блокировки с узла для заданной транзакции — как уже взятые, так и еще стоящие в &lt;a href=\"ru/user-guide/storage/transactions.html#locking_queue\"&gt;очереди на взятие блокировки&lt;/a&gt;.&lt;br /&gt;\nБлокировку можно снять, только если заблокированная ответвленная версия узла не содержит изменений по сравнению с оригиналом. Следовательно, явную &lt;code&gt;snapshot&lt;/code&gt; блокировку можно снять всегда. В противном случае команда завершится ошибкой.&lt;/p&gt;\n&lt;p&gt;Блокировки автоматически снимаются по завершении транзакции - как успешном, так и неуспешном. Поэтому снимать их вручную, как правило, нет необходимости.&lt;br /&gt;\nКоманду &lt;code&gt;unlock&lt;/code&gt; рекомендуется использовать только в одном случае — если нужно брать и отпускать блокировки, не завершая транзакцию. Как правило, такие транзакции призваны управлять синхронизацией сторонних сервисов.&lt;/p&gt;\n&lt;h3 id=\"locking_queue\"&gt;&lt;a href=\"ru/user-guide/storage/transactions.html#locking_queue\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Очередь на взятие блокировки&lt;/span&gt;&lt;/a&gt;Очередь на взятие блокировки&lt;/h3&gt;\n&lt;p&gt;С каждым узлом Кипариса может быть связана очередь ожидающих блокировок.&lt;/p&gt;\n&lt;p&gt;По умолчанию команда &lt;code&gt;lock&lt;/code&gt; пытается взять блокировку, и в случае, если узел уже заблокирован, возвращает ошибку. Если в команде &lt;code&gt;lock&lt;/code&gt; указать параметр &lt;code&gt;waitable&lt;/code&gt;, равный &lt;code&gt;true&lt;/code&gt;, блокировка встанет в очередь.&lt;br /&gt;\nЧтобы узнать, находится ли блокировка в очереди, запросите атрибут &lt;code&gt;state&lt;/code&gt;. Если блокировка находится в очереди, он будет равен &lt;code&gt;pending&lt;/code&gt;, если нет - &lt;code&gt;acquired&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Чтобы блокировка была действительно взята, например, эксклюзивно, ее состояние должно перейти в &lt;code&gt;acquired&lt;/code&gt;.&lt;br /&gt;\nЧтобы взять блокировку:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;вызовите команду &lt;code&gt;lock&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;наблюдайте в цикле за &lt;code&gt;state&lt;/code&gt;, пока он не примет значение &lt;code&gt;acquired&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"lock_attributes\"&gt;&lt;a href=\"ru/user-guide/storage/transactions.html#lock_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атрибуты блокировок&lt;/span&gt;&lt;/a&gt;Атрибуты блокировок&lt;/h3&gt;\n&lt;p&gt;Помимо атрибутов, присущих всем объектам, блокировки имеют следующие атрибуты:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Атрибут&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;state&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Состояние блокировки: &lt;code&gt;pending&lt;/code&gt; или &lt;code&gt;acquired&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Guid&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор транзакции, взявшей блокировку.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;mode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Режим блокировки: &lt;code&gt;shared&lt;/code&gt;, &lt;code&gt;exclusive&lt;/code&gt; или &lt;code&gt;snapshot&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;child_key&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ключ, по которому взята блокировка. Только для типа &lt;code&gt;shared&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;attribute_key&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя атрибута, по которому взята блокировка (только для типа &lt;code&gt;shared&lt;/code&gt;)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"versioning\"&gt;&lt;a href=\"ru/user-guide/storage/transactions.html#versioning\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Версионирование&lt;/span&gt;&lt;/a&gt;Версионирование&lt;/h2&gt;\n&lt;p&gt;Изменение состояния узла транзакцией представляет собой следующий трехфазный процесс:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Транзакция &lt;code&gt;T&lt;/code&gt;  берет на узел &lt;code&gt;N&lt;/code&gt; блокировку. При этом у узла &lt;code&gt;N&lt;/code&gt; возникает версия &lt;code&gt;N:T&lt;/code&gt;, которая образуется следующим образом:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;для &lt;code&gt;snapshot&lt;/code&gt; блокировки она ответвляется от версии &lt;code&gt;N:T'&lt;/code&gt;, где &lt;code&gt;T'&lt;/code&gt; — ближайший предок &lt;code&gt;T&lt;/code&gt;, ответвивший &lt;code&gt;N&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;для &lt;code&gt;shared&lt;/code&gt; и &lt;code&gt;exclusive&lt;/code&gt; блокировок от &lt;code&gt;N:T'&lt;/code&gt; ответвляется &lt;code&gt;N:T''&lt;/code&gt;, где &lt;code&gt;T''&lt;/code&gt; — дочка &lt;code&gt;T'&lt;/code&gt; ; от &lt;code&gt;N:T''&lt;/code&gt; ответвляется &lt;code&gt;N:T'''&lt;/code&gt;, где &lt;code&gt;T'''&lt;/code&gt; — дочка &lt;code&gt;T''&lt;/code&gt; и т.д. вплоть до &lt;code&gt;N:T&lt;/code&gt;. Иными словами, создается цепь ответвленных друг от друга версий узла для каждой транзакции от &lt;code&gt;T'&lt;/code&gt; до &lt;code&gt;T&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В случае, если такого &lt;code&gt;T'&lt;/code&gt; нет, используется реальная версия &lt;code&gt;N&lt;/code&gt;. Для данного описания не имеет значения, была ли взята блокировка явно или неявно.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Транзакция &lt;code&gt;T&lt;/code&gt; работает с узлом &lt;code&gt;N&lt;/code&gt;, при этом фактические изменения накапливаются в его версии &lt;code&gt;N:T&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Транзакция &lt;code&gt;T&lt;/code&gt; успешно завершается, при этом внесённые ей в &lt;code&gt;N:T&lt;/code&gt; изменения, если таковые имеются, вливаются в версию, от которой версия &lt;code&gt;N:T&lt;/code&gt; была ответвлена. Таким образом, эти изменения становятся видны родительской транзакции — или вообще всем, если &lt;code&gt;T&lt;/code&gt; была транзакцией верхнего уровня.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"ispolzovanie-tranzakcij-v-operaciyah\"&gt;&lt;a href=\"ru/user-guide/storage/transactions.html#ispolzovanie-tranzakcij-v-operaciyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование транзакций в операциях&lt;/span&gt;&lt;/a&gt;Использование транзакций в операциях&lt;/h2&gt;\n&lt;p&gt;При запуске операций планировщик создает набор транзакций, чтобы обеспечить определенную атомарность обработки данных в операции. Подробнее про схему работы можно прочитать в разделе &lt;a href=\"user-guide/data-processing/operations/overview.html#transactions\"&gt;Транзакционность обработки данных&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/storage/transactions.md","sourcePath":"ru/user-guide/storage/transactions.md"},"headings":[{"title":"Общие сведения","href":"ru/user-guide/storage/transactions.html#transactions","level":2},{"title":"Мастер-транзакции","href":"ru/user-guide/storage/transactions.html#master_transactions","level":2,"items":[{"title":"Создание транзакции","href":"ru/user-guide/storage/transactions.html#create","level":3},{"title":"Продление времени жизни транзакции","href":"ru/user-guide/storage/transactions.html#ping","level":3},{"title":"Завершение транзакции","href":"ru/user-guide/storage/transactions.html#commit","level":3},{"title":"Атрибуты транзакций","href":"ru/user-guide/storage/transactions.html#attributes","level":3}]},{"title":"Блокировки","href":"ru/user-guide/storage/transactions.html#locks","level":2,"items":[{"title":"Режимы блокировок","href":"ru/user-guide/storage/transactions.html#locking_mode","level":3},{"title":"Неявные блокировки","href":"ru/user-guide/storage/transactions.html#implicit_locks","level":3},{"title":"Совместимость блокировок","href":"ru/user-guide/storage/transactions.html#locks_compatibility","level":3},{"title":"Операции над блокировками","href":"ru/user-guide/storage/transactions.html#lock_operations","level":3},{"title":"Очередь на взятие блокировки","href":"ru/user-guide/storage/transactions.html#locking_queue","level":3},{"title":"Атрибуты блокировок","href":"ru/user-guide/storage/transactions.html#lock_attributes","level":3}]},{"title":"Версионирование","href":"ru/user-guide/storage/transactions.html#versioning","level":2},{"title":"Использование транзакций в операциях","href":"ru/user-guide/storage/transactions.html#ispolzovanie-tranzakcij-v-operaciyah","level":2}],"title":"Транзакции"},"router":{"pathname":"ru/user-guide/storage/transactions","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html
