            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе собрана информация про YSON — JSON-подобный формат данных.&lt;/p&gt;\n&lt;p&gt;К основным отличиям YSON от JSON относится:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Поддержка бинарного представления скалярных типов (чисел, строк и булевого типа);&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/user-guide/storage/yson.html#attributes\"&gt;Атрибуты&lt;/a&gt;: произвольный словарь, который можно установить дополнительно на литерал любого — даже скалярного — типа.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Кроме того, существуют синтаксические отличия:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Вместо запятой в качестве разделителя используется точка с запятой;&lt;/li&gt;\n&lt;li&gt;В словарях ключ от значения отделяется не двоеточием, а знаком равенства: &lt;code&gt;=&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Строковые литералы не обязательно всегда заключать в кавычки — только если возникает неоднозначность при парсинге;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Имеется следующий набор &lt;strong&gt;скалярных&lt;/strong&gt; типов:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"ru/user-guide/storage/yson.html#string\"&gt;Строки&lt;/a&gt; (&lt;code&gt;string&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/user-guide/storage/yson.html#int\"&gt;Знаковые&lt;/a&gt; и &lt;a href=\"ru/user-guide/storage/yson.html#uint\"&gt;беззнаковые&lt;/a&gt; 64-битные целые числа (&lt;code&gt;int64&lt;/code&gt; и &lt;code&gt;uint64&lt;/code&gt; );&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/user-guide/storage/yson.html#double\"&gt;Числа с плавающей точкой&lt;/a&gt; двойной точности (&lt;code&gt;double&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/user-guide/storage/yson.html#boolean\"&gt;Булев&lt;/a&gt; (логический) тип (&lt;code&gt;boolean&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/user-guide/storage/yson.html#entity\"&gt;Специальный тип entity&lt;/a&gt;, имеющий всего один литерал (&lt;code&gt;#&lt;/code&gt;).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Скалярные типы обычно имеют как текстовое, так и бинарное представление.&lt;/p&gt;\n&lt;p&gt;Есть два &lt;strong&gt;композитных&lt;/strong&gt; типа:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"ru/user-guide/storage/yson.html#list\"&gt;Список&lt;/a&gt; (&lt;code&gt;list&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/user-guide/storage/yson.html#map\"&gt;Словарь&lt;/a&gt; (&lt;code&gt;map&lt;/code&gt;).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"scalar_types\"&gt;&lt;a href=\"ru/user-guide/storage/yson.html#scalar_types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Скалярные типы&lt;/span&gt;&lt;/a&gt;Скалярные типы&lt;/h2&gt;\n&lt;h3 id=\"string\"&gt;&lt;a href=\"ru/user-guide/storage/yson.html#string\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Строки&lt;/span&gt;&lt;/a&gt;Строки&lt;/h3&gt;\n&lt;p&gt;Токены строк бывают трёх видов:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Идентификаторы&lt;/strong&gt; задаются регулярным выражением &lt;code&gt; [A-Za-z_][A-Za-z0-9_.\\-]*&lt;/code&gt;, расширенные C-идентификаторы, отличие в символах &lt;code&gt;-&lt;/code&gt;,&lt;code&gt;.&lt;/code&gt;. Идентификатор задает строку с идентичным ему содержимым и используется в первую очередь для краткости (не нужно ставить кавычки).&lt;/p&gt;\n&lt;p&gt;Примеры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;abc123&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;_&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;a-b&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Текстовые строки&lt;/strong&gt; — &lt;a href=\"https://en.wikipedia.org/wiki/Escape_sequences_in_C\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;C-escaped&lt;/a&gt; строки в двойных кавычках.&lt;/p&gt;\n&lt;p&gt;Примеры&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;\"abc123\"&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;\"\"&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;\"quotation-mark: \\\", backslash: \\\\, tab: \\t, unicode: \\xEA\"&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Бинарные строки&lt;/strong&gt;: &lt;code&gt;\\x01 + length (protobuf sint32 wire format) + data (&amp;lt;length&amp;gt; bytes)&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"int\"&gt;&lt;a href=\"ru/user-guide/storage/yson.html#int\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Знаковые 64-битные целые числа ()&lt;/span&gt;&lt;/a&gt;Знаковые 64-битные целые числа (&lt;code&gt;int64&lt;/code&gt;)&lt;/h3&gt;\n&lt;p&gt;Два способа записи:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Текстовый&lt;/strong&gt; (&lt;code&gt;0&lt;/code&gt;, &lt;code&gt;123&lt;/code&gt;, &lt;code&gt;-123&lt;/code&gt;, &lt;code&gt;+123&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Бинарный&lt;/strong&gt;: &lt;code&gt;\\x02 + value (protobuf sint64 wire format)&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"uint\"&gt;&lt;a href=\"ru/user-guide/storage/yson.html#uint\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Беззнаковые 64-битные целые числа ()&lt;/span&gt;&lt;/a&gt;Беззнаковые 64-битные целые числа (&lt;code&gt;uint64&lt;/code&gt;)&lt;/h3&gt;\n&lt;p&gt;Два способа записи:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Текстовый&lt;/strong&gt; (&lt;code&gt;10000000000000&lt;/code&gt;, &lt;code&gt;123u&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Бинарный&lt;/strong&gt;: &lt;code&gt;\\x06 + value (protobuf uint64 wire format)&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"double\"&gt;&lt;a href=\"ru/user-guide/storage/yson.html#double\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Числа с плавающей точкой ()&lt;/span&gt;&lt;/a&gt;Числа с плавающей точкой (&lt;code&gt;double&lt;/code&gt;)&lt;/h3&gt;\n&lt;p&gt;Два способа записи:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Текстовый&lt;/strong&gt;: &lt;code&gt;0.0&lt;/code&gt;, &lt;code&gt;-1.0&lt;/code&gt;, &lt;code&gt;1e-9&lt;/code&gt;, &lt;code&gt;1.5E+9&lt;/code&gt;, &lt;code&gt;32E1&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Бинарный&lt;/strong&gt;: &lt;code&gt;\\x03 + protobuf double wire format&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Текстовое представление чисел с плавающей точкой включает в себя округление, которое может привести к тому, что при обратном парсинге значение окажется иным. В случае, если вам важна точность, следует использовать бинарное представление.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"boolean\"&gt;&lt;a href=\"ru/user-guide/storage/yson.html#boolean\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Булевы литералы ()&lt;/span&gt;&lt;/a&gt;Булевы литералы (&lt;code&gt;boolean&lt;/code&gt;)&lt;/h3&gt;\n&lt;p&gt;Два способа записи:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Текстовый&lt;/strong&gt; (&lt;code&gt;%false&lt;/code&gt;, &lt;code&gt;%true&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Бинарный&lt;/strong&gt; (&lt;code&gt;\\x04&lt;/code&gt;, &lt;code&gt;\\x05&lt;/code&gt;).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"entity\"&gt;&lt;a href=\"ru/user-guide/storage/yson.html#entity\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Entity ()&lt;/span&gt;&lt;/a&gt;Entity (&lt;code&gt;entity&lt;/code&gt;)&lt;/h3&gt;\n&lt;p&gt;Entity представляет собой атомарное скалярное значение, не имеющее собственного содержимого. Сценарии, в которых данный тип может быть полезен, разнообразны. Например, часто entity обозначает null. Также при запросе &lt;code&gt;get&lt;/code&gt; на поддерево &lt;a href=\"user-guide/storage/cypress.html\"&gt;Кипариса&lt;/a&gt; &lt;a href=\"user-guide/storage/objects.html#files\"&gt;файлы&lt;/a&gt; и &lt;a href=\"user-guide/storage/objects.html#tables\"&gt;таблицы&lt;/a&gt; возвращаются в виде entities (полезные данные при этом хранятся в &lt;a href=\"ru/user-guide/storage/yson.html#attributes\"&gt;атрибутах&lt;/a&gt; данного узла).&lt;/p&gt;\n&lt;p&gt;Лексически entity кодируется символом диеза: &lt;code&gt;#&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"special_literals\"&gt;&lt;a href=\"ru/user-guide/storage/yson.html#special_literals\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выделенные литералы&lt;/span&gt;&lt;/a&gt;Выделенные литералы&lt;/h3&gt;\n&lt;p&gt;Специальные токены:&lt;br /&gt;\n&lt;code&gt;;&lt;/code&gt;, &lt;code&gt;=&lt;/code&gt;, &lt;code&gt;#&lt;/code&gt;, &lt;code&gt;[&lt;/code&gt;, &lt;code&gt;]&lt;/code&gt;, &lt;code&gt;{&lt;/code&gt;, &lt;code&gt;}&lt;/code&gt;, &lt;code&gt;&amp;lt;&lt;/code&gt;, &lt;code&gt;&amp;gt;&lt;/code&gt;, &lt;code&gt;)&lt;/code&gt;, &lt;code&gt;/&lt;/code&gt;, &lt;code&gt;@&lt;/code&gt;, &lt;code&gt;!&lt;/code&gt;, &lt;code&gt;+&lt;/code&gt;, &lt;code&gt;^&lt;/code&gt;, &lt;code&gt;:&lt;/code&gt;, &lt;code&gt;,&lt;/code&gt;, &lt;code&gt;~&lt;/code&gt;.&lt;br /&gt;\nНе все эти символы используются в YSON, некоторые используются в &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPath&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"composite_types\"&gt;&lt;a href=\"ru/user-guide/storage/yson.html#composite_types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Композитные типы&lt;/span&gt;&lt;/a&gt;Композитные типы&lt;/h2&gt;\n&lt;h3 id=\"list\"&gt;&lt;a href=\"ru/user-guide/storage/yson.html#list\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список ()&lt;/span&gt;&lt;/a&gt;Список (&lt;code&gt;list&lt;/code&gt;)&lt;/h3&gt;\n&lt;p&gt;Задаётся следующим образом: &lt;code&gt;[value; ...; value]&lt;/code&gt;, где &lt;code&gt;value&lt;/code&gt; — литералы произвольных скалярных или композитных типов.&lt;/p&gt;\n&lt;p&gt;Пример: &lt;code&gt;[1; \"hello\"; {a=1; b=2}]&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"map\"&gt;&lt;a href=\"ru/user-guide/storage/yson.html#map\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Словарь ()&lt;/span&gt;&lt;/a&gt;Словарь (&lt;code&gt;map&lt;/code&gt;)&lt;/h3&gt;\n&lt;p&gt;Задаётся следующим образом: &lt;code&gt;{key = value; ...; key = value}&lt;/code&gt;. Здесь &lt;code&gt;*key*&lt;/code&gt; — литералы строкового типа, а &lt;code&gt;value&lt;/code&gt; — литералы произвольных скалярных или композитных типов.&lt;/p&gt;\n&lt;p&gt;Пример: &lt;code&gt;{a = \"hello\"; \"38 parrots\" = [38]}&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"attributes\"&gt;&lt;a href=\"ru/user-guide/storage/yson.html#attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атрибуты&lt;/span&gt;&lt;/a&gt;Атрибуты&lt;/h3&gt;\n&lt;p&gt;На любой литерал в YSON можно установить атрибуты. Формат записи: &lt;code&gt;&amp;lt;key = value; ...; key = value&amp;gt; value&lt;/code&gt;. Внутри угловых скобок синтаксис аналогичен словарю. Например, &lt;code&gt;&amp;lt;a = 10; b = [7,7,8]&amp;gt;\"some-string\"&lt;/code&gt; или &lt;code&gt;&amp;lt;\"44\" = 44&amp;gt;44&lt;/code&gt;. Но чаще всего атрибуты можно встретить на литералах типа &lt;code&gt;entity&lt;/code&gt;, например, &lt;code&gt;&amp;lt;id=\"aaad6921-b5704588-17990259-7b88bad3\"&amp;gt;#&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"grammar\"&gt;&lt;a href=\"ru/user-guide/storage/yson.html#grammar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Грамматика&lt;/span&gt;&lt;/a&gt;Грамматика&lt;/h2&gt;\n&lt;p&gt;YSON-данные бывают трех типов:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Node&lt;/strong&gt; (одно дерево, в примере — &lt;code&gt;&amp;lt;tree&amp;gt;&lt;/code&gt;)&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;ListFragment&lt;/strong&gt; (значения, разделенные &lt;code&gt;;&lt;/code&gt;, в примере — &lt;code&gt;&amp;lt;list-fragment&amp;gt;&lt;/code&gt;)&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;MapFragment&lt;/strong&gt; (пары ключ-значение, разделенные &lt;code&gt;;&lt;/code&gt;, в примере — &lt;code&gt;&amp;lt;map-fragment&amp;gt;&lt;/code&gt;)&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Грамматика (определяется с точностью до пробельных символов, которые могут быть в произвольном количестве добавлены и удалены между токенами):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;          &amp;lt;tree&amp;gt; = [ &amp;lt;attributes&amp;gt; ], &amp;lt;object&amp;gt;;\n        &amp;lt;object&amp;gt; = &amp;lt;scalar&amp;gt; | &amp;lt;map&amp;gt; | &amp;lt;list&amp;gt; | &amp;lt;entity&amp;gt;;\n\n        &amp;lt;scalar&amp;gt; = &amp;lt;string&amp;gt; | &amp;lt;int64&amp;gt; | &amp;lt;uint64&amp;gt; | &amp;lt;double&amp;gt; | &amp;lt;boolean&amp;gt;;\n          &amp;lt;list&amp;gt; = \"[\", &amp;lt;list-fragment&amp;gt;, \"]\";\n           &amp;lt;map&amp;gt; = \"{\", &amp;lt;map-fragment&amp;gt;, \"}\";\n        &amp;lt;entity&amp;gt; = \"#\";\n    &amp;lt;attributes&amp;gt; = \"&amp;lt;\", &amp;lt;map-fragment&amp;gt;, \"&amp;gt;\";\n\n &amp;lt;list-fragment&amp;gt; = { &amp;lt;list-item&amp;gt;, \";\" }, [ &amp;lt;list-item&amp;gt; ];\n     &amp;lt;list-item&amp;gt; = &amp;lt;tree&amp;gt;;\n\n  &amp;lt;map-fragment&amp;gt; = { &amp;lt;key-value-pair&amp;gt;, \";\" }, [ &amp;lt;key-value-pair&amp;gt; ];\n&amp;lt;key-value-pair&amp;gt; = &amp;lt;string&amp;gt;, \"=\", &amp;lt;tree&amp;gt;;  % Key cannot be empty\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"302\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-302\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-302\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-302.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Символ &lt;code&gt;;&lt;/code&gt; после последнего элемента внутри &lt;code&gt;&amp;lt;list-fragment&amp;gt;&lt;/code&gt;  и &lt;code&gt;&amp;lt;map-fragment&amp;gt;&lt;/code&gt;  может быть опущен. Следующие конструкции следует считать валидными при чтении:&lt;/p&gt;\n&lt;table&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;C &lt;code&gt;;&lt;/code&gt; на конце&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Сокращенная запись&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;a=b;&amp;gt;c\n{a=b;}\n1;2;3;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"322\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-322\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-322\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-322.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/td&gt;\n&lt;td&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;a=b&amp;gt;c\n{a=b}\n1;2;3\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"325\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-325\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-325\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-325.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"ru/user-guide/storage/yson.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Map (Node visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-344\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-344.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;List (Node)&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[ 1; 2; 3; 4; 5 ]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"350\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-350\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-350\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-350.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;String (Node)&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;foobar\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"356\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-356\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-356\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-356.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;\"hello world\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"357\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-357\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-357\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-357.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Int64 (Node) &lt;code&gt;42&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Double (Node) &lt;code&gt;3.1415926&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;ListFragment&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{ key = a; value = 0 };\n{ key = b; value = 1 };\n{ key = c; value = 2; unknown_value = [] }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"373\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-373\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-373\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-373.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;MapFragment&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;do = create; type = table; scheme = {}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"379\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-379\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-379\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-379.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;HomeDirectory (Node)&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{ home = { sandello = { mytable = &amp;lt;type = table&amp;gt; # ; anothertable = &amp;lt;type = table&amp;gt; # } ; monster = { } } }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"385\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-385\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-385\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-385.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"working_from_code\"&gt;&lt;a href=\"ru/user-guide/storage/yson.html#working_from_code\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с YSON из кода&lt;/span&gt;&lt;/a&gt;Работа с YSON из кода&lt;/h2&gt;\n&lt;p&gt;Обычно пользователям не приходится работать напрямую с YSON. При использовании одного из официальных YTsaurus-клиентов YSON-структуры будут выражаться в одном из перечисленных ниже видов:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;C++&lt;/strong&gt;:&lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/library/cpp/yson/node/node.h\" target=\"_blank\" rel=\"noreferrer noopener\"&gt; &lt;code&gt;TNode&lt;/code&gt;&lt;/a&gt; — класс, обеспечивающий динамическое DOM-подобное представление YSON-документа;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Python&lt;/strong&gt;: &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/yt/python/yt/yson/yson_types.py\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;&lt;code&gt;YsonType&lt;/code&gt;&lt;/a&gt; — YSON-типы мимикрируют под Python типы. YSON-атрибуты объекта &lt;code&gt;x&lt;/code&gt; можно получить так: &lt;code&gt;x.attributes&lt;/code&gt;, это Python словарь;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Java&lt;/strong&gt;: &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/yt/java/yson-tree/src/main/java/tech/ytsaurus/ysontree/YTreeNode.java\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;&lt;code&gt;YTreeNode&lt;/code&gt;&lt;/a&gt; — интерфейс, обеспечивающий динамическое DOM-подобное представление YSON-документа.&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/storage/yson.md","sourcePath":"ru/user-guide/storage/yson.md"},"headings":[{"title":"Скалярные типы","href":"ru/user-guide/storage/yson.html#scalar_types","level":2,"items":[{"title":"Строки","href":"ru/user-guide/storage/yson.html#string","level":3},{"title":"Знаковые 64-битные целые числа (int64)","href":"ru/user-guide/storage/yson.html#int","level":3},{"title":"Беззнак
