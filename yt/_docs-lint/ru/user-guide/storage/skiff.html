            {"data":{"leading":false,"html":"&lt;p&gt;В первой части раздела описана библиотека skiff serialization library — &lt;code&gt;library/cpp/skiff&lt;/code&gt;, которая позволяет кодировать структурированные данные, в том числе не являющиеся таблицами в YTsaurus.&lt;br /&gt;\nВо второй части описано, как эта библиотека используется для эффективной передачи табличных данных между job_proxy и пользовательским кодом.&lt;/p&gt;\n&lt;p&gt;Skiff (от schemaful format) — один из &lt;a href=\"user-guide/storage/formats.html\"&gt;форматов&lt;/a&gt; передачи схематизированных данных между job_proxy и джобом.&lt;/p&gt;\n&lt;p&gt;Цели формата:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Оптимизировать время сериализации и десериализации данных для схематизированных данных.&lt;/li&gt;\n&lt;li&gt;Поддержать все типы, которые поддерживает YTsaurus.&lt;/li&gt;\n&lt;li&gt;Поддержать чтение даже нестрого типизированных таблиц.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"sravnenie-s-drugimi-formatami\"&gt;&lt;a href=\"ru/user-guide/storage/skiff.html#sravnenie-s-drugimi-formatami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сравнение с другими форматами&lt;/span&gt;&lt;/a&gt;Сравнение с другими форматами&lt;/h2&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;protobuf&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Protobuf обладает следующими недостатками:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Для некоторых клиентов (YQL) структура сообщений определяется в runtime. Парсить и писать protobuf для неизвестного типа неудобно.&lt;/li&gt;\n&lt;li&gt;Protobuf поддерживает обратную совместимость. Поэтому появляются теги, которые нужно поддерживать в актуальном состоянии.&lt;/li&gt;\n&lt;li&gt;Порядок полей в Protobuf не специфицирован. Поэтому появляются лишние branch по тегам на каждое поле.&lt;/li&gt;\n&lt;li&gt;Protobuf часто использует тип varint. В случае job_proxy, которая общается с джобом через pipe дешевле записать uint64-число целиком, чем сериализовать и десериализовать varint.&lt;/li&gt;\n&lt;li&gt;Из-за использования varint строки и вложенные сообщения префиксируются длиной, чтобы сериализовать сообщение, необходимо обойти структуру дважды.&lt;/li&gt;\n&lt;li&gt;Repeated поля в protobuf необязательно должны быть локализованы в одной части message, то есть начало list может быть в начале message, конец — в конце. Это осложняет написание корректных парсеров.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;flatbuffers&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;ul&gt;\n&lt;li&gt;Для некоторых клиентов (YQL) структура сообщений определяется в runtime. Парсить и писать flatbuffers для неизвестного типа неудобно из-за отсутствия reflection.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"skiff-serialization-library\"&gt;&lt;a href=\"ru/user-guide/storage/skiff.html#skiff-serialization-library\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Skiff serialization library&lt;/span&gt;&lt;/a&gt;Skiff serialization library&lt;/h2&gt;\n&lt;p&gt;Формат сериализации skiff является схематизированным. Чтобы прочитать и интерпретировать данные, необходимо знать схему этих данных.&lt;/p&gt;\n&lt;h3 id=\"skiff-schema\"&gt;&lt;a href=\"ru/user-guide/storage/skiff.html#skiff-schema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Skiff Schema&lt;/span&gt;&lt;/a&gt;Skiff Schema&lt;/h3&gt;\n&lt;p&gt;Схема описывает структуру закодированного значения и способ, которым его закодировали.&lt;br /&gt;\nОна имеет древовидную структуру. Дерево из одного узла может быть валидной схемой. Порядок детей узла в дереве важен. Каждому узлу соответствует тип кодирования — &lt;code&gt;wire_type&lt;/code&gt;, листьям соответствуют простые типы, остальным узлам дерева соответствуют составные типы. Узлы skiff-схемы могут иметь имена, имена не влияют на кодирование данных и служат для установления соответствия skiff-схемы со схемой таблицы.&lt;/p&gt;\n&lt;h4 id=\"prostye-tipy\"&gt;&lt;a href=\"ru/user-guide/storage/skiff.html#prostye-tipy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Простые типы&lt;/span&gt;&lt;/a&gt;Простые типы&lt;/h4&gt;\n&lt;h5 id=\"nothing\"&gt;&lt;a href=\"ru/user-guide/storage/skiff.html#nothing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nothing&lt;/span&gt;&lt;/a&gt;Nothing&lt;/h5&gt;\n&lt;p&gt;&lt;code&gt;nothing&lt;/code&gt; — отсутствие значения, специальный тип, который может быть использован только как дочерний составных типов &lt;code&gt;Variant*&lt;/code&gt; / &lt;code&gt;RepeatedVariant*&lt;/code&gt;.&lt;br /&gt;\nКодируется пустой строкой.&lt;/p&gt;\n&lt;h5 id=\"boolean\"&gt;&lt;a href=\"ru/user-guide/storage/skiff.html#boolean\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boolean&lt;/span&gt;&lt;/a&gt;Boolean&lt;/h5&gt;\n&lt;p&gt;&lt;code&gt;boolean&lt;/code&gt; — булев тип.&lt;br /&gt;\nКодируется одним байтом: &lt;code&gt;001&lt;/code&gt; для &lt;code&gt;true&lt;/code&gt;, &lt;code&gt;000&lt;/code&gt; для &lt;code&gt;false&lt;/code&gt;.&lt;br /&gt;\n&lt;u&gt;Примеры&lt;/u&gt;: &lt;code&gt;\\x01&lt;/code&gt;, &lt;code&gt;\\x00&lt;/code&gt;.&lt;/p&gt;\n&lt;h5 id=\"int64-/-uint64\"&gt;&lt;a href=\"ru/user-guide/storage/skiff.html#int64-/-uint64\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Int64 / Uint64&lt;/span&gt;&lt;/a&gt;Int64 / Uint64&lt;/h5&gt;\n&lt;p&gt;&lt;code&gt;uint64&lt;/code&gt; / &lt;code&gt;int64&lt;/code&gt; — целые числа.&lt;br /&gt;\nКодируется 8-байтным числом, закодированным в little endian.&lt;br /&gt;\n&lt;u&gt;Примеры&lt;/u&gt;: &lt;code&gt;\\x2a\\x00\\x00\\x00\\x00\\x00\\x00\\x00&lt;/code&gt; (42), &lt;code&gt;\\x94\\x88\\x01\\x00\\x00\\x00\\x00\\x00&lt;/code&gt; (100500).&lt;/p&gt;\n&lt;h5 id=\"double\"&gt;&lt;a href=\"ru/user-guide/storage/skiff.html#double\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Double&lt;/span&gt;&lt;/a&gt;Double&lt;/h5&gt;\n&lt;p&gt;&lt;code&gt;double&lt;/code&gt; — 8-байтное представление double.&lt;br /&gt;\n&lt;u&gt;Примеры&lt;/u&gt;: &lt;code&gt;\\x9B\\x91\\x04\\x8B\\x0A\\xBF\\x05\\x40&lt;/code&gt; (2.718281828).&lt;/p&gt;\n&lt;h5 id=\"string32\"&gt;&lt;a href=\"ru/user-guide/storage/skiff.html#string32\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;String32&lt;/span&gt;&lt;/a&gt;String32&lt;/h5&gt;\n&lt;p&gt;&lt;code&gt;string32&lt;/code&gt; — длина строки, закодированная как 32-битный uint в little endian, затем сама строка.&lt;br /&gt;\n&lt;u&gt;Примеры&lt;/u&gt;:&lt;code&gt;\\x06\\x00\\x00\\x00foobar&lt;/code&gt;&lt;/p&gt;\n&lt;h5 id=\"yson32\"&gt;&lt;a href=\"ru/user-guide/storage/skiff.html#yson32\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson32&lt;/span&gt;&lt;/a&gt;Yson32&lt;/h5&gt;\n&lt;p&gt;&lt;code&gt;yson32&lt;/code&gt; — значение произвольного типа.&lt;br /&gt;\nКодируется длина закодированного YSON, закодированная как 32-битный uint, за которым следует сам закодированный YSON.&lt;br /&gt;\n&lt;u&gt;Примеры&lt;/u&gt;: &lt;code&gt;\\x09\\x00\\x00\\x00{foo=bar}&lt;/code&gt;, &lt;code&gt;\\x07\\x00\\x00\\x00100500u&lt;/code&gt;&lt;/p&gt;\n&lt;h4 id=\"sostavnye-tipy\"&gt;&lt;a href=\"ru/user-guide/storage/skiff.html#sostavnye-tipy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Составные типы&lt;/span&gt;&lt;/a&gt;Составные типы&lt;/h4&gt;\n&lt;h5 id=\"variant8-/-variant16\"&gt;&lt;a href=\"ru/user-guide/storage/skiff.html#variant8-/-variant16\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Variant8 / variant16&lt;/span&gt;&lt;/a&gt;Variant8 / variant16&lt;/h5&gt;\n&lt;p&gt;&lt;code&gt;variant8&lt;/code&gt; / &lt;code&gt;variant16&lt;/code&gt; — алгебраические типы данных.&lt;/p&gt;\n&lt;p&gt;Кодируются 8-битным (для &lt;code&gt;variant8&lt;/code&gt;) или 16-битным (для &lt;code&gt;variant16&lt;/code&gt;) беззнаковым числом &lt;code&gt;i&lt;/code&gt; — тегом, за которым следует значение, описанное типом дочернего узла под индексом &lt;code&gt;i&lt;/code&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;variant8&lt;/code&gt; / &lt;code&gt;variant16&lt;/code&gt; может иметь одним из своих узлов тип &lt;code&gt;nothing&lt;/code&gt;. Так как тип &lt;code&gt;nothing&lt;/code&gt; кодируется пустой строкой, то, например, строка &lt;code&gt;\\x00&lt;/code&gt; является валидным значением типа &lt;code&gt;variant8&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Битности определяются соображениями практичности, тег варианта будет кодировать присутствие или отсутствие значения или индекс таблицы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h5 id=\"repeatedvariant8-/-repeatedvariant16\"&gt;&lt;a href=\"ru/user-guide/storage/skiff.html#repeatedvariant8-/-repeatedvariant16\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RepeatedVariant8 / RepeatedVariant16&lt;/span&gt;&lt;/a&gt;RepeatedVariant8 / RepeatedVariant16&lt;/h5&gt;\n&lt;p&gt;&lt;code&gt;repeated_variant8&lt;/code&gt; / &lt;code&gt;repeated_variant16&lt;/code&gt; — список variant.&lt;br /&gt;\nКодируется как непрерывная последовательность вариантов 8-битным (для &lt;code&gt;repeated_variant8&lt;/code&gt;) или 16-битным (для &lt;code&gt;repeated_variant16&lt;/code&gt;) тегом, оканчивающаяся специальным тегом &lt;code&gt;0xFF&lt;/code&gt; (для &lt;code&gt;repeated_variant8&lt;/code&gt;) или &lt;code&gt;0xFFFF&lt;/code&gt; (для для &lt;code&gt;repeated_variant16&lt;/code&gt;), обозначающим конец последовательности.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Аналогично обычному &lt;code&gt;variant8&lt;/code&gt; может иметь одним из дочерних узлов тип &lt;code&gt;nothing&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Битность типа определяется соображениями практичности для задачи формата передачи табличных данных (по сути, тег варианта будет использоваться как индекс sparse-колонки).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h5 id=\"tuple\"&gt;&lt;a href=\"ru/user-guide/storage/skiff.html#tuple\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tuple&lt;/span&gt;&lt;/a&gt;Tuple&lt;/h5&gt;\n&lt;p&gt;&lt;code&gt;tuple&lt;/code&gt; — кортеж значений фиксированного размера.&lt;br /&gt;\nКодируется последовательностью значений, первое значение имеет тип первого дочернего узла, второе значение — тип второго дочернего узла и так далее.&lt;/p&gt;\n&lt;h2 id=\"ispolzovanie-skiff-serialization-library-dlya-peredachi-tablichnyh-dannyh\"&gt;&lt;a href=\"ru/user-guide/storage/skiff.html#ispolzovanie-skiff-serialization-library-dlya-peredachi-tablichnyh-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование skiff serialization library для передачи табличных данных&lt;/span&gt;&lt;/a&gt;Использование skiff serialization library для передачи табличных данных&lt;/h2&gt;\n&lt;h3 id=\"skiff-shema-tablicy\"&gt;&lt;a href=\"ru/user-guide/storage/skiff.html#skiff-shema-tablicy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Skiff-схема таблицы&lt;/span&gt;&lt;/a&gt;Skiff-схема таблицы&lt;/h3&gt;\n&lt;p&gt;В атрибутах формата для каждой передаваемой таблицы, передается skiff-схема таблицы &lt;code&gt;table_skiff_schema&lt;/code&gt;. Это skiff-схема, на которую накладывается ряд ограничений.&lt;/p&gt;\n&lt;p&gt;Поведение входного и выходного форматов отличается. Входной формат склеивает все таблицы и передаёт их через один pipe, а выходной формат читает каждую таблицу из своего pipe.&lt;/p&gt;\n&lt;p&gt;На вход джобу приходят последовательно значения с общей схемой. Общая схема имеет своим корнем узел &lt;code&gt;Variant16&lt;/code&gt;, который в качестве детей имеет все skiff-схемы таблиц.&lt;br /&gt;\nИз выходного потока для i-й выходной таблицы job_proxy пытается вычитать значения, которые описываются схемой с корневым узлом &lt;code&gt;Variant16&lt;/code&gt; с единственным ребёнком — skiff-схема i-й таблицы.&lt;/p&gt;\n&lt;h3 id=\"ogranicheniya-na-skiff-shemu-tablicy\"&gt;&lt;a href=\"ru/user-guide/storage/skiff.html#ogranicheniya-na-skiff-shemu-tablicy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения на skiff-схему таблицы.&lt;/span&gt;&lt;/a&gt;Ограничения на skiff-схему таблицы.&lt;/h3&gt;\n&lt;p&gt;На схему для передачи табличных данных накладываются ограничения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Корневым узлом skiff-схемы таблицы должен быть узел типа &lt;code&gt;tuple&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Все дети корневого узла skiff-схемы таблицы должны иметь имена. По ним YTsaurus определяет, в какое поле поместить значение из той или иной колонки.&lt;/li&gt;\n&lt;li&gt;Среди имён детей корневого узла skiff-схемы таблицы могут встречаться специальные имена, начинающиеся с символа &lt;code&gt;$&lt;/code&gt;. Те дети, у которых имена не начинаются с этого специального символа, образуют множество dense-узлов. Это имена колонок, значения из которых будут помещены в эти поля.&lt;/li&gt;\n&lt;li&gt;Среди детей корневого узла skiff-схемы таблицы может быть узел, помеченный именем &lt;code&gt;$other_columns&lt;/code&gt;. Этот узел должен иметь тип &lt;code&gt;yson32&lt;/code&gt; и быть последним.&lt;/li&gt;\n&lt;li&gt;Среди детей корневого узла skiff-схемы таблицы может быть узел, помеченный именем &lt;code&gt;$sparse_columns&lt;/code&gt;. Этот узел должен иметь тип &lt;code&gt;RepeatedVariant16&lt;/code&gt;. Его дети образуют множество sparse-узлов и также должны иметь имена. Узел &lt;code&gt;$sparse_columns&lt;/code&gt; должен быть предпоследним, если есть узел &lt;code&gt;$other_columns&lt;/code&gt;, или последним, если такого узла нет.&lt;/li&gt;\n&lt;li&gt;Среди детей корневого узла skiff-схемы таблицы может быть узел со специальным именем &lt;code&gt;$key_switch&lt;/code&gt;, он должен иметь тип &lt;code&gt;boolean&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Среди детей корневого узла skiff-схемы таблицы может быть узел со специальным именем &lt;code&gt;$remaining_row_bytes&lt;/code&gt;, он должен иметь тип &lt;code&gt;int32&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Среди детей корневого узла skiff-схемы таблицы могут быть узлы со специальными именами &lt;code&gt;$row_index / $range_index&lt;/code&gt;. Они должны иметь тип &lt;code&gt;variant8&amp;lt;nothing;int64&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Все dense-узлы должны иметь схему, которая:\n&lt;ul&gt;\n&lt;li&gt;либо описывает простой тип: &lt;code&gt;int64, uint64, boolean, double, string32, yson32&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;либо описывает тип &lt;code&gt;variant8&amp;lt;nothing; TYPE;&amp;gt;&lt;/code&gt;, где TYPE — это простой тип: &lt;code&gt;int64, uint64, boolean, double, string32, yson32&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Все sparse-узлы должны иметь схему, которая описывает простой тип &lt;code&gt;int64, uint64, boolean, double, string32, yson32&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Когда сериализуется строка таблицы, для каждого значения нужно найти dense или sparse-узел, имеющий то же имя, что и имя колонки.&lt;br /&gt;\nЗначения, которые описываются dense-узлами сериализуются всегда, как требует корневой узел skiff-схемы — tuple. Если значение для dense-узла отсутствует или имеет тип &lt;code&gt;NULL&lt;/code&gt;, то соответствующий dense-узел skiff-схемы должен иметь тип &lt;code&gt;variant8&lt;/code&gt;.&lt;br /&gt;\nЗначения, которые описываются sparse-частью схемы сериализуются, только если они присутствуют и имеют тип, отличный от &lt;code&gt;NULL&lt;/code&gt;. Они попадают в поле &lt;code&gt;$sparse_columns&lt;/code&gt; в виде списка.&lt;/p&gt;\n&lt;p&gt;Те значения строки таблицы, которые не попали в dense или sparse-часть, отправляются в колонку &lt;code&gt;$other_columns&lt;/code&gt;. В этой колонке будет лежать yson map с такими значениями. Если колонки &lt;code&gt;$other_columns&lt;/code&gt; нет, но при этом есть значение, не описанное ни в dense, ни в sparse-части, то будет сгенерирована ошибка.&lt;/p&gt;\n&lt;p&gt;Для узла &lt;code&gt;$remaining_row_bytes&lt;/code&gt; возвращается число байт, которые занимает оставшаяся часть строчки в skiff-формате.&lt;/p&gt;\n&lt;h3 id=\"konfiguraciya-formata\"&gt;&lt;a href=\"ru/user-guide/storage/skiff.html#konfiguraciya-formata\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конфигурация формата&lt;/span&gt;&lt;/a&gt;Конфигурация формата&lt;/h3&gt;\n&lt;p&gt;Описание skiff-формата, как и других форматов, делается с помощью атрибутов. В атрибутах должен присутствовать ключ &lt;code&gt;table_skiff_schemas&lt;/code&gt; со списком описаний skiff-схем таблиц. Кроме того, может присутствовать ключ &lt;code&gt;skiff_schema_registry&lt;/code&gt;. Если он присутствует, то должен содержать YSON map, хранящий отображение имени во вспомогательной skiff-схеме.&lt;br /&gt;\nSkiff-схема в &lt;code&gt;table_skiff_schemas&lt;/code&gt;, &lt;code&gt;skiff_schema_registry&lt;/code&gt; может быть описана одним из двух способов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Строкой, начинающейся с &lt;code&gt;$&lt;/code&gt;. Тогда символ =&lt;code&gt;$&lt;/code&gt; будет удален, а оставшаяся строка будет найдена в map &lt;code&gt;skiff_schema_registry&lt;/code&gt;. Схемой считается схема, описанная значением по соответствующему ключу.&lt;/li&gt;\n&lt;li&gt;Map с полями:\n&lt;ul&gt;\n&lt;li&gt;(required) &lt;code&gt;wire_type&lt;/code&gt; тип skiff узла в дереве;&lt;/li&gt;\n&lt;li&gt;(optional) &lt;code&gt;name&lt;/code&gt; имя узла;&lt;/li&gt;\n&lt;li&gt;(optional) &lt;code&gt;children&lt;/code&gt; дети узла. Для составных типов это поле должно присутствовать. Ребёнок может либо ссылаться на описание в &lt;code&gt;skiff_schema_registry&lt;/code&gt;, либо быть map.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;code&gt;skiff_schema_registry&lt;/code&gt; нужен, чтобы позволить запускать операции с большим количеством входных таблиц с одинаковой схемой.&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;\n    \"table_skiff_schemas\" = [\n        \"$table1\"\n    ];\n    \"skiff_schema_registry\" = {\n        \"table1\" = {\n            \"children\" = [\n                {\n                    \"name\" = \"uint64_column\";\n                    \"wire_type\" = \"uint64\"\n                };\n                {\n                    \"name\" = \"int64_column\";\n                    \"wire_type\" = \"int64\"\n                };\n                {\n                    \"name\" = \"boolean_column\";\n                    \"wire_type\" = \"boolean\"\n                };\n                {\n                    \"name\" = \"string32_column\";\n                    \"wire_type\" = \"string32\"\n                };\n                {\n                    \"name\" = \"yson32_column\";\n                    \"wire_type\" = \"yson32\"\n                }\n            ];\n            \"wire_type\" = \"tuple\"\n        }\n    }\n&amp;gt; \"skiff\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"319\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-319\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-319\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-319.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/storage/skiff.md","sourcePath":"ru/user-guide/storage/skiff.md"},"headings":[{"title":"Сравнение с другими форматами","href":"ru/user-guide/storage/skiff.html#sravnenie-s-drugimi-formatami","level":2},{"title":"Skiff serialization library","href":"ru/user-guide/storage/skiff.html#skiff-serialization-library","level":2,"items":[{"title":"Skiff Schema","href":"ru/user-guide/storage/skiff.html#skiff-schema","level":3,"items":[{"title":"Простые типы","href":"ru/user-guide/storage/skiff.html#prostye-tipy","level":4,"items":[{"title":"Nothing","href":"ru/user-guide/storage/skiff.html#nothing","level":5},{"title":"Boolean","href":"ru/user-guide/storage/skiff.html#boolean","level":5},{"title":"Int64 / Uint64","href":"ru/user-guide/storage/skiff.html#int64-/-uint64","level":5},{"title":"Double","href":"ru/user-guide/storage/skiff.html#double","level":5},{"title":"String32","href":"ru/user-guide/storage/skiff.html#string32","level":5},{"title":"Yson32","href":"ru/user-guide/storage/skiff.html#yson32","level":5}]},{"title":"Составные типы","href":"ru/user-guide/storage/skiff.html#sostavnye-tipy","level":4,"items":[{"title":"Variant8 / variant16","href":"ru/user-guide/storage/skiff.html#variant8-/-variant16","level":5},{"title":"RepeatedVariant8 / RepeatedVariant16","href":"ru/user-guide/storage/skiff.html#repeatedvariant8-/-repeatedvariant16","level":5},{"title":"Tuple","href":"ru/user-guide/storage/skiff.html#tuple","level":5}]}]}]},{"title":"Использование skiff serialization library для передачи табличных данных","href":"ru/user-guide/storage/skiff.html#ispolzovanie-skiff-serialization-library-dlya-peredachi-tablichnyh-dannyh","level":2,"items":[{"title":"Skiff-схема таблицы","href":"ru/user-guide/storage/skiff.html#skiff-shema-tablicy","level":3},{"title":"Ограничения на skiff-схему таблицы.","href":"ru/user-guide/storage/skiff.html#ogranicheniya-na-skiff-shemu-tablicy","level":3},{"title":"Конфигурация формата","href":"ru/user-guide/storage/skiff.html#konfiguraciya-formata","level":3}]}],"title":"Формат Skiff"},"router":{"pathname":"ru/user-guide/storage/skiff","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
