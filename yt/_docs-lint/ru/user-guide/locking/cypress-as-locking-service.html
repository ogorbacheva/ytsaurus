        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе содержится информация об использовании &lt;a href=\"user-guide/storage/cypress.html\"&gt;Кипариса&lt;/a&gt; в качестве сервиса распределённых блокировок, аналога &lt;a href=\"https://zookeeper.apache.org\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ZooKeeper&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"obshie-svedeniya\"&gt;&lt;a href=\"ru/user-guide/locking/cypress-as-locking-service.html#obshie-svedeniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общие сведения&lt;/span&gt;&lt;/a&gt;Общие сведения&lt;/h2&gt;\n&lt;p&gt;Для использования YTsaurus в качестве сервиса распределённых блокировок необходимо развернуть мастер-серверы кластера в нескольких локациях.&lt;/p&gt;\n&lt;p&gt;Локаций должно быть не менее трёх, в этом случае сервис переживёт отключение одной локации. Если мастер-серверы будут расположены в пяти локациях, то сервис переживёт отключение любых двух.&lt;/p&gt;\n&lt;h3 id=\"ustrojstvo\"&gt;&lt;a href=\"ru/user-guide/locking/cypress-as-locking-service.html#ustrojstvo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Устройство&lt;/span&gt;&lt;/a&gt;Устройство&lt;/h3&gt;\n&lt;p&gt;В системе YTsaurus есть &lt;a href=\"user-guide/storage/transactions.html\"&gt;транзакции&lt;/a&gt;, которые бывают мастерными и таблетными. Мастерные транзакции реализуют пессимистическую модель блокировок, то есть взятие блокировки на узел Кипариса происходит синхронно и при этом проверяются возможные конфликты.&lt;/p&gt;\n&lt;p&gt;Пользуясь пессимистической моделью, можно сделать простую конструкцию, эмулирующую распределённую блокировку:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Создаётся узел в Кипарисе (вне транзакций). Данный узел будет отвечать блокировке. Тип узла может быть любым, например &lt;code&gt;map_node&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;В том месте программы, где нужно взять блокировку на данный узел, создаётся транзакция. Под ней выполняется попытка взять эксклюзивную блокировку на узел.&lt;/li&gt;\n&lt;li&gt;Если блокировку взять удалось, то можно выполнять код, защищённый данной блокировкой. При этом важно пинговать транзакцию. В случае если вызов ping не удался или транзакция была отменена — эксклюзивность выполнения теряется, соответственно, необходимо предпринять какие-то действия, например прервать выполняющийся процесс.&lt;/li&gt;\n&lt;li&gt;Если блокировку взять &lt;strong&gt;не&lt;/strong&gt; удалось, то нужно повторить процесс создания транзакции и взятия блокировки.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Как и в любой системе распределённых блокировок, если процесс (живущий под блокировкой) делает какие-то изменения в сторонней системе, которая никак не интегрирована с транзакциями YTsaurus, — полностью гарантировать эксклюзивность невозможно. Например, между соседними вызовами ping транзакция могла быть прервана и запущен параллельный процесс, взявший блокировку на этот же узел.&lt;/p&gt;\n&lt;p&gt;Когда изменения выполняются на том же кластере, где берётся блокировка, стоит в запросах к кластеру использовать опцию &lt;code&gt;prerequisite_transactions&lt;/code&gt; и указывать в ней транзакцию, под которой была взята блокировка. Тем самым система YTsaurus гарантирует, что запрос будет выполнен только при условии, что транзакция жива (и, соответственно, взята блокировка).&lt;/p&gt;\n&lt;h3 id=\"ispolzovanie\"&gt;&lt;a href=\"ru/user-guide/locking/cypress-as-locking-service.html#ispolzovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование&lt;/span&gt;&lt;/a&gt;Использование&lt;/h3&gt;\n&lt;p&gt;Для запуска процесса под блокировкой можно использовать команду &lt;a href=\"api/cli/commands.html#run-command-with-lock\"&gt;run-command-with-lock&lt;/a&gt;, а можно реализовать логику со взятием блокировки самостоятельно в коде приложения.&lt;/p&gt;\n&lt;p&gt;Если процесс выполняет какие-то изменения на кластере и должен делать их эксклюзивно, то рекомендуется использовать блокировку прямо на данном кластере.&lt;/p&gt;\n&lt;h2 id=\"kvotirovanie\"&gt;&lt;a href=\"ru/user-guide/locking/cypress-as-locking-service.html#kvotirovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Квотирование&lt;/span&gt;&lt;/a&gt;Квотирование&lt;/h2&gt;\n&lt;p&gt;Запросы квотируются по пользователю кластера независимо от хоста источника запроса. По умолчанию квота на число запросов — 100 RPS. При её превышении запросы становятся в очередь, глубина очереди по умолчанию — 100 запросов. Если очередь заполняется, то при попытке отправить следующий запрос пользователь получит ошибку: &lt;code&gt;Request queue size limit exceeded&lt;/code&gt;. Лимиты могут быть увеличены администратором кластера.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/locking/cypress-as-locking-service.md","sourcePath":"ru/user-guide/locking/cypress-as-locking-service.md"},"headings":[{"title":"Общие сведения","href":"ru/user-guide/locking/cypress-as-locking-service.html#obshie-svedeniya","level":2,"items":[{"title":"Устройство","href":"ru/user-guide/locking/cypress-as-locking-service.html#ustrojstvo","level":3},{"title":"Использование","href":"ru/user-guide/locking/cypress-as-locking-service.html#ispolzovanie","level":3}]},{"title":"Квотирование","href":"ru/user-guide/locking/cypress-as-locking-service.html#kvotirovanie","level":2}],"title":"Распределённые блокировки"},"router":{"pathname":"ru/user-guide/locking/cypress-as-locking-service","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42         </script>
