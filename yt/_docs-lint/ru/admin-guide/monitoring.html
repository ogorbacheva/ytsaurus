        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"nastrojka-prometheus\"&gt;&lt;a href=\"ru/admin-guide/monitoring.html#nastrojka-prometheus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройка Prometheus&lt;/span&gt;&lt;/a&gt;Настройка Prometheus&lt;/h2&gt;\n&lt;h3 id=\"prerekvizity\"&gt;&lt;a href=\"ru/admin-guide/monitoring.html#prerekvizity\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пререквизиты&lt;/span&gt;&lt;/a&gt;Пререквизиты&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;установить prometheus-operator &lt;a href=\"https://github.com/prometheus-operator/prometheus-operator#quickstart\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;по инструкции&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"zapusk\"&gt;&lt;a href=\"ru/admin-guide/monitoring.html#zapusk\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск&lt;/span&gt;&lt;/a&gt;Запуск&lt;/h3&gt;\n&lt;p&gt;Сервисы для мониторинга создаются оператором YTsaurus автоматически. Для сбора метрик необходимо:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Создать &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/blob/main/config/samples/prometheus/prometheus_service_monitor.yaml\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ServiceMonitor&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Создать &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/blob/main/config/samples/prometheus/prometheus_service_account.yaml\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;сервисный аккаунт&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Выдать созданному аккаунту &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/blob/main/config/samples/prometheus/prometheus_role_binding.yaml\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;роль&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/blob/main/config/samples/prometheus/prometheus.yaml\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Создать Prometheus&lt;/a&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"sposoby-monitoringa-i-vazhnye-metriki-ytsaurus\"&gt;&lt;a href=\"ru/admin-guide/monitoring.html#sposoby-monitoringa-i-vazhnye-metriki-ytsaurus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Способы мониторинга и важные метрики YTsaurus&lt;/span&gt;&lt;/a&gt;Способы мониторинга и важные метрики YTsaurus&lt;/h2&gt;\n&lt;p&gt;Подходы к организации мониторинга технических систем можно условно разделить на два основных направления, назовем их качественный и количественный мониторинг.&lt;/p&gt;\n&lt;h3 id=\"kachestvennyj-monitoring\"&gt;&lt;a href=\"ru/admin-guide/monitoring.html#kachestvennyj-monitoring\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Качественный мониторинг&lt;/span&gt;&lt;/a&gt;Качественный мониторинг&lt;/h3&gt;\n&lt;p&gt;Качественный мониторинг проверяет, способна ли система выполнять свою базовую функциональность. Для этого запускаются тестовые задания или, по-другому, проверки. Такие проверки возвращают качественное описание проверяемой системы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;работает в штатном режиме (OK);&lt;/li&gt;\n&lt;li&gt;не работает (CRITICAL);&lt;/li&gt;\n&lt;li&gt;работает, но с отклонениями от штатного режима (WARNING).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Список наиболее важных качественных проверок YTsaurus:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;sort_result&lt;/code&gt; — запускает sort операцию над небольшой тестовой таблицей, ждет её завершения и проверяет результат сортировки;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;map_result&lt;/code&gt; — запускает map операцию с небольшой тестовой таблицей на входе, ждет её завершения и проверяет результат map;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;dynamic_table_commands&lt;/code&gt; — проверяет работоспособность динамических таблиц, проходя весь жизненный цикл динамической таблицы: создаёт тестовую таблицу, монтирует таблицу, записывает и читает данные из таблицы, после чего отмонтирует и удаляет таблицу.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Существуют проверки сообщений самодиагностики подсистем YTsaurus кластера:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;master_alerts&lt;/code&gt; — проверяет значение атрибута &lt;code&gt;//sys/@master_alerts&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;scheduler_alerts&lt;/code&gt; — проверяет значение атрибута &lt;code&gt;//sys/scheduler/@alerts&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;controller_agent_alerts&lt;/code&gt; — вычитывает атрибут alerts из всех узлов из &lt;code&gt;//sys/controller_agents/instances&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;lost_vital_chunks&lt;/code&gt; — проверяет, что счетчик lost_vital_chunks равен нулю из &lt;code&gt;//sys/lost_vital_chunks/@count&lt;/code&gt;. Подробнее про vitality можно прочитать &lt;a href=\"user-guide/storage/chunks.html#vitality\"&gt;по ссылке&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;tablet_cells&lt;/code&gt; — проверяет, что в динамических таблицах нет tablet cells в статусе failed;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;quorum_health&lt;/code&gt; — проверяет, что все мастера работают и находятся в кворуме.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Реализацию данных проверок можно посмотреть в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/odin\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Odin&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;В текущей реализации odin не поддерживает алерты, только запуск проверок с сохранением результатов в динамическую таблицу с отображением в UI.&lt;/p&gt;\n&lt;h3 id=\"kolichestvennyj-monitoring\"&gt;&lt;a href=\"ru/admin-guide/monitoring.html#kolichestvennyj-monitoring\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Количественный мониторинг&lt;/span&gt;&lt;/a&gt;Количественный мониторинг&lt;/h3&gt;\n&lt;p&gt;Для количественного мониторинга с различных подсистем снимаются метрики в виде временных рядов (Time series data). С их помощью можно оценить тенденции нагрузки и потребляемых ресурсов и исправить ситуацию до появления проблем на кластере, заметных пользователям.&lt;/p&gt;\n&lt;p&gt;Некоторые важные количественные метрики в Prometheus:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;yt_resource_tracker_total_cpu{service=\"yt-master\", thread=\"Automaton\"}&lt;/code&gt; — загрузка Automaton, основного исполняющего потока мастера. Загрузка не должна быть больше 90%;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt_resource_tracker_memory_usage_rss{service=\"yt-master\"}&lt;/code&gt; — использование мастером памяти. Порог должен быть чуть меньше половины памяти контейнера. Мастер делает fork для записи снапшота, потому должен быть двойной запас по памяти;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt_resource_tracker_memory_usage_rss&lt;/code&gt; — важная метрика и для других компонентов кластера, позволяющая оценить тенденцию потребления памяти для избежания событий out of memory;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt_changelogs_available_space{service=\"yt-master\"}&lt;/code&gt; — свободное место под changelogs. В конфигурационном файле мастера есть настройка хранения changelogs, свободного места должно быть больше, чем эта настройка;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt_snapshots_available_space{service=\"yt-master\"}&lt;/code&gt; — аналогично для snapshots;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt_logging_min_log_storage_available_space{service=\"yt-master\"}&lt;/code&gt; — аналогично для logs.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Необходимо следить за ростом чанков в «нехороших» состояниях:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;yt_chunk_server_underreplicated_chunk_count&lt;/code&gt; — число чанков, имеющих на дисках кластера меньше реплик, чем указано в атрибуте replication_factor. Постоянный рост underreplicated может говорить о том, что настройки &lt;a href=\"user-guide/storage/media.html\"&gt;media&lt;/a&gt; не позволяют выполнять условия replication_factor в текущей конфигурации кластера. Число underreplicated чанков можно посмотреть в //sys/underreplicated_chunks/@count;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt_chunk_server_parity_missing_chunk_count&lt;/code&gt; и &lt;code&gt;yt_chunk_server_data_missing_chunk_count&lt;/code&gt; — постоянный рост parity_missing_chunk или data_missing_chunk может быть вызван тем, что процесс починки erasure не успевает за поломкой при выходе хостов или дисков из строя. Число parity_missing и data_missing чанков можно посмотреть в //sys/parity_missing_chunks/@count и //sys/data_missing_chunks/@count.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Важно отслеживать &lt;a href=\"user-guide/storage/quotas.html\"&gt;квоты&lt;/a&gt; системных аккаунтов, таких как sys, tmp, intermediate, а также пользовательские квоты продуктовых процессов. Пример для аккаунта sys:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;yt_accounts_chunk_count{account=\"sys\"} / yt_accounts_chunk_count_limit{account=\"sys\"}&lt;/code&gt; — процент использования чанковой квоты;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt_accounts_node_count{account=\"sys\"} / yt_accounts_node_count_limit{account=\"sys\"}&lt;/code&gt; — процент использования квоты на число узлов Кипариса;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt_accounts_disk_space_in_gb{account=\"sys\"} / yt_accounts_disk_space_limit_in_gb{account=\"sys\"}&lt;/code&gt; — процент использования дисковой квоты.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/admin-guide/monitoring.md","sourcePath":"ru/admin-guide/monitoring.md"},"headings":[{"title":"Настройка Prometheus","href":"ru/admin-guide/monitoring.html#nastrojka-prometheus","level":2,"items":[{"title":"Пререквизиты","href":"ru/admin-guide/monitoring.html#prerekvizity","level":3},{"title":"Запуск","href":"ru/admin-guide/monitoring.html#zapusk","level":3}]},{"title":"Способы мониторинга и важные метрики YTsaurus","href":"ru/admin-guide/monitoring.html#sposoby-monitoringa-i-vazhnye-metriki-ytsaurus","level":2,"items":[{"title":"Качественный мониторинг","href":"ru/admin-guide/monitoring.html#kachestvennyj-monitoring","level":3},{"title":"Количественный мониторинг","href":"ru/admin-guide/monitoring.html#kolichestvennyj-monitoring","level":3}]}],"title":"Мониторинг"},"router":{"pathname":"ru/admin-guide/monitoring","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
