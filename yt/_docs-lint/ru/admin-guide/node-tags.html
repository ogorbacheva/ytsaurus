        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"node_tags\"&gt;&lt;a href=\"ru/admin-guide/node-tags.html#node_tags\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тегирование нод кластера&lt;/span&gt;&lt;/a&gt;Тегирование нод кластера&lt;/h2&gt;\n&lt;p&gt;Ноды кластера могут быть помечены специальными строковыми литералами, называемыми тегами.&lt;/p&gt;\n&lt;p&gt;Часть тегов, как правило называемых системными, определяется самой нодой исходя из своего конфига и окружения. Окружение задаётся  администраторами кластера. Дополнительные теги можно указывать на нодах с помощью атрибута &lt;code&gt;user_tags&lt;/code&gt; на узле ноды в Кипарисе.&lt;/p&gt;\n&lt;p&gt;Данные теги могут использоваться для фильтрации набора нод на основе языка булевых формул.&lt;/p&gt;\n&lt;p&gt;Булевая формула — это логическое выражение, которое:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;содержит операторы &lt;code&gt;&amp;amp;&lt;/code&gt; (логическое \"и\"), &lt;code&gt;|&lt;/code&gt; (логическое \"или\"), &lt;code&gt;!&lt;/code&gt; (логическое \"не\") и круглые скобки;&lt;/li&gt;\n&lt;li&gt;построено поверх литералов. Литерал — это строка из латинских символов и спецсимволов &lt;code&gt;_&lt;/code&gt;, &lt;code&gt;/&lt;/code&gt;, &lt;code&gt;-&lt;/code&gt;, &lt;code&gt;.&lt;/code&gt;, &lt;code&gt;:&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выражение вычисляется для конкретной ноды. Для этого в качестве значения литерала подставляется \"истина\", если данный литерал встречается в списке тегов ноды, и \"ложь\" — иначе. Далее выражение вычисляется по стандартным правилам булевых выражений. Пустое выражение всегда принимает значение \"ложь\".&lt;/p&gt;\n&lt;p&gt;Выражения на тегах используются в двух сценариях:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;опция &lt;code&gt;scheduling_tag_filter&lt;/code&gt; в спецификации операции позволяет указывать фильтр на подмножество нод, на которых можно запускать джобы операции;&lt;/li&gt;\n&lt;li&gt;ключи в динамическом конфиге нод &lt;code&gt;//sys/cluster_nodes/@config&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Запуск операции с указанием тегов &lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;small&gt;Листинг 1 — Указание пользовательского тега на ноде&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/cluster_nodes/exe-0.my_cluster.net:9012/@user_tags &lt;span class=\"hljs-string\"&gt;'[test]'&lt;/span&gt;\n$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/cluster_nodes/exe-1.my_cluster.net:9012/@user_tags &lt;span class=\"hljs-string\"&gt;'[test]'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"53\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-53\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-53\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-53.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;small&gt;Листинг 2 — Запуск операции с указанием данного тега&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt map --spec &lt;span class=\"hljs-string\"&gt;'{scheduling_tag_filter=\"test\"}'&lt;/span&gt; ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"57\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-57\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-57\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-57.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/admin-guide/node-tags.md","sourcePath":"ru/admin-guide/node-tags.md"},"headings":[{"title":"Тегирование нод кластера","href":"ru/admin-guide/node-tags.html#node_tags","level":2}],"title":""},"router":{"pathname":"ru/admin-guide/node-tags","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
