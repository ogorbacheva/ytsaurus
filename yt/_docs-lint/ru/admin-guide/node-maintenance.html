        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"administrirovanie-nod\"&gt;&lt;a href=\"ru/admin-guide/node-maintenance.html#administrirovanie-nod\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Администрирование нод&lt;/span&gt;&lt;/a&gt;Администрирование нод&lt;/h2&gt;\n&lt;p&gt;В данном разделе собрано описание некоторых возможностей администрирования кластерных нод.&lt;/p&gt;\n&lt;h3 id=\"pending-restart\"&gt;&lt;a href=\"ru/admin-guide/node-maintenance.html#pending-restart\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Pending restart&lt;/span&gt;&lt;/a&gt;Pending restart&lt;/h3&gt;\n&lt;p&gt;Основной сценарий использования флага &lt;code&gt;pending_restart&lt;/code&gt; — оптимизация репликационной работы мастера при проведении обслуживания кластерных data-нод, предполагающая их кратковременное нефункционирование. Так, перед началом таких работ рекомендуется выполнить следующее действие:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt add-maintenance --component=&lt;span class=\"hljs-string\"&gt;\"cluster_node\"&lt;/span&gt; --&lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"pending_restart\"&lt;/span&gt; --address=&lt;span class=\"hljs-string\"&gt;\"my-node.yandex.net\"&lt;/span&gt;  --comment=&lt;span class=\"hljs-string\"&gt;\"my comment\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"12\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-12\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-12\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-12.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Убедиться, что нода стала &lt;em&gt;restart pending&lt;/em&gt;, можно следующей командой:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //sys/cluster_nodes/my-node.yandex.net/@pending_restart\n&amp;gt; &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"16\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-16\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-16\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-16.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"opisanie-raboty\"&gt;&lt;a href=\"ru/admin-guide/node-maintenance.html#opisanie-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Описание работы&lt;/span&gt;&lt;/a&gt;Описание работы&lt;/h4&gt;\n&lt;p&gt;Когда объект-нода стала &lt;em&gt;restart pending&lt;/em&gt;, таймаут её &lt;em&gt;lease&lt;/em&gt;-транзакции будет значительно увеличен. Это означает, что нода в течение длительного промежутка времени будет считаться &lt;em&gt;online&lt;/em&gt; даже после того, как фактически прекратит подтверждать свою доступность периодическими запросами к мастер-серверу. Время такого промежутка настраивается в динамическом конфиге мастера по пути &lt;code&gt;//sys/@config/node_tracker/pending_restart_lease_timeout&lt;/code&gt; (по умолчанию — 10 минут).&lt;/p&gt;\n&lt;p&gt;Заявленная оптимизация работы репликатора чанков на мастере достигается особенной обработкой реплик, находящихся на нодах с подобным флагом, далее именуемых &lt;em&gt;temporarily unavailable&lt;/em&gt; репликами. Реплики, находящиеся на обычных нодах, будем называть &lt;em&gt;available&lt;/em&gt; репликами.&lt;/p&gt;\n&lt;p&gt;Так, чанк обычного формата считается &lt;em&gt;underreplicated&lt;/em&gt;, если выполняется одно из условий:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;совокупное число реплик &lt;em&gt;available&lt;/em&gt; + &lt;em&gt;temporarily unavailable&lt;/em&gt; меньше &lt;em&gt;replication factor&lt;/em&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;em&gt;available&lt;/em&gt; реплик меньше, чем 1 + &lt;em&gt;max replicas per rack&lt;/em&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;em&gt;temporarily unavailable&lt;/em&gt; реплик больше одной.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В свою очередь, &lt;em&gt;erasure&lt;/em&gt; чанки считаются &lt;em&gt;parity missing&lt;/em&gt; или &lt;em&gt;data missing&lt;/em&gt;, если:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;какая-то из реплик недоступна и не является &lt;em&gt;temporarily unavailable&lt;/em&gt;;&lt;/li&gt;\n&lt;li&gt;разница между минимальным необходимым числом реплик, когда чанк ещё возможно восстановить, и числом &lt;em&gt;temporarily unavailable&lt;/em&gt; реплик меньше, чем &lt;em&gt;max erasure replicas per rack&lt;/em&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В типичном случае конфигурации кластера с &lt;em&gt;replication factor = 3&lt;/em&gt; и &lt;em&gt;max replicas per rack = 1&lt;/em&gt;, практическое использование &lt;em&gt;pending restart&lt;/em&gt; предполагает одновременную работу с нодами только внутри одной стойки.&lt;/p&gt;\n&lt;h4 id=\"zavershenie-raboty\"&gt;&lt;a href=\"ru/admin-guide/node-maintenance.html#zavershenie-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Завершение работы&lt;/span&gt;&lt;/a&gt;Завершение работы&lt;/h4&gt;\n&lt;p&gt;Флаг &lt;em&gt;pending restart&lt;/em&gt; снимется при перезапуске ноды, а именно в момент её перерегистрации на мастере. Также флаг можно снять явно:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt remove-maintenance --component=&lt;span class=\"hljs-string\"&gt;\"cluster_node\"&lt;/span&gt; --address=&lt;span class=\"hljs-string\"&gt;\"my-node.yandex.net\"&lt;/span&gt; --&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"&amp;lt;maintenance-id&amp;gt;\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"70\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-70\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-70\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-70.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Длительное использование данного флага опасно, поэтому время его действия сознательно ограничено конфигурируемым интервалом — уже известным &lt;code&gt;pending_restart_lease_timeout&lt;/code&gt;, по истечении которого флаг будет снят автоматически. Дедлайн отсчитывается с момента последней установки флага.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/admin-guide/node-maintenance.md","sourcePath":"ru/admin-guide/node-maintenance.md"},"headings":[{"title":"Администрирование нод","href":"ru/admin-guide/node-maintenance.html#administrirovanie-nod","level":2,"items":[{"title":"Pending restart","href":"ru/admin-guide/node-maintenance.html#pending-restart","level":3,"items":[{"title":"Описание работы","href":"ru/admin-guide/node-maintenance.html#opisanie-raboty","level":4},{"title":"Завершение работы","href":"ru/admin-guide/node-maintenance.html#zavershenie-raboty","level":4}]}]}],"title":""},"router":{"pathname":"ru/admin-guide/node-maintenance","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
