        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Для установки SPYT на кластер YTsaurus необходимо запушить в k8s ресурс типа &lt;code&gt;Spyt&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Пример спецификации можно найти &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/blob/main/config/samples/cluster_v1_spyt.yaml\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;по ссылке&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;apiVersion:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;cluster.ytsaurus.tech/v1&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;kind:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Spyt&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;myspyt&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;ytsaurus:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt;\n      &lt;span class=\"hljs-string\"&gt;minisaurus&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;image:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ghcr.io/ytsaurus/spyt:2.7.1&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Запушить спецификацию можно с помощью &lt;code&gt;kubectl&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl apply -f cluster_v1_spyt.yaml -n &amp;lt;namespace&amp;gt;\nspyt.cluster.ytsaurus.tech/myspyt created\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"10\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-10\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-10\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-10.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;После этого k8s оператор запустит несколько init job, которые запишут в Кипарис необходимые файлы. Следить за статусом можно с помощью &lt;code&gt;kubectl&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl get spyt\nNAME     RELEASESTATUS\nmyspyt   CreatingUser\n\n$ kubectl get spyt\nNAME     RELEASESTATUS\nmyspyt   UploadingIntoCypress\n\n$ kubectl get spyt\nNAME     RELEASESTATUS\nmyspyt   Finished\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"14\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-14\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-14\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-14.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;После успешного выполнения всех джобов (когда &lt;code&gt;RELEASESTATUS&lt;/code&gt; перешел в &lt;code&gt;Finished&lt;/code&gt;), можно запускать &lt;code&gt;SPYT&lt;/code&gt;. Подробнее можно почитать &lt;a href=\"user-guide/data-processing/spyt/launch\"&gt;в отдельном разделе&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/admin-guide/spyt.md","sourcePath":"ru/admin-guide/spyt.md"},"headings":[],"title":"SPYT"},"router":{"pathname":"ru/admin-guide/spyt","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
