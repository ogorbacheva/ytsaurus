        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;a href=\"https://airflow.apache.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apache Airflow&lt;/a&gt; is a platform for creating, scheduling, and monitoring workflows. YTsaurus Airflow Provider enables you to integrate Airflow with YTsaurus and efficiently manage data processing tasks.&lt;/p&gt;\n&lt;p&gt;This section provides instructions on how to connect to a YTsaurus cluster in Apache Airflow and how to use operators to interact with Cypress, work with static tables, and execute queries in &lt;a href=\"user-guide/query-tracker/about.html\"&gt;Query Tracker&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"installation\"&gt;&lt;a href=\"en/api/airflow/userdoc.html#installation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Installation&lt;/span&gt;&lt;/a&gt;Installation&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The current package version requires:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Python 3.8+&lt;/li&gt;\n&lt;li&gt;Airflow 2.9.0+&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Install the Python client from the PyPi repository:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;pip install ytsaurus-airflow-provider\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"36\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-36\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-36\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-36.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;If you encounter the error 'Building wheel for xmlsec (pyproject.toml) did not run successfully.'&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Install the packages required to build &lt;code&gt;xmlsec&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;sudo&lt;/span&gt; apt install libxmlsec1-dev pkg-config build-essential python3-dev\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"45\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-45\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-45\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-45.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Verify that the provider was installed successfully:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ python3 -c &lt;span class=\"hljs-string\"&gt;\"import ytsaurus_airflow_provider; print(ytsaurus_airflow_provider.__version__)\"&lt;/span&gt;\n0.1.1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"53\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-53\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-53\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-53.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;As a result, the following will be available:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Python library for writing DAGs.&lt;/li&gt;\n&lt;li&gt;Provider for &lt;a href=\"https://airflow.apache.org\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apache Airflow&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ytsaurus-client&lt;/code&gt; and &lt;code&gt;ytsaurus-yson&lt;/code&gt; tools.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"howtostart\"&gt;&lt;a href=\"en/api/airflow/userdoc.html#howtostart\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Getting started&lt;/span&gt;&lt;/a&gt;Getting started&lt;/h2&gt;\n&lt;p&gt;In the Apache Airflow web interface, create a connection to your YTsaurus cluster:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Admin&lt;/strong&gt; -&amp;gt; &lt;strong&gt;Connections&lt;/strong&gt; -&amp;gt; &lt;strong&gt;+&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Connection Id&lt;/strong&gt;: &lt;code&gt;ytsaurus_cluster_default&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Connection Type&lt;/strong&gt;: YTsaurus Cluster&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Cluster Proxy&lt;/strong&gt;: Cluster proxy&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Cluster Token&lt;/strong&gt;: Cluster connection token&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Extra&lt;/strong&gt;: Optionally, you can specify &lt;a href=\"api/python/userdoc#configuration\"&gt;Client Config&lt;/a&gt;:\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{\n    \"client_config\": {\n        \"create_table_attributes\": {\n            \"compression_codec\": \"brotli_3\"\n        }\n    }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"112\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-112\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-112\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-112.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;If necessary, you can create a connection to the object storage:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Admin&lt;/strong&gt; -&amp;gt; &lt;strong&gt;Connections&lt;/strong&gt; -&amp;gt; &lt;strong&gt;+&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Connection Id&lt;/strong&gt;: &lt;code&gt;aws_default&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Connection Type&lt;/strong&gt;: Amazon Web Service&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;AWS Access Key ID&lt;/strong&gt; and &lt;strong&gt;AWS Secret Access Key&lt;/strong&gt;: Access keys for the object storage&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"selectconn\"&gt;&lt;a href=\"en/api/airflow/userdoc.html#selectconn\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How to specify a connection&lt;/span&gt;&lt;/a&gt;How to specify a connection&lt;/h4&gt;\n&lt;p&gt;Each operator accepts the optional &lt;code&gt;ytsaurus_conn_id&lt;/code&gt; parameter, which by default is set to &lt;code&gt;ytsaurus_cluster_default&lt;/code&gt;. If you need to use a different connection, you should specify it in the &lt;code&gt;ytsaurus_conn_id&lt;/code&gt; parameter.&lt;/p&gt;\n&lt;h2 id=\"operators\"&gt;&lt;a href=\"en/api/airflow/userdoc.html#operators\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Operators&lt;/span&gt;&lt;/a&gt;Operators&lt;/h2&gt;\n&lt;p&gt;All operators, except for the read operator with a specified ObjectStorage, write data to XCom. It is not recommended to pass large volumes of data through XCom. You can find out below which operators write data to which XComs.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;All operators use the Python SDK. If an error occurs during operator execution, see the &lt;a href=\"api/python/userdoc.html\"&gt;Python SDK documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"operators_cypress\"&gt;&lt;a href=\"en/api/airflow/userdoc.html#operators_cypress\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with Cypress&lt;/span&gt;&lt;/a&gt;Working with Cypress&lt;/h3&gt;\n&lt;h4 id=\"getoperator\"&gt;&lt;a href=\"en/api/airflow/userdoc.html#getoperator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GetOperator&lt;/span&gt;&lt;/a&gt;GetOperator&lt;/h4&gt;\n&lt;p&gt;Operator for retrieving the contents of a Cypress node. It implements the &lt;a href=\"api/commands.html#get\"&gt;get&lt;/a&gt; functionality from the Python SDK.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Parameters:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path: str | YPath&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_size: None | int = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;attributes: None | dict[str, Any] = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;read_from: None | str = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ytsaurus_conn_id: str = \"ytsaurus_cluster_default\"&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;XComs:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;return_value&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"setoperator\"&gt;&lt;a href=\"en/api/airflow/userdoc.html#setoperator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SetOperator&lt;/span&gt;&lt;/a&gt;SetOperator&lt;/h4&gt;\n&lt;p&gt;Operator for writing new contents to a Cypress node. It implements the &lt;a href=\"api/commands.html#set\"&gt;set&lt;/a&gt; functionality from the Python SDK.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Parameters:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path: str | YPath&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;value: Any&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;set_format: None | str | Format = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;recursive: bool = False&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;force: None | bool = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ytsaurus_conn_id: str = \"ytsaurus_cluster_default\"&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;XComs:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"removeoperator\"&gt;&lt;a href=\"en/api/airflow/userdoc.html#removeoperator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RemoveOperator&lt;/span&gt;&lt;/a&gt;RemoveOperator&lt;/h4&gt;\n&lt;p&gt;Operator for removing a Cypress node. It implements the &lt;a href=\"api/commands.html#remove\"&gt;remove&lt;/a&gt; functionality from the Python SDK.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Parameters:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path: str | YPath&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;recursive: bool = False&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;force: bool = False&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ytsaurus_conn_id: str = \"ytsaurus_cluster_default\"&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;XComs:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"createoperator\"&gt;&lt;a href=\"en/api/airflow/userdoc.html#createoperator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CreateOperator&lt;/span&gt;&lt;/a&gt;CreateOperator&lt;/h4&gt;\n&lt;p&gt;Operator for creating an empty Cypress node of the &lt;code&gt;node_type&lt;/code&gt; with &lt;code&gt;attributes&lt;/code&gt;. It implements the &lt;a href=\"api/commands.html#create\"&gt;create&lt;/a&gt; functionality from the Python SDK.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Parameters:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;node_type: Literal[\"table\", \"file\", \"map_node\", \"document\", \"string_node\", \"int64_node\", \"uint64_node\", \"double_node\", \"list_node\", \"boolean_node\", \"link\"]&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;path: str | YPath&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;recursive: bool = False&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ignore_existing: bool = False&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;lock_existing: None | bool = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;force: None | bool = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;attributes: None | dict[str, Any] = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ignore_type_mismatch: bool = False&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ytsaurus_conn_id: str = \"ytsaurus_cluster_default\"&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;XComs:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;object_id&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;path&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"listoperator\"&gt;&lt;a href=\"en/api/airflow/userdoc.html#listoperator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ListOperator&lt;/span&gt;&lt;/a&gt;ListOperator&lt;/h4&gt;\n&lt;p&gt;Operator for getting a list of descendants of the &lt;code&gt;path&lt;/code&gt; node. The &lt;code&gt;absolute&lt;/code&gt; option enables the output of absolute paths instead of relative paths. It implements the &lt;a href=\"api/commands.html#list\"&gt;list&lt;/a&gt; functionality from the Python SDK.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Parameters:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path: str | YPath&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_size: None | int = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;absolute: None | bool = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;attributes: None | dict[str, Any] = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;sort: bool = True&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;read_from: None | str = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ytsaurus_conn_id: str = \"ytsaurus_cluster_default\"&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;XComs:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;return_value&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"operators_tables\"&gt;&lt;a href=\"en/api/airflow/userdoc.html#operators_tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with tables&lt;/span&gt;&lt;/a&gt;Working with tables&lt;/h3&gt;\n&lt;h4 id=\"writetableoperator\"&gt;&lt;a href=\"en/api/airflow/userdoc.html#writetableoperator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;WriteTableOperator&lt;/span&gt;&lt;/a&gt;WriteTableOperator&lt;/h4&gt;\n&lt;p&gt;Operator for writing data to a static table. It implements the &lt;a href=\"api/commands.html#write_table\"&gt;write_table&lt;/a&gt; functionality from the Python SDK.&lt;/p&gt;\n&lt;p&gt;Input data can be passed through the &lt;code&gt;input_data&lt;/code&gt; parameter or the &lt;code&gt;object_storage_path&lt;/code&gt; parameter, which is an object of the &lt;a href=\"https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/objectstorage.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ObjectStorage&lt;/a&gt; type. You cannot pass both &lt;code&gt;input_data&lt;/code&gt; and &lt;code&gt;object_storage_path&lt;/code&gt; simultaneously. When writing data from the object storage, you need to specify the corresponding &lt;code&gt;object_storage_format&lt;/code&gt; (see &lt;a href=\"user-guide/storage/formats#table_formats\"&gt;Table data representation formats&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Parameters:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path: str | YPath&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;input_data: Any | None = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;object_storage_path: None | UPath = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;object_storage_format: None | str | Format = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;table_writer: dict[str, Any] | None = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_row_buffer_size: int | None = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;force_create: None | bool = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ytsaurus_conn_id: str = \"ytsaurus_cluster_default\"&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;XComs:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;object_storage_path&lt;/code&gt; (if writing through &lt;code&gt;object_storage_path&lt;/code&gt;)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"readtableoperator\"&gt;&lt;a href=\"en/api/airflow/userdoc.html#readtableoperator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ReadTableOperator&lt;/span&gt;&lt;/a&gt;ReadTableOperator&lt;/h4&gt;\n&lt;p&gt;Operator for reading data from a static table. It implements the &lt;a href=\"api/commands.html#read_table\"&gt;read_table&lt;/a&gt; functionality from the Python SDK.&lt;/p&gt;\n&lt;p&gt;This operator can write data to the object storage if you pass the &lt;code&gt;object_storage_path&lt;/code&gt; parameter, which is an object of the &lt;a href=\"https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/objectstorage.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ObjectStorage&lt;/a&gt; type. Otherwise, the table will be written to XCom. When writing data to the object storage, you need to specify the desired &lt;code&gt;object_storage_format&lt;/code&gt; (see &lt;a href=\"user-guide/storage/formats#table_formats\"&gt;Table data representation formats&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Parameters:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path: str | YPath&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;object_storage_path: None | UPath = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;object_storage_format: None | str | Format = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;table_reader: None | dict[str, Any] = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;control_attributes: None | dict[str, Any] = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;unordered: None | bool = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;response_parameters: None | dict[str, Any] = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;enable_read_parallel: None | bool = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;omit_inaccessible_columns: None | bool = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ytsaurus_conn_id: str = \"ytsaurus_cluster_default\"&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;XComs:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;object_storage_path&lt;/code&gt; (if writing to &lt;code&gt;object_storage_path&lt;/code&gt;)&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;return_value&lt;/code&gt; (if writing to XCom)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"operators_query_tracker\"&gt;&lt;a href=\"en/api/airflow/userdoc.html#operators_query_tracker\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Query Tracker&lt;/span&gt;&lt;/a&gt;Query Tracker&lt;/h3&gt;\n&lt;h4 id=\"runqueryoperator\"&gt;&lt;a href=\"en/api/airflow/userdoc.html#runqueryoperator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RunQueryOperator&lt;/span&gt;&lt;/a&gt;RunQueryOperator&lt;/h4&gt;\n&lt;p&gt;Operator for executing queries in Query Tracker with different syntax. You can learn more about Query Tracker &lt;a href=\"user-guide/query-tracker/about.html\"&gt;here&lt;/a&gt;. It implements the &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_query\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_query&lt;/a&gt; functionality from the Python SDK.&lt;/p&gt;\n&lt;p&gt;This operator can be run in asynchronous mode, then it will not wait for the query to complete.&lt;/p&gt;\n&lt;p&gt;Query execution results can be written to XCom and the object storage. If the query returns three results, and &lt;code&gt;object_storage_paths&lt;/code&gt; are passed as &lt;code&gt;[None, ObjectStorage(\"s3://bucket/path\"), None]&lt;/code&gt;, then results No. 1 and 3 will be written to XCom, and result No. 2 will be written to the object storage.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Parameters:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;engine: Literal[\"ql\", \"yql\", \"chyt\", \"spyt\"]&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;query: str&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;settings: None | dict[str, Any] | yt.yson.yson_types.YsonType = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;files: None | list[dict[str, Any]] | list[yt.yson.yson_types.YsonType] = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;stage: None | str = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;annotations: None | dict[str, Any] | yt.yson.yson_types.YsonType = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;access_control_objects: None | list[str] = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;sync: bool = True&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;object_storage_paths: list[None | UPath] | None = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ytsaurus_conn_id: str = \"ytsaurus_cluster_default\"&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;XComs:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;meta&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;query_id&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;result_{i}&lt;/code&gt;, where i is the number of the returned result, counted from 0. If &lt;code&gt;object_storage_paths[i]&lt;/code&gt; is passed for the i-th result, the result will not be written to &lt;code&gt;result_{i}&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"en/api/airflow/userdoc.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h2&gt;\n&lt;p&gt;Examples of working with operators are presented in ready-made DAGs &lt;a href=\"https://github.com/ytsaurus/ytsaurus-airflow-provider/tree/main/ytsaurus_airflow_provider/example_dags\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;example_dags&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/api/airflow/userdoc.md","sourcePath":"en/api/airflow/userdoc.md"},"headings":[{"title":"Installation","href":"en/api/airflow/userdoc.html#installation","level":2},{"title":"Getting started","href":"en/api/airflow/userdoc.html#howtostart","level":2},{"title":"Operators","href":"en/api/airflow/userdoc.html#operators","level":2,"items":[{"title":"Working with Cypress","href":"en/api/airflow/userdoc.html#operators_cypress","level":3,"items":[{"title":"GetOperator","href":"en/api/airflow/userdoc.html#getoperator","level":4},{"title":"SetOperator","href":"en/api/airflow/userdoc.html#setoperator","level":4},{"title":"RemoveOperator","href":"en/api/airflow/userdoc.html#removeoperator","level":4},{"title":"CreateOperator","href":"en/api/airflow/userdoc.html#createoperator","level":4},{"title":"ListOperator","href":"en/api/airflow/userdoc.html#listoperator","level":4}]},{"title":"Working with tables","href":"en/api/airflow/userdoc.html#operators_tables","level":3,"items":[{"title":"WriteTableOperator","href":"en/api/airflow/userdoc.html#writetableoperator","level":4},{"title":"ReadTableOperator","href":"en/api/airflow/userdoc.html#readtableoperator","level":4}]},{"title":"Query Tracker","href":"en/api/airflow/userdoc.html#operators_query_tracker","level":3,"items":[{"title":"RunQueryOperator","href":"en/api/airflow/userdoc.html#runqueryoperator","level":4}]}]},{"title":"Examples","href":"en/api/airflow/userdoc.html#examples","level":2}],"title":"YTsaurus Airflow Provider"},"router":{"pathname":"en/api/airflow/userdoc","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
