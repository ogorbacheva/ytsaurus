        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Before using the examples, read the &lt;a href=\"user-guide/storage/auth.html\"&gt;instructions&lt;/a&gt; for obtaining the token.&lt;/p&gt;\n&lt;p&gt;We recommend running all programs on &lt;code&gt;Linux&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"base\"&gt;&lt;a href=\"en/api/python/examples.html#base\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Basic level&lt;/span&gt;&lt;/a&gt;Basic level&lt;/h2&gt;\n&lt;p&gt;The modern method of working with the Python API is typed.&lt;br /&gt;\nData stored in tables and processed by operations is represented in the code by &lt;a href=\"api/python/userdoc.html#dataclass\"&gt;classes&lt;/a&gt; with typed fields (similar to &lt;a href=\"https://docs.python.org/3/library/dataclasses.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;dataclasses&lt;/a&gt;). An unrecommended (but sometimes unavoidable, especially when working with old tables) method is untyped when table rows are represented by dicts.&lt;br /&gt;\nThis method is much slower, fraught with errors, and inconvenient when working with composite types. Therefore, this section of the documentation provides examples of working with the typed API and the untyped examples can be found in the &lt;a href=\"en/api/python/examples.html#untyped_tutorial\"&gt;corresponding section&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"read_write\"&gt;&lt;a href=\"en/api/python/examples.html#read_write\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reading and writing tables&lt;/span&gt;&lt;/a&gt;Reading and writing tables&lt;/h3&gt;\n&lt;p&gt;YTsaurus enables you to write data to tables, as well as to append data to the end of existing tables. Several modes are available for reading tables: reading the entire table, reading individual ranges by row number or key.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/table_read_write_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/table_read_write_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"simple_map\"&gt;&lt;a href=\"en/api/python/examples.html#simple_map\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Simple map&lt;/span&gt;&lt;/a&gt;Simple map&lt;/h3&gt;\n&lt;p&gt;Suppose there is a table with the login, name, and uid columns at //home/dev/tutorial/staff_unsorted.&lt;br /&gt;\nYou need to make a table with email addresses, calculating them from the login: &lt;code&gt;email = login + \"@ytsaurus.tech\"&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;A simple mapper is suitable for this job.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/simple_map_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/simple_map_typed&lt;/a&gt;&lt;/p&gt;\n&lt;h3 id=\"sort_and_reduce\"&gt;&lt;a href=\"en/api/python/examples.html#sort_and_reduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sorting a table and a simple reduce operation&lt;/span&gt;&lt;/a&gt;Sorting a table and a simple reduce operation&lt;/h3&gt;\n&lt;p&gt;Using the same table as in the previous example, you can calculate the statistics: how many times you can see this or that name or which is the longest username among all people with the same name. A Reduce operation is well suited for this job. Since the Reduce operation can only be run on sorted tables, you must first sort the original table.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/simple_reduce_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/simple_reduce_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"reduce_multiple_output\"&gt;&lt;a href=\"en/api/python/examples.html#reduce_multiple_output\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reduce with multiple input tables&lt;/span&gt;&lt;/a&gt;Reduce with multiple input tables&lt;/h3&gt;\n&lt;p&gt;Suppose there is another table besides the table with users and it records which user is a service one. The is_robot field can be true or false.&lt;/p&gt;\n&lt;p&gt;The following program generates a table in which only service users remain.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/multiple_input_reduce_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/multiple_input_reduce_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"reduce_multiple_input_output\"&gt;&lt;a href=\"en/api/python/examples.html#reduce_multiple_input_output\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reduce with multiple input and output tables&lt;/span&gt;&lt;/a&gt;Reduce with multiple input and output tables&lt;/h3&gt;\n&lt;p&gt;This example repeats the previous one, with the difference that two output tables will be written to at once, both with human users and service users.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/multiple_input_multiple_output_reduce_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/multiple_input_multiple_output_reduce_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"table_schema\"&gt;&lt;a href=\"en/api/python/examples.html#table_schema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Table schemas&lt;/span&gt;&lt;/a&gt;Table schemas&lt;/h3&gt;\n&lt;p&gt;All tables in YTsaurus have a &lt;a href=\"api/python/userdoc.html#table_schema\"&gt;schema&lt;/a&gt;.&lt;br /&gt;\nThe code demonstrates examples of working with the table schema.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/table_schema_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/table_schema_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"map_reduce\"&gt;&lt;a href=\"en/api/python/examples.html#map_reduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MapReduce&lt;/span&gt;&lt;/a&gt;MapReduce&lt;/h3&gt;\n&lt;p&gt;YTsaurus implements the MapReduce merge operation that works faster than Map + Sort + Reduce. Let's try to use the table with users once again to calculate the statistics of how many times you can see this or that name. Before calculating the statistics, we will normalize the names by converting them to lowercase so that people with the names &lt;code&gt;ARCHIE&lt;/code&gt; and &lt;code&gt;Archie&lt;/code&gt; are merged in our statistics.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/map_reduce_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/map_reduce_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"map_reduce_multiple_intermediate_streams\"&gt;&lt;a href=\"en/api/python/examples.html#map_reduce_multiple_intermediate_streams\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MapReduce with multiple intermediate tables&lt;/span&gt;&lt;/a&gt;MapReduce with multiple intermediate tables&lt;/h3&gt;\n&lt;p&gt;The intermediate data (between the map and reduce stages) in a MapReduce operation can \"flow\" in multiple streams and have different types. In this example, there are two tables on the operation input: the first displays uid in the name and the second contains information about the events associated with the user with that uid. The mapper selects events like \"click\" and sends them to one output stream, and all users to another. The reducer counts all clicks on this user.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/map_reduce_multiple_intermediate_streams_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/map_reduce_multiple_intermediate_streams_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"job_decorators\"&gt;&lt;a href=\"en/api/python/examples.html#job_decorators\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Decorators for job classes&lt;/span&gt;&lt;/a&gt;Decorators for job classes&lt;/h3&gt;\n&lt;p&gt;You can mark functions or job classes with special decorators that change the expected interface of interaction with jobs.&lt;br /&gt;\nExamples of decorators: &lt;code&gt;with_context&lt;/code&gt;, &lt;code&gt;aggregator&lt;/code&gt;, &lt;code&gt;reduce_aggregator&lt;/code&gt;, &lt;code&gt;raw&lt;/code&gt;, or &lt;code&gt;raw_io&lt;/code&gt;. You can find a full description in the &lt;a href=\"api/python/userdoc.html#python_decorators\"&gt;documentation&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/job_decorators_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/job_decorators_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"files\"&gt;&lt;a href=\"en/api/python/examples.html#files\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with files on the client and in operations&lt;/span&gt;&lt;/a&gt;Working with files on the client and in operations&lt;/h3&gt;\n&lt;p&gt;For more information, see the &lt;a href=\"api/python/userdoc.html#file_commands\"&gt;documentation&lt;/a&gt;.&lt;br /&gt;\nFor more information about files in Cypress, see the &lt;a href=\"user-guide/storage/files.html\"&gt;section&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/files_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/files_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"grep\"&gt;&lt;a href=\"en/api/python/examples.html#grep\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Grep&lt;/span&gt;&lt;/a&gt;Grep&lt;/h3&gt;\n&lt;p&gt;The typed API enables you to work with fairly arbitrary data using a single data class and a single operation class. As an example, let's consider the job of filtering a table based on a regular expression matching a given row field.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/grep_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/grep_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"advanced\"&gt;&lt;a href=\"en/api/python/examples.html#advanced\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Advanced level&lt;/span&gt;&lt;/a&gt;Advanced level&lt;/h2&gt;\n&lt;h3 id=\"batch_queries\"&gt;&lt;a href=\"en/api/python/examples.html#batch_queries\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batch queries&lt;/span&gt;&lt;/a&gt;Batch queries&lt;/h3&gt;\n&lt;p&gt;You can execute \"light\" queries (create/delete a table, check its existence, and others) in groups. It is reasonable to use this method if you need to perform a large number of single-type operations: batch queries can significantly save execution time.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/batch_client\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/batch_client&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"rpc\"&gt;&lt;a href=\"en/api/python/examples.html#rpc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Using the RPC&lt;/span&gt;&lt;/a&gt;Using the RPC&lt;/h3&gt;\n&lt;p&gt;Using the RPC with the CLI.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt list / --proxy cluster_name --config &lt;span class=\"hljs-string\"&gt;'{backend=rpc}'&lt;/span&gt;\ncooked_logs\nhome\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"135\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-135\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-135\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-135.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;A similar example (full code at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/simple_rpc\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/simple_rpc&lt;/a&gt;) can be built in Python (with ya-make build):&lt;/p&gt;\n&lt;p&gt;Pay attention to the additional &lt;code&gt;PEERDIR(yt/python/client_with_rpc)&lt;/code&gt; in &lt;code&gt;ya.make&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;You can work with dynamic tables using the RPC.&lt;br /&gt;\nThe example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/dynamic_tables_rpc\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/dynamic_tables_rpc&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"prepare_operation\"&gt;&lt;a href=\"en/api/python/examples.html#prepare_operation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Specifying row types using prepare_operation&lt;/span&gt;&lt;/a&gt;Specifying row types using prepare_operation&lt;/h3&gt;\n&lt;p&gt;In addition to using type hints, the &lt;code&gt;prepare_operation&lt;/code&gt; method where all types are specified using special methods can be defined to specify Python table row types. If there is a &lt;code&gt;prepare_operation&lt;/code&gt; method in the job class, the library will use the types specified inside the method and there will be no attempts to derive row types from type hints.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/prepare_operation_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/prepare_operation_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"misc\"&gt;&lt;a href=\"en/api/python/examples.html#misc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Different examples&lt;/span&gt;&lt;/a&gt;Different examples&lt;/h2&gt;\n&lt;h3 id=\"dataclass\"&gt;&lt;a href=\"en/api/python/examples.html#dataclass\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data classes&lt;/span&gt;&lt;/a&gt;Data classes&lt;/h3&gt;\n&lt;p&gt;This example demonstrates the features and peculiarities of working with &lt;a href=\"api/python/userdoc.html#dataclass\"&gt;data classes&lt;/a&gt; in more detail.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/dataclass_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/dataclass_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"table_switches\"&gt;&lt;a href=\"en/api/python/examples.html#table_switches\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Context and managing writes to output tables&lt;/span&gt;&lt;/a&gt;Context and managing writes to output tables&lt;/h3&gt;\n&lt;p&gt;To select which output table to write a row to, you must use the &lt;code&gt;OutputRow&lt;/code&gt; wrapper class, namely the &lt;code&gt;table_index&lt;/code&gt; argument of its constructor. Having any iterator on data classes (returned from &lt;code&gt;read_table_structured()&lt;/code&gt; or passed to the &lt;code&gt;__call__()&lt;/code&gt; method of the job), you can use the &lt;code&gt;.with_context()&lt;/code&gt; method to make an iterator on pairs &lt;code&gt;(row, context)&lt;/code&gt; from it. The &lt;code&gt;context&lt;/code&gt; object has the &lt;code&gt;.get_table_index()&lt;/code&gt;, &lt;code&gt;.get_row_index()&lt;/code&gt;, and &lt;code&gt;.get_range_index()&lt;/code&gt; methods.&lt;/p&gt;\n&lt;p&gt;When writing a job class to whose &lt;code&gt;__call__()&lt;/code&gt; method a separate row (for example, mappers) is passed rather than an iterator, you can add the &lt;code&gt;@yt.wrapper.with_context&lt;/code&gt; decorator to the class. In this case, the &lt;code&gt;__call__()&lt;/code&gt; method must take a third &lt;code&gt;context&lt;/code&gt; argument (see the &lt;a href=\"api/python/userdoc.html#python_decorators\"&gt;documentation&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;In the reducer, mapper aggregators, and when reading tables — whenever there is an iterator on rows, use the &lt;code&gt;with_context&lt;/code&gt; method of the iterator.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/table_switches_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/table_switches_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"spec_builder\"&gt;&lt;a href=\"en/api/python/examples.html#spec_builder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Spec builders&lt;/span&gt;&lt;/a&gt;Spec builders&lt;/h3&gt;\n&lt;p&gt;Use the &lt;a href=\"api/python/userdoc.html#spec_builder\"&gt;spec builder&lt;/a&gt; to describe the specification of operations to avoid errors.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/spec_builder_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/spec_builder_typed&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gevent\"&gt;&lt;a href=\"en/api/python/examples.html#gevent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Using gevent&lt;/span&gt;&lt;/a&gt;Using gevent&lt;/h3&gt;\n&lt;p&gt;The documentation is contained &lt;a href=\"api/python/userdoc.html#gevent\"&gt;in the separate section&lt;/a&gt;.&lt;br /&gt;\nThe example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/gevent\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/python/examples/gevent&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/api/python/examples.md","sourcePath":"en/api/python/examples.md"},"headings":[{"title":"Basic level","href":"en/api/python/examples.html#base","level":2,"items":[{"title":"Reading and writing tables","href":"en/api/python/examples.html#read_write","level":3},{"title":"Simple map","href":"en/api/python/examples.html#simple_map","level":3},{"title":"Sorting a table and a simple reduce operation","href":"en/api/python/examples.html#sort_and_reduce","level":3},{"title":"Reduce with multiple input tables","href":"en/api/python/examples.html#reduce_multiple_output","level":3},{"title":"Reduce with multiple input and output tables","href":"en/api/python/examples.html#reduce_multiple_input_output","level":3},{"title":"Table schemas","href":"en/api/python/examples.html#table_schema","level":3},{"title":"MapReduce","href":"en/api/python/examples.html#map_reduce","level":3},{"title":"MapReduce with multiple intermediate tables","href":"en/api/python/examples.html#map_reduce_multiple_intermediate_streams","level":3},{"title":"Decorators for job classes","href":"en/api/python/examples.html#job_decorators","level":3},{"title":"Working with files on the client and in operations","href":"en/api/python/examples.html#files","level":3},{"title":"Grep","href":"en/api/python/examples.html#grep","level":3}]},{"title":"Advanced level","href":"en/api/python/examples.html#advanced","level":2,"items":[{"title":"Batch queries","href":"en/api/python/examples.html#batch_queries","level":3},{"title":"Using the RPC","href":"en/api/python/examples.html#rpc","level":3},{"title":"Specifying row types using prepare_operation","href":"en/api/python/examples.html#prepare_operation","level":3}]},{"title":"Different examples","href":"en/api/python/examples.html#misc","level":2,"items":[{"title":"Data classes","href":"en/api/python/examples.html#dataclass","level":3},{"title":"Context and managing writes to output tables","href":"en/api/python/examples.html#table_switches","level":3},{"title":"Spec builders","href":"en/api/python/examples.html#spec_builder","level":3},{"title":"Using gevent","href":"en/api/python/examples.html#gevent","level":3}]}],"title":"Python API with examples"},"router":{"pathname":"en/api/python/examples","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
