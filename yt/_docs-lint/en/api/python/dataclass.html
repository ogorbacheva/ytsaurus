        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Data classes are only supported in Python 3.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;The main method used to represent table rows is to create classes with fields marked by types (similar to &lt;a href=\"https://docs.python.org/3/library/dataclasses.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;dataclasses&lt;/a&gt;). See also the &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/dataclass_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;example&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"motivation\"&gt;&lt;a href=\"en/api/python/dataclass.html#motivation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Motivation&lt;/span&gt;&lt;/a&gt;Motivation&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Convenience: since the YTsaurus scalar type system is richer than in Python, marking by types helps explicitly express the desired column types. The convenience can be seen even better when working with composite types, such as structures.&lt;/li&gt;\n&lt;li&gt;Strong typing helps you detect errors in the code before they result in incorrect data and other negative effects. To do this, linters and IDEs can be used.&lt;/li&gt;\n&lt;li&gt;Speed: due to the &lt;a href=\"user-guide/storage/skiff.html\"&gt;Skiff&lt;/a&gt; format and some other optimizations, CPU consumption is several times lower than for untyped data.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"installation\"&gt;&lt;a href=\"en/api/python/dataclass.html#installation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Installation&lt;/span&gt;&lt;/a&gt;Installation&lt;/h2&gt;\n&lt;p&gt;To work with the &lt;code&gt;yt.wrapper.schema&lt;/code&gt; module, install the packages:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;typing_extensions&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ytsaurus-yson&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;six&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"introduction\"&gt;&lt;a href=\"en/api/python/dataclass.html#introduction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Introduction&lt;/span&gt;&lt;/a&gt;Introduction&lt;/h2&gt;\n&lt;p&gt;To work with tabular data, you must declare a class with the &lt;code&gt;yt.wrapper.yt_dataclass&lt;/code&gt; decorator and mark its fields with types. The field type comes after the colon. It can be:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Python built-in types: &lt;code&gt;int&lt;/code&gt;, &lt;code&gt;float&lt;/code&gt;, &lt;code&gt;str&lt;/code&gt;, and others.&lt;/li&gt;\n&lt;li&gt;Custom classes with the &lt;code&gt;@yt_dataclass&lt;/code&gt; decorator.&lt;/li&gt;\n&lt;li&gt;Composite types from the &lt;a href=\"https://docs.python.org/3/library/typing.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;typing&lt;/a&gt; module. &lt;code&gt;List&lt;/code&gt;, &lt;code&gt;Dict&lt;/code&gt;, &lt;code&gt;Optional&lt;/code&gt;, and &lt;code&gt;Tuple&lt;/code&gt; are currently supported. We're also planning to add support for a number of other types in the future.&lt;/li&gt;\n&lt;li&gt;Special types from &lt;code&gt;yt.wrapper.schema&lt;/code&gt;: &lt;code&gt;Int8&lt;/code&gt;, &lt;code&gt;Uint16&lt;/code&gt;, &lt;code&gt;OtherColumns&lt;/code&gt;, and others (a more complete list is given &lt;a href=\"en/api/python/dataclass.html#types\"&gt;below&lt;/a&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-meta\"&gt;@yt.wrapper.yt_dataclass&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;Row&lt;/span&gt;:\n    &lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;: &lt;span class=\"hljs-built_in\"&gt;int&lt;/span&gt;\n    name: &lt;span class=\"hljs-built_in\"&gt;str&lt;/span&gt;\n    is_robot: &lt;span class=\"hljs-built_in\"&gt;bool&lt;/span&gt; = &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"87\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-87\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-87\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-87.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;For the class described in this way, a constructor and other service methods will be generated. In particular, &lt;code&gt;__eq__&lt;/code&gt; and &lt;code&gt;__repr__&lt;/code&gt;. You can specify a default value for some fields. It will get into the constructor signature. You can create objects of this class as follows: &lt;code&gt;row = Row(id=123, name=\"foo\")&lt;/code&gt;. For all the fields without default values (such as &lt;code&gt;robot: bool = False&lt;/code&gt;), you need to pass relevant fields to the constructor. Otherwise, it will throw an exception.&lt;/p&gt;\n&lt;p&gt;The data classes support inheritance.&lt;/p&gt;\n&lt;p&gt;When you have a class like this, you can:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Create a table with a relevant schema (you can just start writing to an empty or a non-existent table or use the &lt;code&gt;TableSchema.from_row_type()&lt;/code&gt; function).&lt;/li&gt;\n&lt;li&gt;Write and read &lt;a href=\"api/python/userdoc.html#table_commands\"&gt;tables&lt;/a&gt;, &lt;a href=\"api/python/examples.html#read_write\"&gt;example&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Run &lt;a href=\"api/python/userdoc.html#python_operations\"&gt;operations&lt;/a&gt;, &lt;a href=\"api/python/examples.html#simple_map\"&gt;example&lt;/a&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Data classes can also be created based on table schemas explicitly or automatically, by reading structured data.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt_table_schema = client.get(&lt;span class=\"hljs-string\"&gt;f\"&lt;span class=\"hljs-subst\"&gt;{table_path}&lt;/span&gt;/@schema\"&lt;/span&gt;)\ndataclass_type = yt.schema.make_dataclass_from_table_schema(yt.schema.TableSchema.from_yson_type(yt_table_schema))\n\n&lt;span class=\"hljs-comment\"&gt;# or&lt;/span&gt;\n\ntyped_table_data = &lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(client.read_table_structured(table=table_path, row_type=&lt;span class=\"hljs-literal\"&gt;None&lt;/span&gt;))\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"117\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-117\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-117\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-117.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"types\"&gt;&lt;a href=\"en/api/python/dataclass.html#types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Special types&lt;/span&gt;&lt;/a&gt;Special types&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;code&gt;yt.wrapper.schema&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;Python&lt;/th&gt;\n&lt;th&gt;Diagram&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Int8,&lt;/code&gt; &lt;code&gt;Int16&lt;/code&gt;, &lt;code&gt;Int32&lt;/code&gt;, &lt;code&gt;Int64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int8&lt;/code&gt;, &lt;code&gt;int16&lt;/code&gt;, &lt;code&gt;int32&lt;/code&gt;, &lt;code&gt;int64&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Uint8&lt;/code&gt;, &lt;code&gt;Uint16&lt;/code&gt;, &lt;code&gt;Uint32&lt;/code&gt;, &lt;code&gt;Uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint8&lt;/code&gt;, &lt;code&gt;uint16&lt;/code&gt;, &lt;code&gt;uint32&lt;/code&gt;, &lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;YsonBytes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bytes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;yson&lt;/code&gt;/&lt;code&gt;any&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;OtherColumns&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;OtherColumns&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Corresponds to several columns.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/api/python/dataclass.md","sourcePath":"en/api/python/dataclass.md"},"headings":[{"title":"Motivation","href":"en/api/python/dataclass.html#motivation","level":2},{"title":"Installation","href":"en/api/python/dataclass.html#installation","level":2},{"title":"Introduction","href":"en/api/python/dataclass.html#introduction","level":2},{"title":"Special types","href":"en/api/python/dataclass.html#types","level":2}],"title":"Data classes"},"router":{"pathname":"en/api/python/dataclass","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
