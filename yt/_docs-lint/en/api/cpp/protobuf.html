        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section describes the use of the &lt;a href=\"https://en.wikipedia.org/wiki/Protocol_Buffers\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;protobuf&lt;/a&gt; structured data transfer protocol for working with tables in the C++ API.&lt;/p&gt;\n&lt;h2 id=\"introduction\"&gt;&lt;a href=\"en/api/cpp/protobuf.html#introduction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Introduction&lt;/span&gt;&lt;/a&gt;Introduction&lt;/h2&gt;\n&lt;p&gt;The C++ API enables you to use protobuf classes (messages) to read and write tables both by the client and inside the job.&lt;/p&gt;\n&lt;p&gt;We recommend using the &lt;a href=\"https://protobuf.dev/programming-guides/proto/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;proto2&lt;/a&gt; version. If you use &lt;a href=\"https://protobuf.dev/programming-guides/proto3/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;proto3&lt;/a&gt;, errors may occur: for example, when trying to write &lt;code&gt;0&lt;/code&gt; in the &lt;code&gt;required=%true&lt;/code&gt; field.&lt;/p&gt;\n&lt;h3 id=\"how-it-works\"&gt;&lt;a href=\"en/api/cpp/protobuf.html#how-it-works\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How it works&lt;/span&gt;&lt;/a&gt;How it works&lt;/h3&gt;\n&lt;p&gt;The user describes the proto structure in the &lt;code&gt;.proto&lt;/code&gt; file. The proto structure can be marked with different &lt;a href=\"en/api/cpp/protobuf.html#flags\"&gt;flags&lt;/a&gt;. Flags affect how YTsaurus will generate or interpret the fields specified within messages.&lt;/p&gt;\n&lt;h2 id=\"primitive\"&gt;&lt;a href=\"en/api/cpp/protobuf.html#primitive\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Elementary types&lt;/span&gt;&lt;/a&gt;Elementary types&lt;/h2&gt;\n&lt;p&gt;To work with the &lt;a href=\"user-guide/storage/data-types.html\"&gt;YTsaurus data type&lt;/a&gt; from the first column, you can use the corresponding protobuf type from the second column in the table below.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;YTsaurus&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Protobuf&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;, &lt;code&gt;utf8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;, &lt;code&gt;bytes&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;int{8,16,32,64}&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int{32,64}&lt;/code&gt;, &lt;code&gt;sint{32,64}&lt;/code&gt;, &lt;code&gt;sfixed{32,64}&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;uint{8,16,32,64}&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint{32,64}&lt;/code&gt;, &lt;code&gt;fixed{32,64}&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;double&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;double&lt;/code&gt;, &lt;code&gt;float&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;date&lt;/code&gt;, &lt;code&gt;datetime&lt;/code&gt;, &lt;code&gt;timestamp&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint{32,64}&lt;/code&gt;, &lt;code&gt;fixed{32,64}&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;interval&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int{32,64}&lt;/code&gt;, &lt;code&gt;sint{32,64}&lt;/code&gt;, &lt;code&gt;sfixed{32,64}&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;If the range of the integer YTsaurus type does not correspond to the range of the protobuf type, a check is performed at the time of encoding or decoding.&lt;/p&gt;\n&lt;h2 id=\"optional_required\"&gt;&lt;a href=\"en/api/cpp/protobuf.html#optional_required\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Optional/required properties&lt;/span&gt;&lt;/a&gt;Optional/required properties&lt;/h2&gt;\n&lt;p&gt;The &lt;code&gt;optional&lt;/code&gt;/&lt;code&gt;required&lt;/code&gt; properties in protobuf do not have to correspond to the options of columns in YT. The system always checks when protobuf messages are encoded or decoded.&lt;/p&gt;\n&lt;p&gt;For example, if the &lt;code&gt;foo&lt;/code&gt; column in YTsaurus has the &lt;code&gt;int64&lt;/code&gt; type (&lt;code&gt;required=%true&lt;/code&gt;), the following field can be used for its representation:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs protobuf\"&gt;  &lt;span class=\"hljs-keyword\"&gt;optional&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;int64&lt;/span&gt; foo = &lt;span class=\"hljs-number\"&gt;42&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"106\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-106\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-106\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-106.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;There will be no errors as long as all protobuf messages that are written to the table have the filled in &lt;code&gt;foo&lt;/code&gt; field.&lt;/p&gt;\n&lt;h2 id=\"embedded\"&gt;&lt;a href=\"en/api/cpp/protobuf.html#embedded\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Embedded messages&lt;/span&gt;&lt;/a&gt;Embedded messages&lt;/h2&gt;\n&lt;p&gt;Historically, all embedded protobuf structures are written in YTsaurus as a byte string storing the &lt;a href=\"en/api/cpp/protobuf.html#serialization\"&gt;serialized&lt;/a&gt; representation of the embedded structure.&lt;/p&gt;\n&lt;p&gt;Embedded messages are quite efficient, but do not enable you to conveniently represent values in the web interface or work with them using other methods (without the help of protobuf).&lt;/p&gt;\n&lt;p&gt;This method can also be specified explicitly by setting a special &lt;a href=\"en/api/cpp/protobuf.html#flags\"&gt;flag&lt;/a&gt; in the field:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;optional TEmbeddedMessage UrlRow_1 = 1 [(NYT.flags) = SERIALIZATION_PROTOBUF];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"122\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-122\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-122\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-122.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You can specify an alternative flag, then YTsaurus will refer the field to the &lt;code&gt;struct&lt;/code&gt; type:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs protobuf\"&gt;&lt;span class=\"hljs-keyword\"&gt;optional&lt;/span&gt; TEmbeddedMessage ColumnName = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt; [(NYT.flags) = SERIALIZATION_YT];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"126\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-126\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-126\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-126.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;To use embedded messages:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The table must have a &lt;a href=\"user-guide/storage/static-schema.html\"&gt;schema&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;The corresponding column (in the example: &lt;code&gt;ColumnName&lt;/code&gt;) must have the &lt;a href=\"user-guide/storage/data-types.html#schema_struct\"&gt;struct&lt;/a&gt; YTsaurus type.&lt;/li&gt;\n&lt;li&gt;The &lt;code&gt;struct&lt;/code&gt; type fields must correspond to the fields of the embedded message (in the example: &lt;code&gt;TEmbeddedMessage&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The flag in embedded messages is not inherited by default. If the &lt;code&gt;SERIALIZATION_YT&lt;/code&gt; flag is set for the field with the &lt;code&gt;T&lt;/code&gt; type, the default behavior for structures embedded in &lt;code&gt;T&lt;/code&gt; will still correspond to the &lt;code&gt;SERIALIZATION_PROTOBUF&lt;/code&gt; flag.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"repeated\"&gt;&lt;a href=\"en/api/cpp/protobuf.html#repeated\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Repeated fields&lt;/span&gt;&lt;/a&gt;Repeated fields&lt;/h2&gt;\n&lt;p&gt;To work with repeated fields, you must explicitly specify the &lt;code&gt;SERIALIZATION_YT&lt;/code&gt; flag:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs protobuf\"&gt;&lt;span class=\"hljs-keyword\"&gt;repeated&lt;/span&gt; TType ListColumn = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt; [(NYT.flags) = SERIALIZATION_YT];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"163\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-163\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-163\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-163.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;In YT, such a field will have the &lt;code&gt;list&lt;/code&gt; type. To use repeated fields:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The table must have a &lt;a href=\"user-guide/storage/static-schema.html\"&gt;schema&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;The corresponding column (in the example: &lt;code&gt;ListColumn&lt;/code&gt;) must have the &lt;a href=\"user-guide/storage/data-types.html#schema_list\"&gt;list&lt;/a&gt; YTsaurus type.&lt;/li&gt;\n&lt;li&gt;The element of the &lt;code&gt;list&lt;/code&gt; YTsaurus type must correspond to the protobuf column type (in the example: &lt;code&gt;TType&lt;/code&gt;). This can be an &lt;a href=\"en/api/cpp/protobuf.html#primitive\"&gt;elementary&lt;/a&gt; type or an &lt;a href=\"en/api/cpp/protobuf.html#embedded\"&gt;embedded message&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The &lt;code&gt;SERIALIZATION_PROTOBUF&lt;/code&gt; flag for repeated fields is not supported.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"oneof\"&gt;&lt;a href=\"en/api/cpp/protobuf.html#oneof\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Oneof fields&lt;/span&gt;&lt;/a&gt;Oneof fields&lt;/h2&gt;\n&lt;p&gt;By default, fields within a &lt;code&gt;oneof&lt;/code&gt; group correspond to the &lt;a href=\"user-guide/storage/data-types.html#schema_variant\"&gt;variant&lt;/a&gt; YTsaurus type. For example, the message below will correspond to the structure with the &lt;code&gt;x&lt;/code&gt; field of the &lt;code&gt;int64&lt;/code&gt; type and the &lt;code&gt;my_oneof&lt;/code&gt; field of the &lt;code&gt;variant&amp;lt;y: string, z: bool&amp;gt;&lt;/code&gt; type:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs protobuf\"&gt;&lt;span class=\"hljs-keyword\"&gt;message &lt;/span&gt;&lt;span class=\"hljs-title class_\"&gt;TMessage&lt;/span&gt; {\n    &lt;span class=\"hljs-keyword\"&gt;optional&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;int64&lt;/span&gt; x = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n    &lt;span class=\"hljs-keyword\"&gt;oneof&lt;/span&gt; my_oneof {\n        &lt;span class=\"hljs-type\"&gt;string&lt;/span&gt; y = &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;;\n        &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; z = &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;;\n    }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"200\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-200\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-200\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-200.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If you infer the schema using &lt;code&gt;CreateTableSchema&amp;lt;T&amp;gt;()&lt;/code&gt;, a similar type will be inferred.&lt;/p&gt;\n&lt;p&gt;To make &lt;code&gt;oneof&lt;/code&gt; groups correspond to the fields of the structure where they are described, use the &lt;code&gt;(NYT.oneof_flags) = SEPARATE_FIELDS&lt;/code&gt; flag:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs protobuf\"&gt;&lt;span class=\"hljs-keyword\"&gt;message &lt;/span&gt;&lt;span class=\"hljs-title class_\"&gt;TMessage&lt;/span&gt; {\n    &lt;span class=\"hljs-keyword\"&gt;optional&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;int64&lt;/span&gt; x = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n    &lt;span class=\"hljs-keyword\"&gt;oneof&lt;/span&gt; my_oneof {\n        &lt;span class=\"hljs-keyword\"&gt;option&lt;/span&gt; (NYT.oneof_flags) = SEPARATE_FIELDS;\n        &lt;span class=\"hljs-type\"&gt;string&lt;/span&gt; y = &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;;\n        &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; z = &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;;\n    }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"207\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-207\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-207\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-207.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;This message will correspond to the structure with optional fields &lt;code&gt;x&lt;/code&gt;, &lt;code&gt;y&lt;/code&gt;, and &lt;code&gt;z&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"map\"&gt;&lt;a href=\"en/api/cpp/protobuf.html#map\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Map fields&lt;/span&gt;&lt;/a&gt;Map fields&lt;/h2&gt;\n&lt;p&gt;There are 4 options for displaying such a field in a column in a table. See the example below:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs protobuf\"&gt;&lt;span class=\"hljs-keyword\"&gt;message &lt;/span&gt;&lt;span class=\"hljs-title class_\"&gt;TValue&lt;/span&gt; {\n    &lt;span class=\"hljs-keyword\"&gt;optional&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;int64&lt;/span&gt; x = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n}\n\n&lt;span class=\"hljs-keyword\"&gt;message &lt;/span&gt;&lt;span class=\"hljs-title class_\"&gt;TMessage&lt;/span&gt; {\n    map&amp;lt;&lt;span class=\"hljs-type\"&gt;string&lt;/span&gt;, TValue&amp;gt; map_field = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt; [(NYT.flags) = SERIALIZATION_YT];\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"217\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-217\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-217\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-217.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Depending on its flags, the &lt;code&gt;map_field&lt;/code&gt; field can correspond to:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The list of structures with the &lt;code&gt;key&lt;/code&gt; field of the &lt;code&gt; string&lt;/code&gt; type and the &lt;code&gt;value&lt;/code&gt; field of the &lt;code&gt;string&lt;/code&gt; type, which will contain the serialized protobuf &lt;code&gt;TValue&lt;/code&gt; (as if the &lt;code&gt;SERIALIZATION_PROTOBUF&lt;/code&gt; flag is set for the &lt;code&gt;value&lt;/code&gt; field). In this case, the default flag is &lt;code&gt;MAP_AS_LIST_OF_STRUCTS_LEGACY&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;The list of structures with the &lt;code&gt;key&lt;/code&gt; field of the &lt;code&gt;string&lt;/code&gt; type and the &lt;code&gt;value&lt;/code&gt; field of the &lt;code&gt;Struct&amp;lt;x: Int64&amp;gt;&lt;/code&gt; type (as if the &lt;code&gt;SERIALIZATION_PROTOBUF&lt;/code&gt; flag is set for the &lt;code&gt;value&lt;/code&gt; field). In this case, the default flag is &lt;code&gt;MAP_AS_LIST_OF_STRUCTS&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;The &lt;code&gt;Dict&amp;lt;String, Struct&amp;lt;x: Int64&amp;gt;&amp;gt;&amp;gt;&lt;/code&gt; dict: the &lt;code&gt;MAP_AS_DICT&lt;/code&gt; flag.&lt;/li&gt;\n&lt;li&gt;The optional &lt;code&gt;Optional&amp;lt;Dict&amp;lt;String, Struct&amp;lt;x: Int64&amp;gt;&amp;gt;&amp;gt;&amp;gt;&lt;/code&gt; dict: the &lt;code&gt;MAP_AS_OPTIONAL_DICT&lt;/code&gt; flag.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"flags\"&gt;&lt;a href=\"en/api/cpp/protobuf.html#flags\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Flags&lt;/span&gt;&lt;/a&gt;Flags&lt;/h2&gt;\n&lt;p&gt;You can use flags to customize the protobuf behavior. To do this, connect the library &lt;code&gt;.proto&lt;/code&gt; file.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs protobuf\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"mapreduce/yt/interface/protos/extension.proto\"&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"249\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-249\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-249\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-249.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Flags can correspond to messages, &lt;code&gt;oneof&lt;/code&gt; groups, and message fields.&lt;/p&gt;\n&lt;p&gt;You can specify flags at the level of the &lt;code&gt;.proto&lt;/code&gt; file, message, &lt;code&gt;oneof&lt;/code&gt; group, and message field.&lt;/p&gt;\n&lt;h3 id=\"serialization\"&gt;&lt;a href=\"en/api/cpp/protobuf.html#serialization\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SERIALIZATION_YT, SERIALIZATION_PROTOBUF&lt;/span&gt;&lt;/a&gt;SERIALIZATION_YT, SERIALIZATION_PROTOBUF&lt;/h3&gt;\n&lt;p&gt;Behavior of these flags is described &lt;a href=\"en/api/cpp/protobuf.html#embedded\"&gt;above&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;By default, &lt;code&gt;SERIALIZATION_PROTOBUF&lt;/code&gt; is implied where relevant. You can change the flag for a single message:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs protobuf\"&gt;&lt;span class=\"hljs-keyword\"&gt;message &lt;/span&gt;&lt;span class=\"hljs-title class_\"&gt;TMyMessage&lt;/span&gt;\n{\n    &lt;span class=\"hljs-keyword\"&gt;option&lt;/span&gt; (NYT.default_field_flags) = SERIALIZATION_YT;\n    ...\n}\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"265\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-265\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-265\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-265.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"other_columns\"&gt;&lt;a href=\"en/api/cpp/protobuf.html#other_columns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;OTHER_COLUMNS&lt;/span&gt;&lt;/a&gt;OTHER_COLUMNS&lt;/h3&gt;\n&lt;p&gt;You can mark the field of the &lt;code&gt;bytes&lt;/code&gt; type with the &lt;code&gt;OTHER_COLUMNS&lt;/code&gt; flag. This field can contain a YSON map that contains representations of all fields not described by other fields of this protobuf structure.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs protobuf\"&gt;&lt;span class=\"hljs-keyword\"&gt;message &lt;/span&gt;&lt;span class=\"hljs-title class_\"&gt;TMyMessage&lt;/span&gt;\n{\n    ...\n    &lt;span class=\"hljs-keyword\"&gt;optional&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;bytes&lt;/span&gt; OtherColumns = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt; [(NYT.flags) = OTHER_COLUMNS];\n    ...\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"272\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-272\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-272\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-272.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"enum_int\"&gt;&lt;a href=\"en/api/cpp/protobuf.html#enum_int\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ENUM_STRING / ENUM_INT&lt;/span&gt;&lt;/a&gt;ENUM_STRING / ENUM_INT&lt;/h3&gt;\n&lt;p&gt;You can mark the fields of the &lt;code&gt;enum&lt;/code&gt; type with the &lt;code&gt;ENUM_STRING&lt;/code&gt;/&lt;code&gt;ENUM_INT&lt;/code&gt; flags:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;If the field is marked &lt;code&gt;ENUM_INT&lt;/code&gt;, it will be saved to the column as an integer.&lt;/li&gt;\n&lt;li&gt;If the field is marked &lt;code&gt;ENUM_STRING&lt;/code&gt;, it will be saved to the column as a string.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;By default, &lt;code&gt;ENUM_STRING&lt;/code&gt; is implied.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs protobuf\"&gt;&lt;span class=\"hljs-keyword\"&gt;enum &lt;/span&gt;&lt;span class=\"hljs-title class_\"&gt;Color&lt;/span&gt;\n{\n    WHITE = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n    BLUE = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n    RED = -&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n}\n\n...\n&lt;span class=\"hljs-keyword\"&gt;optional&lt;/span&gt; Color ColorField = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt; [(NYT.flags) = ENUM_INT];\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"294\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-294\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-294\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-294.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"any\"&gt;&lt;a href=\"en/api/cpp/protobuf.html#any\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ANY&lt;/span&gt;&lt;/a&gt;ANY&lt;/h3&gt;\n&lt;p&gt;You can mark the fields of the &lt;code&gt;bytes&lt;/code&gt; type with the &lt;code&gt;ANY&lt;/code&gt; flag. Such fields contain a YSON representation of a column of any simple type.&lt;br /&gt;\nFor example, you can write the following code for the &lt;code&gt;string&lt;/code&gt; type column:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs protobuf\"&gt;&lt;span class=\"hljs-comment\"&gt;// message.proto&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;message &lt;/span&gt;&lt;span class=\"hljs-title class_\"&gt;TMyMessage&lt;/span&gt;\n{\n    ...\n    &lt;span class=\"hljs-keyword\"&gt;optional&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;bytes&lt;/span&gt; AnyColumn = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt; [(NYT.flags) = ANY];\n    ...\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"301\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-301\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-301\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-301.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-comment\"&gt;// main.cpp&lt;/span&gt;\nTNode node = &lt;span class=\"hljs-string\"&gt;\"Linnaeus\"&lt;/span&gt;;\nTMyMessage m;\nm.&lt;span class=\"hljs-built_in\"&gt;SetAnyColumn&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;NodeToYsonString&lt;/span&gt;(node));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"302\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-302\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-302\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-302.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/api/cpp/protobuf.md","sourcePath":"en/api/cpp/protobuf.md"},"headings":[{"title":"Introduction","href":"en/api/cpp/protobuf.html#introduction","level":2,"items":[{"title":"How it works","href":"en/api/cpp/protobuf.html#how-it-works","level":3}]},{"title":"Elementary types","href":"en/api/cpp/protobuf.html#primitive","level":2},{"title":"Optional/required properties","href":"en/api/cpp/protobuf.html#optional_required","level":2},{"title":"Embedded messages","href":"en/api/cpp/protobuf.html#embedded","level":2},{"title":"Repeated fields","href":"en/api/cpp/protobuf.html#repeated","level":2},{"title":"Oneof fields","href":"en/api/cpp/protobuf.html#oneof","level":2},{"title":"Map fields","href":"en/api/cpp/protobuf.html#map","level":2},{"title":"Flags","href":"en/api/cpp/protobuf.html#flags","level":2,"items":[{"title":"SERIALIZATION_YT, SERIALIZATION_PROTOBUF","href":"en/api/cpp/protobuf.html#serialization","level":3},{"title":"OTHER_COLUMNS","href":"en/api/cpp/protobuf.html#other_columns","level":3},{"title":"ENUM_STRING / ENUM_INT","href":"en/api/cpp/protobuf.html#enum_int","level":3},{"title":"ANY","href":"en/api/cpp/protobuf.html#any","level":3}]}],"title":"Protobuf representation of tables"},"router":{"pathname":"en/api/cpp/protobuf","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
