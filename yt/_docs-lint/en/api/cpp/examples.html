            {"data":{"leading":false,"html":"&lt;p&gt;You need to get a &lt;a href=\"user-guide/storage/auth.html\"&gt;YTsaurus token&lt;/a&gt; before running the examples.&lt;/p&gt;\n&lt;p&gt;Run the examples on &lt;code&gt;Linux&lt;/code&gt;, with no arguments.&lt;/p&gt;\n&lt;p&gt;We recommend setting the log level to &lt;code&gt;INFO&lt;/code&gt; or &lt;code&gt;DEBUG&lt;/code&gt; to make programs output links to the web interface where you can monitor the execution.&lt;/p&gt;\n&lt;p&gt;The log level is set using an environment variable with this command (more info is available in the &lt;a href=\"api/cpp/description.html#logging\"&gt;documentation&lt;/a&gt;):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_LOG_LEVEL=INFO\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"12\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-12\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-12\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-12.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;For production processes, we recommend saving the most detailed &lt;code&gt;DEBUG&lt;/code&gt; logs. If any problem occurs, these logs will help you find out what was happening.&lt;/p&gt;\n&lt;h2 id=\"basic-level\"&gt;&lt;a href=\"en/api/cpp/examples.html#basic-level\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Basic level&lt;/span&gt;&lt;/a&gt;Basic level&lt;/h2&gt;\n&lt;h3 id=\"simple-map-tnode-version\"&gt;&lt;a href=\"en/api/cpp/examples.html#simple-map-tnode-version\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Simple Map (TNode version)&lt;/span&gt;&lt;/a&gt;Simple Map (TNode version)&lt;/h3&gt;\n&lt;p&gt;Suppose there is a table with logins. You want to make a table with email addresses, deriving them from the login: &lt;code&gt;email = login + \"@domain\"&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;To do this, you can use a simple mapper.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/simple_map_tnode\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/simple_map_tnode&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt; &lt;span class=\"hljs-string\"&gt;'yt/cpp/mapreduce/tutorial/simple_map_tnode/main.cpp'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"31\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-31\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-31\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-31.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"simple-map-protobuf-version\"&gt;&lt;a href=\"en/api/cpp/examples.html#simple-map-protobuf-version\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Simple Map (Protobuf version)&lt;/span&gt;&lt;/a&gt;Simple Map (Protobuf version)&lt;/h3&gt;\n&lt;p&gt;If you know the structure of the table, you may use the &lt;a href=\"api/cpp/protobuf.html\"&gt;Protobuf&lt;/a&gt; format, which:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Is a bit faster.&lt;/li&gt;\n&lt;li&gt;Prevents such errors as typos in column names or usage of wrong type for column.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/simple_map_protobuf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/simple_map_protobuf&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'protobuf'\"&gt;&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"simple-map-with-protobuf-using-lambda-expressions-in-c\"&gt;&lt;a href=\"en/api/cpp/examples.html#simple-map-with-protobuf-using-lambda-expressions-in-c\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Simple Map with Protobuf using lambda expressions in C++&lt;/span&gt;&lt;/a&gt;Simple Map with Protobuf using lambda expressions in C++&lt;/h3&gt;\n&lt;p&gt;Some simple operations can be represented as C++ lambda expressions with an empty capture-list (not capturing variables) using the &lt;a href=\"api/cpp/lambda.html\"&gt;yt/cpp/mapreduce/library/lambda&lt;/a&gt; library.&lt;/p&gt;\n&lt;p&gt;The previous example can be rewritten as follows (&lt;code&gt;data.proto&lt;/code&gt; is the same):&lt;/p&gt;\n&lt;p&gt;(&lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/simple_map_lambda\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/simple_map_lambda&lt;/a&gt;)&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"sorting-a-table-and-a-simple-reduce-operation\"&gt;&lt;a href=\"en/api/cpp/examples.html#sorting-a-table-and-a-simple-reduce-operation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sorting a table and a simple Reduce operation&lt;/span&gt;&lt;/a&gt;Sorting a table and a simple Reduce operation&lt;/h3&gt;\n&lt;p&gt;Given the same input table, we can count how many times each name occurs. To do this we need Reduce operation. Reduce operation requires input table to be sorted, so we run the Sort operation before launching Reduce.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/simple_reduce_tnode\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/simple_reduce_tnode&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"composite-types-and-protobuf-format-using-reduce-as-an-example\"&gt;&lt;a href=\"en/api/cpp/examples.html#composite-types-and-protobuf-format-using-reduce-as-an-example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Composite types and Protobuf format (using Reduce as an example)&lt;/span&gt;&lt;/a&gt;Composite types and Protobuf format (using Reduce as an example)&lt;/h3&gt;\n&lt;p&gt;Let's say we have a table with a set of records on links occurring in web documents. This table has the following columns:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DocTitle&lt;/code&gt;: is a string containing the document name.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Link&lt;/code&gt; is a struct containing following fields:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Host&lt;/code&gt;: host part of the link url.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Port&lt;/code&gt;: port part of the link url.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Path&lt;/code&gt;: path part of the link url.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;OccurrenceCount&lt;/code&gt;: how many times link appears in the document.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Our input table is sorted by &lt;code&gt;DocTitle&lt;/code&gt; column. We want to aggregate information about each document into single row of output table.&lt;/p&gt;\n&lt;p&gt;Let's describe protobuf messages of the following form:&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;TLinkEntry&lt;/code&gt; corresponds to the input table row, and &lt;code&gt;TDoc&lt;/code&gt; corresponds to the output table row.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;TDoc&lt;/code&gt; fields have the following semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Title&lt;/code&gt;: Title.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Links&lt;/code&gt;: List of links occurring in the document.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;OccurrenceCounts&lt;/code&gt;: List with the number of times the given links occur (this list has same length as the &lt;code&gt;Links&lt;/code&gt; list).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ExtraInfo&lt;/code&gt;: Additional information, which in this case includes the total number of times the links occurs.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;code&gt;(NYT.field_serialization_mode)&lt;/code&gt; in &lt;code&gt;TDoc&lt;/code&gt; and &lt;code&gt;TLinkEntry&lt;/code&gt; messages. By default, this option equals &lt;code&gt;PROTOBUF&lt;/code&gt;, which means \"serialize the field as a sequence of bytes\". The &lt;code&gt;YT&lt;/code&gt; value we set means that the corresponding nested message will be related to the composite type in the table schema. In &lt;code&gt;TDoc&lt;/code&gt;, as an example, we marked the &lt;code&gt;ExtraInfo&lt;/code&gt; field with the &lt;code&gt;(NYT.serialization_mode) = PROTOBUF&lt;/code&gt; option (note the type of the respective field in the output table).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;The &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;reducer&lt;/a&gt; is straightforward.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"multiple-input-reduce-tnode\"&gt;&lt;a href=\"en/api/cpp/examples.html#multiple-input-reduce-tnode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reduce with multiple input tables&lt;/span&gt;&lt;/a&gt;Reduce with multiple input tables&lt;/h3&gt;\n&lt;p&gt;Imagine that besides the table with users from our previous examples, there is also a second table with robots.&lt;/p&gt;\n&lt;p&gt;The following program creates a table where non-robot users are filtered out.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/multiple_input_reduce_tnode\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/multiple_input_reduce_tnode&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"map-tnode-with-file\"&gt;&lt;a href=\"en/api/cpp/examples.html#map-tnode-with-file\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reading files from operations&lt;/span&gt;&lt;/a&gt;Reading files from operations&lt;/h3&gt;\n&lt;p&gt;The previous task can be solved in a different way: upload the table with robots directly to the machines running the operations and read it there as a whole in &lt;code&gt;yhash_set&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;In this case, you don't have to sort the table and can use Map instead of Reduce. This method is used for small tables up to several GB in size.&lt;/p&gt;\n&lt;p&gt;Input tables are the same as in the previous example: &lt;a href=\"https://yt.yandex-team.ru/freud/#page=navigation&amp;amp;path=//home/dev/tutorial/staff_unsorted&amp;amp;offsetMode=row\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;with users&lt;/a&gt; and &lt;a href=\"https://yt.yandex-team.ru/freud/#page=navigation&amp;amp;path=//home/dev/tutorial/is_robot_unsorted&amp;amp;offsetMode=row\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;with robots&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;The following program creates a table where non-robot users are filtered out.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/map_tnode_with_file\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/map_tnode_with_file&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"reduce-with-multiple-input-and-output-tables\"&gt;&lt;a href=\"en/api/cpp/examples.html#reduce-with-multiple-input-and-output-tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reduce with multiple input and output tables&lt;/span&gt;&lt;/a&gt;Reduce with multiple input and output tables&lt;/h3&gt;\n&lt;p&gt;Here we have a similar task as in the previous example, except this time we'll write two output tables at once: with human users and with robots.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/multiple_input_multiple_output_reduce_tnode\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/multiple_input_multiple_output_reduce_tnode&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"reduce-with-multiple-input-and-output-tables-protobuf-version\"&gt;&lt;a href=\"en/api/cpp/examples.html#reduce-with-multiple-input-and-output-tables-protobuf-version\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reduce with multiple input and output tables (Protobuf version)&lt;/span&gt;&lt;/a&gt;Reduce with multiple input and output tables (Protobuf version)&lt;/h3&gt;\n&lt;p&gt;To create separate tables for human users and robots, we need to rewrite the same reducer to protobuf. The table with human users will contain the &lt;code&gt;login&lt;/code&gt;, &lt;code&gt;email&lt;/code&gt;, and &lt;code&gt;name&lt;/code&gt; fields. The table with robots will contain the &lt;code&gt;login&lt;/code&gt; and &lt;code&gt;uid&lt;/code&gt; fields. We need to create separate protobuf message types for these tables.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/multiple_input_multiple_output_reduce_protobuf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/multiple_input_multiple_output_reduce_protobuf&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"reading-and-writing-tables\"&gt;&lt;a href=\"en/api/cpp/examples.html#reading-and-writing-tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reading and writing tables&lt;/span&gt;&lt;/a&gt;Reading and writing tables&lt;/h3&gt;\n&lt;p&gt;When writing a table you can overwrite existing data or append your data to the table. When reading a table you can read the entire table or ranges by row number or key. Learn more about &lt;a href=\"user-guide/storage/formats.html#table_data\"&gt;reading and writing data&lt;/a&gt; and &lt;a href=\"user-guide/storage/objects.html#tables\"&gt;tables&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/table_read_write_tnode\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/table_read_write_tnode&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"transferring-states-to-jobs\"&gt;&lt;a href=\"en/api/cpp/examples.html#transferring-states-to-jobs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Transferring states to jobs&lt;/span&gt;&lt;/a&gt;Transferring states to jobs&lt;/h3&gt;\n&lt;p&gt;Sometimes you may need to write an operation that takes certain arguments. For example, write a program that filters the source table by user name.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/stateful_map_tnode\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/stateful_map_tnode&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"mapreduce-operation-protobuf-version\"&gt;&lt;a href=\"en/api/cpp/examples.html#mapreduce-operation-protobuf-version\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MapReduce operation (Protobuf version)&lt;/span&gt;&lt;/a&gt;MapReduce operation (Protobuf version)&lt;/h3&gt;\n&lt;p&gt;YTsaurus has the &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt; merged operation, which works a bit faster than &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt; + &lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;Sort&lt;/a&gt; + &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt;. Let's return to one of our first examples and once again get the statistics of how many times a name occurs in our table with users. Before we do that, we first need to standardize the names by converting all of them to lowercase so that people with the names &lt;code&gt;ARCHIE&lt;/code&gt; and &lt;code&gt;Archie&lt;/code&gt; are counted as one.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/mapreduce_protobuf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/mapreduce_protobuf&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"mapreduce-operation-version-with-lambda-expressions\"&gt;&lt;a href=\"en/api/cpp/examples.html#mapreduce-operation-version-with-lambda-expressions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MapReduce operation (version with lambda expressions)&lt;/span&gt;&lt;/a&gt;MapReduce operation (version with lambda expressions)&lt;/h3&gt;\n&lt;p&gt;The task is the same as in the previous example.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/mapreduce_lambda\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/mapreduce_lambda&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"prepare_operation\"&gt;&lt;a href=\"en/api/cpp/examples.html#prepare_operation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Preparing an operation in a job class&lt;/span&gt;&lt;/a&gt;Preparing an operation in a job class&lt;/h3&gt;\n&lt;p&gt;You can set up the operation parameters by overloading the &lt;code&gt;IJob::PrepareOperation&lt;/code&gt; method. For more information, see &lt;a href=\"api/cpp/description.html#prepare_operation\"&gt;Description&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'protobuf'\"&gt;&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h2 id=\"advanced-level\"&gt;&lt;a href=\"en/api/cpp/examples.html#advanced-level\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Advanced level&lt;/span&gt;&lt;/a&gt;Advanced level&lt;/h2&gt;\n&lt;h3 id=\"running-multiple-operations-in-parallel\"&gt;&lt;a href=\"en/api/cpp/examples.html#running-multiple-operations-in-parallel\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Running multiple operations in parallel&lt;/span&gt;&lt;/a&gt;Running multiple operations in parallel&lt;/h3&gt;\n&lt;p&gt;To run multiple operations in parallel, use the &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/library/operation_tracker/operation_tracker.h\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TOperationTracker&lt;/a&gt; class.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/operation_tracker\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/operation_tracker&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"reduce-with-enable_key_guarantee=false\"&gt;&lt;a href=\"en/api/cpp/examples.html#reduce-with-enable_key_guarantee=false\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reduce with enable_key_guarantee=false&lt;/span&gt;&lt;/a&gt;Reduce with enable_key_guarantee=false&lt;/h3&gt;\n&lt;p&gt;Suppose you want to filter a table with URLs by regular expressions that are located in a separate table with hosts (each host has its own regular expression). And while you could run Reduce on the &lt;code&gt;host&lt;/code&gt; column, real data is often arranged in such a way that some hosts have a disproportionately large number of URLs. In our example, URLs from the host &lt;code&gt;https://www.youtube.com&lt;/code&gt; take up more than half of the table. The job responsible for processing such a host will take a disproportionately large amount of time (keys like &lt;code&gt;https://www.youtube.com&lt;/code&gt; here are also called &lt;em&gt;monster keys&lt;/em&gt;).&lt;/p&gt;\n&lt;p&gt;However, you don't need all the records with the same host to go to the same machine to solve the task. You can distribute the table with URLs among several machines: note that the host must be received along with the URL.&lt;/p&gt;\n&lt;p class=\"center\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" style=\"background-color:rgb(255, 255, 255)\" width=\"721px\" height=\"861px\" version=\"1.1\"&gt;&lt;defs&gt;&lt;/defs&gt;&lt;g transform=\"translate(0.5,0.5)\"&gt;&lt;rect x=\"390\" y=\"38\" width=\"140\" height=\"30\" rx=\"4.5\" ry=\"4.5\" fill=\"#d5e8d4\" stroke=\"#82b366\"&gt;&lt;/rect&gt;&lt;g transform=\"translate(431.5,46.5)\"&gt;&lt;switch&gt;&lt;div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display:inline-block;font-size:12px;font-family:Helvetica;color:rgb(0, 0, 0);width:58px;text-align:center\"&gt;&lt;div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display:inline-block;text-align:inherit;text-decoration:inherit\"&gt;host1, url1&lt;/div&gt;&lt;/div&gt;&lt;text x=\"29\" y=\"12\" fill=\"#000000\" text-anchor=\"middle\" font-size=\"12px\" font-family=\"Helvetica\"&gt;host1, url1&lt;/text&gt;&lt;/switch&gt;&lt;/g&gt;&lt;rect x=\"390\" y=\"121\" width=\"140\" height=\"30\" rx=\"4.5\" ry=\"4.5\" fill=\"#d5e8d4\" stroke=\"#82b366\"&gt;&lt;/rect&gt;&lt;g transform=\"translate(431.5,129.5)\"&gt;&lt;switch&gt;&lt;div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display:inline-block;font-size:12px;font-family:Helvetica;color:rgb(0, 0, 0);width:58px;text-align:center\"&gt;&lt;div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display:inline-block;text-align:inherit;text-decoration:inherit\"&gt;host1, url3&lt;/div&gt;&lt;/div&gt;&lt;text x=\"29\" y=\"12\" fill=\"#000000\" text-anchor=\"middle\" font-size=\"12px\" font-family=\"Helvetica\"&gt;host1, url3&l 86917305,655.5 Q205.89215686917305,655.5 205.89215686917305,665.5 L205.89215686917305,840.5 Q205.89215686917305,850.5 195.89215686917305,850.5 L185.89215686917305,850.5 Q175.89215686917305,850.5 185.89215686917305,850.5 L195.89215686917305,850.5 Q205.89215686917305,850.5 205.89215686917305,860.5 L205.89215686917305,1035.5 Q205.89215686917305,1045.5 215.89215686917305,1045.5 L235.89215686917305,1045.5 \" fill=\"none\" stroke=\"#000000\" stroke-miterlimit=\"10\" transform=\"rotate(270, 205.892, 850.5)\" id=\"r715e39b__svg_121\"&gt;&lt;/path&gt;&lt;g id=\"r715e39b__svg_122\"&gt;&lt;switch transform=\"translate(0.392157) translate(0.5, 887.5) translate(0.5, 0.5)\"&gt;&lt;div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display:inline-block;font-size:19px;font-family:Helvetica;color:rgb(0, 0, 0);width:398px;text-align:center\"&gt;&lt;div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display:inline-block;text-align:inherit;text-decoration:inherit\"&gt;Урлы с одного хоста теперь обрабатываются несколькими джобами&lt;/div&gt;&lt;/div&gt;&lt;text x=\"199\" y=\"32\" fill=\"#000000\" text-anchor=\"middle\" font-size=\"19px\" font-family=\"Helvetica\" id=\"r715e39b__svg_124\"&gt;Урлы с одного хоста теперь обрабатываются несколькими джобами&lt;/text&gt;&lt;/switch&gt;&lt;/g&gt;&lt;path d=\"M110.89215686917305,30.5 L137.80216053128242,78.93000030517578 \" fill=\"none\" stroke=\"#000000\" stroke-miterlimit=\"10\" id=\"r715e39b__svg_125\"&gt;&lt;/path&gt;&lt;path d=\"M140.35216358304024,83.5199966430664 L133.89215686917305,79.0999984741211 L137.80216053128242,78.93000030517578 L140.01215198636055,75.69999694824219 z\" fill=\"#000000\" stroke=\"#000000\" stroke-miterlimit=\"10\" id=\"r715e39b__svg_126\"&gt;&lt;/path&gt;&lt;g id=\"r715e39b__svg_127\"&gt;&lt;switch transform=\"translate(0.392157) translate(40.5, 1.5) translate(0.5, 0.5)\"&gt;&lt;div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display:inline-block;font-size:12px;font-family:Helvetica;color:rgb(0, 0, 0);width:138px;text-align:center\"&gt;&lt;div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display:inline-block;text-align:inherit;text-decoration:inherit\"&gt;Эту таблицу отмечаем как foreign&lt;/div&gt;&lt;/div&gt;&lt;text x=\"69\" y=\"20\" fill=\"#000000\" text-anchor=\"middle\" font-size=\"12px\" font-family=\"Helvetica\" id=\"r715e39b__svg_129\"&gt;Эту таблицу отмечаем как foreign&lt;/text&gt;&lt;/switch&gt;&lt;/g&gt;&lt;p xmlns=\"http://www.w3.org/1999/xhtml\" style=\"border:none;font-size:inherit;padding:0;margin:0\"&gt;Reduce&lt;br style=\"border:none;font-size:inherit;padding:0;margin:0\" /&gt;&lt;/p&gt;&lt;p xmlns=\"http://www.w3.org/1999/xhtml\" style=\"border:none;font-size:inherit;padding:0;margin:0\"&gt;enable_key_guarantee=false&lt;/p&gt;&lt;/g&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/join_reduce_tnode\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/join_reduce_tnode&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"batch-requests\"&gt;&lt;a href=\"en/api/cpp/examples.html#batch-requests\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batch requests&lt;/span&gt;&lt;/a&gt;Batch requests&lt;/h3&gt;\n&lt;p&gt;You can execute light requests (create/delete a table, check its existence, etc.) in batches. Use this method if you need to run a large amount of uniform operations. Batch requests can save a lot of time.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/batch_request\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/batch_request&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"delivering-a-table-dump-to-a-job-as-a-file\"&gt;&lt;a href=\"en/api/cpp/examples.html#delivering-a-table-dump-to-a-job-as-a-file\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Delivering a table dump to a job as a file&lt;/span&gt;&lt;/a&gt;Delivering a table dump to a job as a file&lt;/h3&gt;\n&lt;p&gt;In YTsaurus, you can deliver files to jobs (for example, as was described &lt;a href=\"en/api/cpp/examples.html#map-tnode-with-file\"&gt;earlier&lt;/a&gt;). A less popular method is delivering a table dump to a job. This can prove useful when a job requires a map stored in a small (a few gigabytes) table. However, don't use this approach to load large tables: if you have a table that is dozens of gigabytes in size, it won't fit on a single node of the cluster where the jobs are running.&lt;/p&gt;\n&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/pass_table_as_file\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/pass_table_as_file&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"writing-and-retrieving-job-statistics\"&gt;&lt;a href=\"en/api/cpp/examples.html#writing-and-retrieving-job-statistics\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Writing and retrieving job statistics&lt;/span&gt;&lt;/a&gt;Writing and retrieving job statistics&lt;/h3&gt;\n&lt;p&gt;A running operation gathers a lot of statistics (see the &lt;a href=\"user-guide/problems/jobstatistics.html\"&gt;documentation&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;Example of a simple Map with statistics collection: &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/job_statistics\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/job_statistics&lt;/a&gt;:&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"basic-work-with-dynamic-tables\"&gt;&lt;a href=\"en/api/cpp/examples.html#basic-work-with-dynamic-tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Basic work with dynamic tables&lt;/span&gt;&lt;/a&gt;Basic work with dynamic tables&lt;/h3&gt;\n&lt;p&gt;YTsaurus supports &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;dynamic tables&lt;/a&gt;. You can perform basic operations with such tables by using the C++ wrapper.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Unlike the other examples, you will have to take additional steps to run this one:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;By default, users don't have the permissions to create dynamic tables, so you first need to get permissions to create and mount dynamic tables on some cluster.&lt;/li&gt;\n&lt;li&gt;When running the example, pass the cluster name and the path to the test table (it must not exist). For more information, see the comments in the program text.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;The example is located at &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/dyntable_get_insert\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/dyntable_get_insert&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/api/cpp/examples.md","sourcePath":"en/api/cpp/examples.md"},"headings":[{"title":"Basic level","href":"en/api/cpp/examples.html#basic-level","level":2,"items":[{"title":"Simple Map (TNode version)","href":"en/api/cpp/examples.html#simple-map-tnode-version","level":3},{"title":"Simple Map (Protobuf version)","href":"en/api/cpp/examples.html#simple-map-protobuf-version","level":3},{"title":"Simple Map with Protobuf using lambda expressions in C++","href":"en/api/cpp/examples.h
