\"1s\" begin=\"visibileAnimation-1247.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"trichypath\"&gt;&lt;a href=\"en/api/cpp/description.html#trichypath\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TRichYPath&lt;/span&gt;&lt;/a&gt;TRichYPath&lt;/h3&gt;\n&lt;p&gt;The &lt;code&gt;TRichYPath&lt;/code&gt; structure allows you to pass various flags along with the path to the table. This applies to read and write functions as well as to input and output &lt;a href=\"en/api/cpp/description.html#operations\"&gt;operation&lt;/a&gt; tables.&lt;/p&gt;\n&lt;p&gt;If you need to write in append mode:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;CreateTableWriter&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TRichYPath&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;).&lt;span class=\"hljs-built_in\"&gt;Append&lt;/span&gt;(&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1257\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1257\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1257\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1257.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If you want the write result to be sorted, use the &lt;code&gt;SortedBy&lt;/code&gt; attribute:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; path = &lt;span class=\"hljs-built_in\"&gt;TRichYPath&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;).&lt;span class=\"hljs-built_in\"&gt;SortedBy&lt;/span&gt;({&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;});\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1261\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1261\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1261\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1261.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Based on the protobuf message, you can create a table schema:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; path = &lt;span class=\"hljs-built_in\"&gt;WithSchema&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1265\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1265\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1265\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1265.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If you have a schema, you can no longer specify sorting with &lt;code&gt;SortedBy&lt;/code&gt;. You can specify sorting when creating a schema:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; path = &lt;span class=\"hljs-built_in\"&gt;WithSchema&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;, {&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;});\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1269\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1269\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1269\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1269.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Or sort the schema later: &lt;code&gt;path.Schema_.SortBy({\"a\", \"b\"});&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Additionally, during reading &lt;code&gt;TRichYPath&lt;/code&gt; allows for setting horizontal and vertical selections:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; path = &lt;span class=\"hljs-built_in\"&gt;TRichYPath&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;).&lt;span class=\"hljs-built_in\"&gt;AddRange&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TReadRange&lt;/span&gt;()\n    .&lt;span class=\"hljs-built_in\"&gt;LowerLimit&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TReadLimit&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;RowIndex&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;))\n    .&lt;span class=\"hljs-built_in\"&gt;UpperLimit&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TReadLimit&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;RowIndex&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;20&lt;/span&gt;)));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1276\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1276\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1276\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1276.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Synonymously, you can write:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; path = &lt;span class=\"hljs-built_in\"&gt;TRichYPath&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;).&lt;span class=\"hljs-built_in\"&gt;AddRange&lt;/span&gt;(TReadRange::&lt;span class=\"hljs-built_in\"&gt;FromRowIndices&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;20&lt;/span&gt;));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1280\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1280\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1280\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1280.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If the table is sorted, you can set the range by key. To do that, use the &lt;code&gt;TKey&lt;/code&gt; class, which is a sequence of key column values or their prefix. In the example below, the &lt;code&gt;\"//tmp/table\"&lt;/code&gt; table is implied to have two key columns of types &lt;code&gt;string&lt;/code&gt; and &lt;code&gt;int64&lt;/code&gt; (or more than two, in which case a lexicographic comparison also works).&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; path = &lt;span class=\"hljs-built_in\"&gt;TRichYPath&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;).&lt;span class=\"hljs-built_in\"&gt;AddRange&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TReadRange&lt;/span&gt;()\n    .&lt;span class=\"hljs-built_in\"&gt;LowerLimit&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TReadLimit&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;Key&lt;/span&gt;({&lt;span class=\"hljs-string\"&gt;\"foo\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;100&lt;/span&gt;}))\n    .&lt;span class=\"hljs-built_in\"&gt;UpperLimit&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TReadLimit&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;Key&lt;/span&gt;({&lt;span class=\"hljs-string\"&gt;\"foo\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;200&lt;/span&gt;})));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1284\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1284\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1284\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1284.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If you need string(s) with a specific key or index, you can use &lt;code&gt;TReadRange::Exact&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; path = &lt;span class=\"hljs-built_in\"&gt;TRichYPath&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;).&lt;span class=\"hljs-built_in\"&gt;AddRange&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TReadRange&lt;/span&gt;()\n    .&lt;span class=\"hljs-built_in\"&gt;Exact&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TReadLimit&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;Key&lt;/span&gt;({&lt;span class=\"hljs-string\"&gt;\"foo\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;100&lt;/span&gt;})));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1288\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1288\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1288\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1288.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Vertical selection:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; path = &lt;span class=\"hljs-built_in\"&gt;TRichYPath&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;).&lt;span class=\"hljs-built_in\"&gt;Columns&lt;/span&gt;({&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;});\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1292\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1292\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1292\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1292.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Renaming columns:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; path = &lt;span class=\"hljs-built_in\"&gt;TRichYPath&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;).&lt;span class=\"hljs-built_in\"&gt;RenameColumns&lt;/span&gt;({{&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"b\"&lt;/span&gt;}, {&lt;span class=\"hljs-string\"&gt;\"c\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"d\"&lt;/span&gt;}});\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1296\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1296\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1296\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1296.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The table column &lt;em&gt;a&lt;/em&gt; will display under the name &lt;em&gt;b&lt;/em&gt;, and column &lt;em&gt;c&lt;/em&gt; — as &lt;em&gt;d&lt;/em&gt;. The function resets the full list of renamed columns, so calling &lt;code&gt;RenameColumns&lt;/code&gt; again will erase the results of the previous one. &lt;code&gt;Columns&lt;/code&gt; is applied after &lt;code&gt;RenameColumns&lt;/code&gt;, meaning in this case &lt;em&gt;b&lt;/em&gt; and &lt;em&gt;d&lt;/em&gt; will be suitable for &lt;code&gt;Columns&lt;/code&gt;, while &lt;em&gt;a&lt;/em&gt; and &lt;em&gt;c&lt;/em&gt; — are not suitable.&lt;/p&gt;\n&lt;p&gt;Reading from a remote cluster:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; path = &lt;span class=\"hljs-built_in\"&gt;TRichYPath&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;).&lt;span class=\"hljs-built_in\"&gt;Cluster&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"my-remote-cluster\"&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1303\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1303\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1303\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1303.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You can still use unnormalized paths, for example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; path = &lt;span class=\"hljs-built_in\"&gt;TRichYPath&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table[#0:#100500]\"&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1307\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1307\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1307\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1307.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"format-settings\"&gt;&lt;a href=\"en/api/cpp/description.html#format-settings\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Format settings&lt;/span&gt;&lt;/a&gt;Format settings&lt;/h3&gt;\n&lt;p&gt;There is a &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/interface/client_method_options.h\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TFormatHints&lt;/a&gt; class for fine-tuning formats. You can pass it in the &lt;code&gt;TTableReaderOptions::FormatHints&lt;/code&gt; and &lt;code&gt;TTableWriterOptions::FormatHints&lt;/code&gt; fields when creating a reader/writer.&lt;br /&gt;\nIf this setting works for the requested format, it is applied; otherwise, an exception is made.&lt;/p&gt;\n&lt;p&gt;Available settings:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;SkipNullValuesForTNode&lt;/code&gt; — do not create keys in the hash map for fields with the &lt;code&gt;#&lt;/code&gt; value.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/data-types.html\"&gt;Type conversions&lt;/a&gt; when writing: &lt;code&gt;EnableStringToAllConversion&lt;/code&gt;, &lt;code&gt;EnableAllToStringConversion&lt;/code&gt;, &lt;code&gt;EnableIntegralTypeConversion%&lt;/code&gt; (&lt;code&gt;uint64&lt;/code&gt; &amp;lt;-&amp;gt; &lt;code&gt;int64&lt;/code&gt;, enabled by default), &lt;code&gt;EnableIntegralToDoubleConversion&lt;/code&gt;, &lt;code&gt;EnableTypeConversion&lt;/code&gt; (all of the above simultaneously).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"additional-options\"&gt;&lt;a href=\"en/api/cpp/description.html#additional-options\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Additional options&lt;/span&gt;&lt;/a&gt;Additional options&lt;/h3&gt;\n&lt;p&gt;If you need even more precise read/write options, you can use the &lt;code&gt;TTableWriterOptions&lt;/code&gt; and &lt;code&gt;TTableReaderOptions&lt;/code&gt; structures. They contain the &lt;code&gt;Config&lt;/code&gt; field, where additional settings can be passed in &lt;code&gt;TNode&lt;/code&gt; format that correspond to the &lt;a href=\"user-guide/storage/io-configuration.html#table_writer\"&gt;table_writer&lt;/a&gt; and &lt;a href=\"user-guide/storage/io-configuration.html#table_reader\"&gt;table_reader&lt;/a&gt; parameters.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; writer = client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;CreateTableWriter&lt;/span&gt;&amp;lt;TNode&amp;gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;,\n    &lt;span class=\"hljs-built_in\"&gt;TTableWriterOptions&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;Config&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TNode&lt;/span&gt;()(&lt;span class=\"hljs-string\"&gt;\"max_row_weight\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;128&lt;/span&gt; &amp;lt;&amp;lt; &lt;span class=\"hljs-number\"&gt;20&lt;/span&gt;)));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1335\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1335\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1335\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1335.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"parallel_read\"&gt;&lt;a href=\"en/api/cpp/description.html#parallel_read\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Parallel read&lt;/span&gt;&lt;/a&gt;Parallel read&lt;/h3&gt;\n&lt;p&gt;There is a &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/library/parallel_io/parallel_reader.h\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;library&lt;/a&gt; for parallel reading of tables.&lt;/p&gt;\n&lt;h2 id=\"operations\"&gt;&lt;a href=\"en/api/cpp/description.html#operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Running operations&lt;/span&gt;&lt;/a&gt;Running operations&lt;/h2&gt;\n&lt;p&gt;See &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/interface/operation.h\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;link&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Running an operation that contains a custom code requires:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Inheriting from one of the interfaces (&lt;code&gt;IMapper&lt;/code&gt;, &lt;code&gt;IReducer&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;Defining the &lt;code&gt;Do()&lt;/code&gt; function that should contain the record handler.&lt;/li&gt;\n&lt;li&gt;Using one of the &lt;code&gt;REGISTER_*&lt;/code&gt; macros.&lt;/li&gt;\n&lt;li&gt;Calling the client/transaction method corresponding to the operation type in the client code.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The&lt;code&gt;IMapper&lt;/code&gt; and&lt;code&gt;IReducer&lt;/code&gt; interfaces accept the &lt;code&gt;TTableReader&amp;lt;input record type&amp;gt;&lt;/code&gt; and &lt;code&gt;TTableWriter&amp;lt;output record type&amp;gt;&lt;/code&gt; types as template parameters. The &lt;code&gt;Do()&lt;/code&gt; function takes pointers to these types.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-meta\"&gt;#&lt;span class=\"hljs-keyword\"&gt;include&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;&amp;lt;yt/cpp/mapreduce/interface/operation.h&amp;gt;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TExtractKeyMapper&lt;/span&gt;\n    : &lt;span class=\"hljs-keyword\"&gt;public&lt;/span&gt; IMapper&amp;lt;TTableReader&amp;lt;TYaMRRow&amp;gt;, TTableWriter&amp;lt;TNode&amp;gt;&amp;gt;\n{\n&lt;span class=\"hljs-keyword\"&gt;public&lt;/span&gt;:\n    &lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;Do&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(TTableReader&amp;lt;TYaMRRow&amp;gt;* input, TTableWriter&amp;lt;TNode&amp;gt;* output)&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;override&lt;/span&gt; &lt;/span&gt;{\n        &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; (; input-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;IsValid&lt;/span&gt;(); input-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Next&lt;/span&gt;()) {\n            output-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;AddRow&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TNode&lt;/span&gt;()(&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;, input-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;GetRow&lt;/span&gt;().Key));\n        }\n    }\n};\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1376\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1376\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1376\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1376.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Next, you need to create a macro that registers the custom class:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-built_in\"&gt;REGISTER_MAPPER&lt;/span&gt;(TExtractKeyMapper).\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1380\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1380\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1380\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1380.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;There is no need to generate unique IDs — the type_info mechanism is used for identification. The job type will be explicitly displayed within the operation web interface in the custom job start string:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;./cppbinary --yt-map &lt;span class=\"hljs-string\"&gt;\"TExtractKeyMapper\"&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1384\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1384\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1384\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1384.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If the user wants to ID their jobs some other way, they need to ensure the names are unique within the same application and use the &lt;code&gt;REGISTER_NAMED_*&lt;/code&gt; macros:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-built_in\"&gt;REGISTER_NAMED_MAPPER&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"The best extract key mapper in the world\"&lt;/span&gt;, TExtractKeyMapper);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1388\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1388\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1388\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1388.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The functions for running specific operation types are as follows:&lt;/p&gt;\n&lt;p&gt;Map:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;IOperationPtr &lt;span class=\"hljs-title\"&gt;Map&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TMapOperationSpec&amp;amp; spec,\n    ::TIntrusivePtr&amp;lt;IMapperBase&amp;gt; mapper,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TOperationOptions&amp;amp; options = TOperationOptions())&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1397\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1397\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1397\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1397.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Reduce:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;IOperationPtr &lt;span class=\"hljs-title\"&gt;Reduce&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TReduceOperationSpec&amp;amp; spec,\n    ::TIntrusivePtr&amp;lt;IReducerBase&amp;gt; reducer,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TOperationOptions&amp;amp; options = TOperationOptions())&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1405\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1405\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1405\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1405.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Join-Reduce:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;IOperationPtr &lt;span class=\"hljs-title\"&gt;JoinReduce&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TJoinReduceOperationSpec&amp;amp; spec,\n    ::TIntrusivePtr&amp;lt;IReducerBase&amp;gt; reducer,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TOperationOptions&amp;amp; options = TOperationOptions())&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1413\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1413\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1413\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1413.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;MapReduce:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;IOperationPtr &lt;span class=\"hljs-title\"&gt;MapReduce&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TMapReduceOperationSpec&amp;amp; spec,\n    ::TIntrusivePtr&amp;lt;IMapperBase&amp;gt; mapper,\n    ::TIntrusivePtr&amp;lt;IReducerBase&amp;gt; reducer,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TOperationOptions&amp;amp; options = TOperationOptions())&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1421\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1421\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1421\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1421.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;IOperationPtr &lt;span class=\"hljs-title\"&gt;MapReduce&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TMapReduceOperationSpec&amp;amp; spec,\n    ::TIntrusivePtr&amp;lt;IMapperBase&amp;gt; mapper,\n    ::TIntrusivePtr&amp;lt;IReducerBase&amp;gt; reduceCombiner,\n    ::TIntrusivePtr&amp;lt;IReducerBase&amp;gt; reducer,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TOperationOptions&amp;amp; options = TOperationOptions())&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1422\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1422\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1422\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1422.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;You can specify a null pointer as &lt;code&gt;mapper&lt;/code&gt;, which will make the operation skip the Map stage when running, and the function's second version will additionally start the &lt;a href=\"user-guide/data-processing/operations/reduce.html#reduce_combiner\"&gt;reduce_combiner&lt;/a&gt; stage.&lt;/p&gt;\n&lt;p&gt;The operation start call parameters usually include:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Structure with the required specification parameters.&lt;/li&gt;\n&lt;li&gt;Pointers to instances of job classes.&lt;/li&gt;\n&lt;li&gt;Additional options (&lt;code&gt;TOperationOptions&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Be sure to add paths (&lt;a href=\"en/api/cpp/description.html#trichypath\"&gt;TRichYPath&lt;/a&gt;) to the input and output tables. Seeing how in general (in particular, in the protobuf backend) the types of table records can be different, the &lt;code&gt;AddInput()&lt;/code&gt; and &lt;code&gt;AddOutput()&lt;/code&gt; functions of the specification are templates:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;TMapOperationSpec spec;\nspec.&lt;span class=\"hljs-built_in\"&gt;AddInput&lt;/span&gt;&amp;lt;TYaMRRow&amp;gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;)\n    .&lt;span class=\"hljs-built_in\"&gt;AddInput&lt;/span&gt;&amp;lt;TYaMRRow&amp;gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/other_table\"&lt;/span&gt;)\n    .&lt;span class=\"hljs-built_in\"&gt;AddOutput&lt;/span&gt;&amp;lt;TNode&amp;gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/output_table\"&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1451\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1451\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1451\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1451.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Whenever possible, the discrepancy between the specification types and the types specified in IMapper/IReducer will be detected at runtime.&lt;/p&gt;\n&lt;p&gt;A call without additional parameters looks like this:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Map&lt;/span&gt;(spec, &lt;span class=\"hljs-keyword\"&gt;new&lt;/span&gt; TExtractKeyMapper);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1458\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1458\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1458\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1458.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;This is safe because &lt;code&gt;TIntrusivePtr&lt;/code&gt; is created internally for the job object.&lt;/p&gt;\n&lt;h3 id=\"transferring-user-files\"&gt;&lt;a href=\"en/api/cpp/description.html#transferring-user-files\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Transferring user files&lt;/span&gt;&lt;/a&gt;Transferring user files&lt;/h3&gt;\n&lt;p&gt;The &lt;code&gt;TUserJobSpec&lt;/code&gt; structure, which is part of the main specification, is used to transfer user files to the job's sandbox. File sets can vary for different job types in one operation:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;TMapReduceOperationSpec spec;\nspec.&lt;span class=\"hljs-built_in\"&gt;MapperSpec&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TUserJobSpec&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;AddLocalFile&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"./file_for_mapper\"&lt;/span&gt;))\n    .&lt;span class=\"hljs-built_in\"&gt;ReducerSpec&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TUserJobSpec&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;AddLocalFile&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"./file_for_reducer\"&lt;/span&gt;));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1468\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1468\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1468\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1468.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;To use files that are already in the system, call the &lt;code&gt;TUserJobSpec::AddFile(fileName)&lt;/code&gt; method.&lt;/p&gt;\n&lt;p&gt;An important additional parameter is &lt;code&gt;TOperationOptions::Spec&lt;/code&gt;. It is &lt;code&gt;TNode&lt;/code&gt;, which can contain any specification parameters combined with the main specification generated by the client. Many of these options are described in the &lt;a href=\"user-guide/data-processing/operations/overview.html\"&gt;Operation types&lt;/a&gt; section.&lt;/p&gt;\n&lt;h3 id=\"multiple-input-and-output-tables\"&gt;&lt;a href=\"en/api/cpp/description.html#multiple-input-and-output-tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Multiple input and output tables&lt;/span&gt;&lt;/a&gt;Multiple input and output tables&lt;/h3&gt;\n&lt;p&gt;If the operation writes to several output tables, the &lt;code&gt;AddRow()&lt;/code&gt; method is used with two parameters:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;writer-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;AddRow&lt;/span&gt;(row, tableIndex);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1481\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1481\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1481\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1481.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If the operation reads from multiple tables, the table index can be retrieved from &lt;code&gt;TTableReader&lt;/code&gt; using the &lt;code&gt;GetTableIndex()&lt;/code&gt; method.&lt;/p&gt;\n&lt;h3 id=\"protobuf-backend\"&gt;&lt;a href=\"en/api/cpp/description.html#protobuf-backend\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Protobuf backend&lt;/span&gt;&lt;/a&gt;Protobuf backend&lt;/h3&gt;\n&lt;p&gt;When using protobuf, it is possible to specify different record types for input and output tables. In this case, the declaration of the job's basic class uses &lt;code&gt;TTableReader&lt;/code&gt; or &lt;code&gt;TTableWriter&lt;/code&gt; not from a specific custom protobuf class, but from the basic &lt;code&gt;Message&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TProtoReducer&lt;/span&gt;\n    : &lt;span class=\"hljs-keyword\"&gt;public&lt;/span&gt; IReducer&amp;lt;TTableReader&amp;lt;Message&amp;gt;, TTableWriter&amp;lt;Message&amp;gt;&amp;gt;\n{ ... }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1491\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1491\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1491\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1491.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You should not write &lt;code&gt;AddInput/AddOutput()&lt;/code&gt; in the operation's specification. You must provide a specific type.&lt;/p&gt;\n&lt;p&gt;In this case, the &lt;code&gt;GetRow()&lt;/code&gt; and &lt;code&gt;AddRow()&lt;/code&gt; methods become templates and must use specific user-defined types. For reading, you can select the function to call by using &lt;code&gt;GetTableIndex()&lt;/code&gt; of the current entry before calling &lt;code&gt;GetRow()&lt;/code&gt;. For writing, &lt;code&gt;AddRow(row, tableIndex)&lt;/code&gt; is called. Types are controlled to be in accord with table indexes.&lt;/p&gt;\n&lt;h3 id=\"initializing-and-serializing-jobs\"&gt;&lt;a href=\"en/api/cpp/description.html#initializing-and-serializing-jobs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Initializing and serializing jobs&lt;/span&gt;&lt;/a&gt;Initializing and serializing jobs&lt;/h3&gt;\n&lt;p&gt;The &lt;code&gt;Start()&lt;/code&gt; and &lt;code&gt;Finish()&lt;/code&gt; methods are similar to their general interface counterparts, taking as a parameter the pointer to the corresponding &lt;code&gt;TTableWriter&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-keyword\"&gt;virtual&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;Save&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(IOutputStream&amp;amp; stream)&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt;&lt;/span&gt;;\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-keyword\"&gt;virtual&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;Load&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(IInputStream&amp;amp; stream)&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1504\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1504\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1504\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1504.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Serialization is not tied to any frameworks. The content of a serialized job is stored in the sandbox in the &lt;code&gt;jobstate&lt;/code&gt; file. If not a single byte was written during &lt;code&gt;Save()&lt;/code&gt;, the file will be missing. That said, &lt;code&gt;Load()&lt;/code&gt; in the job will be called from an empty stream.&lt;/p&gt;\n&lt;p&gt;There is a &lt;code&gt;Y_SAVELOAD_JOB&lt;/code&gt; helper that wraps the serialization from &lt;code&gt;util/ysaveload.h&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The order of calling methods in a job is as follows: &lt;code&gt;default ctor; Load(); Start(); Do(); Finish()&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"prepare_operation\"&gt;&lt;a href=\"en/api/cpp/description.html#prepare_operation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Preparing an operation from a job class&lt;/span&gt;&lt;/a&gt;Preparing an operation from a job class&lt;/h3&gt;\n&lt;p&gt;The &lt;code&gt;IJob&lt;/code&gt; class (the basic class for all jobs) has the virtual method &lt;code&gt;void PrepareOperation(const IOperationPreparationContext&amp;amp; context, TJobOperationPreparer&amp;amp; preparer) const&lt;/code&gt; added, which can be overloaded in the user's jobs:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;context&lt;/code&gt; allows you to get information about input and output tables and, in particular, their schemas.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;preparer&lt;/code&gt; serves to control specification parameters.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;You can set:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Output table schema: &lt;code&gt;preparer.OutputSchema(tableIndex, schema)&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Message types for the protobuf input and output formats: &lt;code&gt;preparer.InputDescription&amp;lt;TYourMessage&amp;gt;(tableIndex)&lt;/code&gt; and &lt;code&gt;preparer.OutputDescription&amp;lt;TYourMessage&amp;gt;(tableIndex)&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Column filtering for input tables: &lt;code&gt;preparer.InputColumnFilter(tableIndex, {\"foo\", \"bar\"})&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Ability to rename input table columns: &lt;code&gt;preparer.InputColumnRenaming(tableIndex, {{\"foo\", \"not_foo\"}})&lt;/code&gt;. The renaming is applied &lt;em&gt;after&lt;/em&gt; filtering.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;All methods return &lt;code&gt;*this&lt;/code&gt;, which enables chaining.&lt;/p&gt;\n&lt;p&gt;Usually, when using protobuf, specifying only &lt;code&gt;.OutputDescription&lt;/code&gt; is sufficient, and the output table schema is inferred automatically.&lt;br /&gt;\nIf this is not the right behavior, you can set the second parameter (&lt;code&gt;inferSchema&lt;/code&gt;) to &lt;code&gt;false&lt;/code&gt;, such as &lt;code&gt;preparer.OutputDescription&amp;lt;TRow&amp;gt;(tableIndex, false)&lt;/code&gt;.&lt;br /&gt;\nFor jobs marking &lt;code&gt;OutputDescription&lt;/code&gt;, you can use short variants to start operations, such as &lt;code&gt;client-&amp;gt;Map(new TMapper, input, output)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;If there are several similar tables, their description can be combined into groups using the &lt;code&gt;.(Begin|End)(Input|Output)Group&lt;/code&gt; methods.&lt;br /&gt;\n&lt;code&gt;.Begin(Input|Output)Group&lt;/code&gt; accepts the description of the table indexes that this group combines.&lt;br /&gt;\nIt can be either a &lt;code&gt;[begin, end)&lt;/code&gt; pair or a container with &lt;code&gt;int&lt;/code&gt;, for example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;preparer\n    .&lt;span class=\"hljs-built_in\"&gt;BeginInputGroup&lt;/span&gt;({&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;,&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;,&lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;,&lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;})\n        .&lt;span class=\"hljs-built_in\"&gt;Description&lt;/span&gt;&amp;lt;TInputRow&amp;gt;()\n        .&lt;span class=\"hljs-built_in\"&gt;ColumnFilter&lt;/span&gt;({&lt;span class=\"hljs-string\"&gt;\"foo\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"bar\"&lt;/span&gt;})\n        .&lt;span class=\"hljs-built_in\"&gt;ColumnRenaming&lt;/span&gt;({{&lt;span class=\"hljs-string\"&gt;\"foo\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"not_foo\"&lt;/span&gt;}})\n    .&lt;span class=\"hljs-built_in\"&gt;EndInputGroup&lt;/span&gt;()\n    .&lt;span class=\"hljs-built_in\"&gt;BeginOutputGroup&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;7&lt;/span&gt;)\n        .&lt;span class=\"hljs-built_in\"&gt;Description&lt;/span&gt;&amp;lt;TOutputRow&amp;gt;()\n    .&lt;span class=\"hljs-built_in\"&gt;EndOutputGroup&lt;/span&gt;();\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1566\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1566\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1566\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1566.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"notes\"&gt;&lt;a href=\"en/api/cpp/description.html#notes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Notes&lt;/span&gt;&lt;/a&gt;Notes&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;The &lt;code&gt;IMapper::Do()&lt;/code&gt; function takes all the records from the job as input. This is different from the general interface logic.&lt;/li&gt;\n&lt;li&gt;The &lt;code&gt;IReducer::Do()&lt;/code&gt; function accepts a range of records by one key, as before. In the case of the Reduce operation, this is determined by the &lt;code&gt;ReduceBy&lt;/code&gt; specification parameter; in the case of JoinReduce, it is determined by &lt;code&gt;JoinBy&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;If the job class is a template based on user-defined parameters, &lt;code&gt;REGISTER_*&lt;/code&gt; must be called for each instance that needs to be run on the cluster.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"getting-information-about-operations-and-jobs\"&gt;&lt;a href=\"en/api/cpp/description.html#getting-information-about-operations-and-jobs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Getting information about operations and jobs&lt;/span&gt;&lt;/a&gt;Getting information about operations and jobs&lt;/h2&gt;\n&lt;h3 id=\"getoperation\"&gt;&lt;a href=\"en/api/cpp/description.html#getoperation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GetOperation&lt;/span&gt;&lt;/a&gt;GetOperation&lt;/h3&gt;\n&lt;p&gt;Get &lt;a href=\"api/commands.html#get_operation\"&gt;information about an operation&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;TOperationAttributes &lt;span class=\"hljs-title\"&gt;GetOperation&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TOperationId&amp;amp; operationId,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TGetOperationOptions&amp;amp; options)&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1596\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1596\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1596\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1596.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operationId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Operation ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — optional settings:&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;AttributeFilter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;TOperationAttributeFilter&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Which attributes to return.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"listoperations\"&gt;&lt;a href=\"en/api/cpp/description.html#listoperations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ListOperations&lt;/span&gt;&lt;/a&gt;ListOperations&lt;/h3&gt;\n&lt;p&gt;Get a list of operations &lt;a href=\"api/commands.html#list_operation\"&gt;that match the filters&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;TListOperationsResult &lt;span class=\"hljs-title\"&gt;ListOperations&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TListOperationsOptions&amp;amp; options)&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1665\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1665\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1665\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1665.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — optional settings:&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;FromTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;TInstant&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Start of the search ti&lt;em&gt;m&lt;/em&gt;e interval.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ToTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;TInstant&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;End of the search ti&lt;em&gt;m&lt;/em&gt;e interval.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;CursorTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;TInstant&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Cursor position (for pagination).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;CursorDirection&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;ECursorDirection&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Which end of the ti&lt;em&gt;m&lt;/em&gt;e interval to start listing operations from.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Filter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;TString&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;\"Text factors\" (in particular, title and paths to input/output tables) of the operation include &lt;code&gt;Filter&lt;/code&gt; as a substring.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Pool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;TString&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;The operation was started in the &lt;code&gt;Pool&lt;/code&gt; pool.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;User&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;TString&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;The operation was started by &lt;code&gt;User&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;State&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;TString&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;The operation is in the &lt;code&gt;State&lt;/code&gt; state.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;EOperationType&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;The operation has the &lt;code&gt;Type&lt;/code&gt; type.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;WithFailedJobs&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;bool&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;The operation has (&lt;code&gt;WithFailedJobs == true&lt;/code&gt;) or does not have (&lt;code&gt;WithFailedJobs == false&lt;/code&gt;) failed jobs&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;IncludeArchive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;bool&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Whether to search for operations in the operations archive.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;IncludeCounters&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;bool&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Whether to include statistics on the total number of operations (not just for the specified interval) in the response.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;i64&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Return no more than &lt;code&gt;Limit&lt;/code&gt; operations (the current maximum value of this parameter is &lt;code&gt;100&lt;/code&gt;, which is also the default value).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"updateoperationparameters\"&gt;&lt;a href=\"en/api/cpp/description.html#updateoperationparameters\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;UpdateOperationParameters&lt;/span&gt;&lt;/a&gt;UpdateOperationParameters&lt;/h3&gt;\n&lt;p&gt;Update the runtime parameters of the &lt;a href=\"api/commands.html#update_operation_parameters\"&gt;running operation&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;UpdateOperationParameters&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TOperationId&amp;amp; operationId,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TUpdateOperationParametersOptions&amp;amp; options)&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1888\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1888\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1888\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1888.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operationId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Operation ID&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — optional settings:&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Owner&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TVector&amp;lt;TString&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;New operation owners.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Pool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;TString&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Move the operation to the &lt;code&gt;Pool&lt;/code&gt; pool (applies to all the pool trees the operation is running for).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Weight&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;double&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;New operation weight (applies to all the pool trees the operation is running for).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;SchedulingOptionsPerPoolTree&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;TSchedulingOptionsPerPoolTree&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Scheduler options for each pool tree.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"getjob\"&gt;&lt;a href=\"en/api/cpp/description.html#getjob\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GetJob&lt;/span&gt;&lt;/a&gt;GetJob&lt;/h3&gt;\n&lt;p&gt;Get &lt;a href=\"api/commands.html#get_job\"&gt;information about the job&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;TJobAttributes &lt;span class=\"hljs-title\"&gt;GetJob&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TOperationId&amp;amp; operationId,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TJobId&amp;amp; jobId,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TGetJobOptions&amp;amp; options)&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1999\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1999\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1999\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1999.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operationId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Operation ID&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;jobId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Job ID&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — optional settings:&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"listjobs\"&gt;&lt;a href=\"en/api/cpp/description.html#listjobs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ListJobs&lt;/span&gt;&lt;/a&gt;ListJobs&lt;/h3&gt;\n&lt;p&gt;Get jobs that &lt;a href=\"api/commands.html#list_jobs\"&gt;match the specified filters&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;TListJobsResult &lt;span class=\"hljs-title\"&gt;ListJobs&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TOperationId&amp;amp; operationId,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TListJobsOptions&amp;amp; options)&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2044\"&gt;\n                &lt;path
