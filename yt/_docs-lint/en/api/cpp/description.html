        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;To use the features of YTsaurus, you can use the &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;C++ client&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;See &lt;a href=\"api/cpp/examples.html\"&gt;Usage examples&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The C++ client is currently provided as is, so:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The client interface may undergo non-backward compatible changes.&lt;/li&gt;\n&lt;li&gt;The current version only supports static linking.&lt;/li&gt;\n&lt;li&gt;Contact info@ytsaurus.tech if you have any questions about building the client.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"overview\"&gt;&lt;a href=\"en/api/cpp/description.html#overview\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Overview&lt;/span&gt;&lt;/a&gt;Overview&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;The entire code is in the &lt;code&gt;NYT&lt;/code&gt; namespace.&lt;/li&gt;\n&lt;li&gt;All the interfaces that the user might need can be found &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/interface\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;here&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;The implementation of all the interfaces is available &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/client\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;here&lt;/a&gt;. Libraries need to be linked with &lt;code&gt;interface&lt;/code&gt;, and executable binaries must be linked with &lt;code&gt;client&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ISomethingPtr&lt;/code&gt; is usually defined as &lt;code&gt;TIntrusivePtr&lt;/code&gt; for interfaces.&lt;/li&gt;\n&lt;li&gt;All mandatory parameters are explicitly present in the signatures of the corresponding functions. All optional command parameters are presented as auxiliary structures within &lt;code&gt;TOptions&lt;/code&gt;. These structures have a builder-like interface that allows for specifying parameters as &lt;code&gt;TWhateverOptions().Parameter1(value1).Parameter2(value2)&lt;/code&gt; for single-line writing, if convenient.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"logging\"&gt;&lt;a href=\"en/api/cpp/description.html#logging\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Logging&lt;/span&gt;&lt;/a&gt;Logging&lt;/h2&gt;\n&lt;p&gt;Logging is toggled with the &lt;code&gt;YT_LOG_LEVEL&lt;/code&gt; environment variable, which can take one of the following values: &lt;code&gt;ERROR&lt;/code&gt;, &lt;code&gt;WARNING&lt;/code&gt; (equivalent to &lt;code&gt;ERROR&lt;/code&gt; for compatibility with the &lt;a href=\"api/python/userdoc.html\"&gt;Python API&lt;/a&gt;), &lt;code&gt;INFO&lt;/code&gt;, &lt;code&gt;DEBUG&lt;/code&gt;.&lt;br /&gt;\nIn addition, you need to call the &lt;code&gt;NYT::Initialize()&lt;/code&gt; function at the start of the program (see the next section).&lt;/p&gt;\n&lt;p&gt;If possible, saving logs at the &lt;code&gt;DEBUG&lt;/code&gt; level is recommended, especially for production processes. Should there be any issues with the API, such logs will make fixing them much easier and faster. Attaching these logs to emails about API-related problems is recommended.&lt;/p&gt;\n&lt;h2 id=\"init\"&gt;&lt;a href=\"en/api/cpp/description.html#init\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Initializing&lt;/span&gt;&lt;/a&gt;Initializing&lt;/h2&gt;\n&lt;p&gt;You need to call the &lt;code&gt;Initialize&lt;/code&gt; method before starting client actions. This method performs initialization of required subsystems (logging and so on), as well as checks if binary is launched on the YTsaurus node inside the job and, if it is the case, switches execution to the job mode.&lt;/p&gt;\n&lt;p&gt;The client entry point is the &lt;code&gt;CreateClient(serverName)&lt;/code&gt; function, which returns a pointer to the &lt;code&gt;IClient&lt;/code&gt; interface.&lt;/p&gt;\n&lt;p&gt;Example of a minimum program (&lt;code&gt;main.cpp&lt;/code&gt; file):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-meta\"&gt;#&lt;span class=\"hljs-keyword\"&gt;include&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;&amp;lt;yt/cpp/mapreduce/interface/client.h&amp;gt;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;int&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;main&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;()&lt;/span&gt;\n&lt;/span&gt;{\n    NYT::&lt;span class=\"hljs-built_in\"&gt;Initialize&lt;/span&gt;();\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; client = NYT::&lt;span class=\"hljs-built_in\"&gt;CreateClient&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"cluster_name\"&lt;/span&gt;);\n    client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Create&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;, NYT::NT_TABLE);\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"84\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-84\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-84\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-84.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If you need to have clients working under different &lt;a href=\"user-guide/storage/auth.html\"&gt;authorization tokens&lt;/a&gt; within the same program, you can use the following options:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;auto client = CreateClient(serverName, TCreateClientOptions().Token(userToken));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"88\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-88\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-88\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-88.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"transactions\"&gt;&lt;a href=\"en/api/cpp/description.html#transactions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Transactions&lt;/span&gt;&lt;/a&gt;Transactions&lt;/h2&gt;\n&lt;p&gt;There are two interfaces (&lt;code&gt;IClient&lt;/code&gt; and &lt;code&gt;ITransaction&lt;/code&gt;) that have almost the same set of methods inherited from &lt;code&gt;IClientBase&lt;/code&gt;. In the first case, the corresponding commands are executed without any client transaction; in the second case, they are executed under a transaction of the specified class. To get an &lt;code&gt;ITransaction&lt;/code&gt; instance, use the &lt;code&gt;IClientBase::StartTransaction()&lt;/code&gt; method. When using the &lt;code&gt;YT_TRANSACTION&lt;/code&gt; environment variable, even&lt;code&gt;IClient&lt;/code&gt; starts working under the parent transaction.&lt;/p&gt;\n&lt;p&gt;Example of working with transactions:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-meta\"&gt;#&lt;span class=\"hljs-keyword\"&gt;include&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;&amp;lt;yt/cpp/mapreduce/interface/client.h&amp;gt;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;int&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;main&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;()&lt;/span&gt;\n&lt;/span&gt;{\n    NYT::&lt;span class=\"hljs-built_in\"&gt;Initialize&lt;/span&gt;();\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; client = NYT::&lt;span class=\"hljs-built_in\"&gt;CreateClient&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"cluster_name\"&lt;/span&gt;);\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; tx = client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;StartTransaction&lt;/span&gt;();\n    tx-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Remove&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;);\n    tx-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Commit&lt;/span&gt;();\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"98\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-98\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-98\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-98.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The transaction has explicit methods &lt;code&gt;Commit()&lt;/code&gt; and &lt;code&gt;Abort()&lt;/code&gt;. If the transaction is destroyed without one of these methods being explicitly called, an attempt will be made in the destructor to call &lt;code&gt;Abort()&lt;/code&gt;, but without guarantees that the method will actually execute.&lt;/p&gt;\n&lt;p&gt;Transactions can be hierarchical:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; tx = client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;StartTransaction&lt;/span&gt;();\n&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; innerTx = tx-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;StartTransaction&lt;/span&gt;();\ninnerTx-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Create&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/double\"&lt;/span&gt;, NT_DOUBLE);\ninnerTx-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Commit&lt;/span&gt;();\ntx-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Commit&lt;/span&gt;();\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"105\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-105\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-105\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-105.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The &lt;code&gt;ITransaction::GetId()&lt;/code&gt; method returns &lt;code&gt;TGUID&lt;/code&gt; — the ID of this transaction.&lt;/p&gt;\n&lt;p&gt;The transaction created using &lt;code&gt;StartTransaction()&lt;/code&gt; is automatically pinged and managed by the C++ client.&lt;/p&gt;\n&lt;p&gt;There is a way to work under an externally created transaction. To do this, call the &lt;code&gt;IClient::AttachTransaction(transactionId)&lt;/code&gt; method. All commands called in such an object will be executed in the context of the transaction with this ID, but this transaction will not be pinged by the client.&lt;/p&gt;\n&lt;p&gt;For more information on transactions, see the &lt;a href=\"user-guide/storage/transactions.html\"&gt;Transactions&lt;/a&gt; section.&lt;/p&gt;\n&lt;h2 id=\"tnode\"&gt;&lt;a href=\"en/api/cpp/description.html#tnode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TNode&lt;/span&gt;&lt;/a&gt;TNode&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/interface/node.h\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TNode&lt;/a&gt; is the main class that provides for a dynamic DOM representation of &lt;a href=\"user-guide/storage/yson-docs.html\"&gt;YSON documents&lt;/a&gt;. It is used for working with Cypress, transferring additional operation specifications, as one of the ways to encode table rows, and more.&lt;/p&gt;\n&lt;p&gt;Usage examples:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;TNode i = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;; &lt;span class=\"hljs-comment\"&gt;// all signed types -&amp;gt; int64&lt;/span&gt;\nTNode u = &lt;span class=\"hljs-number\"&gt;8u&lt;/span&gt;; &lt;span class=\"hljs-comment\"&gt;// all unsigned types -&amp;gt; uint64&lt;/span&gt;\nTNode b = &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;; &lt;span class=\"hljs-comment\"&gt;// boolean&lt;/span&gt;\nTNode d = &lt;span class=\"hljs-number\"&gt;2.5&lt;/span&gt;; &lt;span class=\"hljs-comment\"&gt;// double&lt;/span&gt;\nTNode s = &lt;span class=\"hljs-string\"&gt;\"foo\"&lt;/span&gt;; &lt;span class=\"hljs-comment\"&gt;// string&lt;/span&gt;\n\nTNode l = TNode::&lt;span class=\"hljs-built_in\"&gt;CreateList&lt;/span&gt;();\nl.&lt;span class=\"hljs-built_in\"&gt;Add&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;5&lt;/span&gt;);\nl.&lt;span class=\"hljs-built_in\"&gt;Add&lt;/span&gt;(&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;);\nCout &amp;lt;&amp;lt; l[&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;].&lt;span class=\"hljs-built_in\"&gt;AsBool&lt;/span&gt;() &amp;lt;&amp;lt; Endl;\n\nTNode m = TNode::&lt;span class=\"hljs-built_in\"&gt;CreateMap&lt;/span&gt;();\nm[&lt;span class=\"hljs-string\"&gt;\"abc\"&lt;/span&gt;] = &lt;span class=\"hljs-number\"&gt;255u&lt;/span&gt;;\n&lt;span class=\"hljs-built_in\"&gt;m&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"foo\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"bar\"&lt;/span&gt;);\nCout &amp;lt;&amp;lt; m[&lt;span class=\"hljs-string\"&gt;\"foo\"&lt;/span&gt;].&lt;span class=\"hljs-built_in\"&gt;AsString&lt;/span&gt;() &amp;lt;&amp;lt; Endl;\n\nTNode e = TNode::&lt;span class=\"hljs-built_in\"&gt;CreateEntity&lt;/span&gt;();\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; (e.&lt;span class=\"hljs-built_in\"&gt;IsEntity&lt;/span&gt;()) {\n    Cout &amp;lt;&amp;lt; &lt;span class=\"hljs-string\"&gt;\"entity!\"&lt;/span&gt; &amp;lt;&amp;lt; Endl;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"127\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-127\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-127\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-127.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;Values of primitive types are retrieved using the &lt;code&gt;TNode::AsType()&lt;/code&gt; methods.&lt;/li&gt;\n&lt;li&gt;Types can be checked using the &lt;code&gt;TNode::IsType()&lt;/code&gt; methods.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;By default, the constructor creates &lt;code&gt;TNode&lt;/code&gt; with the &lt;code&gt;TNode::Undefined&lt;/code&gt; type: such an object cannot be serialized in YSON without explicit initialization.&lt;/p&gt;\n&lt;p&gt;For shortening purposes, the methods for inserting in map and list immediately change &lt;code&gt;TNode&lt;/code&gt; to the right type:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; mapNode = &lt;span class=\"hljs-built_in\"&gt;TNode&lt;/span&gt;()(&lt;span class=\"hljs-string\"&gt;\"key1\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"value1\"&lt;/span&gt;)(&lt;span class=\"hljs-string\"&gt;\"key2\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"value2\"&lt;/span&gt;);\n&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; listNode = &lt;span class=\"hljs-built_in\"&gt;TNode&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;Add&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;100&lt;/span&gt;).&lt;span class=\"hljs-built_in\"&gt;Add&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;500&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"146\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-146\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-146\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-146.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"cypress\"&gt;&lt;a href=\"en/api/cpp/description.html#cypress\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with Cypress&lt;/span&gt;&lt;/a&gt;Working with Cypress&lt;/h2&gt;\n&lt;p&gt;For more information about the commands, see &lt;a href=\"user-guide/storage/cypress-example.html\"&gt;Working with the meta information tree&lt;/a&gt;. Implemented as the &lt;code&gt;ICypressClient&lt;/code&gt; interface, from which &lt;code&gt;IClientBase&lt;/code&gt; is inherited.&lt;/p&gt;\n&lt;p&gt;Usage examples:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;TString &lt;span class=\"hljs-title\"&gt;node&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/node\"&lt;/span&gt;)&lt;/span&gt;&lt;/span&gt;;\n\nclient-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Create&lt;/span&gt;(node, NYT::NT_STRING);\n\nCout &amp;lt;&amp;lt; client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Exists&lt;/span&gt;(node) &amp;lt;&amp;lt; Endl;\n\nclient-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Set&lt;/span&gt;(node, &lt;span class=\"hljs-string\"&gt;\"foo\"&lt;/span&gt;);\nCout &amp;lt;&amp;lt; client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Get&lt;/span&gt;(node).&lt;span class=\"hljs-built_in\"&gt;AsString&lt;/span&gt;() &amp;lt;&amp;lt; Endl;\n\n&lt;span class=\"hljs-function\"&gt;TString &lt;span class=\"hljs-title\"&gt;otherNode&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/other_node\"&lt;/span&gt;)&lt;/span&gt;&lt;/span&gt;;\nclient-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Copy&lt;/span&gt;(node, otherNode);\nclient-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Remove&lt;/span&gt;(otherNode);\n\nclient-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Link&lt;/span&gt;(node, otherNode);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"156\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-156\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-156\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-156.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Example of working with table attributes:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Set&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table/@user_attr\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;25&lt;/span&gt;);\n\nCout &amp;lt;&amp;lt; client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Get&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table/@row_count\"&lt;/span&gt;).&lt;span class=\"hljs-built_in\"&gt;AsInt64&lt;/span&gt;() &amp;lt;&amp;lt; Endl;\nCout &amp;lt;&amp;lt; client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Get&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table/@sorted\"&lt;/span&gt;).&lt;span class=\"hljs-built_in\"&gt;AsBool&lt;/span&gt;() &amp;lt;&amp;lt; Endl;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"160\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-160\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-160\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-160.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"create\"&gt;&lt;a href=\"en/api/cpp/description.html#create\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Create&lt;/span&gt;&lt;/a&gt;Create&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"api/commands.html#create\"&gt;Create&lt;/a&gt; a node. &lt;a href=\"user-guide/storage/cypress-example.html#create\"&gt;See the CLI equivalent&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;TNodeId &lt;span class=\"hljs-title\"&gt;Create&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; path,\n    ENodeType type,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TCreateOptions&amp;amp; options)&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"167\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-167\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-167\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-167.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TYPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Node path&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ENodeType&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/objects.html#object_types\"&gt;Type&lt;/a&gt; of node created: &lt;br /&gt;  &lt;code&gt;NT_STRING&lt;/code&gt; — string (&lt;code&gt;string_node&lt;/code&gt;);&lt;br /&gt; &lt;code&gt;NT_INT64&lt;/code&gt; — signed integer (&lt;code&gt;int64_node&lt;/code&gt;); &lt;br /&gt;&lt;code&gt;NT_UINT64&lt;/code&gt; — unsigned integer (&lt;code&gt;uint64_node&lt;/code&gt;); &lt;br /&gt;&lt;code&gt;NT_DOUBLE&lt;/code&gt; — real number (&lt;code&gt;double_node&lt;/code&gt;); &lt;br /&gt;&lt;code&gt;NT_BOOLEAN&lt;/code&gt; — Boolean value (&lt;code&gt;boolean_node&lt;/code&gt;); &lt;br /&gt;&lt;code&gt;NT_MAP&lt;/code&gt; — map in Cypress (keys are strings, and values are other nodes, &lt;code&gt;map_node&lt;/code&gt;); &lt;br /&gt; &lt;code&gt;NT_FILE&lt;/code&gt; — &lt;a href=\"user-guide/storage/objects.html#files\"&gt;file&lt;/a&gt; (&lt;code&gt;file&lt;/code&gt;); &lt;br /&gt;&lt;code&gt;NT_TABLE&lt;/code&gt; — &lt;a href=\"user-guide/storage/objects.html#tables\"&gt;table&lt;/a&gt; (&lt;code&gt;table&lt;/code&gt;);&lt;br /&gt; &lt;code&gt;NT_DOCUMENT&lt;/code&gt; — &lt;a href=\"user-guide/storage/objects.html#yson_doc\"&gt;document&lt;/a&gt; (&lt;code&gt;document&lt;/code&gt;); &lt;br /&gt;&lt;code&gt;NT_REPLICATED_TABLE&lt;/code&gt; — &lt;a href=\"user-guide/dynamic-tables/replicated-dynamic-tables.html\"&gt;replicated table&lt;/a&gt; (&lt;code&gt;replicated_table&lt;/code&gt;); &lt;br /&gt;&lt;code&gt;NT_TABLE_REPLICA&lt;/code&gt; — (&lt;code&gt;table_replica&lt;/code&gt;);&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — optional settings:&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Recursive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to create intermediate directories.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;IgnoreExisting&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;If the node exists, do nothing and show no error.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;If the node exists, re-create it instead of an error.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TNode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/attributes.html\"&gt;Attributes&lt;/a&gt; of the created node.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"remove\"&gt;&lt;a href=\"en/api/cpp/description.html#remove\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Remove&lt;/span&gt;&lt;/a&gt;Remove&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"api/commands.html#remove\"&gt;Remove&lt;/a&gt; the node. &lt;a href=\"user-guide/storage/cypress-example.html#remove\"&gt;See the CLI equivalent&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;Remove&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; path,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TRemoveOptions&amp;amp; options)&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"292\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-292\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-292\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-292.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TYPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Path to the node.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — optional settings:&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Recursive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Recursively remove the children of a composite node.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Do not stop if the specified node is no longer there.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"exists\"&gt;&lt;a href=\"en/api/cpp/description.html#exists\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Exists&lt;/span&gt;&lt;/a&gt;Exists&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"api/commands.html#exists\"&gt;Checking the existence&lt;/a&gt; of the object at the specified path.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;Exists&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; path)&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"375\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-375\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-375\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-375.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TYPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Path to the node.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — optional settings&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"get\"&gt;&lt;a href=\"en/api/cpp/description.html#get\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Get&lt;/span&gt;&lt;/a&gt;Get&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"api/commands.html#get\"&gt;Get the contents of the Cypress node&lt;/a&gt; in &lt;code&gt;TNode&lt;/code&gt; format. &lt;a href=\"user-guide/storage/cypress-example.html#get\"&gt;See the CLI equivalent&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;TNode &lt;span class=\"hljs-title\"&gt;Get&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; path,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TGetOptions&amp;amp; options)&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"430\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-430\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-430\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-430.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TYPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Path to the node or attribute.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — optional settings:&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;AttributeFilter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;TAttributeFilter&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;List of attributes to be obtained.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;MaxSize&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;i64&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Limit on the number of children (for composite nodes).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"set\"&gt;&lt;a href=\"en/api/cpp/description.html#set\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Set&lt;/span&gt;&lt;/a&gt;Set&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"api/commands.html#set\"&gt;Write new Cypress node content.&lt;/a&gt; &lt;a href=\"user-guide/storage/cypress-example.html#set\"&gt;See the CLI equivalent&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;Set&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; path,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TNode&amp;amp; value,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TSetOptions&amp;amp; options)&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"513\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-513\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-513\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-513.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TYPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Path to the node or attribute.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;value&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TNode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Written subtree (content).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — optional settings:&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Recursive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to create intermediate nodes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"list\"&gt;&lt;a href=\"en/api/cpp/description.html#list\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List&lt;/span&gt;&lt;/a&gt;List&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"api/commands.html#list\"&gt;Get a list of the node's descendants&lt;/a&gt;. &lt;a href=\"user-guide/storage/cypress-example.html#list\"&gt;See the CLI equivalent&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;TNode::TListType &lt;span class=\"hljs-title\"&gt;List&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; path,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TListOptions&amp;amp; options)&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"596\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-596\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-596\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-596.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TYPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Path to the node or attribute.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — optional settings:&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;AttributeFilter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;TAttributeFilter&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;List of attributes to be received with each node.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;MaxSize&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;i64&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Limit on the number of children (for composite nodes).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"copy\"&gt;&lt;a href=\"en/api/cpp/description.html#copy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Copy&lt;/span&gt;&lt;/a&gt;Copy&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"api/commands.html#copy\"&gt;Copy the Cypress node to a new address&lt;/a&gt;. &lt;a href=\"user-guide/storage/cypress-example.html#copy_move\"&gt;See the CLI equivalent&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Copying is always recursive. The &lt;code&gt;Recursive&lt;/code&gt; parameter lets you specify whether to create intermediate directories for &lt;code&gt;destinationPath&lt;/code&gt; or not.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;TNodeId &lt;span class=\"hljs-title\"&gt;Copy&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; sourcePath,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; destinationPath,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TCopyOptions&amp;amp; options)&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"689\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-689\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-689\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-689.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;sourcePath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TYPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Path to source node.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;destinationPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TYPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Path for creating the copy (must not exist without the &lt;code&gt;Force&lt;/code&gt; option).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — optional settings:&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Recursive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to create intermediate directories for &lt;code&gt;destinationPath&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;If &lt;code&gt;destinationPath&lt;/code&gt; exists, replace with new content.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;PreserveAccount&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to save the accounts of the source nodes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;PreserveExpirationTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to copy the &lt;code&gt;expiration_time&lt;/code&gt; attribute.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;PreserveExpirationTimeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to copy the &lt;code&gt;expiration_timeout&lt;/code&gt; attribute.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"move\"&gt;&lt;a href=\"en/api/cpp/description.html#move\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Move&lt;/span&gt;&lt;/a&gt;Move&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"api/commands.html#move\"&gt;Move the node to a new path&lt;/a&gt;. &lt;a href=\"user-guide/storage/cypress-example.html#copy_move\"&gt;See the CLI equivalent&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;TNodeId &lt;span class=\"hljs-title\"&gt;Move&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; sourcePath,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; destinationPath,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TMoveOptions&amp;amp; options)&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"828\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-828\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-828\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-828.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;sourcePath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TYPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Path to source node.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;destinationPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TYPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Path for creating the copy (must not exist without the &lt;code&gt;Force&lt;/code&gt; option).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — optional settings:&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Recursive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to create intermediate directories for &lt;code&gt;destinationPath&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;If &lt;code&gt;destinationPath&lt;/code&gt; exists, replace with new content.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;PreserveAccount&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to save the accounts of the source nodes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;PreserveExpirationTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to copy the &lt;code&gt;expiration_time&lt;/code&gt; attribute.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;PreserveExpirationTimeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to copy the &lt;code&gt;expiration_timeout&lt;/code&gt; attribute.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"link\"&gt;&lt;a href=\"en/api/cpp/description.html#link\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Link&lt;/span&gt;&lt;/a&gt;Link&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"api/commands.html#link\"&gt;Create&lt;/a&gt; a &lt;a href=\"user-guide/storage/links.html\"&gt;symbolic link&lt;/a&gt; to the object at the new address. &lt;a href=\"user-guide/storage/cypress-example.html#link\"&gt;See the CLI equivalent&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;TNodeId &lt;span class=\"hljs-title\"&gt;Link&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; targetPath,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; linkPath,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TLinkOptions&amp;amp; options)&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"967\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-967\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-967\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-967.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;targetPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TYPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Path to the source node where the link will direct.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;linkPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TYPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Path where the link will be created (must not exist without the &lt;code&gt;Force&lt;/code&gt; option).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — optional settings&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Recursive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to create intermediate directories.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;IgnoreExisting&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;If &lt;code&gt;linkPath&lt;/code&gt; exists and &lt;em&gt;constitutes a link&lt;/em&gt;, do nothing and show no error&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Force&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;If the &lt;code&gt;linkPath&lt;/code&gt; node exists, create a link again in its place.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Attributes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TNode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/attributes.html\"&gt;Attributes&lt;/a&gt; for &lt;code&gt;linkPath&lt;/code&gt; in the form of &lt;code&gt;TNode&lt;/code&gt; are written if created.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"concatenate\"&gt;&lt;a href=\"en/api/cpp/description.html#concatenate\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Concatenate&lt;/span&gt;&lt;/a&gt;Concatenate&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"api/commands.html#concatenate\"&gt;Concatenate&lt;/a&gt; a set of files or tables (in the order in which their paths are listed). &lt;a href=\"user-guide/storage/cypress-example.html#concatenate\"&gt;See the CLI equivalent&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;The data merge takes place at the metadata level and exclusively on the &lt;a href=\"user-guide/storage/cypress.html\"&gt;Cypress&lt;/a&gt; master server.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;Concatenate&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TVector&amp;lt;TYPath&amp;gt;&amp;amp; sourcePaths,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; destinationPath,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TConcatenateOptions&amp;amp; options)&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1095\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1095\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1095\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1095.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;sourcePaths&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TVector&amp;lt;TYPath&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Paths to input files or tables.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;destinationPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TYPath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Path to the combined file or table, must exist.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — optional settings:&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Append&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether to keep the contents of &lt;code&gt;destinationPath&lt;/code&gt;, add new data at the end. Without this flag, the old &lt;code&gt;destinationPath&lt;/code&gt; content will disappear.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"file-reading-and-writing\"&gt;&lt;a href=\"en/api/cpp/description.html#file-reading-and-writing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;File reading and writing&lt;/span&gt;&lt;/a&gt;File reading and writing&lt;/h2&gt;\n&lt;p&gt;To write a file to YT, you need to call the client/transaction method &lt;code&gt;CreateFileWriter(filePath)&lt;/code&gt;.&lt;br /&gt;\nThe returned &lt;code&gt;IFileWriter&lt;/code&gt; interface is inherited from &lt;code&gt;IOutputStream&lt;/code&gt;. If the file does not already exist, it will be created.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; writer = client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;CreateFileWriter&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/file\"&lt;/span&gt;);\n*writer &amp;lt;&amp;lt; &lt;span class=\"hljs-string\"&gt;\"something\"&lt;/span&gt;;\nwriter-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Finish&lt;/span&gt;();\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1178\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1178\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1178\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1178.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Reading utilizes the &lt;code&gt;IFileReader&lt;/code&gt; interface, which provides the &lt;code&gt;IInputStream&lt;/code&gt; methods.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; reader = client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;CreateFileReader&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/file\"&lt;/span&gt;);\nTString anything;\n*reader &amp;gt;&amp;gt; anything;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1182\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1182\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1182\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1182.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Additional options are passed through the &lt;code&gt;TFileWriterOptions&lt;/code&gt; and &lt;code&gt;TFileReaderOptions&lt;/code&gt; structures.&lt;/p&gt;\n&lt;h2 id=\"structures-for-representing-table-rows\"&gt;&lt;a href=\"en/api/cpp/description.html#structures-for-representing-table-rows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Structures for representing table rows&lt;/span&gt;&lt;/a&gt;Structures for representing table rows&lt;/h2&gt;\n&lt;p&gt;There are several ways to represent individual table records in operations and during I/O.&lt;/p&gt;\n&lt;h3 id=\"tnode1\"&gt;&lt;a href=\"en/api/cpp/description.html#tnode1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TNode&lt;/span&gt;&lt;/a&gt;TNode&lt;/h3&gt;\n&lt;p&gt;To represent a record, TNode must have the &lt;a href=\"user-guide/storage/objects.html#primitive_types\"&gt;map&lt;/a&gt; type and constitute the display of column names as YSON values.&lt;/p&gt;\n&lt;h3 id=\"protobuf\"&gt;&lt;a href=\"en/api/cpp/description.html#protobuf\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Protobuf&lt;/span&gt;&lt;/a&gt;Protobuf&lt;/h3&gt;\n&lt;p&gt;For more information about Protobuf, see &lt;a href=\"api/cpp/protobuf.html\"&gt;Protobuf representation of tables&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Here, it is possible to define a custom protobuf type. To display protobuf fields in column names, use the following extensions:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"yt/yt_proto/yt/formats/extension.proto\"&lt;/span&gt;;\nmessage TSampleProto {\n    optional int64  a = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt; [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"column_a\"&lt;/span&gt;];\n    optional &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; b = &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt; [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"column_b\"&lt;/span&gt;];\n    optional string c = &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt; [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"column_c\"&lt;/span&gt;];\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1207\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1207\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1207\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1207.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;There is support for nested structures, in which case binary protobuf serialization is used: a row with binary protobuf serialization of the &lt;a href=\"api/cpp/protobuf.html#embedded\"&gt;nested message&lt;/a&gt; is stored in a table column. Nested structures can have &lt;code&gt;repeated&lt;/code&gt; fields, which undergo binary serialization along with the rest of the nested message.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;You should not use the &lt;code&gt;proto3&lt;/code&gt; version. The &lt;a href=\"https://developers.google.com/protocol-buffers/docs/proto3#default\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;proto3 implementation&lt;/a&gt; makes it so default field values are indistinguishable from missing fields. This results in value &lt;code&gt;0&lt;/code&gt; of the &lt;code&gt;int&lt;/code&gt; type, for example, not being written to the table.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"reading-and-writing-tables\"&gt;&lt;a href=\"en/api/cpp/description.html#reading-and-writing-tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reading and writing tables&lt;/span&gt;&lt;/a&gt;Reading and writing tables&lt;/h2&gt;\n&lt;p&gt;See &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/interface/io.h\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/interface/io.h&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; writer = client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;CreateTableWriter&lt;/span&gt;&amp;lt;TNode&amp;gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;);\nwriter-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;AddRow&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TNode&lt;/span&gt;()(&lt;span class=\"hljs-string\"&gt;\"x\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;1.&lt;/span&gt;)(&lt;span class=\"hljs-string\"&gt;\"y\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;0.&lt;/span&gt;));\nwriter-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;AddRow&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TNode&lt;/span&gt;()(&lt;span class=\"hljs-string\"&gt;\"x\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;0.&lt;/span&gt;)(&lt;span class=\"hljs-string\"&gt;\"y\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;1.&lt;/span&gt;));\nwriter-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Finish&lt;/span&gt;();\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1227\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1227\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1227\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1227.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Block writing. When &lt;code&gt;AddRow()&lt;/code&gt; is called, the data is stored in the internal buffer, and if this buffer is larger than 64 MB, a separate thread is triggered that transmits the accumulated data.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;Finish()&lt;/code&gt; method is guaranteed to reset all the accumulated records or show an error. When destroying a writer without calling &lt;code&gt;Finish()&lt;/code&gt;, a reset attempt will be made in the destructor without a guaranteed result. If the table did not exist before the creation of the writer, it will be created in the context of the same client or transaction with all the default attributes. If you need a different replication factor, you should create a table and give it the required attributes beforehand.&lt;/p&gt;\n&lt;p&gt;For reading, the main methods are &lt;code&gt;GetRow()&lt;/code&gt;, &lt;code&gt;IsValid()&lt;/code&gt;, &lt;code&gt;Next()&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; reader = client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;CreateTableReader&lt;/span&gt;&amp;lt;TYaMRRow&amp;gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/ksv_table\"&lt;/span&gt;);\n&lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; (; reader-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;IsValid&lt;/span&gt;(); reader-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Next&lt;/span&gt;()) {\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; row = reader-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;GetRow&lt;/span&gt;();\n    Cout &amp;lt;&amp;lt; row.Key &amp;lt;&amp;lt; &lt;span class=\"hljs-string\"&gt;\"; \"&lt;/span&gt; &amp;lt;&amp;lt; row.SubKey &amp;lt;&amp;lt; &lt;span class=\"hljs-string\"&gt;\"; \"&lt;/span&gt; &amp;lt;&amp;lt; row.Value &amp;lt;&amp;lt; Endl;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1237\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1237\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1237\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1237.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The object returned from &lt;code&gt;GetRow()&lt;/code&gt; can only be used before calling &lt;code&gt;Next()&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;GetRowIndex()&lt;/code&gt; method allows you to get the absolute index of the current row.&lt;/p&gt;\n&lt;p&gt;Example with protobuf:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; writer = client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;CreateTableWriter&lt;/span&gt;&amp;lt;TSampleProto&amp;gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;);\nTSampleProto row;\nrow.&lt;span class=\"hljs-built_in\"&gt;set_a&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;42&lt;/span&gt;);\nwriter-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;AddRow&lt;/span&gt;(row);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1247\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1247\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1247\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=
