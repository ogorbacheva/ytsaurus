 fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2044\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2044\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2044.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operationId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Operation ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — optional settings:&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;EJobType&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;The job has the &lt;code&gt;Type&lt;/code&gt; type.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;State&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;EJobState&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;The job is in the &lt;code&gt;State&lt;/code&gt; state.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Address&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;TString&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;The job is running (or was run) on the &lt;code&gt;Address&lt;/code&gt; node.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;WithStderr&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;bool&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Whether the job wrote anything to stderr.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;WithSpec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;bool&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Whether the job specification was saved.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;WithFailContext&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;bool&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Whether the job's fail context was saved.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;WithMonitoringDescriptor&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;bool&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Whether the job was assigned a monitoring descriptor.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;WithInterruptionInfo&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;bool&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Whether the job has interruption info&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;SortField&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;EJobSortField&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;The field jobs are sorted by in the response.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;SortOrder&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;ESortOrder&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Ascending or descending job sorting order.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;DataSource&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;EListJobsDataSource&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Where to look for jobs: in the controller agent and Cypress (&lt;code&gt;Runtime&lt;/code&gt;), in the archive of jobs (&lt;code&gt;Archive&lt;/code&gt;), automatically depending on whether the operation is in Cypress (&lt;code&gt;Auto&lt;/code&gt;), or other (&lt;code&gt;Manual&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;IncludeCypress&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;bool&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Whether to search for jobs in Cypress (the option factors into &lt;code&gt;DataSource == Manual&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;IncludeControllerAgent&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;bool&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Search for jobs in the agent controller (the option factors into &lt;code&gt;DataSource == Manual&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;IncludeArchive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;bool&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Whether to search for jobs in the job archive (the option factors into &lt;code&gt;DataSource == Manual&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;i64&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Return no more than &lt;code&gt;Limit&lt;/code&gt; of jobs.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Offset&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TMaybe&amp;lt;i64&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Skip the first &lt;code&gt;Offset&lt;/code&gt; jobs (in the sort order).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"getjobinput\"&gt;&lt;a href=\"en/api/cpp/description.html#getjobinput\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GetJobInput&lt;/span&gt;&lt;/a&gt;GetJobInput&lt;/h3&gt;\n&lt;p&gt;Get the input of a &lt;a href=\"api/commands.html#get_job_input\"&gt;running or failed job&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;IFileReaderPtr &lt;span class=\"hljs-title\"&gt;GetJobInput&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TJobId&amp;amp; jobId,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TGetJobInputOptions&amp;amp; options)&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2323\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2323\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2323\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2323.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;jobId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Job ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — optional settings (none yet)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"getjobfailcontext\"&gt;&lt;a href=\"en/api/cpp/description.html#getjobfailcontext\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GetJobFailContext&lt;/span&gt;&lt;/a&gt;GetJobFailContext&lt;/h3&gt;\n&lt;p&gt;Get fail context of a &lt;a href=\"api/commands.html#get_job_fail_context\"&gt;failed job&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;IFileReaderPtr &lt;span class=\"hljs-title\"&gt;GetJobFailContext&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TOperationId&amp;amp; operationId,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TJobId&amp;amp; jobId,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TGetJobFailContextOptions&amp;amp; options)&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2360\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2360\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2360\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2360.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operationId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Operation ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;jobId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Job ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — optional settings (none yet)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"getjobstderr\"&gt;&lt;a href=\"en/api/cpp/description.html#getjobstderr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GetJobStderr&lt;/span&gt;&lt;/a&gt;GetJobStderr&lt;/h3&gt;\n&lt;p&gt;Get stderr of a &lt;a href=\"api/commands.html#get_job_stderr\"&gt;running or failed job&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;IFileReaderPtr &lt;span class=\"hljs-title\"&gt;GetJobStderr&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TOperationId&amp;amp; operationId,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TJobId&amp;amp; jobId,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TGetJobStderrOptions&amp;amp; options)&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2405\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2405\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2405\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2405.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operationId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Operation ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;jobId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Job ID.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — optional settings (none yet)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"working-with-file-cache\"&gt;&lt;a href=\"en/api/cpp/description.html#working-with-file-cache\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with file cache&lt;/span&gt;&lt;/a&gt;Working with file cache&lt;/h2&gt;\n&lt;p&gt;Clusters have a common file cache that stores files by key, which is their MD5 hash. It is currently&lt;br /&gt;\nat &lt;code&gt;//tmp/yt_wrapper/file_storage/new_cache&lt;/code&gt;.&lt;br /&gt;\nYou can use the &lt;code&gt;PutFileToCache&lt;/code&gt; and &lt;code&gt;GetFileFromCache&lt;/code&gt; methods to work with it.&lt;br /&gt;\nThe same methods can be used to work with your cache that is located at a different path (but you will also need to clean it yourself).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;All commands for working with the file cache are non-transactional, so they encompass the &lt;code&gt;IClient&lt;/code&gt; methods, but not &lt;code&gt;IClientBase&lt;/code&gt; or &lt;code&gt;ITransaction&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"putfiletocache\"&gt;&lt;a href=\"en/api/cpp/description.html#putfiletocache\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PutFileToCache&lt;/span&gt;&lt;/a&gt;PutFileToCache&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"api/commands.html#put_file_to_cache\"&gt;Copy the file to the cache&lt;/a&gt;. Returns a path to the cached file.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;TYPath &lt;span class=\"hljs-title\"&gt;PutFileToCache&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n        &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; filePath,\n        &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TString&amp;amp; md5Signature,\n        &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; cachePath,\n        &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TPutFileToCacheOptions&amp;amp; options)&lt;/span&gt;\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2466\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2466\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2466\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2466.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;filePath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The path to the file in Cypress (the file must have the &lt;code&gt;md5&lt;/code&gt; attribute; for this, it must be written with the &lt;code&gt;TFileWriterOptions::ComputeMD5&lt;/code&gt; option).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;md5Signature&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The file's MD5 hash.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;cachePath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The Cypress path to the file cache root.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — optional settings (none yet)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"getfilefromcache\"&gt;&lt;a href=\"en/api/cpp/description.html#getfilefromcache\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GetFileFromCache&lt;/span&gt;&lt;/a&gt;GetFileFromCache&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"api/commands.html#get_file_from_cache\"&gt;Get a path to the cached file&lt;/a&gt;. Returns the path (or &lt;code&gt;Nothing&lt;/code&gt;, if there is no file with this MD5).&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;TMaybe&amp;lt;TYPath&amp;gt; &lt;span class=\"hljs-title\"&gt;GetFileFromCache&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n        &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TString&amp;amp; md5Signature,\n        &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TYPath&amp;amp; cachePath,\n        &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TGetFileFromCacheOptions&amp;amp; options)&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2519\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2519\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2519\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2519.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;md5Signature&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The file's MD5 hash.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;cachePath&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The Cypress path to the file cache root.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;options&lt;/code&gt; — optional settings (none yet)&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"environment-variables\"&gt;&lt;a href=\"en/api/cpp/description.html#environment-variables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Environment variables&lt;/span&gt;&lt;/a&gt;Environment variables&lt;/h2&gt;\n&lt;p&gt;Currently these settings are available only from environment variables and are the same for all &lt;code&gt;IClient&lt;/code&gt; instances. However, we are going to redesign this functionality so that almost everything can be configured directly from the code and changed at the individual &lt;code&gt;IClient&lt;/code&gt; level.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;em&gt;Variable&lt;/em&gt;&lt;/th&gt;\n&lt;th&gt;&lt;em&gt;Type&lt;/em&gt;&lt;/th&gt;\n&lt;th&gt;&lt;em&gt;Value&lt;/em&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_TOKEN&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Value of the custom token.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_TOKEN_PATH&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Path to a file with the custom token.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_PREFIX&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;A path that is prefixed to all paths in Cypress.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_TRANSACTION&lt;/td&gt;\n&lt;td&gt;guid&lt;/td&gt;\n&lt;td&gt;External transaction ID. This parameter has &lt;code&gt;CreateClient()&lt;/code&gt; create an &lt;code&gt;IClient&lt;/code&gt; instance that runs in the context of the transaction.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_POOL&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Pool for running user operations.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_FORCE_IPV4&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Use only IPv4.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_FORCE_IPV6&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Use only IPv6.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_CONTENT_ENCODING&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;HTTP header Content-Encoding: &lt;code&gt;identity&lt;/code&gt;, &lt;code&gt;gzip&lt;/code&gt;, &lt;code&gt;y-lzo&lt;/code&gt;, &lt;code&gt;y-lzf&lt;/code&gt; are supported.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_ACCEPT_ENCODING&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;HTTP header Accept-Encoding.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_USE_HOSTS&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Whether to use heavy proxies.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_HOSTS&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Path in the heavy proxy list request.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_RETRY_COUNT&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;Number of attempts per HTTP request.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_START_OPERATION_RETRY_COUNT&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;The number of attempts to start the operation when the limit of simultaneously running operations is exceeded.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_VERSION&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;HTTP API version.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_SPEC&lt;/td&gt;\n&lt;td&gt;json&lt;/td&gt;\n&lt;td&gt;Specification added to each operation specification. Order: main specification, &lt;code&gt;YT_SPEC&lt;/code&gt;, &lt;code&gt;TOperationOptions::Spec&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_CONNECT_TIMEOUT&lt;/td&gt;\n&lt;td&gt;seconds&lt;/td&gt;\n&lt;td&gt;Socket connection timeout.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_SOCKET_TIMEOUT&lt;/td&gt;\n&lt;td&gt;seconds&lt;/td&gt;\n&lt;td&gt;Timeout for working the socket.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_TX_TIMEOUT&lt;/td&gt;\n&lt;td&gt;seconds&lt;/td&gt;\n&lt;td&gt;Transaction timeout.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_PING_INTERVAL&lt;/td&gt;\n&lt;td&gt;seconds&lt;/td&gt;\n&lt;td&gt;Interval between consecutive transaction pings.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_RETRY_INTERVAL&lt;/td&gt;\n&lt;td&gt;seconds&lt;/td&gt;\n&lt;td&gt;Interval between HTTP request attempts.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_RATE_LIMIT_EXCEEDED_RETRY_INTERVAL&lt;/td&gt;\n&lt;td&gt;seconds&lt;/td&gt;\n&lt;td&gt;The interval between attempts if the request rate limit is exceeded.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;YT_START_OPERATION_RETRY_INTERVAL&lt;/td&gt;\n&lt;td&gt;seconds&lt;/td&gt;\n&lt;td&gt;Interval between attempts to start the operation.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"thread-safety\"&gt;&lt;a href=\"en/api/cpp/description.html#thread-safety\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Thread safety&lt;/span&gt;&lt;/a&gt;Thread safety&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;IClient&lt;/code&gt; and &lt;code&gt;ITransaction&lt;/code&gt; have no variable state. Thread-safe.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/api/cpp/description.md","sourcePath":"en/api/cpp/description.md"},"headings":[{"title":"Overview","href":"en/api/cpp/description.html#overview","level":2},{"title":"Logging","href":"en/api/cpp/description.html#logging","level":2},{"title":"Initializing","href":"en/api/cpp/description.html#init","level":2},{"title":"Transactions","href":"en/api/cpp/description.html#transactions","level":2},{"title":"TNode","href":"en/api/cpp/description.html#tnode","level":2},{"title":"Working with Cypress","href":"en/api/cpp/description.html#cypress","level":2,"items":[{"title":"Create","href":"en/api/cpp/description.html#create","level":3},{"title":"Remove","href":"en/api/cpp/description.html#remove","level":3},{"title":"Exists","href":"en/api/cpp/description.html#exists","level":3},{"title":"Get","href":"en/api/cpp/description.html#get","level":3},{"title":"Set","href":"en/api/cpp/description.html#set","level":3},{"title":"List","href":"en/api/cpp/description.html#list","level":3},{"title":"Copy","href":"en/api/cpp/description.html#copy","level":3},{"title":"Move","href":"en/api/cpp/description.html#move","level":3},{"title":"Link","href":"en/api/cpp/description.html#link","level":3},{"title":"Concatenate","href":"en/api/cpp/description.html#concatenate","level":3}]},{"title":"File reading and writing","href":"en/api/cpp/description.html#file-reading-and-writing","level":2},{"title":"Structures for representing table rows","href":"en/api/cpp/description.html#structures-for-representing-table-rows","level":2,"items":[{"title":"TNode","href":"en/api/cpp/description.html#tnode1","level":3},{"title":"Protobuf","href":"en/api/cpp/description.html#protobuf","level":3}]},{"title":"Reading and writing tables","href":"en/api/cpp/description.html#reading-and-writing-tables","level":2,"items":[{"title":"TRichYPath","href":"en/api/cpp/description.html#trichypath","level":3},{"title":"Format settings","href":"en/api/cpp/description.html#format-settings","level":3},{"title":"Additional options","href":"en/api/cpp/description.html#additional-options","level":3},{"title":"Parallel read","href":"en/api/cpp/description.html#parallel_read","level":3}]},{"title":"Running operations","href":"en/api/cpp/description.html#operations","level":2,"items":[{"title":"Transferring user files","href":"en/api/cpp/description.html#transferring-user-files","level":3},{"title":"M
