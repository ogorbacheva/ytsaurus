            {"data":{"leading":false,"html":"&lt;p&gt;This section contains information about additional query parameters. For more information about commands, see the &lt;a href=\"api/commands.html\"&gt;Commands&lt;/a&gt; section.&lt;/p&gt;\n&lt;h2 id=\"conditions\"&gt;&lt;a href=\"en/api/query-parameters.html#conditions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Prerequisites&lt;/span&gt;&lt;/a&gt;Prerequisites&lt;/h2&gt;\n&lt;p&gt;Here is a list of the commands for which you can specify success conditions:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;set&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;remove&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;create&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;lock&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;copy&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;move&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;link&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;create&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;There are two types of conditions:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;prerequisite_revisions&lt;/code&gt;: A set of hints including &lt;code&gt;path&lt;/code&gt;, &lt;code&gt;transaction_id&lt;/code&gt;, &lt;code&gt;revision&lt;/code&gt;. The query will be executed only if all the paths provided in the hint exist (in the context of the given transactions) and the revisions are as hinted.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;prerequisite_transactions&lt;/code&gt; includes a list of &lt;a href=\"user-guide/storage/transactions.html\"&gt;transactions&lt;/a&gt; that must exist when the query is executed.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;revision = client.get(&lt;span class=\"hljs-string\"&gt;\"//tmp/my_table/@revision\"&lt;/span&gt;)\n&lt;span class=\"hljs-comment\"&gt;#... some calculations ...&lt;/span&gt;\nrevision_parameter = yt.create_revision_parameter(path=&lt;span class=\"hljs-string\"&gt;\"//tmp/my_table\"&lt;/span&gt;, revision=revision)\nrevision_client = yt.create_client_with_command_params(prerequisite_revisions=[revision_parameter])\nrevision_client.move(&lt;span class=\"hljs-string\"&gt;\"//tmp/transformed_table\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/my_table\"&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"69\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-69\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-69\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-69.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"data-source\"&gt;&lt;a href=\"en/api/query-parameters.html#data-source\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data source for reading&lt;/span&gt;&lt;/a&gt;Data source for reading&lt;/h2&gt;\n&lt;p&gt;In &lt;a href=\"api/commands.html#concepts\"&gt;non-mutating&lt;/a&gt; queries to &lt;a href=\"user-guide/storage/cypress.html\"&gt;Cypress&lt;/a&gt;, you can specify a data source for reading, using the &lt;code&gt;read_from&lt;/code&gt;  parameter.&lt;/p&gt;\n&lt;p&gt;A popular value for the &lt;code&gt;read_from&lt;/code&gt; parameter is &lt;code&gt;cache&lt;/code&gt;.  In this case, the response is read from the cache (usually hosted on dedicated instances in the cluster). This allows decreasing the load on the master server. This is important when running numerous heavy queries against Cypress: for example, if you need to traverse a large subtree.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; obj &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; client.search(&lt;span class=\"hljs-string\"&gt;\"//tmp/my_table\"&lt;/span&gt;, read_from=&lt;span class=\"hljs-string\"&gt;\"cache\"&lt;/span&gt;):\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"abc\"&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;str&lt;/span&gt;(obj):\n        ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"82\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-82\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-82\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-82.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/api/query-parameters.md","sourcePath":"en/api/query-parameters.md"},"headings":[{"title":"Prerequisites","href":"en/api/query-parameters.html#conditions","level":2},{"title":"Data source for reading","href":"en/api/query-parameters.html#data-source","level":2}],"title":"Query parameters"},"router":{"pathname":"en/api/query-parameters","depth":3,"base":"../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
