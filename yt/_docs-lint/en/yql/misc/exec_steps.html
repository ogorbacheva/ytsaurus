        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;YQL is a strongly typed programming language. This specifically means that before a YQL query is executed, it must be typed (the type for each node must be computed in the computation graph). Clicking the &lt;strong&gt;Validate&lt;/strong&gt; button in the web interface triggers typing.&lt;/p&gt;\n&lt;p&gt;For example, the query&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT key + 1 AS new_key FROM T;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;is typed as follows (with some simplifications):&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The metadata of table &lt;code&gt;T&lt;/code&gt; is loaded, revealing that the &lt;code&gt;key&lt;/code&gt; column is of the Uint32 type.&lt;/li&gt;\n&lt;li&gt;The literal type is always known: type 1 is Int32.&lt;/li&gt;\n&lt;li&gt;The &lt;code&gt;+&lt;/code&gt; operation type is computed based on the argument types. For Int32 and Uint32 arguments, the result is Int32.&lt;/li&gt;\n&lt;li&gt;As a result, the query type is a list of structs with one Int32 element, namely &lt;code&gt;List&amp;lt;Struct&amp;lt;new_key:Int32&amp;gt;&amp;gt;&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;However, YQL also supports more complex typing cases where the query type depends on the &lt;em&gt;values&lt;/em&gt; of certain expressions, and these values may depend on the table &lt;em&gt;contents&lt;/em&gt;. Typical example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$from = \"2022-02-01\";\n$to = SELECT MAX(dt) FROM T1;\n\nINSERT INTO Result\nSELECT * FROM RANGE(Dir, $from, $to);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"35\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-35\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-35\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-35.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;To infer the &lt;a href=\"en/yql/syntax/select/concat.html\"&gt;RANGE&lt;/a&gt; type (that is, to infer the common type for tables), compute the &lt;code&gt;$to&lt;/code&gt; value.&lt;/p&gt;\n&lt;p&gt;Another example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$cols = SELECT AGGREGATE_LIST(DISTINCT name) FROM T1 WHERE &amp;lt;condition&amp;gt;; -- dynamically generate the list of columns\n\n -- select the columns from the list\nSELECT * FROM (SELECT ChooseMembers(TableRow(), $cols) FROM T2) FLATTEN COLUMNS;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"42\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-42\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-42\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-42.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;To type &lt;a href=\"en/yql/builtins/struct.html#choosemembers\"&gt;ChooseMembers&lt;/a&gt;, compute the &lt;em&gt;value&lt;/em&gt; (not type) of &lt;code&gt;$cols&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;We can draw the following conclusions:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Some YQL queries require computations for typing.&lt;/li&gt;\n&lt;li&gt;Sometimes these computations require table reads.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;YQL has a dedicated Evaluation stage for typing such queries, which is where all the necessary computations are performed.&lt;/p&gt;\n&lt;p&gt;Please note that this stage is subject to certain limitations. The main one is that the total size of tables that the Evaluation stage depends on is limited. The default limit is 1 MB, but it can be expanded to 10 MB using the &lt;a href=\"en/yql/syntax/pragma/yt.html#ytevaluationtablesizelimit\"&gt;yt.EvaluationTableSizeLimit&lt;/a&gt; pragma.&lt;/p&gt;\n&lt;p&gt;These limitations are designed to avoid a lengthy Evaluation stage during which the query plan cannot yet be displayed, and after which user typing errors can still occur. This prevents scenarios where you run a computation for several hours only to encounter a \"No such column\" error and a failed query.&lt;/p&gt;\n&lt;p&gt;The only way to get around this limitation is to split the query into two. The first query computes the evaluation part and writes data to the table, while the second one depends on that (small-sized) table.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/misc/exec_steps.md","sourcePath":"en/yql/misc/exec_steps.md"},"headings":[],"title":"Query execution stages"},"router":{"pathname":"en/yql/misc/exec_steps","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
