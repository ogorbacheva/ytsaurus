            {"data":{"leading":false,"html":"&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Callable&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A callable value that can be executed by passing arguments in parentheses in YQL SQL syntax or using the &lt;code&gt;Apply&lt;/code&gt; function with the &lt;a href=\"/docs/s_expressions\"&gt;s-expressions&lt;/a&gt; syntax.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Resource&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Resource is an opaque pointer to a resource you can pass between the user defined functions (UDF). The type of the returned and accepted resource is declared inside a function using a string label. When passing a resource, YQL checks for label matching to prevent passing of resources between incompatible functions. If the labels mismatch, a type error occurs.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Tagged&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Tagged is the option to assign an application name to any other type.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Generic&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The data type used for data types.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Unit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Unit is the data type used for non-enumerable entities (data sources and data sinks, atoms, etc.).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Void is a singular data type with the only possible null value. It's the type of the &lt;code&gt;NULL&lt;/code&gt; literal and can be converted to any &lt;code&gt;Optional&lt;/code&gt; type.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Void&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Void is a singular data type with the only possible &lt;code&gt;\"null\"&lt;/code&gt; value.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;EmptyList&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A singular data type with the only possible [] value. It's the type of the &lt;code&gt;[]&lt;/code&gt; literal and can be converted to any &lt;code&gt;List&lt;/code&gt; type.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;EmptyDict&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A singular data type with the only possible &lt;code&gt;{}&lt;/code&gt; value. It's a type of the &lt;code&gt;{}&lt;/code&gt; literal and can be converted to any &lt;code&gt;Dict&lt;/code&gt; or &lt;code&gt;Set&lt;/code&gt; type.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/types/special.md","sourcePath":"en/yql/types/special.md"},"headings":[],"title":"Special data types"},"router":{"pathname":"en/yql/types/special","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
