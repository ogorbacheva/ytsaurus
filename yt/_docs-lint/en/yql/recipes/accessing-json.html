        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;YQL provides two main methods for extracting values from JSON:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Using &lt;a href=\"en/yql/builtins/json.html\"&gt;&lt;strong&gt;JSON functions from the SQL standard&lt;/strong&gt;&lt;/a&gt;. This approach is recommended for simple cases and for teams that are familiar with them from other DBMSs.&lt;/li&gt;\n&lt;li&gt;Using &lt;a href=\"en/yql/udf/list/yson.html\"&gt;&lt;strong&gt;YSON UDFs&lt;/strong&gt;&lt;/a&gt;, built-in functions for &lt;a href=\"en/yql/builtins/list.html\"&gt;lists&lt;/a&gt;, &lt;a href=\"en/yql/builtins/dict.html\"&gt;dicts&lt;/a&gt;, and &lt;a href=\"en/yql/syntax/expressions.html#lambda\"&gt;lambdas&lt;/a&gt;. This approach is more flexible and is tightly integrated with YQL's data type system, making it a better choice for complex cases.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Below are recipes that use the same input JSON to demonstrate how to use each option to check if a key exists, get a specific value, and extract a subtree.&lt;/p&gt;\n&lt;h2 id=\"json-functions\"&gt;&lt;a href=\"en/yql/recipes/accessing-json.html#json-functions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;JSON functions&lt;/span&gt;&lt;/a&gt;JSON functions&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$json = @@{\n    \"friends\": [\n        {\n            \"name\": \"James Holden\",\n            \"age\": 35\n        },\n        {\n            \"name\": \"Naomi Nagata\",\n            \"age\": 30\n        }\n    ]\n}@@j;\n\nSELECT\n    JSON_EXISTS($json, \"$.friends[*].name\"), -- True\n    CAST(JSON_VALUE($json, \"$.friends[0].age\") AS Int32), -- 35\n    JSON_QUERY($json, \"$.friends[0]\"); -- {\"name\": \"James Holden\", \"age\": 35}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"21\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-21\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-21\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-21.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code&gt;JSON_*&lt;/code&gt; functions expect the &lt;code&gt;Json&lt;/code&gt; data type as input. In this example, the string literal has the &lt;code&gt;j&lt;/code&gt; suffix, marking it as &lt;code&gt;Json&lt;/code&gt;. Tables can store data either in JSON format or as a string representation. To convert data from &lt;code&gt;String&lt;/code&gt; to &lt;code&gt;JSON&lt;/code&gt;, use the &lt;code&gt;CAST&lt;/code&gt; function: for example, &lt;code&gt;CAST(my_string AS JSON)&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"yson-udf\"&gt;&lt;a href=\"en/yql/recipes/accessing-json.html#yson-udf\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson UDF&lt;/span&gt;&lt;/a&gt;Yson UDF&lt;/h2&gt;\n&lt;p&gt;This approach typically combines multiple functions and expressions, so one query can include different strategies.&lt;/p&gt;\n&lt;h3 id=\"converting-the-whole-json-into-yql-containers\"&gt;&lt;a href=\"en/yql/recipes/accessing-json.html#converting-the-whole-json-into-yql-containers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Converting the whole JSON into YQL containers&lt;/span&gt;&lt;/a&gt;Converting the whole JSON into YQL containers&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$json = @@{\n    \"friends\": [\n        {\n            \"name\": \"James Holden\",\n            \"age\": 35\n        },\n        {\n            \"name\": \"Naomi Nagata\",\n            \"age\": 30\n        }\n    ]\n}@@j;\n\n$containers = Yson::ConvertTo($json, Struct&amp;lt;friends:List&amp;lt;Struct&amp;lt;name:String?,age:Int32?&amp;gt;&amp;gt;&amp;gt;);\n$has_name = ListAny(\n    ListMap($containers.friends, ($friend) -&amp;gt; {\n        return $friend.name IS NOT NULL;\n    })\n);\n$get_age = $containers.friends[0].age;\n$get_first_friend = Yson::SerializeJson(Yson::From($containers.friends[0]));\n\nSELECT\n    $has_name, -- True\n    $get_age, -- 35\n    $get_first_friend; -- {\"name\": \"James Holden\", \"age\": 35}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"34\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-34\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-34\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-34.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You &lt;strong&gt;don't&lt;/strong&gt; have to convert the whole JSON object into a structured combination of containers. Some fields may be omitted if not used, and some subtrees may be left in an unstructured data type like &lt;code&gt;Json&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"working-with-in-memory-representation\"&gt;&lt;a href=\"en/yql/recipes/accessing-json.html#working-with-in-memory-representation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with in-memory representation&lt;/span&gt;&lt;/a&gt;Working with in-memory representation&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$json = @@{\n    \"friends\": [\n        {\n            \"name\": \"James Holden\",\n            \"age\": 35\n        },\n        {\n            \"name\": \"Naomi Nagata\",\n            \"age\": 30\n        }\n    ]\n}@@j;\n\n$has_name = ListAny(\n    ListMap(Yson::ConvertToList($json.friends), ($friend) -&amp;gt; {\n        return Yson::Contains($friend, \"name\");\n    })\n);\n$get_age = Yson::ConvertToInt64($json.friends[0].age);\n$get_first_friend = Yson::SerializeJson($json.friends[0]);\n\nSELECT\n    $has_name, -- True\n    $get_age, -- 35\n    $get_first_friend; -- {\"name\": \"James Holden\", \"age\": 35}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"41\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-41\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-41\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-41.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"see-also\"&gt;&lt;a href=\"en/yql/recipes/accessing-json.html#see-also\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;See also&lt;/span&gt;&lt;/a&gt;See also&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/yql/recipes/modifying-json.html\"&gt;Modifying JSON with YQL&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/recipes/accessing-json.md","sourcePath":"en/yql/recipes/accessing-json.md"},"headings":[{"title":"JSON functions","href":"en/yql/recipes/accessing-json.html#json-functions","level":2},{"title":"Yson UDF","href":"en/yql/recipes/accessing-json.html#yson-udf","level":2,"items":[{"title":"Converting the whole JSON into YQL containers","href":"en/yql/recipes/accessing-json.html#converting-the-whole-json-into-yql-containers","level":3},{"title":"Working with in-memory representation","href":"en/yql/recipes/accessing-json.html#working-with-in-memory-representation","level":3}]},{"title":"See also","href":"en/yql/recipes/accessing-json.html#see-also","level":2}],"title":"Accessing values inside JSON with YQL"},"router":{"pathname":"en/yql/recipes/accessing-json","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
