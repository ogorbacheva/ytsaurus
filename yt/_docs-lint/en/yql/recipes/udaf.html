        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"introduction\"&gt;&lt;a href=\"en/yql/recipes/udaf.html#introduction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Introduction&lt;/span&gt;&lt;/a&gt;Introduction&lt;/h2&gt;\n&lt;p&gt;If the &lt;a href=\"en/yql/builtins/aggregation.html\"&gt;built-in aggregate functions&lt;/a&gt; do not meet your needs for whatever reason, you can define your own function in YQL. This mechanism is referred to as &lt;code&gt;UDAF&lt;/code&gt; (User Defined Aggregation Functions) and works the same as standard aggregate functions.&lt;/p&gt;\n&lt;p&gt;Here are the peculiarities/benefits of this approach compared to Map/Reduce (&lt;a href=\"en/yql/syntax/process.html\"&gt;PROCESS&lt;/a&gt; + &lt;a href=\"en/yql/syntax/reduce.html\"&gt;REDUCE&lt;/a&gt; or working with YTsaurus directly without YQL):&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;You can easily apply the same logic to several fields or expressions within a single computing run (that is, we calculate different non-related aggregates, reading the data only once). Moreover, you can automatically skip Null values.&lt;/li&gt;\n&lt;li&gt;Support for &lt;code&gt;DISTINCT&lt;/code&gt;, that is, calling a function only by unique values.&lt;/li&gt;\n&lt;li&gt;Automatic creation of a map-side combiner. Often this allows you to substantially save on the query execution time without having to implement a map-side combiner yourself.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;If you have built or want to build an aggregate function which, in your opinion, could be useful to many users, write to us  in the &lt;a href=\"https://t.me/ytsaurus\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Telegram chat&lt;/a&gt;. We'll consider adding it to standard functions.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"how-it-works\"&gt;&lt;a href=\"en/yql/recipes/udaf.html#how-it-works\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How it works&lt;/span&gt;&lt;/a&gt;How it works&lt;/h2&gt;\n&lt;p&gt;UDAFs operate with the following abstractions:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Item&lt;/code&gt;: Aggregated value.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;State&lt;/code&gt;: Aggregation state.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Result&lt;/code&gt;: Aggregation result.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Serialized&lt;/code&gt; &lt;span class=\"gray;\"&gt;(optional)&lt;/span&gt;: A serialized representation of State.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Parent&lt;/code&gt; &lt;span class=\"gray;\"&gt;(optional)&lt;/span&gt;: A node that should be used as a parent node if the handler is written in lambda. This is needed when the state includes mutable resources.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;In each specific case, there should be an arbitrary &lt;a href=\"en/yql/types/primitive.html\"&gt;data type&lt;/a&gt; behind each of these abstractions.&lt;br /&gt;\nHowever, the type corresponding to each abstraction should be the same for different functions. If one function uses &lt;code&gt;String&lt;/code&gt; as &lt;code&gt;Item&lt;/code&gt; and another function uses &lt;code&gt;Int64&lt;/code&gt; as Item, you will get a type mismatch error.&lt;/p&gt;\n&lt;p&gt;UDAF calling procedure in high-level terms:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;To perform each aggregation step, the user provides from three to seven simple functions (Callable values, to be precise) that operate with the above abstractions. The main methods to get them is by using &lt;a href=\"en/yql/syntax/expressions.html#lambda\"&gt;lambda&lt;/a&gt; or &lt;a href=\"en/yql/udf/python.html\"&gt;Python UDF&lt;/a&gt;. Main options:&lt;/li&gt;\n&lt;/ol&gt;\n&lt;ul&gt;\n&lt;li&gt;3: Minimal.&lt;/li&gt;\n&lt;li&gt;4: If State isn't a result.&lt;/li&gt;\n&lt;li&gt;6: If State is non-serializable.&lt;/li&gt;\n&lt;li&gt;7: If you need to override the default &lt;code&gt;NULL&lt;/code&gt; value.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;ol start=\"2\" style=\"--hier-list-start:1\"&gt;\n&lt;li&gt;The user calls a special aggregate &lt;code&gt;UDAF&lt;/code&gt; function. To this function, as the first argument, the user passes a column or an aggregated expression. Other arguments include callable values. The order of callable values is described in the table below.&lt;/li&gt;\n&lt;li&gt;Benefits.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;List of callable values. Required values are highlighted in bold.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;No.&lt;/th&gt;\n&lt;th&gt;Name&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;th&gt;Signature&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Create&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Initializing State by the first non-Null Item.&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;(Item)-&amp;gt;State&lt;/code&gt;. Input arguments for lambda (Item, Parent)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Add&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Adding the next Item to State.&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;(State,Item)-&amp;gt;State&lt;/code&gt;. Input arguments for lambda (State, Item, Parent)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Merge&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Merging of two States.&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;(State,State)-&amp;gt;State&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;4&lt;/td&gt;\n&lt;td&gt;Get Result&lt;/td&gt;\n&lt;td&gt;Getting the aggregation result from the final State.&lt;br /&gt;If omitted, the final State is used as a result.&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;(State)-&amp;gt;Result&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;5&lt;/td&gt;\n&lt;td&gt;Serialize&lt;/td&gt;\n&lt;td&gt;Serialization of State, if it isn't serializable by itself.&lt;br /&gt;Any combination of basic types and containers is serializable. That's why this case applies only when you use a Resource as a State.&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;(State)-&amp;gt;Serialized&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;6&lt;/td&gt;\n&lt;td&gt;Deserialize&lt;/td&gt;\n&lt;td&gt;Recovering a State after serialization.&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;(Serialized)-&amp;gt;State&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;7&lt;/td&gt;\n&lt;td&gt;Default Value&lt;/td&gt;\n&lt;td&gt;The result in the situation when the aggregate function hasn't been called (zero rows were input) The default value is &lt;code&gt;NULL&lt;/code&gt;.&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;()-&amp;gt;Result&lt;/code&gt; or &lt;code&gt;(TypeOf(Result))-&amp;gt;Result&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;They are passed one-by-one as individual arguments after the aggregated value. The aggregate &lt;code&gt;UDAF&lt;/code&gt; function can have between 4 and 8 arguments.&lt;/p&gt;\n&lt;p&gt;If several values in the query are aggregated in the same manner using &lt;code&gt;UDAF&lt;/code&gt;, then, to avoid enumerating the callable values every time, use the &lt;a href=\"en/yql/builtins/basic.html#aggregationfactory\"&gt;aggregate function factory&lt;/a&gt;. In this case, \"UDAF\" is passed instead of a data column, and the call is executed using &lt;a href=\"en/yql/builtins/aggregation.html#aggregateby\"&gt;AGGREGATE_BY&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"examples\"&gt;&lt;a href=\"en/yql/recipes/udaf.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;-- Emulate the aggregate COUNT function\n$create = ($item, $parent) -&amp;gt; { return 1ul };\n$add = ($state, $item, $parent) -&amp;gt; { return 1ul + $state };\n$merge = ($state1, $state2) -&amp;gt; { return $state1 + $state2 };\n$get_result = ($state) -&amp;gt; { return $state };\n$serialize = ($state) -&amp;gt; { return $state };\n$deserialize = ($state) -&amp;gt; { return $state };\n$default = 0ul;\n\n$udaf_factory = AggregationFactory(\n    \"UDAF\",\n    $create,\n    $add,\n    $merge,\n    $get_result,\n    $serialize,\n    $deserialize,\n    $default\n);\n\nSELECT\n    AGGREGATE_BY(value1, $udaf_factory) AS cnt1,\n    AGGREGATE_BY(value2, $udaf_factory) AS cnt2 -- Count non-NULL values\n                                                -- in the value1 and value2 columns.\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"246\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-246\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-246\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-246.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/recipes/udaf.md","sourcePath":"en/yql/recipes/udaf.md"},"headings":[{"title":"Introduction","href":"en/yql/recipes/udaf.html#introduction","level":2},{"title":"How it works","href":"en/yql/recipes/udaf.html#how-it-works","level":2,"items":[{"title":"Examples","href":"en/yql/recipes/udaf.html#examples","level":3}]}],"title":"Custom aggregate functions in YQL"},"router":{"pathname":"en/yql/recipes/udaf","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
