            {"data":{"leading":false,"html":"&lt;p&gt;In memory, YQL works with immutable values. When a query needs to change something inside a JSON value, think of it as constructing a new value from parts of the old one.&lt;/p&gt;\n&lt;p&gt;This sample query takes an input JSON named &lt;code&gt;$fields&lt;/code&gt;, parses it, substitutes the &lt;code&gt;a&lt;/code&gt; key with 0, deletes the &lt;code&gt;d&lt;/code&gt; key, and adds the &lt;code&gt;c&lt;/code&gt; key with value 3:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$fields = '{\"a\": 1, \"b\": 2, \"d\": 4}'j;\n$pairs = DictItems(Yson::ConvertToInt64Dict($fields));\n$result_pairs = ListExtend(ListNotNull(ListMap($pairs, ($item) -&amp;gt; {\n    $item = if ($item.0 == \"a\", (\"a\", 0), $item);\n    return if ($item.0 == \"d\", null, $item);\n})), [(\"c\", 3)]);\n$result_dict = ToDict($result_pairs);\nSELECT Yson::SerializeJson(Yson::From($result_dict));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"see-also\"&gt;&lt;a href=\"en/yql/recipes/modifying-json.html#see-also\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;See also&lt;/span&gt;&lt;/a&gt;See also&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/yql/udf/list/yson.html\"&gt;Yson&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/list.html\"&gt;Functions for lists&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/dict.html\"&gt;Functions for working with dicts&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/recipes/accessing-json.html\"&gt;Accessing values inside JSON with YQL&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/recipes/modifying-json.md","sourcePath":"en/yql/recipes/modifying-json.md"},"headings":[{"title":"See also","href":"en/yql/recipes/modifying-json.html#see-also","level":2}],"title":"Modifying JSON with YQL"},"router":{"pathname":"en/yql/recipes/modifying-json","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
