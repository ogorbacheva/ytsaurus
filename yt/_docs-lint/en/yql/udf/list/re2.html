        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"list-of-functions\"&gt;&lt;a href=\"en/yql/udf/list/re2.html#list-of-functions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List of functions&lt;/span&gt;&lt;/a&gt;List of functions&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Re2::Grep(pattern:String, options:Struct&amp;lt;...&amp;gt;?) -&amp;gt; (string:String?) -&amp;gt; Bool\nRe2::Match(pattern:String, options:Struct&amp;lt;...&amp;gt;?) -&amp;gt; (string:String?) -&amp;gt; Bool\nRe2::Capture(pattern:String, options:Struct&amp;lt;...&amp;gt;?) -&amp;gt; (string:String?) -&amp;gt; Struct&amp;lt;_1:String?,foo:String?,...&amp;gt;\nRe2::FindAndConsume(pattern:String, options:Struct&amp;lt;...&amp;gt;?) -&amp;gt; (string:String?) -&amp;gt; List&amp;lt;String&amp;gt;\nRe2::Replace(pattern:String, options:Struct&amp;lt;...&amp;gt;?) -&amp;gt; (string:String?, replacement:String) -&amp;gt; String?\nRe2::Count(pattern:String, options:Struct&amp;lt;...&amp;gt;?) -&amp;gt; (string:String?) -&amp;gt; Uint32\nRe2::Options([CaseSensitive:Bool?,DotNl:Bool?,Literal:Bool?,LogErrors:Bool?,LongestMatch:Bool?,MaxMem:Uint64?,NeverCapture:Bool?,NeverNl:Bool?,OneLine:Bool?,PerlClasses:Bool?,PosixSyntax:Bool?,Utf8:Bool?,WordBoundary:Bool?]) -&amp;gt; Struct&amp;lt;CaseSensitive:Bool,DotNl:Bool,Literal:Bool,LogErrors:Bool,LongestMatch:Bool,MaxMem:Uint64,NeverCapture:Bool,NeverNl:Bool,OneLine:Bool,PerlClasses:Bool,PosixSyntax:Bool,Utf8:Bool,WordBoundary:Bool&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The Re2 module supports regular expressions based on &lt;a href=\"https://github.com/google/re2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;google::RE2&lt;/a&gt; with a wide range of features provided (&lt;a href=\"https://github.com/google/re2/wiki/Syntax\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;see the official documentation&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;By default, the UTF-8 mode is enabled automatically if the regular expression is a valid UTF-8-encoded string, but is not a valid ASCII string. You can manually control the settings of the re2 library, if you pass the result of the &lt;code&gt;Re2::Options&lt;/code&gt; function as the second argument to other module functions, next to the regular expression.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;All regular expressions passed to functions must be valid. Otherwise, your query may fail. Starting from version &lt;a href=\"en/yql/changelog/2025.03.html#re2-module\"&gt;2025.03&lt;/a&gt;, such a query will definitely fail.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Make sure to double all the backslashes in your regular expressions (if they are within a quoted string): standard string literals are treated as C-escaped strings in SQL. You can also format regular expressions as raw strings &lt;code&gt;@@regexp@@&lt;/code&gt;: double slashes are not needed in this case.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"examples\"&gt;&lt;a href=\"en/yql/udf/list/re2.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$value = \"xaaxaaxaa\";\n$options = Re2::Options(false AS CaseSensitive);\n$match = Re2::Match(\"[ax]+\\\\d\");\n$grep = Re2::Grep(\"a.*\");\n$capture = Re2::Capture(\".*(?P&amp;lt;foo&amp;gt;xa?)(a{2,}).*\");\n$replace = Re2::Replace(\"x(a+)x\");\n$count = Re2::Count(\"a\", $options);\n\nSELECT\n  $match($value) AS match,                -- false\n  $grep($value) AS grep,                  -- true\n  $capture($value) AS capture,            -- (_0: 'xaaxaaxaa', _1: 'aa', foo: 'x')\n  $capture($value)._1 AS capture_member,  -- \"aa\"\n  $replace($value, \"b\\\\1z\") AS replace,   -- \"baazaaxaa\"\n  $count($value) AS count;                -- 6\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"33\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-33\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-33\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-33.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"match\"&gt;&lt;a href=\"en/yql/udf/list/re2.html#match\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Re2::Grep / Re2::Match&lt;/span&gt;&lt;/a&gt;Re2::Grep / Re2::Match&lt;/h2&gt;\n&lt;p&gt;If you leave out the details of implementation and syntax of regular expressions, those functions are totally similar &lt;a href=\"en/yql/udf/list/pire.html#match\"&gt;to the same-name functions&lt;/a&gt; from the Pire module. With other things equal and no specific preferences, we recommend that you use &lt;code&gt;Pire::Grep or Pire::Match&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;You can call the &lt;code&gt;Re2::Grep&lt;/code&gt; function by using a &lt;code&gt;REGEXP&lt;/code&gt; expression (see the &lt;a href=\"en/yql/syntax/expressions.html#regexp\"&gt;basic expression syntax&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;For example, the following two queries are equivalent (also in terms of computing efficiency):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;$grep = Re2::Grep(\"b+\"); SELECT $grep(\"aaabccc\");&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;SELECT \"aaabccc\" REGEXP \"b+\";&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"capture\"&gt;&lt;a href=\"en/yql/udf/list/re2.html#capture\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Re2::Capture&lt;/span&gt;&lt;/a&gt;Re2::Capture&lt;/h2&gt;\n&lt;p&gt;Unlike &lt;a href=\"en/yql/udf/list/pire.html#capture\"&gt;Pire::Capture&lt;/a&gt;, &lt;code&gt;Re2::Capture&lt;/code&gt; supports multiple and named capturing groups.&lt;br /&gt;\nResult type: a structure with the fields of the type &lt;code&gt;String?&lt;/code&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Each field corresponds to a capturing group with the applicable name.&lt;/li&gt;\n&lt;li&gt;For unnamed groups, the following names are generated: &lt;code&gt;_1&lt;/code&gt;, &lt;code&gt;_2&lt;/code&gt;, etc.&lt;/li&gt;\n&lt;li&gt;The result always includes the &lt;code&gt;_0&lt;/code&gt; field containing the entire substring matching the regular expression.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;For more information about working with structures in YQL, see the &lt;a href=\"en/yql/types/containers.html\"&gt;section on containers&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"findandconsume\"&gt;&lt;a href=\"en/yql/udf/list/re2.html#findandconsume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Re2::FindAndConsume&lt;/span&gt;&lt;/a&gt;Re2::FindAndConsume&lt;/h2&gt;\n&lt;p&gt;Searches for all occurrences of the regular expression in the passed text and returns a list of values corresponding to the parenthesized part of the regular expression for each occurrence.&lt;/p&gt;\n&lt;h2 id=\"replace\"&gt;&lt;a href=\"en/yql/udf/list/re2.html#replace\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Re2::Replace&lt;/span&gt;&lt;/a&gt;Re2::Replace&lt;/h2&gt;\n&lt;p&gt;Works as follows:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;In the input string (first argument), all the non-overlapping substrings matching the regular expression are replaced by the specified string (second argument).&lt;/li&gt;\n&lt;li&gt;In the replacement string, you can use the contents of capturing groups from the regular expression using back-references in the format: &lt;code&gt;\\\\1&lt;/code&gt;, &lt;code&gt;\\\\2&lt;/code&gt; etc. The &lt;code&gt;\\\\0&lt;/code&gt; back-reference stands for the whole substring that matches the regular expression.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"count\"&gt;&lt;a href=\"en/yql/udf/list/re2.html#count\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Re2::Count&lt;/span&gt;&lt;/a&gt;Re2::Count&lt;/h2&gt;\n&lt;p&gt;Returns the number of non-overlapping substrings of the input string that have matched the regular expression.&lt;/p&gt;\n&lt;h2 id=\"options\"&gt;&lt;a href=\"en/yql/udf/list/re2.html#options\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Re2::Options&lt;/span&gt;&lt;/a&gt;Re2::Options&lt;/h2&gt;\n&lt;p&gt;Notes on Re2::Options from the official &lt;a href=\"https://github.com/google/re2/blob/main/re2/re2.h#L595-L617\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;repository&lt;/a&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Parameter&lt;/th&gt;\n&lt;th&gt;Default&lt;/th&gt;\n&lt;th&gt;Comments&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;CaseSensitive:Bool?&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;td&gt;match is case-sensitive (regexp can override with (?i) unless in posix_syntax mode)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;DotNl:Bool?&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;let &lt;code&gt;.&lt;/code&gt; match &lt;code&gt;\\n&lt;/code&gt; (default )&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Literal:Bool?&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;interpret string as literal, not regexp&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;LogErrors:Bool?&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;td&gt;this option is ignored&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;LongestMatch:Bool?&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;search for longest match, not first match&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;MaxMem:Uint64?&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;(see below) approx. max memory footprint of RE2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;NeverCapture:Bool?&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;parse all parents as non-capturing&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;NeverNl:Bool?&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;never match \\n, even if it is in regexp&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;PosixSyntax:Bool?&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;restrict regexps to POSIX egrep syntax&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Utf8:Bool?&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;td&gt;text and pattern are UTF-8; otherwise Latin-1&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;The following options are only consulted when PosixSyntax == true. When PosixSyntax == false, these features are always enabled and cannot be turned off; to perform multi-line matching in that case, begin the regexp with (?m).&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;PerlClasses:Bool?&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;allow Perl's \\d \\s \\w \\D \\S \\W&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;WordBoundary:Bool?&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;allow Perl's \\b \\B (word boundary and not)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;OneLine:Bool?&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;^ and $ only match beginning and end of text&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;It is not recommended to use Re2::Options in the code. Most parameters can be replaced with regular expression flags.&lt;/p&gt;\n&lt;h3 id=\"flag-usage-examples\"&gt;&lt;a href=\"en/yql/udf/list/re2.html#flag-usage-examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Flag usage examples&lt;/span&gt;&lt;/a&gt;Flag usage examples&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$value = \"Foo bar FOO\"u;\n-- enable case-insensitive mode\n$capture = Re2::Capture(@@(?i)(foo)@@);\n\nSELECT\n    $capture($value) AS capture; -- (\"_0\": \"Foo\", \"_1\": \"Foo\")\n\n$capture = Re2::Capture(@@(?i)(?P&amp;lt;foo&amp;gt;FOO).*(?P&amp;lt;bar&amp;gt;bar)@@);\n\nSELECT\n    $capture($value) AS capture; -- (\"_0\": \"Foo bar\", \"bar\": \"bar\", \"foo\": \"Foo\")\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"297\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-297\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-297\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-297.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;In both cases, the word FOO will be found. Using the raw string @@regexp@@ lets you avoid double slashes.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"style":["_bundle/latex-extension.css"],"script":["_bundle/latex-extension.js"],"vcsPath":"en/yql/udf/list/re2.md","sourcePath":"en/yql/udf/list/re2.md"},"headings":[{"title":"List of functions","href":"en/yql/udf/list/re2.html#list-of-functions","level":2},{"title":"Examples","href":"en/yql/udf/list/re2.html#examples","level":2},{"title":"Re2::Grep / Re2::Match","href":"en/yql/udf/list/re2.html#match","level":2},{"title":"Re2::Capture","href":"en/yql/udf/list/re2.html#capture","level":2},{"title":"Re2::FindAndConsume","href":"en/yql/udf/list/re2.html#findandconsume","level":2},{"title":"Re2::Replace","href":"en/yql/udf/list/re2.html#replace","level":2},{"title":"Re2::Count","href":"en/yql/udf/list/re2.html#count","level":2},{"title":"Re2::Options","href":"en/yql/udf/list/re2.html#options","level":2,"items":[{"title":"Flag usage examples","href":"en/yql/udf/list/re2.html#flag-usage-examples","level":3}]}],"title":"Re2"},"router":{"pathname":"en/yql/udf/list/re2","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
