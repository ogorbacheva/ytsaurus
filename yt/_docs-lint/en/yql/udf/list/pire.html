        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"list-of-functions\"&gt;&lt;a href=\"en/yql/udf/list/pire.html#list-of-functions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List of functions&lt;/span&gt;&lt;/a&gt;List of functions&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Pire::Grep(pattern:String) -&amp;gt; (string:String?) -&amp;gt; Bool&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Pire::Match(pattern:String) -&amp;gt; (string:String?) -&amp;gt; Bool&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Pire::MultiGrep(pattern:String) -&amp;gt; (string:String?) -&amp;gt; Tuple&amp;lt;Bool, Bool, ...&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Pire::MultiMatch(pattern:String) -&amp;gt; (string:String?) -&amp;gt; Tuple&amp;lt;Bool, Bool, ...&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Pire::Capture(pattern:String) -&amp;gt; (string:String?) -&amp;gt; String?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Pire::Replace(pattern:String) -&amp;gt; (string:String?, replacement:String) -&amp;gt; String?&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;One of the options to match regular expressions in YQL is to use &lt;a href=\"https://github.com/yandex/pire\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Pire&lt;/a&gt; (Perl Incompatible Regular Expressions). This is a very fast regular expression library developed by Yandex. At the lower level, it parses the input string once without backtracking and uses 5 instructions per character (both for x86 and x86_64).&lt;/p&gt;\n&lt;p&gt;The speed is achieved by using the reasonable restrictions:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Pire is primarily focused at checking whether a string matches a regular expression.&lt;/li&gt;\n&lt;li&gt;The matching substring can also be returned (by Capture), but with restrictions (a match with only one group is returned).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;By default, all functions work in the single-byte mode. However, if the regular expression is a valid UTF-8 string but is not a valid ASCII string, the UTF-8 mode is enabled automatically.&lt;/p&gt;\n&lt;p&gt;To enable Unicode mode, you can include one non-ASCII character in the regular expression using the &lt;code&gt;?&lt;/code&gt; operator, e.g. &lt;code&gt;\\\\w+я?&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"call-syntax\"&gt;&lt;a href=\"en/yql/udf/list/pire.html#call-syntax\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Call syntax&lt;/span&gt;&lt;/a&gt;Call syntax&lt;/h2&gt;\n&lt;p&gt;To avoid compiling a regular expression at each table row, wrap the function call by a &lt;a href=\"en/yql/syntax/expressions.html#named-nodes\"&gt;named expression&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$re = Pire::Grep(\"\\\\d+\"); -- create a callable value to test the specific regular expression\nSELECT * FROM table WHERE $re(key); -- use the value to filter a table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"65\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-65\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-65\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-65.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Alert&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;When escaping special characters in a regular expression, be sure to use the second slash, since all the standard string literals in SQL can accept C-escaped strings, and the &lt;code&gt;\\d&lt;/code&gt; sequence is not a valid sequence (even if it were, it wouldn't search for numbers as intended).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;You can enable the case-insensitive mode by specifying, at the beginning of the regular expression, the flag &lt;code&gt;(?i)&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"examples\"&gt;&lt;a href=\"en/yql/udf/list/pire.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$value = \"xaaxaaxaa\";\n$match = Pire::Match(\"a.*\");\n$grep = Pire::Grep(\"axa\");\n$insensitive_grep = Pire::Grep(\"(?i)axa\");\n$multi_match = Pire::MultiMatch(@@a.*\n.*a.*\n.*a\n.*axa.*@@);\n$capture = Pire::Capture(\".*x(a).*\");\n$capture_many = Pire::Capture(\".*x(a+).*\");\n$replace = Pire::Replace(\".*x(a).*\");\n\nSELECT\n  $match($value) AS match,                        -- false\n  $grep($value) AS grep,                          -- true\n  $insensitive_grep($value) AS insensitive_grep,  -- true\n  $multi_match($value) AS multi_match,            -- (false, true, true, true)\n  $multi_match($value).0 AS some_multi_match,     -- false\n  $capture($value) AS capture,                    -- \"a\"\n  $capture_many($value) AS capture_many,          -- \"aa\"\n  $replace($value, \"b\") AS replace;               -- \"xaaxaaxba\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"82\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-82\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-82\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-82.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"grep\"&gt;&lt;a href=\"en/yql/udf/list/pire.html#grep\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Grep&lt;/span&gt;&lt;/a&gt;Grep&lt;/h2&gt;\n&lt;p&gt;Matches the regular expression with a &lt;strong&gt;part of the string&lt;/strong&gt; (arbitrary substring).&lt;/p&gt;\n&lt;h2 id=\"match\"&gt;&lt;a href=\"en/yql/udf/list/pire.html#match\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Match&lt;/span&gt;&lt;/a&gt;Match&lt;/h2&gt;\n&lt;p&gt;Matches the &lt;strong&gt;whole string&lt;/strong&gt; against the regular expression.&lt;/p&gt;\n&lt;p&gt;To get a result similar to &lt;code&gt;Grep&lt;/code&gt; (where substring matching is included), enclose the regular expression in &lt;code&gt;.*&lt;/code&gt;. For example, use &lt;code&gt;.*foo.*&lt;/code&gt; instead of &lt;code&gt;foo&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"multigrep\"&gt;&lt;a href=\"en/yql/udf/list/pire.html#multigrep\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MultiGrep / MultiMatch&lt;/span&gt;&lt;/a&gt;MultiGrep / MultiMatch&lt;/h2&gt;\n&lt;p&gt;Pire lets you match against multiple regular expressions in a single pass through the text and get a separate response for each match.&lt;/p&gt;\n&lt;p&gt;Use the MultiGrep/MultiMatch functions to optimize the query execution speed. Be sure to do it carefully, since the size of the state machine used for matching grows exponentially with the number of regular expressions:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;If you want to match a string against any of the listed expressions (the results are joined with \"or\"), it would be much more efficient to combine the query parts in a single regular expression with &lt;code&gt;|&lt;/code&gt; and match it using regular Grep or Match.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Pire has a limit on the size of the state machine (YQL uses the default value set in the library). If you exceed the limit, the error is raised at the start of the query: &lt;code&gt;Failed to glue up regexes, probably the finite state machine appeared to be too large&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;When you call MultiGrep/MultiMatch, regular expressions are passed one per line using &lt;a href=\"en/yql/syntax/lexer.html#multiline-string-literals\"&gt;multiline string literals&lt;/a&gt;:&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"examples1\"&gt;&lt;a href=\"en/yql/udf/list/pire.html#examples1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$multi_match = Pire::MultiMatch(@@a.*\n.*x.*\n.*axa.*@@);\n\nSELECT\n    $multi_match(\"a\") AS a,      -- (true, false, false)\n    $multi_match(\"axa\") AS axa;  -- (true, true, true)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"125\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-125\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-125\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-125.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"capture\"&gt;&lt;a href=\"en/yql/udf/list/pire.html#capture\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Capture&lt;/span&gt;&lt;/a&gt;Capture&lt;/h2&gt;\n&lt;p&gt;If a string matches the specified regular expression, it returns a substring that matches the group enclosed in parentheses in the regular expression.&lt;br /&gt;\nCapture is non-greedy: the shortest possible substring is returned.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Alert&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The expression must contain only &lt;strong&gt;one&lt;/strong&gt; group in parentheses. &lt;code&gt;NULL&lt;/code&gt; (empty Optional) is returned in case of no match.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;If the restrictions and characteristics described above are unacceptable, you should consider using &lt;a href=\"en/yql/udf/list/re2.html#capture\"&gt;Re2::Capture&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"replace\"&gt;&lt;a href=\"en/yql/udf/list/pire.html#replace\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Replace&lt;/span&gt;&lt;/a&gt;Replace&lt;/h2&gt;\n&lt;p&gt;Pire doesn't support replace based on a regular expression. &lt;code&gt;Pire::Replace&lt;/code&gt; implemented in YQL is a simplified emulation using &lt;code&gt;Capture&lt;/code&gt;. It may run correctly, if the substring occurs more than once in the source string.&lt;/p&gt;\n&lt;p&gt;As a rule, it's better to use &lt;a href=\"en/yql/udf/list/re2.html#replace\"&gt;Re2::Replace&lt;/a&gt; instead.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/udf/list/pire.md","sourcePath":"en/yql/udf/list/pire.md"},"headings":[{"title":"List of functions","href":"en/yql/udf/list/pire.html#list-of-functions","level":2},{"title":"Call syntax","href":"en/yql/udf/list/pire.html#call-syntax","level":2,"items":[{"title":"Examples","href":"en/yql/udf/list/pire.html#examples","level":3}]},{"title":"Grep","href":"en/yql/udf/list/pire.html#grep","level":2},{"title":"Match","href":"en/yql/udf/list/pire.html#match","level":2},{"title":"MultiGrep / MultiMatch","href":"en/yql/udf/list/pire.html#multigrep","level":2,"items":[{"title":"Examples","href":"en/yql/udf/list/pire.html#examples1","level":3}]},{"title":"Capture","href":"en/yql/udf/list/pire.html#capture","level":2},{"title":"Replace","href":"en/yql/udf/list/pire.html#replace","level":2}],"title":"Pire"},"router":{"pathname":"en/yql/udf/list/pire","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
