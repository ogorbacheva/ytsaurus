ex=\"true\"&gt;List of functions&lt;/span&gt;&lt;/a&gt;List of functions&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Math::Atan2(Double{Flags:AutoMap}, Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Fmod(Double{Flags:AutoMap}, Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Hypot(Double{Flags:AutoMap}, Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Pow(Double{Flags:AutoMap}, Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Remainder(Double{Flags:AutoMap}, Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"examples3\"&gt;&lt;a href=\"en/yql/udf/list/math.html#examples3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Math::Atan2(1, 0);       -- 1.570796327\nSELECT Math::Remainder(2.1, 2); -- 0.1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"250\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-250\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-250\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-250.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"doubleint32-double\"&gt;&lt;a href=\"en/yql/udf/list/math.html#doubleint32-double\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;(Double, Int32) -&amp;gt; Double&lt;/span&gt;&lt;/a&gt;(Double, Int32) -&amp;gt; Double&lt;/h2&gt;\n&lt;h4 id=\"list-of-functions4\"&gt;&lt;a href=\"en/yql/udf/list/math.html#list-of-functions4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List of functions&lt;/span&gt;&lt;/a&gt;List of functions&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Math::Ldexp(Double{Flags:AutoMap}, Int32{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Round(Double{Flags:AutoMap}, [Int32?]) -&amp;gt; Double&lt;/code&gt; — the second argument specifies the power of 10 that the number is rounded to (a negative value for decimal places, and a positive for tens, thousands, millions, etc.). 0 by default&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"examples4\"&gt;&lt;a href=\"en/yql/udf/list/math.html#examples4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Math::Pow(2, 10);        -- 1024\nSELECT Math::Round(1.2345, -2); -- 1.23\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"272\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-272\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-272\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-272.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"doubledouble-bool\"&gt;&lt;a href=\"en/yql/udf/list/math.html#doubledouble-bool\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;(Double, Double, Double?) -&amp;gt; Bool&lt;/span&gt;&lt;/a&gt;(Double, Double, [Double?]) -&amp;gt; Bool&lt;/h2&gt;\n&lt;h4 id=\"list-of-functions5\"&gt;&lt;a href=\"en/yql/udf/list/math.html#list-of-functions5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List of functions&lt;/span&gt;&lt;/a&gt;List of functions&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Math::FuzzyEquals(Double{Flags:AutoMap}, Double{Flags:AutoMap}, [Double?]) -&amp;gt; Bool&lt;/code&gt; — compares two Doubles with a tolerance specified by the third argument. 1.0e-13 by default. The tolerance is measured in relative units based on the argument whose absolute value is less.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Alert&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;If any compared value equals &lt;code&gt;0.0&lt;/code&gt;, the function returns &lt;code&gt;false&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"examples5\"&gt;&lt;a href=\"en/yql/udf/list/math.html#examples5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Math::FuzzyEquals(1.01, 1.0, 0.05); -- true\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"299\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-299\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-299\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-299.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"functions-for-computing-remainders\"&gt;&lt;a href=\"en/yql/udf/list/math.html#functions-for-computing-remainders\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Functions for computing remainders&lt;/span&gt;&lt;/a&gt;Functions for computing remainders&lt;/h2&gt;\n&lt;h4 id=\"list-of-functions6\"&gt;&lt;a href=\"en/yql/udf/list/math.html#list-of-functions6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List of functions&lt;/span&gt;&lt;/a&gt;List of functions&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Math::Mod(Int64{Flags:AutoMap}, Int64) -&amp;gt; Int64?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Rem(Int64{Flags:AutoMap}, Int64) -&amp;gt; Int64?&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;These functions behave similarly to the built-in % operator in the case of non-negative arguments. The differences are noticeable in the case of negative arguments:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Math::Mod preserves the sign of the second argument (the denominator).&lt;/li&gt;\n&lt;li&gt;Math::Rem preserves the sign of the first argument (the numerator).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Functions return null if the divisor is zero.&lt;/p&gt;\n&lt;h4 id=\"examples6\"&gt;&lt;a href=\"en/yql/udf/list/math.html#examples6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Math::Mod(-1, 7);        -- 6\nSELECT Math::Rem(-1, 7);        -- -1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"339\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-339\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-339\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-339.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"functions-for-rounding-to-integer-in-a-given-mode\"&gt;&lt;a href=\"en/yql/udf/list/math.html#functions-for-rounding-to-integer-in-a-given-mode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Functions for rounding to integer in a given mode&lt;/span&gt;&lt;/a&gt;Functions for rounding to integer in a given mode&lt;/h2&gt;\n&lt;h4 id=\"list-of-functions7\"&gt;&lt;a href=\"en/yql/udf/list/math.html#list-of-functions7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List of functions&lt;/span&gt;&lt;/a&gt;List of functions&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Math::RoundDownward() -&amp;gt; Tagged&amp;lt;Uint32, MathRoundingMode&amp;gt;&lt;/code&gt; — Rounding toward negative infinity.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::RoundToNearest() -&amp;gt; Tagged&amp;lt;Uint32, MathRoundingMode&amp;gt;&lt;/code&gt; — Rounding toward the nearest representable value.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::RoundTowardZero() -&amp;gt; Tagged&amp;lt;Uint32, MathRoundingMode&amp;gt;&lt;/code&gt; — Rounding toward zero.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::RoundUpward() -&amp;gt; Tagged&amp;lt;Uint32, MathRoundingMode&amp;gt;&lt;/code&gt; — Rounding toward positive infinity.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::NearbyInt(AutoMap&amp;lt;Double&amp;gt;, Tagged&amp;lt;Uint32, MathRoundingMode&amp;gt;) -&amp;gt; Optional&amp;lt;Int64&amp;gt;&lt;/code&gt; — Rounding to the nearest integer.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The &lt;code&gt;Math::NearbyInt&lt;/code&gt; function rounds the first argument to an integer according to the mode specified by the second argument.&lt;/p&gt;\n&lt;p&gt;If the result is beyond a 64-bit integer, it returns NULL.&lt;/p&gt;\n&lt;h4 id=\"examples7\"&gt;&lt;a href=\"en/yql/udf/list/math.html#examples7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Math::NearbyInt(1.5, Math::RoundDownward()); -- 1\nSELECT Math::NearbyInt(1.5, Math::RoundToNearest()); -- 2\nSELECT Math::NearbyInt(2.5, Math::RoundToNearest()); -- 2\nSELECT Math::NearbyInt(1.5, Math::RoundTowardZero()); -- 1\nSELECT Math::NearbyInt(1.5, Math::RoundUpward()); -- 2\nSELECT Math::NearbyInt(-1.5, Math::RoundDownward()); -- -2\nSELECT Math::NearbyInt(-1.5, Math::RoundToNearest()); -- -2\nSELECT Math::NearbyInt(-2.5, Math::RoundToNearest()); -- -2\nSELECT Math::NearbyInt(-1.5, Math::RoundTowardZero()); -- -1\nSELECT Math::NearbyInt(-1.5, Math::RoundUpward()); -- -1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"382\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-382\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-382\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-382.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/udf/list/math.md","sourcePath":"en/yql/udf/list/math.md"},"headings":[{"title":"Constants","href":"en/yql/udf/list/math.html#constants","level":2},{"title":"(
