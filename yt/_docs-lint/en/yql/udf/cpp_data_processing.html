        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h3 id=\"data-processing-in-udfs\"&gt;&lt;a href=\"en/yql/udf/cpp_data_processing.html#data-processing-in-udfs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data processing in UDFs&lt;/span&gt;&lt;/a&gt;Data processing in UDFs&lt;/h3&gt;\n&lt;p&gt;To properly use composite data types, you need to process and store information about their structure. This is done at the UDF signature generation stage. Example of a class that contains this information&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs cpp\"&gt;&lt;span class=\"hljs-keyword\"&gt;struct&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TInputIndices&lt;/span&gt; {\n        &lt;span class=\"hljs-comment\"&gt;// These two fields will contain indexes of fields in the Struct type. Using these indexes, we will be able to obtain the values of the structure fields of a specific object of that structure.&lt;/span&gt;\n        ui32 oneInputFieldIndex = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n        ui32 anotherInputFieldIndex = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n\n        &lt;span class=\"hljs-type\"&gt;static&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;constexpr&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;int&lt;/span&gt; FieldsCount = &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;;\n\n        NYql::NUdf::TType* ResultStructType = &lt;span class=\"hljs-literal\"&gt;nullptr&lt;/span&gt;;\n\n        NYql::&lt;span class=\"hljs-function\"&gt;NUdf::TType* &lt;span class=\"hljs-title\"&gt;StructType&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;()&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; &lt;/span&gt;{\n            &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; ResultStructType;\n        }\n\n        &lt;span class=\"hljs-built_in\"&gt;TInputIndices&lt;/span&gt;(NYql::NUdf::IFunctionTypeInfoBuilder&amp;amp; builder) {\n            &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; optionalAnotherInputFieldType = builder.&lt;span class=\"hljs-built_in\"&gt;Optional&lt;/span&gt;()-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Item&lt;/span&gt;(TDataType&amp;lt;TDatetime&amp;gt;::Id).&lt;span class=\"hljs-built_in\"&gt;Build&lt;/span&gt;();\n\n            &lt;span class=\"hljs-comment\"&gt;// After calling Build, oneInputFieldIndex and anotherInputFieldIndex will contain the index of the corresponding structure fields.&lt;/span&gt;\n            ResultStructType = builder.&lt;span class=\"hljs-built_in\"&gt;Struct&lt;/span&gt;(FieldsCount)\n                                   -&amp;gt;\n                               &lt;span class=\"hljs-built_in\"&gt;AddField&lt;/span&gt;&amp;lt;&lt;span class=\"hljs-type\"&gt;double&lt;/span&gt;&amp;gt;(&lt;span class=\"hljs-string\"&gt;\"oneInputFieldName\"&lt;/span&gt;, &amp;amp;oneInputFieldIndex)\n                                   .\n                               &lt;span class=\"hljs-built_in\"&gt;AddField&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"anotherInputFieldName\"&lt;/span&gt;, optionalAnotherInputFieldType, &amp;amp;anotherInputFieldIndex)\n                                   .\n                               &lt;span class=\"hljs-built_in\"&gt;Build&lt;/span&gt;();\n        }\n\n        &lt;span class=\"hljs-function\"&gt;TSomeStruct &lt;span class=\"hljs-title\"&gt;UnpackUnboxedValue&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; NYql::NUdf::TUnboxedValue&amp;amp; item)&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; &lt;/span&gt;{\n            TSomeStruct someStruct;\n\n            &lt;span class=\"hljs-comment\"&gt;// We can get the value of a particular field using the index.&lt;/span&gt;\n            &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; oneInputFieldIValue = item.&lt;span class=\"hljs-built_in\"&gt;GetElement&lt;/span&gt;(oneInputFieldIndex);\n            &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; anotherInputFieldIValue = item.&lt;span class=\"hljs-built_in\"&gt;GetElement&lt;/span&gt;(anotherInputFieldIndex);\n\n            ...\n\n            &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; someStruct;\n        }\n    };\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You will need &lt;code&gt;IFunctionTypeInfoBuilder&lt;/code&gt; to generate the input data type.&lt;br /&gt;\nThis interface supports generation of composite types, such as structures, lists, or maps.&lt;br /&gt;\nSuppose that we pass a structure containing two fields (&lt;code&gt;\"oneInputField\"&lt;/code&gt; of the &lt;code&gt;Double&lt;/code&gt; type and &lt;code&gt;\"anotherInputField\"&lt;/code&gt; of the &lt;code&gt;TDatetime?&lt;/code&gt; type) as input. Using &lt;code&gt;IFunctionTypeInfoBuilder&lt;/code&gt;, we create an optional type for the second field and a structure type filled with the required fields.&lt;/p&gt;\n&lt;p&gt;The structure type is declared using the builder by calling the &lt;code&gt;Struct(num_of_fields)&lt;/code&gt; method. Internally, the structure in a YQL UDF is a regular array of field values.&lt;/p&gt;\n&lt;p&gt;You can add fields using the &lt;code&gt;AddField&lt;/code&gt; method of the returned interface for working with structures.&lt;br /&gt;\nAfter executing the Build() method, the &lt;code&gt;oneInputFieldIndex&lt;/code&gt; and &lt;code&gt;anotherInputFieldIndex&lt;/code&gt; variables will contain the indexes by which the data of a particular field will be stored in the input data array. You can use them to retrieve the value of a particular field from the input data array as it was done in the &lt;code&gt;UnpackUnboxedValue&lt;/code&gt; method in the example above.&lt;/p&gt;\n&lt;p&gt;Then you can use this class in the &lt;code&gt;Run&lt;/code&gt; method of the UDF to unpack&lt;br /&gt;\ninput data using the &lt;code&gt;UnpackUnboxedValue&lt;/code&gt; method.&lt;/p&gt;\n&lt;p&gt;To pack the results of your UDF, you can use classes for&lt;br /&gt;\nstoring output data details. For example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs cpp\"&gt;&lt;span class=\"hljs-keyword\"&gt;struct&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TOutputIndices&lt;/span&gt; {\n    ui32 firstOutputFieldIndex = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n    ui32 secondOutputFieldIndex = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n    ui32 thirdOutputFieldIndex = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n\n    &lt;span class=\"hljs-type\"&gt;static&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;constexpr&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;int&lt;/span&gt; FieldsCount = &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;;\n\n    NYql::NUdf::TType* ResultStructType = &lt;span class=\"hljs-literal\"&gt;nullptr&lt;/span&gt;;\n\n    NYql::&lt;span class=\"hljs-function\"&gt;NUdf::TType* &lt;span class=\"hljs-title\"&gt;StructType&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;()&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; &lt;/span&gt;{\n        &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; ResultStructType;\n    }\n\n    &lt;span class=\"hljs-built_in\"&gt;TOutputIndices&lt;/span&gt;(NYql::NUdf::IFunctionTypeInfoBuilder&amp;amp; builder) {\n        &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; thirdOutputFieldType = builder.&lt;span class=\"hljs-built_in\"&gt;List&lt;/span&gt;()-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Item&lt;/span&gt;(TDataType&amp;lt;ui32&amp;gt;::Id).&lt;span class=\"hljs-built_in\"&gt;Build&lt;/span&gt;()\n\n        ResultStructType =\n            builder.&lt;span class=\"hljs-built_in\"&gt;Struct&lt;/span&gt;(FieldsCount)\n                  -&amp;gt;\n            &lt;span class=\"hljs-built_in\"&gt;AddField&lt;/span&gt;&amp;lt;ui32&amp;gt;(&lt;span class=\"hljs-string\"&gt;\"firstOutputFieldName\"&lt;/span&gt;, &amp;amp;firstOutputFieldIndex)\n                  .\n            &lt;span class=\"hljs-built_in\"&gt;AddField&lt;/span&gt;&amp;lt;&lt;span class=\"hljs-type\"&gt;char&lt;/span&gt;*&amp;gt;(&lt;span class=\"hljs-string\"&gt;\"secondOutputFieldName\"&lt;/span&gt;, &amp;amp;secondOutputFieldIndex)\n                  .\n            &lt;span class=\"hljs-built_in\"&gt;AddField&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"thirdOutputFieldName\"&lt;/span&gt;, thirdOutputFieldType, &amp;amp;thirdOutputFieldIndex);\n                  .\n            &lt;span class=\"hljs-built_in\"&gt;Build&lt;/span&gt;();\n    }\n\n    NYql::&lt;span class=\"hljs-function\"&gt;NUdf::TUnboxedValue &lt;span class=\"hljs-title\"&gt;PackUnboxedValue&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; NYql::NUdf::IValueBuilder* valueBuilder, ui32 valueForFirstField, &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TString&amp;amp; valueForSecondField, std::vector&amp;lt;ui32&amp;gt; valuesForThirdField)&lt;/span&gt; &lt;/span&gt;{\n        &lt;span class=\"hljs-comment\"&gt;// Pay attention to what happens here. There are TWO output parameters: result is what you need to return, while elemItems contains a pointer to the array where you need to enter the field values.&lt;/span&gt;\n        TUnboxedValue* elemItems = &lt;span class=\"hljs-literal\"&gt;nullptr&lt;/span&gt;;\n        &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; result = valueBuilder-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;NewArray&lt;/span&gt;(FieldsCount, elemItems);\n\n        &lt;span class=\"hljs-comment\"&gt;// Entering field values&lt;/span&gt;\n        elemItems[firstOutputFieldIndex] = &lt;span class=\"hljs-built_in\"&gt;TUnboxedValuePod&lt;/span&gt;(valueForFirstField);\n        elemItems[secondOutputFieldIndex] = valueBuilder-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;NewString&lt;/span&gt;(valueForSecondField);\n\n        std::vector&amp;lt;TUnboxedValue&amp;gt; thirdFieldItems;\n        thirdFieldItems.&lt;span class=\"hljs-built_in\"&gt;reserve&lt;/span&gt;(valuesForThirdField.&lt;span class=\"hljs-built_in\"&gt;size&lt;/span&gt;());\n\n        &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; (&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; value : valuesForThirdField) {\n            TUnboxedValue yqlValue = &lt;span class=\"hljs-built_in\"&gt;TUnboxedValuePod&lt;/span&gt;(value);\n\n            &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; (yqlValue) {\n                thirdFieldItems.&lt;span class=\"hljs-built_in\"&gt;push_back&lt;/span&gt;(std::&lt;span class=\"hljs-built_in\"&gt;move&lt;/span&gt;(yqlValue));\n            }\n        }\n\n        &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; thirdFieldValueHandler = valueBuilder-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;NewList&lt;/span&gt;(thirdFieldItems.&lt;span class=\"hljs-built_in\"&gt;data&lt;/span&gt;(),\n                                                            thirdFieldItems.&lt;span class=\"hljs-built_in\"&gt;size&lt;/span&gt;());\n\n        elemItems[thirdOutputFieldIndex] = thirdFieldValueHandler;\n\n        &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; result;\n    }\n};\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"22\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-22\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-22\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-22.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Generating the output data structure type is no different from generating the input data structure type: you need to declare the structure fields and save their indexes to then fill the output data array. In the example above, the structure consists of three fields: the first field is a primitive numeric type, the second one is a string, and the third one is a list. To create a list type, use the &lt;code&gt;List()&lt;/code&gt; method of the &lt;code&gt;NYql::NUdf::IFunctionTypeInfoBuilder&lt;/code&gt; interface. This method returns a pointer to the interface that you can use to create a list type. Specify the type of list items using the &lt;code&gt;Item(type)&lt;/code&gt; method. Thus, in addition to lists, you can create maps, structures, tuples, and more.&lt;/p&gt;\n&lt;p&gt;The output data array is generated using &lt;code&gt;NYql::NUdf::IValueBuilder&lt;/code&gt; and its &lt;code&gt;NewArray&lt;/code&gt; method, which accepts a set of output elements and a reference to the pointer. The method returns TUnboxedValue describing the entire object and adds a value to the passed pointer, which in turn helps fill the array.&lt;/p&gt;\n&lt;p&gt;This method returns &lt;code&gt;NYql::NUdf::TUnboxedValue&lt;/code&gt; that should be returned after filling the output array with the necessary values. Keep in mind that, in order to fill the output array, you should use the pointer&lt;br /&gt;\nthat the method fills, not the one it returns. When filling the array with a specific value for a specific field, use the indexes associated with that field at the stage of generating the output data type.&lt;/p&gt;\n&lt;p&gt;If the returned value is a primitive numeric type, you can simply wrap it in &lt;code&gt;TUnboxedValuePod&lt;/code&gt; and place it according to the appropriate index.&lt;/p&gt;\n&lt;p&gt;If the returned value is a string, use the &lt;code&gt;NewString&lt;/code&gt; method of the &lt;code&gt;NYql::NUdf::IValueBuilder&lt;/code&gt; interface where you need to pass the string to.&lt;/p&gt;\n&lt;p&gt;If the returned value is, for example, a list, create a &lt;code&gt;TUnboxedValue&lt;/code&gt; value array, fill it, and then pass its size and pointer to the &lt;code&gt;NewList&lt;/code&gt; method of the &lt;code&gt;NYql::NUdf::IValueBuilder&lt;/code&gt; interface. This method returns &lt;code&gt;TUnboxedValue&lt;/code&gt;, which you can then place in the output array according to the index that corresponds to that field.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/udf/cpp_data_processing.md","sourcePath":"en/yql/udf/cpp_data_processing.md"},"headings":[],"title":""},"router":{"pathname":"en/yql/udf/cpp_data_processing","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
