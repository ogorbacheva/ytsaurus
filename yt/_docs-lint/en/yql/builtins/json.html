        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;JSON&lt;/strong&gt; is a lightweight &lt;a href=\"https://www.json.org\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;data-interchange format&lt;/a&gt;. It's represented by the &lt;code&gt;Json&lt;/code&gt; type in YQL. Unlike relational tables, JSON can store data with no schema defined. Here is an example of a valid JSON object:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Jim Holden\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"age\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;30&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Naomi Nagata\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"age\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"twenty years old\"&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"4\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-4\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-4\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-4.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Despite the fact that the &lt;code&gt;age&lt;/code&gt; field in the first object is of the &lt;code&gt;Number&lt;/code&gt; type (&lt;code&gt;\"age\": 21&lt;/code&gt;) and in the second object its type is &lt;code&gt;String&lt;/code&gt; (&lt;code&gt;\"age\": \"twenty years old\"&lt;/code&gt;), this is a fully valid JSON object.&lt;/p&gt;\n&lt;p&gt;To work with JSON, YQL implements a subset of the &lt;a href=\"https://www.iso.org/standard/67367.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;SQL support for JavaScript Object Notation (JSON)&lt;/a&gt; standard, which is a part of the generally adopted ANSI SQL standard.&lt;/p&gt;\n&lt;h2 id=\"cookbook\"&gt;&lt;a href=\"en/yql/builtins/json.html#cookbook\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cookbook&lt;/span&gt;&lt;/a&gt;Cookbook&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$json = CAST(@@{\n    \"friends\": [\n        {\n            \"name\": \"James Holden\",\n            \"age\": 35\n        },\n        {\n            \"name\": \"Naomi Nagata\",\n            \"age\": 30\n        }\n    ]\n}@@ AS Json);\n\nSELECT\n    JSON_EXISTS($json, \"$.friends[*].name\"), -- True,\n    JSON_VALUE($json, \"$.friends[0].age\"), -- \"35\" (Utf8? type)\n    JSON_QUERY($json, \"$.friends[0]\"); -- {\"name\": \"James Holden\", \"age\": 35}\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"14\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-14\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-14\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-14.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"accessing-a-database-field\"&gt;&lt;a href=\"en/yql/builtins/json.html#accessing-a-database-field\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Accessing a database field&lt;/span&gt;&lt;/a&gt;Accessing a database field&lt;/h3&gt;\n&lt;p&gt;Table data can be stored in JSON or as a string. &lt;code&gt;JSON_*&lt;/code&gt; functions expect JSON as input. For the &lt;code&gt;String-&amp;gt;JSON&lt;/code&gt; conversion, use the &lt;code&gt;CAST&lt;/code&gt; function, for example, &lt;code&gt;CAST (my_string AS JSON)&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"jsonpath\"&gt;&lt;a href=\"en/yql/builtins/json.html#jsonpath\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;JsonPath&lt;/span&gt;&lt;/a&gt;JsonPath&lt;/h2&gt;\n&lt;p&gt;Values inside JSON objects are accessed using a query language called JsonPath. All functions for JSON accept a JsonPath query as an argument.&lt;/p&gt;\n&lt;p&gt;Let's look at an example. Suppose we have a JSON object like:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"comments\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"id\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;123&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"text\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"A whisper will do, if it's all that you can manage.\"&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"id\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;456&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"text\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"My life has become a single, ongoing revelation that I haven’t been cynical enough.\"&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"30\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-30\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-30\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-30.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Then, to get the text of the second comment, we can write the following JsonPath query:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$.comments[1].text\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"34\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-34\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-34\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-34.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;In this query:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;$&lt;/code&gt; is a way to access the entire JSON object.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;$.comments&lt;/code&gt; accesses the &lt;code&gt;comments&lt;/code&gt; key of the JSON object.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;$.comments[1]&lt;/code&gt; accesses the second element of the JSON array (element numbering starts from 0).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;$.comments[1].text&lt;/code&gt; accesses the &lt;code&gt;text&lt;/code&gt; key of the JSON object.&lt;/li&gt;\n&lt;li&gt;Query execution result: &lt;code&gt;\"My life has become a single, ongoing revelation that I haven’t been cynical enough.\"&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"quick-reference\"&gt;&lt;a href=\"en/yql/builtins/json.html#quick-reference\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Quick reference&lt;/span&gt;&lt;/a&gt;Quick reference&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Operation&lt;/th&gt;\n&lt;th&gt;Example&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Retrieving a JSON object key&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$.key&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Retrieving all JSON object keys&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$.*&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Accessing an array element&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$[25]&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Retrieving an array subsegment&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$[2 to 5]&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Accessing the last array element&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$[last]&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Accessing all array elements&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$[*]&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Unary operations&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;- 1&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Binary operations&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;(12 * 3) % 4 + 8&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Accessing a variable&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$variable&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Logical operations&lt;/td&gt;\n&lt;td&gt;`(1 &amp;gt; 2) || (3 &amp;lt;= 4) &amp;amp;&amp;amp; (\"string\" == \"another\")|&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Matching a regular expression&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$.name like_regex \"^[A-Za-z]+$\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Checking the string prefix&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$.name starts with \"Bobbie\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Checking if a path exists&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;exists ($.profile.name)&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Checking a Boolean expression for null&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;($.age &amp;gt; 20) is unknown&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Filtering values&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$.friends ? (@.age &amp;gt;= 18 &amp;amp;&amp;amp; @.gender == \"male\")&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Getting the value type&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$.name.type()&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Getting the array size&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$.friends.size()&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Converting a string to a number&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$.number.double()&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Rounding up a number&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$.number.ceiling()&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Rounding down a number&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$.number.floor()&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Returning the absolute value&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$.number.abs()&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Getting key-value pairs from an object&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;$.profile.keyvalue()&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"data-model\"&gt;&lt;a href=\"en/yql/builtins/json.html#data-model\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data model&lt;/span&gt;&lt;/a&gt;Data model&lt;/h3&gt;\n&lt;p&gt;The result of executing all JsonPath expressions is a sequence of JSON values. For example:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The result of executing the &lt;code&gt;\"Bobbie\"&lt;/code&gt; expression is a sequence with the only element &lt;code&gt;\"Bobbie\"&lt;/code&gt;. Its length is 1.&lt;/li&gt;\n&lt;li&gt;The result of executing the &lt;code&gt;$&lt;/code&gt; expression (that takes the entire JSON object) in JSON &lt;code&gt;[1, 2, 3]&lt;/code&gt; is &lt;code&gt;[1, 2, 3]&lt;/code&gt;. A sequence of 1 element of the array &lt;code&gt;[1, 2, 3]&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;The result of executing the &lt;code&gt;$[*]&lt;/code&gt; expression (retrieving all array elements) in JSON &lt;code&gt;[1, 2, 3]&lt;/code&gt; is &lt;code&gt;1, 2, 3&lt;/code&gt;. A sequence of three items:&lt;code&gt;1&lt;/code&gt;, &lt;code&gt;2&lt;/code&gt;, and &lt;code&gt;3&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If the input sequence consists of multiple values, some operations are performed for each element (for example, accessing a JSON object key). However, other operations require a sequence of one element as input (for example, binary arithmetic operations).&lt;/p&gt;\n&lt;p&gt;The behavior of a specific operation is described in the corresponding section of the documentation.&lt;/p&gt;\n&lt;h3 id=\"execution-mode\"&gt;&lt;a href=\"en/yql/builtins/json.html#execution-mode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Execution mode&lt;/span&gt;&lt;/a&gt;Execution mode&lt;/h3&gt;\n&lt;p&gt;JsonPath supports two execution modes, &lt;code&gt;lax&lt;/code&gt; and &lt;code&gt;strict&lt;/code&gt;. Setting the mode is optional. By default, &lt;code&gt;lax&lt;/code&gt;. The mode is specified at the beginning of a query. For example, &lt;code&gt;strict $.key&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The behavior for each mode is described in the corresponding sections with JsonPath operations.&lt;/p&gt;\n&lt;h4 id=\"auto-unpacking-of-arrays\"&gt;&lt;a href=\"en/yql/builtins/json.html#auto-unpacking-of-arrays\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Auto unpacking of arrays&lt;/span&gt;&lt;/a&gt;Auto unpacking of arrays&lt;/h4&gt;\n&lt;p&gt;When accessing a JSON object key in &lt;code&gt;lax&lt;/code&gt; mode, arrays are automatically unpacked.&lt;/p&gt;\n&lt;h5 id=\"example\"&gt;&lt;a href=\"en/yql/builtins/json.html#example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h5&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"key\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;123&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"key\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;456&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"305\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-305\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-305\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-305.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The &lt;code&gt;lax $.key&lt;/code&gt; query is successful and returns &lt;code&gt;123, 456&lt;/code&gt;. As &lt;code&gt;$&lt;/code&gt; is an array, it's automatically unpacked and accessing the key of the &lt;code&gt;$.key&lt;/code&gt; JSON object is executed for each element in the array.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;strict $.key&lt;/code&gt; query returns an error. The &lt;code&gt;strict&lt;/code&gt; mode doesn't support automatic unpacking of arrays. &lt;code&gt;$&lt;/code&gt; is an array rather than an object. That's why you can't access the object key &lt;code&gt;$.key&lt;/code&gt;. You can fix this by writing &lt;code&gt;strict $[*].key&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Unpacking is only 1 level deep. In the event of nested arrays, only the outermost one is unpacked.&lt;/p&gt;\n&lt;h4 id=\"wrapping-values-in-arrays\"&gt;&lt;a href=\"en/yql/builtins/json.html#wrapping-values-in-arrays\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Wrapping values in arrays&lt;/span&gt;&lt;/a&gt;Wrapping values in arrays&lt;/h4&gt;\n&lt;p&gt;When accessing an array element in &lt;code&gt;lax&lt;/code&gt; mode, JSON values are automatically wrapped in an array.&lt;/p&gt;\n&lt;h5 id=\"example1\"&gt;&lt;a href=\"en/yql/builtins/json.html#example1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h5&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Avasarala\"&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"324\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-324\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-324\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-324.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The &lt;code&gt;lax $[0].name&lt;/code&gt; query is successful and returns &lt;code&gt;\"Avasarala\"&lt;/code&gt;. As &lt;code&gt;$&lt;/code&gt; isn't an array, it's automatically wrapped in an array of length 1. Accessing the first element &lt;code&gt;$[0]&lt;/code&gt; returns the source JSON object where the &lt;code&gt;name&lt;/code&gt; key is taken.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;strict $[0].name&lt;/code&gt; query returns an error. The &lt;code&gt;strict&lt;/code&gt; mode does not support automated wrapping into an array. &lt;code&gt;$&lt;/code&gt; is an object rather than an array. That's why you can't access the item &lt;code&gt;$[0]&lt;/code&gt;. You can fix this by writing &lt;code&gt;strict $.name&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"handling-errors\"&gt;&lt;a href=\"en/yql/builtins/json.html#handling-errors\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Handling errors&lt;/span&gt;&lt;/a&gt;Handling errors&lt;/h4&gt;\n&lt;p&gt;Some errors are converted to an empty result when a query is executed in &lt;code&gt;lax&lt;/code&gt; mode.&lt;/p&gt;\n&lt;h3 id=\"literals\"&gt;&lt;a href=\"en/yql/builtins/json.html#literals\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Literals&lt;/span&gt;&lt;/a&gt;Literals&lt;/h3&gt;\n&lt;p&gt;Values of some types can be specified in a JsonPath query using literals:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Example&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Numbers&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;42&lt;/code&gt;, &lt;code&gt;-1.23e-5&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Boolean values&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;, &lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Null&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Stings&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Belt\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"accessing-json-object-keys\"&gt;&lt;a href=\"en/yql/builtins/json.html#accessing-json-object-keys\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Accessing JSON object keys&lt;/span&gt;&lt;/a&gt;Accessing JSON object keys&lt;/h3&gt;\n&lt;p&gt;JsonPath supports accessing JSON object keys, such as &lt;code&gt;$.session.user.name&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Accessing keys without quotes is only supported for keys that start with an English letter or underscore and only contain English letters, underscores, numbers, and a dollar sign. Use quotes for all other keys. For example, &lt;code&gt;$.profile.\"this string has spaces\"&lt;/code&gt; or &lt;code&gt;$.user.\"42 is the answer\"&lt;/code&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;For each value from the input sequence:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;If the value is an array, it's automatically unpacked in &lt;code&gt;lax&lt;/code&gt; mode.&lt;/li&gt;\n&lt;li&gt;If the value isn't a JSON object or if it is and the specified key is missing from this JSON object, a query executed in &lt;code&gt;strict&lt;/code&gt; mode fails. In &lt;code&gt;lax&lt;/code&gt; mode, an empty result is returned for this value.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;The expression execution result is the concatenation of the results for each value from the input sequence.&lt;/p&gt;\n&lt;h4 id=\"example2\"&gt;&lt;a href=\"en/yql/builtins/json.html#example2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Amos\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"friends\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Jim\"&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Alex\"&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"426\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-426\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-426\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-426.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;lax&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;strict&lt;/code&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;$.name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Amos\"&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Amos\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;$.surname&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Empty result&lt;/td&gt;\n&lt;td&gt;Error&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;$.friends.name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Jim\", \"Alex\"&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Error&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"accessing-all-json-object-keys\"&gt;&lt;a href=\"en/yql/builtins/json.html#accessing-all-json-object-keys\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Accessing all JSON object keys&lt;/span&gt;&lt;/a&gt;Accessing all JSON object keys&lt;/h3&gt;\n&lt;p&gt;JsonPath supports accessing all JSON object keys at once: &lt;code&gt;$.*&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;For each value from the input sequence:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;If the value is an array, it's automatically unpacked in &lt;code&gt;lax&lt;/code&gt; mode.&lt;/li&gt;\n&lt;li&gt;If the value isn't a JSON object, a query executed in &lt;code&gt;strict&lt;/code&gt; mode fails. In &lt;code&gt;lax&lt;/code&gt; mode, an empty result is returned for this value.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;The expression execution result is the concatenation of the results for each value from the input sequence.&lt;/p&gt;\n&lt;h4 id=\"example3\"&gt;&lt;a href=\"en/yql/builtins/json.html#example3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"profile\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"id\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;123&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Amos\"&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"friends\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Jim\"&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Alex\"&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"504\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-504\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-504\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-504.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;lax&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;strict&lt;/code&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;$.profile.*&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;123, \"Amos\"&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;123, \"Amos\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;$.friends.*&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Jim\", \"Alex\"&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Error&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"accessing-an-array-element\"&gt;&lt;a href=\"en/yql/builtins/json.html#accessing-an-array-element\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Accessing an array element&lt;/span&gt;&lt;/a&gt;Accessing an array element&lt;/h3&gt;\n&lt;p&gt;JsonPath supports accessing array elements: &lt;code&gt;$.friends[1, 3 to last - 1]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;For each value from the input sequence:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;If the value isn't an array, a query executed in &lt;code&gt;strict&lt;/code&gt; mode fails. In &lt;code&gt;lax&lt;/code&gt; mode, values are automatically wrapped in an array.&lt;/li&gt;\n&lt;li&gt;The &lt;code&gt;last&lt;/code&gt; keyword is replaced with the array's last index. Using &lt;code&gt;last&lt;/code&gt; outside of accessing the array is an error in both modes.&lt;/li&gt;\n&lt;li&gt;The specified indexes are calculated. Each of them must be a single number, otherwise the query fails in both modes.&lt;/li&gt;\n&lt;li&gt;If the index is a fractional number, it's rounded down.&lt;/li&gt;\n&lt;li&gt;If the index goes beyond the array boundaries, the query executed in &lt;code&gt;strict&lt;/code&gt; mode fails. In &lt;code&gt;lax&lt;/code&gt; mode, this index is ignored.&lt;/li&gt;\n&lt;li&gt;If a segment is specified and its start index is greater than the end index (for example, &lt;code&gt;$[20 to 1]&lt;/code&gt;), the query fails in &lt;code&gt;strict&lt;/code&gt; mode. In &lt;code&gt;lax&lt;/code&gt; mode, this segment is ignored.&lt;/li&gt;\n&lt;li&gt;All elements by the specified indexes are added to the result. Segments include &lt;strong&gt;both ends&lt;/strong&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"examples\"&gt;&lt;a href=\"en/yql/builtins/json.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Camina\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"surname\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Drummer\"&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Josephus\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"surname\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Miller\"&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Bobbie\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"surname\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Draper\"&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Julie\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"surname\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Mao\"&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"593\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-593\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-593\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-593.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;lax&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;strict&lt;/code&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;$[0].name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Camina\"&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Camina\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;$[1, 2 to 3].name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Josephus\", \"Bobbie\", \"Julie\"&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Josephus\", \"Bobbie\", \"Julie\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;$[last - 2].name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Josephus\"&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Josephus\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;$[2, last + 200 to 50].name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Bobbie\"&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Error&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;$[50].name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Empty result&lt;/td&gt;\n&lt;td&gt;Error&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"accessing-all-array-elements\"&gt;&lt;a href=\"en/yql/builtins/json.html#accessing-all-array-elements\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Accessing all array elements&lt;/span&gt;&lt;/a&gt;Accessing all array elements&lt;/h3&gt;\n&lt;p&gt;JsonPath supports accessing all array elements at once: &lt;code&gt;$[*]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;For each value from the input sequence:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;If the value isn't an array, a query executed in &lt;code&gt;strict&lt;/code&gt; mode fails. In &lt;code&gt;lax&lt;/code&gt; mode, values are automatically wrapped in an array.&lt;/li&gt;\n&lt;li&gt;All elements of the current array are added to the result.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"examples1\"&gt;&lt;a href=\"en/yql/builtins/json.html#examples1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"class\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Station\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"title\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Medina\"&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"class\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Corvette\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"title\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Rocinante\"&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"690\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-690\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-690\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-690.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;lax&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;strict&lt;/code&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;$[*].title&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Medina\", \"Rocinante\"&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Medina\", \"Rocinante\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;lax $[0][*].class&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"Station\"&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Error&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Let's analyze the last example step by step:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;$[0]&lt;/code&gt; returns the first element of the array, that is &lt;code&gt;{\"class\": \"Station\", \"title\": \"Medina\"}&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;$[0][*]&lt;/code&gt; expects an array for input, but an object was input instead. It's automatically wrapped in an array as &lt;code&gt;[ {\"class\": \"Station\", \"title\": \"Medina\"} ]&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Now, &lt;code&gt;$[0][*]&lt;/code&gt; can be executed and returns all elements of the array, that is &lt;code&gt;{\"class\": \"Station\", \"title\": \"Medina\"}&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;$[0][*]&lt;/code&gt;.class returns the &lt;code&gt;class&lt;/code&gt; field value: &lt;code&gt;\"Station\"&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"arithmetic-operations\"&gt;&lt;a href=\"en/yql/builtins/json.html#arithmetic-operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Arithmetic operations&lt;/span&gt;&lt;/a&gt;Arithmetic operations&lt;/h3&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;All arithmetic operations work with numbers as with Double. You might &lt;a href=\"https://docs.oracle.com/cd/E19957-01/806-3568/ncg_goldberg.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;lose precision&lt;/a&gt; during calculations.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"unary-operations\"&gt;&lt;a href=\"en/yql/builtins/json.html#unary-operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Unary operations&lt;/span&gt;&lt;/a&gt;Unary operations&lt;/h4&gt;\n&lt;p&gt;JsonPath supports unary &lt;code&gt;+&lt;/code&gt; and &lt;code&gt;-&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;A unary operation applies to all values from the input sequence. If a unary operation's input is a value that isn't a number, a query fails in both modes.&lt;/p&gt;\n&lt;h5 id=\"example4\"&gt;&lt;a href=\"en/yql/builtins/json.html#example4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h5&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;4&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"780\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-780\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-780\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-780.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The &lt;code&gt;strict -$[*]&lt;/code&gt; query is successful and returns &lt;code&gt;-1, -2, -3, -4&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;lax -$&lt;/code&gt; query fails as &lt;code&gt;$&lt;/code&gt; is an array and not a number.&lt;/p&gt;\n&lt;h4 id=\"binary-operations\"&gt;&lt;a href=\"en/yql/builtins/json.html#binary-operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Binary operations&lt;/span&gt;&lt;/a&gt;Binary operations&lt;/h4&gt;\n&lt;p&gt;JsonPath supports binary arithmetic operations (in descending order of priority):&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Multiplication &lt;code&gt;*&lt;/code&gt;, dividing floating-point numbers &lt;code&gt;/&lt;/code&gt;, and taking the remainder &lt;code&gt;%&lt;/code&gt; (works as the &lt;code&gt;MOD&lt;/code&gt; function in &lt;code&gt;SQL&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;Addition &lt;code&gt;+&lt;/code&gt;, subtraction &lt;code&gt;-&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;You can change the order of operations using parentheses.&lt;/p&gt;\n&lt;p&gt;If each argument of a binary operation is not a single number or a number is divided by 0, the query fails in both modes.&lt;/p&gt;\n&lt;h5 id=\"examples2\"&gt;&lt;a href=\"en/yql/builtins/json.html#examples2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h5&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;(1 + 2) * 3&lt;/code&gt; returns &lt;code&gt;9&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;1 / 2&lt;/code&gt; returns &lt;code&gt;0.5&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;5 % 2&lt;/code&gt; returns &lt;code&gt;1&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;1 / 0&lt;/code&gt; fails&lt;/li&gt;\n&lt;li&gt;If JSON is &lt;code&gt;[-32.4, 5.2]&lt;/code&gt;, the &lt;code&gt;$[0] % $[1]&lt;/code&gt; query returns &lt;code&gt;-1.2&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;If JSON is &lt;code&gt;[1, 2, 3, 4]&lt;/code&gt;, the &lt;code&gt;lax $[*] + $[*]&lt;/code&gt; query fails as the &lt;code&gt;$[*]&lt;/code&gt; expression execution result is &lt;code&gt;1, 2, 3, 4&lt;/code&gt;, that is multiple numbers. A binary operation only requires one number for each of its arguments.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"boolean-values\"&gt;&lt;a href=\"en/yql/builtins/json.html#boolean-values\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boolean values&lt;/span&gt;&lt;/a&gt;Boolean values&lt;/h3&gt;\n&lt;p&gt;Unlike some other programming languages, Boolean values in JsonPath are not only &lt;code&gt;true&lt;/code&gt; and &lt;code&gt;false&lt;/code&gt;, but also &lt;code&gt;null&lt;/code&gt; (uncertainty).&lt;/p&gt;\n&lt;p&gt;JsonPath considers any values received from a JSON document to be non-Boolean. For example, a query like &lt;code&gt;! $.is_valid_user&lt;/code&gt; (a logical negation applied to the &lt;code&gt;is_valid_user&lt;/code&gt;)  field is syntactically invalid because the &lt;code&gt;is_valid_user&lt;/code&gt; field value is not Boolean (even when it actually stores &lt;code&gt;true&lt;/code&gt; or &lt;code&gt;false&lt;/code&gt;). The correct way to write this kind of query is to explicitly use a comparison with a Boolean value, such as &lt;code&gt;$.is_valid_user == false&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"logical-operations\"&gt;&lt;a href=\"en/yql/builtins/json.html#logical-operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Logical operations&lt;/span&gt;&lt;/a&gt;Logical operations&lt;/h3&gt;\n&lt;p&gt;JsonPath supports some logical operations for Boolean values.&lt;/p&gt;\n&lt;p&gt;The arguments of any logical operation must be a single Boolean value.&lt;br /&gt;\nAll logical operations return a Boolean value.&lt;/p&gt;\n&lt;h4 id=\"logical-negation,\"&gt;&lt;a href=\"en/yql/builtins/json.html#logical-negation,\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Logical negation, !&lt;/span&gt;&lt;/a&gt;Logical negation, !&lt;/h4&gt;\n&lt;p&gt;Truth table:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;code&gt;x&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;!x&lt;/code&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"logical-and,-andand\"&gt;&lt;a href=\"en/yql/builtins/json.html#logical-and,-andand\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Logical AND, &amp;amp;&amp;amp;&lt;/span&gt;&lt;/a&gt;Logical AND, &amp;amp;&amp;amp;&lt;/h4&gt;\n&lt;p&gt;In the truth table, the first column is the left argument, the first row is the right argument, and each cell is the result of using the Logical AND both with the left and right arguments:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;code&gt;&amp;amp;&amp;amp;&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;true&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;false&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;null&lt;/code&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"logical-or,-oror\"&gt;&lt;a href=\"en/yql/builtins/json.html#logical-or,-oror\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Logical OR, ||&lt;/span&gt;&lt;/a&gt;Logical OR, ||&lt;/h4&gt;\n&lt;p&gt;In the truth table, the first column is the left argument, the first row is the right argument, and each cell is the result of using the logical OR with both the left and right arguments:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;code&gt;||&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;true&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;false&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;&lt;code&gt;null&lt;/code&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h5 id=\"examples3\"&gt;&lt;a href=\"en/yql/builtins/json.html#examples3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h5&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;! (true == true)&lt;/code&gt;, the result is &lt;code&gt;false&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;(true == true) &amp;amp;&amp;amp; (true == false)&lt;/code&gt;, the result is &lt;code&gt;false&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;(true == true) || (true == false)&lt;/code&gt;, the result is &lt;code&gt;true&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"comparison-operators\"&gt;&lt;a href=\"en/yql/builtins/json.html#comparison-operators\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Comparison operators&lt;/span&gt;&lt;/a&gt;Comparison operators&lt;/h3&gt;\n&lt;p&gt;JsonPath implements comparison operators for values:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Equality, &lt;code&gt;==&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Not equal to, &lt;code&gt;!=&lt;/code&gt; and &lt;code&gt;&amp;lt;&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Less than and less than or equal to, &lt;code&gt;&amp;lt;&lt;/code&gt; and &lt;code&gt;&amp;lt;=&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Greater than and greater than or equal to, &lt;code&gt;&amp;gt;&lt;/code&gt; and &lt;code&gt;&amp;gt;=&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;All comparison operators return a Boolean value. Both operator arguments support multiple values.&lt;/p&gt;\n&lt;p&gt;If an error occurs when calculating the operator arguments, it returns &lt;code&gt;null&lt;/code&gt;. In this case, the JsonPath query execution continues.&lt;/p&gt;\n&lt;p&gt;The arrays of each of the arguments are automatically unpacked. After that, for each pair where the first element is taken from the sequence of the left argument and the second one from the sequence of the right argument:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The elements of the pair are compared&lt;/li&gt;\n&lt;li&gt;If an error occurs during the comparison, the flag set is &lt;code&gt;ERROR&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;If the comparison result is true, the flag set is &lt;code&gt;FOUND&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;If either the &lt;code&gt;ERROR&lt;/code&gt; or &lt;code&gt;FOUND&lt;/code&gt; flag is set and the query is executed in &lt;code&gt;lax&lt;/code&gt; mode, no more pairs are analyzed.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;If the pair analysis results in:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The &lt;code&gt;ERROR&lt;/code&gt; flag is set, the operator returns &lt;code&gt;null&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;The &lt;code&gt;FOUND&lt;/code&gt; flag is set, the operator returns &lt;code&gt;true&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Otherwise, it returns &lt;code&gt;false&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;We can say that this algorithm considers all pairs from the Cartesian product of the left and right arguments, trying to find the pair whose comparison returns true.&lt;/p&gt;\n&lt;p&gt;Elements in a pair are compared according to the following rules:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;If the left or right argument is an array or object, the comparison fails.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;null == null&lt;/code&gt; returns true&lt;/li&gt;\n&lt;li&gt;In all other cases, if one of the arguments is &lt;code&gt;null&lt;/code&gt;, false is returned.&lt;/li&gt;\n&lt;li&gt;If the left and right arguments are of different types, the comparison fails.&lt;/li&gt;\n&lt;li&gt;Strings are compared byte by byte.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;true&lt;/code&gt; is considered greater than &lt;code&gt;false&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Numbers are compared with the accuracy of &lt;code&gt;1e-20&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"example5\"&gt;&lt;a href=\"en/yql/builtins/json.html#example5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h4&gt;\n&lt;p&gt;Let's take a JSON document as an example&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"left\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"right\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;4&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Inaros\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1192\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1192\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1192\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1192.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;and analyze the steps for executing the &lt;code&gt;lax $.left &amp;lt; $.right&lt;/code&gt; query:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Auto unpacking of arrays in the left and right arguments. As a result, the left argument is the sequence &lt;code&gt;1, 2&lt;/code&gt; and the right argument is &lt;code&gt;4, \"Iranos\"&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Let's take the pair &lt;code&gt;(1, 4)&lt;/code&gt;. The comparison is successful as &lt;code&gt;1 &amp;lt; 4&lt;/code&gt; is true. Set the flag &lt;code&gt;FOUND&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Since the query is executed in &lt;code&gt;lax&lt;/code&gt; mode and the &lt;code&gt;FOUND&lt;/code&gt; flag is set, we aren't analyzing any more pairs.&lt;/li&gt;\n&lt;li&gt;Since we have the &lt;code&gt;FOUND&lt;/code&gt; flag set, the operator returns true.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Let's take the same query in a different execution mode: &lt;code&gt;strict $.left &amp;lt; $.right&lt;/code&gt;:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Auto unpacking of arrays in the left and right arguments. As a result, the left argument is the sequence &lt;code&gt;1, 2&lt;/code&gt; and the right argument is &lt;code&gt;4, \"Iranos\"&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Let's take the pair &lt;code&gt;(1, 4)&lt;/code&gt;. The comparison is successful as &lt;code&gt;1 &amp;lt; 4&lt;/code&gt; is true. Set the flag &lt;code&gt;FOUND&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Let's take the pair &lt;code&gt;(2, 4)&lt;/code&gt;. The comparison is successful as &lt;code&gt;2 &amp;lt; 4&lt;/code&gt; is true. Set the flag &lt;code&gt;FOUND&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Let's take the pair &lt;code&gt;(1, \"Iranos\")&lt;/code&gt;. The comparison fails as a number can't be compared with a string. Set the flag &lt;code&gt;ERROR&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Let's take the pair &lt;code&gt;(2, \"Iranos\")&lt;/code&gt;. The comparison fails as a number can't be compared with a string. Set the flag &lt;code&gt;ERROR&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Since we have the &lt;code&gt;ERROR&lt;/code&gt; flag set, the operator returns &lt;code&gt;null&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"predicates\"&gt;&lt;a href=\"en/yql/builtins/json.html#predicates\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Predicates&lt;/span&gt;&lt;/a&gt;Predicates&lt;/h3&gt;\n&lt;p&gt;JsonPath supports predicates which are expressions that return a Boolean value and check a certain condition. You can use them, for example, in filters.&lt;/p&gt;\n&lt;h4 id=\"like_regex\"&gt;&lt;a href=\"en/yql/builtins/json.html#like_regex\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;like_regex&lt;/span&gt;&lt;/a&gt;&lt;code&gt;like_regex&lt;/code&gt;&lt;/h4&gt;\n&lt;p&gt;The &lt;code&gt;like_regex&lt;/code&gt; predicate lets you check if a string matches a regular expression. The syntax of regular expressions is the same as in &lt;a href=\"en/yql/udf/list/hyperscan.html\"&gt;Hyperscan UDF&lt;/a&gt; and &lt;a href=\"en/yql/syntax/expressions.html#regexp\"&gt;REGEXP&lt;/a&gt;.&lt;/p&gt;\n&lt;h6 id=\"syntax\"&gt;&lt;a href=\"en/yql/builtins/json.html#syntax\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Syntax&lt;/span&gt;&lt;/a&gt;Syntax&lt;/h6&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;expression&amp;gt; like_regex &amp;lt;regexp string&amp;gt; [flag &amp;lt;flag string&amp;gt;]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1268\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1268\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1268\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1268.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Where:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;expression&amp;gt;&lt;/code&gt; is a JsonPath expression with strings to be checked for matching the regular expression.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;regexp string&amp;gt;&lt;/code&gt; is a string with the regular expression&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;flag &amp;lt;flag string&amp;gt;&lt;/code&gt; is an optional section where &lt;code&gt;&amp;lt;flag string&amp;gt;&lt;/code&gt; is a string with regular expression execution flags.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Supported flags:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;i&lt;/code&gt;: Disable the case sensitivity.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h5 id=\"execution\"&gt;&lt;a href=\"en/yql/builtins/json.html#execution\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Execution&lt;/span&gt;&lt;/a&gt;Execution&lt;/h5&gt;\n&lt;p&gt;Before the check, the input sequence arrays are automatically unpacked.&lt;/p&gt;\n&lt;p&gt;After that, for each element of the input sequence:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;A check is made to find out if a string matches a regular expression.&lt;/li&gt;\n&lt;li&gt;If the element isn't a string, the flag set is &lt;code&gt;ERROR&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;If the check result is true, the flag set is &lt;code&gt;FOUND&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;If either the &lt;code&gt;ERROR&lt;/code&gt; or &lt;code&gt;FOUND&lt;/code&gt; flag is set and the query is executed in &lt;code&gt;lax&lt;/code&gt; mode, no more pairs are analyzed.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;If the pair analysis results in:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Setting the &lt;code&gt;ERROR&lt;/code&gt; flag, the predicate returns &lt;code&gt;null&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Setting the &lt;code&gt;FOUND&lt;/code&gt; flag, the predicate returns &lt;code&gt;true&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Otherwise, the predicate returns &lt;code&gt;false&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"examples4\"&gt;&lt;a href=\"en/yql/builtins/json.html#examples4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;\"123456\" like_regex \"^[0-9]+$\"&lt;/code&gt; returns &lt;code&gt;true&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;\"123abcd456\" like_regex \"^[0-9]+$\"&lt;/code&gt; returns &lt;code&gt;false&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;\"Naomi Nagata\" like_regex \"nag\"&lt;/code&gt; returns &lt;code&gt;false&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;\"Naomi Nagata\" like_regex \"nag\" flag \"i\"&lt;/code&gt; returns &lt;code&gt;true&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"starts-with\"&gt;&lt;a href=\"en/yql/builtins/json.html#starts-with\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;starts with&lt;/span&gt;&lt;/a&gt;&lt;code&gt;starts with&lt;/code&gt;&lt;/h4&gt;\n&lt;p&gt;The &lt;code&gt;starts with&lt;/code&gt; predicate lets you check if one string is a prefix of another.&lt;/p&gt;\n&lt;h6 id=\"syntax1\"&gt;&lt;a href=\"en/yql/builtins/json.html#syntax1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Syntax&lt;/span&gt;&lt;/a&gt;Syntax&lt;/h6&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;string expression&amp;gt; starts with &amp;lt;prefix expression&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1384\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1384\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1384\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1384.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Where:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;string expression&amp;gt;&lt;/code&gt; is a JsonPath expression with the string to check.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;prefix expression&amp;gt;&lt;/code&gt; is a JsonPath expression with a prefix string.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;This means that the predicate will check that the &lt;code&gt;&amp;lt;string expression&amp;gt;&lt;/code&gt; starts with the &lt;code&gt;&amp;lt;prefix expression&amp;gt;&lt;/code&gt; string.&lt;/p&gt;\n&lt;h5 id=\"execution1\"&gt;&lt;a href=\"en/yql/builtins/json.html#execution1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Execution&lt;/span&gt;&lt;/a&gt;Execution&lt;/h5&gt;\n&lt;p&gt;The first argument of the predicate must be a single string.&lt;/p&gt;\n&lt;p&gt;The second argument of the predicate must be a sequence of (possibly, multiple) strings.&lt;/p&gt;\n&lt;p&gt;For each element in a sequence of prefix strings:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;A check is made for whether \"an element is a prefix of an input string\"&lt;/li&gt;\n&lt;li&gt;If the element isn't a string, the flag set is &lt;code&gt;ERROR&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;If the check result is true, the flag set is &lt;code&gt;FOUND&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;If either the &lt;code&gt;ERROR&lt;/code&gt; or &lt;code&gt;FOUND&lt;/code&gt; flag is set and the query is executed in &lt;code&gt;lax&lt;/code&gt; mode, no more pairs are analyzed.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;If the pair analysis results in:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Setting the &lt;code&gt;ERROR&lt;/code&gt; flag, the predicate returns &lt;code&gt;null&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Setting the &lt;code&gt;FOUND&lt;/code&gt; flag, the predicate returns &lt;code&gt;true&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Otherwise, the predicate returns &lt;code&gt;false&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h5 id=\"examples5\"&gt;&lt;a href=\"en/yql/builtins/json.html#examples5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h5&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;\"James Holden\" starts with \"James\"&lt;/code&gt; returns &lt;code&gt;true&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;\"James Holden\" starts with \"Amos\"&lt;/code&gt; returns &lt;code&gt;false&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"exists\"&gt;&lt;a href=\"en/yql/builtins/json.html#exists\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;exists&lt;/span&gt;&lt;/a&gt;&lt;code&gt;exists&lt;/code&gt;&lt;/h4&gt;\n&lt;p&gt;The &lt;code&gt;exists&lt;/code&gt; predicate lets you check whether a JsonPath expression returns at least one element.&lt;/p&gt;\n&lt;h6 id=\"syntax2\"&gt;&lt;a href=\"en/yql/builtins/json.html#syntax2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Syntax&lt;/span&gt;&lt;/a&gt;Syntax&lt;/h6&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;exists (&amp;lt;expression&amp;gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1481\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1481\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1481\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1481.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Where &lt;code&gt;&amp;lt;expression&amp;gt;&lt;/code&gt; is the JsonPath expression to be checked. Parentheses around the expression are required.&lt;/p&gt;\n&lt;h5 id=\"execution2\"&gt;&lt;a href=\"en/yql/builtins/json.html#execution2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Execution&lt;/span&gt;&lt;/a&gt;Execution&lt;/h5&gt;\n&lt;ol&gt;\n&lt;li&gt;The passed JsonPath expression is executed.&lt;/li&gt;\n&lt;li&gt;If an error occurs, the predicate returns &lt;code&gt;null&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;If an empty sequence is obtained as a result of the execution, the predicate returns &lt;code&gt;false&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Otherwise, the predicate returns &lt;code&gt;true&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h5 id=\"examples6\"&gt;&lt;a href=\"en/yql/builtins/json.html#examples6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h5&gt;\n&lt;p&gt;Let's take a JSON document:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"profile\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Josephus\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"surname\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Miller\"&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1516\"&gt;\n
