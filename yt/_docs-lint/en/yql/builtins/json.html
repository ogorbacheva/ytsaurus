              &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1516\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1516\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1516.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;exists ($.profile.name)&lt;/code&gt; returns &lt;code&gt;true&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;exists ($.friends.profile.name)&lt;/code&gt; returns &lt;code&gt;false&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;strict exists ($.friends.profile.name)&lt;/code&gt; returns &lt;code&gt;null&lt;/code&gt;, because accessing non-existent object keys in &lt;code&gt;strict&lt;/code&gt; mode is an error.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"is-unknown\"&gt;&lt;a href=\"en/yql/builtins/json.html#is-unknown\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;is unknown&lt;/span&gt;&lt;/a&gt;&lt;code&gt;is unknown&lt;/code&gt;&lt;/h4&gt;\n&lt;p&gt;The &lt;code&gt;is unknown&lt;/code&gt; predicate lets you check if a Boolean value is &lt;code&gt;null&lt;/code&gt;.&lt;/p&gt;\n&lt;h6 id=\"syntax3\"&gt;&lt;a href=\"en/yql/builtins/json.html#syntax3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Syntax&lt;/span&gt;&lt;/a&gt;Syntax&lt;/h6&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;(&amp;lt;expression&amp;gt;) is unknown\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1543\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1543\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1543\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1543.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Where &lt;code&gt;&amp;lt;expression&amp;gt;&lt;/code&gt; is the JsonPath expression to be checked. Only expressions that return a Boolean value are allowed. Parentheses around the expression are required.&lt;/p&gt;\n&lt;h5 id=\"execution3\"&gt;&lt;a href=\"en/yql/builtins/json.html#execution3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Execution&lt;/span&gt;&lt;/a&gt;Execution&lt;/h5&gt;\n&lt;ol&gt;\n&lt;li&gt;If the passed expression returns &lt;code&gt;null&lt;/code&gt;, the predicate returns &lt;code&gt;true&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Otherwise, the predicate returns &lt;code&gt;false&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h5 id=\"examples7\"&gt;&lt;a href=\"en/yql/builtins/json.html#examples7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h5&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;(1 == 2) is unknown&lt;/code&gt; returns &lt;code&gt;false&lt;/code&gt;. The &lt;code&gt;1 == 2&lt;/code&gt; expression returned &lt;code&gt;false&lt;/code&gt;, which is not &lt;code&gt;null&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;(1 == \"string\") is unknown&lt;/code&gt; returns &lt;code&gt;true&lt;/code&gt;. The &lt;code&gt;1 == \"string\"&lt;/code&gt; expression returned &lt;code&gt;null&lt;/code&gt;, because strings and numbers can't be compared in JsonPath.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"filters\"&gt;&lt;a href=\"en/yql/builtins/json.html#filters\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Filters&lt;/span&gt;&lt;/a&gt;Filters&lt;/h3&gt;\n&lt;p&gt;JsonPath lets you filter values obtained during query execution.&lt;/p&gt;\n&lt;p&gt;An expression in a filter must return a Boolean value.&lt;br /&gt;\nBefore filtering, the input sequence arrays are automatically unpacked.&lt;/p&gt;\n&lt;p&gt;For each element of the input sequence:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The value of the current filtered &lt;code&gt;@&lt;/code&gt; object becomes equal to the current element of the input sequence.&lt;/li&gt;\n&lt;li&gt;Executing the expression in the filter&lt;/li&gt;\n&lt;li&gt;If an error occurs during the expression execution, the current element of the input sequence is skipped.&lt;/li&gt;\n&lt;li&gt;If the expression execution result is the only &lt;code&gt;true&lt;/code&gt; value, the current element is added to the filter result.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"example6\"&gt;&lt;a href=\"en/yql/builtins/json.html#example6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h4&gt;\n&lt;p&gt;Suppose we have a JSON document describing the user's friends&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"friends\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"James Holden\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"age\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;35&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"money\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;500&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Naomi Nagata\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"age\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;30&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;\"money\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;345&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1617\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1617\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1617\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1617.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;and we want to get a list of friends who are over 32 years old using a JsonPath query. To do this, you can write the following query:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$.friends ? (@.age &amp;gt; 32)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1621\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1621\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1621\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1621.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Let's analyze the query in parts:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;$.friends&lt;/code&gt; accesses the &lt;code&gt;friends&lt;/code&gt; array in the JSON document.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;? ( ... )&lt;/code&gt; is the filter syntax. An expression inside the parentheses is called a predicate.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;@&lt;/code&gt; accesses the currently filtered object. In our example, it's the object describing a friend of the user.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;@.age&lt;/code&gt; accesses the &lt;code&gt;age&lt;/code&gt; field of the currently filtered object.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;@.age &amp;gt; 32&lt;/code&gt; compares the &lt;code&gt;age&lt;/code&gt; field with the value 32. As a result of the query, only the values for which this predicate returned true remain.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The query only returns the first friend from the array of user's friends.&lt;/p&gt;\n&lt;p&gt;Like many other JsonPath operators, filters can be arranged in chains. Let's take a more complex query that selects the names of friends who are older than 20 and have less than 400 currency units:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$.friends ? (@.age &amp;gt; 20) ? (@.money &amp;lt; 400) . name\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1658\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1658\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1658\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1658.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Let's analyze the query in parts:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;$.friends&lt;/code&gt; accesses the &lt;code&gt;friends&lt;/code&gt; array in the JSON document.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;? (@.age &amp;gt; 20)&lt;/code&gt; is the first filter. Since all friends are over 20, it just returns all the elements of the &lt;code&gt;friends&lt;/code&gt; array.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;? (@.money &amp;lt; 400)&lt;/code&gt; is the second filter. It only returns the second element of the &lt;code&gt;friends&lt;/code&gt; array, since only its &lt;code&gt;money&lt;/code&gt; field value is less than 400.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;.name&lt;/code&gt; accesses the &lt;code&gt;name&lt;/code&gt; field of filtered objects.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The query returns a sequence of a single element: &lt;code&gt;\"Naomi Nagata\"&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;In practice, it's recommended to combine multiple filters into one if possible. The above query is equivalent to &lt;code&gt;$.friends ? (@.age &amp;gt; 20 &amp;amp;&amp;amp; @.money &amp;lt; 400) . name&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"methods\"&gt;&lt;a href=\"en/yql/builtins/json.html#methods\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Methods&lt;/span&gt;&lt;/a&gt;Methods&lt;/h3&gt;\n&lt;p&gt;JsonPath supports methods that are functions converting one sequence of values to another. The syntax for calling a method is similar to accessing the object key:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$.friends.size()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1696\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1696\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1696\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1696.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Just like in the case of accessing object keys, method calls can be arranged in chains:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$.numbers.double().floor()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1700\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1700\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1700\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1700.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"type\"&gt;&lt;a href=\"en/yql/builtins/json.html#type\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;type&lt;/span&gt;&lt;/a&gt;&lt;code&gt;type&lt;/code&gt;&lt;/h4&gt;\n&lt;p&gt;The &lt;code&gt;type&lt;/code&gt; method returns a string with the type of the passed value.&lt;/p&gt;\n&lt;p&gt;For each element of the input sequence, the method adds this string to the output sequence according to the table below:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;String with type&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Null&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"null\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Boolean value&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"boolean\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Number&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"number\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;String&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"string\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Array&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"array\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Objects&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;\"object\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h5 id=\"examples8\"&gt;&lt;a href=\"en/yql/builtins/json.html#examples8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h5&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;\"Naomi\".type()&lt;/code&gt; returns &lt;code&gt;\"string\"&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;false.type()&lt;/code&gt; returns &lt;code&gt;\"boolean\"&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"size\"&gt;&lt;a href=\"en/yql/builtins/json.html#size\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;size&lt;/span&gt;&lt;/a&gt;&lt;code&gt;size&lt;/code&gt;&lt;/h4&gt;\n&lt;p&gt;The &lt;code&gt;size&lt;/code&gt; method returns the size of the array.&lt;/p&gt;\n&lt;p&gt;For each element of the input sequence, the method adds the following to the output sequence:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The size of the array if the element type is an array.&lt;/li&gt;\n&lt;li&gt;For all other types (including objects), it adds &lt;code&gt;1&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"examples9\"&gt;&lt;a href=\"en/yql/builtins/json.html#examples9\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n&lt;p&gt;Let's take a JSON document:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"array\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"object\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"a\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;\"b\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"scalar\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"string\"&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1814\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1814\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1814\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1814.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;And queries to it:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;$.array.size()&lt;/code&gt; returns &lt;code&gt;3&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;$.object.size()&lt;/code&gt; returns &lt;code&gt;1&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;$.scalar.size()&lt;/code&gt; returns &lt;code&gt;1&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"double\"&gt;&lt;a href=\"en/yql/builtins/json.html#double\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;double&lt;/span&gt;&lt;/a&gt;&lt;code&gt;double&lt;/code&gt;&lt;/h4&gt;\n&lt;p&gt;The &lt;code&gt;double&lt;/code&gt; method converts strings to numbers.&lt;/p&gt;\n&lt;p&gt;Before its execution, the input sequence arrays are automatically unpacked.&lt;/p&gt;\n&lt;p&gt;All elements in the input sequence must be strings that contain decimal numbers. It's allowed to specify the fractional part and exponent.&lt;/p&gt;\n&lt;h5 id=\"examples10\"&gt;&lt;a href=\"en/yql/builtins/json.html#examples10\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h5&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;\"125\".double()&lt;/code&gt; returns &lt;code&gt;125&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;\"125.456\".double()&lt;/code&gt; returns &lt;code&gt;125.456&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;\"125.456e-3\".double()&lt;/code&gt; returns &lt;code&gt;0.125456&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"ceiling\"&gt;&lt;a href=\"en/yql/builtins/json.html#ceiling\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ceiling&lt;/span&gt;&lt;/a&gt;&lt;code&gt;ceiling&lt;/code&gt;&lt;/h4&gt;\n&lt;p&gt;The &lt;code&gt;ceiling&lt;/code&gt; method rounds up a number.&lt;/p&gt;\n&lt;p&gt;Before its execution, the input sequence arrays are automatically unpacked.&lt;/p&gt;\n&lt;p&gt;All elements in the input sequence must be numbers.&lt;/p&gt;\n&lt;h5 id=\"examples11\"&gt;&lt;a href=\"en/yql/builtins/json.html#examples11\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h5&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;(1.3).ceiling()&lt;/code&gt; returns &lt;code&gt;2&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;(1.8).ceiling()&lt;/code&gt; returns &lt;code&gt;2&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;(1.5).ceiling()&lt;/code&gt; returns &lt;code&gt;2&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;(1.0).ceiling()&lt;/code&gt; returns &lt;code&gt;1&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"floor\"&gt;&lt;a href=\"en/yql/builtins/json.html#floor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;floor&lt;/span&gt;&lt;/a&gt;&lt;code&gt;floor&lt;/code&gt;&lt;/h4&gt;\n&lt;p&gt;The &lt;code&gt;floor&lt;/code&gt; method rounds down a number.&lt;/p&gt;\n&lt;p&gt;Before its execution, the input sequence arrays are automatically unpacked.&lt;/p&gt;\n&lt;p&gt;All elements in the input sequence must be numbers.&lt;/p&gt;\n&lt;h5 id=\"examples12\"&gt;&lt;a href=\"en/yql/builtins/json.html#examples12\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h5&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;(1.3).floor()&lt;/code&gt; returns &lt;code&gt;1&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;(1.8).floor()&lt;/code&gt; returns &lt;code&gt;1&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;(1.5).floor()&lt;/code&gt; returns &lt;code&gt;1&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;(1.0).floor()&lt;/code&gt; returns &lt;code&gt;1&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"abs\"&gt;&lt;a href=\"en/yql/builtins/json.html#abs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;abs&lt;/span&gt;&lt;/a&gt;&lt;code&gt;abs&lt;/code&gt;&lt;/h4&gt;\n&lt;p&gt;The &lt;code&gt;abs&lt;/code&gt; method calculates the absolute value of a number (removes the sign).&lt;/p&gt;\n&lt;p&gt;Before its execution, the input sequence arrays are automatically unpacked.&lt;/p&gt;\n&lt;p&gt;All elements in the input sequence must be numbers.&lt;/p&gt;\n&lt;h5 id=\"examples13\"&gt;&lt;a href=\"en/yql/builtins/json.html#examples13\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h5&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;(0.0).abs()&lt;/code&gt; returns &lt;code&gt;0&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;(1.0).abs()&lt;/code&gt; returns &lt;code&gt;1&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;(-1.0).abs()&lt;/code&gt; returns &lt;code&gt;1&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"keyvalue\"&gt;&lt;a href=\"en/yql/builtins/json.html#keyvalue\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;keyvalue&lt;/span&gt;&lt;/a&gt;&lt;code&gt;keyvalue&lt;/code&gt;&lt;/h4&gt;\n&lt;p&gt;The &lt;code&gt;keyvalue&lt;/code&gt; method converts an object to a sequence of key-value pairs.&lt;/p&gt;\n&lt;p&gt;Before its execution, the input sequence arrays are automatically unpacked.&lt;/p&gt;\n&lt;p&gt;All elements in the input sequence must be objects.&lt;/p&gt;\n&lt;p&gt;For each element of the input sequence:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Each key-value pair in the element is analyzed.&lt;/li&gt;\n&lt;li&gt;For each key-value pair, an object is generated with the keys &lt;code&gt;name&lt;/code&gt; and &lt;code&gt;value&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;name&lt;/code&gt; stores a string with the name of the key from the pair.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;value&lt;/code&gt; stores the value from the pair.&lt;/li&gt;\n&lt;li&gt;All objects for this element are added to the output sequence.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h5 id=\"examples14\"&gt;&lt;a href=\"en/yql/builtins/json.html#examples14\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h5&gt;\n&lt;p&gt;Let's take a JSON document:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Chrisjen\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"surname\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Avasarala\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"age\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;70&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2021\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2021\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2021\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2021.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The &lt;code&gt;$.keyvalue()&lt;/code&gt; query returns the following sequence for it:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"age\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"value\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;70&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"value\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Chrisjen\"&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"surname\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"value\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Avasarala\"&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2025\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2025\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2025\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2025.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"variables\"&gt;&lt;a href=\"en/yql/builtins/json.html#variables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Variables&lt;/span&gt;&lt;/a&gt;Variables&lt;/h3&gt;\n&lt;p&gt;Functions using JsonPath can pass values into a query. They are called variables. To access a variable, write the &lt;code&gt;$&lt;/code&gt; character and the variable name: &lt;code&gt;$variable&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"example7\"&gt;&lt;a href=\"en/yql/builtins/json.html#example7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h4&gt;\n&lt;p&gt;Let the &lt;code&gt;planet&lt;/code&gt; variable be equal to&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"name\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Mars\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"gravity\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0.376&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2038\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2038\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2038\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2038.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Then the strict &lt;code&gt;$planet.name&lt;/code&gt; query returns &lt;code&gt;\"Mars\"&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Unlike many programming languages, JsonPath doesn't support creating new variables or modifying existing ones.&lt;/p&gt;\n&lt;h2 id=\"common-arguments\"&gt;&lt;a href=\"en/yql/builtins/json.html#common-arguments\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Common arguments&lt;/span&gt;&lt;/a&gt;Common arguments&lt;/h2&gt;\n&lt;p&gt;All functions for JSON accept:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;A JSON value (can be an arbitrary &lt;code&gt;Json&lt;/code&gt; or &lt;code&gt;Json?&lt;/code&gt; expression)&lt;/li&gt;\n&lt;li&gt;A JsonPath query (must be explicitly specified with a string literal)&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;(Optional)&lt;/strong&gt; &lt;code&gt;PASSING&lt;/code&gt; section&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"passing-section\"&gt;&lt;a href=\"en/yql/builtins/json.html#passing-section\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PASSING section&lt;/span&gt;&lt;/a&gt;PASSING section&lt;/h3&gt;\n&lt;p&gt;Lets you pass values to a JsonPath query as variables.&lt;/p&gt;\n&lt;h5 id=\"syntax4\"&gt;&lt;a href=\"en/yql/builtins/json.html#syntax4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Syntax&lt;/span&gt;&lt;/a&gt;Syntax&lt;/h5&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;PASSING\n    &amp;lt;expression 1&amp;gt; AS &amp;lt;variable name 1&amp;gt;,\n    &amp;lt;expression 2&amp;gt; AS &amp;lt;variable name 2&amp;gt;,\n    ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2077\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2077\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2077\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2077.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code&gt;&amp;lt;expression&amp;gt;&lt;/code&gt; can be of the following types:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Numbers, &lt;code&gt;Date&lt;/code&gt;, &lt;code&gt;DateTime&lt;/code&gt;, and &lt;code&gt;Timestamp&lt;/code&gt; (a &lt;code&gt;CAST&lt;/code&gt; into &lt;code&gt;Double&lt;/code&gt; will be made before passing a value to JsonPath)&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Utf8&lt;/code&gt;, &lt;code&gt;Bool&lt;/code&gt; and &lt;code&gt;Json&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;You can set a &lt;code&gt;&amp;lt;variable name&amp;gt;&lt;/code&gt; in several ways:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;As an SQL name like &lt;code&gt;variable&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;In quotes, for example, &lt;code&gt;\"variable\"&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"example8\"&gt;&lt;a href=\"en/yql/builtins/json.html#example8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;JSON_VALUE(\n    $json,\n    \"$.timestamp - $Now + $Hour\"\n    PASSING\n        24 * 60 as Hour,\n        CurrentUtcTimestamp() as \"Now\"\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2111\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2111\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2111\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2111.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"json_exists\"&gt;&lt;a href=\"en/yql/builtins/json.html#json_exists\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;JSON_EXISTS&lt;/span&gt;&lt;/a&gt;JSON_EXISTS&lt;/h2&gt;\n&lt;p&gt;The &lt;code&gt;JSON_EXISTS&lt;/code&gt; function checks if a JSON value meets the specified JsonPath.&lt;/p&gt;\n&lt;h4 id=\"syntax5\"&gt;&lt;a href=\"en/yql/builtins/json.html#syntax5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Syntax&lt;/span&gt;&lt;/a&gt;Syntax&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;JSON_EXISTS(\n    &amp;lt;JSON expression&amp;gt;,\n    &amp;lt;JsonPath query&amp;gt;,\n    [&amp;lt;PASSING clause&amp;gt;]\n    [{TRUE | FALSE | UNKNOWN | ERROR} ON ERROR]\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2121\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2121\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2121\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2121.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Returned value: &lt;code&gt;Bool?&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Default value: If the &lt;code&gt;ON ERROR&lt;/code&gt; clause is not specified, the default error-handling behavior is &lt;code&gt;FALSE ON ERROR&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Behavior:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;If &lt;code&gt;&amp;lt;JSON expression&amp;gt;&lt;/code&gt; is &lt;code&gt;NULL&lt;/code&gt; or an empty &lt;code&gt;Json?&lt;/code&gt;, it returns an empty &lt;code&gt;Bool?&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;If an error occurs during JsonPath execution, the returned value depends on the &lt;code&gt;ON ERROR&lt;/code&gt; section:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;TRUE&lt;/code&gt;: Return &lt;code&gt;True&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;FALSE&lt;/code&gt;: Return &lt;code&gt;False&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;UNKNOWN&lt;/code&gt;: Return an empty &lt;code&gt;Bool?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ERROR&lt;/code&gt;: Abort the entire query&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;If the result of JsonPath execution is one or more values, the return value is &lt;code&gt;True&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Otherwise, &lt;code&gt;False&lt;/code&gt; is returned.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"examples15\"&gt;&lt;a href=\"en/yql/builtins/json.html#examples15\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$json = CAST(@@{\n    \"title\": \"Rocinante\",\n    \"crew\": [\n        \"James Holden\",\n        \"Naomi Nagata\",\n        \"Alex Kamai\",\n        \"Amos Burton\"\n    ]\n}@@ as Json);\n\nSELECT\n    JSON_EXISTS($json, \"$.title\"), -- True\n    JSON_EXISTS($json, \"$.crew[*]\"), -- True\n    JSON_EXISTS($json, \"$.nonexistent\"); -- False because JsonPath will return an empty result\n\nSELECT\n    -- JsonPath error will return False because FALSE ON ERROR is used by default\n    JSON_EXISTS($json, \"strict $.nonexistent\");\n\nSELECT\n    -- JsonPath error, the entire YQL query fails with an error\n    JSON_EXISTS($json, \"strict $.nonexistent\" ERROR ON ERROR);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2178\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2178\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2178\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2178.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"json_value\"&gt;&lt;a href=\"en/yql/builtins/json.html#json_value\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;JSON_VALUE&lt;/span&gt;&lt;/a&gt;JSON_VALUE&lt;/h2&gt;\n&lt;p&gt;The &lt;code&gt;JSON_VALUE&lt;/code&gt; function retrieves a scalar value from JSON (anything that isn't an array or object).&lt;/p&gt;\n&lt;h4 id=\"syntax6\"&gt;&lt;a href=\"en/yql/builtins/json.html#syntax6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Syntax&lt;/span&gt;&lt;/a&gt;Syntax&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;JSON_VALUE(\n    &amp;lt;JSON expression&amp;gt;,\n    &amp;lt;JsonPath query&amp;gt;,\n    [&amp;lt;PASSING clause&amp;gt;]\n    [RETURNING &amp;lt;type&amp;gt;]\n    [{ERROR | NULL | DEFAULT &amp;lt;expr&amp;gt;} ON EMPTY]\n    [{ERROR | NULL | DEFAULT &amp;lt;expr&amp;gt;} ON ERROR]\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2188\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2188\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2188\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2188.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Returned value: &lt;code&gt;&amp;lt;type&amp;gt;?&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Default values:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;If the &lt;code&gt;ON EMPTY&lt;/code&gt; section isn't specified, the section used is &lt;code&gt;NULL ON EMPTY&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;If the &lt;code&gt;ON ERROR&lt;/code&gt; section isn't specified, the section used is &lt;code&gt;NULL ON ERROR&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;If the &lt;code&gt;RETURNING&lt;/code&gt; section is omitted, it uses &lt;code&gt;Utf8&lt;/code&gt; as &lt;code&gt;&amp;lt;type&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Behavior:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;If &lt;code&gt;&amp;lt;JSON expression&amp;gt;&lt;/code&gt; is &lt;code&gt;NULL&lt;/code&gt; or an empty &lt;code&gt;Json?&lt;/code&gt;, it returns an empty &lt;code&gt;&amp;lt;type&amp;gt;?&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;If an error occurs, the returned value depends on the &lt;code&gt;ON ERROR&lt;/code&gt; section:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;NULL&lt;/code&gt;: Return an empty &lt;code&gt;&amp;lt;type&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ERROR&lt;/code&gt;: Abort the entire query&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DEFAULT &amp;lt;expr&amp;gt;&lt;/code&gt;: Return &lt;code&gt;&amp;lt;expr&amp;gt;&lt;/code&gt; with a prior &lt;code&gt;CAST&lt;/code&gt; to the type &lt;code&gt;&amp;lt;type&amp;gt;?&lt;/code&gt;. If the &lt;code&gt;CAST&lt;/code&gt; fails, the entire query fails, too.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;If the JsonPath execution result is empty, the returned value depends on the &lt;code&gt;ON EMPTY&lt;/code&gt; section:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;NULL&lt;/code&gt;: Return an empty &lt;code&gt;&amp;lt;type&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ERROR&lt;/code&gt;: Abort the entire query&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DEFAULT &amp;lt;expr&amp;gt;&lt;/code&gt;: Return &lt;code&gt;&amp;lt;expr&amp;gt;&lt;/code&gt; with a prior &lt;code&gt;CAST&lt;/code&gt; to the type &lt;code&gt;&amp;lt;type&amp;gt;?&lt;/code&gt;. If the &lt;code&gt;CAST&lt;/code&gt; fails, the behavior matches the &lt;code&gt;ON ERROR&lt;/code&gt; section.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;If the result of JsonPath execution is a single value, then:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;If the &lt;code&gt;RETURNING&lt;/code&gt; section isn't specified, the value is converted to &lt;code&gt;Utf8&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Otherwise, the &lt;code&gt;CAST&lt;/code&gt; function is run to convert the value to &lt;code&gt;&amp;lt;type&amp;gt;&lt;/code&gt;. If the &lt;code&gt;CAST&lt;/code&gt; fails, the behavior matches the &lt;code&gt;ON ERROR&lt;/code&gt; section. In this case, the value from JSON must match the &lt;code&gt;&amp;lt;type&amp;gt;&lt;/code&gt; type.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Return the result&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Correlation between JSON and YQL types:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;JSON Number: Numeric types, &lt;code&gt;Date&lt;/code&gt;, &lt;code&gt;DateTime&lt;/code&gt;, and &lt;code&gt;Timestamp&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;JSON Bool - &lt;code&gt;Bool&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;JSON String: &lt;code&gt;Utf8&lt;/code&gt; and &lt;code&gt;String&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Errors executing &lt;code&gt;JSON_VALUE&lt;/code&gt; are as follows:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Errors evaluating JsonPath&lt;/li&gt;\n&lt;li&gt;The result of JsonPath execution is a number of values or a non-scalar value.&lt;/li&gt;\n&lt;li&gt;The type of value returned by JSON doesn't match the expected one.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The &lt;code&gt;RETURNING&lt;/code&gt; section supports such types as numbers, &lt;code&gt;Date&lt;/code&gt;, &lt;code&gt;DateTime&lt;/code&gt;, &lt;code&gt;Timestamp&lt;/code&gt;, &lt;code&gt;Utf8&lt;/code&gt;, &lt;code&gt;String&lt;/code&gt;, and &lt;code&gt;Bool&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"examples16\"&gt;&lt;a href=\"en/yql/builtins/json.html#examples16\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$json = CAST(@@{\n    \"friends\": [\n        {\n            \"name\": \"James Holden\",\n            \"age\": 35\n        },\n        {\n            \"name\": \"Naomi Nagata\",\n            \"age\": 30\n        }\n    ]\n}@@ as Json);\n\nSELECT\n    JSON_VALUE($json, \"$.friends[0].age\"), -- \"35\" (Utf8? type)\n    JSON_VALUE($json, \"$.friends[0].age\" RETURNING Uint64), -- 35 (Uint64? type)\n    JSON_VALUE($json, \"$.friends[0].age\" RETURNING Utf8); -- an empty Utf8? because an error has occurred. JSON type of the Number value mismatches the Utf8 string type\n\nSELECT\n    -- \"empty\" (String? type)\n    JSON_VALUE(\n        $json,\n        \"$.friends[50].name\"\n        RETURNING String\n        DEFAULT \"empty\" ON EMPTY\n    );\n\nSELECT\n    -- 20 (Uint64? type). The result of JsonPath execution is empty, but the default value\n    -- from the ON EMPTY section cannot be cast to Uint64.\n    -- That's why the value from ON ERROR is used\n    JSON_VALUE(\n        $json,\n        \"$.friends[50].age\"\n        RETURNING Uint64\n        DEFAULT -1 ON EMPTY\n        DEFAULT 20 ON ERROR\n    );\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2334\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2334\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2334\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2334.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"json_query\"&gt;&lt;a href=\"en/yql/builtins/json.html#json_query\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;JSON_QUERY&lt;/span&gt;&lt;/a&gt;JSON_QUERY&lt;/h2&gt;\n&lt;p&gt;The &lt;code&gt;JSON_QUERY&lt;/code&gt; function lets you retrieve arrays and objects from JSON.&lt;/p&gt;\n&lt;h4 id=\"syntax7\"&gt;&lt;a href=\"en/yql/builtins/json.html#syntax7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Syntax&lt;/span&gt;&lt;/a&gt;Syntax&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;JSON_QUERY(\n    &amp;lt;JSON expression&amp;gt;,\n    &amp;lt;JsonPath query&amp;gt;,\n    [&amp;lt;PASSING clause&amp;gt;]\n    [WITHOUT [ARRAY] | WITH [CONDITIONAL | UNCONDITIONAL] [ARRAY] WRAPPER]\n    [{ERROR | NULL | EMPTY ARRAY | EMPTY OBJECT} ON EMPTY]\n    [{ERROR | NULL | EMPTY ARRAY | EMPTY OBJECT} ON ERROR]\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2344\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2344\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2344\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2344.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Returned value: &lt;code&gt;Json?&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Default values:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;If the &lt;code&gt;ON EMPTY&lt;/code&gt; section isn't specified, the section used is &lt;code&gt;NULL ON EMPTY&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;If the &lt;code&gt;ON ERROR&lt;/code&gt; section isn't specified, the section used is &lt;code&gt;NULL ON ERROR&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;If the &lt;code&gt;WRAPPER&lt;/code&gt; section isn't specified, the section used is &lt;code&gt;WITHOUT WRAPPER&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;If the &lt;code&gt;WITH WRAPPER&lt;/code&gt; section is specified but &lt;code&gt;CONDITIONAL&lt;/code&gt; or &lt;code&gt;UNCONDITIONAL&lt;/code&gt; is omitted, then the section used is &lt;code&gt;UNCONDITIONAL&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Behavior:&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;You can't specify the &lt;code&gt;WITH ... WRAPPER&lt;/code&gt; and &lt;code&gt;ON EMPTY&lt;/code&gt; sections at the same time.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;If &lt;code&gt;&amp;lt;JSON expression&amp;gt;&lt;/code&gt; is &lt;code&gt;NULL&lt;/code&gt; or an empty &lt;code&gt;Json?&lt;/code&gt;, it returns an empty &lt;code&gt;Json?&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;If the &lt;code&gt;WRAPPER&lt;/code&gt; section is specified, then:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;WITHOUT WRAPPER&lt;/code&gt; or &lt;code&gt;WITHOUT ARRAY WRAPPER&lt;/code&gt;: Don't convert the result of JsonPath execution in any way.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;WITH UNCONDITIONAL WRAPPER&lt;/code&gt; or &lt;code&gt;WITH UNCONDITIONAL ARRAY WRAPPER&lt;/code&gt;: Wrap the result of JsonPath execution in an array.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;WITH CONDITIONAL WRAPPER&lt;/code&gt; or &lt;code&gt;WITH CONDITIONAL ARRAY WRAPPER&lt;/code&gt;: Wrap the result of JsonPath execution in an array if it isn't the only array or object.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;If the JsonPath execution result is empty, the returned value depends on the &lt;code&gt;ON EMPTY&lt;/code&gt; section:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;NULL&lt;/code&gt;: Return an empty &lt;code&gt;Json?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ERROR&lt;/code&gt;: Abort the entire query&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;EMPTY ARRAY&lt;/code&gt;: Return an empty JSON array, &lt;code&gt;[]&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;EMPTY OBJECT&lt;/code&gt;: Return an empty JSON object, &lt;code&gt;{}&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;If an error occurs, the returned value depends on the &lt;code&gt;ON ERROR&lt;/code&gt; section:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;NULL&lt;/code&gt;: Return an empty &lt;code&gt;Json?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ERROR&lt;/code&gt;: Abort the entire query&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;EMPTY ARRAY&lt;/code&gt;: Return an empty JSON array, &lt;code&gt;[]&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;EMPTY OBJECT&lt;/code&gt;: Return an empty JSON object, &lt;code&gt;{}&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Return the result&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Errors running a &lt;code&gt;JSON_QUERY&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Errors evaluating JsonPath&lt;/li&gt;\n&lt;li&gt;The result of JsonPath execution is a number of values (even after using the &lt;code&gt;WRAPPER&lt;/code&gt; section) or a scalar value.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"examples17\"&gt;&lt;a href=\"en/yql/builtins/json.html#examples17\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$json = CAST(@@{\n    \"friends\": [\n        {\n            \"name\": \"James Holden\",\n            \"age\": 35\n        },\n        {\n            \"name\": \"Naomi Nagata\",\n            \"age\": 30\n        }\n    ]\n}@@ as Json);\n\nSELECT\n    JSON_QUERY($json, \"$.friends[0]\"); -- {\"name\": \"James Holden\", \"age\": 35}\n\nSELECT\n    JSON_QUERY($json, \"$.friends.name\" WITH UNCONDITIONAL WRAPPER); -- [\"James Holden\", \"Naomi Nagata\"]\n\nSELECT\n    JSON_QUERY($json, \"$.friends[0]\" WITH CONDITIONAL WRAPPER), -- {\"name\": \"James Holden\", \"age\": 35}\n    JSON_QUERY($json, \"$.friends.name\" WITH CONDITIONAL WRAPPER); -- [\"James Holden\", \"Naomi Nagata\"]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2492\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-2492\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-2492\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-2492.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n
