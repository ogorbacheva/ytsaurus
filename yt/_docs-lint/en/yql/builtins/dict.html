            {"data":{"leading":false,"html":"&lt;h2 id=\"dictcreate\"&gt;&lt;a href=\"en/yql/builtins/dict.html#dictcreate\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DictCreate&lt;/span&gt;&lt;/a&gt;DictCreate&lt;/h2&gt;\n&lt;h4 id=\"signature\"&gt;&lt;a href=\"en/yql/builtins/dict.html#signature\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signature&lt;/span&gt;&lt;/a&gt;Signature&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DictCreate(K,V)-&amp;gt;Dict&amp;lt;K,V&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Construct an empty dict. Two arguments are passed — for the key and the value. In each of them, a string describing the data type or the type itself obtained using the &lt;a href=\"en/yql/builtins/types.html\"&gt;functions intended for it&lt;/a&gt; are specified. There are no dicts with an unknown key or value type in YQL.&lt;/p&gt;\n&lt;p&gt;A key type can be:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;A &lt;a href=\"en/yql/types/primitive.html\"&gt;primitive data type&lt;/a&gt; (except for &lt;code&gt;Yson&lt;/code&gt; and &lt;code&gt;Json&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;A primitive data type (except for &lt;code&gt;Yson&lt;/code&gt; and &lt;code&gt;Json&lt;/code&gt;) with an optionality sign.&lt;/li&gt;\n&lt;li&gt;A tuple with the length of at least two of the types listed above.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;a href=\"en/yql/types/type_string.html\"&gt;Type description format documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"examples\"&gt;&lt;a href=\"en/yql/builtins/dict.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT DictCreate(String, Tuple&amp;lt;String,Double?&amp;gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"36\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-36\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-36\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-36.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT DictCreate(Tuple&amp;lt;Int32?,String&amp;gt;, OptionalType(DataType(\"String\")));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"37\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-37\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-37\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-37.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT DictCreate(ParseType(\"Tuple&amp;lt;Int32?,String&amp;gt;\"), ParseType(\"Tuple&amp;lt;String,Double?&amp;gt;\"));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"38\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-38\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-38\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-38.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"setcreate\"&gt;&lt;a href=\"en/yql/builtins/dict.html#setcreate\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SetCreate&lt;/span&gt;&lt;/a&gt;SetCreate&lt;/h2&gt;\n&lt;h4 id=\"signature1\"&gt;&lt;a href=\"en/yql/builtins/dict.html#signature1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signature&lt;/span&gt;&lt;/a&gt;Signature&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SetCreate(T)-&amp;gt;Set&amp;lt;T&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"45\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-45\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-45\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-45.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Construct an empty set. The argument is passed: a key type probably obtained using the &lt;a href=\"en/yql/builtins/types.html\"&gt;functions intended for it&lt;/a&gt;. There are no sets with an unknown key type in YQL. Restrictions on the key type are the same as on the key type for the dict. Note that a set is a dict with the &lt;code&gt;Void&lt;/code&gt; value type. A set can also be created using the &lt;code&gt;DictCreate&lt;/code&gt; function. This also means that all functions that take &lt;code&gt;Dict&amp;lt;K,V&amp;gt;&lt;/code&gt; as input can also take &lt;code&gt;Set&amp;lt;K&amp;gt;&lt;/code&gt; as input.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"en/yql/types/type_string.html\"&gt;Type description format documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"examples1\"&gt;&lt;a href=\"en/yql/builtins/dict.html#examples1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT SetCreate(String);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"55\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-55\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-55\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-55.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT SetCreate(Tuple&amp;lt;Int32?,String&amp;gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"56\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-56\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-56\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-56.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"dictlength\"&gt;&lt;a href=\"en/yql/builtins/dict.html#dictlength\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DictLength&lt;/span&gt;&lt;/a&gt;DictLength&lt;/h2&gt;\n&lt;h4 id=\"signature2\"&gt;&lt;a href=\"en/yql/builtins/dict.html#signature2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signature&lt;/span&gt;&lt;/a&gt;Signature&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DictLength(Dict&amp;lt;K,V&amp;gt;)-&amp;gt;Uint64\nDictLength(Dict&amp;lt;K,V&amp;gt;?)-&amp;gt;Uint64?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"63\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-63\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-63\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-63.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Number of items in the dict.&lt;/p&gt;\n&lt;h4 id=\"examples2\"&gt;&lt;a href=\"en/yql/builtins/dict.html#examples2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT DictLength(AsDict(AsTuple(1, AsList(\"foo\", \"bar\"))));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"70\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transp  class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DictContains&lt;/span&gt;&lt;/a&gt;DictContains&lt;/h2&gt;\n&lt;h4 id=\"signature8\"&gt;&lt;a href=\"en/yql/builtins/dict.html#signature8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signature&lt;/span&gt;&lt;/a&gt;Signature&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DictContains(Dict&amp;lt;K,V&amp;gt;, K)-&amp;gt;Bool\nDictContains(Dict&amp;lt;K,V&amp;gt;?, K)-&amp;gt;Bool\nDictContains(Dict&amp;lt;K,V&amp;gt;, K?)-&amp;gt;Bool\nDictContains(Dict&amp;lt;K,V&amp;gt;?, K?)-&amp;gt;Bool\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"153\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-153\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-153\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-153.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Checking presence of an item in the dict by key. Returns true or false.&lt;/p&gt;\n&lt;h4 id=\"examples8\"&gt;&lt;a href=\"en/yql/builtins/dict.html#examples8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT DictContains(AsDict(\n    AsTuple(1, AsList(\"foo\", \"bar\")),\n    AsTuple(2, AsList(\"bar\", \"baz\"))\n), 42);\n-- false\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"160\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-160\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-160\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-160.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT DictContains(dict_column, \"foo\")\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"161\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-161\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-161\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-161.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"dictaggregate\"&gt;&lt;a href=\"en/yql/builtins/dict.html#dictaggregate\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DictAggregate&lt;/span&gt;&lt;/a&gt;DictAggregate&lt;/h2&gt;\n&lt;h4 id=\"signature9\"&gt;&lt;a href=\"en/yql/builtins/dict.html#signature9\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signature&lt;/span&gt;&lt;/a&gt;Signature&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DictAggregate(Dict&amp;lt;K,List&amp;lt;V&amp;gt;&amp;gt;, List&amp;lt;V&amp;gt;-&amp;gt;T)-&amp;gt;Dict&amp;lt;K,T&amp;gt;\nDictAggregate(Dict&amp;lt;K,List&amp;lt;V&amp;gt;&amp;gt;?, List&amp;lt;V&amp;gt;-&amp;gt;T)-&amp;gt;Dict&amp;lt;K,T&amp;gt;?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"168\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-168\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-168\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-168.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Apply the &lt;a href=\"en/yql/builtins/basic.html#aggregationfactory\"&gt;aggregate function factory&lt;/a&gt; for the passed dict where each value is a list. The factory is applied individually within each key.&lt;br /&gt;\nIf the list is empty, the aggregation result will be the same as for an empty table: 0 for the &lt;code&gt;COUNT&lt;/code&gt; function and &lt;code&gt;NULL&lt;/code&gt; for other functions.&lt;br /&gt;\nIf the list in the passed dict is empty by a key, then such a key is removed from the result.&lt;br /&gt;\nIf the passed dict is optional and contains the &lt;code&gt;NULL&lt;/code&gt; value, the result will also be &lt;code&gt;NULL&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Arguments:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Dict.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/builtins/basic.html#aggregationfactory\"&gt;Aggregate function factory&lt;/a&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"examples9\"&gt;&lt;a href=\"en/yql/builtins/dict.html#examples9\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT DictAggregate(AsDict(\n    AsTuple(1, AsList(\"foo\", \"bar\")),\n    AsTuple(2, AsList(\"baz\", \"qwe\"))),\n    AggregationFactory(\"Max\"));\n-- {1 : \"foo\", 2 : \"qwe\" }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"190\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-190\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-190\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-190.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"setisjoint\"&gt;&lt;a href=\"en/yql/builtins/dict.html#setisjoint\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SetIsDisjoint&lt;/span&gt;&lt;/a&gt;SetIsDisjoint&lt;/h2&gt;\n&lt;h4 id=\"signature10\"&gt;&lt;a href=\"en/yql/builtins/dict.html#signature10\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signature&lt;/span&gt;&lt;/a&gt;Signature&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SetIsDisjoint(Dict&amp;lt;K,V1&amp;gt;, Dict&amp;lt;K,V2&amp;gt;)-&amp;gt;Bool\nSetIsDisjoint(Dict&amp;lt;K,V1&amp;gt;?, Dict&amp;lt;K,V2&amp;gt;)-&amp;gt;Bool?\nSetIsDisjoint(Dict&amp;lt;K,V1&amp;gt;, Dict&amp;lt;K,V2&amp;gt;?)-&amp;gt;Bool?\nSetIsDisjoint(Dict&amp;lt;K,V1&amp;gt;?, Dict&amp;lt;K,V2&amp;gt;?)-&amp;gt;Bool?\n\nSetIsDisjoint(Dict&amp;lt;K,V1&amp;gt;, List&amp;lt;K&amp;gt;)-&amp;gt;Bool\nSetIsDisjoint(Dict&amp;lt;K,V1&amp;gt;?, List&amp;lt;K&amp;gt;)-&amp;gt;Bool?\nSetIsDisjoint(Dict&amp;lt;K,V1&amp;gt;, List&amp;lt;K&amp;gt;?)-&amp;gt;Bool?\nSetIsDisjoint(Dict&amp;lt;K,V1&amp;gt;?, List&amp;lt;K&amp;gt;?)-&amp;gt;Bool?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"197\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-197\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-197\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-197.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Checking that the dict and the list or other dict do not intersect by keys.&lt;/p&gt;\n&lt;p&gt;Thus, there are two invocation variants:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;With the &lt;code&gt;Dict&amp;lt;K,V1&amp;gt;&lt;/code&gt; and &lt;code&gt;List&amp;lt;K&amp;gt;&lt;/code&gt; arguments.&lt;/li&gt;\n&lt;li&gt;With the &lt;code&gt;Dict&amp;lt;K,V1&amp;gt;&lt;/code&gt; and &lt;code&gt;Dict&amp;lt;K,V2&amp;gt;&lt;/code&gt; arguments.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"examples10\"&gt;&lt;a href=\"en/yql/builtins/dict.html#examples10\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT SetIsDisjoint(ToSet(AsList(1, 2, 3)), AsList(7, 4)); -- true\nSELECT SetIsDisjoint(ToSet(AsList(1, 2, 3)), ToSet(AsList(3, 4))); -- false\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"219\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-219\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-219\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-219.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"setintersection\"&gt;&lt;a href=\"en/yql/builtins/dict.html#setintersection\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SetIntersection&lt;/span&gt;&lt;/a&gt;SetIntersection&lt;/h2&gt;\n&lt;h4 id=\"signature11\"&gt;&lt;a href=\"en/yql/builtins/dict.html#signature11\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signature&lt;/span&gt;&lt;/a&gt;Signature&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SetIntersection(Dict&amp;lt;K,V1&amp;gt;, Dict&amp;lt;K,V2&amp;gt;)-&amp;gt;Set&amp;lt;K&amp;gt;\nSetIntersection(Dict&amp;lt;K,V1&amp;gt;?, Dict&amp;lt;K,V2&amp;gt;)-&amp;gt;Set&amp;lt;K&amp;gt;?\nSetIntersection(Dict&amp;lt;K,V1&amp;gt;, Dict&amp;lt;K,V2&amp;gt;?)-&amp;gt;Set&amp;lt;K&amp;gt;?\nSetIntersection(Dict&amp;lt;K,V1&amp;gt;?, Dict&amp;lt;K,V2&amp;gt;?)-&amp;gt;Set&amp;lt;K&amp;gt;?\n\nSetIntersection(Dict&amp;lt;K,V1&amp;gt;, Dict&amp;lt;K,V2&amp;gt;, (K,V1,V2)-&amp;gt;U)-&amp;gt;Dict&amp;lt;K,U&amp;gt;\nSetIntersection(Dict&amp;lt;K,V1&amp;gt;?, Dict&amp;lt;K,V2&amp;gt;, (K,V1,V2)-&amp;gt;U)-&amp;gt;Dict&amp;lt;K,U&amp;gt;?\nSetIntersection(Dict&amp;lt;K,V1&amp;gt;, Dict&amp;lt;K,V2&amp;gt;?, (K,V1,V2)-&amp;gt;U)-&amp;gt;Dict&amp;lt;K,U&amp;gt;?\nSetIntersection(Dict&amp;lt;K,V1&amp;gt;?, Dict&amp;lt;K,V2&amp;gt;?, (K,V1,V2)-&amp;gt;U)-&amp;gt;Dict&amp;lt;K,U&amp;gt;?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"226\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-226\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-226\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-226.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Builds an intersection of two dicts by keys.&lt;/p&gt;\n&lt;p&gt;Arguments:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Two dicts: &lt;code&gt;Dict&amp;lt;K,V1&amp;gt;&lt;/code&gt; and &lt;code&gt;Dict&amp;lt;K,V2&amp;gt;&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;An optional function that combines values from the source dicts to build values of the output dict. If the type of this function is &lt;code&gt;(K,V1,V2) -&amp;gt; U&lt;/code&gt;, the result type is &lt;code&gt;Dict&amp;lt;K,U&amp;gt;&lt;/code&gt;. If the function is not set, the result type is &lt;code&gt;Dict&amp;lt;K,Void&amp;gt;&lt;/code&gt; and values from the source dicts are ignored.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"examples11\"&gt;&lt;a href=\"en/yql/builtins/dict.html#examples11\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT SetIntersection(ToSet(AsList(1, 2, 3)), ToSet(AsList(3, 4))); -- { 3 }\nSELECT SetIntersection(\n    AsDict(AsTuple(1, \"foo\"), AsTuple(3, \"bar\")),\n    AsDict(AsTuple(1, \"baz\"), AsTuple(2, \"qwe\")),\n    ($k, $a, $b) -&amp;gt; { RETURN AsTuple($a, $b) });\n-- { 1 : (\"foo\", \"baz\") }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"248\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-248\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-248\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-248.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The &lt;a href=\"en/yql/syntax/expressions.html#lambda\"&gt;lambda function&lt;/a&gt; was used in the example.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"setincludes\"&gt;&lt;a href=\"en/yql/builtins/dict.html#setincludes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SetIncludes&lt;/span&gt;&lt;/a&gt;SetIncludes&lt;/h2&gt;\n&lt;h4 id=\"signature12\"&gt;&lt;a href=\"en/yql/builtins/dict.html#signature12\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signature&lt;/span&gt;&lt;/a&gt;Signature&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SetIncludes(Dict&amp;lt;K,V1&amp;gt;, List&amp;lt;K&amp;gt;)-&amp;gt;Bool\nSetIncludes(Dict&amp;lt;K,V1&amp;gt;?, List&amp;lt;K&amp;gt;)-&amp;gt;Bool?\nSetIncludes(Dict&amp;lt;K,V1&amp;gt;, List&amp;lt;K&amp;gt;?)-&amp;gt;Bool?\nSetIncludes(Dict&amp;lt;K,V1&amp;gt;?, List&amp;lt;K&amp;gt;?)-&amp;gt;Bool?\n\nSetIncludes(Dict&amp;lt;K,V1&amp;gt;, Dict&amp;lt;K,V2&amp;gt;)-&amp;gt;Bool\nSetIncludes(Dict&amp;lt;K,V1&amp;gt;?, Dict&amp;lt;K,V2&amp;gt;)-&amp;gt;Bool?\nSetIncludes(Dict&amp;lt;K,V1&amp;gt;, Dict&amp;lt;K,V2&amp;gt;?)-&amp;gt;Bool?\nSetIncludes(Dict&amp;lt;K,V1&amp;gt;?, Dict&amp;lt;K,V2&amp;gt;?)-&amp;gt;Bool?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"265\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-265\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-265\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-265.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Checking that the keys of the given dict include all the list items or the keys of the second dict.&lt;/p&gt;\n&lt;p&gt;Thus, there are two invocation variants:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;With the &lt;code&gt;Dict&amp;lt;K,V1&amp;gt;&lt;/code&gt; and &lt;code&gt;List&amp;lt;K&amp;gt;&lt;/code&gt; arguments.&lt;/li&gt;\n&lt;li&gt;With the &lt;code&gt;Dict&amp;lt;K,V1&amp;gt;&lt;/code&gt; and &lt;code&gt;Dict&amp;lt;K,V2&amp;gt;&lt;/code&gt; arguments.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"examples12\"&gt;&lt;a href=\"en/yql/builtins/dict.html#examples12\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT SetIncludes(ToSet(AsList(1, 2, 3)), AsList(3, 4)); -- false\nSELECT SetIncludes(ToSet(AsList(1, 2, 3)), ToSet(AsList(2, 3))); -- true\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"287\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-287\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-287\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-287.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"setunion\"&gt;&lt;a href=\"en/yql/builtins/dict.html#setunion\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SetUnion&lt;/span&gt;&lt;/a&gt;SetUnion&lt;/h2&gt;\n&lt;h4 id=\"signature13\"&gt;&lt;a href=\"en/yql/builtins/dict.html#signature13\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signature&lt;/span&gt;&lt;/a&gt;Signature&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SetUnion(Dict&amp;lt;K,V1&amp;gt;, Dict&amp;lt;K,V2&amp;gt;)-&amp;gt;Set&amp;lt;K&amp;gt;\nSetUnion(Dict&amp;lt;K,V1&amp;gt;?, Dict&amp;lt;K,V2&amp;gt;)-&amp;gt;Set&amp;lt;K&amp;gt;?\nSetUnion(Dict&amp;lt;K,V1&amp;gt;, Dict&amp;lt;K,V2&amp;gt;?)-&amp;gt;Set&amp;lt;K&amp;gt;?\nSetUnion(Dict&amp;lt;K,V1&amp;gt;?, Dict&amp;lt;K,V2&amp;gt;?)-&amp;gt;Set&amp;lt;K&amp;gt;?\n\nSetUnion(Dict&amp;lt;K,V1&amp;gt;, Dict&amp;lt;K,V2&amp;gt;,(K,V1?,V2?)-&amp;gt;U)-&amp;gt;Dict&amp;lt;K,U&amp;gt;\nSetUnion(Dict&amp;lt;K,V1&amp;gt;?, Dict&amp;lt;K,V2&amp;gt;,(K,V1?,V2?)-&amp;gt;U)-&amp;gt;Dict&amp;lt;K,U&amp;gt;?\nSetUnion(Dict&amp;lt;K,V1&amp;gt;, Dict&amp;lt;K,V2&amp;gt;?,(K,V1?,V2?)-&amp;gt;U)-&amp;gt;Dict&amp;lt;K,U&amp;gt;?\nSetUnion(Dict&amp;lt;K,V1&amp;gt;?, Dict&amp;lt;K,V2&amp;gt;?,(K,V1?,V2?)-&amp;gt;U)-&amp;gt;Dict&amp;lt;K,U&amp;gt;?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"294\"&gt;\n
