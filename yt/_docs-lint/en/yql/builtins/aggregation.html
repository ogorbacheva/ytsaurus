gt;\n                    &lt;animate id=\"hideAnimation-437\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-437.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"histogram\"&gt;&lt;a href=\"en/yql/builtins/aggregation.html#histogram\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HISTOGRAM&lt;/span&gt;&lt;/a&gt;HISTOGRAM&lt;/h2&gt;\n&lt;h4 id=\"signature16\"&gt;&lt;a href=\"en/yql/builtins/aggregation.html#signature16\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signature&lt;/span&gt;&lt;/a&gt;Signature&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;HISTOGRAM(Double?)-&amp;gt;HistogramStruct?\nHISTOGRAM(Double?, weight:Double)-&amp;gt;HistogramStruct?\nHISTOGRAM(Double?, intervals:Uint32)-&amp;gt;HistogramStruct?\nHISTOGRAM(Double?, weight:Double, intervals:Uint32)-&amp;gt;HistogramStruct?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"444\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-444\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-444\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-444.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;In the description of signatures, HistogramStruct means the result of an aggregate function that is a structure of a certain form.&lt;/p&gt;\n&lt;p&gt;Building an approximate histogram by a numerical expression with automatic selection of baskets.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"en/yql/udf/list/histogram.html\"&gt;Auxiliary functions&lt;/a&gt;&lt;/p&gt;\n&lt;h3 id=\"basic-settings\"&gt;&lt;a href=\"en/yql/builtins/aggregation.html#basic-settings\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Basic settings&lt;/span&gt;&lt;/a&gt;Basic settings&lt;/h3&gt;\n&lt;p&gt;The limit on the number of baskets can be set using the optional argument, the default value is 100. Note that the additional accuracy costs additional computing resources and may have a negative impact on the query execution time and in extreme cases — on its success.&lt;/p&gt;\n&lt;h3 id=\"weight-support\"&gt;&lt;a href=\"en/yql/builtins/aggregation.html#weight-support\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Weight support&lt;/span&gt;&lt;/a&gt;Weight support&lt;/h3&gt;\n&lt;p&gt;You can specify \"weight\" for each value involved in building the histogram. To do this, you must pass a weight calculation expression to the aggregate function as the second argument. The default weight value is always &lt;code&gt;1.0&lt;/code&gt;. If non-standard weights are used, the limit on the number of baskets can be set by the third argument.&lt;/p&gt;\n&lt;p&gt;If two arguments are passed, the meaning of the second argument is determined by its type (integer literal — the limit on the number of baskets, otherwise — weight).&lt;/p&gt;\n&lt;h3 id=\"if-you-need-an-accurate-histogram\"&gt;&lt;a href=\"en/yql/builtins/aggregation.html#if-you-need-an-accurate-histogram\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;If you need an accurate histogram&lt;/span&gt;&lt;/a&gt;If you need an accurate histogram&lt;/h3&gt;\n&lt;ol&gt;\n&lt;li&gt;You can use the aggregate functions described below with fixed basket grids: &lt;a href=\"en/yql/builtins/aggregation.html#linearhistogram\"&gt;LinearHistogram&lt;/a&gt; or &lt;a href=\"en/yql/builtins/aggregation.html#linearhistogram\"&gt;LogarithmicHistogram&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;You can calculate the basket number for each row and perform &lt;a href=\"en/yql/syntax/group_by.html\"&gt;GROUP BY&lt;/a&gt; on it.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;When the &lt;a href=\"en/yql/builtins/basic.html#aggregationfactory\"&gt;aggregate function factory&lt;/a&gt; is used, &lt;a href=\"en/yql/builtins/aggregation.html#aggregate-by\"&gt;Tuple&lt;/a&gt; of the value and weight is passed as the first &lt;code&gt;AGGREGATE_BY&lt;/code&gt; argument.&lt;/p&gt;\n&lt;h4 id=\"examples15\"&gt;&lt;a href=\"en/yql/builtins/aggregation.html#examples15\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    HISTOGRAM(numeric_column)\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"490\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-490\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-490\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-490.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    Histogram::Print(\n        HISTOGRAM(numeric_column, 10),\n        50\n    )\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"491\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-491\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-491\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-491.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$hist_factory = AggregationFactory(\"HISTOGRAM\");\n\nSELECT\n    AGGREGATE_BY(AsTuple(numeric_column, 1.0), $hist_factory)\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"492\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-492\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-492\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-492.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"linearhistogram\"&gt;&lt;a href=\"en/yql/builtins/aggregation.html#linearhistogram\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LinearHistogram, LogarithmicHistogram and LogHistogram&lt;/span&gt;&lt;/a&gt;LinearHistogram, LogarithmicHistogram and LogHistogram&lt;/h2&gt;\n&lt;p&gt;Building a histogram based on an explicitly specified fixed scale of baskets.&lt;/p&gt;\n&lt;h4 id=\"signature17\"&gt;&lt;a href=\"en/yql/builtins/aggregation.html#signature17\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signature&lt;/span&gt;&lt;/a&gt;Signature&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;LinearHistogram(Double?)-&amp;gt;HistogramStruct?\nLinearHistogram(Double? [, binSize:Double [, min:Double [, max:Double]]])-&amp;gt;HistogramStruct?\n\nLogarithmicHistogram(Double?)-&amp;gt;HistogramStruct?\nLogarithmicHistogram(Double? [, logBase:Double [, min:Double [, max:Double]]])-&amp;gt;HistogramStruct?\nLogHistogram(Double?)-&amp;gt;HistogramStruct?\nLogHistogram(Double? [, logBase:Double [, min:Double [, max:Double]]])-&amp;gt;HistogramStruct?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"502\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-502\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-502\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-502.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Arguments:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;An expression whose value is used to build a histogram. All subsequent ones are optional.&lt;/li&gt;\n&lt;li&gt;Distance between baskets for &lt;code&gt;LinearHistogram&lt;/code&gt; or a logarithm base for &lt;code&gt;LogarithmicHistogram&lt;/code&gt;/&lt;code&gt;LogHistogram&lt;/code&gt; (these are aliases). In both cases, the default value is 10.&lt;/li&gt;\n&lt;li&gt;Minimum value. The default value is minus infinity.&lt;/li&gt;\n&lt;li&gt;Maximum value. The default value is plus infinity.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;The result format is completely similar to &lt;a href=\"en/yql/builtins/aggregation.html#histogram\"&gt;adaptive histograms&lt;/a&gt;, which enables you to use the same &lt;a href=\"en/yql/udf/list/histogram.html\"&gt;set of auxiliary functions&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;If the variation of input values is uncontrollably large, we recommend specifying a minimum and a maximum value to prevent potential drops due to high memory consumption.&lt;/p&gt;\n&lt;h4 id=\"examples16\"&gt;&lt;a href=\"en/yql/builtins/aggregation.html#examples16\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    LogarithmicHistogram(numeric_column, 2)\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"537\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-537\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-537\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-537.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"histogramcdf\"&gt;&lt;a href=\"en/yql/builtins/aggregation.html#histogramcdf\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CDF (cumulative distribution function)&lt;/span&gt;&lt;/a&gt;CDF (cumulative distribution function)&lt;/h2&gt;\n&lt;p&gt;You can assign a CDF suffix to each Histogram function type to build a cumulative distribution function. Constructions&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    Histogram::ToCumulativeDistributionFunction(Histogram::Normalize(&amp;lt;function_type&amp;gt;Histogram(numeric_column)))\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"544\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-544\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-544\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-544.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;and&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    &amp;lt;function_type&amp;gt;HistogramCDF(numeric_column)\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"548\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-548\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-548\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-548.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;are completely equivalent.&lt;/p&gt;\n&lt;h2 id=\"bool-and-or-xor\"&gt;&lt;a href=\"en/yql/builtins/aggregation.html#bool-and-or-xor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BOOL_AND, BOOL_OR and BOOL_XOR&lt;/span&gt;&lt;/a&gt;BOOL_AND, BOOL_OR and BOOL_XOR&lt;/h2&gt;\n&lt;h4 id=\"signature18\"&gt;&lt;a href=\"en/yql/builtins/aggregation.html#signature18\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Signature&lt;/span&gt;&lt;/a&gt;Signature&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;BOOL_AND(Bool?)-&amp;gt;Bool?\nBOOL_OR(Bool?)-&amp;gt;Bool?\nBOOL_XOR(Bool?)-&amp;gt;Bool?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"558\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-558\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-558\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-558.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Applying the appropriate logical operation (&lt;code&gt;AND&lt;/code&gt;/&lt;code&gt;OR&lt;/code&gt;/&lt;code&gt;XOR&lt;/code&gt;) to all values of a boolean column or expression.&lt;/p&gt;\n&lt;p&gt;Unlike the majority of aggregate functions, these functions &lt;strong&gt;do not skip&lt;/strong&gt; &lt;code&gt;NULL&lt;/code&gt; during aggregation and use the following rules:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;true AND null == null&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;false OR null == null&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;For &lt;code&gt;BOOL_AND&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;For any number of &lt;code&gt;true&lt;/code&gt; values and at least one &lt;code&gt;NULL&lt;/code&gt; value, the result is &lt;code&gt;NULL&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;For at least one &lt;code&gt;false&lt;/code&gt; value, the result is &lt;code&gt;false&lt;/code&gt; regardless of whether there are any &lt;code&gt;NULL&lt;/code&gt; values.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;For &lt;code&gt;BOOL_OR&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;For any number of &lt;code&gt;false&lt;/code&gt; values and at least one &lt;code&gt;NULL&lt;/code&gt; value, the result is &lt;code&gt;NULL&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;For at least one &lt;code&gt;true&lt;/code&gt; value, the result is &lt;code&gt;true&lt;/code&gt; regardless of whether there are any &lt;code&gt;NULL&lt;/code&gt; values.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;For &lt;code&gt;BOOL_XOR&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;For at least one &lt;code&gt;NULL&lt;/code&gt; value, the result is &lt;code&gt;NULL&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Examples of such behavior are given below.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;MIN&lt;/code&gt;/&lt;code&gt;MAX&lt;/code&gt; or &lt;code&gt;BIT_AND&lt;/code&gt;/&lt;code&gt;BIT_OR&lt;/code&gt;/&lt;code&gt;BIT_XOR&lt;/code&gt; functions can be used for aggregation with &lt;code&gt;NULL&lt;/code&gt; skips.&lt;/p&gt;\n&lt;h4 id=\"examples17\"&gt;&lt;a href=\"en/yql/builtins/aggregation.html#examples17\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$data = [\n    &amp;lt;|nonNull: true, nonFalse: true, nonTrue: NULL, anyVal: true|&amp;gt;,\n    &amp;lt;|nonNull: false, nonFalse: NULL, nonTrue: NULL, anyVal: NULL|&amp;gt;,\n    &amp;lt;|nonNull: false, nonFalse: NULL, nonTrue: false, anyVal: false|&amp;gt;,\n];\n\nSELECT\n    BOOL_AND(nonNull) as nonNullAnd,      -- false\n    BOOL_AND(nonFalse) as nonFalseAnd,    -- NULL\n    BOOL_AND(nonTrue) as nonTrueAnd,      -- false\n    BOOL_AND(anyVal) as anyAnd,           -- false\n    BOOL_OR(nonNull) as nonNullOr,        -- true\n    BOOL_OR(nonFalse) as nonFalseOr,      -- true\n    BOOL_OR(nonTrue) as nonTrueOr,        -- NULL\n    BOOL_OR(anyVal) as anyOr,             -- true\n    BOOL_XOR(nonNull) as nonNullXor,      -- true\n    BOOL_XOR(nonFalse) as nonFalseXor,    -- NULL\n    BOOL_XOR(nonTrue) as nonTrueXor,      -- NULL\n    BOOL_XOR(anyVal) as anyXor,           -- NULL\nFROM AS_TABLE($data);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"626\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-626\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-626\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-626.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"bit-and-or-xor\"&gt;&lt;a href=\"en/yql/builtins/aggregation.html#bit-and-or-xor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BIT_AND, BIT_OR, and BIT_XOR&lt;/span&gt;&lt;/a&gt;BIT_AND, BIT_OR, and BIT_XOR&lt;/h2&gt;\n&lt;p&gt;Applying the appropriate bitwise operation to all values of a numeric column or expression.&lt;/p&gt;\n&lt;h4 id=\"examples18\"&gt;&lt;a href=\"en/yql/builtins/aggregation.html#examples18\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    BIT_XOR(unsigned_numeric_value)\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"636\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-636\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-636\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-636.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"session-start\"&gt;&lt;a href=\"en/yql/builtins/aggregation.html#session-start\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SessionStart&lt;/span&gt;&lt;/a&gt;SessionStart&lt;/h2&gt;\n&lt;p&gt;Without arguments. Only allowed if there is &lt;a href=\"en/yql/syntax/group_by.html#session-window\"&gt;SessionWindow&lt;/a&gt; in&lt;br /&gt;\n&lt;a href=\"en/yql/syntax/group_by.html\"&gt;GROUP BY&lt;/a&gt;/&lt;a href=\"en/yql/syntax/window.html#partition\"&gt;PARTITION BY&lt;/a&gt;.&lt;br /&gt;\nReturns the value of the &lt;code&gt;SessionWindow&lt;/code&gt; key column. In case of &lt;code&gt;SessionWindow&lt;/code&gt; with two arguments — the minimum value of the first argument within a group/partition.&lt;br /&gt;\nIn case of the extended variant of &lt;code&gt;SessionWindoow&lt;/code&gt; — the value of the second tuple item returned by &lt;code&gt;&amp;lt;calculate_lambda&amp;gt;&lt;/code&gt; when the first tuple item is &lt;code&gt;True&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"aggregate-by\"&gt;&lt;a href=\"en/yql/builtins/aggregation.html#aggregate-by\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AGGREGATE_BY and MULTI_AGGREGATE_BY&lt;/span&gt;&lt;/a&gt;AGGREGATE_BY and MULTI_AGGREGATE_BY&lt;/h2&gt;\n&lt;p&gt;Applying the &lt;a href=\"en/yql/builtins/basic.html#aggregationfactory\"&gt;aggregate function factory&lt;/a&gt; to all column or expression values. The &lt;code&gt;MULTI_AGGREGATE_BY&lt;/code&gt; function requires a structure, tuple, or list in a column or expression value and applies the factory on an item-by-item basis, placing the result in a container of the same form. If different column or expression values contain lists of different lengths, the resulting list will have the smallest of the lengths of those lists.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Column, &lt;code&gt;DISTINCT&lt;/code&gt; column, or expression.&lt;/li&gt;\n&lt;li&gt;Factory.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"examples19\"&gt;&lt;a href=\"en/yql/builtins/aggregation.html#examples19\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$count_factory = AggregationFactory(\"COUNT\");\n\nSELECT\n    AGGREGATE_BY(DISTINCT column, $count_factory) as uniq_count\nFROM my_table;\n\nSELECT\n    MULTI_AGGREGATE_BY(nums, AggregationFactory(\"count\")) as count,\n    MULTI_AGGREGATE_BY(nums, AggregationFactory(\"min\")) as min,\n    MULTI_AGGREGATE_BY(nums, AggregationFactory(\"max\")) as max,\n    MULTI_AGGREGATE_BY(nums, AggregationFactory(\"avg\")) as avg,\n    MULTI_AGGREGATE_BY(nums, AggregationFactory(\"percentile\", 0.9)) as p90\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"664\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-664\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-664\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-664.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"udaf\"&gt;&lt;a href=\"en/yql/builtins/aggregation.html#udaf\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;UDAF&lt;/span&gt;&lt;/a&gt;UDAF&lt;/h2&gt;\n&lt;p&gt;If the above aggregate functions were not enough for some reason, YQL has a mechanism for describing custom aggregate functions. For more information, &lt;a href=\"en/yql/recipes/udaf.html\"&gt;see the article&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/builtins/aggregation.md","sourcePath":"en/yql/builtins/aggregation.md"},"headings":[{"title":"COUNT","href":"en/yql/builtins/aggregation.html#count","level":2},{"title":"MIN and MAX","href":"en/yql/builtins/aggregation.html#min-max","level":2},{"title":"SUM","href":"en/yql/builtins/aggregation.html#sum","level":2},{"title":"AVG","href":"en/yql/builtins/aggregation.html#avg","level":2},{"title":"COUNT_IF","href":"en/yql/builtins/aggregation.html#count-if","level":2},{"title":"SUM_IF and AVG_IF","href":"en/yql/builtins/aggregation.html#sum-if","level":2},{"title":"SOME","href":"en/yql/builtins/aggregation.html#some","level":2},{"title":"CountDistinctEstimate, HyperLogLog and HLL","href":"en/yql/builtins/aggregation.html#countdistinctestimate","level":2},{"title":"AGGREGATE_LIST","href":"en/yql/builtins/aggregation.html#agg-list","level":2},{"title":"MAX_BY and MIN_BY","href":"en/yql/builtins/aggregation.html#max-min-by","level":2},{"title":"TOP and BOTTOM","href":"en/yql/builtins/aggregation.html#top-bottom","level":2},{"title":"TOP_BY and BOTTOM_BY","href":"en/yql/builtins/aggregation.html#top-bottom-by","level":2},{"title":"TOPFREQ and MODE","href":"en/yql/builtins/aggregation.html#topfreq-mode","level":2},{"title":"STDDEV and VARIANCE","href":"en/yql/builtins/aggregation.html#stddev-variance","level":2},{"title":"CORRELATION and COVARIANCE","href":"en/yql/builtins/aggregation.html#correlation-covariance","level":2},{"title":"PERCENTILE and MEDIAN","href":"en/yql/builtins/aggregation.html#percentile-median","level":2},{"title":"HISTOGRAM","href":"en/yql/builtins/aggregation.html#histogram","level":2,"items":[{"title":"Basic settings","href":"en/yql/builtins/aggregation.html#basic-settings","level":3},{"title":"Weight support","href":"en/yql/builtins/aggregation.html#weight-support","level":3},{"title":"If you need an accurate histogram","href":"en/yql/builtins/aggregation.html#if-you-need-an-accurate-histogram","level":3,"items":[{"title":"Examples","href":"en/yql/builtins/aggregation.html#examples15","level":4}]}]},{"title":"LinearHistogram, LogarithmicHistogram and LogHistogram","href":"en/yql/builtins/aggregation.html#linearhistogram","level":2},{"title":"CDF (cumulative distribution function)","href":"en/yql/builtins/aggregation.html#histogramcdf","level":2},{"title":"BOOL_AND, BOOL_OR and BOOL_XOR","href":"en/yql/builtins/aggregation.html#bool-and-or-xor","level":2},{"title":"BIT_AND, BIT_OR, and BIT_XOR","href":"en/yql/builtins/aggregation.html#bit-and-or-xor","level":2},{"title":"SessionStart","href":"en/yql/builtins/aggregation.html#session-start","level":2},{"title":"AGGREGATE_BY and MULTI_AGGREGATE_BY","href":"en/yql/builtins/aggregation.html#aggregate-by","level":2},{"title":"UDAF","href":"en/yql/builtins/aggregation.html#udaf","level":2}],"title":"Aggregate functions"},"router":{"pathname":"en/yql/builtins/aggregation","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"sear
