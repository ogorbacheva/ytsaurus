        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;YQL (Yandex Query Language) is a language of universal declarative queries against data storage and processing systems as well as an infrastructure to run such queries. YQL benefits include:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;A powerful graph execution engine that can build MapReduce pipelines with hundreds of nodes and adapt during computation.&lt;/li&gt;\n&lt;li&gt;Ability to build complex data processing pipelines using SQL by storing subqueries in variables as chains of dependent queries and transactions.&lt;/li&gt;\n&lt;li&gt;Predictable parallel execution of queries of any complexity.&lt;/li&gt;\n&lt;li&gt;Efficient implementation of joins, subqueries, and window functions with no restrictions on their topology or nesting.&lt;/li&gt;\n&lt;li&gt;Extensive function library.&lt;/li&gt;\n&lt;li&gt;Support for user-defined functions in &lt;a href=\"en/yql/udf/cpp.html\"&gt;C++&lt;/a&gt;, &lt;a href=\"en/yql/udf/python.html\"&gt;Python&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Automatic execution of small parts of queries on prepared compute instances, bypassing MapReduce operations to reduce latency.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;YQL provides a functional web interface where, among other things, you can:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Write query code.&lt;/li&gt;\n&lt;li&gt;Start and stop query execution.&lt;/li&gt;\n&lt;li&gt;View query execution results.&lt;/li&gt;\n&lt;li&gt;View query history.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"how-to-try\"&gt;&lt;a href=\"en/yql/index.html#how-to-try\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How to try&lt;/span&gt;&lt;/a&gt;How to try&lt;/h2&gt;\n&lt;p&gt;To run your first YQL query:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Open the web interface of the YTsaurus cluster  and go to the &lt;strong&gt;Queries&lt;/strong&gt; tab — you can get there from the menu on the left.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Enter the query and click the start button:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT \"Hello, World!\";\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"81\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-81\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-81\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-81.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;img src=\"images/yql-how-to-try.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"glossary\"&gt;&lt;a href=\"en/yql/index.html#glossary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Glossary&lt;/span&gt;&lt;/a&gt;Glossary&lt;/h2&gt;\n&lt;table&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;strong&gt;Term&lt;/strong&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;strong&gt;English translation&lt;/strong&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;Query&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Query&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Program text in YQL&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;Operation&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Operation&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Query execution process. In YQL terminology, a query and an operation relate to each other much like a program and a process do in an operating system.&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;Table&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Table&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Logically, a table is a list of structures (&lt;code&gt;List&amp;lt;Struct&amp;lt;...&amp;gt;&amp;gt;&lt;/code&gt;) that is a basic primitive for processing large volumes of data in YQL.&lt;/p&gt;\n&lt;p&gt;List items form rows, while structure members serve as table cells. Vertically aligned cells constitute a table column.&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;Expression&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Expression&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;A computed value. Typically, it takes one or more table cells as input, with the output becoming a cell in another table. Examples:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;2 * 2;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;String::ToUpper(\"hi, \" \\|\\| name \\|\\| \"!\")&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;Statement&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Statement&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Query components separated by semicolons and starting with a verb. Examples:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;SELECT ...;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;INSERT INTO ... SELECT ... ;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;REDUCE ... USING ... ON ...;&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;Subquery&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Subquery&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;A query component that, similarly to tables, can be used as input for statements or other subqueries. Optionally, subqueries can be &lt;a href=\"en/syntax/subquery.html\"&gt;parameterized&lt;/a&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;Named node&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Named node&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;A mechanism for reusing expressions and subqueries within one query. &lt;a href=\"en/syntax/expressions.html#named-nodes\"&gt;More&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;Examples:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;$foo = 2 + 2;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;$bar = (SELECT bar FROM my_table);&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;Lambda&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Lambda&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;A parameterizable block consisting of one or more named nodes (specifically expressions, not statements) where the result of the last node becomes the result of the entire lambda call. The call is made by passing parameters in parentheses. &lt;a href=\"en/syntax/expressions.html#lambda\"&gt;Learn more&lt;/a&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;UDF (User-Defined Function)&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;UDF (User-Defined Function)&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Functions that let you integrate business logic into a query using one of the supported popular programming languages.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"en/udf/cpp.html\"&gt;C++&lt;/a&gt; UDFs are loaded in compiled &lt;code&gt;.so&lt;/code&gt; format, with a wide range of &lt;a href=\"en/udf/list/pcre.html\"&gt;built-in&lt;/a&gt; functions available as well. &lt;a href=\"en/udf/python.html\"&gt;Python&lt;/a&gt; UDFs can use a script from any query string, but require additional description of their signature.&lt;/p&gt;\n&lt;p&gt;Since the YQL optimizer can't peek inside the Python interpreter, &lt;strong&gt;we recommend using lambda functions and C++ UDFs&lt;/strong&gt; for better performance.&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;Action&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Action&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;A parameterizable block consisting of one or multiple statements that can then be invoked any number of times using special keywords. Unlike lambda functions, they &lt;strong&gt;don't&lt;/strong&gt; return any result. &lt;a href=\"en/syntax/action.html\"&gt;Learn more&lt;/a&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;Library&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;Library&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;A query component stored in a separate file for reuse or convenience. &lt;a href=\"en/syntax/export_import.html\"&gt;Learn more&lt;/a&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/index.md","sourcePath":"en/yql/index.md"},"headings":[{"title":"How to try","href":"en/yql/index.html#how-to-try","level":2},{"title":"Glossary","href":"en/yql/index.html#glossary","level":2}],"title":"Introduction"},"router":{"pathname":"en/yql/index","depth":3,"base":"../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
