        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"changes-in-yql-versions\"&gt;&lt;a href=\"en/yql/changelog/index.html#changes-in-yql-versions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Changes in YQL versions&lt;/span&gt;&lt;/a&gt;Changes in YQL versions&lt;/h2&gt;\n&lt;p&gt;This section contains a list of changes in different versions of the YQL&lt;/p&gt;\n&lt;h2 id=\"general-description-of-yql-versions\"&gt;&lt;a href=\"en/yql/changelog/index.html#general-description-of-yql-versions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General description of YQL versions&lt;/span&gt;&lt;/a&gt;General description of YQL versions&lt;/h2&gt;\n&lt;p&gt;The goal of language versioning is a controlled and user-safe evolution of the language, within which it is possible to:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;add new features;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;change default values ​​for pragmas or perform other non-backward-compatible changes;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;remove obsolete features.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The starting version of the language is &lt;code&gt;2025.01&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Once a year, a new version of the language is released, called &lt;code&gt;YEAR.X&lt;/code&gt;, for example &lt;code&gt;2025.01&lt;/code&gt;. Other versions in the same year will increase the minor version number (&lt;code&gt;YEAR.02&lt;/code&gt;, etc.).&lt;/p&gt;\n&lt;p&gt;For each version of the type &lt;code&gt;YEAR.X&lt;/code&gt; &lt;strong&gt;support is guaranteed for three years with the preservation of semantics and bug fixes&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;When version &lt;code&gt;YEAR+2.1&lt;/code&gt; is released, a warning is issued for all versions of the type &lt;code&gt;YEAR.X&lt;/code&gt; that they will soon cease to be supported.&lt;/p&gt;\n&lt;p&gt;When version &lt;code&gt;YEAR+3.1&lt;/code&gt; is released, a warning is issued for all versions of the type &lt;code&gt;YEAR.X&lt;/code&gt; that they are not supported and query execution is not guaranteed.&lt;/p&gt;\n&lt;p&gt;When specifying a version of &lt;code&gt;YEAR.X&lt;/code&gt; greater than what is currently available in some service/library/tool, a query error is issued.&lt;/p&gt;\n&lt;p&gt;When each version is released, the documentation in the changelog indicates the changes included in this version and recommendations for migration.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/changelog/index.md","sourcePath":"en/yql/changelog/index.md"},"headings":[{"title":"Changes in YQL versions","href":"en/yql/changelog/index.html#changes-in-yql-versions","level":2},{"title":"General description of YQL versions","href":"en/yql/changelog/index.html#general-description-of-yql-versions","level":2}],"title":""},"router":{"pathname":"en/yql/changelog/index","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
