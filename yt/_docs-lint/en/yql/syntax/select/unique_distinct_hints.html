            {"data":{"leading":false,"html":"&lt;p&gt;Directly after &lt;code&gt;SELECT&lt;/code&gt;, it is possible to add &lt;a href=\"en/yql/syntax/lexer.html#sql-hints\"&gt;SQL hints&lt;/a&gt; &lt;code&gt;unique&lt;/code&gt; or &lt;code&gt;distinct&lt;/code&gt;, which declare that this projection generates data containing unique values in the specified set of columns of a row-based or columnar table. This can be used to optimize subsequent subqueries executed on this projection, or for writing to table meta-attributes during &lt;code&gt;INSERT&lt;/code&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Columns are specified in the hint values, separated by spaces.&lt;/li&gt;\n&lt;li&gt;If the set of columns is not specified, uniqueness applies to the entire set of columns in this projection.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;unique&lt;/code&gt; - indicates unique or &lt;code&gt;null&lt;/code&gt; values. According to the SQL standard, each null is unique: &lt;code&gt;NULL = NULL&lt;/code&gt; -&amp;gt; &lt;code&gt;NULL&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;distinct&lt;/code&gt; - indicates completely unique values including null: &lt;code&gt;NULL IS DISTINCT FROM NULL&lt;/code&gt; -&amp;gt; &lt;code&gt;FALSE&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Multiple sets of columns can be specified in several hints for a single projection.&lt;/li&gt;\n&lt;li&gt;If the hint contains a column that is not in the projection, it will be ignored.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/syntax/select/unique_distinct_hints.md","sourcePath":"en/yql/syntax/select/unique_distinct_hints.md"},"headings":[],"title":"UNIQUE DISTINCT hints"},"router":{"pathname":"en/yql/syntax/select/unique_distinct_hints","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html",
