        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"define-subquery\"&gt;&lt;a href=\"en/yql/syntax/subquery.html#define-subquery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DEFINE SUBQUERY&lt;/span&gt;&lt;/a&gt;DEFINE SUBQUERY&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;DEFINE SUBQUERY&lt;/code&gt; lets you declare a subquery template that is a parameterizable block of several top-level expressions (statements), and then use it repeatedly in the &lt;code&gt;FROM&lt;/code&gt; section of &lt;a href=\"en/yql/syntax/select/index.html\"&gt;SELECT&lt;/a&gt; statements or as input data in &lt;a href=\"en/yql/syntax/process.html\"&gt;PROCESS&lt;/a&gt;/&lt;a href=\"en/yql/syntax/reduce.html\"&gt;REDUCE&lt;/a&gt; with parameters.&lt;br /&gt;\nAs opposed to &lt;a href=\"en/yql/syntax/action.html\"&gt;actions&lt;/a&gt;, the subquery template must end with the &lt;code&gt;SELECT&lt;/code&gt;/&lt;code&gt;PROCESS&lt;/code&gt;/&lt;code&gt;REDUCE&lt;/code&gt; statement whose result is the subquery's return value. Keep in mind that you can't use the top-level &lt;code&gt;SELECT&lt;/code&gt;/&lt;code&gt;PROCESS&lt;/code&gt;/&lt;code&gt;REDUCE&lt;/code&gt; statement and the modifying expressions (for example, &lt;code&gt;INSERT&lt;/code&gt;) more than once.&lt;/p&gt;\n&lt;p&gt;After &lt;code&gt;DEFINE SUBQUERY&lt;/code&gt;, specify:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/expressions.html#named-nodes\"&gt;A named expression&lt;/a&gt; that will be used to access the declared template further in the query.&lt;/li&gt;\n&lt;li&gt;The round brackets contain a list of named expressions you can use to access parameters inside the subquery template.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;AS&lt;/code&gt; keyword.&lt;/li&gt;\n&lt;li&gt;The list of top-level expressions.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;END DEFINE&lt;/code&gt; acts as a marker of the last expression inside the subquery template.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;One or more of the last subquery parameters can be marked with a question as optional: unless they haven't been specified when calling subquery, they will be assigned the &lt;code&gt;NULL&lt;/code&gt; value.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In large queries, you can use separate files for action definition and include them to the main query using &lt;a href=\"en/yql/syntax/export_import.html#export\"&gt;EXPORT&lt;/a&gt; + &lt;a href=\"en/yql/syntax/export_import.html#import\"&gt;IMPORT&lt;/a&gt; so that instead of one long text you can have several logical parts that are easier to navigate. An important nuance: the &lt;code&gt;USE my_cluster&lt;/code&gt;; directive in the import query doesn't affect behavior of actions declared in other subquery files.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Even if the list of parameters in the subquery template definition is empty, when using it in &lt;code&gt;FROM&lt;/code&gt;, specify the parentheses &lt;code&gt;()&lt;/code&gt;. This may help to limit the scope of named expressions used in only one subquery.&lt;/p&gt;\n&lt;p&gt;In some cases, instead of &lt;code&gt;DEFINE SUBQUERY&lt;/code&gt; it's more convenient to use an equivalent &lt;a href=\"en/yql/syntax/expressions.html#lambda\"&gt;lambda function&lt;/a&gt;. In this case, the lambda function must accept, as the first argument, the special object called &lt;code&gt;world&lt;/code&gt; that passes dependencies to make certain PRAGMA or COMMIT statements visible at the query template's point of use. Also, make sure to pass this object as the first argument along with the other arguments (if any) to other query templates, if you use them in your lambda function.&lt;br /&gt;\nThe return value of the lambda function must have the structure list type (output table) or a list of variants over a tuple of structures (multiple output tables). In the latter case, the following unpacking is usually used at the query template's point of use:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$out1, $out2 = PROCESS $mySubquery($myParam1, $myParam2);\n-- next we use $out1 and $out2 as separate tables.\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"55\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-55\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-55\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-55.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"examples\"&gt;&lt;a href=\"en/yql/syntax/subquery.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DEFINE SUBQUERY $hello_world($name, $suffix?) AS\n    $name = $name ?? ($suffix ?? \"world\");\n    SELECT \"Hello, \" || $name || \"!\";\nEND DEFINE;\n\nSELECT * FROM $hello_world(NULL); -- Hello, world!\nSELECT * FROM $hello_world(\"John\"); -- Hello, John!\nSELECT * FROM $hello_world(NULL, \"Earth\"); -- Hello, Earth!\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"59\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-59\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-59\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-59.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DEFINE SUBQUERY $dup($x) AS\n   SELECT * FROM $x(1) -- apply the passed query template with one argument\n   UNION ALL\n   SELECT * FROM $x(2); -- ... and with other argument\nEND DEFINE;\n\nDEFINE SUBQUERY $sub($n) AS\n   SELECT $n * 10;\nEND DEFINE;\n\nSELECT * FROM $dup($sub); -- pass the query template $sub as a parameter\n-- Result:\n-- 10\n-- 20\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"60\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-60\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-60\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-60.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;/* Hide the named expressions $a and $b inside a separate scope */\nDEFINE SUBQUERY $clean() AS\n   $a = 10;\n   $b = $a * $a;\n   SELECT $a AS a, $b AS b;\nEND DEFINE;\n\nSELECT * FROM $clean(); -- a: 10, b: 100\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"61\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-61\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-61\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-61.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE my_cluster;\n\nDEFINE SUBQUERY $input() as\n    SELECT * FROM `home/yql/tutorial/users`;\nEND DEFINE;\n\nDEFINE SUBQUERY $myProcess1($nestedQuery, $lambda) AS\n    PROCESS $nestedQuery() -- the parentheses () are mandatory here\n    USING $lambda(TableRow());\nEND DEFINE;\n\n$myProcess2 = ($world, $nestedQuery, $lambda) -&amp;gt; {\n    -- If you use ListFlatMap or YQL::OrderedFlatMap, you get an Ordered YT Map operation\n    return YQL::FlatMap($nestedQuery($world), $lambda);\n};\n\n-- With such use, the implementations of $myProcess1 and $myProcess2 are identical\nSELECT * FROM $myProcess1($input, ($x) -&amp;gt; { RETURN AsList($x, $x) });\nSELECT * FROM $myProcess2($input, ($x) -&amp;gt; { RETURN AsList($x, $x) });\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"62\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-62\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-62\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-62.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE my_cluster;\n\nDEFINE SUBQUERY $runPartition($table) AS\n    $paritionByAge = ($row) -&amp;gt; {\n        $recordType = TypeOf($row);\n        $varType = VariantType(TupleType($recordType, $recordType));\n        RETURN If($row.age % 2 == 0,\n            Variant($row, \"0\", $varType),\n            Variant($row, \"1\", $varType),\n        );\n    };\n\n    PROCESS $table USING $paritionByAge(TableRow());\nEND DEFINE;\n\n-- Unpacking two results\n$i, $j = (PROCESS $runPartition(\"home/yql/tutorial/users\"));\n\nSELECT * FROM $i;\n\nSELECT * FROM $j;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"63\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-63\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-63\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-63.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"subquery-extend\"&gt;&lt;a id=\"subquery-unionmerge\" href=\"en/yql/syntax/subquery.html#subquery-unionmerge\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SubqueryExtend, SubqueryUnionAll, SubqueryMerge, SubqueryUnionMerge&lt;/span&gt;&lt;/a&gt;&lt;a id=\"subquery-merge\" href=\"en/yql/syntax/subquery.html#subquery-merge\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SubqueryExtend, SubqueryUnionAll, SubqueryMerge, SubqueryUnionMerge&lt;/span&gt;&lt;/a&gt;&lt;a id=\"subquery-unionall\" href=\"en/yql/syntax/subquery.html#subquery-unionall\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SubqueryExtend, SubqueryUnionAll, SubqueryMerge, SubqueryUnionMerge&lt;/span&gt;&lt;/a&gt;&lt;a href=\"en/yql/syntax/subquery.html#subquery-extend\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SubqueryExtend, SubqueryUnionAll, SubqueryMerge, SubqueryUnionMerge&lt;/span&gt;&lt;/a&gt;SubqueryExtend, SubqueryUnionAll, SubqueryMerge, SubqueryUnionMerge&lt;/h2&gt;\n&lt;p&gt;Combining the subquery templates: &lt;code&gt;SubqueryExtend&lt;/code&gt;, &lt;code&gt;SubqueryUnionAll&lt;/code&gt;, &lt;code&gt;SubqueryMerge&lt;/code&gt;, &lt;code&gt;SubqueryUnionMerge&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;These functions combine the results of one or more subquery templates passed by arguments. The number of parameters in such subquery templates must be the same.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;SubqueryExtend&lt;/code&gt; requires matching of subquery schemas.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;SubqueryUnionAll&lt;/code&gt; follows the same rules as &lt;a href=\"en/yql/builtins/list.html#ListUnionAll\"&gt;ListUnionAll&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;SubqueryMerge&lt;/code&gt; uses the same constraints as &lt;code&gt;SubqueryExtend&lt;/code&gt; and also outputs a sorted result if all subqueries have the same sort order.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;SubqueryUnionMerge&lt;/code&gt; uses the same constraints as &lt;code&gt;SubqueryUnionAll&lt;/code&gt; and also outputs a sorted result if all subqueries have the same sort order.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"examples1\"&gt;&lt;a href=\"en/yql/syntax/subquery.html#examples1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DEFINE SUBQUERY $sub1() as\n    SELECT 1 as x;\nEND DEFINE;\n\nDEFINE SUBQUERY $sub2() as\n    SELECT 2 as x;\nEND DEFINE;\n\n$s = SubqueryExtend($sub1,$sub2);\nPROCESS $s();\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"98\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-98\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-98\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-98.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"subquery-extend-for\"&gt;&lt;a id=\"subquery-unionmerge-for\" href=\"en/yql/syntax/subquery.html#subquery-unionmerge-for\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SubqueryExtendFor, SubqueryUnionAllFor, SubqueryMergeFor, SubqueryUnionMergeFor&lt;/span&gt;&lt;/a&gt;&lt;a id=\"subquery-merge-for\" href=\"en/yql/syntax/subquery.html#subquery-merge-for\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SubqueryExtendFor, SubqueryUnionAllFor, SubqueryMergeFor, SubqueryUnionMergeFor&lt;/span&gt;&lt;/a&gt;&lt;a id=\"subquery-unionall-for\" href=\"en/yql/syntax/subquery.html#subquery-unionall-for\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SubqueryExtendFor, SubqueryUnionAllFor, SubqueryMergeFor, SubqueryUnionMergeFor&lt;/span&gt;&lt;/a&gt;&lt;a href=\"en/yql/syntax/subquery.html#subquery-extend-for\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SubqueryExtendFor, SubqueryUnionAllFor, SubqueryMergeFor, SubqueryUnionMergeFor&lt;/span&gt;&lt;/a&gt;SubqueryExtendFor, SubqueryUnionAllFor, SubqueryMergeFor, SubqueryUnionMergeFor&lt;/h2&gt;\n&lt;p&gt;Combining subquery templates after substituting list items: &lt;code&gt;SubqueryExtendFor&lt;/code&gt;, &lt;code&gt;SubqueryUnionAllFor&lt;/code&gt;, &lt;code&gt;SubqueryMergeFor&lt;/code&gt;, &lt;code&gt;SubqueryUnionMergeFor&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The functions take the following arguments:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;A non-empty list of values.&lt;/li&gt;\n&lt;li&gt;A subquery template that must have exactly one parameter.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;They substitute each item from the list into the subquery template as a parameter and then combine the obtained subqueries.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;SubqueryExtendFor&lt;/code&gt; requires matching of subquery schemas.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;SubqueryUnionAllFor&lt;/code&gt; follows the same rules as &lt;a href=\"en/yql/builtins/list.html#ListUnionAll\"&gt;ListUnionAll&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;SubqueryMergeFor&lt;/code&gt; uses the same constraints as &lt;code&gt;SubqueryExtendFor&lt;/code&gt; and also outputs a sorted result if all subqueries have the same sort order.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;SubqueryUnionMergeFor&lt;/code&gt; uses the same constraints as &lt;code&gt;SubqueryUnionAllFor&lt;/code&gt; and also outputs a sorted result if all subqueries have the same sort order.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"examples2\"&gt;&lt;a href=\"en/yql/syntax/subquery.html#examples2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DEFINE SUBQUERY $sub($i) as\n    SELECT $i as x;\nEND DEFINE;\n\n$s = SubqueryExtendFor([1,2,3],$sub);\nPROCESS $s();\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"148\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-148\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-148\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-148.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"subqueryorderby,-subqueryassumeorderby\"&gt;&lt;a href=\"en/yql/syntax/subquery.html#subqueryorderby,-subqueryassumeorderby\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SubqueryOrderBy, SubqueryAssumeOrderBy&lt;/span&gt;&lt;/a&gt;SubqueryOrderBy, SubqueryAssumeOrderBy&lt;/h2&gt;\n&lt;p&gt;Adding sorting to the &lt;code&gt;SubqueryOrderBy&lt;/code&gt; template or indicating the presence of this &lt;code&gt;SubqueryAssumeOrderBy&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The functions take the following arguments:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;A subquery template without parameters.&lt;/li&gt;\n&lt;li&gt;A list of pairs (&lt;code&gt;string&lt;/code&gt; indicating the column name and &lt;code&gt;Boolean&lt;/code&gt; value: &lt;code&gt;True&lt;/code&gt; for sorting in ascending order or &lt;code&gt;False&lt;/code&gt; for sorting in descending order).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;And they build a new query template without parameters where sorting is performed or a comment on the use of sorting is added to the result. To use the resulting query template, call the &lt;code&gt;PROCESS&lt;/code&gt; function, since, when using a &lt;code&gt;SELECT&lt;/code&gt;, sorting is ignored.&lt;/p&gt;\n&lt;h4 id=\"examples3\"&gt;&lt;a href=\"en/yql/syntax/subquery.html#examples3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DEFINE SUBQUERY $sub() as\n   SELECT * FROM (VALUES (1,'c'), (1,'a'), (3,'b')) AS a(x,y);\nend define;\n\n$sub2 = SubqueryOrderBy($sub, [('x',false), ('y',true)]);\n\nPROCESS $sub2();\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"176\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-176\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-176\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-176.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/syntax/subquery.md","sourcePath":"en/yql/syntax/subquery.md"},"headings":[{"title":"DEFINE SUBQUERY","href":"en/yql/syntax/subquery.html#define-subquery","level":2},{"title":"SubqueryExtend, SubqueryUnionAll, SubqueryMerge, SubqueryUnionMerge","href":"en/yql/syntax/subquery.html#subquery-extend","level":2},{"title":"SubqueryExtendFor, SubqueryUnionAllFor, SubqueryMergeFor, SubqueryUnionMergeFor","href":"en/yql/syntax/subquery.html#subquery-extend-for","level":2},{"title":"SubqueryOrderBy, SubqueryAssumeOrderBy","href":"en/yql/syntax/subquery.html#subqueryorderby,-subqueryassumeorderby","level":2}],"title":"Subquery templates"},"router":{"pathname":"en/yql/syntax/subquery","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
