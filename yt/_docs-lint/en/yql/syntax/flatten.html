        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"flatten-by\"&gt;&lt;a href=\"en/yql/syntax/flatten.html#flatten-by\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FLATTEN BY&lt;/span&gt;&lt;/a&gt;FLATTEN BY&lt;/h2&gt;\n&lt;p&gt;Converts rows in the source table using vertical unpacking of &lt;a href=\"en/yql/types/containers.html\"&gt;containers&lt;/a&gt; of variable length (lists or dictionaries).&lt;/p&gt;\n&lt;p&gt;For example:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Source table:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;[a, b, c]&lt;/th&gt;\n&lt;th&gt;1&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;[d]&lt;/td&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;[]&lt;/td&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;The table resulting from &lt;code&gt;FLATTEN BY&lt;/code&gt; on the left column:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;a&lt;/th&gt;\n&lt;th&gt;1&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;b&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;c&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;d&lt;/td&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"example\"&gt;&lt;a href=\"en/yql/syntax/flatten.html#example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$sample = AsList(\n    AsStruct(AsList('a','b','c') AS value, CAST(1 AS Uint32) AS id),\n    AsStruct(AsList('d') AS value, CAST(2 AS Uint32) AS id),\n    AsStruct(AsList() AS value, CAST(3 AS Uint32) AS id)\n);\n\nSELECT value, id FROM as_table($sample) FLATTEN BY (value);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"92\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-92\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-92\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-92.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;This conversion can be convenient in the following cases:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;When it is necessary to output statistics by cells from a container column (for example, via &lt;a href=\"en/yql/syntax/group_by.html\"&gt;&lt;code&gt;GROUP BY&lt;/code&gt;&lt;/a&gt;).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;When the cells in a container column store IDs from another table that you want to join with &lt;a href=\"en/yql/syntax/join.html\"&gt;&lt;code&gt;JOIN&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"syntax\"&gt;&lt;a href=\"en/yql/syntax/flatten.html#syntax\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Syntax&lt;/span&gt;&lt;/a&gt;Syntax&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;FLATTEN BY&lt;/code&gt; is specified after &lt;code&gt;FROM&lt;/code&gt;, but before &lt;code&gt;GROUP BY&lt;/code&gt;, if &lt;code&gt;GROUP BY&lt;/code&gt; is present in the query.&lt;/li&gt;\n&lt;li&gt;The type of the result column depends on the type of the source column:&lt;/li&gt;\n&lt;/ul&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Container type&lt;/th&gt;\n&lt;th&gt;Result type&lt;/th&gt;\n&lt;th&gt;Comments&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;List&amp;lt;X&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;X&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;List cell type&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Dict&amp;lt;X,Y&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Tuple&amp;lt;X,Y&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Tuple of two elements containing key-value pairs&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Optional&amp;lt;X&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;X&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The result is almost equivalent to the clause &lt;code&gt;WHERE foo IS NOT NULL&lt;/code&gt;, but the &lt;code&gt;foo&lt;/code&gt; column type is changed to &lt;code&gt;X&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;ul&gt;\n&lt;li&gt;By default, the result column replaces the source column. Use &lt;code&gt;FLATTEN BY foo AS bar&lt;/code&gt; to keep the source container. As a result, the source container is still available as &lt;code&gt;foo&lt;/code&gt; and the output container is available as &lt;code&gt;bar&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;To build a Cartesian product of multiple container columns, use the clause &lt;code&gt;FLATTEN BY (a, b, c)&lt;/code&gt;. Parentheses are mandatory to avoid grammar conflicts.&lt;/li&gt;\n&lt;li&gt;Inside &lt;code&gt;FLATTEN BY&lt;/code&gt;, you can only use column names from the input table. To apply &lt;code&gt;FLATTEN BY&lt;/code&gt; to the calculation result, use a subquery.&lt;/li&gt;\n&lt;li&gt;In &lt;code&gt;FLATTEN BY&lt;/code&gt; you can use both columns and arbitrary named expressions (unlike columns, &lt;code&gt;AS&lt;/code&gt; is required in this case). To avoid grammatical ambiguities of the expression after &lt;code&gt;FLATTEN BY&lt;/code&gt;, make sure to use parentheses with the following: &lt;code&gt;... FLATTEN BY (ListSkip(col, 1) AS col) ...&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;If the source column had nested containers, for example, &lt;code&gt;List&amp;lt;DictX,Y&amp;gt;&lt;/code&gt;, &lt;code&gt;FLATTEN BY&lt;/code&gt; unpacks only the outer level. To completely unpack the nested containers, use a subquery.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;code&gt;FLATTEN BY&lt;/code&gt; interprets &lt;a href=\"en/yql/types/optional.html\"&gt;optional data types&lt;/a&gt; as lists of length 0 or 1. The table rows with &lt;code&gt;NULL&lt;/code&gt; are skipped, and the column type changes to a similar non-optional type.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;FLATTEN BY&lt;/code&gt; makes only one conversion at a time, so use &lt;code&gt;FLATTEN LIST BY&lt;/code&gt; or &lt;code&gt;FLATTEN OPTIONAL BY&lt;/code&gt; on optional containers, for example, &lt;code&gt;Optional&amp;lt;List&amp;lt;String&amp;gt;&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"flatten-by-apply-yson\"&gt;&lt;a href=\"en/yql/syntax/flatten.html#flatten-by-apply-yson\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Applying FLATTEN BY to YSON&lt;/span&gt;&lt;/a&gt;Applying FLATTEN BY to YSON&lt;/h2&gt;\n&lt;p&gt;To apply &lt;code&gt;FLATTEN BY&lt;/code&gt; to YSON, you first need to transform it into one of the container types discussed above. For instance, you can do this using the &lt;a href=\"en/yql/udf/list/yson.html\"&gt;UDF module of the same name&lt;/a&gt; from the list of presets.&lt;/p&gt;\n&lt;h3 id=\"flatten-by-specific-type\"&gt;&lt;a href=\"en/yql/syntax/flatten.html#flatten-by-specific-type\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Specifying the container type&lt;/span&gt;&lt;/a&gt;Specifying the container type&lt;/h3&gt;\n&lt;p&gt;To specify the type of container to convert to, you can use:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;FLATTEN LIST BY&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;For &lt;code&gt;Optional&amp;lt;List&amp;lt;T&amp;gt;&amp;gt;&lt;/code&gt;, &lt;code&gt;FLATTEN LIST BY&lt;/code&gt; will unpack the list, treating &lt;code&gt;NULL&lt;/code&gt; as an empty list.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;FLATTEN DICT BY&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;For &lt;code&gt;Optional&amp;lt;Dict&amp;lt;T&amp;gt;&amp;gt;&lt;/code&gt;, &lt;code&gt;FLATTEN DICT BY&lt;/code&gt; will unpack the dictionary, interpreting &lt;code&gt;NULL&lt;/code&gt; as an empty dictionary.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;FLATTEN OPTIONAL BY&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;To filter the &lt;code&gt;NULL&lt;/code&gt; values without serialization, specify the operation by using &lt;code&gt;FLATTEN OPTIONAL BY&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"examples\"&gt;&lt;a href=\"en/yql/syntax/flatten.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  t.item.0 AS key,\n  t.item.1 AS value,\n  t.dict_column AS original_dict,\n  t.other_column AS other\nFROM my_table AS t\nFLATTEN DICT BY dict_column AS item;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"254\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-254\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-254\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-254.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT * FROM (\n    SELECT\n        AsList(1, 2, 3) AS a,\n        AsList(\"x\", \"y\", \"z\") AS b\n) FLATTEN LIST BY (a, b);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"255\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-255\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-255\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-255.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT * FROM (\n    SELECT\n        \"1;2;3\" AS a,\n        AsList(\"x\", \"y\", \"z\") AS b\n) FLATTEN LIST BY (String::SplitToList(a, \";\") as a, b);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"256\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-256\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-256\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-256.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"flatten-other-dmb\"&gt;&lt;a href=\"en/yql/syntax/flatten.html#flatten-other-dmb\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Analogues of FLATTEN BY in other DBMS&lt;/span&gt;&lt;/a&gt;Analogues of FLATTEN BY in other DBMS&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;PostgreSQL: &lt;code&gt;unnest&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Hive: &lt;code&gt;LATERAL VIEW&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;MongoDB: &lt;code&gt;unwind&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Google BigQuery: &lt;code&gt;FLATTEN&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;ClickHouse: &lt;code&gt;ARRAY JOIN / arrayJoin&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"flatten-columns\"&gt;&lt;a href=\"en/yql/syntax/flatten.html#flatten-columns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FLATTEN COLUMNS&lt;/span&gt;&lt;/a&gt;FLATTEN COLUMNS&lt;/h2&gt;\n&lt;p&gt;Transforms each column of type &lt;code&gt;Struct&lt;/code&gt; into individual columns, one for each field within the struct. The names of the new columns are the names of the fields from the original struct columns. Columns that are not structs remain unchanged.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Only one level of the struct is flattened.&lt;/li&gt;\n&lt;li&gt;The original struct columns are not included in the result; their names are not used anywhere.&lt;/li&gt;\n&lt;li&gt;All column names in the resulting table (including names from struct fields in the original columns and names of non-struct columns) must be unique; name conflicts result in an error.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"example1\"&gt;&lt;a href=\"en/yql/syntax/flatten.html#example1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT x, y, z, not_struct\nFROM (\n  SELECT\n    AsStruct(\n        1 AS x,\n        \"foo\" AS y),\n    AsStruct(\n        false AS z),\n    1 as not_struct,\n) FLATTEN COLUMNS;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"313\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-313\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-313\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-313.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/syntax/flatten.md","sourcePath":"en/yql/syntax/flatten.md"},"headings":[{"title":"FLATTEN BY","href":"en/yql/syntax/flatten.html#flatten-by","level":2},{"title":"Applying FLATTEN BY to YSON","href":"en/yql/syntax/flatten.html#flatten-by-apply-yson","level":2,"items":[{"title":"Specifying the container type","href":"en/yql/syntax/flatten.html#flatten-by-specific-type","level":3,"items":[{"title":"Examples","href":"en/yql/syntax/flatten.html#examples","level":4}]},{"title":"Analogues of FLATTEN BY in other DBMS","href":"en/yql/syntax/flatten.html#flatten-other-dmb","level":3}]},{"title":"FLATTEN COLUMNS","href":"en/yql/syntax/flatten.html#flatten-columns","level":2}],"title":"FLATTEN"},"router":{"pathname":"en/yql/syntax/flatten","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
