        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"define-action\"&gt;&lt;a href=\"en/yql/syntax/action.html#define-action\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DEFINE ACTION&lt;/span&gt;&lt;/a&gt;DEFINE ACTION&lt;/h2&gt;\n&lt;p&gt;Specifies a named action that is a parameterizable block of multiple top-level expressions.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Syntax&lt;/strong&gt;&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;DEFINE ACTION&lt;/code&gt;: action definition.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/expressions.html#named-nodes\"&gt;Name of the action&lt;/a&gt;, as part of which the declared action is further available for the call.&lt;/li&gt;\n&lt;li&gt;The values of parameter names are listed in parentheses.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;AS&lt;/code&gt; keyword.&lt;/li&gt;\n&lt;li&gt;List of top-level expressions.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;END DEFINE&lt;/code&gt;: The marker of the last expression inside the action.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;One or more of the last parameters can be marked with a question mark &lt;code&gt;?&lt;/code&gt; as optional. If they are omitted during the call, they will be assigned the &lt;code&gt;NULL&lt;/code&gt; value.&lt;/p&gt;\n&lt;h2 id=\"do\"&gt;&lt;a href=\"en/yql/syntax/action.html#do\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DO&lt;/span&gt;&lt;/a&gt;DO&lt;/h2&gt;\n&lt;p&gt;Executes an &lt;code&gt;ACTION&lt;/code&gt; with the specified parameters.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Syntax&lt;/strong&gt;&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;DO&lt;/code&gt;: Executing an action.&lt;/li&gt;\n&lt;li&gt;The named expression for which the action is defined.&lt;/li&gt;\n&lt;li&gt;The values to be used as parameters are listed in parentheses.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;code&gt;EMPTY_ACTION&lt;/code&gt;: An action that does nothing.&lt;/p&gt;\n\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In large queries, you can declare actions in separate files and connect them to the main query using &lt;a href=\"en/yql/syntax/export_import.html#export\"&gt;EXPORT&lt;/a&gt; + &lt;a href=\"en/yql/syntax/export_import.html#import\"&gt;IMPORT&lt;/a&gt; to get multiple logical parts that are easier to navigate than one long text. An important nuance: the &lt;code&gt;USE my_cluster;&lt;/code&gt; directive in the import query does not affect behavior of actions declared in other files.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Example&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DEFINE ACTION $hello_world($name, $suffix?) AS\n    $name = $name ?? ($suffix ?? \"world\");\n    SELECT \"Hello, \" || $name || \"!\";\nEND DEFINE;\n\nDO EMPTY_ACTION();\nDO $hello_world(NULL);\nDO $hello_world(\"John\");\nDO $hello_world(NULL, \"Earth\");\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"87\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-87\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-87\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-87.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"begin\"&gt;&lt;a href=\"en/yql/syntax/action.html#begin\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BEGIN .. END DO&lt;/span&gt;&lt;/a&gt;BEGIN .. END DO&lt;/h2&gt;\n&lt;p&gt;Performing an action without declaring it (anonymous action).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Syntax&lt;/strong&gt;&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;BEGIN&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;List of top-level expressions.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;END DO&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;An anonymous action can't include any parameters.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Example&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DO BEGIN\n    SELECT 1;\n    SELECT 2  -- here and in the previous example of ';' you can omit\nEND DO before END\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"120\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-120\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-120\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-120.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"evaluate-if\"&gt;&lt;a href=\"en/yql/syntax/action.html#evaluate-if\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;EVALUATE IF&lt;/span&gt;&lt;/a&gt;EVALUATE IF&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;EVALUATE IF&lt;/code&gt;: Executing an action depending on the condition. It's followed by:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Condition.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/action.html#do\"&gt;DO&lt;/a&gt; with the name and parameters of the action or an anonymous action.&lt;/li&gt;\n&lt;li&gt;An optional &lt;code&gt;ELSE&lt;/code&gt; followed by the second &lt;code&gt;DO&lt;/code&gt; for a situation where the condition is not met.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"evaluate-for\"&gt;&lt;a href=\"en/yql/syntax/action.html#evaluate-for\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;EVALUATE FOR&lt;/span&gt;&lt;/a&gt;EVALUATE FOR&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;EVALUATE FOR&lt;/code&gt;: Executing an action for each item in the list. It's followed by:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;A &lt;a href=\"en/yql/syntax/expressions.html#named-nodes\"&gt;named expression&lt;/a&gt; applied to each next element in the list.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;IN&lt;/code&gt; keyword.&lt;/li&gt;\n&lt;li&gt;The above-declared named expression applied to the list the action is executed on.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/yql/syntax/action.html#do\"&gt;DO&lt;/a&gt; with the name and parameters of an action or an anonymous action. In the parameters, you can use both the current element from the first paragraph and any named expressions declared above, including the list itself.&lt;/li&gt;\n&lt;li&gt;An optional &lt;code&gt;ELSE&lt;/code&gt; followed by the second &lt;code&gt;DO&lt;/code&gt; for the situation when the list is empty.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;strong&gt;Examples&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DEFINE ACTION $hello() AS\n    SELECT \"Hello!\";\nEND DEFINE;\n\nDEFINE ACTION $bye() AS\n    SELECT \"Bye!\";\nEND DEFINE;\n\nEVALUATE IF RANDOM(0) &amp;gt; 0.5\n    DO $hello()\nELSE\n    DO $bye();\n\nEVALUATE IF RANDOM(0) &amp;gt; 0.1 DO BEGIN\n    SELECT \"Hello!\";\nEND DO;\n\nEVALUATE FOR $i IN AsList(1, 2, 3) DO BEGIN\n    SELECT $i;\nEND DO;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"180\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-180\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-180\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-180.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;-- copy the table $input to $count new tables\n$count = 3;\n$input = \"my_input\";\n$inputs = ListReplicate($input, $count);\n$outputs = ListMap(\n    ListFromRange(0, $count),\n    ($i) -&amp;gt; {\n        RETURN \"tmp/out_\" || CAST($i as String)\n    }\n);\n$pairs = ListZip($inputs, $outputs);\n\nDEFINE ACTION $copy_table($pair) as\n    $input = $pair.0;\n    $output = $pair.1;\n    INSERT INTO $output WITH TRUNCATE\n    SELECT * FROM $input;\nEND DEFINE;\n\nEVALUATE FOR $pair IN $pairs\n    DO $copy_table($pair)\nELSE\n    DO EMPTY_ACTION(); -- you can skip specifying this ELSE,\n                       -- default value implies doing nothing\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"181\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-181\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-181\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-181.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Note that &lt;code&gt;EVALUATE&lt;/code&gt; is run before the operation starts. Please also note that in &lt;code&gt;EVALUATE&lt;/code&gt; you can't use &lt;a href=\"en/yql/syntax/select/temporary_table.html\"&gt;anonymous tables&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/syntax/action.md","sourcePath":"en/yql/syntax/action.md"},"headings":[{"title":"DEFINE ACTION","href":"en/yql/syntax/action.html#define-action","level":2},{"title":"DO","href":"en/yql/syntax/action.html#do","level":2},{"title":"BEGIN .. END DO","href":"en/yql/syntax/action.html#begin","level":2},{"title":"EVALUATE IF","href":"en/yql/syntax/action.html#evaluate-if","level":2},{"title":"EVALUATE FOR","href":"en/yql/syntax/action.html#evaluate-for","level":2}],"title":"ACTION"},"router":{"pathname":"en/yql/syntax/action","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
