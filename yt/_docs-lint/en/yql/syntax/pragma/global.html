        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"pragmascope\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#pragmascope\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Scope&lt;/span&gt;&lt;/a&gt;Scope&lt;/h2&gt;\n&lt;p&gt;Unless otherwise specified, a pragma affects all the subsequent expressions up to the end of the module where it's used. If necessary and logically possible, you can change the value of this setting several times within a given query to make it different at different execution steps.&lt;/p&gt;\n&lt;p&gt;There are also special scoped pragmas with the scope defined by the same rules as the scope of &lt;a href=\"en/yql/syntax/expressions.html#named-nodes\"&gt;named expressions&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Unlike scoped pragmas, global pragmas can only be used in the global scope (not inside &lt;a href=\"en/yql/syntax/action.html#define-action\"&gt;DEFINE ACTION&lt;/a&gt; and &lt;a href=\"en/yql/syntax/subquery.html#define-subquery\"&gt;DEFINE SUBQUERY&lt;/a&gt;).&lt;/p&gt;\n&lt;h2 id=\"autocommit\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#autocommit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AutoCommit&lt;/span&gt;&lt;/a&gt;AutoCommit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Automatically perform &lt;a href=\"en/yql/syntax/commit.html\"&gt;COMMIT&lt;/a&gt; after each expression.&lt;/p&gt;\n&lt;h2 id=\"table-path-prefix\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#table-path-prefix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TablePathPrefix&lt;/span&gt;&lt;/a&gt;TablePathPrefix&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Add the specified prefix to the cluster table paths. Works on the same principle as merging paths in a file system: supports references to the parent catalog &lt;code&gt;..&lt;/code&gt; and doesn't require adding a slash to the right. For example,&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;PRAGMA TablePathPrefix = \"home/yql\";\nSELECT * FROM test;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"68\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-68\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-68\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-68.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The prefix is not added if the table name is an absolute path (starts with /).&lt;/p&gt;\n&lt;h2 id=\"udf\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#udf\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;UDF&lt;/span&gt;&lt;/a&gt;UDF&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;String, the name of the prefix appended to all modules&lt;/td&gt;\n&lt;td&gt;\"\"&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Importing all UDFs from the specified library. For the pragma to work, the library must be attached to the query using the &lt;img src=\"images/qt-ui-attach.png\" alt=\"ico\" width=\"30\" height=\"30\" /&gt; icon. Please note that the library must be shared library (.so) and compiled for Linux x64.&lt;/p&gt;\n&lt;p&gt;When setting a prefix, it's appended before the names of all loaded modules, e.g. CustomPrefixIp::IsIPv4 instead of Ip::IsIPv4. Setting the prefix lets you use  different versions of the same UDF.&lt;/p&gt;\n&lt;h2 id=\"runtime-log-level\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#runtime-log-level\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RuntimeLogLevel&lt;/span&gt;&lt;/a&gt;RuntimeLogLevel&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;Default value&lt;/th&gt;\n&lt;th&gt;Static/&lt;br /&gt;dynamic&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;String, one of the following: &lt;code&gt;Trace&lt;/code&gt;, &lt;code&gt;Debug&lt;/code&gt;, &lt;code&gt;Info&lt;/code&gt;, &lt;code&gt;Notice&lt;/code&gt;, &lt;code&gt;Warn&lt;/code&gt;, &lt;code&gt;Error&lt;/code&gt;, or &lt;code&gt;Fatal&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;Info&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Static&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Lets you change the computation logging level (for example, for UDFs) at query runtime or at the UDF signature declaration stage.&lt;/p&gt;\n&lt;h2 id=\"use-table-prefix-for-each\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#use-table-prefix-for-each\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;UseTablePrefixForEach&lt;/span&gt;&lt;/a&gt;UseTablePrefixForEach&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;code&gt;EACH&lt;/code&gt; uses &lt;a href=\"en/yql/syntax/pragma/global.html#table-path-prefix\"&gt;TablePathPrefix&lt;/a&gt; for each list item.&lt;/p&gt;\n&lt;h2 id=\"warning\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#warning\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Warning&lt;/span&gt;&lt;/a&gt;Warning&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1. Action&lt;br /&gt;2. Warning code or \"*\"&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Action:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;disable&lt;/code&gt;: Disable.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;error&lt;/code&gt;: Treat as an error.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;default&lt;/code&gt;: Revert to the default behavior.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The warning code is returned with the text itself (it's displayed on the right side of the web interface).&lt;/p&gt;\n&lt;p&gt;Examples:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;PRAGMA Warning(\"error\", \"*\");&lt;/code&gt;&lt;br /&gt;\n&lt;code&gt;PRAGMA Warning(\"disable\", \"1101\");&lt;/code&gt;&lt;br /&gt;\n&lt;code&gt;PRAGMA Warning(\"default\", \"4503\");&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;In this case, all the warnings are treated as errors, except for warnings &lt;code&gt;1101&lt;/code&gt; (will be disabled) and &lt;code&gt;4503&lt;/code&gt; (will be processed by default, that is, remain a warning). Since warnings may be added in new YQL releases, use &lt;code&gt;PRAGMA Warning(\"error\", \"*\");&lt;/code&gt; with caution (at least cover such queries with autotests).&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/yql/essentials/core/issue/protos/issue_id.proto\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;List of warning and error codes&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"greetings\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#greetings\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Greetings&lt;/span&gt;&lt;/a&gt;Greetings&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Text&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Issue the specified text as the query's Info message.&lt;/p&gt;\n&lt;p&gt;Example: &lt;code&gt;PRAGMA Greetings(\"It's a good day!\");&lt;/code&gt;&lt;/p&gt;\n&lt;h2 id=\"warningmsg\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#warningmsg\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;WarningMsg&lt;/span&gt;&lt;/a&gt;WarningMsg&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Text&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Issue the specified text as the query's Warning message.&lt;/p&gt;\n&lt;p&gt;Example: &lt;code&gt;PRAGMA WarningMsg(\"Attention!\");&lt;/code&gt;&lt;/p&gt;\n&lt;h2 id=\"dqengine\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#dqengine\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DqEngine&lt;/span&gt;&lt;/a&gt;DqEngine&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;disable/auto/force string&lt;/td&gt;\n&lt;td&gt;\"auto\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;When set to \"auto\", it enables a new compute engine. Computing is made, whenever possible, without creating map/reduce operations. The \"force\" value unconditionally routes computations to the new engine.&lt;/p&gt;\n&lt;h2 id=\"simplecolumns\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#simplecolumns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SimpleColumns&lt;/span&gt;&lt;/a&gt;SimpleColumns&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;SimpleColumns&lt;/code&gt; / &lt;code&gt;DisableSimpleColumns&lt;/code&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;If using &lt;code&gt;SELECT foo.* FROM ... AS foo&lt;/code&gt;, delete the &lt;code&gt;foo.&lt;/code&gt;  prefix from the names of the resulting columns.&lt;/p&gt;\n&lt;p&gt;It also works for &lt;a href=\"en/yql/syntax/join.html\"&gt;JOIN&lt;/a&gt;, but then it may crash if there's a name conflict (which can be resolved through &lt;a href=\"en/yql/syntax/select/without.html\"&gt;WITHOUT&lt;/a&gt; and renaming columns). For JOIN in SimpleColumns mode, an implicit Coalesce is made for key columns: the query &lt;code&gt;SELECT * FROM T1 AS a JOIN T2 AS b USING(key)&lt;/code&gt; in the SimpleColumns mode works same as &lt;code&gt;SELECT a.key ?? b.key AS key, ... FROM T1 AS a JOIN T2 AS b USING(key)&lt;/code&gt;&lt;/p&gt;\n&lt;h2 id=\"coalescejoinkeysonqualifiedall\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#coalescejoinkeysonqualifiedall\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CoalesceJoinKeysOnQualifiedAll&lt;/span&gt;&lt;/a&gt;CoalesceJoinKeysOnQualifiedAll&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;CoalesceJoinKeysOnQualifiedAll&lt;/code&gt; / &lt;code&gt;DisableCoalesceJoinKeysOnQualifiedAll&lt;/code&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Controls implicit Coalesce for the key &lt;code&gt;JOIN&lt;/code&gt; columns in the SimpleColumns mode. If the flag is set, key columns are coalesced if there is at least one expression in the format &lt;code&gt;foo.*&lt;/code&gt; or &lt;code&gt;*&lt;/code&gt; in SELECT: for example, &lt;code&gt;SELECT a.* FROM T1 AS a JOIN T2 AS b USING(key)&lt;/code&gt;. If the flag isn't set, JOIN keys are coalesced only if there is an asterisk '*' after &lt;code&gt;SELECT&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"strictjoinkeytypes\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#strictjoinkeytypes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;StrictJoinKeyTypes&lt;/span&gt;&lt;/a&gt;StrictJoinKeyTypes&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;StrictJoinKeyTypes&lt;/code&gt; / &lt;code&gt;DisableStrictJoinKeyTypes&lt;/code&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;If the flag is set, &lt;a href=\"en/yql/syntax/join.html\"&gt;JOIN&lt;/a&gt; will require a strict match of key types.&lt;br /&gt;\nBy default, JOIN preconverts keys to a shared type, which might result in performance degradation.&lt;/p&gt;\n&lt;p&gt;StrictJoinKeyTypes is a &lt;a href=\"en/yql/syntax/pragma/index.html#pragmascope\"&gt;scoped&lt;/a&gt; setting.&lt;/p&gt;\n&lt;h2 id=\"ansiinforemptyornullableitemscollections\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#ansiinforemptyornullableitemscollections\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AnsiInForEmptyOrNullableItemsCollections&lt;/span&gt;&lt;/a&gt;AnsiInForEmptyOrNullableItemsCollections&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;This pragma brings the behavior of the &lt;code&gt;IN&lt;/code&gt; operator in accordance with the standard when there's &lt;code&gt;NULL&lt;/code&gt; in the left or right side of &lt;code&gt;IN&lt;/code&gt;. The behavior of &lt;code&gt;IN&lt;/code&gt; when on the right side there is a Tuple with elements of different types also changed. Examples:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;1 IN (2, 3, NULL) = NULL (was Just(False))&lt;/code&gt;&lt;br /&gt;\n&lt;code&gt;NULL IN () = Just(False) (was NULL)&lt;/code&gt;&lt;br /&gt;\n&lt;code&gt;(1, null) IN ((2, 2), (3, 3)) = Just(False) (was NULL)&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;For more information about the &lt;code&gt;IN&lt;/code&gt; behavior when operands include NULLs, see &lt;a href=\"en/yql/syntax/expressions.html#in\"&gt;here&lt;/a&gt;. You can explicitly select the old behavior by specifying the pragma &lt;code&gt;DisableAnsiInForEmptyOrNullableItemsCollections&lt;/code&gt;. If no pragma is set, you'll see a warning, and the original variant will be used.&lt;/p&gt;\n&lt;h2 id=\"ansirankfornullablekeys\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#ansirankfornullablekeys\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AnsiRankForNullableKeys&lt;/span&gt;&lt;/a&gt;AnsiRankForNullableKeys&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Aligns the RANK/DENSE_RANK behavior with the standard if there are optional types in the window sort keys or in the argument of such window functions. It means that:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The result type is always Uint64 rather than Uint64?;&lt;/li&gt;\n&lt;li&gt;NULLs in keys are treated as equal to each other (the current implementation returns NULL).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;You can explicitly select the old behavior by specifying the pragma &lt;code&gt;DisableAnsiRankForNullableKeys&lt;/code&gt;. If no pragma is set, you'll see a warning, and the original variant will be used.&lt;/p&gt;\n&lt;h2 id=\"ansicurrentrow\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#ansicurrentrow\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AnsiCurrentRow&lt;/span&gt;&lt;/a&gt;AnsiCurrentRow&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Aligns the implicit setting of a window frame with the standard if there is &lt;a href=\"en/yql/syntax/select/order_by.html\"&gt;ORDER BY&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;If AnsiCurrentRow is not set, the &lt;code&gt;(ORDER BY key)&lt;/code&gt; window is equivalent to &lt;code&gt;(ORDER BY key ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)&lt;/code&gt;. The standard requires that such window behaves as &lt;code&gt;(ORDER BY key RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The difference is in &lt;code&gt;CURRENT ROW&lt;/code&gt; interpretation. In &lt;code&gt;ROWS&lt;/code&gt; mode, &lt;code&gt;CURRENT ROW&lt;/code&gt; is interpreted literally: the current string in the partition.&lt;br /&gt;\nAnd in &lt;code&gt;RANGE&lt;/code&gt; mode, the end of the &lt;code&gt;CURRENT ROW&lt;/code&gt; frame means \"the last row in the partition with the sorting key equal to the current row\".&lt;/p&gt;\n&lt;h2 id=\"orderedcolumns\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#orderedcolumns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;OrderedColumns&lt;/span&gt;&lt;/a&gt;OrderedColumns&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;OrderedColumns&lt;/code&gt; / &lt;code&gt;DisableOrderedColumns&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Output the &lt;a href=\"en/yql/syntax/select/index.html#orderedcolumns\"&gt;sequence of columns&lt;/a&gt; to SELECT/JOIN/UNION ALL and save it when recording the results. The order of columns is undefined by default.&lt;/p&gt;\n&lt;h2 id=\"positionalunionall\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#positionalunionall\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PositionalUnionAll&lt;/span&gt;&lt;/a&gt;PositionalUnionAll&lt;/h2&gt;\n&lt;p&gt;Enable the standard columnar execution for &lt;a href=\"en/yql/syntax/select/union.html#union-all\"&gt;UNION ALL&lt;/a&gt;. This automatically enables &lt;a href=\"en/yql/syntax/pragma/global.html#orderedcolumns\"&gt;ordered columns&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"regexusere2\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#regexusere2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RegexUseRe2&lt;/span&gt;&lt;/a&gt;RegexUseRe2&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Use Re2 UDF instead of Pcre for executing &lt;code&gt;REGEX&lt;/code&gt;,&lt;code&gt;MATCH&lt;/code&gt;,&lt;code&gt;RLIKE&lt;/code&gt;, and SQL operators. Re2 UDF supports correct processing of Unicode symbols, unlike Pcre UDF, which is used by default.&lt;/p&gt;\n&lt;h2 id=\"classicdivision\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#classicdivision\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ClassicDivision&lt;/span&gt;&lt;/a&gt;ClassicDivision&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;In the classical version, the result of integer division remains integer (by default). If disabled, the result is always Double.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;ClassicDivision&lt;/code&gt; is a &lt;a href=\"en/yql/syntax/pragma/global.html#pragmascope\"&gt;scoped&lt;/a&gt; setting.&lt;/p&gt;\n&lt;h2 id=\"checkedops\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#checkedops\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CheckedOps&lt;/span&gt;&lt;/a&gt;CheckedOps&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;When enabled: if aggregate functions SUM/SUM_IF, binary operations &lt;code&gt;+&lt;/code&gt;, &lt;code&gt;-&lt;/code&gt;, &lt;code&gt;*&lt;/code&gt;, &lt;code&gt;/&lt;/code&gt;, &lt;code&gt;%&lt;/code&gt;, or unary operation &lt;code&gt;-&lt;/code&gt; on integers result in an overflow beyond the range of the target argument or result type, return &lt;code&gt;NULL&lt;/code&gt;. When disabled: overflow isn't checked.&lt;/p&gt;\n&lt;p&gt;Has no effect on floating point or &lt;code&gt;Decimal&lt;/code&gt; numbers.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;CheckedOps&lt;/code&gt; is a &lt;a href=\"en/yql/syntax/pragma/global.html#pragmascope\"&gt;scoped&lt;/a&gt; setting.&lt;/p&gt;\n&lt;h2 id=\"unicodeliterals\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#unicodeliterals\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;UnicodeLiterals&lt;/span&gt;&lt;/a&gt;UnicodeLiterals&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;UnicodeLiterals&lt;/code&gt;/&lt;code&gt;DisableUnicodeLiterals&lt;/code&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;When the mode is enabled, string literals without suffixes like \"foo\"/'bar'/@@multiline@@ will have the &lt;code&gt;Utf8&lt;/code&gt; type. If disabled, then &lt;code&gt;String&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;UnicodeLiterals&lt;/code&gt; is a &lt;a href=\"en/yql/syntax/pragma/global.html#pragmascope\"&gt;scoped&lt;/a&gt; setting.&lt;/p&gt;\n&lt;h2 id=\"warnuntypedstringliterals\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#warnuntypedstringliterals\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;WarnUntypedStringLiterals&lt;/span&gt;&lt;/a&gt;WarnUntypedStringLiterals&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;WarnUntypedStringLiterals&lt;/code&gt;/&lt;code&gt;DisableWarnUntypedStringLiterals&lt;/code&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;When the mode is enabled, string literals without a suffix like \"foo\"/'bar'/@@multiline@@ will prompt a warning. It can be suppressed if you explicitly select the &lt;code&gt;s&lt;/code&gt; suffix for the &lt;code&gt;String&lt;/code&gt; type or the &lt;code&gt;u&lt;/code&gt; suffix for the &lt;code&gt;Utf8&lt;/code&gt; type.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;WarnUntypedStringLiterals&lt;/code&gt; is a &lt;a href=\"en/yql/syntax/pragma/global.html#pragmascope\"&gt;scoped&lt;/a&gt; setting.&lt;/p&gt;\n&lt;h2 id=\"allowdotinalias\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#allowdotinalias\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AllowDotInAlias&lt;/span&gt;&lt;/a&gt;AllowDotInAlias&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Enable dot in names of result columns. This behavior is disabled by default, since the further use of such columns in JOIN is not fully implemented.&lt;/p&gt;\n&lt;h2 id=\"warnunnamedcolumns\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#warnunnamedcolumns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;WarnUnnamedColumns&lt;/span&gt;&lt;/a&gt;WarnUnnamedColumns&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Flag&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Generate a warning if a column name (in the format &lt;code&gt;column[0-9]+&lt;/code&gt;) was automatically generated for an unnamed expression in &lt;code&gt;SELECT&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"groupbylimit\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#groupbylimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GroupByLimit&lt;/span&gt;&lt;/a&gt;GroupByLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Positive number&lt;/td&gt;\n&lt;td&gt;32&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Increasing the limit on the number of groups in &lt;a href=\"en/yql/syntax/group_by.html\"&gt;GROUP BY&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"groupbycubelimit\"&gt;&lt;a href=\"en/yql/syntax/pragma/global.html#groupbycubelimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GroupByCubeLimit&lt;/span&gt;&lt;/a&gt;GroupByCubeLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value type&lt;/th&gt;\n&lt;th&gt;By default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Positive number&lt;/td&gt;\n&lt;td&gt;5&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Increasing the limit on the number of dimensions in &lt;a href=\"en/yql/syntax/group_by.html#rollup-cube-group-sets\"&gt;GROUP BY&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Use this option with care: the computational complexity of the query grows exponentially with the number of dimensions.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/syntax/pragma/global.md","sourcePath":"en/yql/syntax/pragma/global.md"},"headings":[{"title":"Scope","href":"en/yql/syntax/pragma/global.html#pragmascope","level":2},{"title":"AutoCommit","href":"en/yql/syntax/pragma/global.html#autocommit","level":2},{"title":"TablePathPrefix","href":"en/yql/syntax/pragma/global.html#table-path-prefix","level":2},{"title":"UDF","href":"en/yql/syntax/pragma/global.html#udf","level":2},{"title":"RuntimeLogLevel","href":"en/yql/syntax/pragma/global.html#runtime-log-level","level":2},{"title":"UseTablePrefixForEach","href":"en/yql/syntax/pragma/global.html#use-table-prefix-for-each","level":2},{"title":"Warning","href":"en/yql/syntax/pragma/global.html#warning","level":2},{"title":"Greetings","href":"en/yql/syntax/pragma/global.html#greetings","level":2},{"title":"WarningMsg","href":"en/yql/syntax/pragma/global.html#warningmsg","level":2},{"title":"DqEngine","href":"en/yql/syntax/pragma/global.html#dqengine","level":2},{"title":"SimpleColumns","href":"en/yql/syntax/pragma/global.html#simplecolumns","level":2},{"title":"CoalesceJoinKeysOnQualifiedAll","href":"en/yql/syntax/pragma/global.html#coalescejoinkeysonqualifiedall","level":2},{"title":"StrictJoinKeyTypes","href":"en/yql/syntax/pragma/global.html#strictjoinkeytypes","level":2},{"title":"AnsiInForEmptyOrNullableItemsCollections","href":"en/yql/syntax/pragma/global.html#ansiinforemptyornullableitemscollections","level":2},{"title":"AnsiRankForNullableKeys","href":"en/yql/syntax/pragma/global.html#ansirankfornullablekeys","level":2},{"title":"AnsiCurrentRow","href":"en/yql/syntax/pragma/global.html#ansicurrentrow","level":2},{"title":"OrderedColumns","href":"en/yql/syntax/pragma/global.html#orderedcolumns","level":2},{"title":"PositionalUnionAll","href":"en/yql/syntax/pragma/global.html#positionalunionall","level":2},{"title":"RegexUseRe2","href":"en/yql/syntax/pragma/global.html#regexusere2","level":2},{"title":"ClassicDivision","href":"en/yql/syntax/pragma/global.html#classicdivision","level":2},{"title":"CheckedOps","href":"en/yql/syntax/pragma/global.html#checkedops","level":2},{"title":"UnicodeLiterals","href":"en/yql/syntax/pragma/global.html#unicodeliterals","level":2},{"title":"WarnUntypedStringLiterals","href":"en/yql/syntax/pragma/global.html#warnuntypedstringliterals","level":2},{"title":"AllowDotInAlias","href":"en/yql/syntax/pragma/global.html#allowdotinalias","level":2},{"title":"WarnUnnamedColumns","href":"en/yql/syntax/pragma/global.html#warnunnamedcolumns","level":2},{"title":"GroupByLimit","href":"en/yql/syntax/pragma/global.html#groupbylimit","level":2},{"title":"GroupByCubeLimit","href":"en/yql/syntax/pragma/global.html#groupbycubelimit","level":2}],"title":"Global"},"router":{"pathname":"en/yql/syntax/pragma/global","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
