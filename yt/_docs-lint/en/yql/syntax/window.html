        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Window functions were introduced in the SQL:2003 standard and expanded in the SQL:2011 standard. They let you run calculations on a set of table rows that are related to the current row in some way.&lt;/p&gt;\n&lt;p&gt;Unlike &lt;a href=\"en/yql/builtins/aggregation.html\"&gt;aggregate functions&lt;/a&gt;, using window functions doesn't cause rows to become grouped into a single output row: the number of rows in the results table always matches that in the source table.&lt;/p&gt;\n&lt;p&gt;If a query contains both aggregate and window functions, grouping is performed and aggregate function values are calculated first. The calculated values of aggregate functions can be used as window function arguments (but not the other way around). The order for calculating window functions in relation to other query elements is described in the &lt;a href=\"en/yql/syntax/select/index.html\"&gt;SELECT&lt;/a&gt; section.&lt;/p&gt;\n&lt;h2 id=\"syntax\"&gt;&lt;a href=\"en/yql/syntax/window.html#syntax\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Syntax&lt;/span&gt;&lt;/a&gt;Syntax&lt;/h2&gt;\n&lt;p&gt;General syntax for calling a window function is as follows&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;function_name([expression [, expression ...]]) OVER (window_definition)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"15\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-15\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-15\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-15.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;or&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;function_name([expression [, expression ...]]) OVER window_name\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"19\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-19\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-19\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-19.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Here, &lt;code&gt;window_name&lt;/code&gt; (&lt;em&gt;window name&lt;/em&gt;) is an arbitrary ID that is unique within the query and &lt;code&gt;expression&lt;/code&gt; is an arbitrary expression that contains no window function calls.&lt;/p&gt;\n&lt;p&gt;In the query, each window name must be mapped to the &lt;em&gt;window definition&lt;/em&gt; (&lt;code&gt;window_definition&lt;/code&gt;):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    F0(...) OVER (window_definition_0),\n    F1(...) OVER w1,\n    F2(...) OVER w2,\n    ...\nFROM my_table\nWINDOW\n    w1 AS (window_definition_1),\n    ...\n    w2 AS (window_definition_2)\n;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"26\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-26\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-26\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-26.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Here, the &lt;code&gt;window_definition&lt;/code&gt; is written as&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[ PARTITION BY (expression AS column_identifier | column_identifier) [, ...] ]\n[ ORDER BY expression [ASC | DESC] ]\n[ frame_definition ]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"30\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-30\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-30\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-30.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You can set an optional &lt;em&gt;frame definition&lt;/em&gt; (&lt;code&gt;frame_definition&lt;/code&gt;) one of two ways:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;ROWS frame_begin&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ROWS BETWEEN frame_begin AND frame_end&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The &lt;em&gt;frame start&lt;/em&gt; (&lt;code&gt;frame_begin&lt;/code&gt;) and &lt;em&gt;frame end&lt;/em&gt; (&lt;code&gt;frame_end&lt;/code&gt;) are set one of the following ways:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;UNBOUNDED PRECEDING&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;offset PRECEDING&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;CURRENT ROW&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;offset FOLLOWING&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;UNBOUNDED FOLLOWING&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Here, &lt;em&gt;frame offset&lt;/em&gt; (&lt;code&gt;offset&lt;/code&gt;) is a non-negative numerical literal. If the frame end isn't set, the &lt;code&gt;CURRENT ROW&lt;/code&gt; is assumed.&lt;/p&gt;\n&lt;p&gt;There should be no window function calls in any of the expressions inside the window definition.&lt;/p&gt;\n&lt;h2 id=\"calculation-algorithm\"&gt;&lt;a href=\"en/yql/syntax/window.html#calculation-algorithm\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Calculation algorithm&lt;/span&gt;&lt;/a&gt;Calculation algorithm&lt;/h2&gt;\n&lt;h3 id=\"partition\"&gt;&lt;a href=\"en/yql/syntax/window.html#partition\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Partitioning&lt;/span&gt;&lt;/a&gt;Partitioning&lt;/h3&gt;\n&lt;p&gt;If &lt;code&gt;PARTITION BY&lt;/code&gt; is set, the source table rows are grouped into &lt;em&gt;partitions&lt;/em&gt;, which are then handled independently of each other. If &lt;code&gt;PARTITION BY&lt;/code&gt; isn't set, all rows in the source table are put in the same partition. If &lt;code&gt;ORDER BY&lt;/code&gt; is set, it determines the order of rows in a partition.&lt;/p&gt;\n&lt;p&gt;Both in &lt;code&gt;PARTITION BY&lt;/code&gt; and &lt;a href=\"en/yql/syntax/group_by.html\"&gt;GROUP BY&lt;/a&gt; you can use aliases and &lt;a href=\"en/yql/syntax/group_by.html#session-window\"&gt;SessionWindow&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;If &lt;code&gt;ORDER BY&lt;/code&gt; is omitted, the order of rows in the partition is undefined.&lt;/p&gt;\n&lt;h3 id=\"frame\"&gt;&lt;a href=\"en/yql/syntax/window.html#frame\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Frame&lt;/span&gt;&lt;/a&gt;Frame&lt;/h3&gt;\n&lt;p&gt;The &lt;code&gt;frame_definition&lt;/code&gt; specifies a set of partition rows that fall into the &lt;em&gt;window frame&lt;/em&gt; associated with the current row.&lt;/p&gt;\n&lt;p&gt;In &lt;code&gt;ROWS&lt;/code&gt; mode (the only one that YQL currently supports), the window frame contains rows with the specified offsets relative to the current row in the partition. For example, if &lt;code&gt;ROWS BETWEEN 3 PRECEDING AND 5 FOLLOWING&lt;/code&gt; is used, the window frame contains 3 rows preceding the current one, the current row, and 5 rows following it.&lt;/p&gt;\n&lt;p&gt;The set of rows in the window frame may change depending on which row is the current one. For example, for the first row in the partition, the ROWS &lt;code&gt;BETWEEN 3 PRECEDING AND 1 PRECEDING&lt;/code&gt; window frame will have no rows.&lt;/p&gt;\n&lt;p&gt;Setting &lt;code&gt;UNBOUNDED PRECEDING&lt;/code&gt; as the frame start means \"from the first partition row\" and &lt;code&gt;UNBOUNDED FOLLOWING&lt;/code&gt; as the frame end — \"up to the last partition row\". Setting &lt;code&gt;CURRENT ROW&lt;/code&gt; means \"from/to the current row\".&lt;/p&gt;\n&lt;p&gt;If no &lt;code&gt;frame_definition&lt;/code&gt; is specified, a set of rows to be included in the window frame depends on whether there is &lt;code&gt;ORDER BY&lt;/code&gt; in the &lt;code&gt;window_definition&lt;/code&gt;.&lt;br /&gt;\nNamely, if there is &lt;code&gt;ORDER BY&lt;/code&gt;, then &lt;code&gt;ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW&lt;/code&gt; is implicitly assumed. If none, then &lt;code&gt;ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Further, depending on the specific window function, it's calculated either based on the set of rows in the partition or the set of rows in the window frame.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"en/yql/builtins/window.html\"&gt;List of available window functions&lt;/a&gt;&lt;/p&gt;\n&lt;h4 id=\"examples\"&gt;&lt;a href=\"en/yql/syntax/window.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    COUNT(*) OVER w AS rows_count_in_window,\n    some_other_value -- access to the current row\nFROM `my_table`\nWINDOW w AS (\n    PARTITION BY partition_key_column\n    ORDER BY int_column\n);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"124\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-124\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-124\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-124.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    LAG(my_column, 2) OVER w AS row_before_previous_one\nFROM `my_table`\nWINDOW w AS (\n    PARTITION BY partition_key_column\n);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"125\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-125\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-125\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-125.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    -- AVG (like all aggregate functions used as window functions)\n    -- calculated on a window frame\n    AVG(some_value) OVER w AS avg_of_prev_current_next,\n    some_other_value -- access to the current row\nFROM my_table\nWINDOW w AS (\n    PARTITION BY partition_key_column\n    ORDER BY int_column\n    ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING\n);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"126\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-126\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-126\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-126.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    -- LAG doesn't depend on the window frame position\n    LAG(my_column, 2) OVER w AS row_before_previous_one\nFROM my_table\nWINDOW w AS (\n    PARTITION BY partition_key_column\n    ORDER BY my_column\n);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"127\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-127\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-127\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-127.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"implementation-specifics\"&gt;&lt;a href=\"en/yql/syntax/window.html#implementation-specifics\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Implementation specifics&lt;/span&gt;&lt;/a&gt;Implementation specifics&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Functions calculated on the &lt;code&gt;ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING&lt;/code&gt; or &lt;code&gt;ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW&lt;/code&gt; window frame are implemented efficiently (do not require additional memory and their computation runs on a partition in O(partition size) time).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;For a &lt;code&gt;ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING&lt;/code&gt; window frame, a &lt;code&gt;COMPACT&lt;/code&gt; &lt;a href=\"en/yql/syntax/lexer.html#sql-hints\"&gt;hint&lt;/a&gt; can be specified after the &lt;code&gt;PARTITION&lt;/code&gt; keyword to select the execution strategy in RAM.&lt;/p&gt;\n&lt;p&gt;For example: &lt;code&gt;PARTITION /*+ COMPACT() */ BY key&lt;/code&gt; or &lt;code&gt;PARTITION /*+ COMPACT() */ BY ()&lt;/code&gt; (if &lt;code&gt;PARTITION BY&lt;/code&gt; was initially absent).&lt;/p&gt;\n&lt;p&gt;If the &lt;code&gt;COMPACT&lt;/code&gt; hint is specified, this requires additional memory equal to O(partition size), but then no extra &lt;code&gt;JOIN&lt;/code&gt; operation is made.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;If the window frame doesn't start with &lt;code&gt;UNBOUNDED PRECEDING&lt;/code&gt;, calculating window functions on this window requires additional memory equal to O(the maximum number of rows from the window boundaries to the current row), while the computation time is equal to O(number_of_partition_rows * window_size).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;For the window frame starting with &lt;code&gt;UNBOUNDED PRECEDING&lt;/code&gt; and ending with &lt;code&gt;N&lt;/code&gt;, where &lt;code&gt;N&lt;/code&gt; is neither &lt;code&gt;CURRENT ROW&lt;/code&gt; nor &lt;code&gt;UNBOUNDED FOLLOWING&lt;/code&gt;, additional memory equal to O(N) is required and the computation time is equal to O(N * number_of_partition_rows).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;The &lt;code&gt;LEAD(expr, N)&lt;/code&gt; and &lt;code&gt;LAG(expr, N)&lt;/code&gt; functions always require O(N) of RAM.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Given the above, a query with &lt;code&gt;ROWS BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING&lt;/code&gt; should, if possible, be changed to &lt;code&gt;ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW&lt;/code&gt; by reversing the &lt;code&gt;ORDER BY&lt;/code&gt; sorting order.&lt;/p&gt;\n&lt;p&gt;In terms of MapReduce, window functions are physically executed through Reduce, with &lt;code&gt;PARTITION BY&lt;/code&gt; keys, which can mean lengthy execution for big sections, as well as a strict 200 GB per section limit for the main clusters YTsaurus.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/yql/syntax/window.md","sourcePath":"en/yql/syntax/window.md"},"headings":[{"title":"Syntax","href":"en/yql/syntax/window.html#syntax","level":2},{"title":"Calculation algorithm","href":"en/yql/syntax/window.html#calculation-algorithm","level":2,"items":[{"title":"Partitioning","href":"en/yql/syntax/window.html#partition","level":3},{"title":"Frame","href":"en/yql/syntax/window.html#frame","level":3,"items":[{"title":"Examples","href":"en/yql/syntax/window.html#examples","level":4}]}]},{"title":"Implementation specifics","href":"en/yql/syntax/window.html#implementation-specifics","level":2}],"title":"OVER, PARTITION BY, and WINDOW"},"router":{"pathname":"en/yql/syntax/window","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
