            {"data":{"leading":false,"html":"&lt;p&gt;Sorted dynamic tables store a timestamp for each written column value. These timestamps can be useful for implementing custom logic or data migrations where you need to preserve original timestamps for correct TTL-based data cleanup operations.&lt;/p&gt;\n&lt;p&gt;The versioned interaction format incurs virtually no overhead costs, except when the column itself isn't requested but its timestamp is. In this case, the column data will be read.&lt;/p&gt;\n&lt;p&gt;For all subsequent interaction types, it is assumed that the timestamp of the &lt;code&gt;value&lt;/code&gt; column is denoted as &lt;code&gt;$timestamp:value&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"versioned-lookup-and-select\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/versioned-format.html#versioned-lookup-and-select\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Versioned lookup and select&lt;/span&gt;&lt;/a&gt;Versioned lookup and select&lt;/h2&gt;\n&lt;p&gt;C++ and Python APIs support versioned lookup and select. To add columns with timestamps to the output, specify &lt;code&gt;versioned_read_options = {read_mode = latest_timestamp}&lt;/code&gt;.&lt;br /&gt;\nIn select queries, additionally escape column timestamps with square brackets: &lt;code&gt;[$timestamp:value]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;In the Python API, you can specify the &lt;code&gt;with_timestamps&lt;/code&gt; option instead of &lt;code&gt;versioned_read_options&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"examples\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/versioned-format.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.lookup_rows(&lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt;, [{&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;123&lt;/span&gt;}], with_timestamps=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n\n&lt;span class=\"hljs-comment\"&gt;# Read all columns and their timestamps.&lt;/span&gt;\nyt.select_rows(&lt;span class=\"hljs-string\"&gt;\"* from [//path/to/table]\"&lt;/span&gt;, with_timestamps=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n\n&lt;span class=\"hljs-comment\"&gt;# Read select columns and timestamps.&lt;/span&gt;\nyt.select_rows(&lt;span class=\"hljs-string\"&gt;\"col_a, [$timestamp:col_a] as ts_a, [$timestamp:col_b] as ts_b from [//path/to/table]\"&lt;/span&gt;, with_timestamps=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"21\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-21\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-21\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-21.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"versioned-map-reduce\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/versioned-format.html#versioned-map-reduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Versioned map-reduce&lt;/span&gt;&lt;/a&gt;Versioned map-reduce&lt;/h2&gt;\n&lt;h3 id=\"reading\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/versioned-format.html#reading\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reading&lt;/span&gt;&lt;/a&gt;Reading&lt;/h3&gt;\n&lt;p&gt;To read timestamp columns in map-reduce operations, add the following attribute to &lt;a href=\"user-guide/storage/ypath#rich_ypath\"&gt;rich YPath&lt;/a&gt; of the input table: &lt;code&gt;&amp;lt;versioned_read_options = {read_mode = latest_timestamp}&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"writing\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/versioned-format.html#writing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Writing&lt;/span&gt;&lt;/a&gt;Writing&lt;/h3&gt;\n&lt;p&gt;To write data in map-reduce operations in versioned format, add the following attribute to &lt;a href=\"user-guide/storage/ypath#rich_ypath\"&gt;rich YPath&lt;/a&gt; of the output table: &lt;code&gt;&amp;lt;versioned_write_options = {read_mode = latest_timestamp}&amp;gt;&lt;/code&gt;. Timestamp will be written for all columns where it is specified. For columns without a specified timestamp, the commit timestamp of the bulk insert transaction will be written instead.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The versioned writing format has a few limitations:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Sort operations don't support writing.&lt;/li&gt;\n&lt;li&gt;During the write process, there is no check for potential duplicate timestamps across different records in the same column for the same key.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/dynamic-tables/versioned-format.md","sourcePath":"en/user-guide/dynamic-tables/versioned-format.md"},"headings":[{"title":"Versioned lookup and select","href":"en/user-guide/dynamic-tables/versioned-format.html#versioned-lookup-and-select","level":2,"items":[{"title":"Examples","href":"en/user-guide/dynamic-tables/versioned-format.html#examples","level":3}]},{"title":"Versioned map-reduce","href":"en/user-guide/dynamic-tables/versioned-format.html#versioned-map-reduce","level":2,"items":[{"title":"Reading","href":"en/user-guide/dynamic-tables/versioned-format.html#reading","level":3},{"title":"Writing","href":"en/user-guide/dynamic-tables/versioned-format.html#writing","level":3}]}],"title":"Versioned format for dynamic table interaction"},"router":{"pathname":"en/user-guide/dynamic-tables/versioned-format","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
