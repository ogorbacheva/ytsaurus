        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section describes transactions as they apply to dynamic tables. The transactional model of static tables is described in the &lt;a href=\"user-guide/storage/transactions.html\"&gt;Transactions&lt;/a&gt; section.&lt;/p&gt;\n&lt;p&gt;Transactions are divided into master transactions and tablet transactions. Master transactions enable you to perform operations on the master meta-information. Tablet transactions enable you only to write data to dynamic tables.&lt;/p&gt;\n&lt;p&gt;Data in sorted dynamic tables is read and modified using table transactions.&lt;/p&gt;\n&lt;p&gt;The &lt;a href=\"https://en.wikipedia.org/wiki/Multiversion_concurrency_control\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MVCC model&lt;/a&gt; is used to isolate transactions and resolve conflicts. The default isolation level is snapshot (not serializable snapshot).&lt;/p&gt;\n&lt;p&gt;The system supports distributed transactions, i.e. it enables multiple rows of one or more dynamic tables to be changed within a single transaction.&lt;/p&gt;\n&lt;h2 id=\"restrictions\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/transactions.html#restrictions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Restrictions&lt;/span&gt;&lt;/a&gt;Restrictions&lt;/h2&gt;\n&lt;p&gt;When using transactions, keep in mind:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Transactions must be short (the default limit is 1 minute).&lt;/li&gt;\n&lt;li&gt;Transactions must write a limited amount of data (the default limit is 100,000 rows).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Calculating the moment of the last write is no simple task, because some of the data may have already been written to the disk. Attempting to read such data from the disk would cause a write by key to become a random read by key. The YTsaurus system design stipulates that all writes are made quickly. In terms of disk activity, access is sequential. Therefore, the following logic is implemented:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Dynamic stores (dynamic_store), which store freshly written data, are stored in the cluster node's memory for a guaranteed period of time even if they are already written to chunks on the disk.&lt;/li&gt;\n&lt;li&gt;These dynamic stores are checked quickly, because it does not require access to the disk.&lt;/li&gt;\n&lt;li&gt;The system prohibits commit of transactions whose lifetime exceeds a certain configurable limit.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"timestamps\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/transactions.html#timestamps\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Timestamps&lt;/span&gt;&lt;/a&gt;Timestamps&lt;/h2&gt;\n&lt;p&gt;Each value stored in the sorted dynamic table is annotated with a timestamp. Timestamps are 64-bit integers generated by the cluster if necessary.&lt;/p&gt;\n&lt;p&gt;When any transaction starts, a start timestamp is generated. All reads of dynamic tables within a transaction are made relative to this timestamp, thereby generating a snapshot of the data state in these tables.&lt;/p&gt;\n&lt;p&gt;When a transaction is committed, another timestamp is generated — a commit timestamp. All changes to the tables made by this transaction are annotated with a commit timestamp.&lt;/p&gt;\n&lt;p&gt;Timestamps within a cluster are generated centrally on the master servers. For better scalability, clients do not request timestamps directly, but through special proxy servers that buffer queries. In practice, it takes less than 10 ms to generate a new timestamp when the cluster and the client are within the same DC. The total capacity of their generation is practically unlimited.&lt;/p&gt;\n&lt;p&gt;For timestamps the following is guaranteed:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Uniqueness: All obtained timestamps will be different.&lt;/li&gt;\n&lt;li&gt;Monotony: If &lt;code&gt;A&lt;/code&gt; means an event of obtaining a &lt;code&gt;T(A)&lt;/code&gt; timestamp and &lt;code&gt;B&lt;/code&gt; means an event of ordering a &lt;code&gt;T(B)&lt;/code&gt; timestamp, with &lt;code&gt;A&lt;/code&gt; &lt;a href=\"https://en.wikipedia.org/wiki/Happened-before\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;occurring before &lt;/a&gt; &lt;code&gt;B&lt;/code&gt;, then &lt;code&gt;T(A) &amp;lt; T(B)&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;Consistency: If an &lt;code&gt;A&lt;/code&gt; transaction has a &lt;code&gt;Tc(A)&lt;/code&gt; commit timestamp and a &lt;code&gt;B&lt;/code&gt; transaction has a &lt;code&gt;Ts(B)&lt;/code&gt; start timestamp, with &lt;code&gt;Tc(A) &amp;lt; Ts(B)&lt;/code&gt;, then the &lt;code&gt;B&lt;/code&gt; transaction will see all changes made by the &lt;code&gt;A&lt;/code&gt; transaction (and only those). It is also true that any transaction in progress does not see its own changes (because the changes have not yet obtained any timestamp).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;In addition, the timestamps are arranged so that it is easy to calculate an approximate physical time of generation with an error of about a second.&lt;/p&gt;\n&lt;p&gt;Working with transactions requires the client to maintain a certain state in memory. For example, you need to remember the transaction start timestamp. Changes made within a transaction are also buffered on the client and only sent out at the time of commit. In the current implementation, this state is maintained by the YTsaurus client library, but in theory it is possible to transfer this work to a suitable stateful proxy.&lt;/p&gt;\n&lt;h2 id=\"guarantees\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/transactions.html#guarantees\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Weakening guarantees&lt;/span&gt;&lt;/a&gt;Weakening guarantees&lt;/h2&gt;\n&lt;p&gt;By default, when working with sorted dynamic tables, all user transactions are atomic and guarantee data integrity: written changes cannot be lost.&lt;/p&gt;\n&lt;p&gt;A two-phase commit is used to ensure atomicity and the server waits until the data is written to the disk to ensure data integrity. In total, these guarantees contribute significantly to the latency of write operations (hundreds of milliseconds). However, there are user scenarios when less strict guarantees are acceptable but a markedly lower latency of write operations is required. To support such scenarios, the system has a number of parameters that enable you to set reduced levels of atomicity and preservation.&lt;/p&gt;\n&lt;h2 id=\"atomicity\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/transactions.html#atomicity\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Atomicity&lt;/span&gt;&lt;/a&gt;Atomicity&lt;/h2&gt;\n&lt;p&gt;Transaction atomicity means that if a user at time &lt;code&gt;t&lt;/code&gt; observes an effect (written data) from the &lt;code&gt;T&lt;/code&gt; transaction, then at any subsequent time &lt;code&gt;t'&lt;/code&gt; they observe all effects from the &lt;code&gt;T&lt;/code&gt; transaction. For example, if user 1 changes rows with &lt;code&gt;k_1&lt;/code&gt; and &lt;code&gt; k_2&lt;/code&gt; keys in a single or different dynamic tables, it is impossible that user 2 reads the changed &lt;code&gt;k_1&lt;/code&gt; row, but not the changed k_2 row.&lt;/p&gt;\n&lt;p&gt;Tables have the &lt;code&gt;atomicity&lt;/code&gt; attribute which defines the guarantees for the transactions to be applied. This attribute can only be changed for &lt;a href=\"user-guide/dynamic-tables/overview.html#mount_table\"&gt;unmounted&lt;/a&gt; tables. The attribute values can be the following:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;full&lt;/code&gt;: Means that transactions are fully atomic (default mode). In &lt;code&gt;full&lt;/code&gt; mode, changes become atomically visible at any time after commit timestamp (as stated earlier, the system provides a snapshot isolation level in this mode).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;none&lt;/code&gt;: Means that the system does not give any guarantees about the atomicity of the changes. In &lt;code&gt;none&lt;/code&gt; mode, there may be situations where commit fails (for example, because a tablet is not available), but some of the changes are committed and became visible to users.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"non-atomicity\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/transactions.html#non-atomicity\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Non-atomic transactions&lt;/span&gt;&lt;/a&gt;Non-atomic transactions&lt;/h3&gt;\n&lt;p&gt;For non-atomic transactions, the isolation level can be considered read committed. Reading within non-atomic transactions is not performed relative to the start time (there is no start time as such). Instead, the most recently written data is read.&lt;/p&gt;\n&lt;p&gt;Values written by non-atomic transactions receive timestamps, but the timestamps are generated by the clients based on system clock data. YTsaurus checks that the timestamp data does not differ from the server timestamps generated in a serialized way by more than the &lt;code&gt;client_timestamp_threshold&lt;/code&gt; value (the default value is one minute) in the system configuration. If the difference between the client and server clocks exceeds the specified threshold, the client will get the &lt;code&gt;Transaction timestamp is off limits, check the local clock readings&lt;/code&gt; error.&lt;br /&gt;\nEven with non-atomic modifications within a row, the uniqueness and monotony of the timestamps are guaranteed. For this, the YTsaurus system corrects the timestamps received from the client upwards if necessary.&lt;/p&gt;\n&lt;p&gt;Non-atomic transactions do not take locks, so the transaction that is committed last (last write wins) is counted for concurrent writes. Successful completion of a non-atomic transaction means that all changes are applied on the server.&lt;/p&gt;\n&lt;p&gt;In case of non-atomic transactions, outside observers may see only partially applied changes during commit time. For atomic transactions, visibility of a part of the changes at any time by anyone means visibility of all the changes. Once the commit is complete in any mode except &lt;code&gt;atomicity=none&lt;/code&gt; + &lt;code&gt;durability=async&lt;/code&gt; (you can read about &lt;code&gt;durability&lt;/code&gt; &lt;a href=\"en/user-guide/dynamic-tables/transactions.html#durability\"&gt;here&lt;/a&gt;), all changes are guaranteed to be visible to all.&lt;/p&gt;\n&lt;p&gt;To use non-atomic transactions, you need to:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Specify the &lt;code&gt;atomicity&lt;/code&gt; attribute equal to &lt;code&gt;none&lt;/code&gt; for the table.&lt;/li&gt;\n&lt;li&gt;Specify the &lt;code&gt;atomicity=none&lt;/code&gt; mode in the settings when starting a transaction.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;At the time of commit, the server checks the atomicity mode of the table and the atomicity mode specified by the client. If the modes do not match, an execution time error occurs. There are two reasons why it is mandatory to specify atomicity mode for a transaction:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Ideological: To ensure that places in the code where non-atomic commits occur are explicitly marked.&lt;/li&gt;\n&lt;li&gt;Technical: When an atomic transaction starts, there is an additional delay due to the calculation of the start timestamp. For non-atomic transactions, this timestamp does not make sense. This makes it impossible to start a non-atomic transaction for free and only find out that it is non-atomic at the time of commit.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Many versions of the same value can be written to tables with &lt;code&gt;atomicity=none&lt;/code&gt; at one time. For example, on the writing side, the repeated query goes into an infinite cycle, or a replicated table with an accumulated queue writes it all at to the replica at once. This causes the table data not to be able to be written to the disk and writing to it is stopped.&lt;/p&gt;\n&lt;p&gt;Therefore, we recommend setting the following options for tables with &lt;code&gt;atomicity=none&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;min_data_ttl = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\nmerge_rows_on_flush = %&lt;span class=\"hljs-literal\"&gt;&lt;span class=\"hljs-keyword\"&gt;true&lt;/span&gt;&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"175\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-175\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-175\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-175.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;In non-atomic transaction mode, the system behaves almost identically to &lt;a href=\"https://hbase.apache.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apache HBase&lt;/a&gt;. By weakening guarantees, each write requires only one round-trip to the server and one disk write cycle (tens of milliseconds).&lt;/p&gt;\n&lt;h2 id=\"durability\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/transactions.html#durability\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Durability&lt;/span&gt;&lt;/a&gt;Durability&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The &lt;code&gt;durabilty&lt;/code&gt; parameter has been deprecated. When removed, the behavior will be equivalent to the behavior with &lt;code&gt;durability=sync&lt;/code&gt;. As an alternative way to obtain guarantees provided by the &lt;code&gt;durability=async&lt;/code&gt; mode, we suggest not waiting for the response to CommitTransaction.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Transaction durability means that if the user at time &lt;code&gt;t&lt;/code&gt; successfully commits a &lt;code&gt;T&lt;/code&gt; transaction (receives confirmation from the server), then at any subsequent &lt;code&gt;t'&lt;/code&gt; time, they observe all the effects of a &lt;code&gt;T&lt;/code&gt; transaction.&lt;/p&gt;\n&lt;p&gt;For non-atomic transactions, there is also a way to drastically reduce their latency to units of milliseconds at the cost of preservation. When starting a transaction, you can specify the &lt;code&gt;durability&lt;/code&gt; parameter that has the following values:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;async: The transaction was accepted by the server, saved to memory, and, if there are no failures, will at some point be written to the disk (for non-atomic transactions only). In this mode, the read-after-write guarantee is also lost.&lt;/li&gt;\n&lt;li&gt;sync: The transaction was accepted by the server, validated by the server quorum, and saved to the logs on the disk. If replication settings are correct and there are no serious problems, it survives failures (default mode).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"methods\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/transactions.html#methods\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Supported operations&lt;/span&gt;&lt;/a&gt;Supported operations&lt;/h2&gt;\n&lt;h3 id=\"create\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/transactions.html#create\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Creating a transaction&lt;/span&gt;&lt;/a&gt;Creating a transaction&lt;/h3&gt;\n&lt;p&gt;There are two types of transactions in YTsaurus:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Master transactions: They are created and maintained on the master and enable you to work with Cypress only.&lt;/li&gt;\n&lt;li&gt;Tablet transactions: They are created by clients without the master and enable you to work with dynamic tables, but not Cypress.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The transaction type is specified by the client when the transaction is created. When a transaction is started, the system generates a transaction start timestamp. In case of a master transaction, the timestamp is registered on the master and periodically polled by the client. In case of a tablet transaction, its state is handled by the client library. From YTsaurus's point of view, the transaction is not visible and does not cost anything.&lt;/p&gt;\n&lt;p&gt;You can write of one or more dynamic tables within a single tablet transaction to a random set of rows. You cannot write to dynamic tables from master transactions.&lt;/p&gt;\n&lt;p&gt;You can specify the &lt;code&gt;atomicity&lt;/code&gt; and &lt;code&gt;durability&lt;/code&gt; settings for tablet transactions.&lt;/p&gt;\n&lt;h3 id=\"insert_rows\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/transactions.html#insert_rows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Writing rows&lt;/span&gt;&lt;/a&gt;Writing rows&lt;/h3&gt;\n&lt;p&gt;The client can write data within the active transaction using the &lt;code&gt;insert_rows&lt;/code&gt; method. To do this, the rows to be written must be reported. All key fields must be present in each such row. Some of the data fields from those specified in the schema may be missing.&lt;/p&gt;\n&lt;p&gt;Semantically, if a row with the specified key is not in the table, it appears. If there is already a row with this key, some of the columns are overwritten.&lt;/p&gt;\n&lt;p&gt;When part of the fields are specified, the following modes exist:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;overwrite&lt;/code&gt;: All unspecified fields update their values to &lt;code&gt;null&lt;/code&gt; (default mode).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;update&lt;/code&gt;: Enabled by the &lt;code&gt;update == true&lt;/code&gt; option. The previous value will then be retained. In this mode, all columns marked with the &lt;code&gt;required&lt;/code&gt; attribute must be transmitted.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;When reading and executing an SQL query, the data is visible only when the transaction starts. Changes written within the same transaction are not available for reading.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"terminate\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/transactions.html#terminate\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Completing a transaction&lt;/span&gt;&lt;/a&gt;Completing a transaction&lt;/h3&gt;\n&lt;p&gt;This call sends the changes accumulated during operation to the cluster and a commit attempt is made. It can be successful, and if it is, the client will know the transaction end timestamp. A commit may fail (for reasons ranging from network problems and temporary unavailability of individual cluster nodes to conflicts between transactions). There is no built-in reliable means to find out if a commit has been completed successfully (the relevant message may have gotten lost on the way to the client).&lt;/p&gt;\n&lt;h3 id=\"abort\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/transactions.html#abort\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Aborting a transaction&lt;/span&gt;&lt;/a&gt;Aborting a transaction&lt;/h3&gt;\n&lt;p&gt;On the client, the memory occupied by the changes accumulated in the transaction is freed up. If this is a master transaction, it is aborted on the master server. If this is a tablet transaction, no further actions are required.&lt;/p&gt;\n&lt;h3 id=\"conflicts\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/transactions.html#conflicts\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Checking transaction conflicts&lt;/span&gt;&lt;/a&gt;Checking transaction conflicts&lt;/h3&gt;\n&lt;p&gt;To check and prevent conflicts between atomic transactions that work (lock read or modify operations) with data overlapping by keys, there are locks on the table rows:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;In case of read locks, shared-locks are used.&lt;/li&gt;\n&lt;li&gt;Exclusive-locks are used to modify data.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;In the simplest case without further configuration, there is one basic &lt;a href=\"https://en.wikipedia.org/wiki/Readers%E2%80%93writer_lock\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;shared-exclusive lock&lt;/a&gt; associated with each key. This feature is implemented in the form of a shared-lock counter and an exclusive-lock flag.&lt;/p&gt;\n&lt;p&gt;By default, locks apply immediately to entire rows. You can increase the granularity of locks in the system by marking the columns in the schema with a &lt;code&gt;lock&lt;/code&gt; attribute and specifying the name of an additional lock. In this way, you can divide the columns into groups, each controlled by a different lock. If no &lt;code&gt;lock&lt;/code&gt; attribute is specified for a column, it is considered to be controlled by the main lock. If the transaction writes by key, it takes the locks controlling all affected columns.&lt;/p&gt;\n&lt;p&gt;You cannot take an additional lock if another transaction has already taken the main lock. When deleting a row, the transaction takes the main lock.&lt;/p&gt;\n&lt;h4 id=\"exclusive_lock\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/transactions.html#exclusive_lock\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Modification lock&lt;/span&gt;&lt;/a&gt;Modification lock&lt;/h4&gt;\n&lt;p&gt;It is guaranteed that there cannot be two transactions modifying the same key at the same time.&lt;br /&gt;\nWhen modifying data by key, whether reading or writing,, the transaction takes an exclusive-lock by that key at the moment of commit. If the specified lock has already been taken by another modify transaction or by some number of read transactions that have taken shared-locks, a conflict occurs and the transaction is aborted.&lt;/p&gt;\n&lt;p&gt;It is guaranteed that transactions with overlapping lifetimes cannot write data by the same key.&lt;br /&gt;\nLocks on rows are only taken and retained during commit. Until then, the data is on the client. Commit in the system is two-phase and its process starts with the &lt;code&gt;prepare&lt;/code&gt; timestamp and ends with the &lt;code&gt;commit&lt;/code&gt; timestamp.&lt;br /&gt;\nFor example, &lt;code&gt;A&lt;/code&gt; and &lt;code&gt;B&lt;/code&gt; transactions were started at about the same time, then &lt;code&gt;A&lt;/code&gt; performed a write by &lt;code&gt;k&lt;/code&gt; key and was committed. A &lt;code&gt;B&lt;/code&gt; transaction could now perform a write by &lt;code&gt;k&lt;/code&gt; key and be committed, because there is no longer any lock on &lt;code&gt;k&lt;/code&gt;. But this behavior is contrary to the snapshot isolation level provided by the system.&lt;/p&gt;\n&lt;p&gt;Therefore, when a &lt;code&gt;B&lt;/code&gt; transaction modifies a key, in addition to checking a lock on that key, the system also checks:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Whether there were any writes with timestamps greater than &lt;code&gt;Tstart(B)&lt;/code&gt; on that key.&lt;/li&gt;\n&lt;li&gt;Whether this key was locked by another transaction before the time greater than &lt;code&gt;Tstart(B)&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If at least one of the conditions is not met, a conflict occurs.&lt;/p&gt;\n&lt;h4 id=\"shared_lock\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/transactions.html#shared_lock\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Read lock&lt;/span&gt;&lt;/a&gt;Read lock&lt;/h4&gt;\n&lt;p&gt;In case of a read lock, in addition to checking whether the shared-lock can be taken, only the lack of modifications to the given key with timestamps greater than &lt;code&gt;Tstart(B)&lt;/code&gt; is checked. The structure for transaction conflict checking is defined by a shared-lock counter, an exclusive-lock flag, and two timestamps — the time before which the row was locked for reading and the time of the last modification of the row.&lt;/p&gt;\n&lt;p&gt;When row modification is complete, the exclusive-lock is released and the timestamp of the last modification is written to the commit timestamp. When a transaction that takes read locks (shared-locks) is complete, the shared-lock is released at the end of the commit process, and in case of a strong-lock, the transaction commit timestamp is written. In case of a weak-lock, no timestamp is written.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/dynamic-tables/transactions.md","sourcePath":"en/user-guide/dynamic-tables/transactions.md"},"headings":[{"title":"Restrictions","href":"en/user-guide/dynamic-tables/transactions.html#restrictions","level":2},{"title":"Timestamps","href":"en/user-guide/dynamic-tables/transactions.html#timestamps","level":2},{"title":"Weakening guarantees","href":"en/user-guide/dynamic-tables/transactions.html#guarantees","level":2},{"title":"Atomicity","href":"en/user-guide/dynamic-tables/transactions.html#atomicity","level":2,"items":[{"title":"Non-atomic transactions","href":"en/user-guide/dynamic-tables/transactions.html#non-atomicity","level":3}]},{"title":"Durability","href":"en/user-guide/dynamic-tables/transactions.html#durability","level":2},{"title":"Supported operations","href":"en/user-guide/dynamic-tables/transactions.html#methods","level":2,"items":[{"title":"Creating a transaction","href":"en/user-guide/dynamic-tables/transactions.html#create","level":3},{"title":"Writing rows","href":"en/user-guide/dynamic-tables/transactions.html#insert_rows","level":3},{"title":"Completing a transaction","href":"en/user-guide/dynamic-tables/transactions.html#terminate","level":3},{"title":"Aborting a transaction","href":"en/user-guide/dynamic-tables/transactions.html#abort","level":3},{"title":"Checking transaction conflicts","href":"en/user-guide/dynamic-tables/transactions.html#conflicts","level":3,"items":[{"title":"Modification lock","href":"en/user-guide/dynamic-tables/transactions.html#exclusive_lock","level":4},{"title":"Read lock","href":"en/user-guide/dynamic-tables/transactions.html#shared_lock","level":4}]}]}],"title":"Multi-versioning and transactions of dynamic tables"},"router":{"pathname":"en/user-guide/dynamic-tables/transactions","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
