            {"data":{"leading":false,"html":"&lt;p&gt;This section describes how to run MapReduce operations on dynamic tables and tells you about data consistency. Examples of converting a static table into a dynamic table and vice versa are given.&lt;/p&gt;\n&lt;p&gt;Everything described applies equally to all types of operations — map, merge, etc., and not only directly to map-reduce, and the read-table command.&lt;/p&gt;\n&lt;h2 id=\"overview\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/mapreduce.html#overview\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Overview&lt;/span&gt;&lt;/a&gt;Overview&lt;/h2&gt;\n&lt;p&gt;YTsaurus can run MapReduce operations on top of &lt;a href=\"user-guide/dynamic-tables/overview.html#types\"&gt;sorted and ordered&lt;/a&gt; dynamic tables. You can also quickly (at the metadata level) convert a static table into a dynamic table.&lt;/p&gt;\n&lt;p&gt;Since static and dynamic tables were originally created for different work scenarios, there are several fundamental differences between them (both sorted and ordered).&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;When inserted into a dynamic table, the data first gets into the log and a special in-memory storage (the dynamic store), and only after that it is written to chunks on the disks in the form of versioned rows (until the data is written to chunks, fault tolerance is guaranteed by the log). Data from static tables is always written to chunks on the disks.&lt;/li&gt;\n&lt;li&gt;All keys in a &lt;em&gt;sorted&lt;/em&gt; dynamic table are unique. Table rows are uniquely determined by their key.&lt;/li&gt;\n&lt;li&gt;All data in a &lt;em&gt;sorted&lt;/em&gt; dynamic table is versioned: when inserted into a sorted dynamic table, the commit timestamp is assigned to it. When reading, you can specify a timestamp to get the table row version for the specified time slice.&lt;/li&gt;\n&lt;li&gt;In &lt;em&gt;sorted&lt;/em&gt; dynamic tables, compaction occurs periodically: old data versions are deleted, chunks are overwritten.&lt;/li&gt;\n&lt;li&gt;Neither &lt;em&gt;sorted&lt;/em&gt; nor &lt;em&gt;ordered&lt;/em&gt; dynamic tables allow pass-through indexing by row number: in sorted dynamic tables, it is completely impossible, in ordered dynamic tables, it is possible within each tablet separately.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"running_operations_over_dyn_tables\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/mapreduce.html#running_operations_over_dyn_tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Running operations on dynamic tables&lt;/span&gt;&lt;/a&gt;Running operations on dynamic tables&lt;/h2&gt;\n&lt;p&gt;&lt;em&gt;This section applies to both sorted and ordered tables.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;A dynamic table can be specified as an input one (or one of the input tables) for a MapReduce operation. The MapReduce operation interface is the same as static tables have, except that you specify the path to the dynamic table instead of the path to the static table. The dynamic table can be either mounted or unmounted. A &lt;a href=\"user-guide/dynamic-tables/bulk-insert.html\"&gt;separate article&lt;/a&gt; is devoted to the use of dynamic tables as output tables for the operation.&lt;/p&gt;\n&lt;p&gt;Since ordinary MapReduce operations work with chunks and dynamic tables store some data in memory in dynamic stores, there is some specificity in running operations on dynamic tables. By default, data from dynamic stores is not visible from operations. There are several ways to bypass this restriction.&lt;/p&gt;\n&lt;p&gt;A suitable method in most cases is to first unmount the table and then specify the &lt;code&gt;@enable_dynamic_store_read=%true&lt;/code&gt; attribute on it, after which all data will be visible from operations. This is a popular approach if you want fresh data, but there are side effects:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The results of successive runs of the same operation on top of the same table (even under snapshot lock) may differ, because the second run will read more fresh rows. For this reason, caching in YQL is disabled for tables with&lt;code&gt;@enable_dynamic_store_read&lt;/code&gt;. For idempotency, you must &lt;a href=\"en/user-guide/dynamic-tables/mapreduce.html#dyntable_mr_timestamp\"&gt;explicitly specify a timestamp&lt;/a&gt; or &lt;a href=\"en/user-guide/dynamic-tables/mapreduce.html#dyntable_mr_ordered\"&gt;a set of row indexes&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;If a table has a set &lt;code&gt;@merge_rows_on_flush&lt;/code&gt; attribute, it's currently impossible to ensure consistent read by timestamp when &lt;code&gt;@enable_dynamic_store_read&lt;/code&gt; is enabled.&lt;/li&gt;\n&lt;li&gt;If one tablet is read by hundreds of jobs, there is a risk of overloading the tablet nodes.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If, for whatever reason, you do not want to use this mode, there are some other ways:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Unmount the table. When the dynamic table is unmounted, all of its data is stored in chunks.&lt;/li&gt;\n&lt;li&gt;Freeze the table using the &lt;code&gt;freeze-table&lt;/code&gt; command and wait until all tablets are in &lt;code&gt;frozen&lt;/code&gt; state. In this state all data is written to the chunks, no new data can be written, but the table can be read using the &lt;code&gt;lookup-rows&lt;/code&gt; and &lt;code&gt;select-rows&lt;/code&gt; commands. You can execute MapReduce operations.&lt;/li&gt;\n&lt;li&gt;Order the table state at a point in time in the past so that all data is already in the chunks.&lt;/li&gt;\n&lt;li&gt;Do nothing and get the data from the chunks as in clause 3, but with no guarantee that all keys will refer to the same table version (data is written to the disk at different times in different tablets, there is no synchronization between them).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;You can run operations that ignore dynamic stores and read only from chunks on top of tables with enabled &lt;code&gt;@enable_dynamic_store_read&lt;/code&gt;. To do this, explicitly specify &lt;code&gt;enable_dynamic_store_read = %false&lt;/code&gt; in the spec root.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"dyntable_mr_timestamp\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/mapreduce.html#dyntable_mr_timestamp\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Running operations on the state of a sorted dynamic table at a particular point in time&lt;/span&gt;&lt;/a&gt;Running operations on the state of a sorted dynamic table at a particular point in time&lt;/h2&gt;\n&lt;p&gt;By default, the most recent row version contained in the chunks gets into the MapReduce operation. If the table is mounted, the versions in the chunks may be inconsistent: it may be for two different rows from the same transaction that one row is already in the chunk and the other is still in RAM. As a result, the MapReduce operation will only display some of the transaction rows. If &lt;code&gt;@enable_dynamic_store_read&lt;/code&gt; is enabled, inconsistency is also possible because the jobs read different parts of the table at different times, and writing may have occurred between reads. In cases where it is important to maintain a consistent table state in the MapReduce operation, you must specify a timestamp in the special YPath attribute: &lt;code&gt;&amp;lt;timestamp=123456789&amp;gt;//path/to/dynamic/sorted/table&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;There is a lower and upper limit on &lt;code&gt;timestamp&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Since the data is periodically compacted, &lt;code&gt;timestamp&lt;/code&gt; cannot be less than the value of the &lt;code&gt;@retained_timestamp&lt;/code&gt; attribute. Compaction clears old data, but only the one preceding &lt;code&gt;@retained_timestamp&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;If the &lt;code&gt;@enable_dynamic_store_read&lt;/code&gt; attribute is specified on the table, there is no upper limit. However, if you specify &lt;code&gt;timestamp&lt;/code&gt; from the future, consistency is not ensured.&lt;/li&gt;\n&lt;li&gt;If &lt;code&gt;@enable_dynamic_store_read&lt;/code&gt; is not specified, &lt;code&gt;timestamp&lt;/code&gt; must be smaller than the timestamp of those rows that have not yet been written to the disk. You can find out the timestamp via the &lt;code&gt;unflushed_timestamp&lt;/code&gt; table attribute.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Thus, if reading from dynamic stores is enabled, we recommend taking the current timestamp (it can be obtained using the &lt;a href=\"api/commands#generate_timestamp\"&gt;generate_timestamp&lt;/a&gt; command). When reading from a replica table, &lt;code&gt;timestamp&lt;/code&gt; must be generated on the metacluster. If reading from dynamic stores is not enabled, use &lt;code&gt;unflushed_timestamp - 1&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;When specifying &lt;code&gt;timestamp&lt;/code&gt;, the scheduler will check that the timestamp value falls within the permitted interval.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;unflushed_timestamp&lt;/code&gt; and &lt;code&gt;retained_timestamp&lt;/code&gt; attribute values of a mounted table are constantly changing, so you must use snapshot lock when working with the table. There are no guarantees that &lt;code&gt;retained_timestamp&lt;/code&gt; is always less than &lt;code&gt;unflushed_timestamp&lt;/code&gt;. The listed values depend on the compaction settings and the process of writing data to the chunks, and if this condition is violated too often, the table settings will have to be changed.&lt;/p&gt;\n&lt;p&gt;Pay attention to the following attributes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;dynamic_store_auto_flush_period&lt;/code&gt;: The frequency with which data is flushed to the disk. It makes sense if &lt;code&gt;@enable_dynamic_store_read&lt;/code&gt; is disabled. The default value is 15 minutes.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;min_data_ttl&lt;/code&gt;: Determines to what extent old data must not be compacted. For more information, see &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html#remove_old_data\"&gt;Sorted dynamic tables&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The current implementation does not support operations with timestamp indication on tables mounted in non-atomic mode.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"dyntable_mr_ordered\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/mapreduce.html#dyntable_mr_ordered\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Running operations on ordered tables&lt;/span&gt;&lt;/a&gt;Running operations on ordered tables&lt;/h2&gt;\n&lt;p&gt;Ordered dynamic tables are quite similar to static tables. The differences in terms of operations are that indexing by row numbers is performed separately within each tablet (and indexing may not start at zero because of &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables.html#trim\"&gt;trim&lt;/a&gt;) and fresh data in each tablet is in the dynamic store.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The effect of trim may not be immediately seen in the operation. The situation in which rows deleted via trim are included in the operation is considered allowable.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"indexing\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/mapreduce.html#indexing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Indexing&lt;/span&gt;&lt;/a&gt;Indexing&lt;/h3&gt;\n&lt;p&gt;The &lt;code&gt;enable_tablet_index&lt;/code&gt; &lt;a href=\"user-guide/storage/io-configuration.html#control_attributes\"&gt;control attribute&lt;/a&gt; is available in operations on ordered tables. The &lt;code&gt;enable_row_index&lt;/code&gt; attribute has a different semantics than in static tables: the returned row index is counted relative to the beginning of the tablet. Row numbering within the tablet is logical, i.e. even if trim is performed, the existing row numbers will not change.&lt;/p&gt;\n&lt;p&gt;Row and tablet indexes can also be specified in &lt;a href=\"user-guide/storage/ypath.html#known_attributes\"&gt;ypath ranges&lt;/a&gt;. Each row in the ordered table is indexed in a pair &lt;code&gt;(tablet_index, row_index)&lt;/code&gt;. The &lt;code&gt;lower_limit = {tablet_index = a; row_index = b}&lt;/code&gt; lower limit allows rows from tablet &lt;code&gt;a&lt;/code&gt; with indexes &lt;code&gt;b&lt;/code&gt; and greater and all rows from tablets with indexes greater than &lt;code&gt;a&lt;/code&gt;. The &lt;code&gt;upper_limit = {tablet_index = c; row_index = d}&lt;/code&gt; upper limit allows rows from tablets with indexes less than &lt;code&gt;c&lt;/code&gt; and rows from tablet &lt;code&gt;c&lt;/code&gt; with indexes strictly less than &lt;code&gt;d&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;You can specify only &lt;code&gt;tablet_index&lt;/code&gt; within the limit. The lower limit of the &lt;code&gt;{tablet_index = e}&lt;/code&gt; type allows all rows of tablets with numbers not less than &lt;code&gt;e&lt;/code&gt; and the upper limit of this type allows all rows of tablets with numbers strictly less than &lt;code&gt;e&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;There is a limit on the number of ranges in YPath. If the number of tablets in an ordered table exceeds 100, and you plan to specify one range per each tablet of an ordered table in the operation, discuss it with the cluster administrators.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"allowable-index-limits\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/mapreduce.html#allowable-index-limits\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Allowable index limits&lt;/span&gt;&lt;/a&gt;Allowable index limits&lt;/h3&gt;\n&lt;p&gt;As with timestamp for sorted tables, row index in the ordered table has an upper and lower limit within the tablet. The lower limit has to do with deleting rows via trim. The upper one is related to storing rows in the dynamic store and makes sense if &lt;a href=\"en/user-guide/dynamic-tables/mapreduce.html#running_operations_over_dyn_tables\"&gt;enable_dynamic_store_read&lt;/a&gt; does not work for you and you want to run an operation on a mounted table.&lt;/p&gt;\n&lt;p&gt;Limits can be obtained from the &lt;code&gt;@tablets&lt;/code&gt; table attribute. The value corresponding to each tablet has the &lt;code&gt;trimmed_row_count&lt;/code&gt; and &lt;code&gt;flushed_row_count&lt;/code&gt; fields.&lt;/p&gt;\n&lt;p&gt;Unlike timestamp, the correctness of indexes for ordered tables is &lt;strong&gt;not validated&lt;/strong&gt;: if you specify indexes outside the specified limits, the operation will simply read less data than expected.&lt;/p&gt;\n&lt;h2 id=\"convert_table\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/mapreduce.html#convert_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Converting a static table into a dynamic table&lt;/span&gt;&lt;/a&gt;Converting a static table into a dynamic table&lt;/h2&gt;\n&lt;p&gt;To convert a static table into a dynamic table, run the &lt;code&gt;alter-table&lt;/code&gt; command:&lt;/p&gt;\n&lt;div class=\"yfm-tabs\" data-diplodoc-group=\"defaultTabsGroup-rpnznp1e\" data-diplodoc-variant=\"regular\"&gt;\n&lt;div class=\"yfm-tab-list\" role=\"tablist\"&gt;\n&lt;div data-diplodoc-id=\"cli\" data-diplodoc-key=\"cli\" class=\"yfm-tab yfm-tab-group active\" role=\"tab\" tabindex=\"0\" data-diplodoc-is-active=\"true\"&gt;CLI&lt;/div&gt;\n&lt;div data-diplodoc-id=\"python\" data-diplodoc-key=\"python\" class=\"yfm-tab yfm-tab-group\" role=\"tab\" tabindex=\"-1\" data-diplodoc-is-active=\"false\"&gt;Python&lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"h0zxjqwa\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"CLI\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt alter-table --dynamic //tmp/t\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"235\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-235\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-235\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-235.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"1f75dpeg\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"Python\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.alter_table(&lt;span class=\"hljs-string\"&gt;\"//tmp/t\"&lt;/span&gt;, dynamic=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"238\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-238\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-238\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-238.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;p&gt;There are a few conversion peculiarities that are worth paying attention to.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;The &lt;code&gt;alter-table&lt;/code&gt; command will be executed for an unsorted table as well. The result will be an &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables.html\"&gt;ordered dynamic table&lt;/a&gt;. For such tables, the &lt;code&gt;insert-rows&lt;/code&gt; command works differently than it does for sorted tables and the &lt;code&gt;select-rows&lt;/code&gt; command will be much slower on the same queries.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;All keys in a sorted dynamic table are unique, so a static table must also contain only unique keys. The system identifies this fact by the &lt;code&gt;@unique_keys&lt;/code&gt; attribute in the schema. You cannot set this attribute to the schema of an existing non-empty table using the &lt;code&gt;alter-table&lt;/code&gt; command. You need to specifically create a table with the specified &lt;code&gt;unique_keys=true&lt;/code&gt; attribute in the schema. The uniqueness of keys will be validated when writing. If the schema of a created table has a set &lt;code&gt;unique_keys=false&lt;/code&gt; attribute when all of the table keys are unique, you need to create a new table with a revised schema and copy the data into it using the &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt; operation.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Typical chunk and block sizes for dynamic tables are smaller than for static tables. If the table is to be converted into a dynamic table, set certain parameters in the spec of the operation generating the table:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-string\"&gt;\"job_io\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"table_writer\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"block_size\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;256&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;**&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"desired_chunk_size\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;100&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;**&lt;span class=\"hljs-number\"&gt;20&lt;/span&gt;}}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"259\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-259\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-259\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-259.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If an operation has more than one job type, the config only needs to be specified for &lt;code&gt;job_io&lt;/code&gt; of the last job type in the operation (&lt;code&gt;merge_job_io&lt;/code&gt; for the Sort operation, &lt;code&gt;reduce_job_io&lt;/code&gt; for the MapReduce operation). If the operation uses &lt;a href=\"user-guide/data-processing/operations/automerge.html\"&gt;automatic merging of chunks&lt;/a&gt;, a similar config must be specified in the &lt;code&gt;\"automerge\": {\"job_io\": {...}}&lt;/code&gt; section.&lt;/p&gt;\n&lt;p&gt;For more information about &lt;code&gt;job_io&lt;/code&gt; for different types of operations, see &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Operation options&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;You can check the sizes of chunks and blocks of the resulting table using the following table attributes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Chunks: &lt;code&gt;@compressed_data_size&lt;/code&gt; / &lt;code&gt;@chunk_count&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Blocks: &lt;code&gt;@chunk_format_statistics/*/max_block_size&lt;/code&gt; (attribute value is a dict containing the max_block_size value for each chunk type in the table).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Learn more about chunk and block sizes&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Dynamic tables are usually used for a quick search by key. Data in chunks is split into blocks, and when read from the disk, the entire block is read at a time. By default, the table is compressed with a specific codec, decompression will also be applied to the entire block. To avoid applying too many calculations to search for a single row, reduce the block size. By default, static table blocks have a default size of 16 megabytes, while dynamic table blocks are 256 kilobytes. But if a static table is converted into a dynamic table, the block size remains the same as that of the original static table. Therefore, when creating a static table, you must force the block size to be reduced by specifying the &lt;code&gt;block_size&lt;/code&gt; setting in the specification.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The current YTsaurus implementation checks that the maximum block size does not exceed 512 kilobytes when attempting to query a dynamic table. Otherwise the query will end with the \"Maximum block size limit violated\" error. This is done to avoid slow reads from tables. The same error will occur with a dynamic table loaded into memory when trying to load a chunk with large blocks. To solve this problem, you can either compact the table or increase the block size limit to 32 megabytes using the &lt;code&gt;max_unversioned_block_size&lt;/code&gt; attribute (you must set the attribute on the table and then call &lt;code&gt;remount_table&lt;/code&gt;).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tablets in dynamic tables are divided into partitions. A typical partition size is several hundred megabytes. If the chunks become larger than the partition size, a background process is started that forces the chunks to be split into smaller chunks. It is also useful to specify the &lt;code&gt;desired_chunk_size&lt;/code&gt; setting in the specification when creating a dynamic table.&lt;/p&gt;\n&lt;p&gt;The chunks will then be quite small (100 megabytes each). Otherwise, the chunks will be large by default (512 MB or more). When a table is sharded into shards (tablets), these chunks can fall into multiple tables and will then be counted multiple times when calculating a table size. As a result, the dynamic table size may be several times larger than the size of the original static table.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;If the table is intended to be stored in memory (managed by the &lt;code&gt;@in_memory_mode&lt;/code&gt;attribute), we recommend performing forced compaction to achieve the best performance. The need for this is caused by the following:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The same chunk gets into different tablets, and the chunks of different tablets are loaded into memory independently (the tablets may be on different cluster nodes). As a result, more memory is consumed than necessary.&lt;/li&gt;\n&lt;li&gt;Readers for static table chunks are not optimized for cases when the data is already in memory.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If the dynamic table is to be read-only, it must be mounted in \"frozen\" state (managed by the &lt;code&gt;--freeze&lt;/code&gt; flag of the &lt;code&gt;mount-table&lt;/code&gt; command). This will prohibit writing, disable compaction, and reduce the table maintenance overhead costs. Do it only if the the chunk and block sizes are as recommended.&lt;/p&gt;\n&lt;h3 id=\"example\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/mapreduce.html#example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h3&gt;\n&lt;p&gt;Below is a script example that demonstrates how to save a sorted dynamic table into a static one and then restore it back. This operation can be performed to back up dynamic tables.&lt;/p&gt;\n&lt;p&gt;Please note that the script is not production-ready and is given for reference only. In particular, it saves only some table attributes and does not handle errors in any way.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Converting a dynamic table into a static table and vice versa&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-comment\"&gt;#!/usr/bin/python3&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; argparse\n\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;dump&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;src, dst&lt;/span&gt;):\n    &lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; yt.Transaction():\n        &lt;span class=\"hljs-comment\"&gt;# Take snapshot lock for source table.&lt;/span&gt;\n        node_id = yt.lock(src, mode=&lt;span class=\"hljs-string\"&gt;\"snapshot\"&lt;/span&gt;)[&lt;span class=\"hljs-string\"&gt;\"node_id\"&lt;/span&gt;]\n        &lt;span class=\"hljs-comment\"&gt;# Get timestamp of flushed data&lt;/span&gt;\n        &lt;span class=\"hljs-comment\"&gt;# (not required if @enable_dynamic_store_read is set).&lt;/span&gt;\n        ts = yt.get(&lt;span class=\"hljs-string\"&gt;f\"#&lt;span class=\"hljs-subst\"&gt;{node_id}&lt;/span&gt;/@unflushed_timestamp\"&lt;/span&gt;) - &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n        &lt;span class=\"hljs-comment\"&gt;# Create table and save vital attributes.&lt;/span&gt;\n        yt.create(&lt;span class=\"hljs-string\"&gt;\"table\"&lt;/span&gt;, dst, attributes={\n            &lt;span class=\"hljs-string\"&gt;\"optimize_for\"&lt;/span&gt;: yt.get(&lt;span class=\"hljs-string\"&gt;f\"#&lt;span class=\"hljs-subst\"&gt;{node_id}&lt;/span&gt;/@optimize_for\"&lt;/span&gt;),\n            &lt;span class=\"hljs-string\"&gt;\"schema\"&lt;/span&gt;: yt.get(&lt;span class=\"hljs-string\"&gt;f\"#&lt;span class=\"hljs-subst\"&gt;{node_id}&lt;/span&gt;/@schema\"&lt;/span&gt;),\n            &lt;span class=\"hljs-string\"&gt;\"_yt_dump_restore_pivot_keys\"&lt;/span&gt;: yt.get(&lt;span class=\"hljs-string\"&gt;f\"#&lt;span class=\"hljs-subst\"&gt;{node_id}&lt;/span&gt;/@pivot_keys\"&lt;/span&gt;),\n        })\n        &lt;span class=\"hljs-comment\"&gt;# Dump table contents.&lt;/span&gt;\n        yt.run_merge(yt.TablePath(&lt;span class=\"hljs-string\"&gt;f\"#&lt;span class=\"hljs-subst\"&gt;{node_id}&lt;/span&gt;\"&lt;/span&gt;, attributes={&lt;span class=\"hljs-string\"&gt;\"timestamp\"&lt;/span&gt;: ts}), dst, mode=&lt;span class=\"hljs-string\"&gt;\"ordered\"&lt;/span&gt;)\n\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;restore&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;src, dst&lt;/span&gt;):\n    &lt;span class=\"hljs-comment\"&gt;# Create destination table.&lt;/span&gt;\n    yt.create(&lt;span class=\"hljs-string\"&gt;\"table\"&lt;/span&gt;, dst, attributes={\n        &lt;span class=\"hljs-string\"&gt;\"optimize_for\"&lt;/span&gt;: yt.get(&lt;span class=\"hljs-string\"&gt;f\"&lt;span class=\"hljs-subst\"&gt;{src}&lt;/span&gt;/@optimize_for\"&lt;/span&gt;),\n        &lt;span class=\"hljs-string\"&gt;\"schema\"&lt;/span&gt;: yt.get(&lt;span class=\"hljs-string\"&gt;f\"&lt;span class=\"hljs-subst\"&gt;{src}&lt;/span&gt;/@schema\"&lt;/span&gt;),\n    })\n    &lt;span class=\"hljs-comment\"&gt;# Make blocks smaller (required for real-time lookups).&lt;/span&gt;\n    yt.run_merge(src, dst, mode=&lt;span class=\"hljs-string\"&gt;\"ordered\"&lt;/span&gt;, spec={\n        &lt;span class=\"hljs-string\"&gt;\"job_io\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"table_writer\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"block_size\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;256&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;**&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"desired_chunk_size\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;100&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;**&lt;span class=\"hljs-number\"&gt;20&lt;/span&gt;}},\n        &lt;span class=\"hljs-string\"&gt;\"force_transform\"&lt;/span&gt;: &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;,\n    })\n    &lt;span class=\"hljs-comment\"&gt;# Make table dynamic.&lt;/span&gt;\n    yt.alter_table(dst, dynamic=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n    &lt;span class=\"hljs-comment\"&gt;# Restore tablet structure.&lt;/span&gt;\n    yt.reshard_table(dst, yt.get(&lt;span class=\"hljs-string\"&gt;f\"&lt;span class=\"hljs-subst\"&gt;{src}&lt;/span&gt;/@_yt_dump_restore_pivot_keys\"&lt;/span&gt;), sync=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; __name__ ==  &lt;span class=\"hljs-string\"&gt;\"__main__\"&lt;/span&gt;:\n    parser = argparse.ArgumentParser(description=&lt;span class=\"hljs-string\"&gt;\"Dynamic tables dump-restore tool\"&lt;/span&gt;)\n    mode = parser.add_mutually_exclusive_group(required=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n    mode.add_argument(&lt;span class=\"hljs-string\"&gt;\"--dump\"&lt;/span&gt;, nargs=&lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;, metavar=(&lt;span class=\"hljs-string\"&gt;\"SOURCE\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"DESTINATION\"&lt;/span&gt;), &lt;span class=\"hljs-built_in\"&gt;help&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"Dump dynamic table to static\"&lt;/span&gt;)\n    mode.add_argument(&lt;span class=\"hljs-string\"&gt;\"--restore\"&lt;/span&gt;, nargs=&lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;, metavar=(&lt;span class=\"hljs-string\"&gt;\"SOURCE\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"DESTINATION\"&lt;/span&gt;), &lt;span class=\"hljs-built_in\"&gt;help&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"Restore dynamic table from static\"&lt;/span&gt;)\n    args = parser.parse_args()\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; args.dump:\n        dump(*args.dump)\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; args.restore:\n        restore(*args.restore)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"343\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-343\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-343\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-343.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"using-computed-columns\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/mapreduce.html#using-computed-columns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Using computed columns&lt;/span&gt;&lt;/a&gt;Using computed columns&lt;/h2&gt;\n&lt;p&gt;To distribute the load across the cluster more evenly, dynamic tables need to be sharded (split into tablets).  To distribute the load evenly across the tablets, it may be convenient to add an extra column prior to all the key columns in which to write hash from the key part by which it makes sense to perform sharding - for example, hash from the first column. The result is a table whose keys are evenly distributed in the &lt;code&gt;[0, 2^64-1]&lt;/code&gt; range.&lt;/p&gt;\n&lt;p&gt;The column added in this way is a computed column. The calculation formula must be specified in the column schema in the &lt;code&gt;expression&lt;/code&gt; field. Support for computed columns was added to all operations except &lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;Sort&lt;/a&gt;. When writing to the table, the value of such columns will be computed. To prepare a static table to be converted into a dynamic table, you must first make the table in an unsorted schema (but with computed columns), then sort it using the &lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;Sort&lt;/a&gt; operation.&lt;/p&gt;\n&lt;p&gt;Below is an example of creating a dynamic table with computed columns from a static table. Instead of &lt;code&gt;write_table&lt;/code&gt;, the table could be written to using the Map, Reduce, MapReduce, or Merge operations. In the latter case, you must specify &lt;code&gt;{'schema_inference_mode': 'from_output'}&lt;/code&gt; in the specification so that the data is validated using the output table schema. In addition, when specifying &lt;code&gt;schema_inference_mode&lt;/code&gt;, you need to create the output table of the operation manually by explicitly specifying the required schema. If you do not do this, the used API will attempt to create the output table independently using the schema inferred from the input table, which will cause errors in this case.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Creating a dynamic table with computed columns&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.yson &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yson\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; time\n\n&lt;span class=\"hljs-comment\"&gt;# Unsorted schema.&lt;/span&gt;\nschema = [\n    {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"hash\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"uint64\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"expression\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"farm_hash(key)\"&lt;/span&gt;},\n    {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"uint64\"&lt;/span&gt;},\n    {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"string\"&lt;/span&gt;}]\n\n&lt;span class=\"hljs-comment\"&gt;# Sorted schema with unique keys attribute.&lt;/span&gt;\nsorted_schema = yson.YsonList([\n    {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"hash\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"uint64\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"expression\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"farm_hash(key)\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"sort_order\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"ascending\"&lt;/span&gt;},\n    {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"uint64\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"sort_order\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"ascending\"&lt;/span&gt;},\n    {&lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"string\"&lt;/span&gt;}])\nsorted_schema.attributes[&lt;span class=\"hljs-string\"&gt;\"unique_keys\"&lt;/span&gt;] = &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Create table&lt;/span&gt;\ntable = &lt;span class=\"hljs-string\"&gt;\"//tmp/table\"&lt;/span&gt;\nyt.remove(table, force=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\nyt.create_table(table, attributes={&lt;span class=\"hljs-string\"&gt;\"schema\"&lt;/span&gt;: schema})\n\n&lt;span class=\"hljs-comment\"&gt;# Write rows into table. Computed columns are omitted: YTsaurus will evaluate them.&lt;/span&gt;\nyt.write_table(table, [{&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"2\"&lt;/span&gt;}, {&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"1\"&lt;/span&gt;}])\n\n&lt;span class=\"hljs-comment\"&gt;# Sort table. Resulting table schema has unique_keys=True.&lt;/span&gt;\nyt.run_sort(table, yt.TablePath(table, attributes={&lt;span class=\"hljs-string\"&gt;\"schema\"&lt;/span&gt;: sorted_schema}), sort_by=[&lt;span class=\"hljs-string\"&gt;\"hash\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;], spec={\n    &lt;span class=\"hljs-string\"&gt;\"partition_job_io\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"table_writer\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"block_size\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;256&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;**&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;}},\n    &lt;span class=\"hljs-string\"&gt;\"merge_job_io\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"table_writer\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"block_size\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;256&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;**&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;}},\n    &lt;span class=\"hljs-string\"&gt;\"sort_job_io\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"table_writer\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"block_size\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;256&lt;/span&gt; * &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;**&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;}}})\n\n&lt;span class=\"hljs-comment\"&gt;# Alter table into dynamic.&lt;/span&gt;\nyt.alter_table(table, dynamic=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n\n&lt;span class=\"hljs-comment\"&gt;# Mount table and wait until all tablets are mounted.&lt;/span&gt;\nyt.mount_table(table, sync=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n\n&lt;span class=\"hljs-comment\"&gt;# Print rows.&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; row &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; yt.select_rows(&lt;span class=\"hljs-string\"&gt;\"* from [{}]\"&lt;/span&gt;.&lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;(table)):\n    &lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt; row\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"363\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-363\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-363\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-363.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"examples-of-running-the-operations\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/mapreduce.html#examples-of-running-the-operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples of running the operations&lt;/span&gt;&lt;/a&gt;Examples of running the operations&lt;/h2&gt;\n&lt;p&gt;Running a Map operation:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt map &lt;span class=\"hljs-string\"&gt;'grep some_value'&lt;/span&gt; --src //path/to/dynamic/table --dst //tmp/output --spec &lt;span class=\"hljs-string\"&gt;'{pool = \"project-pool\"; job_count = 100; }'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"372\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-372\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-372\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-372.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Running a Reduce operation:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt reduce &lt;span class=\"hljs-string\"&gt;'python my_reducer.py'&lt;/span&gt; --src //path/to/dynamic/table --dst &lt;span class=\"hljs-string\"&gt;'&amp;lt;sorted_by = [\"key\"]&amp;gt;'&lt;/span&gt;//tmp/output\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"376\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-376\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-376\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-376.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/dynamic-tables/m
