            {"data":{"leading":false,"html":"&lt;p&gt;A tablet of a sorted dynamic table is an &lt;a href=\"https://en.wikipedia.org/wiki/Log-structured_merge-tree\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;LSM tree&lt;/a&gt;. When a row is written, it enters the dynamic store. As the dynamic store gets filled with data, it is flushed to the chunks on the disk. A background compaction process periodically combines several chunks. It is needed to:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Apply &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables#udalenie-stroki\"&gt;delete tombstones&lt;/a&gt; and physically delete rows.&lt;/li&gt;\n&lt;li&gt;Delete old versions.&lt;/li&gt;\n&lt;li&gt;Reduce overlapping store count, the number of chunks in which a fixed key may need to be searched.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Compaction relies mainly on heuristics. However, depending on the table write scenario, the optimal approaches may differ. For example:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;If a small max_data_ttl is set on the table, it makes sense to periodically compact the old chunks and free up space.&lt;/li&gt;\n&lt;li&gt;If rows are regularly deleted, we recommend examining the chunk that contains insertions and deletions during compaction in order to physically delete the rows.&lt;/li&gt;\n&lt;li&gt;If the table write stream is large, you can sacrifice read optimality and loosen the overlapping store count settings in favor of reducing write amplification — the ratio of the data amount processed by compaction to the amount of written data, and vice versa.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"glossary\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/compaction.html#glossary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Glossary&lt;/span&gt;&lt;/a&gt;Glossary&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Dynamic store&lt;/strong&gt;: A structure for storing freshly written rows; it is located in RAM. Analog of MemTable.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Chunk&lt;/strong&gt;: An immutable structure for storing rows flushed to the disk. Analog of SSTable.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Store&lt;/strong&gt;: A common name for chunks and dynamic stores. Technically speaking, chunk stores (and dynamic stores), not chunks are stored in the tablet, but the chunk and chunk store terms are usually interchangeable.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Partition&lt;/strong&gt;: A part of the tablet's subdivision. Similarly to tables that are split into tablets bounded by pivot keys, tablets are split into partitions. Chunks within a partition do not cross its boundaries.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Eden&lt;/strong&gt;: A special partition containing chunks that cannot be placed in any other partition because they cross their boundaries. Chunks typically do not live long in Eden, quickly undergoing partitioning.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Overlapping store count&lt;/strong&gt;, &lt;strong&gt;OSC&lt;/strong&gt;: Maximum overlap of chunks; maximum number of chunks covering a particular key. Limits fan-in from above, i.e. the number of chunks that actually have to be read in order to get the actual value by key.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Flush&lt;/strong&gt;: The process of flushing data from a dynamic store to a chunk on the disk.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Compaction&lt;/strong&gt;: The process of merging chunks that involves discarding old versions of data, removing delete tombstones, and combining small chunks.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Partitioning&lt;/strong&gt;: A process that is similar to compaction, except its purpose is not to combine chunks, but to split chunks located in Eden into different partitions.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Background processes&lt;/strong&gt;: A collective term for flush+compaction+partitioning.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Write amplification&lt;/strong&gt;, &lt;strong&gt;WA&lt;/strong&gt;: The ratio of the amount of data handled by background processes (compaction/partitioning) to the amount of data written to the table. It is an important effectiveness indicator of the selected parameters.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Row version&lt;/strong&gt;: In the &lt;a href=\"https://en.wikipedia.org/wiki/Multiversion_concurrency_control\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MVCC&lt;/a&gt; model, a single key can be associated with multiple values, each with its own timestamp. An individual value is called a version. Generally speaking, writes to each column can be versioned independently, so it makes sense to refer to versions of the &lt;em&gt;values&lt;/em&gt;, not a &lt;em&gt;row&lt;/em&gt; as a whole. In terms of setting up compaction, this is usually irrelevant.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"attributes\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/compaction.html#attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List of attributes&lt;/span&gt;&lt;/a&gt;List of attributes&lt;/h2&gt;\n&lt;p&gt;All values with the &lt;code&gt;Duration&lt;/code&gt; type are specified in milliseconds. All values indicating the amount of data are specified in bytes. Attributes for which there is no description have a complex semantics and we do not recommend changing them.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Many attributes influence the behavior of background compaction processes. Careless setting of attributes can create an unexpected load on a bundle or cluster.&lt;/p&gt;\n&lt;p&gt;Please use only those attributes whose meaning you understand.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Setting an attribute on a mounted table does not apply the settings. To apply settings, use the &lt;code&gt;remount-table&lt;/code&gt; command:&lt;/p&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //path/to/table/@mount_config/merge_rows_on_flush %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\nyt remount-table //path/to/table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"135\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-135\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-135\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-135.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You can find out the tablet's current settings at &lt;code&gt;//sys/tablets/x-x-x-x/orchid/config&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"flush_attributes\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/compaction.html#flush_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Flush&lt;/span&gt;&lt;/a&gt;Flush&lt;/h3&gt;\n&lt;p&gt;The following attributes regulate flush behavior.&lt;/p&gt;\n&lt;p&gt;| Name | Type | Default | Description&lt;br /&gt;\n||--|--|--|--|&lt;br /&gt;\n| dynamic_store_auto_flush_period | Duration* | 900,000 (15 min) | Frequency of forced flushes, when the dynamic store is flushed to the disk straight away, even if it hasn't reached its overflow threshold yet. |&lt;br /&gt;\n| dynamic_store_flush_period_splay | Duration | 60 000 (1 min) | Random shift for the period to avoid synchronization of different tablets. Real flush will come after &lt;code&gt;period + random(0, splay)&lt;/code&gt;. |&lt;br /&gt;\n| merge_rows_on_flush | bool | false | Allows version merging and deletion of rows by TTL at flush. |&lt;br /&gt;\n| merge_deletions_on_flush | bool | false | Allows consecutive deletions to be merged into one at flush. |&lt;br /&gt;\n| max_dynamic_store_row_count | int | 1 000 000 | Maximum number of rows in the dynamic store. |&lt;br /&gt;\n| max_dynamic_store_pool_size | int | 1 073 741 824 (1 GB) | Maximum dynamic store size. |&lt;br /&gt;\n| dynamic_store_overflow_threshold | double | 0.7 | The share of filling of the dynamic store relative to max_dynamic_store_row_count and max_dynamic_store_pool_size at which flush starts. |&lt;/p&gt;\n&lt;h3 id=\"compaction_attributes\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/compaction.html#compaction_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Compaction&lt;/span&gt;&lt;/a&gt;Compaction&lt;/h3&gt;\n&lt;h4 id=\"basic-options\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/compaction.html#basic-options\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Basic options&lt;/span&gt;&lt;/a&gt;Basic options&lt;/h4&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Name&lt;/th&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Default&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;auto_compaction_period&lt;/td&gt;\n&lt;td&gt;int*&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Frequency of periodic compaction in ms. Compaction will affect every table chunk at least once per auto_compaction_period. For more information, see &lt;a href=\"en/user-guide/dynamic-tables/compaction.html#periodic_compaction\"&gt;Periodic compaction&lt;/a&gt;. In most cases, its use isn't recommended.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;auto_compaction_period_splay_ratio&lt;/td&gt;\n&lt;td&gt;double&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;td&gt;Random shift for the period to avoid synchronization. Compaction will come after &lt;code&gt;period * (1 + random(0, splay_ratio))&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;periodic_compaction_mode&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;store&lt;/code&gt;, &lt;code&gt;partition&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;store&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;For more information, see &lt;a href=\"en/user-guide/dynamic-tables/compaction.html#periodic_compaction\"&gt;Periodic compaction&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;forced_compaction_revision&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;For more information, see &lt;a href=\"en/user-guide/dynamic-tables/compaction.html#forced_compaction\"&gt;Forced compaction&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_overlapping_store_count&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;30&lt;/td&gt;\n&lt;td&gt;Maximum number of chunks that potentially contain a key. When the threshold is reached, writing to the table will be locked until compaction optimizes the structure.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;critical_overlapping_store_count&lt;/td&gt;\n&lt;td&gt;int*&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Sets a threshold beyond which compaction ignores the size &lt;a href=\"en/user-guide/dynamic-tables/compaction.html#compaction_size_policy\"&gt;limits&lt;/a&gt; for chunks within a single partition. By setting a small value (5–10) for this option, you can reduce the OSC and data access speed at the cost of a noticeable increase in write amplification.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;enable_compaction_and_partitioning&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;td&gt;Completely disables compaction. Writing to the table in this state will quickly lead to exceeding overlapping store count. If no writing is intended, then instead of this attribute,mount the table in a frozen state.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"sizes-and-constants\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/compaction.html#sizes-and-constants\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sizes and constants&lt;/span&gt;&lt;/a&gt;Sizes and constants&lt;/h4&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Name&lt;/th&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Default&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;min_partition_data_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;96 MB&lt;/td&gt;\n&lt;td&gt;Minimum, desired, and maximum partition size.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;desired_partition_data_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;256 MB&lt;/td&gt;\n&lt;td&gt;↑&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_partition_data_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;320 MB&lt;/td&gt;\n&lt;td&gt;↑&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;min_partitioning_data_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;64 MB&lt;/td&gt;\n&lt;td&gt;Minimum and maximum data size for a single partitioning. Increasing it reduces write amplification at the cost of increasing the number of chunks in Eden and therefore increasing overlapping store count.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_partitioning_data_size&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;1 GB&lt;/td&gt;\n&lt;td&gt;↑&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;min_partitioning_store_count&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;Minimum and maximum number of chunks for a single partitioning.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_partitioning_store_count&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;5&lt;/td&gt;\n&lt;td&gt;↑&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;min_compaction_store_count&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;td&gt;Minimum and maximum number of chunks for a single compaction. Periodic and forced compactions ignore the lower estimate, but take into account the upper one.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_compaction_store_count&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;5&lt;/td&gt;\n&lt;td&gt;↑&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;compaction_data_size_base&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;16 MB&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;compaction_data_size_ratio&lt;/td&gt;\n&lt;td&gt;double&lt;/td&gt;\n&lt;td&gt;2.0&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"ttl_attributes\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/compaction.html#ttl_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Deleting old data&lt;/span&gt;&lt;/a&gt;Deleting old data&lt;/h3&gt;\n&lt;p&gt;For more information about these attributes, see &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html#remove_old_data\"&gt;Deleting old data&lt;/a&gt;.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Name&lt;/th&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Default&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;min_data_ttl&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;1 800 000 (30 min)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_data_ttl&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;1 800 000 (30 min)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;min_data_versions&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;max_data_versions&lt;/td&gt;\n&lt;td&gt;int&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"forced_compaction\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/compaction.html#forced_compaction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Forced compaction&lt;/span&gt;&lt;/a&gt;Forced compaction&lt;/h2&gt;\n&lt;p&gt;To trigger the forced compaction of all table chunks, set the &lt;code&gt;forced_compaction_revision&lt;/code&gt; attribute value to &lt;code&gt;1&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;If you execute &lt;code&gt;remount-table&lt;/code&gt;, the setting will be immediately applied to all table tablets. When working with tables of a terabyte or more, this can create a load surge both on the table bundle and on the entire cluster. Therefore, we recommend executing &lt;code&gt;remount&lt;/code&gt; of different tablets at different times. To do this, run the following command: &lt;code&gt;yt remount-table --first-tablet-index X --last-tablet-index Y&lt;/code&gt;. To estimate the recommended time for remounting the table, use the formula &lt;code&gt;table_size / bundle_node_count / (100 Mb/s)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;To abort forced compaction, delete the &lt;code&gt;forced_compaction_revision&lt;/code&gt; attribute from the table and execute &lt;code&gt;remount-table&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;If the table size is more than 20 TB or 100,000 chunks, get administrator permission before starting forced compaction.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"periodic_compaction\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/compaction.html#periodic_compaction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Periodic compaction&lt;/span&gt;&lt;/a&gt;Periodic compaction&lt;/h2&gt;\n&lt;p&gt;Compaction starts automatically when there are enough chunks in the partition. This usually happens during active writes to the table. If no writes are being made, no compaction will occur. To perform compaction at regular intervals, even when there are no active writes to individual partitions or tablets, enable periodic compaction.&lt;/p&gt;\n&lt;p&gt;You should use periodic compaction if you need to delete data based on TTL or apply deletions triggered by delete-rows, and automatic compaction isn't enough to meet your needs.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Most scenarios don't require periodic compaction. In fact, it often creates excessive loads and can be harmful.&lt;/p&gt;\n&lt;p&gt;Avoid using periodic compaction solely to reduce the number of chunks. The normal size of dynamic table chunks is about 40–60 MB (compressed size). If the chunks of your table fall within this size range, there is no need to make them larger.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;To enable periodic compaction, use the &lt;code&gt;auto_compaction_period&lt;/code&gt; attribute. It determines the compaction period for each chunk. After setting the attribute, run the &lt;code&gt;remount-table&lt;/code&gt; command to apply the settings.&lt;/p&gt;\n&lt;h4 id=\"periodic_compaction_mode\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/compaction.html#periodic_compaction_mode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Modes&lt;/span&gt;&lt;/a&gt;Modes&lt;/h4&gt;\n&lt;p&gt;There are two periodic compaction modes. You can set the mode using the &lt;code&gt;periodic_compaction_mode&lt;/code&gt; attribute.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;store&lt;/code&gt; (default value): The decision to compact each chunk created earlier than &lt;code&gt;now - auto_compaction_period&lt;/code&gt; is made independently. Use this mode if you need to delete data based on TTL.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;partition&lt;/code&gt;: If the partition contains at least one chunk created earlier than &lt;code&gt;now - auto_compaction_period&lt;/code&gt;, all partition chunks are compacted at the same time. Use this mode if you need to clear rows deleted via delete-rows.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;code&gt;Partition&lt;/code&gt; mode is better suited for clearing rows deleted via delete-rows because, when using &lt;code&gt;store&lt;/code&gt;, a write by key and its corresponding delete tombstone may end up in different chunks that are independently compacted one after another, in which case the tombstone will never be deleted.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;Store&lt;/code&gt; mode reviews chunks independently, and when the oldest chunk is reviewed, the obsolete data will be deleted.&lt;/p&gt;\n&lt;p&gt;Setting only the &lt;code&gt;periodic_compaction_mode&lt;/code&gt; attribute is not enough to enable periodic compaction — you need to explicitly set the &lt;code&gt;auto_compaction_period&lt;/code&gt; attribute.&lt;/p&gt;\n&lt;h4 id=\"periodic_compaction_period\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/compaction.html#periodic_compaction_period\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Selecting a period&lt;/span&gt;&lt;/a&gt;Selecting a period&lt;/h4&gt;\n&lt;p&gt;We recommend setting a period that is close to the table's TTL. For example, if the TTL is seven days, you can set the &lt;code&gt;auto_compaction_period&lt;/code&gt; to three days. This will guarantee that the rows are deleted within ten days.&lt;/p&gt;\n&lt;p&gt;Setting a period that is too short may result in excessive loads on the bundle. Each bundle node is capable of compacting about 100-200 MB/s maximum. The load from periodic compaction usually does not exceed several units of MB/s. The period is often commensurate with &lt;code&gt;max_data_ttl&lt;/code&gt; or is several times less than it.&lt;/p&gt;\n&lt;p&gt;For example, there is a table of 500 GB and a compaction period of one day and two nodes in the bundle. The load per node would then be 500 GB/86,400 sec/2 ≃ 3.1 MB/s, which is allowable.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Initially setting &lt;code&gt;auto_compaction_period&lt;/code&gt; on the table with a lot of old chunks can cause all chunks to start being compacted at the same time. In this case, follow the same recommendations as for forced compaction.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;To avoid synchronization and even out the load, a random shift is added to &lt;code&gt;auto_compaction_period&lt;/code&gt; when calculating the compaction time of each specific chunk. This shift is defined by the &lt;code&gt;auto_compaction_period_splay_ratio&lt;/code&gt; attribute.&lt;/p&gt;\n&lt;h2 id=\"scenarios\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/compaction.html#scenarios\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Scenarios&lt;/span&gt;&lt;/a&gt;Scenarios&lt;/h2&gt;\n&lt;h4 id=\"scenario_ttl\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/compaction.html#scenario_ttl\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Deleting data by TTL&lt;/span&gt;&lt;/a&gt;Deleting data by TTL&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Scenario&lt;/strong&gt;: TTL is set for the table, but the size continues to increase as if no TTL is applied.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Solution&lt;/strong&gt;: Use &lt;a href=\"en/user-guide/dynamic-tables/compaction.html#periodic_compaction\"&gt;periodic compaction&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"write_delete\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/compaction.html#write_delete\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Deleting short-lived keys&lt;/span&gt;&lt;/a&gt;Deleting short-lived keys&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Scenario&lt;/strong&gt;: The row is written and deleted after a while. It is required that delete tombstones do not pile up and space is cleared.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Solution&lt;/strong&gt;: Use &lt;a href=\"en/user-guide/dynamic-tables/compaction.html#periodic_compaction\"&gt;periodic compaction&lt;/a&gt; in &lt;code&gt;partition&lt;/code&gt; mode.&lt;/p&gt;\n&lt;h4 id=\"woodpecker\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/compaction.html#woodpecker\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Many writes by one key&lt;/span&gt;&lt;/a&gt;Many writes by one key&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Scenario&lt;/strong&gt;: There may be more than a few thousand writes by one key.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Problem&lt;/strong&gt;: There is a limit on the number of versions of one key in the system. It is about 30,000 versions. If this is exceeded, background processes will end up with the \"Too many write timestamps in a versioned row\" error.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Solution&lt;/strong&gt;: Set the &lt;code&gt;True&lt;/code&gt; value of the &lt;code&gt;merge_rows_on_flush&lt;/code&gt; attribute and reduce TTL via the &lt;code&gt;min_data_ttl&lt;/code&gt; attribute so that the number of versions within TTL is not more that a few thousand. If many deletions are made per key, use &lt;code&gt;merge_deletions_on_flush&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"tablet_inside\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/compaction.html#tablet_inside\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tablets and background processes under the hood&lt;/span&gt;&lt;/a&gt;Tablets and background processes under the hood&lt;/h2&gt;\n&lt;p&gt;This section details the structure of tablets. It's not mandatory for reading, but it may be helpful to those who want to tweak some of the settings on their own.&lt;/p&gt;\n&lt;h3 id=\"tablet_description\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/compaction.html#tablet_description\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Structure&lt;/span&gt;&lt;/a&gt;Structure&lt;/h3&gt;\n&lt;p&gt;A tablet is a part of the table that is responsible for the data between two pivot keys. Typically, tablet size ranges from 100 MB (for in-memory tables) to a few gigabytes, sometimes reaching tens of gigabytes for especially large tables. From the master server's point of view, a tablet is a set of chunks. All operations described below occur on the tablet node directly serving the tablet.&lt;/p&gt;\n&lt;p&gt;Similarly to tables that are split into tablets bounded by pivot keys, tablets are split into partitions. The partition size is about 200 MB (compressed size). In addition, there is a special partition, Eden. Its boundaries coincide with those of the tablet. Each chunk belongs either to Eden or to one of the partitions. If a chunk falls entirely between the boundary keys of a particular partition, it belongs to it. Otherwise it belongs to Eden.&lt;/p&gt;\n&lt;h3 id=\"flush\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/compaction.html#flush\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dynamic stores and flushing data to the disk&lt;/span&gt;&lt;/a&gt;Dynamic stores and flushing data to the disk&lt;/h3&gt;\n&lt;p&gt;There is always at least one dynamic store in the table — an active one. When writing, the data first gets into the dynamic store. When the dynamic store becomes too large (hundreds of megabytes) or the node runs out of tablet dynamic memory, the store is &lt;em&gt;rotated&lt;/em&gt;. That is, it becomes passive and is replaced by a new active store. This activates the flush process, and the passive store is flushed to the disk over time.&lt;/p&gt;\n&lt;p&gt;If flush does not work for some reason, the data is accumulated in memory, and after overflow, writing starts failing with the \"Node is out of tablet memory, all writes disabled\" error.&lt;/p&gt;\n&lt;p&gt;By default, all row versions are saved to the chunk during flush. To apply cleanup by TTL, use the &lt;code&gt;merge_rows_on_flush&lt;/code&gt; attribute. It should be done when the TTL is less than the typical dynamic store lifetime (about 15 minutes), and there are many writes by one key.&lt;/p&gt;\n&lt;h3 id=\"partitioning\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/compaction.html#partitioning\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Partitioning&lt;/span&gt;&lt;/a&gt;Partitioning&lt;/h3&gt;\n&lt;p&gt;The chunk flushed to the disk ends up in Eden. It usually contains keys from the entire tablet range and can't be attributed to a particular partition. The partitioning process takes one or more chunks from Eden, merges them, splits the data into partitions, and places one chunk into each partition. If there are many small chunks in Eden, it will first run compaction and merge them.&lt;/p&gt;\n&lt;p&gt;Small chunks make the system less efficient. The first reason for this is overhead costs. The second reason is write amplification. Suppose a node serves several tablets of a large table. Since there are many tablets and the memory is shared, the dynamic store size in each tablet will be tens of megabytes, which is rather small. If there are 100 partitions in a tablet, the chunk size in each of them will be less than one megabyte after partitioning. If you increase the minimum allowable Eden size at which partitioning starts, larger chunks will be flushed to partitions at the cost of the increased overlapping store count.&lt;/p&gt;\n&lt;h3 id=\"compaction\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/compaction.html#compaction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Compaction&lt;/span&gt;&lt;/a&gt;Compaction&lt;/h3&gt;\n&lt;p&gt;The compaction process reads a batch of chunks in a single partition and merges them into one (or several, in rare cases), physically deleting rows and old versions. Compaction can be started for several reasons:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;forced: The &lt;code&gt;forced_compaction_revision&lt;/code&gt; attribute is set on the table. In this case, all tablet chunks will be compacted and the batch size will only be limited by the &lt;code&gt;max_compaction_store_count&lt;/code&gt; value.&lt;/li&gt;\n&lt;li&gt;periodic: The &lt;code&gt;auto_compaction_period&lt;/code&gt; attribute is set on the table. Chunks created earlier than &lt;code&gt;now - auto_compaction_period&lt;/code&gt; will be compacted.&lt;/li&gt;\n&lt;li&gt;regular: Regular mode started without any external influence.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"compaction_size_policy\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/compaction.html#compaction_size_policy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Picking chunks based on size&lt;/span&gt;&lt;/a&gt;Picking chunks based on size&lt;/h4&gt;\n&lt;p&gt;In regular mode, the system selects chunks taking into account write amplification. If there is a 100 MB chunk in the partition and a 1 MB chunk periodically appears, then if you compact them together each time, you will get x100 amplification. The following rules are used:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;There must be from &lt;code&gt;min_compaction_store_count&lt;/code&gt; to &lt;code&gt;max_compaction_store_count&lt;/code&gt; chunks in a batch, but the more the better.&lt;/li&gt;\n&lt;li&gt;Chunks must be sorted by size. Each successive chunk must be by no more than &lt;code&gt;compaction_data_size_ratio&lt;/code&gt; times larger than the sum of the sizes of the previous chunks.&lt;/li&gt;\n&lt;li&gt;The previous rule does not apply as long as the total size of the chunks is less than &lt;code&gt;compaction_data_size_base&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;For example, ratio = 2, base = 16 MB. Then:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;A set of 1 KB, 1 MB, 10 MB chunks is allowed: the sum is not exceeding 16 MB.&lt;/li&gt;\n&lt;li&gt;A set of 10 MB, 20 MB, 50 MB, 150 MB chunks is allowed: 50 &amp;lt; 2 × (10 + 20), 150 &amp;lt; 2 × (10 + 20 + 50).&lt;/li&gt;\n&lt;li&gt;A set of 1 MB, 10 MB, 100 MB chunks is not allowed: 100 &amp;gt; 2 × (10 + 1).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Reducing the base and ratio values improves the WA at the cost of increasing the OSC. In the limiting case where base = 1 but no data is deleted, it can be demonstrated that the write amplification is logarithmically dependent on the amount of data. Each time a row participates in compaction, the size of the chunk that contains it increases by at least (1 + 1 / ratio) times. Consequently, this row participates in a total of no more than log(tablet_size, 1 + 1 / ratio) compactions. In practice, this estimation is inaccurate not only because of the deletions, but also because the partition splits into two when the threshold size is reached.&lt;/p&gt;\n&lt;h4 id=\"major_timestamp\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/compaction.html#major_timestamp\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mechanism for cleaning up old versions&lt;/span&gt;&lt;/a&gt;Mechanism for cleaning up old versions&lt;/h4&gt;\n&lt;p&gt;When compaction merges another batch of chunks, it can remove old versions of some rows and apply deletions. However, this may not always be possible, because compaction considers only some of the chunks within a partition, not all of them.&lt;/p&gt;\n&lt;p&gt;Let's consider a table with min/max_data_ttl = 0, min/max_data_versions = 1 (only the most recent version must be stored by each key). For example, there were two writes by a key: {value = 1; timestamp = 10}, {value = 2; timestamp = 20}, and deletion with timestamp = 30.&lt;br /&gt;\nSuppose these versions are stored in three different chunks. If compaction considers only the first and third chunks, the following data is processed:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;delete tombstone {timestamp = 30}\n{value = 1; timestamp = 10}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"764\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-764\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-764\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-764.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;If you apply deletions and remove the row completely without writing it to a new chunk, it will result in an incorrect read: further reads will read the {value = 2; timestamp = 20} value, although the row was deleted.&lt;/p&gt;\n&lt;p&gt;To avoid this problem, we calculate the &lt;em&gt;major timestamp&lt;/em&gt;, which is the earliest timestamp across all data in all the chunks of a given partition and Eden to not be included in the current compaction batch. Compaction then has the right to delete only those versions where timestamp &amp;lt; major timestamp.&lt;/p&gt;\n&lt;p&gt;This logic can lead to obsolete versions not actually being deleted. First, if the tablet or partition is not written to, many chunks within the partition stabilize, and compaction no longer initiates since it has no way of detecting if any of the rows are aged. Second, if there is one large chunk in the partition and writing is not very intensive, then the newly appearing small chunks will be compacted with one another without affecting the large one. The large chunk imposes a limit on major timestamp, so even if ttl = 0, repeated versions in fresh chunks will not be deleted. You can deal with this using &lt;code&gt;auto_compaction_period&lt;/code&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/dynamic-tables/compaction.md","sourcePath":"en/user-guide/dynamic-tables/compaction.md"},"headings":[{"title":"Glossary","href":"en/user-guide/dynamic-tables/compaction.html#glossary","level":2},{"title":"List of attributes","href":"en/user-guide/dynamic-tables/compaction.html#attributes","level":2,"items":[{"title":"Flush","href":"en/user-guide/dynamic-tables/compaction.html#flush_attributes","level":3},{"title":"Compaction","href":"en/user-guide/dynamic-tables/compaction.html#compaction_attributes","level":3,"items":[{"title":"Basic options","href":"en/user-guide/dynamic-tables/compaction.html#basic-options","level":4},{"title":"Sizes and constants","href":"en/user-guide/dynamic-tables/compaction.html#sizes-and-constants","level":4}]},{"title":"Deleting old data","href":"en/user-guide/dynamic-tables/compaction.html#ttl_attributes","level":3}]},{"title":"Forced compaction","href":"en/user-guide/dynamic-tables/compaction.html#forced_compaction","level":2},{"title":"Periodic compaction","href":"en/user-guide/dynamic-tables/compaction.html#periodic_compaction","level":2},{"title":"Scenarios","href":"en/user-guide/dynamic-tables/compaction.html#scenarios","level":2},{"title":"Tablets and background processes under the hood","href":"en/user-guide/dynamic-tables/compaction.html#tablet_inside","level":2,"items":[{"title":"Structure","href":"en/user-guide/dynamic-tables/compaction.html#tablet_description","level":3},{"title":"Dynamic stores and flushing data to the disk","href":"en/user-guide/dynamic-tables/compaction.html#flush","level":3},{"title":"Partitioning","href":"en/user-guide/dynamic-tables/compaction.html#partitioning","level":3},{"title":"Compaction","href":"en/user-guide/dynamic-tables/compaction.html#compaction","level":3,"items":[{"title":"Picking chunks based on size","href":"en/user-guide/dynamic-tables/compaction.html#compaction_size_policy","level":4},{"title":"Mechanism for cleaning up old versions","href":"en/user-guide/dynamic-tables/compaction.html#major_timestamp","level":4}]}]}],"title":"Background compaction"},"router":{"pathname":"en/user-guide/dynamic-tables/compaction","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
