            {"data":{"leading":false,"html":"&lt;h2 id=\"introduction\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/hunks-guide.html#introduction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Introduction&lt;/span&gt;&lt;/a&gt;Introduction&lt;/h2&gt;\n&lt;p&gt;Hunk chunks are a mechanism for storing large string values separately from table rows. If a string value in a chunk exceeds a set limit, it is replaced by a light link that leads to a new type of chunk — a hunk chunk. Unlike regular chunks, hunk chunks store raw unstructured data: to read them, you just need to know the offset relative to the beginning of the chunk and the length. This construct opens up additional opportunities to optimize the use of dynamic tables:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Enables you to store only a small part of the table in memory, preserving low lookup latency.&lt;/li&gt;\n&lt;li&gt;Reduces write amplification, because hunk chunks are compacted less often than regular chunks.&lt;/li&gt;\n&lt;li&gt;Reduces disk throughput for tables not stored in memory.&lt;/li&gt;\n&lt;li&gt;Allows erasure coding with low overhead costs for on-the-fly hunk value erasure repair.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;For more information about optimization, see &lt;a href=\"en/user-guide/dynamic-tables/hunks-guide.html#use-scenarios\"&gt;Use cases&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"when-should-i-use-hunks\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/hunks-guide.html#when-should-i-use-hunks\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;When should I use hunks?&lt;/span&gt;&lt;/a&gt;When should I use hunks?&lt;/h2&gt;\n&lt;p&gt;Hunks may prove useful for tables containing many large string values. However, they might not be the best choice if one of the following applies:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;If your table resides on an HDD, reading chunks from the disk involves many concurrent, fine-grained accesses to the medium — HDDs aren't exactly optimized for this.&lt;/li&gt;\n&lt;li&gt;The table data has a good compression ratio (table attribute &lt;code&gt;compression_ratio&lt;/code&gt; is quite low). Currently, blocks in hunk chunks are not compressed to allow granular hunk reads from the disk. Switching to hunks can therefore substantially increase the table's disk space. This can be partially offset by setting the hunk erasure codec. There is also a feature for dictionary compression of hunk values you can currently try in test mode, which should help you completely negate the issue.&lt;/li&gt;\n&lt;li&gt;Your table is subject to a versioned remote copy (or a script that adds replicas to a replicated table). At the moment, you cannot make a versioned remote copy of a table with hunk chunks. However, this can be done manually. For more information, see &lt;a href=\"en/user-guide/dynamic-tables/hunks-guide.html#faq\"&gt;FAQ&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If the size of a string value is not greater than &lt;code&gt;max_inline_hunk_size&lt;/code&gt;, this value is called an &lt;code&gt;inline value&lt;/code&gt;. If it is greater, it is called a &lt;code&gt;ref value&lt;/code&gt;. Hunk chunks consist of &lt;code&gt;ref values&lt;/code&gt;. To roughly estimate the share of &lt;code&gt;ref values&lt;/code&gt; in your table accounting for a varying &lt;code&gt;max_inline_hunk_size&lt;/code&gt;, you can use a script: &lt;code&gt;yt/yt/tools/hunk_chunk_advisor/hunk_chunk_advisor compute_weight&lt;/code&gt;.&lt;/p&gt;\n&lt;summary&gt;&lt;i&gt;Example&lt;/i&gt;&lt;/summary&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ ./hunk_chunk_advisor compute_weight --proxy zeno --table-path //home/table --sampling-rate 0.1 --result-file result_file --computation-path //home/hunk_chunk_advisor\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"58\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-58\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-58\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-58.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The script runs operations on the cluster that will create a static table from a dynamic table and allows row sampling from it. Then, it will compute the ratio of data that constitute &lt;code&gt;ref values&lt;/code&gt; for different &lt;code&gt;max_inline_hunk_size&lt;/code&gt;.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Script parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;proxy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;YTsaurus cluster name.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;table-path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Cypress path to the table.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;sampling-rate&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The share of table rows for calculating statistics (required if the table is too large to run the operation on it).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;result-file&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Local path to where you want to create a PNG file with detailed statistics.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;computation-path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Cypress path to the directory where the tables with intermediate calculations will be located. We recommend creating a new subdirectory within the project directory to avoid violating the ACL and cluttering the working directory.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"enabling-hunks\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/hunks-guide.html#enabling-hunks\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Enabling hunks&lt;/span&gt;&lt;/a&gt;Enabling hunks&lt;/h2&gt;\n&lt;p&gt;To enable hunks, you need to change the table schema by setting the &lt;code&gt;max_inline_hunk_size&lt;/code&gt; attribute on the desired string columns. To modify the schema, the table needs to be unmounted.&lt;/p&gt;\n&lt;p id=\"slim_format\"&gt;&lt;/p&gt;\n&lt;p&gt;We also recommend using an alternative chunk format. The default chunk format (&lt;code&gt;@optimize_for=lookup&lt;/code&gt;) can be inefficient in terms of uncompressed data size. This is especially true for tables with hunks, because they store many hunk refs physically represented as short rows. You should either select the slim chunk format (&lt;code&gt;@optimize_for=lookup&lt;/code&gt; and &lt;code&gt;@chunk_format=table_versioned_slim&lt;/code&gt;) or the scan format (&lt;code&gt;@optimize_for=scan&lt;/code&gt; and &lt;code&gt;@chunk_format=table_versioned_columnar&lt;/code&gt;). When using the scan format, you will probably want to set the same column group on all columns of the schema. For more information about column groups, see the &lt;a href=\"en/user-guide/storage/chunks#columns\"&gt;documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;To enable hunks on your table, you can use the script located at &lt;code&gt;yt/yt/experiments/public/hunkifier&lt;/code&gt;.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Learn more about hunkifier&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;./hunkifier --proxy zeno  --table-path //home/replica_table --max-inline-hunk-size 128\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"139\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-139\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-139\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-139.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The script unmounts the table, alters its schema by adding the necessary attribute, sets additional settings, and then re-mounts the table.&lt;/p&gt;\n&lt;p&gt;Basic parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Script parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;proxy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;YTsaurus cluster name.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;table-path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Cypress path to the table.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;max-inline-hunk-size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Maximum size of a string value in bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Additional parameters:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Script parameter&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;primary-medium&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A medium for storing the chunks (regular and hunk).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;enable-crp&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A flag for enabling &lt;a href=\"en/user-guide/dynamic-tables/hunks-guide.html#consistent-replica-placement\"&gt;consistent replica placement&lt;/a&gt; on the table.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;max-hunk-compaction-garbage-ratio&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The &lt;a href=\"en/user-guide/dynamic-tables/hunks-guide.html#max_hunk_compaction_garbage_ratio\"&gt;max_hunk_compaction_garbage_ratio&lt;/a&gt; attribute.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;hunk-erasure-codec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The &lt;a href=\"en/user-guide/dynamic-tables/hunks-guide.html#hunk_erasure_codec\"&gt;erasure codec&lt;/a&gt; for hunk chunks.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;fragment-read-hedging-delay&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The delay before sending a &lt;a href=\"en/user-guide/dynamic-tables/hunks-guide.html#hunk_hedging\"&gt;hedged request&lt;/a&gt; for fragment reads.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;enable-slim-format&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A flag for enabling the &lt;a href=\"en/user-guide/dynamic-tables/hunks-guide.html#slim_format\"&gt;slim chunk format&lt;/a&gt; on the table.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;enable-columnar-format&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Use the column-by-column chunk format on the table.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;columns&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A list of columns the &lt;code&gt;max_inline_hunk_size&lt;/code&gt; attribute will be set on. If the option is not specified, the attribute is set on all string columns of the table.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Once hunks are enabled and the table is mounted, flush and compaction will also generate hunk chunks with &lt;code&gt;ref values&lt;/code&gt; along with regular chunks.&lt;/p&gt;\n&lt;p&gt;To quickly change the structure of all chunks in the table, you can perform a forced compaction taking into account all the recommendations described in the &lt;a href=\"en/user-guide/dynamic-tables/compaction#forced_compaction\"&gt;documentation&lt;/a&gt;. You can also use the &lt;code&gt;forced_store_compaction_revision&lt;/code&gt; and &lt;code&gt;forced_hunk_compaction_revision&lt;/code&gt; options for forced compaction of regular-only or hunk-only chunks.&lt;br /&gt;\nPlease note that &lt;code&gt;forced_hunk_compaction_revision&lt;/code&gt; does not compact all of the hunk chunks: the compaction algorithm unconditionally compacts only those hunk chunks that are referenced by regular chunks falling under the compaction criteria.&lt;/p&gt;\n&lt;h2 id=\"use-scenarios\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/hunks-guide.html#use-scenarios\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Use cases&lt;/span&gt;&lt;/a&gt;Use cases&lt;/h2&gt;\n&lt;p&gt;There are several use cases where various hunk table configurations may prove useful. Each configuration is set by a specific set of options with their own trade-offs.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;b&gt;An in-memory table takes up a lot of tablet static memory.&lt;/b&gt;&lt;br /&gt;\nIn such cases, having a low latency for table reads is often critical. If you put a table with enabled hunks in memory, only non-hunk chunks will end up there. This can save you a lot of tablet static memory without significantly increasing the latency of read requests.&lt;/p&gt;\n&lt;p&gt;If a user reads a row that does not have &lt;code&gt;ref values&lt;/code&gt;, reading will still be performed from memory. If the row does have &lt;code&gt;ref values&lt;/code&gt;, reading them will require additional resources (to reach the data node and read these values from the disk).&lt;/p&gt;\n&lt;p&gt;Accordingly, decreasing the &lt;code&gt;max_inline_hunk_size&lt;/code&gt; will also reduce the number of memory reads and the amount of tablet static memory required.&lt;/p&gt;\n&lt;p&gt;Please note that high-load tables may require additional optimization efforts, so we recommend reading the &lt;a href=\"en/user-guide/dynamic-tables/hunks-guide.html#optimization\"&gt;Further optimization&lt;/a&gt; section below.&lt;/p&gt;\n&lt;p id=\"max_hunk_compaction_garbage_ratio\"&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;b&gt;Table writes cause high write amplification.&lt;/b&gt;&lt;br /&gt;\nAs you may know, the LSM tree data organization of a dynamic table implies that the write throughput to the disk is higher than the initial user write throughput. High flow and write amplification can affect the number of disks required to maintain the table (with DWPD, the allowed write throughput to the disk ends up being relatively small).&lt;/p&gt;\n&lt;p&gt;When regular chunks that reference hunk chunks are compacted, it's not mandatory to read and modify the latter. Because of that, after compaction hunk chunks may partially consist of outdated values if some of the &lt;code&gt;ref values&lt;/code&gt; a left without references. This makes it possible to skip reading and overwriting &lt;code&gt;ref values&lt;/code&gt;, thereby reducing the read and write throughput during compaction.&lt;/p&gt;\n&lt;p&gt;The option that adjusts the maximum allowable percentage of garbage in hunk chunks is &lt;code&gt;max_hunk_compaction_garbage_ratio&lt;/code&gt;. The higher this value, the lower the write amplification, but the higher the table's disk space (because hunk chunks will contain more outdated values).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;b&gt;Table reads cause high disk load.&lt;/b&gt;&lt;br /&gt;\nWhen reading regular chunks from the disk, you have to read entire blocks that usually take up a few hundred kilobytes. Large flows may overload the disks, and the block cache may be underutilized. Hunks are read with a granularity of 4 KB.&lt;/p&gt;\n&lt;p id=\"hunk_erasure_codec\"&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;b&gt;The table disk space is too high.&lt;/b&gt;&lt;br /&gt;\nIf the data node is overloaded or if some parts of regular chunks are inaccessible, erasure recovery may be inefficient and resource-intensive. Optimizations in the read layer of hunk chunks make this process much more bearable. You can enable erasure coding for hunk chunks by setting the &lt;code&gt;@hunk_erasure_codec&lt;/code&gt; attribute on the table.&lt;/p&gt;\n&lt;p&gt;To enable on-the-fly part recovery, see the \"Further optimization\" section below. After the erasure codec is set on the table, you can find out how many chunks are written in each of the codecs using the &lt;code&gt;@erasure_statistics&lt;/code&gt; table attribute.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"optimization\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/hunks-guide.html#optimization\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Further optimization&lt;/span&gt;&lt;/a&gt;Further optimization&lt;/h2&gt;\n&lt;p&gt;From a data node's point of view, &lt;code&gt;ref value&lt;/code&gt; reads transform into fragment reads, so that's the terminology we'll stick to in this section.&lt;/p&gt;\n&lt;p id=\"hunk_hedging\"&gt;&lt;/p&gt;\n&lt;ul id=\"consistent-replica-placement\"&gt;\n&lt;li&gt;&lt;b&gt;Hedged requests for fragment reads or on-the-fly erasure recovery.&lt;/b&gt;&lt;br /&gt;\nIf a read request to the data node is taking too long, it should be hedged. To do this, use the &lt;code&gt;@hunk_chunk_reader/fragment_read_hedging_delay&lt;/code&gt; option (value in milliseconds). This option is also responsible for the time after which the erasure repair of a data part starts if the data node is not responding.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;b&gt;Fragment read request batching.&lt;/b&gt;&lt;br /&gt;\nBy default, three random data nodes are selected for each table chunk to store its replicas. Even a single key lookup tends to generate reads from multiple chunks, not to mention lookups of multiple keys. Since reading each &lt;code&gt;ref value&lt;/code&gt; is reading from the disk from a remote data node, there is a high fan-out of requests to the storage subsystem. This can be performance-critical if the flow of requests to the table is rather high.&lt;/p&gt;\n&lt;p&gt;In this case, you can set the &lt;code&gt;@enable_consistent_chunk_replica_placement&lt;/code&gt; boolean attribute on the table. This will make it so that chunk replicas of a single tablet will be assigned to the same data nodes in best-effort mode. Fragment read requests to data nodes are batched. And disk requests are batched on data nodes. In some cases, this substantially reduces the fan-out.&lt;/p&gt;\n&lt;p&gt;Please note that this option can significantly affect the storage layer due to a particular chunk replication load. Only set it after consulting with the YTsaurus team.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;b&gt;More efficient disk reads.&lt;/b&gt;&lt;br /&gt;\nFragment reads cause many fine-grained reads from the disk. To keep them efficient and low-latency, use a medium with io_uring to store table chunks. You can also use &lt;code&gt;direct I/O&lt;/code&gt; to bypass the OS cache. To do this, set the &lt;code&gt;@hunk_chunk_reader/use_direct_io&lt;/code&gt; boolean attribute on the table (on some media, reads with &lt;code&gt;direct I/O&lt;/code&gt; are globally disabled and this attribute will have no effect).&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"diagnostics\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/hunks-guide.html#diagnostics\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Diagnostics&lt;/span&gt;&lt;/a&gt;Diagnostics&lt;/h2&gt;\n&lt;p&gt;To figure out how many chunks are hunk chunks and how large they are, you can execute the request &lt;code&gt;yt get &amp;lt;table_cypress_path&amp;gt;/@chunk_format_statistics&lt;/code&gt;. To get more detailed statistics on the structure of hunk chunks, you can execute the request &lt;code&gt;yt get &amp;lt;table_cypress_path&amp;gt;/@hunk_statistics&lt;/code&gt;. Both of these requests are heavy from the master's point of view and should be run manually and only once.&lt;/p&gt;\n&lt;p&gt;Chunks also have some useful attributes.&lt;/p&gt;\n&lt;p&gt;All chunks: &lt;code&gt;@consistent_replica_placement_hash&lt;/code&gt; and &lt;code&gt;@consistent_replica_placement&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Regular chunks: &lt;code&gt;@hunk_chunk_refs&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Hunk chunks: &lt;code&gt;@hunk_count&lt;/code&gt; and &lt;code&gt;@total_hunk_length&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;For more information about hunk chunk refs, see the node's Orchid: &lt;code&gt;tablet_cells/&amp;lt;cell_id&amp;gt;/tablets/&amp;lt;tablet_id&amp;gt;/hunk_chunks/&amp;lt;chunk_id&amp;gt;&lt;/code&gt;&lt;/p&gt;\n&lt;h2 id=\"faq\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/hunks-guide.html#faq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FAQ&lt;/span&gt;&lt;/a&gt;FAQ&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;b&gt;After enabling hunks, my disk space has grown a lot. What do I do?&lt;/b&gt;&lt;br /&gt;\nYou can adjust the &lt;code&gt;@max_hunk_compaction_garbage_ratio&lt;/code&gt; table attribute. It represents the allowable percentage of garbage (outdated data) in hunk chunks. If a hunk chunk exceeds this limit, it will be compacted. The default value is &lt;code&gt;0.5&lt;/code&gt;. For some tables, you may want to change it to &lt;code&gt;0.15&lt;/code&gt; or &lt;code&gt;0.3&lt;/code&gt; depending on the load. The downside is that decreasing this value also increases the compaction write amplification.&lt;/li&gt;\n&lt;li&gt;&lt;b&gt;After enabling hunks, my chunk count has grown a lot. What do I do?&lt;/b&gt;&lt;br /&gt;\nWhen the dynamic store gets flushed to disk, this can create many small chunks. In this case, you can adjust the &lt;code&gt;@max_hunk_compaction_size&lt;/code&gt; table attribute. All hunk chunks below the specified value will be compacted. The default value is &lt;code&gt;8 MB&lt;/code&gt;. For some tables, you may want to change it to &lt;code&gt;16 MB&lt;/code&gt; or &lt;code&gt;32 MB&lt;/code&gt; depending on the load. The downside is that increasing this value also increases the compaction write amplification.&lt;/li&gt;\n&lt;li&gt;&lt;b&gt;How do I find out the actual share of disk space taken up by garbage in hunk chunks?&lt;/b&gt;&lt;br /&gt;\nYou can read the &lt;code&gt;@hunk_statistics&lt;/code&gt; table attribute and compare values in the &lt;code&gt;total_hunk_length&lt;/code&gt; and &lt;code&gt;total_referenced_hunk_length&lt;/code&gt; fields. Please note that requesting this attribute is fairly compute-intensive. You should only do it manually and not too often.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/dynamic-tables/hunks-guide.md","sourcePath":"en/user-guide/dynamic-tables/hunks-guide.md"},"headings":[{"title":"Introduction","href":"en/user-guide/dynamic-tables/hunks-guide.html#introduction","level":2},{"title":"When should I use hunks?","href":"en/user-guide/dynamic-tables/hunks-guide.html#when-should-i-use-hunks","level":2},{"title":"Enabling hunks","href":"en/user-guide/dynamic-tables/hunks-guide.html#enabling-hunks","level":2},{"title":"Use cases","href":"en/user-guide/dynamic-tables/hunks-guide.html#use-scenarios","level":2},{"title":"Further optimization","href":"en/user-guide/dynamic-tables/hunks-guide.html#optimization","level":2},{"title":"Diagnostics","href":"en/user-guide/dynamic-tables/hunks-guide.html#diagnostics","level":2},{"title":"FAQ","href":"en/user-guide/dynamic-tables/hunks-guide.html#faq","level":2}],"title":"Hunks usage in dynamic tables"},"router":{"pathname":"en/user-guide/dynamic-tables/hunks-guide","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
