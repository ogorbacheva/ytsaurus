            {"data":{"leading":false,"html":"&lt;p&gt;This section describes the YTsaurus queue ecosystem, specialized methods for working with queues, and how to configure and use them.&lt;/p&gt;\n&lt;h2 id=\"data_model\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/queues.html#data_model\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data model&lt;/span&gt;&lt;/a&gt;Data model&lt;/h2&gt;\n&lt;p&gt;In YTsaurus, a &lt;em&gt;queue&lt;/em&gt; refers to any ordered dynamic table. A queue partition is a tablet of a dynamic table, with its index matching the index of the tablet.&lt;/p&gt;\n&lt;p&gt;In YTsaurus, a &lt;em&gt;consumer (queue_consumer)&lt;/em&gt; refers to a sorted table that has a defined schema. It has a many-to-many relationship with queues and represents a consumer of one or more queues. A consumer's function is to store offsets across the partitions of readable queues.&lt;/p&gt;\n&lt;p&gt;Communication between consumers and queues is enabled by &lt;em&gt;registration&lt;/em&gt; objects.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Table 1 — Consumer table schema&lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Name&lt;/th&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;queue_cluster&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Queue cluster name&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;queue_path&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Path to a dynamic queue table&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;partition_index&lt;/td&gt;\n&lt;td&gt;uint64&lt;/td&gt;\n&lt;td&gt;Partition index, same as &lt;code&gt;tablet_index&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;offset&lt;/td&gt;\n&lt;td&gt;uint64&lt;/td&gt;\n&lt;td&gt;Index of the &lt;strong&gt;first row that hasn't been processed&lt;/strong&gt; by the consumer within the specified partition of the specified queue&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;meta&lt;/td&gt;\n&lt;td&gt;any&lt;/td&gt;\n&lt;td&gt;System meta information&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;In YTsaurus, a &lt;em&gt;producer (queue_producer)&lt;/em&gt; also refers to a sorted table that has a defined schema. A producer stores the indexes of the last rows added during queue write sessions, which helps prevent row duplication in the queue.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Table 2 — Producer table schema&lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Name&lt;/th&gt;\n&lt;th&gt;Type&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;queue_cluster&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Queue cluster name&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;queue_path&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Path to a dynamic queue table&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;session_id&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Session ID&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;sequence_number&lt;/td&gt;\n&lt;td&gt;int64&lt;/td&gt;\n&lt;td&gt;Sequence number of the last written row&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;epoch&lt;/td&gt;\n&lt;td&gt;int64&lt;/td&gt;\n&lt;td&gt;Number of the current epoch&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;user_meta&lt;/td&gt;\n&lt;td&gt;any&lt;/td&gt;\n&lt;td&gt;User meta information&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;system_meta&lt;/td&gt;\n&lt;td&gt;any&lt;/td&gt;\n&lt;td&gt;System meta information&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"api\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/queues.html#api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;API&lt;/span&gt;&lt;/a&gt;API&lt;/h2&gt;\n&lt;h3 id=\"creating-a-queue\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/queues.html#creating-a-queue\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Creating a queue&lt;/span&gt;&lt;/a&gt;Creating a queue&lt;/h3&gt;\n&lt;p&gt;Creating a queue is no different from creating a regular ordered dynamic table.&lt;/p&gt;\n&lt;p&gt;To ensure that your graphs and statistics are comprehensive, we recommend adding the &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables.html#timestamp_column\"&gt;timestamp&lt;/a&gt; and &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables.html#cumulative_data_weight_column\"&gt;cumulative_data_weight&lt;/a&gt; columns to the table schema.&lt;/p&gt;\n&lt;p&gt;You can verify that the system has recognized the queue by checking if the &lt;strong&gt;Queue&lt;/strong&gt; tab has appeared on the page of the dynamic table object.&lt;/p&gt;\n&lt;h3 id=\"creating-a-consumer\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/queues.html#creating-a-consumer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Creating a consumer&lt;/span&gt;&lt;/a&gt;Creating a consumer&lt;/h3&gt;\n&lt;p&gt;You can create a consumer using the alias &lt;code&gt;create queue_consumer&lt;/code&gt; or by explicitly creating a sorted dynamic table using the schema &lt;a href=\"en/user-guide/dynamic-tables/queues.html#data_model\"&gt;provided above&lt;/a&gt; and setting the &lt;code&gt;@treat_as_queue_consumer = %true&lt;/code&gt; attribute for it.&lt;/p&gt;\n&lt;p&gt;You can verify that the system has recognized the consumer by checking if the &lt;strong&gt;Consumers&lt;/strong&gt; tab has appeared on the page of the dynamic table object.&lt;/p&gt;\n&lt;h3 id=\"registering-a-consumer-with-a-queue\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/queues.html#registering-a-consumer-with-a-queue\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Registering a consumer with a queue&lt;/span&gt;&lt;/a&gt;Registering a consumer with a queue&lt;/h3&gt;\n&lt;p&gt;To register a consumer with a queue, use the &lt;code&gt;register_queue_consumer&lt;/code&gt; method. Make sure to set a value for the &lt;code&gt;vital&lt;/code&gt; parameter. It's a required boolean parameter that determines some of the settings for automatic queue trimming (see the &lt;a href=\"en/user-guide/dynamic-tables/queues.html#automatic_trimming\"&gt;section&lt;/a&gt; on automatic trimming).&lt;/p&gt;\n&lt;p&gt;To execute the command above, you need a &lt;code&gt;register_queue_consumer&lt;/code&gt; permission with &lt;code&gt;vital=True/False&lt;/code&gt; for the directory that contains the queue. You can request it the same way as any other permission, on the directory page in the YTsaurus UI. A &lt;code&gt;register_queue_consumer&lt;/code&gt; permission with &lt;code&gt;vital=True&lt;/code&gt; allows you to register both vital and non-vital consumers.&lt;/p&gt;\n&lt;p&gt;To delete a registration, use the &lt;code&gt;unregister_queue_consumer&lt;/code&gt; method. Executing this command requires write access to the queue or the consumer.&lt;/p&gt;\n&lt;p&gt;Both Cypress arguments in both of these commands are of &lt;a href=\"user-guide/storage/ypath.html#rich_ypath\"&gt;rich YPath&lt;/a&gt; type and can take cluster names. Otherwise, the commands use the cluster on which they were executed.&lt;/p&gt;\n&lt;h3 id=\"reading-data\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/queues.html#reading-data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reading data&lt;/span&gt;&lt;/a&gt;Reading data&lt;/h3&gt;\n&lt;p&gt;There are two similar methods for reading data from queues.&lt;/p&gt;\n&lt;p&gt;With the &lt;code&gt;pull_queue&lt;/code&gt; method, you can read some of the rows from the specified partition of the specified queue by limiting the row count (&lt;code&gt;max_row_count&lt;/code&gt;) or the size of the partition in bytes (&lt;code&gt;max_data_weight&lt;/code&gt;). Executing this query requires read access to the queue.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;pull_queue_consumer&lt;/code&gt; method is similar but takes the path to the consumer table as its first argument. This query is executed under two conditions: the user must have read access to the consumer &lt;strong&gt;and&lt;/strong&gt; the said consumer must be registered with the specified queue.&lt;br /&gt;\nThe queue parameter in this method is a &lt;a href=\"user-guide/storage/ypath.html#rich_ypath\"&gt;rich YPath&lt;/a&gt; that can take the cluster on which the queue is located. Otherwise, the command uses the cluster on which it was executed.&lt;/p&gt;\n&lt;p&gt;In addition, you can read queue data the usual way, using the &lt;code&gt;select_rows&lt;/code&gt; method.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The &lt;code&gt;pull_queue&lt;/code&gt; and &lt;code&gt;pull_queue_consumer&lt;/code&gt; methods may return fewer rows than specified in the &lt;code&gt;max_row_count&lt;/code&gt; parameter, even if there are enough rows in the queue partition and their combined size doesn't exceed &lt;code&gt;max_data_weight&lt;/code&gt;. Only the return of an empty set of rows means that the partition doesn't have any rows at the specified offset.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"working-with-a-consumer\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/queues.html#working-with-a-consumer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with a consumer&lt;/span&gt;&lt;/a&gt;Working with a consumer&lt;/h3&gt;\n&lt;p&gt;You can work with a consumer by using the &lt;code&gt;advance_queue_consumer&lt;/code&gt; method, which moves the consumer offset in the specified partition of the specified queue. Within the passed transaction, the method updates the corresponding consumer offset row. You can also perform other operations with dynamic tables as part of the same transaction.&lt;/p&gt;\n&lt;p&gt;If you specify a non-null &lt;code&gt;old_offset&lt;/code&gt; parameter value, the method first reads the current offset within the transaction and compares it with the passed value. If they don't match, the method throws an exception.&lt;/p&gt;\n&lt;p&gt;YTsaurus queue offsets are interpreted as the index of the &lt;em&gt;first unread row&lt;/em&gt;.&lt;/p&gt;\n&lt;h3 id=\"creating-a-producer\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/queues.html#creating-a-producer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Creating a producer&lt;/span&gt;&lt;/a&gt;Creating a producer&lt;/h3&gt;\n&lt;p&gt;You can create a producer using the alias &lt;code&gt;create queue_producer&lt;/code&gt; or by explicitly creating a sorted dynamic table using the schema &lt;a href=\"en/user-guide/dynamic-tables/queues.html#data_model\"&gt;provided above&lt;/a&gt; and setting the &lt;code&gt;@treat_as_queue_producer = %true&lt;/code&gt; attribute for it.&lt;/p&gt;\n&lt;h3 id=\"writing-data\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/queues.html#writing-data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Writing data&lt;/span&gt;&lt;/a&gt;Writing data&lt;/h3&gt;\n&lt;p&gt;To write data to a queue, you can use either the &lt;code&gt;insert_rows&lt;/code&gt; method from the dynamic tables API or the producer API to prevent row duplication during writes.&lt;/p&gt;\n&lt;p&gt;To make writes using a producer, you need &lt;code&gt;write&lt;/code&gt; permissions for both the queue and the producer.&lt;/p&gt;\n&lt;p&gt;Before initiating a write, you need to call the &lt;code&gt;create_queue_producer_session&lt;/code&gt; method, which takes the queue path, the producer path, and the ID of the write session (&lt;code&gt;session_id&lt;/code&gt;). For &lt;code&gt;session_id&lt;/code&gt;, you can pass any string: for example, you can use the name of the host from which the write is being made. Then, if no such session exists, a new session with an &lt;code&gt;epoch&lt;/code&gt; of &lt;code&gt;0&lt;/code&gt; and a &lt;code&gt;sequence_number&lt;/code&gt; of &lt;code&gt;-1&lt;/code&gt; is created in the producer table. If a session with this ID has already been created before, its &lt;code&gt;epoch&lt;/code&gt; value is incremented.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;create_queue_producer_session&lt;/code&gt; method returns the updated epoch value as well as the index of the last message written, which should be the current write session status stored in the producer.&lt;/p&gt;\n&lt;p&gt;You can then write data to the queue using the &lt;code&gt;push_queue_producer&lt;/code&gt; method. This method takes the queue path, producer path, session ID, epoch, and the data to write. Each row must be passed with the &lt;code&gt;$sequence_number&lt;/code&gt; value corresponding to its index. Alternatively, instead of passing the index for each row in the data itself, you can specify only the index corresponding to the first row in the method options. In this case, we assume that the index should be incremented by one for each subsequent row.&lt;/p&gt;\n&lt;p&gt;You can use the session's &lt;code&gt;epoch&lt;/code&gt; to prevent zombie processes.&lt;/p&gt;\n&lt;h2 id=\"queue-agent\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/queues.html#queue-agent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Queue Agent&lt;/span&gt;&lt;/a&gt;Queue Agent&lt;/h2&gt;\n&lt;p&gt;Queue Agent is a dedicated microservice for monitoring queues, consumers, and registrations.&lt;/p&gt;\n&lt;h3 id=\"automatic_trimming\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/queues.html#automatic_trimming\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Automatic queue trimming policies&lt;/span&gt;&lt;/a&gt;Automatic queue trimming policies&lt;/h3&gt;\n&lt;p&gt;You can configure an automatic queue cleanup (trimming) policy by setting the &lt;code&gt;@auto_trim_config&lt;/code&gt; attribute with a configuration in the &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/yt/client/queue_client/config.h?rev=11720161#L41\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;appropriate format&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Available options:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;enable: True&lt;/code&gt; — Enables trimming by vital consumers. If there is at least one vital consumer, Queue Agent calls Trim for the partition at single-digit intervals in seconds until it reaches the smallest offset among vital consumers.&lt;br /&gt; &lt;strong&gt;NB:&lt;/strong&gt; If there are no vital consumers, no trimming occurs.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;retained_rows: x&lt;/code&gt; — If set, this number of rows is guaranteed to be kept in each partition. This option is intended to be used in combination with the previous option.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;retained_lifetime_duration: x&lt;/code&gt; — Ensures that each partition contains only those rows that were written to the queue no more than this number of milliseconds ago. The specified number of milliseconds must be a multiple of 1000. This option is intended to be used with trimming enabled (&lt;code&gt;enable: True&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;This setting doesn't conflict with the &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables.html#remove_old_data\"&gt;existing&lt;/a&gt; TTL settings for dynamic tables: you can configure trimming based on vital consumers and set &lt;code&gt;max_data_ttl=36h, min_data_versions=0&lt;/code&gt; to trim data based on its offset as well as ensure that it won't be stored for more than three days.&lt;/p&gt;\n&lt;h3 id=\"graphs-and-statuses\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/queues.html#graphs-and-statuses\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Graphs and statuses&lt;/span&gt;&lt;/a&gt;Graphs and statuses&lt;/h3&gt;\n&lt;p&gt;The &lt;code&gt;@queue_status&lt;/code&gt; and &lt;code&gt;@queue_partitions&lt;/code&gt; queue table attributes along with the &lt;code&gt;@queue_consumer_status&lt;/code&gt; and &lt;code&gt;@queue_consumer_partitions&lt;/code&gt; consumer table attributes provide the current status and meta information of queues and consumers from the perspective of the Queue Agent. You can get this data both for these objects as a whole as well as for their individual partitions.&lt;/p&gt;\n&lt;p&gt;These attributes aren't intended for high-load services and should only be used for introspection.&lt;/p&gt;\n&lt;h2 id=\"usage-example\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/queues.html#usage-example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usage example&lt;/span&gt;&lt;/a&gt;Usage example&lt;/h2&gt;\n&lt;p&gt;These examples use a hypothetical configuration with multiple clusters, named &lt;code&gt;freud&lt;/code&gt; and &lt;code&gt;pythia&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Listing 1 — Example of using the Queue API&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Create queue on pythia.&lt;/span&gt;\n$ yt --proxy pythia create table //tmp/&lt;span class=\"hljs-variable\"&gt;$USER&lt;/span&gt;-test-queue --attributes &lt;span class=\"hljs-string\"&gt;'{dynamic=true;schema=[{name=data;type=string};{name=\"$timestamp\";type=uint64};{name=\"$cumulative_data_weight\";type=int64}]}\n'&lt;/span&gt;2826e-2b1e4-3f30191-dcd2013e\n\n&lt;span class=\"hljs-comment\"&gt;# Create queue_consumer on freud.&lt;/span&gt;\n$ yt --proxy freud create queue_consumer //tmp/&lt;span class=\"hljs-variable\"&gt;$USER&lt;/span&gt;-test-consumer\n\n&lt;span class=\"hljs-comment\"&gt;# OR: Create queue_consumer on freud as table with explicit schema specification.&lt;/span&gt;\n$ yt --proxy freud create table //tmp/&lt;span class=\"hljs-variable\"&gt;$USER&lt;/span&gt;-test-consumer --attributes &lt;span class=\"hljs-string\"&gt;'{dynamic=true;treat_as_queue_consumer=true;schema=[{name=queue_cluster;type=string;sort_order=ascending;required=true};{name=queue_path;type=string;sort_order=ascending;required=true};{name=partition_index;type=uint64;sort_order=ascending;required=true};{name=offset;type=uint64;required=true};{name=meta;type=any;required=false}]}\n'&lt;/span&gt;18a5b-28931-3ff0191-35282540\n\n&lt;span class=\"hljs-comment\"&gt;# Register consumer for queue.&lt;/span&gt;\n$ yt --proxy pythia register-queue-consumer //tmp/&lt;span class=\"hljs-variable\"&gt;$USER&lt;/span&gt;-test-queue &lt;span class=\"hljs-string\"&gt;\"&amp;lt;cluster=freud&amp;gt;//tmp/&lt;span class=\"hljs-variable\"&gt;$USER&lt;/span&gt;-test-consumer\"&lt;/span&gt; --vital\n\n&lt;span class=\"hljs-comment\"&gt;# Check registrations for queue.&lt;/span&gt;\n$ yt --proxy pythia list-queue-consumer-registrations --queue-path //tmp/&lt;span class=\"hljs-variable\"&gt;$USER&lt;/span&gt;-test-queue\n[\n  {\n    &lt;span class=\"hljs-string\"&gt;\"queue_path\"&lt;/span&gt; = &amp;lt;\n      &lt;span class=\"hljs-string\"&gt;\"cluster\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"pythia\"&lt;/span&gt;;\n    &amp;gt; &lt;span class=\"hljs-string\"&gt;\"//tmp/bob-test-queue\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"consumer_path\"&lt;/span&gt; = &amp;lt;\n      &lt;span class=\"hljs-string\"&gt;\"cluster\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"freud\"&lt;/span&gt;;\n    &amp;gt; &lt;span class=\"hljs-string\"&gt;\"//tmp/bob-test-consumer\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\
