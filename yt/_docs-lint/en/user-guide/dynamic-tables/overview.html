        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Dynamic tables are a type of table in YTsaurus that implement an interface to read and write data by key. They support transactions and their own SQL dialect.&lt;/p&gt;\n&lt;p&gt;Dynamic tables add the capabilities of typical key-value storage to the YTsaurus system. Elementary operations with such tables are writing, deleting, and reading rows by key. You can also execute SQL queries to work with row ranges.&lt;/p&gt;\n&lt;p&gt;Dynamic tables support &lt;a href=\"https://en.wikipedia.org/wiki/Multiversion_concurrency_control\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MVCC&lt;/a&gt; for transactions. Working with them does not require communication with the YTsaurus master server, which provides additional scalability.&lt;/p&gt;\n&lt;p&gt;The closest analogs to dynamic tables are:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"http://hbase.apache.org\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apache HBase&lt;/a&gt;: In terms of data storage organization.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://ai.google/research/pubs/pub39966\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Spanner&lt;/a&gt;: In terms of transaction implementation.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"http://impala.apache.org\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Impala&lt;/a&gt;: In terms of the query calculation model.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The similarities with these systems will be described below.&lt;/p&gt;\n&lt;h2 id=\"types\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/overview.html#types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Types of dynamic tables&lt;/span&gt;&lt;/a&gt;Types of dynamic tables&lt;/h2&gt;\n&lt;p&gt;Dynamic tables can be &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html\"&gt;sorted&lt;/a&gt; and &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables.html\"&gt;ordered&lt;/a&gt;. In addition, a replication mechanism is implemented for each table type. For more information about replication, see &lt;a href=\"user-guide/dynamic-tables/replicated-dynamic-tables.html\"&gt;replicated dynamic tables&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"architecture\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/overview.html#architecture\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Architecture&lt;/span&gt;&lt;/a&gt;Architecture&lt;/h2&gt;\n&lt;p&gt;Architecturally, the way dynamic tables are stored in YTsaurus uses the &lt;a href=\"https://en.wikipedia.org/wiki/Log-structured_merge-tree\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Log-structured merge tree&lt;/a&gt; idea. This makes it similar to &lt;a href=\"http://static.googleusercontent.com/media/research.google.com/en//archive/bigtable-osdi06.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;BigTable&lt;/a&gt; and &lt;a href=\"https://hbase.apache.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;HBase&lt;/a&gt;. To ensure fault tolerance and consistency, the service uses the Hydra state replication library (&lt;a href=\"https://raft.github.io/raft.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Raft&lt;/a&gt; analog). Similar to &lt;a href=\"https://research.google/pubs/pub39966/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google Spanner&lt;/a&gt;, it implements &lt;a href=\"https://en.wikipedia.org/wiki/Two-phase_commit_protocol\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;two-phase commits&lt;/a&gt; to support distributed transactions.&lt;/p&gt;\n&lt;p&gt;For more information about the data architecture and model, see separate sections about &lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html\"&gt;sorted&lt;/a&gt; and &lt;a href=\"user-guide/dynamic-tables/ordered-dynamic-tables.html\"&gt;ordered&lt;/a&gt; dynamic tables.&lt;/p&gt;\n&lt;h2 id=\"attributes\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/overview.html#attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Attributes&lt;/span&gt;&lt;/a&gt;Attributes&lt;/h2&gt;\n&lt;p&gt;Besides the attributes inherent to all tables, dynamic tables have a number of unique attributes. Some of them are detailed in the following table:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Name&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;chunk_row_count&lt;/td&gt;\n&lt;td&gt;Int&lt;/td&gt;\n&lt;td&gt;Total number of non-combined rows in all table chunks.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tablets&lt;i class=\"yfm yfm-term_title\" term-key=\":*\" role=\"button\" aria-describedby=\":*_element\" tabindex=\"0\" id=\"hr5vt334\"&gt;*&lt;/i&gt;&lt;/td&gt;\n&lt;td&gt;TabletInfo&lt;/td&gt;\n&lt;td&gt;Tablet description.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;atomicity&lt;/td&gt;\n&lt;td&gt;Atomicity&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/dynamic-tables/transactions.html#atomicity\"&gt;Atomicity mode&lt;/a&gt;. By default: &lt;code&gt;full&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;in_memory_mode&lt;/td&gt;\n&lt;td&gt;InMemoryMode&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/user-guide/dynamic-tables/overview.html#in_memory\"&gt;In-memory mode&lt;/a&gt; for tables. By default: &lt;code&gt;none&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;The &lt;code&gt;chunk_row_count&lt;/code&gt; attribute can be used to evaluate the table size, but the evaluation is approximate for the following reasons:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;It does not take into account the rows that were recently written and have not yet been flushed into chunks, residing only in nodes memory.&lt;/li&gt;\n&lt;li&gt;Different versions of a single row can be counted multiple times until corresponding chunks are combined.&lt;/li&gt;\n&lt;li&gt;Rows may exist but be marked as deleted or aged.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Individual attributes of a dynamic table affect its behavior. In particular, you can use individual attributes to:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"user-guide/dynamic-tables/compaction.html#attributes\"&gt;Set up background compaction&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/dynamic-tables/sorted-dynamic-tables.html#remove_old_data\"&gt;Set TTL&lt;/a&gt;: Time to live for individual values.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/dynamic-tables/tablet-balancing.html\"&gt;Manage automatic sharding&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"limitations\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/overview.html#limitations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Limitations&lt;/span&gt;&lt;/a&gt;Limitations&lt;/h2&gt;\n&lt;p&gt;A number of size and content type limitations are imposed on rows and the schema of a dynamic table:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The number of columns in a dynamic table cannot exceed 1024, of which no more than 32 can be key columns.&lt;/li&gt;\n&lt;li&gt;The maximum length of the &lt;code&gt;String&lt;/code&gt; value in a dynamic table is 16 megabytes.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Besides that, dynamic tables inherit the &lt;a href=\"user-guide/storage/static-tables.html#limitations\"&gt;limitations&lt;/a&gt; of static tables.&lt;/p&gt;\n&lt;h2 id=\"in_memory\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/overview.html#in_memory\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;In-memory tables (in-memory)&lt;/span&gt;&lt;/a&gt;In-memory tables (in-memory)&lt;/h2&gt;\n&lt;p&gt;Accessing data in RAM is much faster than accessing data on the disk. In the YTsaurus system, you can set up a table so that its data is permanently stored in memory. This drastically increases the speed of table operations. This method has certain limitations:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;The RAM capacity on all cluster nodes is limited, so this option should only be used when really needed.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Any sorted dynamic table can be switched to in-memory mode, as well as taken out of this mode. Run &lt;code&gt;remount_table&lt;/code&gt; to make the changes take effect.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;The use of dynamic in-memory tables does not affect the levels of isolation, consistency, or fault tolerance. The data of such tables is still stored in chunks of the distributed storage: in-memory mode only means that in addition to being stored on the disk, the table data is also stored in RAM.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;When in-memory mode is enabled, data is uploaded into the cluster node memory. This may take some time.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;In-memory mode is configured using the &lt;code&gt;in_memory_mode&lt;/code&gt; attribute for the table. Possible attribute values:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Mode&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;In-memory mode&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;None&lt;/td&gt;\n&lt;td&gt;Disabled&lt;/td&gt;\n&lt;td&gt;Table data is written to chunks and their blocks, compressed and uncompressed, and cached on a common basis. This mode is suitable for large tables that cannot be fixed in memory.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Compressed&lt;/td&gt;\n&lt;td&gt;Enabled&lt;/td&gt;\n&lt;td&gt;The compressed table data — the contents of the chunk blocks — is permanently present in memory, but the data blocks must be unpacked for read accesses. Unpacked blocks are cached on a common basis. This mode is a good combination in terms of speed-to-memory capacity ratio.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Uncompressed&lt;/td&gt;\n&lt;td&gt;Enabled&lt;/td&gt;\n&lt;td&gt;Uncompressed table data is permanently present in memory, no disk accesses or data unpacking are needed for read accesses. This mode provides maximum performance at the cost of RAM.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"hash-tables-to-read-by-key\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/overview.html#hash-tables-to-read-by-key\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hash tables to read by key&lt;/span&gt;&lt;/a&gt;Hash tables to read by key&lt;/h3&gt;\n&lt;p&gt;The read by key operation searches for the table data keys using a binary search. You can achieve some acceleration by building hash tables for the keys. To do this, set the &lt;code&gt;enable_lookup_hash_table = %true&lt;/code&gt; attribute for the table.&lt;/p&gt;\n&lt;p&gt;Hash tables only make sense in &lt;code&gt;uncompressed&lt;/code&gt; mode and they are not allowed in other modes.&lt;/p&gt;\n&lt;h2 id=\"formats\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/overview.html#formats\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Table storage formats&lt;/span&gt;&lt;/a&gt;Table storage formats&lt;/h2&gt;\n&lt;p&gt;The YTsaurus system offers several ways of table data storage in chunks. Switching between them is managed by the &lt;code&gt;optimize_for&lt;/code&gt; attribute on the table. This attribute can be changed on an existing table, but the effect will only be noticeable for newly created chunks. Taking into account compaction, old data can also be recompressed in background mode.&lt;/p&gt;\n&lt;p&gt;If the table is already mounted, run the &lt;code&gt;remount_table&lt;/code&gt; command to inform the tablets of the format change.&lt;/p&gt;\n&lt;p&gt;Possible values of the &lt;code&gt;optimize_for&lt;/code&gt; attribute:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;lookup&lt;/code&gt;: The format, which enables rows to be efficiently read from a table by individual keys.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;scan&lt;/code&gt;: The &lt;code&gt;scan&lt;/code&gt; format uses column-by-column storage, as well as adaptive column-by-column compression algorithms. The vertical data partitioning method is less suitable for random reads by keys, because more blocks will need to be read and more CPU performance will be required.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"acl\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/overview.html#acl\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Access permissions&lt;/span&gt;&lt;/a&gt;Access permissions&lt;/h2&gt;\n&lt;p&gt;The access control system applies to dynamic tables:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;To read data from a dynamic table (using the &lt;code&gt;select_rows&lt;/code&gt; and &lt;code&gt;lookup_rows&lt;/code&gt; queries), the user must have the &lt;code&gt;read&lt;/code&gt; permission for the table.&lt;/li&gt;\n&lt;li&gt;To write data to a dynamic table (using the &lt;code&gt;insert_rows&lt;/code&gt; and &lt;code&gt;delete_rows&lt;/code&gt; commands), the user must have the &lt;code&gt;write&lt;/code&gt; permission for the table.&lt;/li&gt;\n&lt;li&gt;To run the &lt;code&gt;mount_table&lt;/code&gt;, &lt;code&gt;unmount_table&lt;/code&gt;, &lt;code&gt;remount_table&lt;/code&gt;, and &lt;code&gt;reshard_table&lt;/code&gt; commands, the user must have the &lt;code&gt;mount&lt;/code&gt; permission for the table.&lt;/li&gt;\n&lt;li&gt;Similar to accounts, in order to create tables linked to a bundle, the user must have the &lt;code&gt;use&lt;/code&gt; permission for the bundle. The same rule is required to change the table bundle.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"links\"&gt;&lt;a href=\"en/user-guide/dynamic-tables/overview.html#links\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Useful links&lt;/span&gt;&lt;/a&gt;Useful links&lt;/h2&gt;\n&lt;p&gt;Webinars:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://www.youtube.com/watch?v=vxKD0lLS4mM\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Dynamic tables overview, part 1&lt;/a&gt; (in Russian)&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://www.youtube.com/watch?v=JZGTUjyJw38\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Dynamic tables overview, part 2&lt;/a&gt; (in Russian)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;dfn class=\"yfm yfm-term_dfn\" id=\":*_element\" role=\"dialog\"&gt;&lt;p&gt;The parameter appears in the answer several times.&lt;/p&gt;\n&lt;/dfn&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/dynamic-tables/overview.md","sourcePath":"en/user-guide/dynamic-tables/overview.md"},"headings":[{"title":"Types of dynamic tables","href":"en/user-guide/dynamic-tables/overview.html#types","level":2},{"title":"Architecture","href":"en/user-guide/dynamic-tables/overview.html#architecture","level":2},{"title":"Attributes","href":"en/user-guide/dynamic-tables/overview.html#attributes","level":2},{"title":"Limitations","href":"en/user-guide/dynamic-tables/overview.html#limitations","level":2},{"title":"In-memory tables (in-memory)","href":"en/user-guide/dynamic-tables/overview.html#in_memory","level":2,"items":[{"title":"Hash tables to read by key","href":"en/user-guide/dynamic-tables/overview.html#hash-tables-to-read-by-key","level":3}]},{"title":"Table storage formats","href":"en/user-guide/dynamic-tables/overview.html#formats","level":2},{"title":"Access permissions","href":"en/user-guide/dynamic-tables/overview.html#acl","level":2},{"title":"Useful links","href":"en/user-guide/dynamic-tables/overview.html#links","level":2}],"title":"Dynamic tables"},"router":{"pathname":"en/user-guide/dynamic-tables/overview","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
