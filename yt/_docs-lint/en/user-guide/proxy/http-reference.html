        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"commands_structure\"&gt;&lt;a href=\"en/user-guide/proxy/http-reference.html#commands_structure\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Command execution structure&lt;/span&gt;&lt;/a&gt;Command execution structure&lt;/h2&gt;\n&lt;p&gt;When developing a library to work with YTsaurus, you should understand the command execution structure.&lt;/p&gt;\n&lt;p&gt;Each executed command is a structure containing:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Information about the user, allowing for authentication (in case of working over HTTP, it is most often a token).&lt;/li&gt;\n&lt;li&gt;Information about the input and output data &lt;a href=\"user-guide/storage/formats.html\"&gt;format&lt;/a&gt; (represented as a YSON string with attributes).&lt;/li&gt;\n&lt;li&gt;Information about the command parameters (represented as a YSON dict).&lt;/li&gt;\n&lt;li&gt;Input (byte) data stream.&lt;/li&gt;\n&lt;li&gt;Output (byte) data stream.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Below are the formal coding specifications for each item in the HTTP proxy, which include more features for interpreting HTTP queries (partially to support compatibility with such HTTP clients as web browsers). To work correctly with YTsaurus, you need to support a smaller set of features, namely:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Specify &lt;code&gt;X-YT-Header-Format&lt;/code&gt; that defines the format for the &lt;code&gt;X-YT-Input-Format&lt;/code&gt;, &lt;code&gt;X-YT-Output-Format&lt;/code&gt;, and &lt;code&gt;X-YT-Parameters&lt;/code&gt; headers (the header value is YSON).&lt;/li&gt;\n&lt;li&gt;Specify &lt;code&gt;X-YT-Input-Format&lt;/code&gt; and &lt;code&gt;X-YT-Output-Format&lt;/code&gt; encoded according to &lt;code&gt;X-YT-Header-Format&lt;/code&gt; and defining the input and output data stream formats.&lt;/li&gt;\n&lt;li&gt;Pass all command parameters in the &lt;code&gt;X-YT-Parameters&lt;/code&gt; header encoded according to &lt;code&gt;X-YT-Header-Format&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Consider all HTTP responses 5xx as a transport-layer error. You must distinguish code 503 that is a clear signal of temporary unavailability from code 500 that signals an error on the YTsaurus side. In the first case, you can repeat the query.&lt;/li&gt;\n&lt;li&gt;In all other responses (2xx, 4xx) about the successful execution of the command, judge by &lt;code&gt;X-YT-Error&lt;/code&gt; (preferably) or &lt;code&gt;X-YT-Response-Code&lt;/code&gt; (extracted from the &lt;code&gt;X-YT-Error&lt;/code&gt; error code) and &lt;code&gt;X-YT-Response-Message&lt;/code&gt; (extracted from the &lt;code&gt;X-YT-Error&lt;/code&gt; error troubleshooting) headers/trailers.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"http_method\"&gt;&lt;a href=\"en/user-guide/proxy/http-reference.html#http_method\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Selecting an HTTP method for a command&lt;/span&gt;&lt;/a&gt;Selecting an HTTP method for a command&lt;/h2&gt;\n&lt;p&gt;To select an HTTP method for a command, just use the following algorithm:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;If the command has an input data stream, then PUT.&lt;/li&gt;\n&lt;li&gt;If the command is mutating, then POST.&lt;/li&gt;\n&lt;li&gt;Otherwise GET.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"formats\"&gt;&lt;a href=\"en/user-guide/proxy/http-reference.html#formats\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data formats for operations&lt;/span&gt;&lt;/a&gt;Data formats for operations&lt;/h2&gt;\n&lt;p&gt;Interpreting input and output byte streams (with a data type other than binary) is determined by the &lt;a href=\"user-guide/storage/formats.html\"&gt;data format&lt;/a&gt;. A description of the format used is a YSON string possibly with additional attributes. A standard way to describe the formats used are the &lt;code&gt;X-YT-Input-Format&lt;/code&gt; and &lt;code&gt;X-YT-Output-Format&lt;/code&gt; headers. For better compatibility with HTTP libraries, the &lt;code&gt;Accept&lt;/code&gt; and &lt;code&gt;Content-Type&lt;/code&gt; headers are partially supported. Below is a detailed description of the format definition rules.&lt;/p&gt;\n&lt;h3 id=\"set_input_format\"&gt;&lt;a href=\"en/user-guide/proxy/http-reference.html#set_input_format\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Specifying an input data format&lt;/span&gt;&lt;/a&gt;Specifying an input data format&lt;/h3&gt;\n&lt;p&gt;An input data format is determined using the following rules. Each successive rule overlaps the previous one.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;If the &lt;code&gt;Content-Type&lt;/code&gt; header is specified and the specified MIME type is in the correspondence table, the format is selected from the table.&lt;/li&gt;\n&lt;li&gt;If the &lt;code&gt;X-YT-Input-Format&lt;/code&gt; header is specified, the header content is interpreted as a JSON-encoded YSON string with attributes and it is used as an input format description.&lt;/li&gt;\n&lt;li&gt;If neither variant 1 nor variant 2 is successful, YSON is used.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"set_output_format\"&gt;&lt;a href=\"en/user-guide/proxy/http-reference.html#set_output_format\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Specifying an output data format&lt;/span&gt;&lt;/a&gt;Specifying an output data format&lt;/h3&gt;\n&lt;p&gt;An output data format is determined using the following rules. Each successive rule overlaps the previous one.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;If the &lt;code&gt;Accept&lt;/code&gt; header is specified, the best MIME type from the table corresponding to the Accept header is selected and then the format is taken from the table. Content-Type is equal to the matching MIME type.&lt;/li&gt;\n&lt;li&gt;If the &lt;code&gt;X-YT-Output-Format&lt;/code&gt; header is specified, the header content is interpreted as a JSON-encoded YSON string with attributes and it is used as an output format description. Content-Type is equal to &lt;code&gt;application/octet-stream&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;If neither variant 1 nor variant 2 is successful, Pretty YSON is used. Content-Type is equal to &lt;code&gt;text/plain&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"return_codes\"&gt;&lt;a href=\"en/user-guide/proxy/http-reference.html#return_codes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HTTP return codes&lt;/span&gt;&lt;/a&gt;HTTP return codes&lt;/h2&gt;\n&lt;p&gt;If the web server realizes that there is an error before any data is sent to the client, return code 4xx or 5xx indicates an error. If the data started to be delivered to the client, the return code will be (&lt;code&gt;Accepted&lt;/code&gt;) and there will be a YTsaurus return code in the &lt;code&gt;X-YT-Response-Code&lt;/code&gt; trailer header. A non-zero &lt;code&gt;X-YT-Response-Code&lt;/code&gt; indicates an error. In this case, an error message (as a JSON string) is specified in the &lt;code&gt;X-YT-Response-Message&lt;/code&gt; trailer header.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Table 1 — Return codes&lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Return code&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;200&lt;/td&gt;\n&lt;td&gt;The command was successfully completed&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;202&lt;/td&gt;\n&lt;td&gt;The command is executed, the response body will be sent over an HTTP stream, and internal return codes are written in the trailer headers&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;307&lt;/td&gt;\n&lt;td&gt;Redirecting heavy queries from light to heavy proxies&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;400&lt;/td&gt;\n&lt;td&gt;The command was executed, but an error was returned (detailed JSON-encoded error in the body)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;401&lt;/td&gt;\n&lt;td&gt;Unauthenticated query&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;404&lt;/td&gt;\n&lt;td&gt;Unknown command&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;405&lt;/td&gt;\n&lt;td&gt;Incorrect HTTP method&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;406&lt;/td&gt;\n&lt;td&gt;Incorrect format in Accept&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;415&lt;/td&gt;\n&lt;td&gt;Incorrect format in Accept-Encoding&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;429&lt;/td&gt;\n&lt;td&gt;The limit on the number of queries from a user was exceeded&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;500&lt;/td&gt;\n&lt;td&gt;Error on the proxy side&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;503&lt;/td&gt;\n&lt;td&gt;Service unavailable. The query must be repeated later&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"debugging\"&gt;&lt;a href=\"en/user-guide/proxy/http-reference.html#debugging\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Query debugging&lt;/span&gt;&lt;/a&gt;Query debugging&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;All queries support optional debug headers. Processing them is not mandatory, but recommended.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;In the query:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Generate guid and set it in the &lt;code&gt;X-YT-Correlation-Id&lt;/code&gt; header. This header helps you find the query by log even if the response to it did not come to the client.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;In the response:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;X-YT-Request-Id&lt;/code&gt;: ID of the query generated by the proxy. You need it to find the query in the YTsaurus proxy log.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;X-YT-Proxy&lt;/code&gt;: Hostname of the proxy from which the response came. It is important when the query passes through a balancer.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"additional\"&gt;&lt;a href=\"en/user-guide/proxy/http-reference.html#additional\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Advanced features&lt;/span&gt;&lt;/a&gt;Advanced features&lt;/h2&gt;\n&lt;h3 id=\"compression\"&gt;&lt;a href=\"en/user-guide/proxy/http-reference.html#compression\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Compression&lt;/span&gt;&lt;/a&gt;Compression&lt;/h3&gt;\n&lt;p&gt;You can use compression when transmitting data via an HTTP proxy. The proxy selects a codec for incoming data based on the &lt;code&gt;Content-Encoding&lt;/code&gt; header and for outgoing data based on the &lt;code&gt;Accept-Encoding&lt;/code&gt; header. Possible codecs are listed in the table.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Content-Encoding&lt;/strong&gt;/&lt;strong&gt;Accept-Encoding&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Codec&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;identity&lt;/td&gt;\n&lt;td&gt;None&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;gzip, deflate&lt;/td&gt;\n&lt;td&gt;Standard zlib&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"parameters\"&gt;&lt;a href=\"en/user-guide/proxy/http-reference.html#parameters\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Parameters&lt;/span&gt;&lt;/a&gt;Parameters&lt;/h3&gt;\n&lt;p&gt;Each command has a set of additional parameters represented as a YSON dict. A standard method to pass parameters is the &lt;code&gt;X-YT-Parameters&lt;/code&gt; header interpreted as a JSON-encoded YSON dict.&lt;/p&gt;\n&lt;h3 id=\"hosts\"&gt;&lt;a href=\"en/user-guide/proxy/http-reference.html#hosts\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List of heavy proxies (/hosts)&lt;/span&gt;&lt;/a&gt;List of heavy proxies (/hosts)&lt;/h3&gt;\n&lt;p&gt;All YTsaurus commands are classified into two groups: light and heavy. Heavy commands are associated with a large I/O and, consequently, a network load. To isolate this load, light (controlling) commands are separated from the heavy ones. When you try to execute a heavy command, light proxies return code 503. The balancing of heavy commands among heavy proxies is performed by the client.&lt;/p&gt;\n&lt;p&gt;Before you execute a heavy command, you need to query &lt;code&gt;/hosts&lt;/code&gt; and get a list of proxies ordered by load. The load is estimated based on the current CPU and network load, as well as some planned future load on the proxies. The very first proxy in the resulting list is the least loaded, and that's the one you want to use in simple cases (= in 80% of cases).&lt;/p&gt;\n&lt;h3 id=\"api\"&gt;&lt;a href=\"en/user-guide/proxy/http-reference.html#api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Available API versions (/api)&lt;/span&gt;&lt;/a&gt;Available API versions (/api)&lt;/h3&gt;\n&lt;p&gt;The HTTP API is versioned (as you can see from the &lt;code&gt;/v4&lt;/code&gt; prefix in the examples &lt;a href=\"user-guide/proxy/http.html\"&gt;from here&lt;/a&gt;). The API version is changed if there are backward-incompatible changes to the set of supported commands or to the semantics of any of the existing commands. Adding new commands does not usually change the API version. The HTTP proxy supports the two latest versions of the API.&lt;/p&gt;\n&lt;p&gt;A list of supported API versions can be obtained from the URL &lt;code&gt;/api&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Getting a list of available APIs:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ curl -v -X GET &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/api\"&lt;/span&gt;\n&amp;gt; GET /api HTTP/1.1\n&amp;lt; HTTP/1.1 200 OK\n[&lt;span class=\"hljs-string\"&gt;\"v3\"&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;\"v4\"&lt;/span&gt;]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"364\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-364\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-364\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-364.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"mime_to_yt_format\"&gt;&lt;a href=\"en/user-guide/proxy/http-reference.html#mime_to_yt_format\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;The table of correspondence of MIME types and YT formats&lt;/span&gt;&lt;/a&gt;The table of correspondence of MIME types and YT formats&lt;/h2&gt;\n&lt;p&gt;The correspondence of MIME types to YT formats is represented in the table.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;MIME type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;YT format&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;application/json&lt;/td&gt;\n&lt;td&gt;json&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;application/x-yt-yson-binary&lt;/td&gt;\n&lt;td&gt;&amp;lt;format=binary&amp;gt;yson&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;application/x-yt-yson-text&lt;/td&gt;\n&lt;td&gt;&amp;lt;format=text&amp;gt;yson&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;application/x-yt-yson-pretty&lt;/td&gt;\n&lt;td&gt;&amp;lt;format=pretty&amp;gt;yson&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;application/x-yamr-delimited&lt;/td&gt;\n&lt;td&gt;&amp;lt;lenval=false;has_subkey=false&amp;gt;yamr&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;application/x-yamr-lenval&lt;/td&gt;\n&lt;td&gt;&amp;lt;lenval=true;has_subkey=false&amp;gt;yamr&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;application/x-yamr-subkey-delimited&lt;/td&gt;\n&lt;td&gt;&amp;lt;lenval=false;has_subkey=true&amp;gt;yamr&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;application/x-yamr-subkey-lenval&lt;/td&gt;\n&lt;td&gt;&amp;lt;lenval=true;has_subkey=true&amp;gt;yamr&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;text/tab-separated-values&lt;/td&gt;\n&lt;td&gt;dsv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;text/x-tskv&lt;/td&gt;\n&lt;td&gt;&amp;lt;line_prefix=tskv&amp;gt;dsv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"framing\"&gt;&lt;a href=\"en/user-guide/proxy/http-reference.html#framing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Framing&lt;/span&gt;&lt;/a&gt;Framing&lt;/h2&gt;\n&lt;p&gt;Some commands may use a special protocol on top of the usual HTTP.&lt;br /&gt;\nIf the client specifies the &lt;code&gt;X-YT-Accept-Framing: 1&lt;/code&gt; header, the proxy can respond with the &lt;code&gt;X-YT-Framing: 1&lt;/code&gt; header.&lt;br /&gt;\nIn this case, the response body will consist of entries of the &lt;code&gt;&amp;lt;tag&amp;gt; &amp;lt;header&amp;gt; &amp;lt;frame&amp;gt;&lt;/code&gt; type.&lt;/p&gt;\n&lt;p&gt;Frame types:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Name&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Tag&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Header&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Frame&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Comment&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Data&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0x01&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;4-byte little-endian number — frame size&lt;/td&gt;\n&lt;td&gt;frame body&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Keep-alive&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0x02&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;\"the data is being prepared, please wait\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/proxy/http-reference.md","sourcePath":"en/user-guide/proxy/http-reference.md"},"headings":[{"title":"Command execution structure","href":"en/user-guide/proxy/http-reference.html#commands_structure","level":2},{"title":"Selecting an HTTP method for a command","href":"en/user-guide/proxy/http-reference.html#http_method","level":2},{"title":"Data formats for operations","href":"en/user-guide/proxy/http-reference.html#formats","level":2,"items":[{"title":"Specifying an input data format","href":"en/user-guide/proxy/http-reference.html#set_input_format","level":3},{"title":"Specifying an output data format","href":"en/user-guide/proxy/http-reference.html#set_output_format","level":3}]},{"title":"HTTP return codes","href":"en/user-guide/proxy/http-reference.html#return_codes","level":2},{"title":"Query debugging","href":"en/user-
