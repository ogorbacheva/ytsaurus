        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;The main task solved by CHYT is processing tables that are already in YTsaurus without having to copy them to any third-party storages.&lt;/p&gt;\n&lt;p&gt;Thus, the main difference of CHYT from ClickHouse is that it does not have the variety of engines from regular ClickHouse. Tables are stored according to the logic of &lt;a href=\"user-guide/storage/static-tables.html\"&gt;table storage in YTsaurus&lt;/a&gt;. Creating tables using standard ClickHouse engines is prohibited. Instead, you can read any of the existing tables in the corresponding YTsaurus cluster. You can also save results as YTsaurus tables.&lt;/p&gt;\n&lt;p&gt;\"Under the hood\", working with YTsaurus tables is arranged similarly to the &lt;a href=\"https://clickhouse.com/docs/en/engines/table-engines/special/distributed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Distributed&lt;/a&gt; engine from ClickHouse. Exception: you do not have to think about manual or automatic distribution of data into shards, because as a storage YTsaurus solves this task in a transparent, seamless, and reliable way, distributing data to nodes.&lt;/p&gt;\n&lt;p&gt;CHYT works only with &lt;a href=\"user-guide/storage/static-schema.html\"&gt;schematized tables&lt;/a&gt;. The table must have the filled in &lt;code&gt;/@schema&lt;/code&gt; attribute, or the &lt;strong&gt;Schema&lt;/strong&gt; tab in the YTsaurus web interface must have a schema (i.e. at least one column is mentioned), which is the same thing.&lt;/p&gt;\n&lt;p&gt;YTsaurus tables are denoted by their full paths in Cypress wrapped in backticks or in double quotes: &lt;code&gt;`//path/to/table`&lt;/code&gt; or &lt;code&gt;\"//path/to/table\"&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table`\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"15\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-15\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-15\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-15.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;CHYT can read and write static and sorted dynamic tables, but note that due to the data storage peculiarities, reading from &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;dynamic tables&lt;/a&gt; may take by several times more time than reading from static tables.&lt;/p&gt;\n&lt;h2 id=\"many\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/yt-tables.html#many\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reading multiple tables&lt;/span&gt;&lt;/a&gt;Reading multiple tables&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Concatenation of several YTsaurus tables: &lt;code&gt;concatYtTables(table1, [table2, [...]])&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; concatYtTables(\"//tmp/sample_table\", \"//tmp/sample_table2\")\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"30\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-30\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-30\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-30.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Concatenation of all tables along &lt;code&gt;cypressPath&lt;/code&gt; (without a slash at the end): &lt;code&gt;concatYtTablesRange(cypressPath, [from, [to]])&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; concatYtTablesRange(\"//tmp/sample_tables\")\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; concatYtTablesRange(&lt;span class=\"hljs-string\"&gt;'//tmp/sample_tables'&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;'2019-01-01'&lt;/span&gt;)\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; concatYtTablesRange(&lt;span class=\"hljs-string\"&gt;'//tmp/sample_tables'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'2019-08-13T11:00:00'&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"39\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-39\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-39\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-39.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;For more information about these functions, see &lt;a href=\"user-guide/data-processing/chyt/reference/functions.html#multiple_tables_read\"&gt;Reading a set of tables&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"save\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/yt-tables.html#save\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Saving results&lt;/span&gt;&lt;/a&gt;Saving results&lt;/h2&gt;\n&lt;p&gt;CHYT can create static tables, insert data into them, and save query results in YTsaurus. Below is a list of supported queries:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;INSERT INTO … VALUES&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;INSERT INTO … SELECT&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;CREATE TABLE&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;CREATE TABLE AS SELECT&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Examples:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-comment\"&gt;-- Inserting data into a table&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;INSERT INTO&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table`(a) &lt;span class=\"hljs-keyword\"&gt;VALUES&lt;/span&gt; (&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;), (&lt;span class=\"hljs-number\"&gt;11&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"76\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-76\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-76\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-76.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-comment\"&gt;-- Inserting data from another table&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;INSERT INTO&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table`\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; a&lt;span class=\"hljs-operator\"&gt;+&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;100&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table` &lt;span class=\"hljs-keyword\"&gt;ORDER&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; a;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"77\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-77\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-77\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-77.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-comment\"&gt;-- Creating a table&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;CREATE TABLE&lt;/span&gt; IF &lt;span class=\"hljs-keyword\"&gt;NOT&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;EXISTS&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table`\n(\n   a String,\n   b Int32\n) ENGINE &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; YtTable();\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"78\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-78\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-78\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-78.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-comment\"&gt;-- Creating a table with sorting by key b&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;CREATE TABLE&lt;/span&gt; IF &lt;span class=\"hljs-keyword\"&gt;NOT&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;EXISTS&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table_with_pk`\n(\n   a String,\n   b Int32\n) ENGINE &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; YtTable() &lt;span class=\"hljs-keyword\"&gt;order&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt; b;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"79\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-79\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-79\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-79.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-comment\"&gt;-- Creating a table based on a select query&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;CREATE TABLE&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table` ENGINE &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; YtTable()\n&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; a &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table` &lt;span class=\"hljs-keyword\"&gt;ORDER&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; a;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"80\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-80\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-80\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-80.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-comment\"&gt;-- Creating a table based on a select query with sorting by column b&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;CREATE TABLE&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table_with_pk` ENGINE &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; YtTable() &lt;span class=\"hljs-keyword\"&gt;order&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt; b\n&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; b,a &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table` &lt;span class=\"hljs-keyword\"&gt;order&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt; b;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"81\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-81\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-81\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-81.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;To overwrite the existing data, just add the &lt;code&gt;&amp;lt;append=%false&amp;gt;&lt;/code&gt; option before the path:&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;INSERT INTO&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;append&lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;%&lt;/span&gt;&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table`\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; a&lt;span class=\"hljs-operator\"&gt;+&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;100&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table` &lt;span class=\"hljs-keyword\"&gt;ORDER&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; a.\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"88\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-88\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-88\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-88.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;When creating a table, you can specify additional attributes. To do this, just pass them to Engine in the form of &lt;a href=\"user-guide/storage/data-types.html#yson\"&gt;YSON&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;CREATE TABLE&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table`(i Int64) engine &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; YtTable(&lt;span class=\"hljs-string\"&gt;'{compression_codec=snappy}'&lt;/span&gt;);\n\n&lt;span class=\"hljs-keyword\"&gt;CREATE TABLE&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table`(i Int64) engine &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; YtTable(&lt;span class=\"hljs-string\"&gt;'{optimize_for=lookup}'&lt;/span&gt;);\n\n&lt;span class=\"hljs-keyword\"&gt;CREATE TABLE&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table`(i Int64) engine &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; YtTable(&lt;span class=\"hljs-string\"&gt;'{primary_medium=ssd_blobs}'&lt;/span&gt;).\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"95\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-95\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-95\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-95.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;There are restrictions when saving results: default values, expressions for TTL, and compression formats for columns are ignored.&lt;/p&gt;\n&lt;h2 id=\"ddl\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/yt-tables.html#ddl\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Table manipulation queries&lt;/span&gt;&lt;/a&gt;Table manipulation queries&lt;/h2&gt;\n&lt;p&gt;CHYT supports the following operations on tables:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;TRUNCATE TABLE [IF EXISTS]&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;RENAME TABLE … TO …&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;EXCHANGE TABLES … AND …&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DROP TABLE [IF EXISTS]&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Examples:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-comment\"&gt;-- Deleting all data from a table&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;TRUNCATE&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;TABLE&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table`;\n&lt;span class=\"hljs-keyword\"&gt;TRUNCATE&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;TABLE&lt;/span&gt; IF &lt;span class=\"hljs-keyword\"&gt;EXISTS&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table`;\n\n&lt;span class=\"hljs-comment\"&gt;-- Renaming a table&lt;/span&gt;\nRENAME &lt;span class=\"hljs-keyword\"&gt;TABLE&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table` &lt;span class=\"hljs-keyword\"&gt;TO&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table_renamed`;\n\n&lt;span class=\"hljs-comment\"&gt;-- Exchanging the names of two tables&lt;/span&gt;\nEXCHANGE TABLES `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table` &lt;span class=\"hljs-keyword\"&gt;AND&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;other_sample_table`;\n\n&lt;span class=\"hljs-comment\"&gt;-- Deleting a table&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;DROP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;TABLE&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table`;\n&lt;span class=\"hljs-keyword\"&gt;DROP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;TABLE&lt;/span&gt; IF &lt;span class=\"hljs-keyword\"&gt;EXISTS&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table`;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"130\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-130\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-130\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-130.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"virtual_columns\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/yt-tables.html#virtual_columns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Virtual columns&lt;/span&gt;&lt;/a&gt;Virtual columns&lt;/h2&gt;\n&lt;p&gt;Each YTsaurus table has virtual columns. These columns are not visible in the &lt;code&gt;DESCRIBE TABLE&lt;/code&gt; and &lt;code&gt;SELECT * FROM&lt;/code&gt; queries and you can only get them by explicitly accessing them.&lt;/p&gt;\n&lt;p&gt;3 virtual columns are currently available for each table:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;$table_index Int64&lt;/code&gt;: The table number in the order of enumeration in &lt;code&gt;concatYtTables&lt;/code&gt; (or in the sort order in &lt;code&gt;concatYtTablesRange&lt;/code&gt;). When reading a single table, the index is always zero.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;$table_path String&lt;/code&gt;: The full path to the table in YTsaurus.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;$table_name String&lt;/code&gt;: The table name, i.e. the last literal of the table path.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Input tables can be filtered quite effectively by described virtual columns, since their values are known before reading any data from the tables. This property can be used to read almost any subset of tables from the directory.&lt;/p&gt;\n&lt;p&gt;However, take into account that although the tables themselves will not be read, the &lt;em&gt;table metainformation&lt;/em&gt; (for example, the schema) will still be loaded. Besides that, even if the table does not fall under the condition and will not be read, the user's access permissions to all tables specified in &lt;code&gt;concatYtTables/concatYtTablesRange&lt;/code&gt; will still be checked. Therefore, we recommend specifying restrictions using the arguments of the &lt;code&gt;concatYtTablesRange&lt;/code&gt; function for directories with a large number of tables.&lt;/p&gt;\n&lt;p&gt;Query examples:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; $table_name &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; \"//home/dev/username/t1\";\n&lt;span class=\"hljs-comment\"&gt;-- Result&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;-- #\t$table_name&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;-- 1\t\"t1\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"166\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-166\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-166\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-166.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; \"//home/dev/username/t1\";\n&lt;span class=\"hljs-comment\"&gt;--Result&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;--#\ta\tb\tc&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;--1\t0\t1\t1&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"167\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-167\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-167\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-167.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;, $table_name, $table_path, $table_index\n&lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; concatYtTables(\"//home/dev/username/t0\", \"//home/dev/username/t1\");\n&lt;span class=\"hljs-comment\"&gt;-- Result&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;--#\ta\tb\tc\t$table_name\t$table_path\t$table_index&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;--1\t0\t0\t0\t\"t0\"\t\"//home/dev/username/t0\"\t0&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;--2\t0\t1\t1\t\"t0\"\t\"//home/dev/username/t0\"\t0&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;--3\t0\t1\t1\t\"t1\"\t\"//home/dev/username/t1\"\t1&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"168\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-168\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-168\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-168.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"dynamic\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/yt-tables.html#dynamic\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with dynamic tables&lt;/span&gt;&lt;/a&gt;Working with dynamic tables&lt;/h2&gt;\n&lt;p&gt;You can read &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;dynamic&lt;/a&gt; tables, including dynamic stores (fresh data in memory), from CHYT.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;To make data in dynamic stores visible when reading from CHYT and Map-Reduce, the table must be remounted and the &lt;code&gt;enable_dynamic_store_read = %true&lt;/code&gt; attribute must be set.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;By default, if you try to read a dynamic table without the &lt;code&gt;enable_dynamic_store_read = %true&lt;/code&gt; attribute, the query will end with an error. If you really need data only from chunk stores (with a delay of tens of minutes), then you can set &lt;code&gt;chyt.dynamic_table.enable_dynamic_store_read&lt;/code&gt; to &lt;code&gt;0&lt;/code&gt;, after which CHYT will forcibly start reading only chunk stores (see the &lt;a href=\"user-guide/data-processing/chyt/reference/settings.html\"&gt;query settings&lt;/a&gt; page).&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/chyt/yt-tables.md","sourcePath":"en/user-guide/data-processing/chyt/yt-tables.md"},"headings":[{"title":"Reading multiple tables","href":"en/user-guide/data-processing/chyt/yt-tables.html#many","level":2},{"title":"Saving results","href":"en/user-guide/data-processing/chyt/yt-tables.html#save","level":2},{"title":"Table manipulation queries","href":"en/user-guide/data-processing/chyt/yt-tables.html#ddl","level":2},{"title":"Virtual columns","href":"en/user-guide/data-processing/chyt/yt-tables.html#virtual_columns","level":2},{"title":"Working with dynamic tables","href":"en/user-guide/data-processing/chyt/yt-tables.html#dynamic","level":2}],"title":"Working with YTsaurus tables"},"router":{"pathname":"en/user-guide/data-processing/chyt/yt-tables","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c2
