        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;The entire clique configuration is described by a single &lt;a href=\"user-guide/storage/yson-docs.html\"&gt;YSON document&lt;/a&gt; called a &lt;em&gt;speclet&lt;/em&gt;.&lt;/p&gt;\n&lt;p&gt;The clique speclet is stored in Cypress at &lt;code&gt;//sys/strawberry/chyt/&amp;lt;alias&amp;gt;/speclet&lt;/code&gt;. You can also retrieve it by running the CLI command &lt;code&gt;yt clickhouse ctl get-speclet&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;A speclet is a set of &lt;a href=\"en/user-guide/data-processing/chyt/reference/configuration.html#options\"&gt;options&lt;/a&gt; that are interpreted by the controller at clique startup. In particular, the controller generates the final configuration of CHYT instances based on these options.&lt;/p&gt;\n&lt;p&gt;An important difference between CHYT and original ClickHouse is that the settings are specified not in XML format, but in YSON format that is native for YTsaurus. The principle by which the settings are interpreted in this format is described &lt;a href=\"en/user-guide/data-processing/chyt/reference/configuration.html#clickhouse_config\"&gt;below&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"how-form\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/configuration.html#how-form\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How the configuration is formed&lt;/span&gt;&lt;/a&gt;How the configuration is formed&lt;/h2&gt;\n&lt;p&gt;The following information is used to form a configuration:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The basic config from Cypress: &lt;code&gt;//sys/clickhouse/config&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Options described in the speclet.&lt;/li&gt;\n&lt;li&gt;The native cluster connection configuration taken from the contents of &lt;code&gt;//sys/@cluster_connection&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;All clique instances always work with the same configuration and it is impossible to change the configuration without restarting the clique.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"options\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/configuration.html#options\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Available options&lt;/span&gt;&lt;/a&gt;Available options&lt;/h2&gt;\n&lt;p&gt;Here are the clique options that can be set by the &lt;code&gt;set-option&lt;/code&gt; command (the default values are in square brackets):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;active&lt;/code&gt; [&lt;code&gt;%false&lt;/code&gt;]: If the option is set, the controller will try to run the Vanilla operation assigned to the clique. When the value is &lt;code&gt;%false&lt;/code&gt;, the clique is inactive: it doesn't process queries or use any compute pool resources. Use this option if you want to temporarily disable the clique while preserving its configuration.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;pool&lt;/code&gt;: Name of the compute pool where you want to run the clique's operation. To set this option, the user needs the &lt;code&gt;Use&lt;/code&gt; permission for the specified compute pool. Setting this option is required if you want the clique operation to be run and administered by the controller.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;enable_geodata&lt;/code&gt; [&lt;code&gt;%true&lt;/code&gt;]: Automatically set up the system dictionaries needed for &lt;a href=\"https://clickhouse.com/docs/en/sql-reference/functions/ym-dict-functions/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;certain geo features in ClickHouse&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;restart_on_speclet_change&lt;/code&gt; [&lt;code&gt;%true&lt;/code&gt;]: If this option is set, the clique will automatically restart on any reconfiguration (upon speclet modification). Otherwise, you will need to restart the clique manually to apply its settings.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;query_settings&lt;/code&gt;:A dictionary that stores the default settings for all the queries sent to the clique. For more information about query settings, see the &lt;a href=\"user-guide/data-processing/chyt/reference/settings\"&gt;relevant documentation section&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;yt_config&lt;/code&gt;: A dictionary with the &lt;a href=\"en/user-guide/data-processing/chyt/reference/configuration.html#yt_config\"&gt;YTsaurus configuration for certain&lt;/a&gt; CHYT instances. This part of the configuration will be written to the generated instance configuration as it is. This setting is intended for advanced users. We don't recommend using this option, as this configuration has a pretty sophisticated structure. Use other options, whenever possible, to set changes to the configuration in a more straightforward way.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;clickhouse_config&lt;/code&gt;: A dictionary with the &lt;a href=\"en/user-guide/data-processing/chyt/reference/configuration.html#clickhouse_config\"&gt;ClickHouse configuration for certain&lt;/a&gt; CHYT instances. These settings affect the logic of the ClickHouse computation engine and are identical to the original ClickHouse engine settings. Similar to &lt;code&gt;yt_config&lt;/code&gt;, this option is intended for advanced users. We don't recommend using it.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;instance_count&lt;/code&gt; [1]: The number of clique instances.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;preemption_mode&lt;/code&gt; [&lt;code&gt;normal&lt;/code&gt;]: Preemption mode applied when running a clique's YTsaurus operation. This setting is intended only for advanced users. If you are not sure if you need it, we recommend keeping the default value.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;instance_cpu&lt;/code&gt; [16]: CPU resources to be allocated to each clique's instance. This setting is intended only for advanced users. If you are not sure if you need it, we recommend keeping the default value.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;instance_total_memory&lt;/code&gt; [71940702208 (67 Gib)]: RAM (in bytes) to be allocated to each clique's instance. This setting is intended only for advanced users. If you are not sure if you need it, we recommend keeping the default value.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;enable_sticky_query_distribution&lt;/code&gt; [&lt;code&gt;%false&lt;/code&gt;]: Distribute queries among instances taking into account the hashes of these queries. This increases the efficiency of cache use.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;query_sticky_group_size&lt;/code&gt; [2]: The size of the group of instances selected deterministically by the query hash. A coordinator to execute the query will be uniformly selected among these instances. It is relevant only when &lt;code&gt;enable_sticky_query_distribution=%true&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"yt_config\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/configuration.html#yt_config\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Advanced configuration of the instance's YTsaurus part&lt;/span&gt;&lt;/a&gt;Advanced configuration of the instance's YTsaurus part&lt;/h2&gt;\n&lt;p&gt;The YTsaurus part of the instance configuration resides in the &lt;code&gt;yt_config&lt;/code&gt; option. With this option, you can configure advanced settings that don't exist as individual speclet options. The following sub-options are supported:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;settings&lt;/code&gt;: CHYT-specific default query &lt;a href=\"user-guide/data-processing/chyt/reference/settings.html\"&gt;settings&lt;/a&gt;. Changing the setting in this section changes the default value for this setting for all queries in the clique.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;table_writer&lt;/code&gt;: &lt;a href=\"user-guide/storage/io-configuration.html#table_writer\"&gt;Table Writer configuration&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;table_attribute_cache&lt;/code&gt;: Table attribute cache configuration. This cache significantly improves the responsiveness of CHYT, though at the moment it may lead to non-consistent reads (when data has already appeared in the table, but CHYT does not see it yet). To disable this cache, use the following configuration:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{read_from=follower;expire_after_successful_update_time=0;expire_after_failed_update_time=0;refresh_time=0;expire_after_access_time=0}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"139\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-139\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-139\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-139.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;create_table_default_attributes&lt;/code&gt; [&lt;code&gt;{optimize_for = scan}&lt;/code&gt;]: The default attributes with which tables will be created during &lt;code&gt;CREATE&lt;/code&gt; queries in CHYT.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;health_checker&lt;/code&gt;: The Health Checker configuration. Consists of 3 fields:&lt;/p&gt;\n&lt;p&gt;— &lt;code&gt;queries&lt;/code&gt; [&lt;code&gt;[\"select * from `//sys/clickhouse/sample_table`\"]&lt;/code&gt;]: A list of test queries whose performance will be checked regularly.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Queries from Health Checker are currently executed on behalf of user &lt;code&gt;yt-clickhouse&lt;/code&gt; who must have the &lt;code&gt;read&lt;/code&gt; permissions to access the table.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;— &lt;code&gt;period&lt;/code&gt; [60000]:The test triggering period in milliseconds.&lt;/p&gt;\n&lt;p&gt;— &lt;code&gt;timeout&lt;/code&gt; [&lt;code&gt;0.9 * period / len(queries)&lt;/code&gt;]: The triggering timeout for each of the configured queries. If the query does not fit into the timeout, it is considered &lt;code&gt;failed&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;subquery&lt;/code&gt;: The configuration of the main system part which coordinates the execution of ClickHouse queries on top of YTsaurus tables. Before configuring this part, read the article about &lt;a href=\"user-guide/data-processing/chyt/queries/anatomy.html#query-execution\"&gt;query execution within a clique&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;— &lt;code&gt;min_data_weight_per_thread&lt;/code&gt; [64 MiB]: (in bytes) When splitting the input into subqueries, the coordinator will try to give no less than the given amount to each core of each instance.&lt;/p&gt;\n&lt;p&gt;— &lt;code&gt;max_data_weight_per_subquery&lt;/code&gt; [50 GiB]: (in bytes) The maximum allowable amount of data to be processed on one core of one instance. This restriction is protective and protects clique users from accidentally running a huge query that processes petabytes. The constant of 50 GiB is selected, because such amount is processed on a single core in about dozens of minutes.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;show_tables&lt;/code&gt;: The &lt;code&gt;SHOW TABLES&lt;/code&gt; query behavior configuration. Enables you to configure the list of directories in which &lt;code&gt;SHOW TABLES&lt;/code&gt; will show a list of tables.&lt;/p&gt;\n&lt;p&gt;— &lt;code&gt;roots&lt;/code&gt;: The list of YPath paths of directories in Cypress from which the tables will be collected for &lt;code&gt;SHOW TABLES&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The &lt;code&gt;max_data_weight_per_subquery&lt;/code&gt; limit uses columnar statistics to account for column sampling from processed tables. Columnar statistics may be missing for old tables created before the statistics became available. For such tables, column orientation is not taken account in the limit. This means that when processing a very narrow slice of columns which forms 1% of the total table volume and is 1 GiB per core, CHYT will calculate that 100 GiB per core are processed. CHYT will not run such a query with the default settings.&lt;/p&gt;\n&lt;p&gt;If this scenario is required or you need to process large amounts of data, configure this setting to a random large value.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"clickhouse_config\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/configuration.html#clickhouse_config\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Advanced configuration of the instance's ClickHouse part&lt;/span&gt;&lt;/a&gt;Advanced configuration of the instance's ClickHouse part&lt;/h2&gt;\n&lt;p&gt;The &lt;code&gt;clickhouse_config&lt;/code&gt; option is used to set up the configuration of the ClickHouse part. This option should be set so that it matches the standard ClickHouse XML configuration.&lt;/p&gt;\n&lt;p&gt;The rules for converting a ClickHouse XML configuration into a CHYT YSON configuration can be described as follows:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Any non-multiple configuration node in the ClickHouse configuration is a dict (&lt;code&gt;map&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;A multiple node is represented by a list (&lt;code&gt;list&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Below is an example of converting an artificial XML configuration into a YSON configuration:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs xml\"&gt;&lt;span class=\"hljs-tag\"&gt;&amp;lt;&lt;span class=\"hljs-name\"&gt;foo&lt;/span&gt;&amp;gt;&lt;/span&gt;42&lt;span class=\"hljs-tag\"&gt;&amp;lt;/&lt;span class=\"hljs-name\"&gt;foo&lt;/span&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-tag\"&gt;&amp;lt;&lt;span class=\"hljs-name\"&gt;bar&lt;/span&gt;&amp;gt;&lt;/span&gt;qwe&lt;span class=\"hljs-tag\"&gt;&amp;lt;/&lt;span class=\"hljs-name\"&gt;bar&lt;/span&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-tag\"&gt;&amp;lt;&lt;span class=\"hljs-name\"&gt;baz&lt;/span&gt;&amp;gt;&lt;/span&gt;\n    &lt;span class=\"hljs-tag\"&gt;&amp;lt;&lt;span class=\"hljs-name\"&gt;quux&lt;/span&gt;&amp;gt;&lt;/span&gt;3.14&lt;span class=\"hljs-tag\"&gt;&amp;lt;/&lt;span class=\"hljs-name\"&gt;quux&lt;/span&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-tag\"&gt;&amp;lt;/&lt;span class=\"hljs-name\"&gt;baz&lt;/span&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-tag\"&gt;&amp;lt;&lt;span class=\"hljs-name\"&gt;baz&lt;/span&gt;&amp;gt;&lt;/span&gt;&lt;span class=\"hljs-tag\"&gt;&amp;lt;/&lt;span class=\"hljs-name\"&gt;baz&lt;/span&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-tag\"&gt;&amp;lt;&lt;span class=\"hljs-name\"&gt;baz&lt;/span&gt;&amp;gt;&lt;/span&gt;hi!&lt;span class=\"hljs-tag\"&gt;&amp;lt;/&lt;span class=\"hljs-name\"&gt;baz&lt;/span&gt;&amp;gt;&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"227\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-227\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-227\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-227.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    foo = &lt;span class=\"hljs-number\"&gt;42&lt;/span&gt;;\n    bar = &lt;span class=\"hljs-string\"&gt;\"qwe\"&lt;/span&gt;;\n    baz = &lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;quux = &lt;span class=\"hljs-number\"&gt;3.14&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"hi!\"&lt;/span&gt;;\n    &lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"228\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-228\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-228\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-228.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Let's examine the &lt;code&gt;clickhouse_config&lt;/code&gt; sub-options that may be of use in CHYT:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;dictionaries&lt;/code&gt; (&lt;code&gt;[]&lt;/code&gt;): The configuration of external dicts. The value must be a list of dict configurations. Each dict is configured by the map with the following fields that retain the meaning of the original ClickHouse configuration:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;name&lt;/code&gt;: The name of the external dict.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;source&lt;/code&gt;: The &lt;a href=\"https://clickhouse.com/docs/en/sql-reference/dictionaries/external-dictionaries/external-dicts-dict-sources/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;data source&lt;/a&gt; for the external dict.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;layout&lt;/code&gt;: &lt;a href=\"https://clickhouse.com/docs/en/sql-reference/dictionaries/external-dictionaries/external-dicts-dict-layout/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Representation&lt;/a&gt; of the external dict in the instance memory.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;structure&lt;/code&gt;: The &lt;a href=\"https://clickhouse.com/docs/en/sql-reference/dictionaries/external-dictionaries/external-dicts-dict-structure/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;schema of data&lt;/a&gt; stored in the dict.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;lifetime&lt;/code&gt;: The dict &lt;a href=\"https://clickhouse.com/docs/en/sql-reference/dictionaries/external-dictionaries/external-dicts-dict-lifetime/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;lifetime&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"external-dict\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/configuration.html#external-dict\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;External dicts&lt;/span&gt;&lt;/a&gt;External dicts&lt;/h2&gt;\n&lt;p&gt;CHYT supports all &lt;code&gt;layout&lt;/code&gt;, &lt;code&gt;structure&lt;/code&gt;, and &lt;code&gt;lifetime&lt;/code&gt; settings of regular ClickHouse.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;You can specify sources from original ClickHouse as the &lt;code&gt;source&lt;/code&gt;, but they are not guaranteed to work. In particular, sources that require networking should technically work, but may face a lack of network access in practice.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;There is also an additional data source type in which you can use static tables in YTsaurus. This type is called &lt;code&gt;yt&lt;/code&gt; and has one parameter:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path&lt;/code&gt;: The path to the static table on the cluster which will serve as a data source for the dict.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;As an example of connecting a YTsaurus table as an external ClickHouse dict, you can look at:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The CHYT &lt;a href=\"user-guide/data-processing/chyt/reference/configuration.html#configuration_example\"&gt;configuration example&lt;/a&gt; that connects this table as an external ClickHouse dict.&lt;/li&gt;\n&lt;li&gt;Example of using an external dict in queries:&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;select&lt;/span&gt; dictGet(&lt;span class=\"hljs-string\"&gt;'OS'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'OS'&lt;/span&gt;, toUInt64(&lt;span class=\"hljs-number\"&gt;38&lt;/span&gt;)) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; os_name,\n    dictGetHierarchy(&lt;span class=\"hljs-string\"&gt;'OS'&lt;/span&gt;, toUInt64(&lt;span class=\"hljs-number\"&gt;38&lt;/span&gt;)) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; hierarchy,\n    dictGetChildren(&lt;span class=\"hljs-string\"&gt;'OS'&lt;/span&gt;, toUInt64(&lt;span class=\"hljs-number\"&gt;101&lt;/span&gt;)) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; children\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"307\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-307\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-307\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-307.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"configuration_example\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/configuration.html#configuration_example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Configuration example&lt;/span&gt;&lt;/a&gt;Configuration example&lt;/h2&gt;\n&lt;p&gt;Below is an example of a complete configuration that can be set by the &lt;code&gt;set-speclet&lt;/code&gt; command.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    instance_count = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n    query_settings = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        extremes = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n    yt_config = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        subquery = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n            max_data_weight_per_subquery = &lt;span class=\"hljs-number\"&gt;1000000000000&lt;/span&gt;;\n        &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n    clickhouse_config = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        dictionaries = &lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n            &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n                name = OS;\n                layout = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;flat = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n                structure = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n                    id = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;name = Id&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n                    attribute = &lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n                        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n                            name = &lt;span class=\"hljs-string\"&gt;\"OS\"&lt;/span&gt;;\n                            type = &lt;span class=\"hljs-string\"&gt;\"Nullable(String)\"&lt;/span&gt;;\n                            null_value = &lt;span class=\"hljs-string\"&gt;\"NULL\"&lt;/span&gt;;\n                        &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n                        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n                            name = &lt;span class=\"hljs-string\"&gt;\"ParentId\"&lt;/span&gt;;\n                            type = &lt;span class=\"hljs-string\"&gt;\"Nullable(UInt64)\"&lt;/span&gt;;\n                            null_value = &lt;span class=\"hljs-string\"&gt;\"NULL\"&lt;/span&gt;;\n                            hierarchical = %&lt;span class=\"hljs-literal\"&gt;&lt;span class=\"hljs-keyword\"&gt;true&lt;/span&gt;&lt;/span&gt;;\n                        &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n                        &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n                            name = &lt;span class=\"hljs-string\"&gt;\"RootId\"&lt;/span&gt;;\n                            type = &lt;span class=\"hljs-string\"&gt;\"Nullable(UInt64)\"&lt;/span&gt;;\n                            null_value = &lt;span class=\"hljs-string\"&gt;\"NULL\"&lt;/span&gt;;\n                        &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n                    &lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;;\n                &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n                lifetime = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n                source = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;yt = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;path = &lt;span class=\"hljs-string\"&gt;\"//sys/clickhouse/dictionaries/OS\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n            &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n        &lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"314\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-314\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-314\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-314.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-gui
