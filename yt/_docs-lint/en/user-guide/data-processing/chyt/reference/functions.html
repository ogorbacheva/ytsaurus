        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section describes CHYT-specific functions.&lt;/p&gt;\n&lt;h2 id=\"yson_functions\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/functions.html#yson_functions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Functions for working with YSON&lt;/span&gt;&lt;/a&gt;Functions for working with YSON&lt;/h2&gt;\n&lt;h3 id=\"ypath_simple_types\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/functions.html#ypath_simple_types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YPathType (simple types and arrays)&lt;/span&gt;&lt;/a&gt;YPathType (simple types and arrays)&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;YPath&amp;lt;Type&amp;gt;[Strict](yson, ypath)&lt;/code&gt;: Extracts a &lt;code&gt;Type&lt;/code&gt; type value at &lt;code&gt;ypath&lt;/code&gt; from the string &lt;code&gt;yson&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;Type&lt;/code&gt; can be one of the following: &lt;code&gt;Int64&lt;/code&gt;, &lt;code&gt;UInt64&lt;/code&gt;, &lt;code&gt;Boolean&lt;/code&gt;, &lt;code&gt;Double&lt;/code&gt;, &lt;code&gt;String&lt;/code&gt;, &lt;code&gt;ArrayInt64&lt;/code&gt;, &lt;code&gt;ArrayUInt64&lt;/code&gt;, &lt;code&gt;ArrayBoolean&lt;/code&gt;, or &lt;code&gt;ArrayDouble&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The optional &lt;code&gt;Strict&lt;/code&gt; suffix indicates whether the function is strict.&lt;/p&gt;\n&lt;p&gt;Examples of possible function names: &lt;code&gt;YPathInt64&lt;/code&gt;, &lt;code&gt;YPathStringStrict&lt;/code&gt;, &lt;code&gt;YPathArrayDouble&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;These functions work as follows:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The passed &lt;code&gt;yson&lt;/code&gt; string is interpreted as a YSON document.&lt;/li&gt;\n&lt;li&gt;The document is addressed at &lt;code&gt;ypath&lt;/code&gt; relative to the document root.&lt;/li&gt;\n&lt;li&gt;The contents of the document are then interpreted at &lt;code&gt;ypath&lt;/code&gt;, which points to the &lt;code&gt;Type&lt;/code&gt; type.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Errors may occur at each step of this function operation:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The string may not be a YSON document (this is possible when a string constant is specified as a function argument, but not when reading actual Any columns from YTsaurus).&lt;/li&gt;\n&lt;li&gt;The path may be missing from the document.&lt;/li&gt;\n&lt;li&gt;The path may correspond to a data type other than &lt;code&gt;Type&lt;/code&gt; (for example, a string literal instead of a numeric value).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;The difference between the strict (version with the &lt;code&gt;Strict&lt;/code&gt; suffix) and non-strict function versions lies in how they handle errors: the strict version crashes the query, while the non-strict version returns the default value for the corresponding column type (&lt;code&gt;Null&lt;/code&gt;, &lt;code&gt;0&lt;/code&gt;, empty string, or empty list) and continues operation.&lt;/p&gt;\n&lt;p&gt;Usage examples (the first argument in each of these examples is a string literal containing YSON, but it can be replaced by any Any column of the table):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathInt64(&lt;span class=\"hljs-string\"&gt;'{key1=42; key2=57; key3=29}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'/key2'&lt;/span&gt;);\n&lt;span class=\"hljs-number\"&gt;57&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathInt64(&lt;span class=\"hljs-string\"&gt;'[3;4;5]'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'/1'&lt;/span&gt;);\n&lt;span class=\"hljs-number\"&gt;4&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathString(&lt;span class=\"hljs-string\"&gt;'[\"aa\";\"bb\";\"cc\"]'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'/1'&lt;/span&gt;);\n\"bb\"\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathString(&lt;span class=\"hljs-string\"&gt;'{a=[{c=xyz}; {c=qwe}]}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'/a/1/c'&lt;/span&gt;);\n\"qwe\"\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathInt64(&lt;span class=\"hljs-string\"&gt;'{key=xyz}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'/key'&lt;/span&gt;);\n&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathInt64Strict(&lt;span class=\"hljs-string\"&gt;'{key=xyz}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'/key'&lt;/span&gt;);\nstd::exception. Code: &lt;span class=\"hljs-number\"&gt;1001&lt;/span&gt;, type: NYT::TErrorException, e.what() &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; Node &lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;key2 has invalid type: expected &lt;span class=\"hljs-keyword\"&gt;one&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;of&lt;/span&gt; {\"int64\", \"uint64\"}, actual \"string\"\n    code            &lt;span class=\"hljs-number\"&gt;500&lt;/span&gt;\n    origin          ...\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathString(&lt;span class=\"hljs-string\"&gt;'{key=3u}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'/nonexistentkey'&lt;/span&gt;);\n\"\"\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathArrayInt64(&lt;span class=\"hljs-string\"&gt;'[1;2;3]'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;''&lt;/span&gt;);\n[&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;]\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathUInt64(&lt;span class=\"hljs-string\"&gt;'42u'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;''&lt;/span&gt;);\n&lt;span class=\"hljs-number\"&gt;42&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"67\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-67\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-67\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-67.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Suppose that a table has two &lt;code&gt;Any&lt;/code&gt; columns, &lt;code&gt;lhs&lt;/code&gt; and &lt;code&gt;rhs&lt;/code&gt;, both containing lists of numbers of equal length.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Table 1: Example of a table with &lt;code&gt;Any&lt;/code&gt; columns&lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;lhs&lt;/th&gt;\n&lt;th&gt;rhs&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;[1, 2, 3]&lt;/td&gt;\n&lt;td&gt;[5, 6, 7]&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;[-1, 1]&lt;/td&gt;\n&lt;td&gt;[1, 3]&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;[]&lt;/td&gt;\n&lt;td&gt;[]&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Then we can calculate the scalar product of &lt;code&gt;lhs&lt;/code&gt; and &lt;code&gt;rhs&lt;/code&gt; vectors as follows:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; arraySum((x, y) &lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; x&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;y, YPathArrayInt64(lhs, &lt;span class=\"hljs-string\"&gt;''&lt;/span&gt;), YPathArrayInt64(rhs, &lt;span class=\"hljs-string\"&gt;''&lt;/span&gt;)) &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; \"//path/to/table\"\n&lt;span class=\"hljs-number\"&gt;38&lt;/span&gt;\n&lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;\n&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"115\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-115\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-115\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-115.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"ypath_complex_types\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/functions.html#ypath_complex_types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YPathExtract (composite data type)&lt;/span&gt;&lt;/a&gt;YPathExtract (composite data type)&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;YPathExtract[Strict](yson, ypath, type)&lt;/code&gt;: Extracts a value of an arbitrary &lt;code&gt;type&lt;/code&gt; type value at &lt;code&gt;ypath&lt;/code&gt; from the string &lt;code&gt;yson&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;This function is similar to the &lt;code&gt;YPath&amp;lt;Type&amp;gt;&lt;/code&gt; functions but allows specifying an arbitrary return type using the additional &lt;code&gt;type&lt;/code&gt; argument. It also supports composite, or compound, data types, for which there is no corresponding &lt;code&gt;YPath&amp;lt;Type&amp;gt;&lt;/code&gt; version.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;With the &lt;code&gt;YPathExtract&lt;/code&gt; function, you can also extract simple type values. For example, &lt;code&gt;YPathExtract(yson, ypath, 'Int64')&lt;/code&gt; returns the same result as &lt;code&gt;YPathInt64(yson, ypath)&lt;/code&gt;. However, the &lt;code&gt;YPath&amp;lt;Type&amp;gt;&lt;/code&gt; functions are more specialized and better optimized, so we recommend using the &lt;code&gt;YPathExtract&lt;/code&gt; function only when there is no specialized function for the type you want to extract.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathExtract(&lt;span class=\"hljs-string\"&gt;'[[1;2];[2;3]]'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;''&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'Array(Array(Int64))'&lt;/span&gt;);\n[[&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;], [&lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;]]\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathExtract(&lt;span class=\"hljs-string\"&gt;'{a=1;b=\"abc\"}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;''&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'Tuple(a Int64, b String)'&lt;/span&gt;);\n(\"a\": &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;, \"b\": \"abc\")\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathExtract(&lt;span class=\"hljs-string\"&gt;'{x=[\"abc\";\"bbc\"]}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'/x'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'Array(String)'&lt;/span&gt;)\n[\"abc\", \"bbc\"]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"138\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-138\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-138\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-138.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"ypath_raw\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/functions.html#ypath_raw\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YPathRaw (raw YSON)&lt;/span&gt;&lt;/a&gt;YPathRaw (raw YSON)&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;YPathRaw[Strict](yson, ypath, [format])&lt;/code&gt;: Extracts a raw YSON value at &lt;code&gt;ypath&lt;/code&gt; from the string &lt;code&gt;yson&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;You can use this function when the type of the result is unknown or varies between different rows in the same column.&lt;/p&gt;\n&lt;p&gt;With the optional &lt;code&gt;format&lt;/code&gt; parameter, you can specify the representation format of the returned YSON value. Supported formats are the following: &lt;code&gt;binary&lt;/code&gt; (default), &lt;code&gt;text&lt;/code&gt;, &lt;code&gt;pretty&lt;/code&gt;, &lt;code&gt;unescaped_text&lt;/code&gt;, or &lt;code&gt;unescaped_pretty&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Examples:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathRaw(&lt;span class=\"hljs-string\"&gt;'{x={key=[1]}}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'/x'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'text'&lt;/span&gt;);\n&lt;span class=\"hljs-string\"&gt;'{\"key\"=[1;];}'&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YPathRaw(&lt;span class=\"hljs-string\"&gt;'{a=1}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'/b'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'text'&lt;/span&gt;);\n&lt;span class=\"hljs-keyword\"&gt;NULL&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"154\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-154\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-154\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-154.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"yson_extract\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/functions.html#yson_extract\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YSON family functions*&lt;/span&gt;&lt;/a&gt;YSON family functions*&lt;/h3&gt;\n&lt;p&gt;ClickHouse supports &lt;code&gt;JSON&lt;/code&gt; family functions* for working with JSON format. To ensure a workflow that is more similar to standard ClickHouse, CHYT offers complete equivalents of these functions that are compatible with YSON format.&lt;/p&gt;\n&lt;p&gt;The function arguments and their returned values are described in the &lt;a href=\"https://clickhouse.com/docs/en/sql-reference/functions/json-functions\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ClickHouse documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;The currently supported YSON function equivalents are as follows:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;YSONHas&lt;/code&gt;, &lt;code&gt;YSONLength&lt;/code&gt;, &lt;code&gt;YSONKey&lt;/code&gt;, &lt;code&gt;YSONType&lt;/code&gt;, &lt;code&gt;YSONExtractInt&lt;/code&gt;, &lt;code&gt;YSONExtractUInt&lt;/code&gt;, &lt;code&gt;YSONExtractFloat&lt;/code&gt;, &lt;code&gt;YSONExtractBool&lt;/code&gt;, &lt;code&gt;YSONExtractString&lt;/code&gt;, &lt;code&gt;YSONExtract&lt;/code&gt;, &lt;code&gt;YSONExtractKeysAndValues&lt;/code&gt;, &lt;code&gt;YSONExtractRaw&lt;/code&gt;, &lt;code&gt;YSONExtractArrayRaw&lt;/code&gt;, &lt;code&gt;YSONExtractKeysAndValuesRaw&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Unlike the &lt;code&gt;YPath&lt;/code&gt; functions, in which array elements are indexed from 0, indexing in &lt;code&gt;YSON&lt;/code&gt; functions* is one-based.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;These functions are implemented using shared ClickHouse code and don't have optimal performance. To speed up computations on large amounts of data, we recommend using the more optimal &lt;code&gt;YPath&amp;lt;Type&amp;gt;&lt;/code&gt; functions.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-comment\"&gt;-- Equivalent to YPathString('[\"aa\";\"bb\";\"cc\"]', '/0')&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;-- &lt;span class=\"hljs-doctag\"&gt;Note:&lt;/span&gt; indexing starts from 1&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YSONExtractString(&lt;span class=\"hljs-string\"&gt;'[\"aa\";\"bb\";\"cc\"]'&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;);\n\"aa\"\n\n&lt;span class=\"hljs-comment\"&gt;-- Equivalent to YPathString('{a=[{c=xyz}; {c=qwe}]}', '/a/1/c')&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YSONExtractString(&lt;span class=\"hljs-string\"&gt;'{a=[{c=xyz}; {c=qwe}]}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'a'&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'c'&lt;/span&gt;);\n\"qwe\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"193\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-193\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-193\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-193.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"yson-representation-formats\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/functions.html#yson-representation-formats\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YSON representation formats&lt;/span&gt;&lt;/a&gt;YSON representation formats&lt;/h3&gt;\n&lt;p&gt;Data from &lt;code&gt;Any&lt;/code&gt; type columns can be stored in binary &lt;code&gt;YSON&lt;/code&gt; representation. Since it's not always convenient to read such data, CHYT has the &lt;code&gt;ConvertYSON&lt;/code&gt; function that converts different &lt;code&gt;YSON&lt;/code&gt; representations into each other.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;ConvertYson(yson, format)&lt;/code&gt;: Converts a string with a YSON document to the specified format.&lt;/p&gt;\n&lt;p&gt;In total, there are five possible representation formats:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;binary&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;text&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;pretty&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;unescaped_text&lt;/code&gt;*&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;unescaped_pretty&lt;/code&gt;*&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;* Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;YTsaurus offers three representation formats: &lt;code&gt;binary&lt;/code&gt;, &lt;code&gt;text&lt;/code&gt;, and &lt;code&gt;pretty&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;In &lt;code&gt;text&lt;/code&gt; and &lt;code&gt;pretty&lt;/code&gt; representation formats, string values escape all non-ASCII characters, including Cyrillic letters and various UTF-8–encoded characters. Two additional formats, &lt;code&gt;unescaped_text&lt;/code&gt; and &lt;code&gt;unescaped_pretty&lt;/code&gt;, were added to CHYT to make the resulting YSON containing strings with Cyrillic characters more human-readable. These formats only differ from &lt;code&gt;text&lt;/code&gt; and &lt;code&gt;pretty&lt;/code&gt; in that they only escape special YSON characters in string values. All other string characters are stored without changes.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Examples:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; ConvertYson(&lt;span class=\"hljs-string\"&gt;'{x=1}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'text'&lt;/span&gt;);\n&lt;span class=\"hljs-string\"&gt;'{\"x\"=1;}'&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; ConvertYson(&lt;span class=\"hljs-string\"&gt;'{x=1}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'pretty'&lt;/span&gt;);\n&lt;span class=\"hljs-string\"&gt;'{\n    \"x\" = 1;\n}'&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; ConvertYson(&lt;span class=\"hljs-string\"&gt;'{x=1}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'binary'&lt;/span&gt;);\n&lt;span class=\"hljs-string\"&gt;'{\\u0001\\u0002x=\\u0002\\u0002;}'&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; ConvertYson(&lt;span class=\"hljs-string\"&gt;'{x=\"This example shows escaping the © character\"}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'text'&lt;/span&gt;);\n&lt;span class=\"hljs-string\"&gt;'{\"x\"=\"This example shows escaping the \\xC2\\xA9 character\";}'&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; ConvertYson(&lt;span class=\"hljs-string\"&gt;'{x=\"Here, the © character is not escaped\"}'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'unescaped_text'&lt;/span&gt;);\n&lt;span class=\"hljs-string\"&gt;'{\"x\"=\"Here, the © character is not escaped\";}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"249\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-249\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-249\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-249.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"example-of-working-with-yson\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/functions.html#example-of-working-with-yson\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example of working with YSON&lt;/span&gt;&lt;/a&gt;Example of working with YSON&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; operation_id, task_id, YPathInt64(task_spec, &lt;span class=\"hljs-string\"&gt;'/gpu_limit'&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; gpu_limit, YPathInt64(task_spec, &lt;span class=\"hljs-string\"&gt;'/job_count'&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; job_count &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; (\n    &lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; tupleElement(tasks, &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; task_id, tupleElement(tasks, &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; task_spec, operation_id &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; (\n        &lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; operation_id, tasks &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; (\n            &lt;span class=\"hljs-keyword\"&gt;Select&lt;/span&gt; YSONExtractKeysAndValuesRaw(&lt;span class=\"hljs-built_in\"&gt;COALESCE&lt;/span&gt;(tasks, &lt;span class=\"hljs-string\"&gt;''&lt;/span&gt;)) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; tasks, operation_id &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; (\n                &lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; YSONExtractRaw(spec, &lt;span class=\"hljs-string\"&gt;'tasks'&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; tasks, operation_id\n                &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;home&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;dev&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;chyt_examples&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;completed_ops`\n                &lt;span class=\"hljs-keyword\"&gt;WHERE&lt;/span&gt; YSONHas(spec, &lt;span class=\"hljs-string\"&gt;'tasks'&lt;/span&gt;)\n            )\n        )\n        &lt;span class=\"hljs-keyword\"&gt;ARRAY&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;JOIN&lt;/span&gt; tasks\n    )\n)\n&lt;span class=\"hljs-keyword\"&gt;ORDER&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; gpu_limit &lt;span class=\"hljs-keyword\"&gt;DESC&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"253\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-253\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-253\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-253.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"version_functions\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/functions.html#version_functions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Getting a clique version&lt;/span&gt;&lt;/a&gt;Getting a clique version&lt;/h2&gt;\n&lt;h4 id=\"chyt_version\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/functions.html#chyt_version\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Getting a CHYT version&lt;/span&gt;&lt;/a&gt;Getting a CHYT version&lt;/h4&gt;\n&lt;p&gt;&lt;code&gt;chytVersion()&lt;/code&gt;: Gets a string representation of the CHYT server version.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; chytVersion()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"266\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-266\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-266\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-266.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"yt_version\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/functions.html#yt_version\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Getting a YTsaurus version&lt;/span&gt;&lt;/a&gt;Getting a YTsaurus version&lt;/h4&gt;\n&lt;p&gt;&lt;code&gt;ytVersion()&lt;/code&gt;: Gets a string representation of the YTsaurus code version used in the current CHYT version.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; ytVersion()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"276\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-276\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-276\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-276.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"cypress\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/functions.html#cypress\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Working with Cypress&lt;/span&gt;&lt;/a&gt;Working with Cypress&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;All functions used to work with Cypress are table functions in ClickHouse terms. This means that their returned value can be used in place of a table: for example, in the &lt;code&gt;FROM&lt;/code&gt; section of a &lt;code&gt;SELECT&lt;/code&gt; query.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"list_nodes\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/functions.html#list_nodes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ytListNodes&lt;/span&gt;&lt;/a&gt;ytListNodes&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;ytListNodes[L](dir_path, [from, [to]])&lt;/code&gt;: Gets a list of all nodes and their attributes in the directory at &lt;code&gt;dir_path&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The result contains one row for each node in the directory at &lt;code&gt;dir_path&lt;/code&gt;. Each row contains:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Two predefined columns, &lt;code&gt;$key&lt;/code&gt; and &lt;code&gt;$path&lt;/code&gt;, which hold the node's name and full path (always starts with &lt;code&gt;dir_path&lt;/code&gt;). The values in these columns may differ from the &lt;code&gt;key&lt;/code&gt; and &lt;code&gt;path&lt;/code&gt; attributes if the node is a link (&lt;code&gt;link&lt;/code&gt; type) to another node.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Three columns corresponding to the &lt;code&gt;resource_usage&lt;/code&gt; attribute fields: &lt;code&gt;disk_space&lt;/code&gt;, &lt;code&gt;tablet_count&lt;/code&gt;, and &lt;code&gt;master_memory&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;A large number of columns with names matching the corresponding node attributes: &lt;code&gt;key&lt;/code&gt;, &lt;code&gt;path&lt;/code&gt;, &lt;code&gt;account&lt;/code&gt;, &lt;code&gt;owner&lt;/code&gt;, &lt;code&gt;erasure_codec&lt;/code&gt;, &lt;code&gt;id&lt;/code&gt;, &lt;code&gt;acl&lt;/code&gt;, and other. These columns include almost every system attribute.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Since users don't normally need all the node attributes, most of the columns are virtual in ClickHouse terms. This means that by default they are not returned for &lt;code&gt;SELECT * FROM ytListNodes(...)&lt;/code&gt; and &lt;code&gt;DESCRIBE ytListNodes(...)&lt;/code&gt; expressions but can be requested explicitly:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; id, key_columns, &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytListNodes(...)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"324\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-324\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-324\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-324.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;By default, the &lt;code&gt;ytListNodes&lt;/code&gt; function doesn't expose links (nodes of &lt;code&gt;link&lt;/code&gt; type). This means that for these nodes, the function returns the attributes of the link node itself, not the node it refers to. To change this behavior and expose all links, use the &lt;code&gt;L&lt;/code&gt; function modifier (&lt;code&gt;ytListNodesL&lt;/code&gt;). Keep in mind that links leading to a non-existent node remain unexposed, so the result may still contain &lt;code&gt;link&lt;/code&gt; type strings that correspond to unexposed links.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Exposing each link requires an additional query to the master server, so executing the &lt;code&gt;ytListNodeL&lt;/code&gt; function may take longer and be more resource-intensive than &lt;code&gt;ytListNode&lt;/code&gt;. We strongly discourage using &lt;code&gt;ytListNodeL&lt;/code&gt; for directories with a large number of links.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;With the two optional string arguments &lt;code&gt;from&lt;/code&gt; and &lt;code&gt;to&lt;/code&gt;, you can filter the returned nodes by name (&lt;code&gt;$key&lt;/code&gt; column). Keys are compared lexicographically.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytListNodes(&lt;span class=\"hljs-string\"&gt;'//some/dir/path'&lt;/span&gt;);\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;sum&lt;/span&gt;(disk_space), &lt;span class=\"hljs-built_in\"&gt;sum&lt;/span&gt;(chunk_count) &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytListNodes(&lt;span class=\"hljs-string\"&gt;'//some/dir/path'&lt;/span&gt;);\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytListNodesL(&lt;span class=\"hljs-string\"&gt;'//some/dir/path'&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"346\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-346\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-346\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-346.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"list_tables\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/functions.html#list_tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ytListTables&lt;/span&gt;&lt;/a&gt;ytListTables&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;ytListTables[L](dir_path, [from, [to]])&lt;/code&gt;: Gets a list of all tables and their attributes in the directory.&lt;/p&gt;\n&lt;p&gt;The function arguments and the structure of the returned value are similar to the &lt;code&gt;ytListNodes[L]&lt;/code&gt; function.&lt;/p&gt;\n&lt;p&gt;The function result is equivalent to the output of &lt;code&gt;ytListNodes[L]&lt;/code&gt; with &lt;code&gt;WHERE type = 'table'&lt;/code&gt; filtering applied.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;L&lt;/code&gt; suffix has a similar meaning and exposes all links before filtering. Thus, the result of a &lt;code&gt;ytListTables&lt;/code&gt; call only contains the tables located in the specified directory, whereas the result of &lt;code&gt;ytListTablesL&lt;/code&gt; also contains the tables linked in the specified directory.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; path, chunk_count &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytListTables(&lt;span class=\"hljs-string\"&gt;'//dome/dir/path'&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"362\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-362\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-362\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-362.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"list_log_tables\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/functions.html#list_log_tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ytListLogTables&lt;/span&gt;&lt;/a&gt;ytListLogTables&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;ytListLogTables(project_name_or_path, [from_datetime, [to_datetime]])&lt;/code&gt;: Gets a non-overlapping list of log tables and their attributes from the specified project.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;project_name_or_path&lt;/code&gt; can hold either the name of the project with the logs (if the project is located in the &lt;code&gt;//logs&lt;/code&gt; directory) or the full path to the directory with the logs.&lt;/p&gt;\n&lt;p&gt;The function reads the log tables in four subdirectories (&lt;code&gt;1h&lt;/code&gt;, &lt;code&gt;30m&lt;/code&gt;, &lt;code&gt;1d&lt;/code&gt;, and &lt;code&gt;stream/5m&lt;/code&gt;), then merges the sets with these tables, avoiding any overlaps in the time intervals of the tables.&lt;/p&gt;\n&lt;p&gt;With the two optional arguments &lt;code&gt;from_datetime&lt;/code&gt; and &lt;code&gt;to_datetime&lt;/code&gt;, you can specify the log time interval that you need. Log tables that don't have any overlaps with the specified interval are filtered out.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Filtering by time interval is only performed at the table level. Log tables returned in the function result may cover a longer interval than that specified in the arguments.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytListLogTables(&lt;span class=\"hljs-string\"&gt;'chyt-structured-http-proxy-log'&lt;/span&gt;, today() &lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;);\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytListLogTables(&lt;span class=\"hljs-string\"&gt;'//logs/chyt-structured-http-proxy-log'&lt;/span&gt;, today() &lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;5&lt;/span&gt;, today() &lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;4&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"391\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-391\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-391\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-391.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"node_attributes\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/functions.html#node_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ytNodeAttributes&lt;/span&gt;&lt;/a&gt;ytNodeAttributes&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;ytNodeAttributes(path1, [path2, [...]])&lt;/code&gt;: Gets the attributes of all the nodes specified in the arguments.&lt;/p&gt;\n&lt;p&gt;The returned value contains a single string with attributes for each path specified in the function arguments. If the specified path is invalid or doesn't exist, the function generates an error.&lt;/p&gt;\n&lt;p&gt;The structure of the returned value is similar to the &lt;code&gt;ytListNodes&lt;/code&gt; function.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytNodeAttributes(&lt;span class=\"hljs-string\"&gt;'//sys'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'//sys/clickhouse'&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"407\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-407\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-407\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-407.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"multiple_tables_read\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/functions.html#multiple_tables_read\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reading multiple tables&lt;/span&gt;&lt;/a&gt;Reading multiple tables&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;All functions used to read sets of tables are table functions in ClickHouse terms. This means that their returned value can be used in place of a table: for example, in the &lt;code&gt;FROM&lt;/code&gt; section of a &lt;code&gt;SELECT&lt;/code&gt; query.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"yt_tables\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/functions.html#yt_tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ytTables&lt;/span&gt;&lt;/a&gt;ytTables&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;ytTables(arg1, [arg2, ...])&lt;/code&gt;: Reads the union of a set of tables specified in the arguments.&lt;/p&gt;\n&lt;p&gt;Each argument can be one of the following:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;A string representing the path to a specific table.&lt;/li&gt;\n&lt;li&gt;A &lt;code&gt;ytListNodes[L]&lt;/code&gt;, &lt;code&gt;ytListTables[L]&lt;/code&gt;, or &lt;code&gt;ytListLogTables&lt;/code&gt; function.&lt;/li&gt;\n&lt;li&gt;A subquery returning an arbitrary set of table paths*.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;* Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Passing a subquery that returns multiple paths as a function argument doesn't conform to the ClickHouse syntax. Though you can do this in the current versions of CHYT and ClickHouse, this may be deprecated in the future releases. The proper way to pass these subqueries is by using the &lt;code&gt;view&lt;/code&gt; function.&lt;/p&gt;\n&lt;p&gt;In addition, we're aware of a bug in the ClickHouse optimizer that may incorrectly move an external &lt;code&gt;WHERE&lt;/code&gt; condition inside such a subquery, resulting in the error &lt;code&gt;Missing columns: '&amp;lt;column_name&amp;gt;' while processing query&lt;/code&gt;. You can avoid this error by setting &lt;code&gt;enable_optimize_predicate_expression=0&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;The function returns the union of the set of all tables specified in the arguments. This function works similarly to the ClickHouse's &lt;a href=\"https://clickhouse.com/docs/en/sql-reference/table-functions/merge\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;merge&lt;/a&gt; function but offers a more flexible framework for specifying multiple tables and is optimized for work with YTsaurus tables.&lt;/p&gt;\n&lt;p&gt;If tables in the specified set have different schemas, the output will use a common schema that allows reading all the specified tables.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Algorithm for inferring a common schema&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Compatible types&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;For each column, the algorithm selects the most generic type that all types in the column can be cast to.&lt;/li&gt;\n&lt;li&gt;For example, for &lt;code&gt;optional&amp;lt;int32&amp;gt;&lt;/code&gt; and &lt;code&gt;int64&lt;/code&gt;, the most generic type is &lt;code&gt;optional&amp;lt;i64&amp;gt;&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Please note&lt;/strong&gt; that due to the way data is stored in YTsaurus, unsigned numeric types are incompatible with signed ones (that is, &lt;code&gt;int32&lt;/code&gt; and &lt;code&gt;uint32&lt;/code&gt; are incompatible).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Incompatible types&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;If the column types in different tables are incompatible, CHYT proceeds based on the set &lt;code&gt;chyt.concat_tables.type_mismatch_mode&lt;/code&gt; option value.&lt;/li&gt;\n&lt;li&gt;For example, &lt;code&gt;string&lt;/code&gt; and &lt;code&gt;int64&lt;/code&gt; types are incompatible.&lt;/li&gt;\n&lt;li&gt;Possible option values are &lt;code&gt;drop&lt;/code&gt;, &lt;code&gt;throw&lt;/code&gt;, and &lt;code&gt;read_as_any&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;By default, the function throws a query execution error (&lt;code&gt;throw&lt;/code&gt; value).&lt;/li&gt;\n&lt;li&gt;You can read columns of different types as YSON strings by setting the &lt;code&gt;read_as_any&lt;/code&gt; option value. This may be inefficient, so we recommend that you structure your tables properly.&lt;/li&gt;\n&lt;li&gt;If these columns are not needed for the query's execution, you can discard them by setting the &lt;code&gt;drop&lt;/code&gt; option value.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Missing column&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;If a column is missing in one or multiple input tables, CHYT proceeds based on the set &lt;code&gt;chyt.concat_tables.missing_column_mode&lt;/code&gt; option value.&lt;/li&gt;\n&lt;li&gt;Possible values are &lt;code&gt;drop&lt;/code&gt;, &lt;code&gt;throw&lt;/code&gt;, and &lt;code&gt;read_as_null&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;By default, the column becomes optional, and values for the tables that don't have this column will be read as &lt;code&gt;NULL&lt;/code&gt; (&lt;code&gt;read_as_null&lt;/code&gt; value).&lt;/li&gt;\n&lt;li&gt;If you don't expect missing columns in any of the tables, you can set the &lt;code&gt;throw&lt;/code&gt; option value to generate a query execution error when this happens.&lt;/li&gt;\n&lt;li&gt;As with incompatible types, you can discard these columns by setting the &lt;code&gt;drop&lt;/code&gt; option value.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Please note&lt;/strong&gt; that the &lt;code&gt;missing_column_mode&lt;/code&gt; option only affects the function behavior if a table that is missing a column has a strict schema. If a column is missing in a non-strict schema, it may still exist in the actual data with any type. In this case, the algorithm makes a pessimistic assumption that the column is present with an incompatible type, and its subsequent behavior is determined by the previously described option &lt;code&gt;type_mismatch_mode&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In addition to the main columns read from the tables themselves, the output also always contains the virtual columns &lt;code&gt;$table_index&lt;/code&gt;, &lt;code&gt;$table_name&lt;/code&gt;, and &lt;code&gt;$table_path&lt;/code&gt;. You can use these columns to identify the table that each row was read from. For more information about virtual columns, see the &lt;a href=\"user-guide/data-processing/chyt/yt-tables.html#virtual_columns\"&gt;relevant section&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-comment\"&gt;-- Read the union of 2 tables:&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytTables(&lt;span class=\"hljs-string\"&gt;'//tmp/t1'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'//tmp/t2'&lt;/span&gt;)\n&lt;span class=\"hljs-comment\"&gt;-- Read the union of all tables from the directory '//tmp/dir':&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytTables(ytListTables(&lt;span class=\"hljs-string\"&gt;'//tmp/dir'&lt;/span&gt;))\n&lt;span class=\"hljs-comment\"&gt;-- Read the union of all tables from the directory and their names:&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;, $table_name &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytTables(ytListTables(&lt;span class=\"hljs-string\"&gt;'//tmp/dir'&lt;/span&gt;))\n&lt;span class=\"hljs-comment\"&gt;-- Read the last (lexicographically) table:&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytTables((\n  &lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;max&lt;/span&gt;(path) &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytListTables(&lt;span class=\"hljs-string\"&gt;'/tmp/dir'&lt;/span&gt;)\n))\n&lt;span class=\"hljs-comment\"&gt;-- Read tables with a specific suffix:&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytTables((\n  &lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; concat(path, &lt;span class=\"hljs-string\"&gt;'/suffix'&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; ytListNodes(&lt;span class=\"hljs-string\"&gt;'//tmp/dir'&lt;/span&gt;)\n))\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"576\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-576\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-576\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-576.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"concat_yt_tables\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/functions.html#concat_yt_tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;concatYtTables&lt;/span&gt;&lt;/a&gt;concatYtTables&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;concatYtTables(table1, [table2, [...]])&lt;/code&gt;: Reads the union of multiple YTsaurus tables.&lt;/p&gt;\n&lt;p&gt;This is a deprecated variant of the &lt;code&gt;ytTables&lt;/code&gt; function. Only table paths can be used as arguments.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; concatYtTables(&lt;span class=\"hljs-string\"&gt;'//tmp/sample_table'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'//tmp/sample_table2'&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"589\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-589\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-589\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-589.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"concat_yt_tables_range\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/reference/functions.html#concat_yt_tables_range\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;concatYtTablesRange&lt;/span&gt;&lt;/a&gt;concatYtTablesRange&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;concatYtTablesRange(cypress_path, [from, [to]])&lt;/code&gt;: Reads the union of all tables in the directory at &lt;code&gt;cypress_path&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;This is a deprecated function equivalent to &lt;code&gt;ytTables(ytListTables(cypress_path, from, to))&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; concatYtTablesRange(\"//tmp/sample_tables\");\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; concatYtTablesRange(&lt;span class=\"hljs-string\"&gt;'//tmp/sample_tables'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'2019-01-01'&lt;/span&gt;);\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; concatYtTablesRange(&lt;span class=\"hljs-string\"&gt;'//tmp/sample_tables'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'2019-08-13T11:00:00'&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"602\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-602\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-602\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-602.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/chyt/reference/functions.md","sourcePath":"en/user-guide/data-processing/chyt/reference/functions.md"},"headings":[{"title":"Functions for working with YSON","href":"en/user-guide/data-processing/chyt/reference/functions.html#yson_functions","level":2,"items":[{"title":"YPathType (simple types and arrays)","href":"en/user-guide/data-processing/chyt/reference/functions.html#ypath_simple_types","level":3},{"title":"YPathExtract (composite data type)","href":"en/user-guide/data-processing/chyt/reference/functions.html#ypath_complex_types","level":3},{"title":"YPathRaw (raw YSON)","href":"en/user-guide/data-processing/chyt/reference/functions.html#ypath_raw","level":3},{"title":"YSON family functions*","href":"en/user-guide/data-processing/chyt/reference/functions.html#yson_extract","level":3},{"title":"YSON representation formats","href":"en/user-guide/data-processing/chyt/reference/functions.html#yson-representation-formats","level":3},{"title":"Example of working with YSON","href":"en/user-guide/data-processing/chyt/reference/functions.html#example-of-working-with-yson","level":3}]},{"title":"Getting a clique version","href":"en/user-guide/data-processing/chyt/reference/functions.html#version_functions","level":2},{"title":"Working with Cypress","href":"en/user-guide/data-processing/chyt/reference/functions.html#cypress","level":2,"items":[{"title":"ytListNodes","href":"en/user-guide/data-processing/chyt/reference/functions.html#list_nodes","level":3},{"title":"ytListTables","href":"en/user-guide/data-processing/chyt/reference/functions.html#list_tables","level":3},{"title":"ytListLogTables","href":"en/user-guide/data-processing/chyt/reference/functions.html#list_log_tables","level":3},{"title":"ytNodeAttributes","href":"en/user-guide/data-processing/chyt/reference/functions.html#node_attributes","level":3}]},{"title":"Reading multiple tables","href":"en/user-guide/data-processing/chyt/reference/functions.html#multiple_tables_read","level":2,"items":[{"title":"ytTables","href":"en/user-guide/data-processing/chyt/reference/functions.html#yt_tables","level":3},{"title":"concatYtTables","href":"en/user-guide/data-processing/chyt/reference/functions.html#concat_yt_tables","level":3},{"title":"concatYtTablesRange","href":"en/user-guide/data-processing/chyt/reference/functions.html#concat_yt_tables_range","level":3}]}],"title":"Functions"},"router":{"pathname":"en/user-guide/data-processing/chyt/reference/functions","depth":6,"base":"../../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
