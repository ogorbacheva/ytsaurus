        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This article describes the CHYT query architecture and where you can get the query execution information.&lt;/p&gt;\n&lt;h2 id=\"id\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/queries/anatomy.html#id\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Query IDs: , , and &lt;/span&gt;&lt;/a&gt;Query IDs: &lt;code&gt;trace id&lt;/code&gt;, &lt;code&gt;query id&lt;/code&gt;, and &lt;code&gt;datalens request id&lt;/code&gt;&lt;/h2&gt;\n&lt;p&gt;There are several IDs associated with any query which allow you to restore all the necessary query execution information post factum.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;query id&lt;/code&gt; is the ID assigned to each query in ClickHouse. Unlike original ClickHouse, this ID in CHYT is not controlled by the user and always has the &lt;em&gt;YTsaurus GUID&lt;/em&gt; form — four hexadecimal uint32 separated by hyphens.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;trace id&lt;/code&gt; is the ID that allows you to chain calls in distributed systems, creating a query execution \"trace\". This is a part of the &lt;a href=\"https://opentracing.io/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;opentracing&lt;/a&gt; protocol, specifically its implementation called &lt;a href=\"https://www.jaegertracing.io/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Jaeger Tracing&lt;/a&gt; that is used in YTsaurus. &lt;code&gt;trace id&lt;/code&gt; is also a YTsaurus GUID that in some cases coincides with &lt;code&gt;query id&lt;/code&gt; and in other cases does not as will be detailed below.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"way-to-proxy\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/queries/anatomy.html#way-to-proxy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Query execution journey from the client to heavy proxies&lt;/span&gt;&lt;/a&gt;Query execution journey from the client to heavy proxies&lt;/h2&gt;\n&lt;p&gt;To better understand the logic by which these IDs exist and are assigned, figure out through which components and in which order the query passes to CHYT. Currently, the only public API to access CHYT is the HTTP API, so the following description applies specifically to the HTTP protocol.&lt;/p&gt;\n&lt;p&gt;The first important point in the query execution journey is the so-called &lt;em&gt;heavy YTsaurus proxies&lt;/em&gt;, which all YTsaurus users have network access to. Heavy proxies find out where instances of the clique with a given alias currently reside, then send a query to a randomly selected instance.&lt;/p&gt;\n&lt;p&gt;The three most popular ways to access YTsaurus are shown below.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/chyt_before_clique.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;p&gt;When you access CHYT directly from a script or from the command line using the cURL utility, an SLB balancer (for example, &lt;code&gt;http://$YT_PROXY&lt;/code&gt;) acts as the endpoint. Behind it lies a complex construction of balancers that directs the query to so-called &lt;em&gt;control proxies&lt;/em&gt;, which respond with an HTTP redirect to the heavy proxies servicing all the heavy load in YTsaurus. With this access interface, the &lt;code&gt;query id&lt;/code&gt; matches the &lt;code&gt;trace id&lt;/code&gt;: you can see them in the &lt;code&gt;X-Yt-Trace-Id&lt;/code&gt; and &lt;code&gt;X-ClickHouse-Query-Id&lt;/code&gt; headers.&lt;/p&gt;\n&lt;p&gt;Below is an example of interaction with CHYT using the cURL utility, with the most notable response headers indicated.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In YTsaurus 24.1 and lower, a clique alias is specified with an asterisk at the beginning. For example, &lt;code&gt;*ch_public&lt;/code&gt;. In the current version, &lt;code&gt;*ch_public&lt;/code&gt; and &lt;code&gt;ch_public&lt;/code&gt; are the same alias.&lt;/p&gt;\n&lt;p&gt;When CHYT is accessed using the deprecated &lt;code&gt;/query&lt;/code&gt; path, the alias is passed via the &lt;code&gt;database&lt;/code&gt; url parameter. When CHYT is accessed using the new &lt;code&gt;/chyt&lt;/code&gt; path, the alias is taken from &lt;code&gt;user&lt;/code&gt; or the &lt;code&gt;chyt.clique_alias&lt;/code&gt; URL parameter.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ curl -v --location-trusted &lt;span class=\"hljs-string\"&gt;'http://$YT_PROXY/chyt?chyt.clique_alias=ch_public'&lt;/span&gt; -d &lt;span class=\"hljs-string\"&gt;'select max(a) from \"//sys/clickhouse/sample_table\"'&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth `cat ~/.yt/token`\"&lt;/span&gt;\n*   Trying ip_address:80...\n* Connected to &lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt; (ip_address) port 80 (#0)\n&amp;gt; POST /chyt?chyt.clique_alias=ch_public HTTP/1.1\n&amp;gt; Host: &lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;\n&amp;gt; User-Agent: curl/7.69.1-DEV\n&amp;gt; Accept: */*\n&amp;gt; Authorization: OAuth &amp;lt;i&amp;gt;...&amp;lt;my_token&amp;gt;...&amp;lt;/i&amp;gt;\n&amp;gt; Content-Length: 50\n&amp;gt; Content-Type: application/x-www-form-urlencoded\n&amp;gt;\n* upload completely sent off: 50 out of 50 bytes\n* Mark bundle as not supporting multiuse\n&amp;lt;b&amp;gt; // Getting a redirect to a heavy proxy.&amp;lt;/b&amp;gt;\n&amp;lt; HTTP/1.1 307 Temporary Redirect\n&amp;lt; Content-Length: 0\n&amp;lt; Location: http://sas4-9923-proxy-&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/chyt?chyt.clique_alias=ch_public\n&amp;lt; X-Yt-Trace-Id: 8e9bcc43-5c2be9b4-56f18c4e-117ea314\n&amp;lt;\n* Connection &lt;span class=\"hljs-comment\"&gt;#0 to host $YT_PROXY left intact&lt;/span&gt;\n* Issue another request to this URL: &lt;span class=\"hljs-string\"&gt;'http://sas4-9923-$YT_PROXY/chyt?chyt.clique_alias=ch_public'&lt;/span&gt;\n*   Trying ip_address:80...\n* Connected to sas4-9923-&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt; (ip_address) port 80 (#1)\n&amp;gt; POST /chyt?chyt.clique_alias=ch_public HTTP/1.1\n&amp;gt; Host: sas4-9923-&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;\n&amp;gt; User-Agent: curl/7.69.1-DEV\n&amp;gt; Accept: */*\n&amp;gt; Authorization: OAuth &amp;lt;i&amp;gt;...&amp;lt;my_token&amp;gt;...&amp;lt;/i&amp;gt;\n&amp;gt; Content-Length: 50\n&amp;gt; Content-Type: application/x-www-form-urlencoded\n&amp;gt;\n* upload completely sent off: 50 out of 50 bytes\n* Mark bundle as not supporting multiuse\n&amp;lt; HTTP/1.1 200 OK\n&amp;lt; Transfer-Encoding: chunked\n&amp;lt;b&amp;gt;  // Note: query &lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt; = trace &lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;. &amp;lt;/b&amp;gt;\n&amp;lt; &amp;lt;b&amp;gt;X-ClickHouse-Query-Id:&amp;lt;/b&amp;gt; 3fa9405e-15b29877-524e3e67-2be50e94\n&amp;lt; &amp;lt;b&amp;gt;X-Yt-Trace-Id:&amp;lt;/b&amp;gt; 3fa9405e-15b29877-524e3e67-2be50e94\n&amp;lt;b&amp;gt;  // For technical reasons, X-Yt-Trace-Id will appear twice.&amp;lt;/b&amp;gt;\n&amp;lt; X-Yt-Trace-Id: 3fa9405e-15b29877-524e3e67-2be50e94\n&amp;lt; Keep-Alive: &lt;span class=\"hljs-built_in\"&gt;timeout&lt;/span&gt;=10\n&amp;lt;b&amp;gt;  // Address of the query coordinator instance. &amp;lt;/b&amp;gt;\n&amp;lt; &amp;lt;b&amp;gt;X-ClickHouse-Server-Display-Name:&amp;lt;/b&amp;gt; sas2-1374-node-&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;\n&amp;lt; X-Yt-Request-Id: 3fa9405d-26285349-db14531a-2a12b9f9\n&amp;lt; Date: Sun, 05 Apr 2020 18:49:57 GMT\n&amp;lt; Content-Type: text/tab-separated-values; charset=UTF-8\n&amp;lt; X-ClickHouse-Summary: {&lt;span class=\"hljs-string\"&gt;\"read_rows\"&lt;/span&gt;:&lt;span class=\"hljs-string\"&gt;\"0\"&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;\"read_bytes\"&lt;/span&gt;:&lt;span class=\"hljs-string\"&gt;\"0\"&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;\"written_rows\"&lt;/span&gt;:&lt;span class=\"hljs-string\"&gt;\"0\"&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;\"written_bytes\"&lt;/span&gt;:&lt;span class=\"hljs-string\"&gt;\"0\"&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;\"total_rows_to_read\"&lt;/span&gt;:&lt;span class=\"hljs-string\"&gt;\"0\"&lt;/span&gt;}\n&amp;lt;b&amp;gt;  // Address of the heavy proxy that served the query. &amp;lt;/b&amp;gt;\n&amp;lt; &amp;lt;b&amp;gt;X-Yt-Proxy:&amp;lt;/b&amp;gt; sas4-9923-&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;\n&amp;lt;\n1100\n* Connection &lt;span class=\"hljs-comment\"&gt;#1 to host sas4-9923-$YT_PROXY left intact&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"55\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-55\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-55\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-55.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"query_execution\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/queries/anatomy.html#query_execution\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Executing a query within a clique&lt;/span&gt;&lt;/a&gt;Executing a query within a clique&lt;/h2&gt;\n&lt;p&gt;A heavy proxy &lt;a href=\"user-guide/data-processing/chyt/queries/instance-pick.html\"&gt;selects&lt;/a&gt; one instance from the clique and delegates query execution to it. This instance is called the query \"coordinator\" (or \"initiator\"). If the query doesn't use YTsaurus tables (for example, when querying system tables starting with the &lt;code&gt;system.&lt;/code&gt; prefix, or when it's a primitive query like &lt;code&gt;SELECT 1&lt;/code&gt;), then it's executed on the coordinator normally, just like it would be done in ClickHouse.&lt;/p&gt;\n&lt;p&gt;However, if the query affects YTsaurus tables , then it's always executed in a distributed manner. Let's examine the execution of a simple scan query that supports filtering, projection, and aggregation:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;SELECT someColumns, someFunctions(someColumns) FROM \"//path/to/table\" WHERE somePredicate(someColumns) [GROUP BY someColumns]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;This query splits &lt;code&gt;//path/to/table&lt;/code&gt; into roughly equal sections, with each section being processed independently on one of the clique nodes. Essentially, each instance receives a modified query, where &lt;code&gt;//path/to/table&lt;/code&gt; in the FROM clause is replaced by an expression in the form &lt;code&gt;ytSubquery(...)&lt;/code&gt;, with the description of the next table section encoded in the argument.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/chyt_inside_clique.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;Thus, query execution boils down to executing a number of remote subqueries on the clique's instances. The image above illustrates this mechanism.&lt;/p&gt;\n&lt;p&gt;It's worth noting that there are two kinds of queries:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;QueryKind: InitialQuery&lt;/code&gt;: Initial queries received from clients.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;QueryKind: SecondaryQuery&lt;/code&gt;: Modified remote subqueries that reference specific YTsaurus table sections in the FROM clause.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Each secondary query inherits the &lt;code&gt;trace id&lt;/code&gt; of its parent. And even though each secondary query has its own &lt;code&gt;query id&lt;/code&gt;, they still remember their initial query. In system logs, the parent &lt;code&gt;query id&lt;/code&gt; of the initial query is indicated as &lt;code&gt;InitialQueryId&lt;/code&gt; for secondary queries.&lt;/p&gt;\n&lt;h2 id=\"i/o-and-compression-in-chyt\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/queries/anatomy.html#i/o-and-compression-in-chyt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;I/O and compression in CHYT&lt;/span&gt;&lt;/a&gt;I/O and compression in CHYT&lt;/h2&gt;\n&lt;p&gt;Below is some useful information and recommendations on reading data from YTsaurus. Take these into account when using CHYT.&lt;/p&gt;\n&lt;h3 id=\"network\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/queries/anatomy.html#network\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Network&lt;/span&gt;&lt;/a&gt;Network&lt;/h3&gt;\n&lt;p&gt;Instances of any clique are started on random machines of the cluster, so data reading is likely to be done over the network. You can expect that roughly each successive gigabyte of data that needs to be read will reside on a different machine in the cluster.&lt;/p&gt;\n&lt;p&gt;Note that even though the YTsaurus cluster network rarely becomes a bottleneck, this can happen in rare cases.&lt;/p&gt;\n&lt;h3 id=\"compression\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/queries/anatomy.html#compression\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Compression&lt;/span&gt;&lt;/a&gt;Compression&lt;/h3&gt;\n&lt;p&gt;In YTsaurus, data is typically stored in &lt;strong&gt;compressed&lt;/strong&gt; form. Compression is handled by the &lt;code&gt;/@compression_codec&lt;/code&gt; table attribute, which is also found in the table view web interface. This is further described in a dedicated documentation &lt;a href=\"user-guide/storage/compression.html\"&gt;article&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Instances read data from compressed tables in compressed form. This data is then decompressed just before being processed by the ClickHouse engine. When choosing a compression codec for your data, take into account that the stronger the codec, the more costly it will be to decompress the data.&lt;/p&gt;\n&lt;h3 id=\"uncompressed-block-cache\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/queries/anatomy.html#uncompressed-block-cache\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Uncompressed block cache&lt;/span&gt;&lt;/a&gt;Uncompressed block cache&lt;/h3&gt;\n&lt;p&gt;CHYT has an &lt;strong&gt;uncompressed block cache&lt;/strong&gt;, which is allocated 20 GiB by default. The cache size can be controlled with the &lt;code&gt;--uncompressed-block-cache-size&lt;/code&gt; parameter in the clique start string.&lt;/p&gt;\n&lt;p&gt;This cache stores uncompressed blocks of recently read tables, which significantly speeds up query execution on data recently read by another query, because some of this data may already be ready and available in instance memory. To ensure that this cache is used effectively, make sure that the following conditions are met:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The cache works without issues as long as the number of instances in the clique remains the same. If an instance disappears (for example, due to preemption, a YTsaurus node failure, or a CHYT crash), future subqueries are arbitrarily redistributed across instances, and most of the data blocks cached in instance memory may become useless, increasing the block cache miss value. However, in this case, the very next query will restore the necessary cache data.&lt;/li&gt;\n&lt;li&gt;If table data changes, the table sections are arbitrarily redistributed across subqueries, which similarly leads to block cache misses.&lt;/li&gt;\n&lt;li&gt;Finally, if the amount of processed data per instance is significantly larger than the block cache size (in uncompressed data size terms), then, quite obviously, the cache won't be of much use for any subsequent queries on the same data, because most of it will have to be re-read over the network anyway.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"hdd-vs-ssd\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/queries/anatomy.html#hdd-vs-ssd\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HDD vs SSD&lt;/span&gt;&lt;/a&gt;HDD vs SSD&lt;/h3&gt;\n&lt;p&gt;Even though SSDs offer faster read speeds than HDDs, there is no need to rush to migrate your data to an SSD the moment your queries begin to slow down. It's possible that the bottleneck is actually the CPU, not I/O: for example, the data may already be in the block cache, while you still need to process a few dozens of gigabytes of decompressed data to respond to the query. In this situation, moving your tables from HDD to SSD won't help.&lt;/p&gt;\n&lt;p&gt;If you believe that migrating your data to an SSD will speed up query execution, follow the &lt;a href=\"user-guide/data-processing/chyt/faq-chyt.html#how-to-set-ssd\"&gt;action plan&lt;/a&gt; provided in the FAQ.&lt;/p&gt;\n&lt;h3 id=\"about-columnar-storage\"&gt;&lt;a href=\"en/user-guide/data-processing/chyt/queries/anatomy.html#about-columnar-storage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;About columnar storage&lt;/span&gt;&lt;/a&gt;About columnar storage&lt;/h3&gt;\n&lt;p&gt;In most cases when working with ClickHouse, you want to use the columnar &lt;a href=\"user-guide/storage/chunks.html#optimize_for\"&gt;format&lt;/a&gt; for table storage, which you can implement by setting the &lt;code&gt;/@optimize_for&lt;/code&gt; attribute to &lt;code&gt;scan&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Columnar storage lets you efficiently read individual table columns without having to load the entire table into memory and helps conserve disk space, as YTsaurus will apply different codecs for columnar storage, which will optimize column representation.&lt;/p&gt;\n&lt;p&gt;However, there may be situations requiring the row-oriented format (&lt;code&gt;/@optimize_for = lookup&lt;/code&gt;). The main disadvantage of the columnar format is high memory consumption, especially for tables with a large number of columns, because each column requires its own buffer. In addition, it's worth noting that reading lookup tables is slightly less CPU-intensive.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/chyt/queries/anatomy.md","sourcePath":"en/user-guide/data-processing/chyt/queries/anatomy.md"},"headings":[{"title":"Query IDs: trace id, query id, and datalens request id","href":"en/user-guide/data-processing/chyt/queries/anatomy.html#id","level":2},{"title":"Query execution journey from the client to heavy proxies","href":"en/user-guide/data-processing/chyt/queries/anatomy.html#way-to-proxy","level":2},{"title":"Executing a query within a clique","href":"en/user-guide/data-processing/chyt/queries/anatomy.html#query_execution","level":2},{"title":"I/O and compression in CHYT","href":"en/user-guide/data-processing/chyt/queries/anatomy.html#i/o-and-compression-in-chyt","level":2,"items":[{"title":"Network","href":"en/user-guide/data-processing/chyt/queries/anatomy.html#network","level":3},{"title":"Compression","href":"en/user-guide/data-processing/chyt/queries/anatomy.html#compression","level":3},{"title":"Uncompressed block cache","href":"en/user-guide/data-processing/chyt/queries/anatomy.html#uncompressed-block-cache","level":3},{"title":"HDD vs SSD","href":"en/user-guide/data-processing/chyt/queries/anatomy.html#hdd-vs-ssd","level":3},{"title":"About columnar storage","href":"en/user-guide/data-processing/chyt/queries/anatomy.html#about-columnar-storage","level":3}]}],"title":"Query anatomy before and after the ClickHouse engine"},"router":{"pathname":"en/user-guide/data-processing/chyt/queries/anatomy","depth":6,"base":"../../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
