        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"multi-cluster-reads\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/thesaurus/read-options.html#multi-cluster-reads\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Multi-cluster reads&lt;/span&gt;&lt;/a&gt;Multi-cluster reads&lt;/h2&gt;\n&lt;p&gt;By default, the computation process accesses data on the cluster that provides the computational resources (when running directly or when using a standalone cluster). SPYT runs its own RPC proxies to offload shared cluster proxies.&lt;/p&gt;\n&lt;p&gt;Version 2.2.0 introduced the option to read data from different YTsaurus clusters. To do this, you must explicitly indicate the cluster address in the table path.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;spark.read.yt(&lt;span class=\"hljs-string\"&gt;'&amp;lt;cluster=\"localhost:8000\"&amp;gt;//home/table'&lt;/span&gt;).show() &lt;span class=\"hljs-comment\"&gt;# Table on cluster localhost:8000&lt;/span&gt;\n\nspark.read.yt(&lt;span class=\"hljs-string\"&gt;'//home/table'&lt;/span&gt;).show() &lt;span class=\"hljs-comment\"&gt;# Table on home cluster&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"9\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-9\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-9\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-9.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Data is read from other YTsaurus clusters through shared proxies, which may put a heavy strain on them when the volume of data is high.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"schema_hint\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/thesaurus/read-options.html#schema_hint\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;schema_hint&lt;/span&gt;&lt;/a&gt;schema_hint&lt;/h2&gt;\n&lt;p&gt;Hard-coded &lt;a href=\"user-guide/storage/data-types.html\"&gt;column type&lt;/a&gt;. Useful when a column is of type &lt;code&gt;any&lt;/code&gt; (a composite data type serialized as &lt;code&gt;yson&lt;/code&gt;).&lt;br /&gt;\nThe value will be deserialized as the specified type.&lt;/p&gt;\n&lt;p&gt;Python example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;spark.read.schema_hint({&lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;: MapType(StringType(), LongType())}).yt(&lt;span class=\"hljs-string\"&gt;\"//sys/spark/examples/example_yson\"&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"29\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-29\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-29\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-29.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Scala example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs scala\"&gt;df.write\n    .schemaHint(&lt;span class=\"hljs-type\"&gt;Map&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt; -&amp;gt;\n        &lt;span class=\"hljs-type\"&gt;YtLogicalType&lt;/span&gt;.&lt;span class=\"hljs-type\"&gt;VariantOverTuple&lt;/span&gt;(&lt;span class=\"hljs-type\"&gt;Seq&lt;/span&gt;(\n          (&lt;span class=\"hljs-type\"&gt;YtLogicalType&lt;/span&gt;.&lt;span class=\"hljs-type\"&gt;String&lt;/span&gt;, &lt;span class=\"hljs-type\"&gt;Metadata&lt;/span&gt;.empty), (&lt;span class=\"hljs-type\"&gt;YtLogicalType&lt;/span&gt;.&lt;span class=\"hljs-type\"&gt;Double&lt;/span&gt;, &lt;span class=\"hljs-type\"&gt;Metadata&lt;/span&gt;.empty)))))\n    .yt(tmpPath)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"33\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-33\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-33\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-33.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"transaction\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/thesaurus/read-options.html#transaction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;transaction&lt;/span&gt;&lt;/a&gt;transaction&lt;/h2&gt;\n&lt;p&gt;Reading from a &lt;a href=\"user-guide/storage/transactions.html\"&gt;transaction&lt;/a&gt;. For more details, see &lt;a href=\"user-guide/data-processing/spyt/read-transaction.html\"&gt;Reading and writing within a transaction&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Scala example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs scala\"&gt;&lt;span class=\"hljs-keyword\"&gt;val&lt;/span&gt; transaction = &lt;span class=\"hljs-type\"&gt;YtWrapper&lt;/span&gt;.createTransaction(&lt;span class=\"hljs-type\"&gt;None&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;10&lt;/span&gt; minute)\ndf.write.transaction(transaction.getId.toString).yt(tmpPath)\ntransaction.commit().get(&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;, &lt;span class=\"hljs-type\"&gt;TimeUnit&lt;/span&gt;.&lt;span class=\"hljs-type\"&gt;SECONDS&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"43\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-43\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-43\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-43.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"schema-v3\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/thesaurus/read-options.html#schema-v3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Schema v3&lt;/span&gt;&lt;/a&gt;Schema v3&lt;/h2&gt;\n&lt;p&gt;Read tables with schema in &lt;a href=\"user-guide/storage/data-types.html\"&gt;type_v3&lt;/a&gt; instead of type_v1. It can be enabled in &lt;a href=\"user-guide/data-processing/spyt/cluster/configuration.html\"&gt;Spark configuration&lt;/a&gt; or write option.&lt;/p&gt;\n&lt;p&gt;Python example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;spark.read.option(&lt;span class=\"hljs-string\"&gt;\"parsing_type_v3\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"true\"&lt;/span&gt;).yt(&lt;span class=\"hljs-string\"&gt;\"//sys/spark/examples/example_yson\"&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"53\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-53\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-53\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-53.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/spyt/thesaurus/read-options.md","sourcePath":"en/user-guide/data-processing/spyt/thesaurus/read-options.md"},"headings":[{"title":"Multi-cluster reads","href":"en/user-guide/data-processing/spyt/thesaurus/read-options.html#multi-cluster-reads","level":2},{"title":"schema_hint","href":"en/user-guide/data-processing/spyt/thesaurus/read-options.html#schema_hint","level":2},{"title":"transaction","href":"en/user-guide/data-processing/spyt/thesaurus/read-options.html#transaction","level":2},{"title":"Schema v3","href":"en/user-guide/data-processing/spyt/thesaurus/read-options.html#schema-v3","level":2}],"title":"Read options"},"router":{"pathname":"en/user-guide/data-processing/spyt/thesaurus/read-options","depth":6,"base":"../../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
