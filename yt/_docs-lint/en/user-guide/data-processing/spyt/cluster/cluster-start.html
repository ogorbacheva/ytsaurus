        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section contains expanded instructions for starting a Spark cluster.  Basic start operations are described in the &lt;a href=\"user-guide/data-processing/spyt/launch.html#standalone\"&gt;Quick start&lt;/a&gt; section.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;A started Spark cluster statically occupies the resources allocated to it. So, it is recommended that the cluster be started in a separate computational pool with guaranteed resources. It makes sense to use one cluster for the command, and recycle the resources among several users. It is recommended to use &lt;a href=\"user-guide/data-processing/spyt/launch.html#submit\"&gt;direct submitting&lt;/a&gt; when it is not planned to run Spark tasks at a high intensity (less than one time in an hour).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"auto-scale\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/cluster/cluster-start.html#auto-scale\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Auto-scaler&lt;/span&gt;&lt;/a&gt;Auto-scaler&lt;/h2&gt;\n&lt;p&gt;To save resources of the computational pool if the load is low, a special auto-scaler mode can be turned on in Spark, which proportionally decreases the resources used.&lt;/p&gt;\n&lt;h3 id=\"how-works\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/cluster/cluster-start.html#how-works\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How it works&lt;/span&gt;&lt;/a&gt;How it works&lt;/h3&gt;\n&lt;p&gt;The operation YTsaurus has an &lt;code&gt;update_operation_parameters&lt;/code&gt; method that enables the operation parameters to be changed.  The number of jobs in the operation can be changed via the &lt;code&gt;user_slots&lt;/code&gt; parameter.  When the parameter is changed, the scheduler stops some of the jobs, or launches new ones (within the limit specified at the start of the operation).  Since the scheduler believes that all jobs in the operation are the same, this scaling method, performed in the regular mode in Spark, could lead to loss of the master or the history server, as well as of workers that Spark job drivers are being performed for.  To prevent disruptions to the Spark cluster's operation, it is started not as a single YTsaurus operation, but as several. This way, one operation is allocated to the dynamically changing set of workers, and can scale within the limits configured at the start.  In one or two other operations, a master and history-server (one operation), or a driver (when drivers are launched on the cluster, two operations) are performed.&lt;/p&gt;\n&lt;h3 id=\"start-auto\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/cluster/cluster-start.html#start-auto\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Starting a cluster with an auto-scaler&lt;/span&gt;&lt;/a&gt;Starting a cluster with an auto-scaler&lt;/h3&gt;\n&lt;p&gt;Additional parameters are used for the &lt;code&gt;spark-launch-yt&lt;/code&gt; launch script, or similar parameters of the SPYT client library.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The &lt;code&gt;autoscaler-period &amp;lt;period&amp;gt;&lt;/code&gt; is the frequency of auto-scaler launches, and (potentially) of changes in the operation settings. The period is programmed in &lt;code&gt;&amp;lt;length&amp;gt;&amp;lt;unit of measurement [d|h|min|s|ms|µs|ns]&amp;gt;&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;enable-multi-operation-mode&lt;/code&gt; turns on Spark start mode in multiple YTsaurus operations.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;enable-dedicated-driver-operation-mode&lt;/code&gt; launches workers for drivers in a separate YTsaurus operation.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;driver-num &amp;lt;number of workers&amp;gt;&lt;/code&gt; allocates a certain number of workers for the driver.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;autoscaler-max-free-workers&lt;/code&gt; is the maximum value of free workers (all superfluous workers will be stopped).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;autoscaler-slot-increment-step&lt;/code&gt; is the increment in which the number of workers is increased when the cluster is automatically expanded.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ spark-launch-yt\n--proxy &amp;lt;cluster_name&amp;gt;\n--autoscaler-period 1s\n--enable-multi-operation-mode\n--discovery-path //discovery/path\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"66\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-66\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-66\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-66.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"update-cluster\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/cluster/cluster-start.html#update-cluster\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Updating a cluster&lt;/span&gt;&lt;/a&gt;Updating a cluster&lt;/h2&gt;\n&lt;p&gt;To update a Spark cluster, the following actions must be performed:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Stop the operation with the current cluster in YTsaurus. You can find a link to the operation using &lt;code&gt;spark-discovery-yt&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Start a cluster using &lt;code&gt;spark-launch-yt&lt;/code&gt;. The desired version can be specified in the &lt;code&gt;spark-cluster-version&lt;/code&gt; argument.  If no version is specified, the last version will be started.&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/spyt/cluster/cluster-start.md","sourcePath":"en/user-guide/data-processing/spyt/cluster/cluster-start.md"},"headings":[{"title":"Auto-scaler","href":"en/user-guide/data-processing/spyt/cluster/cluster-start.html#auto-scale","level":2,"items":[{"title":"How it works","href":"en/user-guide/data-processing/spyt/cluster/cluster-start.html#how-works","level":3},{"title":"Starting a cluster with an auto-scaler","href":"en/user-guide/data-processing/spyt/cluster/cluster-start.html#start-auto","level":3}]},{"title":"Updating a cluster","href":"en/user-guide/data-processing/spyt/cluster/cluster-start.html#update-cluster","level":2}],"title":"Starting a Spark cluster"},"router":{"pathname":"en/user-guide/data-processing/spyt/cluster/cluster-start","depth":6,"base":"../../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
