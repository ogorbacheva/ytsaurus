            {"data":{"leading":false,"html":"&lt;p&gt;For a listing of all the options supported by Spark, see the &lt;a href=\"https://spark.apache.org/docs/latest/configuration.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"main\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/cluster/configuration.html#main\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Basic options&lt;/span&gt;&lt;/a&gt;Basic options&lt;/h2&gt;\n&lt;p&gt;Most options are available starting with version 1.23.0 if otherwise is not specified.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Name&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Default value&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.write.batchSize&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;500000&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The amount of data transferred in a single &lt;code&gt;WriteTable&lt;/code&gt; transaction&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.write.miniBatchSize&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;1000&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The amount of data part transmitted to &lt;code&gt;WriteTable&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.write.timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;60 seconds&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The timeout to write a single data block&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.write.typeV3.enabled&lt;/code&gt; (&lt;code&gt;spark.yt.write.writingTypeV3.enabled&lt;/code&gt; before 1.75.2)&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Write tables with schema in &lt;a href=\"user-guide/storage/data-types.html\"&gt;type_v3&lt;/a&gt; instead of &lt;code&gt;type_v1&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.read.vectorized.capacity&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;1000&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The maximum number of rows in a batch for reading via &lt;code&gt;wire&lt;/code&gt; protocol&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.read.arrow.enabled&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Use &lt;code&gt;arrow&lt;/code&gt; format for reading (if possible)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.hadoop.yt.timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;300 seconds&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The timeout to read from YTsaurus&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.read.typeV3.enabled&lt;/code&gt; (&lt;code&gt;spark.yt.read.parsingTypeV3.enabled&lt;/code&gt; before 1.75.2)&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Read tables with schema in &lt;a href=\"user-guide/storage/data-types.html\"&gt;type_v3&lt;/a&gt; instead of &lt;code&gt;type_v1&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.read.keyColumnsFilterPushdown.enabled&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Pushdown Spark query filters to read from YTsaurus&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.read.keyColumnsFilterPushdown.union.enabled&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Merge table ranges into a single continius range when filter pushdown is enabled&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.read.keyColumnsFilterPushdown.ytPathCount.limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;100&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The maximum number of ranges for a table generated by filters&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.transaction.timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;5 minutes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Write operation transaction timeout&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.transaction.pingInterval&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;30 seconds&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ping interval for write operation transaction&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.globalTransaction.enabled&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Use of a &lt;a href=\"user-guide/data-processing/spyt/read-transaction.html\"&gt;global transaction&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.globalTransaction.id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;None&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Id of a global transaction&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.globalTransaction.timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;5 minutes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Global transaction timeout&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.hadoop.yt.user&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Name of YTsaurus user&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.hadoop.yt.timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Token of YTsaurus user&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.read.ytPartitioning.enabled&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Use YTsaurus API for table partitioning&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.read.planOptimization.enabled&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Enable agregation and join optimization rules for sorted data&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.read.keyPartitioningSortedTables.enabled&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Use key table ranges for reading, required for plan optimization&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;spark.yt.read.keyPartitioningSortedTables.unionLimit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;1&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The maximum number of partitions that need to be merged when key table ranges are used&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"agregation-and-join-optimizations\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/cluster/configuration.html#agregation-and-join-optimizations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Agregation and join optimizations&lt;/span&gt;&lt;/a&gt;Agregation and join optimizations&lt;/h2&gt;\n&lt;p&gt;Spark cluster ignores a sort metadata about YTsaurus tables and creates many Shuffle and Sort operations, even if it's not required. For these cases extra optimization rules were added. When a logical plan is being constructing, a rule adds sort mark to source vertexes of sorted tables. Later on generating physical plan stage the marks are transformed to nodes that will not do data processing but it will notify optimizer about sorting and partitioning.&lt;/p&gt;\n&lt;p&gt;Static tables partitioning is performed by index ranges, but the option &lt;code&gt;spark.yt.read.keyPartitioningSortedTables.enabled&lt;/code&gt; enables partitioning by key ranges. When index ranges are being transforming into key ranges the amount of partitions might be reduced. It can lead increased a fraction of data that one executor processes.&lt;/p&gt;\n&lt;h2 id=\"add\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/cluster/configuration.html#add\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Additional options for cluster configuration&lt;/span&gt;&lt;/a&gt;Additional options for cluster configuration&lt;/h2&gt;\n&lt;p&gt;Additional options are passed in via &lt;code&gt;--params&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-launch-yt \\\n  --proxy &amp;lt;cluster-name&amp;gt; \\\n  --discovery-path my_discovery_path \\\n  --params &lt;span class=\"hljs-string\"&gt;'{\"spark_conf\"={\"spark.yt.jarCaching\"=\"True\";};\"layer_paths\"=[\"//.../ubuntu_xenial_app_lastest.tar.gz\";...;];\"operation_spec\"={\"max_failed_job_count\"=100;};}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"283\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-283\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-283\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-283.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"spark-configuration\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/cluster/configuration.html#spark-configuration\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Spark configuration&lt;/span&gt;&lt;/a&gt;Spark configuration&lt;/h3&gt;\n&lt;p&gt;When using &lt;code&gt;spark-launch-yt&lt;/code&gt; to configure a cluster, &lt;code&gt;--params '{\"spark_conf\"={...};}&lt;/code&gt; is available as an option:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-launch-yt \\\n  --proxy &amp;lt;cluster-name&amp;gt; \\\n  --discovery-path my_discovery_path \\\n  --params &lt;span class=\"hljs-string\"&gt;'{\"spark_conf\"={\"spark.sql.shuffle.partitions\":1,\"spark.cores.max\":1,\"spark.executor.cores\"=1};}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"290\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-290\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-290\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-290.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;When using &lt;code&gt;spark-submit-yt&lt;/code&gt; to configure a task, &lt;code&gt;spark_conf_args&lt;/code&gt; is available as an option:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-submit-yt \\\n  --proxy &amp;lt;cluster-name&amp;gt; \\\n  --discovery-path my_discovery_path \\\n  --deploy-mode cluster \\\n  --conf spark.sql.shuffle.partitions=1 \\\n  --conf spark.cores.max=1 \\\n  --conf spark.executor.cores=1 \\\n  yt:///sys/spark/examples/grouping_example.py\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"294\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-294\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-294\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-294.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-submit-yt \\\n  --proxy &amp;lt;cluster-name&amp;gt; \\\n  --discovery-path my_discovery_path \\\n  --deploy-mode cluster \\\n  --spark_conf_args &lt;span class=\"hljs-string\"&gt;'{\"spark.sql.shuffle.partitions\":1,\"spark.cores.max\":1,\"spark.executor.cores\"=1}'&lt;/span&gt; \\\n  yt:///sys/spark/examples/grouping_example.py\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"295\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-295\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-295\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-295.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;When launching programmatically, you can configure via &lt;code&gt;spark_session.conf.set(\"...\", \"...\")&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Python example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; spyt &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; spark_session\n\n&lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"Hello world\"&lt;/span&gt;)\n&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; spark_session() &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; spark:\n    spark.conf.&lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"spark.yt.read.parsingTypeV3.enabled\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"true\"&lt;/span&gt;)\n    spark.read.yt(&lt;span class=\"hljs-string\"&gt;\"//sys/spark/examples/test_data\"&lt;/span&gt;).show()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"302\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-302\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-302\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-302.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Java example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs java\"&gt;&lt;span class=\"hljs-keyword\"&gt;protected&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;doRun&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(String[] args, SparkSession spark, CompoundClient yt)&lt;/span&gt; {\n    spark.conf.set(&lt;span class=\"hljs-string\"&gt;\"spark.sql.adaptive.enabled\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"false\"&lt;/span&gt;);\n    spark.read().format(&lt;span class=\"hljs-string\"&gt;\"yt\"&lt;/span&gt;).load(&lt;span class=\"hljs-string\"&gt;\"/sys/spark/examples/test_data\"&lt;/span&gt;).show();\n}s\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"306\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-306\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-306\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-306.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"operation-options\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/cluster/configuration.html#operation-options\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Operation options&lt;/span&gt;&lt;/a&gt;Operation options&lt;/h3&gt;\n&lt;p&gt;When using &lt;code&gt;spark-launch-yt&lt;/code&gt; to configure a cluster, &lt;code&gt;--params '{\"operation_spec\"={...};}&lt;/code&gt; is available as an option. &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;List of all operations options&lt;/a&gt;.&lt;br /&gt;\nIt will be useful if you need to change the standard operation settings, for example, to increase the number of failed jobs past which the operation is considered failed.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-launch-yt \\\n  --proxy &amp;lt;cluster-name&amp;gt; \\\n  --discovery-path my_discovery_path \\\n  --params &lt;span class=\"hljs-string\"&gt;'{\"operation_spec\"={\"max_failed_job_count\"=100;owners=[...]};}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"313\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-313\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-313\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-313.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"updating-python-version\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/cluster/configuration.html#updating-python-version\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Updating Python version&lt;/span&gt;&lt;/a&gt;Updating Python version&lt;/h3&gt;\n&lt;p&gt;There are two ways to update the Python version:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Install the required Python version:\n&lt;ol&gt;\n&lt;li&gt;Install the required Python version on the exec nodes&lt;/li&gt;\n&lt;li&gt;Add the Python version to &lt;code&gt;//home/spark/conf/global&lt;/code&gt; and the path to the new interpreter.&lt;/li&gt;\n&lt;li&gt;After that, &lt;code&gt;spark-submit-yt&lt;/code&gt; will be able to use it. The &lt;code&gt;--python-version&lt;/code&gt; parameter&lt;/li&gt;\n&lt;/ol&gt;\n&lt;/li&gt;\n&lt;li&gt;Build your own image with the required Python version&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"installing-additional-packages\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/cluster/configuration.html#installing-additional-packages\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Installing additional packages&lt;/span&gt;&lt;/a&gt;Installing additional packages&lt;/h3&gt;\n&lt;p&gt;You need to build an image with the installed packages and use it as a base image to run the task.&lt;/p&gt;\n&lt;h3 id=\"building-an-image-with-installed-packages\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/cluster/configuration.html#building-an-image-with-installed-packages\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Building an image with installed packages&lt;/span&gt;&lt;/a&gt;Building an image with installed packages&lt;/h3&gt;\n&lt;p&gt;Dockerfile example for building a python3.12 image with installed packages:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs docker\"&gt;&lt;span class=\"hljs-comment\"&gt;# Dockerfile&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; mirror.gcr.io/ubuntu:focal\n\n&lt;span class=\"hljs-keyword\"&gt;USER&lt;/span&gt; root\n\n&lt;span class=\"hljs-keyword\"&gt;RUN&lt;/span&gt;&lt;span class=\"language-bash\"&gt; apt-get update &amp;amp;&amp;amp; apt-get install -y software-properties-common&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;RUN&lt;/span&gt;&lt;span class=\"language-bash\"&gt; add-apt-repository ppa:deadsnakes/ppa&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;RUN&lt;/span&gt;&lt;span class=\"language-bash\"&gt; apt-get update &amp;amp;&amp;amp; DEBIAN_FRONTEND=noninteractive TZ=Etc/UTC apt-get install -y \\\n  containerd \\\n  curl \\\n  less \\\n  gdb \\\n  lsof \\\n  strace \\\n  telnet \\\n  tini \\\n  zstd \\\n  unzip \\\n  dnsutils \\\n  iputils-ping \\\n  lsb-release \\\n  openjdk-11-jdk \\\n  libidn11-dev \\\n  python3.12 \\\n  python3-pip \\\n  python3.12-dev \\\n  python3.12-distutils&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;RUN&lt;/span&gt;&lt;span class=\"language-bash\"&gt; &lt;span class=\"hljs-built_in\"&gt;ln&lt;/span&gt; -s /usr/lib/jvm/java-11-openjdk-amd64 /opt/jdk11&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;RUN&lt;/span&gt;&lt;span class=\"language-bash\"&gt; update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.12 1 \\\n    &amp;amp;&amp;amp; update-alternatives --install /usr/bin/python python /usr/bin/python3.12 1&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;COPY&lt;/span&gt;&lt;span class=\"language-bash\"&gt; ./requirements.txt /requirements.txt&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Ensure pip is installed correctly&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;RUN&lt;/span&gt;&lt;span class=\"language-bash\"&gt; curl https://bootstrap.pypa.io/get-pip.py -o get-pip.py \\\n    &amp;amp;&amp;amp; python3.12 get-pip.py \\\n    &amp;amp;&amp;amp; python3.12 -m pip install --upgrade pip setuptools wheel \\\n    &amp;amp;&amp;amp; &lt;span class=\"hljs-built_in\"&gt;rm&lt;/span&gt; get-pip.py&lt;/span&gt;\n\n\n&lt;span class=\"hljs-keyword\"&gt;RUN&lt;/span&gt;&lt;span class=\"language-bash\"&gt; python3.12 -m pip install -r requirements.txt&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"361\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-361\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-361\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-361.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;# requirements.txt\nytsaurus-client==0.13.29\nytsaurus-spyt==2.7.1\npyspark==3.5.6\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"362\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-362\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-362\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-362.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"create-a-cluster-with-a-docker-image\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/cluster/configuration.html#create-a-cluster-with-a-docker-image\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Create a cluster with a docker image&lt;/span&gt;&lt;/a&gt;Create a cluster with a docker image&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-launch-yt \\\n--params &lt;span class=\"hljs-string\"&gt;'{operation_spec={tasks={history={docker_image=\"MY_DOCKER_IMAGE\"};master={docker_image=\"MY_DOCKER_IMAGE\"};workers={docker_image=\"MY_DOCKER_IMAGE\"}}}}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"366\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H
