        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section features a top-level description of the SPYT cluster, its component, and the Spark application framework.&lt;/p&gt;\n&lt;p&gt;Cluster start is described in a separate &lt;a href=\"user-guide/data-processing/spyt/cluster/cluster-start.html\"&gt;section&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"spark-app\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/cluster/cluster-desc.html#spark-app\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Spark app&lt;/span&gt;&lt;/a&gt;Spark app&lt;/h2&gt;\n&lt;p&gt;The Spark app consists of a &lt;em&gt;driver&lt;/em&gt; and &lt;em&gt;executors&lt;/em&gt;.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The driver performs the main code, plans SQL queries, and breaks them up into &lt;em&gt;tasks&lt;/em&gt; that can be performed at the same time.&lt;/li&gt;\n&lt;li&gt;The driver doesn't perform tasks itself, but delegates them to executors.  The driver sends the scheduler a request to create executors.&lt;/li&gt;\n&lt;li&gt;The scheduler identifies containers of the needed size on the cluster nodes, and sends the executors to them.&lt;/li&gt;\n&lt;li&gt;Executors are created in the cluster and exchange messages with the driver over the network.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;img src=\"images/cluster_structure.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;p&gt;When the app is launched, the executors' characteristics (cores and memory) must be specified, as well as the maximum number of executors.&lt;/p&gt;\n&lt;p&gt;By default, executors with 4 cores and 16 GB of memory (4 GB per core) are specified in all SPYT clients.  This setting should fit most tasks.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The executor can perform several tasks simultaneously. Usually, the number of subtasks the executor can perform is equal to the number of cores it has.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"number-cores\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/cluster/cluster-desc.html#number-cores\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Number of cores in the executor&lt;/span&gt;&lt;/a&gt;Number of cores in the executor&lt;/h3&gt;\n&lt;p&gt;Spark cannot change the characteristics of the executor on the fly, but it can work with a smaller number of executors than was initially intended.&lt;br /&gt;\nAn executor is a single process, a single JVM.  If the cluster has no workers with 16 free GB of memory, the executor won't be created even if a smaller amount of memory is available in the cluster.  16 GB of memory must be free all at once.&lt;/p&gt;\n&lt;p&gt;A separate thread that will perform tasks is created for each core of the executor, in its JVM.  This brings with it all the usual downsides of multi-thread models: the more threads, the more expensive the model is.&lt;/p&gt;\n&lt;p&gt;Executors with a single core are not profitable due to the expense of communications between executors, broadcast messages, and singleton objects that executor threads can recycle among themselves.  For example, to make a map-side join, a copy of a small table is attached to each executor.  If you have one executor with four cores, you'll only need to store one copy of the table.  If you have four executors with one core each, you'll need to store four copies of the table, and therefore more memory.&lt;/p&gt;\n&lt;p&gt;A more detailed description is available in the &lt;a href=\"https://spark.apache.org/docs/latest/cluster-overview.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Spark documentation&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"sparkl-standalone\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/cluster/cluster-desc.html#sparkl-standalone\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Spark Standalone in YTsaurus&lt;/span&gt;&lt;/a&gt;Spark Standalone in YTsaurus&lt;/h2&gt;\n&lt;p&gt;To get executors, the driver sends a request to the resource &lt;em&gt;scheduler&lt;/em&gt;.&lt;/p&gt;\n&lt;p&gt;To create containers of the appropriate size, you need to know what cluster nodes exist, and how many resources they have. Usually, container creation is performed by &lt;a href=\"https://hadoop.apache.org/docs/current/hadoop-yarn/hadoop-yarn-site/YARN.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YARN&lt;/a&gt; or &lt;a href=\"https://mesos.apache.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Mesos&lt;/a&gt;, and YTsaurus has its own resource scheduler.&lt;/p&gt;\n&lt;p&gt;There are two methods for launching Spark applications in the current implementation: &lt;a href=\"user-guide/data-processing/spyt/launch.html#submit\"&gt;submitting directly using YTsaurus scheduler&lt;/a&gt; or deploying an inner Spark standalone cluster using Vanilla operation.&lt;/p&gt;\n&lt;p&gt;Spark Standalone consists of a &lt;em&gt;master&lt;/em&gt; and &lt;em&gt;workers&lt;/em&gt;. Each worker knows how many resources can be borrowed on the cluster node where the worker is launched, and how to provide resources on request. The master coordinates the work: it receives requests from the driver and decides what workers to create executors for.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/cluster_scheme.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;p&gt;To request a resource from the master, the driver must know the master host and port.  When the Vanilla operation is launched, the Spark master goes to a random YTsaurus cluster node, and opens a port ranging from 27000 to 27200 there.  Then, the Spark master specifies its host and port in Cypress, in a special &lt;code&gt;discovery-path&lt;/code&gt; directory. There is code in the driver that talks to Cypress, finds out the host and port of the Spark master, and then talks to it.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/cluster_scheme_cyp.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;p&gt;The scheduler's cluster is started with the &lt;code&gt;spark-launch-yt&lt;/code&gt; command.  The command argument must include:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;How many resources (cores/memory) each worker will have.&lt;/li&gt;\n&lt;li&gt;Number of workers.&lt;/li&gt;\n&lt;li&gt;Which Cypress directory to use as the &lt;code&gt;discovery-path&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The difference between an app and a cluster:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The driver and the executors comprise the Spark app.  The Spark app performs the application task of the user: for example, to make a join of two tables and record the result.&lt;/li&gt;\n&lt;li&gt;The master and workers comprise the Spark cluster.  The Spark cluster answers requests from apps to launch new executors.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"cluster-mode\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/cluster/cluster-desc.html#cluster-mode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cluster mode&lt;/span&gt;&lt;/a&gt;Cluster mode&lt;/h2&gt;\n&lt;p&gt;In the schemas of the previous unit, the driver was represented inside of Jupyter. This is one of the options for starting Spark - &lt;em&gt;client mode&lt;/em&gt;. In this option, the driver is performed on the client host (outside of the cluster). Executors, meanwhile, are created in the cluster.&lt;/p&gt;\n&lt;p&gt;There is also another start option, called &lt;em&gt;cluster mode&lt;/em&gt;. In this option, the driver is launched in the cluster along with the executors.  To work in cluster mode, the Spark Standalone master must be commanded to launch the driver from a pre-created and pre-assembled application code.  For this, the &lt;code&gt;spark-submit-yt&lt;/code&gt; utility exists.  The master creates a container for the driver on one of the workers.  The worker downloads the code into the container and launches the driver.  After that, the driver works the same as in &lt;em&gt;client mode&lt;/em&gt;.  The driver requests executors from the master, performs the code, and delegates tasks.&lt;/p&gt;\n&lt;p&gt;By default, workers can download driver code in HTTP, FTP, and other APIs. With SPYT, workers can upload the driver code from YTsaurus.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/cluster_mode.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/spyt/cluster/cluster-desc.md","sourcePath":"en/user-guide/data-processing/spyt/cluster/cluster-desc.md"},"headings":[{"title":"Spark app","href":"en/user-guide/data-processing/spyt/cluster/cluster-desc.html#spark-app","level":2,"items":[{"title":"Number of cores in the executor","href":"en/user-guide/data-processing/spyt/cluster/cluster-desc.html#number-cores","level":3}]},{"title":"Spark Standalone in YTsaurus","href":"en/user-guide/data-processing/spyt/cluster/cluster-desc.html#sparkl-standalone","level":2},{"title":"Cluster mode","href":"en/user-guide/data-processing/spyt/cluster/cluster-desc.html#cluster-mode","level":2}],"title":"SPYT cluster"},"router":{"pathname":"en/user-guide/data-processing/spyt/cluster/cluster-desc","depth":6,"base":"../../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
