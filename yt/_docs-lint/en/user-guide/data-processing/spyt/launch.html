        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"install\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/launch.html#install\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Client install&lt;/span&gt;&lt;/a&gt;Client install&lt;/h2&gt;\n&lt;p&gt;Install the &lt;code&gt;ytsaurus-spyt&lt;/code&gt; package:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ pip install ytsaurus-spyt\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"submit\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/launch.html#submit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Submitting Spark applications directly to YTsaurus (available from SPYT version 1.76.0)&lt;/span&gt;&lt;/a&gt;Submitting Spark applications directly to YTsaurus (available from SPYT version 1.76.0)&lt;/h2&gt;\n&lt;p&gt;This method is applicable when there is no need for continuous cluster operation. It allows to use cluster resources only on demand. This method works a little bit longer comparing to inner Spark standalone cluster due to the need to launch a separate operation for every application, but it allows to release cluster resources immediately after application completes.&lt;/p&gt;\n&lt;p&gt;Direct submitting to YTsaurus is recommended in the following cases:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;One-time calculations.&lt;/li&gt;\n&lt;li&gt;Low periodic tasks (less than once per hour).&lt;/li&gt;\n&lt;li&gt;Ad-hoc analytinc using &lt;code&gt;spark-shell&lt;/code&gt; or &lt;code&gt;pyspark&lt;/code&gt; console utilities (For analytics using &lt;code&gt;Jupyter&lt;/code&gt; it is still needed to use inner standalone cluster).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;To use this method follow these steps:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Activate SPYT configuration with &lt;code&gt;source spyt-env&lt;/code&gt; command.&lt;/li&gt;\n&lt;li&gt;Upload an application executable file and it's dependencies to Cypress.&lt;/li&gt;\n&lt;li&gt;Submit the application with the following command:&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ spark-submit --master ytsaurus://&amp;lt;cluster-name&amp;gt; --deploy-mode cluster --num-executors 5 --queue research yt:/&amp;lt;path to .py file or .jar file&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"53\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-53\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-53\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-53.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Options:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;--master&lt;/code&gt; — cluster proxy address;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--queue&lt;/code&gt; — the name of the scheduler pool where the task should be launched&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The usage of other options corresponds to their description in &lt;code&gt;spark-submit&lt;/code&gt; documentation (the full list is available with &lt;code&gt;spark-submit --help&lt;/code&gt; command). Almost all of the options can be used except these:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;--conf spark.dynamicAllocation.enabled&lt;/code&gt; — dynamic allocation of executors is not yet implemented so setting this option to &lt;code&gt;true&lt;/code&gt; will have ho effect;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--py-files, --files, --archives&lt;/code&gt; — these options are not working with local files. All required files must be uploaded to Cypress before submitting an application.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;In this mode the support for History server is not implemented. For diagnostics you can use YTsaurus logs. Two thigs need to be considered: first, only logs that are written to stderr are available so it is needed to make appropriate configurations in Spark application logging settings. Second, the driver and executors are launched in separate YTsaurus operations so logs need to be viewed in both.&lt;/p&gt;\n&lt;h2 id=\"standalone\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/launch.html#standalone\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Launching inner Spark Standalone cluster&lt;/span&gt;&lt;/a&gt;Launching inner Spark Standalone cluster&lt;/h2&gt;\n&lt;p&gt;This method is applicable for intensive cluster usage. In this mode YTsaurus allocates resources for inner Spark standalone cluster which is used to launch Spark applications. This mode is recommended in the following cases:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Launching high-frequent tasks (more than once per hour). The efficiency is achieved because the task startup time in standalone cluster is significantly less than YTsaurus operation startup time.&lt;/li&gt;\n&lt;li&gt;Ad-hoc analytics in Jupyter notebooks.&lt;/li&gt;\n&lt;li&gt;Ad-hoc analytics using Query tracker and livy.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;For launching an inner standalone Spark cluster follow these steps:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Select an account you will use to start your cluster. You will need to upload any code that regularly runs on Spark to the YTsaurus system. The account used to start the cluster must have enough privilege to read the code.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Create a directory for Spark housekeeping data, such as &lt;code&gt;my_discovery_path&lt;/code&gt;. The account used to start the cluster must have write privileges to the directory. Users that will run Spark jobs must have read access to the directory.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Start your cluster:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ spark-launch-yt \\\n--proxy &amp;lt;cluster-name&amp;gt; \\\n--pool  my_pool \\\n--discovery-path my_discovery_path \\\n--worker-cores 16 \\\n--worker-num 5 \\\n--worker-memory 64G\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"128\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-128\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-128\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-128.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Options:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;spark-launch-yt&lt;/code&gt; — Start the Vanilla YTsaurus transaction from a client host.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--proxy&lt;/code&gt; — Cluster name.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--pool&lt;/code&gt; — YTsaurus computational pool.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--spyt-version&lt;/code&gt; — Spark housekeeping data directory.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--worker-cores&lt;/code&gt; — Number of &lt;a href=\"user-guide/data-processing/spyt/cluster/cluster-desc.html#spark-standalone-в-yt--spark-standalone\"&gt;worker&lt;/a&gt; cores.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--worker-num&lt;/code&gt; — Number of workers.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--worker-memory&lt;/code&gt; — Amount of each worker's memory.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--spark-cluster-version&lt;/code&gt; — Cluster &lt;a href=\"user-guide/data-processing/spyt/version.html\"&gt;version&lt;/a&gt; (optional).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Start a test job on your cluster:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ spark-submit-yt \\\n--proxy &amp;lt;cluster-name&amp;gt; \\\n--discovery-path my_discovery_path \\\n--deploy-mode cluster \\\nyt:///sys/spark/examples/smoke_test.py\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"179\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-179\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-179\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-179.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Options:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;spark-submit-yt&lt;/code&gt; — &lt;a href=\"https://spark.apache.org/docs/latest/submitting-applications.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;spark-submit&lt;/a&gt; wrapper that enables you to find out the Spark master address from the Vanilla transaction. The search uses &lt;code&gt;proxy&lt;/code&gt;, &lt;code&gt;id&lt;/code&gt;, and &lt;code&gt;discovery-path&lt;/code&gt; as arguments.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--proxy&lt;/code&gt; — Cluster name.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--discovery-path&lt;/code&gt; — Spark housekeeping data directory.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--deploy-mode&lt;/code&gt; (&lt;code&gt;cluster&lt;/code&gt; or &lt;code&gt;client&lt;/code&gt;) — Cluster startup &lt;a href=\"user-guide/data-processing/spyt/cluster/cluster-desc.html#cluster-mode--cluster-mode\"&gt;mode&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;--spyt-version&lt;/code&gt; — SPYT version (optional).&lt;/li&gt;\n&lt;li&gt;Address of the file with the code in YTsaurus.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"use\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/launch.html#use\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Use&lt;/span&gt;&lt;/a&gt;Use&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;spark-launch-yt&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ spark-launch-yt \\\n--proxy &amp;lt;cluster-name&amp;gt; \\\n--pool my_pool \\\n--discovery-path my_discovery_path \\\n--worker-cores 16 \\\n--worker-num 5 \\\n--worker-memory 64G \\\n--spark-cluster-version 2.7.1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"225\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-225\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-225\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-225.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;spark-discovery-yt&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Retrieving links to the UI master, transaction, Spark History Server:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ spark-discovery-yt \\\n--proxy &amp;lt;cluster-name&amp;gt; \\\n--discovery-path my_discovery_path\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"234\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-234\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-234\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-234.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;spark-submit-yt&lt;/strong&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ spark-submit-yt \\\n--proxy &amp;lt;cluster-name&amp;gt; \\\n--discovery-path my_discovery_path \\\n--deploy-mode cluster \\\n--spyt-version 2.7.1 \\\nyt:///sys/spark/examples/smoke_test.py\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"240\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-240\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-240\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-240.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;You can set environment variables to use instead of some of the command arguments, such as &lt;code&gt;YT_PROXY&lt;/code&gt; instead of &lt;code&gt;--proxy&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ &lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_PROXY=&amp;lt;cluster-name&amp;gt;\n\n$ spark-submit-yt \\\n--discovery-path my_discovery_path \\\n--deploy-mode cluster \\\nyt:///sys/spark/examples/smoke_test.py\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"249\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-249\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-249\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-249.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"additional-parameters\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/launch.html#additional-parameters\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Additional parameters&lt;/span&gt;&lt;/a&gt;Additional parameters&lt;/h2&gt;\n&lt;p&gt;For additional cluster startup parameters, see &lt;a href=\"user-guide/data-processing/spyt/cluster/cluster-start.html\"&gt;Starting a Spark cluster&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/spyt/launch.md","sourcePath":"en/user-guide/data-processing/spyt/launch.md"},"headings":[{"title":"Client install","href":"en/user-guide/data-processing/spyt/launch.html#install","level":2},{"title":"Submitting Spark applications directly to YTsaurus (available from SPYT version 1.76.0)","href":"en/user-guide/data-processing/spyt/launch.html#submit","level":2},{"title":"Launching inner Spark Standalone cluster","href":"en/user-guide/data-processing/spyt/launch.html#standalone","level":2},{"title":"Use","href":"en/user-guide/data-processing/spyt/launch.html#use","level":2},{"title":"Additional parameters","href":"en/user-guide/data-processing/spyt/launch.html#additional-parameters","level":2}],"title":"Launching Spark tasks in YTsaurus"},"router":{"pathname":"en/user-guide/data-processing/spyt/launch","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
