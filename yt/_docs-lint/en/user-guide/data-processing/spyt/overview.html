        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"what-is-spark\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/overview.html#what-is-spark\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;What is Spark?&lt;/span&gt;&lt;/a&gt;What is Spark?&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"https://spark.apache.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apache Spark&lt;/a&gt; is an engine for computations using big data (joins, groups, filters, ets.).&lt;/p&gt;\n&lt;p&gt;Spark uses RAM to process its data. The key difference between computing in memory and the \"conventional\" 2005 MapReduce model is that the data has minimum disk impact, which minimizes I/O costs as the slowest part of computing. For a single Map transaction, the effect from using Spark will be negligible. However, even a single Map and Reduce sequence saves on writing intermediate results out to disk provided there is enough memory.&lt;/p&gt;\n&lt;p&gt;For each subsequent MapReduce sequence the efficiencies mount, and you can cache the output. For large and complex analytics pipelines, efficiency will increase many fold.&lt;/p&gt;\n&lt;p&gt;Spark is also equipped by a full-scale &lt;a href=\"https://github.com/tupol/spark-catalyst-study/blob/master/docs/catalyst-description.md\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Catalyst&lt;/a&gt; query optimizer that plans execution and takes into consideration:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Input data location and size.&lt;/li&gt;\n&lt;li&gt;Predicate pushdown to the file system.&lt;/li&gt;\n&lt;li&gt;Expediency and step sequence in query execution.&lt;/li&gt;\n&lt;li&gt;Collection of final table attributes.&lt;/li&gt;\n&lt;li&gt;Use of local data for processing.&lt;/li&gt;\n&lt;li&gt;Potential for computation pipelining.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"what-is-spyt\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/overview.html#what-is-spyt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;What is SPYT?&lt;/span&gt;&lt;/a&gt;What is SPYT?&lt;/h2&gt;\n&lt;p&gt;SPYT powered by Apache Spark enables a Spark cluster to be started with YTsaurus computational capacity.  The cluster is started in a &lt;a href=\"en/user-guide/data-processing/operations/vanilla.html\"&gt;YTsaurus Vanilla operation&lt;/a&gt;, then takes a certain amount of resources from the quota and occupies them constantly.  Spark can read &lt;a href=\"en/user-guide/storage/static-tables.html\"&gt;static&lt;/a&gt;, as well as &lt;a href=\"en/user-guide/dynamic-tables/overview.html\"&gt;dynamic YTsaurus tables&lt;/a&gt;, perform computations on them, and record the result in the static table.&lt;/p&gt;\n&lt;h2 id=\"spyt-compatibility\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/overview.html#spyt-compatibility\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Compatibility of SPYT versions with Apache Spark, Java, Scala, and Python&lt;/span&gt;&lt;/a&gt;Compatibility of SPYT versions with Apache Spark, Java, Scala, and Python&lt;/h2&gt;\n&lt;table&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;strong&gt;SPYT version&lt;/strong&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;strong&gt;Spark version&lt;/strong&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;strong&gt;Java&lt;/strong&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;strong&gt;Scala&lt;/strong&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;&lt;strong&gt;Python&lt;/strong&gt;&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;1.x.x, 2.0.x&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;3.2.2&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;11&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;2.12&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;3.8, 3.9, 3.11, 3.12&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;2.1.x, 2.2.x&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;3.2.2 - 3.2.4&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;11&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;2.12&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;3.8, 3.9, 3.11, 3.12&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;2.3.x, 2.4.x&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;3.2.2 - 3.3.4&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;11&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;2.12&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;3.8, 3.9, 3.11, 3.12&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;2.5.0&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;3.2.2 - 3.5.3&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;11&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;2.12&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;3.8, 3.9, 3.11, 3.12&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;\n&lt;p&gt;2.6.x, 2.7.x&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;3.2.2 - 3.5.6&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;11, 17&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;2.12&lt;/p&gt;\n&lt;/td&gt;\n&lt;td&gt;\n&lt;p&gt;3.8, 3.9, 3.11, 3.12&lt;/p&gt;\n&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"what-to-do\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/overview.html#what-to-do\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;When to use SPYT&lt;/span&gt;&lt;/a&gt;When to use SPYT&lt;/h2&gt;\n&lt;p&gt;SPYT is optimal in the following cases:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Developing in Java and using MapReduce in YTsaurus.&lt;/li&gt;\n&lt;li&gt;Optimizing pipeline performance on YTsaurus with two or more joins or groupings.&lt;/li&gt;\n&lt;li&gt;Writing integrational ETL pipelines from other storage systems.&lt;/li&gt;\n&lt;li&gt;Ad-hoc analytics in interactive mode using &lt;code&gt;Jupyter&lt;/code&gt;, &lt;code&gt;pyspark&lt;/code&gt;, &lt;code&gt;spark-shell&lt;/code&gt;, or the &lt;a href=\"user-guide/query-tracker/about.html\"&gt;Query Tracker&lt;/a&gt; component built into the UI.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Do not use SPYT if:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;You need to process over 10 TB of data in a single transaction.&lt;/li&gt;\n&lt;li&gt;Your processing boils down to individual Map or MapReduce operations.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"submit\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/overview.html#submit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ways to run Spark calculations in YTsaurus&lt;/span&gt;&lt;/a&gt;Ways to run Spark calculations in YTsaurus&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Submitting directly to YTsaurus using the &lt;code&gt;spark-submit&lt;/code&gt; command. &lt;a href=\"user-guide/data-processing/spyt/launch.html#submit\"&gt;Learn more&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Creating a Standalone Spark cluster as a persistent resource within YTsaurus using a Vanilla operation. &lt;a href=\"user-guide/data-processing/spyt/launch.html#standalone\"&gt;Learn more&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"lang\"&gt;&lt;a href=\"en/user-guide/data-processing/spyt/overview.html#lang\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Supported programming languages&lt;/span&gt;&lt;/a&gt;Supported programming languages&lt;/h2&gt;\n&lt;p&gt;Spark supports the following languages and development environments:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"user-guide/data-processing/spyt/API/spyt-jupyter.html\"&gt;Jupyter&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/data-processing/spyt/API/spyt-python.html\"&gt;Python&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/data-processing/spyt/API/spyt-java.html\"&gt;Java&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/data-processing/spyt/API/spyt-scala.html\"&gt;Scala&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/spyt/overview.md","sourcePath":"en/user-guide/data-processing/spyt/overview.md"},"headings":[{"title":"What is Spark?","href":"en/user-guide/data-processing/spyt/overview.html#what-is-spark","level":2},{"title":"What is SPYT?","href":"en/user-guide/data-processing/spyt/overview.html#what-is-spyt","level":2},{"title":"Compatibility of SPYT versions with Apache Spark, Java, Scala, and Python","href":"en/user-guide/data-processing/spyt/overview.html#spyt-compatibility","level":2},{"title":"When to use SPYT","href":"en/user-guide/data-processing/spyt/overview.html#what-to-do","level":2},{"title":"Ways to run Spark calculations in YTsaurus","href":"en/user-guide/data-processing/spyt/overview.html#submit","level":2},{"title":"Supported programming languages","href":"en/user-guide/data-processing/spyt/overview.html#lang","level":2}],"title":"Overview"},"router":{"pathname":"en/user-guide/data-processing/spyt/overview","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
