        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;A root file system image contains a stand-alone OS distribution together with essential apps and libraries for running user commands in an isolated container.&lt;/p&gt;\n&lt;p&gt;Depending on the cluster configuration (&lt;code&gt;exec_node/slot_manager/job_environment/type&lt;/code&gt; in the exec node configuration file), the execution environment can support different image formats and sources:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;simple&lt;/strong&gt;: Doesn't support isolation.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;cri&lt;/strong&gt;: Docker image.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;porto&lt;/strong&gt;: Porto layers, Docker image from the Internal Docker Registry.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"docker_images\"&gt;&lt;a href=\"en/user-guide/data-processing/layers/layer-paths.html#docker_images\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Docker images&lt;/span&gt;&lt;/a&gt;Docker images&lt;/h2&gt;\n&lt;h3 id=\"terminology\"&gt;&lt;a href=\"en/user-guide/data-processing/layers/layer-paths.html#terminology\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Terminology&lt;/span&gt;&lt;/a&gt;Terminology&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Docker layer&lt;/strong&gt;: a fragment of data from a root file system image.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Docker image&lt;/strong&gt;: an image of a root file system consisting of metadata and an ordered set of layers.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Docker registry&lt;/strong&gt;: a server for storing and distributing Docker image data and metadata.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Internal Docker Registry&lt;/strong&gt;: a Docker registry that stores images directly in &lt;a href=\"user-guide/storage/cypress.html\"&gt;Cypress&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Docker images are referenced by name in the following format: &lt;code&gt;[REGISTRY/]IMAGE[:TAG|@DIGEST]&lt;/code&gt;, where &lt;code&gt;REGISTRY&lt;/code&gt; represents the &lt;code&gt;FQDN[:PORT]&lt;/code&gt; of the Docker registry server. Registry &lt;code&gt;FQDN&lt;/code&gt; must has at least one \".\" or &lt;code&gt;PORT&lt;/code&gt;. By default, &lt;code&gt;TAG&lt;/code&gt; is set to &lt;strong&gt;latest&lt;/strong&gt;. &lt;a href=\"https://docs.docker.com/engine/reference/commandline/pull/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;More&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;Docker images without a specified &lt;code&gt;REGISTRY&lt;/code&gt; are assumed to be from the &lt;strong&gt;Internal Docker Registry&lt;/strong&gt;, where &lt;code&gt;IMAGE&lt;/code&gt; corresponds to the &lt;code&gt;//IMAGE&lt;/code&gt; path pointing to the directory with the image metadata in Cypress.&lt;/p&gt;\n&lt;p&gt;The Internal Docker Registry can be accessed via the standard Docker registry protocol for uploading images using Docker or Docker-compatible tools. It doesn't support referring to Docker images with a &lt;code&gt;DIGEST&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;To use docker images from &lt;a href=\"https://hub.docker.com\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docker Hub&lt;/a&gt;, provide their full name in the following format: &lt;code&gt;docker.io/[library/]IMAGE[:TAG|@DIGEST]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;To run jobs using Docker images from an external Docker registry, the cluster's exec nodes require network access to said registry. The Internal Docker Registry is accessed from within the cluster.&lt;/p&gt;\n&lt;p&gt;When running a job, each exec node downloads the image to its local cache. Because of this, large clusters can generate a significant load on the Docker registry.&lt;/p&gt;\n&lt;h3 id=\"docker_auth\"&gt;&lt;a href=\"en/user-guide/data-processing/layers/layer-paths.html#docker_auth\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Authorization&lt;/span&gt;&lt;/a&gt;Authorization&lt;/h3&gt;\n&lt;p&gt;To specify the secret to access a private Docker registry, use the &lt;code&gt;docker_auth&lt;/code&gt; key in the &lt;code&gt;secure_vault&lt;/code&gt; option:&lt;br /&gt;\n&lt;code&gt;secure_vault = { docker_auth = { username = \"...\"; password = \"...\"; auth = \"...\"; }; }&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"porto_layers\"&gt;&lt;a href=\"en/user-guide/data-processing/layers/layer-paths.html#porto_layers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Porto layers&lt;/span&gt;&lt;/a&gt;Porto layers&lt;/h2&gt;\n&lt;p&gt;This section contains information about Porto layers.&lt;/p&gt;\n&lt;h3 id=\"terminology1\"&gt;&lt;a href=\"en/user-guide/data-processing/layers/layer-paths.html#terminology1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Terminology&lt;/span&gt;&lt;/a&gt;Terminology&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Porto layer&lt;/strong&gt;: a fragment of a root file system image for &lt;a href=\"https://github.com/ten-nancy/porto\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Porto&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;RootFS image&lt;/strong&gt;: a root file system image.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Basic layer&lt;/strong&gt; &lt;strong&gt;(basic image)&lt;/strong&gt;: an autonomous layer that contains the core components of the environment (/bin/bash, libc6, etc.). By selecting a basic layer, you're confirming the Ubuntu version (Precise, Trusty, Xenial, Bionic, etc.) for running your code.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Delta layer&lt;/strong&gt;: a layer that supplements the basic layer and usually contains additional libraries or binary artifacts.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h1 id=\"job_rootfs\"&gt;Using file system images to run operations in YTsaurus&lt;/h1&gt;\n&lt;p&gt;A MapReduce operation must be run with the file system image specified if its execution requires libraries or resources that aren't available in YTsaurus clusters and if there is no way to prepare a binary file with this operation.&lt;/p&gt;\n&lt;p&gt;To specify a Docker image, use the &lt;code&gt;docker_image = \"[REGISTRY/]IMAGE:TAG\"&lt;/code&gt; parameter in the operation specifications.&lt;/p&gt;\n&lt;p&gt;To use Porto layers, go to the mapper or reducer section in the operation specifications and specify the following: &lt;code&gt;layer_paths = [\"//path/to/upper_layer\"; ... ; \"//path/to/lower_layer\"]&lt;/code&gt;. Layers are listed from top to bottom.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/layers/layer-paths.md","sourcePath":"en/user-guide/data-processing/layers/layer-paths.md"},"headings":[{"title":"Docker images","href":"en/user-guide/data-processing/layers/layer-paths.html#docker_images","level":2,"items":[{"title":"Terminology","href":"en/user-guide/data-processing/layers/layer-paths.html#terminology","level":3},{"title":"Authorization","href":"en/user-guide/data-processing/layers/layer-paths.html#docker_auth","level":3}]},{"title":"Porto layers","href":"en/user-guide/data-processing/layers/layer-paths.html#porto_layers","level":2,"items":[{"title":"Terminology","href":"en/user-guide/data-processing/layers/layer-paths.html#terminology1","level":3}]}],"title":"Root file system images"},"router":{"pathname":"en/user-guide/data-processing/layers/layer-paths","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
