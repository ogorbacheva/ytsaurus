        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;The Map operation may consist of one or more jobs. Each job receives part of the input table data that is processed by the user script. The result is written to the output table.&lt;/p&gt;\n&lt;p&gt;The Map operation has two modes: &lt;strong&gt;unordered&lt;/strong&gt; (default) and &lt;strong&gt;ordered&lt;/strong&gt;. The ordered Map mode is enabled through the &lt;code&gt;ordered=%true&lt;/code&gt; option in the operation's specification. The mode affects the guarantees that the system provides for jobs' input data. Each of the two modes delivers the basic guarantee of the Map operation: each output table is produced by merging the results of all the successfully completed jobs, with each input data row ending up at the input of precisely one successful job.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;In the unordered Map mode, there are &lt;strong&gt;no&lt;/strong&gt; guarantees beyond those described above. In particular:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The rows of one input table can end up with random jobs without any continuity (one mapper may get the first and third rows of the table, while another would get the second and fourth).&lt;/li&gt;\n&lt;li&gt;The rows of an input table can be fed to a job in any order, not necessarily based on ascending row numbers.&lt;/li&gt;\n&lt;li&gt;The rows of different input tables can be fed to the same job randomly, including in mixed fashion (first may come a table A row, then a table B row, followed again by a table A row).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;How Ordered Map works:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;It concatenates the input data according to how it's entered in the input_table_paths section of the input data.&lt;/li&gt;\n&lt;li&gt;The resulting aggregate input is divided into continuous segments, each of which is fed to a separate job.&lt;/li&gt;\n&lt;li&gt;If there are several input tables, some jobs &lt;strong&gt;can&lt;/strong&gt; receive rows from several tables for input (the process has to land in between two tables as a result of the above mentioned concatenation).&lt;/li&gt;\n&lt;li&gt;Each job reads its data segment strictly in order within the concatenation described above: first in the order of the tables, and within the tables — based on ascending row numbers.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Both modes have trade-offs: ordered Map mode offers more guarantees that can be used in certain cases, but is less efficient due to having more restrictions. Unordered Map mode makes active use of its ability to adaptively read input data with a high degree of parallelism from different chunks, compensating for the slowdown of individual disks with input data, so it is generally more efficient. Unordered Map mode can regroup rows in a pool of yet unprocessed input data in whichever order. For example, the input of an unsuccessful job (aborted or failed) can be regrouped in an arbitrary fashion and processed within several new jobs.&lt;/p&gt;\n&lt;p&gt;Note that the &lt;code&gt;ordered=%true&lt;/code&gt; option determines the way input tables are split into jobs, but &lt;strong&gt;does not&lt;/strong&gt; result in any additional sorting of the data therein other than the initial one.&lt;/p&gt;\n&lt;p&gt;The order of output data is determined both by the operation mode and by the presence of a sorted schema on the output table (or of the &lt;code&gt;sorted_by&lt;/code&gt; attribute on its path in the operation's specification).&lt;/p&gt;\n&lt;p&gt;Possible scenarios:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;If the output table is sorted, the following takes place:\n&lt;ul&gt;\n&lt;li&gt;The output data of each job is checked for being sorted based on the output table schema (or the one specified for the output table path). If the job produces an unsorted row sequence, the operation ends with an error.&lt;/li&gt;\n&lt;li&gt;If all the output chunks are sorted, then at the end of the operation they aim to arrange in accordance with the sort order in the output table. If two chunks happen to overlap on bordering keys and no matter their arrangement the rows do not form a sorted sequence, the operation ends with an error. Chunks consisting of one key are ordered in an arbitrary, non-deterministic fashion.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;If the output table is not sorted and the operation mode is unordered, the output chunks are ordered in an arbitrary, non-deterministic manner.&lt;/li&gt;\n&lt;li&gt;If the output table is not sorted and the operation mode is ordered, the output chunks are ordered in accordance with the global job order described above.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The ordered version of the Map operation is characterized by the determinism of output table rows and their order, provided that the mappers' logic is deterministic, regardless of the number of jobs in the operation and the order of their execution. This characteristic is not there for unordered Map.&lt;/p&gt;\n&lt;p&gt;General parameters for all operation types are described in &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Operation options&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;The Map operation supports the following additional options (the default values, if set, are specified in brackets):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;mapper&lt;/code&gt; — user script.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;input_table_paths&lt;/code&gt; — list of input tables with full paths (cannot be empty).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;output_table_paths&lt;/code&gt; — list of output tables.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;job_count&lt;/code&gt;, &lt;code&gt;data_size_per_job&lt;/code&gt; (256 MB) — options specifying how many jobs should be started (these are recommendations). The &lt;code&gt;job_count&lt;/code&gt; option takes precedence over &lt;code&gt;data_size_per_job&lt;/code&gt;. If &lt;code&gt;job_count&lt;/code&gt; is less than or equal to &lt;code&gt;total_input_row_count&lt;/code&gt;, the number of jobs is guaranteed to be met exactly, so long as it does not conflict with the limit on the maximum number of jobs for the operation. Specifically, if &lt;code&gt;job_count&lt;/code&gt; is equal to &lt;code&gt;total_input_row_count&lt;/code&gt;, then each job gets exactly one row, and if &lt;code&gt;job_count&lt;/code&gt; equals 1, only one job is launched.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ordered&lt;/code&gt; — controls the way input is split into jobs.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;auto_merge&lt;/code&gt; — dictionary containing the settings for automatic merge of small-sized output chunks. By default, automatic merge is disabled.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"example-specification\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/map.html#example-specification\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example specification&lt;/span&gt;&lt;/a&gt;Example specification&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;{\n  &lt;span class=\"hljs-string\"&gt;pool&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"my_cool_pool\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;job_count&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;100&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;input_table_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/input_table\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;output_table_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/output_table\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;mapper&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; {\n    &lt;span class=\"hljs-string\"&gt;command&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"cat\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;memory_limit&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1000000&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"142\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-142\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-142\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-142.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/operations/map.md","sourcePath":"en/user-guide/data-processing/operations/map.md"},"headings":[{"title":"Example specification","href":"en/user-guide/data-processing/operations/map.html#example-specification","level":2}],"title":"Map"
