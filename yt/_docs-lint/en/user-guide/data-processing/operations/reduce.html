            {"data":{"leading":false,"html":"&lt;p&gt;The Reduce operation may consist of one or more jobs. Each job receives part of the input table data processed by the user script, and the result is written to the output table. The input data is grouped according to the set of columns indicated in the &lt;code&gt;reduce_by&lt;/code&gt; option. This grouping guarantees that all data with the same value in the &lt;code&gt;reduce_by&lt;/code&gt; columns is input to the same job. The guarantee can be eased using the &lt;code&gt;enable_key_guarantee&lt;/code&gt; option. For the operation to start, each input table must be sorted according to a column set beginning with &lt;code&gt;reduce_by&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;General parameters for all operation types are described in &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Operation options&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;The Reduce operation supports the following parameters (default values, if set, are specified in brackets):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;reducer&lt;/code&gt; — user script.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;input_table_paths&lt;/code&gt; — list of input tables with full paths (cannot be empty).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;output_table_paths&lt;/code&gt; — list of output tables.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;reduce_by&lt;/code&gt; — set of columns used for grouping.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;sort_by&lt;/code&gt; (defaults to &lt;code&gt;reduce_by&lt;/code&gt;) — set of columns used for sorting primary input tables. The option enables an additional check for whether input tables are sorted and provides guarantees the rows are going to be sorted according to the column set within the user script. The &lt;code&gt;reduce_by&lt;/code&gt; field sequence should be set as the prefix of the &lt;code&gt;sort_by&lt;/code&gt; field sequence.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;job_count&lt;/code&gt;, &lt;code&gt;data_size_per_job&lt;/code&gt; (256 MB) — options specifying how many jobs should be started (these are recommendations). The &lt;code&gt;job_count&lt;/code&gt; option takes precedence over &lt;code&gt;data_size_per_job&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;pivot_keys&lt;/code&gt; — enables manual data partitioning, so you can determine which jobs get certain data ranges. As its value, this option takes a sorted list of table keys (bordering ones).&lt;br /&gt;\nFor example, if &lt;code&gt;pivot_keys = [[\"a\", 3], [\"c\", -1], [\"x\", 42]]&lt;/code&gt;, then four jobs (and no more) start:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;for keys strictly up to &lt;code&gt;[\"a\", 3]&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;for keys from &lt;code&gt;[\"a\", 3]&lt;/code&gt; (inclusive) to &lt;code&gt;[\"c\", -1]&lt;/code&gt; (non-inclusive).&lt;/li&gt;\n&lt;li&gt;for keys from &lt;code&gt;[\"c\", -1]&lt;/code&gt; (inclusive) to&lt;code&gt;[\"x\", 42]&lt;/code&gt; (non-inclusive).&lt;/li&gt;\n&lt;li&gt;for keys from &lt;code&gt;[\"x\", 42]&lt;/code&gt; until the end.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The scheduler will not try to split such jobs into smaller ones. If some of the ranges do not contain keys, then the corresponding jobs may not launch. It is impossible to guarantee which jobs do not run, because the scheduler does not see the data in full, only samples from it.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;enable_key_guarantee&lt;/code&gt; — enables/disables the guarantee that all records with one key are given as input to one job (&lt;code&gt;true&lt;/code&gt; by default). &lt;a href=\"user-guide/data-processing/operations/reduce.html#foreign_tables\"&gt;Reduce with foreign tables&lt;/a&gt; describes a special scenario for using this option.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;auto_merge&lt;/code&gt; — dictionary containing the settings for automatic merge of small-sized output chunks. By default, automatic merge is disabled.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The order of inputs in the Reduce operation is associated with the following guarantees:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;data from each input table is divided into continuous parts that are fed to jobs based on &lt;code&gt;reduce_by&lt;/code&gt; columns. In other words, one job cannot get keys &lt;code&gt;A&lt;/code&gt; and &lt;code&gt;C&lt;/code&gt;, while another job gets key &lt;code&gt;B&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;within a job, data from all the input tables is merged and sorted — first according to the &lt;code&gt;sort_by&lt;/code&gt; fields, and then by input table index (&lt;code&gt;table_index&lt;/code&gt;). For foreign (&lt;code&gt;foreign&lt;/code&gt;) tables — within one &lt;code&gt;join_by&lt;/code&gt; key — sorting is done by external table index. More information about foreign tables &lt;a href=\"user-guide/data-processing/operations/reduce.html#foreign_tables\"&gt;below&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Input tables whose path has the &lt;code&gt;teleport=%true&lt;/code&gt; attribute get processed by the Reduce operation in a special way. Chunks of such tables without key range overlaps with other input tables' chunks are not fed to the user script. Such unprocessed chunks are written to the output table whose path has the &lt;code&gt;teleport=%true&lt;/code&gt; attribute. There can be no more than one such output table. You can still specify the &lt;code&gt;sorted_by&lt;/code&gt; attribute for the output table to make it sorted. In this case, the user must ensure that the key range at the user script output is not wider than the key range at the operation's input.&lt;/p&gt;\n&lt;h2 id=\"application\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/reduce.html#application\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Application&lt;/span&gt;&lt;/a&gt;Application&lt;/h2&gt;\n&lt;p&gt;A typical use case is updating a directory or aggregates.&lt;br /&gt;\nSuppose there is a &lt;code&gt;//some_user/stat&lt;/code&gt; table that stores visit statistics broken down by day. The table has two columns: &lt;code&gt;time&lt;/code&gt; and &lt;code&gt;count&lt;/code&gt;, with the data sorted based on the &lt;code&gt;time&lt;/code&gt; column. The data in the table is stored in two chunks, the first one being dates from 2013-06-01 to 2013-08-15, and the second one — 2013-08-16 to 2013-09-16. Additionally, there is a sorted &lt;code&gt;//some_user/update&lt;/code&gt; table featuring statistics updates for September. You can run the Reduce operation to update the main table as shown below.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;yt reduce --src &amp;lt;teleport=%true&amp;gt;//some_user/stat --src //some_user/update --dst &amp;lt;teleport=%true, sorted_by=[time]&amp;gt;//some_user/stat\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"105\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-105\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-105\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-105.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;As a result, the first chunk of the &lt;code&gt;//some_user/stat&lt;/code&gt; table goes to the output table in its original form, without processing.&lt;/p&gt;\n&lt;p&gt;Another use case is filtering out rows whose keys match those of a large sorted table from a small sorted table. Here, you can add an output table with the &lt;code&gt;&amp;lt;teleport=%true&amp;gt;&lt;/code&gt; attribute and delete it after execution. The output table will only contain those chunks of the large table that were not present in the small one.&lt;br /&gt;\nFiltering example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;yt reduce --src &amp;lt;teleport=%true&amp;gt;//fat_table --src //small/table --dst //results --dst &amp;lt;teleport=%true&amp;gt;//temp_table_to_throw_out ...; yt remove //temp_table_to_throw_out\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"112\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-112\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-112\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-112.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"foreign_tables\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/reduce.html#foreign_tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reduce with foreign tables&lt;/span&gt;&lt;/a&gt;Reduce with foreign tables&lt;/h2&gt;\n&lt;p&gt;Reduce with foreign tables is a modified Reduce operation where part of the input tables are marked as foreign (&lt;code&gt;foreign&lt;/code&gt;) tables and act as directories, with their data being added to the data stream from \"regular\" (&lt;code&gt;primary&lt;/code&gt;) tables. For foreign tables, a special set of &lt;code&gt;join_by&lt;/code&gt; key columns is used, which should be set as the prefix for the &lt;code&gt;reduce_by&lt;/code&gt; column set. Records with the same &lt;code&gt;join_by&lt;/code&gt; key, but different &lt;code&gt;reduce_by&lt;/code&gt; keys may end up in different jobs — in this case, the corresponding records from foreign tables are passed in to all the jobs, and therefore processed more than once.&lt;br /&gt;\nThe reverse is also possible in cases where the directory table can contain more different combinations of values than the main table. If a foreign table record matches none of the main table records, that record may not go to any job at all.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention!&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Because there are frequent reads on foreign table chunks, &lt;a href=\"https://en.wikipedia.org/wiki/Erasure_code\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;erasure coding&lt;/a&gt; for them is strongly discouraged. Indeed, if the foreign table is small, it is best to set a higher replication factor for it. Using &lt;code&gt;erasure&lt;/code&gt; for a foreign table can lead to increased read loads across cluster nodes and hurt the entire cluster's performance.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;An important difference between Reduce with foreign tables and the regular Reduce operation is that the granularity of user script calls in the Python wrapper and C++ wrapper. Unlike the regular Reduce operation, a user script (the &lt;code&gt;IReducer::Do&lt;/code&gt; method in the C++ API and the handler function in Python) is called for each &lt;code&gt;join_by&lt;/code&gt; key rather than the &lt;code&gt;reduce_by&lt;/code&gt; key.&lt;br /&gt;\nSpecification requirements for Reduce with foreign tables:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;at least one primary table must be specified (foreign attribute missing).&lt;/li&gt;\n&lt;li&gt;at least one foreign table must be specified using the &lt;code&gt;&amp;lt;foreign=%true&amp;gt;&lt;/code&gt; attribute.&lt;/li&gt;\n&lt;li&gt;the &lt;code&gt;join_by&lt;/code&gt; value must be specified.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;join_by&lt;/code&gt; must be a prefix of or match &lt;code&gt;reduce_by&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;join_by&lt;/code&gt; cannot be used without foreign tables, and foreign tables cannot be used without &lt;code&gt;join_by&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;you cannot set the &lt;code&gt;teleport&lt;/code&gt; attribute for a foreign table.&lt;/li&gt;\n&lt;li&gt;you cannot set multiple ranges for a foreign table, but the same foreign tables can be specified multiple times with different ranges.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Also, Reduce operations with foreign tables have the &lt;code&gt;consider_only_primary_size&lt;/code&gt; option (&lt;code&gt;%false&lt;/code&gt; by default), which, if enabled, makes it so only the amount of data in &lt;code&gt;primary&lt;/code&gt; tables is taken into account in job splitting.&lt;/p&gt;\n&lt;p&gt;Setting the &lt;code&gt;enable_key_guarantee=%false&lt;/code&gt; option in Reduce with foreign tables carries special semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;it disables the guarantee that all records with the same key from a primary table end up in the same job. At the same time, there still remains the guarantee that if a record from a primary table with a certain key ends up in a job, then all records with the same key from all foreign tables go to the same job.&lt;/li&gt;\n&lt;li&gt;the user must pass in the list of keys to &lt;code&gt;join_by&lt;/code&gt;, specifying &lt;code&gt;reduce_by&lt;/code&gt; is not allowed.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;We recommend using the Reduce operation with the &lt;code&gt;enable_key_guarantee=%false&lt;/code&gt; option.&lt;/p&gt;\n&lt;h2 id=\"example-specification\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/reduce.html#example-specification\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example specification&lt;/span&gt;&lt;/a&gt;Example specification&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;{\n  &lt;span class=\"hljs-string\"&gt;data_size_per_job&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1000000&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;reduce_by&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;sort_by&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"subkey\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;input_table_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/input_table\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;output_table_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/unsorted_output_table\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;&amp;lt;sorted_by&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;]&lt;span class=\"hljs-string\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"//tmp/sorted_output_table\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;reducer&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; {\n    &lt;span class=\"hljs-string\"&gt;command&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"python my_reducer.py\"&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;file_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/my_reducer.py\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  }&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;job_io&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; {\n    &lt;span class=\"hljs-string\"&gt;table_writer&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; {\n      &lt;span class=\"hljs-string\"&gt;max_row_weight&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;10000000&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n    }\n  }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"193\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-193\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-193\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-193.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/operations/reduce.md","sourcePath":"en/user-guide/data-processing/operations/reduce.md"},"headings":[{"title":"Application","href":"en/user-guide/data-processing/operations/reduce.html#application","level":2},{"title":"Reduce with foreign tables","href":"en/user-guide/data-processing/operations/reduce.html#foreign_tables","level":2},{"title":"Example specification","href":"en/user-guide/data-processing/operations/reduce.html#example-specification","level":2}],"title":"Reduce"},"router":{"pathname":"en/user-guide/data-processing/operations/reduce","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
