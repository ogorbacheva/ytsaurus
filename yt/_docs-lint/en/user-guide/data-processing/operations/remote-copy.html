        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;The RemoteCopy operation copies tables and files from one cluster to another. The RemoteCopy operation's jobs are run on the destination cluster and copy chunks from the source cluster (\"pull\"-schema). The operation copies the chunks in their original form, without uncompressing them or changing the &lt;code&gt;erasure&lt;/code&gt; schema. If the input is a table and it is sorted, the output table will also be sorted.&lt;/p&gt;\n&lt;p&gt;General parameters for all operation types are described in &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Operation options&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;The RemoteCopy operation supports the following additional options (default values, if set, are specified in brackets):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;cluster_name&lt;/code&gt; — name of the cluster from which the data is copied. A description of the available clusters is available on the &lt;code&gt;//sys/clusters&lt;/code&gt; node.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;network_name&lt;/code&gt; — name of the network (YTsaurus terms) used for copying. The specified network must be configured on all nodes of the remote cluster. For example: &lt;code&gt;fastbone&lt;/code&gt; or &lt;code&gt;backbone&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;networks&lt;/code&gt; — set of networks used to copy the data (in order of priority). &lt;strong&gt;Important:&lt;/strong&gt; Do not enable this and the previous option without first consulting with the system administrator.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;input_table_paths&lt;/code&gt; — list consisting of a single path to file or table to be copied.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;output_table_path&lt;/code&gt; — path to the table or file where the data is copied to. If this Cypress node exists, it must have the same type as the input node. It is not possible to copy table to file and vice-versa.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;schema_inference_mode&lt;/code&gt; (auto) — schema definition mode. Possible values: auto, from_input, from_output. To learn more, see &lt;a href=\"user-guide/storage/static-schema.html#schema_inference\"&gt;Data schema&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;cluster_connection&lt;/code&gt; — configuration for connecting to the source cluster. Configured by the YTsaurus system administrator when configuring the cluster.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;copy_attributes&lt;/code&gt; (false) — copy the attributes of the input table. Available only if there is one input table. Only user attributes are copied (not system attributes).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;attribute_keys&lt;/code&gt; — when this option is enabled along with &lt;code&gt;copy_attributes&lt;/code&gt;, only attributes from the given list are copied.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Important:&lt;/strong&gt; There is a special restriction for production clusters: remote copy operations can only be run in pools that have a limit on the number of simultaneously running jobs in one of the parents (that is, the &lt;code&gt;user_slots&lt;/code&gt; value of the &lt;code&gt;resource_limits&lt;/code&gt; attribute is below a certain threshold).&lt;/p&gt;\n&lt;h2 id=\"example-specification\"&gt;&lt;a href=\"en/user-guide/data-processing/operations/remote-copy.html#example-specification\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example specification&lt;/span&gt;&lt;/a&gt;Example specification&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;{\n  &lt;span class=\"hljs-string\"&gt;pool&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"my_cool_pool\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;network_name&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"fastbone\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;input_table_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/input_table\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;output_table_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"//tmp/output_table\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;copy_attributes&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;%true;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;cluster_name&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"my_cool_remote_cluster\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"62\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-62\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-62\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-62.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/data-processing/operations/remote-copy.md","sourcePath":"en/user-guide/data-processing/operations/remote-copy.md"},"headings":[{"title":"Example specification","href":"en/user-guide/data-processing/operations/remote-copy.html#example-specification","level":2}],"title":"RemoteCopy"},"router":{"pathname":"en/user-guide/data-processing/operations/remote-copy","depth":5,"base":"../../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
