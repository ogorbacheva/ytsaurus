        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"emulating-job-startup-locally\"&gt;&lt;a href=\"en/user-guide/problems/mapreduce-debug.html#emulating-job-startup-locally\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Emulating job startup locally&lt;/span&gt;&lt;/a&gt;Emulating job startup locally&lt;/h2&gt;\n&lt;p&gt;You can emulate job startup on any computer. For example, you can use your development server. To learn more about local job emulation, see &lt;a href=\"../user-guide/problems/jobtool.html\"&gt;Debugging jobs locally&lt;/a&gt; and &lt;a href=\"../user-guide/problems/jobshell-and-slowjobs.html\"&gt;Slow job troubleshooting&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"getting-the-current-stderr-of-a-running-job\"&gt;&lt;a href=\"en/user-guide/problems/mapreduce-debug.html#getting-the-current-stderr-of-a-running-job\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Getting the current stderr of a running job&lt;/span&gt;&lt;/a&gt;Getting the current stderr of a running job&lt;/h2&gt;\n&lt;p&gt;As an operation runs, there may be situations where there's still one incomplete job left while the rest have already finished. In YTsaurus, it's possible to get the stderr that the job has written up to a given moment.&lt;/p&gt;\n&lt;p&gt;You can do that with a special mode implemented in the &lt;code&gt;yt&lt;/code&gt; command: &lt;code&gt;yt get-job-stderr&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt get-job-stderr --operation-id 35060d89-f9328e09-3f403e8-6f4eb4b5 --job-id fe270b54-a938652-3fc0384-2144\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"15\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-15\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-15\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-15.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Stderr in the output is truncated according to the same rules that apply when you save files in Cypress: the first few megabytes plus the last few megabytes are shaved off.&lt;/p&gt;\n&lt;h2 id=\"getting-full-stderr-of-all-jobs-of-an-operation\"&gt;&lt;a href=\"en/user-guide/problems/mapreduce-debug.html#getting-full-stderr-of-all-jobs-of-an-operation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Getting full stderr of all jobs of an operation&lt;/span&gt;&lt;/a&gt;Getting full stderr of all jobs of an operation&lt;/h2&gt;\n&lt;p&gt;In YTsaurus, you can save full stderr of all jobs to a table. You can export stderr of those jobs that were not aborted.&lt;/p&gt;\n&lt;p&gt;To enable the described behavior:&lt;/p&gt;\n&lt;div class=\"yfm-tabs\" data-diplodoc-group=\"defaultTabsGroup-6vunbz7u\" data-diplodoc-variant=\"regular\"&gt;\n&lt;div class=\"yfm-tab-list\" role=\"tablist\"&gt;\n&lt;div data-diplodoc-id=\"inpython\" data-diplodoc-key=\"in%c2%a0python\" class=\"yfm-tab yfm-tab-group active\" role=\"tab\" tabindex=\"0\" data-diplodoc-is-active=\"true\"&gt;In Python&lt;/div&gt;\n&lt;div data-diplodoc-id=\"in-с\" data-diplodoc-key=\"in%20%d0%a1%2b%2b\" class=\"yfm-tab yfm-tab-group\" role=\"tab\" tabindex=\"-1\" data-diplodoc-is-active=\"false\"&gt;In С++&lt;/div&gt;\n&lt;div data-diplodoc-id=\"insdks-in-other-languages\" data-diplodoc-key=\"in%c2%a0sdks%20in%20other%20languages\" class=\"yfm-tab yfm-tab-group\" role=\"tab\" tabindex=\"-1\" data-diplodoc-is-active=\"false\"&gt;In SDKs in other languages&lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"10bx6rqo\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"In Python\"&gt;\n&lt;p&gt;Use the &lt;code&gt;stderr_table&lt;/code&gt; parameter. For example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.wrapper.run_map_reduce( mapper, reducer, &lt;span class=\"hljs-string\"&gt;'//path/to/input'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'//path/to/output'&lt;/span&gt;, reduce_by=[&lt;span class=\"hljs-string\"&gt;'some_key'&lt;/span&gt;], stderr_table=&lt;span class=\"hljs-string\"&gt;'//path/to/stderr/table'&lt;/span&gt;, )\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"44\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-44\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-44\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-44.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"ypuy3trk\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"In С++\"&gt;\n&lt;p&gt;Use the &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/07c9c385ae116f56d8ecce9fa6765fa1a90e95cc/yt/cpp/mapreduce/interface/operation.h#L563\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;StderrTablePath&lt;/a&gt; setting.&lt;/p&gt;\n&lt;/div&gt;\n&lt;div id=\"34ha72r3\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"In SDKs in other languages\"&gt;\n&lt;p&gt;You can pass the &lt;code&gt;stderr_table_path&lt;/code&gt; setting directly to the operation specification. For a description of this option, see &lt;a href=\"en/user-guide/data-processing/operations/operations-options.html\"&gt;Operation options&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;p&gt;A stderr table has the following columns:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;job_id&lt;/code&gt;: Job ID.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;part_index&lt;/code&gt;: If a job has stderr that is too large, it is split into parts. The &lt;code&gt;part_index&lt;/code&gt; value indicates the index of a specific stderr part.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;data&lt;/code&gt;: Stderr data itself.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;The table is sorted by &lt;code&gt;job_id&lt;/code&gt;, &lt;code&gt;part_index&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;You can read such a table using the &lt;a href=\"../user-guide/storage/blobtables.html#read_blob_table\"&gt;read_blob_table&lt;/a&gt; command.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"style":["_assets/tabs-extension.css"],"script":["_assets/tabs-extension.js"],"vcsPath":"en/user-guide/problems/mapreduce-debug.md","sourcePath":"en/user-guide/problems/mapreduce-debug.md"},"headings":[{"title":"Emulating job startup locally","href":"en/user-guide/problems/mapreduce-debug.html#emulating-job-startup-locally","level":2},{"title":"Getting the current stderr of a running job","href":"en/user-guide/problems/mapreduce-debug.html#getting-the-current-stderr-of-a-running-job","level":2},{"title":"Getting full stderr of all jobs of an operation","href":"en/user-guide/problems/mapreduce-debug.html#getting-full-stderr-of-all-jobs-of-an-operation","level":2}],"title":"Debugging MapReduce programs"},"router":{"pathname":"en/user-guide/problems/mapreduce-debug","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
