        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section provides a list and descriptions of statistics collected by the YTsaurus system from operations and individual jobs. There are examples of issue troubleshooting based on the statistics collected.&lt;/p&gt;\n&lt;h2 id=\"overview\"&gt;&lt;a href=\"en/user-guide/problems/jobstatistics.html#overview\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Overview&lt;/span&gt;&lt;/a&gt;Overview&lt;/h2&gt;\n&lt;p&gt;While operations are running, YTsaurus collects various system and user statistics from jobs.&lt;/p&gt;\n&lt;p&gt;Individual job statistics are entered into the scheduler log while aggregated statistics for an operation are available through the web interface by going to the &lt;strong&gt;Statistics&lt;/strong&gt; tab on the operation page. The figure shows an example of a page with operation job statistics:&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/jobstatistics.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;For a better understanding of job stats, you should be familiar with the notions of &lt;code&gt;job proxy&lt;/code&gt; and &lt;code&gt;sandbox&lt;/code&gt;, and have an idea of the way the YTsaurus system delivers user files to jobs. You can find out about these things in the Jobs section.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"statistic-descriptions\"&gt;&lt;a href=\"en/user-guide/problems/jobstatistics.html#statistic-descriptions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Statistic descriptions&lt;/span&gt;&lt;/a&gt;Statistic descriptions&lt;/h2&gt;\n&lt;h3 id=\"system_stats\"&gt;&lt;a href=\"en/user-guide/problems/jobstatistics.html#system_stats\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;System stats&lt;/span&gt;&lt;/a&gt;System stats&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Statistic&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;time/total&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Job running time from the moment it is created by the scheduler until the moment the scheduler is notified that the job is completed (successfully or otherwise). Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;time/prepare&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Job set up time until a &lt;code&gt;job proxy&lt;/code&gt; is started (files are uploaded into the chunk cache as required, a &lt;code&gt;sandbox&lt;/code&gt; directory is created, files are created and copied to &lt;code&gt;tmpfs&lt;/code&gt;, and requisite &lt;code&gt;cgroups&lt;/code&gt; are set up). Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;time/artifacts_download&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Time to upload files to the chunk cache (as required). Included in &lt;code&gt;time/prepare&lt;/code&gt;. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;time/prepare_root_fs&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Time to prepare the file system in the porto container (as required). Included in &lt;code&gt;time/prepare&lt;/code&gt;. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;time/gpu_check&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Time to run for the utility pre-checking node GPU functionality (relevant for some GPU operations). Included in &lt;code&gt;time/prepare&lt;/code&gt;. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;time/exec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Job running time from start to &lt;code&gt;job proxy&lt;/code&gt; process exit. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/input/chunk_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Total number of data slices read by the job. A data slice is a continuous segment of a single chunk (for static tables) or a continuous range of rows between two keys (for dynamic tables). Pieces.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/input/row_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Total number of table rows read by a job. Pieces.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/input/compressed_data_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Total compressed block data read by a job (table data fed to operation input). Bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/input/uncompressed_data_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Total uncompressed block data read by a job. Bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/input/data_weight&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;\"Logical\" amount of uncompressed data read by a job. Depends only on the values in the table cells and the number of rows. Not dependent on whether a table has a schema or the values of &lt;code&gt;optimize_for&lt;/code&gt;, &lt;code&gt;compression_codec&lt;/code&gt;, or &lt;code&gt;erasure_codec&lt;/code&gt;. Calculated as &lt;code&gt;row_count + sum(data_weight(value))&lt;/code&gt; for all values in the table cells. Bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/input/not_fully_consumed&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;1 if a job has not read the entire input, 0 otherwise.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/output/K/chunk_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Number of chunks written to output table with index K. Pieces.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/output/K/row_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Number of rows written to output table with index K. In units.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/output/K/compressed_data_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Compressed block data written to output table K. In bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/output/K/uncompressed_data_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Uncompressed block data written to output table K. In bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/output/K/data_weight&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;\"Logical\" uncompressed data amount written to output table K. Dependent only on the values in the table cells and the number of rows. Not dependent on whether a table has a schema or the values of &lt;code&gt;optimize_for&lt;/code&gt;, &lt;code&gt;compression_codec&lt;/code&gt;, or &lt;code&gt;erasure_codec&lt;/code&gt;. Calculated as &lt;code&gt;row_count + sum(data_weight(value))&lt;/code&gt; for all values in the table cells. Bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/output/K/regular_disk_space&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Only populated for tables with &lt;code&gt;erasure_codec == none&lt;/code&gt; and equal to &lt;code&gt;compressed_data_size&lt;/code&gt; + metadata chunk size. Bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data/output/K/erasure_disk_space&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Populated only for tables with &lt;code&gt;erasure_codec != none&lt;/code&gt;. In addition to &lt;code&gt;compressed_data_size&lt;/code&gt;, includes the amount of data in the &lt;i class=\"yfm yfm-term_title\" term-key=\":parity\" role=\"button\" aria-describedby=\":parity_element\" tabindex=\"0\" id=\"rtiv8et9\"&gt;parity&lt;/i&gt; blocks. For more information about erasure codecs, see the &lt;a href=\"user-guide/storage/replication.html\"&gt;section&lt;/a&gt;. Bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/cpu/user&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;User mode CPU time of the &lt;code&gt;job proxy&lt;/code&gt; process. Computed based on the &lt;code&gt;cpu_usage&lt;/code&gt; value of the porto container. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/cpu/system&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Kernel mode CPU time of the &lt;code&gt;job proxy&lt;/code&gt; process. Computed based on the &lt;code&gt;cpu_usage_system&lt;/code&gt; value of the porto container. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/cpu/wait&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Wait CPU time of the &lt;code&gt;job proxy&lt;/code&gt; process. Computed based on the &lt;code&gt;cpu_wait&lt;/code&gt; value of the porto container. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/cpu/throttled&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Throttled CPU time of the &lt;code&gt;job proxy&lt;/code&gt; process. Computed based on the &lt;code&gt;cpu_throttled&lt;/code&gt; value of the porto container. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/block_io/bytes_written&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Number of bytes written by the &lt;code&gt;job proxy&lt;/code&gt; process to the local block device. The value is derived from the &lt;code&gt;Write&lt;/code&gt; section of &lt;code&gt;blkio.io_serviced_bytes&lt;/code&gt; for the relevant cgroup. Normally, a small value because &lt;code&gt;job proxy&lt;/code&gt; only writes logs to the local disk. Chunks are written via (local and/or remote) nodes and do not count towards this statistic.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/block_io/bytes_read&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Number of bytes read by the &lt;code&gt;job proxy&lt;/code&gt; process from the local block device. The value is derived from the &lt;code&gt;Read&lt;/code&gt; section of &lt;code&gt;blkio.io_serviced_bytes&lt;/code&gt; for the relevant cgroup. In a typical case approaches zero because &lt;code&gt;job proxy&lt;/code&gt; only reads its own configuration from disk.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/block_io/io_read&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Number of reads from the local block device by the &lt;code&gt;job proxy&lt;/code&gt; process. The value is derived from the &lt;code&gt;Read&lt;/code&gt; section of &lt;code&gt;blkio.io_serviced&lt;/code&gt; for the relevant cgroup. Pieces.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/block_io/io_write&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Number of writes to the local block device by the &lt;code&gt;job proxy&lt;/code&gt; process. The value is derived from the &lt;code&gt;Write&lt;/code&gt; section of &lt;code&gt;blkio.io_serviced&lt;/code&gt; for the relevant cgroup. Pieces.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/block_io/io_total&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Total number of input/output transactions on the local block device by the &lt;code&gt;job proxy&lt;/code&gt; process. Pieces.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/max_memory&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Maximum amount of RAM used by the &lt;code&gt;job proxy&lt;/code&gt; process while a job is running. Bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/memory_reserve&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Amount of RAM guaranteed to the &lt;code&gt;job proxy&lt;/code&gt; at launch. If actual usage exceeds &lt;code&gt;memory_reserve&lt;/code&gt;, the job may be aborted with a &lt;code&gt;resource_overdraft&lt;/code&gt; message. Bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/traffic&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Amount of data transmitted over the network to/from the &lt;code&gt;job proxy&lt;/code&gt;. Normally, matches the amount of job input/output data if it only reads and writes tables/files as a job usually does and does not generate any other traffic on its own. Contains fields looking like &lt;code&gt;A_to_B&lt;/code&gt; where &lt;code&gt;A&lt;/code&gt; and &lt;code&gt;B&lt;/code&gt; are data center short names. The value in this field is equal to the amount of data transmitted in this direction. You will find the time it took to transmit the data in the &lt;code&gt;duration_ms&lt;/code&gt; field. Normally matches the time the &lt;code&gt;job proxy&lt;/code&gt; has been in existence. In addition, incoming/outgoing traffic is also tracked (&lt;code&gt;inbound&lt;/code&gt; and &lt;code&gt;outbound&lt;/code&gt; fields, respectively), itemized by data center as well.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;exec_agent/traffic&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Same as &lt;code&gt;job_proxy/traffic&lt;/code&gt; but for an exec agent. Normally displays the traffic generated during job artifact setup.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/cpu/*&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Similar to &lt;code&gt;job_proxy/cpu/*&lt;/code&gt; but applies to the user job processes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/block_io/bytes_read&lt;/code&gt;, &lt;code&gt;user_job/block_io/bytes_written&lt;/code&gt;, &lt;code&gt;user_job/block_io/io_read&lt;/code&gt;, &lt;code&gt;user_job/block_io/io_write&lt;/code&gt;, &lt;code&gt;user_job/block_io/io_total&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Block IO statistics for a user job. Similar to &lt;code&gt;job_proxy/block_io/*&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/cumulative_memory_mb_sec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Integral of memory used, MB*s&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/current_memory/major_page_faults&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Number of &lt;a href=\"https://en.wikipedia.org/wiki/Page_fault#Major\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;major page faults&lt;/a&gt; in a user process. The value is derived from the &lt;code&gt;pgmajfault&lt;/code&gt; section of &lt;code&gt;memory.stat&lt;/code&gt; from cgroup &lt;code&gt;memory&lt;/code&gt;. May assist in investigating the elevated &lt;code&gt;user_job/block_io/read&lt;/code&gt; statistic. Pieces.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/current_memory/rss&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;RSS size at job end. The value is derived from the &lt;code&gt;rss&lt;/code&gt; section of &lt;code&gt;memory.stat&lt;/code&gt; for the relevant cgroup. Bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/current_memory/mapped_file&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Memory mapped files size at job end. The value is derived from the &lt;code&gt;mapped_file&lt;/code&gt; section of &lt;code&gt;memory.stat&lt;/code&gt; for the relevant cgroup. Bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/tmpfs_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;tmpfs&lt;/code&gt; currently being &lt;strong&gt;used&lt;/strong&gt; by the running job. Computed as the difference between the values of &lt;code&gt;total&lt;/code&gt; and &lt;code&gt;free&lt;/code&gt; returned by a call to &lt;code&gt;statfs&lt;/code&gt; on tmpfs mount point. Bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/max_tmpfs_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Maximum &lt;code&gt;tmpfs&lt;/code&gt; amount &lt;strong&gt;used&lt;/strong&gt; throughout the job running time. Bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/tmpfs_volumes/K/size&lt;/code&gt;, &lt;code&gt;user_job/tmpfs_volumes/K/max_size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Same as &lt;code&gt;user_job/tmpfs_size&lt;/code&gt; and &lt;code&gt;user_job/max_tmpfs_size&lt;/code&gt; for each requested tmpfs volume individually.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/disk/usage&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Disk space being taken up by a job sandbox; computed through a recursive sandbox walk by adding up all the file sizes. Bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/disk/limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Requested limit on job sandbox size. Bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/max_memory&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Maximum amount of RAM taken up by a user job while running, &lt;strong&gt;net&lt;/strong&gt; of &lt;code&gt;tmpfs&lt;/code&gt;. Bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/memory_limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Limitation on RAM amount set in the operation spec at operation start. Duplicated in the stats for housekeeping reasons. Bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/memory_reserve&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Amount of RAM guaranteed for a user job at time of launch. When actual usage becomes greater (but less than &lt;code&gt;memory_limit&lt;/code&gt;), a job may be aborted with a &lt;code&gt;resource_overdraft&lt;/code&gt; message if a cluster node is short on memory. You can control this value using an &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;option&lt;/a&gt; called &lt;code&gt;memory_reserve_factor&lt;/code&gt; in the operation spec. Bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/pipes/input/bytes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Number of bytes transmitted via the user process stdin (that is, the amount of input data converted to the specified input format with all the control modifiers like &lt;code&gt;table_index&lt;/code&gt;, &lt;code&gt;row_index&lt;/code&gt;, and so on).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/pipes/input/idle_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Amount of time during which the &lt;code&gt;job proxy&lt;/code&gt; transmitted no data to a user job via stdin because it was reading data. For instance, a data cluster node disk was busy, and the data were unavailable, or the &lt;code&gt;compression_codec&lt;/code&gt; used was slow to uncompress. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/pipes/input/busy_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The amount of time during which the &lt;code&gt;job proxy&lt;/code&gt; process was writing data to a user job stdin. The value can be large if the user code implements computationally intensive processing and does not have time to read data. In addition, slow reads could be the reason when user code hangs up on a write not reading new data as a consequence. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/pipes/output/K/bytes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Number of bytes written by a user process to the descriptor corresponding to the Kth output table. For information on descriptors and their numbering, please see the dedicated section.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/pipes/output/K/idle_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Time during which the &lt;code&gt;job proxy&lt;/code&gt; process did not read the stream corresponding to the Kth output table because it was writing data already read from that stream. For example, the cluster node being written to was slow to respond, or a very slow compression algorithm is being used. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/pipes/output/K/busy_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Time during which the &lt;code&gt;job proxy&lt;/code&gt; process was reading from the stream corresponding to the Kth output table. If this time value is large, the user code has not written anything to the stream for a long time. For instance, because it took a long time to process the input, or because the input was unavailable. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_utilization_gpu&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Net amount of time during which there were running GPU computations. Added up across all the GPUs used by a job. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_utilization_memory&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Net time spent accessing GPU memory. Added up across all the GPUs used by a job. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_utilization_clocks_sm&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;An integral of the board frequency over time with respect to the maximum frequency. Added up across all the GPUs used by a job. Milliseconds * share.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_utilization_power&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Integral of effective GPU board power over time with respect to the maximum power. Added up across all the GPUs used by a job. Milliseconds * share.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_load&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Time during which GPU was at non-zero load. Added up across all the GPUs used by a job. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_memory&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Integral of GPU memory utilization. Added up across all the GPUs used by a job. Milliseconds * bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_power&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Integral of utilized GPU power. Added up across all the GPUs used by a job. Milliseconds * power.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_clocks_sm&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Integral of utilized GPU frequency. Added up across all the GPUs used by a job. Milliseconds * frequency.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/max_memory_used&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Maximum recorded GPU memory utilization. Added up across all the GPUs used by a job. Bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/memory_total&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Total available GPU memory. Added up across all the GPUs used by a job. Bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_slowdown/hw&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Time during which GPU experienced hardware slowdown. Added up across all the GPUs used by a job. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_slowdown/hw_power_brake&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Time during which GPU experienced hardware slowdown due to power break. Added up across all the GPUs used by a job. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_slowdown/hw_thermal&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Time during which GPU experienced hardware slowdown due to overheating. Added up across all the GPUs used by a job. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_slowdown/sw_thermal&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Time during which GPU experienced software slowdown due to overheating. Added up across all the GPUs used by a job. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_tensor_activity\"&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Time during which the GPU tensor pipeline (HMMA) was active. Added up across all the GPUs used by a job. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_job/gpu/cumulative_dram_activity\"&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Time during which the GPU memory interface was active, sending or receiving data. Added up across all the GPUs used by a job. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;codec/cpu/decode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Wall time spent uncompressing data. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;codec/cpu/encode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Wall time spent compressing data. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/memory_reserve_factor_x10000&lt;/code&gt;, &lt;code&gt;user_job/memory_reserve_factor_x10000&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Housekeeping parameters used to analyze the operation of the &lt;code&gt;memory_reserve&lt;/code&gt; computational algorithm.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;job_proxy/aggregated_max_cpu_usage_x100&lt;/code&gt;, &lt;code&gt;job_proxy/aggregated_smoothed_cpu_usage_x100&lt;/code&gt;, &lt;code&gt;job_proxy/aggregated_preemptible_cpu_x100&lt;/code&gt;, &lt;code&gt;job_proxy/aggregated_preempted_cpu_x100&lt;/code&gt;, &lt;code&gt;job_proxy/preemptible_cpu_x100&lt;/code&gt;, &lt;code&gt;job_proxy/smoothed_cpu_usage_x100&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Job CPU monitor housekeeping statistics.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk_reader_statistics/data_bytes_read_from_disk&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Amount of data retrieved from disk during chunk reads. Bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk_reader_statistics/data_bytes_transmitted&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Amount of data transmitted over the network during chunk reads. Bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk_reader_statistics/data_bytes_read_from_cache&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Amount of data retrieved from cache while reading chunks. Bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk_reader_statistics/meta_bytes_read_from_disk&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Amount of metadata retrieved from disk during chunk reads. Bytes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk_reader_statistics/wait_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Time spent waiting for data during chunk reads. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk_reader_statistics/read_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Time spent actively reading chunks, such as parsing strings from read blocks. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;chunk_reader_statistics/idle_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Time during which chunk reads were aborted for the processing of previously read data. Milliseconds.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"python-api\"&gt;&lt;a href=\"en/user-guide/problems/jobstatistics.html#python-api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Python API&lt;/span&gt;&lt;/a&gt;Python API&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Statistic&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;custom/python_job_preparation_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Time between program main entry and the start of input row processing.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"troubleshooting-examples\"&gt;&lt;a href=\"en/user-guide/problems/jobstatistics.html#troubleshooting-examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Troubleshooting examples&lt;/span&gt;&lt;/a&gt;Troubleshooting examples&lt;/h2&gt;\n&lt;h3 id=\"slow-jobs\"&gt;&lt;a href=\"en/user-guide/problems/jobstatistics.html#slow-jobs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Slow jobs&lt;/span&gt;&lt;/a&gt;Slow jobs&lt;/h3&gt;\n&lt;p&gt;The most common use of statistics is to troubleshoot slow jobs.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Job statistics are to be used alongside other troubleshooting methods available in the YTsaurus system.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"slow-user-code\"&gt;&lt;a href=\"en/user-guide/problems/jobstatistics.html#slow-user-code\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Slow user code&lt;/span&gt;&lt;/a&gt;Slow user code&lt;/h4&gt;\n&lt;p&gt;Simple case: if &lt;code&gt;user_job/cpu/user ~= time/exec&lt;/code&gt;, user code is causing the job to run slowly. You should connect to the job via the &lt;a href=\"user-guide/problems/jobshell-and-slowjobs.html\"&gt;job shell&lt;/a&gt; and look for the bottleneck using perf and gdb.&lt;/p&gt;\n&lt;h4 id=\"multithreading\"&gt;&lt;a href=\"en/user-guide/problems/jobstatistics.html#multithreading\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Multithreading&lt;/span&gt;&lt;/a&gt;Multithreading&lt;/h4&gt;\n&lt;p&gt;A more complex case: a user has analyzed the stats and retrieved the total utilized CPU time:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;user_job/cpu/user + user_job/cpu/system+job_proxy/cpu/user+job_proxy/cpu/system = 303162 milliseconds\ntime/exec = 309955 milliseconds\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"733\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-733\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-733\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-733.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The user is expecting the numbers to match.&lt;/p&gt;\n&lt;p&gt;The equality above is not totally proper since &lt;code&gt;time/exec&lt;/code&gt; is wall time while &lt;code&gt;user_job/cpu/*&lt;/code&gt; and &lt;code&gt;job_proxy/cpu/*&lt;/code&gt; are CPU times spent computing. At the same time, both the &lt;code&gt;job proxy&lt;/code&gt; and (potentially) the user process may use more than a single core because of multithreading, and on top of that, both the processes are running concurrently.&lt;/p&gt;\n&lt;p&gt;If the user process is single-threaded, the following should be approximately true:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;time/exec ~= user_job/cpu/* + user_job/pipes/input/idle_time + max(user_job/pipes/output/N/idle_time)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"743\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-743\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-743\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-743.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The above computation does not include the time to \"close\" output chunks: when the output stream is already closed, all its data read but the &lt;code&gt;job proxy&lt;/code&gt; is still finalizing chunks.&lt;/p&gt;\n&lt;h4 id=\"long-compression\"&gt;&lt;a href=\"en/user-guide/problems/jobstatistics.html#long-compression\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Long compression&lt;/span&gt;&lt;/a&gt;Long compression&lt;/h4&gt;\n&lt;p&gt;If an operation is taking much longer to run than user code running time, and an execution time measurement showed that the YTsaurus system is spending most of its time processing a &lt;code&gt;yield&lt;/code&gt;, the problem is that inside &lt;code&gt;yield&lt;/code&gt; the python wrapper is writing data to the output stream. If the &lt;code&gt;job proxy&lt;/code&gt; write pipeline is overloaded, the &lt;code&gt;job proxy&lt;/code&gt; process stops reading data and a &lt;code&gt;yield&lt;/code&gt; becomes blocked. &lt;code&gt;user_job/pipes/output/N/idle_time&lt;/code&gt; statistics showed \"lost\" minutes. There are two possible reasons why a &lt;code&gt;job proxy&lt;/code&gt; process failed to read data: the &lt;code&gt;job proxy&lt;/code&gt; took a long time processing data on its side or there was a cluster write. The &lt;code&gt;job_proxy/cpu/user&lt;/code&gt; stats make it clear that 70% of the total job time, the &lt;code&gt;job proxy&lt;/code&gt; process was keeping the CPU busy, which means that processing input data took a long time. The heaviest part of &lt;code&gt;job proxy&lt;/code&gt; processing is compression, which is what the profiler indicated in the end.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;General rule for slow job troubleshooting: when analyzing running time, you need to find dominant metrics, then look for a cause of the problem in the identified component.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"exceeding-memory-guarantees\"&gt;&lt;a href=\"en/user-guide/problems/jobstatistics.html#exceeding-memory-guarantees\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Exceeding memory guarantees&lt;/span&gt;&lt;/a&gt;Exceeding memory guarantees&lt;/h3&gt;\n&lt;p&gt;Operations exceed memory limitations. Steps to resolve this issue:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;When requesting tmpfs, you need to make sure that you are not ordering too much. To make sure, you need to look at the &lt;code&gt;user_job/tmpfs_size&lt;/code&gt; statistics.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;When selecting &lt;code&gt;memory_limit&lt;/code&gt;, you need to proceed from the &lt;code&gt;user_job/max_memory&lt;/code&gt; metric; if you are using &lt;code&gt;tmpfs&lt;/code&gt;, you must add the required &lt;code&gt;tmpfs&lt;/code&gt; amount to &lt;code&gt;user_job/max_memory&lt;/code&gt;. If you use automatic &lt;code&gt;tmpfs&lt;/code&gt; ordering via the C++ and the Python APIs, the APIs will make the addition on their own.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Most jobs do not use a lot of memory but certain jobs require significantly more memory, and you should set &lt;code&gt;memory_limit&lt;/code&gt; to the maximum job memory requirement but set &lt;code&gt;memory_reserve_factor&lt;/code&gt; lower (at the same time, you should be ready that jobs will be aborted for &lt;code&gt;resource_overdraft&lt;/code&gt;). You can make the relevant decision by comparing the average and the maximum values of the &lt;code&gt;user_job/max_memory&lt;/code&gt; statistic (the web interface includes appropriate switches): if average and maximum memory usage in a job differs by several dozen percent or by orders of magnitude, this is an indication that there are jobs whose usage is inordinately high.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Reverse situation: if too many jobs are being aborted for &lt;code&gt;resource_overdraft&lt;/code&gt;, you should increase &lt;code&gt;memory_reserve_factor&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"excessive_io\"&gt;&lt;a href=\"en/user-guide/problems/jobstatistics.html#excessive_io\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Operation  message&lt;/span&gt;&lt;/a&gt;Operation &lt;code&gt;excessive io&lt;/code&gt; message&lt;/h3&gt;\n&lt;p&gt;You must review the &lt;code&gt;user_job/block_io/io_read&lt;/code&gt; statistic. If a job makes tens of thousands of reads, it is harming both itself and other users.&lt;br /&gt;\nYou should check the &lt;code&gt;major page faults&lt;/code&gt; counter. A large value is an indication of possible memory mapping use.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The use of &lt;strong&gt;memory mapping&lt;/strong&gt; in jobs is &lt;strong&gt;strongly discouraged&lt;/strong&gt; while jobs doing this create heavy disk load with random reads and writes. Please remember that a conventional hard drive is capable of no more than 100 random access operations per second while there are several dozen jobs running concurrently on a cluster node.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Solution for this issue: reducing executable size (by removing the debugging symbols, for instance), ordering tmpfs for the job, and uploading large files into memory at job launch (&lt;code&gt;copy_files&lt;/code&gt; option). For more information on these options, please see &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Operation settings&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"supplemental\"&gt;&lt;a href=\"en/user-guide/problems/jobstatistics.html#supplemental\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Supplemental&lt;/span&gt;&lt;/a&gt;Supplemental&lt;/h2&gt;\n&lt;p&gt;YTsaurus is unable to measure phase time inside a user process. For example, if user code uploads a large dictionary into memory at launch, you will not be able to see the time it took to load this dictionary in the system metrics. If this happens, you should take advantage of user statistics.&lt;/p&gt;\n&lt;p&gt;You can use user statistics to compute simple aggregates even in a map operation. The number of user statistics is limited to 128 per job.&lt;/p&gt;\n&lt;p&gt;You can build different plots from job metrics (in particular, visualize operation phases) to simplify troubleshooting.&lt;/p&gt;\n&lt;dfn class=\"yfm yfm-term_dfn\" id=\":parity_element\" role=\"dialog\"&gt;&lt;p&gt;Additional blocks for redundancy and original block recovery in the event of a loss of any part. Computed using a logical XOR.&lt;/p&gt;\n&lt;/dfn&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/problems/jobstatistics.md","sourcePath":"en/user-guide/problems/jobstatistics.md"},"headings":[{"title":"Overview","href":"en/user-guide/problems/jobstatistics.html#overview","level":2},{"title":"Statistic descriptions","href":"en/user-guide/problems/jobstatistics.html#statistic-descriptions","level":2,"items":[{"title":"System stats","href":"en/user-guide/problems/jobstatistics.html#system_stats","level":3},{"title":"Python API","href":"en/user-guide/problems/jobstatistics.html#python-api","level":3}]},{"title":"Troubleshooting examples","href":"en/user-guide/problems/jobstatistics.html#troubleshooting-examples","level":2,"items":[{"title":"Slow jobs","href":"en/user-guide/problems/jobstatistics.html#slow-jobs","level":3,"items":[{"title":"Slow user code","href":"en/user-guide/problems/jobstatistics.html#slow-user-code","level":4},{"title":"Multithreading","href":"en/user-guide/problems/jobstatistics.html#multithreading","level":4},{"title":"Long compression","href":"en/user-guide/problems/jobstatistics.html#long-compression","level":4}]},{"title":"Exceeding memory guarantees","href":"en/user-guide/problems/jobstatistics.html#exceeding-memory-guarantees","level":3},{"title":"Operation excessive io message","href":"en/user-guide/problems/jobstatistics.html#excessive_io","level":3}]},{"title":"Supplemental","href":"en/user-guide/problems/jobstatistics.html#supplemental","level":2}],"title":"Job stats"},"router":{"pathname":"en/user-guide/problems/jobstatistics","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
