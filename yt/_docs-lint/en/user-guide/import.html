        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Data is imported from external systems to YTsaurus with SPYT.&lt;/p&gt;\n&lt;p&gt;This document contains instructions for using the &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/connectors/import.py\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;&lt;code&gt;import.py&lt;/code&gt;&lt;/a&gt; script. This script imports data from Hadoop, Hive, or from database systems that support the JDBC protocol.&lt;/p&gt;\n&lt;p&gt;To import data from other systems not supported by &lt;code&gt;import.py&lt;/code&gt; — such as MongoDB, — you can use SPYT directly, reading from the external system via the corresponding Spark Data Source.&lt;/p&gt;\n&lt;h2 id=\"dependencies\"&gt;&lt;a href=\"en/user-guide/import.html#dependencies\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Installing dependencies&lt;/span&gt;&lt;/a&gt;Installing dependencies&lt;/h2&gt;\n&lt;p&gt;jar dependencies for interacting with Hive are provided in the &lt;code&gt;pyspark&lt;/code&gt; Python package. All of the packages that SPYT requires (including &lt;code&gt;pyspark&lt;/code&gt;) must be installed on the system calling the import.&lt;/p&gt;\n&lt;p&gt;To read data from a database system that supports JDBC, download the JDBC driver for that system.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;connectors/pom.xml&lt;/code&gt; is a maven config that includes JDBC drivers for MySQL and PostgreSQL as dependencies. To download these drivers, run the command:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;~/yt/connectors$ mvn dependency:copy-dependencies\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"21\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-21\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-21\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-21.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code&gt;mvn&lt;/code&gt; will download jar files with JDBC drivers for PostgreSQL and MySQL to &lt;code&gt;target/dependency&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;To import data from a different database, add the JDBC driver for that database to &lt;code&gt;pom.xml&lt;/code&gt; and run &lt;code&gt;$ mvn dependency:copy-dependencies&lt;/code&gt;&lt;/p&gt;\n&lt;h2 id=\"how-to-import\"&gt;&lt;a href=\"en/user-guide/import.html#how-to-import\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Importing data&lt;/span&gt;&lt;/a&gt;Importing data&lt;/h2&gt;\n&lt;p&gt;To import data, run the &lt;code&gt;import.py&lt;/code&gt; script:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ ./import.py \\\n   &lt;span class=\"hljs-comment\"&gt;# Import arguments.&lt;/span&gt;\n   &lt;span class=\"hljs-comment\"&gt;# ...&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"34\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-34\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-34\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-34.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The arguments must identify:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Data source.&lt;/li&gt;\n&lt;li&gt;Path to the imported data.&lt;/li&gt;\n&lt;li&gt;Path within YTsaurus where the imported data should be written.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;You can find the complete list of arguments at the end of this page, under &lt;a href=\"en/user-guide/import.html#script-options\"&gt;Arguments&lt;/a&gt;. Below are examples showing how to import data from various systems.&lt;/p&gt;\n&lt;h3 id=\"hive\"&gt;&lt;a href=\"en/user-guide/import.html#hive\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hive&lt;/span&gt;&lt;/a&gt;Hive&lt;/h3&gt;\n&lt;p&gt;To import data from Hive:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Upload the &lt;code&gt;hadoop-aws-*.jar&lt;/code&gt; and &lt;code&gt;aws-java-sdk-bundle-*.jar&lt;/code&gt; files from your local directory &lt;code&gt;target/dependency&lt;/code&gt; to Cypress.&lt;/li&gt;\n&lt;li&gt;Run the data import command:\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ ./import.py \\\n  --metastore master_host:9083 \\\n  --warehouse-dir /path/to/hive/warehouse \\\n  --input hive:database_name.table_name \\\n  --output //path/in/yt/table \\\n  --proxy https://ytsaurus.company.net \\\n  --num-executors 5 \\\n  --executor-memory 4G \\\n  --executor-memory-overhead 2G \\\n  --jars yt:///path/to/jars/aws-java-sdk-bundle-1.11.901.jar \\\n         yt:///path/to/jars/hadoop-aws-3.3.1.jar\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"74\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-74\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-74\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-74.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;a href=\"en/user-guide/import.html#script-options\"&gt;Go to argument descriptions&lt;/a&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Alternatively, provide an SQL query to be executed by Hive using the &lt;code&gt;hive_sql&lt;/code&gt; input specifier. Query results will be stored in YT.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ ./import.py \\\n    ...\n    --input hive_sql:database_name:SELECT * FROM action_log WHERE action_date &amp;gt; &lt;span class=\"hljs-string\"&gt;'2023-01-01'&lt;/span&gt; \\\n    ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"83\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-83\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-83\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-83.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"hdfs\"&gt;&lt;a href=\"en/user-guide/import.html#hdfs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HDFS&lt;/span&gt;&lt;/a&gt;HDFS&lt;/h3&gt;\n&lt;p&gt;To import files from HDFS, use a specifier with the file's format and the address of the HDFS NameNode:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ ./import.py \\\n    ...\n    --input text:hdfs://namenode/path/to/text/file\n    ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"90\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-90\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-90\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-90.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code&gt;import.py&lt;/code&gt; supports the &lt;code&gt;text&lt;/code&gt;, &lt;code&gt;parquet&lt;/code&gt;, and &lt;code&gt;orc&lt;/code&gt; file formats.&lt;/p&gt;\n&lt;h3 id=\"database-systems-with-jdbc-support\"&gt;&lt;a href=\"en/user-guide/import.html#database-systems-with-jdbc-support\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Database systems with JDBC support&lt;/span&gt;&lt;/a&gt;Database systems with JDBC support&lt;/h3&gt;\n&lt;p&gt;To import data from JDBC-compatible systems, such as PostgreSQL, run the following command:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ ./import.py \\\n    --jdbc postgresql \\\n    --jdbc-server pg_host:5432 \\\n    --jdbc-user user \\\n    --jdbc-password &lt;span class=\"hljs-string\"&gt;''&lt;/span&gt; \\  &lt;span class=\"hljs-comment\"&gt;# Get password from terminal prompt&lt;/span&gt;\n    --input jdbc:database_name.table_name \\\n    --output //path/in/yt/table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"100\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-100\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-100\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-100.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;a href=\"en/user-guide/import.html#script-options\"&gt;Go to argument descriptions&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;To import the results of an SQL statement, use the &lt;code&gt;jdbc_sql&lt;/code&gt; input specifier:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ ./import.py \\\n    ...\n    --input jdbc_sql:database_name:SELECT * FROM &lt;span class=\"hljs-built_in\"&gt;users&lt;/span&gt; WHERE signup_date &amp;gt; &lt;span class=\"hljs-string\"&gt;'2023-01-01'&lt;/span&gt; \\\n    ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"107\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-107\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-107\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-107.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"s3\"&gt;&lt;a href=\"en/user-guide/import.html#s3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;S3&lt;/span&gt;&lt;/a&gt;S3&lt;/h3&gt;\n&lt;p&gt;To import data from S3:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Upload the &lt;code&gt;hadoop-aws-*.jar&lt;/code&gt; and &lt;code&gt;aws-java-sdk-bundle-*.jar&lt;/code&gt; files from your local directory &lt;code&gt;target/dependency&lt;/code&gt; to Cypress.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Run the data import command:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;./import.py \\\n --input parquet:s3a://bucket/path/to/data/sample-parquet \\\n --output //home/tables/import_from_s3 \\\n --s3-access-key &amp;lt;S3 Access Key&amp;gt; \\\n --s3-secret-key &amp;lt;S3 Secret Key&amp;gt; \\\n --s3-endpoint &amp;lt;S3 endpoint&amp;gt; \\\n --proxy https://ytsaurus.company.net \\\n --num-executors 5 \\\n --executor-memory 4G \\\n --executor-memory-overhead 2G \\\n --jars yt:///path/to/jars/aws-java-sdk-bundle-1.11.901.jar \\\n      yt:///path/to/jars/hadoop-aws-3.3.1.jar\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"124\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-124\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-124\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-124.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The arguments are described below.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"script-options\"&gt;&lt;a href=\"en/user-guide/import.html#script-options\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Arguments&lt;/span&gt;&lt;/a&gt;Arguments&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;import.py&lt;/code&gt; supports the following arguments:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Argument&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--num-executors&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Number of executors for an import operation (1 by default).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--cores-per-executor&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Number of reserved CPU cores per executor (1 by default).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--ram-per-core&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Amount of RAM reserved, per core (2 GB by default).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--jdbc&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Type of JDBC driver. For example, &lt;code&gt;mysql&lt;/code&gt; or &lt;code&gt;postgresql&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--jdbc-server&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Database server host:port.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--jdbc-user&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Username to log in to the database.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--jdbc-password&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Password to log in to the database. If empty, read from terminal.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--jars&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Additional jar libraries. By default, &lt;code&gt;target/dependency/jar/*.jar&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--input&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Path of object to import, may be specified multiple times.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--output&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Path to write to in YTsaurus. For every &lt;code&gt;--input&lt;/code&gt; flag, one output must be provided&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;To configure the SPYT cluster started as part of an import operation, use the following arguments:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Argument&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--proxy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Path to the proxy in the YTsaurus cluster where SPYT should run.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--pool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Resource pool in YTsaurus to run SPYT in.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--executor-timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Idle timeout for Spark executors.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--executor-tmpfs-limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Size of tmpfs partition for Spark executors.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--executor-memory&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Amount of RAM to allocate to each executor.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--executor-memory-overhead&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Amount of additional RAM to allocate to executors beyond the primary amount. For example, if the primary memory is 4 GB and the overhead is 2 GB, the total memory requested from the cluster will be 6 GB.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;If you're importing data from S3:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Argument&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--s3-access-key&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Access Key ID identifying the user or app in S3.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--s3-secret-key&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Secret Access Key associated with the access key.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;--s3-endpoint&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Endpoint URL of the S3 storage.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;The following input specifiers are supported:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Specifier&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;hive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Table in Hive, in &lt;code&gt;db_name.table_name&lt;/code&gt; format.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;hive_sql&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;SQL query to run in Hive, in &lt;code&gt;db_name:sql statement&lt;/code&gt; format.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;jdbc&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Table in JDBC database, in &lt;code&gt;db_name.table_name&lt;/code&gt; format.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;jdbc_sql&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;SQL query for JDBC database, in &lt;code&gt;db_name:sql statement&lt;/code&gt; format.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;text&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Text file in HDFS.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parquet&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Parquet file in HDFS.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;orc&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;ORC file in HDFS.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;When writing a table to YTsaurus, the default assumption is that the table doesn't already exist there. If the table does exist, you can overwrite or append it using the &lt;code&gt;overwrite&lt;/code&gt; or &lt;code&gt;append&lt;/code&gt; specifiers. For example: &lt;code&gt;--output overwrite:/path/to/yt&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"type-conversions\"&gt;&lt;a href=\"en/user-guide/import.html#type-conversions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Type conversions&lt;/span&gt;&lt;/a&gt;Type conversions&lt;/h2&gt;\n&lt;p&gt;Importing complex types is only supported partially. The YTsaurus type system doesn't exactly match its counterparts in other storage systems. When importing data, SPYT will try to keep the type on a best-effort basis. However, the value may get converted to a string when no matching type in YTsaurus could be inferred. When necessary, use SQL for proper type conversion.&lt;/p&gt;\n&lt;p&gt;Value ranges for a single type may be different for YTsaurus and other systems. For example, the YTsaurus &lt;code&gt;date&lt;/code&gt; type only stores calendar dates starting with the Unix epoch, January 1, 1970. An attempt to write earlier dates in YTsaurus will cause a runtime error. It is still possible to store earlier dates in YTsaurus as strings (or example, applying a &lt;code&gt;to_char(date_value, 'YYYY-MM-DD')&lt;/code&gt; in PostgreSQL), or as integers (&lt;code&gt;date_value - '1970-01-01'&lt;/code&gt; in PostgreSQL).&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/import.md","sourcePath":"en/user-guide/import.md"},"headings":[{"title":"Installing dependencies","href":"en/user-guide/import.html#dependencies","level":2},{"title":"Importing data","href":"en/user-guide/import.html#how-to-import","level":2,"items":[{"title":"Hive","href":"en/user-guide/import.html#hive","level":3},{"title":"HDFS","href":"en/user-guide/import.html#hdfs","level":3},{"title":"Database systems with JDBC support","href":"en/user-guide/import.html#database-systems-with-jdbc-support","level":3},{"title":"S3","href":"en/user-guide/import.html#s3","level":3}]},{"title":"Arguments","href":"en/user-guide/import.html#script-options","level":2},{"title":"Type conversions","href":"en/user-guide/import.html#type-conversions","level":2}],"title":"Importing data from Hive, S3, MongoDB, and other systems"},"router":{"pathname":"en/user-guide/import","depth":3,"base":"../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
