        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section contains information about accounts and related quotas in the YTsaurus system. A description of the account hierarchy, examples of actions with accounts, and a list of account attributes are given.&lt;/p&gt;\n&lt;h2 id=\"common\"&gt;&lt;a href=\"en/user-guide/storage/accounts.html#common\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General information&lt;/span&gt;&lt;/a&gt;General information&lt;/h2&gt;\n&lt;p&gt;All types of data storage quotas are linked to the project &lt;strong&gt;account&lt;/strong&gt;. An account is a service object in &lt;a href=\"user-guide/storage/cypress.html\"&gt;Cypress&lt;/a&gt;. All accounts have unique names. However, they are located in a separate namespace, so the username and account name may be the same. The account name is stored in the &lt;code&gt;name&lt;/code&gt; attribute which is both readable and writable.&lt;/p&gt;\n&lt;p&gt;All accounts known to the system can be found at &lt;code&gt;//sys/accounts&lt;/code&gt;. You can create and remove accounts using the &lt;code&gt;create&lt;/code&gt; and &lt;code&gt;remove&lt;/code&gt; commands.&lt;/p&gt;\n&lt;h2 id=\"attributes\"&gt;&lt;a href=\"en/user-guide/storage/accounts.html#attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Node attributes&lt;/span&gt;&lt;/a&gt;Node attributes&lt;/h2&gt;\n&lt;p&gt;Each Cypress node has the readable and writable &lt;code&gt;account&lt;/code&gt; attribute. This attribute stores the name of the account to which this node is linked. In the case of files and tables, assigning an account causes its disk quota to be consumed. This takes into account the space physically allocated on the cluster nodes for data storage, so it depends on the replication degree (the &lt;code&gt;replication_factor&lt;/code&gt; attribute), erasure coding method (the &lt;code&gt;erasure_codec&lt;/code&gt; attribute), and the compression utilized (the &lt;code&gt;compression_codec&lt;/code&gt; attribute).&lt;/p&gt;\n&lt;p&gt;Different Cypress nodes (files or tables) can refer to the same chunks. In addition, the same node can refer to a chunk multiple times. Such reuse can occur, for example, as a result of the &lt;code&gt;copy&lt;/code&gt; command for tables and files, as well as the &lt;code&gt;merge&lt;/code&gt; and &lt;code&gt;erase&lt;/code&gt; commands for tables. Such chunks are counted in the quota once (with the maximum replication factor among the tables referring to them).&lt;/p&gt;\n&lt;p&gt;Nodes of all other types (other than files and tables) do not require data storage on cluster nodes and therefore do not consume the disk quota of the account.&lt;/p&gt;\n&lt;p&gt;In case of composite nodes, descendants automatically inherit the parent's account when created (unless otherwise specified). Setting the proper value of the &lt;code&gt;account&lt;/code&gt; attribute on the user's home directory ensures that the tables and files created by the user are assigned to the proper account by default.&lt;/p&gt;\n&lt;p&gt;To find out how many and which resources a given Cypress node consumes, you should use its &lt;code&gt;resource_usage&lt;/code&gt; attribute. There is also a computed &lt;code&gt;recursive_resource_usage&lt;/code&gt; attribute that measures resource usage taking descendants into account. These attributes have the &lt;code&gt;ClusterResources&lt;/code&gt; structure, see below.&lt;/p&gt;\n&lt;p&gt;To assign account &lt;code&gt;A&lt;/code&gt; to a Cypress node, the user who initiated this change must have the &lt;code&gt;use&lt;/code&gt; permission for account &lt;code&gt;A&lt;/code&gt;. It must also have the &lt;code&gt;write&lt;/code&gt; permission. An account for the node can likewise be specified at the time the node is created. In this case, you must also have the &lt;code&gt;use&lt;/code&gt; permission.&lt;/p&gt;\n&lt;p&gt;When you copy Cypress parts with the &lt;code&gt;copy&lt;/code&gt; command or move them with the &lt;code&gt;move&lt;/code&gt; command, the accounts and the owners in the copied subtree change — they become equal to the account associated with the destination folder, and to the user who is copying them, respectively. To prevent changes to an account, use the &lt;code&gt;preserve_account&lt;/code&gt; option.&lt;/p&gt;\n&lt;p&gt;If the user exceeds the account quota for certain resource types, the system starts denying the account further access to the exceeded resource type. This does not mean that an account never exceeds its limits when used. For example, the limits may have been forcibly set below usage. Besides that, disk and chunk quota consumption tracking works asynchronously, which can also result in exceeding allocated limits.&lt;/p&gt;\n&lt;h2 id=\"account_tree\"&gt;&lt;a href=\"en/user-guide/storage/accounts.html#account_tree\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Account hierarchy&lt;/span&gt;&lt;/a&gt;Account hierarchy&lt;/h2&gt;\n&lt;p&gt;Accounts can be nested in other accounts. This enables you to flexibly configure quotas and naturally reflect the organizational structure to which users and projects belong in them. For example, there may be a general organization unit quota and nested project quotas, or a service account and sub-accounts of its constituent groups. The main advantage of representing accounts as a tree is that users are able to manage the quotas assigned to them independently, splitting them into parts and merging them as needed.&lt;/p&gt;\n&lt;p&gt;Further is a description of the hierarchical organization of accounts and the principles of working with this hierarchy — from the command line and the web interface.&lt;/p&gt;\n&lt;h3 id=\"account_tree_algo\"&gt;&lt;a href=\"en/user-guide/storage/accounts.html#account_tree_algo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Quotas&lt;/span&gt;&lt;/a&gt;Quotas&lt;/h3&gt;\n&lt;p&gt;The quota given to any non-topmost account cannot exceed the quota of its parent (and, by induction, any ancestor).&lt;/p&gt;\n&lt;p&gt;By default, the sum of sub-account quotas cannot exceed the parent's quota. But such oversubscription can sometimes be convenient, so it can be enabled:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/account_tree/my_account/@allow_children_limit_overcommit %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"57\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-57\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-57\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-57.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;In this mode, the sum of children's limits can exceed the parent's limit. However, the limit of an individual sub-account must still be less than or equal to the limit of the parent account.&lt;/p&gt;\n&lt;p&gt;The above refers to consumption limits (&lt;code&gt;limits&lt;/code&gt;), not used resources (&lt;code&gt;usage&lt;/code&gt;). Resources used in an account are counted in its quota, as well as in the quotas of all its ancestors. Validation works the same way: if an increase in consumption causes the account or any of its ancestors to run out of quota, an error is generated.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Is it possible to borrow resources in non-leaf accounts?&lt;/strong&gt;&lt;br /&gt;\nIt is technically possible, but it will be more difficult for the user to evaluate where the quota is spent.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Is it true that an account cannot overflow if it does not have the enabled flag that allows overcommit of child accounts?&lt;/strong&gt;&lt;br /&gt;\nIt is true if and only if resources are not used directly in the account.&lt;/p&gt;\n&lt;h3 id=\"account_tree_viewing\"&gt;&lt;a href=\"en/user-guide/storage/accounts.html#account_tree_viewing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Viewing an account tree&lt;/span&gt;&lt;/a&gt;Viewing an account tree&lt;/h3&gt;\n&lt;p&gt;Despite the hierarchical organization, accounts have globally unique names. This fact greatly simplifies working with them, because it enables you to refer to the account without specifying the full path to it.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;In the YTsaurus web interface&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;The account hierarchy is represented on the &lt;strong&gt;Accounts&lt;/strong&gt; page (as well as in the &lt;strong&gt;Dashboard&lt;/strong&gt; section). Due to the global uniqueness of names, when editing the path to an account, you only need to specify its name.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/account_tree_view.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;In the command line&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;The account tree in Cypress is located at &lt;code&gt;//sys/account_tree&lt;/code&gt;. The full flat list is available at &lt;code&gt;//sys/accounts&lt;/code&gt; (account names are globally unique, despite the hierarchical organization).&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt list //sys/account_tree/my_account\nmy_subaccount1\nmy_subaccount2\n\n$ yt list //sys/accounts\nmy_account\nmy_subaccount1\nmy_subaccount2\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"97\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-97\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-97\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-97.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h3 id=\"account_tree_creating\"&gt;&lt;a href=\"en/user-guide/storage/accounts.html#account_tree_creating\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Creating an account&lt;/span&gt;&lt;/a&gt;Creating an account&lt;/h3&gt;\n&lt;p&gt;The maximum allowable account tree height is 10.&lt;/p&gt;\n&lt;p&gt;You can create a topmost account in the YTsaurus web interface by clicking &lt;strong&gt;Create account&lt;/strong&gt; on the &lt;strong&gt;Accounts&lt;/strong&gt; page. You can create nested accounts using the command line or the YTsaurus web interface.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;In the YTsaurus web interface&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;To create a new account, you need to:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;On the &lt;strong&gt;Accounts&lt;/strong&gt; page, click &lt;strong&gt;Create account&lt;/strong&gt;.&lt;/li&gt;\n&lt;li&gt;Specify the name of the new account, the name of the parent account into which the created account will be nested, and the users responsible for the new account. If necessary, you can also request the automatic creation of a home directory corresponding to the account.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;img src=\"images/account_tree_create.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;In the command line&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;To create an account, specify its name in the &lt;code&gt;name&lt;/code&gt; attribute and the parent name in the &lt;code&gt;parent_name&lt;/code&gt; attribute. If no parent name is specified, a topmost account will be created. Only YTsaurus cluster administrators have the right to create topmost accounts.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt create account --attributes=&lt;span class=\"hljs-string\"&gt;'{ name = \"my_subaccount3\"; parent_name = \"my_account\" }'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"142\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-142\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-142\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-142.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h3 id=\"account_tree_removing\"&gt;&lt;a href=\"en/user-guide/storage/accounts.html#account_tree_removing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Removing an account&lt;/span&gt;&lt;/a&gt;Removing an account&lt;/h3&gt;\n&lt;p&gt;Accounts can be moved and renamed, so you should only remove an account when you really do not need it anymore.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Before removing an account, make sure there is no data in it. Otherwise, the account will be put into a special pending state instead of being removed until all associated Cypress nodes are removed, after which it will be removed automatically. You can neither use the account in that state, nor return it to its normal state.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;In the YTsaurus web interface&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;To remove an account, you need to:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;On the &lt;strong&gt;Accounts&lt;/strong&gt; page, find the account in the list and click the pencil icon to edit the account.&lt;/li&gt;\n&lt;li&gt;In the dialog window that opens, go to the &lt;strong&gt;Delete&lt;/strong&gt; section, click &lt;strong&gt;Delete&lt;/strong&gt;, and confirm the action.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;In the command line&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;To remove an account, specify the path to it:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt remove //sys/accounts/my_subaccount3\n\n&lt;span class=\"hljs-comment\"&gt;# или&lt;/span&gt;\n\nyt remove //sys/account_tree/my_account/my_subaccount3\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"191\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-191\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-191\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-191.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h3 id=\"account_tree_moving\"&gt;&lt;a href=\"en/user-guide/storage/accounts.html#account_tree_moving\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Moving or renaming an account&lt;/span&gt;&lt;/a&gt;Moving or renaming an account&lt;/h3&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;In the YTsaurus web interface&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;To move an account you need to:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;On the &lt;strong&gt;Accounts&lt;/strong&gt; page, find the account in the list and click the pencil icon to edit the account.&lt;/li&gt;\n&lt;li&gt;In the dialog window that opens, in the &lt;strong&gt;General&lt;/strong&gt; section, in the &lt;strong&gt;Parent&lt;/strong&gt; drop-down list, select where to move the account.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;In the command line&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;There are two ways to move an account:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Moving an account using the &lt;code&gt;parent_name&lt;/code&gt; attribute.&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/account_tree/my_account/my_subaccount3/@parent_name my_subaccount2\n$ yt exists //sys/account_tree/my_account/my_subaccount3\n%&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;\n$ yt exists //sys/account_tree/my_account/my_subaccount2/my_subaccount3\n%&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"234\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-234\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-234\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-234.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Due to the global uniqueness of account names, you only need to specify the name of the parent, not the full path to it.&lt;/p&gt;\n&lt;ol start=\"2\" style=\"--hier-list-start:1\"&gt;\n&lt;li&gt;Moving an account using the &lt;code&gt;move&lt;/code&gt; command.&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt move //sys/account_tree/my_account/my_subaccount3 //sys/account_tree/my_account/my_subaccount2/my_subaccount3\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"245\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-245\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-245\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-245.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Note that the full path to the account, including its name, is specified as the destination path. In particular, this enables you to rename an account at the same time as you move it.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h3 id=\"account_tree_transferring_resources\"&gt;&lt;a href=\"en/user-guide/storage/accounts.html#account_tree_transferring_resources\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Transferring resources from one account to another&lt;/span&gt;&lt;/a&gt;Transferring resources from one account to another&lt;/h3&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;In the YTsaurus web interface&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;To transfer resources, you need to:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;On the &lt;strong&gt;Accounts&lt;/strong&gt; page, find the account to which you want to transfer resources and click the pencil icon to edit the account.&lt;/li&gt;\n&lt;li&gt;In the dialog window that opens, open the section corresponding to the type of resource that you want to transfer.&lt;/li&gt;\n&lt;li&gt;Specify the account from which to reallocate resources (the parent account is suggested by default) and the new limit.&lt;/li&gt;\n&lt;li&gt;Click &lt;strong&gt;Save&lt;/strong&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;img src=\"images/account_tree_transfer_resources.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;In the command line&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Transferring account resources using the &lt;code&gt;transfer-account-resources&lt;/code&gt; command:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# yt transfer-account-resources &amp;lt;src_account&amp;gt; &amp;lt;dst_account&amp;gt; --resource-delta &amp;lt;resource_delta&amp;gt;&lt;/span&gt;\nyt transfer-account-resources my_subaccount1 my_subaccount2 --resource-delta &lt;span class=\"hljs-string\"&gt;'{node_count=10}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"297\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-297\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-297\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-297.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The &lt;code&gt;resource-delta&lt;/code&gt; argument is a YSON structure of the &lt;code&gt;ClusterResources&lt;/code&gt; type (see below). For example: &lt;code&gt;{node_count=5;disk_space_per_medium={default=1024}}&lt;/code&gt;. You need to specify the amount of resources to be transferred, not the new limits. Missing quotas can be skipped.&lt;/p&gt;\n&lt;p&gt;In case of the &lt;code&gt;argument command: invalid choice&lt;/code&gt; error, update the &lt;code&gt;yt&lt;/code&gt; utility. For more information, see &lt;a href=\"overview/try-yt.html\"&gt;Try YTsaurus&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"builtin_accounts\"&gt;&lt;a href=\"en/user-guide/storage/accounts.html#builtin_accounts\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Built-in accounts&lt;/span&gt;&lt;/a&gt;Built-in accounts&lt;/h2&gt;\n&lt;p&gt;These accounts appear in the system at the moment of initialization. They cannot be removed.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The &lt;code&gt;tmp&lt;/code&gt; account. During initialization, it is assigned to the &lt;code&gt;//tmp&lt;/code&gt; folder and therefore to all its descendants. By default, all authenticated users of the system (the &lt;code&gt;users&lt;/code&gt; group) have the right to use this account.&lt;/li&gt;\n&lt;li&gt;The &lt;code&gt;sys&lt;/code&gt; account. During initialization, it is assigned to all other nodes. By default, no explicit permissions to use it are given to anyone. The account is used for the internal needs of the YTsaurus system.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"account_attributes\"&gt;&lt;a href=\"en/user-guide/storage/accounts.html#account_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Account attributes&lt;/span&gt;&lt;/a&gt;Account attributes&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Attribute&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;name&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Account name (non-empty string)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;parent_name&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;Parent account name&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;resource_limits&lt;/td&gt;\n&lt;td&gt;ClusterResources&lt;/td&gt;\n&lt;td&gt;Resource limits for the account&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;allow_children_limit_overcommit&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Whether the sum of sub-account limits can exceed the limit of this account (see above)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;resource_usage&lt;/td&gt;\n&lt;td&gt;ClusterResources&lt;/td&gt;\n&lt;td&gt;Resources occupied directly by this account (including uncommitted transactions)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;committed_resource_usage&lt;/td&gt;\n&lt;td&gt;ClusterResources&lt;/td&gt;\n&lt;td&gt;Resources occupied directly by this account (without taking into account active transactions)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;recursive_resource_usage&lt;/td&gt;\n&lt;td&gt;ClusterResources&lt;/td&gt;\n&lt;td&gt;Resources occupied by this subtree of accounts (including uncommitted transactions)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;recursive_committed_resource_usage&lt;/td&gt;\n&lt;td&gt;ClusterResources&lt;/td&gt;\n&lt;td&gt;Resources occupied by this subtree of accounts (without taking into account active transactions)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;violated_resource_limits&lt;/td&gt;\n&lt;td&gt;ViolatedClusterResources&lt;/td&gt;\n&lt;td&gt;Resource excess flags for the account&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;recursive_violated_resource_limits&lt;/td&gt;\n&lt;td&gt;RecursiveViolatedClusterResources&lt;/td&gt;\n&lt;td&gt;For each resource type — the number of accounts that exceeded the limit in this subtree&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;code&gt;ClusterResources&lt;/code&gt; is the following structure:&lt;/p&gt;\n&lt;h3 id=\"the-clusterresources-structure\"&gt;&lt;a href=\"en/user-guide/storage/accounts.html#the-clusterresources-structure\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;The ClusterResources structure&lt;/span&gt;&lt;/a&gt;The ClusterResources structure&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Attribute&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;disk_space&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Total disk space in bytes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;disk_space_per_medium&lt;/td&gt;\n&lt;td&gt;string-&amp;gt;integer&lt;/td&gt;\n&lt;td&gt;Disk space in bytes (for each medium)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;node_count&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Number of Cypress nodes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;master_memory&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Amount of consumed master server RAM&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;chunk_count&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Number of chunks&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tablet_count&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Number of tablets&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tablet_static_memory&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;Memory volume for dynamic tables loaded into memory&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;The &lt;code&gt;disk_space&lt;/code&gt; field is read-only. To change the limits, change the values of the &lt;code&gt;disk_space_per_medium&lt;/code&gt; dict.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;ViolatedClusterResources&lt;/code&gt; is the following structure:&lt;/p&gt;\n&lt;h3 id=\"the-violatedclusterresources-structure\"&gt;&lt;a href=\"en/user-guide/storage/accounts.html#the-violatedclusterresources-structure\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;The ViolatedClusterResources structure&lt;/span&gt;&lt;/a&gt;The ViolatedClusterResources structure&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Attribute&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;disk_space&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;Whether the disk space limit is exceeded for at least one medium&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;disk_space_per_medium&lt;/td&gt;\n&lt;td&gt;string-&amp;gt;boolean&lt;/td&gt;\n&lt;td&gt;Whether the disk space limit is exceeded (for each medium)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;node_count&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;Whether the limit on the number of Cypress nodes is exceeded&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;chunk_count&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;Whether the limit on the number of chunks is exceeded&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tablet_count&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;Whether the limit on the number of tablets is exceeded&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tablet_static_memory&lt;/td&gt;\n&lt;td&gt;boolean&lt;/td&gt;\n&lt;td&gt;Whether the limit on the memory volume occupied by dynamic tables loaded into memory is exceeded&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;code&gt;RecursiveViolatedClusterResources&lt;/code&gt; is the following structure:&lt;/p&gt;\n&lt;h3 id=\"the-recursiveviolatedclusterresources-structure\"&gt;&lt;a href=\"en/user-guide/storage/accounts.html#the-recursiveviolatedclusterresources-structure\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;The RecursiveViolatedClusterResources structure&lt;/span&gt;&lt;/a&gt;The RecursiveViolatedClusterResources structure&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Attribute&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;disk_space&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;The number of accounts in the subtree that have exceeded the disk space limit for at least one medium&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;disk_space_per_medium&lt;/td&gt;\n&lt;td&gt;string-&amp;gt;integer&lt;/td&gt;\n&lt;td&gt;The number of accounts in the subtree that have exceeded the disk space limit (for each medium)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;node_count&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;The number of accounts in the subtree that have exceeded the limit on the number of Cypress nodes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;chunk_count&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;The number of accounts in the subtree that have exceeded the limit on the number of chunks&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tablet_count&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;The number of accounts in the subtree that have exceeded the limit on the number of tablets&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tablet_static_memory&lt;/td&gt;\n&lt;td&gt;integer&lt;/td&gt;\n&lt;td&gt;The number of accounts in the subtree that have exceeded the limit on the memory volume occupied by dynamic tables loaded into memory&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/storage/accounts.md","sourcePath":"en/user-guide/storage/accounts.md"},"headings":[{"title":"General information","href":"en/user-guide/storage/accounts.html#common","level":2},{"title":"Node attributes","href":"en/user-guide/storage/accounts.html#attributes","level":2},{"title":"Account hierarchy","href":"en/user-guide/storage/accounts.html#account_tree","level":2,"items":[{"title":"Quotas","href":"en/user-guide/storage/accounts.html#account_tree_algo","level":3},{"title":"Viewing an account tree","href":"en/user-guide/storage/accounts.html#account_tree_viewing","level":3},{"title":"Creating an account","href":"en/user-guide/storage/accounts.html#account_tree_creating","level":3},{"title":"Removing an account","href":"en/user-guide/storage/accounts.html#account_tree_removing","level":3},{"title":"Moving or renaming an account","href":"en/user-guide/storage/accounts.html#account_tree_moving","level":3},{"title":"Transferring resources from one account to another","href":"en/user-guide/storage/accounts.html#account_tree_transferring_resources","level":3}]},{"title":"Built-in accounts","href":"en/user-guide/storage/accounts.html#builtin_accounts","level":2},{"title":"Account attributes","href":"en/user-guide/storage/accounts.html#account_attributes","level":2,"items":[{"title":"The ClusterResources structure","href":"en/user-guide/storage/accounts.html#the-clusterresources-structure","level":3},{"title":"The ViolatedClusterResources structure","href":"en/user-guide/storage/accounts.html#the-violatedclusterresources-structure","level":3},{"title":"The RecursiveViolatedClusterResources structure","href":"en/user-guide/storage/accounts.html#the-recursiveviolatedclusterresources-structure","level":3}]}],"title":"Accounts"},"router":{"pathname":"en/user-guide/storage/accounts","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
