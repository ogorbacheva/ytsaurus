        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section provides information on replication and erasure coding as data storage redundancy mechanisms. These mechanisms protect distributed systems from data loss in the event of a hardware fault.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Replication_(computing)\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Replication&lt;/a&gt; requires a lot of disk space but not a lot of computational power (CPU).&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Erasure_code\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Erasure coding&lt;/a&gt; requires a lot of computational power and less disk space.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;replication_factor&lt;/code&gt; attribute defines the replication factor while the &lt;code&gt;erasure_codec&lt;/code&gt; attribute controls the type of erasure codec used.&lt;/p&gt;\n&lt;h2 id=\"replication\"&gt;&lt;a href=\"en/user-guide/storage/replication.html#replication\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Replication&lt;/span&gt;&lt;/a&gt;Replication&lt;/h2&gt;\n&lt;p&gt;For replication, the &lt;code&gt;erasure_codec&lt;/code&gt; value is equal to &lt;code&gt;none&lt;/code&gt; while the &lt;code&gt;replication_factor&lt;/code&gt; determines the number of chunk replicas. To provide &lt;strong&gt;rack awareness&lt;/strong&gt;, each replica occupies a separate &lt;strong&gt;rack&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Chunks remain available for reading even if all replicas but one are lost. For most scenarios, we recommend a &lt;code&gt;replication_factor&lt;/code&gt; of 3, as smaller values could lead to data losses.&lt;/p&gt;\n&lt;p&gt;To change the replication factor, set the &lt;code&gt;replication_factor&lt;/code&gt; attribute. The system will automatically create the required additional number of chunks or delete those no longer needed.&lt;/p&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/your_new_file/@replication_factor 6\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"27\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-27\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-27\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-27.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"erasure\"&gt;&lt;a href=\"en/user-guide/storage/replication.html#erasure\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Erasure coding&lt;/span&gt;&lt;/a&gt;Erasure coding&lt;/h2&gt;\n&lt;p&gt;Erasure coding is a data storage method that saves space as compared to replication. Erasure coding also helps store data more reliably since it can survive the loss of any three cluster nodes whereas triple replication can only survive the loss of any two.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;ul&gt;\n&lt;li&gt;We strongly advise against using erasure coding to store foreign tables for &lt;code&gt;joint reduce&lt;/code&gt; and &lt;code&gt;reduce with foreign tables&lt;/code&gt; operations if these tables are much smaller than the primary ones. While these operations are running, jobs will overload cluster nodes hosting the foreign table chunks with requests. This is less of a problem with simple &lt;code&gt;reduce&lt;/code&gt; that has many more running jobs than input table chunks.&lt;/li&gt;\n&lt;li&gt;For latency-sensitive processes, it may not be possible to use erasure coding.&lt;/li&gt;\n&lt;li&gt;There is no point in using erasure coding for small amounts of data since there will be no significant gain.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;The &lt;code&gt;replication_factor&lt;/code&gt; attribute does not affect erasure chunks. A single copy of the data is stored.&lt;br /&gt;\nThere might be situations when a table stores both erasure and regular chunks. These tables may result from &lt;code&gt;merge&lt;/code&gt; operations.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;erasure_codec&lt;/code&gt; shows the type of erasure codec used. The types listed in the table are supported.&lt;br /&gt;\nIf you edit the attribute, the method of writing new data will change. At the same time, old data will remain unchanged.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Codec&lt;/th&gt;\n&lt;th&gt;Algorithm&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;th&gt;Size on disk as compared to compressed data.&lt;/th&gt;\n&lt;th&gt;Recovery cost.&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;isa_reed_solomon_6_3&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Uses the &lt;a href=\"https://en.wikipedia.org/wiki/Reed-Solomon_error_correction\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Reed-Solomon codes&lt;/a&gt;.&lt;/td&gt;\n&lt;td&gt;When writing an erasure chunk, data are split into 6 data parts. Three control parts are generated for recovery.&lt;/td&gt;\n&lt;td&gt;1.5x&lt;/td&gt;\n&lt;td&gt;The recovery cost is high in CPU resources and time.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;isa_lrc_12_2_2&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Uses &lt;a href=\"https://www.microsoft.com/en-us/research/publication/erasure-coding-in-windows-azure-storage/?from=http%3A%2F%2Fresearch.microsoft.com%2Fpubs%2F179583%2Flrc12-cheng%2520webpage.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Local Reconstruction Codes (LRC)&lt;/a&gt; that are a variation on the Reed-Solomon codes.&lt;/td&gt;\n&lt;td&gt;When writing an erasure chunk, the data is split into 12 parts. Two xor parts are computed: for the first 6 parts containing data, and for the other 6 parts. Two further control parts are computed for recovery using an algorithm similar to Reed-Solomon (erasure parts). This is the recommended option for all cases where erasure coding is required.&lt;/td&gt;\n&lt;td&gt;1.33x&lt;/td&gt;\n&lt;td&gt;The recovery cost is moderate in CPU resources and time.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;In both cases, the system is able to survive the loss of any three cluster nodes.&lt;br /&gt;\nThe system attempts to write each chunk part to a separate &lt;strong&gt;rack&lt;/strong&gt; to provide &lt;strong&gt;rack awareness&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Erasure coding has the following weaknesses:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Even after the loss of a single cluster node, the system will have to start background recovery to maintain failure tolerance. A different number of parts are required for recovery. Thus, &lt;code&gt;isa_reed_solomon_6_3&lt;/code&gt; requires 6 separate parts. The recovery process is automatic but needs CPU and takes time: between 10 and 60 minutes.&lt;/li&gt;\n&lt;li&gt;Reading may be slow since the data has one physical replica. In fact, a read has nothing to choose from, and if the only cluster node hosting the data part being read is very busy for whatever reason, then reading will be slow. If a part cannot be read for a long time, the system will recover this part on the client (&lt;strong&gt;read recovery&lt;/strong&gt;), which will require extra time and computational power. When using replication, the system selects the least busy replica for reading.&lt;/li&gt;\n&lt;li&gt;A data write is an operation that has a high cost in terms of RAM usage. For reference, by default, a table write that uses replication requires 100 MB of RAM while an erasure coding table write needs 1500 MB.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"erasure_usage\"&gt;&lt;a href=\"en/user-guide/storage/replication.html#erasure_usage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Using erasure coding&lt;/span&gt;&lt;/a&gt;Using erasure coding&lt;/h3&gt;\n&lt;p&gt;To begin taking advantage of erasure coding, use the &lt;code&gt;transform&lt;/code&gt; command.&lt;br /&gt;\nThis command is a client-side wrapper for &lt;code&gt;merge&lt;/code&gt;. The command automatically selects &lt;code&gt;data_weight_per_job&lt;/code&gt; as well as other parameters and starts a &lt;code&gt;merge&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-tabs\" data-diplodoc-group=\"defaultTabsGroup-0f5a52do\" data-diplodoc-variant=\"regular\"&gt;\n&lt;div class=\"yfm-tab-list\" role=\"tablist\"&gt;\n&lt;div data-diplodoc-id=\"cli\" data-diplodoc-key=\"cli\" class=\"yfm-tab yfm-tab-group active\" role=\"tab\" tabindex=\"0\" data-diplodoc-is-active=\"true\"&gt;CLI&lt;/div&gt;\n&lt;div data-diplodoc-id=\"python\" data-diplodoc-key=\"python\" class=\"yfm-tab yfm-tab-group\" role=\"tab\" tabindex=\"-1\" data-diplodoc-is-active=\"false\"&gt;Python&lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"k9gad006\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"CLI\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt transform --src //path/to/table --dst //path/to/table --erasure-codec reed_solomon_6_3 --compression-codec brotli_6\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"160\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-160\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-160\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-160.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"frj65lsu\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"Python\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\nyt.transform(src, dst, erasure_codec=erasure_codec, ...)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"163\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-163\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-163\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-163.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;p&gt;To force the operation, run &lt;code&gt;merge&lt;/code&gt; manually with &lt;code&gt;force_transform=%true&lt;/code&gt; after configuring the required codes for the output table.&lt;br /&gt;\n&lt;code&gt;N&lt;/code&gt; is specified in bytes. You must select its size to have the compressed chunk take up over 500 MB.&lt;/p&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //path/to/table/@erasure_codec isa_reed_solomon_6_3\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //path/to/table/@compression_codec brotli_6\nyt merge --src //path/to/table --dst //path/to/table --spec &lt;span class=\"hljs-string\"&gt;'{force_transform = %true;data_weight_per_job=N}\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"172\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-172\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-172\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-172.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Data encoding settings are contained in the table attributes. To view them, run the command below:&lt;/p&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt get //path/to/table/@erasure_codec\nyt get //path/to/table/@compression_codec\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"179\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-179\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-179\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-179.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Changing the attribute affects the way new data will be written to the table. At the same time, old data will remain unchanged. To find out the table's data storage format, run the commands below:&lt;/p&gt;\n&lt;p&gt;CLI&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt get //path/to/table/@erasure_statistics\nyt get //path/to/table/@compression_statistics\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"186\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-186\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-186\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-186.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/storage/replication.md","sourcePath":"en/user-guide/storage/replication.md"},"headings":[{"title":"Replication","href":"en/user-guide/storage/replication.html#replication","level":2},{"title":"Erasure coding","href":"en/user-guide/storage/replication.html#erasure","level":2,"items":[{"title":"Using erasure coding","href":"en/user-guide/storage/replication.html#erasure_usage","level":3}]}],"title":"Replication and erasure coding"},"router":{"pathname":"en/user-guide/storage/replication","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
