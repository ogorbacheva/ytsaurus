            {"data":{"leading":false,"html":"&lt;p&gt;The first part of this section describes the skiff serialization library (&lt;code&gt;yt/core/skiff&lt;/code&gt;) which helps encode structured data, including data that is not YTsaurus tables.&lt;br /&gt;\nThe second part describes the use of the library efficiently to exchange table data between job_proxy and user code.&lt;/p&gt;\n&lt;p&gt;Skiff (from schemaful format) is an interchange &lt;a href=\"user-guide/storage/formats.html\"&gt;format&lt;/a&gt; to communicate schematized data between job_proxy and a job.&lt;/p&gt;\n&lt;p&gt;Format objectives:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Optimize data serialization and deserialization performance for schematized data.&lt;/li&gt;\n&lt;li&gt;Support all the types supported by YTsaurus.&lt;/li&gt;\n&lt;li&gt;Support the reading of tables even if not strongly typed.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"comparison-with-other-formats\"&gt;&lt;a href=\"en/user-guide/storage/skiff.html#comparison-with-other-formats\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Comparison with other formats&lt;/span&gt;&lt;/a&gt;Comparison with other formats&lt;/h2&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;protobuf&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Protobuf has the following drawbacks:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;For some clients (YQL), message structure is defined at runtime. Protobuf is inconvenient to parse and write for an unknown type.&lt;/li&gt;\n&lt;li&gt;Protobuf supports backward compatibility. This results in tags that have to be maintained current.&lt;/li&gt;\n&lt;li&gt;Protobuf field order is not specified. This produces extra branches for tags on each field.&lt;/li&gt;\n&lt;li&gt;Protobuf frequently uses type varint. For job_proxy that talks to a job via a pipe, it is less costly to write a uint64 number than serialize and deserialize a varint.&lt;/li&gt;\n&lt;li&gt;Because of varint, strings and nested messages are prefixed with length. To serialize a message, you need to walk a structure twice.&lt;/li&gt;\n&lt;li&gt;In protobuf, repeated fields do not have to be contained in one part of a message: the start of a list can be at the top of a message, and the end at the bottom. This complicates the writing of proper parsers.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;flatbuffers&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;ul&gt;\n&lt;li&gt;For some clients (YQL), message structure is defined at runtime. Flatbuffers is inconvenient to parse and write for an unknown type because there is no reflection.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"skiff-serialization-library\"&gt;&lt;a href=\"en/user-guide/storage/skiff.html#skiff-serialization-library\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Skiff serialization library&lt;/span&gt;&lt;/a&gt;Skiff serialization library&lt;/h2&gt;\n&lt;p&gt;The skiff serialization format is schematized. To be able to read and interpret data, you need to know the data schema.&lt;/p&gt;\n&lt;h3 id=\"skiff-schema\"&gt;&lt;a href=\"en/user-guide/storage/skiff.html#skiff-schema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Skiff Schema&lt;/span&gt;&lt;/a&gt;Skiff Schema&lt;/h3&gt;\n&lt;p&gt;A schema describes the structure of an encoded value and the encoding method.&lt;br /&gt;\nIt is a tree-like structure. A single-node tree could be a valid schema. The order or a node's children in a tree is important. Each node's coding type is &lt;code&gt;wire_type&lt;/code&gt;, leaves have simple types whereas the other tree nodes have compound types. Nodes of a skiff schema may have names, which do not affect data encoding and serve to map a skiff schema to that of a table.&lt;/p&gt;\n&lt;h4 id=\"simple-types\"&gt;&lt;a href=\"en/user-guide/storage/skiff.html#simple-types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Simple types&lt;/span&gt;&lt;/a&gt;Simple types&lt;/h4&gt;\n&lt;h5 id=\"nothing\"&gt;&lt;a href=\"en/user-guide/storage/skiff.html#nothing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nothing&lt;/span&gt;&lt;/a&gt;Nothing&lt;/h5&gt;\n&lt;p&gt;&lt;code&gt;nothing&lt;/code&gt;: no value, special type that can only be used as a child of the &lt;code&gt;Variant*&lt;/code&gt; / &lt;code&gt;RepeatedVariant*&lt;/code&gt; compound types.&lt;br /&gt;\nEncoded as an empty string.&lt;/p&gt;\n&lt;h5 id=\"boolean\"&gt;&lt;a href=\"en/user-guide/storage/skiff.html#boolean\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boolean&lt;/span&gt;&lt;/a&gt;Boolean&lt;/h5&gt;\n&lt;p&gt;&lt;code&gt;boolean&lt;/code&gt;: Boolean type.&lt;br /&gt;\n&lt;u&gt;Encoded&lt;/u&gt; with a single byte: &lt;code&gt;001&lt;/code&gt; for &lt;code&gt;true&lt;/code&gt;, &lt;code&gt;000&lt;/code&gt; for &lt;code&gt;false&lt;/code&gt;.&lt;br /&gt;\n&lt;u&gt;Examples&lt;/u&gt;: &lt;code&gt;\\x01&lt;/code&gt;, &lt;code&gt;\\x00&lt;/code&gt;.&lt;/p&gt;\n&lt;h5 id=\"int64-/-uint64\"&gt;&lt;a href=\"en/user-guide/storage/skiff.html#int64-/-uint64\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Int64 / Uint64&lt;/span&gt;&lt;/a&gt;Int64 / Uint64&lt;/h5&gt;\n&lt;p&gt;&lt;code&gt;uint64&lt;/code&gt; / &lt;code&gt;int64&lt;/code&gt;: integers.&lt;br /&gt;\n&lt;u&gt;Encoded&lt;/u&gt; with an 8-byte number in little-endian format.&lt;br /&gt;\n&lt;u&gt;Examples&lt;/u&gt;: &lt;code&gt;\\x2a\\x00\\x00\\x00\\x00\\x00\\x00\\x00&lt;/code&gt; (42), &lt;code&gt;\\x94\\x88\\x01\\x00\\x00\\x00\\x00\\x00&lt;/code&gt; (100500).&lt;/p&gt;\n&lt;h5 id=\"double\"&gt;&lt;a href=\"en/user-guide/storage/skiff.html#double\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Double&lt;/span&gt;&lt;/a&gt;Double&lt;/h5&gt;\n&lt;p&gt;&lt;code&gt;double&lt;/code&gt;: 8-byte representation of a double.&lt;br /&gt;\n&lt;u&gt;Example&lt;/u&gt;: &lt;code&gt;\\x9B\\x91\\x04\\x8B\\x0A\\xBF\\x05\\x40&lt;/code&gt; (2.718281828).&lt;/p&gt;\n&lt;h5 id=\"string32\"&gt;&lt;a href=\"en/user-guide/storage/skiff.html#string32\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;String32&lt;/span&gt;&lt;/a&gt;String32&lt;/h5&gt;\n&lt;p&gt;&lt;code&gt;string32&lt;/code&gt;: string length encoded as a 32-bit uint in little-endian format, followed by the string itself.&lt;br /&gt;\n&lt;u&gt;Example&lt;/u&gt;:&lt;code&gt;\\x06\\x00\\x00\\x00foobar&lt;/code&gt;&lt;/p&gt;\n&lt;h5 id=\"yson32\"&gt;&lt;a href=\"en/user-guide/storage/skiff.html#yson32\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yson32&lt;/span&gt;&lt;/a&gt;Yson32&lt;/h5&gt;\n&lt;p&gt;&lt;code&gt;yson32&lt;/code&gt;: value of an arbitrary type.&lt;br /&gt;\nThe length of the encoded YSON is encoded as a 32-bit uint followed by the encoded YSON itself.&lt;br /&gt;\n&lt;u&gt;Examples&lt;/u&gt;: &lt;code&gt;\\x09\\x00\\x00\\x00{foo=bar}&lt;/code&gt;, &lt;code&gt;\\x07\\x00\\x00\\x00100500u&lt;/code&gt;&lt;/p&gt;\n&lt;h4 id=\"compound-types\"&gt;&lt;a href=\"en/user-guide/storage/skiff.html#compound-types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Compound types&lt;/span&gt;&lt;/a&gt;Compound types&lt;/h4&gt;\n&lt;h5 id=\"variant8-/-variant16\"&gt;&lt;a href=\"en/user-guide/storage/skiff.html#variant8-/-variant16\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Variant8 / variant16&lt;/span&gt;&lt;/a&gt;Variant8 / variant16&lt;/h5&gt;\n&lt;p&gt;&lt;code&gt;variant8&lt;/code&gt; / &lt;code&gt;variant16&lt;/code&gt;: algebraic data types.&lt;/p&gt;\n&lt;p&gt;Encoded by an 8-bit (for &lt;code&gt;variant8&lt;/code&gt;) or a 16-bit (for &lt;code&gt;variant16&lt;/code&gt;) unsigned number (&lt;code&gt;i&lt;/code&gt; tag) followed by a value described by the child node type at &lt;code&gt;i&lt;/code&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;variant8&lt;/code&gt; / &lt;code&gt;variant16&lt;/code&gt; can have type &lt;code&gt;nothing&lt;/code&gt; as one of its nodes. Since type &lt;code&gt;nothing&lt;/code&gt; is encoded by an empty string, string &lt;code&gt;\\x00&lt;/code&gt; is a valid value of type &lt;code&gt;variant8&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Bit depths depend on practical considerations. The variant tag will indicate the presence or the absence of a value or a table index.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h5 id=\"repeatedvariant8-/-repeatedvariant16\"&gt;&lt;a href=\"en/user-guide/storage/skiff.html#repeatedvariant8-/-repeatedvariant16\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RepeatedVariant8 / RepeatedVariant16&lt;/span&gt;&lt;/a&gt;RepeatedVariant8 / RepeatedVariant16&lt;/h5&gt;\n&lt;p&gt;&lt;code&gt;repeated_variant8&lt;/code&gt; / &lt;code&gt;repeated_variant16&lt;/code&gt;: variant list.&lt;br /&gt;\nEncoded with an 8-bit (for &lt;code&gt;repeated_variant8&lt;/code&gt;) or a 16-bit (for &lt;code&gt;repeated_variant16&lt;/code&gt;) tag as a continuous sequence of variants ending with special tag &lt;code&gt;0xFF&lt;/code&gt; (for &lt;code&gt;repeated_variant8&lt;/code&gt;) or &lt;code&gt;0xFFFF&lt;/code&gt; (for &lt;code&gt;repeated_variant16&lt;/code&gt;) that indicates the sequence end.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Like the regular &lt;code&gt;variant8&lt;/code&gt;, can have type &lt;code&gt;nothing&lt;/code&gt; as one of its child nodes.&lt;/li&gt;\n&lt;li&gt;The type's bit depth depends on practical considerations based on the need to define a transmission format for table data (essentially, the variant tag will be used as a sparse column index).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h5 id=\"tuple\"&gt;&lt;a href=\"en/user-guide/storage/skiff.html#tuple\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tuple&lt;/span&gt;&lt;/a&gt;Tuple&lt;/h5&gt;\n&lt;p&gt;&lt;code&gt;tuple&lt;/code&gt;: fixed-size tuple of values.&lt;br /&gt;\nEncoded as a series of values, the first of the same type as the first child node, the second the same type as the second child node, and so on.&lt;/p&gt;\n&lt;h2 id=\"using-the-skiff-serialization-library-to-transmit-table-data\"&gt;&lt;a href=\"en/user-guide/storage/skiff.html#using-the-skiff-serialization-library-to-transmit-table-data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Using the skiff serialization library to transmit table data&lt;/span&gt;&lt;/a&gt;Using the skiff serialization library to transmit table data&lt;/h2&gt;\n&lt;h3 id=\"skiff-schema-of-a-table\"&gt;&lt;a href=\"en/user-guide/storage/skiff.html#skiff-schema-of-a-table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Skiff schema of a table&lt;/span&gt;&lt;/a&gt;Skiff schema of a table&lt;/h3&gt;\n&lt;p&gt;A format's attributes for each table to be transmitted are used to send a table skiff schema (&lt;code&gt;table_skiff_schema&lt;/code&gt;). This is a skiff schema with a number of constraints.&lt;/p&gt;\n&lt;p&gt;Input and output format behavior is different. The input format concatenates all tables and transmits them through the same pipe whereas the output format reads each table from its own pipe.&lt;/p&gt;\n&lt;p&gt;A job receives values with the general schema as its input. The general schema has a &lt;code&gt;Variant16&lt;/code&gt; node at its root with all the table skiff schemas as children.&lt;br /&gt;\nFrom the output stream of the i-th output table, job_proxy attempts to read values described by the schema with the &lt;code&gt;Variant16&lt;/code&gt; root node with the skiff schema of the i-th table as the only child.&lt;/p&gt;\n&lt;h3 id=\"limitations-of-a-tables-skiff-schema\"&gt;&lt;a href=\"en/user-guide/storage/skiff.html#limitations-of-a-tables-skiff-schema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Limitations of a table's skiff schema.&lt;/span&gt;&lt;/a&gt;Limitations of a table's skiff schema.&lt;/h3&gt;\n&lt;p&gt;The following limitations exist on a schema for transmitting table data:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;A node of type &lt;code&gt;tuple&lt;/code&gt; must serve as the root node of a table's skiff schema.&lt;/li&gt;\n&lt;li&gt;All the children of the root node of a table's skiff schema must be named. YTsaurus uses them to determine which field to use for values from this or that column.&lt;/li&gt;\n&lt;li&gt;The names of the children of a table skiff schema root node may include special names that start with &lt;code&gt;$&lt;/code&gt;. Those children whose names do not begin with this character make up the set of dense nodes. These are the names of columns whose values will be placed in these fields.&lt;/li&gt;\n&lt;li&gt;The children of the root node of a table's skiff schema may include a node named &lt;code&gt;$other_columns&lt;/code&gt;. This node must be of type &lt;code&gt;yson32&lt;/code&gt; and be the last one.&lt;/li&gt;\n&lt;li&gt;The children of the root node of a table's skiff schema may include a node named &lt;code&gt;$sparse_columns&lt;/code&gt;. This node must be of type &lt;code&gt;RepeatedVariant16&lt;/code&gt;. Its children make up the set of sparse nodes and must also be named. The &lt;code&gt;$sparse_columns&lt;/code&gt; node must be the one before last if &lt;code&gt;$other_columns&lt;/code&gt; exists or must come last otherwise.&lt;/li&gt;\n&lt;li&gt;The children of the root node of a table's skiff schema may include a node specially named &lt;code&gt;$key_switch&lt;/code&gt;, which must be of type &lt;code&gt;boolean&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;The children of the root node of a table's skiff schema may include nodes specially named &lt;code&gt;$row_index / $range_index&lt;/code&gt;. They must be of type &lt;code&gt;variant8&amp;lt;nothing;int64&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;All the dense nodes must have a schema that:\n&lt;ul&gt;\n&lt;li&gt;Either describes a simple type, such as &lt;code&gt;int64, uint64, boolean, double, string32, yson32&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Or describes type &lt;code&gt;variant8&amp;lt;nothing; TYPE;&amp;gt;&lt;/code&gt;, where TYPE is a simple type, such as &lt;code&gt;int64, uint64, boolean, double, string32, yson32&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;All the sparse nodes must have a schema that describes a simple type, such as &lt;code&gt;int64, uint64, boolean, double, string32, yson32&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;When you serialize a table row, for every value, you need to find a dense or a sparse node with the same name as the name of a column.&lt;br /&gt;\nValues described by dense nodes are always serialized as required by the skiff schema's root node (tuple). If there is no value for a dense node or if such a value is of type &lt;code&gt;NULL&lt;/code&gt;, the corresponding dense node in the skiff schema must be of type &lt;code&gt;variant8&lt;/code&gt;.&lt;br /&gt;\nValues described by the sparse part are only serialized if present and of type other than &lt;code&gt;NULL&lt;/code&gt;. They find their way into the &lt;code&gt;$sparse_columns&lt;/code&gt; field as a list.&lt;/p&gt;\n&lt;p&gt;Those table row values that fail to be included in the dense or the sparse part, are sent to the &lt;code&gt;$other_columns&lt;/code&gt; column. This column will store a yson map containing such values. Having no &lt;code&gt;$other_columns&lt;/code&gt; column in the presence of a value not described in the dense or the sparse part will generate an error.&lt;/p&gt;\n&lt;h3 id=\"format-configuration\"&gt;&lt;a href=\"en/user-guide/storage/skiff.html#format-configuration\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Format configuration&lt;/span&gt;&lt;/a&gt;Format configuration&lt;/h3&gt;\n&lt;p&gt;You describe the skiff format with attributes, same as other formats. The attributes must include the &lt;code&gt;table_skiff_schemas&lt;/code&gt; key with a list of table skiff schema descriptions. In addition, there may be a key called &lt;code&gt;skiff_schema_registry&lt;/code&gt;. If it is there, it must include a YSON map storing a name representation in an auxiliary skiff schema.&lt;br /&gt;\nIn &lt;code&gt;table_skiff_schemas&lt;/code&gt; and &lt;code&gt;skiff_schema_registry&lt;/code&gt;, a skiff schema may be described using one of the two methods below:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;A string starting with &lt;code&gt;$&lt;/code&gt;. Then, the =&lt;code&gt;$&lt;/code&gt; character will be stripped, and the remaining string will be found in the &lt;code&gt;skiff_schema_registry&lt;/code&gt; map. A schema is defined as a schema described with a value based on the relevant key.&lt;/li&gt;\n&lt;li&gt;Map with fields:\n&lt;ul&gt;\n&lt;li&gt;(required) &lt;code&gt;wire_type&lt;/code&gt;: skiff node type in the tree.&lt;/li&gt;\n&lt;li&gt;(optional) &lt;code&gt;name&lt;/code&gt;: node name.&lt;/li&gt;\n&lt;li&gt;(optional) &lt;code&gt;children&lt;/code&gt;: node children. For compound types, this field must be included. A child may either reference the description in &lt;code&gt;skiff_schema_registry&lt;/code&gt;, or be a map.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;code&gt;skiff_schema_registry&lt;/code&gt; is required to enable the running of operations with a large number of input tables with identical schemas.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;&amp;lt;\n    \"table_skiff_schemas\" = [\n        \"$table1\"\n    ];\n    \"skiff_schema_registry\" = {\n        \"table1\" = {\n            \"children\" = [\n                {\n                    \"name\" = \"uint64_column\";\n                    \"wire_type\" = \"uint64\"\n                };\n                {\n                    \"name\" = \"int64_column\";\n                    \"wire_type\" = \"int64\"\n                };\n                {\n                    \"name\" = \"boolean_column\";\n                    \"wire_type\" = \"boolean\"\n                };\n                {\n                    \"name\" = \"string32_column\";\n                    \"wire_type\" = \"string32\"\n                };\n                {\n                    \"name\" = \"yson32_column\";\n                    \"wire_type\" = \"yson32\"\n                }\n            ];\n            \"wire_type\" = \"tuple\"\n        }\n    }\n&amp;gt; \"skiff\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"311\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-311\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-311\" attributeName=\"visibility\" from=\"visible\" to=\"hid
