        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section describes how ACLs on columns work and gives examples of their use.&lt;/p&gt;\n&lt;h2 id=\"brief_desc\"&gt;&lt;a href=\"en/user-guide/storage/columnar-acl.html#brief_desc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Brief description&lt;/span&gt;&lt;/a&gt;Brief description&lt;/h2&gt;\n&lt;p&gt;ACLs on columns enable you to specify access rules for individual table columns. This enables you to store both public and private data in the same table. Processes and users who have access will be able to read all columns in the table, including private ones, while other users will only be able to read public columns.&lt;/p&gt;\n&lt;h2 id=\"details\"&gt;&lt;a href=\"en/user-guide/storage/columnar-acl.html#details\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Operation principle&lt;/span&gt;&lt;/a&gt;Operation principle&lt;/h2&gt;\n&lt;p&gt;The general operation principles of the access control system in YTsaurus are described in the &lt;a href=\"user-guide/storage/access-control.html\"&gt;Access control&lt;/a&gt; section.&lt;/p&gt;\n&lt;p&gt;To set an ACL on columns, use ACEs of a special type where the additional &lt;code&gt;columns&lt;/code&gt; attribute is specified in the ACLs of the nodes, both tables and directories. Such ACEs (&lt;strong&gt;columnar&lt;/strong&gt;) do not take part in ordinary checks of permissions for objects in any way. Such ACEs are taken into account at the stage of checking access to individual table columns.&lt;/p&gt;\n&lt;p&gt;Suppose that the system is checking read access permissions for table &lt;code&gt;T&lt;/code&gt; on behalf of user &lt;code&gt;U&lt;/code&gt; and this user wants to read columns from set &lt;code&gt;Cs&lt;/code&gt;. Such reads occur when the &lt;code&gt;read-table&lt;/code&gt; command is executed or when table &lt;code&gt;T&lt;/code&gt; is used as input to a MapReduce operation or others.&lt;/p&gt;\n&lt;p&gt;This feature is only available for &lt;a href=\"user-guide/storage/static-schema.html\"&gt;schematic data.&lt;/a&gt;. In particular, we assume that &lt;code&gt;Cs&lt;/code&gt; is a subset of all columns explicitly specified in the schema of table &lt;code&gt;T&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Set &lt;code&gt;Cs&lt;/code&gt; is usually specified by the user when setting a column filter, for example, via &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPath&lt;/a&gt;. When no filter is specified, &lt;code&gt;Cs&lt;/code&gt; are considered a set of all columns described in the table schema. If the table schema is not strict, additional columns can be found in the data, but no special checks are made for them.&lt;/p&gt;\n&lt;p&gt;In addition to having a &lt;code&gt;read&lt;/code&gt; permission for the entire table, the user must also have a &lt;code&gt;read&lt;/code&gt; permission for each column of set &lt;code&gt;Cs&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The latter property is checked as follows: let's consider the name of column &lt;code&gt;C&lt;/code&gt; from &lt;code&gt;Cs&lt;/code&gt;. Let's build an effective ACL of table &lt;code&gt;T&lt;/code&gt;. From the ACEs that make it up, select those that are columnar and applicable to &lt;code&gt;C&lt;/code&gt; (contain &lt;code&gt;C&lt;/code&gt; in the &lt;code&gt;columns&lt;/code&gt; attribute). Label the result &lt;code&gt;L&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;If &lt;code&gt;L&lt;/code&gt; is empty, this means that no special restrictions apply to column &lt;code&gt;C&lt;/code&gt; and checking access to this column is considered successful.&lt;/p&gt;\n&lt;p&gt;Otherwise, if at least one suitable ACE is found, the following logic applies. From the previously built list &lt;code&gt;L&lt;/code&gt;, select those entries that concern the read operation (contain &lt;code&gt;read&lt;/code&gt; in &lt;code&gt;permissions&lt;/code&gt;) and relate to the current user &lt;code&gt;U&lt;/code&gt; (&lt;code&gt;U&lt;/code&gt; is either explicitly mentioned in &lt;code&gt;subjects&lt;/code&gt; or belongs to one of the groups mentioned in &lt;code&gt;subjects&lt;/code&gt;). Denote the new list by &lt;code&gt;L'&lt;/code&gt;. If &lt;code&gt;L'&lt;/code&gt; has at least one allowing entry and no denying entires, then the check is successful. Otherwise, access will be denied.&lt;/p&gt;\n&lt;h2 id=\"compatibility_mode\"&gt;&lt;a href=\"en/user-guide/storage/columnar-acl.html#compatibility_mode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Compatibility mode&lt;/span&gt;&lt;/a&gt;Compatibility mode&lt;/h2&gt;\n&lt;p&gt;Sometimes, even though they only need a small part of the columns, users order reading of the entire table (that is, no column filter is specified). If you set a columnar ACL on a table in a scenario like this, users who do not have access to the protected columns will receive an authorization error.&lt;/p&gt;\n&lt;p&gt;For such cases, there is a special &lt;code&gt;omit_inaccessible_columns&lt;/code&gt; flag (the default value is &lt;code&gt;%false&lt;/code&gt;) which can be specified for read operations. A setting with the same name is also available in the operation specification.&lt;/p&gt;\n&lt;p&gt;When this option is enabled, if you cannot get read access to any table column (if there is read access to the table as a whole), the system hides it completely from the user and the requested action is completed successfully. In the response to the read request (in so called &lt;code&gt;output parameters&lt;/code&gt;), a list of columns that were skipped during reading due to lack of permissions is then passed. In case of an operation, such information is displayed in a warning from the scheduler.&lt;/p&gt;\n&lt;p&gt;This feature is actively used in the YTsaurus web interface to enable you to view data in columns to which the user has access and warn that some columns are hidden due to lack of access.&lt;/p&gt;\n&lt;h2 id=\"example\"&gt;&lt;a href=\"en/user-guide/storage/columnar-acl.html#example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Example&lt;/span&gt;&lt;/a&gt;Example&lt;/h2&gt;\n&lt;p&gt;Suppose an ACL with the following ACE is set on the table:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;{\n    action = allow;\n    subjects = [username];\n    permissions = [&lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt;];\n    columns = [money];\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"60\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-60\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-60\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-60.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Let's also assume that there are no more columnar ACEs all the way up to the root from this table.&lt;/p&gt;\n&lt;p&gt;The following is then performed:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Any user who has &lt;code&gt;read&lt;/code&gt; access to this table will be able to read all columns, except &lt;code&gt;money&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;If a user other than &lt;code&gt;username&lt;/code&gt; attempts to read the &lt;code&gt;money&lt;/code&gt; column, an authorization error will occur. This will happen both when you explicitly specify this column name in the filter and when you attempt to read without any filter.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;User &lt;code&gt;username&lt;/code&gt; will be able to read the &lt;code&gt;money&lt;/code&gt; column (provided that this user also has &lt;code&gt;read&lt;/code&gt; access to the entire table).&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"notes\"&gt;&lt;a href=\"en/user-guide/storage/columnar-acl.html#notes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Notes&lt;/span&gt;&lt;/a&gt;Notes&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Setting an ACE with a column read permission causes all users not specified in the ACE to automatically lose the read permission for the column. Therefore, before restricting access to the column, make sure that doing so will not break the processes working with the table.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;ol&gt;\n&lt;li&gt;In the current implementation, the feature applies only to column reading. Therefore, do not specify permissions other than &lt;code&gt;read&lt;/code&gt; in the &lt;code&gt;permissions&lt;/code&gt; attribute.&lt;/li&gt;\n&lt;li&gt;If the table has no schema or the schema is empty and weak, you cannot restrict access to its individual columns. You cannot restrict access to columns that are not specified in the schema if the schema is not strict, even if any restrictions for them are described in the ACL. Do not forget to schematize your data and describe the protected columns explicitly in the schema.&lt;/li&gt;\n&lt;li&gt;Columnar ACEs must be specified not only on the tables, but also on the directories. ACE data is inherited in a standard way and its inheritance is broken specifically in those nodes where &lt;code&gt;inherit_acl = %false&lt;/code&gt; is set.&lt;/li&gt;\n&lt;li&gt;Only YTsaurus administrators can manage columnar ACEs.&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/storage/columnar-acl.md","sourcePath":"en/user-guide/storage/columnar-acl.md"},"headings":[{"title":"Brief description","href":"en/user-guide/storage/columnar-acl.html#brief_desc","level":2},{"title":"Operation principle","href":"en/user-guide/storage/columnar-acl.html#details","level":2},{"title":"Compatibility mode","href":"en/user-guide/storage/columnar-acl.html#compatibility_mode","level":2},{"title":"Example","href":"en/user-guide/storage/columnar-acl.html#example","level":2},{"title":"Notes","href":"en/user-guide/storage/columnar-acl.html#notes","level":2}],"title":"Managing access to table columns"},"router":{"pathname":"en/user-guide/storage/columnar-acl","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
