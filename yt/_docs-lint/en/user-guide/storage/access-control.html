        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section contains information about the system of access control to tables and other &lt;a href=\"user-guide/storage/cypress.html\"&gt;Cypress&lt;/a&gt; nodes (users, groups, accounts, chunks, transactions, and other).&lt;/p&gt;\n&lt;p&gt;Any user request passes through proxies that &lt;a href=\"https://en.wikipedia.org/wiki/Authentication\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;&lt;strong&gt;authenticate&lt;/strong&gt;&lt;/a&gt; the user, that is, verify their authenticity. Based on the token contained in the request and obtained using the &lt;a href=\"https://en.wikipedia.org/wiki/OAuth\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;OAuth&lt;/a&gt; protocol, the proxy determines the name of the user who initiated the request. If no token is specified in the request, it is assumed that the request was made by the &lt;code&gt;guest&lt;/code&gt; user. After authentication, the token is not used at the subsequent user request processing stages. For more information, see &lt;a href=\"user-guide/storage/auth.html\"&gt;Authentication&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Authorization&lt;/strong&gt; (granting permissions) is performed by the Cypress master server. The decision to grant or deny access depends on:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The access type (read, write, etc.).&lt;/li&gt;\n&lt;li&gt;The user who initiated the request.&lt;/li&gt;\n&lt;li&gt;The object to which access is requested.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;If access is denied, a message with details is generated: the name of the user to whom access is denied, the object to which access was requested, and the access type.&lt;/p&gt;\n&lt;p&gt;If the proxy sends a request marked with the name of a non-existent user, the master server returns the error &lt;code&gt;No such user&lt;/code&gt;. This can happen because obtaining a token and registering a user in the system are two separate actions performed by different services (OAuth provides a token, while the YTsaurus master server handles registration).&lt;/p&gt;\n&lt;p&gt;The YTsaurus system supports lists of &lt;strong&gt;users&lt;/strong&gt; and &lt;strong&gt;groups&lt;/strong&gt;. The common name for users and groups is &lt;strong&gt;subjects&lt;/strong&gt;. Group members can be random subjects: both users and other groups. The system guarantees acyclic membership relation. In the process of authorization, decisions are made on the basis of a transitive closure. Thus, user &lt;code&gt;A&lt;/code&gt; can be a member of group &lt;code&gt;C&lt;/code&gt; either directly (being a member of group &lt;code&gt;С&lt;/code&gt;) or indirectly (&lt;code&gt;A&lt;/code&gt; being a member of group &lt;code&gt;B&lt;/code&gt; and group &lt;code&gt;B&lt;/code&gt; being a member of group &lt;code&gt;C&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Each object in the YTsaurus system has an &lt;strong&gt;Access Control List&lt;/strong&gt; (&lt;strong&gt;ACL&lt;/strong&gt;). This list is stored in the &lt;code&gt;@acl&lt;/code&gt; attribute of the object and consists of individual entries (&lt;strong&gt;Access Control Entry&lt;/strong&gt; or &lt;strong&gt;ACE&lt;/strong&gt;) where each entry contains a list of subjects, access type, and a number of other parameters listed in the table in the &lt;a href=\"user-guide/storage/access-control.html#authorization\"&gt;Authorization&lt;/a&gt; section. For more information, see &lt;a href=\"en/user-guide/storage/access-control.html#acl_usage\"&gt;How to use the ACL correctly&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"users_groups\"&gt;&lt;a href=\"en/user-guide/storage/access-control.html#users_groups\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Users, groups&lt;/span&gt;&lt;/a&gt;Users, groups&lt;/h2&gt;\n&lt;p&gt;Cypress stores:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The list of all registered users. It is located at &lt;code&gt;//sys/users&lt;/code&gt; and constitutes a &lt;code&gt;user_map&lt;/code&gt; node.&lt;/li&gt;\n&lt;li&gt;The list of all registered groups. It is located at &lt;code&gt;//sys/groups&lt;/code&gt; and constitutes a &lt;code&gt;group_map&lt;/code&gt; node.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Each user and group is defined by a unique name. Since these entities share the same namespace, duplicate names are not allowed.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"how-to-view-lists-of-users-and-groups\"&gt;&lt;a href=\"en/user-guide/storage/access-control.html#how-to-view-lists-of-users-and-groups\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How to view lists of users and groups&lt;/span&gt;&lt;/a&gt;How to view lists of users and groups&lt;/h4&gt;\n&lt;div class=\"yfm-tabs\" data-diplodoc-group=\"defaultTabsGroup-80zwmtu1\" data-diplodoc-variant=\"regular\"&gt;\n&lt;div class=\"yfm-tab-list\" role=\"tablist\"&gt;\n&lt;div data-diplodoc-id=\"in-the-web-interface\" data-diplodoc-key=\"in%20the%20web%20interface\" class=\"yfm-tab yfm-tab-group active\" role=\"tab\" tabindex=\"0\" data-diplodoc-is-active=\"true\"&gt;In the web interface&lt;/div&gt;\n&lt;div data-diplodoc-id=\"via-the-cli\" data-diplodoc-key=\"via%20the%20cli\" class=\"yfm-tab yfm-tab-group\" role=\"tab\" tabindex=\"-1\" data-diplodoc-is-active=\"false\"&gt;Via the CLI&lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"4zax7rnq\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"In the web interface\"&gt;\n&lt;ul&gt;\n&lt;li&gt;To view a list of users, go to &lt;strong&gt;Users&lt;/strong&gt; in the side panel or type &lt;code&gt;{{cluster-ui}}/users&lt;/code&gt; in the browser address bar&lt;/li&gt;\n&lt;li&gt;To view a list of groups, go to &lt;strong&gt;Groups&lt;/strong&gt; or type &lt;code&gt;{{cluster-ui}}/groups&lt;/code&gt; in the browser address bar&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;\n&lt;div id=\"xx7so59x\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"Via the CLI\"&gt;\n&lt;ul&gt;\n&lt;li&gt;Get a list of users:\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt --proxy &amp;lt;cluster-name&amp;gt; list //sys/users\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"98\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-98\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-98\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-98.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;Get a list of groups:\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt --proxy &amp;lt;cluster-name&amp;gt; list //sys/groups\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"104\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-104\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-104\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-104.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The &lt;code&gt;//sys/users&lt;/code&gt; and &lt;code&gt;//sys/groups&lt;/code&gt; nodes are not tables, so you cannot get lists of users and groups using a &lt;code&gt;SELECT&lt;/code&gt; query.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Users have the &lt;code&gt;user&lt;/code&gt; system object type. Groups have the &lt;code&gt;group&lt;/code&gt; object type.&lt;/p&gt;\n&lt;h4 id=\"how-to-get-information-about-a-user-or-group\"&gt;&lt;a href=\"en/user-guide/storage/access-control.html#how-to-get-information-about-a-user-or-group\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How to get information about a user or group&lt;/span&gt;&lt;/a&gt;How to get information about a user or group&lt;/h4&gt;\n&lt;div class=\"yfm-tabs\" data-diplodoc-group=\"defaultTabsGroup-hbgs2jde\" data-diplodoc-variant=\"regular\"&gt;\n&lt;div class=\"yfm-tab-list\" role=\"tablist\"&gt;\n&lt;div data-diplodoc-id=\"in-the-web-interface-1\" data-diplodoc-key=\"in%20the%20web%20interface\" class=\"yfm-tab yfm-tab-group active\" role=\"tab\" tabindex=\"0\" data-diplodoc-is-active=\"true\"&gt;In the web interface&lt;/div&gt;\n&lt;div data-diplodoc-id=\"via-the-cli-1\" data-diplodoc-key=\"via%20the%20cli\" class=\"yfm-tab yfm-tab-group\" role=\"tab\" tabindex=\"-1\" data-diplodoc-is-active=\"false\"&gt;Via the CLI&lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"fywsk5yd\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"In the web interface\"&gt;\n&lt;p&gt;Go to the user or group page and click &lt;img src=\"images/attrs-icon.png\" alt=\"\" width=\"20\" height=\"20\" /&gt; on the right.&lt;/p&gt;\n&lt;/div&gt;\n&lt;div id=\"a0czlyw1\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"Via the CLI\"&gt;\n&lt;p&gt;To get information about a particular user, use the command &lt;code&gt;yt --proxy &amp;lt;cluster-name&amp;gt; get //sys/users/&amp;lt;user-name&amp;gt;/@&amp;lt;attr-name&amp;gt;&lt;/code&gt;. For example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$ yt --proxy &amp;lt;cluster-name&amp;gt; get //sys/users/john/@type\n\"user\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"143\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-143\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-143\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-143.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;To see a list of all available attributes for a user, use the command:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt --proxy &amp;lt;cluster-name&amp;gt; get //sys/users/john/@\n{\n  &lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"ffffffff-fffffffe-101f5-1407420e\"&lt;/span&gt;;\n  &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"user\"&lt;/span&gt;;\n  &lt;span class=\"hljs-string\"&gt;\"builtin\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n  ...\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"147\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-147\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-147\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-147.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Similarly, to get information about a particular group, use the command &lt;code&gt;yt --proxy &amp;lt;cluster-name&amp;gt; get //sys/groups/&amp;lt;group-name&amp;gt;/@&amp;lt;attr-name&amp;gt;&lt;/code&gt;. For example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt --proxy &amp;lt;cluster-name&amp;gt; get //sys/groups/admins/@&lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt;\n&lt;span class=\"hljs-string\"&gt;\"group\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"151\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-151\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-151\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-151.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;h2 id=\"system_subjects\"&gt;&lt;a href=\"en/user-guide/storage/access-control.html#system_subjects\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;System subjects&lt;/span&gt;&lt;/a&gt;System subjects&lt;/h2&gt;\n&lt;p&gt;In YTsaurus, there is a set of subjects that perform system functions. You cannot delete such subjects. System functions include:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;The &lt;code&gt;guest&lt;/code&gt;, &lt;code&gt;root&lt;/code&gt;, &lt;code&gt;scheduler&lt;/code&gt;, and &lt;code&gt;job&lt;/code&gt; users.&lt;/li&gt;\n&lt;li&gt;The &lt;code&gt;everyone&lt;/code&gt;, &lt;code&gt;users&lt;/code&gt;, and &lt;code&gt;superusers&lt;/code&gt; groups.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"subject_attributes\"&gt;&lt;a href=\"en/user-guide/storage/access-control.html#subject_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Subject attributes&lt;/span&gt;&lt;/a&gt;Subject attributes&lt;/h2&gt;\n&lt;p&gt;The table below shows a list of attributes that are inherent to all subjects.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Attribute&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Subject name (non-empty string)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;member_of&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A list of names of groups to which the subject directly belongs&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;member_of_closure&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A list of names of groups to which the subject belongs (directly or indirectly)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;aliases&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A list of names that can be used in the ACL as a reference to the subject&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"user_attributes\"&gt;&lt;a href=\"en/user-guide/storage/access-control.html#user_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;User attributes&lt;/span&gt;&lt;/a&gt;User attributes&lt;/h2&gt;\n&lt;p&gt;In addition to the inherent attributes that are shared by all subjects, users have the attributes listed in the table below.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Attribute&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Mandatory&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;banned&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether the user is blocked&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;access_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;DateTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The time of the last request from the user.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;access_counter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;integer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The total number of requests made by the user.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;request_rate&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;double&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The number of requests per second from the user.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;request_rate_limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;double&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The limit on the number of requests per second from the user. The default value is 100.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;request_queue_size_limit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;double&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The request queue size. The default value is 100.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;usable_accounts&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A list of accounts that the user is allowed to use.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"group_attributes\"&gt;&lt;a href=\"en/user-guide/storage/access-control.html#group_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Group attributes&lt;/span&gt;&lt;/a&gt;Group attributes&lt;/h2&gt;\n&lt;p&gt;In addition to the inherent attributes that are shared by all subjects, groups have the attributes listed in the table below.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Attribute&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;members&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A list of names of group members (users and other groups).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"group_control\"&gt;&lt;a href=\"en/user-guide/storage/access-control.html#group_control\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Managing groups&lt;/span&gt;&lt;/a&gt;Managing groups&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;On large clusters, only YTsaurus administrators can directly manage groups.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;To create a new group, use the &lt;code&gt;create&lt;/code&gt; command. When creating an object, you do not need to specify its path, but you need to specify the &lt;code&gt;name&lt;/code&gt; attribute.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt create group --attributes &lt;span class=\"hljs-string\"&gt;'{name=my_group}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"413\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-413\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-413\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-413.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You can remove objects using the &lt;code&gt;remove&lt;/code&gt; command. When a group is removed, it is automatically removed from all ACLs where it was present.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt remove //sys/groups/my_group\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"417\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-417\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-417\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-417.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"authorization\"&gt;&lt;a href=\"en/user-guide/storage/access-control.html#authorization\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Authorization&lt;/span&gt;&lt;/a&gt;Authorization&lt;/h2&gt;\n&lt;p&gt;The authorization module on the master server solves the following problem: should user &lt;code&gt;U&lt;/code&gt; be granted access of type &lt;code&gt;P&lt;/code&gt; for object &lt;code&gt;O&lt;/code&gt;? There are two possible answers: to grant or not to grant. Let us review all three components (U, P, and O) separately.&lt;/p&gt;\n&lt;p&gt;Any system user can act as &lt;code&gt;U&lt;/code&gt;. Note that &lt;code&gt;U&lt;/code&gt; cannot be a group, although group membership is taken into account when making a decision. If &lt;code&gt;U&lt;/code&gt; is &lt;code&gt;root&lt;/code&gt;, the access request is automatically approved.&lt;/p&gt;\n&lt;p&gt;Access type &lt;code&gt;P&lt;/code&gt; is also called &lt;strong&gt;permission&lt;/strong&gt;. The permissions supported by YTsaurus are shown in the table.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Permission&lt;/th&gt;\n&lt;th&gt;Description&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;read&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Means reading a value or getting information about an object or its attributes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;write&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Means changing an object state or its attributes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;use&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Applies to accounts, pools, and bundles and means usage (that is, the ability to insert new objects into the quota of a given account, run operations in a pool, or move a dynamic table to a bundle).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;administer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Means changing the object access descriptor.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;create&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Applies only to schemas and means creating objects of this type.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;remove&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Means removing an object.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;mount&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Means mounting, unmounting, remounting, and resharding a dynamic table.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;manage&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Applies only to operations (not to Cypress nodes) and means managing that operation or its jobs.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Object &lt;code&gt;O&lt;/code&gt; means a random system object: Cypress node, user, group, account, chunk, transaction, and so on.&lt;/p&gt;\n&lt;p&gt;To make a decision, the system implicitly builds an &lt;strong&gt;effective access control list&lt;/strong&gt; (effective ACL) for object &lt;code&gt;O&lt;/code&gt;. An effective access control list is a combination of the access control list specified on the node and the access control lists inherited from its parents. Any &lt;strong&gt;access control list&lt;/strong&gt; (ACL) is a list of &lt;strong&gt;access control entries&lt;/strong&gt; (ACE). The order of entries in this list does not matter. The object can inherit its ACL, which is controlled by the &lt;code&gt;inherit_acl = %true&lt;/code&gt; attribute. When inheriting, the inheritance mode (the &lt;code&gt;inheritance_mode&lt;/code&gt; key in the &lt;code&gt;acl&lt;/code&gt; entry) is defined for each ACE. The latter can be &lt;code&gt;object_only&lt;/code&gt;, &lt;code&gt;object_and_descendants&lt;/code&gt;, &lt;code&gt;descendants_only&lt;/code&gt;, and &lt;code&gt;immediate_descendants_only&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;object_only&lt;/code&gt; value means that this entry affects only the object itself. The &lt;code&gt;object_and_descendants&lt;/code&gt; value means that this entry affects the object and all its descendants, including indirect ones. The &lt;code&gt;descendants_only&lt;/code&gt; value means that this entry affects only descendants, including indirect ones. The &lt;code&gt;immediate_descendants_only&lt;/code&gt; value means that this entry affects only direct descendants (sons). Each entry has a structure presented in the table.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Attribute&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;action&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;SecurityAction&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Either &lt;code&gt;allow&lt;/code&gt; (allowing entry) or &lt;code&gt;deny&lt;/code&gt; (denying entry).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;subjects&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A list of names of subjects to which the entry applies.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;permissions&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;Permission&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A list of access permissions to which the action specified in the &lt;code&gt;action&lt;/code&gt; attribute applies.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;inheritance_mode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;InheritanceMode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The inheritance mode of this ACE, by default &lt;code&gt;object_and_descendants&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Once an effective list is built, the decision to grant or deny access is made according to the following schema:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;If there is at least one allowing entry for &lt;code&gt;U&lt;/code&gt; and &lt;code&gt;P&lt;/code&gt; and no denying entries for &lt;code&gt;U&lt;/code&gt; and &lt;code&gt;P&lt;/code&gt;, access is granted.&lt;/li&gt;\n&lt;li&gt;Otherwise, access is denied.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;“Entry for &lt;code&gt;U&lt;/code&gt; and &lt;code&gt;P&lt;/code&gt;” means that &lt;code&gt;P&lt;/code&gt; is mentioned in the &lt;code&gt;permissions&lt;/code&gt; list and either user &lt;code&gt;U&lt;/code&gt; or at least one group in which user U is a direct or indirect member is mentioned in the &lt;code&gt;subjects&lt;/code&gt; list. From that description, it follows specifically that if the effective list is empty, access will be denied.&lt;/p&gt;\n&lt;h2 id=\"owner\"&gt;&lt;a href=\"en/user-guide/storage/access-control.html#owner\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Object owner and owner user&lt;/span&gt;&lt;/a&gt;Object owner and owner user&lt;/h2&gt;\n&lt;p&gt;When user &lt;code&gt;U&lt;/code&gt; creates an object, user U also becomes the owner of that object, which is shown in the &lt;code&gt;owner&lt;/code&gt; attribute.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Only the superuser (member of the &lt;code&gt;superusers&lt;/code&gt; group) can change the owner.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;There is also a special fictitious &lt;code&gt;owner&lt;/code&gt; user in the system. You cannot authenticate with it, but you can refer to it in the ACL as a subject. &lt;code&gt;owner&lt;/code&gt; is replaced by the actual object owner when permissions are checked. This enables you to do such things as describe the \"in this folder, only those who created the nodes can remove them\" restriction by the ACE:&lt;code&gt;{action=allow; permissions=[remove]; subjects=[owner]; inheritance_mode = descendants_only}&lt;/code&gt;. Remember to disable permission inheritance by specifying &lt;code&gt;inherit_acl = %false&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"managing-operations\"&gt;&lt;a href=\"en/user-guide/storage/access-control.html#managing-operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Managing operations&lt;/span&gt;&lt;/a&gt;Managing operations&lt;/h2&gt;\n&lt;p&gt;Any operation has an ACL associated with it, similar to Cypress nodes. You can obtain this ACL from the attribute at &lt;code&gt;runtime_parameters/acl&lt;/code&gt; of the operation.&lt;/p&gt;\n&lt;p&gt;Access permissions have the following semantics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The &lt;code&gt;read&lt;/code&gt; permission is responsible for reading the live preview of the output and intermediate data of the operation, as well as the \"artifacts\" of its jobs: stderr, fail context, and the input data of individual jobs.&lt;/li&gt;\n&lt;li&gt;The &lt;code&gt;manage&lt;/code&gt; permission is responsible for managing actions that change the state of the operation, including &lt;code&gt;Abort&lt;/code&gt;, &lt;code&gt;Complete&lt;/code&gt;, &lt;code&gt;Suspend&lt;/code&gt;, and &lt;code&gt;Resume&lt;/code&gt; (the corresponding buttons are located in the upper-right corner of the operation page in the web interface), as well as for managing actions with jobs, including &lt;code&gt;Abort&lt;/code&gt;, &lt;code&gt;Abandon&lt;/code&gt;, and &lt;code&gt;Send signal&lt;/code&gt; (the corresponding buttons are located in the drop-down menu on the right side of the &lt;code&gt;Jobs&lt;/code&gt; page in the YTsaurus web interface).&lt;/li&gt;\n&lt;li&gt;Using &lt;a href=\"user-guide/problems/jobshell-and-slowjobs.html\"&gt;Job Shell&lt;/a&gt; requires &lt;code&gt;read&lt;/code&gt; and &lt;code&gt;manage&lt;/code&gt; permissions at the same time , since having access via the console enables you to read or randomly change the job state.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;You can specify the ACL for an operation when it starts. To do this, in the operation specification, indicate an &lt;code&gt;\"acl\"&lt;/code&gt; section as follows:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.run_map(..., spec={&lt;span class=\"hljs-string\"&gt;\"acl\"&lt;/span&gt;: [{\n &lt;span class=\"hljs-string\"&gt;\"action\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"allow\"&lt;/span&gt;,\n &lt;span class=\"hljs-string\"&gt;\"subjects\"&lt;/span&gt;: [&lt;span class=\"hljs-string\"&gt;\"u1\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"u2\"&lt;/span&gt;],\n &lt;span class=\"hljs-string\"&gt;\"permissions\"&lt;/span&gt;: [&lt;span class=\"hljs-string\"&gt;\"read\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"manage\"&lt;/span&gt;],\n}]})\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"644\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-644\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-644\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-644.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;The user who started the operation and the default administrators are added to the resulting ACL of the operation.&lt;/p&gt;\n&lt;h2 id=\"acl_usage\"&gt;&lt;a href=\"en/user-guide/storage/access-control.html#acl_usage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How to use the ACL correctly&lt;/span&gt;&lt;/a&gt;How to use the ACL correctly&lt;/h2&gt;\n&lt;p&gt;The access management schema presented above is very general and flexible. When using it, try to assign roles at the highest level with inheritance once, rather than manage access at the level of individual tables. ACL inheritance encourages grouping data with common access rules into folders.&lt;/p&gt;\n&lt;p&gt;In normal mode, you should have only allowing entries. Denying entries can be set to solve the problem quickly if it turns out that access is overextended. Then, the ACL should be revised, and the problem should be solved by adjusting the allowing entries.&lt;/p&gt;\n&lt;p&gt;We do not recommend mentioning specific users in the ACL. When access is granted, we recommend using groups with the same type of needs instead of individual users.&lt;/p&gt;\n&lt;p&gt;ACL inheritance should be used everywhere, except in places where the nature of access changes radically. For example, on the Cypress root, the default entry is set to allow all users (except &lt;code&gt;guest&lt;/code&gt;) to read. When overriding access to parts of Cypress that store security-sensitive information, such as token lists, the access definitions must be redefined from scratch.&lt;/p&gt;\n&lt;h2 id=\"check_acl\"&gt;&lt;a href=\"en/user-guide/storage/access-control.html#check_acl\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Checking the ACL&lt;/span&gt;&lt;/a&gt;Checking the ACL&lt;/h2&gt;\n&lt;p&gt;To check if a user has a certain permission to a certain Cypress node, use the &lt;code&gt;check-permission&lt;/code&gt; command. Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt check-permission yql write //tmp\n{\n  &lt;span class=\"hljs-string\"&gt;\"action\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"allow\"&lt;/span&gt;;\n  &lt;span class=\"hljs-string\"&gt;\"object_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"1-3-411012f-1888ce1f\"&lt;/span&gt;;\n  &lt;span class=\"hljs-string\"&gt;\"object_name\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"node //tmp\"&lt;/span&gt;;\n  &lt;span class=\"hljs-string\"&gt;\"subject_id\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"c4-8aaa-41101f6-bec6113b\"&lt;/span&gt;;\n  &lt;span class=\"hljs-string\"&gt;\"subject_name\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"YTsaurus\"&lt;/span&gt;;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"669\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-669\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-669\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-669.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"request_access\"&gt;&lt;a href=\"en/user-guide/storage/access-control.html#request_access\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Requesting access&lt;/span&gt;&lt;/a&gt;Requesting access&lt;/h2&gt;\n&lt;p&gt;To gain access to an existing account or directory in YTsaurus, contact your system administrator.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/storage/access-control.md","sourcePath":"en/user-guide/storage/access-control.md"},"headings":[{"title":"Users, groups","href":"en/user-guide/storage/access-control.html#users_groups","level":2},{"title":"System subjects","href":"en/user-guide/storage/access-control.html#system_subjects","level":2},{"title":"Subject attributes","href":"en/user-guide/storage/access-control.html#subject_attributes","level":2},{"title":"User attributes","href":"en/user-guide/storage/access-control.html#user_attributes","level":2},{"title":"Group attributes","href":"en/user-guide/storage/access-control.html#group_attributes","level":2},{"title":"Managing groups","href":"en/user-guide/storage/access-control.html#group_control","level":2},{"title":"Authorization","href":"en/user-guide/storage/access-control.html#authorization","level":2},{"title":"Object owner and owner user","href":"en/user-guide/storage/access-control.html#owner","level":2},{"title":"Managing operations","href":"en/user-guide/storage/access-control.html#managing-operations","level":2},{"title":"How to use the ACL correctly","href":"en/user-guide/storage/access-control.html#acl_usage","level":2},{"title":"Checking the ACL","href":"en/user-guide/storage/access-control.html#check_acl","level":2},{"title":"Requesting access","href":"en/user-guide/storage/access-control.html#request_access","level":2}],"title":"General information"},"router":{"pathname":"en/user-guide/storage/access-control","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
