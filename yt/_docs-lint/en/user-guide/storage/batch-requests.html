        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section contains information about batch processing of requests (batch requests), with usage examples for the &lt;a href=\"user-guide/storage/batch-requests.html#python_api\"&gt;Python&lt;/a&gt;, &lt;a href=\"user-guide/storage/batch-requests.html#c_plus_plus_api\"&gt;C++&lt;/a&gt;, and &lt;a href=\"user-guide/storage/batch-requests.html#java_api\"&gt;Java&lt;/a&gt; APIs.&lt;/p&gt;\n&lt;p&gt;When working with the YTsaurus system, each command generates a separate request to the master server. A request has its own cost, often higher than the execution of a command. Therefore, combining several commands into a single request can significantly speed up processes that send many easy commands to &lt;a href=\"user-guide/storage/cypress.html\"&gt;Cypress&lt;/a&gt; and are waiting for a response most of the time. This request is called a &lt;strong&gt;batch request&lt;/strong&gt;. The Cypress master server will execute the commands from the batch request in random order and return all the obtained results. Errors that occur during the execution of individual commands do not affect other commands.&lt;/p&gt;\n&lt;h2 id=\"concurrency\"&gt;&lt;a href=\"en/user-guide/storage/batch-requests.html#concurrency\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Concurrency&lt;/span&gt;&lt;/a&gt;Concurrency&lt;/h2&gt;\n&lt;p&gt;A batch request on the Cypress master server is executed as a set of independent commands, the specific command execution order is not guaranteed. All commands are counted in the user command quota. A batch request has the &lt;code&gt;concurrency&lt;/code&gt; parameter which regulates the concurrency of commands. The parameter value limits the number of concurrently running commands, thus enabling you not to exceed the allowable number of concurrent requests to the master server for a user. Otherwise, the &lt;code&gt;User 'user' has exceeded its request queue size limit&lt;/code&gt; error will be returned in response to the request. The default value of the parameter is 50 (concurrently running commands) and the user has a limit of 100, which helps avoid errors involving exceeding the limit. Exceeding the limit is not a fatal error. If it occurs, we recommend sending a request again. If you use high-level SDKs, the request will be sent again automatically.&lt;/p&gt;\n&lt;h2 id=\"python_api\"&gt;&lt;a href=\"en/user-guide/storage/batch-requests.html#python_api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Python API&lt;/span&gt;&lt;/a&gt;Python API&lt;/h2&gt;\n&lt;p&gt;In the Python API, there is a &lt;code&gt;create_batch_client()&lt;/code&gt; method that enables you to create a client to combine multiple commands into a single batch request (&lt;code&gt;client.create_batch_client()&lt;/code&gt;) if you have a simple client (&lt;code&gt;client = yt.YtClient(&amp;lt;cluster-name&amp;gt;)&lt;/code&gt;). A usage example is shown in Listing 1:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\n\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; __name__ == &lt;span class=\"hljs-string\"&gt;\"__main__\"&lt;/span&gt;:\n    client = yt.YtClient(&amp;lt;cluster-name&amp;gt;)\n\n    batch_client = client.create_batch_client()\n    list_rsp = batch_client.&lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"/\"&lt;/span&gt;)\n    exists_rsp = batch_client.exists(&lt;span class=\"hljs-string\"&gt;\"/\"&lt;/span&gt;)\n    batch_client.commit_batch()\n\n    &lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt; list_rsp.get_result()\n    &lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt; exists_rsp.get_result()\n\n&lt;span class=\"hljs-comment\"&gt;#['cooked_logs', 'home', 'logs', 'projects', 'statbox', 'sys', 'tmp', 'user_sessions', 'userdata', 'userfeat', 'userstats']&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;#true&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"18\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-18\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-18\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-18.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;As a result of executing the request using batch_client, a special object of the &lt;code&gt;BatchResponse&lt;/code&gt; type, which has the structure shown below, is returned.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;BatchResponse&lt;/span&gt;(&lt;span class=\"hljs-title class_ inherited__\"&gt;object&lt;/span&gt;):\n    ...\n\n    &lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;get_result&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;self&lt;/span&gt;):\n        ...\n\n    &lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;get_error&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;self&lt;/span&gt;):\n        ...\n\n    &lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;is_ok&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;self&lt;/span&gt;):\n        ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"22\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-22\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-22\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-22.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You cannot specify the &lt;a href=\"user-guide/storage/formats.html\"&gt;format&lt;/a&gt; of the returned data by a separate command via &lt;code&gt;batch_client&lt;/code&gt;. The reason is that the format of the returned data is the same for the entire batch request.&lt;/p&gt;\n&lt;h2 id=\"c_plus_plus_api\"&gt;&lt;a href=\"en/user-guide/storage/batch-requests.html#c_plus_plus_api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C++ API&lt;/span&gt;&lt;/a&gt;C++ API&lt;/h2&gt;\n&lt;p&gt;In the C++ API, to execute a batch request, you need to:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Create an object of the &lt;code&gt;TBatchRequest&lt;/code&gt; type.&lt;/li&gt;\n&lt;li&gt;Use it to specify commands (the &lt;code&gt;TBatchRequest&lt;/code&gt; methods return &lt;code&gt;TFuture&lt;/code&gt; to the appropriate type).&lt;/li&gt;\n&lt;li&gt;Pass it to the &lt;code&gt;ExecuteBatch&lt;/code&gt; method of the client.&lt;/li&gt;\n&lt;li&gt;Get the results from the previously obtained &lt;code&gt;TFuture&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;However, if some commands were completed with an error, you can find this out by calling &lt;code&gt;future.GetValue&lt;/code&gt; or &lt;code&gt;future.HasException&lt;/code&gt; (i.e. calling &lt;code&gt;ExecuteBatch&lt;/code&gt; will not return an error). A usage example is given below.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-meta\"&gt;#&lt;span class=\"hljs-keyword\"&gt;include&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;&amp;lt;mapreduce/yt/interface/client.h&amp;gt;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\"hljs-meta\"&gt;#&lt;span class=\"hljs-keyword\"&gt;include&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;&amp;lt;mapreduce/yt/common/helpers.h&amp;gt;&lt;/span&gt;&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;using&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;namespace&lt;/span&gt; NYT;\n\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;int&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;main&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;()&lt;/span&gt;\n&lt;/span&gt;{\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; client = &lt;span class=\"hljs-built_in\"&gt;CreateClient&lt;/span&gt;(&amp;lt;cluster-name&amp;gt;);\n\n    TBatchRequest batchRequest;\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; listRsp = batchRequest.&lt;span class=\"hljs-built_in\"&gt;List&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"/\"&lt;/span&gt;, &lt;span class=\"hljs-built_in\"&gt;TListOptions&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;MaxSize&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;5&lt;/span&gt;));\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; existsRsp = batchRequest.&lt;span class=\"hljs-built_in\"&gt;Exists&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"//tmp\"&lt;/span&gt;);\n\n    client-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;ExecuteBatch&lt;/span&gt;(batchRequest);\n\n    &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; (&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; item : listRsp.&lt;span class=\"hljs-built_in\"&gt;GetValue&lt;/span&gt;()) {\n        Cerr &amp;lt;&amp;lt; &lt;span class=\"hljs-built_in\"&gt;NodeToYsonString&lt;/span&gt;(item) &amp;lt;&amp;lt; Endl;\n    }\n    Cerr &amp;lt;&amp;lt; &lt;span class=\"hljs-built_in\"&gt;NodeToYsonString&lt;/span&gt;(existsRsp.&lt;span class=\"hljs-built_in\"&gt;GetValue&lt;/span&gt;()) &amp;lt;&amp;lt; Endl;\n\n    &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n}\n\n&lt;span class=\"hljs-comment\"&gt;/* Output of program:\n\"tmp\"\n\"projects\"\n\"logs\"\n\"userfeat\"\n\"cooked_logs\"\n%true\n*/&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"57\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-57\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-57\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-57.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"java_api\"&gt;&lt;a href=\"en/user-guide/storage/batch-requests.html#java_api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Java API&lt;/span&gt;&lt;/a&gt;Java API&lt;/h2&gt;\n&lt;p&gt;In the Java API, there is an &lt;code&gt;executeBatch&lt;/code&gt; method that enables you to create an object of the &lt;code&gt;BatchRequest&lt;/code&gt; type to execute multiple commands within a single batch request if you have a Cypress client &lt;code&gt;yt.cypress()&lt;/code&gt;. All commands sent via &lt;code&gt;BatchRequest&lt;/code&gt; return objects of the &lt;code&gt;future&lt;/code&gt; type, which will be executed after calling the &lt;code&gt;execute&lt;/code&gt; method.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs java\"&gt;&lt;span class=\"hljs-type\"&gt;BatchRequest&lt;/span&gt; &lt;span class=\"hljs-variable\"&gt;request&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; yt.cypress().executeBatch(transactionId, pingAncestorTransactions, Option.empty());\nListF&amp;lt;CompletableFuture&amp;lt;YTreeNode&amp;gt;&amp;gt; futures = Cf.arrayList();\n\n&lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; (YPath path : spec.getInputTables()) {\n\tfutures.add(request.get(transactionId, pingAncestorTransactions, path.attribute(&lt;span class=\"hljs-string\"&gt;\"sorted\"&lt;/span&gt;), Cf.set()));\n}\n\nrequest.execute().join();\n\n&lt;span class=\"hljs-type\"&gt;boolean&lt;/span&gt; &lt;span class=\"hljs-variable\"&gt;result&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; futures.forAll(x -&amp;gt; {\n\t&lt;span class=\"hljs-type\"&gt;YTreeNode&lt;/span&gt; &lt;span class=\"hljs-variable\"&gt;node&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; x.join();\n\t&lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; node.isBooleanNode() &amp;amp;&amp;amp; node.boolValue();\n});\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"64\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-64\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-64\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-64.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/storage/batch-requests.md","sourcePath":"en/user-guide/storage/batch-requests.md"},"headings":[{"title":"Concurrency","href":"en/user-guide/storage/batch-requests.html#concurrency","level":2},{"title":"Python API","href":"en/user-guide/storage/batch-requests.html#python_api","level":2},{"title":"C++ API","href":"en/user-guide/storage/batch-requests.html#c_plus_plus_api","level":2},{"title":"Java API","href":"en/user-guide/storage/batch-requests.html#java_api","level":2}],"title":"Batch processing of requests"},"router":{"pathname":"en/user-guide/storage/batch-requests","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
