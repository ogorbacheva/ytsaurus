        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h4 id=\"structure-in-cell\"&gt;&lt;a href=\"en/user-guide/storage/faq.html#structure-in-cell\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Can I put an arbitrary YSON structure in a table cell?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Can I put an arbitrary YSON structure in a table cell?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Yes. You can use columns of type &lt;code&gt;any&lt;/code&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"change-table-schema\"&gt;&lt;a href=\"en/user-guide/storage/faq.html#change-table-schema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: Can I modify a table's schema?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: Can I modify a table's schema?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; Yes. You can find examples and limits in the &lt;a href=\"en/user-guide/storage/static-schema.html#create\"&gt;Table schema&lt;/a&gt; section.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"file-size-limit\"&gt;&lt;a href=\"en/user-guide/storage/faq.html#file-size-limit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How large are the files the system supports?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How large are the files the system supports?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The formal limit on file length is just a 64-bit integer. In actual fact, it is the amount of free space on the cluster's nodes. Since a file is broken down into chunks, it does not have to be stored on a single node. Therefore, it can be larger than the size of a single hard drive. A single job cannot process files this large; therefore, the relevant activity will boil down to using the read_file command and reading by ranges.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"move-table\"&gt;&lt;a href=\"en/user-guide/storage/faq.html#move-table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I move a table from an HDD to an SSD?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I move a table from an HDD to an SSD?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; You can change medium type for a table or a file by editing the table's primary medium via the &lt;code&gt;primary_medium&lt;/code&gt; attribute. Before modifying this attribute, you need to unmount your table (and remount it when done to return things to the way they were). For example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt unmount-table --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt; //home/path/to/table\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/path/to/table/@primary_medium ssd_blobs\nyt mount-table --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt; //home/path/to/table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"27\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-27\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-27\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-27.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Immediately after you set the attribute, new data will start writing to an SSD while old data will be moved in the background. For more information about controlling this process and tracking its progress, please see the section on &lt;a href=\"en/user-guide/storage/static-tables.html#medium\"&gt;static tables&lt;/a&gt;.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"slow-table-read\"&gt;&lt;a href=\"en/user-guide/storage/faq.html#slow-table-read\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: What do I do if table reads are slow?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: What do I do if table reads are slow?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; There is a &lt;a href=\"en/user-guide/problems/slow-read.html\"&gt;dedicated page&lt;/a&gt; about this.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"reduce-chunk-usage\"&gt;&lt;a href=\"en/user-guide/storage/faq.html#reduce-chunk-usage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: How do I reduce the number of chunks I am using in my quota?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: How do I reduce the number of chunks I am using in my quota?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A&lt;/strong&gt;: If these chunks are taken up by tables (which is the most common scenario), you need to run a &lt;a href=\"en/user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt; with &lt;code&gt;combine_chunks = %true&lt;/code&gt;.&lt;br /&gt;\nThis will rebuild your table from larger chunks, thereby reducing the use of chunks within your quota. You can use a command-line command to run the operation replacing &lt;code&gt;src table&lt;/code&gt; and &lt;code&gt;dst table&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;yt merge --src table --dst table --spec \"{combine_chunks=true}\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"45\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-45\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-45\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-45.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;There is also a way of monitoring chunk usage without running a separate operation. For more information, see Merging chunks automatically on operation exit.&lt;/p&gt;\n&lt;p&gt;Also, files may use many chunks in certain situations. For instance, when small fragments are being continuously appended to existing files. At the moment, there no ready-made method similar to Merge to combine file chunks. You can run &lt;code&gt;yt read-file //path/to/file | yt write-file //path/to/file&lt;/code&gt; in combination.  This will make the entire data stream go through the client.&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"yamreddsv-disabled\"&gt;&lt;a href=\"en/user-guide/storage/faq.html#yamreddsv-disabled\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q: I am getting the Format \"YamredDsv\" is disabled error. What should I do?&lt;/span&gt;&lt;/a&gt;&lt;strong&gt;Q: I am getting the Format \"YamredDsv\" is disabled error. What should I do?&lt;/strong&gt;&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;A:&lt;/strong&gt; The &lt;code&gt;YAMRED_DSV&lt;/code&gt; format is no longer supported. Use a different &lt;a href=\"en/user-guide/storage/formats.html#formaty-predstavleniya-tablichnyh-dannyh\"&gt;format&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/storage/faq.md","sourcePath":"en/user-guide/storage/faq.md"},"headings":[],"title":"FAQ"},"router":{"pathname":"en/user-guide/storage/faq","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
