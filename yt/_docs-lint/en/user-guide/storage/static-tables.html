        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section provides an introduction to static tables, including their types and &lt;a href=\"en/user-guide/storage/static-tables.html#schema\"&gt;schema&lt;/a&gt;.&lt;br /&gt;\nIn addition to static tables, the YTsaurus system supports dynamic tables. For more information about the types and features of dynamic tables, see &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Dynamic tables&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"common\"&gt;&lt;a href=\"en/user-guide/storage/static-tables.html#common\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General description&lt;/span&gt;&lt;/a&gt;General description&lt;/h2&gt;\n&lt;p&gt;Static tables are a classic table type in the YTsaurus system.&lt;br /&gt;\nSuch tables are physically divided into parts (&lt;a href=\"user-guide/storage/chunks.html\"&gt;chunks&lt;/a&gt;) and each part contains a fragment of table entries.&lt;/p&gt;\n&lt;p&gt;The name “static” implies that you cannot update existing table data without an overwrite. However, you can still append new records to the end of the table.&lt;/p&gt;\n&lt;p&gt;In addition, table data can be modified using the following operations (note that in a typical case you will need to read and overwrite entire chunks of the table):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/data-processing/operations/erase.html\"&gt;Delete&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Static tables can be &lt;a href=\"en/user-guide/storage/static-tables.html#sorted_tables\"&gt;sorted&lt;/a&gt; and &lt;a href=\"en/user-guide/storage/static-tables.html#unsorted_tables\"&gt;unsorted&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"sorted_tables\"&gt;&lt;a href=\"en/user-guide/storage/static-tables.html#sorted_tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sorted tables&lt;/span&gt;&lt;/a&gt;Sorted tables&lt;/h3&gt;\n&lt;p&gt;For a sorted table, a set of immutable key columns is known.&lt;br /&gt;\nThe table entries appear to be physically or logically ordered by key. Therefore, sorted tables enable you to effectively search for data by key.&lt;/p&gt;\n&lt;p&gt;A sorted table has at least one key column, the &lt;code&gt;sorted&lt;/code&gt; attribute of the table is &lt;code&gt;true&lt;/code&gt;. The attribute is read-only.&lt;/p&gt;\n&lt;p&gt;There are key (sorted) columns in the sorted table schema. They are marked with the &lt;code&gt;sort_order&lt;/code&gt; field in the schema.&lt;/p&gt;\n&lt;p&gt;A list of all key columns is available in the &lt;code&gt;key_columns&lt;/code&gt; and &lt;code&gt;sorted_by&lt;/code&gt; attributes of the table. The sequence of columns is defined in the table schema. The attributes are read-only.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Entries added to the end of the sorted table must not violate the sort order.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"unsorted_tables\"&gt;&lt;a href=\"en/user-guide/storage/static-tables.html#unsorted_tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Unsorted tables&lt;/span&gt;&lt;/a&gt;Unsorted tables&lt;/h3&gt;\n&lt;p&gt;For unsorted tables, the concept of a key is not defined, so searching for data by key is possible only if you read the whole table. However, you can access it by row numbers.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Appending entries to the end of an unsorted table is the basis of many ways to load data into YTsaurus clusters.&lt;br /&gt;\nFor this operation to be effective, consider the following:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Any change request is processed by the master server. This schema does not scale well, so you should not make more than 100 writes per second.&lt;/li&gt;\n&lt;li&gt;Writing a small number of rows within a single request results in small chunks which overload the master server with a large amount of metadata and make reading less efficient.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"attributes\"&gt;&lt;a href=\"en/user-guide/storage/static-tables.html#attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Attributes&lt;/span&gt;&lt;/a&gt;Attributes&lt;/h2&gt;\n&lt;p&gt;Any static table has the attributes represented in the table:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Name&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Mandatory&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;sorted&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether the table is sorted.&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;key_columns&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;string&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Key column names.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;dynamic&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Whether the table is dynamic.&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;schema&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;TableSchema&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Table schema.&lt;/td&gt;\n&lt;td&gt;No&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;row_count&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;integer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Number of rows in the table.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;data_weight&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;integer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A \"logical\" amount of uncompressed data written to a table. Depends only on the values in the table cells and the number of rows. Calculated as &lt;code&gt;row_count + sum(data_weight(value))&lt;/code&gt; for all values in the table cells. &lt;code&gt;data_weight&lt;/code&gt; for a value depends on the physical type of the value: for &lt;code&gt;int64&lt;/code&gt;, &lt;code&gt;uint64&lt;/code&gt;, and &lt;code&gt;double&lt;/code&gt; — 8 bytes; for &lt;code&gt;bool&lt;/code&gt; and &lt;code&gt;null&lt;/code&gt; — 1 byte; for &lt;code&gt;string&lt;/code&gt; —  string length; for &lt;code&gt;any&lt;/code&gt; — length of the value serialized in binary YSON.&lt;/td&gt;\n&lt;td&gt;Yes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Besides that, a table is an object that owns chunks, meaning it has the associated attributes featured in the &lt;a href=\"user-guide/storage/chunks.html#attributes\"&gt;table&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"schema\"&gt;&lt;a href=\"en/user-guide/storage/static-tables.html#schema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Static table schema&lt;/span&gt;&lt;/a&gt;Static table schema&lt;/h2&gt;\n&lt;p&gt;A static table schema is a list of column descriptions. For a detailed description of the schema format, see &lt;a href=\"user-guide/storage/static-schema.html\"&gt;Data schema&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"limitations\"&gt;&lt;a href=\"en/user-guide/storage/static-tables.html#limitations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Limitations&lt;/span&gt;&lt;/a&gt;Limitations&lt;/h2&gt;\n&lt;p&gt;A number of size and content type limitations are imposed on table rows and schema:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;The number of columns in a static table cannot exceed 32,768. We do not recommend using more than a thousand columns.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;The column name is an arbitrary byte sequence that can contain from 1 to 256 characters. In addition, it cannot start with the prefix &lt;code&gt;@&lt;/code&gt;, which is reserved by the system.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;The maximum length of &lt;code&gt;string&lt;/code&gt; values in a static table is limited by the maximum row weight.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;The maximum row weight is 128 megabytes. The row weight is the sum of the lengths of all values in the given row in bytes. The lengths of the values are counted depending on the type:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;int64&lt;/code&gt;, &lt;code&gt;uint64&lt;/code&gt;, and &lt;code&gt;double&lt;/code&gt;: 8 bytes.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;boolean&lt;/code&gt;: 1 byte.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;string&lt;/code&gt;: String length.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;any&lt;/code&gt;: The length of the structure serialized in binary &lt;a href=\"user-guide/storage/yson.html\"&gt;yson&lt;/a&gt;, in bytes.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;null&lt;/code&gt;: 0 bytes.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;The maximum key weight in a sorted table is 256 kilobytes. The default limitation is 16 kilobytes. The key weight is counted similarly to the row weight.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;We strongly advise against raising the limit on the key weight, because there is a risk of exhaustion of the master server memory. You should only change the &lt;code&gt;max_key_weight&lt;/code&gt; setting as an extreme measure.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/storage/static-tables.md","sourcePath":"en/user-guide/storage/static-tables.md"},"headings":[{"title":"General description","href":"en/user-guide/storage/static-tables.html#common","level":2,"items":[{"title":"Sorted tables","href":"en/user-guide/storage/static-tables.html#sorted_tables","level":3},{"title":"Unsorted tables","href":"en/user-guide/storage/static-tables.html#unsorted_tables","level":3}]},{"title":"Attributes","href":"en/user-guide/storage/static-tables.html#attributes","level":2},{"title":"Static table schema","href":"en/user-guide/storage/static-tables.html#schema","level":2},{"title":"Limitations","href":"en/user-guide/storage/static-tables.html#limitations","level":2}],"title":"Static tables"},"router":{"pathname":"en/user-guide/storage/static-tables","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
