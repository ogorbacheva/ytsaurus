        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section contains information about Cypress attributes.&lt;/p&gt;\n&lt;h2 id=\"common\"&gt;&lt;a href=\"en/user-guide/storage/attributes.html#common\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General information&lt;/span&gt;&lt;/a&gt;General information&lt;/h2&gt;\n&lt;p&gt;Each object in YTsaurus has a set of &lt;strong&gt;attributes&lt;/strong&gt; associated with it. The set of attributes can be thought of as a key-value dictionary that is both readable and modifiable. Arbitrary non-empty strings can serve as attribute names. Random non-empty strings can be attribute names. Arbitrary &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON&lt;/a&gt; structures can be values.&lt;/p&gt;\n&lt;p&gt;There are two kinds of attributes: &lt;strong&gt;&lt;a href=\"en/user-guide/storage/attributes.html#system_attr\"&gt;system&lt;/a&gt;&lt;/strong&gt; attributes and &lt;strong&gt;&lt;a href=\"en/user-guide/storage/attributes.html#user_attr\"&gt;user&lt;/a&gt;&lt;/strong&gt; attributes.&lt;/p&gt;\n&lt;p&gt;The special path modifier &lt;code&gt;/@&lt;/code&gt; and the &lt;code&gt;get&lt;/code&gt;, &lt;code&gt;list&lt;/code&gt;, &lt;code&gt;set&lt;/code&gt;, and &lt;code&gt;remove&lt;/code&gt; commands are used to access object attributes. In addition to accessing an attribute as a whole, you can address a part of it if the attribute value is a composite type.&lt;/p&gt;\n&lt;p&gt;For more information about path modifiers, see &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPath&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;For the &lt;code&gt;get&lt;/code&gt; and &lt;code&gt;list&lt;/code&gt; commands, you can optionally specify a list of attributes that you need to return along with the objects found.&lt;/p&gt;\n&lt;h2 id=\"system_attr\"&gt;&lt;a href=\"en/user-guide/storage/attributes.html#system_attr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;System attributes&lt;/span&gt;&lt;/a&gt;System attributes&lt;/h2&gt;\n&lt;p&gt;Different types of objects have their own set of type-specific system attributes. For example, all objects have the &lt;code&gt;id&lt;/code&gt; attribute, tables have the &lt;code&gt;compression_codec&lt;/code&gt; and &lt;code&gt;compressed_data_size&lt;/code&gt; attributes. For more information about the attributes inherent to all objects, see &lt;a href=\"user-guide/storage/objects.html\"&gt;Objects&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;System attributes are either modifiable (can be changed by the user), such as &lt;code&gt;compression_codec&lt;/code&gt;, or unmodifiable, such as &lt;code&gt;compressed_data_size&lt;/code&gt;. If you try to set an unmodifiable attribute, the system will return an error. Attempting to remove a system attribute will also cause an error.&lt;/p&gt;\n&lt;p&gt;Some attributes are &lt;strong&gt;inheritable&lt;/strong&gt;: these attributes can be set on directories (a.k.a. map nodes) where they are nullable, i.e. may lack (and, indeed, do lack by default) a value. If no value for an inheritable attribute is specified when creating a new object, that attribute gets the value of the closest ancestor node, or the default value if no ancestor up to the root has the attribute set.&lt;/p&gt;\n&lt;p&gt;Different types of objects inherit different sets of attributes. The following attributes are inherited by &lt;strong&gt;tables, files, and journals:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;chunk_merger_mode&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;compression_codec&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;enable_striped_erasure&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;erasure_codec&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;hunk_media&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;hunk_primary_medium&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;media&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;primary_medium&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;replication_factor&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;vital&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;In addition, the following attributes are inherited by &lt;strong&gt;tables only:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;atomicity&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;hunk_erasure_codec&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;commit_ordering&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;in_memory_mode&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;optimize_for&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;profiling_mode&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;profiling_tag&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;tablet_cell_bundle&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Chaos replicated tables&lt;/strong&gt; inherit the following attributes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;chaos_cell_bundle&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;System attributes can also be &lt;strong&gt;opaque&lt;/strong&gt; (or &lt;strong&gt;computed&lt;/strong&gt;). The value of an &lt;strong&gt;opaque&lt;/strong&gt; attribute will be available only when explicitly requested with the &lt;code&gt;get&lt;/code&gt; command, but will not be available when all attributes are requested. Specifically, when all attributes are requested, the value of an opaque attribute will be set to &lt;strong&gt;entity&lt;/strong&gt;. Most often, attributes are declared as opaque when they have a large value (in terms of occupied memory) or take a long time to compute. In practical terms, if the value of an attribute is 100 KB or more, you should probably make it opaque. In this case, when all attributes are requested, it will not be returned, making it fast to read all attributes. To get the value of an opaque attribute, you must explicitly request it. An example of an opaque attribute will be a list of all table chunks (the &lt;code&gt;chunk_ids&lt;/code&gt; attribute) or the total usage of resources by Cypress subtree (the &lt;code&gt;recursive_resource_usage&lt;/code&gt; attribute).&lt;/p&gt;\n&lt;p&gt;Below is a list of attributes of YTsaurus system objects:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/objects.html#attributes\"&gt;Attributes of any object&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/cypress.html#attributes\"&gt;Attributes of Cypress nodes&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/static-tables.html#attributes\"&gt;Attributes of static tables&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/dynamic-tables/overview.html#attributes\"&gt;Attributes of dynamic tables&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/files.html#attributes\"&gt;Attributes of files&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;The &lt;a href=\"user-guide/storage/compression.html#get_compression\"&gt;compression_codec&lt;/a&gt; and &lt;a href=\"user-guide/storage/replication.html#erasure\"&gt;erasure_codec&lt;/a&gt; attributes for tables and files.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/transactions.html#attributes\"&gt;Attributes of transactions&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/links.html#attributes\"&gt;Attributes of links&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/accounts.html#account_attributes\"&gt;Attributes of accounts&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/storage/media.html#atributy\"&gt;Attributes of media&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"user_attr\"&gt;&lt;a href=\"en/user-guide/storage/attributes.html#user_attr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;User attributes&lt;/span&gt;&lt;/a&gt;User attributes&lt;/h2&gt;\n&lt;p&gt;The user can set user-defined attributes.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The names (keys) of user attributes must not coincide with the names of system attributes. We recommend starting user attribute names with an underscore to avoid potential problems in the future if the set of system attributes is extended.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Attributes are metadata that is being stored in the Cypress master server memory. It is recommended that the total volume of all user attributes does not exceed hundreds of megabytes.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"how_stored\"&gt;&lt;a href=\"en/user-guide/storage/attributes.html#how_stored\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How attributes are stored in the system&lt;/span&gt;&lt;/a&gt;How attributes are stored in the system&lt;/h2&gt;\n&lt;p&gt;System attributes can be stored in various ways, depending on the object type. Some attributes are computed on the fly instead of being stored. All user attributes are stored as a single key-value dict. This dictionary is encoded as YSON, so accessing the value of a specific attribute requires YSON-decoding.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //tmp/@my_attribute &lt;span class=\"hljs-string\"&gt;'{x=10; y=[\"hello\"; \"world\"]}'&lt;/span&gt;\nyt get //tmp/@my_attribute/x\n10\nyt get //tmp/@my_attribute/y/1\n&lt;span class=\"hljs-string\"&gt;\"world\"&lt;/span&gt;\n\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //tmp/@my_attribute/y/@inner_attribute attr\nyt get //tmp/@my_attribute/y/@inner_attribute\n&lt;span class=\"hljs-string\"&gt;\"attr\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"233\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-233\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-233\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-233.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"en/user-guide/storage/attributes.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Getting all object attributes&lt;/span&gt;\nyt get //tmp/@\n{\n  &lt;span class=\"hljs-string\"&gt;\"creation_time\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"2013-12-06T19:00:48.256444Z\"&lt;/span&gt;;\n  &lt;span class=\"hljs-string\"&gt;\"locks\"&lt;/span&gt; = [];\n ...\n}\n\n&lt;span class=\"hljs-comment\"&gt;# Getting a specific object attribute&lt;/span&gt;\nyt get //tmp/@&lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt;\n&lt;span class=\"hljs-string\"&gt;\"map_node\"&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Setting a specific object attribute&lt;/span&gt;\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //tmp/@my_attribute &lt;span class=\"hljs-string\"&gt;\"my_value\"&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Removing an attribute&lt;/span&gt;\nyt remove //tmp/@my_attribute\n\n&lt;span class=\"hljs-comment\"&gt;# creating a table&lt;/span&gt;\n&lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'{\"a\": 10, \"b\": \"hello\"}'&lt;/span&gt; | yt write //tmp/my_table --format json\n\n&lt;span class=\"hljs-comment\"&gt;# Getting the first table chunk&lt;/span&gt;\nyt get //tmp/my_table/@chunk_ids/0\n&lt;span class=\"hljs-string\"&gt;\"3ab1-cd56f-3ec0064-c8998820\"&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Removing a table&lt;/span&gt;\nyt remove //tmp/my_table --force\n\n\n&lt;span class=\"hljs-comment\"&gt;# Requesting a list with attributes&lt;/span&gt;\nyt list / --attribute &lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt; --format &lt;span class=\"hljs-string\"&gt;'&amp;lt;format=pretty&amp;gt;yson'&lt;/span&gt;\n[\n    &amp;lt;\n        &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"map_node\"&lt;/span&gt;\n    &amp;gt; &lt;span class=\"hljs-string\"&gt;\"home\"&lt;/span&gt;;\n    &amp;lt;\n        &lt;span class=\"hljs-string\"&gt;\"type\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"map_node\"&lt;/span&gt;\n    &amp;gt; &lt;span class=\"hljs-string\"&gt;\"kiwi\"&lt;/span&gt;;\n   ....\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"237\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-237\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-237\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-237.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"path_attr\"&gt;&lt;a href=\"en/user-guide/storage/attributes.html#path_attr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Attributes on paths&lt;/span&gt;&lt;/a&gt;Attributes on paths&lt;/h2&gt;\n&lt;p&gt;A popular scenario for using attributes is annotating the path to tables and files when making requests. For more information, see &lt;a href=\"user-guide/data-processing/operations/operations-options.html#path_attributes\"&gt;Operation options&lt;/a&gt; and &lt;a href=\"user-guide/storage/ypath.html#known_attributes\"&gt;YPath&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/user-guide/storage/attributes.md","sourcePath":"en/user-guide/storage/attributes.md"},"headings":[{"title":"General information","href":"en/user-guide/storage/attributes.html#common","level":2},{"title":"System attributes","href":"en/user-guide/storage/attributes.html#system_attr","level":2},{"title":"User attributes","href":"en/user-guide/storage/attributes.html#user_attr","level":2},{"title":"How attributes are stored in the system","href":"en/user-guide/storage/attributes.html#how_stored","level":2},{"title":"Examples","href":"en/user-guide/storage/attributes.html#examples","level":2},{"title":"Attributes on paths","href":"en/user-guide/storage/attributes.html#path_attr","level":2}],"title":"Attributes"},"router":{"pathname":"en/user-guide/storage/attributes","depth":4,"base":"../../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
