        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"selecting-an-image-and-starting-the-update\"&gt;&lt;a href=\"en/admin-guide/update-ytsaurus.html#selecting-an-image-and-starting-the-update\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Selecting an image and starting the update&lt;/span&gt;&lt;/a&gt;Selecting an image and starting the update&lt;/h2&gt;\n&lt;p&gt;The service regularly receives new releases as well as fixes to the existing stable releases. For more information about existing releases, see &lt;a href=\"admin-guide/releases.html\"&gt;this section&lt;/a&gt;. Docker images with stable releases follow the format &lt;code&gt;ghcr.io/ytsaurus/ytsaurus:23.N.M&lt;/code&gt; (for example, &lt;code&gt;ghcr.io/ytsaurus/ytsaurus:24.1.0&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;A Kubernetes operator supports updates to Docker images used for server components. To update them, change &lt;code&gt;coreImage&lt;/code&gt; in the YTsaurus specification and push it to K8s using the command &lt;code&gt;kubectl apply -f my_ytsaurus_spec.yaml -n &amp;lt;namespace&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;You can only update to more recent versions. If you try to roll back to an older image, you won't be able to deploy the masters. You also can't roll back successful updates to the latest version.&lt;/p&gt;\n&lt;p&gt;We strongly advise against updating to a &lt;code&gt;dev&lt;/code&gt; version compiled from the current &lt;code&gt;main&lt;/code&gt; branch since those YTsaurus versions aren't stable and haven't been properly tested. Moreover, rolling back to the latest stable release will be impossible for the reasons described above.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Important&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Before updating YTsaurus, you first need to update the operator to the latest release. New stable images might not work with an outdated operator, and the operator itself might not work if it has an unstable YTsaurus version like &lt;code&gt;dev&lt;/code&gt;. You can find a list of stable images on the &lt;a href=\"admin-guide/releases\"&gt;Releases&lt;/a&gt; page.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"update-status\"&gt;&lt;a href=\"en/admin-guide/update-ytsaurus.html#update-status\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Update status&lt;/span&gt;&lt;/a&gt;Update status&lt;/h2&gt;\n&lt;p&gt;You can monitor the update status using the &lt;code&gt;Ytsaurus&lt;/code&gt; resource status:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl get ytsaurus -n &amp;lt;namespace&amp;gt;\nNAME         CLUSTERSTATE      UPDATESTATE            UPDATINGCOMPONENTS\nminisaurus   Updating          WaitingForPodsRemoval\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"38\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-38\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-38\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-38.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Once the update starts, the cluster enters the &lt;code&gt;Updating&lt;/code&gt; state (&lt;code&gt;CLUSTERSTATE&lt;/code&gt;), at which point you can start monitoring the update state (&lt;code&gt;UPDATESTATE&lt;/code&gt;). You can get more detailed information about the update progress by running &lt;code&gt;kubectl describe ytsaurus -n &amp;lt;namespace&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;After the update finishes, the cluster goes back to the &lt;code&gt;Running&lt;/code&gt; state:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl get ytsaurus -n &amp;lt;namespace&amp;gt;\nNAME         CLUSTERSTATE   UPDATESTATE   UPDATINGCOMPONENTS\nminisaurus   Running        None\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"45\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-45\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-45\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-45.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"full-and-partial-updates\"&gt;&lt;a href=\"en/admin-guide/update-ytsaurus.html#full-and-partial-updates\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Full and partial updates&lt;/span&gt;&lt;/a&gt;Full and partial updates&lt;/h2&gt;\n&lt;p&gt;In the &lt;code&gt;Ytsaurus&lt;/code&gt; specification, you can set one image for all server components (&lt;code&gt;coreImage&lt;/code&gt;) or different images for different components (in the components' &lt;code&gt;image&lt;/code&gt; field). You only need to set individual images in rare cases, and it's recommended that you discuss this with the &lt;a href=\"https://ytsaurus.tech/#contact\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YTsaurus team&lt;/a&gt; beforehand. If a component has its own image, it will be used. Modifying the &lt;code&gt;image&lt;/code&gt; initiates a cluster update, though this only updates some of the components.&lt;/p&gt;\n&lt;h2 id=\"configs\"&gt;&lt;a href=\"en/admin-guide/update-ytsaurus.html#configs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Updating static configs&lt;/span&gt;&lt;/a&gt;Updating static configs&lt;/h2&gt;\n&lt;p&gt;The operator generates static component configs according to the &lt;code&gt;Ytsaurus&lt;/code&gt; specification. Some modifications (like a change to &lt;code&gt;locations&lt;/code&gt;, for example) may require you generating the config again and restarting the pods for that component. For this reason, config modifications also trigger an update.&lt;/p&gt;\n&lt;h2 id=\"impossible\"&gt;&lt;a href=\"en/admin-guide/update-ytsaurus.html#impossible\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Inability to update&lt;/span&gt;&lt;/a&gt;Inability to update&lt;/h2&gt;\n&lt;p&gt;There are a number of situations where it may not be safe to run an update. Because of this, the operator performs a number of checks before initiating an update, including checking the health of all tablet cell bundles. If the operator decides the update is impossible based on the check results, it sets the update state to &lt;code&gt;ImpossibleToStart&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl get ytsaurus -n &amp;lt;namespace&amp;gt;\nNAME         CLUSTERSTATE   UPDATESTATE           UPDATINGCOMPONENTS\nminisaurus   Updating       ImpossibleToStart\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"64\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-64\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-64\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-64.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You can find out why in the &lt;code&gt;Ytsaurus&lt;/code&gt; status by running &lt;code&gt;kubectl describe ytsaurus -n&amp;lt;namespace&amp;gt;&lt;/code&gt; and checking &lt;code&gt;Conditions&lt;/code&gt; in &lt;code&gt;UpdateStatus&lt;/code&gt;.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sample reason why the update couldn't start&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl describe ytsaurus -n &amp;lt;namespace&amp;gt;\n...\n  Update Status:\n    Conditions:\n      Last Transition Time:  2023-09-26T09:18:11Z\n      Message:               Tablet cell bundles ([sys default]) aren&lt;span class=\"hljs-string\"&gt;'t in '&lt;/span&gt;good&lt;span class=\"hljs-string\"&gt;' health\n      Reason:                Update\n      Status:                True\n      Type:                  NoPossibility\n    State:                   ImpossibleToStart\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"73\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-73\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-73\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-73.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;If that happens, restore the previous specification value to prevent the component images from changing and to ensure that the operator generates the same static configs according to the specification as before. Next, the operator cancels the update and rolls YTsaurus back to the &lt;code&gt;Running&lt;/code&gt; state.&lt;/p&gt;\n&lt;h2 id=\"manual-intervention\"&gt;&lt;a href=\"en/admin-guide/update-ytsaurus.html#manual-intervention\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manual intervention&lt;/span&gt;&lt;/a&gt;Manual intervention&lt;/h2&gt;\n&lt;p&gt;While updating, you might encounter some issues that will require manual intervention. When that happens, set the &lt;code&gt;isManaged=false&lt;/code&gt; flag in the &lt;code&gt;Ytsaurus&lt;/code&gt; specification. This prevents the operator from performing any operations on the cluster, so you can take whatever manual measures are necessary.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;If unforeseen problems occur during the update process, we recommend consulting with the &lt;a href=\"https://ytsaurus.tech/#contact\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YTsaurus team&lt;/a&gt; before doing anything manually.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"operator\"&gt;&lt;a href=\"en/admin-guide/update-ytsaurus.html#operator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Updating the operator&lt;/span&gt;&lt;/a&gt;Updating the operator&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Attention&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Before updating the operator, make sure the cluster is healthy. For example, it shouldn't have any &lt;a href=\"admin-guide/problems/#lvc\"&gt;LVCs&lt;/a&gt;, and all &lt;a href=\"admin-guide/problems/#tabletcellbundles\"&gt;tablet cell bundles&lt;/a&gt; must be alive.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"instructions\"&gt;&lt;a href=\"en/admin-guide/update-ytsaurus.html#instructions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Instructions&lt;/span&gt;&lt;/a&gt;Instructions&lt;/h3&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Launch the chart update:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;helm upgrade ytsaurus --install oci://ghcr.io/ytsaurus/ytop-chart --version &amp;lt;new-version&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"116\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-116\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-116\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-116.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;For a list of available operator versions, see the &lt;a href=\"admin-guide/releases.html#kubernetes-operator\"&gt;release page&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Make sure the operator's old pods have been deleted and new ones have been created:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl get pod -n &amp;lt;namespace&amp;gt;\nNAME                                                      READY   STATUS        RESTARTS   AGE\nytsaurus-ytop-chart-controller-manager-6f67fd5d5c-6bbws   2/2     Running       0          21s\nytsaurus-ytop-chart-controller-manager-7478f9b6cb-qr8wd   2/2     Terminating   0          23h\n\n$ kubectl get pod -n &amp;lt;namespace&amp;gt;\nNAME                                                      READY   STATUS    RESTARTS   AGE\nytsaurus-ytop-chart-controller-manager-6f67fd5d5c-6bbws   2/2     Running   0          25s\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"125\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-125\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-125\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-125.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;If necessary, update the CRDs.&lt;br /&gt;\nBy default, Helm doesn't update previously installed &lt;a href=\"https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/#customresourcedefinitions\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;CRDs&lt;/a&gt;, so you may need to update them manually to use the new spec fields. Always exercise caution when doing manual updates to avoid any potential data loss. To learn more, see the &lt;a href=\"https://helm.sh/docs/topics/charts/#limitations-on-crds\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;documentation for Helm&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;To manually update the CRDs, download the chart locally and then update them using &lt;code&gt;kubectl replace&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ helm pull oci://ghcr.io/ytsaurus/ytop-chart --version &amp;lt;new-version&amp;gt; --untar\n$ helm template ytop-chart --output-dir ./templates\nwrote ./templates/ytop-chart/templates/serviceaccount.yaml\nwrote ./templates/ytop-chart/templates/manager-config.yaml\n...\n$ kubectl replace -f ./templates/ytop-chart/templates/crds/&amp;lt;crd-to-update&amp;gt;\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"134\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-134\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-134\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-134.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You will probably have to update the following CRDs:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;chyts.cluster.ytsaurus.tech.yaml&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;spyts.cluster.ytsaurus.tech.yaml&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ytsaurus.cluster.ytsaurus.tech.yaml&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Following the cluster update, unrecognized options might remain in the master server configs (this occurs when we stop using some config fields in the &lt;code&gt;YTsaurus&lt;/code&gt; version, which is common during major updates). If this situation occurs, you'll see the following alert:&lt;br /&gt;\n&lt;code&gt;Found unrecognized options in dynamic cluster config&lt;/code&gt;.&lt;br /&gt;\nYou can remove unrecognized master options either manually or by running the script available &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/yt/scripts/remove_master_unrecognized_options\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;here&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"possible-automated-cluster-update\"&gt;&lt;a href=\"en/admin-guide/update-ytsaurus.html#possible-automated-cluster-update\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Possible automated cluster update&lt;/span&gt;&lt;/a&gt;Possible automated cluster update&lt;/h3&gt;\n&lt;p&gt;Different operator versions may generate different configs for the same components (for example, a new field may be added in the new operator version). In that case, the cluster update is initiated immediately after starting the operator.&lt;/p&gt;\n&lt;p&gt;If an update is &lt;a href=\"en/admin-guide/update-ytsaurus.html#impossible\"&gt;impossible&lt;/a&gt;, the cluster remains in the &lt;code&gt;Updating&lt;/code&gt; state, and the update status is set to &lt;code&gt;ImpossibleToStart&lt;/code&gt;. If that happens, you can roll back the operator to cancel the update, and the cluster will enter the &lt;code&gt;Running&lt;/code&gt; state. Alternatively, you can set the &lt;code&gt;enableFullUpdate = false&lt;/code&gt; flag in the &lt;code&gt;Ytsaurus&lt;/code&gt; specification, which also cancels the update and stops the new operator from trying to initiate another cluster update. You can then restore the cluster to a healthy state and retry the update by setting the &lt;code&gt;enableFullUpdate = true&lt;/code&gt; flag.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/admin-guide/update-ytsaurus.md","sourcePath":"en/admin-guide/update-ytsaurus.md"},"headings":[{"title":"Selecting an image and starting the update","href":"en/admin-guide/update-ytsaurus.html#selecting-an-image-and-starting-the-update","level":2},{"title":"Update status","href":"en/admin-guide/update-ytsaurus.html#update-status","level":2},{"title":"Full and partial updates","href":"en/admin-guide/update-ytsaurus.html#full-and-partial-updates","level":2},{"title":"Updating static configs","href":"en/admin-guide/update-ytsaurus.html#configs","level":2},{"title":"Inability to update","href":"en/admin-guide/update-ytsaurus.html#impossible","level":2},{"title":"Manual intervention","href":"en/admin-guide/update-ytsaurus.html#manual-intervention","level":2},{"title":"Updating the operator","href":"en/admin-guide/update-ytsaurus.html#operator","level":2,"items":[{"title":"Instructions","href":"en/admin-guide/update-ytsaurus.html#instructions","level":3},{"title":"Possible automated cluster update","href":"en/admin-guide/update-ytsaurus.html#possible-automated-cluster-update","level":3}]}],"title":"Updating YTsaurus server components"},"router":{"pathname":"en/admin-guide/update-ytsaurus","depth":3,"base":"../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
