;\n&lt;li&gt;Cap replica lag time for tables that are rarely written to.&lt;/li&gt;\n&lt;li&gt;Fix possible journal record loss during journal session abort.&lt;/li&gt;\n&lt;li&gt;Fix in backup manager.&lt;/li&gt;\n&lt;li&gt;Fix some bugs in chaos dynamic table replication.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"mapreduce3\"&gt;&lt;a href=\"en/admin-guide/releases.html#mapreduce3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MapReduce&lt;/span&gt;&lt;/a&gt;MapReduce&lt;/h4&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Combined per-locaiton throttlers limiting total in+out bandwidth.&lt;/li&gt;\n&lt;li&gt;Options in operation spec to force memory limits on user job containers.&lt;/li&gt;\n&lt;li&gt;Use codegen comparator in SimpleSort &amp;amp; PartitionSort if possible.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Better profiling tags for job proxy metrics.&lt;/li&gt;\n&lt;li&gt;Fixes for remote copy with erasure repair.&lt;/li&gt;\n&lt;li&gt;Fix any_to_composite converter when multiple schemas have similarly named composite columns.&lt;/li&gt;\n&lt;li&gt;Fixes for partition_table API method.&lt;/li&gt;\n&lt;li&gt;Fixes in new live preview.&lt;/li&gt;\n&lt;li&gt;Do not fail jobs with supervisor communication failures.&lt;/li&gt;\n&lt;li&gt;Multiple retries added in CRI executor/docker image integration.&lt;/li&gt;\n&lt;li&gt;Cleaned up job memory statistics collection, renamed some statistics.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"master-server3\"&gt;&lt;a href=\"en/admin-guide/releases.html#master-server3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Master Server&lt;/span&gt;&lt;/a&gt;Master Server&lt;/h4&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Parallelize and offload virtual map reads.&lt;/li&gt;\n&lt;li&gt;Emergency flag to disable attribute-based access control.&lt;/li&gt;\n&lt;li&gt;Improved performance of transaction commit/abort.&lt;/li&gt;\n&lt;li&gt;Enable snapshot loading by default.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fixes and optimizations for Sequoia chunk replica management.&lt;/li&gt;\n&lt;li&gt;Fix multiple possible master crashes.&lt;/li&gt;\n&lt;li&gt;Fixes for master update with read-only availability.&lt;/li&gt;\n&lt;li&gt;Fixes for jammed incremental hearbeats and lost replica update on disabled locations.&lt;/li&gt;\n&lt;li&gt;Fix per-account sensors on new account creation.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"misc1\"&gt;&lt;a href=\"en/admin-guide/releases.html#misc1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Misc&lt;/span&gt;&lt;/a&gt;Misc&lt;/h4&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Config exposure via orchid became optional.&lt;/li&gt;\n&lt;li&gt;Support some c-ares options in YT config.&lt;/li&gt;\n&lt;li&gt;Support IP addresses in RPC TLS certificate verification.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix connection counter leak in http server.&lt;/li&gt;\n&lt;li&gt;Track and limit memory used by queued RPC requests.&lt;/li&gt;\n&lt;li&gt;Better memory tracking for RPC connection buffers.&lt;/li&gt;\n&lt;li&gt;Fix address resolver configuration.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;23.2.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-02-29&lt;/p&gt;\n&lt;h4 id=\"scheduler\"&gt;&lt;a href=\"en/admin-guide/releases.html#scheduler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Scheduler&lt;/span&gt;&lt;/a&gt;Scheduler&lt;/h4&gt;\n&lt;p&gt;Many internal changes driven by developing new scheduling mechanics that separate jobs from resource allocations at exec nodes. These changes include modification of the protocol of interaction between schedulers, controller agents and exec nodes, and adding tons of new logic for introducing allocations in exec nodes, controller agents and schedulers.&lt;/p&gt;\n&lt;p&gt;List of significant changes and fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Optimize performance of scheduler's Control and NodeShard threads.&lt;/li&gt;\n&lt;li&gt;Optimize performance of the core scheduling algorithm by considering only a subset of operations in most node heartbeats.&lt;/li&gt;\n&lt;li&gt;Optimize operation launch time overhead by not creating debug transaction if neither stderr or core table have been specified.&lt;/li&gt;\n&lt;li&gt;Add priority scheduling for pools with resource guarantees.&lt;/li&gt;\n&lt;li&gt;Consider disk usage in job preemption algorithm.&lt;/li&gt;\n&lt;li&gt;Add operation module assignment preemption in GPU segments scheduling algorithm.&lt;/li&gt;\n&lt;li&gt;Add fixes for GPU scheduling algorithms.&lt;/li&gt;\n&lt;li&gt;Add node heartbeat throttling by scheduling complexity.&lt;/li&gt;\n&lt;li&gt;Add concurrent schedule job exec duration throttling.&lt;/li&gt;\n&lt;li&gt;Reuse job monitoring descriptors within a single operation.&lt;/li&gt;\n&lt;li&gt;Support monitoring descriptors in map operations.&lt;/li&gt;\n&lt;li&gt;Support filtering jobs with monitoring descriptors in &lt;code&gt;list_jobs&lt;/code&gt; command.&lt;/li&gt;\n&lt;li&gt;Fix displaying jobs which disappear due to a node failure as running and \"stale\" in UI.&lt;/li&gt;\n&lt;li&gt;Improve ephemeral subpools configuration.&lt;/li&gt;\n&lt;li&gt;Hide user tokens in scheduler and job proxy logs.&lt;/li&gt;\n&lt;li&gt;Support configurable max capacity for pipes between job proxy and user job.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"queue-agent5\"&gt;&lt;a href=\"en/admin-guide/releases.html#queue-agent5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Queue Agent&lt;/span&gt;&lt;/a&gt;Queue Agent&lt;/h4&gt;\n&lt;p&gt;Aside small improvements, the most significant features include the ability to configure periodic exports of partitioned data from queues into  static tables and the support for using replicated and chaos dynamic tables as queues and consumers.&lt;/p&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Support chaos replicated tables as queues and consumers.&lt;/li&gt;\n&lt;li&gt;Support snapshot exports from queues into static tables.&lt;/li&gt;\n&lt;li&gt;Support queues and consumers that are symbolic links for other queues and consumers.&lt;/li&gt;\n&lt;li&gt;Support trimming of rows in queues by lifetime duration.&lt;/li&gt;\n&lt;li&gt;Support for registering and unregistering of consumer to queue from different cluster.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Trim queues by its &lt;code&gt;object_id&lt;/code&gt;, not by &lt;code&gt;path&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Fix metrics of read rows data weight via consumer.&lt;/li&gt;\n&lt;li&gt;Fix handling frozen tablets in queue.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"proxy5\"&gt;&lt;a href=\"en/admin-guide/releases.html#proxy5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Proxy&lt;/span&gt;&lt;/a&gt;Proxy&lt;/h4&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Add ability to call &lt;code&gt;pull_consumer&lt;/code&gt; without specifying &lt;code&gt;offset&lt;/code&gt;, it will be taken from &lt;code&gt;consumer&lt;/code&gt; table.&lt;/li&gt;\n&lt;li&gt;Add &lt;code&gt;advance_consumer&lt;/code&gt; handler for queues.&lt;/li&gt;\n&lt;li&gt;Early implementation of &lt;code&gt;arrow&lt;/code&gt; format to read/write static tables.&lt;/li&gt;\n&lt;li&gt;Support type conversions for inner fields in complex types.&lt;/li&gt;\n&lt;li&gt;Add new per user memory usage monitoring sensors in RPC proxies.&lt;/li&gt;\n&lt;li&gt;Use ACO for RPC proxies permission management.&lt;/li&gt;\n&lt;li&gt;Introduce TCP Proxies for SPYT.&lt;/li&gt;\n&lt;li&gt;Support of OAuth authorization.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix returning requested system columns in &lt;code&gt;web_json&lt;/code&gt; format.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"dynamic-tables5\"&gt;&lt;a href=\"en/admin-guide/releases.html#dynamic-tables5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dynamic Tables&lt;/span&gt;&lt;/a&gt;Dynamic Tables&lt;/h4&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;DynTables Query language improvments:\n&lt;ul&gt;\n&lt;li&gt;New range inferrer.&lt;/li&gt;\n&lt;li&gt;Add various SQL operators (&amp;lt;&amp;gt;, string length, ||, yson_length, argmin, argmax, coalesce).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Add backups for tables with hunks.&lt;/li&gt;\n&lt;li&gt;New fair share threadpool for select operator and network.&lt;/li&gt;\n&lt;li&gt;Add partial key filtering for range selects.&lt;/li&gt;\n&lt;li&gt;Add overload controller.&lt;/li&gt;\n&lt;li&gt;Distribute load among rpc proxies more evenly.&lt;/li&gt;\n&lt;li&gt;Add per-table size metrics.&lt;/li&gt;\n&lt;li&gt;Store heavy chunk meta in blocks.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"mapreduce4\"&gt;&lt;a href=\"en/admin-guide/releases.html#mapreduce4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MapReduce&lt;/span&gt;&lt;/a&gt;MapReduce&lt;/h4&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;RemoteСopy now supports cypress file objects, in addition to tables.&lt;/li&gt;\n&lt;li&gt;Add support for per job experiments.&lt;/li&gt;\n&lt;li&gt;Early implementation of CRI (container runtime interface) job environment &amp;amp; support for external docker images.&lt;/li&gt;\n&lt;li&gt;New live preview for MapReduce output tables.&lt;/li&gt;\n&lt;li&gt;Add support for arrow as an input format for MapReduce.&lt;/li&gt;\n&lt;li&gt;Support GPU resource in exec-nodes and schedulers.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Enhancements:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Improve memory tracking in data nodes (master jobs, blob write sessions, p2p tracking).&lt;/li&gt;\n&lt;li&gt;Rework memory acccounting in controller agents.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"master-server4\"&gt;&lt;a href=\"en/admin-guide/releases.html#master-server4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Master Server&lt;/span&gt;&lt;/a&gt;Master Server&lt;/h4&gt;\n&lt;p&gt;Noticeable/Potentially Breaking Changes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Read requests are now processed in a multithreaded manner by default.&lt;/li&gt;\n&lt;li&gt;Read-only mode now persists between restarts. &lt;code&gt;yt-admin master-exit-read-only&lt;/code&gt; command should be used to leave it.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;list_node&lt;/code&gt; type has been deprecated. Users are advised to use &lt;code&gt;map_node&lt;/code&gt;s or &lt;code&gt;document&lt;/code&gt;s instead.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ChunkService::ExecuteBatch&lt;/code&gt; RPC call has been deprecated and split into individual calls. Batching chunk service has been superseded by proxying chunk service.&lt;/li&gt;\n&lt;li&gt;New transaction object types: &lt;code&gt;system_transaction&lt;/code&gt;, &lt;code&gt;nested_system_transaction&lt;/code&gt;. Support for transaction actions in regular Cypress transactions is now deprecated.&lt;/li&gt;\n&lt;li&gt;Version 2 of the Hydra library is now enabled by default. Version 1 is officially deprecated.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;It is now possible to update master-servers with no read downtime via leaving non-voting peers to serve read requests while the main quorum is under maintenance.&lt;/li&gt;\n&lt;li&gt;A data node can now be marked as pending restart, hinting the replicator to ignore its absence for a set amount of time to avoid needless replication bursts.&lt;/li&gt;\n&lt;li&gt;The &lt;code&gt;add_maintenance&lt;/code&gt; command now supports HTTP- and RPC-proxies.&lt;/li&gt;\n&lt;li&gt;Attribute-based access control: a user may now be annotated with a set of tags, while an access-control entry (ACE) may be annotated with a tag filter.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Optimizations &amp;amp; Fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Response keeper is now persistent. No warm-up period is required before a peer may begin leading.&lt;/li&gt;\n&lt;li&gt;Chunk metadata now include schemas. This opens up a way to a number of significant optimizations.&lt;/li&gt;\n&lt;li&gt;Data node heartbeat size has been reduced.&lt;/li&gt;\n&lt;li&gt;Chunks and chunk lists are now loaded from snapshot in parallel.&lt;/li&gt;\n&lt;li&gt;Fixed excessive memory consumption in multicell configurations.&lt;/li&gt;\n&lt;li&gt;Accounting code has been improved to properly handle unlimited quotas and avoid negative master memory usage.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Additionally, advancements have been made in the Sequoia project dedicated to scaling master server by offloading certain parts of its state to dynamic tables. (This is far from being production-ready yet.)&lt;/p&gt;\n&lt;h4 id=\"misc2\"&gt;&lt;a href=\"en/admin-guide/releases.html#misc2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Misc&lt;/span&gt;&lt;/a&gt;Misc&lt;/h4&gt;\n&lt;p&gt;Enhancements:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Add rpc server config dynamization.&lt;/li&gt;\n&lt;li&gt;Add support for peer alternative hostname for Bus TLS.&lt;/li&gt;\n&lt;li&gt;Properly handle Content-Encoding in monitoring web-server.&lt;/li&gt;\n&lt;li&gt;Bring back \"host\" attribute to errors.&lt;/li&gt;\n&lt;li&gt;Add support for --version option in ytserver binaries.&lt;/li&gt;\n&lt;li&gt;Add additional metainformation in yson/json server log format (fiberId, traceId, sourceFile).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"query-tracker\"&gt;&lt;a href=\"en/admin-guide/releases.html#query-tracker\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Query Tracker&lt;/span&gt;&lt;/a&gt;Query Tracker&lt;/h2&gt;\n&lt;p&gt;Is released as a docker image.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Releases:&lt;/strong&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.0.10&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-06-23&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Features:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Added clickhouse UDF.&lt;/li&gt;\n&lt;li&gt;Added the \"assigned_tracker\" meta for queries that are in the \"finished\" state.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Internal:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Switched the internal YQL results format. It should not be visible to users.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.0.9&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-04-08&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Features&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Added possibility to ban QT\\YQLA&lt;/li&gt;\n&lt;li&gt;Added QT\\YQLA custom metrics&lt;/li&gt;\n&lt;li&gt;Added YQLA dynamic configuration&lt;/li&gt;\n&lt;li&gt;Added possibility to specify extra credentials for YQL queries&lt;/li&gt;\n&lt;li&gt;Added possibility to configure YQL default cluster per query&lt;/li&gt;\n&lt;li&gt;Added full result table in YQL queries results (available from 25.1 proxies)&lt;/li&gt;\n&lt;li&gt;Supported unicode symbols in SPYT queries&lt;/li&gt;\n&lt;li&gt;Supported results truncation in SPYT queries&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Improvements&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Optimized QT API calls&lt;/li&gt;\n&lt;li&gt;Limited max simultaneous queries per YQLA&lt;/li&gt;\n&lt;li&gt;Configured QT dyntables compaction&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Fixes&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fixed YQL queries abortion&lt;/li&gt;\n&lt;li&gt;Fixed completing of queries with results over 16MB&lt;/li&gt;\n&lt;li&gt;Fixed query completion after responsible qt crash&lt;/li&gt;\n&lt;li&gt;Fixed yqla deadlock&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;NB!&lt;/strong&gt; This release is only compatible with proxy version 24.1.0, operator version 0.23.1 and later&lt;br /&gt;\nhttps://github.com/ytsaurus/ytsaurus/releases/tag/docker%2Fytsaurus%2F24.1.0&lt;br /&gt;\nhttps://github.com/ytsaurus/ytsaurus-k8s-operator/releases/tag/release%2F0.23.1&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.0.8&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-08-26&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Optimized Query Tracker API performance by adding system tables indexes. Issue: #653&lt;/li&gt;\n&lt;li&gt;Added support of SystemPython udfs in YQL queries. Issue: #265&lt;/li&gt;\n&lt;li&gt;Fixed broken logs compression in YQL agent. Issue: #623&lt;/li&gt;\n&lt;li&gt;Optimized simultaneous YQL queries performance&lt;/li&gt;\n&lt;li&gt;Fixed memory leak in YQL Agent&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Important fix.&lt;/strong&gt; Fixed YQL queries results corruption in DQ. Issue: #707&lt;/li&gt;\n&lt;li&gt;Added DQ support in dual stack networks. Issue: #744&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.0.7&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-08-01&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Important fix.&lt;/strong&gt; Fixed YQL queries results corruption. Issue: https://github.com/ytsaurus/ytsaurus/issues/707&lt;/li&gt;\n&lt;li&gt;Fixed YQL DQ launching&lt;/li&gt;\n&lt;li&gt;Fixed bug caused UTF-8 errors in yql-agent logs&lt;/li&gt;\n&lt;li&gt;Fixed multiple deadlocks in yql-agent&lt;/li&gt;\n&lt;li&gt;Added support for SPYT discovery groups&lt;/li&gt;\n&lt;li&gt;Added support for SPYT queries parameters&lt;/li&gt;\n&lt;li&gt;Added everyone-share ACO which can be used to share queries by link.&lt;/li&gt;\n&lt;li&gt;Added support of multiple ACOs per query, feature will be available in fresh UI, SDK releases&lt;/li&gt;\n&lt;li&gt;Changed interaction between Query Tracker and Proxies&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;NB!&lt;/strong&gt; This release is only compatible with proxy version 23.2.1, operator version 0.10.0 and later&lt;br /&gt;\nhttps://github.com/ytsaurus/ytsaurus/releases/tag/docker%2Fytsaurus%2F23.2.1&lt;br /&gt;\nhttps://github.com/ytsaurus/ytsaurus-k8s-operator/releases/tag/release%2F0.10.0&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.0.6&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-04-11&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fixed authorization in complex cluster-free YQL queries&lt;/li&gt;\n&lt;li&gt;Fixed a bug that caused queries with large queries to never complete&lt;/li&gt;\n&lt;li&gt;Fixed a bag caused possibility of SQL injection in query tracker&lt;/li&gt;\n&lt;li&gt;Reduced the size of query_tracker docker images&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Related issues:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://github.com/ytsaurus/yt-k8s-operator/issues/176\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Problems with QT ACOs&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;In case of an error when starting query&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Access control object \"nobody\" does not exist\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3061\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3061\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3061\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3061.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You need to run commands by admin&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;yt create access_control_object_namespace --attr '{name=queries}'\nyt create access_control_object --attr '{namespace=queries;name=nobody}'\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3065\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3065\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3065\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3065.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.0.5&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-03-19&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Added access control to queries&lt;/li&gt;\n&lt;li&gt;Added support for the in‑memory DQ engine that accelerates small YQL queries&lt;/li&gt;\n&lt;li&gt;Added execution mode setting to query tracker. This allows to run queries in validate and explain modes&lt;/li&gt;\n&lt;li&gt;Fixed a bug that caused queries to be lost in query_tracker&lt;/li&gt;\n&lt;li&gt;Fixed a bug related to yson parsing in YQL queries&lt;/li&gt;\n&lt;li&gt;Reduced the load on the state dyntables by QT&lt;/li&gt;\n&lt;li&gt;Improved authentication in YQL queries.&lt;/li&gt;\n&lt;li&gt;Added authentication in SPYT queries&lt;/li&gt;\n&lt;li&gt;Added reuse of spyt sessions. Speeds up the sequential launch of SPYT queries from a single user&lt;/li&gt;\n&lt;li&gt;Changed the build type of QT images from cmake to ya make&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;NB:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Compatible only with operator version &lt;a href=\"https://github.com/ytsaurus/yt-k8s-operator/releases/tag/release%2F0.6.0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;0.6.0&lt;/a&gt; and later&lt;/li&gt;\n&lt;li&gt;Compatible only with proxies version &lt;a href=\"https://github.com/ytsaurus/ytsaurus/releases/tag/docker%2Fytsaurus%2F23.2.0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;23.2&lt;/a&gt; and later&lt;/li&gt;\n&lt;li&gt;Before updating, please read the &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/query-tracker#access-control\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;documentation&lt;/a&gt; section containing information about the new query access control.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;New related issues:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"https://github.com/ytsaurus/yt-k8s-operator/issues/176\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Problems with QT ACOs&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;In case of an error when starting query&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Access control object \"nobody\" does not exist\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3161\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3161\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3161\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3161.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You need to run commands by admin&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;yt create access_control_object_namespace --attr '{name=queries}'\nyt create access_control_object --attr '{namespace=queries;name=nobody}'\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"3165\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-3165\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-3165\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-3165.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.0.4&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2023-12-03&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Applied YQL defaults from the documentation&lt;/li&gt;\n&lt;li&gt;Fixed a bag in YQL queries that don't use YT tables&lt;/li&gt;\n&lt;li&gt;Fixed a bag in YQL queries that use aggregate functions&lt;/li&gt;\n&lt;li&gt;Supported common UDF functions in YQL&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;NB: This release is compatible only with the operator 0.5.0 and newer versions.&lt;br /&gt;\nhttps://github.com/ytsaurus/yt-k8s-operator/releases/tag/release%2F0.5.0&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.0.3&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2023-11-14&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fixed a bug that caused the user transaction to expire before the completion of the yql query on IPv4 only networks.&lt;/li&gt;\n&lt;li&gt;System query_tracker tables have been moved to sys bundle&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.0.1&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2023-10-19&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Added authentication, now all requests are run on behalf of the user that initiated them.&lt;/li&gt;\n&lt;li&gt;Added support for v3 types in YQL queries.&lt;/li&gt;\n&lt;li&gt;Added the ability to set the default cluster to execute YQL queries on.&lt;/li&gt;\n&lt;li&gt;Changed the format of presenting YQL query errors.&lt;/li&gt;\n&lt;li&gt;Fixed a bug that caused errors during the execution of queries that did not return any result.&lt;/li&gt;\n&lt;li&gt;Fixed a bug that caused errors during the execution of queries that extracted data from dynamic tables.&lt;/li&gt;\n&lt;li&gt;Fixed a bug that caused memory usage errors. YqlAgent no longer crashes for no reason under the load.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"strawberry\"&gt;&lt;a href=\"en/admin-guide/releases.html#strawberry\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Strawberry&lt;/span&gt;&lt;/a&gt;Strawberry&lt;/h2&gt;\n&lt;p&gt;Is released as a docker image.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Releases:&lt;/strong&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;v0.0.13&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-04-08&lt;/p&gt;\n&lt;h4 id=\"general-updates\"&gt;&lt;a href=\"en/admin-guide/releases.html#general-updates\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General Updates&lt;/span&gt;&lt;/a&gt;General Updates&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Features:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Improved support for Jupyter operations. Thanks to @dmi-feo and @thenno for the PRs!&lt;/li&gt;\n&lt;li&gt;Added restart command to the controller. (Commit: 7eef7be610082c92ab7608fbebe58f64bf4db42d)&lt;/li&gt;\n&lt;li&gt;Added location-based overriding of the strawberry config. (Commit: 53761978b238167d340a4c4f0ef8309a3555941d)&lt;/li&gt;\n&lt;li&gt;Added the &lt;code&gt;pool_trees&lt;/code&gt; speclet option. (Commit: 26a36552dcd47b4126e21b226532dd1b9c6c551a)&lt;/li&gt;\n&lt;li&gt;Added a &lt;code&gt;filters&lt;/code&gt; parameter to the &lt;code&gt;list&lt;/code&gt; command. (Commit: 007a51cc8364fca85cb8c680b39265dffc76ceda)&lt;/li&gt;\n&lt;li&gt;Added a config option to grant the &lt;code&gt;administer&lt;/code&gt; right to the operation creator. (Commit: 40e9bff15e07d6128bd27b4e77963fe793312bd9)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Fixes:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fixed panic on initialization if the cluster is unavailable. (Commit: b567f1737aeadd3c1ee0eba0d7bc7b46ec66a789)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"chyt\"&gt;&lt;a href=\"en/admin-guide/releases.html#chyt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CHYT&lt;/span&gt;&lt;/a&gt;CHYT&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Added an option to disable the export of runtime data from CHYT operations and an explicit expiration timeout for exported data. (Commit: 58d91c249ee4aaf7d7be3070af58569f5f2ad1b9)&lt;/li&gt;\n&lt;li&gt;Changed the default &lt;code&gt;read_from&lt;/code&gt; option in AttributeCache. (Commit: 33de404dcce77593968fa45d548bf9ebceb3204e)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"spyt\"&gt;&lt;a href=\"en/admin-guide/releases.html#spyt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SPYT&lt;/span&gt;&lt;/a&gt;SPYT&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Added Squashfs support for Livy via strawberry. (Commit: 15c08cd668eacdf57312dc9bcb01452faa82ce7d)&lt;/li&gt;\n&lt;li&gt;Specified yt token for Livy operations. (Commit: c91680616715f65da1855669e082a914f9909973)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"jupyter\"&gt;&lt;a href=\"en/admin-guide/releases.html#jupyter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jupyter&lt;/span&gt;&lt;/a&gt;Jupyter&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Added GPU support in Jupyter operations. (Commit: 935e0a5a7c2ffd4a45d3e4260f9aea9d4534a8c0)&lt;/li&gt;\n&lt;li&gt;Added job scaler interface and used it to suspend inactive Jupyter operations. (Commit: e4b7df0c0213644f54af6411ed06b2bc34576059)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;v0.0.12&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-06-21&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;CHYT:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Make &lt;code&gt;enable_geodata&lt;/code&gt;  default value configurable and set to &lt;code&gt;false&lt;/code&gt; by default (PR: #667). Thanks @thenno for the PR!&lt;/li&gt;\n&lt;li&gt;Configure system log tables exporter during the clique start&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Livy:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Add SPYT Livy support to the controller&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"chyt1\"&gt;&lt;a href=\"en/admin-guide/releases.html#chyt1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CHYT&lt;/span&gt;&lt;/a&gt;CHYT&lt;/h2&gt;\n&lt;p&gt;Is released as a docker image.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Releases:&lt;/strong&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;2.17.2&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-07-04&lt;/p&gt;\n&lt;p&gt;No description&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;2.16.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-11-06&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Support ClickHouse query cache (may be configured via &lt;code&gt;clickhouse_config&lt;/code&gt;)&lt;/li&gt;\n&lt;li&gt;Read in order optimization (PR #757)&lt;/li&gt;\n&lt;li&gt;New PREWHERE algorithm on a data conversion level, turned on by default&lt;/li&gt;\n&lt;li&gt;Convert &lt;code&gt;bool&lt;/code&gt; data type to &lt;code&gt;Bool&lt;/code&gt; instread of &lt;code&gt;YtBoolean&lt;/code&gt;. &lt;code&gt;YtBoolean&lt;/code&gt; type is deprecated&lt;/li&gt;\n&lt;li&gt;Convert &lt;code&gt;dict&lt;/code&gt; data type to &lt;code&gt;Map&lt;/code&gt; instead of &lt;code&gt;Array(Typle(Key, Value))&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Convert &lt;code&gt;timestamp&lt;/code&gt; data type to &lt;code&gt;DateTime64&lt;/code&gt; instead of &lt;code&gt;UInt64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Support reading and writing &lt;code&gt;date32&lt;/code&gt;, &lt;code&gt;datetime64&lt;/code&gt;, &lt;code&gt;timestamp64&lt;/code&gt;, &lt;code&gt;interval64&lt;/code&gt; data types&lt;/li&gt;\n&lt;li&gt;Support reading &lt;code&gt;json&lt;/code&gt; data type as &lt;code&gt;String&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Support JSON_* functions from ClickHouse&lt;/li&gt;\n&lt;li&gt;The ability to specify a cypress directory as a database&lt;/li&gt;\n&lt;li&gt;Support exporting system log tables to cypress (query_log, metric_log, etc)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Note&lt;/strong&gt;: &lt;code&gt;date32&lt;/code&gt;, &lt;code&gt;datetime64&lt;/code&gt;, &lt;code&gt;timestamp64&lt;/code&gt; and &lt;code&gt;interval64&lt;/code&gt; were introduced in YTsaurus 24.1. If the YTsaurus cluster version is older, trying to store these data types in a table will lead to a &lt;code&gt;not a valid type&lt;/code&gt; error.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;2.14.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-02-15&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Support SQL UDFs&lt;/li&gt;\n&lt;li&gt;Support reading dynamic and static tables via concat-functions&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;2.13.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-01-19&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Update ClickHouse code version to the latest LTS release (22.8 -&amp;gt; 23.8)&lt;/li&gt;\n&lt;li&gt;Support for reading and writing ordered dynamic tables&lt;/li&gt;\n&lt;li&gt;Move dumping query registry debug information to a separate thread&lt;/li&gt;\n&lt;li&gt;Configure temporary data storage&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"spyt1\"&gt;&lt;a href=\"en/admin-guide/releases.html#spyt1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SPYT&lt;/span&gt;&lt;/a&gt;SPYT&lt;/h2&gt;\n&lt;p&gt;Is released as a docker image.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Releases:&lt;/strong&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;2.7.1&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-08-15&lt;/p&gt;\n&lt;p&gt;Maintenance release with minor enhancements&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Optimizing the number of requests to master in bulk reading scenarios&lt;/li&gt;\n&lt;li&gt;Hiding sensitive information from driver command line and passing it via secure vault&lt;/li&gt;\n&lt;li&gt;Fix executors hostname in network project&lt;/li&gt;\n&lt;li&gt;Showing executor operation id in driver operation description&lt;/li&gt;\n&lt;li&gt;Fix java properties escaping&lt;/li&gt;\n&lt;li&gt;Including parsing context in parsing exceptions&lt;/li&gt;\n&lt;li&gt;Fix joins by uint64 columns&lt;/li&gt;\n&lt;li&gt;Support for setting secure vault in direct submit scenarios&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;2.7.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-07-24&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;YTsaurus shuffle service support&lt;/li&gt;\n&lt;li&gt;Metrics refactoring for inner cluster and direct submit modes&lt;/li&gt;\n&lt;li&gt;Dynamic table queries via SQL API doesn't require explicit timestamp&lt;/li&gt;\n&lt;li&gt;Bugs and stability fixes:&lt;/li&gt;\n&lt;li&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix OutOfMemory errors for optimized-for scan sorted tables&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix casting types to uint64 in codegen&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix \"Manually specified and authenticated users mismatch\" YT error in direct submit&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;ul&gt;\n&lt;li&gt;Other minor fixes&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;2.6.5&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-06-08&lt;/p&gt;\n&lt;p&gt;Maintenance release with minor enhancements&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Support for Spark 3.5.6&lt;/li&gt;\n&lt;li&gt;Minor improvements for Spark Streaming support in YTsaurus&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;2.6.4&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-05-16&lt;/p&gt;\n&lt;p&gt;Maintenance release with minor enhancements and bug fixes&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Support for retrieving driver operation id in direct submit scenarios&lt;/li&gt;\n&lt;li&gt;Reducing YTsaurusClient threads by reusing client instances&lt;/li&gt;\n&lt;li&gt;Fix JSON layout for log4j2&lt;/li&gt;\n&lt;li&gt;Transaction titles for SPYT transactions&lt;/li&gt;\n&lt;li&gt;Fix prometeus metrics configuration&lt;/li&gt;\n&lt;li&gt;Fix dedicated driver mode for standalone cluster&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;2.6.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-04-23&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Java 17 support&lt;/li&gt;\n&lt;li&gt;Support for UUID and Json YTsaurus types&lt;/li&gt;\n&lt;li&gt;Support for RPC-job proxy in direct submit&lt;/li&gt;\n&lt;li&gt;Support for additional task parameters in YTsaurus operation specification via Spark config in direct submit&lt;/li&gt;\n&lt;li&gt;Support for taking snapshots locks at reading time&lt;/li&gt;\n&lt;li&gt;Explicit flag for truncated result of Query Tracker queries&lt;/li&gt;\n&lt;li&gt;Fix compatibility with Spark 3.5.4 and 3.5.5&lt;/li&gt;\n&lt;li&gt;Fix for date- and timestamp SQL-functions via Query Tracker&lt;/li&gt;\n&lt;li&gt;Many stability and other bug fixes&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;2.5.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-12-25&lt;/p&gt;\n&lt;p&gt;Major release that enables support for Spark 3.4.x and 3.5.x.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Compile-time Spark version is changed from 3.2.2 to 3.5.4;&lt;/li&gt;\n&lt;li&gt;SPYT compile-time Spark version will be the latest available supported version since this release;&lt;/li&gt;\n&lt;li&gt;Backward compatibility is still preserved down to Spark 3.2.2;&lt;/li&gt;\n&lt;li&gt;Unit tests can be run over different Spark version than used at compile time via &lt;code&gt;-DtestSparkVersion=3.x.x&lt;/code&gt; sbt flag&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;2.4.4&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-12-20&lt;/p&gt;\n&lt;p&gt;Maintenance release with bug fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Providing network project for Livy via command line argument&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;2.4.3&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-12-16&lt;/p&gt;\n&lt;p&gt;Maintenance release with bug fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Specifying network project for direct submit and setting it from Livy&lt;/li&gt;\n&lt;li&gt;Fix read and write for structs with float value using Dataset API&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;2.4.2&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-12-06&lt;/p&gt;\n&lt;p&gt;Maintenance release with bug fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Autocast DatetimeType to TimestampType in spark udf&lt;/li&gt;\n&lt;li&gt;Add parsing spark.executorEnv and spark.ytsaurus.driverEnv and set SPARK_LOCAL_DIRS&lt;/li&gt;\n&lt;li&gt;Fix worker_disk_limit and worker_disk_account parameters for standalone cluster&lt;/li&gt;\n&lt;li&gt;Using compatible SPYT versions instead of latest for direct submit&lt;/li&gt;\n&lt;li&gt;Separate proxy role into client (spark.hadoop.yt.proxyRole) and cluster (spark.hadoop.yt.clusterProxyRole)&lt;/li&gt;\n&lt;li&gt;Add flag spark.ytsaurus.driver.watch for watching driver operation&lt;/li&gt;\n&lt;li&gt;Fix reading Livy logs&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;2.4.1&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-11-12&lt;/p&gt;\n&lt;p&gt;Maintenance release with bug fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix creating tables via Spark SQL without explicitly specifying ytTable schema&lt;/li&gt;\n&lt;li&gt;Fix serializing and deserializing nested time types&lt;/li&gt;\n&lt;li&gt;Fix casting NULL in nested data structures&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;2.4.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-10-31&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Support for running local files and their dependencies in direct submit mode by uploading it to YTsaurus cache&lt;/li&gt;\n&lt;li&gt;Support for submitting compiled python binaries as spark applications via direct submit&lt;/li&gt;\n&lt;li&gt;Dataframe write schema hints&lt;/li&gt;\n&lt;li&gt;Bug fixes:&lt;/li&gt;\n&lt;li&gt;\n&lt;ul&gt;\n&lt;li&gt;Writing to external S3 from YTsaurus&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;ul&gt;\n&lt;li&gt;Reading float values from nested structures&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;ul&gt;\n&lt;li&gt;Columnar format reading for Spark 3.3.x&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;ul&gt;\n&lt;li&gt;Reading arbitrary files from Cypress when using Spark 3.3.x&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;2.3.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-09-11&lt;/p&gt;\n&lt;p&gt;The major feature of SPYT 2.3.0 is support for Spark 3.3.x. Other notable features are:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Support for extended Datetime types such as Date32, Datetime32, Timestamp64, Interval64;&lt;/li&gt;\n&lt;li&gt;Support for table properties in Spark SQL;&lt;/li&gt;\n&lt;li&gt;Support for writing using Hive partitioning schema;&lt;/li&gt;\n&lt;li&gt;Support for specifying random port for Shuffle service in inner standalone cluster;&lt;/li&gt;\n&lt;li&gt;Fix for runtime statistics;&lt;/li&gt;\n&lt;li&gt;Bug-Fixes for user-provided schema and for dataframes persisting.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;2.2.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-08-14&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Support for reading from multiple YTsaurus clusters&lt;/li&gt;\n&lt;li&gt;Supplying annotations for YTsaurus operations via conf parameters&lt;/li&gt;\n&lt;li&gt;Support for specifying custom schema on read&lt;/li&gt;\n&lt;li&gt;Support for --archives parameter in spark-submit&lt;/li&gt;\n&lt;li&gt;Fix for int8 and int16 as nested fields&lt;/li&gt;\n&lt;li&gt;Transactional read fix&lt;/li&gt;\n&lt;li&gt;Other minor fixes&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;2.1.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-06-19&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Support for running applications using GPU&lt;/li&gt;\n&lt;li&gt;Support for Spark versions 3.2.2-3.2.4&lt;/li&gt;\n&lt;li&gt;History server support for direct submit scenarios&lt;/li&gt;\n&lt;li&gt;Support for https and TCP proxy in direct submit scenarios&lt;/li&gt;\n&lt;li&gt;Other minor fixes and improvements&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;2.0.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-05-29&lt;/p&gt;\n&lt;p&gt;SPYT 2.0.0 is the first release under the new release scheme and in the separate ytsaurus-spyt repository. The main feature of this release is that we have finally switched from Apache Spark fork that was used in previous releases to original Apache Spark distributive. The 2.0.0 SPYT release is still using Apache Spark 3.2.2, but we plan to support all Apache Spark 3.x.x releases in the nearest future!&lt;/p&gt;\n&lt;p&gt;Other notable changes are:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Support for direct submit on using Livy via Query Tracker;&lt;/li&gt;\n&lt;li&gt;Split data-source module into data-source-base that uses standard Spark types for all YTsaurus types, and data-source-extended for our implementation of custom YTsaurus types that don't have direct matches in Spark type system;&lt;/li&gt;\n&lt;li&gt;Support for direct submit from Jupyter notebooks;&lt;/li&gt;\n&lt;li&gt;Custom UDT for YTsaurus datetime type.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"kubernetes-operator\"&gt;&lt;a href=\"en/admin-guide/releases.html#kubernetes-operator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kubernetes operator&lt;/span&gt;&lt;/a&gt;Kubernetes operator&lt;/h2&gt;\n&lt;p&gt;Is released as helm charts on &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/pkgs/container/ytop-chart\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Github Packages&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Releases:&lt;/strong&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.25.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-07-23&lt;/p&gt;\n&lt;h4 id=\"features\"&gt;&lt;a href=\"en/admin-guide/releases.html#features\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Support for &lt;a href=\"https://github.com/ytsaurus/ytsaurus/releases/tag/docker%2Fytsaurus%2F25.1.0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YTsaurus Server 25.1.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;Native RPC mTLS by @koct9i in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/493&lt;/li&gt;\n&lt;li&gt;Add ability to override http proxy ports by @imakunin in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/505&lt;/li&gt;\n&lt;li&gt;Support new exe node config format by @k-pogorelov in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/511&lt;/li&gt;\n&lt;li&gt;Support HydraPersistenceUploader sidecar by @ilyaibraev in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/489&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"minor\"&gt;&lt;a href=\"en/admin-guide/releases.html#minor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Minor&lt;/span&gt;&lt;/a&gt;Minor&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Sync exec node if containerd config changes by @sanchosancho in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/480&lt;/li&gt;\n&lt;li&gt;Fix atomic status update in update plan logic by @koct9i in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/496&lt;/li&gt;\n&lt;li&gt;Fix non-idempotent CreateUser by @koct9i in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/515&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"new-contributors\"&gt;&lt;a href=\"en/admin-guide/releases.html#new-contributors\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;New Contributors&lt;/span&gt;&lt;/a&gt;New Contributors&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;@sanchosancho made their first contribution in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/480&lt;/li&gt;\n&lt;li&gt;@kirillgrachoff made their first contribution in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/492&lt;/li&gt;\n&lt;li&gt;@ilyaibraev made their first contribution in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/489&lt;/li&gt;\n&lt;li&gt;@k-pogorelov made their first contribution in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/511&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Full Changelog&lt;/strong&gt;: https://github.com/ytsaurus/ytsaurus-k8s-operator/compare/release/0.24.0...release/0.25.0&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.24.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-05-20&lt;/p&gt;\n&lt;h4 id=\"minor1\"&gt;&lt;a href=\"en/admin-guide/releases.html#minor1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Minor&lt;/span&gt;&lt;/a&gt;Minor&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Rerun init queue agent script during QA update by @savnadya in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/479&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Full Changelog&lt;/strong&gt;: https://github.com/ytsaurus/ytsaurus-k8s-operator/compare/release/0.23.1...release/0.24.0&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.23.1&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-04-04&lt;/p&gt;\n&lt;h4 id=\"minor2\"&gt;&lt;a href=\"en/admin-guide/releases.html#minor2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Minor&lt;/span&gt;&lt;/a&gt;Minor&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Revert \"Disable stockpile by default\" in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/477&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The change introduced in 0.23.0 was reverted due to the fact it ends up in updating all components of all existing clusters on the operator update, but change is not important. We'll consider making it opt-in in the next releases.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.23.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-04-02&lt;/p&gt;\n&lt;h4 id=\"minor3\"&gt;&lt;a href=\"en/admin-guide/releases.html#minor3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Minor&lt;/span&gt;&lt;/a&gt;Minor&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix bug in blocked components column by @l0kix2 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/464&lt;/li&gt;\n&lt;li&gt;Deleted the &lt;code&gt;stderr&lt;/code&gt; logger for JobProxy. by @imakunin in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/465&lt;/li&gt;\n&lt;li&gt;Set init quota for user-defined mediums by @futujaos in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/466&lt;/li&gt;\n&lt;li&gt;Disable stockpile by default by @imakunin in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/467&lt;/li&gt;\n&lt;li&gt;tablet node tag filter for bundles in bootstrap by @futujaos in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/468&lt;/li&gt;\n&lt;li&gt;Create ROADMAP.md by @AMRivkin in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/473&lt;/li&gt;\n&lt;li&gt;Configure yqla mrjob syslibs V2 by @Krisha11 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/475&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"release-notes\"&gt;&lt;a href=\"en/admin-guide/releases.html#release-notes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Release notes&lt;/span&gt;&lt;/a&gt;Release notes&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;configureMrJobSystemLibs&lt;/code&gt; field was removed https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/475 and now system libs for YQL agent are being added unconditionally.&lt;/li&gt;\n&lt;li&gt;stockpile/thread_count is set to zero in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/467 to remove non-relevant warnings in logs, as a downside it will trigger all components update.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"new-contributors1\"&gt;&lt;a href=\"en/admin-guide/releases.html#new-contributors1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;New Contributors&lt;/span&gt;&lt;/a&gt;New Contributors&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;@futujaos made their first contribution in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/466&lt;/li&gt;\n&lt;li&gt;@AMRivkin made their first contribution in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/473&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Full Changelog&lt;/strong&gt;: https://github.com/ytsaurus/ytsaurus-k8s-operator/compare/release/0.22.0...release/0.23.0&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.22.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-03-07&lt;/p&gt;\n&lt;h4 id=\"features1\"&gt;&lt;a href=\"en/admin-guide/releases.html#features1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Update to YTsaurus 24.2 is supported&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"minor4\"&gt;&lt;a href=\"en/admin-guide/releases.html#minor4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Minor&lt;/span&gt;&lt;/a&gt;Minor&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Add lost CA bundle and TLS secrets VolumeMounts for jobs container by @imakunin in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/449&lt;/li&gt;\n&lt;li&gt;Add bus client configuration by @imakunin in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/450&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"experimental\"&gt;&lt;a href=\"en/admin-guide/releases.html#experimental\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Experimental&lt;/span&gt;&lt;/a&gt;Experimental&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Add multiple update selectors by @wilwell in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/383&lt;/li&gt;\n&lt;li&gt;Add blocked components column to kubectl output by @l0kix2 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/459&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"new-contributors2\"&gt;&lt;a href=\"en/admin-guide/releases.html#new-contributors2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;New Contributors&lt;/span&gt;&lt;/a&gt;New Contributors&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;@imakunin made their first contribution in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/449&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Full Changelog&lt;/strong&gt;: https://github.com/ytsaurus/ytsaurus-k8s-operator/compare/release/0.21.0...release/0.22.0&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.21.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-02-10&lt;/p&gt;\n&lt;h4 id=\"features2\"&gt;&lt;a href=\"en/admin-guide/releases.html#features2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Support the ability to deploy a Kafka proxy by @savnadya in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/407&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"minor5\"&gt;&lt;a href=\"en/admin-guide/releases.html#minor5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Minor&lt;/span&gt;&lt;/a&gt;Minor&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Add config for kind with audit log by @koct9i in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/441&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"bugfix\"&gt;&lt;a href=\"en/admin-guide/releases.html#bugfix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bugfix&lt;/span&gt;&lt;/a&gt;Bugfix&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Preserve object finalizers by @koct9i in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/440&lt;/li&gt;\n&lt;li&gt;Set quota and min_disk_space for locations by @koct9i in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/445&lt;/li&gt;\n&lt;li&gt;Fix zero port if no monitoring port configured by @l0kix2 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/447&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.20.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-01-20&lt;/p&gt;\n&lt;h4 id=\"minor6\"&gt;&lt;a href=\"en/admin-guide/releases.html#minor6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Minor&lt;/span&gt;&lt;/a&gt;Minor&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Support not creating non-existing users by @l0kix2 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/416&lt;/li&gt;\n&lt;li&gt;Added DNSConfig into Instance and YTsaurusSpec by @qurname2 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/420&lt;/li&gt;\n&lt;li&gt;Enable real chunks job by @l0kix2 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/412&lt;/li&gt;\n&lt;li&gt;Add log_manager_template for job proxy by @l0kix2 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/428&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"release-notes1\"&gt;&lt;a href=\"en/admin-guide/releases.html#release-notes1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Release notes&lt;/span&gt;&lt;/a&gt;Release notes&lt;/h4&gt;\n&lt;p&gt;This release makes yt operator compatible with ytsaurus 24.2.&lt;br /&gt;\nUpdate to this version will launch job for setting correct enable_real_chunks_value values in cypress and exec nodes will be updated with a new config.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Full Changelog&lt;/strong&gt;: https://github.com/ytsaurus/ytsaurus-k8s-operator/compare/release/0.19.0...release/0.20.0&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.19.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-01-09&lt;/p&gt;\n&lt;h4 id=\"minor7\"&gt;&lt;a href=\"en/admin-guide/releases.html#minor7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Minor&lt;/span&gt;&lt;/a&gt;Minor&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Configure yqla mrjob syslibs by @Krisha11 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/409&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"bugfix1\"&gt;&lt;a href=\"en/admin-guide/releases.html#bugfix1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bugfix&lt;/span&gt;&lt;/a&gt;Bugfix&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Add yqla update job by @Krisha11 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/387&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Full Changelog&lt;/strong&gt;: https://github.com/ytsaurus/ytsaurus-k8s-operator/compare/release/0.18.1...release/0.19.0&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.18.1&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-12-13&lt;/p&gt;\n&lt;h4 id=\"minor8\"&gt;&lt;a href=\"en/admin-guide/releases.html#minor8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Minor&lt;/span&gt;&lt;/a&gt;Minor&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;more validation by @koct9i in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/393&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"bugfix2\"&gt;&lt;a href=\"en/admin-guide/releases.html#bugfix2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bugfix&lt;/span&gt;&lt;/a&gt;Bugfix&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix updates for named cluster components @l0kix2 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/401&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Full Changelog&lt;/strong&gt;: https://github.com/ytsaurus/ytsaurus-k8s-operator/compare/release/0.18.0...release/0.18.1&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.18.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-11-26&lt;/p&gt;\n&lt;h4 id=\"warning\"&gt;&lt;a href=\"en/admin-guide/releases.html#warning\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Warning&lt;/span&gt;&lt;/a&gt;Warning&lt;/h4&gt;\n&lt;p&gt;This release has known bug, which broke update for YTsaurus components with non-empty names (names can be set for data/tablet/exec nodes) and roles (can be set for proxies).&lt;br /&gt;\nThe bug was fixed in &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/releases/tag/release%2F0.18.1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;0.18.1&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"features3\"&gt;&lt;a href=\"en/admin-guide/releases.html#features3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Implemented RemoteTabletNodes api by @qurname2 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/372&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"minor9\"&gt;&lt;a href=\"en/admin-guide/releases.html#minor9\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Minor&lt;/span&gt;&lt;/a&gt;Minor&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Update sample config for cluster with TLS by @koct9i in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/369&lt;/li&gt;\n&lt;li&gt;Remove DataNodes from StatelesOnly update by @koct9i in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/371&lt;/li&gt;\n&lt;li&gt;Added namespacedScope value to the helm chart by @qurname2 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/376&lt;/li&gt;\n&lt;li&gt;Upgrade crd-ref-docs by @koct9i in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/379&lt;/li&gt;\n&lt;li&gt;Add observed generation for remote nodes by @koct9i in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/382&lt;/li&gt;\n&lt;li&gt;Support different controller families in strawberry configuration by @dmi-feo in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/355&lt;/li&gt;\n&lt;li&gt;kata-compat: mount TLS-related files to a separate directory by @kruftik in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/388&lt;/li&gt;\n&lt;li&gt;Support OAuth login transformations by @l0kix2 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/397&lt;/li&gt;\n&lt;li&gt;Add diff for static config update case by @l0kix2 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/398&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"bugfix3\"&gt;&lt;a href=\"en/admin-guide/releases.html#bugfix3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bugfix&lt;/span&gt;&lt;/a&gt;Bugfix&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix observed generation by @koct9i in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/373&lt;/li&gt;\n&lt;li&gt;Fix YQL agent dynamic config creation by @savnadya in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/377&lt;/li&gt;\n&lt;li&gt;Fix logging in chyt_controller by @dmi-feo in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/370&lt;/li&gt;\n&lt;li&gt;Fix strawberry container name by @dmi-feo in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/375&lt;/li&gt;\n&lt;li&gt;Use expected instance count as default for minimal ready count by @koct9i in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/395&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"new-contributors3\"&gt;&lt;a href=\"en/admin-guide/releases.html#new-contributors3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;New Contributors&lt;/span&gt;&lt;/a&gt;New Contributors&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;@dmi-feo made their first contribution in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/370&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Full Changelog&lt;/strong&gt;: https://github.com/ytsaurus/ytsaurus-k8s-operator/compare/release/0.17.0...release/0.18.0&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.17.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-10-11&lt;/p&gt;\n&lt;h4 id=\"minor10\"&gt;&lt;a href=\"en/admin-guide/releases.html#minor10\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Minor&lt;/span&gt;&lt;/a&gt;Minor&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Separate CHYT init options into makeDefault and createPublicClique by @achulkov2 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/347&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"bugfix4\"&gt;&lt;a href=\"en/admin-guide/releases.html#bugfix4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bugfix&lt;/span&gt;&lt;/a&gt;Bugfix&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix queue agent init script usage for 24.* by @l0kix2 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/356&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.16.2&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-09-13&lt;/p&gt;\n&lt;h4 id=\"bugfix5\"&gt;&lt;a href=\"en/admin-guide/releases.html#bugfix5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bugfix&lt;/span&gt;&lt;/a&gt;Bugfix&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix strawberry controller image for 2nd job by @l0kix2 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/345&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.16.1&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-09-13&lt;/p&gt;\n&lt;h4 id=\"warning1\"&gt;&lt;a href=\"en/admin-guide/releases.html#warning1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Warning&lt;/span&gt;&lt;/a&gt;Warning&lt;/h4&gt;\n&lt;p&gt;This release has a bug if Strawberry components is enabled.&lt;br /&gt;\nUse 0.16.2 instead.&lt;/p&gt;\n&lt;h4 id=\"bugfix6\"&gt;&lt;a href=\"en/admin-guide/releases.html#bugfix6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bugfix&lt;/span&gt;&lt;/a&gt;Bugfix&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Revert job image override for UI/strawberry by @l0kix2 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/344 — the bug was introduced in 0.16.0&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.16.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-09-12&lt;/p&gt;\n&lt;h4 id=\"warning2\"&gt;&lt;a href=\"en/admin-guide/releases.html#warning2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Warning&lt;/span&gt;&lt;/a&gt;Warning&lt;/h4&gt;\n&lt;p&gt;This release has a bug for a configuration where UI or Strawberry components are enabled and some of their images were overridden (k8s init jobs will fail for such components).&lt;br /&gt;\nUse 0.16.2 instead.&lt;/p&gt;\n&lt;h4 id=\"minor11\"&gt;&lt;a href=\"en/admin-guide/releases.html#minor11\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Minor&lt;/span&gt;&lt;/a&gt;Minor&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Add observedGeneration field to the YtsaurusStatus by @wilwell in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/333&lt;/li&gt;\n&lt;li&gt;Set statistics for job low cpu usage alerts by @koct9i in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/335&lt;/li&gt;\n&lt;li&gt;Add nodeSelector for UI and Strawberry by @l0kix2 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/338&lt;/li&gt;\n&lt;li&gt;Init job creates from InstanceSpec image if specified by @wilwell in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/336&lt;/li&gt;\n&lt;li&gt;Add tolerations and nodeselectors to jobs by @l0kix2 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/342&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"new-contributors4\"&gt;&lt;a href=\"en/admin-guide/releases.html#new-contributors4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;New Contributors&lt;/span&gt;&lt;/a&gt;New Contributors&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;@wilwell made their first contribution in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/333&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.15.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-09-04&lt;/p&gt;\n&lt;h4 id=\"backward-incompatible-changes\"&gt;&lt;a href=\"en/admin-guide/releases.html#backward-incompatible-changes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Backward incompatible changes&lt;/span&gt;&lt;/a&gt;Backward incompatible changes&lt;/h4&gt;\n&lt;ol&gt;\n&lt;li&gt;Component pod labels were refactored in #326 and changes are:&lt;/li&gt;\n&lt;/ol&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;app.kubernetes.io/instance&lt;/code&gt; was removed&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;app.kubernetes.io/name&lt;/code&gt; was Ytsaurus before, now it contains component type&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;app.kubernetes.io/managed-by&lt;/code&gt; is &lt;code&gt;\"ytsaurus-k8s-operator\"&lt;/code&gt; instead of &lt;code&gt;\"Ytsaurus-k8s-operator\"&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;ol start=\"2\" style=\"--hier-list-start:1\"&gt;\n&lt;li&gt;Deprecated &lt;code&gt;chyt&lt;/code&gt; field in the main &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/blob/main/docs/api.md#ytsaurusspec\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YTsaurus spec&lt;/a&gt; was removed, use &lt;code&gt;strawberry&lt;/code&gt; field with the same schema instead.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"minor12\"&gt;&lt;a href=\"en/admin-guide/releases.html#minor12\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Minor&lt;/span&gt;&lt;/a&gt;Minor&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Added tolerations for Strawberry by @qurname2 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/328&lt;/li&gt;\n&lt;li&gt;Refactor label names for components by @achulkov2 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/326&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"experimental1\"&gt;&lt;a href=\"en/admin-guide/releases.html#experimental1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Experimental&lt;/span&gt;&lt;/a&gt;Experimental&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;RemoteDataNodes by @qurname2 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/330&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.14.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-08-22&lt;/p&gt;\n&lt;h4 id=\"backward-incompatible-changes1\"&gt;&lt;a href=\"en/admin-guide/releases.html#backward-incompatible-changes1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Backward incompatible changes&lt;/span&gt;&lt;/a&gt;Backward incompatible changes&lt;/h4&gt;\n&lt;p&gt;Before this release &lt;code&gt;StrawberryController&lt;/code&gt; was unconditionally configured with &lt;code&gt;{address_resolver={enable_ipv4=%true;enable_ipv6=%true}}&lt;/code&gt; in its static config. From now on it respects common &lt;code&gt;useIpv6&lt;/code&gt; and &lt;code&gt;useIpv4&lt;/code&gt; fields, which can be set in the &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/blob/main/docs/api.md#ytsaurusspec\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtsaurusSpec&lt;/a&gt;.&lt;br /&gt;\nIf for some reason it is required to have configuration different from&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;useIpv6:&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;useIpv4:&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"5002\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-5002\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-5002\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" beg
