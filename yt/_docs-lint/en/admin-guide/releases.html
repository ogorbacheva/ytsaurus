in=\"visibileAnimation-5002.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;for the main Ytsaurus spec and at the same time &lt;code&gt;enable_ipv4=%true;enable_ipv6=%true&lt;/code&gt; for the &lt;code&gt;StrawberryController&lt;/code&gt;, it is possible to achieve that by using &lt;code&gt;configOverrides&lt;/code&gt; ConfigMap with&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;data:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;strawberry-controller.yson:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;|\n    {\n      controllers = {\n        chyt = {\n          address_resolver = {\n            enable_ipv4 = %true;\n            enable_ipv6 = %true;\n          };\n        };\n      };\n    }\n&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"5006\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-5006\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-5006\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-5006.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"minor13\"&gt;&lt;a href=\"en/admin-guide/releases.html#minor13\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Minor&lt;/span&gt;&lt;/a&gt;Minor&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Add no more than one ytsaurus spec per namespace validation by @qurname2 in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/305&lt;/li&gt;\n&lt;li&gt;Add strategy, nodeSelector, affinity, tolerations by @sgburtsev in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/321&lt;/li&gt;\n&lt;li&gt;Add forceTcp and keepSocket options by @leo-astorsky in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/324&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"bugfixes\"&gt;&lt;a href=\"en/admin-guide/releases.html#bugfixes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bugfixes&lt;/span&gt;&lt;/a&gt;Bugfixes&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix empty volumes array in sample config by @koct9i in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/318&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"new-contributors5\"&gt;&lt;a href=\"en/admin-guide/releases.html#new-contributors5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;New Contributors&lt;/span&gt;&lt;/a&gt;New Contributors&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;@leo-astorsky made their first contribution in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/324&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.13.1&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-07-30&lt;/p&gt;\n&lt;h4 id=\"bugfixes1\"&gt;&lt;a href=\"en/admin-guide/releases.html#bugfixes1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bugfixes&lt;/span&gt;&lt;/a&gt;Bugfixes&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Revert deprecation of useInsecureCookies in #310 by @sgburtsev in https://github.com/ytsaurus/ytsaurus-k8s-operator/pull/317&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The field &lt;code&gt;useInsecureCookies&lt;/code&gt; was deprecated in the previous release in a not backwards compatible way, this release fixes it. It is now possible to configure the secureness of UI cookies (via the &lt;code&gt;useInsecureCookies&lt;/code&gt; field) and the secureness of UI and HTTP proxy interaction (via the &lt;code&gt;secure&lt;/code&gt; field) independently.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.13.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-07-23&lt;/p&gt;\n&lt;h4 id=\"features4\"&gt;&lt;a href=\"en/admin-guide/releases.html#features4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Add per-component terminationGracePeriodSeconds by @koct9i in https://github.com/ytsaurus/yt-k8s-operator/pull/304&lt;/li&gt;\n&lt;li&gt;Added externalProxy parameter for UI by @sgburtsev in https://github.com/ytsaurus/yt-k8s-operator/pull/308&lt;/li&gt;\n&lt;li&gt;Size as Quantity in LogRotationPolicy by @sgburtsev in https://github.com/ytsaurus/yt-k8s-operator/pull/309&lt;/li&gt;\n&lt;li&gt;Use &lt;code&gt;secure&lt;/code&gt; instead of &lt;code&gt;useInsecureCookies&lt;/code&gt;, pass caBundle to UI by @sgburtsev in https://github.com/ytsaurus/yt-k8s-operator/pull/310&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"minor14\"&gt;&lt;a href=\"en/admin-guide/releases.html#minor14\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Minor&lt;/span&gt;&lt;/a&gt;Minor&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Add all YTsaurus CRD into category \"ytsaurus-all\" \"yt-all\" by @koct9i in https://github.com/ytsaurus/yt-k8s-operator/pull/311&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"bugfixes2\"&gt;&lt;a href=\"en/admin-guide/releases.html#bugfixes2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bugfixes&lt;/span&gt;&lt;/a&gt;Bugfixes&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Operator should detect configOverrides updates by @l0kix2 in https://github.com/ytsaurus/yt-k8s-operator/pull/314&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.12.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-06-28&lt;/p&gt;\n&lt;h4 id=\"features5\"&gt;&lt;a href=\"en/admin-guide/releases.html#features5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;More options for store locations. by @sgburtsev in https://github.com/ytsaurus/yt-k8s-operator/pull/294\n&lt;ul&gt;\n&lt;li&gt;data nodes upper limit for &lt;code&gt;low_watermark&lt;/code&gt; increased from 5 to 25Gib;&lt;/li&gt;\n&lt;li&gt;data nodes' &lt;code&gt;trash_cleanup_watermark&lt;/code&gt; will be set equal to the &lt;code&gt;lowWatermark&lt;/code&gt; value from spec&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_trash_ttl&lt;/code&gt;can be configured in spec&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Add support for directDownload to UI Spec by @kozubaeff in https://github.com/ytsaurus/yt-k8s-operator/pull/257\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;directDownload&lt;/code&gt; for UI can be configured in the spec now. If omitted or set to &lt;code&gt;true&lt;/code&gt;, UI will have current default behaviour (use proxies for download), if set to &lt;code&gt;false&lt;/code&gt; — UI backend will be used for downloading.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"new-contributors6\"&gt;&lt;a href=\"en/admin-guide/releases.html#new-contributors6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;New Contributors&lt;/span&gt;&lt;/a&gt;New Contributors&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;@sgburtsev made their first contribution in https://github.com/ytsaurus/yt-k8s-operator/pull/294&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.11.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-06-27&lt;/p&gt;\n&lt;h4 id=\"features6\"&gt;&lt;a href=\"en/admin-guide/releases.html#features6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;SetHostnameAsFQDN option is added to all components. Default is true by @qurname2 in https://github.com/ytsaurus/yt-k8s-operator/pull/302&lt;/li&gt;\n&lt;li&gt;Add per-component option hostNetwork by @koct9i in https://github.com/ytsaurus/yt-k8s-operator/pull/287&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"minor15\"&gt;&lt;a href=\"en/admin-guide/releases.html#minor15\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Minor&lt;/span&gt;&lt;/a&gt;Minor&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Add option for per location disk space quota by @koct9i in https://github.com/ytsaurus/yt-k8s-operator/pull/279&lt;/li&gt;\n&lt;li&gt;Add into exec node pods environment variables for CRI tools by @koct9i in https://github.com/ytsaurus/yt-k8s-operator/pull/283&lt;/li&gt;\n&lt;li&gt;Add per-instance-group podLabels and podAnnotations by @koct9i in https://github.com/ytsaurus/yt-k8s-operator/pull/289&lt;/li&gt;\n&lt;li&gt;Sort status conditions for better readability by @koct9i in https://github.com/ytsaurus/yt-k8s-operator/pull/290&lt;/li&gt;\n&lt;li&gt;Add init containers for exec node by @koct9i in https://github.com/ytsaurus/yt-k8s-operator/pull/288&lt;/li&gt;\n&lt;li&gt;Add loglevel \"warning\" by @koct9i in https://github.com/ytsaurus/yt-k8s-operator/pull/292&lt;/li&gt;\n&lt;li&gt;Remove mutating/defaulter webhooks by @koct9i in https://github.com/ytsaurus/yt-k8s-operator/pull/296&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"bugfixes3\"&gt;&lt;a href=\"en/admin-guide/releases.html#bugfixes3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bugfixes&lt;/span&gt;&lt;/a&gt;Bugfixes&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;fix exec node resource calculation on non-isolated CRI-powered job environment by @kruftik in https://github.com/ytsaurus/yt-k8s-operator/pull/277&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.10.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-06-07&lt;/p&gt;\n&lt;h4 id=\"features7\"&gt;&lt;a href=\"en/admin-guide/releases.html#features7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;h4 id=\"minor16\"&gt;&lt;a href=\"en/admin-guide/releases.html#minor16\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Minor&lt;/span&gt;&lt;/a&gt;Minor&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Add everyone-share QT ACO by @Krisha11 in #272&lt;/li&gt;\n&lt;li&gt;Add channel in qt config by @Krisha11 in #273&lt;/li&gt;\n&lt;li&gt;Add option for per location disk space quota #279&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"bugfixes4\"&gt;&lt;a href=\"en/admin-guide/releases.html#bugfixes4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bugfixes&lt;/span&gt;&lt;/a&gt;Bugfixes&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix exec node resource calculation on non-isolated CRI-powered job environment #277&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.9.1&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-05-30&lt;/p&gt;\n&lt;h4 id=\"features8\"&gt;&lt;a href=\"en/admin-guide/releases.html#features8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;h4 id=\"minor17\"&gt;&lt;a href=\"en/admin-guide/releases.html#minor17\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Minor&lt;/span&gt;&lt;/a&gt;Minor&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Add 'physical_host' to cypress_annotations for CMS and UI сompatibility #252&lt;/li&gt;\n&lt;li&gt;added WATCH_NAMESPACE env and LeaderElectionNamespace #168&lt;/li&gt;\n&lt;li&gt;Add configuration for solomon exporter: specify host and some instance tags #258&lt;/li&gt;\n&lt;li&gt;Add sidecars support to primary masters containers #259&lt;/li&gt;\n&lt;li&gt;Add option for containerd registry config path #264&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"bugfixes5\"&gt;&lt;a href=\"en/admin-guide/releases.html#bugfixes5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bugfixes&lt;/span&gt;&lt;/a&gt;Bugfixes&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix CRI job environment for remote exec nodes #261&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.9.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-04-23&lt;/p&gt;\n&lt;h4 id=\"features9\"&gt;&lt;a href=\"en/admin-guide/releases.html#features9\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Add experimental (behaviour may change) UpdateSelector field #211 to be able to update components separately&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"minor18\"&gt;&lt;a href=\"en/admin-guide/releases.html#minor18\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Minor&lt;/span&gt;&lt;/a&gt;Minor&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Enable TmpFS when possible #235&lt;/li&gt;\n&lt;li&gt;Disable disk quota for slot locations #236&lt;/li&gt;\n&lt;li&gt;Forward docker image environment variables to user job #248&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"bugfixes6\"&gt;&lt;a href=\"en/admin-guide/releases.html#bugfixes6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bugfixes&lt;/span&gt;&lt;/a&gt;Bugfixes&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix flag doNotSetUserId #243&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.8.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-04-12&lt;/p&gt;\n&lt;h4 id=\"features10\"&gt;&lt;a href=\"en/admin-guide/releases.html#features10\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;h4 id=\"minor19\"&gt;&lt;a href=\"en/admin-guide/releases.html#minor19\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Minor&lt;/span&gt;&lt;/a&gt;Minor&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Increased default value for MaxSnapshotCountToKeep and MaxChangelogCountToKeep&lt;/li&gt;\n&lt;li&gt;Tune default bundle replication factor #210&lt;/li&gt;\n&lt;li&gt;Set EnableServiceLinks=false for all pods #218&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"bugfixes7\"&gt;&lt;a href=\"en/admin-guide/releases.html#bugfixes7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bugfixes&lt;/span&gt;&lt;/a&gt;Bugfixes&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix authentication configuration for RPC Proxy #207&lt;/li&gt;\n&lt;li&gt;Job script updated on restart #224&lt;/li&gt;\n&lt;li&gt;Use secure random and base64 for tokens #202&lt;/li&gt;\n&lt;li&gt;Fix running jobs with custom docker_image when default job image is not set #217&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.7.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-04-04&lt;/p&gt;\n&lt;h4 id=\"features11\"&gt;&lt;a href=\"en/admin-guide/releases.html#features11\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Add Remote exec nodes support #75&lt;/li&gt;\n&lt;li&gt;Add MasterCaches support #122&lt;/li&gt;\n&lt;li&gt;Enable TLS certificate auto-update for http proxies #167&lt;/li&gt;\n&lt;li&gt;CRI containerd job environment #105&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"minor20\"&gt;&lt;a href=\"en/admin-guide/releases.html#minor20\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Minor&lt;/span&gt;&lt;/a&gt;Minor&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Support RuntimeClassName in InstanceSpec&lt;/li&gt;\n&lt;li&gt;Configurable monitoring port #146&lt;/li&gt;\n&lt;li&gt;Not triggering full update for data nodes update&lt;/li&gt;\n&lt;li&gt;Add ALLOW_PASSWORD_AUTH to UI #162&lt;/li&gt;\n&lt;li&gt;Readiness checks for strawberry &amp;amp; UI&lt;/li&gt;\n&lt;li&gt;Medium is called domestic medium now #88&lt;/li&gt;\n&lt;li&gt;Tune tablet changelog/snapshot initial replication factor according to data node count #185&lt;/li&gt;\n&lt;li&gt;Generate markdown API docs&lt;/li&gt;\n&lt;li&gt;Rename operations archive #116&lt;/li&gt;\n&lt;li&gt;Configure cluster to use jupyt #149&lt;/li&gt;\n&lt;li&gt;Fix QT ACOs creation on cluster update #176&lt;/li&gt;\n&lt;li&gt;Set ACLs for QT ACOs, add everyone-use ACO #181&lt;/li&gt;\n&lt;li&gt;Enable rpc proxy in job proxy #197&lt;/li&gt;\n&lt;li&gt;Add yqla token file in container #140&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"bugfixes8\"&gt;&lt;a href=\"en/admin-guide/releases.html#bugfixes8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bugfixes&lt;/span&gt;&lt;/a&gt;Bugfixes&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Replace YQL Agent default monitoring port 10029 -&amp;gt; 10019&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.6.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-02-26&lt;/p&gt;\n&lt;h4 id=\"features12\"&gt;&lt;a href=\"en/admin-guide/releases.html#features12\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Added support for updating masters of 23.2 versions&lt;/li&gt;\n&lt;li&gt;Added the ability to bind masters to the set of nodes by node hostnames.&lt;/li&gt;\n&lt;li&gt;Added the ability to configure the number of stored snapshots and changelogs in master spec&lt;/li&gt;\n&lt;li&gt;Added the ability for users to create access control objects&lt;/li&gt;\n&lt;li&gt;Added support for volume mount with mountPropagation = Bidirectional mode in execNodes&lt;/li&gt;\n&lt;li&gt;Added access control object namespace \"queries\" and object \"nobody\". They are necessary for query_tracker versions 0.0.5 and higher.&lt;/li&gt;\n&lt;li&gt;Added support for the new Cliques CHYT UI.&lt;/li&gt;\n&lt;li&gt;Added the creation of a group for admins (admins).&lt;/li&gt;\n&lt;li&gt;Added readiness probes to component statefulset specs&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"fixes\"&gt;&lt;a href=\"en/admin-guide/releases.html#fixes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fixes&lt;/span&gt;&lt;/a&gt;Fixes&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Improved ACLs on master schemas&lt;/li&gt;\n&lt;li&gt;Master and scheduler init jobs do not overwrite existing dynamic configs anymore.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"tests\"&gt;&lt;a href=\"en/admin-guide/releases.html#tests\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tests&lt;/span&gt;&lt;/a&gt;Tests&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Added flow to run tests on Github resources&lt;/li&gt;\n&lt;li&gt;Added e2e to check that updating from 23.1 to 23.2 works&lt;/li&gt;\n&lt;li&gt;Added config generator tests for all components&lt;/li&gt;\n&lt;li&gt;Added respect KIND_CLUSTER_NAME env variable in e2e tests&lt;/li&gt;\n&lt;li&gt;Supported local k8s port forwarding in e2e&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"backward-incompatible-changes2\"&gt;&lt;a href=\"en/admin-guide/releases.html#backward-incompatible-changes2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Backward Incompatible Changes&lt;/span&gt;&lt;/a&gt;Backward Incompatible Changes&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;exec_agent&lt;/code&gt; was renamed to &lt;code&gt;exec_node&lt;/code&gt; in exec node config, if your specs have &lt;code&gt;configOverrides&lt;/code&gt; please rename fields accordingly.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.5.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2023-11-29&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Features&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Added &lt;code&gt;minReadyInstanceCount&lt;/code&gt; into Ytsaurus components which allows not to wait when all pods are ready.&lt;/li&gt;\n&lt;li&gt;Support queue agent.&lt;/li&gt;\n&lt;li&gt;Added postprocessing of generated static configs.&lt;/li&gt;\n&lt;li&gt;Introduced separate UseIPv4 option to allow dualstack configurations.&lt;/li&gt;\n&lt;li&gt;Support masters in host network mode.&lt;/li&gt;\n&lt;li&gt;Added spyt engine in query tracker by default.&lt;/li&gt;\n&lt;li&gt;Enabled both ipv4 and ipv6 by default in chyt controllers.&lt;/li&gt;\n&lt;li&gt;Default CHYT clique creates as tracked instead of untracked.&lt;/li&gt;\n&lt;li&gt;Don't run full update check if full update is not enabled (&lt;code&gt;enable_full_update&lt;/code&gt; flag in spec).&lt;/li&gt;\n&lt;li&gt;Update cluster algorithm was improved. If full update is needed for already running components and new components was added, operator will run new components at first, and only then start full update. Previously such reconfiguration was not supported.&lt;/li&gt;\n&lt;li&gt;Added optional TLS support for native-rpc connections.&lt;/li&gt;\n&lt;li&gt;Added possibility to configure job proxy loggers.&lt;/li&gt;\n&lt;li&gt;Changed how node resource limits are calculated from &lt;code&gt;resourceLimits&lt;/code&gt; and &lt;code&gt;resourceRequests&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Enabled debug logs of YTsaurus go client for controller pod.&lt;/li&gt;\n&lt;li&gt;Supported dualstack clusters in YQL agent.&lt;/li&gt;\n&lt;li&gt;Supported new config format of YQL agent.&lt;/li&gt;\n&lt;li&gt;Supported &lt;code&gt;NodePort&lt;/code&gt; specification for HTTP proxy (http, https), UI (http) and RPC proxy (rpc port). For TCP proxy NodePorts are used implicitly when NodePort service is chosen. Port range size and minPort are now customizable.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Fixes&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fixed YQL agents on ipv6-only clusters.&lt;/li&gt;\n&lt;li&gt;Fixed deadlock in case when UI deployment is manually deleted.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Tests&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;e2e tests were fixed.&lt;/li&gt;\n&lt;li&gt;Added e2e test for operator version compat.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.4.1&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2023-10-03&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Features&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Support per-instance-group config override&lt;/li&gt;\n&lt;li&gt;Support TLS for RPC proxies&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Bug fixes&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fixed an error during creation of default &lt;code&gt;CHYT&lt;/code&gt; clique (&lt;code&gt;ch_public&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.4.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2023-09-26&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Features&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The operations archive will be updated when the scheduler image changes.&lt;/li&gt;\n&lt;li&gt;Ability to specify different images for different components.&lt;/li&gt;\n&lt;li&gt;Cluster update without full downtime for stateless components was supported.&lt;/li&gt;\n&lt;li&gt;Updating of static component configs if necessary was supported.&lt;/li&gt;\n&lt;li&gt;Improved SPYT controller. Added initialization status (&lt;code&gt;ReleaseStatus&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;Added CHYT controller and the ability to load several different versions on one YTsaurus cluster.&lt;/li&gt;\n&lt;li&gt;Added the ability to specify the log format (&lt;code&gt;yson&lt;/code&gt;, &lt;code&gt;json&lt;/code&gt; or &lt;code&gt;plain_text&lt;/code&gt;), as well as the ability to enable recording of structured logs.&lt;/li&gt;\n&lt;li&gt;Added more diagnostics about deploying cluster components in the &lt;code&gt;Ytsaurus&lt;/code&gt; status.&lt;/li&gt;\n&lt;li&gt;Added the ability to disable the launch of a full update (&lt;code&gt;enableFullUpdate&lt;/code&gt; field in &lt;code&gt;Ytsaurus&lt;/code&gt; spec).&lt;/li&gt;\n&lt;li&gt;The &lt;code&gt;chyt&lt;/code&gt; spec field was renamed to &lt;code&gt;strawberry&lt;/code&gt;. For backward compatibility, it remains in &lt;code&gt;crd&lt;/code&gt;, but it is recommended to rename it.&lt;/li&gt;\n&lt;li&gt;The size of &lt;code&gt;description&lt;/code&gt; in &lt;code&gt;crd&lt;/code&gt; is now limited to 80 characters, greatly reducing the size of &lt;code&gt;crd&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Query Tracker&lt;/code&gt; status tables are now automatically migrated when it is updated.&lt;/li&gt;\n&lt;li&gt;Added the ability to set privileged mode for &lt;code&gt;exec node&lt;/code&gt; containers.&lt;/li&gt;\n&lt;li&gt;Added &lt;code&gt;TCP proxy&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Added more spec validation: checks that the paths in the locations belong to one of the volumes, and also checks that for each specified component there are all the components necessary for its successful work.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;strawberry controller&lt;/code&gt; and &lt;code&gt;ui&lt;/code&gt; can also be updated.&lt;/li&gt;\n&lt;li&gt;Added the ability to deploy &lt;code&gt;http-proxy&lt;/code&gt; with TLS.&lt;/li&gt;\n&lt;li&gt;Odin service address for the UI can be specified in spec.&lt;/li&gt;\n&lt;li&gt;Added the ability to configure &lt;code&gt;tags&lt;/code&gt; and &lt;code&gt;rack&lt;/code&gt; for nodes.&lt;/li&gt;\n&lt;li&gt;Supported OAuth service configuration in the spec.&lt;/li&gt;\n&lt;li&gt;Added the ability to pass additional environment variables to the UI, as well as set the theme and environment (&lt;code&gt;testing&lt;/code&gt;, &lt;code&gt;production&lt;/code&gt;, etc.) for the UI.&lt;/li&gt;\n&lt;li&gt;Data node location mediums are created automatically during the initial deployment of the cluster.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.3.1&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2023-08-14&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Features&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Added the ability to configure automatic log rotation.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;toleration&lt;/code&gt; and &lt;code&gt;nodeSelector&lt;/code&gt; can be specified in instance specs of components.&lt;/li&gt;\n&lt;li&gt;Types of generated objects are specified in controller configuration, so operator respond to modifications of generated objects by reconciling.&lt;/li&gt;\n&lt;li&gt;Config maps store data in text form instead of binary, so that you can view the contents of configs through &lt;code&gt;kubectl describe configmap &amp;lt;configmap-name&amp;gt;&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Added calculation and setting of &lt;code&gt;disk_usage_watermark&lt;/code&gt; and &lt;code&gt;disk_quota&lt;/code&gt; for exec node.&lt;/li&gt;\n&lt;li&gt;Added a SPYT controller and the ability to load the necessary for SPYT into Cypress using a separate resource, which allows you to have several versions of SPYT on one cluster.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Bug fixes&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fixed an error in the naming of the &lt;code&gt;medium_name&lt;/code&gt; field in static configs.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"ytsaurus-python-yson\"&gt;&lt;a href=\"en/admin-guide/releases.html#ytsaurus-python-yson\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YTsaurus Python YSON&lt;/span&gt;&lt;/a&gt;YTsaurus Python YSON&lt;/h2&gt;\n&lt;p&gt;Availabe as a package in &lt;a href=\"https://pypi.org/project/ytsaurus-yson/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;PyPI&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Releases:&lt;/strong&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.4.10&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-03-05&lt;/p&gt;\n&lt;h4 id=\"features13\"&gt;&lt;a href=\"en/admin-guide/releases.html#features13\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Support &lt;code&gt;dump-parquet&lt;/code&gt; in parallel mode&lt;/li&gt;\n&lt;li&gt;Support &lt;code&gt;read_table_structured&lt;/code&gt; in parallel mode&lt;/li&gt;\n&lt;li&gt;Support retries while upload parquet/orc&lt;/li&gt;\n&lt;li&gt;Support &lt;code&gt;dump-orc&lt;/code&gt; in parallel mode&lt;/li&gt;\n&lt;li&gt;Add &lt;code&gt;min_batch_row_count&lt;/code&gt; option to dump parquet&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"fixes1\"&gt;&lt;a href=\"en/admin-guide/releases.html#fixes1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fixes&lt;/span&gt;&lt;/a&gt;Fixes&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix &lt;code&gt;Unexpected end of stream&lt;/code&gt; error in upload parquet&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.4.9&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-08-07&lt;/p&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Support ORC format&lt;/li&gt;\n&lt;li&gt;Access thread local variables via noinline functions&lt;/li&gt;\n&lt;li&gt;Support Python 3.13 (avoid using deprecated PyImport_ImportModuleNoBlock)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.4.8&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-04-24&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Add table creation in upload parquet&lt;/li&gt;\n&lt;li&gt;Reduce bindings .so size&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.4.7&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-03-09&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Add implementation of &lt;code&gt;upload_parquet&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Fix invalid memory access in YsonStringProxy&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"sdk\"&gt;&lt;a href=\"en/admin-guide/releases.html#sdk\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SDK&lt;/span&gt;&lt;/a&gt;SDK&lt;/h2&gt;\n&lt;h3 id=\"python\"&gt;&lt;a href=\"en/admin-guide/releases.html#python\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Python&lt;/span&gt;&lt;/a&gt;Python&lt;/h3&gt;\n&lt;p&gt;Availabe as a package in &lt;a href=\"https://pypi.org/project/ytsaurus-client/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;PyPI&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Releases:&lt;/strong&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.13.35&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-08-12&lt;/p&gt;\n&lt;h4 id=\"features14\"&gt;&lt;a href=\"en/admin-guide/releases.html#features14\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Add compression codec option for parquet.&lt;/li&gt;\n&lt;li&gt;Add methods for distributed write API.&lt;/li&gt;\n&lt;li&gt;Add typing for config and for spec builders.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"fixes2\"&gt;&lt;a href=\"en/admin-guide/releases.html#fixes2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fixes&lt;/span&gt;&lt;/a&gt;Fixes&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Add details to import error of pickling encryption.&lt;/li&gt;\n&lt;li&gt;Fix wording of write_table description.&lt;/li&gt;\n&lt;li&gt;Fix YSON convert for bytes object.&lt;/li&gt;\n&lt;li&gt;Remove old *_ratio and *_share terms from YT CLI.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.13.34&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-07-27&lt;/p&gt;\n&lt;h4 id=\"features15\"&gt;&lt;a href=\"en/admin-guide/releases.html#features15\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Added support for &lt;code&gt;YT_LOG_PATH&lt;/code&gt; for RPC requests&lt;/li&gt;\n&lt;li&gt;Added &lt;code&gt;--attribute&lt;/code&gt; argument for &lt;code&gt;list_operations&lt;/code&gt; CLI command&lt;/li&gt;\n&lt;li&gt;Rework local RPC connection configuration&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.13.33&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-07-14&lt;/p&gt;\n&lt;h4 id=\"features16\"&gt;&lt;a href=\"en/admin-guide/releases.html#features16\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Support tz types in python&lt;/li&gt;\n&lt;li&gt;Add type hints for YtClient config&lt;/li&gt;\n&lt;li&gt;Support custom auth class in Python SDK config&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"fixes3\"&gt;&lt;a href=\"en/admin-guide/releases.html#fixes3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fixes&lt;/span&gt;&lt;/a&gt;Fixes&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix hiding tokens in case of YtProxyUnavailable exception&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.13.31&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-06-20&lt;/p&gt;\n&lt;h4 id=\"features17\"&gt;&lt;a href=\"en/admin-guide/releases.html#features17\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Minor improvements&lt;/li&gt;\n&lt;li&gt;Bump py-dependencies 2f5dc26abd27401d7c775b4e7406b4c85c1c4105&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.13.30&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-06-16&lt;/p&gt;\n&lt;h4 id=\"features18\"&gt;&lt;a href=\"en/admin-guide/releases.html#features18\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Introduce &lt;code&gt;list_operation_events&lt;/code&gt; command&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.13.29&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-06-02&lt;/p&gt;\n&lt;h4 id=\"features19\"&gt;&lt;a href=\"en/admin-guide/releases.html#features19\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Add &lt;code&gt;annotate_with_types&lt;/code&gt; to &lt;code&gt;yson_to_json&lt;/code&gt; function&lt;/li&gt;\n&lt;li&gt;Improve proxy banned warning message&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"fixes4\"&gt;&lt;a href=\"en/admin-guide/releases.html#fixes4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fixes&lt;/span&gt;&lt;/a&gt;Fixes&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Remove &lt;code&gt;YtSequoiaRetriableError&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Fix handling errors in &lt;code&gt;write_table&lt;/code&gt; with enabled framing&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.13.28&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-04-30&lt;/p&gt;\n&lt;h4 id=\"features20\"&gt;&lt;a href=\"en/admin-guide/releases.html#features20\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Turn on &lt;code&gt;redirect_stdout_to_stderr&lt;/code&gt; by default&lt;/li&gt;\n&lt;li&gt;Add password strength validation in &lt;code&gt;set_user_password&lt;/code&gt; request&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.13.27&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-04-18&lt;/p&gt;\n&lt;h4 id=\"features21\"&gt;&lt;a href=\"en/admin-guide/releases.html#features21\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Active users of dynamic tables APIs are encouraged to use RPC proxies&lt;/li&gt;\n&lt;li&gt;Support using /api/v4/discover_proxies handler instead of /hosts&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"fixes5\"&gt;&lt;a href=\"en/admin-guide/releases.html#fixes5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fixes&lt;/span&gt;&lt;/a&gt;Fixes&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Error on getting &lt;code&gt;impersonation_user&lt;/code&gt; setting from configuration&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.13.26&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-03-25&lt;/p&gt;\n&lt;h4 id=\"features22\"&gt;&lt;a href=\"en/admin-guide/releases.html#features22\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Add support of &lt;code&gt;expression&lt;/code&gt; and &lt;code&gt;aggregate&lt;/code&gt; properties in TableSchema.&lt;/li&gt;\n&lt;li&gt;Add impersonation support.&lt;/li&gt;\n&lt;li&gt;Do not strip docker host in spec builder.&lt;/li&gt;\n&lt;li&gt;Add logging of bad requests.&lt;/li&gt;\n&lt;li&gt;Bump ytsaurus-client dependencies.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.13.25&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-03-12&lt;/p&gt;\n&lt;h4 id=\"features23\"&gt;&lt;a href=\"en/admin-guide/releases.html#features23\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Introduce &lt;code&gt;yt whoami&lt;/code&gt; command&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"fixes6\"&gt;&lt;a href=\"en/admin-guide/releases.html#fixes6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fixes&lt;/span&gt;&lt;/a&gt;Fixes&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix issue-token output format&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.13.24&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-03-02&lt;/p&gt;\n&lt;h4 id=\"features24\"&gt;&lt;a href=\"en/admin-guide/releases.html#features24\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Replace &lt;code&gt;include_scheduler&lt;/code&gt; option with &lt;code&gt;include_runtime&lt;/code&gt; option in &lt;code&gt;get_operation&lt;/code&gt; command (it is backward incompatible change)&lt;/li&gt;\n&lt;li&gt;Request &lt;code&gt;type&lt;/code&gt; attributes instead of &lt;code&gt;operation_type&lt;/code&gt; attribute in &lt;code&gt;get_operation&lt;/code&gt; command&lt;/li&gt;\n&lt;li&gt;Add &lt;code&gt;redirect_stdout_to_stderr&lt;/code&gt; support&lt;/li&gt;\n&lt;li&gt;Support &lt;code&gt;require_sync_replica&lt;/code&gt; in &lt;code&gt;push_queue_producer&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Add &lt;code&gt;is_prerequisite_check_fail&lt;/code&gt; method to error, add &lt;code&gt;YtAuthenticationError&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Support operation suspend reason&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"fixes7\"&gt;&lt;a href=\"en/admin-guide/releases.html#fixes7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fixes&lt;/span&gt;&lt;/a&gt;Fixes&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Drop python2 related code in &lt;code&gt;_py_runner.py&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Add &lt;code&gt;python_requires=\"&amp;gt;=3.8\"&lt;/code&gt; to package setup&lt;/li&gt;\n&lt;li&gt;Do not request all attributes in operation exists check&lt;/li&gt;\n&lt;li&gt;Fix handling request timeout of &lt;code&gt;start_operation&lt;/code&gt; command&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.13.23&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-02-04&lt;/p&gt;\n&lt;h4 id=\"features25\"&gt;&lt;a href=\"en/admin-guide/releases.html#features25\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Features&lt;/span&gt;&lt;/a&gt;Features&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Add &lt;code&gt;min_batch_row_count&lt;/code&gt; option to dump parquet&lt;/li&gt;\n&lt;li&gt;Add &lt;code&gt;patch_operation_spec&lt;/code&gt; method&lt;/li&gt;\n&lt;li&gt;Add queue producer methods in YT cli&lt;/li&gt;\n&lt;li&gt;Add &lt;code&gt;trimmed_row_counts&lt;/code&gt; parameter&lt;/li&gt;\n&lt;li&gt;Add &lt;code&gt;versioned_read_options&lt;/code&gt; parameter&lt;/li&gt;\n&lt;li&gt;Add &lt;code&gt;ignore_type_mismatch&lt;/code&gt; parameter&lt;/li&gt;\n&lt;li&gt;Do not write command line into started_by (by default)&lt;/li&gt;\n&lt;li&gt;Show native libraries version in CLI&lt;/li&gt;\n&lt;li&gt;Make pickling-&amp;gt;dynamic_libraries-&amp;gt;enable_auto_collection remote patchable&lt;/li&gt;\n&lt;li&gt;Apply destination path attributes to temporary objects within parallel upload&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"fixes8\"&gt;&lt;a href=\"en/admin-guide/releases.html#fixes8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fixes&lt;/span&gt;&lt;/a&gt;Fixes&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;YSON: unescape invalid seqs as in bingings implementation.&lt;/li&gt;\n&lt;li&gt;Fix &lt;code&gt;generate_traceparent&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Remove &lt;code&gt;typing_extensions&lt;/code&gt; module imports for newer python versions&lt;/li&gt;\n&lt;li&gt;Fix native driver configuration&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.13.22&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-01-10&lt;/p&gt;\n&lt;h4 id=\"fixes9\"&gt;&lt;a href=\"en/admin-guide/releases.html#fixes9\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fixes:&lt;/span&gt;&lt;/a&gt;Fixes:&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix import checks for &lt;code&gt;orc&lt;/code&gt; related functions&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.13.21&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-12-26&lt;/p&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Introduce YAML format support&lt;/li&gt;\n&lt;li&gt;Introduce the higher level primitives for tracking queries&lt;/li&gt;\n&lt;li&gt;Add &lt;code&gt;network_project&lt;/code&gt; option setter for &lt;code&gt;UserJobSpecBuilder&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Add parallel mode for ORC format&lt;/li&gt;\n&lt;li&gt;Support &lt;code&gt;omit_inaccessible_columns&lt;/code&gt; for read commands&lt;/li&gt;\n&lt;li&gt;Support &lt;code&gt;preserve_acl&lt;/code&gt; option in copy/move commands&lt;/li&gt;\n&lt;li&gt;Rework authentication commands in CLI over getpass&lt;/li&gt;\n&lt;li&gt;Dirtable upload improvements&lt;/li&gt;\n&lt;li&gt;Add queue producer commands&lt;/li&gt;\n&lt;li&gt;Improve SpecBuilder: add use_columnar_statistics, ordered, data_size_per_reduce_job&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix retries for parquet/orc upload commands&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Cosmetics:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Remove legacy constant from operation_commands.py&lt;/li&gt;\n&lt;li&gt;Beautify imports: drop Python 2 support&lt;/li&gt;\n&lt;li&gt;Wrap doc links into constants for &lt;code&gt;--help&lt;/code&gt; command&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Many thanks to @zlobober for significant contribution!&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.13.19&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-10-15&lt;/p&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Add possibility to upload and dump tables in ORC format using CLI commands: &lt;code&gt;upload-orc&lt;/code&gt; and &lt;code&gt;dump-orc&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Support parallel mode for &lt;code&gt;dump-parquet&lt;/code&gt; command&lt;/li&gt;\n&lt;li&gt;Support nullable fields during parsing YT schema from parquet schema&lt;/li&gt;\n&lt;li&gt;Support parallel mode for &lt;code&gt;read_table_structured&lt;/code&gt; command&lt;/li&gt;\n&lt;li&gt;Add cli params to docker respawn decorator (PR: #849). Thanks @thenno for the PR!&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Do not retry &lt;code&gt;LineTooLong&lt;/code&gt; error&lt;/li&gt;\n&lt;li&gt;Fix &lt;code&gt;read_query_result&lt;/code&gt; always returning raw results (PR: #800). Thanks @zlobober for the PR!&lt;/li&gt;\n&lt;li&gt;Fix cyclic references that were causing memory leaks&lt;/li&gt;\n&lt;li&gt;Reduce default value of &lt;code&gt;write_parallel/concatenate_size&lt;/code&gt; from 100 to 20&lt;/li&gt;\n&lt;li&gt;Fix retries in &lt;code&gt;upload-parquet&lt;/code&gt; command&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.13.18&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-07-26&lt;/p&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Use expanduser for &lt;code&gt;config[\"token_path\"]&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Support custom dill params&lt;/li&gt;\n&lt;li&gt;Support Nullable patchable config element&lt;/li&gt;\n&lt;li&gt;Add max_replication_factor in config&lt;/li&gt;\n&lt;li&gt;Use strawberry ctl address from cypress client_config&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fixes of E721: do not compare types, for exact checks use &lt;code&gt;is&lt;/code&gt; / &lt;code&gt;is not&lt;/code&gt;, for instance checks use &lt;code&gt;isinstance()&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Fix bug in YT python wrapper: stop transaction pinger before exiting transaction&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Thanks to multiple outside contributors for the active participation in Python SDK development.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.13.17&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-06-26&lt;/p&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Support profiles in configuration file&lt;/li&gt;\n&lt;li&gt;Add versioned select&lt;/li&gt;\n&lt;li&gt;Add enum.StrEnum and enum.IntEnum support for yt_dataclasses&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix test_operation_stderr_output in py.test environment&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Thanks to @thenno for considerable contribution!&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.13.16&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-06-19&lt;/p&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Allow to specify prerequisite transaction ids in client.Transaction context manager (PR: #638). Thanks @chegoryu for the PR!&lt;/li&gt;\n&lt;li&gt;Add client and chunk_count parameters to dirtable_commands&lt;/li&gt;\n&lt;li&gt;Add alter_query command for Query Tracker&lt;/li&gt;\n&lt;li&gt;Add dump_job_proxy_log command (PR: #594). Thanks @tagirhamitov  for the PR!&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix return result of lock command in case of batch client&lt;/li&gt;\n&lt;li&gt;Fix jupyter notebooks for operations in separate cells (PR: #654). Thanks @dmi-feo for the PR!&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.13.14&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-03-09&lt;/p&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Added an option for skipping rows merge in select&lt;/li&gt;\n&lt;li&gt;Support composite types in QL&lt;/li&gt;\n&lt;li&gt;Add &lt;code&gt;preserve_account&lt;/code&gt; option to table backup commands&lt;/li&gt;\n&lt;li&gt;Expand the list of dynamic table retriable errors&lt;/li&gt;\n&lt;li&gt;Enhance table creation with specified append attribute&lt;/li&gt;\n&lt;li&gt;Various improvements of maintenance API&lt;/li&gt;\n&lt;li&gt;Support &lt;code&gt;upload_parquet&lt;/code&gt; command&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Support SortColumn serialization&lt;/li&gt;\n&lt;li&gt;Fix file descriptors leak in config parsing&lt;/li&gt;\n&lt;li&gt;Fix output stream validation for TypedJobs&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;0.13.12&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2023-12-14&lt;/p&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Support &lt;code&gt;double&lt;/code&gt; and &lt;code&gt;float&lt;/code&gt; type in &lt;code&gt;@yt_dataclass&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Added &lt;code&gt;get_query_result&lt;/code&gt; command.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fixed setting config from environment variables.&lt;/li&gt;\n&lt;li&gt;Eligeable error message if node type is not equal to table in operation spec.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h3 id=\"java\"&gt;&lt;a href=\"en/admin-guide/releases.html#java\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Java&lt;/span&gt;&lt;/a&gt;Java&lt;/h3&gt;\n&lt;p&gt;Is released as packages in &lt;a href=\"https://central.sonatype.com/artifact/tech.ytsaurus/ytsaurus-client\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;maven&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Releases:&lt;/strong&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;1.2.10&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-07-17&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Add &lt;code&gt;range&lt;/code&gt; to &lt;code&gt;CreateShuffleReader&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Add &lt;code&gt;writerIndex&lt;/code&gt;, &lt;code&gt;overwriteExistingWriterData&lt;/code&gt; to &lt;code&gt;CreateShuffleWriter&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Minor fixes and improvements to error messages.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;1.2.9&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-04-08&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Add &lt;code&gt;fullResult&lt;/code&gt; to &lt;code&gt;QueryResult&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Add &lt;code&gt;QueryStatistics&lt;/code&gt; to &lt;code&gt;SelectRowsResult&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Set type 'composite' instead of 'any' for complex types in &lt;code&gt;UnversionedValue&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Support 'sort_by' in ReduceSpec.&lt;/li&gt;\n&lt;li&gt;Add API methods for working with Shuffle Service.&lt;/li&gt;\n&lt;li&gt;Support retries for cross cell copy/move.&lt;/li&gt;\n&lt;li&gt;Support additional secrets in &lt;code&gt;StartQuery&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Add retry for timeout &lt;code&gt;YTsaurusError&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Don't fail on 'cluster' attribute in queue and consumer paths in the listQueueConsumerRegistrations.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;1.2.8&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-01-23&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Update protobuf to 3.25.5 version.&lt;/li&gt;\n&lt;li&gt;Support for the ability to use a custom &lt;code&gt;TableRowsSerializer&lt;/code&gt; provided through the &lt;code&gt;SerializationContext&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Change protobuf type of &lt;code&gt;YPath&lt;/code&gt; and &lt;code&gt;RichYPath&lt;/code&gt; parameters: &lt;code&gt;string&lt;/code&gt; -&amp;gt; &lt;code&gt;bytes&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Remove \"command\" from \"started_by\" spec field.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;1.2.7&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-11-25&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Add the &lt;code&gt;RequestMiddleware&lt;/code&gt; interface to subscribe on request start.&lt;/li&gt;\n&lt;li&gt;Support &lt;code&gt;ListQueueConsumerRegistrations&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Add monitoring callback interface for &lt;code&gt;MultiYTsaurusClient&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Refactor &lt;code&gt;MultiYTsaurusClient&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Support &lt;code&gt;YT_BASE_LAYER&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Fix resource leak in the &lt;code&gt;ClientPool&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;1.2.6&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-09-05&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;YsonJsonConverter&lt;/code&gt; has been released.&lt;/li&gt;\n&lt;li&gt;Support for &lt;code&gt;Date32&lt;/code&gt;, &lt;code&gt;Datetime64&lt;/code&gt;, &lt;code&gt;Timestamp64&lt;/code&gt;, &lt;code&gt;Interval64&lt;/code&gt; types.&lt;/li&gt;\n&lt;li&gt;Fixed a bug that caused &lt;code&gt;writeTable&lt;/code&gt; to fail if the table schema did not match the user-specified schema.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;1.2.5&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-08-20&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Added MultiYTsaurusClient.&lt;/li&gt;\n&lt;li&gt;Support for MultiLookupRows request.&lt;/li&gt;\n&lt;li&gt;Fixed a bug that caused an infinite wait for proxy discovery when the connection failed.&lt;/li&gt;\n&lt;li&gt;Fixed a bug that caused the operation output table to be created without a user-specified transaction.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;1.2.4&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-06-18&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Support for JPA &lt;code&gt;@Embedded&lt;/code&gt;/&lt;code&gt;@Embeddable&lt;/code&gt; annotations.&lt;/li&gt;\n&lt;li&gt;Support for URL schema to detect the usage of TLS.&lt;/li&gt;\n&lt;li&gt;Implemented YT Query Tracker API methods.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;1.2.3&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-05-27&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Introduced &lt;code&gt;DiscoveryClient&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;The following types are supported in &lt;code&gt;@Entity&lt;/code&gt; fields (use &lt;code&gt;@Column(columnDefinition=“...”)&lt;/code&gt; to specify type):\n&lt;ul&gt;\n&lt;li&gt;enum -&amp;gt; utf8/string;&lt;/li&gt;\n&lt;li&gt;String -&amp;gt; string;&lt;/li&gt;\n&lt;li&gt;Instant -&amp;gt; int64;&lt;/li&gt;\n&lt;li&gt;YsonSerializable -&amp;gt; yson.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Fixed a bug due to which &lt;code&gt;YTsaurusClient&lt;/code&gt; did not terminate.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;1.2.2&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-04-11&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Supported placeholder values in SelectRowsRequest.&lt;/li&gt;\n&lt;li&gt;Supported specifying the proxy network name.&lt;/li&gt;\n&lt;li&gt;Supported set(Input/Output)Format in CommandSpec.&lt;/li&gt;\n&lt;li&gt;Fixed a bug that caused NoSuchElementException in SyncTableReader.&lt;/li&gt;\n&lt;li&gt;Fixed a bug that caused the table to be recreated when writing without \"append\".&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;1.2.1&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-01-29&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Supported serializable mapper/reducer.&lt;/li&gt;\n&lt;li&gt;Added completeOperation method.&lt;/li&gt;\n&lt;li&gt;Implemented three YT Queues API methods: registerQueueConsumer, advanceConsumer, pullConsumer.&lt;/li&gt;\n&lt;li&gt;Added AggregateStatistics to MultiTablePartition.&lt;/li&gt;\n&lt;li&gt;Some minor bug fixes.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;1.2.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2023-09-18&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fixed a bug that caused &lt;code&gt;SyncTableReaderImpl&lt;/code&gt; internal threads would not terminate.&lt;/li&gt;\n&lt;li&gt;In the &lt;code&gt;WriteTable&lt;/code&gt; request, the &lt;code&gt;needRetries&lt;/code&gt; option is set to &lt;code&gt;true&lt;/code&gt; by default.&lt;/li&gt;\n&lt;li&gt;The &lt;code&gt;WriteTable&lt;/code&gt; request has &lt;code&gt;builder(Class)&lt;/code&gt; now; using it, you can omit the &lt;code&gt;SerializationContext&lt;/code&gt; if the class is marked with the &lt;code&gt;@Entity&lt;/code&gt; annotation, implements the &lt;code&gt;com.google.protobuf.Message&lt;/code&gt; or &lt;code&gt;tech.ytsaurus.ysontree.YTreeMapNode&lt;/code&gt; interface (serialization formats will be &lt;code&gt;skiff&lt;/code&gt;, &lt;code&gt;protobuf&lt;/code&gt; or &lt;code&gt;wire&lt;/code&gt; respectively).&lt;/li&gt;\n&lt;li&gt;The &lt;code&gt;setPath(String)&lt;/code&gt; setters in the &lt;code&gt;WriteTable&lt;/code&gt; and &lt;code&gt;ReadTable&lt;/code&gt; builders are &lt;code&gt;@Deprecated&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;The interfaces of the &lt;code&gt;GetNode&lt;/code&gt; and &lt;code&gt;ListNode&lt;/code&gt; request builders have been changed: &lt;code&gt;List&amp;lt;String&amp;gt;&lt;/code&gt; is passed to the &lt;code&gt;setAttributes&lt;/code&gt; method instead of &lt;code&gt;ColumnFilter&lt;/code&gt;, the &lt;code&gt;null&lt;/code&gt; argument represents &lt;code&gt;universal filter&lt;/code&gt; (all attributes should be returned).&lt;/li&gt;\n&lt;li&gt;Added the &lt;code&gt;useTLS&lt;/code&gt; flag to &lt;code&gt;YTsaurusClientConfig&lt;/code&gt;, if set to &lt;code&gt;true&lt;/code&gt; &lt;code&gt;https&lt;/code&gt; will be used for &lt;code&gt;discover_proxies&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;1.1.1&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2023-07-26&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fixed validation of &lt;code&gt;@Entity&lt;/code&gt; schemas: reading a subset of table columns, a superset of columns (if the types of the extra columns are &lt;code&gt;nullable&lt;/code&gt;), writing a subset of columns (if the types of the missing columns are &lt;code&gt;nullable&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;The following types are supported in &lt;code&gt;@Entity&lt;/code&gt; fields:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;utf8&lt;/code&gt; -&amp;gt; &lt;code&gt;String&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;string&lt;/code&gt; -&amp;gt; &lt;code&gt;byte[]&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;uuid&lt;/code&gt; -&amp;gt; &lt;code&gt;tech.ytsaurus.core.GUID&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;timestamp&lt;/code&gt; -&amp;gt; &lt;code&gt;java.time.Instant&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;If an operation started by &lt;code&gt;SyncYTsaurusClient&lt;/code&gt; fails, an exception will be thrown.&lt;/li&gt;\n&lt;li&gt;Added the &lt;code&gt;ignoreBalancers&lt;/code&gt; flag to &lt;code&gt;YTsaurusClientConfig&lt;/code&gt;, which allows to ignore balancer addresses and find only rpc proxy addresses.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/admin-guide/releases.md","sourcePath":"en/admin-guide/releases.md"},"headings":[{"title":"YTsaurus Server","href":"en/admin-guide/releases.html#ytsaurus-server","level":2},{"title":"Query Tracker","href":"en/admin-guide/releases.html#query-tracker","level":2},{"title":"Strawberry","href":"en/admin-guide/releases.html#strawberry","level":2},{"title":"CHYT","href":"en/admin-guide/releases.html#chyt1","level":2},{"title":"SPYT","href":"en/admin-guide/releases.html#spyt1","level":2},{"title":"Kubernetes operator","href":"en/admin-guide/releases.html#kubernetes-operator","level":2},{"title":"YTsaurus Python YSON","href":"en/admin-guide/releases.html#ytsaurus-python-yson","level":2},{"title":"SDK","href":"en/admin-guide/releases.html#sdk","level":2,"items":[{"title":"Python","href":"en/admin-guide/releases.html#python","level":3,"items":[{"title":"Features","href":"en/admin-guide/releases.html#features14","level":4},{"title":"Fixes","href":"en/admin-guide/releases.html#fixes2","level":4},{"title":"Features","href":"en/admin-guide/releases.html#features15","level":4},{"title":"Features","href":"en/admin-guide/releases.html#features16","level":4},{"title":"Fixes","href":"en/admin-guide/releases.html#fixes3","level":4},{"title":"Features","href":"en/admin-guide/releases.html#features17","level":4},{"title":"Features","href":"en/admin-guide/releases.html#features18","level":4},{"title":"Features","href":"en/admin-guide/releases.html#features19","level":4},{"title":"Fixes","href":"en/admin-guide/releases.html#fixes4","level":4},{"title":"Features","href":"en/admin-guide/releases.html#features20","level":4},{"title":"Features","href":"en/admin-guide/releases.html#features21","level":4},{"title":"Fixes","href":"en/admin-guide/releases.html#fixes5","level":4},{"title":"Features","href":"en/admin-guide/releases.html#features22","level":4},{"title":"Features","href":"en/admin-guide/releases.html#features23","level":4},{"title":"Fixes","href":"en/admin-guide/releases.html#fixes6","level":4},{"title":"Features","href":"en/admin-guide/releases.html#features24","level":4},{"title":"Fixes","href":"en/admin-guide/releases.html#fixes7","level":4},{"title":"Features","href":"en/admin-guide/releases.html#features25","level":4},{"title":"Fixes","href":"en/admin-guide/releases.html#fixes8","level":4},{"title":"Fixes:","href":"en/admin-guide/releases.html#fixes9","level":4}]},{"title":"Java","href":"en/admin-guide/releases.html#java","level":3}]}],"title":"Release notes"},"router":{"pathname":"en/admin-guide/releases","depth":3,"base":"../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
