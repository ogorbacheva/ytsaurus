        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;blockquote&gt;\n&lt;p&gt;Thanks to multiple outside contributors for the active participation in YTsaurus development. 🖤&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"ytsaurus-server\"&gt;&lt;a href=\"en/admin-guide/releases.html#ytsaurus-server\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YTsaurus Server&lt;/span&gt;&lt;/a&gt;YTsaurus Server&lt;/h2&gt;\n&lt;p&gt;All main components are released as a docker image.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Releases:&lt;/strong&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;25.1.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-07-28&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;To install YTsaurus Server 25.1.0 &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/releases/tag/release%2F0.25.0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;update&lt;/a&gt; the k8s-operator to version 0.25.0.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"significant-changes\"&gt;&lt;a href=\"en/admin-guide/releases.html#significant-changes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Significant changes&lt;/span&gt;&lt;/a&gt;Significant changes&lt;/h4&gt;\n&lt;h4 id=\"api\"&gt;&lt;a href=\"en/admin-guide/releases.html#api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;API&lt;/span&gt;&lt;/a&gt;API&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Enhancement of operations/jobs API.&lt;/li&gt;\n&lt;li&gt;Introduced requests memory tracking in HTTP proxies.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"compute\"&gt;&lt;a href=\"en/admin-guide/releases.html#compute\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Compute&lt;/span&gt;&lt;/a&gt;Compute&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Implemented permission validation for operations using access control objects.&lt;/li&gt;\n&lt;li&gt;Gang-operations gone production. Gang-operations represent a special scheduling mode of vanilla-operations, particularly useful for distributed ML model training.&lt;/li&gt;\n&lt;li&gt;Introduced PatchSpec API to modify operation spec at runtime.&lt;/li&gt;\n&lt;li&gt;[experimental] Remote copy scheduler now considers inter-cluster bandwidth limits.&lt;/li&gt;\n&lt;li&gt;Introduced job shell for CRI-based job environments.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"storage\"&gt;&lt;a href=\"en/admin-guide/releases.html#storage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Storage&lt;/span&gt;&lt;/a&gt;Storage&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Supported &lt;code&gt;decimal256&lt;/code&gt; type.&lt;/li&gt;\n&lt;li&gt;Support non-materialized computed column evaluation in static tables.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"query-language-features\"&gt;&lt;a href=\"en/admin-guide/releases.html#query-language-features\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Query language features&lt;/span&gt;&lt;/a&gt;Query language features&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Added &lt;code&gt;allow_async_replica&lt;/code&gt; hint to QL table descriptors to enable fallback to async replicas in selects.&lt;/li&gt;\n&lt;li&gt;Timestamp functions in QL now support localtime  and use lookup tables for better performance.&lt;/li&gt;\n&lt;li&gt;QL AVG  function now supports doubles and unsigned integers.&lt;/li&gt;\n&lt;li&gt;Functions list_contains  and list_has_intersection  in QL now support strongly typed composite values and nulls.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;EXPLAIN&lt;/code&gt; query now works with replicated tables.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"dynamic-tables\"&gt;&lt;a href=\"en/admin-guide/releases.html#dynamic-tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dynamic tables&lt;/span&gt;&lt;/a&gt;Dynamic tables&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Implemented gradual global compaction (\"chunk reincarnation\") for dynamic tables.&lt;/li&gt;\n&lt;li&gt;Supported remote copy for dynamic tables with hunk chunks.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"default-values\"&gt;&lt;a href=\"en/admin-guide/releases.html#default-values\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Default values&lt;/span&gt;&lt;/a&gt;Default values&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Changed default read format to scan  for dynamic tables.&lt;/li&gt;\n&lt;li&gt;Enabled versioned remote copy by default.&lt;/li&gt;\n&lt;li&gt;Enabled remote copy of hunk chunks by default.&lt;/li&gt;\n&lt;li&gt;Enabled two-random-choices allocation strategy for write targets by default.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"full-changelog\"&gt;&lt;a href=\"en/admin-guide/releases.html#full-changelog\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Full changelog&lt;/span&gt;&lt;/a&gt;Full changelog&lt;/h4&gt;\n&lt;h4 id=\"scheduler-and-gpu\"&gt;&lt;a href=\"en/admin-guide/releases.html#scheduler-and-gpu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Scheduler and GPU&lt;/span&gt;&lt;/a&gt;Scheduler and GPU&lt;/h4&gt;\n&lt;h5 id=\"new-features-and-changes\"&gt;&lt;a href=\"en/admin-guide/releases.html#new-features-and-changes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;New Features &amp;amp; Changes:&lt;/span&gt;&lt;/a&gt;New Features &amp;amp; Changes:&lt;/h5&gt;\n&lt;ul&gt;\n&lt;li&gt;Added alert for unrecognized options in the pool tree config, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/6b2770b65a51766fbd1ad53d81d6b409a2115f00\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;6b2770b&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added support for generating temporary tokens valid for the duration of an operation, stored in the operation’s secure vault, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/c91fd057421160254f41d6c394673bf654fc358d\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;c91fd05&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added an option to only allow gang operations to start in FIFO pools, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/edcac9a3e348b18fd03cb82fb9e15e782b1b4a58\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;edcac9a&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Implemented permission validation for operations using access control objects, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/bd64281b11d8fef1a8f497c07ee1a0c5372073d9\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;bd64281&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Enhancement of operations/jobs API:\n&lt;ul&gt;\n&lt;li&gt;Introduced &lt;code&gt;attributes&lt;/code&gt; and &lt;code&gt;events&lt;/code&gt; in &lt;code&gt;list_jobs&lt;/code&gt;  &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/25a405d0c88\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;25a405d0c88&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Access to operations archive and &lt;code&gt;//sys/operations&lt;/code&gt; is closed by default.&lt;/li&gt;\n&lt;li&gt;Added operation incarnations to archive and supported corresponding filter in API &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/6601c8dbbb1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;6601c8dbbb1&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Added support for managing operations within &lt;code&gt;manage&lt;/code&gt; right on pool &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/177380edfed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;177380edfed&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Supported new logic for calculating cpu limit overcommit &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/d6d1d08a91f\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;d6d1d08a91f&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added ability to run GPU checks in isolated volumes and configure them via operation options, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/631f3288fa3eb07176c777c93bcf3afddfaf30dc\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;631f328&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h5 id=\"fixes-and-optimizations\"&gt;&lt;a href=\"en/admin-guide/releases.html#fixes-and-optimizations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fixes &amp;amp; Optimizations:&lt;/span&gt;&lt;/a&gt;Fixes &amp;amp; Optimizations:&lt;/h5&gt;\n&lt;ul&gt;\n&lt;li&gt;Fixed bug when &lt;code&gt;offloading&lt;/code&gt; and &lt;code&gt;schedule_in_single_tree&lt;/code&gt; options specified simultaneously &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/e36e910b718\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;e36e910b718&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;Fixed fair share truncation in FIFO pools for single allocation vanillas &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/5d8e22b67fa\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;5d8e22b67fa&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Dropped some scheduler compats and legacy options.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"queue-agent\"&gt;&lt;a href=\"en/admin-guide/releases.html#queue-agent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Queue Agent&lt;/span&gt;&lt;/a&gt;Queue Agent&lt;/h4&gt;\n&lt;h5 id=\"new-features-and-changes1\"&gt;&lt;a href=\"en/admin-guide/releases.html#new-features-and-changes1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;New Features &amp;amp; Changes:&lt;/span&gt;&lt;/a&gt;New Features &amp;amp; Changes:&lt;/h5&gt;\n&lt;ul&gt;\n&lt;li&gt;Added &lt;code&gt;controller_info&lt;/code&gt; field to queue agent Orchid for detecting stuck controller passes and tracking error counters, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/74be9b4ab44689d56f8110dc2313e1dc7c1e3057\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;74be9b4&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Export progress now includes details about the last export iteration, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/6ec743a21e4f4ed8e917fc17e822875367709ad3\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;6ec743a&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Aggregated alert metrics for the queue agent have been added, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/d2bf505c9b3bafa8f0966cdd0234c4929416c293\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;d2bf505&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h5 id=\"fixes-and-optimizations1\"&gt;&lt;a href=\"en/admin-guide/releases.html#fixes-and-optimizations1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fixes &amp;amp; Optimizations:&lt;/span&gt;&lt;/a&gt;Fixes &amp;amp; Optimizations:&lt;/h5&gt;\n&lt;ul&gt;\n&lt;li&gt;Added retry backoffs to avoid overloading in case of misconfigured exports, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/ae4ead4a1e9e5b86bbc9ffde2637488fb1dbe6ff\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ae4ead4&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed crash when reusing an export directory after recreating a queue without resetting export progress, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/49826ed8d9872d3d094224e0811335a2647ef7c3\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;49826ed&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"proxy\"&gt;&lt;a href=\"en/admin-guide/releases.html#proxy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Proxy&lt;/span&gt;&lt;/a&gt;Proxy&lt;/h4&gt;\n&lt;h5 id=\"new-features-and-changes2\"&gt;&lt;a href=\"en/admin-guide/releases.html#new-features-and-changes2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;New Features &amp;amp; Changes:&lt;/span&gt;&lt;/a&gt;New Features &amp;amp; Changes:&lt;/h5&gt;\n&lt;ul&gt;\n&lt;li&gt;Added support for HTTP proxies in the &lt;code&gt;discover_proxies&lt;/code&gt; handler, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/830e543c1bbde6069180bdf451c807ff0175bdb6\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;830e543&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Preserved original column types (e.g., &lt;code&gt;timestamp&lt;/code&gt;) in &lt;code&gt;web_json&lt;/code&gt; responses from &lt;code&gt;select_rows&lt;/code&gt;, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/f4eb42d1b4e8521b8d70d83ec19ef50cb63647c5\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;f4eb42d&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Enabled signature generation and verification in HTTP proxy using Cypress public keys, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/f8d0c7d4f096d335b7fc5313f360dcab6d47ceb2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;f8d0c7d&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Introduced memory tracking for light/heavy HTTP requests, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/06f7aeb2a484a802b4a401fcfd0c3216c9cdc33f\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;06f7aeb&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added &lt;code&gt;require_sync_replica&lt;/code&gt; parameter to the &lt;code&gt;push_queue_producer&lt;/code&gt; handler, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/1324b1bb4aa2ec33249447dcc38257836b9e5ca0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;1324b1b&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Enabled parallel execution of &lt;code&gt;discover_versions&lt;/code&gt; across components, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/f06afce8d73c34082343b85f577f8ae3edcb114d\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;f06afce&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added &lt;code&gt;create_user_if_not_exists&lt;/code&gt; config option to prevent user creation during OAuth authentication (Issue #930), &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/8470ed63a46beb3c483c885d62a195fbfd4ac77f\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;8470ed6&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added &lt;code&gt;require_password_in_authentication_commands&lt;/code&gt; flag to allow skipping password checks in auth commands, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/723db18f80a3ceff00ed67d6a9cb5872b9c1ffda\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;723db18&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Introduced &lt;code&gt;cache_key_mode&lt;/code&gt; to control the granularity of credential caching, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/df66eb5a00ab7d338fb0972f618ad28862a2a440\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;df66eb5&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added &lt;code&gt;EnableCookies&lt;/code&gt; option to &lt;code&gt;PartitionTable&lt;/code&gt; request, which returns an opaque cookie for &lt;code&gt;CreateTablePartitionReader&lt;/code&gt;, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/f2f1ce6039fd84e6cd13341e90db0a834ea1580e\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;f2f1ce6&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added &lt;code&gt;CreateTablePartitionReader&lt;/code&gt; method to read a table partition without master requests, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/f2f1ce6039fd84e6cd13341e90db0a834ea1580e\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;f2f1ce6&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added support for signature validation using Cypress public keys, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/12c85321bfd4fd41f32db7ee356345e0aee9c2b0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;12c8532&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added a handler to retrieve job trace events, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/8ee855ef01ae55a6c500d6ec6029bac3b3c8260c\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;8ee855e&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h5 id=\"fixes-and-optimizations2\"&gt;&lt;a href=\"en/admin-guide/releases.html#fixes-and-optimizations2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fixes &amp;amp; Optimizations:&lt;/span&gt;&lt;/a&gt;Fixes &amp;amp; Optimizations:&lt;/h5&gt;\n&lt;ul&gt;\n&lt;li&gt;Switched to using a dedicated thread pool for HTTP stream compression, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/4f61857cbabea72e403b269f361de5b01bb6d746\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;4f61857&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added type compatibility checks in the Arrow parser using YT-specific types, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/bd0a6ff376a1c2ec28e10d4ee4d476d70bb8a131\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;bd0a6ff&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Introduced &lt;code&gt;UploadTransactionPingPeriod&lt;/code&gt; config to correctly handle upload transaction timeouts, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/f10f749527d924fece0e52a0248cf0c58ed8d313\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;f10f749&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Embedded HTTP proxy Arrow writer directly into the Arrow encoder to remove duplication, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/99293b6cf4c9a157209d556bc8e6f128be3832e1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;99293b6&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Enabled reading of Arrow tables with different column counts in chunk metadata, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/6210035056c12e3b078f7a3e01b562030f946192\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;6210035&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed incorrect data type in driver for &lt;code&gt;push_queue_producer&lt;/code&gt; input, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/ebffb746ada4d63b768c7627e9bdee110b686cbd\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ebffb74&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Decimal improvements:\n&lt;ul&gt;\n&lt;li&gt;Added support for nested &lt;code&gt;decimal128&lt;/code&gt; and &lt;code&gt;decimal256&lt;/code&gt; in Arrow.&lt;/li&gt;\n&lt;li&gt;Fixed incorrect fixed-length encoding of &lt;code&gt;decimal256(n, p)&lt;/code&gt; for small precisions, now variable length like &lt;code&gt;decimal128&lt;/code&gt;, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/58c6c6590919a2bfbb88c9f5b833324b86623ead\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;58c6c65&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"dynamic-tables1\"&gt;&lt;a href=\"en/admin-guide/releases.html#dynamic-tables1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dynamic Tables&lt;/span&gt;&lt;/a&gt;Dynamic Tables&lt;/h4&gt;\n&lt;h5 id=\"new-features-and-changes3\"&gt;&lt;a href=\"en/admin-guide/releases.html#new-features-and-changes3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;New Features &amp;amp; Changes:&lt;/span&gt;&lt;/a&gt;New Features &amp;amp; Changes:&lt;/h5&gt;\n&lt;ul&gt;\n&lt;li&gt;Added row-cache poisoning to help detect memory errors, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/4933fe97dd68a40b2c5cdce4d2aa77000fdfb8dc\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;4933fe9&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added &lt;code&gt;allow_async_replica&lt;/code&gt; hint to QL table descriptors to enable fallback to async replicas in selects, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/27ac9b90f5d50dfc63490d86f24fb88bc042e74b\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;27ac9b9&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added a method to return freezing or unmounting tables to the mounted state, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/cdb2027bf1b1de28a9a025a14375da5cd29bcd75\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;cdb2027&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Enabled lookups to use the fair-share thread pool, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/b19ecb34beae00c66f1c11ad3e6a19681f711087\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;b19ecb3&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Introduced a protocol that allows writing to tablets during smooth movement, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/3ab47cd930accca3d38fac269e67b8ae8862d29b\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;3ab47cd&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Bundle controller can now manage memory limits for queries, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/c6c6de47a8a8f0d64668a6a219e369f5c20a73ed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;c6c6de4&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Timestamp functions in QL now support &lt;code&gt;localtime&lt;/code&gt; and use lookup tables for better performance, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/265160e382062e7e19673da27f0242a636b7c51f\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;265160e&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;QL &lt;code&gt;AVG&lt;/code&gt; function now supports doubles and unsigned integers, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/d597f37096f44c7cc418da5cb986e06ed4377625\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;d597f37&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Functions &lt;code&gt;list_contains&lt;/code&gt; and &lt;code&gt;list_has_intersection&lt;/code&gt; in QL now support strongly typed composite values and nulls, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/aeb6b24220a07385ab1975b610a6af06a75ed9fc\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;aeb6b24&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added profiling counters for &lt;code&gt;pull_queue&lt;/code&gt; and &lt;code&gt;pull_queue_consumer&lt;/code&gt; commands on tablet nodes, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/6aebfc1a758092864dae6b25177ec4339bc1c2db\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;6aebfc1&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;EXPLAIN&lt;/code&gt; query now works with replicated tables, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/fcb3dbab1a50858856e5aa52977a185620bb4b56\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;fcb3dba&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Changed default read format to &lt;code&gt;scan&lt;/code&gt; for dynamic tables, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/f2ccc73dbd5b2883d733b16145ae16f55e7fe272\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;f2ccc73&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Select queries now choose random in-sync replicas even from the same cluster, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/efdf083a7d8cc0e7345f8b7705b87c0ec6a7ee47\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;efdf083&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added &lt;code&gt;total_grouped_row_count&lt;/code&gt; to QL statistics, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/e37b81f5199263dd9d15ef1116cd0be0463f8145\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;e37b81f&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Enabled row-cache support for selects, useful for dictionary-style joins, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/bba767b3f8671bddb8f6aed77d0ee25eed16d056\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;bba767b&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Implemented gradual global compaction (\"chunk reincarnation\") for dynamic tables, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/6d405af0192ab66acf71bccbf38f2f02fda966bc\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;6d405af&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added support for lookup format with timestamp columns, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/180af7c4b45cacaa66783809c9c7b4759c385348\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;180af7c&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added &lt;code&gt;allow_reign_change&lt;/code&gt; parameter to tablet node config for crash-on-reign-change testing, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/3754c50c141d89ef9ce6fe6a40df24e941d900ba\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;3754c50&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Introduced states for secondary indices: &lt;code&gt;invalid&lt;/code&gt;, &lt;code&gt;bijective&lt;/code&gt;, &lt;code&gt;injective&lt;/code&gt;, and &lt;code&gt;unknown&lt;/code&gt;, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/81068e0145fcb6899cc8e351fcd72398ca55a763\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;81068e0&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Enabled versioned remote copy by default, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/08627486d980cc99aa0e8ec14104c7c6fbf43dea\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;0862748&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added support for remote copy of erasure-coded hunk chunks, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/2b783b04de6e5ade76d159ce05e674bb9545b50f\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;2b783b0&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;GROUP BY + LIMIT&lt;/code&gt; without &lt;code&gt;ORDER BY&lt;/code&gt; is now executed in parallel unless certain conditions apply. Affects behavior of &lt;code&gt;WITH TOTALS&lt;/code&gt;, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/c296f24846653dff7b7e6bc2b3c913e05fa479ce\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;c296f24&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Remote copy for dynamic tables with hunk chunks is now supported (except with compression dictionaries and striped erasure), &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/34f16d0fd4c307134608f27cfb5cc028b3cbc771\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;34f16d0&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;dump-snapshot&lt;/code&gt; command now supports &lt;code&gt;checksum&lt;/code&gt; mode to help debug snapshot mismatches, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/5daa91303d7210689ecb117614b908523bd429af\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;5daa913&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h5 id=\"fixes-and-optimizations3\"&gt;&lt;a href=\"en/admin-guide/releases.html#fixes-and-optimizations3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fixes &amp;amp; Optimizations:&lt;/span&gt;&lt;/a&gt;Fixes &amp;amp; Optimizations:&lt;/h5&gt;\n&lt;ul&gt;\n&lt;li&gt;Fixed float precision issues in scan reads by serializing floats as doubles, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/0b78e7ad5b4a4ec48ece1f92501172bbeff8ec6d\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;0b78e7a&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed incorrect timezone behavior in &lt;code&gt;timestamp_floor_*_localtime&lt;/code&gt; functions, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/17f3dd1debf37d5b2a0222cf3d906b40e523ae12\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;17f3dd1&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Switched from logical to physical chunk count in ordered dynamic tablet chunk lists, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/2efe013a9ba51a105c3ce490b6cffdcdcc415c36\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;2efe013&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Use lookup joins automatically when the left subplan is selective, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/4b8b207a6ea179d480bc05f5478a226d31c3da99\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;4b8b207&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed segfaults when reading tables with nested columns, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/45cb542f8c883e7d559fee880065ddc5abde2e34\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;45cb542&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Bundle controller now skips faulty bundles instead of blocking progress, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/dc149b27843635d16d2416f09a21ffba8b4de702\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;dc149b2&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"mapreduce\"&gt;&lt;a href=\"en/admin-guide/releases.html#mapreduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MapReduce&lt;/span&gt;&lt;/a&gt;MapReduce&lt;/h4&gt;\n&lt;h5 id=\"new-features-and-changes4\"&gt;&lt;a href=\"en/admin-guide/releases.html#new-features-and-changes4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;New Features &amp;amp; Changes:&lt;/span&gt;&lt;/a&gt;New Features &amp;amp; Changes:&lt;/h5&gt;\n&lt;ul&gt;\n&lt;li&gt;Added various job splitter options to operation specs, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/e2998a41e1794bfc139709f1df6cfd282cf82e33\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;e2998a4&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Preserved job cookies during gang operation restarts and allowed restarting already completed jobs on incarnation switch, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/e3f7655698256ea6c257171d17ba8af7f130a299\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;e3f7655&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added operation incarnation controller that restarts all jobs if one terminates (useful for distributed ML), &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/fb9c7d3d97563cb4e7d8d80270fe1be4739606d3\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;fb9c7d3&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Introduced job shell for CRI-based job environments, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/6b18f2f3d836bc63e6e89d44dcce328a5bc2d958\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;6b18f2f&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Allowed dynamic updates to &lt;code&gt;job_count&lt;/code&gt; for vanilla tasks, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/3a5cfef7f0a2a87cd5b48637d03467dc49f82f91\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;3a5cfef&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Introduced &lt;code&gt;PatchSpec&lt;/code&gt; API to modify operation spec at runtime (initially supports &lt;code&gt;max_failed_job_count&lt;/code&gt;), &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/3a5cfef7f0a2a87cd5b48637d03467dc49f82f91\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;3a5cfef&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;RemoteCopy&lt;/code&gt; operations now always copy key system attributes (&lt;code&gt;compression_codec&lt;/code&gt;, &lt;code&gt;erasure_codec&lt;/code&gt;, &lt;code&gt;optimize_for&lt;/code&gt;) even if &lt;code&gt;copy_attributes&lt;/code&gt; is false, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/25be3785e95e49e1639ccef1ff49fc7077f1e1c7\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;25be378&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Remote copy scheduler now considers inter-cluster bandwidth limits, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/e0af4fdbdea4fcab2561b803364f153078195223\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;e0af4fd&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Controller agents now always fetch schemas from secondary cells using schema IDs, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/af0068716ea05530aade3474f15e59c7b2ab9d16\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;af00687&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h5 id=\"fixes-and-optimizations4\"&gt;&lt;a href=\"en/admin-guide/releases.html#fixes-and-optimizations4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fixes &amp;amp; Optimizations:&lt;/span&gt;&lt;/a&gt;Fixes &amp;amp; Optimizations:&lt;/h5&gt;\n&lt;ul&gt;\n&lt;li&gt;Fixed a bug where teleportation of a single chunk in unordered pool could fail, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/897ffff6c1ed4f7d21d52b3fb456ff8fa8b7023b\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;897ffff&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Returned specific error instead of generic &lt;code&gt;Job failed by external request&lt;/code&gt;, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/703aae58eb1b2a515c2aa9e49d4e9ae63bc3a39e\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;703aae5&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"master-server\"&gt;&lt;a href=\"en/admin-guide/releases.html#master-server\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Master Server&lt;/span&gt;&lt;/a&gt;Master Server&lt;/h4&gt;\n&lt;h5 id=\"new-features-and-changes5\"&gt;&lt;a href=\"en/admin-guide/releases.html#new-features-and-changes5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;New Features &amp;amp; Changes:&lt;/span&gt;&lt;/a&gt;New Features &amp;amp; Changes:&lt;/h5&gt;\n&lt;ul&gt;\n&lt;li&gt;Added metrics for read/write request rate limits and request queue size per user, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/0052341c563cc3c9eb2a3bdca11aaf7d36eabce4\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;0052341&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Prevented prerequisite paths from differing from execution paths, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/50156f0aa5382824a725ab27d3d1b2dc6210293b\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;50156f0&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Support opaqueness for &lt;code&gt;@schema&lt;/code&gt; attribute, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/4f2c6ad11f2bc951642546e33b790705911cee3d\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;4f2c6ad&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Allowed master cell removal without downtime of other components (except masters), &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/16bd5baf39e018085f42d8776dffefe16e648d27\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;16bd5ba&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Introduced a new pipeline for cross-cell copy operations, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/e7eea1ed49fb49d12d64639161e33943a4e06fa4\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;e7eea1e&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added &lt;code&gt;TSnapshotLoadContextGuard&lt;/code&gt; to provide access to readonly mode during snapshot loading, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/ee9402746c38adf4b23d5166cc4f41fdc01c4f20\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ee94027&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added validation of meta aggregated writer chunk extensions during master merge jobs, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/de86b64ca13ed72993e83e5e6bccedcb25fff0ef\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;de86b64&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Reduced &lt;code&gt;TTableNode&lt;/code&gt; memory usage by optimizing enums and chunk requisition fields, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/90226b0af60dffa15565e7f4642c0e0482038c96\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;90226b0&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Always enabled the local read executor, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/521af696a57c69c7b19855b310dacae1fce7e6a9\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;521af69&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Reworked &lt;code&gt;@hunk_primary_medium&lt;/code&gt; and &lt;code&gt;@hunk_media&lt;/code&gt; attributes:\n&lt;ul&gt;\n&lt;li&gt;They are now nullable.&lt;/li&gt;\n&lt;li&gt;Hunk chunks can be placed on a different medium than table chunks.&lt;/li&gt;\n&lt;li&gt;Replication is respected by the chunk replicator and initial writer.&lt;/li&gt;\n&lt;li&gt;Setting and clearing behavior is now well-defined, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/508e000430a6637a030c1575c7963efe1e37723a\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;508e000&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Added &lt;code&gt;snapshot-dump-scope-filter&lt;/code&gt; option to limit output during master snapshot dumps, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/8a734741b3b893596562e8b0968a82983679ea41\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;8a73474&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Enabled two-random-choices allocation strategy for write targets by default, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/1a153fb75b539f97bb3534cbd2a24b5405c4c91c\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;1a153fb&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Introduced Sequoia response keeper for tracking responses, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/f886fa13b8efa2c0959587a6e0bc6f5a5541a846\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;f886fa1&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added &lt;code&gt;checksum&lt;/code&gt; mode to &lt;code&gt;dump-snapshot&lt;/code&gt; CLI command for debugging snapshot mismatches, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/5daa91303d7210689ecb117614b908523bd429af\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;5daa913&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Enabled non-materialized computed column evaluation in static tables, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/221672d07a7b81987beff311ec22319d631a8278\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;221672d&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h5 id=\"fixes-and-optimizations5\"&gt;&lt;a href=\"en/admin-guide/releases.html#fixes-and-optimizations5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fixes &amp;amp; Optimizations:&lt;/span&gt;&lt;/a&gt;Fixes &amp;amp; Optimizations:&lt;/h5&gt;\n&lt;ul&gt;\n&lt;li&gt;Fixed validation error when prerequisite and execution paths differ, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/76ceba0c03c5fce8bc042dcb3726a3997a2153d5\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;76ceba0&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Prevented users from creating tables that are indices to themselves, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/f384a9f9ea286f4cc4b018498bca6596664c0c85\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;f384a9f&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed chunk replicator to correctly handle medium-specific replication overrides, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/2e0ca6446ad66eeba31e4c3a2b91d56bf11c0293\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;2e0ca64&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed chunk requisition updates during merging, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/29cc4968ed660253c6b8167993a67684a716eb9f\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;29cc496&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed duplicate validation issue on paths, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/3beea00256a370a74e5a9c1cb4b56e437a4159ad\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;3beea00&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed master statistics check on cell removal, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/2e9399802d02177cc0cd82069da18e09f5ade73a\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;2e93998&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed handling of replication override in chunk replicator (duplicate fix), &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/8c711f8b07d3f3ee55b7b4fb503b736072b66cdb\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;8c711f8&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed group ID for built-in &lt;code&gt;admins&lt;/code&gt; group, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/f687614331b358448d59af9438dfb7398a4909e0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;f687614&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed crash caused by null pointer dereference in &lt;code&gt;HydraCreateForeignObject&lt;/code&gt;, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/8ba1cabb0ccf6c958374ea2fe4948762609a1823\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;8ba1cab&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Removed legacy ZooKeeper shard code, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/c0482a74746e10d16900608dfdf7c4455a81a751\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;c0482a7&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed reliability status updates for exec nodes, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/4e9becf2dc2992ad8a714dcdcf404f1ba40758bf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;4e9becf&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed race between transaction commit and exported object cleanup, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/5b72aad7cafe1f0b44dd76acced1a52ecd4e7264\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;5b72aad&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Eliminated false alerts caused by harmless exported object races, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/8a80023a50661a42abba895aacda70d118adf845\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;8a80023&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed crash when setting a YSON dictionary with duplicate keys into a custom attribute, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/867354bffa92a4a9991d360c770e1219c4c12f81\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;867354b&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed row comparison logic in shallow merge validation, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/404a790b962ee26f1a4c2085d5bfc8b223ff6199\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;404a790&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Cleared pending container restarts to avoid reinitialization issues, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/1f0d9f7bccc8faae5302f68e32589f1d1a963068\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;1f0d9f7&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed crash when reading &lt;code&gt;@local_scan_flags&lt;/code&gt; attribute, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/d8743cbae113dc99a3c53612f253e45c8eab4b08\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;d8743cb&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed non-deterministic error messages caused by unordered YSON fields, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/d907ada9984b6b711e4d5dd02d36d9e333df5dbb\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;d907ada&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed compatibility issue with imaginary chunk locations, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/f591951182e9555c7ca58173ec14a75e7b6d41a7\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;f591951&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"other\"&gt;&lt;a href=\"en/admin-guide/releases.html#other\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Other&lt;/span&gt;&lt;/a&gt;Other&lt;/h4&gt;\n&lt;h5 id=\"new-features-and-changes6\"&gt;&lt;a href=\"en/admin-guide/releases.html#new-features-and-changes6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;New Features &amp;amp; Changes:&lt;/span&gt;&lt;/a&gt;New Features &amp;amp; Changes:&lt;/h5&gt;\n&lt;ul&gt;\n&lt;li&gt;Added memory usage tracking for logging, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/f0351fa2aa2278c7ac804c93074e91d70e724138\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;f0351fa&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added memory usage tracking for chunk replica cache, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/aa5053d5b243a3356d95388fb51094e2ed43ea68\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;aa5053d&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added memory usage tracking for sensors, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/8396ecddde795abc6b52642c07fbe56b5b76581d\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;8396ecd&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Introduced support for running multiple daemons in a single &lt;code&gt;ytserver&lt;/code&gt; process (multidaemon mode), &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/2986da8386705b72d1f2de8b4a6a9de21b4c05ea\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;2986da8&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added sanitization of monitoring labels, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/5bebc7aabdc9439f49e63b8a9104e8256a273940\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;5bebc7a&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added support for &lt;code&gt;decimal256&lt;/code&gt; type (up to 76 digits precision), including Skiff format as &lt;code&gt;int256&lt;/code&gt;, [implicit].&lt;/li&gt;\n&lt;li&gt;Added &lt;code&gt;message_level_overrides&lt;/code&gt; option to logging config for fine-grained runtime control, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/4e13e2a32db1cb46272330c131c1c4ca3f50994d\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;4e13e2a&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h5 id=\"fixes-and-optimizations6\"&gt;&lt;a href=\"en/admin-guide/releases.html#fixes-and-optimizations6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fixes &amp;amp; Optimizations:&lt;/span&gt;&lt;/a&gt;Fixes &amp;amp; Optimizations:&lt;/h5&gt;\n&lt;ul&gt;\n&lt;li&gt;Fixed a bug where queued heavy RPC requests could incorrectly reuse storage (e.g. trace context) from unrelated requests, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/6bd19a014d512d4d5f2bcac54ae2087f65cce3f9\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;6bd19a0&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Improved tracking of row cache memory usage, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/122fd89ce22e6eb1f6cb48672463a0c264af9069\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;122fd89&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Histogram counters now use 64-bit values, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/94fe6d36acebe32f2609ff1b7be7547dbeeaa446\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;94fe6d3&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed propagation of &lt;code&gt;TLargeColumnarStatisticsExt&lt;/code&gt; in MAW, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/bee2ba31007789d05a6799a7e38add72dab6a8b7\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;bee2ba3&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed handling of unexpected state in data node heartbeat logic, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/2e16721f4f2aec16089ee6eae580e8bca03347ba\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;2e16721&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Properly handled peer disconnects in the NBD server, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/b1f2acf7363a9e5dfc123f2cdf60483d3e9a37cb\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;b1f2acf&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;NBD queue now uses a dedicated thread pool, configurable via dynamic config, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/5e9c7fe3167aa81403b0b4f8ced3cafd0ad544a2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;5e9c7fe&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;24.2.1&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-07-28&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;To install YTsaurus Server 24.2.1 &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/releases/tag/release%2F0.22.0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;update&lt;/a&gt; the k8s-operator to version 0.22.0.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"proxy1\"&gt;&lt;a href=\"en/admin-guide/releases.html#proxy1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Proxy&lt;/span&gt;&lt;/a&gt;Proxy&lt;/h4&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Support HTTP proxies in &lt;code&gt;discover_proxies&lt;/code&gt; handler, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/0dc02db399a7e3e6255f8716102add5bf404bd39\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;0dc02db&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Support full result table in YQL queries result, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/2d7b0d3e761361ff3157e7a36465ee79478ab3c7\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;2d7b0d3&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Set attribute &lt;code&gt;treat_as_queue_producer=%true&lt;/code&gt; during &lt;code&gt;queue_producer&lt;/code&gt; creation, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/1ee68e1fa7409d125605ba4047f655532f42f6ee\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;1ee68e1&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fix &lt;code&gt;PartitionTables&lt;/code&gt; handler for ordered mode, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/100bdc425c787902212c041822ef9557ebb7b932\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;100bdc4&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"master\"&gt;&lt;a href=\"en/admin-guide/releases.html#master\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Master&lt;/span&gt;&lt;/a&gt;Master&lt;/h4&gt;\n&lt;p&gt;Fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix a crash on &lt;code&gt;GetIteratorOrCrash&lt;/code&gt; in &lt;code&gt;TChunkMerger::HydraFinalizeChunkMergeSessions&lt;/code&gt;, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/5eda0952c2a3453d853a83c24b16b3a5d7f31d49\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;5eda095&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fix for Object Service hang ups, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/31e2dfd7dbe7ad001f11d30fa1c59bc7a7a9ca21\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;31e2dfd&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fix a data race on cache cookies in Object Service, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/1d79d8d37d81438389a5280c595e8254cfc6f678\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;1d79d8d&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"queue-agent1\"&gt;&lt;a href=\"en/admin-guide/releases.html#queue-agent1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Queue Agent&lt;/span&gt;&lt;/a&gt;Queue Agent&lt;/h4&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Add a flag to select queue export implementation, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/3ec2e6945cf0af0f64d16e94ee5aa66e902abbf1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;3ec2e69&lt;/a&gt;.&lt;br /&gt;\nFixes:&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix &lt;code&gt;init_queue_agent_state&lt;/code&gt; script to handle restart cases properly, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/ae43add3ecd560c1f49fc41b40a2b0bd6b1f402f\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ae43add&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fix potential data loss in case of multiple exports per queue due to incorrect merging of queue export progresses, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/c44e13b5271ff91c5860c91448fbd704924ddf35\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;c44e13b&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"tablet-balancer\"&gt;&lt;a href=\"en/admin-guide/releases.html#tablet-balancer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tablet Balancer&lt;/span&gt;&lt;/a&gt;Tablet Balancer&lt;/h4&gt;\n&lt;p&gt;Fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix deviation recalculation during parameterized merge right index search, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/b7df5009926f4d0386fa924902da46e71e63bb54\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;b7df500&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"other1\"&gt;&lt;a href=\"en/admin-guide/releases.html#other1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Other&lt;/span&gt;&lt;/a&gt;Other&lt;/h4&gt;\n&lt;p&gt;Feature:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Support &lt;code&gt;ytprof&lt;/code&gt; for all components.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;24.2.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2025-03-19&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;To install YTsaurus Server 24.2.0 &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/releases/tag/release%2F0.22.0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;update&lt;/a&gt; the k8s-operator to version 0.22.0.&lt;/em&gt;&lt;/p&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"known-issue\"&gt;&lt;a href=\"en/admin-guide/releases.html#known-issue\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Known Issue&lt;/span&gt;&lt;/a&gt;Known Issue&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Expanding a cluster with new master cells is temporarily disabled due to a bug. This issue will be resolved in the upcoming 25.1 version.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;hr /&gt;\n&lt;h4 id=\"scheduler-and-gpu1\"&gt;&lt;a href=\"en/admin-guide/releases.html#scheduler-and-gpu1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Scheduler and GPU&lt;/span&gt;&lt;/a&gt;Scheduler and GPU&lt;/h4&gt;\n&lt;p&gt;New Features &amp;amp; Changes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Added support for ACO-based access control in operations.&lt;/li&gt;\n&lt;li&gt;Introduced &lt;code&gt;get_job_trace&lt;/code&gt; method in the jobs API.&lt;/li&gt;\n&lt;li&gt;Added an option to fail an operation if started in a non-existent pool.&lt;/li&gt;\n&lt;li&gt;Enriched configuration options for offloading operations to pool trees.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes &amp;amp; Optimizations:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fixed scheduling issues with new allocations immediately after operation suspension.&lt;/li&gt;\n&lt;li&gt;Optimized fair share updates within the control thread.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"queue-agent2\"&gt;&lt;a href=\"en/admin-guide/releases.html#queue-agent2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Queue Agent&lt;/span&gt;&lt;/a&gt;Queue Agent&lt;/h4&gt;\n&lt;p&gt;New Features &amp;amp; Changes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Queue exports are now considered when trimming replicated and chaos replicated table queues.&lt;/li&gt;\n&lt;li&gt;Introduced sum aggregation for lag metrics in consumer partitions.&lt;/li&gt;\n&lt;li&gt;Refactor queue exports: add retries and rate limiting.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes &amp;amp; Optimizations:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fixed a possible queue controller suspension by adding a timeout to &lt;code&gt;GetOrderedTabletSafeTrimRowCount&lt;/code&gt; requests.&lt;/li&gt;\n&lt;li&gt;Corrected lock options when acquiring a shared lock for the export directory.&lt;/li&gt;\n&lt;li&gt;Resolved expiration issues of clients for chaos queues and consumers when the cluster connection changes.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"proxy2\"&gt;&lt;a href=\"en/admin-guide/releases.html#proxy2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Proxy&lt;/span&gt;&lt;/a&gt;Proxy&lt;/h4&gt;\n&lt;p&gt;New Features &amp;amp; Changes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Supported YAML format for structured data. See details in the RFC: &lt;a href=\"https://github.com/ytsaurus/ytsaurus/wiki/%5BRFC%5D-YAML-format-support\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YAML-format support&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Introduced create_user_if_not_exists config flag to disable automatic user creation during OAuth authentication. &lt;a href=\"https://github.com/ytsaurus/ytsaurus/issues/930\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Issue&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Added &lt;code&gt;cache_key_mode&lt;/code&gt; parameter for controlling credential caching granularity.&lt;/li&gt;\n&lt;li&gt;Implemented a new handler for retrieving job trace events.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes &amp;amp; Optimizations:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The &lt;code&gt;discover_proxies&lt;/code&gt; handler now returns an error when the proxy type is &lt;code&gt;http&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed a heap buffer overflow in the Arrow parser.&lt;/li&gt;\n&lt;li&gt;If insufficient memory is available to handle RPC responses, a retryable &lt;code&gt;Unavailable&lt;/code&gt; error will now be returned instead of the non-retryable &lt;code&gt;MemoryPressure&lt;/code&gt; error.&lt;/li&gt;\n&lt;li&gt;Optimized the &lt;code&gt;concatenate&lt;/code&gt; method.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"kafka-proxy\"&gt;&lt;a href=\"en/admin-guide/releases.html#kafka-proxy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kafka proxy&lt;/span&gt;&lt;/a&gt;Kafka proxy&lt;/h4&gt;\n&lt;p&gt;Introduce a new component: the Kafka Proxy. This MVP version enables integration with YTsaurus queues using the Kafka protocol. It currently supports a minimal API for writing to queues and reading with load balancing through consumer groups.&lt;/p&gt;\n&lt;h4 id=\"dynamic-tables2\"&gt;&lt;a href=\"en/admin-guide/releases.html#dynamic-tables2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dynamic Tables&lt;/span&gt;&lt;/a&gt;Dynamic Tables&lt;/h4&gt;\n&lt;p&gt;New Features &amp;amp; Changes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Introduced Versioned Remote Copy for tables with hunks.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes &amp;amp; Optimizations:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fixed issues with secondary indices in multi-cell clusters (especially large clusters).&lt;/li&gt;\n&lt;li&gt;Improved stability and performance of chaos replication.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"mapreduce1\"&gt;&lt;a href=\"en/admin-guide/releases.html#mapreduce1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MapReduce&lt;/span&gt;&lt;/a&gt;MapReduce&lt;/h4&gt;\n&lt;p&gt;New Features &amp;amp; Changes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Disallowed cluster_connection in remote copy operations.&lt;/li&gt;\n&lt;li&gt;Introduced single-chunk teleportation for auto-merge operations.&lt;/li&gt;\n&lt;li&gt;Merging of tables with compatible (not necessarily matching) schemas is supported.&lt;/li&gt;\n&lt;li&gt;Refactored code in preparation for gang operation introduction.&lt;/li&gt;\n&lt;li&gt;Refactored code to enable job-level allocation reuse.&lt;/li&gt;\n&lt;li&gt;Improved per-job directory logging in job-proxy mode.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes &amp;amp; Optimizations:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Optimized job resource acquisition in exec nodes.&lt;/li&gt;\n&lt;li&gt;Fixed cases of lost metrics in exec nodes.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"master-server1\"&gt;&lt;a href=\"en/admin-guide/releases.html#master-server1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Master Server&lt;/span&gt;&lt;/a&gt;Master Server&lt;/h4&gt;\n&lt;p&gt;New Features &amp;amp; Changes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Added an option to fetch input/output table schemas from an external cell using a schema ID.&lt;/li&gt;\n&lt;li&gt;Deprecated the list node type; its creation is now forbidden.&lt;/li&gt;\n&lt;li&gt;Introduced a new write target allocation strategy using the “two random choices” algorithm.&lt;/li&gt;\n&lt;li&gt;Implemented an automatic mechanism to disable replication to data nodes in failing data centers. This can be configured in &lt;code&gt;//sys/@config/chunk_manager/data_center_failure_detector&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Introduced pessimistic validation for resource usage increases when changing the primary medium.&lt;/li&gt;\n&lt;li&gt;Forbidden certain erasure codecs in remote copy operations.&lt;/li&gt;\n&lt;li&gt;Added node groups attribute for node&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes &amp;amp; Optimizations:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fixed a race condition between transaction coordinator commit and cell unref for exported objects, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/8d6721a16bb6a1bc26c9f0d1dc5506f32635e6b6\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;8d6721a&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed manual Cypress node merging for Scheduler transactions, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/f87a2ad466c2352be9ba7bfee6e7d93796a9eb6a\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;f87a2ad&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed master crash when setting a YSON dictionary with duplicate keys in a custom attribute, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/0cfad80f415c23233ca748e345cd9af91169f4c3\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;0cfad80&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed row comparison in shallow merge validation to prevent job failures, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/3c282d4e9f50aa00d861b7a6f1ca388fea18e51d\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;3c282d4&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed a crash when reading &lt;code&gt;@local_scan_flags&lt;/code&gt; attribute, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/5b4c954c09ac6e1adc55aa6a5d7baff8f894fb61\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;5b4c954&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed non-deterministic YSON struct field loading that could cause a “state hashes differ” alert due to inconsistent error messages when multiple required fields were missing, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/commit/0553e2182a0df502592abdd1fcd8ac3c6afd64ad\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;0553e21&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Fixed an issue where nodes held by transactions interfered with cleanup triggered by &lt;code&gt;expiration_time&lt;/code&gt; attribute.&lt;/li&gt;\n&lt;li&gt;Fixed a bug that caused account metrics to break when adding a new account.&lt;/li&gt;\n&lt;li&gt;Fixed a bug in attribute-based access control that caused the first entry to always be evaluated.&lt;/li&gt;\n&lt;li&gt;Fixed an issue where Hydra followers could become indefinitely stuck after a lost mutation.&lt;/li&gt;\n&lt;li&gt;Limited chunk list count per chunk merger session to prevent master overload.&lt;/li&gt;\n&lt;li&gt;Fixed an incorrect check for the state of a node during the removal process.&lt;/li&gt;\n&lt;li&gt;Improved incremental heartbeat reporting to prevent chunks from getting stuck in the destroyed queue.&lt;/li&gt;\n&lt;li&gt;Optimized chunk merger by reducing unnecessary requisition updates.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;24.1.0&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-11-07&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;To install YTsaurus Server 24.1.0 &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/releases\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;update&lt;/a&gt; the k8s-operator to version 0.17.0.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"scheduler-and-gpu2\"&gt;&lt;a href=\"en/admin-guide/releases.html#scheduler-and-gpu2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Scheduler and GPU&lt;/span&gt;&lt;/a&gt;Scheduler and GPU&lt;/h4&gt;\n&lt;p&gt;Features and changes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Support prioritization of pools during strong guarantee adjustment due to insufficient total cluster resources.&lt;/li&gt;\n&lt;li&gt;Support prioritization of operations during module assignment stage of the GPU scheduling algorithm.&lt;/li&gt;\n&lt;li&gt;Support job resource demand restrictions per pool tree.&lt;/li&gt;\n&lt;li&gt;Add custom TTL for jobs in operation archive.&lt;/li&gt;\n&lt;li&gt;Add user job trace collection in Trace Event Format.&lt;/li&gt;\n&lt;li&gt;Refactor exec node config and Orchid.&lt;/li&gt;\n&lt;li&gt;Logically separate jobs and allocations.&lt;/li&gt;\n&lt;li&gt;Add configurable input data buffer size in jobs for more efficient interrupts.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes and optimizations:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix exec node heartbeat tracing throughout scheduler and controller agents.&lt;/li&gt;\n&lt;li&gt;Optimize general allocation scheduling algorithm and fair share computation.&lt;/li&gt;\n&lt;li&gt;Optimize scheduler &amp;lt;-&amp;gt; CA and exec node &amp;lt;-&amp;gt; CA heartbeats processing.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"queue-agent3\"&gt;&lt;a href=\"en/admin-guide/releases.html#queue-agent3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Queue Agent&lt;/span&gt;&lt;/a&gt;Queue Agent&lt;/h4&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Treat static queue export the same way as vital consumer during queues trimming, so not exported rows will not be trimmed.&lt;/li&gt;\n&lt;li&gt;Add functionality for banning queue agent instances via cypress attribute.&lt;/li&gt;\n&lt;li&gt;Take cumulative data weight and timestamp from consumer meta for consumer metrics.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix bug in handling of queues/consumers with invalid attributes (e.g. &lt;code&gt;auto_trim_config&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;Fix alerts visibility from &lt;code&gt;@queue_status&lt;/code&gt; attribute.&lt;/li&gt;\n&lt;li&gt;Do not ignore consumers higher than queue size.&lt;/li&gt;\n&lt;li&gt;Rename &lt;code&gt;write_registration_table_mapping&lt;/code&gt; -&amp;gt; &lt;code&gt;write_replicated_table_mapping&lt;/code&gt; in dynamic config.&lt;/li&gt;\n&lt;li&gt;Take shared lock instead of exclusive lock on static export destination directories.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"proxy3\"&gt;&lt;a href=\"en/admin-guide/releases.html#proxy3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Proxy&lt;/span&gt;&lt;/a&gt;Proxy&lt;/h4&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Implement queue producer handlers for exactly once pushing in queues (&lt;code&gt;PushQueueProducer&lt;/code&gt;, &lt;code&gt;CreateQueueProducerSession&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;Add &lt;code&gt;queue_consumer&lt;/code&gt; and &lt;code&gt;queue_producer&lt;/code&gt; object type handler, so they can be created without explicitly schema specification. Example: &lt;code&gt;yt create queue_consumer &amp;lt;path&amp;gt;&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Support retries of cross cell copying.&lt;/li&gt;\n&lt;li&gt;Add float and date types in Arrow format.&lt;/li&gt;\n&lt;li&gt;Add memory tracking for &lt;code&gt;read_table&lt;/code&gt; requests.&lt;/li&gt;\n&lt;li&gt;Drop heavy requests if there is no more memory.&lt;/li&gt;\n&lt;li&gt;Send &lt;code&gt;bytes_out&lt;/code&gt; and &lt;code&gt;bytes_in&lt;/code&gt; metrics during request execution.&lt;/li&gt;\n&lt;li&gt;Store &lt;code&gt;cumulative_data_weight&lt;/code&gt; and &lt;code&gt;timestamp&lt;/code&gt; in consumer meta.&lt;/li&gt;\n&lt;li&gt;Rename &lt;code&gt;PullConsumer&lt;/code&gt; -&amp;gt; &lt;code&gt;PullQueueConsumer&lt;/code&gt; and &lt;code&gt;AdvanceConsumer&lt;/code&gt; -&amp;gt; &lt;code&gt;AdvanceQueueConsumer&lt;/code&gt;. Old handlers continue to exists for now for backward compatibility reasons.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;CHYT:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Add authorization via X-ClickHouse-Key HTTP-header.&lt;/li&gt;\n&lt;li&gt;Add sticky query distribution based on session id/sticky cookie.&lt;/li&gt;\n&lt;li&gt;Add a new \"/chyt\" http handler for chyt queries (\"/query\" handler is deprecated but still works for backward compatibility).&lt;/li&gt;\n&lt;li&gt;Add ability to allocate a separate port for the new http handler to support queries without a custom URL path.&lt;/li&gt;\n&lt;li&gt;The clique alias may be specified via \"chyt.clique_alias\" or \"user\" parameters (only for new handlers).&lt;/li&gt;\n&lt;li&gt;Make HTTP GET requests read-only for compatibility with ClickHouse  (only for new handlers).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fill dictionary encoding index type in Arrow format.&lt;/li&gt;\n&lt;li&gt;Fix null, void and optional composite columns in Arrow format.&lt;/li&gt;\n&lt;li&gt;Fix &lt;code&gt;yt.memory.heap_usage&lt;/code&gt; metrics.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"dynamic-tables3\"&gt;&lt;a href=\"en/admin-guide/releases.html#dynamic-tables3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dynamic Tables&lt;/span&gt;&lt;/a&gt;Dynamic Tables&lt;/h4&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Secondary Indexes: basic, partial, list, and unique indexes.&lt;/li&gt;\n&lt;li&gt;Optimize queries which group and order by same keys.&lt;/li&gt;\n&lt;li&gt;Balance tablets using load factor (requires standalone tablet balancer).&lt;/li&gt;\n&lt;li&gt;Shared write lock - write to same row from different transactions without blocking.&lt;/li&gt;\n&lt;li&gt;Rpc proxy client balancer based on power of two choices algorithm.&lt;/li&gt;\n&lt;li&gt;Compression dictionary for Hunks and Hash index.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"mapreduce2\"&gt;&lt;a href=\"en/admin-guide/releases.html#mapreduce2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MapReduce&lt;/span&gt;&lt;/a&gt;MapReduce&lt;/h4&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Support input tables from remote clusters in operations.&lt;/li&gt;\n&lt;li&gt;Improve control over how data is split into jobs for ML training applications.&lt;/li&gt;\n&lt;li&gt;Support read by latest timestamp in MapReduce operations over dynamic tables.&lt;/li&gt;\n&lt;li&gt;Disclose less configuration information to a potential attacker.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix teleportation of a single chunk in an unordered pool.&lt;/li&gt;\n&lt;li&gt;Fix agent disconnect on removal of an account.&lt;/li&gt;\n&lt;li&gt;Fix the inference of intermediate schemas for inputs with column filters.&lt;/li&gt;\n&lt;li&gt;Fix controller agent crash on incompatible user statistic paths.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Optimizations:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Add JobInputCache: in-memory cache on exe nodes, storing data read by multiple jobs running on the same node.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"master-server2\"&gt;&lt;a href=\"en/admin-guide/releases.html#master-server2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Master Server&lt;/span&gt;&lt;/a&gt;Master Server&lt;/h4&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Tablet cells Hydra persistence data is now primarily stored at the new location &lt;code&gt;//sys/hydra_persistence&lt;/code&gt; by default. The duality with the previous location (&lt;code&gt;//sys/tablet_cells&lt;/code&gt;) will be resolved in the future releases.&lt;/li&gt;\n&lt;li&gt;Support inheritance of &lt;code&gt;@chunk_merger_mode&lt;/code&gt; after copy into directory with set &lt;code&gt;@chunk_merger_mode&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Add backoff rescheduling for nodes merged by chunk merger in case of a transient failure to merge them.&lt;/li&gt;\n&lt;li&gt;Add an option to use the two random choices algorithm when allocating write targets.&lt;/li&gt;\n&lt;li&gt;Add the add-maintenance command to CLI.&lt;/li&gt;\n&lt;li&gt;Support intra-cell cross-shard link nodes.&lt;/li&gt;\n&lt;li&gt;Propagate transaction user to transaction replicas for the sake of proper accounting of the cpu time spent committing or aborting them.&lt;/li&gt;\n&lt;li&gt;Propagate knowledge of new master cells dynamically to other cluster components and shorten downtime when adding new master cells.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Optimizations:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Reduce master server memory footprint by reducing the size of table nodes.&lt;/li&gt;\n&lt;li&gt;Speed up removal jobs on data nodes.&lt;/li&gt;\n&lt;li&gt;Move exec node tracker service away from automaton thread.&lt;/li&gt;\n&lt;li&gt;Non-data nodes are now disposed immediately (instead of per location disposal) and independently from data-nodes.&lt;/li&gt;\n&lt;li&gt;Offload invoking transaction replication requests from automaton thread.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Fix nullptr dereferencing in resolution of queue agent and yql agent attributes.&lt;/li&gt;\n&lt;li&gt;Respect medium override in IO engine on node restart.&lt;/li&gt;\n&lt;li&gt;Fix rebalancing mode in table's chunk tree after merging branched tables.&lt;/li&gt;\n&lt;li&gt;Fix sanitizing hostnames in errors for cellar nodes.&lt;/li&gt;\n&lt;li&gt;Fix losing trace context for some callbacks and rpc calls.&lt;/li&gt;\n&lt;li&gt;Fix persistence of &lt;code&gt;@last_seen_time&lt;/code&gt; attribute for users.&lt;/li&gt;\n&lt;li&gt;Fix handling unknown chunk meta extensions by meta aggregating writer.&lt;/li&gt;\n&lt;li&gt;Fix nodes crashing on heartbeat retries when masters are down for a long time.&lt;/li&gt;\n&lt;li&gt;Fix table statistics being inconsistent between native and external cells after copying the table mid statistics update.&lt;/li&gt;\n&lt;li&gt;Fix logical request weight being accidentally dropped in proxying chunk service.&lt;/li&gt;\n&lt;li&gt;Fix a crash that occasionally occurred when exporting a chunk.&lt;/li&gt;\n&lt;li&gt;Fix tablet cell lease transactions getting stuck sometimes.&lt;/li&gt;\n&lt;li&gt;Native client retries are now more reliable.&lt;/li&gt;\n&lt;li&gt;Fix primary cell chunk hosting for multicell.&lt;/li&gt;\n&lt;li&gt;Fix crash related to starting incumbency epoch until recovery is complete.&lt;/li&gt;\n&lt;li&gt;Restart elections if changelog store for a voting peer is locked in read-only (Hydra fix for tablet nodes).&lt;/li&gt;\n&lt;li&gt;Fix crashing on missing schema when importing a chunk.&lt;/li&gt;\n&lt;li&gt;Fix an epoch restart-related crash in expiration tracker.&lt;/li&gt;\n&lt;li&gt;In master cell directory, alert on an unknown cell role instead of crashing.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"misc\"&gt;&lt;a href=\"en/admin-guide/releases.html#misc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Misc&lt;/span&gt;&lt;/a&gt;Misc&lt;/h4&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Add ability to redirect stdout to stderr in user jobs (&lt;code&gt;redirect_stdout_to_stderr&lt;/code&gt; option in operation spec).&lt;/li&gt;\n&lt;li&gt;Add dynamic table log writer.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;&lt;strong&gt;23.2.1&lt;/strong&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;strong&gt;Release date:&lt;/strong&gt; 2024-07-31&lt;/p&gt;\n&lt;h4 id=\"scheduler-and-gpu3\"&gt;&lt;a href=\"en/admin-guide/releases.html#scheduler-and-gpu3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Scheduler and GPU&lt;/span&gt;&lt;/a&gt;Scheduler and GPU&lt;/h4&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Disable writing &lt;code&gt;//sys/scheduler/event_log&lt;/code&gt; by default.&lt;/li&gt;\n&lt;li&gt;Add lightweight running operations.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Various optimizations in scheduler&lt;/li&gt;\n&lt;li&gt;Improve total resource usage and limits profiling.&lt;/li&gt;\n&lt;li&gt;Do not account job preparation time in GPU statistics.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"queue-agent4\"&gt;&lt;a href=\"en/admin-guide/releases.html#queue-agent4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Queue Agent&lt;/span&gt;&lt;/a&gt;Queue Agent&lt;/h4&gt;\n&lt;p&gt;Fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Normalize cluster name in queue consumer registration.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"proxy4\"&gt;&lt;a href=\"en/admin-guide/releases.html#proxy4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Proxy&lt;/span&gt;&lt;/a&gt;Proxy&lt;/h4&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;RPC proxy API for Query Tracker.&lt;/li&gt;\n&lt;li&gt;Changed format and added metadata for issued user tokens.&lt;/li&gt;\n&lt;li&gt;Support rotating TLS certificates for HTTP proxies.&lt;/li&gt;\n&lt;li&gt;Compatibility with recent Query Tracker release.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Do not retry on Read-Only response error.&lt;/li&gt;\n&lt;li&gt;Fix standalone authentication token revokation.&lt;/li&gt;\n&lt;li&gt;Fix per-user memory tracking (propagate allocation tags to child context).&lt;/li&gt;\n&lt;li&gt;Fix arrow format for optional types.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"dynamic-tables4\"&gt;&lt;a href=\"en/admin-guide/releases.html#dynamic-tables4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dynamic Tables&lt;/span&gt;&lt;/a&gt;Dynamic Tables&lt;/h4&gt;\n&lt;p&gt;Features:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Shared write locks.&lt;/li&gt;\n&lt;li&gt;Increased maximum number of key columns to 128.&lt;/li&gt;\n&lt;li&gt;Implemented array join in YT QL.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Fixes:&lt;/p&gt;\n&lt;ul&gt
