        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"main\"&gt;&lt;a href=\"en/admin-guide/cluster-operations.html#main\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cluster operations&lt;/span&gt;&lt;/a&gt;Cluster operations&lt;/h2&gt;\n&lt;h3 id=\"managing-data-storage-quotas\"&gt;&lt;a href=\"en/admin-guide/cluster-operations.html#managing-data-storage-quotas\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Managing data storage quotas&lt;/span&gt;&lt;/a&gt;Managing data storage quotas&lt;/h3&gt;\n&lt;p&gt;You can manage quotas for data storage using accounts. You can read more about accounts &lt;a href=\"user-guide/storage/accounts.html\"&gt;here&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;This section provides several standard examples of how to work with accounts using the CLI.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Viewing accounts&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;In Cypress, the account tree can be found at &lt;code&gt;//sys/account_tree&lt;/code&gt;. The full flat list is available at &lt;code&gt;//sys/accounts&lt;/code&gt; (account names are globally unique, despite the hierarchical organization).&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Listing 1 — Tree and flat account representation in Cypress&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt list //sys/account_tree/my_account\nmy_subaccount1\nmy_subaccount2\n\n$ yt list //sys/accounts\nmy_account\nmy_subaccount1\nmy_subaccount2\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"23\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-23\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-23\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-23.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Account has &lt;a href=\"user-guide/storage/accounts.html#account_attributes\"&gt;lots of attributes&lt;/a&gt; for describing resource limits, current resource usage, and more.&lt;/p&gt;\n&lt;p&gt;You can request the attributes of an account (or any Cypress object) using this command:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$ yt get //sys/account_tree/my_account/@\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"30\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-30\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-30\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-30.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Creating an account&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;To create an account, specify its name in the &lt;code&gt;name&lt;/code&gt; attribute and the parent name in the &lt;code&gt;parent_name&lt;/code&gt; attribute. If no parent name is specified, a topmost account will be created. Only cluster administrators have the right to create topmost accounts.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Listing 2 — Creating a new account&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt create account --attributes=&lt;span class=\"hljs-string\"&gt;'{ name = \"my_subaccount3\"; parent_name = \"my_account\" }'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"44\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-44\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-44\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-44.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Removing an account&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;To remove an account, just enter the path to it:&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Listing 3 — Removing an account&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt remove //sys/accounts/my_subaccount3\n\n&lt;span class=\"hljs-comment\"&gt;# or&lt;/span&gt;\n\n$ yt remove //sys/account_tree/my_account/my_subaccount3\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"58\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-58\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-58\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-58.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Changing account resources&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Here's an example of modifying the number of Cypress nodes in account limits.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Listing 4 — Changing account resources&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Get the current number&lt;/span&gt;\n$ yt get //sys/accounts/my_subaccount3/@resource_limits/node_count\n1000\n\n&lt;span class=\"hljs-comment\"&gt;# Set a new value&lt;/span&gt;\n$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/accounts/my_subaccount3/@resource_limits/node_count 2000\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"72\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-72\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-72\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-72.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Please note that total disk space managed with accounts isn't limited to the cluster's actual available space.&lt;br /&gt;\nOne of the system administrator's responsibilities is to use account limits to make sure the cluster doesn't run out of physical disk space.&lt;/p&gt;\n&lt;h3 id=\"managing-computational-quotas\"&gt;&lt;a href=\"en/admin-guide/cluster-operations.html#managing-computational-quotas\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Managing computational quotas&lt;/span&gt;&lt;/a&gt;Managing computational quotas&lt;/h3&gt;\n&lt;p&gt;The scheduler is responsible for allocating computational resources in the cluster, but the descriptions of pool trees and pools (entities that store information about computational quotas) are stored in Cypress. We recommend reading the general &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;scheduler documentation&lt;/a&gt; as well as our &lt;a href=\"user-guide/data-processing/scheduler/manage-pools.html\"&gt;help page on pool management&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;It provides several standard examples of how to work with pools using the CLI.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Viewing pools&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;small&gt;Listing 1 — Viewing pools&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt get //sys/pool_trees/default\n{\n    &lt;span class=\"hljs-string\"&gt;\"project-root\"&lt;/span&gt; = {\n        &lt;span class=\"hljs-string\"&gt;\"project-subpool1\"&lt;/span&gt; = {\n        };\n        &lt;span class=\"hljs-string\"&gt;\"project-subpool2\"&lt;/span&gt; = {\n        };\n    };\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"95\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-95\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-95\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-95.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Creating a nested pool&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;small&gt;Listing 2 — Creating a nested pool&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt create scheduler_pool --attributes=&lt;span class=\"hljs-string\"&gt;'{pool_tree=default;name=project-subpool1;parent_name=project-root}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"106\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-106\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-106\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-106.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;You can additionally pass pool-specific attributes. These attributes will be validated and if the validation fails, the object will not be created.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Changing pool attributes&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;small&gt;Listing 3 — Pool attributes changes&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Setting the weight&lt;/span&gt;\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/pool_trees/default/project-root/project-subpool1/@weight 10\n\n&lt;span class=\"hljs-comment\"&gt;# Forbid starting operations in the pool&lt;/span&gt;\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/pool_trees/default/project-root/@forbid_immediate_operations &lt;span class=\"hljs-string\"&gt;'%true'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"120\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-120\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-120\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-120.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Setting and changing pool guarantees&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Specifying guaranteed resources of the pool (it is possible only if the parent pool has enough undisitributed resources):&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Listing 4 — Initial guarantee specification&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/pool_trees/default/project-root/project-subpool1/@strong_guarantee_resources &lt;span class=\"hljs-string\"&gt;'{cpu=50}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"134\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-134\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-134\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-134.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;To change guarantee that already set specify concrete resource type:&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Listing 5 — Changing a guarantee&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/pool_trees/default/project-root/project-subpool1/@strong_guarantee_resources/cpu 100\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"141\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-141\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-141\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-141.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Unlike data storage quotas, the scheduler validates that distributed computing quotas meet the actual resources available in the cluster.&lt;/p&gt;\n&lt;h3 id=\"managing-users,-groups-and-access-controls\"&gt;&lt;a href=\"en/admin-guide/cluster-operations.html#managing-users,-groups-and-access-controls\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Managing users, groups and access controls&lt;/span&gt;&lt;/a&gt;Managing users, groups and access controls&lt;/h3&gt;\n&lt;p&gt;Users and groups are presented by user and group objects, while access rights are managed by the acl attribute. For more information about the access rights model, see the relevant &lt;a href=\"user-guide/storage/access-control.html\"&gt;section&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;As a rule, user, group, and access management is delegated to a third-party system (for example, in &lt;a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;IAM&lt;/a&gt;), but for the small installations it is reasonable to handle user, groups and acls manually.&lt;/p&gt;\n&lt;p&gt;Examples of user and group management.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Viewing users and groups&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;small&gt;Listing 1 — Viewing users&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt get //sys/users\n{\n    &lt;span class=\"hljs-string\"&gt;\"file_cache\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"guest\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"root\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"scheduler\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"operations_cleaner\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"operations_client\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"queue_agent\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"tablet_balancer\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"167\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-167\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-167\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-167.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;small&gt;Listing 2 — Viewing groups&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //sys/groups\n{\n    &lt;span class=\"hljs-string\"&gt;\"devs\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"admins\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"superusers\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"everyone\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"users\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"admin_snapshots\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"171\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-171\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-171\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-171.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;small&gt;Listing 3 — Viewing group members&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //sys/groups/users/@members\n[\n    &lt;span class=\"hljs-string\"&gt;\"superusers\"&lt;/span&gt;;\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"175\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-175\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-175\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-175.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Creating users and groups&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;small&gt;Listing 4 — Creating a user&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt create user --attributes &lt;span class=\"hljs-string\"&gt;'{name=my_user}'&lt;/span&gt;\n1-4a7d-101f5-f881885\n\n$ yt exists //sys/users/my_user\n&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"186\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-186\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-186\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-186.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;small&gt;Listing 5 — Creating a group&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt create group --attributes &lt;span class=\"hljs-string\"&gt;'{name=my_group}'&lt;/span&gt;\n1-bedc-101f6-45aec437\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"190\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-190\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-190\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-190.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;small&gt;Listing 6 — Adding a user to a group&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt add-member my_user my_group\n\n$ yt get //sys/users/my_user/@member_of\n[\n    &lt;span class=\"hljs-string\"&gt;\"users\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"my_group\"&lt;/span&gt;;\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"194\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-194\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-194\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-194.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Changing user's RPS limits&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;small&gt;Listing 7 — Changing user's RPS limits&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //sys/users/my_user/@read_request_rate_limit\n100\n$ yt get //sys/users/my_user/@write_request_rate_limit\n100\n\n$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/users/my_user/@read_request_rate_limit 300\n$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/users/my_user/@write_request_rate_limit 200\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"205\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-205\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-205\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-205.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Viewing a node's ACL&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Note that access rights configured directly on the Cypress node and access rights inherited from the parent may differ&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Listing 8 — Viewing a node's ACL&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt create map_node //home/my_user\n1-283e-1012f-63684d08\n$ yt get //home/my_user/@acl\n[]\n$ yt get //home/my_user/@inherit_acl\n%&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n$ yt get //home/my_user/@effective_acl\n[\n    {\n        &lt;span class=\"hljs-string\"&gt;\"action\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"allow\"&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"subjects\"&lt;/span&gt; = [\n            &lt;span class=\"hljs-string\"&gt;\"users\"&lt;/span&gt;;\n        ];\n        &lt;span class=\"hljs-string\"&gt;\"permissions\"&lt;/span&gt; = [\n            &lt;span class=\"hljs-string\"&gt;\"read\"&lt;/span&gt;;\n        ];\n        &lt;span class=\"hljs-string\"&gt;\"inheritance_mode\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"object_and_descendants\"&lt;/span&gt;;\n    };\n    {\n        &lt;span class=\"hljs-string\"&gt;\"action\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"allow\"&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"subjects\"&lt;/span&gt; = [\n            &lt;span class=\"hljs-string\"&gt;\"admins\"&lt;/span&gt;;\n        ];\n        &lt;span class=\"hljs-string\"&gt;\"permissions\"&lt;/span&gt; = [\n            &lt;span class=\"hljs-string\"&gt;\"write\"&lt;/span&gt;;\n            &lt;span class=\"hljs-string\"&gt;\"administer\"&lt;/span&gt;;\n            &lt;span class=\"hljs-string\"&gt;\"remove\"&lt;/span&gt;;\n            &lt;span class=\"hljs-string\"&gt;\"mount\"&lt;/span&gt;;\n        ];\n        &lt;span class=\"hljs-string\"&gt;\"inheritance_mode\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"object_and_descendants\"&lt;/span&gt;;\n    };\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"219\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-219\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-219\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-219.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Changing a node's ACL&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;small&gt;Listing 9 — Changing a node's ACL&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/my_user/@acl &lt;span class=\"hljs-string\"&gt;'[{subjects=[my_group];permissions=[read;write;remove;];action=allow}]'&lt;/span&gt;\n$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/my_user/@inherit_acl &lt;span class=\"hljs-string\"&gt;'%false'&lt;/span&gt;\n$ yt get //home/my_user/@effective_acl\n[\n    {\n        &lt;span class=\"hljs-string\"&gt;\"action\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"allow\"&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"subjects\"&lt;/span&gt; = [\n            &lt;span class=\"hljs-string\"&gt;\"my_group\"&lt;/span&gt;;\n        ];\n        &lt;span class=\"hljs-string\"&gt;\"permissions\"&lt;/span&gt; = [\n            &lt;span class=\"hljs-string\"&gt;\"read\"&lt;/span&gt;;\n            &lt;span class=\"hljs-string\"&gt;\"write\"&lt;/span&gt;;\n            &lt;span class=\"hljs-string\"&gt;\"remove\"&lt;/span&gt;;\n        ];\n        &lt;span class=\"hljs-string\"&gt;\"inheritance_mode\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"object_and_descendants\"&lt;/span&gt;;\n    };\n]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"230\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-230\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-230\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-230.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"recommendations-for-access-management\"&gt;&lt;a href=\"en/admin-guide/cluster-operations.html#recommendations-for-access-management\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Recommendations for access management&lt;/span&gt;&lt;/a&gt;Recommendations for access management&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Use groups and grant permissions exclusively to them so you can grant/take away access scope from users by adding them to or excluding them from a group.&lt;/li&gt;\n&lt;li&gt;Grant permissions to large project directories rather than specific tables since tables can be recreated (access is then lost) or moved (the &lt;code&gt;effective_acl&lt;/code&gt; turns out to be different because of the new Cypress location, which means access might be inherited where it shouldn't be).&lt;/li&gt;\n&lt;li&gt;The &lt;code&gt;deny&lt;/code&gt; permission should be reserved for exceptional cases when you need to quickly revoke permissions of a specific user. A better way to differentiate permissions is to mindfully manage group composition and use &lt;code&gt;inherit_acl=%false&lt;/code&gt; to prevent overly broad inheritance of parent node permissions.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"managing-cluster-nodes\"&gt;&lt;a href=\"en/admin-guide/cluster-operations.html#managing-cluster-nodes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Managing cluster nodes&lt;/span&gt;&lt;/a&gt;Managing cluster nodes&lt;/h3&gt;\n&lt;p&gt;Significant part of cluster management is nodes operations such as commission and decomimssion of nodes, handling various issues on a specific node.&lt;/p&gt;\n&lt;p&gt;Common information about cluster nodes is available in the UI. However, it's worth to know how nodes are represented in Cypress and what attributes they have.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;How to get the list of nodes in a cluster&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;small&gt;Listing 1 — Viewing the list of nodes&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //sys/cluster_nodes\n{\n    &lt;span class=\"hljs-string\"&gt;\"localhost:17359\"&lt;/span&gt; = &lt;span class=\"hljs-comment\"&gt;#;&lt;/span&gt;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"270\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-270\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-270\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-270.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Node attributes are shown in table 1:&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Table 1 — Node attributes&lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Attribute&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;state&lt;/td&gt;\n&lt;td&gt;ENodeState&lt;/td&gt;\n&lt;td&gt;The node state from the master point of view&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;flavors&lt;/td&gt;\n&lt;td&gt;list&lt;/td&gt;\n&lt;td&gt;List of node flavors&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;resource_limits&lt;/td&gt;\n&lt;td&gt;ClusterResources&lt;/td&gt;\n&lt;td&gt;Available computational resources on this node&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;resource_usage&lt;/td&gt;\n&lt;td&gt;ClusterResources&lt;/td&gt;\n&lt;td&gt;Used computation resources on this node&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;alerts&lt;/td&gt;\n&lt;td&gt;list&lt;/td&gt;\n&lt;td&gt;List of alerts on this node&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;version&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;The version of YTsaurus, the binary file running on this node&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;job_proxy_build_version&lt;/td&gt;\n&lt;td&gt;string&lt;/td&gt;\n&lt;td&gt;The version of the binary &lt;code&gt;ytserver-job-proxy&lt;/code&gt; file used by the exe node&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tags&lt;/td&gt;\n&lt;td&gt;list&lt;/td&gt;\n&lt;td&gt;List of &lt;a href=\"admin-guide/node-tags.html\"&gt;tags&lt;/a&gt; for this node&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;last_seen_time&lt;/td&gt;\n&lt;td&gt;DateTime&lt;/td&gt;\n&lt;td&gt;The time the node last accessed the master&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;registered_time&lt;/td&gt;\n&lt;td&gt;DateTime&lt;/td&gt;\n&lt;td&gt;The time the node was registered on the master&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Listed attributes are informational, which means they're based on the cluster configuration and current cluster state.&lt;/p&gt;\n&lt;p&gt;There are also management attributes that support updating their values with &lt;code&gt;set&lt;/code&gt; calls. This way, you can update node properties or request some activity for the cluster node.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Table 2 — Node management attributes&lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Attribute&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;resource_limits_overrides&lt;/td&gt;\n&lt;td&gt;ClusterResources&lt;/td&gt;\n&lt;td&gt;Override current node resources (doesn't work for &lt;code&gt;user_slots&lt;/code&gt;)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;user_tags&lt;/td&gt;\n&lt;td&gt;list&lt;/td&gt;\n&lt;td&gt;List of additional node &lt;a href=\"admin-guide/node-tags.html\"&gt;tags&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;banned&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Setting the &lt;code&gt;%true&lt;/code&gt; value bans this node&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;decommissioned&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Setting the &lt;code&gt;%true&lt;/code&gt; initiates the transfer of chunks from this node to others in the cluster&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;disable_write_sessions&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Setting the &lt;code&gt;%true&lt;/code&gt; value stop creating new write session on this node&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;disable_scheduler_jobs&lt;/td&gt;\n&lt;td&gt;bool&lt;/td&gt;\n&lt;td&gt;Setting the &lt;code&gt;%true&lt;/code&gt; value stop new jobs from being scheduled and within some timeout interrupts existing jobs on the node&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Nodes that operate correctly and are connected to a cluster have the &lt;code&gt;online&lt;/code&gt; state. The &lt;code&gt;offline&lt;/code&gt; state means that the node is either turned off or server is unavailable. There are several intermediate states that a node can be in while being registered on the master.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Viewing node attributes&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;small&gt;Listing 2 — Viewing node attributes&lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //sys/cluster_nodes/localhost:17359/@\n{\n    &lt;span class=\"hljs-string\"&gt;\"state\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"online\"&lt;/span&gt;;\n    ...\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"509\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-509\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-509\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-509.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h3 id=\"ytdyncfgen\"&gt;&lt;a href=\"en/admin-guide/cluster-operations.html#ytdyncfgen\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dynamic configs&lt;/span&gt;&lt;/a&gt;Dynamic configs&lt;/h3&gt;\n&lt;p&gt;Most cluster components support dynamic config management through Cypress. The general concept is that config patch can be specified as a document at the special path in Cypress. Cluster components periodically read this path in Cypress and apply new config patches.&lt;/p&gt;\n&lt;p&gt;Importantly, not all options support a dynamic modification. It is often difficult or impossible to implement the logic, but usually it is not implemented with no specific reason.&lt;/p&gt;\n&lt;h4 id=\"dynamic-config-of-cluster-nodes\"&gt;&lt;a href=\"en/admin-guide/cluster-operations.html#dynamic-config-of-cluster-nodes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dynamic config of cluster nodes&lt;/span&gt;&lt;/a&gt;Dynamic config of cluster nodes&lt;/h4&gt;\n&lt;p&gt;This config is managed through the &lt;code&gt;//sys/cluster_nodes/@config&lt;/code&gt; node. This node represented as dictionary with keys corresponding to the node filters, and values corresponding to the dynamic configs that needs to be applied to the nodes matching this filter. Make sure that the filters in the dictionary don't overlap: each cluster node must match no more than one filter from the dictionary.&lt;/p&gt;\n&lt;h4 id=\"dynamic-config-of-the-scheduler-and-controller-agents\"&gt;&lt;a href=\"en/admin-guide/cluster-operations.html#dynamic-config-of-the-scheduler-and-controller-agents\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dynamic config of the scheduler and controller agents&lt;/span&gt;&lt;/a&gt;Dynamic config of the scheduler and controller agents&lt;/h4&gt;\n&lt;p&gt;The scheduler config is managed through the &lt;code&gt;//sys/scheduler/config&lt;/code&gt; node. This node represents a document object with a scheduler config patch. The patch refers directly to the scheduling subsystem (the &lt;code&gt;scheduler&lt;/code&gt; section from the static config of this component).&lt;/p&gt;\n&lt;p&gt;Controller agents are configured similarly but the config is managed via the &lt;code&gt;//sys/controller_agents/config&lt;/code&gt; node and contains a patch to the subsystem for managing operation controllers (the &lt;code&gt;controller_agent&lt;/code&gt; section from the static config for controller agents).&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Examples of how to manage scheduler and controller agent configs&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;small&gt; Listing 1 — Increasing the maximum file size allowed in job sandboxes &lt;/small&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# See the current value of this option&lt;/span&gt;\n$ yt get //sys/controller_agents/instances/&amp;lt;controller_agent&amp;gt;/orchid/controller_agent/config/user_file_limits/max_size\n10737418240\n\n&lt;span class=\"hljs-comment\"&gt;# Creating a config node if there isn't one already&lt;/span&gt;\n$ yt create document //sys/controller_agents/config --attributes &lt;span class=\"hljs-string\"&gt;'{value={}}'&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Setting a new value&lt;/span&gt;\n$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/controller_agents/config/user_file_limits &lt;span class=\"hljs-string\"&gt;'{max_size=53687091200}'&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Making sure the controller agent picked up the new value&lt;/span&gt;\n$ yt get //sys/controller_agents/instances/&amp;lt;controller_agent&amp;gt;/orchid/controller_agent/config/user_file_limits/max_size\n53687091200\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"544\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-544\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-544\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-544.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/admin-guide/cluster-operations.md","sourcePath":"en/admin-guide/cluster-operations.md"},"headings":[{"title":"Cluster operations","href":"en/admin-guide/cluster-operations.html#main","level":2,"items":[{"title":"Managing data storage quotas","href":"en/admin-guide/cluster-operations.html#managing-data-storage-quotas","level":3},{"title":"Managing computational quotas","href":"en/admin-guide/cluster-operations.html#managing-computational-quotas","level":3},{"title":"Managing users, groups and access controls","href":"en/admin-guide/cluster-operations.html#managing-users,-groups-and-access-controls","level":3,"items":[{"title":"Recommendations for access management","href":"en/admin-guide/cluster-operations.html#recommendations-for-access-management","level":4}]},{"title":"Managing cluster nodes","href":"en/admin-guide/cluster-operations.html#managing-cluster-nodes","level":3},{"title":"Dynamic configs","href":"en/admin-guide/cluster-operations.html#ytdyncfgen","level":3,"items":[{"title":"Dynamic config of cluster nodes","href":"en/admin-guide/cluster-operations.html#dynamic-config-of-cluster-nodes","level":4},{"title":"Dynamic config of the scheduler and controller agents","href":"en/admin-guide/cluster-operations.html#dynamic-config-of-the-scheduler-and-controller-agents","level":4}]}]}],"title":""},"router":{"pathname":"en/admin-guide/cluster-operations","depth":3,"base":"../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
