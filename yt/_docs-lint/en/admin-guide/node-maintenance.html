        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"node-administration\"&gt;&lt;a href=\"en/admin-guide/node-maintenance.html#node-administration\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Node administration&lt;/span&gt;&lt;/a&gt;Node administration&lt;/h2&gt;\n&lt;p&gt;This section describes some of the features available for administering cluster nodes.&lt;/p&gt;\n&lt;h3 id=\"pending-restart\"&gt;&lt;a href=\"en/admin-guide/node-maintenance.html#pending-restart\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Pending restart&lt;/span&gt;&lt;/a&gt;Pending restart&lt;/h3&gt;\n&lt;p&gt;The primary use case for this flag is to optimize master replication operations during maintenance of cluster data nodes, where the nods are assumed to be down for a short time. Before initiating such maintenance, we recommend running the following command:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt add-maintenance --component=&lt;span class=\"hljs-string\"&gt;\"cluster_node\"&lt;/span&gt; --&lt;span class=\"hljs-built_in\"&gt;type&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"pending_restart\"&lt;/span&gt; --address=&lt;span class=\"hljs-string\"&gt;\"my-node.yandex.net\"&lt;/span&gt;  --comment=&lt;span class=\"hljs-string\"&gt;\"my comment\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"12\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-12\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-12\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-12.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;To make sure that the &lt;em&gt;restart pending&lt;/em&gt; flag is set for the node, use the following command&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //sys/cluster_nodes/my-node.yandex.net/@pending_restart\n&amp;gt; &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"16\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-16\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-16\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-16.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"how-it-works\"&gt;&lt;a href=\"en/admin-guide/node-maintenance.html#how-it-works\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How it works&lt;/span&gt;&lt;/a&gt;How it works&lt;/h4&gt;\n&lt;p&gt;Setting the &lt;em&gt;restart pending&lt;/em&gt; flag for a node object significantly extends its &lt;em&gt;lease&lt;/em&gt; transaction timeout. This means that the node is still considered &lt;em&gt;online&lt;/em&gt; for an extended period even after it stops making periodic requests to the master server to confirm its availability. You can adjust the duration of this interval in the dynamic config of the master server at &lt;code&gt;//sys/@config/node_tracker/pending_restart_lease_timeout&lt;/code&gt; (the default value is 10 minutes).&lt;/p&gt;\n&lt;p&gt;Optimization of the master chunk replicator is achieved through special handling of replicas that are located on nodes with this flag. We'll refer to these nodes as &lt;em&gt;temporarily unavailable&lt;/em&gt; replicas. Replicas located on regular nodes will be called &lt;em&gt;available&lt;/em&gt; replicas.&lt;/p&gt;\n&lt;p&gt;For instance, a chunk in a regular format is considered &lt;em&gt;underreplicated&lt;/em&gt; if at least one of the following conditions is met:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The total number of &lt;em&gt;available&lt;/em&gt; + &lt;em&gt;temporarily unavailable&lt;/em&gt; replicas is less than the &lt;em&gt;replication factor&lt;/em&gt;.&lt;/li&gt;\n&lt;li&gt;The number of &lt;em&gt;available&lt;/em&gt; replicas is less than 1 + &lt;em&gt;max replicas per rack&lt;/em&gt;.&lt;/li&gt;\n&lt;li&gt;There are more than one &lt;em&gt;temporarily unavailable&lt;/em&gt; replicas.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;In turn, &lt;em&gt;erasure&lt;/em&gt; chunks are considered &lt;em&gt;parity missing&lt;/em&gt; or &lt;em&gt;data missing&lt;/em&gt; if:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;One of the replicas is unavailable, and it isn't &lt;em&gt;temporarily unavailable&lt;/em&gt;.&lt;/li&gt;\n&lt;li&gt;The difference between the minimum number of replicas required for the chunk to be repairable and the number of &lt;em&gt;temporarily unavailable&lt;/em&gt; replicas is less than &lt;em&gt;max erasure replicas per rack&lt;/em&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;In a typical cluster configuration with &lt;em&gt;replication factor = 3&lt;/em&gt; and &lt;em&gt;max replicas per rack = 1&lt;/em&gt;, a practical application of &lt;em&gt;pending restart&lt;/em&gt; assumes that simultaneous maintenance will be limited to nodes within a single rack.&lt;/p&gt;\n&lt;h4 id=\"removing-the-flag\"&gt;&lt;a href=\"en/admin-guide/node-maintenance.html#removing-the-flag\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Removing the flag&lt;/span&gt;&lt;/a&gt;Removing the flag&lt;/h4&gt;\n&lt;p&gt;The &lt;em&gt;pending restart&lt;/em&gt; flag is removed after the node restarts, specifically when it's re-registered at the master. You can also remove the flag explicitly:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt remove-maintenance --component=&lt;span class=\"hljs-string\"&gt;\"cluster_node\"&lt;/span&gt; --address=&lt;span class=\"hljs-string\"&gt;\"my-node.yandex.net\"&lt;/span&gt; --&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"&amp;lt;maintenance-id&amp;gt;\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"70\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-70\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-70\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-70.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Prolonged use of this flag can be dangerous, so its validity is intentionally limited by a configurable interval, the previously mentioned &lt;code&gt;pending_restart_lease_timeout&lt;/code&gt;, after which the flag is removed automatically. The deadline is calculated from the last time the flag was set.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/admin-guide/node-maintenance.md","sourcePath":"en/admin-guide/node-maintenance.md"},"headings":[{"title":"Node administration","href":"en/admin-guide/node-maintenance.html#node-administration","level":2,"items":[{"title":"Pending restart","href":"en/admin-guide/node-maintenance.html#pending-restart","level":3,"items":[{"title":"How it works","href":"en/admin-guide/node-maintenance.html#how-it-works","level":4},{"title":"Removing the flag","href":"en/admin-guide/node-maintenance.html#removing-the-flag","level":4}]}]}],"title":""},"router":{"pathname":"en/admin-guide/node-maintenance","depth":3,"base":"../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
