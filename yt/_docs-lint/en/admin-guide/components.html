        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This section describes the main components that make up the YTsaurus cluster.&lt;/p&gt;\n&lt;h2 id=\"master\"&gt;&lt;a href=\"en/admin-guide/components.html#master\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Master&lt;/span&gt;&lt;/a&gt;Master&lt;/h2&gt;\n&lt;p&gt;Masters are one of the key cluster components. YTsaurus masters are responsible for fault-tolerant storage of cluster metadata. This includes information about system users, stored objects, and the location of the data itself. The masters implement a file system called Cypress.&lt;/p&gt;\n&lt;p&gt;To ensure fault tolerance, a YTsaurus cluster needs to have several masters. All masters share the same state, which is enabled by &lt;code&gt;Hydra&lt;/code&gt;, a consensus algorithm similar to the &lt;a href=\"https://raft.github.io/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Raft&lt;/a&gt; protocol. With &lt;code&gt;Hydra&lt;/code&gt;, the cluster remains operational as long as more than half of its masters are available. For instance, if a cluster has three masters, it will continue to function as long as any two of them are available. The number of masters should be odd. For production installations, we recommend using three or five masters.&lt;/p&gt;\n&lt;p&gt;YTsaurus masters are stateful components of the cluster, because they store changelogs and snapshots of the cluster state on the disk. For optimal master performance, we recommend using a storage medium that's good at handling a large stream of small records, such as NVMe SSD.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/yt_cluster_components.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;h2 id=\"data-nodes\"&gt;&lt;a href=\"en/admin-guide/components.html#data-nodes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data Nodes&lt;/span&gt;&lt;/a&gt;Data Nodes&lt;/h2&gt;\n&lt;p&gt;While YTsaurus masters are responsible for storing cluster metadata, the actual cluster data is stored on &lt;code&gt;Data Nodes&lt;/code&gt;. Files and tables saved in YTsaurus are split into smaller segments known as &lt;a href=\"user-guide/storage/chunks.html\"&gt;chunks&lt;/a&gt;. &lt;code&gt;Data Nodes&lt;/code&gt; store chunks in the disk file system, while masters hold information about which chunks make up specific tables and files as well as which &lt;code&gt;Data Nodes&lt;/code&gt; they are stored on.&lt;/p&gt;\n&lt;p&gt;Like YTsaurus masters, &lt;code&gt;Data Nodes&lt;/code&gt; are stateful components, since they store chunks on disks. However, unlike masters, chunks are typically read and written at coarse scale, which means that both HDDs and SSDs can be used for their storage, depending on the system load. YTsaurus supports a variety of disk types and allows grouping them into &lt;a href=\"user-guide/storage/media.html\"&gt;media&lt;/a&gt; sets to store data on different types of storage devices.&lt;/p&gt;\n&lt;h2 id=\"scheduler\"&gt;&lt;a href=\"en/admin-guide/components.html#scheduler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Scheduler&lt;/span&gt;&lt;/a&gt;Scheduler&lt;/h2&gt;\n&lt;p&gt;Cluster computing is enabled by a scheduling subsystem comprising a scheduler and agent controllers. The computations themselves are carried out on &lt;code&gt;Exec Nodes&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;A sharded scheduler is used in YTsaurus, so it consists of two components: the scheduler itself and the agent controllers.&lt;/p&gt;\n&lt;p&gt;The scheduler is responsible for fair distribution of resources among cluster users through the HDRF algorithm, which itself is a generalization of the &lt;a href=\"https://en.wikipedia.org/wiki/Fair-share_scheduling\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;fair-share&lt;/a&gt; algorithm. The scheduler communicates with &lt;code&gt;Exec Nodes&lt;/code&gt;, initiating new jobs and receiving information on their completion.&lt;/p&gt;\n&lt;p&gt;At any given moment, the cluster has only one active scheduler, which is responsible for allocating resources and initiating jobs. To ensure fault tolerance, we recommend running multiple schedulers within the same cluster. In this case, only one scheduler is active, with the rest being on standby in case it fails. The scheduler is a stateless component, because part of its state (like the list of all active jobs) is transient. The persistent part, such as the descriptions of currently running operations, is stored on masters in Cypress.&lt;/p&gt;\n&lt;p&gt;Agent controllers represent the second element of the scheduling subsystem. They are responsible for the logic behind the execution of operations. If we take the Map operation, agent controllers determine which chunks to process, how to divide the input data into jobs, which resources are needed to initiate these jobs, and how to merge job results into output tables. Meanwhile, the scheduler determines the amount of jobs that can be initiated simultaneously and the &lt;code&gt;Exec Nodes&lt;/code&gt; they can be executed on given the user's computing quotas. Like schedulers, agent controllers are stateless components, though they store part of their state in Cypress.&lt;/p&gt;\n&lt;h2 id=\"exec-nodes\"&gt;&lt;a href=\"en/admin-guide/components.html#exec-nodes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Exec Nodes&lt;/span&gt;&lt;/a&gt;Exec Nodes&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;Exec Nodes&lt;/code&gt; are directly involved in executing jobs on the cluster's computing resources. They send heartbeats to the scheduler, informing it about the initiated/completed jobs and the available resources.`` In response, &lt;code&gt;Exec Nodes&lt;/code&gt; receive requests from the scheduler to initiate new jobs. &lt;code&gt;Exec Nodes&lt;/code&gt; are responsible for preparing the job environment, launching containers to isolate processes, managing the lifecycle of user processes, and much more.&lt;/p&gt;\n&lt;p&gt;To function, &lt;code&gt;Exec Nodes&lt;/code&gt; require access to the disk. First, this is necessary to create directories for initiating user processes and loading files that the user specified in the operation. Second, the disk contains a &lt;code&gt;Chunk Cache&lt;/code&gt; and &lt;code&gt;Image Cache&lt;/code&gt; - caches for artifacts and container images. Caches store the files that were loaded to a job for reuse in different jobs as part of one or multiple operations. Such disks don't have to be reliable: unlike masters or &lt;code&gt;Data Nodes&lt;/code&gt;, an &lt;code&gt;Exec Node&lt;/code&gt; losing its state results in a loss of progress only for the jobs that were executed on that node.&lt;/p&gt;\n&lt;h2 id=\"tablet-nodes\"&gt;&lt;a href=\"en/admin-guide/components.html#tablet-nodes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tablet Nodes&lt;/span&gt;&lt;/a&gt;Tablet Nodes&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;Tablet Nodes&lt;/code&gt; are responsible for the operation of dynamic tables. Each dynamic table is divided into a set of tablets managed by tablet cells that run in a &lt;code&gt;Tablet Node&lt;/code&gt;. Despite the fact that dynamic tables have a fairly complex persistent state, &lt;code&gt;Tablet Nodes&lt;/code&gt; are stateless components. All necessary data is stored on &lt;code&gt;Data Nodes&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"yql-agent\"&gt;&lt;a href=\"en/admin-guide/components.html#yql-agent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YQL Agent&lt;/span&gt;&lt;/a&gt;YQL Agent&lt;/h2&gt;\n&lt;p&gt;YQL agent instances orchestrate the execution of YQL queries, converting them into a chain of map/reduce operations.&lt;/p&gt;\n&lt;h2 id=\"proxy\"&gt;&lt;a href=\"en/admin-guide/components.html#proxy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Proxy&lt;/span&gt;&lt;/a&gt;Proxy&lt;/h2&gt;\n&lt;p&gt;The entry point to a cluster is a proxy. All user queries submitted to the cluster pass through the proxy before reaching the appropriate subsystems. YTsaurus features two types of proxies: HTTP and RPC. Proxies are stateless components.&lt;/p&gt;\n&lt;p&gt;HTTP proxies accept commands as HTTP requests, which makes it easy to submit requests to YTsaurus in any programming language.&lt;/p&gt;\n&lt;p&gt;RPC proxies use the YTsaurus internal protocol, which makes working with them more complex but speeds up query processing. Using an RPC proxy is recommended for latency-critical commands with a high execution frequency, such as queries to dynamic tables.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/admin-guide/components.md","sourcePath":"en/admin-guide/components.md"},"headings":[{"title":"Master","href":"en/admin-guide/components.html#master","level":2},{"title":"Data Nodes","href":"en/admin-guide/components.html#data-nodes","level":2},{"title":"Scheduler","href":"en/admin-guide/components.html#scheduler","level":2},{"title":"Exec Nodes","href":"en/admin-guide/components.html#exec-nodes","level":2},{"title":"Tablet Nodes","href":"en/admin-guide/components.html#tablet-nodes","level":2},{"title":"YQL Agent","href":"en/admin-guide/components.html#yql-agent","level":2},{"title":"Proxy","href":"en/admin-guide/components.html#proxy","level":2}],"title":"YTsaurus сluster components"},"router":{"pathname":"en/admin-guide/components","depth":3,"base":"../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
