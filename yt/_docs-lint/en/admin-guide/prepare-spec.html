            {"data":{"leading":false,"html":"&lt;p&gt;You can find an example of the minimum specification &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/blob/main/config/samples/cluster_v1_demo.yaml\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;here&lt;/a&gt;.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sample specification&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;apiVersion:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;cluster.ytsaurus.tech/v1&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;kind:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Ytsaurus&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ytdemo&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;coreImage:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ghcr.io/ytsaurus/ytsaurus:stable-24.1.0-relwithdebinfo&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;uiImage:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ghcr.io/ytsaurus/ui:stable&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;adminCredentials:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ytadminsec&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;discovery:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;primaryMasters:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;cellTag:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;volumeMounts:&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;master-data&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;mountPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/master-data&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;locations:&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;locationType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;MasterChangelogs&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/master-data/master-changelogs&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;locationType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;MasterSnapshots&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/master-data/master-snapshots&lt;/span&gt;\n\n    &lt;span class=\"hljs-attr\"&gt;volumeClaimTemplates:&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;master-data&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;accessModes:&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"ReadWriteOnce\"&lt;/span&gt; ]\n          &lt;span class=\"hljs-attr\"&gt;resources:&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;requests:&lt;/span&gt;\n              &lt;span class=\"hljs-attr\"&gt;storage:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;20Gi&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;httpProxies:&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;serviceType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;NodePort&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;rpcProxies:&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;serviceType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;LoadBalancer&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;dataNodes:&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;volumeMounts:&lt;/span&gt;\n        &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;node-data&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;mountPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/node-data&lt;/span&gt;\n\n      &lt;span class=\"hljs-attr\"&gt;locations:&lt;/span&gt;\n        &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;locationType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ChunkStore&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/node-data/chunk-store&lt;/span&gt;\n\n      &lt;span class=\"hljs-attr\"&gt;volumeClaimTemplates:&lt;/span&gt;\n        &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;node-data&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;accessModes:&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"ReadWriteOnce\"&lt;/span&gt; ]\n            &lt;span class=\"hljs-attr\"&gt;resources:&lt;/span&gt;\n              &lt;span class=\"hljs-attr\"&gt;requests:&lt;/span&gt;\n                &lt;span class=\"hljs-attr\"&gt;storage:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;50Gi&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;execNodes:&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;resources:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;limits:&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;cpu:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;memory:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;5Gi&lt;/span&gt;\n\n      &lt;span class=\"hljs-attr\"&gt;volumeMounts:&lt;/span&gt;\n        &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;node-data&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;mountPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/node-data&lt;/span&gt;\n\n      &lt;span class=\"hljs-attr\"&gt;volumes:&lt;/span&gt;\n        &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;node-data&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;emptyDir:&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;sizeLimit:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;40Gi&lt;/span&gt;\n\n      &lt;span class=\"hljs-attr\"&gt;locations:&lt;/span&gt;\n        &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;locationType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ChunkCache&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/node-data/chunk-cache&lt;/span&gt;\n        &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;locationType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Slots&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/node-data/slots&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;tabletNodes:&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;queryTrackers:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;yqlAgents:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;schedulers:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;controllerAgents:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n\n  &lt;span class=\"hljs-attr\"&gt;ui:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;serviceType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;NodePort&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;instanceCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"8\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-8\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-8\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-8.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Table 1 shows some general &lt;code&gt;Ytsaurus&lt;/code&gt; settings. Full description: &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/blob/main/docs/api.md#ytsaurusspec\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YtsaurusSpec&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Table 1 — Basic &lt;code&gt;Ytsaurus&lt;/code&gt; specification fields &lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Field&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Type&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Description&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;coreImage&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Image for the main server components (for example, &lt;code&gt;ghcr.io/ytsaurus/ytsaurus:stable-24.1.0-relwithdebinfo&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;uiImage&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Image for the UI (for example, &lt;code&gt;ghcr.io/ytsaurus/ui:stable&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;imagePullSecrets&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;LocalObjectReference&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Secrets needed to pull images from a private registry. Learn more &lt;a href=\"https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;here&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;configOverrides&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;optional&amp;lt;LocalObjectReference&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A ConfigMap for overriding generated static configs. It should only be used in rare cases.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;adminCredentials&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;optional&amp;lt;LocalObjectReference&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A secret with the login/password for the admin account.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;isManaged&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A flag that lets you disable all operator actions on this cluster in order to manually work with the cluster where needed.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;enableFullUpdate&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A flag that lets you prohibit the launch of a full cluster update.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;useIpv6&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Use IPv6 or IPv4&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;bootstrap&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;BootstrapSpec&lt;/td&gt;\n&lt;td&gt;Settings for initially deploying the cluster (for example, &lt;a href=\"user-guide/dynamic-tables/concepts#tablet_cell_bundles\"&gt;tablet cell bundle parameters&lt;/a&gt;)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"selecting-a-set-of-components\"&gt;&lt;a href=\"en/admin-guide/prepare-spec.html#selecting-a-set-of-components\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Selecting a set of components&lt;/span&gt;&lt;/a&gt;Selecting a set of components&lt;/h2&gt;\n&lt;p&gt;Clusters can be created with different sets of components. Let's take a brief look at the components that can be configured in the &lt;code&gt;Ytsaurus&lt;/code&gt; specification.&lt;/p&gt;\n&lt;p&gt;You can read more about components in &lt;a href=\"admin-guide/components.html\"&gt;this section&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;At a minimum, the cluster must have masters and discovery services configured in the &lt;code&gt;primaryMasters&lt;/code&gt; and &lt;code&gt;discovery&lt;/code&gt; fields, respectively.&lt;/p&gt;\n&lt;p&gt;Schedulers and controller agents are required to start operations, and they are configured respectively in the &lt;code&gt;schedulers&lt;/code&gt; and &lt;code&gt;controllerAgents&lt;/code&gt; fields.&lt;/p&gt;\n&lt;p&gt;To make requests to the cluster from the &lt;code&gt;CLI&lt;/code&gt; and &lt;code&gt;SDKs&lt;/code&gt;, you need proxies. There are two types of proxies: &lt;code&gt;HTTP&lt;/code&gt; and &lt;code&gt;RPC&lt;/code&gt;. They are configured in the &lt;code&gt;httpProxies&lt;/code&gt; and &lt;code&gt;rpcProxies&lt;/code&gt; fields, respectively.&lt;/p&gt;\n&lt;p&gt;For a convenient UI you can use to work with a cluster, you need to configure it in the &lt;code&gt;ui&lt;/code&gt; field.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;dataNodes&lt;/code&gt; are used to store data, while &lt;code&gt;execNodes&lt;/code&gt; launch operation jobs.&lt;/p&gt;\n&lt;p&gt;If you plan to query data using an SQL-like &lt;a href=\"yql\"&gt;query language&lt;/a&gt;, add &lt;code&gt;queryTrackers&lt;/code&gt; and &lt;code&gt;yqlAgents&lt;/code&gt; to the specification.&lt;/p&gt;\n&lt;p&gt;To use &lt;a href=\"user-guide/data-processing/chyt/about-chyt\"&gt;CHYT&lt;/a&gt;, you need to run a special controller. It can be configured in the &lt;code&gt;strawberry&lt;/code&gt; field.&lt;/p&gt;\n&lt;p&gt;For dynamic tables to work (they're needed for system tables of components like query tracker), &lt;code&gt;tabletNodes&lt;/code&gt; needs to be raised.&lt;/p&gt;\n&lt;h2 id=\"docker-image\"&gt;&lt;a href=\"en/admin-guide/prepare-spec.html#docker-image\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Docker image&lt;/span&gt;&lt;/a&gt;Docker image&lt;/h2&gt;\n&lt;p&gt;At the first step, select the main Docker image for the server components.&lt;/p&gt;\n&lt;p&gt;Most of the server components are released from a separate (release) branch. Currently, the latest stable branch is &lt;code&gt;stable/24.1&lt;/code&gt;. We strongly recommend using an image compiled from a stable release branch.&lt;/p&gt;\n&lt;p&gt;The names of Docker images built from the release branch follow the format &lt;code&gt;ghcr.io/ytsaurus/ytsaurus:stable-24.1.N&lt;/code&gt; or &lt;code&gt;ghcr.io/ytsaurus/ytsaurus:stable-24.1.N-relwithdebinfo&lt;/code&gt;. The difference between the images is that all the binary files in the second one are built with debug symbols.&lt;/p&gt;\n&lt;p&gt;If the server components crash, the stack trace is printed to the stderr components, and a &lt;code&gt;coredump&lt;/code&gt; is retrieved from the K8s node (if this is configured in your K8s cluster). This provides detailed information on what exactly happened to the component. With that in mind, we recommend using &lt;code&gt;relwithdebinfo&lt;/code&gt; images even though they take up more space. Without debug symbols, the YTsaurus team probably won't be able to help you if you encounter any problems.&lt;/p&gt;\n&lt;p&gt;The image provided has everything you need for almost every component. For components not included in the main Docker image, we push separate images. Table 2 shows the recommended image for each component.&lt;/p&gt;\n&lt;p&gt;The &lt;code&gt;image&lt;/code&gt; for each component is taken primarily from the component's image field. If an image isn't listed, &lt;code&gt;coreImage&lt;/code&gt; is taken from the top level of the specification.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Table 2 — Component images &lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Field&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Docker repository&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Recommended stable release tag&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;discovery&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/pkgs/container/ytsaurus\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/ytsaurus&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;stable-24.1.0-relwithdebinfo&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;primaryMasters&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/pkgs/container/ytsaurus\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/ytsaurus&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;stable-24.1.0-relwithdebinfo&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;httpProxies&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/pkgs/container/ytsaurus\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/ytsaurus&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;stable-24.1.0-relwithdebinfo&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;rpcProxies&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/pkgs/container/ytsaurus\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/ytsaurus&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;stable-24.1.0-relwithdebinfo&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;dataNodes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/pkgs/container/ytsaurus\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/ytsaurus&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;stable-24.1.0-relwithdebinfo&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;execNodes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/pkgs/container/ytsaurus\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/ytsaurus&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;stable-24.1.0-relwithdebinfo&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;tabletNodes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/pkgs/container/ytsaurus\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/ytsaurus&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;stable-24.1.0-relwithdebinfo&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;schedulers&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/pkgs/container/ytsaurus\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/ytsaurus&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;stable-24.1.0-relwithdebinfo&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;controllerAgents&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/pkgs/container/ytsaurus\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/ytsaurus&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;stable-24.1.0-relwithdebinfo&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;queryTrackers&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/pkgs/container/query-tracker\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/query-tracker&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0.0.8-relwithdebinfo&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;yqlAgents&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/pkgs/container/query-tracker\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/query-tracker&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0.0.8&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;strawberry&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus/pkgs/container/strawberry\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/strawberry&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0.0.12&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;ui&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus-ui/pkgs/container/ui\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ghcr.io/ytsaurus/ui&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;stable&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;In addition, a common image is provided for all server components at once (except &lt;code&gt;ui&lt;/code&gt;). You only need to specify it once in &lt;code&gt;coreImage&lt;/code&gt;, without explicitly specifying anything in the component's &lt;code&gt;image&lt;/code&gt; field.&lt;/p&gt;\n&lt;h2 id=\"logging\"&gt;&lt;a href=\"en/admin-guide/prepare-spec.html#logging\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Logging&lt;/span&gt;&lt;/a&gt;Logging&lt;/h2&gt;\n&lt;p&gt;A proper logging configuration is essential for diagnosing problems and facilitating support. For recommendations on setting up logging, see &lt;a href=\"admin-guide/logging.html\"&gt;this page&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"locations\"&gt;&lt;a href=\"en/admin-guide/prepare-spec.html#locations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Locations&lt;/span&gt;&lt;/a&gt;Locations&lt;/h2&gt;\n&lt;p&gt;There are recommendations for disk layout and location configuration on a separate &lt;a href=\"admin-guide/locations.html\"&gt;page&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"job-environment\"&gt;&lt;a href=\"en/admin-guide/prepare-spec.html#job-environment\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Operation execution environment&lt;/span&gt;&lt;/a&gt;Operation execution environment&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;Exec nodes&lt;/code&gt; can run jobs in isolated containers to handle the &lt;code&gt;docker_image&lt;/code&gt; operation option. You can find the required settings under &lt;code&gt;jobResources&lt;/code&gt; and &lt;code&gt;jobEnvironment&lt;/code&gt; in &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/blob/main/docs/api.md#execnodesspec\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ExecNodeSpec&lt;/a&gt;. See the sample &lt;a href=\"https://github.com/ytsaurus/yt-k8s-operator/blob/main/config/samples/cluster_v1_cri.yaml\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;cluster configuration&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"setting-up-tablet-cell-bundles\"&gt;&lt;a href=\"en/admin-guide/prepare-spec.html#setting-up-tablet-cell-bundles\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Setting up tablet cell bundles&lt;/span&gt;&lt;/a&gt;Setting up tablet cell bundles&lt;/h2&gt;\n&lt;p&gt;The operator automatically creates multiple &lt;a href=\"user-guide/dynamic-tables/concepts#tablet_cell_bundles\"&gt;tablet cell bundles&lt;/a&gt;: &lt;code&gt;sys&lt;/code&gt; and &lt;code&gt;default&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;For tablet cell bundles, you can set up media for storing logs and snapshots. By default, logs and snapshots are stored in the &lt;code&gt;default&lt;/code&gt; medium.&lt;/p&gt;\n&lt;p&gt;We recommend setting bundles up such that logs and snapshots are stored on the &lt;code&gt;SSD&lt;/code&gt;, otherwise the bundles could become inoperable.&lt;/p&gt;\n&lt;p&gt;For bundles that have already been created, you can set the &lt;code&gt;@options/snapshot_primary_medium&lt;/code&gt; and &lt;code&gt;@options/changelog_primary_medium&lt;/code&gt; attributes:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/tablet_cell_bundles/&amp;lt;bundle-name&amp;gt;/@options/snapshot_primary_medium &lt;span class=\"hljs-string\"&gt;'&amp;lt;medium-name&amp;gt;'&lt;/span&gt;\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //sys/tablet_cell_bundles/&amp;lt;bundle-name&amp;gt;/@options/changelog_primary_medium &lt;span class=\"hljs-string\"&gt;'&amp;lt;medium-name&amp;gt;'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"386\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-386\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-386\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-386.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;When initializing a cluster, the operator can set up media for bundles automatically. To configure a bundle, enter the names of the media in the &lt;code&gt;bootstrap&lt;/code&gt; section at the top level of the specification. In the same section, specify the number of tablet cells in the bundle. You can change the number of tablet cells after initializing the cluster by setting the attribute &lt;code&gt;//sys/tablet_cell_bundles/&amp;lt;bundle-name&amp;gt;/@tablet_cell_count&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Sample &lt;code&gt;bootstrap&lt;/code&gt; sections:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;bootstrap:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;tabletCellBundles:&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;sys:&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;snapshotMedium:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ssd_medium&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;changelogMedium:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ssd_medium&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;tabletCellCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;default:&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;snapshotMedium:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ssd_medium&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;changelogMedium:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ssd_medium&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;tabletCellCount:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;5&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"393\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-393\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-393\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-393.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Once the cluster is deployed, the operator won't process changes in the &lt;code&gt;bootstrap&lt;/code&gt; field. Further configuration must be done manually using the specified attributes.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"en/admin-guide/prepare-spec.md","sourcePath":"en/admin-guide/prepare-spec.md"},"headings":[{"title":"Selecting a set of components","href":"en/admin-guide/prepare-spec.html#selecting-a-set-of-components","level":2},{"title":"Docker image","href":"en/admin-guide/prepare-spec.html#docker-image","level":2},{"title":"Logging","href":"en/admin-guide/prepare-spec.html#logging","level":2},{"title":"Locations","href":"en/admin-guide/prepare-spec.html#locations","level":2},{"title":"Operation execution environment","href":"en/admin-guide/prepare-spec.html#job-environment","level":2},{"title":"Setting up tablet cell bundles","href":"en/admin-guide/prepare-spec.html#setting-up-tablet-cell-bundles","level":2}],"title":"Getting the YTsaurus specification ready"},"router":{"pathname":"en/admin-guide/prepare-spec","depth":3,"base":"../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/en/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-b374e81616f80236d1bb7d0038f65f666195580-en","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
