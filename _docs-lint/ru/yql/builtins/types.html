"visibileAnimation-618.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"varianttypehandle\"&gt;&lt;a href=\"ru/yql/builtins/types.html#varianttypehandle\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;VariantTypeHandle&lt;/span&gt;&lt;/a&gt;VariantTypeHandle&lt;/h3&gt;\n&lt;h4 id=\"signatura42\"&gt;&lt;a href=\"ru/yql/builtins/types.html#signatura42\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сигнатура&lt;/span&gt;&lt;/a&gt;Сигнатура&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;VariantTypeHandle(StructTypeHandle)-&amp;gt;хэндл типа варианта над структурой\nVariantTypeHandle(TupleTypeHandle)-&amp;gt;хэндл типа варианта над кортежем\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"625\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-625\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-625\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-625.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Построение хендла типа варианта по хендлу низлежащего типа, переданного в аргумент. Обратная функция - &lt;a href=\"ru/yql/builtins/types.html#variantunderlyingtype\"&gt;VariantUnderlyingType&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"primery41\"&gt;&lt;a href=\"ru/yql/builtins/types.html#primery41\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT FormatType(VariantTypeHandle(\n    ParseTypeHandle(\"Tuple&amp;lt;Int32, String&amp;gt;\")\n)); -- Variant&amp;lt;Int32, String&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"632\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-632\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-632\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-632.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"voidtypehandle-i-nulltypehandle\"&gt;&lt;a href=\"ru/yql/builtins/types.html#voidtypehandle-i-nulltypehandle\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;VoidTypeHandle и NullTypeHandle&lt;/span&gt;&lt;/a&gt;VoidTypeHandle и NullTypeHandle&lt;/h3&gt;\n&lt;h4 id=\"signatura43\"&gt;&lt;a href=\"ru/yql/builtins/types.html#signatura43\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сигнатура&lt;/span&gt;&lt;/a&gt;Сигнатура&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;VoidTypeHandle()-&amp;gt;хэндл типа Void\nNullTypeHandle()-&amp;gt;хэндл типа Null\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"639\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-639\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-639\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-639.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Построение хендла типов Void и Null соответственно.&lt;/p&gt;\n&lt;h4 id=\"primery42\"&gt;&lt;a href=\"ru/yql/builtins/types.html#primery42\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT FormatType(VoidTypeHandle()); -- Void\nSELECT FormatType(NullTypeHandle()); -- Null\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"646\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-646\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-646\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-646.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"callabletypecomponents\"&gt;&lt;a href=\"ru/yql/builtins/types.html#callabletypecomponents\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CallableTypeComponents&lt;/span&gt;&lt;/a&gt;CallableTypeComponents&lt;/h3&gt;\n&lt;h4 id=\"signatura44\"&gt;&lt;a href=\"ru/yql/builtins/types.html#signatura44\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сигнатура&lt;/span&gt;&lt;/a&gt;Сигнатура&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;CallableTypeComponents(CallableTypeHandle)-&amp;gt;\nStruct&amp;lt;\n    Arguments:List&amp;lt;Struct&amp;lt;\n        Flags:List&amp;lt;String&amp;gt;,\n        Name:String,\n        Type:TypeHandle&amp;gt;&amp;gt;,\n    OptionalArgumentsCount:Uint32,\n    Payload:String,\n    Result:TypeHandle\n&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"653\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-653\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-653\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-653.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Получение описания хендла типа вызываемого значения, переданного в аргумент. Обратная функция - &lt;a href=\"ru/yql/builtins/types.html#callabletypehandle\"&gt;CallableTypeHandle&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"primery43\"&gt;&lt;a href=\"ru/yql/builtins/types.html#primery43\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$formatArgument = ($x) -&amp;gt; {\n    return AsStruct(\n        FormatType($x.Type) as Type,\n        $x.Name as Name,\n        $x.Flags as Flags\n    )\n};\n\n$formatCallable = ($x) -&amp;gt; {\n    return AsStruct(\n        $x.OptionalArgumentsCount as OptionalArgumentsCount,\n        $x.Payload as Payload,\n        FormatType($x.Result) as Result,\n        ListMap($x.Arguments, $formatArgument) as Arguments\n    )\n};\n\nSELECT $formatCallable(\n    CallableTypeComponents(\n        ParseTypeHandle(\"(Int32,[bar:Double?{Flags:AutoMap}])-&amp;gt;String\")\n    )\n);  -- (OptionalArgumentsCount: 1, Payload: \"\", Result: \"String\", Arguments: [\n    --   (Type: \"Int32\", Name: \"\", Flags: []),\n    --   (Type: \"Double?\", Name: \"bar\", Flags: [\"AutoMap\"]),\n    -- ])\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"660\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-660\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-660\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-660.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"callableargument\"&gt;&lt;a href=\"ru/yql/builtins/types.html#callableargument\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CallableArgument&lt;/span&gt;&lt;/a&gt;CallableArgument&lt;/h3&gt;\n&lt;h4 id=\"signatura45\"&gt;&lt;a href=\"ru/yql/builtins/types.html#signatura45\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сигнатура&lt;/span&gt;&lt;/a&gt;Сигнатура&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;CallableArgument(TypeHandle, [String, [List&amp;lt;String&amp;gt;]])-&amp;gt;Struct&amp;lt;Flags:List&amp;lt;String&amp;gt;,Name:String,Type:TypeHandle&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"667\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-667\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-667\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-667.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Упаковка в структуру описания аргумента вызываемого значения для передачи в функцию &lt;a href=\"ru/yql/builtins/types.html#callabletypehandle\"&gt;CallableTypeHandle&lt;/a&gt; по следующим аргументам:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Хендл типа аргумента.&lt;/li&gt;\n&lt;li&gt;Необязательное имя аргумента. Значение по умолчанию - пустая строка.&lt;/li&gt;\n&lt;li&gt;Необязательные флаги аргумента в виде списка строк. Значение по умолчанию - пустой список. Поддерживаемые флаги - \"AutoMap\".&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"callabletypehandle\"&gt;&lt;a href=\"ru/yql/builtins/types.html#callabletypehandle\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CallableTypeHandle&lt;/span&gt;&lt;/a&gt;CallableTypeHandle&lt;/h3&gt;\n&lt;h4 id=\"signatura46\"&gt;&lt;a href=\"ru/yql/builtins/types.html#signatura46\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сигнатура&lt;/span&gt;&lt;/a&gt;Сигнатура&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;CallableTypeHandle(TypeHandle, List&amp;lt;Struct&amp;lt;Flags:List&amp;lt;String&amp;gt;,Name:String,Type:TypeHandle&amp;gt;&amp;gt;, [Uint32, [String]])-&amp;gt;хэндл типа вызываемого значения\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"694\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-694\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-694\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-694.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Построение хендла типа вызываемого значения по следующим аргументам:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Хендл типа возвращаемого значения.&lt;/li&gt;\n&lt;li&gt;Список описаний аргументов, полученных через функцию &lt;a href=\"ru/yql/builtins/types.html#callableargument\"&gt;CallableArgument&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Необязательное количество необязательных аргументов в вызываемом значении. Значение по умолчанию - 0.&lt;/li&gt;\n&lt;li&gt;Необязательная метка для типа вызываемого значения. Значение по умолчанию - пустая строка.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Обратная функция - &l
