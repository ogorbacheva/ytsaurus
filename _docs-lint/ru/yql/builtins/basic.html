y-hidden\" data-no-index=\"true\"&gt;AggregateTransformOutput&lt;/span&gt;&lt;/a&gt;AggregateTransformOutput&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;AggregateTransformOutput()&lt;/code&gt; преобразует фабрику для &lt;a href=\"ru/yql/builtins/aggregation.html\"&gt;агрегационных функций&lt;/a&gt;, например, полученную через функцию &lt;a href=\"ru/yql/builtins/basic.html#aggregationfactory\"&gt;AggregationFactory&lt;/a&gt; в другую фабрику, в которой после окончания выполнения агрегации производится указанное преобразование результата.&lt;/p&gt;\n&lt;p&gt;Аргументы:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Фабрика для агрегационных функций;&lt;/li&gt;\n&lt;li&gt;Лямбда функция с одним аргументом, преобразующая результат.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"primery42\"&gt;&lt;a href=\"ru/yql/builtins/basic.html#primery42\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$f = AggregationFactory(\"sum\");\n$g = AggregateTransformOutput($f, ($x) -&amp;gt; ($x * 2));\nSELECT ListAggregate([1,2,3], $f); -- 6\nSELECT ListAggregate([1,2,3], $g); -- 12\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1719\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1719\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1719\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1719.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"aggregateflatten\"&gt;&lt;a href=\"ru/yql/builtins/basic.html#aggregateflatten\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AggregateFlatten&lt;/span&gt;&lt;/a&gt;AggregateFlatten&lt;/h2&gt;\n&lt;p&gt;Адаптирует фабрику для &lt;a href=\"ru/yql/builtins/aggregation.html\"&gt;агрегационных функций&lt;/a&gt;, например, полученную через функцию &lt;a href=\"ru/yql/builtins/basic.html#aggregationfactory\"&gt;AggregationFactory&lt;/a&gt; так, чтобы выполнять агрегацию над входными элементами - списками. Эта операция похожа на &lt;a href=\"ru/yql/syntax/flatten.html\"&gt;FLATTEN LIST BY&lt;/a&gt; - производится агрегация каждого элемента списка.&lt;/p&gt;\n&lt;p&gt;Аргументы:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Фабрика для агрегационных функций.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"primery43\"&gt;&lt;a href=\"ru/yql/builtins/basic.html#primery43\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$i = AggregationFactory(\"AGGREGATE_LIST_DISTINCT\");\n$j = AggregateFlatten($i);\nSELECT AggregateBy(x, $j) from (\n   SELECT [1,2] as x\n   union all\n   SELECT [2,3] as x\n); -- [1, 2, 3]\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1739\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1739\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1739\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1739.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/builtins/basic.md","sourcePath":"ru/yql/builtins/basic.md"},"headings":[{"title":"COALESCE","href":"ru/yql/builtins/basic.html#coalesce","level":2},{"title":"LENGTH","href":"ru/yql/builtins/basic.html#length","level":2},{"title":"SUBSTRING","href":"ru/yql/builtins/basic.html#substring","level":2},{"title":"FIND","href":"ru/yql/builtins/basic.html#find","level":2},{"title":"RFIND","href":"ru/yql/builtins/basic.html#rfind","level":2},{"title":"StartsWith, EndsWith","href":"ru/yql/builtins/basic.html#starts_ends_with","level":2},{"title":"IF","href":"ru/yql/builtins/basic.html#if","level":2},{"title":"NANVL","href":"ru/yql/builtins/basic.html#nanvl","level":2},{"title":"Random...","href":"ru/yql/builtins/basic.html#random","level":2},{"title":"Udf","href":"ru/yql/builtins/basic.html#udf","level":2},{"title":"CurrentUtc...","href":"ru/yql/builtins/basic.html#current-utc","level":2},{"title":"CurrentTz...","href":"ru/yql/builtins/basic.html#current-tz","level":2},{"title":"AddTimezone","href":"ru/yql/builtins/basic.html#addtimezone","level":2},{"title":"RemoveTimezone","href":"ru/yql/builtins/basic.html#removetimezone","level":2},{"title":"Version","href":"ru/yql/builtins/basic.html#version","level":2},{"title":"CurrentLanguageVersion","href":"ru/yql/builtins/basic.html#current-language-version","level":2},{"title":"MAX_OF, MIN_OF, GREATEST и LEAST","href":"ru/yql/builtins/basic.html#max-min","level":2},{"title":"AsTuple, AsStruct, AsList, AsDict, AsSet, AsListStrict, AsDictStrict и AsSetStrict","href":"ru/yql/builtins/basic.html#as-container","level":2},{"title":"Литералы контейнеров","href":"ru/yql/builtins/basic.html#containerliteral","level":2},{"title":"Variant","href":"ru/yql/builtins/basic.html#variant","level":2},{"title":"AsVariant","href":"ru/yql/builtins/basic.html#asvariant","level":2},{"title":"Visit, VisitOrDefault","href":"ru/yql/builtins/basic.html#visit","level":2},{"title":"VariantItem","href":"ru/yql/builtins/basic.html#variantitem","level":2},{"title":"Way","href":"ru/yql/builtins/basic.html#way","level":2},{"title":"DynamicVariant","href":"ru/yql/builtins/basic.html#dynamic_variant","level":2},{"title":"Enum","href":"ru/yql/builtins/basic.html#enum","level":2},{"title":"AsEnum","href":"ru/yql/builtins/basic.html#asenum","level":2},{"title":"AsTagged, Untag","href":"ru/yql/builtins/basic.html#as-tagged","level":2},{"title":"TablePath","href":"ru/yql/builtins/basic.html#tablepath","level":2},{"title":"TableName","href":"ru/yql/builtins/basic.html#tablename","level":2},{"title":"TableRecordIndex","href":"ru/yql/builtins/basic.html#tablerecordindex","level":2},{"title":"TableRow, JoinTableRow","href":"ru/yql/builtins/basic.html#tablerow","level":2},{"title":"FileContent и FilePath","href":"ru/yql/builtins/basic.html#file-content-path","level":2},{"title":"FolderPath","href":"ru/yql/builtins/basic.html#folderpath","level":2},{"title":"ParseFile","href":"ru/yql/builtins/basic.html#parsefile","level":2},{"title":"WeakField","href":"ru/yql/builtins/basic.html#weakfield","level":2},{"title":"Ensure...","href":"ru/yql/builtins/basic.html#ensure","level":2},{"title":"AssumeStrict","href":"ru/yql/builtins/basic.html#assumestrict","level":2},{"title":"Likely","href":"ru/yql/builtins/basic.html#likely","level":2},{"title":"EvaluateExpr, EvaluateAtom","href":"ru/yql/builtins/basic.html#evaluate_expr_atom","level":2},{"title":"Литералы простых типов","href":"ru/yql/builtins/basic.html#data-type-literals","level":2},{"title":"Доступ к метаданным текущей операции","href":"ru/yql/builtins/basic.html#metadata","level":2},{"title":"ToBytes и FromBytes","href":"ru/yql/builtins/basic.html#to-from-bytes","level":2},{"title":"ByteAt","href":"ru/yql/builtins/basic.html#byteat","level":2},{"title":"...Bit","href":"ru/yql/builtins/basic.html#bitops","level":2},{"title":"Abs","href":"ru/yql/builtins/basic.html#abs","level":2},{"title":"Just","href":"ru/yql/builtins/basic.html#optional-ops","level":2},{"title":"Unwrap","href":"ru/yql/builtins/basic.html#unwrap","level":2},{"title":"Nothing","href":"ru/yql/builtins/basic.html#nothing","level":2},{"title":"Callable","href":"ru/yql/builtins/basic.html#callable","level":2},{"title":"Pickle, Unpickle","href":"ru/yql/builtins/basic.html#pickle","level":2},{"title":"StaticMap","href":"ru/yql/builtins/basic.html#staticmap","level":2},{"title":"StaticZip","href":"ru/yql/builtins/basic.html#staticzip","level":2},{"title":"StaticFold, StaticFold1","href":"ru/yql/builtins/basic.html#staticfold","level":2},{"title":"AggregationFactory","href":"ru/yql/builtins/basic.html#aggregationfactory","level":2},{"title":"AggregateTransformInput","href":"ru/yql/builtins/basic.html#aggregatetransform","level":2},{"title":"AggregateTransformOutput","href":"ru/yql/builtins/basic.html#aggregatetransformoutput","level":2},{"title":"AggregateFlatten","href":"ru/yql/builtins/basic.html#aggregateflatten","level":2}],"title":"Базовые встроенные функции"},"router":{"pathname":"ru/yql/builtins/basic","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"
