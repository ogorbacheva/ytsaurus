dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-444\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-444.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В описании сигнатур под HistogramStruct подразумевается результат работы агрегатной функции, который является структурой определенного вида.&lt;/p&gt;\n&lt;p&gt;Построение примерной гистограммы по числовому выражению с автоматическим выбором корзин.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"ru/yql/udf/list/histogram.html\"&gt;Вспомогательные функции&lt;/a&gt;&lt;/p&gt;\n&lt;h3 id=\"bazovye-nastrojki\"&gt;&lt;a href=\"ru/yql/builtins/aggregation.html#bazovye-nastrojki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Базовые настройки&lt;/span&gt;&lt;/a&gt;Базовые настройки&lt;/h3&gt;\n&lt;p&gt;Ограничение на число корзин можно задать с помощью опционального аргумента, значение по умолчанию — 100. Следует иметь в виду, что дополнительная точность стоит дополнительных вычислительных ресурсов и может негативно сказываться на времени выполнения запроса, а в экстремальных случаях — и на его успешности.&lt;/p&gt;\n&lt;h3 id=\"podderzhka-vesov\"&gt;&lt;a href=\"ru/yql/builtins/aggregation.html#podderzhka-vesov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поддержка весов&lt;/span&gt;&lt;/a&gt;Поддержка весов&lt;/h3&gt;\n&lt;p&gt;Имеется возможность указать «вес» для каждого значения, участвующего в построении гистограммы. Для этого вторым аргументом в агрегатную функцию нужно передать выражение для вычисления веса. По умолчанию всегда используется вес &lt;code&gt;1.0&lt;/code&gt;. Если используются нестандартные веса, ограничение на число корзин можно задать третьим аргументом.&lt;/p&gt;\n&lt;p&gt;В случае, если передано два аргумента, смысл второго аргумента определяется по его типу (целочисленный литерал — ограничение на число корзин, в противном случае — вес).&lt;/p&gt;\n&lt;h3 id=\"esli-nuzhna-tochnaya-gistogramma\"&gt;&lt;a href=\"ru/yql/builtins/aggregation.html#esli-nuzhna-tochnaya-gistogramma\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Если нужна точная гистограмма&lt;/span&gt;&lt;/a&gt;Если нужна точная гистограмма&lt;/h3&gt;\n&lt;ol&gt;\n&lt;li&gt;Можно воспользоваться описанными ниже агрегатными функциями с фиксированными сетками корзин: &lt;a href=\"ru/yql/builtins/aggregation.html#linearhistogram\"&gt;LinearHistogram&lt;/a&gt; или &lt;a href=\"ru/yql/builtins/aggregation.html#linearhistogram\"&gt;LogarithmicHistogram&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Можно самостоятельно вычислить номер корзины для каждой строки и сделать по нему &lt;a href=\"ru/yql/syntax/group_by.html\"&gt;GROUP BY&lt;/a&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;При использовании &lt;a href=\"ru/yql/builtins/basic.html#aggregationfactory\"&gt;фабрики агрегационной функции&lt;/a&gt; в качестве первого аргумента &lt;a href=\"ru/yql/builtins/aggregation.html#aggregate-by\"&gt;AGGREGATE_BY&lt;/a&gt; передается &lt;code&gt;Tuple&lt;/code&gt; из значения и веса.&lt;/p&gt;\n&lt;h4 id=\"primery15\"&gt;&lt;a href=\"ru/yql/builtins/aggregation.html#primery15\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    HISTOGRAM(numeric_column)\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"490\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-490\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-490\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-490.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    Histogram::Print(\n        HISTOGRAM(numeric_column, 10),\n        50\n    )\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"491\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-491\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-491\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-491.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$hist_factory = AggregationFactory(\"HISTOGRAM\");\n\nSELECT\n    AGGREGATE_BY(AsTuple(numeric_column, 1.0), $hist_factory)\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"492\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-492\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-492\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-492.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"linearhistogram\"&gt;&lt;a href=\"ru/yql/builtins/aggregation.html#linearhistogram\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LinearHistogram, LogarithmicHistogram и LogHistogram&lt;/span&gt;&lt;/a&gt;LinearHistogram, LogarithmicHistogram и LogHistogram&lt;/h2&gt;\n&lt;p&gt;Построение гистограммы по явно указанной фиксированной шкале корзин.&lt;/p&gt;\n&lt;h4 id=\"signatura17\"&gt;&lt;a href=\"ru/yql/builtins/aggregation.html#signatura17\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сигнатура&lt;/span&gt;&lt;/a&gt;Сигнатура&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;LinearHistogram(Double?)-&amp;gt;HistogramStruct?\nLinearHistogram(Double? [, binSize:Double [, min:Double [, max:Double]]])-&amp;gt;HistogramStruct?\n\nLogarithmicHistogram(Double?)-&amp;gt;HistogramStruct?\nLogarithmicHistogram(Double? [, logBase:Double [, min:Double [, max:Double]]])-&amp;gt;HistogramStruct?\nLogHistogram(Double?)-&amp;gt;HistogramStruct?\nLogHistogram(Double? [, logBase:Double [, min:Double [, max:Double]]])-&amp;gt;HistogramStruct?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"502\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-502\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-502\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-502.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Аргументы:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Выражение, по значению которого строится гистограмма. Все последующие — опциональны.&lt;/li&gt;\n&lt;li&gt;Расстояние между корзинами для &lt;code&gt;LinearHistogram&lt;/code&gt; или основание логарифма для &lt;code&gt;LogarithmicHistogram&lt;/code&gt; / &lt;code&gt;LogHistogram&lt;/code&gt; (это алиасы). В обоих случаях значение по умолчанию  — 10.&lt;/li&gt;\n&lt;li&gt;Минимальное значение. По умолчанию минус бесконечность.&lt;/li&gt;\n&lt;li&gt;Максимальное значение. По умолчанию плюс бесконечность.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Формат результата полностью аналогичен &lt;a href=\"ru/yql/builtins/aggregation.html#histogram\"&gt;адаптивным гистограммам&lt;/a&gt;, что позволяет использовать тот же &lt;a href=\"ru/yql/udf/list/histogram.html\"&gt;набор вспомогательных функций&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Если разброс входных значений неконтролируемо велик, рекомендуется указывать минимальное и максимальное значение для предотвращения потенциальных падений из-за высокого потребления памяти.&lt;/p&gt;\n&lt;h4 id=\"primery16\"&gt;&lt;a href=\"ru/yql/builtins/aggregation.html#primery16\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    LogarithmicHistogram(numeric_column, 2)\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"537\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-537\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-537\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-537.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"histogramcdf\"&gt;&lt;a href=\"ru/yql/builtins/aggregation.html#histogramcdf\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CDF (cumulative distribution function)&lt;/span&gt;&lt;/a&gt;CDF (cumulative distribution function)&lt;/h2&gt;\n&lt;p&gt;К каждому виду функции Histogram можно приписать суффикс CDF для построения кумулятивной функции распределения. Конструкции&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    Histogram::ToCumulativeDistributionFunction(Histogram::Normalize(&amp;lt;вид_функции&amp;gt;Histogram(numeric_column)))\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"544\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-544\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-544\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-544.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;и&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    &amp;lt;вид_функции&amp;gt;HistogramCDF(numeric_column)\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"548\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-548\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-548\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-548.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;полностью эквивалентны.&lt;/p&gt;\n&lt;h2 id=\"bool-and-or-xor\"&gt;&lt;a href=\"ru/yql/builtins/aggregation.html#bool-and-or-xor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BOOL_AND, BOOL_OR и BOOL_XOR&lt;/span&gt;&lt;/a&gt;BOOL_AND, BOOL_OR и BOOL_XOR&lt;/h2&gt;\n&lt;h4 id=\"signatura18\"&gt;&lt;a href=\"ru/yql/builtins/aggregation.html#signatura18\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сигнатура&lt;/span&gt;&lt;/a&gt;Сигнатура&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;BOOL_AND(Bool?)-&amp;gt;Bool?\nBOOL_OR(Bool?)-&amp;gt;Bool?\nBOOL_XOR(Bool?)-&amp;gt;Bool?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"558\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-558\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-558\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-558.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Применение соответствующей логической операции (&lt;code&gt;AND&lt;/code&gt;/&lt;code&gt;OR&lt;/code&gt;/&lt;code&gt;XOR&lt;/code&gt;) ко всем значениям булевой колонки или выражения.&lt;/p&gt;\n&lt;p&gt;В отличие от большинства агрегатных функций, эти функции &lt;strong&gt;не пропускают&lt;/strong&gt; &lt;code&gt;NULL&lt;/code&gt; значение при агрегации и действуют по правилу:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;true AND null == null&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;false OR null == null&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Для &lt;code&gt;BOOL_AND&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Для любого количества значений &lt;code&gt;true&lt;/code&gt; и хотя бы одного &lt;code&gt;NULL&lt;/code&gt; значения, результатом будет &lt;code&gt;NULL&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;В случае хотя бы одного &lt;code&gt;false&lt;/code&gt; значения, результатом будет &lt;code&gt;false&lt;/code&gt;, независимо от наличия &lt;code&gt;NULL&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Для &lt;code&gt;BOOL_OR&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Для любого количества значений &lt;code&gt;false&lt;/code&gt; и хотя бы одного &lt;code&gt;NULL&lt;/code&gt; значения, результатом будет &lt;code&gt;NULL&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;В случае хотя бы одного &lt;code&gt;true&lt;/code&gt; значения, результатом будет &lt;code&gt;true&lt;/code&gt;, независимо от наличия &lt;code&gt;NULL&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Для &lt;code&gt;BOOL_XOR&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;В случае хотя бы одного &lt;code&gt;NULL&lt;/code&gt; значения, результатом будет &lt;code&gt;NULL&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Примеры описанного поведения приведены ниже.&lt;/p&gt;\n&lt;p&gt;Для агрегации с пропуском &lt;code&gt;NULL&lt;/code&gt;-ов можно использовать функции &lt;code&gt;MIN&lt;/code&gt;/&lt;code&gt;MAX&lt;/code&gt; или &lt;code&gt;BIT_AND&lt;/code&gt;/&lt;code&gt;BIT_OR&lt;/code&gt;/&lt;code&gt;BIT_XOR&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"primery17\"&gt;&lt;a href=\"ru/yql/builtins/aggregation.html#primery17\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$data = [\n    &amp;lt;|nonNull: true, nonFalse: true, nonTrue: NULL, anyVal: true|&amp;gt;,\n    &amp;lt;|nonNull: false, nonFalse: NULL, nonTrue: NULL, anyVal: NULL|&amp;gt;,\n    &amp;lt;|nonNull: false, nonFalse: NULL, nonTrue: false, anyVal: false|&amp;gt;,\n];\n\nSELECT\n    BOOL_AND(nonNull) as nonNullAnd,      -- false\n    BOOL_AND(nonFalse) as nonFalseAnd,    -- NULL\n    BOOL_AND(nonTrue) as nonTrueAnd,      -- false\n    BOOL_AND(anyVal) as anyAnd,           -- false\n    BOOL_OR(nonNull) as nonNullOr,        -- true\n    BOOL_OR(nonFalse) as nonFalseOr,      -- true\n    BOOL_OR(nonTrue) as nonTrueOr,        -- NULL\n    BOOL_OR(anyVal) as anyOr,             -- true\n    BOOL_XOR(nonNull) as nonNullXor,      -- true\n    BOOL_XOR(nonFalse) as nonFalseXor,    -- NULL\n    BOOL_XOR(nonTrue) as nonTrueXor,      -- NULL\n    BOOL_XOR(anyVal) as anyXor,           -- NULL\nFROM AS_TABLE($data);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"626\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-626\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-626\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-626.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"bit-and-or-xor\"&gt;&lt;a href=\"ru/yql/builtins/aggregation.html#bit-and-or-xor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BIT_AND, BIT_OR и BIT_XOR&lt;/span&gt;&lt;/a&gt;BIT_AND, BIT_OR и BIT_XOR&lt;/h2&gt;\n&lt;p&gt;Применение соответствующей битовой операции ко всем значениям числовой колонки или выражения.&lt;/p&gt;\n&lt;h4 id=\"primery18\"&gt;&lt;a href=\"ru/yql/builtins/aggregation.html#primery18\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    BIT_XOR(unsigned_numeric_value)\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"636\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-636\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-636\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-636.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"session-start\"&gt;&lt;a href=\"ru/yql/builtins/aggregation.html#session-start\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SessionStart&lt;/span&gt;&lt;/a&gt;SessionStart&lt;/h2&gt;\n&lt;p&gt;Без аргументов. Допускается только при наличии &lt;a href=\"ru/yql/syntax/group_by.html#session-window\"&gt;SessionWindow&lt;/a&gt; в&lt;br /&gt;\n&lt;a href=\"ru/yql/syntax/group_by.html\"&gt;GROUP BY&lt;/a&gt; / &lt;a href=\"ru/yql/syntax/window.html#partition\"&gt;PARTITION BY&lt;/a&gt;.&lt;br /&gt;\nВозвращает значение ключевой колонки &lt;code&gt;SessionWindow&lt;/code&gt;. В случае &lt;code&gt;SessionWindow&lt;/code&gt; с двумя аргументами – минимальное значение первого аргумента внутри группы/раздела.&lt;br /&gt;\nВ случае раширенного варианта &lt;code&gt;SessionWindoow&lt;/code&gt; – значение второго элемента кортежа, возвращаемого &lt;code&gt;&amp;lt;calculate_lambda&amp;gt;&lt;/code&gt;, при котором первый элемент кортежа равен &lt;code&gt;True&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"aggregate-by\"&gt;&lt;a href=\"ru/yql/builtins/aggregation.html#aggregate-by\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AGGREGATE_BY и MULTI_AGGREGATE_BY&lt;/span&gt;&lt;/a&gt;AGGREGATE_BY и MULTI_AGGREGATE_BY&lt;/h2&gt;\n&lt;p&gt;Применение &lt;a href=\"ru/yql/builtins/basic.html#aggregationfactory\"&gt;фабрики агрегационной функции&lt;/a&gt; ко всем значениям колонки или выражения. Функция &lt;code&gt;MULTI_AGGREGATE_BY&lt;/code&gt; требует, чтобы в значении колонки или выражения была структура, кортеж или список, и применяет фабрику поэлементно, размещая результат в контейнере той же формы. Если в разных значениях колонки или выражения содержатся списки разной длины, результирующий список будет иметь наименьшую из длин этих списков.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Колонка, &lt;code&gt;DISTINCT&lt;/code&gt; колонка или выражение;&lt;/li&gt;\n&lt;li&gt;Фабрика.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"primery19\"&gt;&lt;a href=\"ru/yql/builtins/aggregation.html#primery19\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$count_factory = AggregationFactory(\"COUNT\");\n\nSELECT\n    AGGREGATE_BY(DISTINCT column, $count_factory) as uniq_count\nFROM my_table;\n\nSELECT\n    MULTI_AGGREGATE_BY(nums, AggregationFactory(\"count\")) as count,\n    MULTI_AGGREGATE_BY(nums, AggregationFactory(\"min\")) as min,\n    MULTI_AGGREGATE_BY(nums, AggregationFactory(\"max\")) as max,\n    MULTI_AGGREGATE_BY(nums, AggregationFactory(\"avg\")) as avg,\n    MULTI_AGGREGATE_BY(nums, AggregationFactory(\"percentile\", 0.9)) as p90\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"664\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-664\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-664\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-664.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"udaf\"&gt;&lt;a href=\"ru/yql/builtins/aggregation.html#udaf\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;UDAF&lt;/span&gt;&lt;/a&gt;UDAF&lt;/h2&gt;\n&lt;p&gt;Если по каким-то причинам перечисленных выше агрегатных функций оказалось недостаточно, в YQL имеется механизм описания пользовательских агрегатных функций. Подробнее &lt;a href=\"ru/yql/recipes/udaf.html\"&gt;см. в отдельной статье&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/builtins/aggregation.md","sourcePath":"ru/yql/builtins/aggregation.md"},"headings":[{"title":"COUNT","href":"ru/yql/builtins/aggregation.html#count","level":2},{"title":"MIN и MAX","href":"ru/yql/builtins/aggregation.html#min-max","level":2},{"title":"SUM","href":"ru/yql/builtins/aggregation.html#sum","level":2},{"title":"AVG","href":"ru/yql/builtins/aggregation.html#avg","level":2},{"title":"COUNT_IF","href":"ru/yql/builtins/aggregation.html#count-if","level":2},{"title":"SUM_IF и AVG_IF","href":"ru/yql/builtins/aggregation.html#sum-if","level":2},{"title":"SOME","href":"ru/yql/builtins/aggregation.html#some","level":2},{"title":"CountDistinctEstimate, HyperLogLog и HLL","href":"ru/yql/builtins/aggregation.html#countdistinctestimate","level":2},{"title":"AGGREGATE_LIST","href":"ru/yql/builtins/aggregation.html#agg-list","level":2},{"title":"MAX_BY и MIN_BY","href":"ru/yql/builtins/aggregation.html#max-min-by","level":2},{"title":"TOP и BOTTOM","href":"ru/yql/builtins/aggregation.html#top-bottom","level":2},{"title":"TOP_BY и BOTTOM_BY","href":"ru/yql/builtins/aggregation.html#top-bottom-by","level":2},{"title":"TOPFREQ и MODE","href":"ru/yql/builtins/aggregation.html#topfreq-mode","level":2},{"title":"STDDEV и VARIANCE","href":"ru/yql/builtins/aggregation.html#stddev-variance","level":2},{"title":"CORRELATION и COVARIANCE","href":"ru/yql/builtins/aggregation.html#correlation-covariance","level":2},{"title":"PERCENTILE и MEDIAN","href":"ru/yql/builtins/aggregation.html#percentile-median","level":2},{"title":"HISTOGRAM","href":"ru/yql/builtins/aggregation.html#histogram","level":2,"items":[{"title":"Базовые настройки","href":"ru/yql/builtins/aggregation.html#bazovye-nastrojki","level":3},{"title":"Поддержка весов","href":"ru/yql/builtins/aggregation.html#podderzhka-vesov","level":3},{"title":"Если нужна точная гистограмма","href":"ru/yql/builtins/aggregation.html#esli-nuzhna-tochnaya-gistogramma","level":3,"items":[{"title":"Примеры","href":"ru/yql/builtins/aggregation.html#primery15","level":4}]}]},{"title":"LinearHistogram, LogarithmicHistogram и LogHistogram","href":"ru/yql/builtins/aggregation.html#linearhistogram","level":2},{"title":"CDF (cumulative distribution function)","href":"ru/yql/builtins/aggregation.html#histogramcdf","level":2},{"title":"BOOL_AND, BOOL_OR и BOOL_XOR","href":"ru/yql/builtins/aggregation.html#bool-and-or-xor","level":2},{"title":"BIT_AND, BIT_OR и BIT_XOR","href":"ru/yql/builtins/aggregation.html#bit-and-or-xor","level":2},{"title":"SessionStart","href":"ru/yql/builtins/aggregation.html#session-start","level":2},{"title":"AGGREGATE_BY и MULTI_AGGREGATE_BY","href":"ru/yql/builtins/aggregation.html#aggregate-by","level":2},{"title":"UDAF","href":"ru/yql/builtins/aggregation.html#udaf","level":2}],"title":"Агрегатные функции"},"router":{"pathname":"ru/yql/builtins/aggregation","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
