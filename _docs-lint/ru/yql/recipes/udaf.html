        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"vvedenie\"&gt;&lt;a href=\"ru/yql/recipes/udaf.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h2&gt;\n&lt;p&gt;Если по каким-то причинам &lt;a href=\"ru/yql/builtins/aggregation.html\"&gt;готовых агрегатных функций&lt;/a&gt; оказалось недостаточно, в YQL есть возможность описать свою. Механизм называется &lt;code&gt;UDAF&lt;/code&gt; (User Defined Aggregation Functions) и работает полностью аналогично стандартным агрегатным функциям.&lt;/p&gt;\n&lt;p&gt;Из особенностей/преимуществ по сравнению с работой на уровне Map/Reduce (&lt;a href=\"ru/yql/syntax/process.html\"&gt;PROCESS&lt;/a&gt; + &lt;a href=\"ru/yql/syntax/reduce.html\"&gt;REDUCE&lt;/a&gt;, либо работа с YTsaurus напрямую без YQL):&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Возможность легко применить одну и ту же логику к нескольким полям/выражениям за один проход вычислений по данным (т. е. считаем разные не связанные друг с другом агрегаты, читая данные только один раз), а также автоматический пропуск пустых значений.&lt;/li&gt;\n&lt;li&gt;Поддержка &lt;code&gt;DISTINCT&lt;/code&gt;, то есть вызова функции только по уникальным значениям.&lt;/li&gt;\n&lt;li&gt;Автоматическое создание map-side combiner, что во многих случаях позволяет сильно сэкономить на времени выполнения запроса, при этом не занимаясь реализацией map-side combiner самостоятельно.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Если вы сделали или собираетесь сделать агрегатную функцию, которая, на ваш взгляд, могла бы быть полезна широкому кругу пользователей — напишите нам об этом  в &lt;a href=\"https://t.me/ytsaurus_ru\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;телеграм-чате&lt;/a&gt;. Возможно, мы добавим её в список стандартных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"shema-raboty\"&gt;&lt;a href=\"ru/yql/recipes/udaf.html#shema-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема работы&lt;/span&gt;&lt;/a&gt;Схема работы&lt;/h2&gt;\n&lt;p&gt;UDAF оперируют следующими абстракциями:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Item&lt;/code&gt; — агрегируемое значение;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;State&lt;/code&gt; — состояние агрегации;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Result&lt;/code&gt; — результат агрегации;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Serialized&lt;/code&gt; &lt;span class=\"gray;\"&gt;(опционально)&lt;/span&gt; — сериализованное представление State.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Parent&lt;/code&gt; &lt;span class=\"gray;\"&gt;(опционально)&lt;/span&gt; — узел, который необходимо использовать как родительский, если обработчик написан на lambda. Это необходимо только в тех случаях, когда состояние содержит мутабельные ресурсы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В каждом конкретном случае за каждой из этих абстракций должен стоять произвольный &lt;a href=\"ru/yql/types/primitive.html\"&gt;тип данных&lt;/a&gt;.&lt;br /&gt;\nОднако тип, соответствующий каждой абстракции, должен совпадать у разных функций. Если у одной из функций в роли &lt;code&gt;Item&lt;/code&gt; используется &lt;code&gt;String&lt;/code&gt;, а у другой — &lt;code&gt;Int64&lt;/code&gt;, то возникнет ошибка несоответствия типов.&lt;/p&gt;\n&lt;p&gt;Порядок вызова UDAF в высокоуровневых терминах:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Для выполнения на каждой из стадий агрегации, пользователь предоставляет от 3 до 7 простых функций (точнее, Callable, вызываемых значений), оперирующих перечисленными выше абстракциями. Основные способы их получить — с помощью &lt;a href=\"ru/yql/syntax/expressions.html#lambda\"&gt;lambda&lt;/a&gt; или &lt;a href=\"ru/yql/udf/python.html\"&gt;Python UDF&lt;/a&gt;. Основные варианты:&lt;/li&gt;\n&lt;/ol&gt;\n&lt;ul&gt;\n&lt;li&gt;3 — минимальный;&lt;/li&gt;\n&lt;li&gt;4 — если State не является результатом;&lt;/li&gt;\n&lt;li&gt;6 — если State несериализуем;&lt;/li&gt;\n&lt;li&gt;7 — если нужно переопределить значение по умолчанию с &lt;code&gt;NULL&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;ol start=\"2\" style=\"--hier-list-start:1\"&gt;\n&lt;li&gt;Пользователь вызывает специальную агрегатную функцию &lt;code&gt;UDAF&lt;/code&gt;, куда первым аргументом передает колонку или выражение для агрегации, а в остальных — вызываемые значения. Порядок указания вызываемых значений описан в таблице ниже.&lt;/li&gt;\n&lt;li&gt;Профит.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Список вызываемых значений, обязательны только выделенные жирным:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Порядковый номер&lt;/th&gt;\n&lt;th&gt;Название&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;th&gt;Сигнатура&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Create&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Инициализация State по первому непустому Item.&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;(Item)-&amp;gt;State&lt;/code&gt;. Для lambda входные аргументы (Item, Parent)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Add&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Добавление очередного Item к State.&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;(State,Item)-&amp;gt;State&lt;/code&gt;. Для lambda входные аргументы (State, Item, Parent)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Merge&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Объединение двух State.&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;(State,State)-&amp;gt;State&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;4&lt;/td&gt;\n&lt;td&gt;Get Result&lt;/td&gt;\n&lt;td&gt;Получение результата агрегации из итогового State.&lt;br /&gt;Если не указано — итоговый State используется в роли результата.&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;(State)-&amp;gt;Result&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;5&lt;/td&gt;\n&lt;td&gt;Serialize&lt;/td&gt;\n&lt;td&gt;Сериализация State, если он сам по себе не является сериализуемым.&lt;br /&gt;Любая комбинация простых типов и контейнеров сериализуема, так что актуально только при использовании Resource в качестве State.&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;(State)-&amp;gt;Serialized&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;6&lt;/td&gt;\n&lt;td&gt;Deserialize&lt;/td&gt;\n&lt;td&gt;Восстановление State после сериализации.&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;(Serialized)-&amp;gt;State&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;7&lt;/td&gt;\n&lt;td&gt;Default Value&lt;/td&gt;\n&lt;td&gt;Результат в ситуации, когда агрегатная функция совсем не вызывалась (оказалось ноль строк на входе). По умолчанию &lt;code&gt;NULL&lt;/code&gt;.&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;()-&amp;gt;Result&lt;/code&gt; или &lt;code&gt;(TypeOf(Result))-&amp;gt;Result&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Передаются последовательно как отдельные аргументы вслед за агрегируемым значением. Всего у агрегатной функции &lt;code&gt;UDAF&lt;/code&gt; может быть от 4 до 8 аргументов.&lt;/p&gt;\n&lt;p&gt;Если одинаковым образом с помощью &lt;code&gt;UDAF&lt;/code&gt; агрегируется несколько значений в запросе, то, чтобы не перечислять каждый раз вызываемые значения, имеет смысл использовать &lt;a href=\"ru/yql/builtins/basic.html#aggregationfactory\"&gt;фабрику агрегационной функции&lt;/a&gt;. При этом вместо колонки с данными передается \"UDAF\", а сам вызов выполняется с помощью функции &lt;a href=\"ru/yql/builtins/aggregation.html#aggregateby\"&gt;AGGREGATE_BY&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"primery\"&gt;&lt;a href=\"ru/yql/recipes/udaf.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;-- Эмуляция агрегационной функции COUNT\n$create = ($item, $parent) -&amp;gt; { return 1ul };\n$add = ($state, $item, $parent) -&amp;gt; { return 1ul + $state };\n$merge = ($state1, $state2) -&amp;gt; { return $state1 + $state2 };\n$get_result = ($state) -&amp;gt; { return $state };\n$serialize = ($state) -&amp;gt; { return $state };\n$deserialize = ($state) -&amp;gt; { return $state };\n$default = 0ul;\n\n$udaf_factory = AggregationFactory(\n    \"UDAF\",\n    $create,\n    $add,\n    $merge,\n    $get_result,\n    $serialize,\n    $deserialize,\n    $default\n);\n\nSELECT\n    AGGREGATE_BY(value1, $udaf_factory) AS cnt1,\n    AGGREGATE_BY(value2, $udaf_factory) AS cnt2 -- посчитать количество значений\n                                                -- в колонках value1 и value2, не равных NULL.\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"246\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-246\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-246\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-246.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/recipes/udaf.md","sourcePath":"ru/yql/recipes/udaf.md"},"headings":[{"title":"Введение","href":"ru/yql/recipes/udaf.html#vvedenie","level":2},{"title":"Схема работы","href":"ru/yql/recipes/udaf.html#shema-raboty","level":2,"items":[{"title":"Примеры","href":"ru/yql/recipes/udaf.html#primery","level":3}]}],"title":"Пользовательские агрегатные функции в YQL"},"router":{"pathname":"ru/yql/recipes/udaf","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
