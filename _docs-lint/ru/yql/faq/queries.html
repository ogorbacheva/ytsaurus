        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"kak-sdelat-zapros-po-logam-za-poslednij-den/nedelyu/mesyac-ili-kakoj-libo-drugoj-otnositelnyj-period-vremeni\"&gt;&lt;a href=\"ru/yql/faq/queries.html#kak-sdelat-zapros-po-logam-za-poslednij-den/nedelyu/mesyac-ili-kakoj-libo-drugoj-otnositelnyj-period-vremeni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как сделать запрос по логам за последний день/неделю/месяц или какой-либо другой относительный период времени?&lt;/span&gt;&lt;/a&gt;Как сделать запрос по логам за последний день/неделю/месяц или какой-либо другой относительный период времени?&lt;/h2&gt;\n&lt;p&gt;Если подставлять даты в текст запроса перед запуском неудобно, то можно сделать следующим образом:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Пишем UDF на &lt;a href=\"ru/yql/udf/python.html\"&gt;Python&lt;/a&gt; или &lt;a href=\"ru/yql/udf/cpp.html\"&gt;C++&lt;/a&gt; с сигнатурой &lt;code&gt;(String)-&amp;gt;Bool&lt;/code&gt;. По имени таблицы она должна вернуть true только для попадающих в нужный диапазон, ориентируясь на текущее время или дату, полученные средствами выбранного языка программирования.&lt;/li&gt;\n&lt;li&gt;Передаём эту UDF в функцию &lt;a href=\"ru/yql/syntax/select/index.html#func_table\"&gt;FILTER&lt;/a&gt; вместе с префиксом до директории с логами.&lt;/li&gt;\n&lt;li&gt;Используем результат работы FILTER в любом месте, где ожидается путь к входным данным (&lt;a href=\"ru/yql/syntax/select/from.html\"&gt;FROM&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/process.html\"&gt;PROCESS&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/reduce.html\"&gt;REDUCE&lt;/a&gt;)&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Так как форматы даты и времени в названиях таблиц могут быть произвольными, а также логика выбора подходящих таблиц может быть неопределённо сложной, более специализированного решения для этой задачи не предоставляется.&lt;/p&gt;\n&lt;h2 id=\"kak-sdelat-filtraciyu-po-bolshomu-spisku-znachenij\"&gt;&lt;a href=\"ru/yql/faq/queries.html#kak-sdelat-filtraciyu-po-bolshomu-spisku-znachenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как сделать фильтрацию по большому списку значений?&lt;/span&gt;&lt;/a&gt;Как сделать фильтрацию по большому списку значений?&lt;/h2&gt;\n&lt;p&gt;Можно, конечно, сгенерировать гигантское условие в &lt;code&gt;WHERE&lt;/code&gt;, но лучше:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Сгенерировать текстовый файл со списком значений по одному на строку, а затем приложить его к запросу и воспользоваться &lt;a href=\"ru/yql/syntax/expressions.html#in\"&gt;IN&lt;/a&gt; в сочетании с функцией &lt;a href=\"ru/yql/builtins/basic.html#parsefile\"&gt;ParseFile&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Сформировать таблицу из значений, по которым нужно сделать фильтрацию, и выполнить &lt;code&gt;LEFT SEMI JOIN&lt;/code&gt; с этой таблицей.&lt;/li&gt;\n&lt;li&gt;Для строк можно сгенерировать регулярное выражение, проверяющее их через «или», и воспользоваться ключевым словом &lt;a href=\"ru/yql/syntax/expressions.html#regexp\"&gt;REGEXP&lt;/a&gt;, либо одной из предустановленных функций для работы с регулярными выражениями (&lt;a href=\"ru/yql/udf/list/hyperscan.html\"&gt;Hyperscan&lt;/a&gt;, &lt;a href=\"ru/yql/udf/list/pire.html\"&gt;Pire&lt;/a&gt; или &lt;a href=\"ru/yql/udf/list/re2.html\"&gt;Re2&lt;/a&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"chem-otlichayutsya-min,-minby-i-minof-ili-max,-maxby-i-maxof\"&gt;&lt;a href=\"ru/yql/faq/queries.html#chem-otlichayutsya-min,-minby-i-minof-ili-max,-maxby-i-maxof\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чем отличаются MIN, MINBY и MINOF? (или MAX, MAXBY и MAXOF)&lt;/span&gt;&lt;/a&gt;Чем отличаются MIN, MIN_BY и MIN_OF? (или MAX, MAX_BY и MAX_OF)&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;MIN(column)&lt;/code&gt; — агрегатная функция из SQL-стандарта, возвращающая минимальное значение, найденное в указанной колонке.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;MIN_BY(result, by)&lt;/code&gt; — нестандартная агрегатная функция, которая, в отличие от предыдущей, возвращает не само минимальное значение, а какое-то другое значение из строк(-и), где нашелся минимум.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;MIN_OF(a, b, c, d)&lt;/code&gt; — встроенная функция, которая возвращает среди N значений-аргументов минимальное.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"kak-obratitsya-k-kolonke,-v-imeni-kotoroj-est-znak-minus-ili-drugoj-specsimvol\"&gt;&lt;a href=\"ru/yql/faq/queries.html#kak-obratitsya-k-kolonke,-v-imeni-kotoroj-est-znak-minus-ili-drugoj-specsimvol\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как обратиться к колонке, в имени которой есть знак минус или другой спецсимвол?&lt;/span&gt;&lt;/a&gt;Как обратиться к колонке, в имени которой есть знак минус или другой спецсимвол?&lt;/h2&gt;\n&lt;p&gt;Обернуть имя колонки в backticks по аналогии с именами таблиц:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT `field-with-minus` FROM `table`;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"75\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-75\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-75\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-75.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"chto-takoe-kolonka-other\"&gt;&lt;a href=\"ru/yql/faq/queries.html#chto-takoe-kolonka-other\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что такое колонка other?&lt;/span&gt;&lt;/a&gt;Что такое колонка _other?&lt;/h2&gt;\n&lt;p&gt;Это виртуальная колонка. Она создаётся только YQL-движком (система YTsaurus про неё ничего не знает) и только для таблиц с &lt;i class=\"yfm yfm-term_title\" term-key=\":schema-not-strict\" role=\"button\" aria-describedby=\":schema-not-strict_element\" tabindex=\"0\" id=\"t5l3ca1p\"&gt;нестрогой схемой&lt;/i&gt;. В этой колонке доступны столбцы таблицы, которые изначально в схеме не были заданы. Колонка имеет тип &lt;code&gt;Dict&amp;lt;String,String&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Есть несколько распространённых способов получить таблицу, в которой есть такая колонка:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Например, создать таблицу без схемы и затем отсортировать её. Система YTsaurus выставит отсортированной таблице схему, в которой будут явно указаны только имена столбцов, по которым производилась сортировка. А если прочитать сортированную таблицу в YQL, то остальные столбцы будут доступны в поле &lt;code&gt;_other&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Другой способ — создать таблицу с нестрогой схемой и добавить в эту таблицу колонки, которые изначально не были явно указаны в схеме. Ниже приведён пример этого кейса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Создадим таблицу с нестрогой схемой. В схеме явно заданы две колонки: 'id' и 'text'.&lt;/span&gt;\n$ yt create table //tmp/table_not_strict --attributes &lt;span class=\"hljs-string\"&gt;'{schema = &amp;lt;strict=%false&amp;gt;[{name = id; type = int64}; {name = text; type = string}]}'&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Теперь добавим в таблицу данные, указав дополнительную колонку 'newColumn', которой нет в схеме.&lt;/span&gt;\n$ &lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'{ \"id\": 0, \"text\": \"Hello, World!\", \"newColumn\": \"This column is not in schema\" } '&lt;/span&gt; | yt write-table //tmp/table_not_strict --format json\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"100\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-100\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-100\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-100.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Создавать таблицы с нестрогой схемой можно только через YTsaurus SDK. В веб-интерфейсе это сделать не получится.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Если прочитать эту таблицу в YQL, поле &lt;code&gt;newColumn&lt;/code&gt; будет доступно в колонке &lt;code&gt;_other&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT * FROM `//tmp/table_not_strict` AS t;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"114\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-114\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-114\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-114.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;img src=\"images/yql_other_field.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;Получить значение колонки &lt;code&gt;newColumn&lt;/code&gt; можно несколькими способами:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    WeakField(t.newColumn, \"String\")\nFROM `//tmp/table_not_strict` AS t;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"121\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-121\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-121\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-121.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;или&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    t._other[\"newColumn\"]\nFROM `//tmp/table_not_strict` AS t;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"125\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-125\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-125\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-125.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Первый способ позволяет работать единообразно с таблицей, если вдруг колонка &lt;code&gt;newColumn&lt;/code&gt; попадет в строгую схему. Также &lt;a href=\"ru/yql/builtins/basic.html#weakfield\"&gt;WeakField&lt;/a&gt; позволяет сразу получить значение в нужном типе, а при работе с &lt;code&gt;_other&lt;/code&gt; полученные значения пришлось бы обрабатывать как Yson. Для случая строгой схемы проверяется, что тип, переданный в WeakField, совпадает с типом в схеме.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Если результат запроса &lt;code&gt;SELECT * FROM &amp;lt;таблица с виртуальной колонкой _other&amp;gt;&lt;/code&gt; записать в другую таблицу, то в новой таблице колонка &lt;code&gt;_other&lt;/code&gt; превратится уже в реальную колонку. Но схема этой таблицы тогда будет строгая.&lt;/p&gt;\n&lt;p&gt;Если в YQL пытаться прочитать нестрогую таблицу, в которой уже есть реальная колонка &lt;code&gt;_other&lt;/code&gt;, то возникнет ошибка: \"Non-strict schema contains '_other' column, which conflicts with YQL virtual column\".&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;\n&lt;h2 id=\"kak-sozdat-pustuyu-tablicu-so-shemoj-iz-drugoj-tablicy\"&gt;&lt;a href=\"ru/yql/faq/queries.html#kak-sozdat-pustuyu-tablicu-so-shemoj-iz-drugoj-tablicy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как создать пустую таблицу со схемой из другой таблицы?&lt;/span&gt;&lt;/a&gt;Как создать пустую таблицу со схемой из другой таблицы?&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;-- Определяем тип записи исходных данных\n$s = select * from `path/to/source_table`;\n$s = process $s;\n\n-- Создаём пустую таблицу с нужной схемой\nINSERT INTO `path/to/my_destination_table` WITH TRUNCATE\nSELECT * FROM as_table(ListCreate(ListItemType(TypeOf($s))))\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"146\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-146\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-146\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-146.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"kak-ne-raspakovyvat-protobuf,-a-rabotat-so-strokoj\"&gt;&lt;a href=\"ru/yql/faq/queries.html#kak-ne-raspakovyvat-protobuf,-a-rabotat-so-strokoj\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как не распаковывать protobuf, а работать со строкой?&lt;/span&gt;&lt;/a&gt;Как не распаковывать protobuf, а работать со строкой?&lt;/h2&gt;\n&lt;p&gt;YQL умеет распаковывать protobuf сообщения. Рекомендуется настраивать  автоматическую распаковку через метаданные таблиц. В некоторых случаях вместо распакованного сообщения необходимо работать с исходной строкой. Для этого стоит воспользоваться специальным представлением &lt;a href=\"ru/yql/syntax/select/index.html#view\"&gt;raw&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT *\nFROM `path/to/my_table` VIEW raw;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"153\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-153\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-153\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-153.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стоит учитывать, что мета-атрибут автораспаковки таблиц, созданных таким запросом, скопирован не будет, его необходимо устанавливать заново.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"kak-prevratit-stroku-vida-a=b,c=d-v-slovar\"&gt;&lt;a href=\"ru/yql/faq/queries.html#kak-prevratit-stroku-vida-a=b,c=d-v-slovar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как превратить строку вида \"a=b,c=d\" в словарь?&lt;/span&gt;&lt;/a&gt;Как превратить строку вида \"a=b,c=d\" в словарь?&lt;/h2&gt;\n&lt;p&gt;Для этого достаточно применить предустановленную функцию из модуля &lt;a href=\"ru/yql/udf/list/dsv.html\"&gt;Dsv&lt;/a&gt; UDF:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$str = \"a=b,c=d\";\nSELECT Dsv::Parse($str, \",\");\n\n/*\nРезультат:\n{\n    \"a\": \"b\",\n    \"c\": \"d\"\n}\n*/\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"170\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-170\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-170\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-170.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"kak-udalit-iz-tablicy-dublikaty-strok,-ne-perechislyaya-vse-kolonki\"&gt;&lt;a href=\"ru/yql/faq/queries.html#kak-udalit-iz-tablicy-dublikaty-strok,-ne-perechislyaya-vse-kolonki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как удалить из таблицы дубликаты строк, не перечисляя все колонки?&lt;/span&gt;&lt;/a&gt;Как удалить из таблицы дубликаты строк, не перечисляя все колонки?&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT * WITHOUT g FROM (\n    SELECT Some(TableRow()) AS s\n    FROM `path/to/table` AS t\n    GROUP BY Digest::Sha256(StablePickle(TableRow())) AS g\n)\nFLATTEN COLUMNS;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"174\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-174\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-174\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-174.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"kak-skopirovat-polzovatelskie-atributy-na-vyhodnuyu-tablicu\"&gt;&lt;a href=\"ru/yql/faq/queries.html#kak-skopirovat-polzovatelskie-atributy-na-vyhodnuyu-tablicu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как скопировать пользовательские атрибуты на выходную таблицу&lt;/span&gt;&lt;/a&gt;Как скопировать пользовательские атрибуты на выходную таблицу&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$input = \"some/input/path\";\n$output = \"destination/path\";\n\n-- Фильтруем пользовательские атрибуы, начинающиеся с подчеркивания, и исключаем некоторые системные YQL атрибуты\n$user_attr = ($attr) -&amp;gt; {\n    RETURN ListFilter(\n        Yson::ConvertToStringList($attr.user_attribute_keys),\n        ($name) -&amp;gt; {\n            RETURN StartsWith($name, \"_\") AND $name NOT IN [\"_yql_op_id\", \"_yql_row_spec\", \"_yql_runner\"];\n        }\n    );\n};\n\n-- Добавляем префикс // к пути\n$yt_path = ($path) -&amp;gt; {\n    RETURN IF(StartsWith($path, \"//\"), $path, \"//\" || $path);\n};\n\n-- Создаём список атрибутов для копирования\n$attribute_keys = (\n    SELECT String::JoinFromList($user_attr(Attributes), \";\")\n    FROM Folder(Substring($input, NULL, RFind($input, \"/\")), \"user_attribute_keys\")\n    WHERE $yt_path(Path) == $yt_path($input)\n);\n\n-- Читаем пользовательские атрибуты\n$attributes = (\n    SELECT CAST(Yson::SerializePretty(Attributes) AS String) as attrs\n    FROM Folder(Substring($input, NULL, RFind($input, \"/\")), $attribute_keys)\n    WHERE $yt_path(Path) == $yt_path($input)\n);\n\n-- Форсируем скалярный контекст\n$attributes = EvaluateExpr($attributes);\n\nINSERT INTO $output WITH (TRUNCATE, USER_ATTRS=$attributes)\nSELECT *\nFROM (\n    SELECT *\n    FROM $input\n    LIMIT 5\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"178\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-178\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-178\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-178.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"json-i-yson\"&gt;&lt;a href=\"ru/yql/faq/queries.html#json-i-yson\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;JSON и YSON&lt;/span&gt;&lt;/a&gt;JSON и YSON&lt;/h2&gt;\n&lt;h3 id=\"kak-prevratit-stroku-tablicy-v-json\"&gt;&lt;a href=\"ru/yql/faq/queries.html#kak-prevratit-stroku-tablicy-v-json\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как превратить строку таблицы в JSON?&lt;/span&gt;&lt;/a&gt;Как превратить строку таблицы в JSON?&lt;/h3&gt;\n&lt;p&gt;Для этого потребуются предустановленные &lt;a href=\"ru/yql/udf/list/yson.html\"&gt;функции&lt;/a&gt; сериализации и стандартная функция &lt;a href=\"ru/yql/builtins/basic.html#tablerow\"&gt;TableRow()&lt;/a&gt; для обращения ко всей строке:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE &amp;lt;cluster-name&amp;gt;;\nSELECT Yson::SerializeJson(Yson::From(TableRow()))\nFROM `home/yql/tutorial/users`;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"188\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-188\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-188\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-188.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"yson-json\"&gt;&lt;a href=\"ru/yql/faq/queries.html#yson-json\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как получить значение по ключу из JSON'а / YSON'а?&lt;/span&gt;&lt;/a&gt;Как получить значение по ключу из JSON'а / YSON'а?&lt;/h3&gt;\n&lt;p&gt;При работе с JSON'ом / YSON'ом стоит помнить:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Несериализованное поле этих форматов нельзя вывести в браузере или сохранить в таблицу — возникает ошибка вида &lt;code&gt; Expected persistable data, but got: List&amp;lt;Struct&amp;lt;'column0':Resource&amp;lt;'Yson.Node'&amp;gt;&amp;gt;&amp;gt;&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Не стоит преобразовывать в словарь, если нужно получить значение только по одному ключу.&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;-- Тип my_column — Yson\n\nSELECT Yson::Serialize(my_json_column.myKey) AS my_column\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"207\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-207\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-207\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-207.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если требуется конкретный тип данных, то можно воспользоваться функцией &lt;a href=\"ru/yql/udf/list/yson.html#ysonconvertto\"&gt;Yson::ConvertTo...&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;-- Тип my_column — String\n\nSELECT Yson::ConvertToString(my_json_column.myKey) AS my_column\nFROM my_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"211\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-211\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-211\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-211.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если исходный тип колонки строка, то можно воспользоваться функцией &lt;a href=\"ru/yql/udf/list/yson.html#ysonparse\"&gt;Yson::Parse...&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Yson::Serialize(Yson::Parse(my_yson_column)) AS my_yson;\n\n-- В результате получается Yson, при работе с которым Yson::Parse подставляется автоматически\n\nSELECT Yson::Serialize(my_yson.myKey) AS my_key_value;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"215\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-215\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-215\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-215.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если требуется список из всех значений по ключу, то можно воспользоваться функцией &lt;a href=\"ru/yql/builtins/list.html#listmap\"&gt;ListMap&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    ListMap(\n        Yson::ConvertToList(my_yson_column),\n        ($x) -&amp;gt; { RETURN Yson::Serialize($x.foo) }\n    );\n\n-- Результат выполнения — список строк\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"219\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-219\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-219\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-219.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Пример получения элемента списка:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Yson::ConvertToString(Yson::ConvertToList(my_yson_column)[0].foo);\n\n-- Результат выполнения — поле конкретного элемента списка\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"223\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-223\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-223\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-223.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"flatten\"&gt;&lt;a href=\"ru/yql/faq/queries.html#flatten\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как вертикально развернуть словарь/список из таблицы?&lt;/span&gt;&lt;/a&gt;Как вертикально развернуть словарь/список из таблицы?&lt;/h3&gt;\n&lt;p&gt;В случае, когда контейнер, который необходимо развернуть — список, стоит использовать &lt;code&gt;FLATTEN LIST BY&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    parents,\n    name,\n    geo_parents_list\nFROM &amp;lt;cluster-name&amp;gt;.`home/yql/tutorial/users` VIEW complex\nFLATTEN LIST BY geo_parents_list AS parents;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"230\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-230\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-230\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-230.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если же список находится в колонке с типом Yson, то сначала необходимо преобразовать его в тип List. Например, так:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT *\nFROM (\n    SELECT\n        ListMap(\n            Yson::ConvertToList(my_yson_column),\n            ($x) -&amp;gt; { RETURN Yson::Serialize($x.foo) }\n        ) AS my_list\n    FROM my_table)\nFLATTEN LIST BY my_list;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"234\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-234\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-234\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-234.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code&gt;FLATTEN DICT BY&lt;/code&gt; следует использовать, когда развернуть нужно словарь:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    dsv.dict.0 AS key,\n    dsv.dict.1 AS value\nFROM &amp;lt;cluster-name&amp;gt;.`home/yql/tutorial/users_dsv` AS dsv\nFLATTEN DICT BY dict;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"238\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-238\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-238\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-238.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Подробнее про конструкцию &lt;code&gt;FLATTEN BY&lt;/code&gt; можно прочитать в соответствующем &lt;a href=\"ru/yql/syntax/flatten.html\"&gt;разделе&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"list-table-attach\"&gt;&lt;a href=\"ru/yql/faq/queries.html#list-table-attach\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как передать данные одной таблицы (справочника) в виде списка для обработки другой таблицы&lt;/span&gt;&lt;/a&gt;Как передать данные одной таблицы (справочника) в виде списка для обработки другой таблицы&lt;/h2&gt;\n&lt;p&gt;Если размер таблицы справочника не превышает лимита на размер одной строки таблицы, то можно воспользоваться скалярным контекстом и функцией &lt;code&gt;AGGREGATE_LIST&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$data = SELECT AGGREGATE_LIST(TableRow()) FROM small_table; -- скалярный контекст при использовании $data в выражении, тип Optional&amp;lt;List&amp;gt;\n\nSELECT MyModule::MyUdf($data ?? [])(x) FROM big_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"248\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-248\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-248\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-248.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если размер таблицы справочника побольше, но она все еще может быть загружена в каждую джобу целиком, то можно воспользоваться табличным контекстом.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$data = SELECT * FROM medium_table;\n$data = PROCESS $data; -- включаем табличный контекст, $data будет далее иметь тип List&amp;lt;Struct&amp;gt;\n\nSELECT MyModule::MyUdf($data)(x) FROM big_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"252\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-252\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-252\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-252.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;dfn class=\"yfm yfm-term_dfn\" id=\":schema-not-strict_element\" role=\"dialog\"&gt;&lt;p&gt;У такой схемы выставлен атрибут &lt;code&gt;&amp;lt;strict=%false&amp;gt;&lt;/code&gt;. &lt;a href=\"ru/yql/faq/ru/user-guide/storage/static-schema.html\"&gt;Подробнее про схемы таблицы&lt;/a&gt;&lt;/p&gt;\n&lt;/dfn&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/faq/queries.md","sourcePath":"ru/yql/faq/queries.md"},"headings":[{"title":"Как сделать запрос по логам за последний день/неделю/месяц или какой-либо другой относительный период времени?","href":"ru/yql/faq/queries.html#kak-sdelat-zapros-po-logam-za-poslednij-den/nedelyu/mesyac-ili-kakoj-libo-drugoj-otnositelnyj-period-vremeni","level":2},{"title":"Как сделать фильтрацию по большому списку значений?","href":"ru/yql/faq/queries.html#kak-sdelat-filtraciyu-po-bolshomu-spisku-znachenij","level":2},{"title":"Чем отличаются MIN, MIN_BY и MIN_OF? (или MAX, MAX_BY и MAX_OF)","href":"ru/yql/faq/queries.html#chem-otlichayutsya-min,-minby-i-minof-ili-max,-maxby-i-maxof","level":2},{"title":"Как обратиться к колонке, в имени которой есть знак минус или другой спецсимвол?","href":"ru/yql/faq/queries.html#kak-obratitsya-k-kolonke,-v-imeni-kotoroj-est-znak-minus-ili-drugoj-specsimvol","level":2},{"title":"Что такое колонка _other?","href":"ru/yql/faq/queries.html#chto-takoe-kolonka-other","level":2},{"title":"Как создать пустую таблицу со схемой из другой таблицы?","href":"ru/yql/faq/queries.html#kak-sozdat-pustuyu-tablicu-so-shemoj-iz-drugoj-tablicy","level":2},{"title":"Как не распаковывать protobuf, а работать со строкой?","href":"ru/yql/faq/queries.html#kak-ne-raspakovyvat-protobuf,-a-rabotat-so-strokoj","level":2},{"title":"Как превратить строку вида \"a=b,c=d\" в словарь?","href":"ru/yql/faq/queries.html#kak-prevratit-stroku-vida-a=b,c=d-v-slovar","level":2},{"title":"Как удалить из таблицы дубликаты строк, не перечисляя все колонки?","href":"ru/yql/faq/queries.html#kak-udalit-iz-tablicy-dublikaty-strok,-ne-perechislyaya-vse-kolonki","level":2},{"title":"Как скопировать пользовательские атрибуты на выходную таблицу","href":"ru/yql/faq/queries.html#kak-skopirovat-polzovatelskie-atributy-na-vyhodnuyu-tablicu","level":2},{"title":"JSON и YSON","href":"ru/yql/faq/queries.html#json-i-yson","level":2,"items":[{"title":"Как превратить строку таблицы в JSON?","href":"ru/yql/faq/queries.html#kak-prevratit-stroku-tablicy-v-json","level":3},{"title":"Как получить значение по ключу из JSON'а / YSON'а?","href":"ru/yql/faq/queries.html#yson-json","level":3},{"title":"Как вертикально развернуть словарь/список из таблицы?","href":"ru/yql/faq/queries.html#flatten","level":3}]},{"title":"Как передать данные одной таблицы (справочника) в виде списка для обработки другой таблицы","href":"ru/yql/faq/queries.html#list-table-attach","level":2}],"title":"Запросы, синтаксис, UDF"},"router":{"pathname":"ru/yql/faq/queries","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
