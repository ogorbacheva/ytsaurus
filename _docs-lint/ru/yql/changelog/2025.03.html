            {"data":{"leading":false,"html":"&lt;h2 id=\"re2-module\"&gt;&lt;a href=\"ru/yql/changelog/2025.03.html#re2-module\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Изменения в модуле RE2&lt;/span&gt;&lt;/a&gt;Изменения в модуле RE2&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Гарантируется падение запросов при передаче невалидных регулярных выражений.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"digest-module\"&gt;&lt;a href=\"ru/yql/changelog/2025.03.html#digest-module\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Изменения в модуле Digest&lt;/span&gt;&lt;/a&gt;Изменения в модуле Digest&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Добавлена функция &lt;code&gt;Digest::Sha512&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"datetime-module\"&gt;&lt;a href=\"ru/yql/changelog/2025.03.html#datetime-module\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Изменения в модуле DateTime&lt;/span&gt;&lt;/a&gt;Изменения в модуле DateTime&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Изменён возвращаемый тип &lt;code&gt;DateTime::ToSeconds(Interval)&lt;/code&gt; на &lt;code&gt;Int64&lt;/code&gt; вместо &lt;code&gt;Int32&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Изменён тип аргумента &lt;code&gt;DateTime::IntervalFromSeconds&lt;/code&gt; на &lt;code&gt;Int64&lt;/code&gt; вместо &lt;code&gt;Int32&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"izmeneniya-v-sintaksise-select\"&gt;&lt;a href=\"ru/yql/changelog/2025.03.html#izmeneniya-v-sintaksise-select\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Изменения в синтаксисе SELECT&lt;/span&gt;&lt;/a&gt;Изменения в синтаксисе SELECT&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Добавлена возможность явного указания &lt;code&gt;DISTINCT&lt;/code&gt; для &lt;code&gt;UNION&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Добавлена реализация &lt;code&gt;INTERSECT [DISTINCT|ALL]&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Добавлена реализация &lt;code&gt;EXCEPT [DISTINCT|ALL]&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/changelog/2025.03.md","sourcePath":"ru/yql/changelog/2025.03.md"},"headings":[{"title":"Изменения в модуле RE2","href":"ru/yql/changelog/2025.03.html#re2-module","level":2},{"title":"Изменения в модуле Digest","href":"ru/yql/changelog/2025.03.html#digest-module","level":2},{"title":"Изменения в модуле DateTime","href":"ru/yql/changelog/2025.03.html#datetime-module","level":2},{"title":"Изменения в синтаксисе SELECT","href":"ru/yql/changelog/2025.03.html#izmeneniya-v-sintaksise-select","level":2}],"title":""},"router":{"pathname":"ru/yql/changelog/2025.03","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
