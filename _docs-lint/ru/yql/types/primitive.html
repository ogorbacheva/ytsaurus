        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Термины «простые», «примитивные» и «элементарные» типы данных используются как синонимы.&lt;/p&gt;\n&lt;h2 id=\"numeric\"&gt;&lt;a href=\"ru/yql/types/primitive.html#numeric\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Числовые типы&lt;/span&gt;&lt;/a&gt;Числовые типы&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;th&gt;Примечания&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Логическое значение.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Int8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Целое число со знаком.&lt;br /&gt;Допустимые значения: от –2&lt;sup&gt;7&lt;/sup&gt; до 2&lt;sup&gt;7&lt;/sup&gt;–1.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Int16&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Целое число со знаком.&lt;br /&gt;Допустимые значения: от –2&lt;sup&gt;15&lt;/sup&gt; до 2&lt;sup&gt;15&lt;/sup&gt;–1.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Int32&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Целое число со знаком.&lt;br /&gt;Допустимые значения: от –2&lt;sup&gt;31&lt;/sup&gt; до 2&lt;sup&gt;31&lt;/sup&gt;–1.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Int64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Целое число со знаком.&lt;br /&gt;Допустимые значения: от –2&lt;sup&gt;63&lt;/sup&gt; до 2&lt;sup&gt;63&lt;/sup&gt;–1.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Uint8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Беззнаковое целое число.&lt;br /&gt;Допустимые значения: от 0 до 2&lt;sup&gt;8&lt;/sup&gt;–1.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Uint16&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Беззнаковое целое число.&lt;br /&gt;Допустимые значения: от 0 до 2&lt;sup&gt;16&lt;/sup&gt;–1.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Uint32&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Беззнаковое целое число.&lt;br /&gt;Допустимые значения: от 0 до 2&lt;sup&gt;32&lt;/sup&gt;–1.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Беззнаковое целое число.&lt;br /&gt;Допустимые значения: от 0 до 2&lt;sup&gt;64&lt;/sup&gt;–1.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Float&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Вещественное число с переменной точностью размером 4 байта.&lt;/td&gt;\n&lt;td&gt;Не может быть использован в первичном ключе&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Double&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Вещественное число с переменной точностью размером 8 байт.&lt;/td&gt;\n&lt;td&gt;Не может быть использован в первичном ключе&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Decimal&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Вещественное число с указанной точностью, до 35 десятичных знаков&lt;/td&gt;\n&lt;td&gt;При использовании в колонках таблиц точность фиксирована: Decimal (22,9).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;DyNumber&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Бинарное представление вещественного числа точностью до 38 знаков.&lt;br /&gt;Допустимые значения: положительные от 1×10&lt;sup&gt;-130&lt;/sup&gt; до 1×10&lt;sup&gt;126&lt;/sup&gt;–1, отрицательные от -1×10&lt;sup&gt;126&lt;/sup&gt;–1 до -1×10&lt;sup&gt;-130&lt;/sup&gt; и 0.&lt;br /&gt;Совместим с типом &lt;code&gt;Number&lt;/code&gt; AWS DynamoDB. Не рекомендуется для использования в YTsaurus-native приложениях.&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"string\"&gt;&lt;a href=\"ru/yql/types/primitive.html#string\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Строковые типы&lt;/span&gt;&lt;/a&gt;Строковые типы&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;th&gt;Примечания&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;String&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Строка, может содержать произвольные бинарные данные&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Utf8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Текст в кодировке &lt;a href=\"https://en.wikipedia.org/wiki/UTF-8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;UTF-8&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Json&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://en.wikipedia.org/wiki/JSON\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;JSON&lt;/a&gt; в текстовом представлении&lt;/td&gt;\n&lt;td&gt;Не поддерживает возможность сравнения, не может быть использован в первичном ключе&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;JsonDocument&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://en.wikipedia.org/wiki/JSON\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;JSON&lt;/a&gt; в бинарном индексированном представлении&lt;/td&gt;\n&lt;td&gt;Не поддерживает возможность сравнения, не может быть использован в первичном ключе&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Yson&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/user-guide/storage/formats.html#yson\"&gt;YSON&lt;/a&gt; в текстовом или бинарном представлении&lt;/td&gt;\n&lt;td&gt;Не поддерживает возможность сравнения, не может быть использован в первичном ключе&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Uuid&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Универсальный идентификатор &lt;a href=\"https://tools.ietf.org/html/rfc4122\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;UUID&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения на размер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Максимальный размер значения в ячейке неключевого столбца с любым строковым типом данных —  8 МБ.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В отличие от типа данных &lt;code&gt;Json&lt;/code&gt;, который хранит исходное текстовое представление, переданное пользователем, &lt;code&gt;JsonDocument&lt;/code&gt; использует бинарное индексированное представление. Важное отличие с точки зрения семантики состоит в том, что &lt;code&gt;JsonDocument&lt;/code&gt; не сохраняет форматирование, порядок ключей в объектах и их дубликаты.&lt;/p&gt;\n&lt;p&gt;За счет индексированного представления &lt;code&gt;JsonDocument&lt;/code&gt; позволяет обходить документную модель с использованием &lt;code&gt;JsonPath&lt;/code&gt; без необходимости парсинга всего содержимого. Это позволяет эффективно выполнять операции из &lt;a href=\"ru/yql/builtins/json.html\"&gt;JSON API&lt;/a&gt;, уменьшая задержки и стоимость пользовательских запросов. Выполнение запросов над &lt;code&gt;JsonDocument&lt;/code&gt; может быть до нескольких раз эффективнее в зависимости от типа нагрузки.&lt;/p&gt;\n&lt;p&gt;Из-за добавленной избыточности &lt;code&gt;JsonDocument&lt;/code&gt; менее эффективен в хранении. Дополнительные накладные расходы на хранение зависят от конкретного содержимого и в среднем составляют 20–30% от исходного объема. Сохранение данных в формате &lt;code&gt;JsonDocument&lt;/code&gt; требует дополнительной конвертации из текстового представления, что делает его запись менее эффективной. Тем не менее, для большинства read-intensive сценариев, подразумевающих обработку данных из JSON, этот тип данных является предпочтительным и рекомендуется к использованию.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Для хранения чисел (JSON Number) в &lt;code&gt;JsonDocument&lt;/code&gt;, а также для арифметических операций над ними в &lt;a href=\"ru/yql/builtins/json.html\"&gt;JSON API&lt;/a&gt; используется тип &lt;a href=\"https://en.wikipedia.org/wiki/Double-precision_floating-point_format\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Double&lt;/a&gt;. Возможна потеря точности при использовании нестандартных представлений чисел в исходном JSON-документе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"datetime\"&gt;&lt;a href=\"ru/yql/types/primitive.html#datetime\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дата и время&lt;/span&gt;&lt;/a&gt;Дата и время&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;th&gt;Примечания&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Date&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Дата, точность до дней&lt;/td&gt;\n&lt;td&gt;Диапазон значений для всех временных типов кроме &lt;code&gt;Interval&lt;/code&gt; — от нуля часов 01.01.1970 до нуля часов 01.01.2106. Внутреннее представление &lt;code&gt;Date&lt;/code&gt; – беззнаковое целое 16 бит&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Datetime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Дата/время, точность до секунд&lt;/td&gt;\n&lt;td&gt;Внутреннее представление – беззнаковое целое 32 бит&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Timestamp&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Дата/время, точность до микросекунд&lt;/td&gt;\n&lt;td&gt;Внутреннее представление – беззнаковое целое 64 бит&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Interval&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Интервал времени (знаковый), точность до микросекунд&lt;/td&gt;\n&lt;td&gt;Диапазон значений – от -136 лет до +136 лет. Внутреннее представление – знаковое целое 64 бит. Не может быть использован в первичном ключе&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;TzDate&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Дата с меткой временной зоны, точность до дней&lt;/td&gt;\n&lt;td&gt;Не поддерживается в столбцах таблиц&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;TzDateTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Дата/время с меткой временной зоны, точность до секунд&lt;/td&gt;\n&lt;td&gt;Не поддерживается в столбцах таблиц&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;TzTimestamp&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Дата/время с меткой временной зоны, точность до микросекунд&lt;/td&gt;\n&lt;td&gt;Не поддерживается в столбцах таблиц&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"osobennosti-podderzhki-tipov-s-metkoj-vremennoj-zony\"&gt;&lt;a href=\"ru/yql/types/primitive.html#osobennosti-podderzhki-tipov-s-metkoj-vremennoj-zony\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Особенности поддержки типов с меткой временной зоны&lt;/span&gt;&lt;/a&gt;Особенности поддержки типов с меткой временной зоны&lt;/h3&gt;\n&lt;p&gt;Метка временной зоны у типов &lt;code&gt;TzDate&lt;/code&gt;, &lt;code&gt;TzDatetime&lt;/code&gt;, &lt;code&gt;TzTimestamp&lt;/code&gt; это атрибут, который используется:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;При преобразовании (&lt;a href=\"ru/yql/syntax/expressions.html#cast\"&gt;CAST&lt;/a&gt;, &lt;a href=\"ru/yql/udf/list/datetime.html#parse\"&gt;DateTime::Parse&lt;/a&gt;, &lt;a href=\"ru/yql/udf/list/datetime.html#format\"&gt;DateTime::Format&lt;/a&gt;) в строку и из строки.&lt;/li&gt;\n&lt;li&gt;В &lt;a href=\"ru/yql/udf/list/datetime.html#split\"&gt;DateTime::Split&lt;/a&gt; — появляется компонент таймзоны в &lt;code&gt;Resource&amp;lt;TM&amp;gt;&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Само значение позиции во времени у этих типов хранится в UTC, и метка таймзоны никак не участвует в прочих расчётах. Например:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT --эти выражения всегда true для любых таймзон: таймзона не влияет на точку во времени.\n    AddTimezone(CurrentUtcDate(), \"Europe/Moscow\") ==\n        AddTimezone(CurrentUtcDate(), \"America/New_York\"),\n    AddTimezone(CurrentUtcDatetime(), \"Europe/Moscow\") ==\n        AddTimezone(CurrentUtcDatetime(), \"America/New_York\");\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"399\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-399\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-399\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-399.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Важно понимать, что при преобразованиях между &lt;code&gt;TzDate&lt;/code&gt; и &lt;code&gt;TzDatetime&lt;/code&gt; или &lt;code&gt;TzTimestamp&lt;/code&gt; дате соответствует не полночь по локальному времени таймзоны, а полночь по UTC для даты в UTC.&lt;/p&gt;\n&lt;h2 id=\"cast\"&gt;&lt;a href=\"ru/yql/types/primitive.html#cast\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Приведение простых типов данных&lt;/span&gt;&lt;/a&gt;Приведение простых типов данных&lt;/h2&gt;\n&lt;h3 id=\"explicit-cast\"&gt;&lt;a href=\"ru/yql/types/primitive.html#explicit-cast\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Явное приведение&lt;/span&gt;&lt;/a&gt;Явное приведение&lt;/h3&gt;\n&lt;p&gt;Явное приведение при помощи &lt;a href=\"ru/yql/syntax/expressions.html#cast\"&gt;CAST&lt;/a&gt;:&lt;/p&gt;\n&lt;h4 id=\"privedenie-k-chislennym-tipam\"&gt;&lt;a href=\"ru/yql/types/primitive.html#privedenie-k-chislennym-tipam\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Приведение к численным типам&lt;/span&gt;&lt;/a&gt;Приведение к численным типам&lt;/h4&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;Bool&lt;/th&gt;\n&lt;th&gt;Int8&lt;/th&gt;\n&lt;th&gt;Int16&lt;/th&gt;\n&lt;th&gt;Int32&lt;/th&gt;\n&lt;th&gt;Int64&lt;/th&gt;\n&lt;th&gt;Uint8&lt;/th&gt;\n&lt;th&gt;Uint16&lt;/th&gt;\n&lt;th&gt;Uint32&lt;/th&gt;\n&lt;th&gt;Uint64&lt;/th&gt;\n&lt;th&gt;Float&lt;/th&gt;\n&lt;th&gt;Double&lt;/th&gt;\n&lt;th&gt;Decimal&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Bool&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Да&lt;sup&gt;1&lt;/sup&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;sup&gt;1&lt;/sup&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;sup&gt;1&lt;/sup&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;sup&gt;1&lt;/sup&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;sup&gt;1&lt;/sup&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;sup&gt;1&lt;/sup&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;sup&gt;1&lt;/sup&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;sup&gt;1&lt;/sup&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;sup&gt;1&lt;/sup&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;sup&gt;1&lt;/sup&gt;&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Int8&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;Да&lt;sup&gt;2&lt;/sup&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;td&gt;Да&lt; ;Да&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;sup&gt;1&lt;/sup&gt; При помощи встроенной функции &lt;a href=\"ru/yql/udf/list/yson.html#ysonconvertto\"&gt;Yson::ConvertTo&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"primery\"&gt;&lt;a href=\"ru/yql/types/primitive.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    CAST(\"12345\" AS Double),                -- 12345.0\n    CAST(1.2345 AS Uint8),                  -- 1\n    CAST(12345 AS String),                  -- \"12345\"\n    CAST(\"1.2345\" AS Decimal(5, 2)),        -- 1.23\n    CAST(\"xyz\" AS Uint64) IS NULL,          -- true, так как не удалось\n    CAST(-1 AS Uint16) IS NULL,             -- true, отрицательное в беззнаковое\n    CAST([-1, 0, 1] AS List&amp;lt;Uint8?&amp;gt;),             -- [null, 0, 1]\n        --Тип элемента опциональный: неудачный элемент в null.\n    CAST([\"3.14\", \"bad\", \"42\"] AS List&amp;lt;Float&amp;gt;),   -- [3.14, 42]\n        --Тип элемента не опциональный: неудачный элемент удалён.\n    CAST(255 AS Uint8),                     -- 255\n    CAST(256 AS Uint8) IS NULL              -- true, выходит за диапазон\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"2164\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;a
