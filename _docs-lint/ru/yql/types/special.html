            {"data":{"leading":false,"html":"&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Callable&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Вызываемое значение, которое можно исполнить, передав аргументы в круглых скобках в SQL-синтаксисе YQL.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Resource&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Непрозрачный указатель на ресурс, который можно передавать между пользовательскими функциями (UDF, user defined function). Тип возвращаемого и принимаемого ресурса объявляется внутри функции строковой меткой. При передаче ресурса YQL проверяет совпадение меток, чтобы предотвратить передачу ресурсов между несовместимыми функциями. В случае несовпадения меток происходит ошибка типизации.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Tagged&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Возможность дать прикладное имя какому-либо другому типу.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Generic&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип данных у типа данных.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Unit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип данных у невычисляемых сущностей (источники и приемники данных, атомы и т. п.).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Сингулярный тип данных с единственным возможным значением null. Является типом литерала &lt;code&gt;NULL&lt;/code&gt; и может преобразовываться к любому &lt;code&gt;Optional&lt;/code&gt; типу.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Void&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Сингулярный тип данных с единственным возможным значением &lt;code&gt;null&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;EmptyList&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;сингулярный тип данных с единственным возможным значением []; является типом литерала &lt;code&gt;[]&lt;/code&gt; и может преобразовываться к любому &lt;code&gt;List&lt;/code&gt; типу.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;EmptyDict&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;сингулярный тип данных с единственным возможным значением {}; является типом литерала &lt;code&gt;{}&lt;/code&gt; и может преобразовываться к любому &lt;code&gt;Dict&lt;/code&gt; или &lt;code&gt;Set&lt;/code&gt; типу.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/types/special.md","sourcePath":"ru/yql/types/special.md"},"headings":[],"title":"Специальные типы данных"},"router":{"pathname":"ru/yql/types/special","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
