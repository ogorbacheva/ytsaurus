        <title>Правила преобразования типов через оператор <a href="ru/yql/syntax/expressions.html#cast">CAST</a> | YTsaurus</title>

        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"pravila-preobrazovaniya-primitivnyh-tipov-dannyh\"&gt;&lt;a href=\"ru/yql/types/cast.html#pravila-preobrazovaniya-primitivnyh-tipov-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Правила преобразования примитивных типов данных&lt;/span&gt;&lt;/a&gt;Правила преобразования примитивных типов данных&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;В процессе преобразования примитивных типов данных часть исходной информации может быть отброшена, если она не содержится в целевом типе. Например:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Дробная часть &lt;code&gt;Float&lt;/code&gt;/&lt;code&gt;Double&lt;/code&gt; при преобразовании в целочисленные типы;&lt;/li&gt;\n&lt;li&gt;Время &lt;code&gt;Datetime&lt;/code&gt;/&lt;code&gt;Timestamp&lt;/code&gt; при преобразовании в &lt;code&gt;Date&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Таймзона при преобразовании из типов с таймзоной к типу даты/времени без таймзоны.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Если для определённого сочетания исходного и целевого типа преобразование не может быть выполнено для всех возможных значений исходного типа, то при неудачном преобразовании &lt;code&gt;CAST&lt;/code&gt; вернёт &lt;code&gt;NULL&lt;/code&gt;. В таких случаях к типу возвращаемого значения добавляется один уровень &lt;code&gt;Optional&lt;/code&gt;, если его не было. Например, конструкции: &lt;code&gt;CAST(\"3.14\" AS Float?)&lt;/code&gt; и &lt;code&gt;CAST(\"3.14\" AS Float)&lt;/code&gt; полностью эквиваленты и возвращают &lt;code&gt;Float?&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Если же преобразование возможно для всех значений исходного типа, то добавление '?' работает как &lt;code&gt;Just&lt;/code&gt; сверху: &lt;code&gt;CAST(3.14 AS Utf8?)&lt;/code&gt; то же, что и &lt;code&gt;Just(CAST(3.14 AS Utf8))&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Все сочетания примитивных типов, для которых возможен &lt;code&gt;CAST&lt;/code&gt; описаны &lt;a href=\"ru/yql/types/primitive.html\"&gt;тут&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"pravila-preobrazovanij-dlya-kontejnerov\"&gt;&lt;a href=\"ru/yql/types/cast.html#pravila-preobrazovanij-dlya-kontejnerov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Правила преобразований для контейнеров&lt;/span&gt;&lt;/a&gt;Правила преобразований для контейнеров&lt;/h2&gt;\n&lt;h3 id=\"pravila-dlya-optional\"&gt;&lt;a href=\"ru/yql/types/cast.html#pravila-dlya-optional\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Правила для Optional&lt;/span&gt;&lt;/a&gt;Правила для Optional&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;Если для целевого типа задан больший уровень &lt;code&gt;Optional&lt;/code&gt; чем для исходного то это эквивалентно добавлению &lt;code&gt;Just&lt;/code&gt; поверх &lt;code&gt;CAST&lt;/code&gt; с меньшим уровнем &lt;code&gt;Optional&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Если же больший уровень &lt;code&gt;Optional&lt;/code&gt; у исходного типа, то &lt;code&gt;NULL&lt;/code&gt; на любом уровне больше целевого приводит к &lt;code&gt;NULL&lt;/code&gt; в результате.&lt;/li&gt;\n&lt;li&gt;При равных уровнях &lt;code&gt;Optional&lt;/code&gt; значение &lt;code&gt;NULL&lt;/code&gt; остаётся на том же уровне.&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    CAST(1 AS Int32?),                  -- тоже что и Just(1)\n    CAST(Just(2/1) AS Float??),         -- [2]\n    CAST(Just(3/0) AS Float??) IS NULL; -- false: результат Just(NULL)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"63\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-63\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-63\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-63.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"pravila-dlya-list/dict\"&gt;&lt;a href=\"ru/yql/types/cast.html#pravila-dlya-list/dict\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Правила для List/Dict&lt;/span&gt;&lt;/a&gt;Правила для List/Dict&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;Список формируется путём выполнения &lt;code&gt;CAST&lt;/code&gt; для каждого элемента исходного списка в тип элемента целевого типа.&lt;/li&gt;\n&lt;li&gt;Если тип элемента целевого типа не опциональный, а &lt;code&gt;CAST&lt;/code&gt; элемента может быть неуспешным, то такие преобразования отбрасываются. В этом случае список в результате может быть меньшей длины или вовсе пустой, если успешных преобразований не было.&lt;/li&gt;\n&lt;li&gt;Для словарей преобразование выполняется полностью аналогично спискам, выполняя &lt;code&gt;CAST&lt;/code&gt; для ключей и значений.&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    CAST([-1, 0, 1] AS List&amp;lt;Uint8?&amp;gt;),             -- [null, 0, 1]\n    CAST([\"3.14\", \"bad\", \"42\"] AS List&amp;lt;Float&amp;gt;),   -- [3.14, 42]\n\n    CAST({-1:3.14, 7:1.6} AS Dict&amp;lt;Uint8, Utf8&amp;gt;),  -- {7: \"1.6\"}\n    CAST({-1:3.14, 7:1.6} AS Dict&amp;lt;Uint8?, Utf8&amp;gt;); -- {7: \"1.6\", null:\"3.14\"}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"84\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-84\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-84\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-84.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"pravila-dlya-struct/tuple\"&gt;&lt;a href=\"ru/yql/types/cast.html#pravila-dlya-struct/tuple\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Правила для Struct/Tuple&lt;/span&gt;&lt;/a&gt;Правила для Struct/Tuple&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;Структура или кортеж формируется путём выполнения &lt;code&gt;CAST&lt;/code&gt; для каждого элемента исходного типа в элемент с тем же именем или индексом целевого типа.&lt;/li&gt;\n&lt;li&gt;Если какое-то поле отсутствует в целевом типе, оно просто отбрасывается.&lt;/li&gt;\n&lt;li&gt;Если какое-то поле отсутствует в типе исходного значения, то оно может быть добавлено только если является опциональным, и получает значение &lt;code&gt;NULL&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Если какое-то поле не является опциональным в целевом типе, но его преобразование может быть неуспешным, то &lt;code&gt;CAST&lt;/code&gt; добавляет опциональность на уровень структуры или кортежа и может вернуть &lt;code&gt;NULL&lt;/code&gt; для всего результата.&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    CAST((-1, 0, 1) AS Tuple&amp;lt;Uint16?, Uint16?, Utf8&amp;gt;), -- (null, 0, \"1\")\n    CAST((-2, 0) AS Tuple&amp;lt;Uint16, Utf8&amp;gt;),              -- null\n    CAST((3, 4) AS Tuple&amp;lt;Uint16, String&amp;gt;),             -- (3, \"4\") тип Tuple&amp;lt;Uint16, String&amp;gt;?\n    CAST((\"4\",) AS Tuple&amp;lt;Uint16, String?&amp;gt;),            -- (4, null)\n    CAST((5, 6, null) AS Tuple&amp;lt;Uint8?&amp;gt;);               -- (5,)  элементы удалены.\n\nSELECT -- Одно поле удалено и одно добавлено: (\"three\":null, \"two\": \"42\")\n    CAST(&amp;lt;|one:\"8912\", two:42|&amp;gt; AS Struct&amp;lt;two:Utf8, three:Date?&amp;gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"110\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-110\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-110\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-110.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"pravila-dlya-variant\"&gt;&lt;a href=\"ru/yql/types/cast.html#pravila-dlya-variant\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Правила для Variant&lt;/span&gt;&lt;/a&gt;Правила для Variant&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;Для варианта с определёнными именем или индексом выполняется преобразование в вариант с тем же именем или индексом.&lt;/li&gt;\n&lt;li&gt;Если преобразование для варианта может быть неуспешным и тип этого варианта не опциональный, то &lt;code&gt;CAST&lt;/code&gt; добавляет опциональность на верхний уровень и может вернуть &lt;code&gt;NULL&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Если какой-то вариант отсутствует в целевом типе, то &lt;code&gt;CAST&lt;/code&gt; добавляет опциональность на верхний уровень и для такого значения возвращает &lt;code&gt;NULL&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"vlozhennye-kontejnery\"&gt;&lt;a href=\"ru/yql/types/cast.html#vlozhennye-kontejnery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вложенные контейнеры&lt;/span&gt;&lt;/a&gt;Вложенные контейнеры&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;Все вышеперечисленные правила работают рекурсивно для вложенных контейнеров.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/types/cast.md","sourcePath":"ru/yql/types/cast.md"},"headings":[{"title":"Правила преобразования примитивных типов данных","href":"ru/yql/types/cast.html#pravila-preobrazovaniya-primitivnyh-tipov-dannyh","level":2},{"title":"Правила преобразований для контейнеров","href":"ru/yql/types/cast.html#pravila-preobrazovanij-dlya-kontejnerov","level":2,"items":[{"title":"Правила для Optional","href":"ru/yql/types/cast.html#pravila-dlya-optional","level":3},{"title":"Правила для List/Dict","href":"ru/yql/types/cast.html#pravila-dlya-list/dict","level":3},{"title":"Правила для Struct/Tuple","href":"ru/yql/types/cast.html#pravila-dlya-struct/tuple","level":3},{"title":"Правила для Variant","href":"ru/yql/types/cast.html#pravila-dlya-variant","level":3},{"title":"Вложенные контейнеры","href":"ru/yql/types/cast.html#vlozhennye-kontejnery","level":3}]}],"title":"Правила преобразования типов через оператор &lt;a href=\"ru/yql/syntax/expressions.html#cast\"&gt;CAST&lt;/a&gt;"},"router":{"pathname":"ru/yql/types/cast","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
