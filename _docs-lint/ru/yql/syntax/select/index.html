        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"ru/yql/syntax/select/index.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Возвращает результат вычисления выражений, указанных после &lt;code&gt;SELECT&lt;/code&gt;. Может использоваться в сочетании с другими операциями для получения иного эффекта.&lt;/p&gt;\n&lt;p&gt;Примеры:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT \"Hello, world!\";\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"9\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-9\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-9\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-9.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT 2 + 2;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"10\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-10\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-10\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-10.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"selectexec\"&gt;&lt;a href=\"ru/yql/syntax/select/index.html#selectexec\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Процедура выполнения SELECT&lt;/span&gt;&lt;/a&gt;Процедура выполнения SELECT&lt;/h2&gt;\n&lt;p&gt;Результат запроса &lt;code&gt;SELECT&lt;/code&gt; вычисляется следующим образом:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;определяется набор входных таблиц – вычисляются выражения после &lt;a href=\"ru/yql/syntax/select/from.html\"&gt;FROM&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;к входным таблицам применяется &lt;a href=\"ru/yql/syntax/select/sample.html\"&gt;SAMPLE&lt;/a&gt; / &lt;a href=\"ru/yql/syntax/select/sample.html\"&gt;TABLESAMPLE&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;выполняется &lt;a href=\"ru/yql/syntax/flatten.html#flatten-columns\"&gt;FLATTEN COLUMNS&lt;/a&gt; или &lt;a href=\"ru/yql/syntax/flatten.html\"&gt;FLATTEN BY&lt;/a&gt;; алиасы, заданные во &lt;code&gt;FLATTEN BY&lt;/code&gt;, становятся видны после этой точки;&lt;/li&gt;\n&lt;li&gt;выполняются все &lt;a href=\"ru/yql/syntax/join.html\"&gt;JOIN&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;к полученным данным добавляются (или заменяются) колонки, заданные в &lt;a href=\"ru/yql/syntax/group_by.html\"&gt;GROUP BY ... AS ...&lt;/a&gt; (выполняется после &lt;code&gt;WHERE&lt;/code&gt; начиная с версии &lt;a href=\"ru/yql/changelog/2025.02.html#group-by-expr-alias-where\"&gt;2025.02&lt;/a&gt;);&lt;/li&gt;\n&lt;li&gt;выполняется &lt;a href=\"ru/yql/syntax/select/where.html\"&gt;WHERE&lt;/a&gt; - все данные не удовлетворяющие предикату отфильтровываются;&lt;/li&gt;\n&lt;li&gt;выполняется &lt;a href=\"ru/yql/syntax/group_by.html\"&gt;GROUP BY&lt;/a&gt;, вычисляются значения агрегатных функций;&lt;/li&gt;\n&lt;li&gt;выполняется фильтрация &lt;a href=\"ru/yql/syntax/group_by.html#having\"&gt;HAVING&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;вычисляются значения &lt;a href=\"ru/yql/syntax/window.html\"&gt;оконных функций&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;вычисляются выражения в &lt;code&gt;SELECT&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;выражениям в &lt;code&gt;SELECT&lt;/code&gt; назначаются имена заданные алиасами;&lt;/li&gt;\n&lt;li&gt;к полученным таким образом колонкам применяется top-level &lt;a href=\"ru/yql/syntax/select/distinct.html\"&gt;DISTINCT&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;таким же образом вычисляются все подзапросы в операторах &lt;a href=\"ru/yql/syntax/select/operators.html#union\"&gt;UNION [ALL]&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/select/operators.html#intersect\"&gt;INTERSECT [ALL]&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/select/operators.html#except\"&gt;EXCEPT [ALL]&lt;/a&gt; и выполняется их объединение, пересечение, исключение соответственно; в текущей реализации комбинация &lt;code&gt;INTERSECT [ALL]&lt;/code&gt;, &lt;code&gt;EXCEPT [ALL]&lt;/code&gt; и &lt;code&gt;UNION [ALL]&lt;/code&gt; не поддерживается, также не поддерживается использование более одного оператора &lt;code&gt;INTERSECT [ALL]&lt;/code&gt; или &lt;code&gt;EXCEPT [ALL]&lt;/code&gt; в &lt;code&gt;SELECT&lt;/code&gt; выражении;&lt;/li&gt;\n&lt;li&gt;выполняется сортировка согласно &lt;a href=\"ru/yql/syntax/select/order_by.html\"&gt;ORDER BY&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;к полученному результату применяются &lt;a href=\"ru/yql/syntax/select/limit_offset.html\"&gt;OFFSET и LIMIT&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"orderedcolumns\"&gt;&lt;a href=\"ru/yql/syntax/select/index.html#orderedcolumns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Порядок колонок в YQL&lt;/span&gt;&lt;/a&gt;Порядок колонок в YQL&lt;/h2&gt;\n&lt;p&gt;В стандартном SQL порядок колонок указанных в проекции (в &lt;code&gt;SELECT&lt;/code&gt;) имеет значение. Помимо того, что порядок колонок должен сохраняться при отображении результатов запроса или при записи в новую таблицу, некоторые конструкции SQL этот порядок используют.&lt;br /&gt;\nЭто относится в том числе к операторам &lt;a href=\"ru/yql/syntax/select/operators.html#union\"&gt;UNION [ALL]&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/select/operators.html#intersect\"&gt;INTERSECT [ALL]&lt;/a&gt;, &lt;a href=\"ru/yql/syntax/select/operators.html#except\"&gt;EXCEPT [ALL]&lt;/a&gt; и к позиционному &lt;a href=\"ru/yql/syntax/select/order_by.html\"&gt;ORDER BY&lt;/a&gt; (ORDER BY ordinal).&lt;/p&gt;\n&lt;p&gt;По умолчанию в YQL порядок колонок игнорируется:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;порядок колонок в выходных таблицах и в результатах запроса не определен&lt;/li&gt;\n&lt;li&gt;схема данных результата &lt;code&gt;UNION [ALL]&lt;/code&gt;, &lt;code&gt;INTERSECT [ALL]&lt;/code&gt; и &lt;code&gt;EXCEPT [ALL]&lt;/code&gt; выводится по именам колонок, а не по позициям&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;При включении &lt;code&gt;PRAGMA OrderedColumns;&lt;/code&gt; порядок колонок сохраняется в результатах запроса и выводится из порядка колонок во входных таблицах по следующим правилам:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;SELECT&lt;/code&gt; с явным перечислением колонок задает соответствующий порядок;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;SELECT&lt;/code&gt; со звездочкой (&lt;code&gt;SELECT * FROM ...&lt;/code&gt;) наследует порядок из своего входа;&lt;/li&gt;\n&lt;li&gt;порядок колонок после &lt;a href=\"ru/yql/syntax/join.html\"&gt;JOIN&lt;/a&gt;: сначала колонки левой стороны, потом правой. Если порядок какой-либо из сторон присутствующей в выходе &lt;code&gt;JOIN&lt;/code&gt; не определен, порядок колонок результата также не определен;&lt;/li&gt;\n&lt;li&gt;порядок &lt;code&gt;UNION [ALL]&lt;/code&gt;, &lt;code&gt;INTERSECT [ALL]&lt;/code&gt; и &lt;code&gt;EXCEPT [ALL]&lt;/code&gt; зависит от &lt;a href=\"ru/yql/syntax/select/operators.html#positional-mode\"&gt;режима выполнения&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;порядок колонок для &lt;a href=\"ru/yql/syntax/select/from_as_table.html\"&gt;AS_TABLE&lt;/a&gt; не определен;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"combining-queries\"&gt;&lt;a href=\"ru/yql/syntax/select/index.html#combining-queries\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Комбинация запросов&lt;/span&gt;&lt;/a&gt;Комбинация запросов&lt;/h2&gt;\n&lt;p&gt;Результаты нескольких &lt;code&gt;SELECT&lt;/code&gt; (или подзапросов) могут быть объединены с помощью ключевых слов &lt;code&gt;UNION&lt;/code&gt; и &lt;code&gt;UNION ALL&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;query1 UNION [ALL] query2 (UNION [ALL] query3 ...)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"151\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-151\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-151\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-151.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Объединение более двух запросов интерпретируется как левоассоциативная операция, то есть&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;query1 UNION query2 UNION ALL query3\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"155\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-155\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-155\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-155.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;интерпретируется как&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;(query1 UNION query2) UNION ALL query3\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"159\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-159\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-159\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-159.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Пересечение только двух &lt;code&gt;SELECT&lt;/code&gt; (или подзапросов) может быть вычислено с помощью ключевых слов &lt;code&gt;INTERSECT&lt;/code&gt; и &lt;code&gt;INTERSECT ALL&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;query1 INTERSECT query2\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"163\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-163\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-163\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-163.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Запрос из нескольких операторов &lt;code&gt;INTERSECT [ALL]&lt;/code&gt; не допускается.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;query1 INTERSECT query2 INTERSECT query3 ... -- ошибка\n\nquery1 INTERSECT query2 INTERSECT ALL query3 ... -- ошибка\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"167\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-167\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-167\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-167.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Исключение только двух &lt;code&gt;SELECT&lt;/code&gt; (или подзапросов) может быть вычислено с помощью ключевых слов &lt;code&gt;EXCEPT&lt;/code&gt; и &lt;code&gt;EXCEPT ALL&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;query1 EXCEPT query2\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"171\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-171\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-171\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-171.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Запрос из нескольких операторов &lt;code&gt;EXCEPT [ALL]&lt;/code&gt; не допускается.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;query1 EXCEPT query2 EXCEPT query3 -- ошибка\n\nquery1 EXCEPT query2 EXCEPT ALL query3 -- ошибка\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"175\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-175\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-175\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-175.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Одновременное использование двух разных операторов &lt;code&gt;UNION&lt;/code&gt;, &lt;code&gt;INTERSECT&lt;/code&gt; и &lt;code&gt;EXCEPT&lt;/code&gt; в одном запросе не допускается.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;query1 UNION query2 INTERSECT query3 -- ошибка\n\nquery1 UNION query2 EXCEPT query3 -- ошибка\n\nquery1 INTERSECT query2 EXCEPT query3 -- ошибка\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"179\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-179\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-179\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-179.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Данное поведение не зависит от наличия или отсутствия &lt;code&gt;DISTINCT&lt;/code&gt; / &lt;code&gt;ALL&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;query1 UNION ALL query2 INTERSECT ALL query3 -- ошибка\n\nquery1 UNION ALL query2 EXCEPT ALL query3 -- ошибка\n\nquery1 INTERSECT ALL query2 EXCEPT ALL query3 -- ошибка\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"183\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-183\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-183\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-183.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Только &lt;code&gt;UNION&lt;/code&gt; и &lt;code&gt;UNION ALL&lt;/code&gt; могут использоваться несколько раз (больше 1). Использование &lt;code&gt;INTERSECT&lt;/code&gt;, &lt;code&gt;INTERSECT ALL&lt;/code&gt;, &lt;code&gt;EXCEPT&lt;/code&gt; и &lt;code&gt;EXCEPT ALL&lt;/code&gt; несколько раз не допускается.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;При наличии &lt;code&gt;ORDER BY/LIMIT/DISCARD/INTO RESULT&lt;/code&gt; в объединяемых подзапросах применяются следующие правила:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;ORDER BY/LIMIT/INTO RESULT&lt;/code&gt; допускается только после последнего подзапроса;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DISCARD&lt;/code&gt; допускается только перед первым подзапросом;&lt;/li&gt;\n&lt;li&gt;указанные операторы действуют на результат &lt;code&gt;UNION [ALL]&lt;/code&gt;, &lt;code&gt;INTERSECT [ALL]&lt;/code&gt; или &lt;code&gt;EXCEPT [ALL]&lt;/code&gt;, а не на подзапрос;&lt;/li&gt;\n&lt;li&gt;чтобы применить оператор к подзапросу, подзапрос необходимо взять в скобки.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"obrashenie-k-neskolkim-tablicam-v-odnom-zaprose\"&gt;&lt;a href=\"ru/yql/syntax/select/index.html#obrashenie-k-neskolkim-tablicam-v-odnom-zaprose\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обращение к нескольким таблицам в одном запросе&lt;/span&gt;&lt;/a&gt;Обращение к нескольким таблицам в одном запросе&lt;/h2&gt;\n&lt;p&gt;В стандартном SQL для выполнения запроса по нескольким таблицам используется &lt;a href=\"ru/yql/syntax/select/operators.html#union-all\"&gt;UNION ALL&lt;/a&gt;, который объединяет результаты двух и более &lt;code&gt;SELECT&lt;/code&gt;. Это не совсем удобно для сценария использования, в котором требуется выполнить один и тот же запрос по нескольким таблицам (например, содержащим данные на разные даты). В YQL, чтобы было удобнее, в &lt;code&gt;SELECT&lt;/code&gt; после &lt;code&gt;FROM&lt;/code&gt; можно указывать не только одну таблицу или подзапрос, но и вызывать встроенные функции, позволяющие объединять данные нескольких таблиц.&lt;/p&gt;\n&lt;p&gt;Для этих целей определены следующие функции:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;CONCAT(`table1`, `table2`, `table3` VIEW view_name, ...)&lt;/code&gt; — объединяет все перечисленные в аргументах таблицы.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;EACH($list_of_strings)&lt;/code&gt; или &lt;code&gt;EACH($list_of_strings VIEW view_name)&lt;/code&gt; — объединяет все таблицы, имена которых перечислены в списке строк. Опционально можно передать несколько списков в отдельных аргументах по аналогии с &lt;code&gt;CONCAT&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Порядок, в котором будут объединены таблицы, всеми вышеперечисленными функциями не гарантируется.&lt;/p&gt;\n&lt;p&gt;Список таблиц вычисляется &lt;strong&gt;до&lt;/strong&gt; запуска самого запроса. Поэтому созданные в процессе запроса таблицы не попадут в результаты функции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;По умолчанию схемы всех участвующих таблиц объединяются по правилам &lt;a href=\"ru/yql/syntax/select/operators.html#union-all\"&gt;UNION ALL&lt;/a&gt;. Если объединение схем не желательно, то можно использовать функции с суффиксом &lt;code&gt;_STRICT&lt;/code&gt;, например &lt;code&gt;CONCAT_STRICT&lt;/code&gt;, которые работают полностью аналогично оригинальным, но считают любое расхождение в схемах таблиц ошибкой.&lt;/p&gt;\n&lt;p&gt;Все аргументы описанных выше функций могут быть объявлены отдельно через &lt;a href=\"ru/yql/syntax/expressions.html#named-nodes\"&gt;именованные выражения&lt;/a&gt;. В этом случае в них также допустимы и простые выражения посредством неявного вызова &lt;a href=\"ru/yql/builtins/basic.html#evaluate_expr_atom\"&gt;EvaluateExpr&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Имя исходной таблицы, из которой изначально была получена каждая строка, можно получить при помощи функции &lt;a href=\"ru/yql/builtins/basic.html#tablepath\"&gt;TablePath()&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"primery\"&gt;&lt;a href=\"ru/yql/syntax/select/index.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE some_cluster;\nSELECT * FROM CONCAT(\n  `table1`,\n  `table2`,\n  `table3`);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"259\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-259\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-259\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-259.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;USE some_cluster;\n$indices = ListFromRange(1, 4);\n$tables = ListMap($indices, ($index) -&amp;gt; {\n    RETURN \"table\" || CAST($index AS String);\n});\nSELECT * FROM EACH($tables); -- идентично предыдущему примеру\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"260\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-260\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-260\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-260.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"podderzhivaemye-konstrukcii-v-select\"&gt;&lt;a href=\"ru/yql/syntax/select/index.html#podderzhivaemye-konstrukcii-v-select\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поддерживаемые конструкции в SELECT&lt;/span&gt;&lt;/a&gt;Поддерживаемые конструкции в SELECT&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/select/from.html\"&gt;FROM&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/select/from_as_table.html\"&gt;FROM AS_TABLE&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/select/from_select.html\"&gt;FROM SELECT&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/select/distinct.html\"&gt;DISTINCT&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/select/unique_distinct_hints.html\"&gt;UNIQUE DISTINCT&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/select/operators.html\"&gt;UNION INTERSECT EXCEPT&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/select/with.html\"&gt;WITH&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/select/without.html\"&gt;WITHOUT&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/select/where.html\"&gt;WHERE&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/select/order_by.html\"&gt;ORDER BY&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/select/assume_order_by.html\"&gt;ASSUME ORDER BY&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/select/limit_offset.html\"&gt;LIMIT OFFSET&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/select/sample.html\"&gt;SAMPLE&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/select/sample.html\"&gt;TABLESAMPLE&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/select/concat.html\"&gt;CONCAT&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/syntax/select/index.md","sourcePath":"ru/yql/syntax/select/index.md"},"headings":[{"title":"Определение","href":"ru/yql/syntax/select/index.html#opredelenie","level":2},{"title":"Процедура выполнения SELECT","href":"ru/yql/syntax/select/index.html#selectexec","level":2},{"title":"Порядок колонок в YQL","href":"ru/yql/syntax/select/index.html#orderedcolumns","level":2},{"title":"Комбинация запросов","href":"ru/yql/syntax/select/index.html#combining-queries","level":2},{"title":"Обращение к нескольким таблицам в одном запросе","href":"ru/yql/syntax/select/index.html#obrashenie-k-neskolkim-tablicam-v-odnom-zaprose","level":2},{"title":"Поддерживаемые конструкции в SELECT","href":"ru/yql/syntax/select/index.html#podderzhivaemye-konstrukcii-v-select","level":2}],"title":"Обзор SELECT"},"router":{"pathname":"ru/yql/syntax/select/index","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
