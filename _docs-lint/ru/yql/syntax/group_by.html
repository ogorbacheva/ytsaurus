        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"group-by\"&gt;&lt;a href=\"ru/yql/syntax/group_by.html#group-by\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GROUP BY&lt;/span&gt;&lt;/a&gt;GROUP BY&lt;/h2&gt;\n&lt;p&gt;Группирует результаты &lt;code&gt;SELECT&lt;/code&gt; по значениям указанных столбцов или выражений. Вместе с &lt;code&gt;GROUP BY&lt;/code&gt; часто применяются &lt;a href=\"ru/yql/builtins/aggregation.html\"&gt;агрегатные функции&lt;/a&gt; (&lt;code&gt;COUNT&lt;/code&gt;, &lt;code&gt;MAX&lt;/code&gt;, &lt;code&gt;MIN&lt;/code&gt;, &lt;code&gt;SUM&lt;/code&gt;, &lt;code&gt;AVG&lt;/code&gt;) для выполнения вычислений в каждой группе.&lt;/p&gt;\n&lt;h4 id=\"sintaksis\"&gt;&lt;a href=\"ru/yql/syntax/group_by.html#sintaksis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Синтаксис&lt;/span&gt;&lt;/a&gt;Синтаксис&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT                             -- В SELECT можно использовать:\n    column1,                       -- ключевые колонки, заданные в GROUP BY\n    key_n,                         -- именованные выражения, заданные в GROUP BY\n    column1 + key_n,               -- произвольные неагрегатные функции от них\n    Aggr_Func1( column2 ),         -- агрегатные функции, содержащие в аргументах любые колонки,\n    Aggr_Func2( key_n + column2 ), --   включая именованные выражения, заданные в GROUP BY\n    ...\nFROM table\nGROUP BY\n    column1, column2, ...,\n    &amp;lt;expr&amp;gt; AS key_n           -- При группировке по выражению ему может быть задано имя через AS,\n                              -- которое может быть использовано в SELECT\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"9\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-9\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-9\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-9.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Запрос вида &lt;code&gt;SELECT * FROM table GROUP BY k1, k2, ...&lt;/code&gt; вернёт все колонки, перечисленные в GROUP BY, то есть эквивалентен запросу &lt;code&gt;SELECT DISTINCT k1, k2, ... FROM table&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Звёздочка может также применяться в качестве аргумента агрегатной функции &lt;code&gt;COUNT&lt;/code&gt;. &lt;code&gt;COUNT(*)&lt;/code&gt; означает \"число строк в группе\".&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Агрегатные функции не учитывают &lt;code&gt;NULL&lt;/code&gt; в своих аргументах, за исключением функции &lt;code&gt;COUNT&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Также в YQL доступен механизм фабрик агрегатных функций, реализованный с помощью функций &lt;a href=\"ru/yql/builtins/basic.html#aggregationfactory\"&gt;&lt;code&gt;AGGREGATION_FACTORY&lt;/code&gt;&lt;/a&gt; и &lt;a href=\"ru/yql/builtins/aggregation.html#aggregateby\"&gt;&lt;code&gt;AGGREGATE_BY&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"primery\"&gt;&lt;a href=\"ru/yql/syntax/group_by.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT key, COUNT(*) FROM my_table\nGROUP BY key;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"32\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-32\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-32\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-32.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT double_key, COUNT(*) FROM my_table\nGROUP BY key + key AS double_key;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"33\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-33\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-33\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-33.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n   double_key,                           -- ОК: ключевая колонка\n   COUNT(*) AS group_size,               -- OK: COUNT(*)\n   SUM(key + subkey) AS sum1,            -- ОК: агрегатная функция\n   CAST(SUM(1 + 2) AS String) AS sum2,   -- ОК: агрегатная функция с константным аргументом\n   SUM(SUM(1) + key) AS sum3,            -- ОШИБКА: вложенные агрегации не допускаются\n   key AS k1,                            -- ОШИБКА: использование неключевой колонки key без агрегации\n   key * 2 AS dk1,                       -- ОШИБКА в YQL: использование неключевой колонки key без агрегации\nFROM my_table\nGROUP BY\n  key * 2 AS double_key,\n  subkey as sk,\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"34\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-34\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-34\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-34.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Возможность указывать имя для колонки или выражения в &lt;code&gt;GROUP BY .. AS foo&lt;/code&gt; является расширением YQL. Такое имя становится видимым в &lt;code&gt;WHERE&lt;/code&gt; несмотря на то, что фильтрация по &lt;code&gt;WHERE&lt;/code&gt; выполняется &lt;a href=\"ru/yql/syntax/select/index.html#selectexec\"&gt;раньше&lt;/a&gt; группировки. В частности, если в таблице &lt;code&gt;T&lt;/code&gt; есть две колонки &lt;code&gt;foo&lt;/code&gt; и &lt;code&gt;bar&lt;/code&gt;, то в запросе &lt;code&gt;SELECT foo FROM T WHERE foo &amp;gt; 0 GROUP BY bar AS foo&lt;/code&gt; фильтрация фактически произойдет по колонке &lt;code&gt;bar&lt;/code&gt; из исходной таблицы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"session-window\"&gt;&lt;a href=\"ru/yql/syntax/group_by.html#session-window\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GROUP BY ... SessionWindow()&lt;/span&gt;&lt;/a&gt;GROUP BY ... SessionWindow()&lt;/h2&gt;\n&lt;p&gt;В YQL поддерживаются группировки по сессиям. К обычным выражениям в &lt;code&gt;GROUP BY&lt;/code&gt; можно добавить специальную функцию &lt;code&gt;SessionWindow&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  user,\n  session_start,\n  SessionStart() AS same_session_start, -- то же что и session_start\n  COUNT(*) AS session_size,\n  SUM(value) AS sum_over_session,\nFROM my_table\nGROUP BY user, SessionWindow(&amp;lt;time_expr&amp;gt;, &amp;lt;timeout_expr&amp;gt;) AS session_start\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"51\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-51\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-51\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-51.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;При этом происходит следующее:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Входная таблица партиционируется по ключам группировки, указанным в &lt;code&gt;GROUP BY&lt;/code&gt;, без учета SessionWindow (в данном случае по &lt;code&gt;user&lt;/code&gt;). Если кроме SessionWindow в &lt;code&gt;GROUP BY&lt;/code&gt; ничего нет, то входная таблица попадает в одну партицию&lt;/li&gt;\n&lt;li&gt;Каждая партиция делится на непересекающие подмножества строк (сессии). Для этого партиция сортируется по возрастанию значения выражения &lt;code&gt;time_expr&lt;/code&gt;. Границы сессий проводятся между соседними элементами партиции, разница значений &lt;code&gt;time_expr&lt;/code&gt; для которых превышает &lt;code&gt;timeout_expr&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Полученные таким образом сессии и являются финальными партициями, на которых вычисляются агрегатные функции.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Ключевая колонка SessionWindow() (в примере &lt;code&gt;session_start&lt;/code&gt;) имеет значение \"минимальный &lt;code&gt;time_expr&lt;/code&gt; в сессии\".&lt;br /&gt;\nКроме того, при наличии SessionWindow() в &lt;code&gt;GROUP BY&lt;/code&gt; может использоваться специальная агрегатная функция&lt;br /&gt;\n&lt;a href=\"ru/yql/builtins/aggregation.html#session-start\"&gt;SessionStart&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Поддерживается также расширенный вариант SessionWindow с четырьмя аргументами:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;SessionWindow(&amp;lt;order_expr&amp;gt;, &amp;lt;init_lambda&amp;gt;, &amp;lt;update_lambda&amp;gt;, &amp;lt;calculate_lambda&amp;gt;)&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Здесь:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;order_expr&amp;gt;&lt;/code&gt; – выражение по которому сортируется исходная партиция&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;init_lambda&amp;gt;&lt;/code&gt; – лямбда-функция для инициализации состояния расчета сессий. Имеет сигнатуру &lt;code&gt;(TableRow())-&amp;gt;State&lt;/code&gt;. Вызывается один раз на первом (по порядку сортировки) элементе исходной партиции&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;update_lambda&amp;gt;&lt;/code&gt; – лямбда-функция для обновления состояния расчета сессий и определения границ сессий. Имеет сигнатуру &lt;code&gt;(TableRow(), State)-&amp;gt;Tuple&amp;lt;Bool, State&amp;gt;&lt;/code&gt;. Вызывается на каждом элементе исходной партиции, кроме первого. Новое значение состояния вычисляется на основе текущей строки таблицы и предыдущего состояния. Если первый элемент возвращенного кортежа имеет значение &lt;code&gt;True&lt;/code&gt;, то с &lt;em&gt;текущей&lt;/em&gt; строки начнется новая сессия. Ключ новой сессии получается путем применения &lt;code&gt;&amp;lt;calculate_lambda&amp;gt;&lt;/code&gt; ко второму элементу кортежа.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;&amp;lt;calculate_lambda&amp;gt;&lt;/code&gt; – лямбда-функция для вычисления ключа сессии (\"значения\" SessionWindow(), которое также доступно через SessionStart()). Функция имеет сигнатуру &lt;code&gt;(TableRow(), State)-&amp;gt;SessionKey&lt;/code&gt;. Вызывается на первом элементе партиции (после &lt;code&gt;&amp;lt;init_lambda&amp;gt;&lt;/code&gt;) и на тех элементах, для которых &lt;code&gt;&amp;lt;update_lambda&amp;gt;&lt;/code&gt; вернула &lt;code&gt;True&lt;/code&gt; в качестве первого элемента кортежа. Стоит отметить, что для начала новой сессии необходимо, чтобы &lt;code&gt;&amp;lt;calculate_lambda&amp;gt;&lt;/code&gt; вернула значение, которое отличается от предыдущего ключа сессии. При этом сессии с одинаковыми ключами не объединяются. Например, если &lt;code&gt;&amp;lt;calculate_lambda&amp;gt;&lt;/code&gt; последовательно возвращает &lt;code&gt;0, 1, 0, 1&lt;/code&gt;, то это будут четыре различные сессии.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;С помощью расширенного варианта SessionWindow можно решить, например, такую задачу: разделить партицию на сессии как в варианте SessionWindow с двумя аргументами, но с ограничением максимальной длины сессии некоторой константой:&lt;/p&gt;\n&lt;h4 id=\"primer\"&gt;&lt;a href=\"ru/yql/syntax/group_by.html#primer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$max_len = 1000; -- максимальная длина сессии\n$timeout = 100; -- таймаут (timeout_expr в упрощенном варианте SessionWindow)\n\n$init = ($row) -&amp;gt; (AsTuple($row.ts, $row.ts)); -- состояние сессии - тапл из 1) значения временной колонки ts на первой строчке сессии и 2) на текущей строчке\n$update = ($row, $state) -&amp;gt; {\n  $is_end_session = $row.ts - $state.0 &amp;gt; $max_len OR $row.ts - $state.1 &amp;gt; $timeout;\n  $new_state = AsTuple(IF($is_end_session, $row.ts, $state.0), $row.ts);\n  return AsTuple($is_end_session, $new_state);\n};\n$calculate = ($row, $state) -&amp;gt; ($row.ts);\nSELECT\n  user,\n  session_start,\n  SessionStart() AS same_session_start, -- то же что и session_start\n  COUNT(*) AS session_size,\n  SUM(value) AS sum_over_session,\nFROM my_table\nGROUP BY user, SessionWindow(ts, $init, $update, $calculate) AS session_start\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"112\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-112\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-112\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-112.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code&gt;SessionWindow&lt;/code&gt; может использоваться в &lt;code&gt;GROUP BY&lt;/code&gt; только один раз.&lt;/p&gt;\n&lt;h2 id=\"rollup\"&gt;&lt;a href=\"ru/yql/syntax/group_by.html#rollup\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ROLLUP, CUBE и GROUPING SETS&lt;/span&gt;&lt;/a&gt;ROLLUP, CUBE и GROUPING SETS&lt;/h2&gt;\n&lt;p&gt;Результаты вычисления агрегатной функции в виде промежуточных итогов для групп и общих итогов для отдельных столбцов или всей таблицы.&lt;/p&gt;\n&lt;h4 id=\"sintaksis1\"&gt;&lt;a href=\"ru/yql/syntax/group_by.html#sintaksis1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Синтаксис&lt;/span&gt;&lt;/a&gt;Синтаксис&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    c1, c2,                          -- столбцы, по которым производится группировка\n\nAGGREGATE_FUNCTION(c3) AS outcome_c  -- агрегатная функция (SUM, AVG, MIN, MAX, COUNT)\n\nFROM table_name\n\nGROUP BY\n    GROUP_BY_EXTENSION(c1, c2)       -- расширение GROUP BY: ROLLUP, CUBE или GROUPING SETS\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"125\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-125\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-125\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-125.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;ROLLUP&lt;/code&gt; — группирует значения столбцов в порядке их перечисления в аргументах (строго слева направо), формирует промежуточные итоги для каждой группы и общий итог.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;CUBE&lt;/code&gt; — группирует значения для всех возможных комбинаций столбцов, формирует промежуточные итоги для каждой группы и общий итог.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;GROUPING SETS&lt;/code&gt; — задает группы для промежуточных итогов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;code&gt;ROLLUP&lt;/code&gt;, &lt;code&gt;CUBE&lt;/code&gt; и &lt;code&gt;GROUPING SETS&lt;/code&gt; можно комбинировать через запятую.&lt;/p&gt;\n&lt;h3 id=\"grouping\"&gt;&lt;a href=\"ru/yql/syntax/group_by.html#grouping\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GROUPING&lt;/span&gt;&lt;/a&gt;GROUPING&lt;/h3&gt;\n&lt;p&gt;В промежуточном итоге значения столбцов, которые не участвуют в вычислениях, заменяются на &lt;code&gt;NULL&lt;/code&gt;. В общем итоге на &lt;code&gt;NULL&lt;/code&gt; заменяются значения всех столбцов. &lt;code&gt;GROUPING&lt;/code&gt; — функция, которая позволяет отличить исходные значения &lt;code&gt;NULL&lt;/code&gt; от &lt;code&gt;NULL&lt;/code&gt;, которые были добавлены при формировании общих и промежуточных итогов.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;GROUPING&lt;/code&gt; возвращает битовую маску:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;0&lt;/code&gt; — &lt;code&gt;NULL&lt;/code&gt; для исходного пустого значения.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;1&lt;/code&gt; — &lt;code&gt;NULL&lt;/code&gt;, добавленный для промежуточного или общего итога.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primer1\"&gt;&lt;a href=\"ru/yql/syntax/group_by.html#primer1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    column1,\n    column2,\n    column3,\n\n    CASE GROUPING(\n        column1,\n        column2,\n        column3,\n    )\n        WHEN 1  THEN \"Subtotal: column1 and column2\"\n        WHEN 3  THEN \"Subtotal: column1\"\n        WHEN 4  THEN \"Subtotal: column2 and column3\"\n        WHEN 6  THEN \"Subtotal: column3\"\n        WHEN 7  THEN \"Grand total\"\n        ELSE         \"Individual group\"\n    END AS subtotal,\n\n    COUNT(*) AS rows_count\n\nFROM my_table\n\nGROUP BY\n    ROLLUP(\n        column1,\n        column2,\n        column3\n    ),\n    GROUPING SETS(\n        (column2, column3),\n        (column3)\n        -- если добавить сюда ещё (column2), то в сумме\n        -- эти ROLLUP и GROUPING SETS дали бы результат,\n        -- аналогичный CUBE\n    )\n;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"170\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-170\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-170\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-170.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"distinct\"&gt;&lt;a href=\"ru/yql/syntax/group_by.html#distinct\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DISTINCT&lt;/span&gt;&lt;/a&gt;DISTINCT&lt;/h2&gt;\n&lt;p&gt;Применение &lt;a href=\"ru/yql/builtins/aggregation.html\"&gt;агрегатных функций&lt;/a&gt; только к уникальным значениям столбца.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Применение &lt;code&gt;DISTINCT&lt;/code&gt; к вычислимым значениям на данный момент не реализовано. С этой целью можно использовать &lt;a href=\"ru/yql/syntax/select/from.html\"&gt;подзапрос&lt;/a&gt; или выражение &lt;code&gt;GROUP BY ... AS ...&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"primer2\"&gt;&lt;a href=\"ru/yql/syntax/group_by.html#primer2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  key,\n  COUNT(DISTINCT value) AS count -- топ-3 ключей по количеству уникальных значений\nFROM my_table\nGROUP BY key\nORDER BY count DESC\nLIMIT 3;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"190\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-190\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-190\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-190.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Также ключевое слово &lt;code&gt;DISTINCT&lt;/code&gt; может использоваться для выборки уникальных строк через &lt;a href=\"ru/yql/syntax/select/distinct.html\"&gt;&lt;code&gt;SELECT DISTINCT&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"compact\"&gt;&lt;a href=\"ru/yql/syntax/group_by.html#compact\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;COMPACT&lt;/span&gt;&lt;/a&gt;COMPACT&lt;/h2&gt;\n&lt;p&gt;Наличие &lt;a href=\"ru/yql/syntax/lexer.html#sql-hints\"&gt;SQL хинта&lt;/a&gt; &lt;code&gt;COMPACT&lt;/code&gt; непосредственно после ключевого слова &lt;code&gt;GROUP&lt;/code&gt; позволяет более эффективно выполнять агрегацию в тех случаях, когда автору запроса заранее известно, что ни по одному из ключей агрегации не встречаются большие объемы данных (больше примерно гигабайт или миллионов строк). Если это предположение на практике окажется неверным, то операция может завершиться ошибкой из-за превышения потребления оперативной памяти или работать значительно медленнее не-COMPACT версии.&lt;/p&gt;\n&lt;p&gt;В отличие от обычного GROUP BY, отключается стадия Map-side combiner и дополнительные Reduce для каждого поля с &lt;a href=\"ru/yql/syntax/group_by.html#distinct\"&gt;DISTINCT&lt;/a&gt; агрегацией.&lt;/p&gt;\n&lt;h4 id=\"primer3\"&gt;&lt;a href=\"ru/yql/syntax/group_by.html#primer3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n  key,\n  COUNT(DISTINCT value) AS count -- топ-3 ключей по количеству уникальных значений\nFROM my_table\nGROUP /*+ COMPACT() */ BY key\nORDER BY count DESC\nLIMIT 3;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"206\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-206\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-206\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-206.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"having\"&gt;&lt;a href=\"ru/yql/syntax/group_by.html#having\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HAVING&lt;/span&gt;&lt;/a&gt;HAVING&lt;/h2&gt;\n&lt;p&gt;Фильтрация выборки &lt;code&gt;SELECT&lt;/code&gt; по результатам вычисления &lt;a href=\"ru/yql/builtins/aggregation.html\"&gt;агрегатных функций&lt;/a&gt;. Синтаксис аналогичен конструкции &lt;a href=\"ru/yql/syntax/select/where.html\"&gt;&lt;code&gt;WHERE&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h4 id=\"primer4\"&gt;&lt;a href=\"ru/yql/syntax/group_by.html#primer4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    key\nFROM my_table\nGROUP BY key\nHAVING COUNT(value) &amp;gt; 100;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"216\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-216\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-216\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-216.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/syntax/group_by.md","sourcePath":"ru/yql/syntax/group_by.md"},"headings":[{"title":"GROUP BY","href":"ru/yql/syntax/group_by.html#group-by","level":2},{"title":"GROUP BY ... SessionWindow()","href":"ru/yql/syntax/group_by.html#session-window","level":2},{"title":"ROLLUP, CUBE и GROUPING SETS","href":"ru/yql/syntax/group_by.html#rollup","level":2,"items":[{"title":"GROUPING","href":"ru/yql/syntax/group_by.html#grouping","level":3,"items":[{"title":"Пример","href":"ru/yql/syntax/group_by.html#primer1","level":4}]}]},{"title":"DISTINCT","href":"ru/yql/syntax/group_by.html#distinct","level":2},{"title":"COMPACT","href":"ru/yql/syntax/group_by.html#compact","level":2},{"title":"HAVING","href":"ru/yql/syntax/group_by.html#having","level":2}],"title":""},"router":{"pathname":"ru/yql/syntax/group_by","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
