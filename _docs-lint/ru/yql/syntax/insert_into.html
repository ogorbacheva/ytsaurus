        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Добавляет строки в таблицу. Если целевая таблица уже существует и не является сортированной, операция &lt;code&gt;INSERT INTO&lt;/code&gt; дописывает строки в конец таблицы. В случае сортированной таблицы YQL пытается сохранить сортированность путём запуска сортированного слияния.&lt;/p&gt;\n&lt;p&gt;Таблица ищется по имени в базе данных, заданной оператором &lt;a href=\"ru/yql/syntax/use.html\"&gt;USE&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"opisanie\"&gt;&lt;a href=\"ru/yql/syntax/insert_into.html#opisanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Описание&lt;/span&gt;&lt;/a&gt;Описание&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;INSERT INTO&lt;/code&gt; позволяет выполнять следующие операции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Добавлять константные значения с помощью &lt;a href=\"ru/yql/syntax/values.html\"&gt;&lt;code&gt;VALUES&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;INSERT INTO my_table (Column1, Column2, Column3, Column4)\nVALUES (345987,'ydb', 'Яблочный край', 1414);\nCOMMIT;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"17\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-17\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-17\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-17.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;INSERT INTO my_table (Column1, Column2)\nVALUES (\"foo\", 1), (\"bar\", 2);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"18\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-18\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-18\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-18.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Сохранять результаты выборки &lt;code&gt;SELECT&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;INSERT INTO my_table\nSELECT SourceTableColumn1 AS MyTableColumn1, \"Empty\" AS MyTableColumn2, SourceTableColumn2 AS MyTableColumn3\nFROM source_table;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"24\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-24\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-24\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-24.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"ispolzovanie-modifikatorov\"&gt;&lt;a href=\"ru/yql/syntax/insert_into.html#ispolzovanie-modifikatorov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование модификаторов&lt;/span&gt;&lt;/a&gt;Использование модификаторов&lt;/h2&gt;\n&lt;p&gt;Запись может выполняться с одним или несколькими модификаторами. Модификатор указывается после ключевого слова &lt;code&gt;WITH&lt;/code&gt; после имени таблицы: &lt;code&gt;INSERT INTO ... WITH SOME_HINT&lt;/code&gt;. Например, чтобы перед записью очистить таблицу от имевшихся данных, достаточно добавить модификатор &lt;code&gt;WITH TRUNCATE&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;INSERT INTO my_table WITH TRUNCATE\nSELECT key FROM my_table_source;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"33\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-33\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-33\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-33.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Действуют следующие правила:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Если у модификатора есть значение, то оно указывается после знака &lt;code&gt;=&lt;/code&gt;: &lt;code&gt;INSERT INTO ... WITH SOME_HINT=value&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Если необходимо указать несколько модификаторов, то они заключаются в круглые скобки: &lt;code&gt;INSERT INTO ... WITH (SOME_HINT1=value, SOME_HINT2, SOME_HINT3=value)&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Полный список поддерживаемых модификаторов записи:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;TRUNCATE&lt;/code&gt; — очистить таблицу от имеющихся данных.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;COMPRESSION_CODEC=codec_name&lt;/code&gt; — записать данные с указанным compression codec. Имеет приоритет над прагмой &lt;code&gt;yt.PublishedCompressionCodec&lt;/code&gt;. Допустимые значения смотрите в разделе &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/storage/compression#compression_codecs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Сжатие&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ERASURE_CODEC=erasure_name&lt;/code&gt; — записать данные с указанным erasure codec. Имеет приоритет над прагмой &lt;code&gt;yt.PublishedErasureCodec&lt;/code&gt;. Допустимые значения смотрите в разделе &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/storage/replication#erasure\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Репликация&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;EXPIRATION=value&lt;/code&gt; — задать expiration период для создаваемой таблицы. Значение может задаваться как &lt;code&gt;duration&lt;/code&gt; или как &lt;code&gt;timestamp&lt;/code&gt; в формате &lt;a href=\"https://en.wikipedia.org/wiki/ISO_8601\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ISO 8601&lt;/a&gt;. Имеет приоритет над прагмами &lt;code&gt;yt.ExpirationDeadline&lt;/code&gt; / &lt;code&gt;yt.ExpirationInterval&lt;/code&gt;. Данный модификатор может задаваться только совместно с &lt;code&gt;TRUNCATE&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;REPLICATION_FACTOR=factor&lt;/code&gt; — задать replication factor для создаваемой таблицы. Значением должно быть число в диапазоне [1, 10].&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;USER_ATTRS=yson&lt;/code&gt; — задать пользовательские атрибуты, которые будут добавлены к таблице. Атрибуты должны задаваться в виде yson-словаря.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;MEDIA=yson&lt;/code&gt; — указать медиумы. Имеет приоритет над прагмой &lt;code&gt;yt.PublishedMedia&lt;/code&gt;. Допустимые значения смотрите в разделе &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/storage/media\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Медиумы&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;PRIMARY_MEDIUM=medium_name&lt;/code&gt; — задать первичный медиум. Имеет приоритет над прагмой &lt;code&gt;yt.PublishedPrimaryMedium&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;KEEP_META&lt;/code&gt; — сохранить текущую схему, пользовательские атрибуты и атрибуты хранения (кодеки, репликации, медиа) целевой таблицы. Данный модификатор может задаваться только совместно с &lt;code&gt;TRUNCATE&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использовать в &lt;code&gt;USER_ATTRS&lt;/code&gt; системные атрибуты не рекомендуется, поскольку результат их применения для записываемых данных не определён.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"primery\"&gt;&lt;a href=\"ru/yql/syntax/insert_into.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;INSERT INTO my_table WITH (TRUNCATE, EXPIRATION=\"15m\")\nSELECT key FROM my_table_source;\n\nINSERT INTO my_table WITH USER_ATTRS=\"{attr1=value1; attr2=value2;}\"\nSELECT key FROM my_table_source;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"112\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-112\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-112\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-112.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/syntax/insert_into.md","sourcePath":"ru/yql/syntax/insert_into.md"},"headings":[{"title":"Описание","href":"ru/yql/syntax/insert_into.html#opisanie","level":2},{"title":"Использование модификаторов","href":"ru/yql/syntax/insert_into.html#ispolzovanie-modifikatorov","level":2}],"title":"INSERT INTO"},"router":{"pathname":"ru/yql/syntax/insert_into","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
