        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"define-action\"&gt;&lt;a href=\"ru/yql/syntax/action.html#define-action\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DEFINE ACTION&lt;/span&gt;&lt;/a&gt;DEFINE ACTION&lt;/h2&gt;\n&lt;p&gt;Задает именованное действие, которое представляют собой параметризуемый блок из нескольких выражений верхнего уровня.&lt;/p&gt;\n&lt;h4 id=\"sintaksis\"&gt;&lt;a href=\"ru/yql/syntax/action.html#sintaksis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Синтаксис&lt;/span&gt;&lt;/a&gt;Синтаксис&lt;/h4&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;DEFINE ACTION&lt;/code&gt; — объявление действия.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/expressions.html#named-nodes\"&gt;Имя действия&lt;/a&gt;, по которому объявляемое действие доступно далее для вызова.&lt;/li&gt;\n&lt;li&gt;В круглых скобках — список имен параметров.&lt;/li&gt;\n&lt;li&gt;Ключевое слово &lt;code&gt;AS&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Список выражений верхнего уровня.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;END DEFINE&lt;/code&gt; — маркер последнего выражения внутри действия.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Один или более последних параметров могут быть помечены знаком вопроса &lt;code&gt;?&lt;/code&gt; как необязательные. Если они не будут указаны при вызове, то им будет присвоено значение &lt;code&gt;NULL&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"do\"&gt;&lt;a href=\"ru/yql/syntax/action.html#do\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DO&lt;/span&gt;&lt;/a&gt;DO&lt;/h2&gt;\n&lt;p&gt;Выполняет &lt;code&gt;ACTION&lt;/code&gt; с указанными параметрами.&lt;/p&gt;\n&lt;h4 id=\"sintaksis1\"&gt;&lt;a href=\"ru/yql/syntax/action.html#sintaksis1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Синтаксис&lt;/span&gt;&lt;/a&gt;Синтаксис&lt;/h4&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;DO&lt;/code&gt; — выполнение действия.&lt;/li&gt;\n&lt;li&gt;Именованное выражение, по которому объявлено действие.&lt;/li&gt;\n&lt;li&gt;В круглых скобках — список значений для использования в роли параметров.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;code&gt;EMPTY_ACTION&lt;/code&gt; — действие, которое ничего не выполняет.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В больших запросах объявление действий можно выносить в отдельные файлы и подключать их в основной запрос с помощью &lt;a href=\"ru/yql/syntax/export_import.html#export\"&gt;EXPORT&lt;/a&gt; + &lt;a href=\"ru/yql/syntax/export_import.html#import\"&gt;IMPORT&lt;/a&gt;, чтобы вместо одного длинного текста получилось несколько логических частей, в которых проще ориентироваться. Важный нюанс: директива &lt;code&gt;USE my_cluster;&lt;/code&gt; в импортирующем запросе не влияет на поведение объявленных в других файлах действий.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"primer\"&gt;&lt;a href=\"ru/yql/syntax/action.html#primer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DEFINE ACTION $hello_world($name, $suffix?) AS\n    $name = $name ?? ($suffix ?? \"world\");\n    SELECT \"Hello, \" || $name || \"!\";\nEND DEFINE;\n\nDO EMPTY_ACTION();\nDO $hello_world(NULL);\nDO $hello_world(\"John\");\nDO $hello_world(NULL, \"Earth\");\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"86\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-86\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-86\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-86.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"begin\"&gt;&lt;a href=\"ru/yql/syntax/action.html#begin\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BEGIN .. END DO&lt;/span&gt;&lt;/a&gt;BEGIN .. END DO&lt;/h2&gt;\n&lt;p&gt;Выполнение действия без его объявления (анонимное действие).&lt;/p&gt;\n&lt;h4 id=\"sintaksis2\"&gt;&lt;a href=\"ru/yql/syntax/action.html#sintaksis2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Синтаксис&lt;/span&gt;&lt;/a&gt;Синтаксис&lt;/h4&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;BEGIN&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Список выражений верхнего уровня;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;END DO&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Анонимное действие не может содержать параметров.&lt;/p&gt;\n&lt;h4 id=\"primer1\"&gt;&lt;a href=\"ru/yql/syntax/action.html#primer1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DO BEGIN\n    SELECT 1;\n    SELECT 2  -- здесь и в предыдущем примере ';' перед END можно не ставить\nEND DO\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"119\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-119\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-119\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-119.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"evaluate-if\"&gt;&lt;a href=\"ru/yql/syntax/action.html#evaluate-if\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;EVALUATE IF&lt;/span&gt;&lt;/a&gt;EVALUATE IF&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;EVALUATE IF&lt;/code&gt; — выполнение действия (action) в зависимости от выполнения условия. Далее указывается:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Условие;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/action.html#do\"&gt;DO&lt;/a&gt; с именем и параметрами действия или анонимным действием;&lt;/li&gt;\n&lt;li&gt;Опционально &lt;code&gt;ELSE&lt;/code&gt; и следом второе &lt;code&gt;DO&lt;/code&gt; для ситуации, когда условие не выполнено.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"evaluate-for\"&gt;&lt;a href=\"ru/yql/syntax/action.html#evaluate-for\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;EVALUATE FOR&lt;/span&gt;&lt;/a&gt;EVALUATE FOR&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;EVALUATE FOR&lt;/code&gt; — выполнение действия (action) для каждого элемента в списке. Далее указывается:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/expressions.html#named-nodes\"&gt;Именованное выражение&lt;/a&gt;, в которое будет подставляться каждый очередной элемент списка;&lt;/li&gt;\n&lt;li&gt;Ключевое слово &lt;code&gt;IN&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Объявленное выше именованное выражение со списком, по которому будет выполняться действие.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/syntax/action.html#do\"&gt;DO&lt;/a&gt; с именем и параметрами действия или анонимным действием, в параметрах можно использовать как текущий элемент из первого пункта, так и любые объявленные выше именованные выражения, в том числе сам список.&lt;/li&gt;\n&lt;li&gt;Опционально &lt;code&gt;ELSE&lt;/code&gt; и следом второе &lt;code&gt;DO&lt;/code&gt; для ситуации, когда список пуст.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"primery\"&gt;&lt;a href=\"ru/yql/syntax/action.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DEFINE ACTION $hello() AS\n    SELECT \"Hello!\";\nEND DEFINE;\n\nDEFINE ACTION $bye() AS\n    SELECT \"Bye!\";\nEND DEFINE;\n\nEVALUATE IF RANDOM(0) &amp;gt; 0.5\n    DO $hello()\nELSE\n    DO $bye();\n\nEVALUATE IF RANDOM(0) &amp;gt; 0.1 DO BEGIN\n    SELECT \"Hello!\";\nEND DO;\n\nEVALUATE FOR $i IN AsList(1, 2, 3) DO BEGIN\n    SELECT $i;\nEND DO;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"179\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-179\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-179\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-179.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;-- скопировать таблицу $input в $count новых таблиц\n$count = 3;\n$input = \"my_input\";\n$inputs = ListReplicate($input, $count);\n$outputs = ListMap(\n    ListFromRange(0, $count),\n    ($i) -&amp;gt; {\n        RETURN \"tmp/out_\" || CAST($i as String)\n    }\n);\n$pairs = ListZip($inputs, $outputs);\n\nDEFINE ACTION $copy_table($pair) as\n    $input = $pair.0;\n    $output = $pair.1;\n    INSERT INTO $output WITH TRUNCATE\n    SELECT * FROM $input;\nEND DEFINE;\n\nEVALUATE FOR $pair IN $pairs\n    DO $copy_table($pair)\nELSE\n    DO EMPTY_ACTION(); -- такой ELSE можно было не указывать,\n                       -- ничего не делать подразумевается по умолчанию\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"180\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-180\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-180\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-180.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стоит учитывать, что &lt;code&gt;EVALUATE&lt;/code&gt; выполняется до начала работы основного запроса. Также в рамках вычисления предиката в &lt;code&gt;EVALUATE IF&lt;/code&gt; или списка в &lt;code&gt;EVALUATE FOR&lt;/code&gt; невозможно использование &lt;a href=\"ru/yql/syntax/select/temporary_table.html\"&gt;анонимных таблиц&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/syntax/action.md","sourcePath":"ru/yql/syntax/action.md"},"headings":[{"title":"DEFINE ACTION","href":"ru/yql/syntax/action.html#define-action","level":2},{"title":"DO","href":"ru/yql/syntax/action.html#do","level":2},{"title":"BEGIN .. END DO","href":"ru/yql/syntax/action.html#begin","level":2},{"title":"EVALUATE IF","href":"ru/yql/syntax/action.html#evaluate-if","level":2},{"title":"EVALUATE FOR","href":"ru/yql/syntax/action.html#evaluate-for","level":2}],"title":"ACTION"},"router":{"pathname":"ru/yql/syntax/action","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
