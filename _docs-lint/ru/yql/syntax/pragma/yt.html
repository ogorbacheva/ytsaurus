я джобов, &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/data-processing/operations/operations-options#memory_reserve_factor\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;см. документацию&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytdefaultmemorydigestlowerbound\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytdefaultmemorydigestlowerbound\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DefaultMemoryDigestLowerBound&lt;/span&gt;&lt;/a&gt;yt.DefaultMemoryDigestLowerBound&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Число с плавающей точкой от 0.0 до 1.0 включительно&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт настройку &lt;code&gt;user_job_memory_digest_lower_bound&lt;/code&gt; в спеке операции. Про настройку можно почитать в &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/data-processing/scheduler/memory-digest#nastrojki-digest\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;документации&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytbufferrowcount\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytbufferrowcount\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.BufferRowCount&lt;/span&gt;&lt;/a&gt;yt.BufferRowCount&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Число, не меньше 1&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Ограничение на количество записей, которые могут быть забуферизированы JobProxy.&lt;/p&gt;\n&lt;h2 id=\"ytdisablejobsplitting\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytdisablejobsplitting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DisableJobSplitting&lt;/span&gt;&lt;/a&gt;yt.DisableJobSplitting&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Запретить планировщику YTsaurus адаптивно доразбивать долго бегущие пользовательские джобы.&lt;/p&gt;\n&lt;h2 id=\"ytdefaultlocalitytimeout\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytdefaultlocalitytimeout\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DefaultLocalityTimeout&lt;/span&gt;&lt;/a&gt;yt.DefaultLocalityTimeout&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Интервал времени с поддержкой суффиксов &lt;code&gt;s/m/h/d&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт настройку &lt;code&gt;locality_timeout&lt;/code&gt; в спеке операции (настройка пока не задокументирована).&lt;/p&gt;\n&lt;h2 id=\"ytmaplocalitytimeout\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytmaplocalitytimeout\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MapLocalityTimeout&lt;/span&gt;&lt;/a&gt;yt.MapLocalityTimeout&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Интервал времени с поддержкой суффиксов &lt;code&gt;s/m/h/d&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт настройку &lt;code&gt;map_locality_timeout&lt;/code&gt; в спеке операции (настройка пока не задокументирована).&lt;/p&gt;\n&lt;h2 id=\"ytreducelocalitytimeout\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytreducelocalitytimeout\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.ReduceLocalityTimeout&lt;/span&gt;&lt;/a&gt;yt.ReduceLocalityTimeout&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Интервал времени с поддержкой суффиксов &lt;code&gt;s/m/h/d&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт настройку &lt;code&gt;reduce_locality_timeout&lt;/code&gt; в спеке операции (настройка пока не задокументирована).&lt;/p&gt;\n&lt;h2 id=\"ytsortlocalitytimeout\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytsortlocalitytimeout\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.SortLocalityTimeout&lt;/span&gt;&lt;/a&gt;yt.SortLocalityTimeout&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Интервал времени с поддержкой суффиксов &lt;code&gt;s/m/h/d&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт настройку &lt;code&gt;sort_locality_timeout&lt;/code&gt; в спеке операции (настройка пока не задокументирована).&lt;/p&gt;\n&lt;h2 id=\"ytminlocalityinputdataweight\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytminlocalityinputdataweight\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MinLocalityInputDataWeight&lt;/span&gt;&lt;/a&gt;yt.MinLocalityInputDataWeight&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт настройку &lt;code&gt;min_locality_input_data_weight&lt;/code&gt; в спеке операции (настройка пока не задокументирована).&lt;/p&gt;\n&lt;h2 id=\"ytdefaultmapselectivityfactor\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytdefaultmapselectivityfactor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DefaultMapSelectivityFactor&lt;/span&gt;&lt;/a&gt;yt.DefaultMapSelectivityFactor&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Положительное число с плавающей точкой&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт приблизительное соотношение выхода к входу map-стадии в совмещенной MapReduce операции, &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/data-processing/operations/mapreduce\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;см. документацию&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"ytsuspendifaccountlimitexceeded\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytsuspendifaccountlimitexceeded\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.SuspendIfAccountLimitExceeded&lt;/span&gt;&lt;/a&gt;yt.SuspendIfAccountLimitExceeded&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Приостанавливать операцию в случае возникновения ошибки \"Account limit exceeded\" в джобах, &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/data-processing/operations/operations-options#common_options\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;см. документацию&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytcommonjoincorelimit\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytcommonjoincorelimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.CommonJoinCoreLimit&lt;/span&gt;&lt;/a&gt;yt.CommonJoinCoreLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты&lt;/td&gt;\n&lt;td&gt;128M&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт размер буфера памяти для выполнения CommonJoinCore узла (исполняется в джобе при выборе common-стратегии JOIN).&lt;/p&gt;\n&lt;h2 id=\"ytcombinecorelimit\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytcombinecorelimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.CombineCoreLimit&lt;/span&gt;&lt;/a&gt;yt.CombineCoreLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты, не меньше 1M&lt;/td&gt;\n&lt;td&gt;128M&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт размер буфера памяти для выполнения CombineCore узла.&lt;/p&gt;\n&lt;h2 id=\"ytswitchlimit\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytswitchlimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.SwitchLimit&lt;/span&gt;&lt;/a&gt;yt.SwitchLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты, не меньше 1M&lt;/td&gt;\n&lt;td&gt;128M&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт размер буфера памяти для выполнения Switch узла.&lt;/p&gt;\n&lt;h2 id=\"ytevaluationtablesizelimit\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytevaluationtablesizelimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.EvaluationTableSizeLimit&lt;/span&gt;&lt;/a&gt;yt.EvaluationTableSizeLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты, не больше 10M&lt;/td&gt;\n&lt;td&gt;1M&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт максимальный суммарный объём таблиц, используемых на evaluation-стадии.&lt;/p&gt;\n&lt;h2 id=\"ytlookupjoinlimit\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytlookupjoinlimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.LookupJoinLimit&lt;/span&gt;&lt;/a&gt;yt.LookupJoinLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты, не больше 10M&lt;/td&gt;\n&lt;td&gt;1M&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Таблица может быть использована в качестве словаря в Lookup JOIN стратегии, если её размер не превышает минимума из &lt;code&gt;yt.LookupJoinLimit&lt;/code&gt; и &lt;code&gt;yt.EvaluationTableSizeLimit&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytlookupjoinmaxrows\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytlookupjoinmaxrows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.LookupJoinMaxRows&lt;/span&gt;&lt;/a&gt;yt.LookupJoinMaxRows&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Число, не больше 1000&lt;/td&gt;\n&lt;td&gt;900&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Максимальное число строк в таблице, при котором она может выступать в качестве словаря в Lookup JOIN стратегии.&lt;/p&gt;\n&lt;h2 id=\"ytmaxextrajobmemorytofuseoperations\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytmaxextrajobmemorytofuseoperations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MaxExtraJobMemoryToFuseOperations&lt;/span&gt;&lt;/a&gt;yt.MaxExtraJobMemoryToFuseOperations&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты&lt;/td&gt;\n&lt;td&gt;2G&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Максимальный размер потребления памяти джобами, допускаемый после слияния операций оптимизаторами.&lt;/p&gt;\n&lt;h2 id=\"ytmaxreplicationfactortofuseoperations\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytmaxreplicationfactortofuseoperations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MaxReplicationFactorToFuseOperations&lt;/span&gt;&lt;/a&gt;yt.MaxReplicationFactorToFuseOperations&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Число с плавающей точкой не меньше 1.0&lt;/td&gt;\n&lt;td&gt;20.0&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Максимальный коэффициент размножения данных, допускаемый после слияния операций оптимизаторами.&lt;/p&gt;\n&lt;h2 id=\"yttopsortmaxlimit\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#yttopsortmaxlimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TopSortMaxLimit&lt;/span&gt;&lt;/a&gt;yt.TopSortMaxLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Положительное число&lt;/td&gt;\n&lt;td&gt;1000&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Максимальное значение LIMIT, используемого в комбинации с ORDER BY, при котором запускается TopSort оптимизация.&lt;/p&gt;\n&lt;h2 id=\"yttopsortsizeperjob\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#yttopsortsizeperjob\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TopSortSizePerJob&lt;/span&gt;&lt;/a&gt;yt.TopSortSizePerJob&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты, не меньше 1&lt;/td&gt;\n&lt;td&gt;128M&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт ожидаемый объём данных на джоб в TopSort операции.&lt;/p&gt;\n&lt;h2 id=\"yttopsortrowmultiplierperjob\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#yttopsortrowmultiplierperjob\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TopSortRowMultiplierPerJob&lt;/span&gt;&lt;/a&gt;yt.TopSortRowMultiplierPerJob&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Число, не меньше 1&lt;/td&gt;\n&lt;td&gt;10&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт ожидаемое число записей на джоб в TopSort операции, вычисляемое как &lt;code&gt;LIMIT * yt.TopSortRowMultiplierPerJob&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytdisableoptimizers\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytdisableoptimizers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DisableOptimizers&lt;/span&gt;&lt;/a&gt;yt.DisableOptimizers&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка со списком оптимизаторов, разделённых любым из символов: запятая, точка с запятой, пробел или &lt;code&gt;|&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Отключает заданные оптимизаторы.&lt;/p&gt;\n&lt;h2 id=\"ytjobenv\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytjobenv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.JobEnv&lt;/span&gt;&lt;/a&gt;yt.JobEnv&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строковое представление yson-словаря&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт переменные окружения для map- и reduce-джобов операций. Ключи в словаре задают имена переменных окружения, а значения в словаре — значения переменных окружения.&lt;/p&gt;\n&lt;h2 id=\"ytoperationspec\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytoperationspec\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.OperationSpec&lt;/span&gt;&lt;/a&gt;yt.OperationSpec&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строковое представление yson-словаря&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт словарь настроек операций. Позволяет задать, настройки, не имеющие аналогов в виде прагм. Настройки, заданные через специализированные прагмы, имеют больший приоритет и перетирают значения в этом словаре.&lt;/p&gt;\n&lt;h2 id=\"ytannotations\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytannotations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.Annotations&lt;/span&gt;&lt;/a&gt;yt.Annotations&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строковое представление yson-словаря&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт произвольную структурированную информацию, связанную с операцией. См. &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/data-processing/operations/operations-options\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;документацию&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytstartedby\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytstartedby\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.StartedBy&lt;/span&gt;&lt;/a&gt;yt.StartedBy&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строковое представление yson-словаря&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт словарь, описывающий клиента, посредством которого была запущена операция. См. &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/data-processing/operations/operations-options\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;документацию&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytdescription\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytdescription\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.Description&lt;/span&gt;&lt;/a&gt;yt.Description&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строковое представление yson-словаря&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт человекочитаемую информацию, отображаемую в веб-интерфейсе на странице операции. См. &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/data-processing/operations/operations-options\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;документацию&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytmaxspeculativejobcountpertask\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytmaxspeculativejobcountpertask\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MaxSpeculativeJobCountPerTask&lt;/span&gt;&lt;/a&gt;yt.MaxSpeculativeJobCountPerTask&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Положительное число&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт количество &lt;a href=\"ru/yql/syntax/pragma/%7B%7Byql.pages.syntax.pragma.speculative-job%7D%7D\"&gt;спекулятивно исполняемых джобов&lt;/a&gt; в YTsaurus операциях. По умолчанию используются настройки YTsaurus кластера.&lt;/p&gt;\n&lt;h2 id=\"ytllvmmemsize\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytllvmmemsize\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.LLVMMemSize&lt;/span&gt;&lt;/a&gt;yt.LLVMMemSize&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты&lt;/td&gt;\n&lt;td&gt;256M&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт фиксированный размер памяти, необходимый при компиляции LLVM-кода в джобах&lt;/p&gt;\n&lt;h2 id=\"ytllvmpernodememsize\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytllvmpernodememsize\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.LLVMPerNodeMemSize&lt;/span&gt;&lt;/a&gt;yt.LLVMPerNodeMemSize&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты&lt;/td&gt;\n&lt;td&gt;10K&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт размер памяти на каждый узел графа вычислений, необходимый при компиляции LLVM-кода в джобах&lt;/p&gt;\n&lt;h2 id=\"ytsamplingioblocksize\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytsamplingioblocksize\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.SamplingIoBlockSize&lt;/span&gt;&lt;/a&gt;yt.SamplingIoBlockSize&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт минимальный размер блока для крупноблочного сэмплирования.&lt;/p&gt;\n&lt;h2 id=\"ytbinarytmpfolder\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytbinarytmpfolder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.BinaryTmpFolder&lt;/span&gt;&lt;/a&gt;yt.BinaryTmpFolder&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Путь на кластере&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт отдельный путь на кластере, где будут кешироваться бинарные артефакты запроса (UDF и job binary). Артефакты сохраняются в корне директории с именем, равным md5 артефакта. Сохранение и использование артефактов в данной директории выполняется вне транзакции, даже если в запросе задана прагма &lt;code&gt;yt.ExternalTx&lt;/code&gt;&lt;/p&gt;\n&lt;h2 id=\"ytbinaryexpirationinterval\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytbinaryexpirationinterval\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.BinaryExpirationInterval&lt;/span&gt;&lt;/a&gt;yt.BinaryExpirationInterval&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Интервал времени с поддержкой суффиксов &lt;code&gt;s/m/h/d&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Позволяет управлять &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/storage/cypress#TTL\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TTL кешируемых бинарных артефактов&lt;/a&gt;. Работает только в паре с &lt;code&gt;yt.BinaryTmpFolder&lt;/code&gt;. Каждое использование бинарного артефакта в запросе продлевает его TTL.&lt;/p&gt;\n&lt;h2 id=\"ytfolderinlinedatalimit\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytfolderinlinedatalimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.FolderInlineDataLimit&lt;/span&gt;&lt;/a&gt;yt.FolderInlineDataLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты&lt;/td&gt;\n&lt;td&gt;100K&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт максимальный размер данных для inline списка, полученного в результате вычисления Folder. При большем размере будет использоваться временный файл.&lt;/p&gt;\n&lt;h2 id=\"ytfolderinlineitemslimit\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytfolderinlineitemslimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.FolderInlineItemsLimit&lt;/span&gt;&lt;/a&gt;yt.FolderInlineItemsLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Положительное число&lt;/td&gt;\n&lt;td&gt;100&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт максимальное количество элементов в inline списке, полученном в результате вычисления Folder. При большем размере будет использоваться временный файл.&lt;/p&gt;\n&lt;h2 id=\"yt-usenativeyttypes\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#yt-usenativeyttypes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.UseNativeYtTypes&lt;/span&gt;&lt;/a&gt;yt.UseNativeYtTypes&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Включает запись значений сложных типов в таблицы с использованием родной поддержки сложных типов в YTsaurus.&lt;/p&gt;\n&lt;h2 id=\"ytpublishedmedia-/-yttemporarymedia\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytpublishedmedia-/-yttemporarymedia\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.PublishedMedia / yt.TemporaryMedia&lt;/span&gt;&lt;/a&gt;yt.PublishedMedia / yt.TemporaryMedia&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строковое представление yson-словаря&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Установить на вновь создаваемых таблицах атрибут &lt;code&gt;@media&lt;/code&gt;. При его наличии назначает &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/storage/media#naznachenie-mediuma\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;на каких медиумах в YTsaurus&lt;/a&gt; будут храниться чанки таблицы.&lt;/p&gt;\n&lt;p&gt;Published являются таблицы, указанные в &lt;a href=\"ru/yql/syntax/insert_into.html\"&gt;INSERT INTO&lt;/a&gt; все остальные считаются временными (Temporary).&lt;/p&gt;\n&lt;h2 id=\"ytpublishedprimarymedium-/-yttemporaryprimarymedium\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytpublishedprimarymedium-/-yttemporaryprimarymedium\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.PublishedPrimaryMedium / yt.TemporaryPrimaryMedium&lt;/span&gt;&lt;/a&gt;yt.PublishedPrimaryMedium / yt.TemporaryPrimaryMedium&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Установить на вновь создаваемых таблицах атрибут &lt;code&gt;@primary_medium&lt;/code&gt;. При его наличии назначает &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/storage/media#primary\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;первичный медиум в YTsaurus&lt;/a&gt; на который будет осуществляться запись чанков. По умолчанию YTsaurus устанавливает первичный медиум &lt;code&gt;\"default\"&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Published являются таблицы, указанные в &lt;a href=\"ru/yql/syntax/insert_into.html\"&gt;INSERT INTO&lt;/a&gt; все остальные считаются временными (Temporary).&lt;/p&gt;\n&lt;h2 id=\"ytintermediatedatamedium\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytintermediatedatamedium\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.IntermediateDataMedium&lt;/span&gt;&lt;/a&gt;yt.IntermediateDataMedium&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Установить медиум, используемый для промежуточных данных в операциях (Sort, MapReduce). Подробности см. в &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/data-processing/operations/sort\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;документации&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytprimarymedium\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytprimarymedium\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.PrimaryMedium&lt;/span&gt;&lt;/a&gt;yt.PrimaryMedium&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/storage/media#primary\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;первичный медиум в YTsaurus&lt;/a&gt; для Published, Temporary таблиц и промежуточных данных в операциях. Равносильно одновременной установке прагм &lt;code&gt;yt.IntermediateDataMedium&lt;/code&gt;, &lt;code&gt;yt.PublishedPrimaryMedium&lt;/code&gt; и &lt;code&gt;yt.TemporaryPrimaryMedium&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"ythybriddqexecution\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ythybriddqexecution\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.HybridDqExecution&lt;/span&gt;&lt;/a&gt;yt.HybridDqExecution&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Включает гибридное исполнение запросов через DQ&lt;/p&gt;\n&lt;h2 id=\"ytstaticnetworkproject\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytstaticnetworkproject\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.StaticNetworkProject&lt;/span&gt;&lt;/a&gt;yt.StaticNetworkProject&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Статическая, per-cluster&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт использование указанного &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/data-processing/operations/mtn\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;сетевого проекта&lt;/a&gt; в джобах для всех map-reduce операций в запросе (включая evaluation стадию).&lt;/p&gt;\n&lt;h2 id=\"ytnetworkproject\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytnetworkproject\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.NetworkProject&lt;/span&gt;&lt;/a&gt;yt.NetworkProject&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;yt.StaticNetworkProject&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт использование указанного сетевого проекта в джобах для регулярных операций в запросе.&lt;/p&gt;\n&lt;h2 id=\"ytbatchlistfolderconcurrency\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytbatchlistfolderconcurrency\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.BatchListFolderConcurrency&lt;/span&gt;&lt;/a&gt;yt.BatchListFolderConcurrency&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Положительное число&lt;/td&gt;\n&lt;td&gt;5&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт количество одновременных операций листинга директорий.&lt;/p&gt;\n&lt;h2 id=\"ytcolumngroupmode\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytcolumngroupmode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.ColumnGroupMode&lt;/span&gt;&lt;/a&gt;yt.ColumnGroupMode&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка: disable / single / perusage&lt;/td&gt;\n&lt;td&gt;disable&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт режим вычисления поколоночных групп для промежуточных таблиц запроса. В режиме &lt;code&gt;disable&lt;/code&gt; поколоночные группы не используются. В режиме &lt;code&gt;single&lt;/code&gt; создается одна группа на все колонки таблицы. В режиме &lt;code&gt;perusage&lt;/code&gt; создаются гранулярные группы колонок по их потребителям. Все колонки одной группы одновременно используются в одном или нескольких потребителях. Например, если в промежуточной таблице имеются колонки [a, b, c, d, e, f] и её используют две операции с выборками колонок [a, b, c, d] и [c, d, e, f] соответственно, то в таблице будут созданы три группы колонок [a, b], [c, d] и [e, f]. Если промежуточная таблица используется для публикации в выходную таблицу (т.е. потребителем является узел YtPublish), то поколоночные группы не применяются, за исключением явно заданного &lt;a href=\"ru/yql/syntax/insert_into.html#hints\"&gt;модификатора column_groups&lt;/a&gt;. В последнем случае, промежуточная таблица использует поколоночные группы модификатора.&lt;/p&gt;\n&lt;h2 id=\"ytmincolumngroupsize\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytmincolumngroupsize\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MinColumnGroupSize&lt;/span&gt;&lt;/a&gt;yt.MinColumnGroupSize&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Положительное число не меньше 2&lt;/td&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт минимальный размер поколоночной группы. Если вычисленная группа содержит число колонок меньше заданного значения прагмы, то она не создается.&lt;/p&gt;\n&lt;h2 id=\"ytmaxcolumngroups\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytmaxcolumngroups\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MaxColumnGroups&lt;/span&gt;&lt;/a&gt;yt.MaxColumnGroups&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Положительное число&lt;/td&gt;\n&lt;td&gt;64&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт максимальное число поколоночных групп на промежуточную таблицу запроса. Если вычисленное число групп превышает этот лимит, то группы не создаются для данной таблицы.&lt;/p&gt;\n&lt;h2 id=\"ytforcejobsizeadjuster\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytforcejobsizeadjuster\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.ForceJobSizeAdjuster&lt;/span&gt;&lt;/a&gt;yt.ForceJobSizeAdjuster&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт опцию &lt;code&gt;\"force_job_size_adjuster\"&lt;/code&gt; в настройках операций.&lt;/p&gt;\n&lt;h2 id=\"ytdontforcetransformforinputtables\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytdontforcetransformforinputtables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DontForceTransformForInputTables&lt;/span&gt;&lt;/a&gt;yt.DontForceTransformForInputTables&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Отключает принудительную трансформацию данных для пользовательских таблиц с настройками хранения (&lt;code&gt;erasure_codec&lt;/code&gt;, &lt;code&gt;compression_codec&lt;/code&gt;, &lt;code&gt;primary_medium&lt;/code&gt;, &lt;code&gt;media&lt;/code&gt;, поколоночные группы), отличающимися от настроек по умолчанию.&lt;/p&gt;\n&lt;p&gt;Принудительная трансформация применяется для входных таблиц, если они используются для записи в выходные таблицы только через операцию YtMerge.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/syntax/pragma/yt.md","sourcePath":"ru/yql/syntax/pragma/yt.md"},"headings":[{"title":"yt.InferSchema / yt.ForceInferSchema","href":"ru/yql/syntax/pragma/yt.html#inferschema","level":2},{"title":"yt.InferSchemaTableCountThreshold","href":"ru/yql/syntax/pragma/yt.html#ytinferschematablecountthreshold","level":2},{"title":"yt.IgnoreWeakSchema","href":"ru/yql/syntax/pragma/yt.html#ytignoreweakschema","level":2},{"title":"yt.IgnoreYamrDsv","href":"ru/yql/syntax/pragma/yt.html#ytignoreyamrdsv","level":2},{"title":"yt.IgnoreTypeV3","href":"ru/yql/syntax/pragma/yt.html#ignoretypev3","level":2},{"title":"yt.StaticPool","href":"ru/yql/syntax/pragma/yt.html#ytstaticpool","level":2},{"title":"yt.Pool","href":"ru/yql/syntax/pragma/yt.html#ytpool","level":2},{"title":"yt.Owners","href":"ru/yql/syntax/pragma/yt.html#ytowners","level":2},{"title":"yt.OperationReaders","href":"ru/yql/syntax/pragma/yt.html#ytoperationreaders","level":2},{"title":"yt.Auth","href":"ru/yql/syntax/pragma/yt.html#ytauth","level":2},{"title":"yt.DefaultMaxJobFails","href":"ru/yql/syntax/pragma/yt.html#ytdefaultmaxjobfails","level":2},{"title":"yt.DefaultMemoryLimit","href":"ru/yql/syntax/pragma/yt.html#ytdefaultmemorylimit","level":2},{"title":"yt.DataSizePerJob / yt.DataSizePerMapJob","href":"ru/yql/syntax/pragma/yt.html#datasizeperjob","level":2},{"title":"yt.DataSizePerSortJob","href":"ru/yql/syntax/pragma/yt.html#ytdatasizepersortjob","level":2},{"title":"yt.DataSizePerPartition","href":"ru/yql/syntax/pragma/yt.html#ytdatasizeperpartition","level":2},{"title":"yt.MaxJobCount","href":"ru/yql/syntax/pragma/yt.html#ytmaxjobcount","level":2},{"title":"yt.UserSlots","href":"ru/yql/syntax/pragma/yt.html#ytuserslots","leve
