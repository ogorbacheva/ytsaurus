        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;YT-прагмы по времени своего действия разделяются на статические и динамические. Статические прагмы инициализируются один раз на самой ранней стадии обработки запроса. Если статическую прагму указать несколько раз в запросе, то будет использоваться только последнее её заданное значение. Значения динамических прагм инициализируются уже на стадии непосредственно исполнения запроса, после его оптимизации и построения плана исполнения. Указанное значение действует до следующей такой же прагмы или до конца запроса. Только для динамических прагм можно сбросить их значение в значения по умолчанию через присваивание &lt;code&gt;default&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Все динамические прагмы и некоторые статические позволяют задать per-cluster настройки через синтаксис &lt;code&gt;PRAGMA &amp;lt;cluster_name&amp;gt;.&amp;lt;paragma_name&amp;gt;&lt;/code&gt;. Например, &lt;code&gt;PRAGMA foo.TmpFolder&lt;/code&gt; позволяет задать путь к временной директории для YTsaurus-кластера &lt;code&gt;foo&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Все прагмы, влияющие на оптимизаторы запроса, являются статическими, так как значения динамических прагм на этой стадии ещё не вычислено.&lt;/p&gt;\n&lt;h2 id=\"inferschema\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#inferschema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.InferSchema / yt.ForceInferSchema&lt;/span&gt;&lt;/a&gt;yt.InferSchema / yt.ForceInferSchema&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Число от 1 до 1000&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Вывод схемы данных по содержимому первых строк таблиц. Если PRAGMA указана без значения, то подразумевается, что по одной первой строке. Если указано несколько строк и типы данных для колонки встречаются разные, то они расширяются вплоть до Yson.&lt;/p&gt;\n&lt;p&gt;InferSchema включает вывод схемы данных только для тех таблиц, где она совсем не указана в метаданных. При ForceInferSchema схема данных из метаданных игнорируется, за исключением списка ключевых колонок для сортированных таблиц.&lt;/p&gt;\n&lt;p&gt;В дополнение к обнаруженным колонкам генерируется колонка-словарь _other (строка на строку) со значениями тех колонок, которые не присутствовали на первой строке, но нашлись где-то дальше. Это позволяет использовать на таких таблицах &lt;a href=\"ru/yql/builtins/basic.html#weakfield\"&gt;WeakField&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Из-за широкого спектра возможных проблем, данный режим не рекомендуется к использованию и по умолчанию отключен.&lt;/p&gt;\n&lt;h2 id=\"ytinferschematablecountthreshold\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytinferschematablecountthreshold\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.InferSchemaTableCountThreshold&lt;/span&gt;&lt;/a&gt;yt.InferSchemaTableCountThreshold&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Положительное число&lt;/td&gt;\n&lt;td&gt;50&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Если число таблиц, для которых схема выводится по содержимому, превышает указанное значение, то выведение схем запускается в виде отдельной операции на YTsaurus, что может быть значительно быстрее.&lt;/p&gt;\n&lt;h2 id=\"ytignoreweakschema\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytignoreweakschema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.IgnoreWeakSchema&lt;/span&gt;&lt;/a&gt;yt.IgnoreWeakSchema&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Игнорировать weak схему таблицы (порожденную сортировкой несхематизированной таблицы по некоторому набору полей).&lt;/p&gt;\n&lt;p&gt;Совместно с &lt;code&gt;yt.InferSchema&lt;/code&gt; позволяет выводить схему по данным для таких таблиц.&lt;/p&gt;\n&lt;h2 id=\"ytignoreyamrdsv\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytignoreyamrdsv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.IgnoreYamrDsv&lt;/span&gt;&lt;/a&gt;yt.IgnoreYamrDsv&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Игнорировать &lt;code&gt;_format=yamred_dsv&lt;/code&gt;, если он указан в метаданных входной таблицы.&lt;/p&gt;\n&lt;h2 id=\"ignoretypev3\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ignoretypev3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.IgnoreTypeV3&lt;/span&gt;&lt;/a&gt;yt.IgnoreTypeV3&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;При чтении таблиц со схемой type_v3 все поля со сложными типами будут видны в запросе как Yson поля. К сложным типам относятся все не-data типы и data-типы с опциональностью больше одного уровня.&lt;/p&gt;\n&lt;h2 id=\"ytstaticpool\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytstaticpool\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.StaticPool&lt;/span&gt;&lt;/a&gt;yt.StaticPool&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка&lt;/td&gt;\n&lt;td&gt;Логин текущего пользователя&lt;/td&gt;\n&lt;td&gt;Статическая, per-cluster&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Выбор вычислительного pool в scheduler для всех map-reduce операций в запросе (включая evaluation стадию).&lt;/p&gt;\n&lt;h2 id=\"ytpool\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytpool\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.Pool&lt;/span&gt;&lt;/a&gt;yt.Pool&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;yt.StaticPool&lt;/code&gt; если задан или логин текущего пользователя&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Выбор вычислительного pool в scheduler для регулярных операций запроса.&lt;/p&gt;\n&lt;h2 id=\"ytowners\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytowners\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.Owners&lt;/span&gt;&lt;/a&gt;yt.Owners&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка со списком логинов, разделённых любым из символов: запятая, точка с запятой, пробел или &lt;code&gt;|&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Позволяет выдавать права на управление создаваемыми MapReduce операциями в YTsaurus (отмена, пауза, run-job-shell и т.п.) другим пользователям помимо владельца YQL операции.&lt;/p&gt;\n&lt;h2 id=\"ytoperationreaders\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytoperationreaders\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.OperationReaders&lt;/span&gt;&lt;/a&gt;yt.OperationReaders&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка со списком логинов, разделённых любым из символов: запятая, точка с запятой, пробел или &lt;code&gt;|&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Позволяет выдавать права на чтение создаваемых MapReduce операций в YTsaurus другим пользователям помимо владельца YQL операции.&lt;/p&gt;\n&lt;h2 id=\"ytauth\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytauth\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.Auth&lt;/span&gt;&lt;/a&gt;yt.Auth&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Использовать аутентификационные данные, отличные от дефолтных.&lt;/p&gt;\n&lt;h2 id=\"ytdefaultmaxjobfails\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytdefaultmaxjobfails\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DefaultMaxJobFails&lt;/span&gt;&lt;/a&gt;yt.DefaultMaxJobFails&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Положительное число&lt;/td&gt;\n&lt;td&gt;5&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Количество упавших MapReduce-джобов, при достижении которого повторные попытки выполнения запроса прекращаются и запрос признается не успешным.&lt;/p&gt;\n&lt;h2 id=\"ytdefaultmemorylimit\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytdefaultmemorylimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DefaultMemoryLimit&lt;/span&gt;&lt;/a&gt;yt.DefaultMemoryLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты&lt;/td&gt;\n&lt;td&gt;512M&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Ограничение потребляемой памяти джобами в байтах, которое заказывается при запуске MapReduce-операций.&lt;/p&gt;\n&lt;p&gt;Допустимы суффиксы K, M и G для указания в килобайтах, мегабайтах и гигабайтах, соответственно.&lt;/p&gt;\n&lt;h2 id=\"datasizeperjob\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#datasizeperjob\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DataSizePerJob / yt.DataSizePerMapJob&lt;/span&gt;&lt;/a&gt;yt.DataSizePerJob / yt.DataSizePerMapJob&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты&lt;/td&gt;\n&lt;td&gt;2G&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Управление нарезкой MapReduce-операций на джобы, чем больше число, тем меньше джобов. Для вычислительно затратных джобов значение рекомендуется уменьшать, а для бегло просматривающих много данных (в частности, user_sessions) — увеличивать.&lt;/p&gt;\n&lt;p&gt;Допустимы суффиксы K, M и G для указания в килобайтах, мегабайтах и гигабайтах, соответственно.&lt;/p&gt;\n&lt;h2 id=\"ytdatasizepersortjob\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytdatasizepersortjob\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DataSizePerSortJob&lt;/span&gt;&lt;/a&gt;yt.DataSizePerSortJob&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Управление нарезкой sort-джобов в MapReduce-операциях.&lt;/p&gt;\n&lt;p&gt;Допустимы суффиксы K, M и G для указания в килобайтах, мегабайтах и гигабайтах, соответственно.&lt;/p&gt;\n&lt;h2 id=\"ytdatasizeperpartition\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytdatasizeperpartition\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DataSizePerPartition&lt;/span&gt;&lt;/a&gt;yt.DataSizePerPartition&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты&lt;/td&gt;\n&lt;td&gt;1G&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Управление размером партиций в MapReduce операциях.&lt;/p&gt;\n&lt;p&gt;Допустимы суффиксы K, M и G для указания в килобайтах, мегабайтах и гигабайтах, соответственно.&lt;/p&gt;\n&lt;h2 id=\"ytmaxjobcount\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytmaxjobcount\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MaxJobCount&lt;/span&gt;&lt;/a&gt;yt.MaxJobCount&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Положительное целое число&lt;/td&gt;\n&lt;td&gt;16384&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Максимальное количество джобов в рамках одной YTsaurus операции. Применяется только для одностадийных операций map, reduce, merge и т. д. При одновременном указании &lt;a href=\"ru/yql/syntax/pragma/yt.html#datasizeperjob\"&gt;&lt;code&gt;yt.DataSizePerJob&lt;/code&gt;&lt;/a&gt; и &lt;code&gt;yt.MaxJobCount&lt;/code&gt; нарезка джобов будет выполняться с учетом &lt;a href=\"ru/yql/syntax/pragma/yt.html#datasizeperjob\"&gt;&lt;code&gt;yt.DataSizePerJob&lt;/code&gt;&lt;/a&gt;, и даже если полученное значение &lt;code&gt;N&lt;/code&gt; превысит &lt;code&gt;yt.MaxJobCount&lt;/code&gt;, то будет запущено &lt;code&gt;N&lt;/code&gt; джобов, а &lt;code&gt;yt.MaxJobCount&lt;/code&gt; повлияет только на то, будут ли сплититься джобы, после того как их количество достигнет некоторого порога.&lt;/p&gt;\n&lt;h2 id=\"ytuserslots\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytuserslots\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.UserSlots&lt;/span&gt;&lt;/a&gt;yt.UserSlots&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Положительное число&lt;/td&gt;\n&lt;td&gt;Не ограничено&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Ограничение сверху на число выполняющихся параллельно джобов в рамках MapReduce операции.&lt;/p&gt;\n&lt;h2 id=\"ytdefaultoperationweight\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytdefaultoperationweight\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DefaultOperationWeight&lt;/span&gt;&lt;/a&gt;yt.DefaultOperationWeight&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Число с плавающей точкой&lt;/td&gt;\n&lt;td&gt;1.0&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Вес всех запускаемых MapReduce-операций в рамках выбранного вычислительного pool.&lt;/p&gt;\n&lt;h2 id=\"yttmpfolder\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#yttmpfolder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TmpFolder&lt;/span&gt;&lt;/a&gt;yt.TmpFolder&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;//tmp/yql/&amp;lt;login&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Статическая, per-cluster&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Директория для размещения временных таблиц и файлов.&lt;/p&gt;\n&lt;h2 id=\"yttablestmpfolder\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#yttablestmpfolder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TablesTmpFolder&lt;/span&gt;&lt;/a&gt;yt.TablesTmpFolder&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;//tmp/yql/&amp;lt;login&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Статическая, per-cluster&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Директория для размещения &lt;a href=\"ru/yql/faq/temp.html\"&gt;временных таблиц&lt;/a&gt;. Имеет приоритет над &lt;code&gt;yt.TmpFolder&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"yttemptablesttl\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#yttemptablesttl\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TempTablesTtl&lt;/span&gt;&lt;/a&gt;yt.TempTablesTtl&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Интервал времени с поддержкой суффиксов &lt;code&gt;s/m/h/d&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Позволяет управлять TTL &lt;a href=\"ru/yql/faq/temp.html\"&gt;временных таблиц&lt;/a&gt;. Имеет эффект для таблиц с полным результатом, остальные временные таблицы безусловно удаляются при завершении запроса независмо от этой прагмы.&lt;/p&gt;\n&lt;h2 id=\"ytfilecachettl\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytfilecachettl\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.FileCacheTtl&lt;/span&gt;&lt;/a&gt;yt.FileCacheTtl&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Интервал времени с поддержкой суффиксов &lt;code&gt;s/m/h/d&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;7d&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Позволяет управлять TTL &lt;a href=\"ru/yql/faq/temp.html\"&gt;файлового кэша&lt;/a&gt; YTsaurus. Значение 0 отключает использование TTL для файлового кеша.&lt;/p&gt;\n&lt;h2 id=\"ytintermediateaccount\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytintermediateaccount\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.IntermediateAccount&lt;/span&gt;&lt;/a&gt;yt.IntermediateAccount&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Имя account в YTsaurus&lt;/td&gt;\n&lt;td&gt;intermediate&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Позволяет использовать свой account для промежуточных данных внутри операции слитного MapReduce.&lt;/p&gt;\n&lt;p&gt;По умолчанию используется общий, который имеет шанс в неподходящий момент переполниться.&lt;/p&gt;\n&lt;p&gt;Если указана &lt;a href=\"ru/yql/syntax/pragma/yt.html#yt.tmpfolder\"&gt;PRAGMA yt.TmpFolder&lt;/a&gt;, то по умолчанию вместо общего берется account, который указан на временной директории.&lt;/p&gt;\n&lt;h2 id=\"ytintermediatereplicationfactor\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytintermediatereplicationfactor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.IntermediateReplicationFactor&lt;/span&gt;&lt;/a&gt;yt.IntermediateReplicationFactor&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Число от 1 до 10&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Фактор репликации промежуточных данных.&lt;/p&gt;\n&lt;h2 id=\"replicationfactor\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#replicationfactor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.PublishedReplicationFactor / yt.TemporaryReplicationFactor&lt;/span&gt;&lt;/a&gt;yt.PublishedReplicationFactor / yt.TemporaryReplicationFactor&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Число от 1 до 10&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Фактор репликации создаваемых через YQL таблиц.&lt;/p&gt;\n&lt;p&gt;Published являются таблицы, указанные в &lt;a href=\"ru/yql/syntax/insert_into.html\"&gt;INSERT INTO&lt;/a&gt; все остальные считаются временными (Temporary).&lt;/p&gt;\n&lt;h2 id=\"ytexternaltx\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytexternaltx\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.ExternalTx&lt;/span&gt;&lt;/a&gt;yt.ExternalTx&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Статическая, per-cluster&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Выполнение операции в рамках уже запущенной вне YQL транзакции. В значение передается её идентификатор.&lt;/p&gt;\n&lt;p&gt;Все необходимые для работы запроса директории создаются в рамках указанной транзакции, что может приводить к конфликтам при попытках писать в ранее не существующую директорию из двух запросов с разными ExternalTx.&lt;/p&gt;\n&lt;h2 id=\"ytoptimizefor\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytoptimizefor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.OptimizeFor&lt;/span&gt;&lt;/a&gt;yt.OptimizeFor&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка: lookup / scan&lt;/td&gt;\n&lt;td&gt;scan&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Управление атрибутом &lt;code&gt;optimize_for&lt;/code&gt; на создаваемых таблицах.&lt;/p&gt;\n&lt;h2 id=\"compressioncodec\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#compressioncodec\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.PublishedCompressionCodec / yt.TemporaryCompressionCodec&lt;/span&gt;&lt;/a&gt;yt.PublishedCompressionCodec / yt.TemporaryCompressionCodec&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка, см. &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/storage/compression\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;документацию&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;zstd_5&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Настройки компрессии создаваемых через YQL таблиц.&lt;/p&gt;\n&lt;p&gt;Published являются таблицы, указанные в &lt;a href=\"ru/yql/syntax/insert_into.html\"&gt;INSERT INTO&lt;/a&gt; все остальные считаются временными (Temporary). Также кодек, указанный как Temporary, используется для промежуточных данных в рамках одной YTsaurus операции, например слитного MapReduce.&lt;/p&gt;\n&lt;h2 id=\"ytpublishederasurecodec-/-yttemporaryerasurecodec\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytpublishederasurecodec-/-yttemporaryerasurecodec\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.PublishedErasureCodec / yt.TemporaryErasureCodec&lt;/span&gt;&lt;/a&gt;yt.PublishedErasureCodec / yt.TemporaryErasureCodec&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка, см. &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/storage/replication#erasure\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;документацию&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;none&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Erasure кодирование по умолчанию всегда выключено, для включения рекомендуется использовать значение lrc_12_2_2.&lt;/p&gt;\n&lt;p&gt;Разница между Published и Temporary аналогична &lt;a href=\"ru/yql/syntax/pragma/yt.html#compressioncodec\"&gt;CompressionCodec&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytnightlycompress\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytnightlycompress\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.NightlyCompress&lt;/span&gt;&lt;/a&gt;yt.NightlyCompress&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Управляет процессом &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/storage/regular-system-processes#nightly_compress\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;фонового сжатия таблиц&lt;/a&gt;, чтобы они занимали меньше места.&lt;/p&gt;\n&lt;p&gt;Значение &lt;code&gt;true&lt;/code&gt; устанавливает на таблице атрибут &lt;code&gt;@force_nightly_compress&lt;/code&gt; равным &lt;code&gt;true&lt;/code&gt;.&lt;br /&gt;\nЗначение &lt;code&gt;false&lt;/code&gt; устанавливает на таблице атрибут &lt;code&gt;@nightly_compression_settings&lt;/code&gt; с дочерним значением &lt;code&gt;enabled&lt;/code&gt; равным &lt;code&gt;false&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Настройка действует только на вновь создаваемые YQL запросом таблицы (а также на перезаписываемые с помощью &lt;a href=\"ru/yql/syntax/pragma/insert_into\"&gt;INSERT INTO ... WITH TRUNCATE&lt;/a&gt;).&lt;br /&gt;\nНастройка не действует на временные таблицы.&lt;/p&gt;\n&lt;h2 id=\"ytexpirationdeadline-/-ytexpirationinterval\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytexpirationdeadline-/-ytexpirationinterval\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.ExpirationDeadline / yt.ExpirationInterval&lt;/span&gt;&lt;/a&gt;yt.ExpirationDeadline / yt.ExpirationInterval&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;ExpirationDeadline: момент времени в формате &lt;a href=\"https://en.wikipedia.org/wiki/ISO_8601\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ISO 8601&lt;/a&gt;. ExpirationInterval: интервал времени с поддержкой суффиксов &lt;code&gt;s/m/h/d&lt;/code&gt;, в течение которого к узлу должны отсутствовать обращения.&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Позволяет управлять &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/storage/cypress#TTL\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TTL создаваемых операцией таблиц&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytmaxrowweight\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytmaxrowweight\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MaxRowWeight&lt;/span&gt;&lt;/a&gt;yt.MaxRowWeight&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты, до 128M&lt;/td&gt;\n&lt;td&gt;16M&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Увеличить ограничение на максимальную длину строки таблицы в yt.&lt;/p&gt;\n&lt;h2 id=\"ytmaxkeyweight\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytmaxkeyweight\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MaxKeyWeight&lt;/span&gt;&lt;/a&gt;yt.MaxKeyWeight&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты, до 256K&lt;/td&gt;\n&lt;td&gt;16K&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Увеличить ограничение на максимальную длину ключей таблицы в YTsaurus, по которым она отсортирована.&lt;/p&gt;\n&lt;h2 id=\"ytusetmpfs\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytusetmpfs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.UseTmpfs&lt;/span&gt;&lt;/a&gt;yt.UseTmpfs&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Подключает &lt;a href=\"https://en.wikipedia.org/wiki/Tmpfs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;tmpfs&lt;/a&gt; к папке &lt;code&gt;_yql_tmpfs&lt;/code&gt; в песочнице MapReduce-джобов. Не рекомендуется к использованию.&lt;/p&gt;\n&lt;h2 id=\"ytextratmpfssize\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytextratmpfssize\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.ExtraTmpfsSize&lt;/span&gt;&lt;/a&gt;yt.ExtraTmpfsSize&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Возможность увеличить размер tmpfs в дополнение к суммарному размеру всех явно используемых файлов (указывается в мегабайтах). Может быть полезно, если вы из UDF создаете новые файлы локально. Без &lt;a href=\"ru/yql/syntax/pragma/yt.html#yt.usetmpfs\"&gt;UseTmpfs&lt;/a&gt; игнорируется.&lt;/p&gt;\n&lt;h2 id=\"ytpooltrees\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytpooltrees\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.PoolTrees&lt;/span&gt;&lt;/a&gt;yt.PoolTrees&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка со списком имён деревьев, разделённых любым из символов: запятая, точка с запятой, пробел или `&lt;/td&gt;\n&lt;td&gt;`&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Возможность выбирать отличные от стандартного «деревья pool'ов».&lt;/p&gt;\n&lt;h2 id=\"yttentativepooltrees\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#yttentativepooltrees\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TentativePoolTrees&lt;/span&gt;&lt;/a&gt;yt.TentativePoolTrees&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка со списком имён деревьев, разделённых любым из символов: запятая, точка с запятой, пробел или &lt;code&gt;|&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Возможность «осторожно» распространить операции на отличные от стандартных «деревья pool'ов».&lt;/p&gt;\n&lt;h2 id=\"yttentativetreeeligibilitysamplejobcount\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#yttentativetreeeligibilitysamplejobcount\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TentativeTreeEligibilitySampleJobCount&lt;/span&gt;&lt;/a&gt;yt.TentativeTreeEligibilitySampleJobCount&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Положительное число&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Имеет эффект только при наличии прагмы &lt;code&gt;yt.TentativePoolTrees&lt;/code&gt;. Задаёт количество джобов в семпле.&lt;/p&gt;\n&lt;h2 id=\"yttentativetreeeligibilitymaxjobdurationratio\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#yttentativetreeeligibilitymaxjobdurationratio\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TentativeTreeEligibilityMaxJobDurationRatio&lt;/span&gt;&lt;/a&gt;yt.TentativeTreeEligibilityMaxJobDurationRatio&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Число с плавающей точкой&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Имеет эффект только при наличии прагмы &lt;code&gt;yt.TentativePoolTrees&lt;/code&gt;. Задаёт коэффициент допустимого замедления джобов в альтернативном «дереве pool'ов».&lt;/p&gt;\n&lt;h2 id=\"yttentativetreeeligibilityminjobduration\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#yttentativetreeeligibilityminjobduration\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TentativeTreeEligibilityMinJobDuration&lt;/span&gt;&lt;/a&gt;yt.TentativeTreeEligibilityMinJobDuration&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Миллисекунды&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Имеет эффект только при наличии прагмы &lt;code&gt;yt.TentativePoolTrees&lt;/code&gt;. Задаёт минимальную среднюю длительность джобов в альтернативном «дереве pool'ов».&lt;/p&gt;\n&lt;h2 id=\"ytusedefaulttentativepooltrees\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytusedefaulttentativepooltrees\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.UseDefaultTentativePoolTrees&lt;/span&gt;&lt;/a&gt;yt.UseDefaultTentativePoolTrees&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт значение опции &lt;code&gt;use_default_tentative_pool_trees&lt;/code&gt; в спеке операции.&lt;/p&gt;\n&lt;h2 id=\"querycache\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#querycache\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.QueryCacheMode&lt;/span&gt;&lt;/a&gt;yt.QueryCacheMode&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка: disable / readonly / refresh / normal&lt;/td&gt;\n&lt;td&gt;normal&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Кеш работает на уровне MapReduce операций:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;В режиме &lt;strong&gt;disable&lt;/strong&gt; кеш отключен.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;readonly&lt;/strong&gt; — использовать только на чтение, не писать в него.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;refresh&lt;/strong&gt; — использовать только на запись, не читать из него; при ошибке параллельной записи в кеш из другой транзакции выдать ошибку запроса.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;normal&lt;/strong&gt; — использовать и на запись, и на чтение; при ошибке параллельной записи в кеш из другой транзакции считать что записаны те же данные и продолжать работу.&lt;br /&gt;\nВ режимах &lt;strong&gt;normal&lt;/strong&gt; и &lt;strong&gt;refresh&lt;/strong&gt; результат каждой их них дополнительно сохраняется по пути &lt;code&gt;//&amp;lt;tmp_folder&amp;gt;/query_cache/&amp;lt;hash&amp;gt;&lt;/code&gt;, где:&lt;/li&gt;\n&lt;li&gt;tmp_folder — по умолчанию &lt;code&gt;tmp/&amp;lt;login&amp;gt;&lt;/code&gt;, либо значение &lt;a href=\"ru/yql/syntax/pragma/yt.html#yt.tmpfolder\"&gt;PRAGMA yt.TmpFolder&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;hash — хеш от значимых метаданных входных таблиц и выполнявшейся в операции логической программы.&lt;br /&gt;\nВ режимах &lt;strong&gt;normal&lt;/strong&gt; и &lt;strong&gt;readonly&lt;/strong&gt; перед самым запуском MapReduce операции для неё вычисляется такой путь и в зависимости от выбранного режима кеширования операция либо запускается, либо мгновенно отмечается успешной с использованием готовой таблицы вместо её результата. Если в выражении попадается недетерминированные функции Random/RandomNumber/RandomUuid/CurrentUtcDate/CurrentUtcDatetime/CurrentUtcTimestamp, то кеш для такой операции отключается. На данный момент все UDF считаются детерминированными, т.е. не мешают кешированию. Если нужно использовать недетерминированную UDF, то нужно ввести для неё дополнительный аргумент типа Uint64 и передать в него &lt;code&gt;CurrentUtcTimestamp()&lt;/code&gt; — достаточно без аргументов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"ytquerycacheignoretablerevision\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytquerycacheignoretablerevision\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.QueryCacheIgnoreTableRevision&lt;/span&gt;&lt;/a&gt;yt.QueryCacheIgnoreTableRevision&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;false&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Если флаг установлен, то при вычислении хеша из метаданных таблиц исключается YTsaurus &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/storage/cypress\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;revision&lt;/a&gt;. Таким образом QueryCache не инвалидируется при изменении содержимого входных таблиц.&lt;/p&gt;\n&lt;p&gt;Режим предназначен, в основном, для ускорения отладки сложных запросов над большими изменяемыми таблицами, в случае, когда в логике запроса возможно игнорировать эти изменения.&lt;/p&gt;\n&lt;h2 id=\"ytquerycachesalt\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytquerycachesalt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.QueryCacheSalt&lt;/span&gt;&lt;/a&gt;yt.QueryCacheSalt&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Произвольная строка&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Соль для подмешивания в расчет хеш-значений операций для кеша запросов&lt;/p&gt;\n&lt;h2 id=\"ytquerycachettl\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytquerycachettl\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.QueryCacheTtl&lt;/span&gt;&lt;/a&gt;yt.QueryCacheTtl&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Интервал времени с поддержкой суффиксов &lt;code&gt;s/m/h/d&lt;/code&gt;, который будет отсчитан от момента создания таблицы в кеше запросов или от момента последнего использования таблицы.&lt;/td&gt;\n&lt;td&gt;7d&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Позволяет управлять &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/storage/cypress\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TTL создаваемых операцией таблиц в кеше запросов&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytautomerge-/-yttemporaryautomerge-/-ytpublishedautomerge\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytautomerge-/-yttemporaryautomerge-/-ytpublishedautomerge\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.AutoMerge / yt.TemporaryAutoMerge / yt.PublishedAutoMerge&lt;/span&gt;&lt;/a&gt;yt.AutoMerge / yt.TemporaryAutoMerge / yt.PublishedAutoMerge&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка: relaxed / economy / disabled&lt;/td&gt;\n&lt;td&gt;relaxed&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Управление &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/data-processing/operations/automerge\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;одноименной настройкой YTsaurus&lt;/a&gt;, помогающей уменьшить потребление квоты на число chunk'ов. &lt;code&gt;yt.TemporaryAutoMerge&lt;/code&gt; действует для всех YT-операций, за исключением merge внутри YtPublish узла.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;yt.PublishedAutoMerge&lt;/code&gt; действует только для merge внутри YtPublish узла (если он там запускается). &lt;code&gt;yt.AutoMerge&lt;/code&gt; задаёт значение этой настройки одновременно для всех YTsaurus операций запроса.&lt;/p&gt;\n&lt;h2 id=\"ytscriptcpu\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytscriptcpu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.ScriptCpu&lt;/span&gt;&lt;/a&gt;yt.ScriptCpu&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Число с плавающей точкой, не меньше 1.0&lt;/td&gt;\n&lt;td&gt;1.0&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Множитель для оценки потребления процессора скриптовых UDF (включая &lt;a href=\"ru/yql/udf/python.html\"&gt;Python UDF&lt;/a&gt;. Влияет на разбиение MapReduce-операций на джобы. Может быть переопределён специализированными прагмами &lt;code&gt;yt.PythonCpu&lt;/code&gt; / &lt;code&gt;yt.JavascriptCpu&lt;/code&gt; для конкретного типа UDF.&lt;/p&gt;\n&lt;h2 id=\"ytpythoncpu\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytpythoncpu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.PythonCpu&lt;/span&gt;&lt;/a&gt;yt.PythonCpu&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Число с плавающей точкой, не меньше 1.0&lt;/td&gt;\n&lt;td&gt;4.0&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Множитель для оценки потребления процессора &lt;a href=\"ru/yql/udf/python.html\"&gt;Python UDF&lt;/a&gt;, влияет на разбиение MapReduce-операций на джобы.&lt;/p&gt;\n&lt;h2 id=\"yterasurecodeccpu\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#yterasurecodeccpu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.ErasureCodecCpu&lt;/span&gt;&lt;/a&gt;yt.ErasureCodecCpu&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Число с плавающей точкой, не меньше 1.0&lt;/td&gt;\n&lt;td&gt;1.0&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Множитель для оценки потребления процессора для обработки таблиц, пожатых erasure кодеком. Влияет на разбиение MapReduce-операций на джобы.&lt;/p&gt;\n&lt;h2 id=\"ytreleasetempdata\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytreleasetempdata\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.ReleaseTempData&lt;/span&gt;&lt;/a&gt;yt.ReleaseTempData&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка: immediate / finish / never&lt;/td&gt;\n&lt;td&gt;immediate&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Позволяет управлять моментом удаления временных объектов (например таблиц), которые создаются при выполнении запроса:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;immediate&lt;/code&gt; — удалять объекты сразу как только они становятся не нужны.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;finish&lt;/code&gt; — удалять в конце выполнения всего YQL запроса.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;never&lt;/code&gt; — никогда не удалять.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"ytcoredumppath\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytcoredumppath\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.CoreDumpPath&lt;/span&gt;&lt;/a&gt;yt.CoreDumpPath&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Путь на кластере&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Статическая, per-cluster&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Позволяет сохранить &lt;a href=\"https://en.wikipedia.org/wiki/Core_dump\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;coredump&lt;/a&gt; от упавших джобов MapReduce операций в отдельную таблицу.&lt;/p&gt;\n&lt;h2 id=\"ytmaxinputtables\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytmaxinputtables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MaxInputTables&lt;/span&gt;&lt;/a&gt;yt.MaxInputTables&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Положительное число&lt;/td&gt;\n&lt;td&gt;1000&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Ограничение на число таблиц, подаваемых на вход каждой конкретной MapReduce операции.&lt;/p&gt;\n&lt;h2 id=\"ytmaxinputtablesforsortedmerge\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytmaxinputtablesforsortedmerge\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MaxInputTablesForSortedMerge&lt;/span&gt;&lt;/a&gt;yt.MaxInputTablesForSortedMerge&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Положительное число&lt;/td&gt;\n&lt;td&gt;100&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Ограничение на число таблиц, подаваемых на вход sorted merge операции.&lt;/p&gt;\n&lt;h2 id=\"ytmaxoutputtables\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytmaxoutputtables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MaxOutputTables&lt;/span&gt;&lt;/a&gt;yt.MaxOutputTables`&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Число от 1 до 100&lt;/td&gt;\n&lt;td&gt;50&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Ограничение на число выходных таблиц каждой конкретной MapReduce операции.&lt;/p&gt;\n&lt;h2 id=\"ytjoincollectcolumnarstatistics\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytjoincollectcolumnarstatistics\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.JoinCollectColumnarStatistics&lt;/span&gt;&lt;/a&gt;yt.JoinCollectColumnarStatistics&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка: disable / sync / async&lt;/td&gt;\n&lt;td&gt;async&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Управляет использованием поколоночных статистик для точной оценки входов JOIN-ов и выбора соответствующей стратегии. Async включает режим асинхронного сбора поколоночной статистики.&lt;/p&gt;\n&lt;h2 id=\"ytjoincolumnarstatisticsfetchermode\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytjoincolumnarstatisticsfetchermode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.JoinColumnarStatisticsFetcherMode&lt;/span&gt;&lt;/a&gt;yt.JoinColumnarStatisticsFetcherMode&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка: from_nodes / from_master / fallback&lt;/td&gt;\n&lt;td&gt;fallback&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Управляет режимим запроса поколоночных статистик для точной оценки входов JOIN-ов от YTsaurus. Режим from_nodes обеспечивает точную оценку, но может не укладываться в таймауты для больших таблиц. Режим from_master работает очень быстро, но дает огрубленную статистику. Режим fallback работает как комбинация предыдущих двух.&lt;/p&gt;\n&lt;h2 id=\"ytmapjoinlimit\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytmapjoinlimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MapJoinLimit&lt;/span&gt;&lt;/a&gt;yt.MapJoinLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты&lt;/td&gt;\n&lt;td&gt;2048M&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Ограничение на размер меньшей таблицы в JOIN, при котором включается Map-side стратегия (создание словаря в памяти из меньшей таблицы и использование его в Map по большей).&lt;/p&gt;\n&lt;p&gt;Указав в значении 0 можно совсем отключить данную стратегию.&lt;/p&gt;\n&lt;h2 id=\"ytmapjoinshardcount\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytmapjoinshardcount\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MapJoinShardCount&lt;/span&gt;&lt;/a&gt;yt.MapJoinShardCount&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Число от 1 до 10&lt;/td&gt;\n&lt;td&gt;4&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Map-side стратегия JOIN может выполняться в шардированном варианте: меньшая сторона разбивается на N шардов (где N — меньше или равно значению данной PRAGMA), каждый из которых независимо и параллельно объединяется с большей стороной, а затем результатом JOIN считается конкатенация JOIN с шардами.&lt;/p&gt;\n&lt;h2 id=\"ytmapjoinshardminrows\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytmapjoinshardminrows\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MapJoinShardMinRows&lt;/span&gt;&lt;/a&gt;yt.MapJoinShardMinRows&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Положительное число&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Минимально количество записей на шард в map-side стратегии JOIN.&lt;/p&gt;\n&lt;h2 id=\"ytjoinmergetableslimit\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytjoinmergetableslimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.JoinMergeTablesLimit&lt;/span&gt;&lt;/a&gt;yt.JoinMergeTablesLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Положительное число&lt;/td&gt;\n&lt;td&gt;64&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Суммарное допустимое число таблиц слева и справа для включения Ordered стратегии JOIN.&lt;/p&gt;\n&lt;p&gt;Указав в значении 0 можно совсем отключить данную стратегию.&lt;/p&gt;\n&lt;h2 id=\"ytjoinmergeusesmallasprimary\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytjoinmergeusesmallasprimary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.JoinMergeUseSmallAsPrimary&lt;/span&gt;&lt;/a&gt;yt.JoinMergeUseSmallAsPrimary&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Явное управление выбором primary таблицы в операции Reduce при Ordered JOIN стратегии. Если установлен в true, то в качестве primary таблички всегда будет выбираться меньшая сторона. Если значение флага равно false, то будет выбираться большая сторона за исключением случая уникальных ключей на большей стороне. Выбор большей таблицы в качестве primary безопасен даже при наличии в ней ключей-монстров, но работает медленнее. Если данная прагма не установлена, то выбор primary происходит автоматически исходя из максимального размера получающихся джобов (см. yt.JoinMergeReduceJobMaxSize).&lt;/p&gt;\n&lt;h2 id=\"ytjoinmergereducejobmaxsize\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytjoinmergereducejobmaxsize\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.JoinMergeReduceJobMaxSize&lt;/span&gt;&lt;/a&gt;yt.JoinMergeReduceJobMaxSize&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты&lt;/td&gt;\n&lt;td&gt;8G&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Максимально допустимый размер Reduce джобы при выборе маленькой таблицы в качестве primary при Ordered JOIN стратегии. Если получившийся размер превышает указанное значение, то операция Reduce повторяется с большей таблицей в качестве primary.&lt;/p&gt;\n&lt;h2 id=\"ytjoinmergeunsortedfactor\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytjoinmergeunsortedfactor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.JoinMergeUnsortedFactor&lt;/span&gt;&lt;/a&gt;yt.JoinMergeUnsortedFactor&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Положительное число с плавающей точкой&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Минимальное соотношение размера несортированной стороны JOIN к сортированной для её  досортировки и выбора Ordered стратегии JOIN.&lt;/p&gt;\n&lt;h2 id=\"ytjoinmergeforce\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytjoinmergeforce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.JoinMergeForce&lt;/span&gt;&lt;/a&gt;yt.JoinMergeForce&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;-&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Форсирует выбор Ordered JOIN стратегии. Если флаг установлен в True, то Ordered JOIN стратегия выбирается, даже если одна или обе стороны JOIN не сортированы. При этом несортированные стороны предварительно сортируются. Ограничения на максимальный размер несортированной таблицы (см. &lt;code&gt;yt.JoinMergeUnsortedFactor&lt;/code&gt;) при этом игнорируются.&lt;/p&gt;\n&lt;h2 id=\"ytjoinallowcolumnrenames\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytjoinallowcolumnrenames\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.JoinAllowColumnRenames&lt;/span&gt;&lt;/a&gt;yt.JoinAllowColumnRenames&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Включает использование переименования колонок при выполнении стратегии Ordered JOIN (используется атрибут &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/data-processing/operations/operations-options#path_attributes\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;rename_columns&lt;/a&gt;). Если опция выключена, то стратегия Ordered JOIN будет выбрана только при совпадении имён колонок слева и справа.&lt;/p&gt;\n&lt;h2 id=\"ytusecolumnarstatistics\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytusecolumnarstatistics\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.UseColumnarStatistics&lt;/span&gt;&lt;/a&gt;yt.UseColumnarStatistics&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка: disable / auto / force / 0 (=disable) / 1 (=force)&lt;/td&gt;\n&lt;td&gt;force&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Включает использование поколоночных статистик для точной оценки размеров джобов при запуске операций поверх таблиц с колоночными выборками. См. &lt;a href=\"https://ytsaurus.tech/docs/ru/user-guide/data-processing/operations/operations-options#common_options\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;документацию&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;В режиме auto автоматически отключает использование статистик для операций, на входе которых есть таблицы с &lt;code&gt;optimize_for=lookup&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"ytminpublishedavgchunksize\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytminpublishedavgchunksize\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MinPublishedAvgChunkSize&lt;/span&gt;&lt;/a&gt;yt.MinPublishedAvgChunkSize&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Если средний размер чанка в получившейся выходной таблице оказался меньше, чем указанная настройка, то запускается дополнительная YTsaurus Merge операция, которая укрупняет чанки до указанного размера. Значение 0 имеет специальный смысл — в этом случае merge всегда запускается и укрупняет чанки до 1G.&lt;/p&gt;\n&lt;p&gt;Если для таблицы используется compression codec, то размер чанков на выходе может отличаться от заданного на коэффициент компрессии. По сути, данная прагма задаёт размер данных на один merge job. После компрессии выходной размер может быть значительно меньше. В этом случае стоит увеличить значение прагмы на ожидаемый коэффициент компрессии.&lt;/p&gt;\n&lt;h2 id=\"ytmintempavgchunksize\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytmintempavgchunksize\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.MinTempAvgChunkSize&lt;/span&gt;&lt;/a&gt;yt.MinTempAvgChunkSize&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Настройка аналогична &lt;code&gt;yt.MinPublishedAvgChunkSize&lt;/code&gt;, но работает для промежуточных временных таблиц.&lt;/p&gt;\n&lt;h2 id=\"yttablecontentdeliverymode\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#yttablecontentdeliverymode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TableContentDeliveryMode&lt;/span&gt;&lt;/a&gt;yt.TableContentDeliveryMode&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка: native / file&lt;/td&gt;\n&lt;td&gt;native&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Если задано значение native, то содержимое таблицы доставляется в джобы через родные механизмы YTsaurus. При значении file, содержимое таблицы сначала скачивается на сервере YQL, а затем доставляется в джобы как обычный файл.&lt;/p&gt;\n&lt;h2 id=\"yttablecontentmaxchunksfornativedelivery\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#yttablecontentmaxchunksfornativedelivery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TableContentMaxChunksForNativeDelivery&lt;/span&gt;&lt;/a&gt;yt.TableContentMaxChunksForNativeDelivery&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Положительное число, до 1000 включительно&lt;/td&gt;\n&lt;td&gt;1000&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Максимальное число чанков в таблице для её доставки в джобы через родные механизмы YTsaurus. При превышении этого числа таблица доставляется через файл.&lt;/p&gt;\n&lt;h2 id=\"yttablecontentcompresslevel\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#yttablecontentcompresslevel\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TableContentCompressLevel&lt;/span&gt;&lt;/a&gt;yt.TableContentCompressLevel&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Положительное число, до 11 включительно&lt;/td&gt;\n&lt;td&gt;8&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Настройка уровня компрессии содержимого таблицы, доставляемого через файл (при yt.TableContentDeliveryMode=\"file\").&lt;/p&gt;\n&lt;h2 id=\"yttablecontenttmpfolder\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#yttablecontenttmpfolder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TableContentTmpFolder&lt;/span&gt;&lt;/a&gt;yt.TableContentTmpFolder&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Путь на кластере&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Директория, где будут размещаться временные файлы для таблиц, доставляемых через файл (при yt.TableContentDeliveryMode=\"file\"). Если не задана, то используется стандартный файловый кеш YTsaurus.&lt;/p&gt;\n&lt;h2 id=\"yttablecontentminavgchunksize\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#yttablecontentminavgchunksize\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TableContentMinAvgChunkSize&lt;/span&gt;&lt;/a&gt;yt.TableContentMinAvgChunkSize&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты&lt;/td&gt;\n&lt;td&gt;1GB&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Минимальный средний размер чанков в таблице для её доставки в джобы через родные механизмы YTsaurus. Для недостаточно больших чанков вставляется предварительный merge.&lt;/p&gt;\n&lt;h2 id=\"yttablecontentmaxinputtables\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#yttablecontentmaxinputtables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TableContentMaxInputTables&lt;/span&gt;&lt;/a&gt;yt.TableContentMaxInputTables&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Положительное число, до 1000 включительно&lt;/td&gt;\n&lt;td&gt;1000&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Максимально число таблиц для доставки в джобы через родные механизмы YTsaurus. При превышении этого числа вставляется предварительный merge.&lt;/p&gt;\n&lt;h2 id=\"yttablecontentuseskiff\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#yttablecontentuseskiff\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.TableContentUseSkiff&lt;/span&gt;&lt;/a&gt;yt.TableContentUseSkiff&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Включает skiff-формат для доставки таблицы в джобы операций.&lt;/p&gt;\n&lt;h2 id=\"ytlayerpaths\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytlayerpaths\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.LayerPaths&lt;/span&gt;&lt;/a&gt;yt.LayerPaths&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Строка со списком путей до porto-слоев, разделённых любым из символов: запятая, точка с запятой, пробел или &lt;code&gt;|&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Возможность указать последовательность porto-слоев для формирования среды, в которой будут выполняться пользовательские джобы.&lt;/p&gt;\n&lt;h2 id=\"ytuseskiff\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytuseskiff\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.UseSkiff&lt;/span&gt;&lt;/a&gt;yt.UseSkiff&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Флаг&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Включает skiff-формат для ввода-вывода в джобах операций.&lt;/p&gt;\n&lt;h2 id=\"ytdefaultcalcmemorylimit\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytdefaultcalcmemorylimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DefaultCalcMemoryLimit&lt;/span&gt;&lt;/a&gt;yt.DefaultCalcMemoryLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Байты&lt;/td&gt;\n&lt;td&gt;1G&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Ограничение потребляемой памяти для вычислений, не связанных с доступом к таблицам.&lt;/p&gt;\n&lt;p&gt;Допустимы суффиксы K, M и G для указания в килобайтах, мегабайтах и гигабайтах, соответственно.&lt;/p&gt;\n&lt;h2 id=\"ytparalleloperationslimit\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytparalleloperationslimit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.ParallelOperationsLimit&lt;/span&gt;&lt;/a&gt;yt.ParallelOperationsLimit&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Число, не меньше 1&lt;/td&gt;\n&lt;td&gt;16&lt;/td&gt;\n&lt;td&gt;Статическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт максимальное число одновременно запускаемых YTsaurus-операций в пределах запроса.&lt;/p&gt;\n&lt;h2 id=\"ytdefaultmemoryreservefactor\"&gt;&lt;a href=\"ru/yql/syntax/pragma/yt.html#ytdefaultmemoryreservefactor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;yt.DefaultMemoryReserveFactor&lt;/span&gt;&lt;/a&gt;yt.DefaultMemoryReserveFactor&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тип значения&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Статическая /&lt;br /&gt;динамическая&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Число с плавающей точкой от 0.0 до 1.0 включительно&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Динамическая&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Задаёт коэффициент резервирования памяти дл
