        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"opredelenie-pragm\"&gt;&lt;a href=\"ru/yql/syntax/pragma/index.html#opredelenie-pragm\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение прагм&lt;/span&gt;&lt;/a&gt;Определение прагм&lt;/h2&gt;\n&lt;p&gt;Прагмы — это специальные директивы, которые переопределяют настройки выполнения запроса. Например, с их помощью можно выбрать стратегию объединения таблиц, настроить уровень логирования ошибок или указать, в каком пуле выполнять операции запроса. Прагмы могут влиять на скорость выполнения запроса, на распределение ресурсов и семантику.&lt;/p&gt;\n&lt;p&gt;Действие прагм распространяется только в рамках текущего запроса. Подробнее смотри в разделе &lt;a href=\"ru/yql/syntax/pragma/global.html#pragmascope\"&gt;область действия прагм&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Полный список доступных настроек &lt;a href=\"ru/yql/syntax/pragma/index.html#pragmas\"&gt;см. ниже&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"sintaksis\"&gt;&lt;a href=\"ru/yql/syntax/pragma/index.html#sintaksis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Синтаксис&lt;/span&gt;&lt;/a&gt;Синтаксис&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;PRAGMA x.y = \"z\";&lt;/code&gt; или &lt;code&gt;PRAGMA x.y(\"z\", \"z2\", \"z3\");&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;x&lt;/code&gt; — (опционально) категория настройки.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;y&lt;/code&gt; — название настройки.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;z&lt;/code&gt; — (опционально для флагов) значение настройки. Допустимо использование следующих суффиксов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Kb&lt;/code&gt;, &lt;code&gt;Mb&lt;/code&gt;, &lt;code&gt;Gb&lt;/code&gt; — для объёма информации.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;sec&lt;/code&gt;, &lt;code&gt;min&lt;/code&gt;, &lt;code&gt;h&lt;/code&gt;, &lt;code&gt;d&lt;/code&gt; — для временных значений.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Для &lt;a href=\"ru/yql/syntax/pragma/yt.html\"&gt;динамических прагм yt&lt;/a&gt; значение настроек можно вернуть в состояние по умолчанию — с помощью &lt;code&gt;PRAGMA my_pragma = default;&lt;/code&gt;. Обратите внимание — для других прагм сбросить настройку не получится.&lt;/p&gt;\n&lt;h2 id=\"primery\"&gt;&lt;a href=\"ru/yql/syntax/pragma/index.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;PRAGMA AutoCommit;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"53\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-53\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-53\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-53.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;PRAGMA TablePathPrefix = \"home/yql\";\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;sv
