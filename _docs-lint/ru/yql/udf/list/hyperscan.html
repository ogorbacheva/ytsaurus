        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;a href=\"https://www.hyperscan.io\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Hyperscan&lt;/a&gt; является opensource библиотекой для поиска по регулярным выражениям, разработанной компанией Intel.&lt;/p&gt;\n&lt;p&gt;Библиотека имеет 4 реализации с использованием разных наборов процессорных инструкций (SSE3, SSE4.2, AVX2 и AVX512), среди которых автоматически выбирается нужная в соответствии с текущим процессором.&lt;/p&gt;\n&lt;p&gt;По умолчанию все функции работают в однобайтовом режиме, но если регулярное выражение является валидной UTF-8 строкой, но не является валидной ASCII строкой, — автоматически включается режим UTF-8.&lt;/p&gt;\n&lt;h2 id=\"spisok-funkcij\"&gt;&lt;a href=\"ru/yql/udf/list/hyperscan.html#spisok-funkcij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Hyperscan::Grep(pattern:String) -&amp;gt; (string:String?) -&amp;gt; Bool&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Hyperscan::Match(pattern:String) -&amp;gt; (string:String?) -&amp;gt; Bool&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Hyperscan::BacktrackingGrep(pattern:String) -&amp;gt; (string:String?) -&amp;gt; Bool&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Hyperscan::BacktrackingMatch(pattern:String) -&amp;gt; (string:String?) -&amp;gt; Bool&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Hyperscan::MultiGrep(pattern:String) -&amp;gt; (string:String?) -&amp;gt; Tuple&amp;lt;Bool, Bool, ...&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Hyperscan::MultiMatch(pattern:String) -&amp;gt; (string:String?) -&amp;gt; Tuple&amp;lt;Bool, Bool, ...&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Hyperscan::Capture(pattern:String) -&amp;gt; (string:String?) -&amp;gt; String?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Hyperscan::Replace(pattern:String) -&amp;gt; (string:String?, replacement:String) -&amp;gt; String?&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"syntax\"&gt;&lt;a href=\"ru/yql/udf/list/hyperscan.html#syntax\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Синтаксис вызова&lt;/span&gt;&lt;/a&gt;Синтаксис вызова&lt;/h2&gt;\n&lt;p&gt;При вызове напрямую, чтобы избежать компиляции регулярного выражения на каждой строке таблицы, необходимо обернуть вызов функции в &lt;a href=\"ru/yql/syntax/expressions.html#named-nodes\"&gt;именованное выражение&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$re = Hyperscan::Grep(\"\\\\d+\");      -- создаем вызываемое значение для проверки конкретного регулярного выражения\nSELECT * FROM table WHERE $re(key); -- используем его для фильтрации таблицы\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"60\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-60\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-60\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-60.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;strong&gt;Обратите внимание&lt;/strong&gt; на экранирование спецсимволов в регулярном выражении. Второй слеш нужен, так как все стандартные строковые литералы в SQL могут принимать С-escaped строки, а последовательность &lt;code&gt;\\d&lt;/code&gt; не является валидной последовательностью, и даже если бы являлась — не приводила бы к ожидаемому эффекту поиска чисел.&lt;/p&gt;\n&lt;p&gt;Есть возможность отключить чувствительность к регистру (то есть включить case-insensitive режим), указав в начале регулярного выражения флаг &lt;code&gt;(?i)&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"grep\"&gt;&lt;a href=\"ru/yql/udf/list/hyperscan.html#grep\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Grep&lt;/span&gt;&lt;/a&gt;Grep&lt;/h2&gt;\n&lt;p&gt;Проверяет совпадение регулярного выражения с &lt;strong&gt;частью строки&lt;/strong&gt; (произвольной подстрокой).&lt;/p&gt;\n&lt;h2 id=\"match\"&gt;&lt;a href=\"ru/yql/udf/list/hyperscan.html#match\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Match&lt;/span&gt;&lt;/a&gt;Match&lt;/h2&gt;\n&lt;p&gt;Проверяет совпадение регулярного выражения &lt;strong&gt;со строкой целиком&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Чтобы получить результат аналогичный &lt;code&gt;Grep&lt;/code&gt; (где учитывается совпадение с подстрокой), нужно обрамлять регулярное выражение с обеих сторон в &lt;code&gt;.*&lt;/code&gt; (&lt;code&gt;.*foo.*&lt;/code&gt; вместо &lt;code&gt;foo&lt;/code&gt;). Однако, с точки зрения читабельности кода, обычно лучше поменять функцию.&lt;/p&gt;\n&lt;h2 id=\"backtrackinggrep\"&gt;&lt;a href=\"ru/yql/udf/list/hyperscan.html#backtrackinggrep\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BacktrackingGrep / BacktrackingMatch&lt;/span&gt;&lt;/a&gt;BacktrackingGrep / BacktrackingMatch&lt;/h2&gt;\n&lt;p&gt;По принципу работы данные функции полностью совпадают с одноимёнными функциями без префикса &lt;code&gt;Backtracking&lt;/code&gt;, но поддерживают более широкий ассортимент регулярных выражений. Это происходит за счет того, что если конкретное регулярное выражение в полном объёме не поддерживается Hyperscan, то библиотека переключается в режим предварительной фильтрации (prefilter). В этом случае она отвечает не «да» или «нет», а «точно нет» или «может быть да». Ответы «может быть да» затем автоматически перепроверяются с помощью медленной, но более функциональной библиотеки &lt;a href=\"https://www.pcre.org\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;libpcre&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"multigrep\"&gt;&lt;a href=\"ru/yql/udf/list/hyperscan.html#multigrep\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MultiGrep / MultiMatch&lt;/span&gt;&lt;/a&gt;MultiGrep / MultiMatch&lt;/h2&gt;\n&lt;p&gt;Библиотека Hyperscan предоставляет возможность за один проход по тексту проверить несколько регулярных выражений и получить по каждому из них отдельный ответ.&lt;/p&gt;\n&lt;p&gt;Однако, если необходимо проверить совпадение строки с любым из перечисленных выражений (результаты объединялись бы через «или»), то эффективнее сделать одно регулярное выражение, объединив части с помощью оператора &lt;code&gt;|&lt;/code&gt;, и использовать для поиска обычный &lt;code&gt;Grep&lt;/code&gt; или &lt;code&gt;Match&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;При вызове функций &lt;code&gt;MultiGrep&lt;/code&gt;/&lt;code&gt;MultiMatch&lt;/code&gt; регулярные выражения передаются по одному на строку с использованием &lt;a href=\"ru/yql/syntax/lexer.html#multiline-string-literals\"&gt;многострочных строковых литералов&lt;/a&gt;:&lt;/p&gt;\n&lt;h4 id=\"primer\"&gt;&lt;a href=\"ru/yql/udf/list/hyperscan.html#primer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$multi_match = Hyperscan::MultiMatch(@@a.*\n.*x.*\n.*axa.*@@);\n\nSELECT\n    $multi_match(\"a\") AS a,     -- (true, false, false)\n    $multi_match(\"axa\") AS axa; -- (true, true, true)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"103\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-103\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-103\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-103.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"capture\"&gt;&lt;a href=\"ru/yql/udf/list/hyperscan.html#capture\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Capture и Replace&lt;/span&gt;&lt;/a&gt;Capture и Replace&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;Hyperscan::Capture&lt;/code&gt; при совпадении строки с указанным регулярным выражением возвращает последнюю подстроку, совпавшую с регулярным выражением. &lt;code&gt;Hyperscan::Replace&lt;/code&gt; заменяет все вхождения указанного регулярного выражения на заданную строку.&lt;/p&gt;\n&lt;p&gt;В библиотеке Hyperscan отсутствует развитая функциональность для подобных операций, так что &lt;code&gt;Hyperscan::Capture&lt;/code&gt; и &lt;code&gt;Hyperscan::Replace&lt;/code&gt; хоть и реализованы для единообразия, но для сколько-либо нетривиальных поисков и замен лучше использовать одноимённые функции из библиотеки Re2:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/udf/list/re2.html#capture\"&gt;Re2::Capture&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/yql/udf/list/re2.html#replace\"&gt;Re2::Replace&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"primer-ispolzovaniya\"&gt;&lt;a href=\"ru/yql/udf/list/hyperscan.html#primer-ispolzovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример использования&lt;/span&gt;&lt;/a&gt;Пример использования&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$value = \"xaaxaaXaa\";\n\n$match = Hyperscan::Match(\"a.*\");\n$grep = Hyperscan::Grep(\"axa\");\n$insensitive_grep = Hyperscan::Grep(\"(?i)axaa$\");\n$multi_match = Hyperscan::MultiMatch(@@a.*\n.*a.*\n.*a\n.*axa.*@@);\n\n$capture = Hyperscan::Capture(\".*a{2}.*\");\n$capture_many = Hyperscan::Capture(\".*x(a+).*\");\n$replace = Hyperscan::Replace(\"xa\");\n\nSELECT\n    $match($value) AS match,                        -- false\n    $grep($value) AS grep,                          -- true\n    $insensitive_grep($value) AS insensitive_grep,  -- true\n    $multi_match($value) AS multi_match,            -- (false, true, true, true)\n    $multi_match($value).0 AS some_multi_match,     -- false\n    $capture($value) AS capture,                    -- \"xaa\"\n    $capture_many($value) AS capture_many,          -- \"xa\"\n    $replace($value, \"b\") AS replace                -- \"babaXaa\"\n;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"128\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-128\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-128\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-128.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/udf/list/hyperscan.md","sourcePath":"ru/yql/udf/list/hyperscan.md"},"headings":[{"title":"Список функций","href":"ru/yql/udf/list/hyperscan.html#spisok-funkcij","level":2},{"title":"Синтаксис вызова","href":"ru/yql/udf/list/hyperscan.html#syntax","level":2},{"title":"Grep","href":"ru/yql/udf/list/hyperscan.html#grep","level":2},{"title":"Match","href":"ru/yql/udf/list/hyperscan.html#match","level":2},{"title":"BacktrackingGrep / BacktrackingMatch","href":"ru/yql/udf/list/hyperscan.html#backtrackinggrep","level":2},{"title":"MultiGrep / MultiMatch","href":"ru/yql/udf/list/hyperscan.html#multigrep","level":2},{"title":"Capture и Replace","href":"ru/yql/udf/list/hyperscan.html#capture","level":2},{"title":"Пример использования","href":"ru/yql/udf/list/hyperscan.html#primer-ispolzovaniya","level":2}],"title":"Hyperscan"},"router":{"pathname":"ru/yql/udf/list/hyperscan","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
