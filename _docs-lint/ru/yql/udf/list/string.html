        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Функции для работы с ASCII-строками.&lt;/p&gt;\n&lt;h2 id=\"spisok-funkcij\"&gt;&lt;a href=\"ru/yql/udf/list/string.html#spisok-funkcij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;String::Base32Encode(string:String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;String::Base32Decode(string:String) -&amp;gt; String?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;String::Base32StrictDecode(string:String) -&amp;gt; String?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;String::Base64Encode(string:String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;String::Base64Decode(string:String) -&amp;gt; String?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;String::Base64StrictDecode(string:String) -&amp;gt; String?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;String::EscapeC(string:String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;String::UnescapeC(string:String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;String::HexEncode(string:String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;String::HexDecode(string:String) -&amp;gt; String?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;String::EncodeHtml(string:String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;String::DecodeHtml(string:String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;String::CgiEscape(string:String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;String::CgiUnescape(string:String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Кодирует или декодирует строку указанным образом.&lt;/p&gt;\n&lt;h2 id=\"primery\"&gt;&lt;a href=\"ru/yql/udf/list/string.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT String::Base64Encode(\"YQL\"); -- \"WVFM\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"84\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-84\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-84\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-84.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code&gt;String::Strip(string:String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Вырезает из строки крайние пробелы.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT String::Strip(\"YQL \");       -- \"YQL\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"91\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-91\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-91\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-91.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::Collapse(string:String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Заменяет множественные пробелы внутри строки одиночными.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::CollapseText(string:String{Flags:AutoMap}, limit:Uint64) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Укорачивает текст до указанного размера с добавлением троеточия.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::Contains(string:String?, substring:String) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Проверяет наличие подстроки в строке.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::AsciiContainsIgnoreCase(string:String?, substring:String) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::AsciiEqualsIgnoreCase(left:String?, right:String) -&amp;gt; Bool&lt;/code&gt;&lt;br /&gt;\nПроверяют наличие подстроки или полное равенство строк без учета регистра символов - добавлены в версии &lt;a href=\"ru/yql/changelog/2025.02.html#string-module\"&gt;2025.02&lt;/a&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::Find(string:String{Flags:AutoMap}, String, [Uint64?]) -&amp;gt; Int64&lt;/code&gt; - Устаревшая: используйте встроенную функцию &lt;a href=\"ru/yql/builtins/basic.html#find\"&gt;Find&lt;/a&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::ReverseFind(string:String{Flags:AutoMap}, String, [Uint64?]) -&amp;gt; Int64&lt;/code&gt; - Устаревшая: используйте встроенную функцию &lt;a href=\"ru/yql/builtins/basic.html#rfind\"&gt;RFind&lt;/a&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::Substring(string:String{Flags:AutoMap}, [Uint64?, Uint64?]) -&amp;gt; String&lt;/code&gt; - Устаревшая: используйте встроенную функцию &lt;a href=\"ru/yql/builtins/basic.html#substring\"&gt;Substring&lt;/a&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::HasPrefix(string:String?, prefix:String) -&amp;gt; Bool&lt;/code&gt; - Устаревшая: используйте встроенную функцию &lt;a href=\"ru/yql/builtins/basic.html#starts_ends_with\"&gt;StartsWith&lt;/a&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::StartsWith(string:String?, prefix:String) -&amp;gt; Bool&lt;/code&gt; - Устаревшая: используйте встроенную функцию &lt;a href=\"ru/yql/builtins/basic.html#starts_ends_with\"&gt;StartsWith&lt;/a&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::HasSuffix(string:String?, suffix:String) -&amp;gt; Bool&lt;/code&gt; - Устаревшая: используйте встроенную функцию &lt;a href=\"ru/yql/builtins/basic.html#starts_ends_with\"&gt;EndsWith&lt;/a&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::EndsWith(string:String?, suffix:String) -&amp;gt; Bool&lt;/code&gt; - Устаревшая: используйте встроенную функцию &lt;a href=\"ru/yql/builtins/basic.html#starts_ends_with\"&gt;EndsWith&lt;/a&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::Reverse(string:String?) -&amp;gt; String?&lt;/code&gt; - удалена в версии &lt;a href=\"ru/yql/changelog/2025.02.html#string-module\"&gt;2025.02&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;Устаревшие функции, к использованию не рекомендуются.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::AsciiStartsWithIgnoreCase(string:String?, prefix:String) -&amp;gt; Bool&lt;/code&gt; - добавлена в версии &lt;a href=\"ru/yql/changelog/2025.02.html#string-module\"&gt;2025.02&lt;/a&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::AsciiEndsWithIgnoreCase(string:String?, suffix:String) -&amp;gt; Bool&lt;/code&gt; - добавлена в версии &lt;a href=\"ru/yql/changelog/2025.02.html#string-module\"&gt;2025.02&lt;/a&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::HasPrefixIgnoreCase(string:String?, prefix:String) -&amp;gt; Bool&lt;/code&gt; - удалена в версии &lt;a href=\"ru/yql/changelog/2025.02.html#string-module\"&gt;2025.02&lt;/a&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::StartsWithIgnoreCase(string:String?, prefix:String) -&amp;gt; Bool&lt;/code&gt; - удалена в версии &lt;a href=\"ru/yql/changelog/2025.02.html#string-module\"&gt;2025.02&lt;/a&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::HasSuffixIgnoreCase(string:String?, suffix:String) -&amp;gt; Bool&lt;/code&gt; - удалена в версии &lt;a href=\"ru/yql/changelog/2025.02.html#string-module\"&gt;2025.02&lt;/a&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::EndsWithIgnoreCase(string:String?, suffix:String) -&amp;gt; Bool&lt;/code&gt; - удалена в версии &lt;a href=\"ru/yql/changelog/2025.02.html#string-module\"&gt;2025.02&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;Проверяют наличие префикса или суффикса в строке без учёта региста символов.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::AsciiToLower(string:String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt; - меняет только латинские символы. Для работы с другими алфавитами см. Unicode::ToLower&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::AsciiToUpper(string:String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt; - меняет только латинские символы. Для работы с другими алфавитами см. Unicode::ToUpper&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::AsciiToTitle(string:String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt; - меняет только латинские символы. Для работы с другими алфавитами см. Unicode::ToTitle&lt;/p&gt;\n&lt;p&gt;Переводят регистр ascii символов строки к ВЕРХНЕМУ, нижнему или Заглавному виду.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::SplitToList(string:String?, delimeter:String, [ DelimeterString:Bool?, SkipEmpty:Bool?, Limit:Uint64? ]) -&amp;gt; List&amp;lt;String&amp;gt;&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Разбивает строку на подстроки по разделителю.&lt;br /&gt;\n&lt;code&gt;string&lt;/code&gt; -- исходная строка&lt;br /&gt;\n&lt;code&gt;delimeter&lt;/code&gt; -- разделитель&lt;br /&gt;\nИменованные параметры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DelimeterString:Bool?&lt;/code&gt; — считать разделитель строкой (true, по умолчанию) или набором символов \"любой из\" (false)&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;SkipEmpty:Bool?&lt;/code&gt; - пропускать ли пустые строки в результате, по умолчанию false&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Limit:Uint64?&lt;/code&gt; - ограничение на число извлекаемых компонент, по умолчанию не ограничено; необработанный суффикс оригинальной строки возвращается последним элементом при превышении лимита&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT String::SplitToList(\"1,2,3,4,5,6,7\", \",\", 3 as Limit); -- [\"1\", \"2\", \"3\", \"4,5,6,7\"]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"247\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-247\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-247\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-247.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::JoinFromList(strings:List&amp;lt;String&amp;gt;{Flags:AutoMap}, separator:String) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Конкатенирует список строк через разделитель в единую строку.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::ToByteList(string:String) -&amp;gt; List&amp;lt;Byte&amp;gt;&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Разбивает строку на список байт.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::FromByteList(bytes:List&amp;lt;Uint8&amp;gt;) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Собирает список байт в строку.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::ReplaceAll(input:String{Flags:AutoMap}, find:String, replacement:String) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::ReplaceFirst(input:String{Flags:AutoMap}, find:String, replacement:String) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::ReplaceLast(input:String{Flags:AutoMap}, find:String, replacement:String) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Заменяют все/первое/последнее вхождения(е) строки &lt;code&gt;find&lt;/code&gt; в &lt;code&gt;input&lt;/code&gt; на &lt;code&gt;replacement&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::RemoveAll(input:String{Flags:AutoMap}, symbols:String) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::RemoveFirst(input:String{Flags:AutoMap}, symbols:String) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::RemoveLast(input:String{Flags:AutoMap}, symbols:String) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Удаляют все/первое/последнее вхождения(е) символа в наборе &lt;code&gt;symbols&lt;/code&gt; из &lt;code&gt;input&lt;/code&gt;. Второй аргумент интерпретируется как неупорядоченный набор символов для удаления.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::ReverseBytes(input:String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt; - добавлена в версии &lt;a href=\"ru/yql/changelog/2025.02.html#string-module\"&gt;2025.02&lt;/a&gt;&lt;br /&gt;\nРазворачивает строку, рассматривая ее как байтовую последовательность.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::ReverseBits(input:String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt; - добавлена в версии &lt;a href=\"ru/yql/changelog/2025.02.html#string-module\"&gt;2025.02&lt;/a&gt;&lt;br /&gt;\nРазворачивает строку, рассматривая ее как битовую последовательность.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::IsAscii(string:String{Flags:AutoMap}) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Проверяет, является ли строка валидной ascii последовательностью.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::IsAsciiSpace(string:String{Flags:AutoMap}) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::IsAsciiUpper(string:String{Flags:AutoMap}) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::IsAsciiLower(string:String{Flags:AutoMap}) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::IsAsciiAlpha(string:String{Flags:AutoMap}) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::IsAsciiAlnum(string:String{Flags:AutoMap}) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::IsAsciiHex(string:String{Flags:AutoMap}) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Проверяют, отвечает ли ascii строка указанному условию.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::LevensteinDistance(stringOne:String{Flags:AutoMap}, stringTwo:String{Flags:AutoMap}) -&amp;gt; Uint64&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Вычисляет расстояние Левенштейна для переданных строк.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::LeftPad(string:String{Flags:AutoMap}, size:Uint64, filler:[String?]) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::RightPad(string:String{Flags:AutoMap}, size:Uint64, filler:[String?]) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Выравнивает текст до указанного размера с дополнением указанным символом или пробелами.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::Hex(value:Uint64{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::SHex(value:Int64{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::Bin(value:Uint64{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::SBin(value:Int64{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::HexText(string:String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::BinText(string:String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::HumanReadableDuration(value:Uint64{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::HumanReadableQuantity(value:Uint64{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::HumanReadableBytes(value:Uint64{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;String::Prec(Double{Flags:AutoMap}, digits:Uint64) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Распечатывает значение указанным образом.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Функции из библиотеки String не поддерживают кириллицу и умеют работать только с ASCII символами. Для работы со строками в кодировке UTF-8 используйте функции из &lt;a href=\"ru/yql/udf/list/unicode.html\"&gt;Unicode&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/udf/list/string.md","sourcePath":"ru/yql/udf/list/string.md"},"headings":[{"title":"Список функций","href":"ru/yql/udf/list/string.html#spisok-funkcij","level":2},{"title":"Примеры","href":"ru/yql/udf/list/string.html#primery","level":2}],"title":"String"},"router":{"pathname":"ru/yql/udf/list/string","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
