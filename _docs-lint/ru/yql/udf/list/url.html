            {"data":{"leading":false,"html":"&lt;h2 id=\"normalize\"&gt;&lt;a href=\"ru/yql/udf/list/url.html#normalize\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Normalize&lt;/span&gt;&lt;/a&gt;Normalize&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Url::Normalize(String) -&amp;gt; String?&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Нормализует URL удобным для Web-роботов образом: приводит hostname в нижний регистр, выкидывает фрагмент и т.п.&lt;br /&gt;\nРезультат нормализации зависит только от самого URL. В процессе нормализации &lt;strong&gt;НЕ&lt;/strong&gt; выполняются операции, зависящие от внешних данных: приведение по дублям, зеркалам и т.п.&lt;/p&gt;\n&lt;p&gt;Возвращаемое значение:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;нормализованный URL;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;NULL&lt;/code&gt;, если переданный строковый аргумент не удалось распарсить как URL.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery\"&gt;&lt;a href=\"ru/yql/udf/list/url.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Url::Normalize(\"hTTp://wWw.yDb.TECH/\"); -- \"http://www.ydb.tech/\"\nSELECT Url::Normalize(\"http://ydb.tech#foo\");      -- \"http://ydb.tech/\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"31\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-31\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-31\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-31.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"normalizewithdefaulthttpscheme\"&gt;&lt;a href=\"ru/yql/udf/list/url.html#normalizewithdefaulthttpscheme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;NormalizeWithDefaultHttpScheme&lt;/span&gt;&lt;/a&gt;NormalizeWithDefaultHttpScheme&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Url::NormalizeWithDefaultHttpScheme(String?) -&amp;gt; String?&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Выполняет нормализацию аналогично &lt;code&gt;Url::Normalize&lt;/code&gt;, но подставляет схему &lt;code&gt;http://&lt;/code&gt; в случае, если схемы нет.&lt;/p&gt;\n&lt;p&gt;Возвращаемое значение:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;нормализованный URL;&lt;/li&gt;\n&lt;li&gt;исходный URL, если нормализация не удалась.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery1\"&gt;&lt;a href=\"ru/yql/udf/list/url.html#primery1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Url::NormalizeWithDefaultHttpScheme(\"wWw.yDb.TECH\");    -- \"http://www.ydb.tech/\"\nSELECT Url::NormalizeWithDefaultHttpScheme(\"http://ydb.tech#foo\"); -- \"http://ydb.tech/\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"63\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-63\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-63\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-63.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"encode\"&gt;&lt;a href=\"ru/yql/udf/list/url.html#encode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Encode / Decode&lt;/span&gt;&lt;/a&gt;Encode / Decode&lt;/h2&gt;\n&lt;p&gt;Кодируют UTF-8 строку в urlencoded формат (&lt;code&gt;Url::Encode&lt;/code&gt;) и обратно (&lt;code&gt;Url::Decode&lt;/code&gt;).&lt;/p&gt;\n&lt;h3 id=\"spisok-funkcij\"&gt;&lt;a href=\"ru/yql/udf/list/url.html#spisok-funkcij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Url::Encode(String?) -&amp;gt; String?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Url::Decode(String?) -&amp;gt; String?&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery2\"&gt;&lt;a href=\"ru/yql/udf/list/url.html#primery2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Url::Decode(\"http://ydb.tech/%D1%81%D1%82%D1%80%D0%B0%D0%BD%D0%B8%D1%86%D0%B0\");\n  -- \"http://ydb.tech/страница\"\nSELECT Url::Encode(\"http://ydb.tech/страница\");\n  -- \"http://ydb.tech/%D1%81%D1%82%D1%80%D0%B0%D0%BD%D0%B8%D1%86%D0%B0\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"88\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-88\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-88\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-88.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"parse\"&gt;&lt;a href=\"ru/yql/udf/list/url.html#parse\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Parse&lt;/span&gt;&lt;/a&gt;Parse&lt;/h2&gt;\n&lt;p&gt;Разбирает URL на составные части.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Url::Parse(Parse{Flags:AutoMap}) -&amp;gt; Struct&amp;lt; Frag: String?, Host: String?, ParseError: String?, Pass: String?, Path: String?, Port: String?, Query: String?, Scheme: String?, User: String? &amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"95\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-95\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-95\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-95.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"primery3\"&gt;&lt;a href=\"ru/yql/udf/list/url.html#primery3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Url::Parse(\n  \"https://en.wikipedia.org/wiki/Isambard_Kingdom_Brunel?s=24&amp;amp;g=h-24#Great_Western_Railway\");\n/*\n(\n  \"Frag\": \"Great_Western_Railway\",\n  \"Host\": \"en.wikipedia.org\",\n  \"ParseError\": null,\n  \"Pass\": null,\n  \"Path\": \"/wiki/Isambard_Kingdom_Brunel\",\n  \"Port\": null,\n  \"Query\": \"s=24&amp;amp;g=h-24\",\n  \"Scheme\": \"https\",\n  \"User\": null\n)\n*/\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"99\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-99\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-99\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-99.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"get\"&gt;&lt;a href=\"ru/yql/udf/list/url.html#get\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Get...&lt;/span&gt;&lt;/a&gt;Get...&lt;/h2&gt;\n&lt;p&gt;Получение компонента URL.&lt;/p&gt;\n&lt;h3 id=\"spisok-funkcij1\"&gt;&lt;a href=\"ru/yql/udf/list/url.html#spisok-funkcij1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Url::GetScheme(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Url::GetHost(String?) -&amp;gt; String?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Url::GetHostPort(String?) -&amp;gt; String?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Url::GetSchemeHost(String?) -&amp;gt; String?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Url::GetSchemeHostPort(String?) -&amp;gt; String?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Url::GetPort(String?) -&amp;gt; String?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Url::GetTail(String?) -&amp;gt; String?&lt;/code&gt; -- всё после хоста: path + query + fragment&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Url::GetPath(String?) -&amp;gt; String?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Url::GetFragment(String?) -&amp;gt; String?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Url::GetCGIParam(String?, String) -&amp;gt; String?&lt;/code&gt; -- второй параметр — имя нужного CGI параметра&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Url::GetDomain(String?, Uint8) -&amp;gt; String?&lt;/code&gt; -- второй параметр — необходимый уровень домена&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Url::GetTLD(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Url::IsKnownTLD(String{Flags:AutoMap}) -&amp;gt; Bool&lt;/code&gt; -- зарегистрирован на &lt;a href=\"http://www.iana.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;iana.org&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Url::IsWellKnownTLD(String{Flags:AutoMap}) -&amp;gt; Bool&lt;/code&gt; -- находится в небольшом whitelist из com, net, org, ru и пр.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Url::GetDomainLevel(String{Flags:AutoMap}) -&amp;gt; Uint64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Url::GetSignificantDomain(String{Flags:AutoMap}, [List&amp;lt;String&amp;gt;?]) -&amp;gt; String&lt;/code&gt;&lt;br /&gt;\nВозвращает домен второго уровня в большинстве случаев и домен третьего уровня для хостеймов вида: ***.XXX.YY, где XXX — одно из com, net, org, co, gov, edu. Этот список можно переопределить через опциональный второй аргумент&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Url::GetOwner(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;br /&gt;\nВозвращает домен, которым с наибольшей вероятностью владеет отдельный человек или организация. В отличие от Url::GetSignificantDomain работает по специальному разрешительному списку, и помимо доменов из серии ***.co.uk возвращает домен третьего уровня для, например, бесплатных хостингов и блогов, например something.livejournal.com&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery4\"&gt;&lt;a href=\"ru/yql/udf/list/url.html#primery4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Url::GetScheme(\"https://ydb.tech\");           -- \"https://\"\nSELECT Url::GetDomain(\"http://www.ydb.tech\", 2); -- \"ydb.tech\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"199\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-199\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-199\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-199.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"cut\"&gt;&lt;a href=\"ru/yql/udf/list/url.html#cut\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cut...&lt;/span&gt;&lt;/a&gt;Cut...&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Url::CutScheme(String?) -&amp;gt; String?&lt;/code&gt;&lt;br /&gt;\nВозвращает переданный URL уже без схемы (http://, https:// и т.п.).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Url::CutWWW(String?) -&amp;gt; String?&lt;/code&gt;&lt;br /&gt;\nВозвращает переданный домен без префикса \"www.\", если он присутствовал.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Url::CutWWW2(String?) -&amp;gt; String?&lt;/code&gt;&lt;br /&gt;\nВозвращает переданный домен без префикса \"www.\", \"www2.\", \"wwww777.\" и тому подобных, если он присутствовал.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;Url::CutQueryStringA­ndFragment(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;br /&gt;\nВозращает копию переданного URL с удаленными всеми CGI параметрами и фрагментами (\"?foo=bar\" и/или \"#baz\").&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery5\"&gt;&lt;a href=\"ru/yql/udf/list/url.html#primery5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Url::CutScheme(\"http://www.ydb.tech\"); -- \"www.ydb.tech\"\nSELECT Url::CutWWW(\"www.ydb.tech\");           -- \"ydb.tech\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"228\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-228\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-228\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-228.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"punycode\"&gt;&lt;a href=\"ru/yql/udf/list/url.html#punycode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\" ity=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-268\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-268\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-268.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"query\"&gt;&lt;a href=\"ru/yql/udf/list/url.html#query\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;...Query...&lt;/span&gt;&lt;/a&gt;...Query...&lt;/h2&gt;\n&lt;p&gt;Преобразования &lt;a href=\"https://docs.python.org/3/library/urllib.parse.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Query&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"spisok-funkcij3\"&gt;&lt;a href=\"ru/yql/udf/list/url.html#spisok-funkcij3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Url::QueryStringToList(String{Flag:AutoMap}, [\n  KeepBlankValues:Bool?,  -- пустые значения в percent-encoded запросах интерпретируются как пустые строки; по умолчанию false\n  Strict:Bool?,           -- если false - ошибки парсинга игнорируются, ошибочные поля пропускаются; по умолчанию true\n  MaxFields:Uint32?,      -- максимальное количество полей, при превышении кидается исключение; по умолчанию Max&amp;lt;Uint32&amp;gt;\n  Separator:String?       -- разделитель пар ключ-значение; по умолчанию '&amp;amp;'\n]) -&amp;gt; List&amp;lt;Tuple&amp;lt;String, String&amp;gt;&amp;gt;\nUrl::QueryStringToDict(String{Flag:AutoMap}, [\n  KeepBlankValues:Bool?,  -- пустые значения в percent-encoded запросах интерпретируются как пустые строки; по умолчанию false\n  Strict:Bool?,           -- если false - ошибки парсинга игнорируются, ошибочные поля пропускаются; по умолчанию true\n  MaxFields:Uint32?,      -- максимальное количество полей, при превышении кидается исключение; по умолчанию Max&amp;lt;Uint32&amp;gt;\n  Separator:String?       -- разделитель пар ключ-значение; по умолчанию '&amp;amp;'\n]) -&amp;gt; Dict&amp;lt;String, List&amp;lt;String&amp;gt;&amp;gt;\nUrl::BuildQueryString(Dict&amp;lt;String, List&amp;lt;String?&amp;gt;&amp;gt;{Flag:AutoMap}, [\n  Separator:String?       -- разделитель пар ключ-значение; по умолчанию '&amp;amp;'\n]) -&amp;gt; String\nUrl::BuildQueryString(Dict&amp;lt;String, String?&amp;gt;{Flag:AutoMap}, [\n  Separator:String?       -- разделитель пар ключ-значение; по умолчанию '&amp;amp;'\n]) -&amp;gt; String\nUrl::BuildQueryString(List&amp;lt;Tuple&amp;lt;String, String?&amp;gt;&amp;gt;{Flag:AutoMap}, [\n  Separator:String?       -- разделитель пар ключ-значение; по умолчанию '&amp;amp;'\n]) -&amp;gt; String\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"278\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-278\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-278\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-278.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n
