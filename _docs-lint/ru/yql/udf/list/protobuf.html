            {"data":{"leading":false,"html":"&lt;p&gt;Преобразование protobuf-сообщений в структуры YQL.&lt;/p&gt;\n&lt;p&gt;Список функций:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;Protobuf::Parse(String?{Flags:AutoMap}) -&amp;gt; &amp;lt;Struct&amp;gt;?&lt;/code&gt; — распаковка сообщения в YQL структуру.&lt;br /&gt;\n&lt;code&gt;Protobuf::TryParse(String?{Flags:AutoMap}) -&amp;gt; &amp;lt;Struct&amp;gt;?&lt;/code&gt; — безопасная распаковка сообщения, в случае ошибки возвращает Null.&lt;br /&gt;\n&lt;code&gt;Protobuf::Serialize(&amp;lt;Struct&amp;gt;?{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt; — сериализация структуры в protobuf-строку.&lt;/p&gt;\n&lt;p&gt;Перед использованием необходимо создать метаинформацию, аналогичную той, что записывается в мета-атрибут &lt;code&gt;_yql_proto_field&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"yql_proto_field_desc\"&gt;&lt;a href=\"ru/yql/udf/list/protobuf.html#yql_proto_field_desc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поддерживаемые поля дескриптора&lt;/span&gt;&lt;/a&gt;Поддерживаемые поля дескриптора&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;name&lt;/code&gt; — имя protobuf-сообщения. Представляет собой конкатенацию имени пакета и имени сообщения, разделённых точкой — \"package.message\", где:\n&lt;ul&gt;\n&lt;li&gt;имя package — в рамках которого лежит proto файл;&lt;/li&gt;\n&lt;li&gt;имя message — в рамках которого собираются данные.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;meta&lt;/code&gt; — дескриптор protobuf-сообщения (сжатый zlib, base64).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;format&lt;/code&gt; — формат сериализации protobuf. Возможные значения: &lt;code&gt;protobin&lt;/code&gt; (по умолчанию) — бинарный, &lt;code&gt;prototext&lt;/code&gt; — текстовый, &lt;code&gt;json&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;skip&lt;/code&gt; — количество байт, которое игнорируется в каждом значении перед парсингом (по умолчанию 0).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;view&lt;/code&gt; — словарь, определяющий настройки представления protobuf-сообщений. Поддерживаются следующие настройки:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;enum&lt;/code&gt; — представление перечислений protobuf в YQL. Возможные значения: &lt;code&gt;number&lt;/code&gt; (по умолчанию), &lt;code&gt;name&lt;/code&gt;, &lt;code&gt;full_name&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;recursion&lt;/code&gt; — способ обработки рекурсивных сообщений. Возможные значения: &lt;code&gt;fail&lt;/code&gt; (по умолчанию) — выдавать ошибку, &lt;code&gt;ignore&lt;/code&gt; — пропускать рекурсивные вставки, &lt;code&gt;bytes&lt;/code&gt; (deprecated) — преобразовывать рекурсивные вставки в байтовые строки, &lt;code&gt;bytesV2&lt;/code&gt; — то же самое, что и bytes, но с исправлением выходного типа на опциональные байтовые строки для optional полей.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;yt_mode&lt;/code&gt; — &lt;code&gt;YT Mode&lt;/code&gt; (по умолчанию &lt;code&gt;false&lt;/code&gt;), в котором обрабатываются YT-специфичные опции protobuf. Если в сообщении не указана опция &lt;code&gt;NYT.default_field_flags&lt;/code&gt; или её значение не равно &lt;code&gt;SERIALIZATION_YT&lt;/code&gt;, то сообщение будет преобразовано в байтовую строку. В случае &lt;code&gt;SERIALIZATION_YT&lt;/code&gt; сообщение будет обработано обычным образом (при этом обработка рекурсивных сообщений определяется опцией &lt;code&gt;recursion&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;lists&lt;/code&gt;— словарь, определяющий настройки представления repeated полей protobuf-сообщений. Поддерживаются следующие настройки:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;optional&lt;/code&gt; — представлять repeated поля как опциональные списки вместо обычных (по умолчанию &lt;code&gt;true&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При использовании настройки &lt;code&gt;lists&lt;/code&gt; &lt;code&gt;optional=false&lt;/code&gt; не рекомендуется результат &lt;code&gt;Protobuf::Parse&lt;/code&gt; записывать в таблицы, т. к. при появлении новых repeated полей схема таблицы станет несовместимой.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"primery\"&gt;&lt;a href=\"ru/yql/udf/list/protobuf.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$config = @@{\n    \"name\": \"my.service.proto.BufferWrapper\",\n    \"meta\": \"H4sIAAAAAAAAA51YT3PbVBCv/9vr2FGUAkE9AG6BtAWnSdrp39AmbUo6JZBpy2SGYaajSM+xJraeR5KdpB+B6ZkjnDlx4RPADF+EM2cOXNi3+yzZabDV3KSn3d/b3bf7232C13m47QTHvche2g/sXnvJtSP7pdftySBaOhR7A++VDJZ6gYzkkhgIP3oZHfdE2KQV80LQbx7bviuOml0RBd6B3TwcrPDHK7/koLKpVF6ghlmDSlf2Q9GVA2GcM6tQotd+z8jE31x56BtZswIFp+M5B0bOBCiGTiA7HSNv1gEOPR9l9jr9wCiYs1Dl95Z0+qFRVHr8WDLLkCepslmCnJAto6I2CUVHOJEnfQMUstO2/X1hVJWi5/f6kTGjpCLZd9pkZk3tSa9hZAeRUTdnoEzvwneNWWUBvTm274iOYZjnwaCFlgwcoeHnTANmUGJgh9siakvXME0T6ryyE8ieCKJjY16Z/ErKrnFemRaI0HsljHfUFl3herZWfdecgxotxJrvKZsPxHEYBfJAGAsK3BUDzxHPZGSTt+8rP1p4sJ3NIJCBYan3th22tYkX9op0ZKvwownX3yod0mSCdfYMa/xUhgIlkXkd8urDQubDzGJ95ZPmhA2bSdrVoYhHty+ihSzqzWE8S63A7oon7kKOFtYAKPdIZSGPa9WVTyeCb8fiW+fM+1DlBGX9AukvTtR/nsgzAGcxAxRTAOwm8giwCfU4rxmjRBhXJxsxpsJ2cDYwRjmFHQ8TeQRY06XC+pUUgXwRi/P+Xcpx1ocU+28n8gjwEGo9XRMMUSWIKxMhdkY1EOQuVFQRMsAMAUzOtO+G0uwC1y2r11K48CyRR4AvYTYu5JBB6gTy2USQp+M6CPQNzI9TAIPNEti1iWCP3tRjyxL+YDAjhWWPx3UYKCEeBppLAbQ1rrN1bqMIeRSzGw2ApCCRyTNHxBAF9XhMRV9oLEN1pOhOF0Jqz/fsfUG0UG7UoDpSZo0dqI9XDJJugZqCBqpim/FdDTWHrUZ9+1q6jKeaVQm/00KebFqD6kj9KLiB3ekzvVWUODYZ50AwZFnxWNtzXeFr+37IACT1Yz6AEvelEAFyGM6llJXXfN7fwzqyrTtQ0o/Yf7Keqw2hWCkTshyrHD3WVKfFFke+ZBt/ZKASF4K5AWVVQ48D2SWQaRkXa9LTjvTIn6LCeCFp7zMgWNfYJIZDezvYWzpkTzZxqpA4VWg8h+pIOSqdQ8+N2vqA1Q
