            {"data":{"leading":false,"html":"&lt;p&gt;Набор обёрток вокруг функций из библиотеки libm, а также утилит Яндекс.&lt;/p&gt;\n&lt;h2 id=\"constants\"&gt;&lt;a href=\"ru/yql/udf/list/math.html#constants\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Константы&lt;/span&gt;&lt;/a&gt;Константы&lt;/h2&gt;\n&lt;h4 id=\"spisok-funkcij\"&gt;&lt;a href=\"ru/yql/udf/list/math.html#spisok-funkcij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Math::Pi() -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::E() -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Eps() -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery\"&gt;&lt;a href=\"ru/yql/udf/list/math.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Math::Pi();  -- 3.141592654\nSELECT Math::E();   -- 2.718281828\nSELECT Math::Eps(); -- 2.220446049250313e-16\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"29\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-29\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fil p}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Erf(Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::ErfInv(Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::ErfcInv(Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Exp(Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Exp2(Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Fabs(Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Floor(Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Lgamma(Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Rint(Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Sigmoid(Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Sin(Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Sinh(Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Sqrt(Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Tan(Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Tanh(Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Tgamma(Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Trunc(Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Log(Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Log2(Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Log10(Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery2\"&gt;&lt;a href=\"ru/yql/udf/list/math.html#primery2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Math::Sqrt(256);     -- 16\nSELECT Math::Trunc(1.2345); -- 1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"213\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-213\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-213\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-213.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"doubledouble-double\"&gt;&lt;a href=\"ru/yql/udf/list/math.html#doubledouble-double\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;(Double, Double) -&amp;gt; Double&lt;/span&gt;&lt;/a&gt;(Double, Double) -&amp;gt; Double&lt;/h2&gt;\n&lt;h4 id=\"spisok-funkcij3\"&gt;&lt;a href=\"ru/yql/udf/list/math.html#spisok-funkcij3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Math::Atan2(Double{Flags:AutoMap}, Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Fmod(Double{Flags:AutoMap}, Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Hypot(Double{Flags:AutoMap}, Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Pow(Double{Flags:AutoMap}, Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Remainder(Double{Flags:AutoMap}, Double{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery3\"&gt;&lt;a href=\"ru/yql/udf/list/math.html#primery3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Math::Atan2(1, 0);       -- 1.570796327\nSELECT Math::Remainder(2.1, 2); -- 0.1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"250\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-250\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-250\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-250.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"doubleint32-double\"&gt;&lt;a href=\"ru/yql/udf/list/math.html#doubleint32-double\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;(Double, Int32) -&amp;gt; Double&lt;/span&gt;&lt;/a&gt;(Double, Int32) -&amp;gt; Double&lt;/h2&gt;\n&lt;h4 id=\"spisok-funkcij4\"&gt;&lt;a href=\"ru/yql/udf/list/math.html#spisok-funkcij4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Math::Ldexp(Double{Flags:AutoMap}, Int32{Flags:AutoMap}) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Round(Double{Flags:AutoMap}, [Int32?]) -&amp;gt; Double&lt;/code&gt; - во втором аргументе указывается степень 10, до которой округляем (отрицательная для знаков после запятой и положительная для округления до десятков—тысяч—миллионов); по умолчанию 0&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery4\"&gt;&lt;a href=\"ru/yql/udf/list/math.html#primery4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Math::Pow(2, 10);        -- 1024\nSELECT Math::Round(1.2345, -2); -- 1.23\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"272\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-272\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-272\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-272.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"doubledouble-bool\"&gt;&lt;a href=\"ru/yql/udf/list/math.html#doubledouble-bool\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;(Double, Double, Double?) -&amp;gt; Bool&lt;/span&gt;&lt;/a&gt;(Double, Double, [Double?]) -&amp;gt; Bool&lt;/h2&gt;\n&lt;h4 id=\"spisok-funkcij5\"&gt;&lt;a href=\"ru/yql/udf/list/math.html#spisok-funkcij5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Math::FuzzyEquals(Double{Flags:AutoMap}, Double{Flags:AutoMap}, [Double?]) -&amp;gt; Bool&lt;/code&gt; - сравнивает два Double на нахождение внутри окрестности, задаваемой третьим аргументом; по умолчанию 1.0e-13. Окрестность указывается в относительных единицах от минимального по модулю аргумента.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Если один из сравниваемых аргументов равен &lt;code&gt;0.0&lt;/code&gt;, то функция всегда возвращает &lt;code&gt;false&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"primery5\"&gt;&lt;a href=\"ru/yql/udf/list/math.html#primery5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Math::FuzzyEquals(1.01, 1.0, 0.05); -- true\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"299\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-299\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-299\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-299.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"funkcii-vzyatiya-ostatka\"&gt;&lt;a href=\"ru/yql/udf/list/math.html#funkcii-vzyatiya-ostatka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Функции взятия остатка&lt;/span&gt;&lt;/a&gt;Функции взятия остатка&lt;/h2&gt;\n&lt;h4 id=\"spisok-funkcij6\"&gt;&lt;a href=\"ru/yql/udf/list/math.html#spisok-funkcij6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Math::Mod(Int64{Flags:AutoMap}, Int64) -&amp;gt; Int64?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::Rem(Int64{Flags:AutoMap}, Int64) -&amp;gt; Int64?&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ведут себя аналогично встроенному оператору % в случае неотрицательных аргументов. Различия заметны при отрицательных аргументах:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Math::Mod сохраняет знак второго аргумента (делителя).&lt;/li&gt;\n&lt;li&gt;Math::Rem сохраняет знак первого аргумента (делимого).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Функции возвращают null, если делитель равен нулю.&lt;/p&gt;\n&lt;h4 id=\"primery6\"&gt;&lt;a href=\"ru/yql/udf/list/math.html#primery6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Math::Mod(-1, 7);        -- 6\nSELECT Math::Rem(-1, 7);        -- -1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"339\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-339\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-339\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-339.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"funkcii-okrugleniya-do-celogo-chisla-v-zadannom-rezhime\"&gt;&lt;a href=\"ru/yql/udf/list/math.html#funkcii-okrugleniya-do-celogo-chisla-v-zadannom-rezhime\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Функции округления до целого числа в заданном режиме&lt;/span&gt;&lt;/a&gt;Функции округления до целого числа в заданном режиме&lt;/h2&gt;\n&lt;h4 id=\"spisok-funkcij7\"&gt;&lt;a href=\"ru/yql/udf/list/math.html#spisok-funkcij7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Math::RoundDownward() -&amp;gt; Tagged&amp;lt;Uint32, MathRoundingMode&amp;gt;&lt;/code&gt; — округление в сторону отрицательной бесконечности&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::RoundToNearest() -&amp;gt; Tagged&amp;lt;Uint32, MathRoundingMode&amp;gt;&lt;/code&gt; — округление в сторону ближайшего представимого значения&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::RoundTowardZero() -&amp;gt; Tagged&amp;lt;Uint32, MathRoundingMode&amp;gt;&lt;/code&gt; — округление в сторону нуля&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::RoundUpward() -&amp;gt; Tagged&amp;lt;Uint32, MathRoundingMode&amp;gt;&lt;/code&gt; — округление в сторону положительной бесконечности&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Math::NearbyInt(AutoMap&amp;lt;Double&amp;gt;, Tagged&amp;lt;Uint32, MathRoundingMode&amp;gt;) -&amp;gt; Optional&amp;lt;Int64&amp;gt;&lt;/code&gt; — округление до ближайшего целого числа&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Функция &lt;code&gt;Math::NearbyInt&lt;/code&gt; округляет первый аргумент до целого числа в соответсвии с режимом, заданным вторым аргументом.&lt;/p&gt;\n&lt;p&gt;Если результат выходит за пределы 64-битного целого числа, возращается NULL.&lt;/p&gt;\n&lt;h4 id=\"primery7\"&gt;&lt;a href=\"ru/yql/udf/list/math.html#primery7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Math::NearbyInt(1.5, Math::RoundDownward()); -- 1\nSELECT Math::NearbyInt(1.5, Math::RoundToNearest()); -- 2\nSELECT Math::NearbyInt(2.5, Math::RoundToNearest()); -- 2\nSELECT Math::NearbyInt(1.5, Math::RoundTowardZero()); -- 1\nSELECT Math::NearbyInt(1.5, Math::RoundUpward()); -- 2\nSELECT Math::NearbyInt(-1.5, Math::RoundDownward()); -- -2\nSELECT Math::NearbyInt(-1.5, Math::RoundToNearest()); -- -2\nSELECT Math::NearbyInt(-2.5, Math::RoundToNearest()); -- -2\nSELECT Math::NearbyInt(-1.5, Math::RoundTowardZero()); -- -1\nSELECT Math::NearbyInt(-1.5, Math::RoundUpward()); -- -1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"382\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-382\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-382\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-382.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/udf/list/math.md","sourcePath":"ru/yql/udf/list/math.md"},"headings":[{"title":"Константы","href":"ru/yql/udf/list/math.html#constants","level":2},{"title":"(Double) -&gt; Bool","href":"ru/yql/udf/list/math.html#double-bool","level":2},{"title":"(Double) -&gt; Double","href":"ru/yql/udf/list/math.html#double-double","level":2},{"title":"(Double, Double) -&gt; Double","href":"ru/yql/udf/list/math.html#doubledouble-double","level":2},{"title":"(Double, Int32) -&gt; Double","href":"ru/yql/udf/list/math.html#doubleint32-double","level":2},{"title":"(Double, Double, [Double?]) -&gt; Bool","href":"ru/yql/udf/list/math.html#doubledouble-bool","level":2},{"title":"Функции взятия остатка","href":"ru/yql/udf/list/math.html#funkcii-vzyatiya-ostatka","level":2},{"title":"Функции округления до целого числа в заданном режиме","href":"ru/yql/udf/list/math.html#funkcii-okrugleniya-do-celogo-chisla-v-zadannom-rezhime","level":2}],"title":"Math"},"router":{"pathname":"ru/yql/udf/list/math","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
