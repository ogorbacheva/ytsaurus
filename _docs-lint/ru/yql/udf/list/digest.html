        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Модуль Digest вычисляют хеши (aka fingerprint'ы) от исходных сообщений. Хеши представляют собой (обычно) некоторую строку небольшого / фиксированного размера. Фактический размер хеша зависит от используемого алгоритма. Результат представляет собой последовательность бит.&lt;br /&gt;\nМодуль содержит как криптографические, так и некриптографические функции.&lt;/p&gt;\n&lt;p&gt;Важным свойством алгоритмов  является то, что хеш, вероятно, изменится, если сообщение каким-то образом изменится. Другим свойством является то, что функции дайджеста являются односторонними функциями, то есть должно быть трудно найти сообщение, соответствующее некоторому заданному дайджесту.&lt;/p&gt;\n&lt;h2 id=\"spisok-funkcij\"&gt;&lt;a href=\"ru/yql/udf/list/digest.html#spisok-funkcij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Digest::Crc32c(String{Flags::AutoMap}) -&amp;gt; Uint32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Digest::Crc64(String{Flags::AutoMap}) -&amp;gt; Uint64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Digest::Fnv32(String{Flags::AutoMap}) -&amp;gt; Uint32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Digest::Fnv64(String{Flags::AutoMap}) -&amp;gt; Uint64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Digest::MurMurHash(String{Flags:AutoMap}) -&amp;gt; Uint64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Digest::MurMurHash32(String{Flags:AutoMap}) -&amp;gt; Uint32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Digest::MurMurHash2A(String{Flags:AutoMap}) -&amp;gt; Uint64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Digest::MurMurHash2A32(String{Flags:AutoMap}) -&amp;gt; Uint32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Digest::CityHash(String{Flags:AutoMap}, [Uint64?]) -&amp;gt; Uint64&lt;/code&gt;: Второй опциональный аргумент задает seed&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Digest::CityHash128(String{Flags:AutoMap}) -&amp;gt; Tuple&amp;lt;Uint64,Uint64&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;CityHash функция для байтовой строки с результатом типа uint128. Результат представлен как пара из двух uint64 чисел &lt;code&gt;&amp;lt;low, high&amp;gt;&lt;/code&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Digest::CityHash128(\"Who set this ancient quarrel new abroach?\"); -- (11765163929838407746,2460323961016211789)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"64\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-64\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-64\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-64.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Digest::NumericHash(Uint64{Flags:AutoMap}) -&amp;gt; Uint64&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Digest::NumericHash(123456789); -- 1734215268924325803\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"72\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-72\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-72\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-72.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Digest::Md5Hex(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Digest::Md5Raw(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Digest::Md5HalfMix(String{Flags:AutoMap}) -&amp;gt; Uint64&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;MD5 - широко распространенный, 128-битный алгоритм хеширования.&lt;/p&gt;\n&lt;p&gt;Md5Hex - возращает хеш в виде ASCII  строки закодировавнной в 16 битной кодировке&lt;/p&gt;\n&lt;p&gt;Md5Raw - возращает хеш в виде байтовой строки&lt;/p&gt;\n&lt;p&gt;Md5HalfMix - вариант огрубления MD5 до размера Uint64&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    Digest::Md5Hex(\"Who set this ancient quarrel new abroach?\"), -- \"644e98bae764871650f2d93e14c6488d\"\n    Digest::Md5Raw(\"Who set this ancient quarrel new abroach?\"), -- Binary String: 64 4e 98 ba e7 64 87 16 50 f2 d9 3e 14 c6 48 8d\n    Digest::Md5HalfMix(\"Who set this ancient quarrel new abroach?\"); -- 17555822562955248004\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"102\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-102\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-102\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-102.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Digest::Argon2(string:String{Flags:AutoMap}, salt:String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Argon2 - функция формирования ключа, направленная на высокую скорость заполнения памяти и эффективное использование нескольких вычислительных блоков.&lt;/p&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;string - исходная строка&lt;/li&gt;\n&lt;li&gt;salt - строка которая будет использоавться в качестве соли для хеш функции&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Digest::Argon2(\"Who set this ancient quarrel new abroach?\", \"zcIvVcuHEIL8\"); -- Binary String: fa 50 34 d3 c3 23 a4 de 22 c7 7c e1 9c 65 64 88 25 b3 59 75 c5 b8 8c 73 da 88 eb 79 31 70 e8 f1\nSELECT Digest::Argon2(\"Who set this ancient quarrel new abroach?\", \"M78P42R8HA==\"); -- Binary String: d2 0e f1 3e 72 5a e9 32 65 ed 28 4b 12 1f 39 70 e5 10 aa 1a 15 67 6d 96 5d e8 19 b3 bd d5 04 e9\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"128\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-128\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-128\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-128.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Digest::Blake2B(string:String{Flags:AutoMap},[key:String?]) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;BLAKE2 — криптографическая хеш-функция, создана как альтернатива MD5 и SHA-1 алгоритмам, в которых были найдены уязвимости.&lt;/p&gt;\n&lt;p&gt;Параметры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;string - исходная строка&lt;/li&gt;\n&lt;li&gt;key - ключ, используемый для шифроавния исходной строки (может быть использован как разделяемый секрет между источником и приемником)&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Digest::Blake2B(\"Who set this ancient quarrel new abroach?\"); -- Binary String: 62 21 91 d8 11 5a da ad 5e 7c 86 47 41 02 7f 8f a8 a6 82 07 47 d8 f8 30 ab b4 c3 00 db 9c 24 2f\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"154\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-154\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-154\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-154.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Digest::SipHash(low:Uint64,high:Uint64,string:String{Flags:AutoMap}) -&amp;gt; Uint64&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Функция для хеширования исходного сообщения (&lt;code&gt;string&lt;/code&gt;) с помощью 128 битного ключа. Ключ представлен парой uint64 чисел low, high&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Digest::SipHash(0,0,\"Who set this ancient quarrel new abroach?\"); -- 14605466535756698285\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"165\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-165\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-165\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-165.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Digest::HighwayHash(key0:Uint64,key1:Uint64,key2:Uint64,key3:Uint64,string:String{Flags:AutoMap}) -&amp;gt; Uint64&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Функция для хеширования исходного сообщения (&lt;code&gt;string&lt;/code&gt;) с ключом длиной в 256 бит.&lt;/p&gt;\n&lt;p&gt;Ключ формируется как:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;key0 - первые 8 байт ключа&lt;/li&gt;\n&lt;li&gt;key1 - последующие 8 байт ключа&lt;/li&gt;\n&lt;li&gt;key2 - последующие 8 байт ключа&lt;/li&gt;\n&lt;li&gt;key3 - последние 8 байт ключа&lt;/li&gt;\n&lt;/ul&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Digest::FarmHashFingerprint(source:Uint64{Flags:AutoMap}) -&amp;gt; Uint64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Digest::FarmHashFingerprint2(low:Uint64{Flags:AutoMap}, high:Uint64{Flags:AutoMap}) -&amp;gt; Uint64&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;FarmHash функция для 128 битного числа. 128 битное число получается путем объединения битов из двух uit64 чисел.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Digest::FarmHashFingerprint32(string:String{Flags:AutoMap}) -&amp;gt; Uint32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Digest::FarmHashFingerprint64(string:String{Flags:AutoMap}) -&amp;gt; Uint64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Digest::FarmHashFingerprint128(string:String{Flags:AutoMap}) -&amp;gt; Tuple&amp;lt;Uint64,Uint64&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;FarmHash функция для байтовой строки с результатом типа uint128. Результат представлен как пара из двух uint64 чисел &lt;code&gt;&amp;lt;low, high&amp;gt;&lt;/code&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Digest::FarmHashFingerprint2(31880,6990065); -- 237693065644851126\nSELECT Digest::FarmHashFingerprint128(\"Who set this ancient quarrel new abroach?\"); -- (17165761740714960035, 5559728965407786337)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"236\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-236\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-236\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-236.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Digest::SuperFastHash(String{Flags:AutoMap}) -&amp;gt; Uint32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Digest::Sha1(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Digest::Sha256(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Digest::Sha512(String{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt; - добавлена в версии &lt;a href=\"ru/yql/changelog/2025.03.html\"&gt;2025.03&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Digest::IntHash64(Uint64{Flags:AutoMap}) -&amp;gt; Uint64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Digest::XXH3(String{Flags:AutoMap}) -&amp;gt; Uint64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Digest::XXH3_128(String{Flags:AutoMap}) -&amp;gt; Tuple&amp;lt;Uint64,Uint64&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;XXH3 - некриптографическая хеш-функция из семейста xxxHash. XXH3_128 генерит 128 битный хеш, результат представлен как пара из двух uint64 чисел &lt;code&gt;&amp;lt;low, high&amp;gt;&lt;/code&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT Digest::XXH3_128(\"Who set this ancient quarrel new abroach?\"); -- (17117571879768798812, 14282600258804776266)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"277\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-277\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-277\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-277.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/udf/list/digest.md","sourcePath":"ru/yql/udf/list/digest.md"},"headings":[{"title":"Список функций","href":"ru/yql/udf/list/digest.html#spisok-funkcij","level":2}],"title":"Digest"},"r         </script>
