        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В модуле DateTime существует два внутренних формата представления: &lt;code&gt;Resource&amp;lt;TM&amp;gt;&lt;/code&gt; для базовых типов дат и &lt;code&gt;Resource&amp;lt;TM64&amp;gt;&lt;/code&gt; для расширенных.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;Resource&amp;lt;TM&amp;gt;&lt;/code&gt; и &lt;code&gt;Resource&amp;lt;TM64&amp;gt;&lt;/code&gt; хранят следующие компоненты дат:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Year (для &lt;code&gt;Resource&amp;lt;TM&amp;gt;&lt;/code&gt; 12 бит, беззнаковый; для &lt;code&gt;Resource&amp;lt;TM64&amp;gt;&lt;/code&gt; 19 бит, знаковый);&lt;/li&gt;\n&lt;li&gt;Month (4 бита);&lt;/li&gt;\n&lt;li&gt;Day (5 бит);&lt;/li&gt;\n&lt;li&gt;Hour (5 бит);&lt;/li&gt;\n&lt;li&gt;Minute (6 бит);&lt;/li&gt;\n&lt;li&gt;Second (6 бит);&lt;/li&gt;\n&lt;li&gt;Microsecond (20 бит);&lt;/li&gt;\n&lt;li&gt;TimezoneId (16 бит);&lt;/li&gt;\n&lt;li&gt;DayOfYear (9 бит) — день от начала года;&lt;/li&gt;\n&lt;li&gt;WeekOfYear (6 бит) — неделя от начала года, 1 января всегда относится к первой неделе;&lt;/li&gt;\n&lt;li&gt;WeekOfYearIso8601 (6 бит) — неделя года согласно ISO 8601 (первой неделей считается та, в которой 4 января);&lt;/li&gt;\n&lt;li&gt;DayOfWeek (3 бита) — день недели.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Если таймзона не GMT, то в компонентах хранится локальное время в соответствующей таймзоне.&lt;/p&gt;\n&lt;h2 id=\"split\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#split\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Split&lt;/span&gt;&lt;/a&gt;Split&lt;/h2&gt;\n&lt;p&gt;Преобразование из простого типа во внутреннее представление. Всегда успешно при непустом входе.&lt;/p&gt;\n&lt;h4 id=\"spisok-funkcij\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#spisok-funkcij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DateTime::Split(Date/TzDate/Datetime/TzDatetime/Timestamp/TzTimestamp{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::Split(Date32/TzDate32/Datetime64/TzDatetime64/Timestamp64/TzTimestamp64{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Функции, принимающие на вход &lt;code&gt;Resource&amp;lt;TM&amp;gt;&lt;/code&gt; или &lt;code&gt;Resource&amp;lt;TM64&amp;gt;&lt;/code&gt;, могут быть вызваны непосредственно от простого типа даты/времени. В этом случае будет сделано неявное преобразование через вызов соответствующей функции &lt;code&gt;Split&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"make\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#make\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Make...&lt;/span&gt;&lt;/a&gt;Make...&lt;/h2&gt;\n&lt;p&gt;Сборка простого типа из внутреннего представления. Всегда успешна при непустом входе.&lt;/p&gt;\n&lt;h4 id=\"spisok-funkcij1\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#spisok-funkcij1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DateTime::MakeDate(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Date&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::MakeTzDate(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; TzDate&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::MakeDate32(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Date32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::MakeTzDate32(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; TzDate32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::MakeDatetime(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Datetime&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::MakeTzDatetime(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; TzDatetime&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::MakeDatetime64(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Datetime64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::MakeTzDatetime64(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; TzDatetime64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::MakeTimestamp(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Timestamp&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::MakeTzTimestamp(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; TzTimestamp&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::MakeTimestamp64(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Timestamp64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::MakeTzTimestamp64(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; TzTimestamp64&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    DateTime::MakeTimestamp(DateTime::Split(Datetime(\"2019-01-01T15:30:00Z\"))),\n      -- 2019-01-01T15:30:00.000000Z\n    DateTime::MakeDate(Datetime(\"2019-01-01T15:30:00Z\")),\n      -- 2019-01-01\n    DateTime::MakeTimestamp(DateTime::Split(TzDatetime(\"2019-01-01T00:00:00,Europe/Moscow\"))),\n      -- 2018-12-31T21:00:00Z (конвертация в UTC)\n    DateTime::MakeDate(TzDatetime(\"2019-01-01T12:00:00,GMT\"))\n      -- 2019-01-01 (Datetime -&amp;gt; Date с неявным Split)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"169\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-169\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-169\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-169.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"get\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#get\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Get...&lt;/span&gt;&lt;/a&gt;Get...&lt;/h2&gt;\n&lt;p&gt;Взятие компоненты внутреннего представления.&lt;/p&gt;\n&lt;h4 id=\"spisok-funkcij2\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#spisok-funkcij2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetYear(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint16&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetYear(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Int32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetDayOfYear(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint16&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetMonth(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint8&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetMonthName(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetWeekOfYear(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint8&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetWeekOfYearIso8601(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint8&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetDayOfMonth(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint8&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetDayOfWeek(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint8&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetDayOfWeekName(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetHour(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint8&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetMinute(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint8&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetSecond(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint8&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetMillisecondOfSecond(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetMicrosecondOfSecond(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetTimezoneId(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Uint16&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::GetTimezoneName(Resource&amp;lt;TM&amp;gt;/Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery1\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#primery1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$tm = DateTime::Split(TzDatetime(\"2019-01-09T00:00:00,Europe/Moscow\"));\n\nSELECT\n    DateTime::GetDayOfMonth($tm) as Day, -- 9\n    DateTime::GetMonthName($tm) as Month, -- \"January\"\n    DateTime::GetYear($tm) as Year, -- 2019\n    DateTime::GetTimezoneName($tm) as TzName, -- \"Europe/Moscow\"\n    DateTime::GetDayOfWeekName($tm) as WeekDay; -- \"Wednesday\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"269\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-269\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-269\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-269.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"update\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#update\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Update&lt;/span&gt;&lt;/a&gt;Update&lt;/h2&gt;\n&lt;p&gt;Обновление одной или нескольких компонент во внутреннем представлении. Возвращает либо обновлённую копию, либо NULL, если после обновления получается некорректная дата или возникают другие противоречия.&lt;/p&gt;\n&lt;h4 id=\"spisok-funkcij3\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#spisok-funkcij3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;DateTime::Update(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}, [ Year:Uint16?, Month:Uint8?, Day:Uint8?, Hour:Uint8?, Minute:Uint8?, Second:Uint8?, Microsecond:Uint32?, Timezone:String? ]) -&amp;gt; Resource&amp;lt;TM&amp;gt;?\nDateTime::Update(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}, [ Year:Int32?, Month:Uint8?, Day:Uint8?, Hour:Uint8?, Minute:Uint8?, Second:Uint8?, Microsecond:Uint32?, Timezone:String? ]) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"279\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-279\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-279\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-279.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"primery2\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#primery2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$tm = DateTime::Split(Timestamp(\"2019-01-01T01:02:03.456789Z\"));\n\nSELECT\n    DateTime::MakeDate(DateTime::Update($tm, 2012)), -- 2012-01-01\n    DateTime::MakeDate(DateTime::Update($tm, 2000, 6, 6)), -- 2000-06-06\n    DateTime::MakeDate(DateTime::Update($tm, NULL, 2, 30)), -- NULL (30 февраля)\n    DateTime::MakeDatetime(DateTime::Update($tm, NULL, NULL, 31)), -- 2019-01-31T01:02:03Z\n    DateTime::MakeDatetime(DateTime::Update($tm, 15 as Hour, 30 as Minute)), -- 2019-01-01T15:30:03Z\n    DateTime::MakeTimestamp(DateTime::Update($tm, 999999 as Microsecond)), -- 2019-01-01T01:02:03.999999Z\n    DateTime::MakeTimestamp(DateTime::Update($tm, \"Europe/Moscow\" as Timezone)), -- 2018-12-31T22:02:03.456789Z (конвертация в UTC)\n    DateTime::MakeTzTimestamp(DateTime::Update($tm, \"Europe/Moscow\" as Timezone)); -- 2019-01-01T01:02:03.456789,Europe/Moscow\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"283\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-283\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-283\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-283.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"from\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#from\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;From...&lt;/span&gt;&lt;/a&gt;From...&lt;/h2&gt;\n&lt;p&gt;Получение Timestamp из количества секунд/миллисекунд/микросекунд от начала эпохи в UTC. При выходе за границы Timestamp возвращается NULL.&lt;/p&gt;\n&lt;h4 id=\"spisok-funkcij4\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#spisok-funkcij4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DateTime::FromSeconds(Uint32{Flags:AutoMap}) -&amp;gt; Timestamp&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::FromSeconds64(Int64{Flags:AutoMap}) -&amp;gt; Timestamp64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::FromMilliseconds(Uint64{Flags:AutoMap}) -&amp;gt; Timestamp&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::FromMilliseconds64(Int64{Flags:AutoMap}) -&amp;gt; Timestamp64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::FromMicroseconds(Uint64{Flags:AutoMap}) -&amp;gt; Timestamp&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::FromMicroseconds64(Int64{Flags:AutoMap}) -&amp;gt; Timestamp64&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"to\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#to\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;To...&lt;/span&gt;&lt;/a&gt;To...&lt;/h2&gt;\n&lt;p&gt;Получение количества секунд/миллисекунд/микросекунд от начала эпохи в UTC из простого типа.&lt;/p&gt;\n&lt;h4 id=\"spisok-funkcij5\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#spisok-funkcij5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToSeconds(Date/Datetime/Timestamp/TzDate/TzDatetime/TzTimestamp{Flags:AutoMap}) -&amp;gt; Uint32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToSeconds(Date32/Datetime64/Timestamp64/TzDate32/TzDatetime64/TzTimestamp64{Flags:AutoMap}) -&amp;gt; Int64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToMilliseconds(Date/Datetime/Timestamp/TzDate/TzDatetime/TzTimestamp{Flags:AutoMap}) -&amp;gt; Uint64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToMilliseconds(Date32/Datetime64/Timestamp64/TzDate32/TzDatetime64/TzTimestamp64{Flags:AutoMap}) -&amp;gt; Int64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToMicroseconds(Date/Datetime/Timestamp/TzDate/TzDatetime/TzTimestamp{Flags:AutoMap}) -&amp;gt; Uint64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToMicroseconds(Date32/Datetime64/Timestamp64/TzDate32/TzDatetime64/TzTimestamp64{Flags:AutoMap}) -&amp;gt; Int64&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery3\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#primery3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    DateTime::FromSeconds(1546304523), -- 2019-01-01T01:02:03.000000Z\n    DateTime::ToMicroseconds(Timestamp(\"2019-01-01T01:02:03.456789Z\")); -- 1546304523456789\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"369\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-369\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-369\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-369.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"interval\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#interval\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Interval...&lt;/span&gt;&lt;/a&gt;Interval...&lt;/h2&gt;\n&lt;p&gt;Преобразования между &lt;code&gt;Interval&lt;/code&gt; и различными единицами измерения времени.&lt;/p&gt;\n&lt;h4 id=\"spisok-funkcij6\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#spisok-funkcij6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToDays(Interval{Flags:AutoMap}) -&amp;gt; Int32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToDays(Interval64{Flags:AutoMap}) -&amp;gt; Int32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToHours(Interval{Flags:AutoMap}) -&amp;gt; Int32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToHours(Interval64{Flags:AutoMap}) -&amp;gt; Int64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToMinutes(Interval{Flags:AutoMap}) -&amp;gt; Int32&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToMinutes(Interval64{Flags:AutoMap}) -&amp;gt; Int64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToSeconds(Interval{Flags:AutoMap}) -&amp;gt; Int32&lt;/code&gt; - до версии &lt;a href=\"ru/yql/changelog/2025.03.html\"&gt;2025.03&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToSeconds(Interval{Flags:AutoMap}) -&amp;gt; Int64&lt;/code&gt; - с версии &lt;a href=\"ru/yql/changelog/2025.03.html\"&gt;2025.03&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToSeconds(Interval64{Flags:AutoMap}) -&amp;gt; Int64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToMilliseconds(Interval{Flags:AutoMap}) -&amp;gt; Int64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToMilliseconds(Interval64{Flags:AutoMap}) -&amp;gt; Int64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToMicroseconds(Interval{Flags:AutoMap}) -&amp;gt; Int64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ToMicroseconds(Interval64{Flags:AutoMap}) -&amp;gt; Int64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::IntervalFromDays(Int32{Flags:AutoMap}) -&amp;gt; Interval&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::Interval64FromDays(Int32{Flags:AutoMap}) -&amp;gt; Interval64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::IntervalFromHours(Int32{Flags:AutoMap}) -&amp;gt; Interval&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::Interval64FromHours(Int64{Flags:AutoMap}) -&amp;gt; Interval64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::IntervalFromMinutes(Int32{Flags:AutoMap}) -&amp;gt; Interval&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::Interval64FromMinutes(Int64{Flags:AutoMap}) -&amp;gt; Interval64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::IntervalFromSeconds(Int32{Flags:AutoMap}) -&amp;gt; Interval&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::Interval64FromSeconds(Int64{Flags:AutoMap}) -&amp;gt; Interval64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::IntervalFromMilliseconds(Int64{Flags:AutoMap}) -&amp;gt; Interval&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::Interval64FromMilliseconds(Int64{Flags:AutoMap}) -&amp;gt; Interval64&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::IntervalFromMicroseconds(Int64{Flags:AutoMap}) -&amp;gt; Interval&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::Interval64FromMicroseconds(Int64{Flags:AutoMap}) -&amp;gt; Interval64&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Функция &lt;code&gt;DateTime::ToSeconds&lt;/code&gt; до версии &lt;code&gt;2025.03&lt;/code&gt; не поддерживает работу с интервалами с длительностью большей, чем 68 лет. В этом случае можно использовать выражение &lt;code&gt;DateTime::ToMilliseconds(x) / 1000&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;AddTimezone никак не влияет на вывод ToSeconds(), поскольку ToSeconds() всегда возвращают время в таймзоне GMT.&lt;/p&gt;\n&lt;p&gt;Interval также можно создавать из строкового литерала в формате &lt;a href=\"https://en.wikipedia.org/wiki/ISO_8601%23Durations\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ISO 8601&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;На данный момент поддержаны только литералы для детерминированных интервалов. Все размерности больше недели -- M (месяц) и Y (год) -- не фиксированы, поскольку интервал может быть определен только с помощью внешнего контекста (месяц, год).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"primery4\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#primery4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    DateTime::ToDays(Interval(\"PT3000M\")), -- 2\n    DateTime::IntervalFromSeconds(1000000), -- 11 days 13 hours 46 minutes 40 seconds\n    DateTime::ToDays(cast('2018-01-01' as date) - cast('2017-12-31' as date)); --1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"535\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-535\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-535\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-535.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"startof\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#startof\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;StartOf... / EndOf... / TimeOfDay&lt;/span&gt;&lt;/a&gt;StartOf... / EndOf... / TimeOfDay&lt;/h2&gt;\n&lt;p&gt;Получить начало (конец) периода, содержащего дату/время. При некорректном результате возвращается NULL. Если таймзона не GMT, то начало (конец) периода будет в указанной временной зоне.&lt;/p&gt;\n&lt;h4 id=\"spisok-funkcij7\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#spisok-funkcij7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DateTime::StartOfYear(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::StartOfYear(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::EndOfYear(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::EndOfYear(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::StartOfQuarter(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::StartOfQuarter(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::EndOfQuarter(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::EndOfQuarter(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::StartOfMonth(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::StartOfMonth(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::EndOfMonth(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::EndOfMonth(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::StartOfWeek(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::StartOfWeek(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::EndOfWeek(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::EndOfWeek(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::StartOfDay(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::StartOfDay(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::EndOfDay(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::EndOfDay(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::StartOf(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}, Interval{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::StartOf(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}, Interval64{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::EndOf(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}, Interval{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::EndOf(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}, Interval64{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Функции &lt;code&gt;StartOf&lt;/code&gt;/&lt;code&gt;EndOf&lt;/code&gt; предназначены для группировки в пределах суток по произвольному периоду. Результат отличается от входного значения только компонентами времени. Период более суток трактуется как сутки (эквивалентно &lt;code&gt;StartOfDay&lt;/code&gt;/&lt;code&gt;EndOfDay&lt;/code&gt;). Если в сутках не содержится целого числа периодов, производится округление к ближайшему времени от начала суток, кратному указанному периоду. При нулевом интервале выход совпадает со входом. Отрицательный интервал трактуется как положительный.&lt;/p&gt;\n&lt;p&gt;Функции &lt;code&gt;EndOf...&lt;/code&gt; предназначены для получения последнего момента времени, находящегося в том же выбранном интервале, что и заданный.&lt;/p&gt;\n&lt;p&gt;Поведение функций с периодами больше дня отличается от поведения одноимённых функций в старой библиотеке. Компоненты времени всегда обнуляются (это логично, поскольку эти функции в основном используются для группировки по периоду). Отдельно существует возможность выделить время в пределах суток:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DateTime::TimeOfDay(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}) -&amp;gt; Interval&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::TimeOfDay(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; Interval64&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery5\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#primery5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    DateTime::MakeDate(DateTime::StartOfYear(Date(\"2019-06-06\"))),\n      -- 2019-01-01 (неявный Split здесь и дальше)\n    DateTime::MakeDatetime(DateTime::StartOfQuarter(Datetime(\"2019-06-06T01:02:03Z\"))),\n      -- 2019-04-01T00:00:00Z (компоненты времени обнулены)\n    DateTime::MakeDate(DateTime::StartOfMonth(Timestamp(\"2019-06-06T01:02:03.456789Z\"))),\n      -- 2019-06-01\n    DateTime::MakeDate(DateTime::StartOfWeek(Date(\"1970-01-01\"))),\n      -- NULL (начало эпохи - четверг, начало недели - 1969-12-29, выход за границы)\n    DateTime::MakeTimestamp(DateTime::StartOfWeek(Date(\"2019-01-01\"))),\n      -- 2018-12-31T00:00:00Z\n    DateTime::MakeDatetime(DateTime::StartOfDay(Datetime(\"2019-06-06T01:02:03Z\"))),\n      -- 2019-06-06T00:00:00Z\n    DateTime::MakeTzDatetime(DateTime::StartOfDay(TzDatetime(\"1970-01-01T05:00:00,Europe/Moscow\"))),\n      -- NULL (в GMT выход за эпоху)\n    DateTime::MakeTzTimestamp(DateTime::StartOfDay(TzTimestamp(\"1970-01-02T05:00:00.000000,Europe/Moscow\"))),\n      -- 1970-01-02T00:00:00,Europe/Moscow (начало дня по Москве)\n    DateTime::MakeDatetime(DateTime::StartOf(Datetime(\"2019-06-06T23:45:00Z\"), Interval(\"PT7H\"))),\n      -- 2019-06-06T21:00:00Z\n    DateTime::MakeDatetime(DateTime::StartOf(Datetime(\"2019-06-06T23:45:00Z\"), Interval(\"PT20M\"))),\n      -- 2019-06-06T23:40:00Z\n    DateTime::TimeOfDay(Timestamp(\"2019-02-14T01:02:03.456789Z\"));\n      -- 1 hour 2 minutes 3 seconds 456789 microseconds\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"691\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-691\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-691\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-691.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"shift\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#shift\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Shift...&lt;/span&gt;&lt;/a&gt;Shift...&lt;/h2&gt;\n&lt;p&gt;Прибавить/вычесть заданное количество единиц к компоненте во внутреннем представлении и обновить остальные поля.&lt;br /&gt;\nВозвращает либо обновлённую копию, либо NULL, если после обновления получается некорректная дата или возникают другие противоречия.&lt;/p&gt;\n&lt;h4 id=\"spisok-funkcij8\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#spisok-funkcij8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ShiftYears(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}, Int32) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ShiftYears(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}, Int32) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ShiftQuarters(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}, Int32) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ShiftQuarters(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}, Int32) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ShiftMonths(Resource&amp;lt;TM&amp;gt;{Flags:AutoMap}, Int32) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ShiftMonths(Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}, Int32) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Если в результате номер дня в месяце превышает максимально возможный, то в поле &lt;code&gt;Day&lt;/code&gt; будет записан последний день месяца,&lt;br /&gt;\nвремя при этом не изменится (см. примеры).&lt;/p&gt;\n&lt;h4 id=\"primery6\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#primery6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$tm1 = DateTime::Split(Datetime(\"2019-01-31T01:01:01Z\"));\n$tm2 = DateTime::Split(TzDatetime(\"2049-05-20T12:34:50,Europe/Moscow\"));\n\nSELECT\n    DateTime::MakeDate(DateTime::ShiftYears($tm1, 10)), -- 2029-01-31T01:01:01\n    DateTime::MakeDate(DateTime::ShiftYears($tm2, -10000)), -- NULL (выход за границы)\n    DateTime::MakeDate(DateTime::ShiftQuarters($tm2, 0)), -- 2049-05-20T12:34:50,Europe/Moscow\n    DateTime::MakeDate(DateTime::ShiftQuarters($tm1, -3)), -- 2018-04-30T01:01:01\n    DateTime::MakeDate(DateTime::ShiftMonths($tm1, 1)), -- 2019-02-28T01:01:01\n    DateTime::MakeDate(DateTime::ShiftMonths($tm1, -35)), -- 2016-02-29T01:01:01\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"739\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-739\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-739\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-739.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"format\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#format\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Format&lt;/span&gt;&lt;/a&gt;Format&lt;/h2&gt;\n&lt;p&gt;Получить строковое представление момента времени, используя произвольную строку форматирования.&lt;/p&gt;\n&lt;h4 id=\"spisok-funkcij9\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#spisok-funkcij9\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DateTime::Format(String, alwaysWriteFractionalSeconds:Bool?) -&amp;gt; (Resource&amp;lt;TM64&amp;gt;{Flags:AutoMap}) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Для строки форматирования реализовано множество спецификаторов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;%%&lt;/code&gt; - символ %;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%Y&lt;/code&gt; - год 1-6 цифр и знак, для дат до н.э.;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%m&lt;/code&gt; - месяц 2 цифры;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%d&lt;/code&gt; - день 2 цифры;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%H&lt;/code&gt; - час 2 цифры;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%M&lt;/code&gt; - минуты 2 цифры;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%S&lt;/code&gt; - секунды 2 цифры или &lt;code&gt;XX.XXXXXX&lt;/code&gt; в случае непустых микросекунд (и только если флаг &lt;code&gt;alwaysWriteFractionalSeconds&lt;/code&gt; не выставлен в &lt;code&gt;True&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%z&lt;/code&gt; - +hhmm or -hhmm;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%Z&lt;/code&gt; - IANA имя таймзоны;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%b&lt;/code&gt; - короткое трехбуквенное английское название месяца (Jan);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%B&lt;/code&gt; - полное английское название месяца (January).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Все остальные символы строки форматирования переносятся без изменений.&lt;/p&gt;\n&lt;h4 id=\"primery7\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#primery7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$format = DateTime::Format(\"%Y-%m-%d %H:%M:%S %Z\");\n\nSELECT\n    $format(DateTime::Split(TzDatetime(\"2019-01-01T01:02:03,Europe/Moscow\")));\n      -- \"2019-01-01 01:02:03 Europe/Moscow\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"822\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-822\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-822\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-822.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"parse\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#parse\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Parse/Parse64&lt;/span&gt;&lt;/a&gt;Parse/Parse64&lt;/h2&gt;\n&lt;p&gt;Распарсить строку во внутреннее представление, используя произвольную строку форматирования. Для незаполненных полей используются значения по умолчанию. При возникновении ошибок возвращается NULL.&lt;/p&gt;\n&lt;h4 id=\"spisok-funkcij10\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#spisok-funkcij10\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DateTime::Parse(String) -&amp;gt; (String{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::Parse64(String) -&amp;gt; (String{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM64&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Реализованные спецификаторы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;%%&lt;/code&gt; - символ %;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%Y&lt;/code&gt; - год 4 цифры - при использовании &lt;code&gt;Parse&lt;/code&gt;, или 1-6 цифр и знак для дат до н.э. - при использовани &lt;code&gt;Parse64&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%m&lt;/code&gt; - месяц 2 цифры;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%d&lt;/code&gt; - день 2 цифры;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%H&lt;/code&gt; - час 2 цифры;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%M&lt;/code&gt; - минуты 2 цифры;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%S&lt;/code&gt; - секунды, может принимать и микросекунды в форматах от &lt;code&gt;XX&lt;/code&gt; до &lt;code&gt;XX.XXXXXX&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%Z&lt;/code&gt; - IANA имя таймзоны (GMT);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%b&lt;/code&gt; - короткое трехбуквенное регистронезависимое английское название месяца (Jan);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;%B&lt;/code&gt; - полное регистронезависимое английское название месяца (January).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery8\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#primery8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$parse1 = DateTime::Parse(\"%H:%M:%S\");\n$parse2 = DateTime::Parse(\"%S\");\n$parse3 = DateTime::Parse(\"%m/%d/%Y\");\n$parse4 = DateTime::Parse(\"%Z\");\n$parse5 = DateTime::Parse64(\"%m/%d/%Y\");\n\nSELECT\n    DateTime::MakeDatetime($parse1(\"01:02:03\")), -- 1970-01-01T01:02:03Z\n    DateTime::MakeTimestamp($parse2(\"12.3456\")), -- 1970-01-01T00:00:12.345600Z\n    DateTime::MakeTimestamp($parse3(\"02/30/2000\")), -- NULL (Feb 30)\n    DateTime::MakeTimestamp($parse4(\"Canada/Central\")), -- 1970-01-01T06:00:00Z (конвертация в UTC)\n    DateTime::MakeTimestamp64($parse5(\"02/10/1931\")), -- 1931-02-10T00:00:00Z (конвертация в UTC)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"902\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-902\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-902\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-902.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"parse-konkretnyh-formatov\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#parse-konkretnyh-formatov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Parse конкретных форматов&lt;/span&gt;&lt;/a&gt;Parse конкретных форматов&lt;/h2&gt;\n&lt;p&gt;Для распространённых форматов есть врапперы вокруг соответствующих методов util. Можно получить только TM с компонентами в UTC таймзоне.&lt;/p&gt;\n&lt;h4 id=\"spisok-funkcij11\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#spisok-funkcij11\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ParseRfc822(String{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ParseIso8601(String{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ParseHttp(String{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DateTime::ParseX509(String{Flags:AutoMap}) -&amp;gt; Resource&amp;lt;TM&amp;gt;?&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"primery9\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#primery9\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    DateTime::MakeTimestamp(DateTime::ParseRfc822(\"Fri, 4 Mar 2005 19:34:45 EST\")),\n      -- 2005-03-05T00:34:45Z\n    DateTime::MakeTimestamp(DateTime::ParseIso8601(\"2009-02-14T02:31:30+0300\")),\n      -- 2009-02-13T23:31:30Z\n    DateTime::MakeTimestamp(DateTime::ParseHttp(\"Sunday, 06-Nov-94 08:49:37 GMT\")),\n      -- 1994-11-06T08:49:37Z\n    DateTime::MakeTimestamp(DateTime::ParseX509(\"20091014165533Z\"))\n      -- 2009-10-14T16:55:33Z\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"937\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-937\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-937\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-937.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"tipovye-scenarii\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#tipovye-scenarii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типовые сценарии&lt;/span&gt;&lt;/a&gt;Типовые сценарии&lt;/h2&gt;\n&lt;h3 id=\"preobrazovaniya-mezhdu-strokami-i-sekundami\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#preobrazovaniya-mezhdu-strokami-i-sekundami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Преобразования между строками и секундами&lt;/span&gt;&lt;/a&gt;Преобразования между строками и секундами&lt;/h3&gt;\n&lt;p&gt;Преобразование строковой даты (в таймзоне Москвы) в секунды (в таймзоне GMT):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$datetime_parse = DateTime::Parse(\"%Y-%m-%d %H:%M:%S\");\n$datetime_parse_tz = DateTime::Parse(\"%Y-%m-%d %H:%M:%S %Z\");\n\nSELECT\n    DateTime::ToSeconds(TzDatetime(\"2019-09-16T00:00:00,Europe/Moscow\")) AS md_us1, -- 1568581200\n    DateTime::ToSeconds(DateTime::MakeDatetime($datetime_parse_tz(\"2019-09-16 00:00:00\" || \" Europe/Moscow\"))),  -- 1568581200\n    DateTime::ToSeconds(DateTime::MakeDatetime(DateTime::Update($datetime_parse(\"2019-09-16 00:00:00\"), \"Europe/Moscow\" as Timezone))), -- 1568581200\n\n    -- НЕПРАВИЛЬНО (Date импортирует время как GMT, а AddTimezone никак не влияет на ToSeconds, которая всегда возвращает время в таймзоне GMT)\n    DateTime::ToSeconds(AddTimezone(Date(\"2019-09-16\"), 'Europe/Moscow')) AS md_us2, -- 1568592000\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"947\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-947\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-947\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-947.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Преобразование строковой даты (в таймзоне Москвы) в секунды (в таймзоне Москвы). Поскольку &lt;code&gt;DateTime::ToSeconds()&lt;/code&gt; экспортирует только GMT, придется временно забыть о таймзонах и работать только в GMT (выглядит это так, как будто временно мы считаем, что в Москве таймзона GMT):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$date_parse = DateTime::Parse(\"%Y-%m-%d\");\n$datetime_parse = DateTime::Parse(\"%Y-%m-%d %H:%M:%S\");\n$datetime_parse_tz = DateTime::Parse(\"%Y-%m-%d %H:%M:%S %Z\");\n\nSELECT\n    DateTime::ToSeconds(Datetime(\"2019-09-16T00:00:00Z\")) AS md_ms1, -- 1568592000\n    DateTime::ToSeconds(Date(\"2019-09-16\")) AS md_ms2, -- 1568592000\n    DateTime::ToSeconds(DateTime::MakeDatetime($date_parse(\"2019-09-16\"))) AS md_ms3, -- 1568592000\n    DateTime::ToSeconds(DateTime::MakeDatetime($datetime_parse(\"2019-09-16 00:00:00\"))) AS md_ms4, -- 1568592000\n    DateTime::ToSeconds(DateTime::MakeDatetime($datetime_parse_tz(\"2019-09-16 00:00:00 GMT\"))) AS md_ms5, -- 1568592000\n\n    -- НЕПРАВИЛЬНО (импортирует время в таймзоне Москвы, а RemoveTimezone никак не влияет на ToSeconds)\n    DateTime::ToSeconds(RemoveTimezone(TzDatetime(\"2019-09-16T00:00:00,Europe/Moscow\"))) AS md_ms6, -- 1568581200\n    DateTime::ToSeconds(DateTime::MakeDatetime($datetime_parse_tz(\"2019-09-16 00:00:00 Europe/Moscow\"))) AS md_ms7 -- 1568581200\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"951\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-951\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-951\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-951.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Преобразование секунд (в таймзоне GMT) в строковую дату (в таймзоне Москвы):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$date_format = DateTime::Format(\"%Y-%m-%d %H:%M:%S %Z\");\nSELECT\n    $date_format(AddTimezone(DateTime::FromSeconds(1568592000), 'Europe/Moscow')) -- \"2019-09-16 03:00:00 Europe/Moscow\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"955\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-955\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-955\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-955.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Преобразование секунд (в таймзоне Москвы) в строковую дату (в таймзоне Москвы). Здесь таймзона &lt;code&gt;%Z&lt;/code&gt; выводится для справки - обычно выводить ее не нужно, потому что она будет равна \"GMT\" и может сбить с толку.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$date_format = DateTime::Format(\"%Y-%m-%d %H:%M:%S %Z\");\nSELECT\n    $date_format(DateTime::FromSeconds(1568592000)) -- \"2019-09-16 00:00:00 GMT\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"959\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-959\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-959\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-959.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Преобразование секунд (в таймзоне GMT) в трехбуквенное название дня недели (в таймзоне Москвы):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    SUBSTRING(DateTime::GetDayOfWeekName(AddTimezone(DateTime::FromSeconds(1568581200), \"Europe/Moscow\")), 0, 3) -- \"Mon\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"963\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-963\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-963\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-963.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"formatirovanie-daty-i-vremeni\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#formatirovanie-daty-i-vremeni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Форматирование даты и времени&lt;/span&gt;&lt;/a&gt;Форматирование даты и времени&lt;/h3&gt;\n&lt;p&gt;Обычно для форматирования времени используется отдельное именованное выражение, но можно обойтись и без него:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$date_format = DateTime::Format(\"%Y-%m-%d %H:%M:%S %Z\");\n\nSELECT\n\n   -- Вариант с именованным выражением\n\n   $date_format(AddTimezone(DateTime::FromSeconds(1568592000), 'Europe/Moscow')),\n\n   -- Вариант без именованного выражения\n\n   DateTime::Format(\"%Y-%m-%d %H:%M:%S %Z\")\n       (AddTimezone(DateTime::FromSeconds(1568592000), 'Europe/Moscow'))\n;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"970\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-970\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-970\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-970.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"preobrazovanie-tipov\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#preobrazovanie-tipov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Преобразование типов&lt;/span&gt;&lt;/a&gt;Преобразование типов&lt;/h3&gt;\n&lt;p&gt;Так можно преобразовывать только константы:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    TzDatetime(\"2019-09-16T00:00:00,Europe/Moscow\"), -- 2019-09-16T00:00:00,Europe/Moscow\n    Date(\"2019-09-16\") -- 2019-09-16\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"977\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-977\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-977\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-977.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;А так - константу, именованное выражение или поле таблицы:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    CAST(\"2019-09-16T00:00:00,Europe/Moscow\" AS TzDatetime), -- 2019-09-16T00:00:00,Europe/Moscow\n    CAST(\"2019-09-16\" AS Date) -- 2019-09-16\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"981\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-981\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-981\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-981.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"preobrazovanie-vremeni-v-datu\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#preobrazovanie-vremeni-v-datu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Преобразование времени в дату&lt;/span&gt;&lt;/a&gt;Преобразование времени в дату&lt;/h3&gt;\n&lt;p&gt;&lt;code&gt;CAST&lt;/code&gt; в &lt;code&gt;Date&lt;/code&gt; или &lt;code&gt;TzDate&lt;/code&gt; дает такую дату в таймзоне GMT, в которую происходит полночь по локальному времени (например, для московского времени 2019-10-22 00:00:00, будет возвращена дата 2019-10-21). Для получения даты в локальной таймзоне можно использовать DateTime::Format.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$x = Datetime(\"2019-10-21T21:00:00Z\");\nselect\n    AddTimezone($x, \"Europe/Moscow\"), -- 2019-10-22T00:00:00,Europe/Moscow\n    cast($x as TzDate), -- 2019-10-21,GMT\n    cast(AddTimezone($x, \"Europe/Moscow\") as TzDate), -- 2019-10-21,Europe/Moscow\n    cast(AddTimezone($x, \"Europe/Moscow\") as Date), -- 2019-10-21\n  DateTime::Format(\"%Y-%m-%d %Z\")(AddTimezone($x, \"Europe/Moscow\")), -- 2019-10-22 Europe/Moscow\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"988\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-988\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-988\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-988.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Стоит отметить, что некоторые значения в типaх &lt;code&gt;TzDatetime&lt;/code&gt; и &lt;code&gt;TzTimestamp&lt;/code&gt;, имеющие положительное смещение таймзоны, не могут быть преобразованы в тип &lt;code&gt;TzDate&lt;/code&gt;. Рассмотрим следующий пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT CAST(TzDatetime(\"1970-01-01T23:59:59,Europe/Moscow\") as TzDate);\n/* Fatal: Timestamp 1970-01-01T23:59:59.000000,Europe/Moscow cannot be casted to TzDate */\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"992\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-992\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-992\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-992.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Не существует такого значения, начиная с Unix epoch, которым можно представить полночь 01.01.1970 для московского времени. В результате, такое преобразование считается невозможным и генерирует ошибку времени выполнения.&lt;/p&gt;\n&lt;p&gt;В то же время, значения, имеющие отрицательное смещение таймзоны, возвращают корректный результат:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT CAST(TzDatetime(\"1970-01-01T23:59:59,America/Los_Angeles\") as TzDate);\n/* 1970-01-01,America/Los_Angeles */\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"999\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-999\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-999\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-999.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"letnee-vremya\"&gt;&lt;a href=\"ru/yql/udf/list/datetime.html#letnee-vremya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Летнее время&lt;/span&gt;&lt;/a&gt;Летнее время&lt;/h3&gt;\n&lt;p&gt;Обратите внимание, что летнее время зависит от года:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;SELECT\n    RemoveTimezone(TzDatetime(\"2019-09-16T10:00:00,Europe/Moscow\")) as DST1, -- 2019-09-16T07:00:00Z\n    RemoveTimezone(TzDatetime(\"2008-12-03T10:00:00,Europe/Moscow\")) as DST2, -- 2008-12-03T07:00:00Z\n    RemoveTimezone(TzDatetime(\"2008-07-03T10:00:00,Europe/Moscow\")) as DST3, -- 2008-07-03T06:00:00Z (DST)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1006\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1006\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1006\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1006.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/udf/list/datetime.md","sourcePath":"ru/yql/udf/list/datetime.md"},"headings":[{"title":"Split","href":"ru/yql/udf/list/datetime.html#split","level":2},{"title":"Make...","href":"ru/yql/udf/list/datetime.html#make","level":2},{"title":"Get...","href":"ru/yql/udf/list/datetime.html#get","level":2},{"title":"Update","href":"ru/yql/udf/list/datetime.html#update","level":2},{"title":"From...","href":"ru/yql/udf/list/datetime.html#from","level":2},{"title":"To...","href":"ru/yql/udf/list/datetime.html#to","level":2},{"title":"Interval...","href":"ru/yql/udf/list/datetime.html#interval","level":2},{"title":"StartOf... / EndOf... / TimeOfDay","href":"ru/yql/udf/list/datetime.html#startof","level":2},{"title":"Shift...","href":"ru/yql/udf/list/datetime.html#shift","level":2},{"title":"Format","href":"ru/yql/udf/list/datetime.html#format","level":2},{"title":"Parse/Parse64","href":"ru/yql/udf/list/datetime.html#parse","level":2},{"title":"Parse конкретных форматов","href":"ru/yql/udf/list/datetime.html#parse-konkretnyh-formatov","level":2},{"title":"Типовые сценарии","href":"ru/yql/udf/list/datetime.html#tipovye-scenarii","level":2,"items":[{"title":"Преобразования между строками и секундами","href":"ru/yql/udf/list/datetime.html#preobrazovaniya-mezhdu-strokami-i-sekundami","level":3},{"title":"Форматирование даты и времени","href":"ru/yql/udf/list/datetime.html#formatirovanie-daty-i-vremeni","level":3},{"title":"Преобразование типов","href":"ru/yql/udf/list/datetime.html#preobrazovanie-tipov","level":3},{"title":"Преобразование времени в дату","href":"ru/yql/udf/list/datetime.html#preobrazovanie-vremeni-v-datu","level":3},{"title":"Летнее время","href":"ru/yql/udf/list/datetime.html#letnee-vremya","level":3}]}],"title":"DateTime"},"router":{"pathname":"ru/yql/udf/list/datetime","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
