        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Набор вспомогательных функций для &lt;a href=\"ru/yql/builtins/aggregation.html\"&gt;агрегатной функции HISTOGRAM&lt;/a&gt;. В описании сигнатур ниже под HistogramStruct подразумевается результат работы агрегатной функции &lt;code&gt;HISTOGRAM&lt;/code&gt;, &lt;code&gt;LinearHistogram&lt;/code&gt; или &lt;code&gt;LogarithmicHistogram&lt;/code&gt;, который является структурой определенного вида.&lt;/p&gt;\n&lt;h2 id=\"spisok-funkcij\"&gt;&lt;a href=\"ru/yql/udf/list/histogram.html#spisok-funkcij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список функций&lt;/span&gt;&lt;/a&gt;Список функций&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Histogram::Print(HistogramStruct{Flags:AutoMap}, Byte?) -&amp;gt; String&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Histogram::Normalize(HistogramStruct{Flags:AutoMap}, [Double?]) -&amp;gt; HistogramStruct&lt;/code&gt; — во втором аргументе желаемая площадь гистограммы, по умолчанию 100.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Histogram::ToCumulativeDistributionFunction(HistogramStruct{Flags:AutoMap}) -&amp;gt; HistogramStruct&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Histogram::GetSumAboveBound(HistogramStruct{Flags:AutoMap}, Double) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Histogram::GetSumBelowBound(HistogramStruct{Flags:AutoMap}, Double) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Histogram::GetSumInRange(HistogramStruct{Flags:AutoMap}, Double, Double) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Histogram::CalcUpperBound(HistogramStruct{Flags:AutoMap}, Double) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Histogram::CalcLowerBound(HistogramStruct{Flags:AutoMap}, Double) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Histogram::CalcUpperBoundSafe(HistogramStruct{Flags:AutoMap}, Double) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Histogram::CalcLowerBoundSafe(HistogramStruct{Flags:AutoMap}, Double) -&amp;gt; Double&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;У &lt;code&gt;Histogram::Print&lt;/code&gt; есть опциональный числовой аргумент, который задает максимальную длину столбцов гистограммы (в символах, так как гистограмма рисуется в технике ASCII-арт). Значение по умолчанию — 25. Данная функция предназначена в первую очередь для просмотра гистограмм в консоли. Веб-интерфейс автоматически делает их интерактивную визуализацию.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/udf/list/histogram.md","sourcePath":"ru/yql/udf/list/histogram.md"},"headings":[{"title":"Список функций","href":"ru/yql/udf/list/histogram.html#spisok-funkcij","level":2}],"title":"Histogram"},"router":{"pathname":"ru/yql/udf/list/histogram","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
