        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h3 id=\"type-aware-udf-funkcii\"&gt;&lt;a href=\"ru/yql/udf/cpp_type_aware_udf.html#type-aware-udf-funkcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Type-aware UDF-функции&lt;/span&gt;&lt;/a&gt;Type-aware UDF-функции&lt;/h3&gt;\n&lt;p&gt;Type awareness реализована с помощью аргумента &lt;code&gt;TType* userType&lt;/code&gt; методов &lt;code&gt;DeclareSignature(...)&lt;/code&gt; и &lt;code&gt;buildReturnSignature(...)&lt;/code&gt;. Этот аргумент позволяет посмотреть, с какими аргументами была вызвана UDF-функция из YQL, и построить нужную сигнатуру. Пользовательский тип можно распарсить с помощью &lt;code&gt;ITypeInfoHelper::TPtr&lt;/code&gt;, который принимает в конструкторе &lt;code&gt;builder.TypeInfoHelper()&lt;/code&gt; , из которого в свою очередь конструируются TypeInspector'ы: &lt;code&gt;TTupleTypeInspector&lt;/code&gt;, &lt;code&gt;TCallableTypeInspector&lt;/code&gt;, &lt;code&gt;TOptionalTypeInspector&lt;/code&gt; и др.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Для того чтобы движок YQL передавал на вход &lt;code&gt;DeclareSignature()&lt;/code&gt; не пустой userType, класс вашей UDF должен содержать определение подтипа:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;typedef bool TTypeAwareMarker;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"14\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-14\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-14\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-14.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;С помощью таких функций можно:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Поддержать опциональные или дефолтные аргументы:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;SomeTypeAwareUdfFunc(Double, Double) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;SomeTypeAwareUdfFunc(Double, Double, Double) -&amp;gt; Bool&lt;/code&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs cpp\"&gt;&lt;span class=\"hljs-function\"&gt;TMemberIndices &lt;span class=\"hljs-title\"&gt;TSomeTypeAwareUdfFunc::buildReturnSignature&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(IFunctionTypeInfoBuilder&amp;amp; builder, TType* userType)&lt;/span&gt; &lt;/span&gt;{\n    ...\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; userTypeInspector = &lt;span class=\"hljs-built_in\"&gt;TTupleTypeInspector&lt;/span&gt;(*typeHelper, userType);\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; argsTypeTuple = userTypeInspector.&lt;span class=\"hljs-built_in\"&gt;GetElementType&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;);\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; argsTypeInspector = &lt;span class=\"hljs-built_in\"&gt;TTupleTypeInspector&lt;/span&gt;(*typeHelper, argsTypeTuple);\n\n    &lt;span class=\"hljs-comment\"&gt;// Build right signature by number of arguments&lt;/span&gt;\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; (argsTypeInspector.&lt;span class=\"hljs-built_in\"&gt;GetElementsCount&lt;/span&gt;() == &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;) {\n        &lt;span class=\"hljs-comment\"&gt;/* Build one signature */&lt;/span&gt;\n        ...\n    } &lt;span class=\"hljs-keyword\"&gt;else&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; (argsTypeInspector.&lt;span class=\"hljs-built_in\"&gt;GetElementsCount&lt;/span&gt;() == &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;) {\n        &lt;span class=\"hljs-comment\"&gt;/* Build other signature */&lt;/span&gt;\n        ...\n    } &lt;span class=\"hljs-keyword\"&gt;else&lt;/span&gt; {\n        ...\n    }\n...\n}\n\nTUnboxedValue TSomeTypeAwareUdfFunc::&lt;span class=\"hljs-built_in\"&gt;Run&lt;/span&gt;(IValueBuilder* valueBuilder, TUnboxedValuePod* args) {\n    ...\n    &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; value = &lt;span class=\"hljs-number\"&gt;0.0&lt;/span&gt;;  &lt;span class=\"hljs-comment\"&gt;// default&lt;/span&gt;\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; (&lt;span class=\"hljs-comment\"&gt;/* hasThirdElement */&lt;/span&gt;) {\n        value = args[&lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;].&lt;span class=\"hljs-built_in\"&gt;Get&lt;/span&gt;&amp;lt;&lt;span class=\"hljs-type\"&gt;double&lt;/span&gt;&amp;gt;(); &lt;span class=\"hljs-comment\"&gt;// non-default&lt;/span&gt;\n    }\n    ...\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"31\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-31\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-31\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-31.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Поддержать перегрузку:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;SomeTypeAwareUdfFunc(List&amp;lt;Int&amp;gt;) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;SomeTypeAwareUdfFunc(Stream&amp;lt;Int&amp;gt;) -&amp;gt; String&lt;/code&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs cpp\"&gt;&lt;span class=\"hljs-function\"&gt;TMemberIndices &lt;span class=\"hljs-title\"&gt;buildReturnSignature&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(IFunctionTypeInfoBuilder&amp;amp; builder, TType* userType)&lt;/span&gt; &lt;/span&gt;{\n    ...\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; userTypeInspector = &lt;span class=\"hljs-built_in\"&gt;TTupleTypeInspector&lt;/span&gt;(*typeHelper, userType);\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; argsTypeTuple = userTypeInspector.&lt;span class=\"hljs-built_in\"&gt;GetElementType&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;);\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; argsTypeInspector = &lt;span class=\"hljs-built_in\"&gt;TTupleTypeInspector&lt;/span&gt;(*typeHelper, argsTypeTuple);\n\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; typeKind = typeHelper-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;GetTypeKind&lt;/span&gt;(argsTypeInspector.&lt;span class=\"hljs-built_in\"&gt;GetElementType&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;));\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; (typeKind == ETypeKind::List) {\n        ...\n    } &lt;span class=\"hljs-keyword\"&gt;else&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; (typeKind == ETypeKind::Stream) {\n        ...\n    } &lt;span class=\"hljs-keyword\"&gt;else&lt;/span&gt; {\n        ...\n    }\n    ...\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"43\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-43\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-43\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-43.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Поддержать изменение типа ответа по возвращаемому типу пользовательского колбэка:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;SomeTypeAwareUdfFunc(Callable&amp;lt;...&amp;gt;-&amp;gt;Int)-&amp;gt;List&amp;lt;Int&amp;gt;&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;SomeTypeAwareUdfFunc(Callable&amp;lt;...&amp;gt;-&amp;gt;Double)-&amp;gt;List&amp;lt;Double&amp;gt;&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;SomeTypeAwareUdfFunc(Callable&amp;lt;...&amp;gt;-&amp;gt;CallbackReturnType)-&amp;gt;List&amp;lt;CallbackReturnType&amp;gt;&lt;/code&gt;&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs cpp\"&gt;&lt;span class=\"hljs-function\"&gt;TMemberIndices &lt;span class=\"hljs-title\"&gt;buildReturnSignature&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(IFunctionTypeInfoBuilder&amp;amp; builder, TType* userType)&lt;/span&gt; &lt;/span&gt;{\n    ...\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; userTypeInspector = &lt;span class=\"hljs-built_in\"&gt;TTupleTypeInspector&lt;/span&gt;(*typeHelper, userType);\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; argsTypeTuple = userTypeInspector.&lt;span class=\"hljs-built_in\"&gt;GetElementType&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;);\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; argsTypeInspector = &lt;span class=\"hljs-built_in\"&gt;TTupleTypeInspector&lt;/span&gt;(*typeHelper, argsTypeTuple);\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; callbackInspector = &lt;span class=\"hljs-built_in\"&gt;TCallableTypeInspector&lt;/span&gt;(*typeHelper, argsTypeInspector.&lt;span class=\"hljs-built_in\"&gt;GetElementType&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;));\n\n    &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; resultType = builder.&lt;span class=\"hljs-built_in\"&gt;List&lt;/span&gt;()-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Item&lt;/span&gt;(callbackInspector.&lt;span class=\"hljs-built_in\"&gt;GetReturnType&lt;/span&gt;()).&lt;span class=\"hljs-built_in\"&gt;Build&lt;/span&gt;();\n    builder.&lt;span class=\"hljs-built_in\"&gt;Returns&lt;/span&gt;(resultType).&lt;span class=\"hljs-built_in\"&gt;Args&lt;/span&gt;()-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;Add&lt;/span&gt;(argsTypeInspector.&lt;span class=\"hljs-built_in\"&gt;GetElementType&lt;/span&gt;(&lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;)).&lt;span class=\"hljs-built_in\"&gt;Done&lt;/span&gt;();\n    ...\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"58\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-58\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-58\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-58.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/udf/cpp_type_aware_udf.md","sourcePath":"ru/yql/udf/cpp_type_aware_udf.md"},"headings":[],"title":""},"router":{"pathname":"ru/yql/udf/cpp_type_aware_udf","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
