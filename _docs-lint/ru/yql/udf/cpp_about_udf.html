        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h3 id=\"korotko-o-udf-funkciyah-v-c\"&gt;&lt;a href=\"ru/yql/udf/cpp_about_udf.html#korotko-o-udf-funkciyah-v-c\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Коротко о UDF-функциях в C++&lt;/span&gt;&lt;/a&gt;Коротко о UDF-функциях в C++&lt;/h3&gt;\n&lt;p&gt;Внутри cpp-кода UDF-функция - это просто класс-наследник &lt;code&gt;TBoxedValue&lt;/code&gt; с обязательным методом &lt;code&gt;Run()&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Для реализации конкретной UDF-функции внутри UDF-модуля удобно использовать класс с 3 переопределёнными функциями: &lt;code&gt;Name()&lt;/code&gt;, &lt;code&gt;DeclareSignature(...)&lt;/code&gt;, &lt;code&gt;Run(...)&lt;/code&gt; - которые будут вызываться внутри модуля в нужные моменты.&lt;/p&gt;\n&lt;p&gt;Пример класса UDF-модуля:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs cpp\"&gt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TSomeYQLModule&lt;/span&gt;: &lt;span class=\"hljs-keyword\"&gt;public&lt;/span&gt; IUdfModule {\n&lt;span class=\"hljs-keyword\"&gt;public&lt;/span&gt;:    \n    &lt;span class=\"hljs-function\"&gt;TStringRef &lt;span class=\"hljs-title\"&gt;Name&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;()&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; &lt;/span&gt;{\n        &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; TStringRef::&lt;span class=\"hljs-built_in\"&gt;Of&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"SomeModule\"&lt;/span&gt;);\n    }\n\n    &lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;GetAllFunctions&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(IFunctionsSink&amp;amp; sink)&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;final&lt;/span&gt; &lt;/span&gt;{\n        sink.&lt;span class=\"hljs-built_in\"&gt;Add&lt;/span&gt;(TSomeUdfFunction::&lt;span class=\"hljs-built_in\"&gt;Name&lt;/span&gt;());\n        sink.&lt;span class=\"hljs-built_in\"&gt;Add&lt;/span&gt;(TSomeTypeAwareUdfFunction::&lt;span class=\"hljs-built_in\"&gt;Name&lt;/span&gt;())-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;SetTypeAwareness&lt;/span&gt;();\n    }\n\n    &lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;BuildFunctionTypeInfo&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TStringRef&amp;amp; name,\n                               TType* userType,\n                               &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TStringRef&amp;amp; typeConfig,\n                               ui32 flags,\n                               IFunctionTypeInfoBuilder&amp;amp; builder)&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;override&lt;/span&gt; &lt;/span&gt;{\n        &lt;span class=\"hljs-keyword\"&gt;try&lt;/span&gt; {\n            &lt;span class=\"hljs-built_in\"&gt;Y_UNUSED&lt;/span&gt;(typeConfig);\n\n            &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; typesOnly = (flags &amp;amp; TFlags::TypesOnly);\n\n            &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; (TSomeUdfFunction::&lt;span class=\"hljs-built_in\"&gt;Name&lt;/span&gt;() == name) {\n                TSomeUdfFunction::&lt;span class=\"hljs-built_in\"&gt;DeclareSignature&lt;/span&gt;(typesOnly, builder);\n            } &lt;span class=\"hljs-keyword\"&gt;else&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; (TSomeTypeAwareUdfFunction::&lt;span class=\"hljs-built_in\"&gt;Name&lt;/span&gt;() == name) {\n                TSomeTypeAwareUdfFunction::&lt;span class=\"hljs-built_in\"&gt;DeclareSignature&lt;/span&gt;(\n                        typesOnly, builder, userType);\n            }                    \n        } &lt;span class=\"hljs-built_in\"&gt;catch&lt;/span&gt; (&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; std::exception&amp;amp; e) {\n            builder.&lt;span class=\"hljs-built_in\"&gt;SetError&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;CurrentExceptionMessage&lt;/span&gt;());\n        }\n    }\n};\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"12\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-12\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-12\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-12.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Описание методов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;static const TStringRef&amp;amp; Name()&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Метод, возвращающий имя функции, которое будет использоваться в YQL. В данной реализации этот метод используется для добавления функции в UDF-модуль.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;static bool DeclareSignature(bool typesOnly, IFunctionTypeInfoBuilder&amp;amp; builder [, TType* userType])&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Метод, объявляющий сигнатуру функции. Используется в методе &lt;code&gt;BuildFunctionTypeInfo&lt;/code&gt; UDF-модуля для получения информации об индексах полей структур, которые используются внутри класса, и создания экземляра конкретной UDF-функции.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;TUnboxedValue Run(const IValueBuilder* valueBuilder, const TUnboxedValuePod* args) const override&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Метод, реализующий всю внутреннюю логику UDF-функции. Когда вызывается UDF-функция из YQL, именно этот метод и будет вызван.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример класса UDF-функции:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs cpp\"&gt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TMyUdfFunction&lt;/span&gt; : &lt;span class=\"hljs-keyword\"&gt;public&lt;/span&gt; ::NKikimr::NUdf::TBoxedValue {\n&lt;span class=\"hljs-keyword\"&gt;public&lt;/span&gt;:\n    &lt;span class=\"hljs-comment\"&gt;// Each member struct is a C++ description of a YQL struct and has it's own&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;// constructor that takes in a builder instance and initializes a proper&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;// struct from it. If you want to build your own YQL struct and work with&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;// it in C++, you will need to write the same kind of constructor. These&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;// structs contain indices from the YQL runtime (in C++ you can't use field&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;// names, only indices) and TType* ResultStructType (YQL description of the&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;// struct), which is a description of the struct understandable for YQL and&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;// will be used later when specifying the return type of the UDF.&lt;/span&gt;\n    &lt;span class=\"hljs-keyword\"&gt;struct&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TMemberIndices&lt;/span&gt; {\n        &lt;span class=\"hljs-built_in\"&gt;TMemberIndices&lt;/span&gt;(::NKikimr::NUdf::IFunctionTypeInfoBuilder&amp;amp; builder) {\n            ...\n        }\n    };\n\n    &lt;span class=\"hljs-comment\"&gt;// Name() function, needed to register UDF in YQL, the function in YQL will&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;// have the name we specify here. In our UDF Module class we have a &lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;// GetAllFunctions method, where we add all function names into our module.&lt;/span&gt;\n    &lt;span class=\"hljs-type\"&gt;static&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; ::NKikimr::&lt;span class=\"hljs-function\"&gt;NUdf::TStringRef&amp;amp; &lt;span class=\"hljs-title\"&gt;Name&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;()&lt;/span&gt; &lt;/span&gt;{\n        &lt;span class=\"hljs-type\"&gt;static&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; name = ::NKikimr::NUdf::TStringRef::&lt;span class=\"hljs-built_in\"&gt;Of&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"MyUdfFunction\"&lt;/span&gt;);\n        &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; name;\n    }\n\n    &lt;span class=\"hljs-comment\"&gt;// This function is also used in the UDF module class in the&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;// BuildFunctionTypeInfo method. Here we use the passed in builder instance&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;//      1) to take information about indices we need for our class to work&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;//      2) to create an instance of this UDF function&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;// This is the only function where we can grab info about indices for our&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;// class constructor, thus this is the only place where constructor is &lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;// called&lt;/span&gt;\n    &lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;static&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;DeclareSignature&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n            &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; typesOnly, ::NKikimr::NUdf::IFunctionTypeInfoBuilder&amp;amp; builder,\n            ::NKikimr::NUdf::TType* userType)&lt;/span&gt; &lt;/span&gt;{\n        &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; members = &lt;span class=\"hljs-built_in\"&gt;buildReturnSignature&lt;/span&gt;(builder, userType);\n        &lt;span class=\"hljs-comment\"&gt;// If typesOnly flag is specified, we don't need to register&lt;/span&gt;\n        &lt;span class=\"hljs-comment\"&gt;// implementation, just build the signature&lt;/span&gt;\n        &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; (!typesOnly) {\n            builder.&lt;span class=\"hljs-built_in\"&gt;Implementation&lt;/span&gt;(&lt;span class=\"hljs-keyword\"&gt;new&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;TMyUdfFunction&lt;/span&gt;(members));\n        }\n        &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    }\n\n    &lt;span class=\"hljs-comment\"&gt;// Run() function is derived from TBoxedValue (and we need to override it)&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;// and contains our UDF logic. (When we call it from YQL, this function is&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;// what is gonna happen). &lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;// It always has signature &lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;// Run(IValueBuilder*, TUnboxedValuePod*) -&amp;gt; TUnboxedValue&lt;/span&gt;\n    ::NKikimr::&lt;span class=\"hljs-function\"&gt;NUdf::TUnboxedValue &lt;span class=\"hljs-title\"&gt;Run&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n            &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; ::NKikimr::NUdf::IValueBuilder* valueBuilder, \n            &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; ::NKikimr::NUdf::TUnboxedValuePod* args)&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;override&lt;/span&gt; &lt;/span&gt;{\n        ...\n    }\n\n&lt;span class=\"hljs-keyword\"&gt;private&lt;/span&gt;:\n    TMemberIndices IndicesDescription;\n    \n    &lt;span class=\"hljs-comment\"&gt;/// Constructor accepts YQL struct member descriptions and source code&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;/// position, for logging.&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;/// Instance of this class is created within DeclareSignature method,&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;/// as that is the only method that knows YQL Struct member indices&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;/// For the reasons above, it is made private&lt;/span&gt;\n    &lt;span class=\"hljs-built_in\"&gt;TMyUdfFunction&lt;/span&gt;(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TMemberIndices&amp;amp; indicesDescription, \n                   &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; ::NKikimr::NUdf::TSourcePosition&amp;amp; pos) {\n        ...\n    }\n    \n    &lt;span class=\"hljs-comment\"&gt;/// This function will initialize proper signature on given builder.&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;/// It will also return a struct with indices of YQL Struct members (in C++&lt;/span&gt;\n    &lt;span class=\"hljs-comment\"&gt;/// you have to access YQL Struct members by index, not by name)&lt;/span&gt;\n    &lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;static&lt;/span&gt; TMemberIndices &lt;span class=\"hljs-title\"&gt;buildReturnSignature&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n            ::NKikimr::NUdf::IFunctionTypeInfoBuilder&amp;amp; builder, \n            ::NKikimr::NUdf::TType* userType)&lt;/span&gt; &lt;/span&gt;{\n        ...\n    }\n};\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"45\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-45\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-45\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-45.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/yql/udf/cpp_about_udf.md","sourcePath":"ru/yql/udf/cpp_about_udf.md"},"headings":[],"title":""},"router":{"pathname":"ru/yql/udf/cpp_about_udf","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
