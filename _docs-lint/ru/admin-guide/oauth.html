        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В веб-интерфейсе YTsaurus реализовано два типа аутентификации пользователей: по паролю и через &lt;a href=\"https://en.wikipedia.org/wiki/Single_sign-on\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;SSO&lt;/a&gt;. Как работать с паролями — написано в &lt;a href=\"user-guide/storage/auth\"&gt;Руководстве пользователя&lt;/a&gt;. В данной статье описано, как сконфигурировать SSO.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;YTsaurus поддерживает SSO-аутентификацию только по протоколу &lt;a href=\"https://oauth.net/2/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;OAuth 2.0&lt;/a&gt;. При настройке SSO выбирайте такой Identity Server, который поддерживает работу с OAuth.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"konfiguraciya\"&gt;&lt;a href=\"ru/admin-guide/oauth.html#konfiguraciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конфигурация&lt;/span&gt;&lt;/a&gt;Конфигурация&lt;/h2&gt;\n&lt;p&gt;Для корректной работы аутентификации необходимо настроить две компоненты: прокси и веб-интерфейс.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Чтобы настроить прокси, следует заполнить поле &lt;code&gt;oauthService&lt;/code&gt; в &lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator/blob/main/docs/api.md#ytsaurusspec\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;спецификации ресурса&lt;/a&gt; ytsaurus.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Для конфигурации веб-интерфейса необходимо задать настройку &lt;a href=\"https://github.com/ytsaurus/ytsaurus-ui/blob/main/packages/ui/docs/configuration.md#oauth\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ytOAuthSettings&lt;/a&gt; в конфиге веб-интерфейса. Сделать это можно через &lt;a href=\"https://github.com/ytsaurus/ytsaurus-ui/blob/main/packages/ui-helm-chart/values.yaml#L80-L89\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ui-helm-chart&lt;/a&gt;, заполнив поле &lt;code&gt;settings.oauth&lt;/code&gt; в &lt;code&gt;values.yaml&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"primer\"&gt;&lt;a href=\"ru/admin-guide/oauth.html#primer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h3&gt;\n&lt;p&gt;Ниже приведён пример — как настроить SSO-аутентификацию в YTsaurus с помощью сервиса &lt;a href=\"https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-auth-code-flow\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Microsoft Identity Platform&lt;/a&gt;.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Сначала необходимо завести OAuth-приложение в MS Identity Platform. В качестве RedirectURIs следует задать &lt;code&gt;https://&amp;lt;HOST_NAME_OF_YOUR_YT_CLUSTER&amp;gt;/api/oauth/callback&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;При создании приложения будут получены &lt;code&gt;CLIENT_ID&lt;/code&gt; и &lt;code&gt;CLIENT_SECRET&lt;/code&gt;. Также потребуется определить &lt;code&gt;TENANT_ID&lt;/code&gt; — узнать его можно у администратора OAuth-сервера. Полученные параметры необходимо будет указывать в спецификации веб-интерфейса.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Далее следует настроить сервер:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-comment\"&gt;# ytsaurus.yaml&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;apiVersion:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;cluster.ytsaurus.tech/v1&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;kind:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Ytsaurus&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ytdemo&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;oauthService:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;host:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;graph.microsoft.com&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;port:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;443&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;secure:&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;userInfoHandler:&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;endpoint:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;oidc/userinfo&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;loginField:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;email&lt;/span&gt;\n  &lt;span class=\"hljs-comment\"&gt;# ...&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"50\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-50\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-50\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-50.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Настройка веб-интерфейса будет выглядеть следующим образом:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-comment\"&gt;# ui-helm.values.yaml&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;ui:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;image:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;repository:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ghcr.io/ytsaurus/ui&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# ...&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;settings:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;oauth:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;enabled:&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;baseURL:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"https://login.microsoftonline.com/mycompany.onmicrosoft.com/oauth2/v2.0/\"&lt;/span&gt; &lt;span class=\"hljs-comment\"&gt;# mycompany.onmicrosoft.com is a tenant ID example&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;authPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"authorize\"&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;logoutPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"logout\"&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;tokenPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"token\"&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;clientIdEnvName:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"CLIENT_ID\"&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;clientSecretEnvName:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"CLIENT_SECRET\"&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;scope:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"openid offline_access\"&lt;/span&gt; &lt;span class=\"hljs-comment\"&gt;# offline_access scope is required for api to respond with refresh_token&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;buttonLabel:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"Login via SSO\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"56\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-56\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-56\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-56.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"detali-realizacii\"&gt;&lt;a href=\"ru/admin-guide/oauth.html#detali-realizacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Детали реализации&lt;/span&gt;&lt;/a&gt;Детали реализации&lt;/h2&gt;\n&lt;p&gt;Ниже описано, как устроен флоу работы с OAuth. Это понимание поможет при локализации возможных проблем конфигурации.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Пользователь открывает веб-интерфейс YTsaurus и нажимает \"Login via SSO\".&lt;/li&gt;\n&lt;li&gt;Веб-интерфейс YTsaurus перенаправляет пользователя на URL стороннего OAuth Identity Server с пробросом сконфигурированных &lt;code&gt;scope&lt;/code&gt;. URL стороннего сервера формируется на основе &lt;code&gt;baseURL&lt;/code&gt; и &lt;code&gt;authPath&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Пользователь соглашается с запрошенными разрешениями, и OAuth Identity Server перенаправляет пользователя на адрес, который был задан в настройках OAuth-приложения — &lt;code&gt;https://&amp;lt;HOST_NAME_OF_YOUR_YT_CLUSTER&amp;gt;/api/oauth/callback&lt;/code&gt;. В query-параметре &lt;code&gt;code&lt;/code&gt; передаётся код авторизации.&lt;/li&gt;\n&lt;li&gt;Веб-интерфейс делает запрос в OAuth Identity Server по URL из &lt;code&gt;baseURL&lt;/code&gt; и &lt;code&gt;tokenPath&lt;/code&gt;. В запросе передаются код авторизации и секрет приложения. В ответе приходят &lt;code&gt;access_token&lt;/code&gt; и &lt;code&gt;refresh_token&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Веб-интерфейс выставляет токены в cookie браузера пользователя: &lt;code&gt;yt_oauth_access_token&lt;/code&gt; и &lt;code&gt;yt_oauth_refresh_token&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Когда &lt;code&gt;yt_oauth_access_token&lt;/code&gt; истекает — веб-интерфейс обновляет его, используя &lt;code&gt;yt_oauth_refresh_token&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Веб-интерфейс отправляет запросы в прокси, передавая значение cookie &lt;code&gt;yt_oauth_access_token&lt;/code&gt;. Прокси делает запрос в OAuth Identity Server на URL, который формируется на основе &lt;code&gt;oauthService.host&lt;/code&gt;, &lt;code&gt;oauthService.port&lt;/code&gt; и &lt;code&gt;oauthService.userInfoHandler.endpoint&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Из полученного ответа достаётся поле, сконфигурированное в &lt;code&gt;oauthService.userInfoHandler.loginField&lt;/code&gt; — оно используется в качестве username пользователя YTsaurus.&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"},{"property":"og:title","content":"Аутентификация в YTsaurus"},{"property":"og:description","content":"Как настроить SSO в веб-интерфейсе YTsaurus через OAuth 2.0."},{"property":"og:type","content":"article"},{"property":"og:url","content":"https://ytsaurus.tech/docs/ru/admin-guide/oauth"},{"property":"article:section","content":"auth"},{"property":"article:modified_time","content":"2025-01-22T20:00:00+03:00"},{"property":"article:author","content":"Кирилл Сибирёв"}],"vcsPath":"ru/admin-guide/oauth.md","sourcePath":"ru/admin-guide/oauth.md"},"headings":[{"title":"Конфигурация","href":"ru/admin-guide/oauth.html#konfiguraciya","level":2,"items":[{"title":"Пример","href":"ru/admin-guide/oauth.html#primer","level":3}]},{"title":"Детали реализации","href":"ru/admin-guide/oauth.html#detali-realizacii","level":2}],"title":"Настройка SSO"},"router":{"pathname":"ru/admin-guide/oauth","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
