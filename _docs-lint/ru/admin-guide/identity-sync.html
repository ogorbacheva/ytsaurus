        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Иногда возникает необходимость поддерживать синхронизацию списка пользователей и групп с внешней системой. Одним из возможных решений этой задачи может быть использование приложения &lt;a href=\"https://github.com/tractoai/ytsaurus-identity-sync\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ytsaurus-identity-sync&lt;/a&gt;. Приложение периодически запрашивает пользователей, группы и участия в группах из внешнего источника и обновляет их в YTsaurus.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Приложение &lt;code&gt;ytsaurus-identity-sync&lt;/code&gt; позволяет выполнять синхронизацию только в одну сторону — из внешнего источника в систему YTsaurus. Обратная синхронизация — из YTsaurus во внешнюю систему — не поддерживается.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Приложение поддерживает импорт пользователей и групп из двух источников:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Microsoft Entra (ранее известная как Azure Active Directory) с использованием &lt;a href=\"https://learn.microsoft.com/en-us/graph/azuread-users-concept-overview\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Microsoft Graph REST API&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Lightweight_Directory_Access_Protocol\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Lightweight Directory Access Protocol (LDAP)&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Детали об установке и конфигурации приложения можно найти в &lt;a href=\"https://github.com/tractoai/ytsaurus-identity-sync?tab=readme-ov-file#installing\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;README приложения&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"sm-takzhe\"&gt;&lt;a href=\"ru/admin-guide/identity-sync.html#sm-takzhe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;См. также&lt;/span&gt;&lt;/a&gt;См. также&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"admin-guide/cluster-operations.html#upravlenie-polzovatelyami,-gruppami-i-pravami-dostupa\"&gt;Управление пользователями и группами&lt;/a&gt; — в статье написано про ручное администрирование пользователей и групп в YTsaurus.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/admin-guide/identity-sync.md","sourcePath":"ru/admin-guide/identity-sync.md"},"headings":[{"title":"См. также","href":"ru/admin-guide/identity-sync.html#sm-takzhe","level":2}],"title":"Синхронизация пользователей и групп с внешней системой"},"router":{"pathname":"ru/admin-guide/identity-sync","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
