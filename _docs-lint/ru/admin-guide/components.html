        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе приведено описание основных компонент, из которых состоит кластер YTsaurus.&lt;/p&gt;\n&lt;h2 id=\"master\"&gt;&lt;a href=\"ru/admin-guide/components.html#master\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мастер&lt;/span&gt;&lt;/a&gt;Мастер&lt;/h2&gt;\n&lt;p&gt;Одним из основных компонентов кластера являются мастеры. Мастеры YTsaurus отвечают за отказоустойчивое хранение метаданных кластера. На мастерах хранится информация о пользователях системы, хранимых объектах и о местоположении самих данных. Файловая система, реализуемая мастерами, называется Кипарис.&lt;/p&gt;\n&lt;p&gt;Для отказоустойчивости в кластере YTsaurus должно быть несколько мастеров. Состояние мастеров идентично за счёт алгоритма консенсуса Hydra, похожего на протокол &lt;a href=\"https://raft.github.io/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Raft&lt;/a&gt;. Благодаря Hydra кластер остаётся доступен, пока доступно строго больше половины мастеров. Например, если в кластере три мастера, он будет работать, если доступны любые два. Количество мастеров должно быть нечётным, в production-инсталляциях рекомендуется использовать три или пять мастеров.&lt;/p&gt;\n&lt;p&gt;Мастеры YTsaurus являются stateful компонентой кластера, поскольку хранят снапшоты состояния кластера и журналы изменений на диске. Для лучшей производительности мастеров рекомендуется использовать носитель, хорошо справляющийся с большим потоком небольших записей, например — NVMe SSD.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/yt_cluster_components.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;h2 id=\"data-nodes\"&gt;&lt;a href=\"ru/admin-guide/components.html#data-nodes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data Nodes&lt;/span&gt;&lt;/a&gt;Data Nodes&lt;/h2&gt;\n&lt;p&gt;В то время как мастеры YTsaurus ответственны за хранение метаданных кластера, данные кластера хранятся на &lt;code&gt;Data Nodes&lt;/code&gt;. Файлы и таблицы, сохранённые в YTsaurus, разбиваются на части, называемые &lt;a href=\"user-guide/storage/chunks.html\"&gt;чанками&lt;/a&gt;. &lt;code&gt;Data Nodes&lt;/code&gt; хранят чанки в файловой системе на диске, а мастеры хранят информацию о том, из каких чанков состоят таблицы и файлы и на каких &lt;code&gt;Data Nodes&lt;/code&gt; данные чанки расположены.&lt;/p&gt;\n&lt;p&gt;Как и мастеры YTsaurus, &lt;code&gt;Data Nodes&lt;/code&gt; являются stateful компонентами, поскольку хранят чанки на дисках. В отличие от мастеров, чтение и запись чанков в типичном случае происходит крупногранулярно, поэтому для хранения чанков можно использовать как HDD, так и SSD, в зависимости от характера нагрузки на систему. YTsaurus поддерживает работу с различными типами дисков, позволяя объединять диски в группы, так называемые &lt;a href=\"user-guide/storage/media.html\"&gt;медиумы&lt;/a&gt;. Использование такой группировки даёт возможность хранить данные на различных типах носителя.&lt;/p&gt;\n&lt;h2 id=\"planirovshik\"&gt;&lt;a href=\"ru/admin-guide/components.html#planirovshik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Планировщик&lt;/span&gt;&lt;/a&gt;Планировщик&lt;/h2&gt;\n&lt;p&gt;Для запуска вычислений на кластерах используется подсистема планирования, состоящая из планировщика и контроллер агентов. Сами вычисления исполняются на &lt;code&gt;Exec Nodes&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В YTsaurus планировщик шардирован. Он состоит из двух компонент: сам планировщик и контроллер агенты.&lt;/p&gt;\n&lt;p&gt;Планировщик отвечает за честное разделение ресурсов между пользователями кластера при помощи алгоритма HDRF, являющегося обобщением алгоритма &lt;a href=\"https://en.wikipedia.org/wiki/Fair-share_scheduling\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;fair-share&lt;/a&gt;. Планировщик взаимодействует с &lt;code&gt;Exec Nodes&lt;/code&gt;, заказывая запуск новых джобов и получая информацию об их завершении.&lt;/p&gt;\n&lt;p&gt;В каждый момент времени в кластере активен только один планировщик, отвечающий за распределение ресурсов и запуск джобов. В целях отказоустойчивости рекомендуется запускать несколько планировщиков в пределах одного кластера. В таком случае один планировщик будет активен, а остальные планировщики будут готовы начать работу в случае выхода из строя активного. Планировщик является stateless компонентом: часть состояния планировщика, например список всех активных джобов, является транзиентной. Персистентная часть состояния, например описания запущенных операций, хранится в Кипарисе на мастерах.&lt;/p&gt;\n&lt;p&gt;Контроллер агенты являются второй частью подсистемы планирования и отвечают за логику исполнения операций. Например, для операции Map контроллер агенты решают, какие чанки будут обработаны, как входные данные будут разбиты на джобы, какие ресурсы требуются джобам для запуска и как результаты джобов будут объединены в выходные таблицы. Планировщик решает, сколько джобов может быть запущено одновременно и на каких &lt;code&gt;Exec Nodes&lt;/code&gt; они могут быть выполнены в зависимости от вычислительных квот пользователя. Как и планировщики, контроллер агенты являются stateless компонентами, но хранят часть своего состояния в Кипарисе.&lt;/p&gt;\n&lt;h2 id=\"exec-nodes\"&gt;&lt;a href=\"ru/admin-guide/components.html#exec-nodes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Exec Nodes&lt;/span&gt;&lt;/a&gt;Exec Nodes&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;Exec Nodes&lt;/code&gt; занимаются непосредственно исполнением джобов на вычислительных ресурсах кластера. &lt;code&gt;Exec Nodes&lt;/code&gt; сообщают планировщику о запущенных и завершившихся джобах и доступных ресурсах. В ответ &lt;code&gt;Exec Nodes&lt;/code&gt; получают от планировщика заявки на запуск новых джобов. &lt;code&gt;Exec Nodes&lt;/code&gt; отвечают за подготовку окружения для джоба, запуск контейнеров для изоляции процессов, управление жизнью пользовательских процессов и многое другое.&lt;/p&gt;\n&lt;p&gt;Для работы &lt;code&gt;Exec Nodes&lt;/code&gt; требуется доступ к диску. Во-первых, на диске создаются директории, в которых запускаются пользовательские процессы и в которые загружаются файлы, заказанные пользователем в спецификации операции. Во-вторых, на диске содержится &lt;code&gt;Chunk Cache&lt;/code&gt; и &lt;code&gt;Image Cache&lt;/code&gt; - кеши артефактов и образов контейнеров. В кешах сохраняются файлы, загруженные в джоб для того, чтобы переиспользовать их между разными джобами одной или нескольких операций. Диски для подобных целей не обязаны быть надёжными: в отличие от мастеров или &lt;code&gt;Data Nodes&lt;/code&gt;, потеря состояния &lt;code&gt;Exec Node&lt;/code&gt; приводит только к потере прогресса исполняемых на ней джобов.&lt;/p&gt;\n&lt;h2 id=\"tablet-nodes\"&gt;&lt;a href=\"ru/admin-guide/components.html#tablet-nodes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tablet Nodes&lt;/span&gt;&lt;/a&gt;Tablet Nodes&lt;/h2&gt;\n&lt;p&gt;&lt;code&gt;Tablet Nodes&lt;/code&gt; отвечают за работу динамических таблиц. Каждая динамическая таблица разбита на набор таблетов, которые обслуживаются таблет-селлами, запущенными в &lt;code&gt;Tablet Node&lt;/code&gt;. Несмотря на то что динамические таблицы имеют достаточно сложное персистентное состояние, &lt;code&gt;Tablet Node&lt;/code&gt; является stateless компонентой. Все необходимые данные сохраняются на &lt;code&gt;Data Nodes&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"yql-agent\"&gt;&lt;a href=\"ru/admin-guide/components.html#yql-agent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YQL Agent&lt;/span&gt;&lt;/a&gt;YQL Agent&lt;/h2&gt;\n&lt;p&gt;Инстансы YQL Agent оркестрируют исполнение YQL-запросов, преобразуя их в цепочку Map/Reduce-операций.&lt;/p&gt;\n&lt;h2 id=\"proxy\"&gt;&lt;a href=\"ru/admin-guide/components.html#proxy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Proxy&lt;/span&gt;&lt;/a&gt;Proxy&lt;/h2&gt;\n&lt;p&gt;Точкой входа в кластер являются прокси. Все пользовательские запросы к кластеру попадают именно в прокси, а затем попадают в нужные подсистемы. В YTsaurus существует два вида прокси: HTTP и RPC. Прокси являются stateless компонентом.&lt;/p&gt;\n&lt;p&gt;HTTP-прокси принимают команды в виде HTTP-запросов, что позволяет легко задавать запросы к YTsaurus из любого языка программирования.&lt;/p&gt;\n&lt;p&gt;RPC-прокси используют внутренний протокол YTsaurus, что усложняет работу с прокси, но повышает скорость обработки запросов. Использование RPC-прокси рекомендуется для latency-critical команд, выполняемых с высокой частотой, например запросов к динамическим таблицам.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/admin-guide/components.md","sourcePath":"ru/admin-guide/components.md"},"headings":[{"title":"Мастер","href":"ru/admin-guide/components.html#master","level":2},{"title":"Data Nodes","href":"ru/admin-guide/components.html#data-nodes","level":2},{"title":"Планировщик","href":"ru/admin-guide/components.html#planirovshik","level":2},{"title":"Exec Nodes","href":"ru/admin-guide/components.html#exec-nodes","level":2},{"title":"Tablet Nodes","href":"ru/admin-guide/components.html#tablet-nodes","level":2},{"title":"YQL Agent","href":"ru/admin-guide/components.html#yql-agent","level":2},{"title":"Proxy","href":"ru/admin-guide/components.html#proxy","level":2}],"title":"Компоненты кластера YTsaurus"},"router":{"pathname":"ru/admin-guide/components","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/
