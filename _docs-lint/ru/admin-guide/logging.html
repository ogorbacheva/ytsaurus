        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Серверные компоненты кластера YTsaurus пишут подробные логи, которые можно использовать для аудита и анализа проблем при эксплуатации. В продакшн-инсталляциях рекомендуется выделять под логи отдельные &lt;a href=\"admin-guide/locations.html\"&gt;локации на персистентных томах&lt;/a&gt;. Отсутствие логов может существенно ограничить возможности поддержки.&lt;/p&gt;\n&lt;p&gt;Для анализа работы подсистемы логирования можно воспользоваться prometheus-метриками с префиксом &lt;code&gt;yt_logging_*&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"debug_logs\"&gt;&lt;a href=\"ru/admin-guide/logging.html#debug_logs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Отладочные логи&lt;/span&gt;&lt;/a&gt;Отладочные логи&lt;/h2&gt;\n&lt;p&gt;Отладочные логи описываются в секции &lt;code&gt;loggers&lt;/code&gt; спецификации компонент YTsaurus.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Таблица 1 — Настройки отладочных логгеров YTsaurus &lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Поле&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Возможные значения&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;произвольная строка&lt;/td&gt;\n&lt;td&gt;Имя логгера; рекомендуется выбирать короткие и понятные названия &lt;code&gt;debug&lt;/code&gt;, &lt;code&gt;info&lt;/code&gt; и т. п.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;format&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;plain_text&lt;/code&gt; (default), &lt;code&gt;yson&lt;/code&gt;, &lt;code&gt;json&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Формат строки лога.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;minLogLevel&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;trace&lt;/code&gt;, &lt;code&gt;debug&lt;/code&gt;, &lt;code&gt;info&lt;/code&gt;, &lt;code&gt;error&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Минимальный уровень записей, попадающих в лог.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;categoriesFilter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Фильтр, позволяющий писать логи только от некоторых подсистем, см. &lt;a href=\"ru/admin-guide/logging.html#debug_log_categories\"&gt;ниже&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;writerType&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;file&lt;/code&gt;, &lt;code&gt;stderr&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Писать логи в файл или в stderr. При записи в stderr настройки ротации будут игнорироваться.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;compression&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;none&lt;/code&gt; (default), &lt;code&gt;gzip&lt;/code&gt;, &lt;code&gt;zstd&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Если задано значение, отличное от &lt;code&gt;none&lt;/code&gt;, сервер YTsaurus будет писать сжатые логи.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;useTimestampSuffix&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;true&lt;/code&gt;, &lt;code&gt;false&lt;/code&gt; (default)&lt;/td&gt;\n&lt;td&gt;Если &lt;code&gt;true&lt;/code&gt;, к имени файла в момент открытия или ротации дописывается timestamp. При этом механизм нумерации старых сегментов при ротации не используется. Имеет смысл только при записи в файл.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;rotationPolicy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;Настройки ротации логов, см. &lt;a href=\"ru/admin-guide/logging.html#log_rotation\"&gt;ниже&lt;/a&gt;. Имеет смысл только при записи в файл.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Путь к каталогу, куда будут записываться логи с &lt;code&gt;writerType=file&lt;/code&gt; , задаётся в описании локации типа &lt;code&gt;Logs&lt;/code&gt;. В случае, если локация &lt;code&gt;Logs&lt;/code&gt; не указана, логи будут записываться в каталог &lt;code&gt;/var/log&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Имена файлов с логом формируются следующим образом: &lt;code&gt;[component].[name].log(.[format])(.[compression])(.[timestamp_suffix])&lt;/code&gt;. Примеры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;controller-agent.error.log&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;master.debug.log.gzip&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;scheduler.info.log.json.zstd.2023-01-01T10:30:00&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Записи отладочных логов содержат следующие поля:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;instant&lt;/code&gt; — время в локальной временной зоне;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;level&lt;/code&gt; — уровень записи: &lt;code&gt;T&lt;/code&gt; — trace, &lt;code&gt;D&lt;/code&gt; — debug, &lt;code&gt;I&lt;/code&gt; — info, &lt;code&gt;W&lt;/code&gt; — warning, &lt;code&gt;E&lt;/code&gt; — error;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;category&lt;/code&gt; — имя подсистемы, к которой относится запись, например &lt;code&gt;ChunkClient&lt;/code&gt;, &lt;code&gt;ObjectServer&lt;/code&gt; или &lt;code&gt;RpcServer&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;message&lt;/code&gt; — тело сообщения;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;thread_id&lt;/code&gt; — id (или имя) треда, породившего запись; пишется только в формате &lt;code&gt;plain_text&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;fiber_id&lt;/code&gt; — id файбера, породившего запись; пишется только в формате &lt;code&gt;plain_text&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;trace_id&lt;/code&gt; — trace_context id, в контексте которого появилась запись; пишется только в формате &lt;code&gt;plain_text&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Пример записи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;2023-09-15 00:00:17,215385      I       ExecNode        Artifacts prepared (JobId: d15d7d5f-164ff08a-3fe0384-128e0, OperationId: cd56ab80-d21ef5ab-3fe03e8-d05edd49, JobType: Map)      Job     fff6d4149ccdf656    2bd5c3c9-600a44f5-de721d58-fb905017\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"188\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-188\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-188\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-188.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h3 id=\"debug_log_categories\"&gt;&lt;a href=\"ru/admin-guide/logging.html#debug_log_categories\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Рекомендации по настройке категорий&lt;/span&gt;&lt;/a&gt;Рекомендации по настройке категорий&lt;/h3&gt;\n&lt;p&gt;Существует два вида фильтра по категориям (&lt;code&gt;categoriesFilter&lt;/code&gt;):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;включающий — пишутся записи только тех категорий, которые были явно перечислены;&lt;/li&gt;\n&lt;li&gt;исключающий — пишутся записи любых категорий, кроме тех, которые были перечислены.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Зачастую, в больших инсталляциях приходится исключать категории &lt;code&gt;Bus&lt;/code&gt; и &lt;code&gt;Concurrency&lt;/code&gt;.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Примеры фильтров&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;categoriesFilter:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;type:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;exclude&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;values:&lt;/span&gt; [&lt;span class=\"hljs-string\"&gt;\"Bus\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"Concurrency\"&lt;/span&gt;]\n\n&lt;span class=\"hljs-attr\"&gt;categoriesFilter:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;type:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;include&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;values:&lt;/span&gt; [&lt;span class=\"hljs-string\"&gt;\"Scheduler\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"Strategy\"&lt;/span&gt;]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"217\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-217\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-217\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-217.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"structured_logs\"&gt;&lt;a href=\"ru/admin-guide/logging.html#structured_logs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Структурированные логи&lt;/span&gt;&lt;/a&gt;Структурированные логи&lt;/h2&gt;\n&lt;p&gt;Некоторые компоненты YTsaurus способны писать структурированные логи, которые можно использовать впоследствии для аудита, аналитики и автоматической обработки. Структурированные логи описываются в секции &lt;code&gt;structured_loggers&lt;/code&gt; спецификации компонент YTsaurus.&lt;/p&gt;\n&lt;p&gt;Для описания структурированных логгеров используются те же поля, что и для отладочных логов, кроме:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;writerType&lt;/code&gt; — не задаётся; структурированные логи всегда пишутся в файл;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;categoriesFilter&lt;/code&gt; — вместо него задаётся обязательное поле &lt;code&gt;category&lt;/code&gt; — равно одна категория.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Структурированные логи рекомендуется всегда писать в одном из структурированных форматов — &lt;code&gt;json&lt;/code&gt; или &lt;code&gt;yson&lt;/code&gt;. События в структурированный лог обычно пишутся на уровне &lt;code&gt;info&lt;/code&gt;. Набор полей структурированного лога зависит от конкретного типа лога.&lt;/p&gt;\n&lt;p&gt;Основные типы структурированных логов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;master_access_log&lt;/code&gt; — лог доступа к данным;  пишется на мастере, категория &lt;code&gt;Access&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;master_security_log&lt;/code&gt; — лог событий безопасности, например добавление пользователя в группу или изменение ACL; пишется на мастере, категория &lt;code&gt;SecurityServer&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;structured_http_proxy_log&lt;/code&gt; — лог запросов к http proxy, по одной строке на запрос; пишется на http proxy, категория &lt;code&gt;HttpStructuredProxy&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;chyt_log&lt;/code&gt; — лог запросов к CHYT, по одной строке на запрос; пишется на http proxy, категория &lt;code&gt;ClickHouseProxyStructured&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;structured_rpc_proxy_log&lt;/code&gt; — лог запросов к rpc proxy, по одной строке на запрос; пишется на rpc proxy, категория &lt;code&gt;RpcProxyStructuredMain&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;scheduler_event_log&lt;/code&gt; — лог событий планировщика; пишется планировщиком, категория &lt;code&gt;SchedulerEventLog&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;controller_event_log&lt;/code&gt; — лог событий контроллер-агента; пишется на контроллер-агенте, категория &lt;code&gt;ControllerEventLog&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"access_log\"&gt;&lt;a href=\"ru/admin-guide/logging.html#access_log\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Лог доступа к таблице&lt;/span&gt;&lt;/a&gt;Лог доступа к таблице&lt;/h3&gt;\n&lt;p&gt;Иногда возникает необходимость узнать, кто пользуется той или иной таблицей, — например, чтобы оценить последствия ее удаления или перемещения. Задача осложняется тем, что доступ может осуществляться посредством &lt;a href=\"user-guide/storage/objects.html#links\"&gt;ссылок&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Для решения подобных задач существует специальный лог, в котором журналируются события с узлами Кипариса, которые могут представлять интерес для пользователей.&lt;/p&gt;\n&lt;p&gt;Лог пишут мастер-серверы, причем в силу технических особенностей несколько различных серверов производят одинаковую последовательность записей, так что дублирования стоит ожидать. Кроме того, некоторая активность (например, запись в таблицы) выглядит как последовательность нескольких разных событий на разных мастер-серверах (из разных шардов). Подробнее об этом далее.&lt;/p&gt;\n&lt;p&gt;Каждая запись в логе (каждая строка в таблице) фиксирует одну команду, примененную к тому или иному кипарисному узлу.&lt;/p&gt;\n&lt;p&gt;Журналируются только команды, примененные к следующим типам узлов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;таблица;&lt;/li&gt;\n&lt;li&gt;файл;&lt;/li&gt;\n&lt;li&gt;документ;&lt;/li&gt;\n&lt;li&gt;журнал.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Стоит явно отметить, что директории &lt;em&gt;не входят&lt;/em&gt; в данный перечень.&lt;/p&gt;\n&lt;p&gt;Журналируются следующие команды:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;базовые (CRUD):\n&lt;ul&gt;\n&lt;li&gt;Create&lt;/li&gt;\n&lt;li&gt;Get&lt;/li&gt;\n&lt;li&gt;GetKey&lt;/li&gt;\n&lt;li&gt;Exists&lt;/li&gt;\n&lt;li&gt;List&lt;/li&gt;\n&lt;li&gt;Set&lt;/li&gt;\n&lt;li&gt;Remove&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;создание символической ссылки:\n&lt;ul&gt;\n&lt;li&gt;Link&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;блокировки:\n&lt;ul&gt;\n&lt;li&gt;Lock&lt;/li&gt;\n&lt;li&gt;Unlock&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;копирование и перемещение:\n&lt;ul&gt;\n&lt;li&gt;Copy&lt;/li&gt;\n&lt;li&gt;Move&lt;/li&gt;\n&lt;li&gt;BeginCopy, EndCopy&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;чтение и запись данных:\n&lt;ul&gt;\n&lt;li&gt;GetBasicAttributes&lt;/li&gt;\n&lt;li&gt;Fetch&lt;/li&gt;\n&lt;li&gt;BeginUpload&lt;/li&gt;\n&lt;li&gt;EndUpload&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;изменение состояния динамической таблицы:\n&lt;ul&gt;\n&lt;li&gt;PrepareMount, CommitMount, AbortMount&lt;/li&gt;\n&lt;li&gt;PrepareUnmount, CommitUnmount, AbortUnmount&lt;/li&gt;\n&lt;li&gt;PrepareRemount, CommitRemount, AbortRemount&lt;/li&gt;\n&lt;li&gt;PrepareFreeze, CommitFreeze, AbortFreeze&lt;/li&gt;\n&lt;li&gt;PrepareUnfreeze, CommitUnfreeze, AbortUnfreeze&lt;/li&gt;\n&lt;li&gt;PrepareReshard, CommitReshard, AbortReshard&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;прочие:\n&lt;ul&gt;\n&lt;li&gt;CheckPermission&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Некоторые комментарии касательно семантики команд можно найти далее.&lt;/p&gt;\n&lt;p&gt;Содержательная часть записи в логе имеет поля (колонки в таблице), представленные в таблице 1.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Таблица 1 — Описание полей лога&lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Поле&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;instant&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время события в формате &lt;code&gt;YYYY-MM-DD hh:mm:ss,sss&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;cluster&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Короткое имя кластера&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;method&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Команда (см. список выше)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt; (см. примечание)&lt;/td&gt;\n&lt;td&gt;Путь, переданный команде в качестве аргумента&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;original_path&lt;/code&gt; (см. примечание)&lt;/td&gt;\n&lt;td&gt;Путь, переданный команде в качестве аргумента&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;destination_path&lt;/code&gt; (см. примечание)&lt;/td&gt;\n&lt;td&gt;Для команд «Copy», «Move» и «Link» — путь назначения (для других команд отсутствует)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;original_destination_path&lt;/code&gt; (см. примечание)&lt;/td&gt;\n&lt;td&gt;Для команд «Copy», «Move» и «Link» — путь назначения (для других команд отсутствует)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Пользователь, давший команду&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;type&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Для команды «Create» — тип создаваемого узла (для других команд отсутствует)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_info&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Сведения о транзакции, в контексте которой была выполнена команда (если команда выполнялась вне транзакции, поле отсутствует)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Отличие поля &lt;code&gt;original_path&lt;/code&gt; от &lt;code&gt;path&lt;/code&gt; (а также &lt;code&gt;original_destination_path&lt;/code&gt; от &lt;code&gt;destination_path&lt;/code&gt;) заключается в следующем:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;если в качестве пути была указана ссылка (симлинк), в &lt;code&gt;original_path&lt;/code&gt; будет путь к ссылке, а в &lt;code&gt;path&lt;/code&gt; — «настоящий» путь к узлу;&lt;/li&gt;\n&lt;li&gt;далее, если этот путь ведет в шард, то в логе этого шарда в качестве &lt;code&gt;original_path&lt;/code&gt; будет указан «настоящий» путь, а в качестве &lt;code&gt;path&lt;/code&gt; — путь относительно корня шарда.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В общей сложности это означает, что условный grep по пути к симлинку всегда найдёт записи, содержащие настоящий путь к узлу, а grep по настоящему пути найдёт обращения в том числе и через симлинки. &lt;strong&gt;Важно лишь выполнять поиск как по &lt;code&gt;path&lt;/code&gt;, так и по &lt;code&gt;original_path&lt;/code&gt;.&lt;/strong&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Структура поля &lt;code&gt;transaction_info&lt;/code&gt; представлена в таблице 2.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Таблица 2 — Структура поля &lt;code&gt;transaction_info&lt;/code&gt;&lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Поле&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;ID транзакции&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;transaction_title&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Человекочитаемое описание транзакции (указывается клиентом при запуске транзакции; поле отсутствует, если описание не было указано)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;ID операции, ассоциированной с транзакцией&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;operation_title&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Человекочитаемое описание операции, ассоциированной с транзакцией&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parent&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Для вложенной транзакции — описание ее родителя (для верхнеуровневой транзакции поле отсутствует)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Следует отметить, что поле &lt;code&gt;parent&lt;/code&gt; устроено так же, как и &lt;code&gt;transaction_info&lt;/code&gt;. Таким образом, &lt;code&gt;transaction_info&lt;/code&gt; содержит полное рекурсивное описание родословной транзакции, из-под которой была выполнена команда.&lt;/p&gt;\n&lt;h4 id=\"zamechaniya\"&gt;&lt;a href=\"ru/admin-guide/logging.html#zamechaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Замечания&lt;/span&gt;&lt;/a&gt;Замечания&lt;/h4&gt;\n&lt;ol&gt;\n&lt;li&gt;Стоит отличать чтение/запись метаданных от чтения/записи данных (чанков) в таблицы и файлы.&lt;/li&gt;\n&lt;li&gt;С точки зрения мастера, чтение/запись данных выглядит как следующая последовательность команд:\n&lt;ul&gt;\n&lt;li&gt;чтение:\n&lt;ul&gt;\n&lt;li&gt;GetBasicAttributes — получение некоторых служебных атрибутов, без которых чтение невозможно;&lt;/li&gt;\n&lt;li&gt;Fetch — получение списка чанков, из которых состоит файл или таблица;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;запись:\n&lt;ul&gt;\n&lt;li&gt;GetBasicAttributes — получение некоторых служебных атрибутов, без которых запись невозможна;&lt;/li&gt;\n&lt;li&gt;BeginUpload  — открытие заливочной транзакции;&lt;/li&gt;\n&lt;li&gt;EndUpload  — завершение заливочной транзакции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;При чтении/записи данных команда GetBasicAttributes приходит на один селл, а Fetch, BeginUpload и EndUpload — на другой; это нормально.&lt;/li&gt;\n&lt;li&gt;В подавляющем большинстве случаев копирование или перемещение таблицы выглядят как команды Copy или Move. Команды BeginCopy и EndCopy используются, когда копирование/перемещение пересекает границы шардирования Кипариса. На практике пользователи с таким должны сталкиваться редко.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"http_proxy_log\"&gt;&lt;a href=\"ru/admin-guide/logging.html#http_proxy_log\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Лог запросов к HTTP-проксе&lt;/span&gt;&lt;/a&gt;Лог запросов к HTTP-проксе&lt;/h3&gt;\n&lt;p&gt;В данном логе журналируются записи о всех запросах, которые были обслужены HTTP-прокси.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Таблица 2 — Описание полей лога&lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Поле&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;instant&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время события в формате &lt;code&gt;YYYY-MM-DD hh:mm:ss,sss&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;cluster&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Короткое имя кластера&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;request_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор данного запроса&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;correlation_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Специальный идентификатор запроса, который генерируется клиентом и не изменяется в случае ретраев&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Пользователь, выполняющий запрос&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;method&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Метод HTTP-запроса&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;http_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Путь HTTP-запроса&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;user_agent&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Содержимое хедера &lt;code&gt;User-Agent&lt;/code&gt; в запросе&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;command&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"api/commands.html\"&gt;Команда&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parameters&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Параметры данной команды&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Значение параметра &lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;error&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Стуктурированное описание ошибки, в случае если запрос завершился неуспешно&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;error_code&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Код ошибки, в случае если запрос завершился неуспешно&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;http_code&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;HTTP-код ответа на данный запрос&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;start_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Фактическое время начала исполнения запроса на проксе&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;cpu_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время, потраченное проксей на исполнение запроса (в него не входит время исполнения запроса в других компонентах кластера)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;duration&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Общая длительность запроса&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;in_bytes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Размер входных данных запроса в байтах&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;out_bytes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Размер выходных данных запроса в байтах&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;remote_address&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Адрес, с которого пришел данный запрос&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"log_rotation\"&gt;&lt;a href=\"ru/admin-guide/logging.html#log_rotation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройка ротации логов&lt;/span&gt;&lt;/a&gt;Настройка ротации логов&lt;/h2&gt;\n&lt;p&gt;Для отладочных и структурированных логов, которые пишутся в файл, можно настроить встроенный механизм ротации (поле &lt;code&gt;rotationPolicy&lt;/code&gt;). Настройки ротации приведены в таблице. Если не используется опция &lt;code&gt;useTimestampSuffix&lt;/code&gt;, в момент ротации файлы старых сегментов переименовываются, с дописыванием порядкового номера.&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Таблица 3 — Настройки ротации логов &lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Поле&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;rotationPeriodMilliseconds&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Период ротации, в миллисекундах. Может задаваться вместе с &lt;code&gt;maxSegmentSize&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;maxSegmentSize&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ограничение на размер одного сегмента лога, в байтах. Может задаваться вместе с &lt;code&gt;rotationPeriodMilliseconds&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;maxTotalSizeToKeep&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ограничение на размер всех сегментов, в байтах. В момент ротации, удаляются самые старые логи так, чтобы уложиться в заданное ограничение.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;maxSegmentCountToKeep&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ограничение на количество хранимых сегментов лога, в штуках. Самые старые сегменты сверх ограничения удаляются.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"log_dynamic_configuration\"&gt;&lt;a href=\"ru/admin-guide/logging.html#log_dynamic_configuration\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Динамическая конфигурация&lt;/span&gt;&lt;/a&gt;Динамическая конфигурация&lt;/h2&gt;\n&lt;p&gt;Компоненты, поддерживающие динамическую конфигурацию, позволяют дополнительно уточнить настройки системы логирования с помощью динамического конфига в Кипарисе, секция &lt;code&gt;logging&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Основные параметры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;enable_anchor_profiling&lt;/code&gt; — включает prometheus-метрики по отдельным префиксам записей;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;min_logged_message_rate_to_profile&lt;/code&gt; — минимальная частота сообщения, для попадания в отдельную метрику;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;suppressed_messaged&lt;/code&gt; — список префиксов сообщений отладочных логов, которые будут исключены из логирования.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример конфигурации:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{\n  logging = {\n    enable_anchor_profiling = %true;\n    min_logged_message_rate_to_profile = 100;\n    suppressed_messaged = [\n      \"Skipping out of turn block\",\n      \"Request attempt started\",\n      \"Request attempt acknowledged\"\n    ];\n  }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1025\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1025\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1025\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1025.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"logging_examples\"&gt;&lt;a href=\"ru/admin-guide/logging.html#logging_examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример настройки логирования&lt;/span&gt;&lt;/a&gt;Пример настройки логирования&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;  &lt;span class=\"hljs-attr\"&gt;primaryMasters:&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;...&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;loggers:&lt;/span&gt;\n\t  &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;debug&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;compression:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;zstd&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;minLogLevel:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;debug&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;writerType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;file&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;rotationPolicy:&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;maxTotalSizeToKeep:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;50_000_000_000&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;rotationPeriodMilliseconds:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;900000&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;categoriesFilter:&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;type:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;exclude&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;values:&lt;/span&gt; [&lt;span class=\"hljs-string\"&gt;\"Bus\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"Concurrency\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"ReaderMemoryManager\"&lt;/span&gt;]\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;info&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;minLogLevel:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;info&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;writerType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;file&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;rotationPolicy:&lt;/span&gt;\n    \t  &lt;span class=\"hljs-attr\"&gt;maxTotalSizeToKeep:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;10_000_000_000&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;rotationPeriodMilliseconds:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;900000&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;error&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;minLogLevel:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;error&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;writerType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;stderr&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;structuredLoggers:&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;access&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;minLogLevel:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;info&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;category:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Access&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;rotationPolicy:&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;maxTotalSizeToKeep:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;5_000_000_000&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;rotationPeriodMilliseconds:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;900000&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;locations:&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;locationType:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Logs&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/logs&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;...&lt;/span&gt;\n\n    &lt;span class=\"hljs-attr\"&gt;volumeMounts:&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;master-logs&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;mountPath:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;/yt/logs&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;...&lt;/span&gt;\n\n    &lt;span class=\"hljs-attr\"&gt;volumeClaimTemplates:&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;master-logs&lt;/span&gt;\n        &lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n          &lt;span class=\"hljs-attr\"&gt;accessModes:&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"ReadWriteOnce\"&lt;/span&gt; ]\n          &lt;span class=\"hljs-attr\"&gt;resources:&lt;/span&gt;\n            &lt;span class=\"hljs-attr\"&gt;requests:&lt;/span&gt;\n              &lt;span class=\"hljs-attr\"&gt;storage:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;100Gi&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;...&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1029\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1029\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1029\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1029.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/admin-guide/logging.md","sourcePath":"ru/admin-guide/logging.md"},"headings":[{"title":"Отладочные логи","href":"ru/admin-guide/logging.html#debug_logs","level":2,"items":[{"title":"Рекомендации по настройке категорий","href":"ru/admin-guide/logging.html#debug_log_categories","level":3}]},{"title":"Структурированные логи","href":"ru/admin-guide/logging.html#structured_logs","level":2,"items":[{"title":"Лог доступа к таблице","href":"ru/admin-guide/logging.html#access_log","level":3,"items":[{"title":"Замечания","href":"ru/admin-guide/logging.html#zamechaniya","level":4}]},{"title":"Лог запросов к HTTP-проксе","href":"ru/admin-guide/logging.html#http_proxy_log","level":3}]},{"title":"Настройка ротации логов","href":"ru/admin-guide/logging.html#log_rotation","level":2},{"title":"Динамическая конфигурация","href":"ru/admin-guide/logging.html#log_dynamic_configuration","level":2},{"title":"Пример настройки логирования","href":"ru/admin-guide/logging.html#logging_examples","level":2}],"title":"Настройка логирования серверных компонент"},"router":{"pathname":"ru/admin-guide/logging","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
