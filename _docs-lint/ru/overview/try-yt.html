Color\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-670\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-670\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-670.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если вы получаете ошибку 'Cannot determine backend type: either driver config or proxy url should be specified.' — необходимо &lt;a href=\"ru/overview/try-yt.html#set-vars\"&gt;выставить&lt;/a&gt; переменную окружения &lt;code&gt;YT_PROXY&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Теперь запишите данные в исходную таблицу, вызвав команду &lt;a href=\"api/cli/commands.html#write-table\"&gt;write-table&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; source.tsv | yt write-table //home/mapreduce_input --format dsv\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"677\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-677\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-677\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-677.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Чтобы проверить, что в таблицу записались данные, можно прочитать таблицу с помощью команды &lt;a href=\"api/cli/commands.html#read-table\"&gt;read-table&lt;/a&gt;. В квадратных скобках указан полуинтервал — получить первые шесть строк таблицы:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt read-table &lt;span class=\"hljs-string\"&gt;'//home/mapreduce_input[:#6]'&lt;/span&gt; --format dsv\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"681\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-681\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-681\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-681.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"mr-run\"&gt;&lt;a href=\"ru/overview/try-yt.html#mr-run\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Запустите MapReduce&lt;/span&gt;&lt;/a&gt;3. Запустите MapReduce&lt;/h4&gt;\n&lt;p&gt;Запустите MapReduce операцию с помощью команды &lt;a href=\"api/cli/commands.html#map-reduce\"&gt;map-reduce&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt map-reduce --mapper &lt;span class=\"hljs-string\"&gt;\"python3 word-count.py map\"&lt;/span&gt; --reducer &lt;span class=\"hljs-string\"&gt;\"python3 word-count.py reduce\"&lt;/span&gt; --map-local-file word-count.py --reduce-local-file word-count.py --src //home/mapreduce_input --dst //home/mapreduce_result --reduce-by word --format dsv\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"688\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-688\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-688\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-688.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Статус запущенной операции можно отследить в веб-интерфейсе, в разделе &lt;strong&gt;Operations&lt;/strong&gt;.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Где найти этот раздел&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;&lt;img src=\"images/try-yt-operations.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"mr-get-result\"&gt;&lt;a href=\"ru/overview/try-yt.html#mr-get-result\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Прочитайте результат&lt;/span&gt;&lt;/a&gt;4. Прочитайте результат&lt;/h4&gt;\n&lt;p&gt;Теперь можно прочитать итоговую таблицу, выполнив простой SELECT запрос. В веб-интерфейсе перейдите во вкладку &lt;strong&gt;Queries&lt;/strong&gt; и введите запрос:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;home&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;mapreduce_result`\n&lt;span class=\"hljs-keyword\"&gt;ORDER&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; count\nLIMIT &lt;span class=\"hljs-number\"&gt;30&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"708\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-708\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-708\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-708.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"stop-cluster\"&gt;&lt;a href=\"ru/overview/try-yt.html#stop-cluster\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Остановка кластера&lt;/span&gt;&lt;/a&gt;Остановка кластера&lt;/h2&gt;\n&lt;div class=\"yfm-tabs yfm-tabs-dropdown\" data-diplodoc-group=\"defaultTabsGroup-ys9jz0vy\" data-diplodoc-variant=\"dropdown\"&gt;\n&lt;div role=\"tablist\" class=\"yfm-tabs-dropdown-select filled\"&gt;Docker&lt;/div&gt;\n&lt;ul class=\"yfm-tabs-dropdown-menu\"&gt;&lt;li class=\"yfm-tab active\" data-diplodoc-id=\"docker-4\" data-diplodoc-key=\"docker\" selected&gt;Docker&lt;/li&gt;&lt;li class=\"yfm-tab\" data-diplodoc-id=\"minikube-4\" data-diplodoc-key=\"minikube\"&gt;Minikube&lt;/li&gt;&lt;/ul&gt;&lt;div id=\"j1t1na1b\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"Docker\"&gt;\n&lt;p&gt;Чтобы остановить YTsaurus кластер, необходимо завершить работу контейнеров &lt;code&gt;yt.frontend&lt;/code&gt; и &lt;code&gt;yt.backend&lt;/code&gt;. Для этого выполните команду:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;./run_local_cluster.sh --stop\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"728\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-728\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-728\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-728.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Команда остановит контейнеры (выполнит &lt;code&gt;docker stop&lt;/code&gt;) и затем удалит их (&lt;code&gt;docker rm&lt;/code&gt;).&lt;/p&gt;\n&lt;/div&gt;\n&lt;div id=\"9d7ojxzx\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"Minikube\"&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Удалите YTsaurus кластер:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;kubectl delete -f cluster_v1_local.yaml\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"739\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-739\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-739\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-739.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Удалите оператор:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;helm uninstall ytsaurus\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"745\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-745\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-745\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-745.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Остановите кластер Kubernetes:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;minikube stop\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"751\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-751\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-751\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-751.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Удалите кластер Kubernetes:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;minikube delete\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"757\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-757\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-757\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-757.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Очистите кеш Minikube:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;rm&lt;/span&gt; -rf ~/.minikube/\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"763\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-763\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-763\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-763.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Если вы использовали Podman:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;podman &lt;span class=\"hljs-built_in\"&gt;rm&lt;/span&gt; -f minikube\npodman volume &lt;span class=\"hljs-built_in\"&gt;rm&lt;/span&gt; minikube\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"769\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-769\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-769\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-769.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n\n&lt;h2 id=\"demo\"&gt;&lt;a href=\"ru/overview/try-yt.html#demo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Демо-стенд&lt;/span&gt;&lt;/a&gt;Демо-стенд&lt;/h2&gt;\n&lt;p&gt;Это онлайн-демонстрация возможностей YTsaurus. Чтобы получить доступ к демо-кластеру, &lt;a href=\"https://ytsaurus.tech/#demo\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;заполните форму&lt;/a&gt;. После этого на указанную почту придёт письмо — в нём будет информация касательно доступов к кластеру.&lt;/p&gt;\n&lt;p&gt;Для взаимодействия с YTsaurus на демо-стенде настроено несколько сред:&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Jupyter Notebook&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;В ноутбуке подготовлено множество примеров для работы c YTsaurus — создание таблиц, загрузка данных, использование CHYT, SPYT, YQL и примеры SDK. Обзор всех примеров приведён на стартовой странице ноутбука &lt;strong&gt;About YTsaurus demo&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;Ссылка на поднятый Jupyter Notebook будет в письме.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/try-yt-jupyter.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Веб-интерфейс&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Тут вы сможете ознакомиться с возможностями веб-интерфейса YTsaurus: изучить файловую систему, посмотреть на список пулов, позапускать запросы в &lt;a href=\"user-guide/query-tracker/about.html\"&gt;Query Tracker&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Ссылка на веб-интерфейс поднятого кластера будет в письме.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/try-yt-ui.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;Про работу в веб-интерфейсе можно послушать в &lt;a href=\"https://youtu.be/LTKtY5okG4c?t=929\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ознакомительном вебинаре&lt;/a&gt; (начиная с минуты 15:30).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;\n&lt;h2 id=\"reshenie-problem\"&gt;&lt;a href=\"ru/overview/try-yt.html#reshenie-problem\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Решение проблем&lt;/span&gt;&lt;/a&gt;Решение проблем&lt;/h2&gt;\n&lt;p&gt;Если у вас что-то не получилось — не стесняйтесь задавать вопросы в &lt;a href=\"https://t.me/ytsaurus_ru\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;community-чате&lt;/a&gt; в телеграме. Мы обязательно вам ответим.&lt;/p&gt;\n&lt;p&gt;Чтобы оставить пожелания или замечания по документации, пожалуйста, &lt;a href=\"https://github.com/ytsaurus/ytsaurus/issues\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;заведите issue&lt;/a&gt; в GitHub-репозитории проекта. Ваш фидбек всегда приветствуется — он поможет сделать документацию лучше.&lt;/p&gt;\n&lt;dfn class=\"yfm yfm-term_dfn\" id=\":about-cypress_element\" role=\"dialog\"&gt;&lt;p&gt;Кипарис — это распределённая файловая система и хранилище метаинформации. В Кипарисе хранятся таблицы и файлы. Подробнее читайте в &lt;a href=\"ru/overview/user-guide/storage/cypress.html\"&gt;документации&lt;/a&gt;.&lt;/p&gt;\n&lt;/dfn&gt;&lt;dfn class=\"yfm yfm-term_dfn\" id=\":about-docker-containers_element\" role=\"dialog\"&gt;&lt;p&gt;Образы контейнеров собираются из Dockerfile, который можно посмотреть &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/yt/docker/ytsaurus/Dockerfile\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;тут&lt;/a&gt;.&lt;/p&gt;\n&lt;/dfn&gt;&lt;dfn class=\"yfm yfm-term_dfn\" id=\":about-qt_element\" role=\"dialog\"&gt;&lt;p&gt;Инструмент для запуска SQL-подобных запросов. Query Tracker доступен в веб-интерфейсе — в разделе &lt;strong&gt;Queries&lt;/strong&gt;. Подробнее читайте в &lt;a href=\"ru/overview/user-guide/query-tracker/about.html\"&gt;документации&lt;/a&gt;.&lt;/p&gt;\n&lt;/dfn&gt;&lt;dfn class=\"yfm yfm-term_dfn\" id=\":about-yql_element\" role=\"dialog\"&gt;&lt;p&gt;Это декларативный язык запросов к системам хранения и обработки данных. Основан на SQL синтаксисе. &lt;/p&gt;\n&lt;/dfn&gt;&lt;dfn class=\"yfm yfm-term_dfn\" id=\":about-master_element\" role=\"dialog\"&gt;&lt;p&gt;Отвечает за отказоустойчивое хранение метаданных кластера. К ним относится информация о пользователях системы, о хранимых объектах и о местоположении самих данных. Подробнее читайте в &lt;a href=\"ru/overview/admin-guide/components.html#master\"&gt;документации&lt;/a&gt;.&lt;/p&gt;\n&lt;/dfn&gt;&lt;dfn class=\"yfm yfm-term_dfn\" id=\":about-scheduler_element\" role=\"dialog\"&gt;&lt;p&gt;Отвечает за распределение ресурсов между операциями и за процесс их исполнения на кластере. Подробнее в &lt;a href=\"ru/overview/user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;документации&lt;/a&gt;.&lt;/p&gt;\n&lt;/dfn&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/overview/try-yt.md","sourcePath":"ru/overview/try-yt.md"},"headings":[{"title":"Перед началом работы","href":"ru/overview/try-yt.html#prerequisites","level":2},{"title":"Установка и запуск YTsaurus кластера","href":"ru/overview/try-yt.html#launch-cluster","level":2},{"title":"Установка YTsaurus CLI","href":"ru/overview/try-yt.html#install-cli","level":2},{"title":"Выполнение примеров","href":"ru/overview/try-yt.html#launch-example","level":2,"items":[{"title":"Установите переменные окружения","href":"ru/overview/try-yt.html#set-vars","level":3},{"title":"Создайте таблицу","href":"ru/overview/try-yt.html#create-table","level":3},{"title":"Запишите данные","href":"ru/overview/try-yt.html#insert-data","level":3},{"title":"Прочитайте результат","href":"ru/overview/try-yt.html#get-result","level":3},{"title":"Продвинутый пример: запуск MapReduce","href":"ru/overview/try-yt.html#mr","level":3,"items":[{"title":"1. Подготовьте данные","href":"ru/overview/try-yt.html#mr-prepare-data","level":4},{"title":"2. Создайте таблицу","href":"ru/overview/try-yt.html#mr-create-table","level":4},{"title":"3. Запустите MapReduce","href":"ru/overview/try-yt.html#mr-run","level":4},{"title":"4. Прочитайте результат","href":"ru/overview/try-yt.html#mr-get-result","level":4}]}]},{"title":"Остановка кластера","href":"ru/overview/try-yt.html#stop-cluster","level":2},{"title":"Демо-стенд","href":"ru/overview/try-yt.html#demo","level":2},{"title":"Решение проблем","href":"ru/overview/try-yt.html#reshenie-problem","level":2}],"title":"Как попробовать YTsaurus"},"router":{"pathname":"ru/overview/try-yt","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
