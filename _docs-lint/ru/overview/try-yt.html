        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном руководстве можно посмотреть на YTsaurus в действии — через установку и запуск кластера. Вы локально развернёте кластер YTsaurus, создадите таблицу и выполните простой SELECT запрос. Затем вы попробуете чуть более сложный пример — решите классическую задачу Word Count, запустив операцию MapReduce.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наиболее быстрый способ ознакомиться с возможностями продукта — на &lt;a href=\"ru/overview/try-yt.html#demo\"&gt;демо-стенде&lt;/a&gt;. Вы получите временный доступ к демо-кластеру, на котором развёрнуты все необходимые компоненты YTsaurus. Всё, что вам понадобится — это браузер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"prerequisites\"&gt;&lt;a href=\"ru/overview/try-yt.html#prerequisites\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Перед началом работы&lt;/span&gt;&lt;/a&gt;Перед началом работы&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Рекомендуемая среда для работы YTsaurus — это x86_64 Linux. Если у вас MacOS с процессором Apple Silicon, для локальной установки YTsaurus вам потребуется использовать режим эмуляции под архитектуру x86. Для этого подойдёт платформа виртуализации &lt;a href=\"https://docs.docker.com/desktop/setup/install/mac-install/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docker Desktop&lt;/a&gt; с включённой &lt;a href=\"https://support.apple.com/ru-ru/102527\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Rosetta 2&lt;/a&gt;. Однако следует учитывать, что работа YTsaurus в режиме эмуляции &lt;strong&gt;не гарантируется&lt;/strong&gt;. &lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;В данном руководстве вы будете запускать YTsaurus кластер в минимальной конфигурации — без гарантий отказоустойчивости. Не используйте предлагаемую конфигурацию в промышленном окружении и для проведения тестов производительности. Примеры того, как настраивать конфигурацию кластера, приведены в &lt;a href=\"admin-guide/prepare-spec.html\"&gt;Руководстве администратора&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Для корректной работы примеров в вашей системе должен быть установлен Python 3.8+.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"launch-cluster\"&gt;&lt;a href=\"ru/overview/try-yt.html#launch-cluster\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка и запуск YTsaurus кластера&lt;/span&gt;&lt;/a&gt;Установка и запуск YTsaurus кластера&lt;/h2&gt;\n&lt;p&gt;В инструкции будет предложено два способа установить YTsaurus кластер: через &lt;a href=\"https://www.docker.com/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docker&lt;/a&gt; и &lt;a href=\"https://minikube.sigs.k8s.io/docs/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Minikube&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Независимо от способа установки, в результате будут подняты необходимые компоненты системы: &lt;i class=\"yfm yfm-term_title\" term-key=\":about-master\" role=\"button\" aria-describedby=\":about-master_element\" tabindex=\"0\" id=\"epuwuewg\"&gt;мастер-сервер&lt;/i&gt;, &lt;i class=\"yfm yfm-term_title\" term-key=\":about-scheduler\" role=\"button\" aria-describedby=\":about-scheduler_element\" tabindex=\"0\" id=\"vu9whz5p\"&gt;планировщик&lt;/i&gt;, &lt;i class=\"yfm yfm-term_title\" term-key=\":about-yql\" role=\"button\" aria-describedby=\":about-yql_element\" tabindex=\"0\" id=\"1tf2xgni\"&gt;YQL&lt;/i&gt;, &lt;i class=\"yfm yfm-term_title\" term-key=\":about-qt\" role=\"button\" aria-describedby=\":about-qt_element\" tabindex=\"0\" id=\"zs2d0jt6\"&gt;Query Tracker&lt;/i&gt; и другие. Все последующие примеры из этого руководства — создание таблиц, загрузка данных и запуск MapReduce — не зависят от способа установки кластера и будут одинаковыми как для Docker, так и в случае Minikube.&lt;/p&gt;\n&lt;div class=\"yfm-tabs yfm-tabs-dropdown\" data-diplodoc-group=\"defaultTabsGroup-qfceefnf\" data-diplodoc-variant=\"dropdown\"&gt;\n&lt;div role=\"tablist\" class=\"yfm-tabs-dropdown-select filled\"&gt;Docker&lt;/div&gt;\n&lt;ul class=\"yfm-tabs-dropdown-menu\"&gt;&lt;li class=\"yfm-tab active\" data-diplodoc-id=\"docker\" data-diplodoc-key=\"docker\" selected&gt;Docker&lt;/li&gt;&lt;li class=\"yfm-tab\" data-diplodoc-id=\"minikube\" data-diplodoc-key=\"minikube\"&gt;Minikube&lt;/li&gt;&lt;/ul&gt;&lt;div id=\"pk4g5q3z\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"Docker\"&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Установите Docker:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Если у вас Linux x86_64 — установите &lt;a href=\"https://docs.docker.com/engine/install/ubuntu/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docker Engine&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Если у вас Mac — установите &lt;a href=\"https://docs.docker.com/desktop/setup/install/mac-install/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docker Desktop&lt;/a&gt; либо &lt;a href=\"https://podman.io/docs/installation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Podman&lt;/a&gt; в качестве альтернативы. Убедитесь, что у вас установлена и включена &lt;a href=\"https://support.apple.com/ru-ru/102527\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Rosetta 2&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Скачайте скрипт &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/docker/local\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_local_cluster.sh&lt;/a&gt; для развёртывания кластера и выставьте права на исполнение:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;mkdir&lt;/span&gt; ~/yt-local &amp;amp;&amp;amp; &lt;span class=\"hljs-built_in\"&gt;cd&lt;/span&gt; ~/yt-local\ncurl -s https://raw.githubusercontent.com/ytsaurus/ytsaurus/main/yt/docker/local/run_local_cluster.sh &amp;gt; run_local_cluster.sh\n&lt;span class=\"hljs-built_in\"&gt;chmod&lt;/span&gt; +x run_local_cluster.sh\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"77\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-77\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-77\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-77.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Чтобы поднять кластер, запустите скрипт:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;./run_local_cluster.sh\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"83\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-83\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-83\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-83.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Этот скрипт создаст и запустит &lt;i class=\"yfm yfm-term_title\" term-key=\":about-docker-containers\" role=\"button\" aria-describedby=\":about-docker-containers_element\" tabindex=\"0\" id=\"dmip4c5c\"&gt;docker-контейнеры&lt;/i&gt;, в которых будет развёрнут YTsaurus. Если всё прошло успешно, появится сообщение:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Congratulations! Local cluster is up and running. To use the cluster web interface, point your browser to http://localhost:8001. Or, if you prefer command-line tool 'yt', use it like this: 'yt --proxy localhost:8000 &amp;lt;command&amp;gt;'.\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"87\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-87\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-87\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-87.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Обратите внимание на адреса, которые указаны в этом сообщении. Они понадобятся в дальнейших примерах.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;localhost:8001&lt;/code&gt; — адрес веб-интерфейса. Можно открыть его в браузере.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;localhost:8000&lt;/code&gt; — адрес серверной части кластера. Этот адрес нужно будет &lt;a href=\"ru/overview/try-yt.html#set-vars\"&gt;указать&lt;/a&gt; в качестве адреса прокси для доступа к кластеру через CLI.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Чтобы убедиться, что всё работает, запустите команду:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ docker ps | grep yt\nCONTAINER ID   IMAGE                           COMMAND                  CREATED         STATUS         PORTS              NAMES\n2c254e35037c   ghcr.io/ytsaurus/local:stable   &lt;span class=\"hljs-string\"&gt;\"--fqdn localhost --…\"&lt;/span&gt;   2 minutes ago   Up 2 minutes   80/tcp, 8002/tcp   yt.backend\n5235b5077b5b   ghcr.io/ytsaurus/ui:stable      &lt;span class=\"hljs-string\"&gt;\"\"&lt;/span&gt;                       2 minutes ago   Up 2 minutes   80/tcp             yt.frontend\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"108\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-108\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-108\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-108.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;У вас должны быть запущены два контейнера:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;yt.frontend&lt;/code&gt; — процессы, связанные с веб-интерфейсом.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;yt.backend&lt;/code&gt; — в этом контейнере подняты компоненты YTsaurus кластера.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Про компоненты YTsaurus&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Чтобы узнать, какие компоненты YTsaurus подняты в системе, можно посмотреть на список запущенных процессов внутри контейнера:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ docker &lt;span class=\"hljs-built_in\"&gt;exec&lt;/span&gt; -it yt.backend /bin/bash\n$ ps -axo &lt;span class=\"hljs-built_in\"&gt;command&lt;/span&gt; | grep ytserver\n/mnt/rosetta /usr/bin/python3.8 /usr/local/bin/yt_local start --proxy-port 80 --local-cypress-dir /var/lib/yt/local-cypress --fqdn localhost --ytserver-all-path /usr/bin/ytserver-all --&lt;span class=\"hljs-built_in\"&gt;sync&lt;/span&gt; --fqdn localhost --proxy-config {coordinator={public_fqdn=&lt;span class=\"hljs-string\"&gt;\"localhost:8000\"&lt;/span&gt;}} --rpc-proxy-count 0 --rpc-proxy-port 8002 --node-count 1 --queue-agent-count 1 --address-resolver-config {enable_ipv4=%&lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;enable_ipv6=%&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;;} --native-client-supported --&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt; primary -c {name=query-tracker} -c {name=yql-agent;config={path=&lt;span class=\"hljs-string\"&gt;\"/usr/bin\"&lt;/span&gt;;count=1;artifacts_path=&lt;span class=\"hljs-string\"&gt;\"/usr/bin\"&lt;/span&gt;}}\n/mnt/rosetta /primary/bin/ytserver-http-proxy --pdeathsig 9 --config /primary/configs/http-proxy-0.yson --pdeathsig 15 --setsid\n/mnt/rosetta /primary/bin/ytserver-master --pdeathsig 9 --config /primary/configs/master-0-0.yson --pdeathsig 15 --setsid\n/mnt/rosetta /primary/bin/ytserver-queue-agent --pdeathsig 9 --config /primary/configs/queue_agent-0.yson --pdeathsig 15 --setsid\n/mnt/rosetta /primary/bin/ytserver-node --pdeathsig 9 --config /primary/configs/node-0.yson --pdeathsig 15 --setsid\n/mnt/rosetta /primary/bin/ytserver-scheduler --pdeathsig 9 --config /primary/configs/scheduler-0.yson --pdeathsig 15 --setsid\n/mnt/rosetta /primary/bin/ytserver-controller-agent --pdeathsig 9 --config /primary/configs/controller_agent-0.yson --pdeathsig 15 --setsid\n/mnt/rosetta /primary/bin/ytserver-query-tracker --pdeathsig 9 --config /primary/configs/query_tracker-0.yson --pdeathsig 15 --setsid\n/mnt/rosetta /usr/bin/ytserver-yql-agent --pdeathsig 9 --config /primary/configs/yql_agent-0.yson --pdeathsig 15 --setsid\n/mnt/rosetta /usr/bin/grep --color=auto ytserver\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"130\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-130\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-130\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-130.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Как видно, запустились компоненты:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"admin-guide/components#master\"&gt;Мастер-сервер&lt;/a&gt; — отвечает за отказоустойчивое хранение метаданных кластера. К этим данным относится информация о пользователях системы, о хранимых объектах и о местоположении самих данных.&lt;/li&gt;\n&lt;li&gt;Нода — объединяет в себе функциональность &lt;a href=\"admin-guide/components.html#data-nodes\"&gt;Data-ноды&lt;/a&gt; и &lt;a href=\"admin-guide/components.html#exec-nodes\"&gt;Exec-ноды&lt;/a&gt;. Отвечает за хранение данных, за работу динамических таблиц и занимается исполнением джобов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"admin-guide/components.html#planirovshik\"&gt;Планировщик&lt;/a&gt; (шедулер) — отвечает за планирование процесса обработки данных (Map, Reduce и так далее).&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"admin-guide/components.html#planirovshik\"&gt;Контроллер-агент&lt;/a&gt; — отвечает за планирование джобов конкретных операций.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"admin-guide/components.html#proxy\"&gt;HTTP-прокси&lt;/a&gt; — сервер, через который осуществляется общение с внешним миром.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"admin-guide/components.html#yql-agent\"&gt;YQL-агент&lt;/a&gt; — движок исполнения SQL подобных запросов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/dynamic-tables/queues.html\"&gt;Очередь YTsaurus&lt;/a&gt; — упорядоченные динамические таблицы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/query-tracker/about.html\"&gt;Query Tracker&lt;/a&gt; — компонент для запуска запросов на разных SQL диалектах (YQL, QT, CHYT, SPYT).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Готово! Теперь YTsaurus поднят и готов к использованию. Можно переходить к следующему шагу. После того как вы закончите работу с примерами, не забудьте &lt;a href=\"ru/overview/try-yt.html#stop-cluster\"&gt;удалить&lt;/a&gt; кластер.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;/div&gt;\n&lt;div id=\"djgutysb\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"Minikube\"&gt;\n&lt;p&gt;В этом примере вы локально развернёте кластер Kubernetes, состоящий из одного узла, и в нём запустите YTsaurus кластер. В качестве движка исполнения контейнеров будет использоваться Docker.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Требования по ресурсам&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Чтобы успешно развернуть YTsaurus в кластере Kubernetes, на хостовой машине должно быть:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;от 4-х ядер CPU;&lt;/li&gt;\n&lt;li&gt;от 8 ГБ оперативной памяти;&lt;/li&gt;\n&lt;li&gt;от 30 ГБ дискового пространства.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для установки YTsaurus в Minikube выполните шаги:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"ru/overview/try-yt.html#setup\"&gt;Подготовьте окружение&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/overview/try-yt.html#k8s-start\"&gt;Поднимите кластер Kubernetes&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/overview/try-yt.html#cert-manager-apply\"&gt;Установите cert-manager&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/overview/try-yt.html#operator-install\"&gt;Установите YTsaurus оператор&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/overview/try-yt.html#yt-start\"&gt;Запустите кластер YTsaurus&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/overview/try-yt.html#set-url\"&gt;Проверьте сетевые доступы&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Более детально процесс установки рассмотрен в &lt;a href=\"https://www.youtube.com/watch?v=LTKtY5okG4c\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;вебинаре&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;/p&gt;\n&lt;h4 id=\"setup\"&gt;&lt;a href=\"ru/overview/try-yt.html#setup\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. Подготовьте окружение&lt;/span&gt;&lt;/a&gt;1. Подготовьте окружение&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;Установите Docker:\n&lt;ul&gt;\n&lt;li&gt;Если у вас Linux — установите &lt;a href=\"https://docs.docker.com/engine/install/ubuntu/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docker Engine&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;Если у вас Mac — установите &lt;a href=\"https://docs.docker.com/desktop/setup/install/mac-install/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docker Desktop&lt;/a&gt; либо &lt;a href=\"https://podman.io/docs/installation\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Podman&lt;/a&gt; в качестве альтернативы. Убедитесь, что у вас установлена и включена Rosetta 2.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Установите &lt;a href=\"https://kubernetes.io/ru/docs/tasks/tools/install-kubectl/#%D1%83%D1%81%D1%82%D0%B0%D0%BD%D0%BE%D0%B2%D0%BA%D0%B0-kubectl-%D0%B2-linux\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;kubectl&lt;/a&gt; — утилита для управления кластером Kubernetes.&lt;/li&gt;\n&lt;li&gt;Установите &lt;a href=\"https://kubernetes.io/ru/docs/tasks/tools/install-minikube/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Minikube&lt;/a&gt; — утилита, позволяющая запустить простой кластер Kubernetes на локальном компьютере.&lt;/li&gt;\n&lt;li&gt;Установите &lt;a href=\"https://helm.sh/docs/intro/install/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Helm&lt;/a&gt; — пакетный менеджер для установки компонент YTsaurus в Kubernetes.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"k8s-start\"&gt;&lt;a href=\"ru/overview/try-yt.html#k8s-start\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Поднимите кластер Kubernetes&lt;/span&gt;&lt;/a&gt;2. Поднимите кластер Kubernetes&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ minikube start  --cpus=6 --memory=8192 --driver=docker\n\n&lt;span class=\"hljs-comment\"&gt;# Если вы используете Podman&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# minikube start --cpus=6 --memory=8192 --driver=podman&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"300\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-300\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-300\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-300.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Когда кластер Kubernetes будет поднят, должна успешно выполняться команда:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl cluster-info\nKubernetes control plane is running at https://127.0.0.1:36399\nCoreDNS is running at https://127.0.0.1:36399/api/v1/namespaces/kube-system/services/kube-dns:dns/proxy\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"304\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-304\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-304\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-304.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"cert-manager-apply\"&gt;&lt;a href=\"ru/overview/try-yt.html#cert-manager-apply\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Установите cert-manager&lt;/span&gt;&lt;/a&gt;3. Установите cert-manager&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.17.1/cert-manager.yaml\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"308\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-308\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-308\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-308.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Дождитесь, когда под &lt;code&gt;cert-manager-webhook&lt;/code&gt; будет находиться в состоянии &lt;code&gt;Running&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$ kubectl get pods -A\nNAMESPACE        NAME                                        READY   STATUS      RESTARTS   AGE\ncert-manager     cert-manager-7b5cdf866f-5lfth               1/1     Running     0          2m12s\ncert-manager     cert-manager-cainjector-7c9788477c-xdp8l    1/1     Running     0          2m12s\ncert-manager     cert-manager-webhook-764949f558-dldzp       1/1     Running     0          2m12s\nkube-system      coredns-668d6bf9bc-774xg                    1/1     Running     0          2m57s\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"312\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-312\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-312\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-312.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"operator-install\"&gt;&lt;a href=\"ru/overview/try-yt.html#operator-install\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Установите YTsaurus оператор&lt;/span&gt;&lt;/a&gt;4. Установите YTsaurus оператор&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"https://github.com/ytsaurus/ytsaurus-k8s-operator\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;YTsaurus оператор&lt;/a&gt; — это программа, которая управляет исполнением YTsaurus в Kubernetes кластере. Оператор следит за тем, чтобы все компоненты YTsaurus были запущены и работали корректно.&lt;/p&gt;\n&lt;p&gt;Установите чарт:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;helm install ytsaurus oci://ghcr.io/ytsaurus/ytop-chart --version 0.20.0\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"322\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-322\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-322\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-322.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Если возникла ошибка 'Internal error occurred: failed calling webhook \"webhook.cert-manager.io\"'&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Проверьте, какой статус у пода &lt;code&gt;cert-manager-webhook&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$ kubectl get pods -A\nNAMESPACE       NAME                                      READY   STATUS               RESTARTS   AGE\ncert-manager    cert-manager-7b5cdf866f-5lfth             1/1     ContainerCreating    0          2m12s\ncert-manager    cert-manager-cainjector-7c9788477c-xdp8l  1/1     ContainerCreating    0          2m12s\ncert-manager    cert-manager-webhook-764949f558-dldzp     1/1     ContainerCreating    0          2m12s\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"331\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-331\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-331\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-331.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если под находится в состоянии &lt;code&gt;ContainerCreating&lt;/code&gt;, дождитесь завершения его установки и попробуйте перезапустить команду &lt;code&gt;helm install ytsaurus oci://ghcr.io/ytsaurus/ytop-chart --version 0.20.0&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Если у пода состояние &lt;code&gt;ImagePullBackOff&lt;/code&gt;, это означает, что система не может скачать необходимые образы. Скорее всего, это связано с сетевыми настройками внутри Minikube. Возможные решения проблемы описаны &lt;a href=\"https://cert-manager.io/docs/troubleshooting/webhook/#error-connect-connection-refused\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;тут&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Дождитесь, когда оператор будет находиться в статусе &lt;code&gt;Running&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl get pod\nNAME                                                      READY   STATUS     RESTARTS   AGE\nytsaurus-ytop-chart-controller-manager-5765c5f995-dntph   2/2     Running    0          7m57s\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"343\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-343\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-343\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-343.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"yt-start\"&gt;&lt;a href=\"ru/overview/try-yt.html#yt-start\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Запустите YTsaurus кластер&lt;/span&gt;&lt;/a&gt;5. Запустите YTsaurus кластер&lt;/h4&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;curl -s https://raw.githubusercontent.com/ytsaurus/ytsaurus/refs/heads/main/yt/docs/code-examples/cluster-config/cluster_v1_local.yaml &amp;gt; cluster_v1_local.yaml\nkubectl apply -f cluster_v1_local.yaml\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"347\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-347\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-347\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-347.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Обычно запуск YTsaurus кластера занимает несколько минут. Если всё прошло успешно, список запущенных подов будет выглядеть следующим образом:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl get pod\nNAME                                                      READY   STATUS              RESTARTS   AGE\nca-0                                                      1/1     Running     0          8m43s\ndnd-0                                                     1/1     Running     0          8m44s\ndnd-1                                                     1/1     Running     0          8m44s\ndnd-2                                                     1/1     Running     0          8m44s\nds-0                                                      1/1     Running     0          11m\nend-0                                                     1/1     Running     0          8m43s\nhp-0                                                      1/1     Running     0          8m44s\nhp-control-0                                              1/1     Running     0          8m44s\nms-0                                                      1/1     Running     0          11m\nrp-0                                                      1/1     Running     0          8m43s\nrp-heavy-0                                                1/1     Running     0          8m43s\nsch-0                                                     1/1     Running     0          8m39s\nstrawberry-controller-679786577b-4p5kz                    1/1     Running     0          7m17s\nyt-client-init-job-user-ljfqf                             1/1     Running     0          8m39s\nyt-master-init-job-default-hdnfm                          1/1     Running     0          9m23s\nyt-master-init-job-enablerealchunks-575hk                 1/1     Running     0          8m50s\nyt-strawberry-controller-init-job-cluster-l5gns           1/1     Running     0          8m17s\nyt-strawberry-controller-init-job-user-nn9lk              1/1     Running     0          8m34s\nyt-ui-init-job-default-6w5zv                              1/1     Running     0          8m43s\nytsaurus-ui-deployment-7b469d5cc8-596sf                   1/1     Running     0          8m35s\nytsaurus-ytop-chart-controller-manager-859b7bbddf-jc5sv   2/2     Running     0          14m\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"351\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-351\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-351\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-351.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Если поды зависают в статусе &lt;code&gt;Pending&lt;/code&gt;&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Скорее всего, это связано с нехваткой ресурсов. Удалите Minikube кластер и попробуйте создать его заново, увеличив число ресурсов при запуске.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ kubectl delete -f cluster_v1_local.yaml\n$ minikube delete\n$ minikube start --cpus=8 --memory=10000 --driver=docker\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"360\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-360\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-360\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-360.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если указанные ресурсы превышают лимит, который установлен в конфигурациях Podman, увеличьте этот лимит в разделе настроек.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/try-yt-podman-settings.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"set-url\"&gt;&lt;a href=\"ru/overview/try-yt.html#set-url\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6. Проверьте сетевые доступы&lt;/span&gt;&lt;/a&gt;6. Проверьте сетевые доступы&lt;/h4&gt;\n&lt;p&gt;Чтобы посмотреть, по какому адресу будет доступен кластер YTsaurus, запустите команды:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Сетевой доступ до веб-интерфейса&lt;/span&gt;\n$ minikube service ytsaurus-ui --url\nhttp://192.168.49.2:30539\n\n&lt;span class=\"hljs-comment\"&gt;# Сетевой доступ до прокси&lt;/span&gt;\n$ minikube service http-proxies-lb --url\nhttp://192.168.49.2:30228\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"375\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-375\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-375\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-375.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;По первой ссылке доступен веб-интерфейс. Для входа используйте:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Login: admin\nPassword: password\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"379\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-379\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-379\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-379.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Как получить доступ к веб-интерфейсу, если кластер развёрнут на удалённом хосте&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;На удалённом хосте запустите команду:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ minikube service http-proxies-lb --url\n&amp;lt;HOST&amp;gt;:&amp;lt;PORT&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"390\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-390\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-390\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-390.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Значения &lt;code&gt;&amp;lt;HOST&amp;gt;&lt;/code&gt; и &lt;code&gt;&amp;lt;PORT&amp;gt;&lt;/code&gt; вам понадобятся на следующем шаге.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;На локальном хосте запустите новую сессию терминала и выполните:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;ssh -fnNT -L 127.0.0.1:8080:&amp;lt;HOST&amp;gt;:&amp;lt;PORT&amp;gt; &amp;lt;VM&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"399\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-399\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-399\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-399.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Веб-интерфейс будет доступен по адресу &lt;a href=\"http://127.0.0.1:8080\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;127.0.0.1:8080&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;По второй ссылке вы будете подключаться к кластеру из командной строки. Подробнее будет рассказано ниже, в разделе с примерами.&lt;/p&gt;\n&lt;h4 id=\"gotovo\"&gt;&lt;a href=\"ru/overview/try-yt.html#gotovo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Готово!&lt;/span&gt;&lt;/a&gt;Готово!&lt;/h4&gt;\n&lt;p&gt;Теперь YTsaurus поднят и готов к использованию — можно переходить к следующему шагу. После того как вы закончите работу с примерами, не забудьте &lt;a href=\"ru/overview/try-yt.html#stop-cluster\"&gt;удалить&lt;/a&gt; кластер.&lt;/p&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;h2 id=\"install-cli\"&gt;&lt;a href=\"ru/overview/try-yt.html#install-cli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка YTsaurus CLI&lt;/span&gt;&lt;/a&gt;Установка YTsaurus CLI&lt;/h2&gt;\n&lt;p&gt;Самый удобный способ взаимодействия с системой YTsaurus — из консоли. Утилита &lt;a href=\"api/cli/cli.html\"&gt;YTsaurus СLI&lt;/a&gt; не устанавливается при развёртывании кластера, её нужно установить в системе отдельно.&lt;/p&gt;\n&lt;p&gt;Для начала установите менеджер пакетов pip3, если он у вас ещё не установлен:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;sudo&lt;/span&gt; apt update\n&lt;span class=\"hljs-built_in\"&gt;sudo&lt;/span&gt; apt install python3-pip\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"427\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-427\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-427\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-427.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Проверьте, что всё получилось:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ pip3 --version\npip 22.0.2 from ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"431\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-431\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-431\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-431.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Установите утилиту &lt;code&gt;ytsaurus-client&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;pip3 install --user ytsaurus-client\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"435\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-435\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-435\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-435.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Добавьте путь до &lt;code&gt;$HOME/.local/bin&lt;/code&gt; в переменную &lt;code&gt;PATH&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; PATH=&lt;span class=\"hljs-string\"&gt;\"&lt;span class=\"hljs-variable\"&gt;$PATH&lt;/span&gt;:&lt;span class=\"hljs-variable\"&gt;$HOME&lt;/span&gt;/.local/bin\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"439\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-439\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-439\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-439.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Как сохранить это изменение после перезагрузки системы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'export PATH=\"$PATH:$HOME/.local/bin\"'&lt;/span&gt; &amp;gt;&amp;gt; ~/.bashrc &lt;span class=\"hljs-comment\"&gt;# Команда добавит строку в конец файла ~/.bashrc&lt;/span&gt;\n&lt;span class=\"hljs-built_in\"&gt;source&lt;/span&gt; ~/.bashrc  &lt;span class=\"hljs-comment\"&gt;# Применить изменения сейчас&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"445\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-445\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-445\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-445.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Проверьте, что установка YTsaurus СLI прошла успешно:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt --version\nVersion: YT wrapper 0.13.20\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"451\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-451\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-451\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-451.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Подробнее про работу с CLI можно посмотреть в &lt;a href=\"https://youtu.be/LTKtY5okG4c?t=1456\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ознакомительном вебинаре&lt;/a&gt; (начиная с 24:30).&lt;/p&gt;\n&lt;h2 id=\"launch-example\"&gt;&lt;a href=\"ru/overview/try-yt.html#launch-example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выполнение примеров&lt;/span&gt;&lt;/a&gt;Выполнение примеров&lt;/h2&gt;\n&lt;p&gt;В данной инструкции вы создадите таблицу, запишете в неё данные и выполните простой SELECT запрос. В конце раздела приведён более сложный &lt;a href=\"ru/overview/try-yt.html#mr\"&gt;пример&lt;/a&gt; — запуск MapReduce операции.&lt;/p&gt;\n&lt;h3 id=\"set-vars\"&gt;&lt;a href=\"ru/overview/try-yt.html#set-vars\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установите переменные окружения&lt;/span&gt;&lt;/a&gt;Установите переменные окружения&lt;/h3&gt;\n&lt;p&gt;Это понадобится в следующих примерах, для доступа к кластеру через CLI.&lt;/p&gt;\n&lt;div class=\"yfm-tabs yfm-tabs-dropdown\" data-diplodoc-group=\"defaultTabsGroup-d36ng8bb\" data-diplodoc-variant=\"dropdown\"&gt;\n&lt;div role=\"tablist\" class=\"yfm-tabs-dropdown-select filled\"&gt;Docker&lt;/div&gt;\n&lt;ul class=\"yfm-tabs-dropdown-menu\"&gt;&lt;li class=\"yfm-tab active\" data-diplodoc-id=\"docker-2\" data-diplodoc-key=\"docker\" selected&gt;Docker&lt;/li&gt;&lt;li class=\"yfm-tab\" data-diplodoc-id=\"minikube-2\" data-diplodoc-key=\"minikube\"&gt;Minikube&lt;/li&gt;&lt;/ul&gt;&lt;div id=\"x9r6r8ph\" class=\"yfm-tab-panel active\" role=\"tabpanel\" data-title=\"Docker\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_PROXY=localhost:8000\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"480\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-480\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-480\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-480.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"lqf5py2c\" class=\"yfm-tab-panel\" role=\"tabpanel\" data-title=\"Minikube\"&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_PROXY=`minikube service http-proxies-lb --url`\n&lt;span class=\"hljs-comment\"&gt;# Отключить автоматическое обнаружение прокси-сервера YTsaurus&lt;/span&gt;\n&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_CONFIG_PATCHES=&lt;span class=\"hljs-string\"&gt;'{proxy={enable_proxy_discovery=%false}}'&lt;/span&gt;\n&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_TOKEN=password\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"483\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-483\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-483\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-483.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Здесь токен задаётся в переменной окружения — это сделано намеренно, для простоты и наглядности примера. В реальных задачах так делать не стоит, для работы с токенами в YTsaurus есть специальные команды. Подробнее читайте в разделе &lt;a href=\"user-guide/storage/auth.html#upravlenie-tokenami\"&gt;Аутентификация&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;\n&lt;/div&gt;\n&lt;h3 id=\"create-table\"&gt;&lt;a href=\"ru/overview/try-yt.html#create-table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создайте таблицу&lt;/span&gt;&lt;/a&gt;Создайте таблицу&lt;/h3&gt;\n&lt;p&gt;В YTsaurus все данные хранятся в &lt;a href=\"user-guide/storage/static-tables.html\"&gt;таблицах&lt;/a&gt;. Поэтому для начала создайте таблицу:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt create table //home/input_table --attributes &lt;span class=\"hljs-string\"&gt;'{schema = [{name = id; type = int64}; {name = text; type = string}]}'&lt;/span&gt;\n&amp;gt; 16-64ca-10191-47007b7d\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"502\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-502\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-502\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-502.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Значение &lt;code&gt;16-64ca-10191-47007b7d&lt;/code&gt; — это идентификатор созданного узла &lt;i class=\"yfm yfm-term_title\" term-key=\":about-cypress\" role=\"button\" aria-describedby=\":about-cypress_element\" tabindex=\"0\" id=\"dnd9nai7\"&gt;Кипариса&lt;/i&gt;. Идентификаторы узлов полезны при работе с &lt;a href=\"user-guide/storage/transactions.html\"&gt;транзакциями&lt;/a&gt; в YTsaurus. В рамках текущего примера данные идентификаторы вам не понадобятся.&lt;/p&gt;\n&lt;p&gt;Посмотреть на созданную таблицу можно в веб-интерфейсе. Откройте в браузере адрес, который вы получили при запуске кластера, перейдите на вкладку &lt;strong&gt;Navigation&lt;/strong&gt; и кликните на созданную таблицу:&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/try-yt-new-table.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;h3 id=\"insert-data\"&gt;&lt;a href=\"ru/overview/try-yt.html#insert-data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запишите данные&lt;/span&gt;&lt;/a&gt;Запишите данные&lt;/h3&gt;\n&lt;p&gt;Теперь запишите данные в таблицу, вызвав команду &lt;a href=\"api/cli/commands.html#write-table\"&gt;write-table&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'{ \"id\": 0, \"text\": \"Hello\" } { \"id\": 1, \"text\": \"World!\" }'&lt;/span&gt; | yt write-table //home/input_table --format json\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"518\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-518\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-518\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-518.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"get-result\"&gt;&lt;a href=\"ru/overview/try-yt.html#get-result\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Прочитайте результат&lt;/span&gt;&lt;/a&gt;Прочитайте результат&lt;/h3&gt;\n&lt;p&gt;Чтобы убедиться, что данные записались в таблицу, выполните команду:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt read-table //home/input_table --format json\n{&lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt;:0,&lt;span class=\"hljs-string\"&gt;\"text\"&lt;/span&gt;:&lt;span class=\"hljs-string\"&gt;\"Hello\"&lt;/span&gt;}\n{&lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt;:1,&lt;span class=\"hljs-string\"&gt;\"text\"&lt;/span&gt;:&lt;span class=\"hljs-string\"&gt;\"World!\"&lt;/span&gt;}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"525\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-525\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-525\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-525.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Другой способ прочитать таблицу — выполнить &lt;a href=\"yql/syntax/select/index.html\"&gt;SELECT&lt;/a&gt; запрос в веб-интерфейсе. Для этого перейдите во вкладку &lt;strong&gt;Queries&lt;/strong&gt; и введите запрос:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;home&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;input_table`;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"529\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-529\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-529\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-529.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;img src=\"images/try-yt-hello-world-select.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Всплывает ошибка 'Attribute \"cluster_name\" is not found'&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Если вы поднимали YTsaurus кластер через Docker, проделайте шаги:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;В веб-интерфейсе перейдите на вкладку &lt;strong&gt;Queries&lt;/strong&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Нажмите иконку настроек — она находится справа в верхней части страницы. Удалите текущий &lt;strong&gt;Settings&lt;/strong&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Нажмите кнопку &lt;strong&gt;Add setting&lt;/strong&gt; и в полях укажите значения: \"cluster\" и \"primary\" соответственно. Нажмите галочку.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/try-yt-fix-ui-cluster.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Если вы поднимали YTsaurus кластер через Minikube — пожалуйста, сообщите нам об этой ошибке в &lt;a href=\"https://t.me/ytsaurus_ru\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;community-чате&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h3 id=\"mr\"&gt;&lt;a href=\"ru/overview/try-yt.html#mr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Продвинутый пример: запуск MapReduce&lt;/span&gt;&lt;/a&gt;Продвинутый пример: запуск MapReduce&lt;/h3&gt;\n&lt;p&gt;В этом разделе показано, как запустить MapReduce операцию — на примере задачи &lt;a href=\"https://en.wikipedia.org/wiki/Word_count\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Word Count&lt;/a&gt;.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"ru/overview/try-yt.html#mr-prepare-data\"&gt;Подготовьте данные&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/overview/try-yt.html#mr-create-table\"&gt;Создайте таблицу и запишите в неё данные&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/overview/try-yt.html#mr-run\"&gt;Запустите MapReduce&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/overview/try-yt.html#mr-get-result\"&gt;Прочитайте результат&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Как выполняется MapReduce&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;В случае с задачей Word Count, схема выполнения MapReduce будет выглядеть так:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Исходный текст разбивается на строки, и каждая строка записывается в таблицу в виде отдельной записи.&lt;/li&gt;\n&lt;li&gt;Для каждой записи выполняется Map операция — она будет выдавать для каждого слова пару колонок &lt;code&gt;(&amp;lt;слово&amp;gt;, 1)&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Результат из предыдущего шага сортируется по первой колонке.&lt;/li&gt;\n&lt;li&gt;По первой колонке выполняется Reduce операция, суммирующая вторую колонку. На выходе получается набор пар &lt;code&gt;(&amp;lt;слово&amp;gt;, &amp;lt;количество упоминаний слова&amp;gt;)&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"mr-prepare-data\"&gt;&lt;a href=\"ru/overview/try-yt.html#mr-prepare-data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. Подготовьте данные&lt;/span&gt;&lt;/a&gt;1. Подготовьте данные&lt;/h4&gt;\n&lt;p&gt;Скачайте &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/yt/docs/code-examples/source/moem.txt\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;исходный текст&lt;/a&gt; и преобразуйте его в tab-separated формат:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;curl -s https://raw.githubusercontent.com/ytsaurus/ytsaurus/refs/heads/main/yt/docs/code-examples/source/moem.txt &amp;gt; source.txt\nawk &lt;span class=\"hljs-string\"&gt;'{gsub(/\\t/, \"\\\\t\"); print \"lineno=\"NR\"\\ttext=\"$0}'&lt;/span&gt; source.txt &amp;gt; source.tsv\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"632\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-632\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-632\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-632.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Про tab-separated формат&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;ul&gt;\n&lt;li&gt;Строки таблицы отделяются друг от друга переводом строки &lt;code&gt;\\n&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Колонки отделяются друг от друга табуляцией &lt;code&gt;\\t&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;Имя колонки и содержимое колонки отделяются друг от друга знаком &lt;code&gt;=&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;К примеру, строка: &lt;code&gt;lineno=1\\tsize=6\\tvalue=foobar&lt;/code&gt; описывает строку с колонками &lt;code&gt;lineno&lt;/code&gt;, &lt;code&gt;size&lt;/code&gt; и &lt;code&gt;value&lt;/code&gt; со значениями &lt;code&gt;1&lt;/code&gt;, &lt;code&gt;6&lt;/code&gt; и &lt;code&gt;foobar&lt;/code&gt; соответственно. Символы табуляции экранируются.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Подготовьте исходник программы, которая будет выполнять MapReduce операцию. Скачайте &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/yt/docs/code-examples/python/word-count.py\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;скрипт&lt;/a&gt; — он написан на Python 3 — и сохраните его локально:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;curl -s https://raw.githubusercontent.com/ytsaurus/ytsaurus/refs/heads/main/yt/docs/code-examples/python/word-count.py &amp;gt; word-count.py\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"663\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-663\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-663\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-663.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"mr-create-table\"&gt;&lt;a href=\"ru/overview/try-yt.html#mr-create-table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Создайте таблицу&lt;/span&gt;&lt;/a&gt;2. Создайте таблицу&lt;/h4&gt;\n&lt;p&gt;Создайте две таблицы — одну для исходных данных, а вторую для результатов выполнения MapReduce:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt create table //home/mapreduce_input --attributes &lt;span class=\"hljs-string\"&gt;'{schema = [{name = lineno; type = string}; {name = text; type = string}]}'&lt;/span&gt;\nyt create table //home/mapreduce_result --attributes &lt;span class=\"hljs-string\"&gt;'{schema = [{name = count; type = string}; {name = word; type = string}]}'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"670\"&gt;\n                &lt;path fill=\"current
