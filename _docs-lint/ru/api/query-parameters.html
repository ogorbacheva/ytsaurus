            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе собрана информация о дополнительных параметрах запросов. Подробнее о командах читайте в разделе &lt;a href=\"api/commands.html\"&gt;Команды&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"conditions\"&gt;&lt;a href=\"ru/api/query-parameters.html#conditions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Предварительные условия&lt;/span&gt;&lt;/a&gt;Предварительные условия&lt;/h2&gt;\n&lt;p&gt;Ниже представлен список команд, для которых можно указать условия успешного выполнения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;set&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;remove&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;create&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;lock&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;copy&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;move&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;link&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Условия бывают двух видов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;prerequisite_revisions&lt;/code&gt; — набор указаний вида &lt;code&gt;path&lt;/code&gt;, &lt;code&gt;transaction_id&lt;/code&gt;, &lt;code&gt;revision&lt;/code&gt;. Запрос будет выполнен, только если все указанные пути с учетом заданных транзакций существуют, а ревизии соответствуют указанным;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;prerequisite_transactions&lt;/code&gt; — список &lt;a href=\"user-guide/storage/transactions.html\"&gt;транзакций&lt;/a&gt;, которые обязаны существовать на момент выполнения запроса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;revision = client.get(&lt;span class=\"hljs-string\"&gt;\"//tmp/my_table/@revision\"&lt;/span&gt;)\n&lt;span class=\"hljs-comment\"&gt;#... some calculations ...&lt;/span&gt;\nrevision_parameter = yt.create_revision_parameter(path=&lt;span class=\"hljs-string\"&gt;\"//tmp/my_table\"&lt;/span&gt;, revision=revision)\nrevision_client = yt.create_client_with_command_params(prerequisite_revisions=[revision_parameter])\nrevision_client.move(&lt;span class=\"hljs-string\"&gt;\"//tmp/transformed_table\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//tmp/my_table\"&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"64\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-64\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-64\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-64.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"data-source\"&gt;&lt;a href=\"ru/api/query-parameters.html#data-source\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник данных для чтения&lt;/span&gt;&lt;/a&gt;Источник данных для чтения&lt;/h2&gt;\n&lt;p&gt;В &lt;a href=\"api/commands.html#concepts\"&gt;немутирующих&lt;/a&gt; запросах к &lt;a href=\"user-guide/storage/cypress.html\"&gt;Кипарису&lt;/a&gt; можно указать источник данных для чтения при помощи параметра &lt;code&gt;read_from&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Популярным значением параметра &lt;code&gt;read_from&lt;/code&gt; является &lt;code&gt;cache&lt;/code&gt;.  В таком случае чтение ответа будет происходить из кеша (который обычно расположен на выделенных машинах кластера), что позволяет снизить нагрузку на мастер-сервер. Это важно при выполнении большого количества тяжелых запросов к Кипарису, например когда необходимо обойти большое поддерево.&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; obj &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; client.search(&lt;span class=\"hljs-string\"&gt;\"//tmp/my_table\"&lt;/span&gt;, read_from=&lt;span class=\"hljs-string\"&gt;\"cache\"&lt;/span&gt;):\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"abc\"&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;str&lt;/span&gt;(obj):\n        ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"77\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-77\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-77\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-77.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"drugie-nastrojki-keshirovaniya\"&gt;&lt;a href=\"ru/api/query-parameters.html#drugie-nastrojki-keshirovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Другие настройки кеширования&lt;/span&gt;&lt;/a&gt;Другие настройки кеширования&lt;/h2&gt;\n&lt;p&gt;При использовании описанного выше параметра &lt;code&gt;read_from&lt;/code&gt; со значением &lt;code&gt;cache&lt;/code&gt; есть возможность управлять некоторыми аспектами кеширования.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;pre&gt;&lt;code&gt;Без веской необходимости и рекомендации администраторов не следует использовать эти параметры. Неправильно подобранные значения могут оказать негативное влияние как на пользователя, инициирующего запросы, так и на других пользователей и даже привести к деградации всего сервиса.\n&lt;/code&gt;&lt;/pre&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;disable_per_user_cache&lt;/code&gt; — исключить имя пользователя из ключа кеширования;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;expire_after_successful_update_time&lt;/code&gt; — время жизни записи в кеше после того, как она была создана (или обновлена) в результате успешного исполнения запроса;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;expire_after_failed_update_time&lt;/code&gt; — время жизни записи в кеше после того, как она была создана (или обновлена) в результате неуспешного исполнения запроса (например, после попытки чтения несуществующего узла);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;cache_sticky_group_size&lt;/code&gt; — количество машин, среди которых случайным образом будет выбрана та, на которую будет отправлен запрос; параметр позволяет балансировать нагрузку между несколькими кешами;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;success_staleness_bound&lt;/code&gt; — если не ноль, кешу разрешается возвращать успешные ответы, устаревшие не более чем на указанное время; параметр позволяет получать ответы из кеша, не блокируясь на его обновлении.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/api/query-parameters.md","sourcePath":"ru/api/query-parameters.md"},"headings":[{"title":"Предварительные условия","href":"ru/api/query-parameters.html#conditions","level":2},{"title":"Источник данных для чтения","href":"ru/api/query-parameters.html#data-source","level":2},{"title":"Другие настройки кеширования","href":"ru/api/query-parameters.html#drugie-nastrojki-keshirovaniya","level":2}],"title":"Параметры запросов"},"router":{"pathname":"ru/api/query-parameters","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
