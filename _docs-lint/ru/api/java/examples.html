            {"data":{"leading":false,"html":"&lt;p&gt;Java API опубликовано в &lt;a href=\"https://central.sonatype.com/artifact/tech.ytsaurus/ytsaurus-client/1.0.1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;maven&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Документацию можно найти &lt;a href=\"https://java.ytsaurus.tech\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;здесь&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Примеры находятся в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/java/ytsaurus-client-examples\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/java/ytsaurus-client-examples&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Перед использованием примеров прочитайте &lt;a href=\"user-guide/storage/auth.html\"&gt;инструкцию по получению токена&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Нужно иметь специальные таблицы с данными на вашем YTsaurus кластере, их можно сгенерировать так:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;./yt/yt/scripts/upload_tutorial_data/upload_tutorial_data.py --yt-directory //home/dev/tutorial --proxy &amp;lt;your-http-proxy&amp;gt; \n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"15\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-15\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-15\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-15.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Примеры можно запускать с помощью gradle из директории примера:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;cd&lt;/span&gt; yt/java/ytsaurus-client-examples/&amp;lt;some-example&amp;gt;\nYT_PROXY=&amp;lt;your-http-proxy&amp;gt; gradle run\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"19\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-19\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-19\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-19.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"rabota-s-kiparisom\"&gt;&lt;a href=\"ru/api/java/examples.html#rabota-s-kiparisom\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с Кипарисом&lt;/span&gt;&lt;/a&gt;Работа с Кипарисом&lt;/h3&gt;\n&lt;p&gt;Пример находится в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/yt/java/ytsaurus-client-examples/cypress-operations-example/src/main/java/tech/ytsaurus/example/ExampleCypressOperations.java\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/java/ytsaurus-client-examples/cypress-operations-example/src/main/java/tech/ytsaurus/example/ExampleCypressOperations.java&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'java'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"chtenie-i-zapis-staticheskih-tablic-userclass-versiya\"&gt;&lt;a href=\"ru/api/java/examples.html#chtenie-i-zapis-staticheskih-tablic-userclass-versiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чтение и запись статических таблиц (UserClass версия)&lt;/span&gt;&lt;/a&gt;Чтение и запись статических таблиц (UserClass версия)&lt;/h3&gt;\n&lt;p&gt;Пример находится в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/yt/java/ytsaurus-client-examples/read-write-entity-example/src/main/java/tech/ytsaurus/example/ExampleReadWriteEntity.java\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/java/ytsaurus-client-examples/read-write-entity-example/src/main/java/tech/ytsaurus/example/ExampleReadWriteEntity.java&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'java'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"chtenie-i-zapis-staticheskih-tablic-ytreemapnode-versiya\"&gt;&lt;a href=\"ru/api/java/examples.html#chtenie-i-zapis-staticheskih-tablic-ytreemapnode-versiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чтение и запись статических таблиц (YTreeMapNode версия)&lt;/span&gt;&lt;/a&gt;Чтение и запись статических таблиц (YTreeMapNode версия)&lt;/h3&gt;\n&lt;p&gt;Пример находится в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/yt/java/ytsaurus-client-examples/read-write-ytree-example/src/main/java/tech/ytsaurus/example/ExampleReadWriteYTree.java\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/java/ytsaurus-client-examples/read-write-ytree-example/src/main/java/tech/ytsaurus/example/ExampleReadWriteYTree.java&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'java'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"rabota-s-dinamicheskimi-tab
