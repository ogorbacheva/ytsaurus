        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе собрана информация о командной строке YTsaurus: &lt;a href=\"ru/api/cli/cli.html#description\"&gt;описание&lt;/a&gt;, &lt;a href=\"api/cli/install.html\"&gt;способы установки&lt;/a&gt;, &lt;a href=\"api/cli/examples.html\"&gt;примеры использования&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"description\"&gt;&lt;a href=\"ru/api/cli/cli.html#description\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Описание&lt;/span&gt;&lt;/a&gt;Описание&lt;/h2&gt;\n&lt;p&gt;YTsaurus CLI (Command Line Interface) — самый удобный способ взаимодействия с системой YTsaurus из консоли. CLI реализует функциональность всех &lt;a href=\"api/commands.html\"&gt;команд&lt;/a&gt;, поддерживаемых YTsaurus. Имя команды задается первым аргументом, далее идут её опции. Для получения справки по CLI достаточно выполнить команду:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# посмотреть список всех команд&lt;/span&gt;\n$ yt --&lt;span class=\"hljs-built_in\"&gt;help&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# подробнее о конкретной команде — \"read\"&lt;/span&gt;\n$ yt &lt;span class=\"hljs-built_in\"&gt;read&lt;/span&gt; --&lt;span class=\"hljs-built_in\"&gt;help&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"9\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-9\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-9\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-9.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Для работы с кластером необходимо получить токен доступа и положить его в файл &lt;code&gt;~/.yt/token&lt;/code&gt; или в переменную окружения &lt;code&gt;YT_TOKEN&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Более подробно о токенах и аутентификации в разделе &lt;a href=\"user-guide/storage/auth.html\"&gt;Аутентификация&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Кроме токена доступа необходимо указать кластер, с которым будет происходить работа. Для этого можно указать имя прокси сервера в переменной окружения &lt;code&gt;YT_PROXY&lt;/code&gt;: &lt;code&gt;$ export YT_PROXY=&amp;lt;cluster-name&amp;gt;&lt;/code&gt; или передавать имя прокси сервера в каждую команду по отдельности через опцию &lt;code&gt;proxy&lt;/code&gt;, например: &lt;code&gt;$ yt read --proxy &amp;lt;cluster-name&amp;gt; //home/some_table&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Более подробно о возможных настройках в разделе &lt;a href=\"api/python/userdoc.html#configuration\"&gt;Конфигурация клиентской библиотеки&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Ниже перечислены некоторые особенности CLI:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Все подчеркивания в названиях команд и опций заменены на дефис, в отличие от названий методов и параметров API.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Параметры API &lt;code&gt;input_table_paths&lt;/code&gt; и &lt;code&gt;output_table_paths&lt;/code&gt; в CLI задаются через опции &lt;code&gt;--src&lt;/code&gt; и &lt;code&gt;--dst&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Для указания нескольких колонок для сортировки или reduce следует передать опцию &lt;code&gt;sort-by&lt;/code&gt; или &lt;code&gt;reduce-by&lt;/code&gt; несколько раз, например &lt;code&gt;--sort-by a --sort-by b&lt;/code&gt; выполнит сортировку по составному ключу &lt;code&gt;a b&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При написании &lt;code&gt;--sort-by a,b&lt;/code&gt; произойдет сортировка по одной колонке с именем &lt;code&gt;a,b&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Команды &lt;code&gt;write-table&lt;/code&gt; и &lt;code&gt;write-file&lt;/code&gt; обеспечивают транзакционность записи данных, в отличие от соответствующих команд в HTTP/RPС-прокси.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Команда &lt;code&gt;find&lt;/code&gt; реализована поверх команды &lt;code&gt;get&lt;/code&gt; и, отчасти, повторяет unix-утилиту find;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Команда &lt;code&gt;list&lt;/code&gt; по умолчанию (без указания параметра &lt;code&gt;--format&lt;/code&gt;) печатает просто список элементов узла, каждый на отдельной строке. Также у неё есть опция &lt;code&gt;-l&lt;/code&gt;, которая будет вместе с именами печатать полезную информацию об узлах.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Любые файлы, загружаемые в систему YTsaurus, по умолчанию загружаются без флага &lt;code&gt;executable&lt;/code&gt;. Если вы хотите загрузить бинарный файл, который будет запускаться в джобе, то нужно при загрузке указать опцию &lt;code&gt;--executable&lt;/code&gt; или после загрузки выставить у файла атрибут &lt;code&gt;executable&lt;/code&gt; в &lt;code&gt;%true&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;a href=\"user-guide/storage/formats.html\"&gt;Форматы данных&lt;/a&gt;, принимаемых на входе команд и возникающих на выходе, могут быть заданы через следующие переменные окружения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;YT_ARGUMENTS_FORMAT&lt;/code&gt; — описывает формат для значений некоторых опций CLI (например, &lt;code&gt;--spec&lt;/code&gt;, &lt;code&gt;--attributes&lt;/code&gt;). По умолчанию &lt;code&gt;yson&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;YT_STRUCTURED_DATA_FORMAT&lt;/code&gt; — управляет форматом ввода/вывода команд get/set. По умолчанию &lt;code&gt;yson&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;YT_TABULAR_DATA_FORMAT&lt;/code&gt; — управляет форматом чтения/записи таблиц, а также запуска джобов операций. Значения по умолчанию нет, необходимо описать формат в переменной либо указывать опцию &lt;code&gt;--format&lt;/code&gt; в соответствующих командах CLI.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Есть способ создавать алиасы для команд. Алиасы указываются в файле &lt;code&gt;~/.yt/aliases&lt;/code&gt; в формате &lt;code&gt;name=opts&lt;/code&gt;. Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;mkdir&lt;/span&gt;=create map_node\n&lt;span class=\"hljs-built_in\"&gt;ls&lt;/span&gt;=list\n&lt;span class=\"hljs-built_in\"&gt;rm&lt;/span&gt;=remove\n&lt;span class=\"hljs-built_in\"&gt;mv&lt;/span&gt;=move\n&lt;span class=\"hljs-built_in\"&gt;cp&lt;/span&gt;=copy\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"97\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-97\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-97\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-97.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Поддерживается auto-completion опций CLI и путей в Кипарисе.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/api/cli/cli.md","sourcePath":"ru/api/cli/cli.md"},"headings":[{"title":"Описание","href":"ru/api/cli/cli.html#description","level":2}],"title":"Работа из командной строки"},"router":{"pathname":"ru/api/cli/cli","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
