        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;CLI состоит из нескольких частей. Основная часть написана на Python и является платформонезависимой.&lt;br /&gt;\nДля использования &lt;a href=\"user-guide/storage/yson.html\"&gt;YSON&lt;/a&gt;-формата представления данных нужно установить так называемые YSON-bindings. Они представляют собой отдельную библиотеку, доступную только под Linux и Mac OS. Данная библиотека содержит внутри себя бинарный модуль, написанный на C++.&lt;/p&gt;\n&lt;p&gt;Узнать версию установленной CLI можно, вызвав команду &lt;code&gt;$ yt --version&lt;/code&gt;, это самый простой способ проверить работоспособность CLI.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При возникновении сложностей изучите раздел &lt;a href=\"faq/index.html\"&gt;FAQ&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"ustanovka-iz-pypi-repozitoriya\"&gt;&lt;a href=\"ru/api/cli/install.html#ustanovka-iz-pypi-repozitoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка из PyPI-репозитория&lt;/span&gt;&lt;/a&gt;Установка из PyPI-репозитория&lt;/h2&gt;\n&lt;p&gt;Пакет называется &lt;code&gt;ytsaurus-client&lt;/code&gt;. Перед установкой пакета можно поставить пакет &lt;code&gt;wheel&lt;/code&gt;, чтобы иметь возможность поставить версию, отличную от системной, или YTsaurus CLI без sudo.&lt;/p&gt;\n&lt;p&gt;По умолчанию из PyPI устанавливается последняя стабильная версия пакета.&lt;br /&gt;\nВсе тестовые версии имеют суффикс &lt;code&gt;a1&lt;/code&gt; и могут быть установлены через pip путем добавления опции &lt;code&gt;--pre&lt;/code&gt;.&lt;br /&gt;\nКоманда для установки из pypi:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Установка YTsaurus CLI&lt;/span&gt;\n$ pip install ytsaurus-client\n&lt;span class=\"hljs-comment\"&gt;# Установка YSON-bindings&lt;/span&gt;\n$ pip install ytsaurus-yson\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"25\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-25\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-25\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-25.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"autocompletion\"&gt;&lt;a href=\"ru/api/cli/install.html#autocompletion\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Автодополнение&lt;/span&gt;&lt;/a&gt;Автодополнение&lt;/h2&gt;\n&lt;p&gt;В случае pip-пакета включить autocompletion можно с помощью утилиты &lt;code&gt;register-python-argcomplete&lt;/code&gt;, которая поставляется вместе с пакетом argcomplete.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;register-python-argcomplete yt | sudo tee /etc/bash_completion.d/yt &amp;gt;/dev/null\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"32\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-32\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-32\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-32.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Проверить работоспособность автодополнения можно, набрав в консоли:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &amp;lt;TAB&amp;gt;&amp;lt;TAB&amp;gt;\nabort-job\nabort-op\nabort-tx\nadd-member\nalter-table\nalter-table-replica\ncheck-permission\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"36\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-36\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-36\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-36.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Автодополнение также умеет работать с путями в Кипарисе. Для этого необходимо, чтобы в переменных окружения был указан кластер, с которым вы работаете. Указать его можно командой &lt;code&gt;$ export YT_PROXY=&amp;lt;cluster_name&amp;gt;&lt;/code&gt;. Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ &lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_PROXY=&amp;lt;cluster-name&amp;gt;\n$ yt list /&amp;lt;TAB&amp;gt;/&amp;lt;TAB&amp;gt;&amp;lt;TAB&amp;gt;\n//@               //home/           //porto_layers/   //statbox/        //test_q_roc_auc  //trash           //userfeat/       //userstats/\n//cooked_logs/    //logs            //projects/       //sys             //tmp/            //userdata/       //user_sessions/\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"40\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-40\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-40\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-40.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если вместо названий команд или путей Кипариса вы видите что-то иное (либо ничего, либо пути в текущей директории), значит, autocompletion не включился. Проверьте выполнение следующих условий:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Должен быть установлен основной пакет bash_completion. Под Ubuntu-подобными системами этого можно достичь посредством запуска команды &lt;code&gt;$ sudo apt-get install bash-completion&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;bash-completion должен инициироваться при запуске bash-сессии. Например, в Ubuntu по умолчанию в .bashrc есть строка &lt;code&gt;. /etc/bash_completion&lt;/code&gt;, если у вас такой не видно, то стоит ее прописать себе в .bashrc.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/api/cli/install.md","sourcePath":"ru/api/cli/install.md"},"headings":[{"title":"Установка из PyPI-репозитория","href":"ru/api/cli/install.html#ustanovka-iz-pypi-repozitoriya","level":2},{"title":"Автодополнение","href":"ru/api/cli/install.html#autocompletion","level":2}],"title":"YTsaurus CLI"},"router":{"pathname":"ru/api/cli/install","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
