        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;a href=\"https://airflow.apache.org/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apache Airflow&lt;/a&gt; — это платформа для создания, планирования и мониторинга рабочих процессов. YTsaurus Airflow Provider позволяет интегрировать Airflow с YTsaurus и эффективно управлять задачами, связанными с обработкой данных.&lt;/p&gt;\n&lt;p&gt;В данном разделе приведены инструкции — как подключиться к YTsaurus кластеру в Apache Airflow и как использовать операторы для взаимодействия с Кипарисом, для работы со статическими таблицами и для выполнения запросов в &lt;a href=\"user-guide/query-tracker/about.html\"&gt;Query Tracker&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ustanovka\"&gt;&lt;a href=\"ru/api/airflow/userdoc.html#ustanovka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка&lt;/span&gt;&lt;/a&gt;Установка&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Текущая версия пакета требует:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Python 3.8+&lt;/li&gt;\n&lt;li&gt;Airflow 2.9.0+&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Установите Python-клиент из PyPi-репозитория:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;pip install ytsaurus-airflow-provider\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"36\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-36\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-36\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-36.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Если возникает ошибка 'Building wheel for xmlsec (pyproject.toml) did not run successfully.'&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Установите пакеты, необходимые для сборки &lt;code&gt;xmlsec&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;sudo&lt;/span&gt; apt install libxmlsec1-dev pkg-config build-essential python3-dev\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"45\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-45\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-45\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-45.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Проверьте, что установка провайдера прошла успешно:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ python3 -c &lt;span class=\"hljs-string\"&gt;\"import ytsaurus_airflow_provider; print(ytsaurus_airflow_provider.__version__)\"&lt;/span&gt;\n0.1.1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"53\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-53\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-53\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-53.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;В результате будут доступны:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Python-библиотека для написания DAG-ов;&lt;/li&gt;\n&lt;li&gt;провайдер для &lt;a href=\"https://airflow.apache.org\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apache Airflow&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;инструменты &lt;code&gt;ytsaurus-client&lt;/code&gt; и &lt;code&gt;ytsaurus-yson&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"howtostart\"&gt;&lt;a href=\"ru/api/airflow/userdoc.html#howtostart\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Начало работы&lt;/span&gt;&lt;/a&gt;Начало работы&lt;/h2&gt;\n&lt;p&gt;В веб-интерфейсе Apache Airflow создайте подключение к кластеру YTsaurus:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Admin&lt;/strong&gt; -&amp;gt; &lt;strong&gt;Connections&lt;/strong&gt; -&amp;gt; &lt;strong&gt;+&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Connection Id&lt;/strong&gt;: &lt;code&gt;ytsaurus_cluster_default&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Connection Type&lt;/strong&gt;: YTsaurus Cluster&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Cluster Proxy&lt;/strong&gt;: Прокси кластера&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Cluster Token&lt;/strong&gt;: Токен подключения к кластеру&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Extra&lt;/strong&gt;: По желанию, можно указать &lt;a href=\"api/python/userdoc#configuration\"&gt;Client Config&lt;/a&gt;:\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{\n    \"client_config\": {\n        \"create_table_attributes\": {\n            \"compression_codec\": \"brotli_3\"\n        }\n    }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"112\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-112\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-112\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-112.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;При необходимости можно создать подключение к объектному хранилищу:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Admin&lt;/strong&gt; -&amp;gt; &lt;strong&gt;Connections&lt;/strong&gt; -&amp;gt; &lt;strong&gt;+&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Connection Id&lt;/strong&gt;: &lt;code&gt;aws_default&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Connection Type&lt;/strong&gt;: Amazon Web Service&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;AWS Access Key ID&lt;/strong&gt; и &lt;strong&gt;AWS Secret Access Key&lt;/strong&gt;: Ключи доступа к объектному хранилищу&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"selectconn\"&gt;&lt;a href=\"ru/api/airflow/userdoc.html#selectconn\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как задать подключение&lt;/span&gt;&lt;/a&gt;Как задать подключение&lt;/h4&gt;\n&lt;p&gt;Каждый оператор принимает на вход опциональный параметр &lt;code&gt;ytsaurus_conn_id&lt;/code&gt;, который по стандарту указан как &lt;code&gt;ytsaurus_cluster_default&lt;/code&gt;. Если необходимо использовать другое подключение, то его следует указать в параметре &lt;code&gt;ytsaurus_conn_id&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"operators\"&gt;&lt;a href=\"ru/api/airflow/userdoc.html#operators\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Операторы&lt;/span&gt;&lt;/a&gt;Операторы&lt;/h2&gt;\n&lt;p&gt;Все операторы, кроме оператора чтения при указанном ObjectStorage, пишут данные в XCom. Не рекомендуется передавать большие объёмы данных через XCom. Ниже описано, какие операторы в какие XCom пишут данные.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Все операторы используют Python SDK. При возникновении ошибок во время выполнения операторов обратитесь к &lt;a href=\"api/python/userdoc.html\"&gt;документации Python SDK&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"operators_cypress\"&gt;&lt;a href=\"ru/api/airflow/userdoc.html#operators_cypress\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с Кипарисом&lt;/span&gt;&lt;/a&gt;Работа с Кипарисом&lt;/h3&gt;\n&lt;h4 id=\"getoperator\"&gt;&lt;a href=\"ru/api/airflow/userdoc.html#getoperator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GetOperator&lt;/span&gt;&lt;/a&gt;GetOperator&lt;/h4&gt;\n&lt;p&gt;Оператор для получения содержимого узла Кипариса. Реализует функционал &lt;a href=\"api/commands.html#get\"&gt;get&lt;/a&gt; из Python SDK.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Параметры:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path: str | YPath&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_size: None | int = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;attributes: None | dict[str, Any] = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;read_from: None | str = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ytsaurus_conn_id: str = \"ytsaurus_cluster_default\"&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;XComs:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;return_value&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"setoperator\"&gt;&lt;a href=\"ru/api/airflow/userdoc.html#setoperator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SetOperator&lt;/span&gt;&lt;/a&gt;SetOperator&lt;/h4&gt;\n&lt;p&gt;Оператор для записи нового содержимого в узел Кипариса. Реализует функционал &lt;a href=\"api/commands.html#set\"&gt;set&lt;/a&gt; из Python SDK.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Параметры:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path: str | YPath&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;value: Any&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;set_format: None | str | Format = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;recursive: bool = False&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;force: None | bool = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ytsaurus_conn_id: str = \"ytsaurus_cluster_default\"&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;XComs:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"removeoperator\"&gt;&lt;a href=\"ru/api/airflow/userdoc.html#removeoperator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RemoveOperator&lt;/span&gt;&lt;/a&gt;RemoveOperator&lt;/h4&gt;\n&lt;p&gt;Оператор для удаления узла Кипариса. Реализует функционал &lt;a href=\"api/commands.html#remove\"&gt;remove&lt;/a&gt; из Python SDK.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Параметры:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path: str | YPath&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;recursive: bool = False&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;force: bool = False&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ytsaurus_conn_id: str = \"ytsaurus_cluster_default\"&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;XComs:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"createoperator\"&gt;&lt;a href=\"ru/api/airflow/userdoc.html#createoperator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CreateOperator&lt;/span&gt;&lt;/a&gt;CreateOperator&lt;/h4&gt;\n&lt;p&gt;Оператор для создания пустого узла Кипариса типа &lt;code&gt;node_type&lt;/code&gt; с атрибутами &lt;code&gt;attributes&lt;/code&gt;. Реализует функционал &lt;a href=\"api/commands.html#create\"&gt;create&lt;/a&gt; из Python SDK.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Параметры:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;node_type: Literal[\"table\", \"file\", \"map_node\", \"document\", \"string_node\", \"int64_node\", \"uint64_node\", \"double_node\", \"list_node\", \"boolean_node\", \"link\"]&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;path: str | YPath&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;recursive: bool = False&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ignore_existing: bool = False&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;lock_existing: None | bool = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;force: None | bool = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;attributes: None | dict[str, Any] = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ignore_type_mismatch: bool = False&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ytsaurus_conn_id: str = \"ytsaurus_cluster_default\"&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;XComs:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;object_id&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;path&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"listoperator\"&gt;&lt;a href=\"ru/api/airflow/userdoc.html#listoperator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ListOperator&lt;/span&gt;&lt;/a&gt;ListOperator&lt;/h4&gt;\n&lt;p&gt;Оператор для получения списка потомков узла &lt;code&gt;path&lt;/code&gt;. Опция &lt;code&gt;absolute&lt;/code&gt; включает вывод абсолютных путей вместо относительных. Реализует функционал &lt;a href=\"api/commands.html#list\"&gt;list&lt;/a&gt; из Python SDK.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Параметры:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path: str | YPath&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_size: None | int = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;absolute: None | bool = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;attributes: None | dict[str, Any] = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;sort: bool = True&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;read_from: None | str = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ytsaurus_conn_id: str = \"ytsaurus_cluster_default\"&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;XComs:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;return_value&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"operators_tables\"&gt;&lt;a href=\"ru/api/airflow/userdoc.html#operators_tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с таблицами&lt;/span&gt;&lt;/a&gt;Работа с таблицами&lt;/h3&gt;\n&lt;h4 id=\"writetableoperator\"&gt;&lt;a href=\"ru/api/airflow/userdoc.html#writetableoperator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;WriteTableOperator&lt;/span&gt;&lt;/a&gt;WriteTableOperator&lt;/h4&gt;\n&lt;p&gt;Оператор для записи данных в статическую таблицу. Реализует функционал &lt;a href=\"api/commands.html#write_table\"&gt;write_table&lt;/a&gt; из Python SDK.&lt;/p&gt;\n&lt;p&gt;Входные данные могут передаваться через параметр &lt;code&gt;input_data&lt;/code&gt; или через параметр &lt;code&gt;object_storage_path&lt;/code&gt;, представляющий из себя объект типа &lt;a href=\"https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/objectstorage.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ObjectStorage&lt;/a&gt;. Одновременно передавать &lt;code&gt;input_data&lt;/code&gt; и &lt;code&gt;object_storage_path&lt;/code&gt; нельзя. При записи данных из объектного хранилища требуется указать соответствующий &lt;code&gt;object_storage_format&lt;/code&gt; (см. &lt;a href=\"user-guide/storage/formats#table_formats\"&gt;Форматы представления табличных данных&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Параметры:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path: str | YPath&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;input_data: Any | None = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;object_storage_path: None | UPath = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;object_storage_format: None | str | Format = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;table_writer: dict[str, Any] | None = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_row_buffer_size: int | None = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;force_create: None | bool = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ytsaurus_conn_id: str = \"ytsaurus_cluster_default\"&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;XComs:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;object_storage_path&lt;/code&gt; (если запись через &lt;code&gt;object_storage_path&lt;/code&gt;)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"readtableoperator\"&gt;&lt;a href=\"ru/api/airflow/userdoc.html#readtableoperator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ReadTableOperator&lt;/span&gt;&lt;/a&gt;ReadTableOperator&lt;/h4&gt;\n&lt;p&gt;Оператор для чтения данных из статической таблицы. Реализует функционал &lt;a href=\"api/commands.html#read_table\"&gt;read_table&lt;/a&gt; из Python SDK.&lt;/p&gt;\n&lt;p&gt;Может писать данные в объектное хранилище, если на вход передаётся параметр &lt;code&gt;object_storage_path&lt;/code&gt;, представляющий из себя объект типа &lt;a href=\"https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/objectstorage.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ObjectStorage&lt;/a&gt;. В ином случае таблица будет записываться в XCom. При записи данных в объектное хранилище требуется указать желаемый &lt;code&gt;object_storage_format&lt;/code&gt; (см. &lt;a href=\"user-guide/storage/formats#table_formats\"&gt;Форматы представления табличных данных&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Параметры:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path: str | YPath&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;object_storage_path: None | UPath = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;object_storage_format: None | str | Format = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;table_reader: None | dict[str, Any] = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;control_attributes: None | dict[str, Any] = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;unordered: None | bool = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;response_parameters: None | dict[str, Any] = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;enable_read_parallel: None | bool = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;omit_inaccessible_columns: None | bool = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ytsaurus_conn_id: str = \"ytsaurus_cluster_default\"&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;XComs:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;path&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;object_storage_path&lt;/code&gt; (если запись в &lt;code&gt;object_storage_path&lt;/code&gt;)&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;return_value&lt;/code&gt; (если запись в XCom)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"operators_query_tracker\"&gt;&lt;a href=\"ru/api/airflow/userdoc.html#operators_query_tracker\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Query Tracker&lt;/span&gt;&lt;/a&gt;Query Tracker&lt;/h3&gt;\n&lt;h4 id=\"runqueryoperator\"&gt;&lt;a href=\"ru/api/airflow/userdoc.html#runqueryoperator\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RunQueryOperator&lt;/span&gt;&lt;/a&gt;RunQueryOperator&lt;/h4&gt;\n&lt;p&gt;Оператор для выполнения запросов в Query Tracker с разным синтаксисом. Подробнее про Query Tracker можно почитать &lt;a href=\"user-guide/query-tracker/about.html\"&gt;тут&lt;/a&gt;. Реализует функционал &lt;a href=\"https://pydoc.ytsaurus.tech/yt.wrapper.html#yt.wrapper.client_impl.YtClient.run_query\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;run_query&lt;/a&gt; из Python SDK.&lt;/p&gt;\n&lt;p&gt;Может запускаться в асинхронном режиме, тогда оператор не будет дожидаться выполнения запроса.&lt;/p&gt;\n&lt;p&gt;Результаты выполнения запроса могут записываться в XCom и объектное хранилище. Если в результате запроса возвращается 3 результата, а в качестве &lt;code&gt;object_storage_paths&lt;/code&gt; переданы &lt;code&gt;[None, ObjectStorage(\"s3://bucket/path\"), None]&lt;/code&gt;, то в XCom будут записаны результаты №1 и №3, а результат №2 будет записан в объектное хранилище.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Параметры:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;engine: Literal[\"ql\", \"yql\", \"chyt\", \"spyt\"]&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;query: str&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;settings: None | dict[str, Any] | yt.yson.yson_types.YsonType = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;files: None | list[dict[str, Any]] | list[yt.yson.yson_types.YsonType] = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;stage: None | str = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;annotations: None | dict[str, Any] | yt.yson.yson_types.YsonType = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;access_control_objects: None | list[str] = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;sync: bool = True&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;object_storage_paths: list[None | UPath] | None = None&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ytsaurus_conn_id: str = \"ytsaurus_cluster_default\"&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;XComs:&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;meta&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;query_id&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;result_{i}&lt;/code&gt;, где i — номер возвращаемого результата, отсчитываемого от 0. Если для i-го результата передан &lt;code&gt;object_storage_paths[i]&lt;/code&gt;, то результат не будет записан в &lt;code&gt;result_{i}&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"ru/api/airflow/userdoc.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры работы&lt;/span&gt;&lt;/a&gt;Примеры работы&lt;/h2&gt;\n&lt;p&gt;Примеры работы с операторами представлены в готовых DAG'ах &lt;a href=\"https://github.com/ytsaurus/ytsaurus-airflow-provider/tree/main/ytsaurus_airflow_provider/example_dags\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;example_dags&lt;/a&gt;.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/api/airflow/userdoc.md","sourcePath":"ru/api/airflow/userdoc.md"},"headings":[{"title":"Установка","href":"ru/api/airflow/userdoc.html#ustanovka","level":2},{"title":"Начало работы","href":"ru/api/airflow/userdoc.html#howtostart","level":2},{"title":"Операторы","href":"ru/api/airflow/userdoc.html#operators","level":2,"items":[{"title":"Работа с Кипарисом","href":"ru/api/airflow/userdoc.html#operators_cypress","level":3,"items":[{"title":"GetOperator","href":"ru/api/airflow/userdoc.html#getoperator","level":4},{"title":"SetOperator","href":"ru/api/airflow/userdoc.html#setoperator","level":4},{"title":"RemoveOperator","href":"ru/api/airflow/userdoc.html#removeoperator","level":4},{"title":"CreateOperator","href":"ru/api/airflow/userdoc.html#createoperator","level":4},{"title":"ListOperator","href":"ru/api/airflow/userdoc.html#listoperator","level":4}]},{"title":"Работа с таблицами","href":"ru/api/airflow/userdoc.html#operators_tables","level":3,"items":[{"title":"WriteTableOperator","href":"ru/api/airflow/userdoc.html#writetableoperator","level":4},{"title":"ReadTableOperator","href":"ru/api/airflow/userdoc.html#readtableoperator","level":4}]},{"title":"Query Tracker","href":"ru/api/airflow/userdoc.html#operators_query_tracker","level":3,"items":[{"title":"RunQueryOperator","href":"ru/api/airflow/userdoc.html#runqueryoperator","level":4}]}]},{"title":"Примеры работы","href":"ru/api/airflow/userdoc.html#examples","level":2}],"title":"YTsaurus Airflow Provider"},"router":{"pathname":"ru/api/airflow/userdoc","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
