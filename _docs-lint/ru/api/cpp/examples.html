        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Перед запуском примеров необходимо получить &lt;a href=\"user-guide/storage/auth.html\"&gt;YT-токен&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Запускать примеры нужно из-под &lt;code&gt;Linux&lt;/code&gt; без аргументов.&lt;/p&gt;\n&lt;p&gt;Рекомендуется установить уровень логирования в &lt;code&gt;INFO&lt;/code&gt; или &lt;code&gt;DEBUG&lt;/code&gt;, тогда программы будут выводить ссылки на веб-интерфейс, где можно следить за выполнением операций.&lt;/p&gt;\n&lt;p&gt;Уровень логирования устанавливается с помощью переменной окружения такой командой (см. так же &lt;a href=\"api/cpp/description.html#logging\"&gt;документацию&lt;/a&gt;):&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_LOG_LEVEL=INFO\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"12\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-12\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-12\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-12.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Для продакшн-процессов рекомендуется сохранять наиболее полные &lt;code&gt;DEBUG&lt;/code&gt; логи. В случае возникновения каких-либо проблем они помогут понять, что происходило.&lt;/p&gt;\n&lt;h2 id=\"bazovyj-uroven\"&gt;&lt;a href=\"ru/api/cpp/examples.html#bazovyj-uroven\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Базовый уровень&lt;/span&gt;&lt;/a&gt;Базовый уровень&lt;/h2&gt;\n&lt;h3 id=\"prostoj-map-tnode-versiya\"&gt;&lt;a href=\"ru/api/cpp/examples.html#prostoj-map-tnode-versiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Простой Map (TNode-версия)&lt;/span&gt;&lt;/a&gt;Простой Map (TNode-версия)&lt;/h3&gt;\n&lt;p&gt;Предположим, что существует таблица с логинами. Необходимо сделать таблицу с email-адресами, вычислив их из логина &lt;code&gt;email = login + \"@domain\"&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Для этого подойдёт простой маппер.&lt;/p&gt;\n&lt;p&gt;Пример лежит в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/simple_map_tnode\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/simple_map_tnode&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt; &lt;span class=\"hljs-string\"&gt;'yt/cpp/mapreduce/tutorial/simple_map_tnode/main.cpp'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"31\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-31\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-31\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-31.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"prostoj-map-protobuf-versiya\"&gt;&lt;a href=\"ru/api/cpp/examples.html#prostoj-map-protobuf-versiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Простой Map (Protobuf-версия)&lt;/span&gt;&lt;/a&gt;Простой Map (Protobuf-версия)&lt;/h3&gt;\n&lt;p&gt;Если известно, как устроена таблица, то может быть удобно воспользоваться форматом &lt;a href=\"api/cpp/protobuf.html\"&gt;Protobuf&lt;/a&gt;, который:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;несколько быстрее;&lt;/li&gt;\n&lt;li&gt;помогает избежать опечаток в названиях колонок и проверит работу с типами.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример лежит в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/simple_map_protobuf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/simple_map_protobuf&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'protobuf'\"&gt;&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"prostoj-map-s-protobuf-i-ispolzovaniem-lyambda-vyrazhenij-v-c\"&gt;&lt;a href=\"ru/api/cpp/examples.html#prostoj-map-s-protobuf-i-ispolzovaniem-lyambda-vyrazhenij-v-c\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Простой Map с Protobuf и использованием лямбда-выражений в C++&lt;/span&gt;&lt;/a&gt;Простой Map с Protobuf и использованием лямбда-выражений в C++&lt;/h3&gt;\n&lt;p&gt;Некоторые достаточно простые операции можно представить в виде лямбда-выражений C++ с пустым capture-list (т. е. не захватывающих переменных) с использованием библиотеки &lt;a href=\"api/cpp/lambda.html\"&gt;yt/cpp/mapreduce/library/lambda&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Предыдущий пример может быть переписан так (&lt;code&gt;data.proto&lt;/code&gt; такой же):&lt;/p&gt;\n&lt;p&gt;(&lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/simple_map_lambda\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/simple_map_lambda&lt;/a&gt;)&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"sortirovka-tablicy-i-prostaya-operaciya-reduce\"&gt;&lt;a href=\"ru/api/cpp/examples.html#sortirovka-tablicy-i-prostaya-operaciya-reduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сортировка таблицы и простая операция Reduce&lt;/span&gt;&lt;/a&gt;Сортировка таблицы и простая операция Reduce&lt;/h3&gt;\n&lt;p&gt;Чтобы по той же таблице посчитать статистику, сколько раз встречается то или иное имя, можно использовать операцию Reduce. Однако, Reduce можно запускать только на сортированных таблицах, поэтому таблицу нужно сначала отсортировать.&lt;/p&gt;\n&lt;p&gt;Пример лежит в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/simple_reduce_tnode\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/simple_reduce_tnode&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"slozhnye-tipy-i-format-protobuf-na-primere-reduce\"&gt;&lt;a href=\"ru/api/cpp/examples.html#slozhnye-tipy-i-format-protobuf-na-primere-reduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сложные типы и формат Protobuf (на примере Reduce)&lt;/span&gt;&lt;/a&gt;Сложные типы и формат Protobuf (на примере Reduce)&lt;/h3&gt;\n&lt;p&gt;В качестве примера рассмотрим таблицу с набором записей про ссылки, которые встречаются в веб-документах. Таблица содержит колонки:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;DocTitle&lt;/code&gt; — имя документа;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Link&lt;/code&gt; — структура с полями:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Host&lt;/code&gt; — часть ссылки, содержащая хост;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Port&lt;/code&gt;— часть ссылки, содержащая порт;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Path&lt;/code&gt;— часть ссылки, содержащая путь;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;OccurrenceCount&lt;/code&gt; — количество встречаний данной ссылки в документе.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Таблица отсортирована по колонке &lt;code&gt;DocTitle&lt;/code&gt;. Необходимо собрать информацию о каждом документе в одну строку выходной таблицы.&lt;/p&gt;\n&lt;p&gt;Опишем protobuf-сообщения следующего вида:&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;TLinkEntry&lt;/code&gt; соответствует строке входной таблицы, &lt;code&gt;TDoc&lt;/code&gt; — строке выходной.&lt;/p&gt;\n&lt;p&gt;Поля &lt;code&gt;TDoc&lt;/code&gt; имеют следующую семантику:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Title&lt;/code&gt; — заголовок;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Links&lt;/code&gt;— список ссылок, упомянутых в документе;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;OccurrenceCounts&lt;/code&gt; — список количества вхождений соответствующих ссылок (длина этого списка равна длине списка &lt;code&gt;Links&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ExtraInfo&lt;/code&gt; — дополнительная информация, в данном случае включающая суммарное количество вхождений ссылок.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;code&gt;(NYT.field_serialization_mode)&lt;/code&gt; в сообщениях &lt;code&gt;TDoc&lt;/code&gt; и &lt;code&gt;TLinkEntry&lt;/code&gt;. Эта опция по умолчанию равна &lt;code&gt;PROTOBUF&lt;/code&gt;, то есть \"сериализовать поле в виде последовательности байт\". Выставленное нами значение &lt;code&gt;YT&lt;/code&gt; означает, что соответствующее вложенное сообщение будет сопоставлено сложному типу в схеме таблицы. В &lt;code&gt;TDoc&lt;/code&gt; для примера мы пометили поле &lt;code&gt;ExtraInfo&lt;/code&gt; опцией &lt;code&gt;(NYT.serialization_mode) = PROTOBUF&lt;/code&gt;(обратите внимание на тип соответствующего поля в выходной таблице).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reducer&lt;/a&gt; пишется естественным образом.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"multiple-input-reduce-tnode\"&gt;&lt;a href=\"ru/api/cpp/examples.html#multiple-input-reduce-tnode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reduce с несколькими входными таблицами&lt;/span&gt;&lt;/a&gt;Reduce с несколькими входными таблицами&lt;/h3&gt;\n&lt;p&gt;Если кроме старой таблицы с пользователями, есть таблица, где записано, кто робот.&lt;/p&gt;\n&lt;p&gt;Следующая программа сделает таблицу, в которой останутся только пользователи-роботы.&lt;/p&gt;\n&lt;p&gt;Пример лежит в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/multiple_input_reduce_tnode\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/multiple_input_reduce_tnode&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"map-tnode-with-file\"&gt;&lt;a href=\"ru/api/cpp/examples.html#map-tnode-with-file\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чтение файлов из операций&lt;/span&gt;&lt;/a&gt;Чтение файлов из операций&lt;/h3&gt;\n&lt;p&gt;Предыдущую задачу можно решать и по-другому: загрузить таблицу с роботами прямо на машины, где будут запускаться операции, и считать её там целиком в &lt;code&gt;yhash_set&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В таком случае можно не сортировать таблицу и использовать Map, а не Reduce. Этот способ используется, если таблица небольшая (до нескольких ГБ).&lt;/p&gt;\n&lt;p&gt;Входные таблицы те же, что и в предыдущем примере: с пользователями и роботами&lt;/p&gt;\n&lt;p&gt;Следующая программа сделает таблицу, в которой останутся только пользователи-роботы.&lt;/p&gt;\n&lt;p&gt;Пример лежит в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/map_tnode_with_file\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/map_tnode_with_file&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"reduce-s-neskolkimi-vhodnymi-i-neskolkimi-vyhodnymi-tablicami\"&gt;&lt;a href=\"ru/api/cpp/examples.html#reduce-s-neskolkimi-vhodnymi-i-neskolkimi-vyhodnymi-tablicami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reduce с несколькими входными и несколькими выходными таблицами&lt;/span&gt;&lt;/a&gt;Reduce с несколькими входными и несколькими выходными таблицами&lt;/h3&gt;\n&lt;p&gt;Теперь необходимо сделать почти то же самое что и в предыдущем примере, но записать сразу 2 выходных таблицы: и с людьми и с роботами.&lt;/p&gt;\n&lt;p&gt;Пример лежит в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/multiple_input_multiple_output_reduce_tnode\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/multiple_input_multiple_output_reduce_tnode&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"reduce-s-neskolkimi-vhodnymi-i-neskolkimi-vyhodnymi-tablicami-protobuf-versiya\"&gt;&lt;a href=\"ru/api/cpp/examples.html#reduce-s-neskolkimi-vhodnymi-i-neskolkimi-vyhodnymi-tablicami-protobuf-versiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reduce с несколькими входными и несколькими выходными таблицами (Protobuf-версия)&lt;/span&gt;&lt;/a&gt;Reduce с несколькими входными и несколькими выходными таблицами (Protobuf-версия)&lt;/h3&gt;\n&lt;p&gt;Чтобы сделать разные таблицы для людей и роботов, нужно переписать тот же самый reducer на protobuf. Таблица с людьми будет содержать поля &lt;code&gt;login&lt;/code&gt;, &lt;code&gt;email&lt;/code&gt;, &lt;code&gt;name&lt;/code&gt;. Таблица с роботами будет содержать поля &lt;code&gt;login&lt;/code&gt; и &lt;code&gt;uid&lt;/code&gt;. Потребуется завести отдельные типы protobuf сообщений для этих таблиц.&lt;/p&gt;\n&lt;p&gt;Пример лежит в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/multiple_input_multiple_output_reduce_protobuf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/multiple_input_multiple_output_reduce_protobuf&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"chtenie-i-zapis-tablic\"&gt;&lt;a href=\"ru/api/cpp/examples.html#chtenie-i-zapis-tablic\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чтение и запись таблиц&lt;/span&gt;&lt;/a&gt;Чтение и запись таблиц&lt;/h3&gt;\n&lt;p&gt;YTsaurus позволяет писать в таблицы и дописывать данные в них. По чтению таблиц тоже есть несколько режимов: можно читать как всю таблицу, так и отдельные диапазоны по номеру строки или ключу. См. также разделы про &lt;a href=\"user-guide/storage/formats.html#table_data\"&gt;чтение и запись данных&lt;/a&gt; и &lt;a href=\"user-guide/storage/objects.html#tables\"&gt;таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Пример лежит в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/table_read_write_tnode\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/table_read_write_tnode&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"peredacha-sostoyaniya-v-dzhob\"&gt;&lt;a href=\"ru/api/cpp/examples.html#peredacha-sostoyaniya-v-dzhob\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Передача состояния в джоб&lt;/span&gt;&lt;/a&gt;Передача состояния в джоб&lt;/h3&gt;\n&lt;p&gt;Иногда нужно написать операцию, которая принимает некоторые аргументы. Например, написать программу, которая отфильтрует исходную таблицу по имени пользователя.&lt;/p&gt;\n&lt;p&gt;Пример лежит в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/stateful_map_tnode\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/stateful_map_tnode&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"operaciya-mapreduce-protobuf-versiya\"&gt;&lt;a href=\"ru/api/cpp/examples.html#operaciya-mapreduce-protobuf-versiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Операция MapReduce (Protobuf-версия)&lt;/span&gt;&lt;/a&gt;Операция MapReduce (Protobuf-версия)&lt;/h3&gt;\n&lt;p&gt;В YTsaurus есть слитная операция &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt;, которая работает несколько быстрее нежели &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt; + &lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;Sort&lt;/a&gt; + &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt;. Чтобы по таблице с пользователями ещё раз посчитать статистику, сколько раз встречается то или иное имя, перед подсчётом нормализируем имена, приведя их к нижнему регистру. Это нужно, чтобы люди с именами &lt;code&gt;АРКАДИЙ&lt;/code&gt; и &lt;code&gt;Аркадий&lt;/code&gt; считались как одно.&lt;/p&gt;\n&lt;p&gt;Пример лежит в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/mapreduce_protobuf\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/mapreduce_protobuf&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"operaciya-mapreduce-versiya-s-lyambda-vyrazheniyami\"&gt;&lt;a href=\"ru/api/cpp/examples.html#operaciya-mapreduce-versiya-s-lyambda-vyrazheniyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Операция MapReduce (версия с лямбда-выражениями)&lt;/span&gt;&lt;/a&gt;Операция MapReduce (версия с лямбда-выражениями)&lt;/h3&gt;\n&lt;p&gt;Задача та же, что в предыдущем примере.&lt;/p&gt;\n&lt;p&gt;Этот пример лежит в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/mapreduce_lambda\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/mapreduce_lambda&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"prepare_operation\"&gt;&lt;a href=\"ru/api/cpp/examples.html#prepare_operation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подготовка операции в классе джоба&lt;/span&gt;&lt;/a&gt;Подготовка операции в классе джоба&lt;/h3&gt;\n&lt;p&gt;Есть возможность настраивать параметры операции, перегружая метод &lt;code&gt;IJob::PrepareOperation&lt;/code&gt;, подробности см. в разделе &lt;a href=\"api/cpp/description.html#prepare_operation\"&gt;Описание&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'protobuf'\"&gt;&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h2 id=\"prodvinutyj-uroven\"&gt;&lt;a href=\"ru/api/cpp/examples.html#prodvinutyj-uroven\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Продвинутый уровень&lt;/span&gt;&lt;/a&gt;Продвинутый уровень&lt;/h2&gt;\n&lt;h3 id=\"zapusk-neskolkih-operacij-parallelno\"&gt;&lt;a href=\"ru/api/cpp/examples.html#zapusk-neskolkih-operacij-parallelno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск нескольких операций параллельно&lt;/span&gt;&lt;/a&gt;Запуск нескольких операций параллельно&lt;/h3&gt;\n&lt;p&gt;Для запуска нескольких операций параллельно существует класс &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/library/operation_tracker/operation_tracker.h\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;TOperationTracker&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Пример лежит в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/operation_tracker\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/operation_tracker&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"reduce-s-enable_key_guarantee=false\"&gt;&lt;a href=\"ru/api/cpp/examples.html#reduce-s-enable_key_guarantee=false\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reduce с enable_key_guarantee=false&lt;/span&gt;&lt;/a&gt;Reduce с enable_key_guarantee=false&lt;/h3&gt;\n&lt;p&gt;Предположим, нужно отфильтровать таблицу с URL по регулярным выражениям, которые лежат в отдельной таблице с хостами (т. е. для каждого хоста свое регулярное выражение). Задачу можно было бы решить Reduce по колонке &lt;code&gt;host&lt;/code&gt;, но реальные данные часто устроены таким образом, что какие-то хосты имеют непропорционально много URL. В таблице с примером URL с хоста &lt;code&gt;https://www.youtube.com&lt;/code&gt; занимают больше половины таблицы. Джоб, который будет обрабатывать такой хост, займёт непропорционально много времени (ключ &lt;code&gt;https://www.youtube.com&lt;/code&gt; в такой ситуации называют &lt;em&gt;ключом-монстром&lt;/em&gt;).&lt;/p&gt;\n&lt;p&gt;Но для решения задачи не нужно, чтобы все записи с одним хостом попадали на одну машину. Возможно распределить таблицу с URL между несколькими машинами: важно, чтобы вместе с URL обязательно был получен хост.&lt;/p&gt;\n&lt;p class=\"center\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" style=\"background-color:rgb(255, 255, 255)\" width=\"721px\" height=\"861px\" version=\"1.1\"&gt;&lt;defs&gt;&lt;/defs&gt;&lt;g transform=\"translate(0.5,0.5)\"&gt;&lt;rect x=\"390\" y=\"38\" width=\"140\" height=\"30\" rx=\"4.5\" ry=\"4.5\" fill=\"#d5e8d4\" stroke=\"#82b366\"&gt;&lt;/rect&gt;&lt;g transform=\"translate(431.5,46.5)\"&gt;&lt;switch&gt;&lt;div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display:inline-block;font-size:12px;font-family:Helvetica;color:rgb(0, 0, 0);width:58px;text-align:center\"&gt;&lt;div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display:inline-block;text-align:inherit;text-decoration:inherit\"&gt;host1, url1&lt;/div&gt;&lt;/div&gt;&lt;text x=\"29\" y=\"12\" fill=\"#000000\" text-anchor=\"middle\" font-size=\"12px\" font-family=\"Helvetica\"&gt;host1, url1&lt;/text&gt;&lt;/switch&gt;&lt;/g&gt;&lt;rect x=\"390\" y=\"121\" width=\"140\" height=\"30\" rx=\"4.5\" ry=\"4.5\" fill=\"#d5e8d4\" stroke=\"#82b366\"&gt;&lt;/rect&gt;&lt;g transform=\"translate(431.5,129.5)\"&gt;&lt;switch&gt;&lt;div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display:inline-block;font-size:12px;font-family:Helvetica;color:rgb(0, 0, 0);width:58px;text-align:center\"&gt;&lt;div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display:inline-block;text-align:inherit;text-decoration:inherit\"&gt;host1, url3&lt;/div&gt;&lt;/div&gt;&lt;text x=\"29\" y=\"12\" fill=\"#000000\" text-anchor=\"middle\" font-size=\"12px\" font-family=\"Helvetica\"&gt;host1, url3&lt;/text&gt;&lt;/switch&gt;&lt;/g&gt;&lt;rect x=\"390\" y=\"79\" width=\"140\" height=\"30\" rx=\"4.5\" ry=\"4.5\" fill=\"#d5e8d4\" stroke=\"#82b366\"&gt;&lt;/rect&gt;&lt;g transform=\"translate(431.5,87.5)\"&gt;&lt;switch&gt;&lt;div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display:inline-block;font-size:12px;font-family:Helvetica;color:rgb(0, 0, 0);width:58px;text-align:center\"&gt;&lt;div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display:inline-block;text-align:inherit;text-decoration:inherit\"&gt;ho \"#000000\" stroke-miterlimit=\"10\" transform=\"rotate(270, 205.892, 850.5)\" id=\"r1818c4e3__svg_121\"&gt;&lt;/path&gt;&lt;g id=\"r1818c4e3__svg_122\"&gt;&lt;switch transform=\"translate(0.392157) translate(0.5, 887.5) translate(0.5, 0.5)\"&gt;&lt;div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display:inline-block;font-size:19px;font-family:Helvetica;color:rgb(0, 0, 0);width:398px;text-align:center\"&gt;&lt;div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display:inline-block;text-align:inherit;text-decoration:inherit\"&gt;Урлы с одного хоста теперь обрабатываются несколькими джобами&lt;/div&gt;&lt;/div&gt;&lt;text x=\"199\" y=\"32\" fill=\"#000000\" text-anchor=\"middle\" font-size=\"19px\" font-family=\"Helvetica\" id=\"r1818c4e3__svg_124\"&gt;Урлы с одного хоста теперь обрабатываются несколькими джобами&lt;/text&gt;&lt;/switch&gt;&lt;/g&gt;&lt;path d=\"M110.89215686917305,30.5 L137.80216053128242,78.93000030517578 \" fill=\"none\" stroke=\"#000000\" stroke-miterlimit=\"10\" id=\"r1818c4e3__svg_125\"&gt;&lt;/path&gt;&lt;path d=\"M140.35216358304024,83.5199966430664 L133.89215686917305,79.0999984741211 L137.80216053128242,78.93000030517578 L140.01215198636055,75.69999694824219 z\" fill=\"#000000\" stroke=\"#000000\" stroke-miterlimit=\"10\" id=\"r1818c4e3__svg_126\"&gt;&lt;/path&gt;&lt;g id=\"r1818c4e3__svg_127\"&gt;&lt;switch transform=\"translate(0.392157) translate(40.5, 1.5) translate(0.5, 0.5)\"&gt;&lt;div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display:inline-block;font-size:12px;font-family:Helvetica;color:rgb(0, 0, 0);width:138px;text-align:center\"&gt;&lt;div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display:inline-block;text-align:inherit;text-decoration:inherit\"&gt;Эту таблицу отмечаем как foreign&lt;/div&gt;&lt;/div&gt;&lt;text x=\"69\" y=\"20\" fill=\"#000000\" text-anchor=\"middle\" font-size=\"12px\" font-family=\"Helvetica\" id=\"r1818c4e3__svg_129\"&gt;Эту таблицу отмечаем как foreign&lt;/text&gt;&lt;/switch&gt;&lt;/g&gt;&lt;p xmlns=\"http://www.w3.org/1999/xhtml\" style=\"border:none;font-size:inherit;padding:0;margin:0\"&gt;Reduce&lt;br style=\"border:none;font-size:inherit;padding:0;margin:0\" /&gt;&lt;/p&gt;&lt;p xmlns=\"http://www.w3.org/1999/xhtml\" style=\"border:none;font-size:inherit;padding:0;margin:0\"&gt;enable_key_guarantee=false&lt;/p&gt;&lt;/g&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Пример лежит в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/join_reduce_tnode\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/join_reduce_tnode&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"paketnye-zaprosy\"&gt;&lt;a href=\"ru/api/cpp/examples.html#paketnye-zaprosy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пакетные запросы&lt;/span&gt;&lt;/a&gt;Пакетные запросы&lt;/h3&gt;\n&lt;p&gt;Есть возможность исполнять «лёгкие» запросы (создать/удалить таблицу, проверить её существование и т.д. ) пачками. Этот способ стоит использовать, если нужно выполнить большое количество однотипных операций. Пакетные (batch) запросы помогут заметно сэкономить время.&lt;/p&gt;\n&lt;p&gt;Пример лежит в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/batch_request\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/batch_request&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"dostavka-dampa-tablicy-v-dzhob-v-vide-fajla\"&gt;&lt;a href=\"ru/api/cpp/examples.html#dostavka-dampa-tablicy-v-dzhob-v-vide-fajla\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Доставка дампа таблицы в джоб в виде файла&lt;/span&gt;&lt;/a&gt;Доставка дампа таблицы в джоб в виде файла&lt;/h3&gt;\n&lt;p&gt;В YTsaurus в джоб можно доставлять файлы (как, например, описано &lt;a href=\"ru/api/cpp/examples.html#map-tnode-with-file\"&gt;ранее&lt;/a&gt;). Менее известной возможностью является доставка дампа таблицы в джоб. Это может быть удобно, если джобу требуется словарь, хранящийся в небольшой (едининичные гигабайты) таблице. Однако не стоит использовать этот подход для загрузки больших таблиц — если размер таблицы несколько десятков гигабайт, такая таблица не поместится на одном узле кластера, на котором запускаются джобы.&lt;/p&gt;\n&lt;p&gt;Пример лежит в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/pass_table_as_file\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/pass_table_as_file&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"zapis-i-poluchenie-job-statistics\"&gt;&lt;a href=\"ru/api/cpp/examples.html#zapis-i-poluchenie-job-statistics\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запись и получение job statistics&lt;/span&gt;&lt;/a&gt;Запись и получение job statistics&lt;/h3&gt;\n&lt;p&gt;Во время работы операция накапливает множество статистик (читайте &lt;a href=\"user-guide/problems/jobstatistics.html\"&gt;документацию&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;Пример на простой Map со сбором статистик: &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/job_statistics\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/job_statistics&lt;/a&gt;:&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n&lt;h3 id=\"bazovaya-rabota-s-dinamicheskimi-tablicami\"&gt;&lt;a href=\"ru/api/cpp/examples.html#bazovaya-rabota-s-dinamicheskimi-tablicami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Базовая работа с динамическими таблицами&lt;/span&gt;&lt;/a&gt;Базовая работа с динамическими таблицами&lt;/h3&gt;\n&lt;p&gt;YTsaurus поддерживает &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;динамические таблицы&lt;/a&gt;. Wrapper С++ предоставляет возможность совершать базовые операции с такими таблицами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В отличие от других примеров, для запуска этого примера придётся совершить некоторые дополнительные действия:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;По умолчанию у пользователей нет разрешений для создания динамических таблиц, поэтому надо получить права на создание и монтирование динамических таблиц на каком-нибудь кластере.&lt;/li&gt;\n&lt;li&gt;Во время запуска примера нужно передать имя кластера и путь к тестовой таблице (она не должна существовать). Подробнее в комментариях в тексте программы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Пример лежит в &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/cpp/mapreduce/examples/tutorial/dyntable_get_insert\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt/cpp/mapreduce/examples/tutorial/dyntable_get_insert&lt;/a&gt;.&lt;/p&gt;\n&lt;p lang=\"'c++'\"&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/api/cpp/examples.md","sourcePath":"ru/api/cpp/examples.md"},"headings":[{"title":"Базовый уровень","href":"ru/api/cpp/examples.html#bazovyj-uroven","level":2,"items":[{"title":"Простой Map (TNode-версия)","href":"ru/api/cpp/examples.html#prostoj-map-tnode-versiya","level":3},{"title":"Простой Map (Protobuf-версия)","href":"ru/api/cpp/examples.html#prostoj-map-protobuf-versiya","level":3},{"title":"Простой Map с Protobuf и использованием лямбда-выражений в C++","href":"ru/api/cpp/examples.html#prostoj-map-s-protobuf-i-ispolzovaniem-lyambda-vyrazhenij-v-c","level":3},{"title":"Сортировка таблицы и простая операция Reduce","href":"ru/api/cpp/examples.html#sortirovka-tablicy-i-prostaya-operaciya-reduce","level":3},{"title":"Сложные типы и формат Pr
