        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе описано использование протокола передачи структурированных данных &lt;a href=\"https://en.wikipedia.org/wiki/Protocol_Buffers\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;protobuf&lt;/a&gt; для работы с таблицами в С++ API.&lt;/p&gt;\n&lt;h2 id=\"introduction\"&gt;&lt;a href=\"ru/api/cpp/protobuf.html#introduction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h2&gt;\n&lt;p&gt;С++ API позволяет использовать классы (сообщения) protobuf для чтения и записи таблиц как клиентом, так и внутри джоба.&lt;/p&gt;\n&lt;p&gt;Рекомендуется использовать версию &lt;a href=\"https://protobuf.dev/programming-guides/proto/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;proto2&lt;/a&gt;. В случае использования &lt;a href=\"https://protobuf.dev/programming-guides/proto3/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;proto3&lt;/a&gt; могут возникнуть ошибки: например, при попытке записать &lt;code&gt;0&lt;/code&gt; в поле &lt;code&gt;required=%true&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"shema-raboty\"&gt;&lt;a href=\"ru/api/cpp/protobuf.html#shema-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема работы&lt;/span&gt;&lt;/a&gt;Схема работы&lt;/h3&gt;\n&lt;p&gt;Пользователь описывает proto-структуру в файле &lt;code&gt;.proto&lt;/code&gt;. Proto-структура может быть размечена различными &lt;a href=\"ru/api/cpp/protobuf.html#flags\"&gt;флагами&lt;/a&gt;. Флаги влияют на то, как YTsaurus будет формировать или интерпретировать поля, указанные внутри сообщений.&lt;/p&gt;\n&lt;h2 id=\"primitive\"&gt;&lt;a href=\"ru/api/cpp/protobuf.html#primitive\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примитивные типы&lt;/span&gt;&lt;/a&gt;Примитивные типы&lt;/h2&gt;\n&lt;p&gt;Для работы с &lt;a href=\"user-guide/storage/data-types.html\"&gt;типом данных YTsaurus&lt;/a&gt; из первой колонки можно использовать соответствующий protobuf-тип из второй колонки в таблице ниже.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;YTsaurus&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Protobuf&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;, &lt;code&gt;utf8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;, &lt;code&gt;bytes&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;int{8,16,32,64}&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int{32,64}&lt;/code&gt;, &lt;code&gt;sint{32,64}&lt;/code&gt;, &lt;code&gt;sfixed{32,64}&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;uint{8,16,32,64}&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint{32,64}&lt;/code&gt;, &lt;code&gt;fixed{32,64}&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;double&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;double&lt;/code&gt;, &lt;code&gt;float&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;date&lt;/code&gt;, &lt;code&gt;datetime&lt;/code&gt;, &lt;code&gt;timestamp&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint{32,64}&lt;/code&gt;, &lt;code&gt;fixed{32,64}&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;interval&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int{32,64}&lt;/code&gt;, &lt;code&gt;sint{32,64}&lt;/code&gt;, &lt;code&gt;sfixed{32,64}&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Если диапазон целочисленного YTsaurus-типа не соответствует диапазону protobuf-типа, выполняется проверка в момент кодирования или декодирования.&lt;/p&gt;\n&lt;h2 id=\"optional_required\"&gt;&lt;a href=\"ru/api/cpp/protobuf.html#optional_required\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Свойства optional / required&lt;/span&gt;&lt;/a&gt;Свойства optional / required&lt;/h2&gt;\n&lt;p&gt;Свойства &lt;code&gt;optional&lt;/code&gt; / &lt;code&gt;required&lt;/code&gt; в  protobuf не обязаны соответствовать опциональности колонок в YT. Система всегда делает проверку в момент кодирования или декодирования protobuf-сообщений.&lt;/p&gt;\n&lt;p&gt;Например, если колонка &lt;code&gt;foo&lt;/code&gt; в YTsaurus имеет тип &lt;code&gt;int64&lt;/code&gt; (&lt;code&gt;required=%true&lt;/code&gt;), для её представления можно использовать поле:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs protobuf\"&gt;  &lt;span class=\"hljs-keyword\"&gt;optional&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;int64&lt;/span&gt; foo = &lt;span class=\"hljs-number\"&gt;42&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"106\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-106\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-106\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-106.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Ошибок не будет, пока все protobuf-сообщения, которые записываются в таблицу, имеют заполненное поле &lt;code&gt;foo&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"embedded\"&gt;&lt;a href=\"ru/api/cpp/protobuf.html#embedded\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вложенные сообщения&lt;/span&gt;&lt;/a&gt;Вложенные сообщения&lt;/h2&gt;\n&lt;p&gt;Исторически все вложенные protobuf-структуры записываются в YTsaurus в виде байтовой строки, хранящей &lt;a href=\"ru/api/cpp/protobuf.html#serialization\"&gt;сериализованное&lt;/a&gt; представление вложенной структуры.&lt;/p&gt;\n&lt;p&gt;Вложенные сообщения достаточно эффективны, но не позволяют удобно представлять значения в веб-интерфейсе или работать с ними другими способами (без помощи protobuf).&lt;/p&gt;\n&lt;p&gt;Этот способ также можно указать явно, выставив специальный &lt;a href=\"ru/api/cpp/protobuf.html#flags\"&gt;флаг&lt;/a&gt; в поле:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;optional TEmbeddedMessage UrlRow_1 = 1 [(NYT.flags) = SERIALIZATION_PROTOBUF];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"122\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-122\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-122\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-122.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Можно указать альтернативный флаг, тогда YTsaurus будет относить поле к типу &lt;code&gt;struct&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs protobuf\"&gt;&lt;span class=\"hljs-keyword\"&gt;optional&lt;/span&gt; TEmbeddedMessage ColumnName = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt; [(NYT.flags) = SERIALIZATION_YT];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"126\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-126\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-126\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-126.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Для использования вложенных сообщений требуется, чтобы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;у таблицы была задана &lt;a href=\"user-guide/storage/static-schema.html\"&gt;схема&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;соответствующая колонка (в примере: &lt;code&gt;ColumnName&lt;/code&gt;) имела YTsaurus-тип &lt;a href=\"user-guide/storage/data-types.html#schema_struct\"&gt;struct&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;поля типа &lt;code&gt;struct&lt;/code&gt; соответствовали полям вложенного сообщения (в примере: &lt;code&gt;TEmbeddedMessage&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Флаг во вложенных сообщениях не наследуется по умолчанию. Если для поля с типом &lt;code&gt;T&lt;/code&gt; выставлен флаг &lt;code&gt;SERIALIZATION_YT&lt;/code&gt;, то для структур, вложенных в &lt;code&gt;T&lt;/code&gt;, поведение по умолчанию все равно будет соответствовать флагу &lt;code&gt;SERIALIZATION_PROTOBUF&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"repeated\"&gt;&lt;a href=\"ru/api/cpp/protobuf.html#repeated\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Повторяющиеся поля&lt;/span&gt;&lt;/a&gt;Повторяющиеся поля&lt;/h2&gt;\n&lt;p&gt;Чтобы работать с повторяющимися (repeated) полями, нужно явно указать флаг &lt;code&gt;SERIALIZATION_YT&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs protobuf\"&gt;&lt;span class=\"hljs-keyword\"&gt;repeated&lt;/span&gt; TType ListColumn = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt; [(NYT.flags) = SERIALIZATION_YT];\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"163\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-163\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-163\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-163.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В YT такое поле будет иметь тип &lt;code&gt;list&lt;/code&gt;. Для использования повторяющихся полей требуется, чтобы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;у таблицы была задана &lt;a href=\"user-guide/storage/static-schema.html\"&gt;схема&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;соответствующая колонка (в примере: &lt;code&gt;ListColumn&lt;/code&gt;) имела YTsaurus-тип &lt;a href=\"user-guide/storage/data-types.html#schema_list\"&gt;list&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;элемент YTsaurus-типа &lt;code&gt;list&lt;/code&gt; соответствовал типу колонки protobuf (в примере: &lt;code&gt;TType&lt;/code&gt;). Это может быть &lt;a href=\"ru/api/cpp/protobuf.html#primitive\"&gt;примитивный&lt;/a&gt; тип или &lt;a href=\"ru/api/cpp/protobuf.html#embedded\"&gt;вложенное сообщение&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Флаг &lt;code&gt;SERIALIZATION_PROTOBUF&lt;/code&gt; для повторяющихся полей не поддерживается.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"oneof\"&gt;&lt;a href=\"ru/api/cpp/protobuf.html#oneof\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поля oneof&lt;/span&gt;&lt;/a&gt;Поля oneof&lt;/h2&gt;\n&lt;p&gt;По умолчанию поля внутри &lt;code&gt;oneof&lt;/code&gt;-группы соответствуют YTsaurus-типу &lt;a href=\"user-guide/storage/data-types.html#schema_variant\"&gt;variant&lt;/a&gt;. Например, сообщение ниже будет соответствовать структуре с полями &lt;code&gt;x&lt;/code&gt; типа &lt;code&gt;int64&lt;/code&gt; и &lt;code&gt;my_oneof&lt;/code&gt; типа &lt;code&gt;variant&amp;lt;y: string, z: bool&amp;gt;&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs protobuf\"&gt;&lt;span class=\"hljs-keyword\"&gt;message &lt;/span&gt;&lt;span class=\"hljs-title class_\"&gt;TMessage&lt;/span&gt; {\n    &lt;span class=\"hljs-keyword\"&gt;optional&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;int64&lt;/span&gt; x = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n    &lt;span class=\"hljs-keyword\"&gt;oneof&lt;/span&gt; my_oneof {\n        &lt;span class=\"hljs-type\"&gt;string&lt;/span&gt; y = &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;;\n        &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; z = &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;;\n    }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"200\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-200\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-200\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-200.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;При выводе схемы с помощью &lt;code&gt;CreateTableSchema&amp;lt;T&amp;gt;()&lt;/code&gt; будет выведен аналогичный тип.&lt;/p&gt;\n&lt;p&gt;Чтобы группы &lt;code&gt;oneof&lt;/code&gt; соответствовали полям структуры, в которой они описаны, используйте флаг &lt;code&gt;(NYT.oneof_flags) = SEPARATE_FIELDS&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs protobuf\"&gt;&lt;span class=\"hljs-keyword\"&gt;message &lt;/span&gt;&lt;span class=\"hljs-title class_\"&gt;TMessage&lt;/span&gt; {\n    &lt;span class=\"hljs-keyword\"&gt;optional&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;int64&lt;/span&gt; x = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n    &lt;span class=\"hljs-keyword\"&gt;oneof&lt;/span&gt; my_oneof {\n        &lt;span class=\"hljs-keyword\"&gt;option&lt;/span&gt; (NYT.oneof_flags) = SEPARATE_FIELDS;\n        &lt;span class=\"hljs-type\"&gt;string&lt;/span&gt; y = &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;;\n        &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; z = &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;;\n    }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"207\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-207\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-207\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-207.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Этому сообщению будет соответствовать структура с опциональными полями &lt;code&gt;x&lt;/code&gt;, &lt;code&gt;y&lt;/code&gt; и &lt;code&gt;z&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"map\"&gt;&lt;a href=\"ru/api/cpp/protobuf.html#map\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поля map&lt;/span&gt;&lt;/a&gt;Поля map&lt;/h2&gt;\n&lt;p&gt;Существует 4 варианта отображения такого поля в столбец в таблице. См. пример ниже:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs protobuf\"&gt;&lt;span class=\"hljs-keyword\"&gt;message &lt;/span&gt;&lt;span class=\"hljs-title class_\"&gt;TValue&lt;/span&gt; {\n    &lt;span class=\"hljs-keyword\"&gt;optional&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;int64&lt;/span&gt; x = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n}\n\n&lt;span class=\"hljs-keyword\"&gt;message &lt;/span&gt;&lt;span class=\"hljs-title class_\"&gt;TMessage&lt;/span&gt; {\n    map&amp;lt;&lt;span class=\"hljs-type\"&gt;string&lt;/span&gt;, TValue&amp;gt; map_field = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt; [(NYT.flags) = SERIALIZATION_YT];\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"217\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-217\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-217\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-217.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Поле &lt;code&gt;map_field&lt;/code&gt; в зависимости от своих флагов может соответствовать:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;списку структур с полями &lt;code&gt;key&lt;/code&gt; типа &lt;code&gt; string&lt;/code&gt; и &lt;code&gt;value&lt;/code&gt; типа &lt;code&gt;string&lt;/code&gt;, в котором будет лежать сериализованный protobuf &lt;code&gt;TValue&lt;/code&gt; (как будто у поля &lt;code&gt;value&lt;/code&gt; выставлен флаг &lt;code&gt;SERIALIZATION_PROTOBUF&lt;/code&gt;). По умолчанию в этом случае установлен флаг &lt;code&gt;MAP_AS_LIST_OF_STRUCTS_LEGACY&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;списку структур с полями &lt;code&gt;key&lt;/code&gt; типа &lt;code&gt;string&lt;/code&gt; и &lt;code&gt;value&lt;/code&gt; типа &lt;code&gt;Struct&amp;lt;x: Int64&amp;gt;&lt;/code&gt; (как будто у поля &lt;code&gt;value&lt;/code&gt; выставлен флаг &lt;code&gt;SERIALIZATION_PROTOBUF&lt;/code&gt;). По умолчанию в этом случае установлен флаг &lt;code&gt;MAP_AS_LIST_OF_STRUCTS&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;словарю &lt;code&gt;Dict&amp;lt;String, Struct&amp;lt;x: Int64&amp;gt;&amp;gt;&amp;gt;&lt;/code&gt;: флаг &lt;code&gt;MAP_AS_DICT&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;опциональному словарю &lt;code&gt;Optional&amp;lt;Dict&amp;lt;String, Struct&amp;lt;x: Int64&amp;gt;&amp;gt;&amp;gt;&amp;gt;&lt;/code&gt;: флаг &lt;code&gt;MAP_AS_OPTIONAL_DICT&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"flags\"&gt;&lt;a href=\"ru/api/cpp/protobuf.html#flags\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Флаги&lt;/span&gt;&lt;/a&gt;Флаги&lt;/h2&gt;\n&lt;p&gt;С помощью флагов можно настроить поведение protobuf. Для этого необходимо подключить библиотечный &lt;code&gt;.proto&lt;/code&gt; файл.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs protobuf\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"yt/yt_proto/yt/formats/extension.proto\"&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"249\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-249\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-249\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-249.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Флаги могут соответствовать сообщениям, &lt;code&gt;oneof&lt;/code&gt;-группам и полям сообщений.&lt;/p&gt;\n&lt;p&gt;Указывать флаги можно на уровне &lt;code&gt;.proto&lt;/code&gt; файла, сообщения, &lt;code&gt;oneof&lt;/code&gt;-группы и поля сообщения.&lt;/p&gt;\n&lt;h3 id=\"serialization\"&gt;&lt;a href=\"ru/api/cpp/protobuf.html#serialization\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SERIALIZATION_YT, SERIALIZATION_PROTOBUF&lt;/span&gt;&lt;/a&gt;SERIALIZATION_YT, SERIALIZATION_PROTOBUF&lt;/h3&gt;\n&lt;p&gt;Поведение этих флагов описано &lt;a href=\"ru/api/cpp/protobuf.html#embedded\"&gt;выше&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;По умолчанию там, где это актуально, подразумевается &lt;code&gt;SERIALIZATION_PROTOBUF&lt;/code&gt;. Есть возможность поменять флаг для одного сообщения:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs protobuf\"&gt;&lt;span class=\"hljs-keyword\"&gt;message &lt;/span&gt;&lt;span class=\"hljs-title class_\"&gt;TMyMessage&lt;/span&gt;\n{\n    &lt;span class=\"hljs-keyword\"&gt;option&lt;/span&gt; (NYT.default_field_flags) = SERIALIZATION_YT;\n    ...\n}\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"265\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-265\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-265\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-265.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"other_columns\"&gt;&lt;a href=\"ru/api/cpp/protobuf.html#other_columns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;OTHER_COLUMNS&lt;/span&gt;&lt;/a&gt;OTHER_COLUMNS&lt;/h3&gt;\n&lt;p&gt;Флагом &lt;code&gt;OTHER_COLUMNS&lt;/code&gt; можно пометить поле типа &lt;code&gt;bytes&lt;/code&gt;. В это поле помещается YSON-мап, содержащий представления всех полей, которые не описываются другими полями этой protobuf-структуры.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs protobuf\"&gt;&lt;span class=\"hljs-keyword\"&gt;message &lt;/span&gt;&lt;span class=\"hljs-title class_\"&gt;TMyMessage&lt;/span&gt;\n{\n    ...\n    &lt;span class=\"hljs-keyword\"&gt;optional&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;bytes&lt;/span&gt; OtherColumns = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt; [(NYT.flags) = OTHER_COLUMNS];\n    ...\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"272\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-272\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-272\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-272.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"enum_int\"&gt;&lt;a href=\"ru/api/cpp/protobuf.html#enum_int\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ENUM_STRING / ENUM_INT&lt;/span&gt;&lt;/a&gt;ENUM_STRING / ENUM_INT&lt;/h3&gt;\n&lt;p&gt;Флагами &lt;code&gt;ENUM_STRING&lt;/code&gt; / &lt;code&gt;ENUM_INT&lt;/code&gt; можно помечать поля типа &lt;code&gt;enum&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Если поле помечено &lt;code&gt;ENUM_INT&lt;/code&gt;, то оно будет сохраняться в колонку в виде целого числа.&lt;/li&gt;\n&lt;li&gt;Если поле помечено &lt;code&gt;ENUM_STRING&lt;/code&gt;, то оно будет сохраняться в колонку в виде строки.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;По умолчанию подразумевается &lt;code&gt;ENUM_STRING&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs protobuf\"&gt;&lt;span class=\"hljs-keyword\"&gt;enum &lt;/span&gt;&lt;span class=\"hljs-title class_\"&gt;Color&lt;/span&gt;\n{\n    WHITE = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n    BLUE = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n    RED = -&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n}\n\n...\n&lt;span class=\"hljs-keyword\"&gt;optional&lt;/span&gt; Color ColorField = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt; [(NYT.flags) = ENUM_INT];\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"294\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-294\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-294\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-294.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"any\"&gt;&lt;a href=\"ru/api/cpp/protobuf.html#any\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ANY&lt;/span&gt;&lt;/a&gt;ANY&lt;/h3&gt;\n&lt;p&gt;Флагом &lt;code&gt;ANY&lt;/code&gt; можно помечать поля типа &lt;code&gt;bytes&lt;/code&gt;. Такие поля содержат YSON-представление колонки любого простого типа.&lt;br /&gt;\nНапример, для колонки типа &lt;code&gt;string&lt;/code&gt; можно написать следующий код:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs protobuf\"&gt;&lt;span class=\"hljs-comment\"&gt;// message.proto&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;message &lt;/span&gt;&lt;span class=\"hljs-title class_\"&gt;TMyMessage&lt;/span&gt;\n{\n    ...\n    &lt;span class=\"hljs-keyword\"&gt;optional&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;bytes&lt;/span&gt; AnyColumn = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt; [(NYT.flags) = ANY];\n    ...\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"301\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-301\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-301\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-301.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=
