        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В некоторых YTsaurus-операциях вычисления настолько просты, что заводить для каждой из них класс с использованием &lt;a href=\"api/cpp/description.html\"&gt;C++ API&lt;/a&gt; кажется излишним. В этом случае можно воспользоваться для описания операций &lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9B%D1%8F%D0%BC%D0%B1%D0%B4%D0%B0-%D0%B2%D1%8B%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;лямбда-выражениями&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В данный момент такие лямбда-выражения не могут захватывать переменные, т. е. должны иметь пустой capture-блок, что делает их эквивалентными C-функциям. Это связано с тем, что в современном C++ лямбду общего вида правильно сериализовать проблематично. Чтобы передать в лямбду какие-нибудь параметры, иногда можно использовать &lt;code&gt;static const&lt;/code&gt; и глобальные переменные &lt;a href=\"ru/api/cpp/lambda.html#saveable\"&gt;TSaveable&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Это работает только из программ, статически собранных под Linux. Настройками вроде &lt;code&gt;JobBinaryLocalPath&lt;/code&gt; пользоваться нельзя.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"ispolzovanie-biblioteki-yt_lambda\"&gt;&lt;a href=\"ru/api/cpp/lambda.html#ispolzovanie-biblioteki-yt_lambda\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование библиотеки yt_lambda&lt;/span&gt;&lt;/a&gt;Использование библиотеки yt_lambda&lt;/h2&gt;\n&lt;p&gt;Подключите библиотеку &lt;a href=\"https://github.com/ytsaurus/ytsaurus/blob/main/yt/cpp/mapreduce/library/lambda/yt_lambda.h\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;yt_lambda&lt;/a&gt; и включите в программу заголовок:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;#include yt/cpp/mapreduce/library/lambda/yt_lambda.h\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"29\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-29\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-29\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-29.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;a href=\"api/cpp/description.html#init\"&gt;Инициализируйте YTsaurus&lt;/a&gt; и получите &lt;code&gt;client&lt;/code&gt;. Передавайте &lt;code&gt;client&lt;/code&gt; или &lt;a href=\"api/cpp/description.html#transactions\"&gt;транзакцию&lt;/a&gt; первым параметром в описанные в данном документе функции.&lt;/p&gt;\n&lt;p&gt;Функции этой библиотеки хорошо сочетаются с использованием записей в формате &lt;a href=\"api/cpp/protobuf.html\"&gt;protobuf&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"obshij-vzglyad-na-operacii\"&gt;&lt;a href=\"ru/api/cpp/lambda.html#obshij-vzglyad-na-operacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общий взгляд на операции&lt;/span&gt;&lt;/a&gt;Общий взгляд на операции&lt;/h2&gt;\n&lt;p&gt;В этой библиотеке все операции принимают на вход выраженные лямбдами операторы над одной записью, которые затем многократно применяются. В целом операцию можно также представить себе в виде цепочки преобразований типов:&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/lambda-normal-op.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;h3 id=\"additivnye-additive-operacii\"&gt;&lt;a href=\"ru/api/cpp/lambda.html#additivnye-additive-operacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аддитивные (additive) операции&lt;/span&gt;&lt;/a&gt;Аддитивные (additive) операции&lt;/h3&gt;\n&lt;p&gt;Вариант обычных операций, где &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt; имеет на входе и выходе один и тот же тип, а также ассоциативен. В этом случае можно дополнительно упростить реализацию Reduce-преобразования, а также бесплатно использовать ее в качестве combiner.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"images/lambda-additive-op.png\" alt=\"\" class=\"center\" /&gt;&lt;/p&gt;\n&lt;h2 id=\"copyif\"&gt;&lt;a href=\"ru/api/cpp/lambda.html#copyif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CopyIf&lt;/span&gt;&lt;/a&gt;CopyIf&lt;/h2&gt;\n&lt;p&gt;Данная функция фильтрует записи в таблице без их изменения.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;template&lt;/span&gt; &amp;lt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;T&lt;/span&gt;&amp;gt;\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;CopyIf&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; IClientBasePtr&amp;amp; client, &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TRichYPath&amp;amp; from, &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TRichYPath&amp;amp; to, &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; (*p)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; T&amp;amp;))&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"60\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-60\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-60\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-60.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;T&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип записи (TNode или конкретный тип &lt;a href=\"api/cpp/protobuf.html\"&gt;protobuf-сообщения&lt;/a&gt;)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя входной таблицы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;to&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя выходной таблицы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;p&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Фильтрующий предикат&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Замечания:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Порядок записей в таблице не меняется, специально выставляется флаг &lt;code&gt;Ordered&lt;/code&gt;, который может немного замедлить операцию.&lt;/li&gt;\n&lt;li&gt;Известная недоработка: если входная таблица одна, имеет схему и отсортирована, до схемы выходной таблицы информация о сортировке не доходит.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"primer-ispolzovaniya\"&gt;&lt;a href=\"ru/api/cpp/lambda.html#primer-ispolzovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример использования&lt;/span&gt;&lt;/a&gt;Пример использования&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;NYT::&lt;span class=\"hljs-built_in\"&gt;CopyIf&lt;/span&gt;&amp;lt;TMyProtoMsg&amp;gt;(client, &lt;span class=\"hljs-string\"&gt;\"//home/project/inTable\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//home/project/outTable\"&lt;/span&gt;,\n    [](&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; rec) { &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; rec.&lt;span class=\"hljs-built_in\"&gt;GetSomeField&lt;/span&gt;() &amp;gt; &lt;span class=\"hljs-number\"&gt;10000&lt;/span&gt;; });\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"125\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-125\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-125\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-125.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"transformcopyif,-ili-map\"&gt;&lt;a href=\"ru/api/cpp/lambda.html#transformcopyif,-ili-map\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TransformCopyIf, или Map&lt;/span&gt;&lt;/a&gt;TransformCopyIf, или Map&lt;/h2&gt;\n&lt;p&gt;Данная функция делает классический &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt;, т. е. читает каждую запись из таблицы одного формата и пишет ее в таблицу другого формата. Некоторые записи не попадают в конечную таблицу.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;template&lt;/span&gt; &amp;lt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;R&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;W&lt;/span&gt;&amp;gt;\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;TransformCopyIf&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; IClientBasePtr&amp;amp; client, &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TRichYPath&amp;amp; from, &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TRichYPath&amp;amp; to, &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; (*mapper)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; R&amp;amp;, W&amp;amp;))&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"132\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-132\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-132\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-132.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;R&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип входной записи (TNode или конкретный тип protobuf-сообщения)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;W&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип выходной записи (TNode или конкретный тип protobuf-сообщения)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя входной таблицы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;to&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя выходной таблицы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;mapper&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Функция преобразования, принимающая на вход запись &lt;code&gt;src&lt;/code&gt; типа &lt;code&gt;R&lt;/code&gt; и заполняющая запись &lt;code&gt;dst&lt;/code&gt; типа &lt;code&gt;W&lt;/code&gt;. Чтобы &lt;code&gt;dst&lt;/code&gt; записалось, надо вернуть &lt;code&gt;true&lt;/code&gt;. По соображениям производительности, библиотека передает в качестве &lt;code&gt;dst&lt;/code&gt; одну и ту же переменную-буфер, которая между вызовами &lt;code&gt;mapper&lt;/code&gt; даже не очищается. Как правило, это не проблема, т. к. &lt;code&gt;mapper&lt;/code&gt; обычно заполняет одни и те же поля &lt;code&gt;dst&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Замечание:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Порядок записей в таблице не меняется, специально выставляется флаг &lt;code&gt;Ordered&lt;/code&gt;, который может немного замедлить операцию.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"primer-ispolzovaniya1\"&gt;&lt;a href=\"ru/api/cpp/lambda.html#primer-ispolzovaniya1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример использования&lt;/span&gt;&lt;/a&gt;Пример использования&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;NYT::&lt;span class=\"hljs-built_in\"&gt;TransformCopyIf&lt;/span&gt;&amp;lt;TDataMsg, TStatsMsg&amp;gt;(\n    client, &lt;span class=\"hljs-string\"&gt;\"//home/project/inTable\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//home/project/outTable\"&lt;/span&gt;,\n    [](&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; src, &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; dst) {\n        dst.&lt;span class=\"hljs-built_in\"&gt;SetField&lt;/span&gt;(src.&lt;span class=\"hljs-built_in\"&gt;GetField&lt;/span&gt;());\n        &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    });\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"200\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-200\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-200\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-200.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"additivereduce\"&gt;&lt;a href=\"ru/api/cpp/lambda.html#additivereduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AdditiveReduce&lt;/span&gt;&lt;/a&gt;AdditiveReduce&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;template&lt;/span&gt; &amp;lt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;T&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TFin&lt;/span&gt;&amp;gt;\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;AdditiveReduce&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; IClientBasePtr&amp;amp; client,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TKeyBase&amp;lt;TRichYPath&amp;gt;&amp;amp; from,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TRichYPath&amp;amp; to,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TKeyColumns&amp;amp; reduceFields,\n    &lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; (*reducer)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; T&amp;amp;, T&amp;amp;),\n    &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; (*finalizer)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; T&amp;amp;, TFin&amp;amp;))&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"204\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-204\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-204\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-204.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;T&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип входной и выходной записи для reducer (TNode или конкретный тип protobuf-сообщения)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;TFin&lt;/code&gt;Opt&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Опциональный параметр.&lt;/strong&gt; Тип выходной записи (TNode или конкретный тип protobuf-сообщения). &lt;span style=\"color:green\"&gt;&lt;strong&gt;Указывается только в варианте с finalizer&lt;/strong&gt;&lt;/span&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя входной таблицы (таблиц)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;to&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя выходной таблицы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;reduceFields&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;По одинаковым значениям каких ключей сортируем и делаем свертку (Reduce)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;reducer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Функция преобразования, принимающая на вход новую запись &lt;code&gt;src&lt;/code&gt; типа &lt;code&gt;T&lt;/code&gt; и модифицирующая запись &lt;code&gt;dst&lt;/code&gt; того же типа &lt;code&gt;T&lt;/code&gt;. В &lt;code&gt;dst&lt;/code&gt; изначально закладывается первая запись текущего диапазона записей с одинаковыми &lt;code&gt;reduceFields&lt;/code&gt;-ключами. Если в текущем диапазоне одна запись, &lt;code&gt;reducer&lt;/code&gt; вызываться не будет. В поля &lt;code&gt;dst&lt;/code&gt;, соответствующие ключам, ничего писать не нужно — там уже всё готово&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;finalizer&lt;/code&gt;Opt&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Опциональный параметр.&lt;/strong&gt; Функция преобразования, принимающая на вход новую запись &lt;code&gt;src&lt;/code&gt; типа &lt;code&gt;T&lt;/code&gt; и заполняющая запись &lt;code&gt;dst&lt;/code&gt; типа &lt;code&gt;TFin&lt;/code&gt;. Вызывается один раз после обработки Reduce диапазона входных записей для формирования конечного варианта выходной записи. &lt;code&gt;dst&lt;/code&gt; изначально инициализируется по умолчанию. В поля &lt;code&gt;dst&lt;/code&gt;, соответствующие ключам, ничего писать не нужно — там уже всё готово&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"reduce\"&gt;&lt;a href=\"ru/api/cpp/lambda.html#reduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reduce&lt;/span&gt;&lt;/a&gt;Reduce&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;template&lt;/span&gt; &amp;lt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;R&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;W&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TFin&lt;/span&gt;&amp;gt;\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;Reduce&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; IClientBasePtr&amp;amp; client,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TKeyBase&amp;lt;TRichYPath&amp;gt;&amp;amp; from,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TRichYPath&amp;amp; to,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TKeyColumns&amp;amp; reduceFields,\n    &lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; (*reducer)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; R&amp;amp;, W&amp;amp;),\n    &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; (*finalizer)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; W&amp;amp;, TFin&amp;amp;))&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"278\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-278\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-278\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-278.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;R&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип входной записи (TNode или конкретный тип protobuf-сообщения)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;W&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип выходной записи reducer'а (TNode или protobuf)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;TFin&lt;/code&gt;Opt&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Опциональный параметр.&lt;/strong&gt; Тип выходной записи (TNode или конкретный тип protobuf-сообщения). &lt;span style=\"color:green\"&gt;&lt;strong&gt;Указывается только в варианте с finalizer&lt;/strong&gt;&lt;/span&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя входной таблицы (таблиц)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;to&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя выходной таблицы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;reduceFields&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;По одинаковым значениям каких ключей сортируем и делаем свертку (Reduce)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;reducer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Функция преобразования, принимающая на вход новую запись &lt;code&gt;src&lt;/code&gt; типа &lt;code&gt;R&lt;/code&gt; и модифицирующая запись &lt;code&gt;dst&lt;/code&gt; типа &lt;code&gt;W&lt;/code&gt;. &lt;code&gt;dst&lt;/code&gt; изначально инициализируется по умолчанию (в случае TNode будет пустая TNode, т. е. &lt;code&gt;Undefined&lt;/code&gt;; protobuf обычно инициализируется нулями и пустыми строчками, что делает его более пригодным). В поля &lt;code&gt;dst&lt;/code&gt;, соответствующие ключам, ничего писать не нужно — там уже всё готово&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;finalizer&lt;/code&gt;Opt&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Опциональный параметр.&lt;/strong&gt; Функция преобразования, принимающая на вход новую запись &lt;code&gt;src&lt;/code&gt; типа &lt;code&gt;W&lt;/code&gt; и заполняющая запись &lt;code&gt;dst&lt;/code&gt; типа &lt;code&gt;TFin&lt;/code&gt;. Вызывается один раз после обработки reduce'ом диапазона входных записей для формирования финального варианта выходной записи. &lt;code&gt;dst&lt;/code&gt; изначально инициализируется по умолчанию. В поля &lt;code&gt;dst&lt;/code&gt;, соответствующие ключам, ничего писать не нужно — там уже всё готово&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"additive_mapreduce\"&gt;&lt;a href=\"ru/api/cpp/lambda.html#additive_mapreduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AdditiveMapReduce[Sorted]&lt;/span&gt;&lt;/a&gt;AdditiveMapReduce[Sorted]&lt;/h2&gt;\n&lt;p&gt;Функция &lt;code&gt;AdditiveMapReduce&lt;/code&gt; делает слитную &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce-операцию&lt;/a&gt;, т. е. преобразует записи входной таблицы (или таблиц), сортирует полученное и делает Reduce. При этом reducer должен быть &lt;a href=\"https://ru.wikipedia.org/wiki/%D0%90%D1%81%D1%81%D0%BE%D1%86%D0%B8%D0%B0%D1%82%D0%B8%D0%B2%D0%BD%D0%B0%D1%8F_%D0%BE%D0%BF%D0%B5%D1%80%D0%B0%D1%86%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ассоциативной бинарной операцией&lt;/a&gt; над записями одинакового типа — обычно это сложение чисел. В качестве бонуса YT может использовать такой reducer в качестве combiner, если нужно.&lt;/p&gt;\n&lt;p&gt;К сожалению, слитные операции MapReduce в YT всегда производят неотсортированную таблицу. Для этого предназначена функция &lt;code&gt;AdditiveMapReduceSorted&lt;/code&gt;, которая вызывает &lt;code&gt;AdditiveMapReduce&lt;/code&gt;, а потом сортирует выходную таблицу.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;template&lt;/span&gt; &amp;lt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;R&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;W&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TFin&lt;/span&gt;&amp;gt;\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;AdditiveMapReduce&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; IClientBasePtr&amp;amp; client,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TKeyBase&amp;lt;TRichYPath&amp;gt;&amp;amp; from,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TRichYPath&amp;amp; to,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TKeyColumns&amp;amp; reduceFields,\n    &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; (*mapper)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; R&amp;amp;, W&amp;amp;),\n    &lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; (*reducer)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; W&amp;amp;, W&amp;amp;),\n    &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; (*finalizer)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; W&amp;amp;, TFin&amp;amp;))&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"366\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-366\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-366\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-366.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;R&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип входной записи (TNode или конкретный тип protobuf-сообщения)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;W&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип выходной записи для reducer (TNode или конкретный тип protobuf-сообщения)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;TFin&lt;/code&gt;Opt&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Опциональный параметр.&lt;/strong&gt; Тип выходной записи (TNode или конкретный тип protobuf-сообщения). &lt;span style=\"color:green\"&gt;&lt;strong&gt;Указывается только в варианте с finalizer&lt;/strong&gt;&lt;/span&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя входной таблицы (таблиц)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;to&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя выходной таблицы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;reduceFields&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;По одинаковым значениям каких ключей сортируем и делаем свертку (Reduce)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;mapper&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Функция преобразования, принимающая на вход запись &lt;code&gt;src&lt;/code&gt; типа &lt;code&gt;R&lt;/code&gt; и заполняющая запись &lt;code&gt;dst&lt;/code&gt; типа &lt;code&gt;W&lt;/code&gt;. Чтобы &lt;code&gt;dst&lt;/code&gt; записалось, надо вернуть &lt;code&gt;true&lt;/code&gt;. &lt;code&gt;mapper&lt;/code&gt; может быть &lt;code&gt;nullptr&lt;/code&gt;. По соображениям производительности, библиотека передает в качестве &lt;code&gt;dst&lt;/code&gt; одну и туже переменную-буфер, которая между вызовами &lt;code&gt;mapper&lt;/code&gt; даже не очищается. Как правило, это не проблема, т. к. &lt;code&gt;mapper&lt;/code&gt; обычно заполняет одни и те же поля &lt;code&gt;dst&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;reducer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Функция преобразования, принимающая на вход новую запись &lt;code&gt;src&lt;/code&gt; типа &lt;code&gt;W&lt;/code&gt; и модифицирующая запись &lt;code&gt;dst&lt;/code&gt; того же типа &lt;code&gt;W&lt;/code&gt;. В &lt;code&gt;dst&lt;/code&gt; изначально кладется первая запись текущего диапазона записей с одинаковыми &lt;code&gt;reduceFields&lt;/code&gt;-ключами. Если в текущем диапазоне одна запись, &lt;code&gt;reducer&lt;/code&gt; не будет вызываться. В поля &lt;code&gt;dst&lt;/code&gt;, соответствующие ключам, ничего писать не нужно — там уже всё готово&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;finalizer&lt;/code&gt;Opt&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Опциональный параметр.&lt;/strong&gt; Функция преобразования, принимающая на вход новую запись &lt;code&gt;src&lt;/code&gt; типа &lt;code&gt;W&lt;/code&gt; и заполняющая запись &lt;code&gt;dst&lt;/code&gt; типа &lt;code&gt;TFin&lt;/code&gt;. Вызывается один раз после обработки reduce'ом диапазона входных записей для формирования финального варианта выходной записи. &lt;code&gt;dst&lt;/code&gt; изначально инициализируется по умолчанию. В поля &lt;code&gt;dst&lt;/code&gt;, соответствующие ключам, ничего писать не нужно — там уже всё готово&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"primer-ispolzovaniya2\"&gt;&lt;a href=\"ru/api/cpp/lambda.html#primer-ispolzovaniya2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример использования&lt;/span&gt;&lt;/a&gt;Пример использования&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;NYT::&lt;span class=\"hljs-built_in\"&gt;AdditiveMapReduceSorted&lt;/span&gt;&amp;lt;TDataMsg, TStatsMsg&amp;gt;(\n    client,\n    inTable, &lt;span class=\"hljs-comment\"&gt;// or inTables&lt;/span&gt;\n    outTable,\n    &lt;span class=\"hljs-string\"&gt;\"name\"&lt;/span&gt;, &lt;span class=\"hljs-comment\"&gt;// sort key, matches TStatsMsg::Name&lt;/span&gt;\n    [](&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; src, &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; dst) {\n        &lt;span class=\"hljs-comment\"&gt;// dst is a buffer that may contain garbage.&lt;/span&gt;\n        &lt;span class=\"hljs-comment\"&gt;// We don't need to clear it because we set all fields.&lt;/span&gt;\n        dst.&lt;span class=\"hljs-built_in\"&gt;SetName&lt;/span&gt;(src.&lt;span class=\"hljs-built_in\"&gt;GetSomeField&lt;/span&gt;());\n        dst.&lt;span class=\"hljs-built_in\"&gt;SetCount&lt;/span&gt;(src.&lt;span class=\"hljs-built_in\"&gt;GetSomeCountField&lt;/span&gt;());\n        &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n    },\n    [](&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; src, &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; dst) {\n        &lt;span class=\"hljs-comment\"&gt;// dst is initialized by the first record of equal key range.&lt;/span&gt;\n        &lt;span class=\"hljs-comment\"&gt;// This lambda function is called starting from the 2nd record.&lt;/span&gt;\n        &lt;span class=\"hljs-comment\"&gt;// dst.Name is filled with correct value and must not be modified.&lt;/span&gt;\n        dst.&lt;span class=\"hljs-built_in\"&gt;SetCount&lt;/span&gt;(src.&lt;span class=\"hljs-built_in\"&gt;GetCount&lt;/span&gt;() + dst.&lt;span class=\"hljs-built_in\"&gt;GetCount&lt;/span&gt;());\n    });\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"456\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-456\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-456\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-456.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"mapreduce\"&gt;&lt;a href=\"ru/api/cpp/lambda.html#mapreduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MapReduce[Sorted]&lt;/span&gt;&lt;/a&gt;MapReduce[Sorted]&lt;/h2&gt;\n&lt;p&gt;Функция MapReduce производит слитную MapReduce-операцию, т. е. преобразует записи входной таблицы (или таблиц), сортирует полученное и делает Reduce. При этом в отличие от &lt;a href=\"ru/api/cpp/lambda.html#additive_mapreduce\"&gt;AdditiveMapReduce&lt;/a&gt;, функция reducer не обязана быть ассоциативной, поэтому у нее могут быть разные типы записей на входе и на выходе (что не дает ее использовать в качестве combiner'а). Для большей чистоты выхода можно использовать дополнительную лямбду — finalizer, которая вызовется на результате работы reducer для формирования окончательного варианта записи.&lt;/p&gt;\n&lt;p&gt;К сожалению, слитные операции MapReduce в YT всегда производят неотсортированную таблицу. Для этого приспособлена функция &lt;code&gt;MapReduceSorted&lt;/code&gt;, которая вызывает &lt;code&gt;MapReduce&lt;/code&gt;, а потом сортирует выходную таблицу.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;template&lt;/span&gt; &amp;lt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;R&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TMapped&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TReducerData&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;W&lt;/span&gt;&amp;gt;\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;MapReduce&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; IClientBasePtr&amp;amp; client,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TKeyBase&amp;lt;TRichYPath&amp;gt;&amp;amp; from,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TRichYPath&amp;amp; to,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TKeyColumns&amp;amp; reduceFields,\n    &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; (*mapper)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; R&amp;amp; src, TMapped&amp;amp; dst),\n    &lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; (*reducer)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TMapped&amp;amp; src, TReducerData&amp;amp; dst),\n    &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; (*finalizer)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TReducerData&amp;amp; src, W&amp;amp; dst))&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"466\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-466\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-466\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-466.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;R&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип входной записи (TNode или конкретный тип protobuf-сообщения)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;TMapped&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип выходной записи для mapper и входной для reducer (TNode или protobuf)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;TReducerData&lt;/code&gt;Opt&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Опциональный параметр.&lt;/strong&gt; Тип выходной записи — для reducer, входной — для finalizer (любой тип, в том числе C++ структура). &lt;span style=\"color:green\"&gt;&lt;strong&gt;Указывается только в варианте MapReduce с finalizer&lt;/strong&gt;&lt;/span&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;W&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип выходной записи (TNode или конкретный тип protobuf-сообщения)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя входной таблицы (таблиц)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;to&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя выходной таблицы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;reduceFields&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;По одинаковым значениям каких ключей сортируем и делаем свертку (Reduce)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;mapper&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Функция преобразования, принимающая на вход запись &lt;code&gt;src&lt;/code&gt; типа &lt;code&gt;R&lt;/code&gt; и заполняющая запись &lt;code&gt;dst&lt;/code&gt; типа &lt;code&gt;TMapped&lt;/code&gt;. Чтобы &lt;code&gt;dst&lt;/code&gt; записалось, надо вернуть &lt;code&gt;true&lt;/code&gt;. &lt;code&gt;mapper&lt;/code&gt; может быть &lt;code&gt;nullptr&lt;/code&gt;. По соображениям производительности, библиотека передает в качестве &lt;code&gt;dst&lt;/code&gt; одну и туже переменную-буфер, которая между вызовами &lt;code&gt;mapper&lt;/code&gt; даже не очищается. Как правило, это не проблема, т. к. &lt;code&gt;mapper&lt;/code&gt; обычно заполняет одни и те же поля &lt;code&gt;dst&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;reducer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Функция преобразования, принимающая на вход новую запись &lt;code&gt;src&lt;/code&gt; типа &lt;code&gt;TMapped&lt;/code&gt; и модифицирующая запись &lt;code&gt;dst&lt;/code&gt; типа &lt;code&gt;W&lt;/code&gt; (или &lt;code&gt;TReducerData&lt;/code&gt; при использовании finalizer). &lt;code&gt;dst&lt;/code&gt; изначально инициализируется по умолчанию (в случае TNode будет пустая TNode, т. е. &lt;code&gt;Undefined&lt;/code&gt;; protobuf обычно инициализируется нулями и пустыми строчками, что делает его более пригодным). В поля &lt;code&gt;dst&lt;/code&gt;, соответствующие ключам, ничего писать не нужно — там уже всё готово&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;finalizer&lt;/code&gt;Opt&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Опциальный параметр.&lt;/strong&gt; Функция преобразования, принимающая на вход новую запись &lt;code&gt;src&lt;/code&gt; типа &lt;code&gt;TReducerData&lt;/code&gt; и заполняющая запись &lt;code&gt;dst&lt;/code&gt; типа &lt;code&gt;W&lt;/code&gt;. Вызывается один раз после обработки reducer диапазона входных записей для формирования конечного варианта выходной записи. &lt;code&gt;dst&lt;/code&gt; изначально инициализируется по умолчанию. В поля &lt;code&gt;dst&lt;/code&gt;, соответствующие ключам, ничего писать не нужно — там уже всё готово&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"mapreduce_example\"&gt;&lt;a href=\"ru/api/cpp/lambda.html#mapreduce_example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример использования&lt;/span&gt;&lt;/a&gt;Пример использования&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;message TSimpleKeyValue {\n    required string Key = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;          [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;];\n    required uint64 Value = &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;        [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;];\n}\n\nmessage TKeyStat {\n    required string Key = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;          [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;];\n    required &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; Mean = &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;         [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"mean\"&lt;/span&gt;];\n    required &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; Sigma = &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;        [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"sigma\"&lt;/span&gt;];\n}message TSimpleKeyValue {\n    required string Key = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;          [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;];\n    required uint64 Value = &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;        [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;];\n}\n\nmessage TKeyStat {\n    required string Key = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;          [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;];\n    required &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; Mean = &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;         [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"mean\"&lt;/span&gt;];\n    required &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; Sigma = &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;        [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"sigma\"&lt;/span&gt;];\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"564\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-564\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-564\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-564.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;struct&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TDispersionData&lt;/span&gt; {\n    ui64 Count = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n    &lt;span class=\"hljs-type\"&gt;long&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; Sum = &lt;span class=\"hljs-number\"&gt;0.&lt;/span&gt;;\n    &lt;span class=\"hljs-type\"&gt;long&lt;/span&gt; &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; SumSquared = &lt;span class=\"hljs-number\"&gt;0.&lt;/span&gt;;\n};\n\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;CalculateDispersion&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(IClientPtr&amp;amp; client, TString input, TString output)&lt;/span&gt; &lt;/span&gt;{\n    NYT::&lt;span class=\"hljs-built_in\"&gt;MapReduceSorted&lt;/span&gt;&amp;lt;TDataMsg, TSimpleKeyValue, TDispersionData, TKeyStat&amp;gt;(\n        client,\n        input,\n        output,\n        &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;,\n        [](&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; src, &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; dst) { &lt;span class=\"hljs-comment\"&gt;// mapper&lt;/span&gt;\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetName&lt;/span&gt;(src.&lt;span class=\"hljs-built_in\"&gt;GetSomeField&lt;/span&gt;());\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetCount&lt;/span&gt;(src.&lt;span class=\"hljs-built_in\"&gt;GetSomeCountField&lt;/span&gt;());\n            &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n        },\n        [](&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; src, &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; dst) { &lt;span class=\"hljs-comment\"&gt;// reducer&lt;/span&gt;\n            &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; value = src.&lt;span class=\"hljs-built_in\"&gt;GetValue&lt;/span&gt;();\n            dst.Count++;\n            dst.Sum += value;\n            dst.SumSquared += value * value;\n        },\n        [](&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; src, &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; dst) { &lt;span class=\"hljs-comment\"&gt;// finalizer&lt;/span&gt;\n            &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; mean = (&lt;span class=\"hljs-type\"&gt;double&lt;/span&gt;)src.Sum / src.Count;\n            &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; dispersion = (&lt;span class=\"hljs-type\"&gt;double&lt;/span&gt;)src.SumSquared / src.Count - mean * mean;\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetMean&lt;/span&gt;(mean);\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetSigma&lt;/span&gt;(std::&lt;span class=\"hljs-built_in\"&gt;sqrt&lt;/span&gt;(dispersion));\n        });\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"565\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-565\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-565\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-565.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"mapreduce_combined\"&gt;&lt;a href=\"ru/api/cpp/lambda.html#mapreduce_combined\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MapReduceCombined[Sorted]&lt;/span&gt;&lt;/a&gt;MapReduceCombined[Sorted]&lt;/h2&gt;\n&lt;p&gt;Функция MapReduceCombined делает слитную MapReduce-операцию, т. е. преобразует записи входной таблицы (или таблиц), сортирует полученное и делает Reduce аналогично &lt;a href=\"ru/api/cpp/lambda.html#mapreduce\"&gt;MapReduce&lt;/a&gt; — но теперь уже с обязательно включенным combiner'ом. Для большей чистоты выхода можно использовать дополнительную лямбду — finalizer, которая вызовется на результате работы reducer для формирования окончательного варианта записи.&lt;/p&gt;\n&lt;p&gt;К сожалению, слитные операции MapReduce в YT всегда производят неотсортированную таблицу. Для этого приспособлена функция &lt;code&gt;MapReduceCombinedSorted&lt;/code&gt;, которая вызывает &lt;code&gt;MapReduceCombined&lt;/code&gt;, а потом сортирует выходную таблицу.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;template&lt;/span&gt; &amp;lt;&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;R&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TMapped&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;W&lt;/span&gt;, &lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TFin&lt;/span&gt;&amp;gt;\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;MapReduceCombined&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; IClientBasePtr&amp;amp; client,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TKeyBase&amp;lt;TRichYPath&amp;gt;&amp;amp; from,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TRichYPath&amp;amp; to,\n    &lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TKeyColumns&amp;amp; reduceFields,\n    &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; (*mapper)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; R&amp;amp;, TMapped&amp;amp;),\n    &lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; (*combiner)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; TMapped&amp;amp;, W&amp;amp;),\n    &lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; (*reducer)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; W&amp;amp;, W&amp;amp;),\n    &lt;span class=\"hljs-type\"&gt;bool&lt;/span&gt; (*finalizer)(&lt;span class=\"hljs-type\"&gt;const&lt;/span&gt; W&amp;amp;, TFin&amp;amp;))&lt;/span&gt;&lt;/span&gt;;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"575\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-575\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-575\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-575.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Параметр&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;R&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип входной записи (TNode или конкретный тип protobuf-сообщения)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;TMapped&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Тип выходной записи для mapper, входной для reducer (TNode или protobuf)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;W&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Выходной тип для combiner, входной для reducer и finalizer (TNode или конкретный тип protobuf)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;TFin&lt;/code&gt;Opt&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Опциональный параметр.&lt;/strong&gt; Тип выходной записи finalizer (TNode или конкретный тип protobuf-сообщения). &lt;span style=\"color:green\"&gt;&lt;strong&gt;Указывается только в варианте с finalizer&lt;/strong&gt;&lt;/span&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;from&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя входной таблицы (таблиц)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;to&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя выходной таблицы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;reduceFields&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;По одинаковым значениям каких ключей сортируем и делаем свертку (Reduce)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;mapper&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Функция преобразования, принимающая на вход запись &lt;code&gt;src&lt;/code&gt; типа &lt;code&gt;R&lt;/code&gt; и заполняющая запись &lt;code&gt;dst&lt;/code&gt; типа &lt;code&gt;TMapped&lt;/code&gt;. Чтобы &lt;code&gt;dst&lt;/code&gt; записалось, надо вернуть &lt;code&gt;true&lt;/code&gt;. &lt;code&gt;mapper&lt;/code&gt; может быть &lt;code&gt;nullptr&lt;/code&gt;. По соображениям производительности библиотека передает в качестве &lt;code&gt;dst&lt;/code&gt; одну и туже переменную-буфер, которая между вызовами &lt;code&gt;mapper&lt;/code&gt; даже не очищается. Как правило, это не проблема, т. к. &lt;code&gt;mapper&lt;/code&gt; обычно заполняет одни и те же поля &lt;code&gt;dst&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;combiner&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Функция преобразования, принимающая на вход новую запись &lt;code&gt;src&lt;/code&gt; типа &lt;code&gt;TMapped&lt;/code&gt; и модифицирующая запись &lt;code&gt;dst&lt;/code&gt; типа &lt;code&gt;W&lt;/code&gt;. Фактически делает то, что в &lt;a href=\"ru/api/cpp/lambda.html#mapreduce\"&gt;MapReduce&lt;/a&gt; делает reducer. &lt;code&gt;dst&lt;/code&gt; изначально инициализируется по умолчанию (в случае TNode будет пустая TNode, т.е. &lt;code&gt;Undefined&lt;/code&gt;; protobuf обычно инициализируется нулями и пустыми строчками, что делает его более пригодным). В поля &lt;code&gt;dst&lt;/code&gt;, соответствующие ключам, ничего писать не нужно — там уже всё готово&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;reducer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ассоциативная функция преобразования, принимающая на вход новую запись &lt;code&gt;src&lt;/code&gt; и модифицирующая запись &lt;code&gt;dst&lt;/code&gt; одинакового типа &lt;code&gt;W&lt;/code&gt;. В &lt;code&gt;dst&lt;/code&gt; изначально кладется первая запись текущего диапазона записей с одинаковыми &lt;code&gt;reduceFields&lt;/code&gt;-ключами. Если в текущем диапазоне одна запись, &lt;code&gt;reducer&lt;/code&gt; вообще зваться не будет. В поля &lt;code&gt;dst&lt;/code&gt;, соответствующие ключам, ничего писать не нужно — там уже всё готово&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;finalizer&lt;/code&gt;Opt&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;Опциональный параметр.&lt;/strong&gt; Функция преобразования, принимающая на вход новую запись &lt;code&gt;src&lt;/code&gt; типа &lt;code&gt;W&lt;/code&gt; и заполняющая запись &lt;code&gt;dst&lt;/code&gt; типа &lt;code&gt;TFin&lt;/code&gt;. Вызывается один раз после обработки Reduce диапазона входных записей для формирования конечного варианта выходной записи. &lt;code&gt;dst&lt;/code&gt; изначально инициализируется по умолчанию. В поля &lt;code&gt;dst&lt;/code&gt;, соответствующие ключам, ничего писать не нужно — там уже всё готово&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"primer-ispolzovaniya3\"&gt;&lt;a href=\"ru/api/cpp/lambda.html#primer-ispolzovaniya3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример использования&lt;/span&gt;&lt;/a&gt;Пример использования&lt;/h3&gt;\n&lt;p&gt;В дополнение к protobuf-сообщениям, определенным в &lt;a href=\"ru/api/cpp/lambda.html#mapreduce_example\"&gt;примере для MapReduce&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;message TDispersionDataMsg {\n    required string Key = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;          [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;];\n    required uint64 Count = &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;        [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"count\"&lt;/span&gt;];\n    required &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; Sum = &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;          [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"sum\"&lt;/span&gt;];\n    required &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; SumSquared = &lt;span class=\"hljs-number\"&gt;4&lt;/span&gt;   [(NYT.column_name) = &lt;span class=\"hljs-string\"&gt;\"sum_squared\"&lt;/span&gt;];\n};\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"684\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-684\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-684\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-684.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Сама функция:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;void&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;CalculateDispersionWithCombiner&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;(IClientPtr&amp;amp; client, TString input, TString output)&lt;/span&gt; &lt;/span&gt;{\n    NYT::&lt;span class=\"hljs-built_in\"&gt;MapReduceCombinedSorted&lt;/span&gt;&amp;lt;TDataMsg, TSimpleKeyValue, TDispersionDataMsg, TKeyStat&amp;gt;(\n        client,\n        input,\n        output,\n        &lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;,\n        [](&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; src, &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; dst) { &lt;span class=\"hljs-comment\"&gt;// mapper&lt;/span&gt;\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetName&lt;/span&gt;(src.&lt;span class=\"hljs-built_in\"&gt;GetSomeField&lt;/span&gt;());\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetCount&lt;/span&gt;(src.&lt;span class=\"hljs-built_in\"&gt;GetSomeCountField&lt;/span&gt;());\n            &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt;;\n        },\n        [](&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; src, &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; dst) { &lt;span class=\"hljs-comment\"&gt;// combiner&lt;/span&gt;\n            &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; value = src.&lt;span class=\"hljs-built_in\"&gt;GetValue&lt;/span&gt;();\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetCount&lt;/span&gt;(dst.&lt;span class=\"hljs-built_in\"&gt;GetCount&lt;/span&gt;() + &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;);\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetSum&lt;/span&gt;(dst.&lt;span class=\"hljs-built_in\"&gt;GetSum&lt;/span&gt;() + value);\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetSumSquared&lt;/span&gt;(dst.&lt;span class=\"hljs-built_in\"&gt;GetSumSquared&lt;/span&gt;() + value * value);\n        },\n        [](&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; src, &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; dst) { &lt;span class=\"hljs-comment\"&gt;// reducer&lt;/span&gt;\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetCount&lt;/span&gt;(src.&lt;span class=\"hljs-built_in\"&gt;GetCount&lt;/span&gt;() + dst.&lt;span class=\"hljs-built_in\"&gt;GetCount&lt;/span&gt;());\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetSum&lt;/span&gt;(src.&lt;span class=\"hljs-built_in\"&gt;GetSum&lt;/span&gt;() + dst.&lt;span class=\"hljs-built_in\"&gt;GetSum&lt;/span&gt;());\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetSumSquared&lt;/span&gt;(src.&lt;span class=\"hljs-built_in\"&gt;GetSumSquared&lt;/span&gt;() + dst.&lt;span class=\"hljs-built_in\"&gt;GetSumSquared&lt;/span&gt;());\n        },\n        [](&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; src, &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; dst) { &lt;span class=\"hljs-comment\"&gt;// finalizer&lt;/span&gt;\n            &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; mean = src.&lt;span class=\"hljs-built_in\"&gt;GetSum&lt;/span&gt;() / src.&lt;span class=\"hljs-built_in\"&gt;GetCount&lt;/span&gt;();\n            &lt;span class=\"hljs-type\"&gt;double&lt;/span&gt; dispersion = src.&lt;span class=\"hljs-built_in\"&gt;GetSumSquared&lt;/span&gt;() / src.&lt;span class=\"hljs-built_in\"&gt;GetCount&lt;/span&gt;() - mean * mean;\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetMean&lt;/span&gt;(mean);\n            dst.&lt;span class=\"hljs-built_in\"&gt;SetSigma&lt;/span&gt;(std::&lt;span class=\"hljs-built_in\"&gt;sqrt&lt;/span&gt;(dispersion));\n        });\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"688\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-688\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-688\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-688.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"o-vybore-mezhdu-mapreduce-i-mapreducecombined\"&gt;&lt;a href=\"ru/api/cpp/lambda.html#o-vybore-mezhdu-mapreduce-i-mapreducecombined\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;О выборе между MapReduce и MapReduceCombined&lt;/span&gt;&lt;/a&gt;О выборе между MapReduce и MapReduceCombined&lt;/h3&gt;\n&lt;p&gt;Функция &lt;code&gt;AdditiveMapReduce&lt;/code&gt;, которая тоже предоставляет combiner, оставляет за YT выбор того, использовать combiner или нет. Функция &lt;code&gt;MapReduceCombined&lt;/code&gt; всегда заставляет систему использовать combiner, даже когда без него было бы эффективнее — т. к. иначе лямбды в этой функции было бы затруднительно писать из-за того, что на вход в reducer могли бы приходить разные типы записей (от map и от combine).&lt;/p&gt;\n&lt;p&gt;В целом наблюдаемый эффект такой: операции &lt;code&gt;MapReduceCombined&lt;/code&gt; потребляют на кластере на несколько процентов CPU больше, чем полностью идентичные MapReduce, но завершаются заметно быстрее. Поскольку использовать &lt;a href=\"ru/api/cpp/lambda.html#mapreduce_combined\"&gt;MapReduceCombined&lt;/a&gt; так же просто, как &lt;a href=\"ru/api/cpp/lambda.html#mapreduce\"&gt;MapReduce&lt;/a&gt;, есть смысл пробовать оба варианта на стадии разработки и оставлять лучший.&lt;/p&gt;\n&lt;h2 id=\"smeshivaem-lyambdy-s-obychnym-api\"&gt;&lt;a href=\"ru/api/cpp/lambda.html#smeshivaem-lyambdy-s-obychnym-api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Смешиваем лямбды с обычным API&lt;/span&gt;&lt;/a&gt;Смешиваем лямбды с обычным API&lt;/h2&gt;\n&lt;p&gt;Может возникнуть ситуация, когда хочется использовать лямбду при стандартном вызове операций через методы &lt;code&gt;IClientBase&lt;/code&gt;. Например, написали mapper в виде развесистого класса, а reducer остался простым. Тогда есть смысл напрямую использовать классы-обертки с названиями (&lt;code&gt;TCopyIfMapper&lt;/code&gt;, &lt;code&gt;TTransformMapper&lt;/code&gt;, &lt;code&gt;TAdditiveReducer&lt;/code&gt; и т. п.).&lt;/p&gt;\n&lt;h3 id=\"lambdas_mixed_example\"&gt;&lt;a href=\"ru/api/cpp/lambda.html#lambdas_mixed_example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt; createReducer = []() {\n    &lt;span class=\"hljs-keyword\"&gt;return&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;new&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;TAdditiveReducer&lt;/span&gt;&amp;lt;TOutStatsProto&amp;gt;([](&lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; src, &lt;span class=\"hljs-keyword\"&gt;auto&lt;/span&gt;&amp;amp; dst) {\n        dst.&lt;span class=\"hljs-built_in\"&gt;SetCount&lt;/span&gt;(src.&lt;span class=\"hljs-built_in\"&gt;GetCount&lt;/span&gt;() + dst.&lt;span class=\"hljs-built_in\"&gt;GetCount&lt;/span&gt;());\n    });\n};\n\nclient-&amp;gt;&lt;span class=\"hljs-built_in\"&gt;MapReduce&lt;/span&gt;(\n    &lt;span class=\"hljs-built_in\"&gt;TMapReduceOperationSpec&lt;/span&gt;()\n        .&lt;span class=\"hljs-built_in\"&gt;AddInput&lt;/span&gt;&amp;lt;TInputProto&amp;gt;(inTable)\n        .&lt;span class=\"hljs-built_in\"&gt;AddOutput&lt;/span&gt;&amp;lt;TOutStatsProto&amp;gt;(outTable)\n        .&lt;span class=\"hljs-built_in\"&gt;ReduceBy&lt;/span&gt;(fields),\n    &lt;span class=\"hljs-keyword\"&gt;new&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;TMyComplicatedMapper&lt;/span&gt;(),\n    &lt;span class=\"hljs-built_in\"&gt;createReducer&lt;/span&gt;(), &lt;span class=\"hljs-comment\"&gt;// combiner&lt;/span&gt;\n    &lt;span class=\"hljs-built_in\"&gt;createReducer&lt;/span&gt;(), &lt;span class=\"hljs-comment\"&gt;// reducer&lt;/span&gt;\n    &lt;span class=\"hljs-built_in\"&gt;TOperationOptions&lt;/span&gt;().&lt;span class=\"hljs-built_in\"&gt;Spec&lt;/span&gt;(&lt;span class=\"hljs-built_in\"&gt;TNode&lt;/span&gt;()(&lt;span class=\"hljs-string\"&gt;\"map_selectivity_factor\"&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;0.005&lt;/span&gt;)));\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"707\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-707\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-707\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-707.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"saveable\"&gt;&lt;a href=\"ru/api/cpp/lambda.html#saveable\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TSaveable — глобальные переменные, доступные из лямбда-операций&lt;/span&gt;&lt;/a&gt;TSaveable — глобальные переменные, доступные из лямбда-операций&lt;/h2&gt;\n&lt;p&gt;Если завести глобальную переменную типа &lt;code&gt;NYT::TSaveable&amp;lt;TYourStruct&amp;gt;&lt;/code&gt;, где для &lt;code&gt;TYourStruct&lt;/code&gt; доступна сериализация варианта &lt;code&gt;ysaveload&lt;/code&gt;, то все функции выше, описанные в библиотеке &lt;code&gt;yt_lambda&lt;/code&gt;, в начале своей работы сохранят переменную в состоянии джоба и восстановят ее на кластере перед выполнением джоба.&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs c++\"&gt;&lt;span class=\"hljs-keyword\"&gt;struct&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;TGlobalSettings&lt;/span&gt; {\n    TString MailSuffix;\n    &lt;span class=\"hljs-built_in\"&gt;Y_SAVELOAD_DEFINE&lt;/span&gt;(MailSuffix);\n};\nNYT::TSaveable&amp;lt;TGlobalSettings&amp;gt; GlobalSettings;\n&lt;span class=\"hljs-function\"&gt;&lt;span class=\"hljs-type\"&gt;int&lt;/span&gt; &lt;span class=\"hljs-title\"&gt;main&lt;/span&gt;&lt;span class=\"hljs-params\"&gt;()&lt;/span&gt; &lt;/span&gt;{\n    GlobalSettings.MailSuffix = &lt;span class=\"hljs-string\"&gt;\"@domain-name\"&lt;/span&gt;;\n    ...\n    &lt;span class=\"hljs-comment\"&gt;/// use GlobalSettings.MailSuffix in lambda&lt;/span&gt;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"717\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-717\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-717\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-717.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;В обычных (не лямбда) операциях содержимое &lt;code&gt;TSaveable&lt;/code&gt;, конечно, не сохраняется. Т.е. в &lt;a href=\"ru/api/cpp/lambda.html#lambdas_mixed_example\"&gt;примере выше&lt;/a&gt; из класса &lt;code&gt;TMyComplicatedMapper&lt;/code&gt; нельзя использовать &lt;code&gt;TSaveable&lt;/code&gt;-переменную, а из лямбды, заведенной внутри &lt;code&gt;createReducer()&lt;/code&gt; - можно. При необходимости можно вручную разместить вызовы &lt;code&gt;TSaveablesRegistry::Get()-&amp;gt;SaveAll(stream)&lt;/code&gt; и &lt;code&gt;LoadAll(stream) &lt;/code&gt;в функциях &lt;code&gt;Save&lt;/code&gt; и &lt;code&gt;Load&lt;/code&gt; вашего mapper или reducer.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Не используйте &lt;code&gt;TSaveable&lt;/code&gt;, если модификация этих глобальных переменных и запуск операций могут случиться из разных потоков (иначе будет data race и crash).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Можно завести только по одной переменной &lt;code&gt;TSaveable&lt;/code&gt; от каждого пользовательского типа. Это сделано специально и пока исправляться не будет.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/api/cpp/lambda.md","sourcePath":"ru/api/cpp/lambda.md"},"headings":[{"title":"Использование библиотеки yt_lambda","href":"ru/api/cpp/lambda.html#ispolzovanie-biblioteki-yt_lambda","level":2},{"title":"Общий взгляд на операции","href":"ru/api/cpp/lambda.html#obshij-vzglyad-na-operacii","level":2,"items":[{"title":"Аддитивные (additive) операции","href":"ru/api/cpp/lambda.html#additivnye-additive-operacii","level":3}]},{"title":"CopyIf","href":"ru/api/cpp/lambda.html#copyif","level":2,"items":[{"title":"Пример использования","href":"ru/api/cpp/lambda.html#primer-ispolzovaniya","level":3}]},{"title":"TransformCopyIf, или Map","href":"ru/api/cpp/lambda.html#transformcopyif,-ili-map","level":2,"items":[{"title":"Пример использования","href":"ru/api/cpp/lambda.html#primer-ispolzovaniya1","level":3}]},{"title":"AdditiveReduce","href":"ru/api/cpp/lambda.html#additivereduce","level":2},{"title":"Reduce","href":"ru/api/cpp/lambda.html#reduce","level":2},{"title":"AdditiveMapReduce[Sorted]","href":"ru/api/cpp/lambda.html#additive_mapreduce","level":2,"items":[{"title":"Пример использования","href":"ru/api/cpp/lambda.html#primer-ispolzovaniya2","level":3}]},{"title":"MapReduce[Sorted]","href":"ru/api/cpp/lambda.html#mapreduce","level":2,"items":[{"title":"Пример использования","href":"ru/api/cpp/lambda.html#mapreduce_example","level":3}]},{"title":"MapReduceCombined[Sorted]","href":"ru/api/cpp/lambda.html#mapreduce_combined","level":2,"items":[{"title":"Пример использования","href":"ru/api/cpp/lambda.html#primer-ispolzovaniya3","level":3},{"title":"О выборе между MapReduce и MapReduceCombined","href":"ru/api/cpp/lambda.html#o-vybore-mezhdu-mapreduce-i-mapreducecombined","level":3}]},{"title":"Смешиваем лямбды с обычным API","href":"ru/api/cpp/lambda.html#smeshivaem-lyambdy-s-obychnym-api","level":2,"items":[{"title":"Пример","href":"ru/api/cpp/lambda.html#lambdas_mixed_example","level":3}]},{"title":"TSaveable — глобальные переменные, доступные из лямбда-операций","href":"ru/api/cpp/lambda.html#saveable","level":2}],"title":"Лямбда-выражения"},"router":{"pathname":"ru/api/cpp/lambda","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003
