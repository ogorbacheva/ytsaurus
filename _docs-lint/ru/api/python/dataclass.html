            {"data":{"leading":false,"html":"&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Датаклассы поддерживаются только в Python 3.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Основной способ представления строк таблицы — это классы с полями, которые размечены типами (аналог &lt;a href=\"https://docs.python.org/3/library/dataclasses.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;dataclasses&lt;/a&gt;). См. также &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/python/examples/dataclass_typed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;пример&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"motivation\"&gt;&lt;a href=\"ru/api/python/dataclass.html#motivation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мотивация&lt;/span&gt;&lt;/a&gt;Мотивация&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Удобство: так как система скалярных типов YTsaurus более богатая, чем в Python, разметка типами помогает явно выразить желаемые типы колонок. Ещё лучше видно удобство при работе со сложными типами, например, структурами.&lt;/li&gt;\n&lt;li&gt;Строгая типизация позволяет распознавать ошибки в коде до того, как они приведут к появлению некорректных данных и другим неприятным эффектам. В этом также могут помогать линтеры и IDE.&lt;/li&gt;\n&lt;li&gt;Скорость: за счёт использования формата &lt;a href=\"user-guide/storage/skiff.html\"&gt;Skiff&lt;/a&gt; и некоторых других оптимизаций потребление CPU в несколько раз меньше, чем для нетипизированных данных.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"ustanovka\"&gt;&lt;a href=\"ru/api/python/dataclass.html#ustanovka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка&lt;/span&gt;&lt;/a&gt;Установка&lt;/h2&gt;\n&lt;p&gt;Для работы с модулем &lt;code&gt;yt.wrapper.schema&lt;/code&gt; установите пакеты:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;typing_extensions&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ytsaurus-yson&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;six&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"introduction\"&gt;&lt;a href=\"ru/api/python/dataclass.html#introduction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h2&gt;\n&lt;p&gt;Для работы с табличными данными нужно объявить класс с декоратором &lt;code&gt;yt.wrapper.yt_dataclass&lt;/code&gt; и разметить его поля типами. После двоеточия указывается тип поля. Это могут быть:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;встроенные типы в Python: &lt;code&gt;int&lt;/code&gt;, &lt;code&gt;float&lt;/code&gt;, &lt;code&gt;str&lt;/code&gt; и другие;&lt;/li&gt;\n&lt;li&gt;пользовательские классы с декоратором &lt;code&gt;@yt_dataclass&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;композитные типы из модуля &lt;a href=\"https://docs.python.org/3/library/typing.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;typing&lt;/a&gt;. Сейчас поддерживаются &lt;code&gt;List&lt;/code&gt;, &lt;code&gt;Dict&lt;/code&gt;, &lt;code&gt;Optional&lt;/code&gt;, &lt;code&gt;Tuple&lt;/code&gt;. В планах поддержка ряда других типов.&lt;/li&gt;\n&lt;li&gt;специальные типы из &lt;code&gt;yt.wrapper.schema&lt;/code&gt;: &lt;code&gt;Int8&lt;/code&gt;, &lt;code&gt;Uint16&lt;/code&gt;, &lt;code&gt;OtherColumns&lt;/code&gt; и другие (более полный список &lt;a href=\"ru/api/python/dataclass.html#types\"&gt;ниже&lt;/a&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-meta\"&gt;@yt.wrapper.yt_dataclass&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;class&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;Row&lt;/span&gt;:\n    &lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt;: &lt;span class=\"hljs-built_in\"&gt;int&lt;/span&gt;\n    name: &lt;span class=\"hljs-built_in\"&gt;str&lt;/span&gt;\n    is_robot: &lt;span class=\"hljs-built_in\"&gt;bool&lt;/span&gt; = &lt;span class=\"hljs-literal\"&gt;False&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"87\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-87\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-87\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-87.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Для описанного таким образом класса будут сгенерированы конструктор и прочие служебные методы, в частности, &lt;code&gt;__eq__&lt;/code&gt; и &lt;code&gt;__repr__&lt;/code&gt;. Для некоторых полей можно указать значение по умолчанию. Оно попадёт в сигнатуру конструктора. Объект данного класса можно создавать обычным образом: &lt;code&gt;row = Row(id=123, name=\"foo\")&lt;/code&gt;. При этом для всех полей, для которых не указаны значения по умолчанию (как для &lt;code&gt;robot: bool = False&lt;/code&gt;), необходимо передать соответствующие поля в конструктор, иначе будет порождено исключение.&lt;/p&gt;\n&lt;p&gt;Для датаклассов поддерживается наследование.&lt;/p&gt;\n&lt;p&gt;Имея такой класс, можно:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Создать таблицу с соответствующей схемой (можно просто начать писать в пустую или несуществующую таблицу или использовать функцию &lt;code&gt;TableSchema.from_row_type()&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;Писать и читать &lt;a href=\"api/python/userdoc.html#table_commands\"&gt;таблицы&lt;/a&gt;, &lt;a href=\"api/python/examples.html#read_write\"&gt;пример&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Запускать &lt;a href=\"api/python/userdoc.html#python_operations\"&gt;операции&lt;/a&gt;, &lt;a href=\"api/python/examples.html#simple_map\"&gt;пример&lt;/a&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Также можно создавать датаклассы на основе схемы таблицы явно или автоматически, читая структурированные данные&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt_table_schema = client.get(&lt;span class=\"hljs-string\"&gt;f\"&lt;span class=\"hljs-subst\"&gt;{table_path}&lt;/span&gt;/@schema\"&lt;/span&gt;)\ndataclass_type = yt.schema.make_dataclass_from_table_schema(yt.schema.TableSchema.from_yson_type(yt_table_schema))\n\n&lt;span class=\"hljs-comment\"&gt;# or&lt;/span&gt;\n\ntyped_table_data = &lt;span class=\"hljs-built_in\"&gt;list&lt;/span&gt;(client.read_table_structured(table=table_path, row_type=&lt;span class=\"hljs-literal\"&gt;None&lt;/span&gt;))\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"117\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-117\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-117\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-117.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"types\"&gt;&lt;a href=\"ru/api/python/dataclass.html#types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Специальные типы&lt;/span&gt;&lt;/a&gt;Специальные типы&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;code&gt;yt.wrapper.schema&lt;/code&gt;&lt;/th&gt;\n&lt;th&gt;Python&lt;/th&gt;\n&lt;th&gt;Схема&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Int8,&lt;/code&gt; &lt;code&gt;Int16&lt;/code&gt;, &lt;code&gt;Int32&lt;/code&gt;, &lt;code&gt;Int64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int8&lt;/code&gt;, &lt;code&gt;int16&lt;/code&gt;, &lt;code&gt;int32&lt;/code&gt;, &lt;code&gt;int64&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;Uint8&lt;/code&gt;, &lt;code&gt;Uint16&lt;/code&gt;, &lt;code&gt;Uint32&lt;/code&gt;, &lt;code&gt;Uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint8&lt;/code&gt;, &lt;code&gt;uint16&lt;/code&gt;, &lt;code&gt;uint32&lt;/code&gt;, &lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;YsonBytes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bytes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;yson&lt;/code&gt;/&lt;code&gt;any&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;OtherColumns&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;OtherColumns&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Соответствует нескольким колонкам.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/api/python/dataclass.md","sourcePath":"ru/api/python/dataclass.md"},"headings":[{"title":"Мотивация","href":"ru/api/python/dataclass.html#motivation","level":2},{"title":"Установка","href":"ru/api/python/dataclass.html#ustanovka","level":2},{"title":"Введение","href":"ru/api/python/dataclass.html#introduction","level":2},{"title":"Специальные типы","href":"ru/api/python/dataclass.html#types","level":2}],"title":"Датаклассы"},"router":{"pathname":"ru/api/python/dataclass","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
