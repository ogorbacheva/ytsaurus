        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе приведено описание планировщика (scheduler) YTsaurus, вводятся понятия пула (pool), дерева пулов (pool_tree), рассматривается процесс планирования вычислений, приводится пример вычисления fair share ratio и описание работы вытеснения (preemption).&lt;/p&gt;\n&lt;h2 id=\"obshie-svedeniya\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/scheduler-and-pools.html#obshie-svedeniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общие сведения&lt;/span&gt;&lt;/a&gt;Общие сведения&lt;/h2&gt;\n&lt;p&gt;Планировщик  — часть системы, которая отвечает за распределение ресурсов между операциями и определение очередности, в которой операции будут выполняться. В системе YTsaurus используется иерархический &lt;a href=\"http://en.wikipedia.org/wiki/Fair-share_scheduling\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;fair_share&lt;/a&gt; планировщик. Это означает, что ресурсы динамически распределяются между пользователями системы в соответствии с их гарантиями и приоритетом.&lt;/p&gt;\n&lt;p&gt;Пул — контейнер для ресурсов CPU и RAM, которыми оперирует планировщик. Когда пользователи запускают задачи в пулах, планировщик распределяет ресурсы между пулами. С помощью дерева пулов можно построить иерархическую систему распределения ресурсов.&lt;/p&gt;\n&lt;h2 id=\"resursy\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/scheduler-and-pools.html#resursy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ресурсы&lt;/span&gt;&lt;/a&gt;Ресурсы&lt;/h2&gt;\n&lt;p&gt;Планировщик оперирует следующими ресурсами:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;cpu&lt;/code&gt; — 1 CPU соответствует одному HyperThreading ядру на узле кластера. По умолчанию все пользовательские джобы заказывают при запуске одно ядро. Если джобы многопоточные, то можно увеличить количество заказанных ядер в настройках операции. В противном случае джобы процессов будут ограничены (throttling) таким образом, чтобы количество реально потребляемого процессорного времени соответствовало одному ядру;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;memory&lt;/code&gt; — ресурс для контроля потребления оперативной памяти на узле кластера в байтах;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;user_slots&lt;/code&gt; — ресурс для контроля числа джобов на узле кластера. Каждый джоб пользовательских операций всегда потребляют ровно один user_slot;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;network&lt;/code&gt; — ресурс для контроля потребления внутренней сети кластера операциями, активно использующими сеть. Например, сортировки. У единицы ресурса нет физического аналога, а автоматически выставляемые планировщиком значения для операций сортировки подобраны таким образом, чтобы джобы, запущенные на одном и том же узле кластера, не перегружали сетевой канал.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Для каждого пула и операции существует понятие доминантного ресурса. Доминантным ресурсом среди запрашиваемых ресурсов операции или пула считается тот вид ресурса, который имеет наибольшую долю относительно общего объёма соответствующего ресурса всего кластера.&lt;/p&gt;\n&lt;p&gt;Например: есть операция, для выполнения которой требуется 1 000 &lt;code&gt;cpu&lt;/code&gt; и 2 TiB &lt;code&gt;memory&lt;/code&gt;. При этом во всём кластере 50 000 &lt;code&gt;cpu&lt;/code&gt; и 180 TiB &lt;code&gt;memory&lt;/code&gt;. Тогда можно оценить, что 1 000 &lt;code&gt;cpu&lt;/code&gt; составляет 0.02 (2%) от общего числа &lt;code&gt;cpu&lt;/code&gt; в кластере, а 2 TiB составляет 0.011 (1.1%) от общего объёма &lt;code&gt;memory&lt;/code&gt; кластера. Доля &lt;code&gt;cpu&lt;/code&gt; больше доли &lt;code&gt;memory&lt;/code&gt;, поэтому для конкретной операции доминантным ресурсом является &lt;code&gt;cpu&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"scheduler\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/scheduler-and-pools.html#scheduler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Описание работы планировщика&lt;/span&gt;&lt;/a&gt;Описание работы планировщика&lt;/h2&gt;\n&lt;h3 id=\"puly-i-derevya-pulov\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/scheduler-and-pools.html#puly-i-derevya-pulov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пулы и деревья пулов&lt;/span&gt;&lt;/a&gt;Пулы и деревья пулов&lt;/h3&gt;\n&lt;p&gt;Планировщик YTsaurus хранит в памяти несколько деревьев пулов. Каждое дерево состоит из операций и вычислительных пулов. Узлами дерева являются вычислительные пулы, а операции — листьями. Каждая операция может принадлежать одному или нескольким деревьям.&lt;/p&gt;\n&lt;p&gt;Логически можно рассматривать каждое дерево как отдельный вычислительный кластер — каждому дереву принадлежит некоторое количество вычислительных узлов кластера, при этом узел кластера может принадлежать только одному дереву.&lt;/p&gt;\n&lt;p&gt;Деревья пулов хранятся в Кипарисе и настраиваются администратором системы YTsaurus. Дерево пулов представляет из себя узел &lt;code&gt;scheduler_pool_tree&lt;/code&gt; на первом уровне директории &lt;code&gt;//sys/pool_trees&lt;/code&gt; в Кипарисе. Описание пулов для дерева &lt;code&gt;&amp;lt;tree_id&amp;gt;&lt;/code&gt; представляет собой набор вложенных &lt;code&gt;scheduler_pool&lt;/code&gt;, находящихся в узле &lt;code&gt;//sys/pool_trees/&amp;lt;tree_id&amp;gt;&lt;/code&gt;. Характеристики пулов описываются в атрибутах соответствующих узлов.&lt;/p&gt;\n&lt;p&gt;Деревья, в которые попадет операция при запуске, определяются параметром &lt;code&gt;pool_trees&lt;/code&gt; в настройках операции. Если данный параметр не указан, то будет использовано одно дерево по умолчанию &lt;code&gt;default_pool_tree&lt;/code&gt;. Для каждого из перечисленных деревьев можно указать пул из этого дерева, в котором нужно запустить операцию (опция &lt;code&gt;scheduling_options_per_pool_tree&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;У каждого дерева пулов существует атрибут &lt;code&gt;default_parent_pool&lt;/code&gt;, указывающий на пул по умолчанию. Данный пул используется следующим образом: если в настройках операции для дерева или для всех деревьев пул указан не был, в дереве будет создан временный эфемерный пул с именем пользователя в YTsaurus, запустившего операцию. Пулы образуют иерархию &lt;code&gt;//sys/pool_trees/&amp;lt;tree_id&amp;gt;/&amp;lt;default_parent_pool&amp;gt;/&amp;lt;username&amp;gt;&lt;/code&gt;, в конечном узле которой и будет запущена операция.&lt;/p&gt;\n&lt;p&gt;Пример настройки для запуска операции в двух деревьях с указанием пула в одном из них:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;pool_trees = [default; cloud];\nscheduling_options_per_pool_tree = {\n    default = {\n        pool = cool_pool;\n    }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"70\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-70\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-70\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-70.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"process-planirovaniya-dzhoba\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/scheduler-and-pools.html#process-planirovaniya-dzhoba\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Процесс планирования джоба&lt;/span&gt;&lt;/a&gt;Процесс планирования джоба&lt;/h2&gt;\n&lt;p&gt;Каждая операция состоит из набора джобов. Джоб — это выполнение некоторой полезной работы над данными на одном из узлов кластера. Джоб является единицей планирования.&lt;/p&gt;\n&lt;p&gt;Планирование джобов происходит на каждом узле кластера отдельно:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Узел кластера присылает планировщику специальное сообщение (heartbeat), в котором указывает тип и объём свободных ресурсов, информацию о завершившихся и выполняющихся в данный момент джобах.&lt;/li&gt;\n&lt;li&gt;В ответ на сообщение планировщик принимает решение о запуске новых джобов и возможном прерывании уже запущенных. Планирование происходит в дереве, которому принадлежит узел кластера.&lt;/li&gt;\n&lt;li&gt;Все прерванные джобы в дальнейшем будут запущены заново.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Чтобы понять, какие джобы необходимо запустить, а какие прервать на конкретном узле кластера, планировщик анализирует дерево пулов. Каждый пул в дереве обладает рядом характеристик, которые позволяют планировщику понять, нуждается ли данное поддерево в запуске новых джобов, и, если нуждается, то насколько сильно. Согласно характеристикам пула, планировщик спускается по дереву сверху вниз, пока не достигнет листа. При достижении листа планировщик предлагает операции запустить джоб. Такие обходы планировщик делает до тех пор, пока есть незапланированные джобы и пока не будут исчерпаны ресурсы узла кластера.&lt;/p&gt;\n&lt;p&gt;Могут встречаться операции, которым планировщик выдал меньше ресурсов, чем обязан был гарантировать. Такие операции в системе называются &lt;a href=\"user-guide/data-processing/scheduler/preemption.html\"&gt;страдающими&lt;/a&gt; (starving). При обнаружении страдающей операции планировщик выбирает джоб с минимальным временем работы у нестрадающей операции на том же узле кластера и прерывает его.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Рассматриваемые при планировании характеристики операций и пулов являются глобальными, не зависящими от конкретного узла кластера. Например, важной характеристикой является доля ресурсов кластера, которую уже занимают выполняющиеся джобы операции (&lt;code&gt;usage_share&lt;/code&gt;).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/scheduler/scheduler-and-pools.md","sourcePath":"ru/user-guide/data-processing/scheduler/scheduler-and-pools.md"},"headings":[{"title":"Общие сведения","href":"ru/user-guide/data-processing/scheduler/scheduler-and-pools.html#obshie-svedeniya","level":2},{"title":"Ресурсы","href":"ru/user-guide/data-processing/scheduler/scheduler-and-pools.html#resursy","level":2},{"title":"Описание работы планировщика","href":"ru/user-guide/data-processing/scheduler/scheduler-and-pools.html#scheduler","level":2,"items":[{"title":"Пулы и деревья пулов","href":"ru/user-guide/data-processing/scheduler/scheduler-and-pools.html#puly-i-derevya-pulov","level":3}]},{"title":"Процесс планирования джоба","href":"ru/user-guide/data-processing/scheduler/scheduler-and-pools.html#process-planirovaniya-dzhoba","level":2}],"title":"Планировщик и пулы"},"router":{"pathname":"ru/user-guide/data-processing/scheduler/scheduler-and-pools","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
        </script>
