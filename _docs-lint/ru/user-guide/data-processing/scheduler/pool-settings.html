        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе рассмотрены характеристики и настройки деревьев пулов, пулов и операций.&lt;/p&gt;\n&lt;h2 id=\"pool_trees\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/pool-settings.html#pool_trees\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Характеристики деревьев пулов&lt;/span&gt;&lt;/a&gt;Характеристики деревьев пулов&lt;/h2&gt;\n&lt;p&gt;Дерево пулов имеет следующие атрибуты:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;nodes_filter&lt;/code&gt; — фильтр для выбора узлов кластера, принадлежащих дереву (подробнее читайте в разделе &lt;a href=\"admin-guide/node-tags.html\"&gt;Тегирование нод кластера&lt;/a&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_operation_count&lt;/code&gt; — значение по умолчанию для максимального числа одновременно запущенных (running + pending) операций в корневом пуле;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_operation_count_per_pool&lt;/code&gt; — значение по умолчанию для максимального числа одновременно запущенных операций в пуле. Может быть перезаписано настройкой на пуле;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_running_operation_count&lt;/code&gt;— значение по умолчанию для максимального числа одновременно выполняющихся (running) операций в корневом пуле;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_running_operation_count_per_pool&lt;/code&gt; — значение по умолчанию для максимального числа одновременно выполняющихся операций в пуле. Может быть перезаписано настройкой на пуле;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;default_parent_pool&lt;/code&gt; — пул по умолчанию, в котором будут запускаться операции, в спецификации которых не указан пул;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;enable_pool_starvation&lt;/code&gt; — разрешить «страдания» пулов (подробнее можно прочитать в разделе &lt;a href=\"user-guide/data-processing/scheduler/preemption.html\"&gt;Вытеснение&lt;/a&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;forbid_immediate_operations_in_root&lt;/code&gt; — разрешить запуск операций в корневом пуле дерева;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_ephemeral_pool_per_user&lt;/code&gt; — максимальное количество эфемерных пулов для каждого пользователя. Эфемерный пул — пул, который был указан в спецификации, но для которого нет явно заведенного узла в Кипарисе;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;fair_share_preemption_timeout&lt;/code&gt; — время пребывания операции ниже её fair_share, после которого для запуска джобов операции начнётся вытеснение;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;fair_share_starvation_tolerance&lt;/code&gt; — толерантность, используемая при сравнении usage-ratio с fair_share: операция считается страдающей, если &lt;code&gt;usage-ratio &amp;lt; fair_share * tolerance&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;non_preemptible_resource_usage_threshold&lt;/code&gt; — операция не будет участвовать в вытеснении (preemption), если ее потребление ресурсов будет меньше данного значения;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Атрибуты &lt;code&gt;fair_share_preemption_timeout&lt;/code&gt; и &lt;code&gt;fair_share_starvation_tolerance&lt;/code&gt; могут быть переопределены в спецификации операции.&lt;/p&gt;\n&lt;p&gt;Дерево представляет из себя объект &lt;code&gt;scheduler_pool_tree&lt;/code&gt; на первом уровне директории &lt;code&gt;//sys/pool_trees&lt;/code&gt; в Кипарисе. Атрибуты, перечисленные выше, являются атрибутами этого объекта. У узла &lt;code&gt;//sys/pool_trees&lt;/code&gt; имеется атрибут &lt;code&gt;default_tree&lt;/code&gt;, в котором можно указать дерево по умолчанию. Будет использовано для операций, у которых не указана опция &lt;code&gt;pool_trees&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"pools\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/pool-settings.html#pools\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Характеристики пулов &lt;/span&gt;&lt;/a&gt;Характеристики пулов &lt;/h2&gt;\n&lt;p&gt;Каждый пул (pool) обладает следующими характеристиками. В скобках указаны значения по умолчанию.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;weight&lt;/code&gt; (1) — действительное неотрицательное число, отвечающее за то, в какой пропорции данному поддереву необходимо предоставлять ресурсы родительского пула. В случае, когда у пула есть два дочерних пула с весами 2 и 1, ресурсы родителя будут делиться между ними в пропорции 2:1;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;strong_guarantee_resources&lt;/code&gt; — словарь, в котором записаны гарантированные ресурсы для данного пула (&lt;code&gt;user_slots&lt;/code&gt;, &lt;code&gt;cpu&lt;/code&gt;, &lt;code&gt;memory&lt;/code&gt;);&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стоит понимать, что гарантии будут выполнены только в том случае, если доминантный ресурс операции совпадает с гарантированным ресурсом.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;resource_limits&lt;/code&gt; — словарь, в котором описаны ограничения на различные ресурсы данного пула (&lt;code&gt;user_slots&lt;/code&gt;, &lt;code&gt;cpu&lt;/code&gt;, &lt;code&gt;memory&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;mode&lt;/code&gt; (fair_share) —  режим планирования, может принимать значения &lt;code&gt;fair_share&lt;/code&gt; или &lt;code&gt;fifo&lt;/code&gt;. В случае режима &lt;code&gt;fifo&lt;/code&gt;, джобы выдаются дочерним операциям в порядке лексикографической сортировки по значениям параметров, указанных в атрибуте &lt;code&gt;fifo_sort_parameters&lt;/code&gt; для данного пула. Например, если значение атрибута равно &lt;code&gt;[start_time]&lt;/code&gt;, джобы сперва будут выдаваться операциям с наименьшим временем старта;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_running_operation_count&lt;/code&gt; (8) — ограничение на число одновременно выполняющихся (running) операций в пуле. Операции сверх этого лимита будут вставать в очередь и находиться в состоянии pending;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_operation_count&lt;/code&gt; (50) — ограничение на число одновременно запущенных (running + pending) операций в пуле. При достижении указанного ограничения запуск новых операций в пуле будет завершаться с ошибкой;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;fifo_sort_parameters&lt;/code&gt; (start_time) — порядок запуска операций в FIFO пуле. По умолчанию операции сортируются сперва по весу, а затем по времени запуска. Данный параметр позволяет изменять порядок операций в очереди. Поддерживаемые значения: &lt;code&gt;start_time&lt;/code&gt; , &lt;code&gt;weight&lt;/code&gt;, &lt;code&gt;pending_job_count&lt;/code&gt;. По параметру &lt;code&gt;weight&lt;/code&gt; сортировка делается в обратном порядке, то есть операции с большим весом будут идти раньше, то есть иметь больший приоритет. Значение &lt;code&gt;pending_job_count&lt;/code&gt; позволяет приоритизировать маленькие операции (с малым количеством джобов);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;forbid_immediate_operations&lt;/code&gt; — запрещает запуск операций непосредственно в данном пуле, на запуск операций в подпулах не распространяется;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;create_ephemeral_subpools&lt;/code&gt; (false) — активирует режим, в котором для операций создается эфемерный подпул в данном пуле с именем &lt;code&gt;poolname$username&lt;/code&gt;, где &lt;code&gt;poolname&lt;/code&gt; имя текущего пула. Операция запускается в созданном эфемерном подпуле;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ephemeral_subpool_config&lt;/code&gt; — вложенная конфигурация эфемерных подпулов, создаваемых в текущем пуле. Имеет смысл, только если задана опция &lt;code&gt;create_ephemeral_subpools&lt;/code&gt;. В конфигурации можно указать &lt;code&gt;mode&lt;/code&gt;, &lt;code&gt;max_running_operation_count&lt;/code&gt;, &lt;code&gt;max_operation_count&lt;/code&gt;, &lt;code&gt;resource_limits&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;offloading_settings&lt;/code&gt; — настройка, отвечающая за отселение части джобов пула в другое дерево, наравне с тем деревом, в котором находится пул. Отселение джобов работает для операций, запущенных после того как была выставлена настройка. Пример настройки: &lt;code&gt;yt set //sys/pool_trees/&amp;lt;pool_tree&amp;gt;/&amp;lt;pool&amp;gt;/@offloading_settings '{&amp;lt;pool_tree_X&amp;gt;={pool=&amp;lt;pool_name_Y&amp;gt;}}'&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;У каждого пула имеется свое &lt;em&gt;уникальное&lt;/em&gt; (в рамках одного дерева) название. Имя выбранного для запуска операции пула отражается в настройках операции.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Параметры &lt;code&gt;max_running_operation_count&lt;/code&gt; и &lt;code&gt;max_operation_count&lt;/code&gt; задаются (явно или неявно) на всех уровнях иерархии пулов и проверяются также на всех уровнях иерархии. В частности, запуск новой операции в пуле P возможен, если и только если как в P, так и во всех его родителях (вплоть до корня) количество запущенных операций меньше заданного ограничения. Аналогично для ограничения &lt;code&gt;max_running_operation_count&lt;/code&gt;: операция в пуле P будет оставаться в состоянии pending до тех пор, пока в данном пуле или в каком-то из его родителей количество выполняющихся (running) операций больше либо равно ограничения &lt;code&gt;max_running_operation_count&lt;/code&gt;. На каждом уровне иерархии возможна переподписка указанных ограничений. Данное обстоятельство нужно учитывать при заказах и изменениях ограничений пользовательских пулов. Для того, чтобы гарантировать пулу определенное количество операций нужно убедиться, что на всех уровнях вплоть до корня переподписка отсутствует.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"operations\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/pool-settings.html#operations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Операции&lt;/span&gt;&lt;/a&gt;Операции&lt;/h3&gt;\n&lt;p&gt;Часть настроек, свойственных пулу, также доступна для операций и указывается в корне спецификации операции при запуске. К таким настройкам относятся: &lt;code&gt;weight&lt;/code&gt; и &lt;code&gt;resource_limits&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Например, можно указать в спецификации &lt;code&gt;resource_limits={user_slots=200}&lt;/code&gt;, в этом случае у операции будет запущено не более 200 джобов одновременно в каждом дереве.&lt;/p&gt;\n&lt;p&gt;Настройка &lt;code&gt;resource_limits&lt;/code&gt;, а также другие настройки могут быть заданы независимо для различных деревьев пулов.&lt;/p&gt;\n&lt;h2 id=\"dinamicheskie-harakteristiki-operacij-i-pulov\"&gt;&lt;a href=\"ru/user-guide/data-processing/scheduler/pool-settings.html#dinamicheskie-harakteristiki-operacij-i-pulov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Динамические характеристики операций и пулов&lt;/span&gt;&lt;/a&gt;Динамические характеристики операций и пулов&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Fair share ratio&lt;/code&gt; — доля ресурсов кластера, которая гарантирована данной операции (пулу) в данный момент. Сумма fair share всех операций не превосходит единицы;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Guaranteed ratio&lt;/code&gt; — доля ресурсов кластера, которая гарантирована операции (пулу) при максимальной загрузке кластера;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Usage ratio&lt;/code&gt; — доля ресурсов кластера, которую сейчас потребляет операция или пул: все выполняющиеся джобы операции или пула. Сумма usage ratio всех операций может быть больше единицы, так как операции могут потреблять разные ресурсы, в то время как доля вычисляется по доминантному ресурсу.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Starving&lt;/code&gt; — флаг, указывающий, страдает ли операция. При наличии страдающей операции планировщик попытается прервать джобы не страдающих операций: сделать вытеснение — preemption, чтобы запустить джобы данной операции;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Demand ratio&lt;/code&gt; — характеристика, показывающая долю всех ресурсов кластера, которая требуется операции или пулу для завершения вычислений;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Dominant resource&lt;/code&gt; — доминантный ресурс операции или пула — тот ресурс, доля которого от ресурсов всего кластера наибольшая.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Динамические характеристики операций считаются для каждого дерева отдельно. Соответственно, операция может иметь несколько &lt;code&gt;usage_share&lt;/code&gt; и так далее.&lt;/p&gt;\n&lt;p&gt;Объём ресурсов, который требуется операции для выполнения, подсчитывается путём суммирования потребностей всех джобов операции по каждому виду ресурсов.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/scheduler/pool-settings.md","sourcePath":"ru/user-guide/data-processing/scheduler/pool-settings.md"},"headings":[{"title":"Характеристики деревьев пулов","href":"ru/user-guide/data-processing/scheduler/pool-settings.html#pool_trees","level":2},{"title":"Характеристики пулов ","href":"ru/user-guide/data-processing/scheduler/pool-settings.html#pools","level":2,"items":[{"title":"Операции","href":"ru/user-guide/data-processing/scheduler/pool-settings.html#operations","level":3}]},{"title":"Динамические характеристики операций и пулов","href":"ru/user-guide/data-processing/scheduler/pool-settings.html#dinamicheskie-harakteristiki-operacij-i-pulov","level":2}],"title":"Характеристики пулов"},"router":{"pathname":"ru/user-guide/data-processing/scheduler/pool-settings","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
