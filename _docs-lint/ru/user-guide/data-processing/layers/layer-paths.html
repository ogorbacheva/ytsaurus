        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Образ корневой файловой системы содержит самодостаточный дистрибутив операционной системы, приложения и библиотеки для запуска пользовательской команды в изолированном контейнере.&lt;/p&gt;\n&lt;p&gt;В зависимости от настройки кластера (опция &lt;code&gt;exec_node/slot_manager/job_environment/type&lt;/code&gt; в файле конфигурации exec-нод) среда исполнения поддерживает различные форматы и источники образов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;simple&lt;/strong&gt; — не поддерживает изоляцию;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;cri&lt;/strong&gt; — Docker Image;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;porto&lt;/strong&gt; — Porto Layers, Docker Image из Internal Docker Registry.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"docker_images\"&gt;&lt;a href=\"ru/user-guide/data-processing/layers/layer-paths.html#docker_images\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Docker образы&lt;/span&gt;&lt;/a&gt;Docker образы&lt;/h2&gt;\n&lt;h3 id=\"terminologiya\"&gt;&lt;a href=\"ru/user-guide/data-processing/layers/layer-paths.html#terminologiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Терминология&lt;/span&gt;&lt;/a&gt;Терминология&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Docker Layer&lt;/strong&gt; — фрагмент данных образа корневой файловой системы;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Docker Image&lt;/strong&gt; — образ корневой файловой системы, состоящий из метаданных и упорядоченного множества слоёв;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Docker Registry&lt;/strong&gt; — сервер, хранящий и распространяющий данные и метаданные Docker образов;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Internal Docker Registry&lt;/strong&gt; — docker registry, хранящий образы непосредственно в &lt;a href=\"user-guide/storage/cypress.html\"&gt;Кипарисе&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Docker образ адресуется по имени в формате &lt;code&gt;[REGISTRY/]IMAGE[:TAG|@DIGEST]&lt;/code&gt;, где &lt;code&gt;REGISTRY&lt;/code&gt; это &lt;code&gt;FQDN[:PORT]&lt;/code&gt; сервера Docker Registry. Registry &lt;code&gt;FQDN&lt;/code&gt; должен иметь хотя бы одну \".\" или &lt;code&gt;PORT&lt;/code&gt;. &lt;code&gt;TAG&lt;/code&gt; по умолчанию &lt;strong&gt;latest&lt;/strong&gt;. &lt;a href=\"https://docs.docker.com/engine/reference/commandline/pull/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Подробнее&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;Docker образ без указания &lt;code&gt;REGISTRY&lt;/code&gt; считается образом из &lt;strong&gt;Internal Docker Registry&lt;/strong&gt;, где &lt;code&gt;IMAGE&lt;/code&gt; соответствует пути &lt;code&gt;//IMAGE&lt;/code&gt; в Кипарисе до директории с метаданными образа.&lt;/p&gt;\n&lt;p&gt;Internal Docker Registry доступен по стандартному протоколу docker registry для загрузки образов пользователями используя инструменты docker или совместимые с ними. Но не поддерживает адресацию docker image с указанием &lt;code&gt;DIGEST&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Для использования docker образов из &lt;a href=\"https://hub.docker.com\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Docker Hub&lt;/a&gt; нужно указать их полное имя в формате &lt;code&gt;docker.io/[library/]IMAGE[:TAG|@DIGEST]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Запуск с использованием docker образов из внешних docker registry требует наличия сетевого доступа до него от exec-нод кластера. Доступ к internal docker registry происходит внутри кластера.&lt;/p&gt;\n&lt;p&gt;Каждая exec-нода при запуске джоба скачивает образ себе в локальный кэш, следовательно крупный кластер может генерировать существенную нагрузку на docker registry.&lt;/p&gt;\n&lt;h3 id=\"docker_auth\"&gt;&lt;a href=\"ru/user-guide/data-processing/layers/layer-paths.html#docker_auth\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Авторизация&lt;/span&gt;&lt;/a&gt;Авторизация&lt;/h3&gt;\n&lt;p&gt;Секрет для доступа к приватному docker registry указывается с помощью ключа &lt;code&gt;docker_auth&lt;/code&gt; опции &lt;code&gt;secure_vault&lt;/code&gt;:&lt;br /&gt;\n&lt;code&gt;secure_vault = { docker_auth = { username = \"...\"; password = \"...\"; auth = \"...\"; }; }&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"porto_layers\"&gt;&lt;a href=\"ru/user-guide/data-processing/layers/layer-paths.html#porto_layers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Porto слои&lt;/span&gt;&lt;/a&gt;Porto слои&lt;/h2&gt;\n&lt;p&gt;В данном разделе собрана информация о Porto слоях.&lt;/p&gt;\n&lt;h3 id=\"terminologiya1\"&gt;&lt;a href=\"ru/user-guide/data-processing/layers/layer-paths.html#terminologiya1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Терминология&lt;/span&gt;&lt;/a&gt;Терминология&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Porto слой&lt;/strong&gt; — фрагмент образа корневой файловой системы для &lt;a href=\"https://github.com/ten-nancy/porto\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Porto&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"http://wiki.rosalab.ru/ru/index.php/%D0%9E%D0%B1%D1%80%D0%B0%D0%B7_rootfs\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Образ RootFS&lt;/a&gt;&lt;/strong&gt; — образ корневой файловой системы;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Базовый слой&lt;/strong&gt; (&lt;strong&gt;базовый образ&lt;/strong&gt;) — самодостаточный образ, в котором лежит основная часть окружения (/bin/bash, libc6, etc); фактически выбирая базовый слой, вы фиксируете версию Ubuntu (Precise, Trusty, Xenial, Bionic и т.д.), в которой будет работать ваш код;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Дельта слой&lt;/strong&gt; — слой, который является дополнением к базовому образу и обычно содержит дополнительные библиотеки или бинарные артефакты.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h1 id=\"job_rootfs\"&gt;Использование образов файловой системы для запуска операций в YTsaurus&lt;/h1&gt;\n&lt;p&gt;MapReduce операцию необходимо запускать указывая образ файловой системы, если для ее выполнения требуются библиотеки или ресурсы, которых нет на кластерах YTsaurus, и нет возможности подготовить бинарный файл с данной операцией.&lt;/p&gt;\n&lt;p&gt;Docker образ указывается в спецификации в параметре &lt;code&gt;docker_image = \"[REGISTRY/]IMAGE:TAG\"&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Чтобы воспользоваться Porto слоями, необходимо в спецификации операции в секции маппера или редьюсера указать &lt;code&gt;layer_paths = [\"//path/to/upper_layer\"; ... ; \"//path/to/lower_layer\"]&lt;/code&gt;. Слои перечисляются от верхнего к нижнему.&lt;/p&gt;\n&lt;p&gt;Internal Docker Registry пока не доступен в Open-source.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/layers/layer-paths.md","sourcePath":"ru/user-guide/data-processing/layers/layer-paths.md"},"headings":[{"title":"Docker образы","href":"ru/user-guide/data-processing/layers/layer-paths.html#docker_images","level":2,"items":[{"title":"Терминология","href":"ru/user-guide/data-processing/layers/layer-paths.html#terminologiya","level":3},{"title":"Авторизация","href":"ru/user-guide/data-processing/layers/layer-paths.html#docker_auth","level":3}]},{"title":"Porto слои","href":"ru/user-guide/data-processing/layers/layer-paths.html#porto_layers","level":2,"items":[{"title":"Терминология","href":"ru/user-guide/data-processing/layers/layer-paths.html#terminologiya1","level":3}]}],"title":"Образы корневой файловой системы"},"router":{"pathname":"ru/user-guide/data-processing/layers/layer-paths","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsau
