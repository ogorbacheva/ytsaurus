            {"data":{"leading":false,"html":"&lt;p&gt;Основная задача, которую решает CHYT — возможность обработки таблиц, уже находящихся в YTsaurus, без необходимости их копирования в какие-либо сторонние хранилища.&lt;/p&gt;\n&lt;p&gt;Таким образом, основное отличие CHYT от ClickHouse — отсутствие многообразия движков из обычного ClickHouse. Таблицы хранятся в соответствии с логикой &lt;a href=\"user-guide/storage/static-tables.html\"&gt;хранения таблиц в YTsaurus&lt;/a&gt;. Создание таблиц с использованием стандартных движков ClickHouse запрещено, вместо этого можно читать любую из имеющихся в соответствующем кластере YTsaurus таблиц. Также можно сохранять результаты в виде таблиц YTsaurus.&lt;/p&gt;\n&lt;p&gt;\"Под капотом\" работа с таблицами YTsaurus устроена похоже на движок &lt;a href=\"https://clickhouse.com/docs/ru/engines/table-engines/special/distributed\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Distributed&lt;/a&gt; из ClickHouse. Исключение: не приходится думать о ручном или автоматическом распределении данных по шардам — YTsaurus как сторадж решает эту задачу прозрачным, незаметным и надежным образом, раскладывая данные по нодам.&lt;/p&gt;\n&lt;p&gt;CHYT работает только со &lt;a href=\"user-guide/storage/static-schema.html\"&gt;схематизированными таблицами&lt;/a&gt;. У таблицы должен быть заполнен атрибут &lt;code&gt;/@schema&lt;/code&gt;, или, что то же самое, в веб-интерфейсе YTsaurus на вкладке &lt;strong&gt;Schema&lt;/strong&gt; должна присутствовать схема (т.е. упомянута хотя бы одна колонка).&lt;/p&gt;\n&lt;p&gt;Таблицы YTsaurus обозначаются своими полными путями в Кипарисе, обернутыми в backticks или в двойные кавычки: &lt;code&gt;`//path/to/table`&lt;/code&gt; либо &lt;code&gt;\"//path/to/table\"&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table`\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"15\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-15\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-15\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-15.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;CHYT умеет читать и писать статические и сортированные динамически таблицы, но стоит учитывать, что из-за особенностей хранения данных чтение из &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;динамических таблиц&lt;/a&gt; может занимать в несколько раз больше времени по сравнению со статическими.&lt;/p&gt;\n&lt;h2 id=\"many\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/yt-tables.html#many\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чтение нескольких таблиц&lt;/span&gt;&lt;/a&gt;Чтение нескольких таблиц&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Конкатенация нескольких таблиц YTsaurus: &lt;code&gt;concatYtTables(table1, [table2, [...]])&lt;/code&gt;;&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; concatYtTables(\"//tmp/sample_table\", \"//tmp/sample_table2\")\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"30\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-30\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-30\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-30.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Конкатенация всех таблиц по пути &lt;code&gt;cypressPath&lt;/code&gt; (без слеша на конце): &lt;code&gt;concatYtTablesRange(cypressPath, [from, [to]])&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; concatYtTablesRange(\"//tmp/sample_tables\")\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; concatYtTablesRange(&lt;span class=\"hljs-string\"&gt;'//tmp/sample_tables'&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;'2019-01-01'&lt;/span&gt;)\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; concatYtTablesRange(&lt;span class=\"hljs-string\"&gt;'//tmp/sample_tables'&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'2019-08-13T11:00:00'&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"39\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-39\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-39\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-39.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Более подробное описание этих функций приведено в разделе &lt;a href=\"user-guide/data-processing/chyt/reference/functions.html#multiple_tables_read\"&gt;Чтение множества таблиц&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"save\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/yt-tables.html#save\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сохранение результатов&lt;/span&gt;&lt;/a&gt;Сохранение результатов&lt;/h2&gt;\n&lt;p&gt;CHYT умеет создавать статические таблицы, вставлять в них данные и сохранять результаты запросов в YTsaurus. Ниже представлен список поддерживаемых запросов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;INSERT INTO … VALUES&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;INSERT INTO … SELECT&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;CREATE TABLE&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;CREATE TABLE AS SELECT&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Примеры:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-comment\"&gt;-- Вставка данных в таблицу&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;INSERT INTO&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table`(a) &lt;span class=\"hljs-keyword\"&gt;VALUES&lt;/span&gt; (&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;), (&lt;span class=\"hljs-number\"&gt;11&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"76\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-76\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-76\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-76.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-comment\"&gt;-- Вставка данных из другой таблицы&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;INSERT INTO&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table`\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; a&lt;span class=\"hljs-operator\"&gt;+&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;100&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table` &lt;span class=\"hljs-keyword\"&gt;ORDER&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; a;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"77\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-77\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-77\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-77.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-comment\"&gt;-- Создание таблицы&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;CREATE TABLE&lt;/span&gt; IF &lt;span class=\"hljs-keyword\"&gt;NOT&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;EXISTS&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table`\n(\n   a String,\n   b Int32\n) ENGINE &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; YtTable();\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"78\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-78\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-78\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-78.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-comment\"&gt;-- Создание таблицы с сортировкой по ключу b&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;CREATE TABLE&lt;/span&gt; IF &lt;span class=\"hljs-keyword\"&gt;NOT&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;EXISTS&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table_with_pk`\n(\n   a String,\n   b Int32\n) ENGINE &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; YtTable() &lt;span class=\"hljs-keyword\"&gt;order&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt; b;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"79\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-79\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-79\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-79.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-comment\"&gt;-- Создание таблицы на основе select запроса&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;CREATE TABLE&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table` ENGINE &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; YtTable()\n&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; a &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table` &lt;span class=\"hljs-keyword\"&gt;ORDER&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; a;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"80\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-80\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-80\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-80.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-comment\"&gt;-- Создание таблицы на основе select запроса с сортировкой по колонке b&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;CREATE TABLE&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table_with_pk` ENGINE &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; YtTable() &lt;span class=\"hljs-keyword\"&gt;order&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt; b\n&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; b,a &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table` &lt;span class=\"hljs-keyword\"&gt;order&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt; b;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"81\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-81\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-81\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-81.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Для перезаписи существующих данных достаточно добавить опцию &lt;code&gt;&amp;lt;append=%false&amp;gt;&lt;/code&gt; перед путем:&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;INSERT INTO&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;append&lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;%&lt;/span&gt;&lt;span class=\"hljs-literal\"&gt;false&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table`\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; a&lt;span class=\"hljs-operator\"&gt;+&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;100&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table` &lt;span class=\"hljs-keyword\"&gt;ORDER&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; a;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"88\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-88\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-88\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-88.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;При создании таблицы можно указывать дополнительные атрибуты, для этого их достаточно передать в Engine в виде &lt;a href=\"user-guide/storage/data-types.html#yson\"&gt;YSON&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;CREATE TABLE&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table`(i Int64) engine &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; YtTable(&lt;span class=\"hljs-string\"&gt;'{compression_codec=snappy}'&lt;/span&gt;);\n\n&lt;span class=\"hljs-keyword\"&gt;CREATE TABLE&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table`(i Int64) engine &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; YtTable(&lt;span class=\"hljs-string\"&gt;'{optimize_for=lookup}'&lt;/span&gt;);\n\n&lt;span class=\"hljs-keyword\"&gt;CREATE TABLE&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table`(i Int64) engine &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; YtTable(&lt;span class=\"hljs-string\"&gt;'{primary_medium=ssd_blobs}'&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"95\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-95\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-95\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-95.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;При сохранении результатов существуют ограничения: значения по умолчанию, выражения для TTL, форматы сжатия для колонок игнорируются.&lt;/p&gt;\n&lt;h2 id=\"ddl\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/yt-tables.html#ddl\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запросы для манипуляции таблицами&lt;/span&gt;&lt;/a&gt;Запросы для манипуляции таблицами&lt;/h2&gt;\n&lt;p&gt;CHYT поддерживает следующие операции над таблицами:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;TRUNCATE TABLE [IF EXISTS]&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;RENAME TABLE … TO …&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;EXCHANGE TABLES … AND …&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DROP TABLE [IF EXISTS]&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Примеры:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-comment\"&gt;-- Удаление всех данных из таблицы&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;TRUNCATE&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;TABLE&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table`;\n&lt;span class=\"hljs-keyword\"&gt;TRUNCATE&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;TABLE&lt;/span&gt; IF &lt;span class=\"hljs-keyword\"&gt;EXISTS&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table`;\n\n&lt;span class=\"hljs-comment\"&gt;-- Переименование таблицы&lt;/span&gt;\nRENAME &lt;span class=\"hljs-keyword\"&gt;TABLE&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table` &lt;span class=\"hljs-keyword\"&gt;TO&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table_renamed`;\n\n&lt;span class=\"hljs-comment\"&gt;-- Обмен имен двух таблиц&lt;/span&gt;\nEXCHANGE TABLES `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table` &lt;span class=\"hljs-keyword\"&gt;AND&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;other_sample_table`;\n\n&lt;span class=\"hljs-comment\"&gt;-- Удаление таблицы&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;DROP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;TABLE&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table`;\n&lt;span class=\"hljs-keyword\"&gt;DROP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;TABLE&lt;/span&gt; IF &lt;span class=\"hljs-keyword\"&gt;EXISTS&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;sample_table`;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"130\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-130\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-130\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-130.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"virtual_columns\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/yt-tables.html#virtual_columns\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Виртуальные колонки&lt;/span&gt;&lt;/a&gt;Виртуальные колонки&lt;/h2&gt;\n&lt;p&gt;У каждой YTsaurus-таблицы есть виртуальные колонки. Такие колонки не видны в запросах вида &lt;code&gt;DESCRIBE TABLE&lt;/code&gt; и &lt;code&gt;SELECT * FROM&lt;/code&gt;, получить их можно только явно обратившись к ним.&lt;/p&gt;\n&lt;p&gt;На текущий момент для каждой таблицы доступны 3 виртуальные колонки:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;$table_index Int64&lt;/code&gt; — номер таблицы в порядке перечисления в &lt;code&gt;concatYtTables&lt;/code&gt; (или в порядке сортировки в &lt;code&gt;concatYtTablesRange&lt;/code&gt;). При чтении одной таблицы индекс всегда равен нулю.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;$table_path String&lt;/code&gt; — полный путь до таблицы в YTsaurus.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;$table_name String&lt;/code&gt; — имя таблицы, то есть последний литерал пути таблицы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Входные таблицы можно достаточно эффективно фильтровать по описанным виртуальным колонкам, так как их значения известны до чтения каких-либо данных из самих таблиц. Данное свойство можно использовать для чтения практически любого подмножества таблиц из директории.&lt;/p&gt;\n&lt;p&gt;Однако стоит учитывать, что хоть сами таблицы прочитаны не будут, &lt;em&gt;метаинформация таблиц&lt;/em&gt; (например, схема) все равно будет загружена. Кроме того, даже если таблица не попала под условие и не будет считана, все равно будет проведена проверка прав доступа пользователя ко всем таблицам указанным в &lt;code&gt;concatYtTables/concatYtTablesRange&lt;/code&gt;. Поэтому для директорий с большим количеством таблиц рекомендуется указывать ограничения с помощью аргументов функции &lt;code&gt;concatYtTablesRange&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Примеры запросов:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; $table_name &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; \"//home/dev/username/t1\";\n&lt;span class=\"hljs-comment\"&gt;-- Result&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;-- #\t$table_name&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;-- 1\t\"t1\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"166\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-166\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-166\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-166.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; \"//home/dev/username/t1\";\n&lt;span class=\"hljs-comment\"&gt;--Result&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;--#\ta\tb\tc&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;--1\t0\t1\t1&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"167\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-167\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-167\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-167.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;, $table_name, $table_path, $table_index\n&lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; concatYtTables(\"//home/dev/username/t0\", \"//home/dev/username/t1\");\n&lt;span class=\"hljs-comment\"&gt;-- Result&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;--#\ta\tb\tc\t$table_name\t$table_path\t$table_index&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;--1\t0\t0\t0\t\"t0\"\t\"//home/dev/username/t0\"\t0&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;--2\t0\t1\t1\t\"t0\"\t\"//home/dev/username/t0\"\t0&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;--3\t0\t1\t1\t\"t1\"\t\"//home/dev/username/t1\"\t1&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"168\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-168\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-168\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-168.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"dynamic\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/yt-tables.html#dynamic\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с динамическими таблицами&lt;/span&gt;&lt;/a&gt;Работа с динамическими таблицами&lt;/h2&gt;\n&lt;p&gt;Из CHYT можно читать &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;динамические&lt;/a&gt; таблицы, включая dynamic stores (свежие данные в памяти).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Чтобы данные в dynamic stores были видны при чтении из CHYT и Map-Reduce, таблицу следует перемонтировать с выставлением атрибута &lt;code&gt;enable_dynamic_store_read = %true&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;По умолчанию, если попробовать прочитать динамическую таблицу без атрибута &lt;code&gt;enable_dynamic_store_read = %true&lt;/code&gt;, запрос завершится ошибкой. Если действительно нужны данные только из chunk stores (с отставанием на десятки минут), то можно установить настройку &lt;code&gt;chyt.dynamic_table.enable_dynamic_store_read&lt;/code&gt; в значение &lt;code&gt;0&lt;/code&gt;, после чего CHYT форсированно начнет читать только chunk stores (смотрите страницу с &lt;a href=\"user-guide/data-processing/chyt/reference/settings.html\"&gt;настройками запросов&lt;/a&gt;).&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/chyt/yt-tables.md","sourcePath":"ru/user-guide/data-processing/chyt/yt-tables.md"},"headings":[{"title":"Чтение нескольких таблиц","href":"ru/user-guide/data-processing/chyt/yt-tables.html#many","level":2},{"title":"Сохранение результатов","href":"ru/user-guide/data-processing/chyt/yt-tables.html#save","level":2},{"title":"Запросы для манипуляции таблицами","href":"ru/user-guide/data-processing/chyt/yt-tables.html#ddl","level":2},{"title":"Виртуальные колонки","href":"ru/user-guide/data-processing/chyt/yt-tables.html#virtual_columns","level":2},{"title":"Работа с динамическими таблицами","href":"ru/user-guide/data-processing/chyt/yt-tables.html#dynamic","level":2}],"title":"Работа с таблицами YTsaurus"},"router":{"pathname":"ru/user-guide/data-processing/chyt/yt-tables","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provide
