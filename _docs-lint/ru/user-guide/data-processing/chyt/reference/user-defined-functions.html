        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"create_delete_udf\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/user-defined-functions.html#create_delete_udf\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создание и удаление SQL UDF&lt;/span&gt;&lt;/a&gt;Создание и удаление SQL UDF&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"https://clickhouse.com/docs/en/sql-reference/statements/create/function\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;CREATE FUNCTION&lt;/a&gt; - создать функцию из лямбда-выражения. Функции, созданные таким образом, доступны только в рамках используемой клики всем пользователям.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;CREATE&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FUNCTION&lt;/span&gt; linearEquation &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; (x, k, b) &lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; k&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt;x &lt;span class=\"hljs-operator\"&gt;+&lt;/span&gt; b;\n&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; number, linearEquation(number, &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; numbers(&lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;);\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"6\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-6\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-6\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;a href=\"https://clickhouse.com/docs/en/sql-reference/statements/drop#drop-function\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;DROP FUNCTION&lt;/a&gt; - удалить пользовательскую SQL функцию.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;DROP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;FUNCTION&lt;/span&gt; linearEquation;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"10\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-10\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-10\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-10.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Для использования обеих команд необходимо право &lt;code&gt;Manage&lt;/code&gt; на клику.&lt;/p&gt;\n&lt;h2 id=\"udf_usage\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/user-defined-functions.html#udf_usage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование функции в запросе&lt;/span&gt;&lt;/a&gt;Использование функции в запросе&lt;/h2&gt;\n&lt;p&gt;Пользовательская функция хранится в состоянии клики, поэтому нет нужды пересоздавать ее в каждом запросе. Ее можно вызвать так же, как и любую встроенную функцию ClickHouse.&lt;/p&gt;\n&lt;p&gt;Если во время исполнения запроса кто-нибудь пересоздаст используемую UDF, то вызовы данной функции могут иметь разные реализации. Нет никаких гарантий, какая из них будет выбрана на каждом инстансе клики.&lt;/p&gt;\n&lt;h2 id=\"get_all_udfs\"&gt;&lt;a href=\"ru/user-guide/data-processing/chyt/reference/user-defined-functions.html#get_all_udfs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Просмотр всех SQL UDF клики&lt;/span&gt;&lt;/a&gt;Просмотр всех SQL UDF клики&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;SELECT&lt;/span&gt; name, create_query &lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; system.functions\n&lt;span class=\"hljs-keyword\"&gt;WHERE&lt;/span&gt; origin &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'SQLUserDefined'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"26\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-26\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-26\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-26.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Результат:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;name&lt;/th&gt;\n&lt;th&gt;create_query&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;linearEquation&lt;/td&gt;\n&lt;td&gt;CREATE FUNCTION linearEquation AS (x, k, b) -&amp;gt; ((k * x) + b)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/chyt/reference/user-defined-functions.md","sourcePath":"ru/user-guide/data-processing/chyt/reference/user-defined-functions.md"},"headings":[{"title":"Создание и удаление SQL UDF","href":"ru/user-guide/data-processing/chyt/reference/user-defined-functions.html#create_delete_udf","level":2},{"title":"Использование функции в запросе","href":"ru/user-guide/data-processing/chyt/reference/user-defined-functions.html#udf_usage","level":2},{"title":"Просмотр всех SQL UDF клики","href":"ru/user-guide/data-processing/chyt/reference/user-defined-functions.html#get_all_udfs","level":2}],"title":"Пользовательские SQL функции"},"router":{"pathname":"ru/user-guide/data-processing/chyt/reference/user-defined-functions","depth":6,"base":"../../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/
