            {"data":{"leading":false,"html":"&lt;h2 id=\"how-to\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/API/spyt-python.html#how-to\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шаги для запуска&lt;/span&gt;&lt;/a&gt;Шаги для запуска&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Напишите код.&lt;/li&gt;\n&lt;li&gt;Выложите код и зависимости в YTsaurus. Основной файл &lt;code&gt;.py&lt;/code&gt; и зависимости в &lt;code&gt;.py&lt;/code&gt;, &lt;code&gt;.zip&lt;/code&gt; или &lt;code&gt;.egg&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Соберите исполняемый бинарный файл и выложите его в YTsaurus (Spark 3.2.2+).&lt;/li&gt;\n&lt;li&gt;Запустите команду &lt;code&gt;spark-submit-yt&lt;/code&gt; (для запуска во внутреннем standalone кластере) или &lt;code&gt;spark-submit&lt;/code&gt; (для запуска напрямую в YTsaurus, доступно с версии SPYT 1.76.0).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"submit\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/API/spyt-python.html#submit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Особенности запуска задач напрямую в YTsaurus&lt;/span&gt;&lt;/a&gt;Особенности запуска задач напрямую в YTsaurus&lt;/h2&gt;\n&lt;p&gt;Все примеры, приведённые ниже, написаны для запуска во внутреннем standalone кластере. При запуске задач напрямую в YTsaurus есть отличия в способе создания объекта SparkSession. Вместо использования функций &lt;code&gt;with spark_session()&lt;/code&gt; или &lt;code&gt;spyt.connect()&lt;/code&gt; нужно создавать его напрямую, согласно рекомендациям Spark:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; pyspark.sql &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; SparkSession\n\nspark = SparkSession.builder.appName(&lt;span class=\"hljs-string\"&gt;'My Application'&lt;/span&gt;).getOrCreate()\n\n&lt;span class=\"hljs-meta\"&gt;... &lt;/span&gt;&lt;span class=\"hljs-comment\"&gt;# Application code&lt;/span&gt;\n\nspark.stop()\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"31\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-31\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-31\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-31.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Это связано с тем, что функции &lt;code&gt;with spark_session()&lt;/code&gt; и &lt;code&gt;spyt.connect()&lt;/code&gt; обращаются к discovery-path, который создаётся в Кипарисе при запуске standalone кластера. В данном способе discovery-path не используется, так как внутренний кластер не создаётся.&lt;/p&gt;\n&lt;h2 id=\"submit-cluster\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/API/spyt-python.html#submit-cluster\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск задач напрямую в YTsaurus в кластерном режиме&lt;/span&gt;&lt;/a&gt;Запуск задач напрямую в YTsaurus в кластерном режиме&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; spyt.submit &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; direct_submit\n\n&lt;span class=\"hljs-comment\"&gt;# method return YT operation id for driver, throw an exception if spin failed&lt;/span&gt;\noperation_id = direct_submit(\n    yt_proxy=&lt;span class=\"hljs-string\"&gt;\"yt_proxy_address\"&lt;/span&gt;,             &lt;span class=\"hljs-comment\"&gt;# YT proxy address as string&lt;/span&gt;\n    num_executors=&lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;,                         &lt;span class=\"hljs-comment\"&gt;# Number of Spark executors&lt;/span&gt;\n    main_file=&lt;span class=\"hljs-string\"&gt;\"main.py\"&lt;/span&gt;,  \t\t             &lt;span class=\"hljs-comment\"&gt;# Main .py or .jar file for Spark job&lt;/span&gt;\n    deploy_mode=&lt;span class=\"hljs-string\"&gt;\"cluster\"&lt;/span&gt;,                   &lt;span class=\"hljs-comment\"&gt;# 'cluster' or 'client', default 'cluster'&lt;/span&gt;\n    pool=pool,                               &lt;span class=\"hljs-comment\"&gt;# (Optional) YT pool for the job&lt;/span&gt;\n    spark_base_args=spark_base_args,         &lt;span class=\"hljs-comment\"&gt;# (Optional) List of extra Spark submit arguments&lt;/span&gt;\n    job_args=job_args,                       &lt;span class=\"hljs-comment\"&gt;# (Optional) Arguments passed to main application&lt;/span&gt;\n    spark_conf=spark_conf,                   &lt;span class=\"hljs-comment\"&gt;# Spark configuration dictionary&lt;/span&gt;\n    timeout_sec=&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;                           &lt;span class=\"hljs-comment\"&gt;# Submit timeout in seconds (default: 30)&lt;/span&gt;\n)\n\n&lt;span class=\"hljs-comment\"&gt;# than you can monitor your operation, eg.&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;while&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;:\n    current_state = yt_client.get_operation_state(operation_id)\n    logging.info(&lt;span class=\"hljs-string\"&gt;f\"Operation: &lt;span class=\"hljs-subst\"&gt;{operation_id}&lt;/span&gt;, State: &lt;span class=\"hljs-subst\"&gt;{current_state}&lt;/span&gt;\"&lt;/span&gt;)\n    &lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; current_state.is_finished():\n        &lt;span class=\"hljs-keyword\"&gt;break&lt;/span&gt;\n    time.sleep(&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"38\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-38\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-38\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-38.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"submit-client\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/API/spyt-python.html#submit-client\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск задач напрямую в YTsaurus в клиентском режиме&lt;/span&gt;&lt;/a&gt;Запуск задач напрямую в YTsaurus в клиентском режиме&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; spyt\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; pyspark &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; SparkConf\n\nconf = SparkConf()\n...\n\n&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; spyt.direct_spark_session(&lt;span class=\"hljs-string\"&gt;\"yt_proxy_address\"&lt;/span&gt;, conf) &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; spark:\n        df = spark.read.yt(path)\n        ...\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"42\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-42\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-42\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-42.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"simple\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/API/spyt-python.html#simple\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск без зависимостей &lt;/span&gt;&lt;/a&gt;Запуск без зависимостей &lt;/h2&gt;\n&lt;h3 id=\"kod-osnovnogo-fajla\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/API/spyt-python.html#kod-osnovnogo-fajla\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Код основного файла&lt;/span&gt;&lt;/a&gt;Код основного файла&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; spyt &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; spark_session\n\n&lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"Hello world\"&lt;/span&gt;)\n&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; spark_session() &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; spark:\n    spark.read.yt(&lt;span class=\"hljs-string\"&gt;\"path_to_file\"&lt;/span&gt;).show()\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"49\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-49\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-49\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-49.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"zapusk\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/API/spyt-python.html#zapusk\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск&lt;/span&gt;&lt;/a&gt;Запуск&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-submit-yt \\\n  --proxy &amp;lt;cluster-name&amp;gt; \\\n  --discovery-path //my_discovery_path \\\n  --deploy-mode cluster \\\n  YTsaurus_path_to_file\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"53\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-53\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-53\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-53.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"dependencies\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/API/spyt-python.html#dependencies\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск с зависимостями &lt;/span&gt;&lt;/a&gt;Запуск с зависимостями &lt;/h2&gt;\n&lt;h3 id=\"kod-osnovnogo-fajla1\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/API/spyt-python.html#kod-osnovnogo-fajla1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Код основного файла&lt;/span&gt;&lt;/a&gt;Код основного файла&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; my_lib &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; plus5\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; pyspark.sql.functions &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; col\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; spyt &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; spark_session\n\n&lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"Hello world\"&lt;/span&gt;)\n&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; spark_session() &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; spark:\n    spark.read.yt(&lt;span class=\"hljs-string\"&gt;\"path_to_file\"&lt;/span&gt;)\\\n\t.withColumn(&lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;, plus5(col(&lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;)))\\\n\t.write.mode(&lt;span class=\"hljs-string\"&gt;\"overwrite\"&lt;/span&gt;).yt(&lt;span class=\"hljs-string\"&gt;\"path_to_file\"&lt;/span&gt;)\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"60\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-60\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-60\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-60.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"zavisimost\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/API/spyt-python.html#zavisimost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зависимость&lt;/span&gt;&lt;/a&gt;Зависимость&lt;/h3&gt;\n&lt;p&gt;Файл &lt;code&gt;my_lib.zip&lt;/code&gt;, в котором находится &lt;code&gt;my_lib.py&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; pyspark.sql.functions &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; udf\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; pyspark.sql.types &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; LongType\n\nplus5 = udf(&lt;span class=\"hljs-keyword\"&gt;lambda&lt;/span&gt; x: x + &lt;span class=\"hljs-number\"&gt;5&lt;/span&gt;, LongType())\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"67\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-67\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-67\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-67.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"kod-i-zavisimosti-v-ytsaurus\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/API/spyt-python.html#kod-i-zavisimosti-v-ytsaurus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Код и зависимости в YTsaurus&lt;/span&gt;&lt;/a&gt;Код и зависимости в YTsaurus&lt;/h3&gt;\n&lt;p&gt;В YTsaurus должны находиться:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;файл, например &lt;code&gt;deps_example.py&lt;/code&gt;;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;зависимости, например &lt;code&gt;my_lib.zip&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"zapusk1\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/API/spyt-python.html#zapusk1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск&lt;/span&gt;&lt;/a&gt;Запуск&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-submit-yt \\\n    --proxy &amp;lt;cluster-name&amp;gt; \\\n    --discovery-path //my_discovery_path \\\n    --deploy-mode cluster \\\n    --py-files YTsaurus_path_to_lib \\\n    YTsaurus_path_to_file\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"89\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-89\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-89\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-89.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"zapusk-s-konfiguraciyami\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/API/spyt-python.html#zapusk-s-konfiguraciyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск с конфигурациями&lt;/span&gt;&lt;/a&gt;Запуск с конфигурациями&lt;/h2&gt;\n&lt;p&gt;В Spark много полезных конфигураций, которые можно указывать при запуске джоба. Например &lt;a href=\"https://spark.apache.org/docs/latest/sql-performance-tuning.html\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;spark.sql.shuffle.partitions&lt;/a&gt;. Существует возможность регулировать количество ресурсов на джоб через &lt;code&gt;spark.cores.max&lt;/code&gt;, &lt;code&gt;spark.executor.memory&lt;/code&gt;, подробнее можно узнать в &lt;a href=\"https://spark.apache.org/docs/latest/configuration.html#application-properties\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;документации Spark&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В режиме &lt;a href=\"user-guide/data-processing/spyt/cluster/cluster-desc.html#spark-standalone\"&gt;Standalone&lt;/a&gt; не работают настройки &lt;code&gt;num-executors&lt;/code&gt; и &lt;code&gt;spark.executor.instances&lt;/code&gt;, количество экзекьюторов определяется настройкой &lt;code&gt;spark.cores.max&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kod-osnovnogo-fajla2\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/API/spyt-python.html#kod-osnovnogo-fajla2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Код основного файла&lt;/span&gt;&lt;/a&gt;Код основного файла&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; pyspark_yt &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; spark_session\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; pyspark.sql.functions &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; col\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; spyt &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; spark_session\n\n&lt;span class=\"hljs-built_in\"&gt;print&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"Hello world\"&lt;/span&gt;)\n&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; spark_session() &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; spark:\n    spark.read.yt(&lt;span class=\"hljs-string\"&gt;\"path_to_file\"&lt;/span&gt;)\\\n\t.withColumn(&lt;span class=\"hljs-string\"&gt;\"id_mod_10\"&lt;/span&gt;, col(&lt;span class=\"hljs-string\"&gt;\"id\"&lt;/span&gt;) % &lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;)\\\n\t.groupBy(&lt;span class=\"hljs-string\"&gt;\"id_mod_10\"&lt;/span&gt;)\\\n\t.count()\\\n\t.write.mode(&lt;span class=\"hljs-string\"&gt;\"overwrite\"&lt;/span&gt;).yt(&lt;span class=\"hljs-string\"&gt;\"path_to_file\"&lt;/span&gt;)\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"109\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-109\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-109\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-109.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"kod-v-ytsaurus\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/API/spyt-python.html#kod-v-ytsaurus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Код в YTsaurus&lt;/span&gt;&lt;/a&gt;Код в YTsaurus&lt;/h3&gt;\n&lt;p&gt;Файл необходимо загрузить в YTsaurus.&lt;/p&gt;\n&lt;h3 id=\"zapusk2\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/API/spyt-python.html#zapusk2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск&lt;/span&gt;&lt;/a&gt;Запуск&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;spark-submit-yt \\\n  --proxy &amp;lt;cluster-name&amp;gt; \\\n  --&lt;span class=\"hljs-built_in\"&gt;id&lt;/span&gt; &lt;span class=\"hljs-built_in\"&gt;test&lt;/span&gt; \\\n  --discovery-dir //my_discovery_path \\\n  --deploy-mode cluster \\\n  --conf spark.sql.shuffle.partitions=1 \\\n  --conf spark.cores.max=1 \\\n  --conf spark.executor.cores=1 \\\n  YTsaurus_path_to_file\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"119\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-119\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-119\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-119.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"drugie-primery\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/API/spyt-python.html#drugie-primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Другие примеры&lt;/span&gt;&lt;/a&gt;Другие примеры&lt;/h2&gt;\n&lt;p&gt;Дополнительные примеры содержатся в разделе &lt;a href=\"user-guide/data-processing/spyt/API/spyt-jupyter.html\"&gt;SPYT в Jupyter&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;В регулярных джобах объект &lt;code&gt;spark&lt;/code&gt; можно создавать так же, как в Jupyter, с помощью вызова &lt;code&gt;connect&lt;/code&gt;, а можно через &lt;code&gt;with spark_session&lt;/code&gt;, как показано в примере. Разница между данными вариантами минимальна. В метод для Jupyter можно передавать настройки по ресурсам, а в регулярных джобах это обычно делается при запуске, чтобы не перевыкладывать код, если данных, например, стало больше.&lt;/p&gt;\n&lt;p&gt;Пример запуска и проверки результатов джоба:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; spyt\n&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; time\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; spyt.submit &lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; java_gateway, SparkSubmissionClient, SubmissionStatus\n\nuser = &lt;span class=\"hljs-string\"&gt;\"user_name\"&lt;/span&gt;\ntoken = spyt.utils.default_token()\nyt_proxy = &lt;span class=\"hljs-string\"&gt;\"cluster_name\"&lt;/span&gt;\ndiscovery_path = &lt;span class=\"hljs-string\"&gt;\"//my_discovery_path\"&lt;/span&gt;\nspyt_version = &lt;span class=\"hljs-string\"&gt;\"1.4.1\"&lt;/span&gt;\n\n&lt;span class=\"hljs-keyword\"&gt;with&lt;/span&gt; java_gateway() &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; gateway:\n    client = SparkSubmissionClient(gateway, yt_proxy, discovery_path, spyt_version, user, token)\n    launcher = (\n        client\n            .new_launcher()\n            .set_app_resource(&lt;span class=\"hljs-string\"&gt;\"yt:///sys/spark/examples/smoke_test.py\"&lt;/span&gt;)\n            .set_conf(&lt;span class=\"hljs-string\"&gt;\"spark.pyspark.python\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"/opt/python3.7/bin/python3.7\"&lt;/span&gt;)\n    )\n    submission_id = client.submit(launcher)\n    status = client.get_status(submission_id)\n    &lt;span class=\"hljs-keyword\"&gt;while&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;not&lt;/span&gt; SubmissionStatus.is_final(status):\n        status = client.get_status(submission_id)\n        time.sleep(&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;)\n    SubmissionStatus.is_success(status)\n    SubmissionStatus.is_failure(status)\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"132\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-132\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-132\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-132.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Клиент работает через &lt;code&gt;Py4J&lt;/code&gt;, вызывает нужные методы у &lt;code&gt;RestSubmissionClient&lt;/code&gt;. Строка &lt;code&gt;with java_gateway() as gateway&lt;/code&gt;  поднимает &lt;code&gt;JVM&lt;/code&gt; с нужным &lt;code&gt;Classpath&lt;/code&gt; и корректно завершает работу.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Можно использовать методы &lt;code&gt;launch_gateway&lt;/code&gt; и &lt;code&gt;shutdown_gateway&lt;/code&gt; и управлять созданием &lt;code&gt;JVM&lt;/code&gt; самостоятельно.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;SparkSubmissionClient&lt;/code&gt; — это клиент для запуска джобов на конкретном кластере. Клиент находит координаты мастера по &lt;code&gt;discovery_path&lt;/code&gt; и взаимодействует с ним.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Параметры запускаемого джоба описываются в объекте &lt;code&gt;launcher&lt;/code&gt;. Полный список методов объекта можно посмотреть в коде, методы соответствуют параметрам &lt;code&gt;spark-submit&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Статус джоба после запуска можно проверять с помощью метода &lt;code&gt;client.get_status&lt;/code&gt;. В примере указано время ожидания финального результата.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/spyt/API/spyt-python.md","sourcePath":"ru/user-guide/data-processing/spyt/API/spyt-python.md"},"headings":[{"title":"Шаги для запуска","href":"ru/user-guide/data-processing/spyt/API/spyt-python.html#how-to","level":2},{"title":"Особенности запуска задач напрямую в YTsaurus","href":"ru/user-guide/data-processing/spyt/API/spyt-python.html#submit","level":2},{"title":"Запуск задач напрямую в YTsaurus в кластерном режиме","href":"ru/user-guide/data-processing/spyt/API/spyt-python.html#submit-cluster","level":2},{"title":"Запуск задач напрямую в YTsaurus в клиентском режиме","href":"ru/user-guide/data-processing/spyt/API/spyt-python.html#submit-client","
