        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"multiklasternoe-chtenie\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/thesaurus/read-options.html#multiklasternoe-chtenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мультикластерное чтение&lt;/span&gt;&lt;/a&gt;Мультикластерное чтение&lt;/h2&gt;\n&lt;p&gt;По умолчанию, расчет обращается к данным на кластере, который предоставляет вычислительные мощности (при запуске напрямую или при использовании Standalone кластера). При этом SPYT поднимает собственные RPC прокси для разгрузки общих кластерных прокси.&lt;/p&gt;\n&lt;p&gt;В версии 2.2.0 появилась возможность чтения данных с разных кластеров YTsaurus. Для этого необходимо явно указать адрес кластера в пути к таблице.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;spark.read.yt(&lt;span class=\"hljs-string\"&gt;'&amp;lt;cluster=\"localhost:8000\"&amp;gt;//home/table'&lt;/span&gt;).show() &lt;span class=\"hljs-comment\"&gt;# Таблица на кластере localhost:8000&lt;/span&gt;\n\nspark.read.yt(&lt;span class=\"hljs-string\"&gt;'//home/table'&lt;/span&gt;).show() &lt;span class=\"hljs-comment\"&gt;# Таблица на домашнем кластере&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"9\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-9\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-9\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-9.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Чтение с других кластеров YTsaurus происходит через общие прокси, что может вызывать большую нагрузку на них при высоких объемах данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"schema_hint\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/thesaurus/read-options.html#schema_hint\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;schema_hint&lt;/span&gt;&lt;/a&gt;schema_hint&lt;/h2&gt;\n&lt;p&gt;Жесткое указание &lt;a href=\"user-guide/storage/data-types.html\"&gt;типа колонки&lt;/a&gt;. Полезно в случае, когда колонка имеет тип &lt;code&gt;any&lt;/code&gt; (сериализованный в &lt;code&gt;yson&lt;/code&gt; сложный тип).&lt;br /&gt;\nЗначение будет десериализовано в указанный тип.&lt;/p&gt;\n&lt;p&gt;Пример на Python:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;spark.read.schema_hint({&lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;: MapType(StringType(), LongType())}).yt(&lt;span class=\"hljs-string\"&gt;\"//sys/spark/examples/example_yson\"&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"29\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-29\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-29\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-29.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Пример на Scala:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs scala\"&gt;df.write\n    .schemaHint(&lt;span class=\"hljs-type\"&gt;Map&lt;/span&gt;(&lt;span class=\"hljs-string\"&gt;\"a\"&lt;/span&gt; -&amp;gt;\n        &lt;span class=\"hljs-type\"&gt;YtLogicalType&lt;/span&gt;.&lt;span class=\"hljs-type\"&gt;VariantOverTuple&lt;/span&gt;(&lt;span class=\"hljs-type\"&gt;Seq&lt;/span&gt;(\n          (&lt;span class=\"hljs-type\"&gt;YtLogicalType&lt;/span&gt;.&lt;span class=\"hljs-type\"&gt;String&lt;/span&gt;, &lt;span class=\"hljs-type\"&gt;Metadata&lt;/span&gt;.empty), (&lt;span class=\"hljs-type\"&gt;YtLogicalType&lt;/span&gt;.&lt;span class=\"hljs-type\"&gt;Double&lt;/span&gt;, &lt;span class=\"hljs-type\"&gt;Metadata&lt;/span&gt;.empty)))))\n    .yt(tmpPath)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"33\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-33\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-33\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-33.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"transaction\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/thesaurus/read-options.html#transaction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;transaction&lt;/span&gt;&lt;/a&gt;transaction&lt;/h2&gt;\n&lt;p&gt;Чтение под &lt;a href=\"user-guide/storage/transactions.html\"&gt;транзакцией&lt;/a&gt;. Подробнее можно узнать в разделе &lt;a href=\"user-guide/data-processing/spyt/read-transaction.html\"&gt;Чтение и запись под транзакцией&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Пример на Scala:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs scala\"&gt;&lt;span class=\"hljs-keyword\"&gt;val&lt;/span&gt; transaction = &lt;span class=\"hljs-type\"&gt;YtWrapper&lt;/span&gt;.createTransaction(&lt;span class=\"hljs-type\"&gt;None&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;10&lt;/span&gt; minute)\ndf.write.transaction(transaction.getId.toString).yt(tmpPath)\ntransaction.commit().get(&lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;, &lt;span class=\"hljs-type\"&gt;TimeUnit&lt;/span&gt;.&lt;span class=\"hljs-type\"&gt;SECONDS&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"43\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-43\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-43\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-43.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"schema-v3\"&gt;&lt;a href=\"ru/user-guide/data-processing/spyt/thesaurus/read-options.html#schema-v3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Schema v3&lt;/span&gt;&lt;/a&gt;Schema v3&lt;/h2&gt;\n&lt;p&gt;Чтение таблиц со схемой в формате &lt;a href=\"user-guide/storage/data-types.html\"&gt;type_v3&lt;/a&gt; вместо &lt;code&gt;type_v1&lt;/code&gt;. Настраивается в &lt;a href=\"user-guide/data-processing/spyt/cluster/configuration.html\"&gt;Spark конфигурации&lt;/a&gt; или опции записи.&lt;/p&gt;\n&lt;p&gt;Python example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;spark.read.option(&lt;span class=\"hljs-string\"&gt;\"parsing_type_v3\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"true\"&lt;/span&gt;).yt(&lt;span class=\"hljs-string\"&gt;\"//sys/spark/examples/example_yson\"&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"53\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-53\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-53\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-53.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/spyt/thesaurus/read-options.md","sourcePath":"ru/user-guide/data-processing/spyt/thesaurus/read-options.md"},"headings":[{"title":"Мультикластерное чтение","href":"ru/user-guide/data-processing/spyt/thesaurus/read-options.html#multiklasternoe-chtenie","level":2},{"title":"schema_hint","href":"ru/user-guide/data-processing/spyt/thesaurus/read-options.html#schema_hint","level":2},{"title":"transaction","href":"ru/user-guide/data-processing/spyt/thesaurus/read-options.html#transaction","level":2},{"title":"Schema v3","href":"ru/user-guide/data-processing/spyt/thesaurus/read-options.html#schema-v3","level":2}],"title":"Опции чтения"},"router":{"pathname":"ru/user-guide/data-processing/spyt/thesaurus/read-options","depth":6,"base":"../../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
