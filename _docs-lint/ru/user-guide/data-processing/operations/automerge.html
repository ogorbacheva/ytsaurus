        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе приводится описание работы автоматического слияния чанков на выходе операций, рассматриваются условия применимости и соответствующие настройки с примерами.&lt;/p&gt;\n&lt;h2 id=\"overview\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/automerge.html#overview\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Один из распространённых сценариев обработки данных — фильтрация большой таблицы из множества чанков для получения небольшого результата с помощью операции &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt; без специальных флагов (Unordered Map). В силу устройства данного типа операций, фильтрация таблицы из &lt;code&gt;n&lt;/code&gt; чанков в худшем случае может привести к &lt;code&gt;n&lt;/code&gt; выходным чанкам вне зависимости от того, насколько мелкие чанки получаются в результате. Подобное поведение сказывается на потреблении чанковой квоты пользовательского аккаунта. Подробнее о квотировании можно узнать в разделе &lt;a href=\"user-guide/storage/quotas.html\"&gt;Квоты&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Итоговые чанки можно объединить с помощью операции &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt;, но такой способ неудобен, так как требует запуска дополнительной операции, а также не спасает от того, что в пике требуется запас &lt;code&gt;n&lt;/code&gt; чанков квоты, что для больших таблиц может составлять сотни тысяч чанков, тогда как чанковая квота является довольно дорогим ресурсом. Поэтому в YTsaurus реализовано автоматическое слияние чанков на выходе из операции, которое действует «на опережение», объединяя выходные чанки до того, как их накопится достаточно много, чтобы израсходовать квоту.&lt;/p&gt;\n&lt;p&gt;Автоматическое слияние работает со следующими ограничениями:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Доступно только для операций Unordered &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt;, &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Sorted Reduce&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Работает только для таблиц, в которые пишутся &lt;strong&gt;несортированные данные&lt;/strong&gt;. Для операций с сортированным выходом ситуация осложняется тем, что выходные чанки нельзя объединять в произвольном порядке.&lt;/li&gt;\n&lt;li&gt;Недоступно, если задан параметр &lt;code&gt;row_count_limit&lt;/code&gt;. Подробнее о данном параметре можно узнать в разделе &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Настройки операций&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В случае, если операция попадает под указанные ограничения, пользователю необходимо самостоятельно запускать операцию &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"mode\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/automerge.html#mode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Режимы работы автоматического слияния&lt;/span&gt;&lt;/a&gt;Режимы работы автоматического слияния&lt;/h2&gt;\n&lt;p&gt;Автоматическое слияние настраивается через секцию &lt;code&gt;auto_merge&lt;/code&gt;, которую необходимо указать в спецификации операции. Секция представляет собой словарь, главным параметром в котором является ключ &lt;code&gt;mode&lt;/code&gt;, который может принимать значения &lt;code&gt;disabled&lt;/code&gt;, &lt;code&gt;relaxed&lt;/code&gt;, &lt;code&gt;economy&lt;/code&gt;, &lt;code&gt;manual&lt;/code&gt;, задающие различные варианты поведения автоматического слияния.&lt;/p&gt;\n&lt;h3 id=\"relaxed\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/automerge.html#relaxed\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Relaxed&lt;/span&gt;&lt;/a&gt;Relaxed&lt;/h3&gt;\n&lt;p&gt;Режим, который не ставит целью экономить квоту «в реальном времени», а пытается получить на выходе таблицу с чанками разумного размера. Фактически данный режим снимает с пользователя необходимость запускать Unordered Merge на выходной таблице, но при этом не гарантирует, что операция будет работать хорошо в условиях нехватки квоты.&lt;/p&gt;\n&lt;h3 id=\"economy\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/automerge.html#economy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Economy&lt;/span&gt;&lt;/a&gt;Economy&lt;/h3&gt;\n&lt;p&gt;Режим, при котором оптимизируется максимальное использование квоты на количество чанков в течение работы операции. Данный режим подойдёт для тех операций, которые упираются в ограничения по квоте на количество чанков.&lt;/p&gt;\n&lt;p&gt;Потребление квоты на чанки в режиме &lt;code&gt;economy&lt;/code&gt; в идеальных обстоятельствах можно приближенно оценить как &lt;code&gt;4 * sqrt(n)&lt;/code&gt;, где &lt;code&gt;n&lt;/code&gt; — количество чанков, которые бы получились в выходной таблице без автоматического слияния. Такой результат не является гарантией, а только best effort поведением, для работы которого, например, необходимо, чтобы в количествах чанков, выдаваемых джобами, не было перекосов (если один джоб породит сразу 1000 чанков). В таком случае для фильтрации таблицы из ста тысяч чанков оказывается достаточно квоты в пару тысяч чанков.&lt;/p&gt;\n&lt;h3 id=\"manual\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/automerge.html#manual\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manual&lt;/span&gt;&lt;/a&gt;Manual&lt;/h3&gt;\n&lt;p&gt;Режим, в котором можно вручную настроить поведение автоматического слияния через следующие параметры в секции &lt;code&gt;auto_merge&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;max_intermediate_chunk_count&lt;/code&gt; — планировщик будет пытаться не выходить за указанное ограничение на использование квоты на промежуточные чанки. Тем не менее, абсолютно точно данный лимит соблюсти практически невозможно из-за внутренних особенностей формирования чанков.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;chunk_count_per_merge_job&lt;/code&gt; — определяет размер порции чанков, которую планировщик будет пытаться объединить за один проход (не выходя при этом за ограничение в &lt;code&gt;desired_chunk_size&lt;/code&gt; в &lt;code&gt;job_io&lt;/code&gt; у Merge джобов, по умолчанию 1 ГБ).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;chunk_size_threshold&lt;/code&gt; — лимит, позволяющий не объединять чанки, которые по размеру составляют нужный процент от установленного размера чанка. То есть слиянию будут подлежать только те чанки, размер которых меньше 10% (по умолчанию) от &lt;code&gt;desired_chunk_size&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"disabled\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/automerge.html#disabled\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Disabled&lt;/span&gt;&lt;/a&gt;Disabled&lt;/h3&gt;\n&lt;p&gt;Режим, при котором никакого автоматического слияния не происходит. Данный режим используется по умолчанию.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Режим &lt;code&gt;economy&lt;/code&gt; (как и &lt;code&gt;manual&lt;/code&gt; режим при определённом подборе параметров) довольно сильно ограничивает параллельность операции, что может приводить к её замедлению. Такое поведение объясняется тем, что невозможно запустить одновременно 10 000 джобов, укладываясь в ограничение, например, в 1000 промежуточных чанков, потому что джобы могут единовременно породить 10 000 чанков. В свою очередь, режим &lt;code&gt;relaxed&lt;/code&gt; избавлен от подобной проблемы, при этом режим &lt;code&gt;relaxed&lt;/code&gt; не пытается выдерживать ограничения по чанковой квоте в реальном времени.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Автоматическое слияние является дополнительной стадией операции и занимает время, поэтому по умолчанию автоматическое слияние отключено. В случае, если увеличение времени работы операции из-за автоматического слияния не критично, стоит использовать режим &lt;code&gt;relaxed&lt;/code&gt;. Ожидается, что такой режим подойдёт большей части пользователей.&lt;/p&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/automerge.html#examples\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры спецификаций&lt;/span&gt;&lt;/a&gt;Примеры спецификаций&lt;/h2&gt;\n&lt;p&gt;Пример спецификации с режимом &lt;code&gt;relaxed&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;{\n  &lt;span class=\"hljs-string\"&gt;input_table_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/input_table\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;output_table_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/output_table\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;mapper&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; {\n    &lt;span class=\"hljs-string\"&gt;command&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"cat\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  }&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;auto_merge&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; {\n    &lt;span class=\"hljs-string\"&gt;mode&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"relaxed\"&lt;/span&gt;\n  }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"104\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-104\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-104\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-104.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Пример спецификации с режимом &lt;code&gt;manual&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;{\n  &lt;span class=\"hljs-string\"&gt;input_table_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/input_table\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;output_table_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/output_table\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;mapper&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; {\n    &lt;span class=\"hljs-string\"&gt;command&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"cat\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  }&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;auto_merge&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; {\n    &lt;span class=\"hljs-string\"&gt;mode&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"manual\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;max_intermediate_chunk_count&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1000&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;chunk_count_per_merge_job&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;10&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;chunk_size_threshold&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;5&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"108\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-108\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-108\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-108.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/operations/automerge.md","sourcePath":"ru/user-guide/data-processing/operations/automerge.md"},"headings":[{"title":"Обзор","href":"ru/user-guide/data-processing/operations/automerge.html#overview","level":2},{"title":"Режимы работы автоматического слияния","href":"ru/user-guide/data-processing/operations/automerge.html#mode","level":2,"items":[{"title":"Relaxed","href":"ru/user-guide/data-processing/operations/automerge.html#relaxed","level":3},{"title":"Economy","href":"ru/user-guide/data-processing/operations/automerge.html#economy","level":3},{"title":"Manual","href":"ru/user-guide/data-processing/operations/automerge.html#manual","level":3},{"title":"Disabled","href":"ru/user-guide/data-processing/operations/automerge.html#disabled","level":3}]},{"title":"Примеры спецификаций","href":"ru/user-guide/data-processing/operations/automerge.html#examples","level":2}],"title":"Автоматическое слияние чанков на выходе операций"},"router":{"pathname":"ru/user-guide/data-processing/operations/automerge","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
