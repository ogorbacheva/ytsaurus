            {"data":{"leading":false,"html":"&lt;p&gt;Операция Sort сортирует данные из указанных таблиц и записывает их в одну выходную таблицу. Для сортированной таблицы доступна операция Reduce, а при чтении данных из таблицы (в частности, с указанием диапазона) они будут идти в сортированном виде. Также появляется возможность использовать диапазоны (range) по значениям, а не только по номерам строк таблицы. Сравнение сначала выполняется по типу, а затем, при совпадении типов, — обычным образом (числа по значению, строки лексикографически).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В операции сортировки нет гарантий на порядок строк с одинаковым значением ключа.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Одним из основных параметров сортировки является количество партиций (&lt;code&gt;partition_count&lt;/code&gt;). Данный параметр вычисляется заранее. Перед запуском основных джобов из входной таблицы вычитываются выборки, с помощью которых вычисляются диапазоны ключей, разбивающие входные данные на части (по числу &lt;code&gt;partition_count&lt;/code&gt;) примерно одинакового размера. Дальнейшая работа выполняется в несколько фаз:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;На первой фазе запускаются partition джобы, которые разбивают весь свой вход на &lt;code&gt;partition_count&lt;/code&gt; партиций, определяя, к какой партиции относится каждая строка;&lt;/li&gt;\n&lt;li&gt;На второй фазе запускаются sorting джобы, которые сортируют данные из полученных партиций. Существуют две опции: если данных в партиции мало, то она сортируется целиком, и на этом обработка партиции заканчивается. Если же данных много и одним джобом их отсортировать не получится, sorting джобы запускаются на частях фиксированного размера данной партиции, далее наступает третья фаза.&lt;/li&gt;\n&lt;li&gt;На третьей фазе, запускаются merge джобы, которые сливают сортированные части больших партиций.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Общие параметры для всех типов операций описаны в разделе &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Настройки операций&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;У операции Sort поддерживаются следующие дополнительные параметры (в скобках указаны значения по умолчанию, если заданы):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;sort_by&lt;/code&gt; — список колонок, по которым будет производиться сортировка. Обязательный параметр;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;input_table_paths&lt;/code&gt; — список входных таблиц с указанием полных путей (не может быть пустым);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;output_table_path&lt;/code&gt; — полный путь к выходной таблице;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;partition_count&lt;/code&gt;, &lt;code&gt;partition_data_size&lt;/code&gt; — опции, которые указывают, сколько партиций должно быть сделано в сортировке, имеют рекомендательный характер;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;partition_job_count&lt;/code&gt;, &lt;code&gt;data_weight_per_partition_job&lt;/code&gt; — опции, которые указывают сколько partition джобов должно быть запущено, имеют рекомендательный характер;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;intermediate_data_replication_factor&lt;/code&gt; (1) — коэффициент репликации промежуточных данных;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;intermediate_data_account&lt;/code&gt; (intermediate) — аккаунт, в квоте которого будут учитываться промежуточные данные сортировки;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;intermediate_compression_codec&lt;/code&gt; (lz4) — кодек, используемый для сжатия промежуточных данных;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;intermediate_data_medium&lt;/code&gt; (&lt;code&gt;default&lt;/code&gt;) — &lt;a href=\"user-guide/storage/media.html\"&gt;тип носителя (медиум)&lt;/a&gt;, на котором хранятся чанки промежуточных данных сортировки;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;partition_job_io, sort_job_io, merge_job_io&lt;/code&gt; — IO-настройки соответствующих типов джобов; секция &lt;code&gt;table_writer&lt;/code&gt; в опции &lt;code&gt;merge_job_io&lt;/code&gt; добавляется ко всем джобам, которые пишут в выходные таблицы;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;schema_inference_mode&lt;/code&gt; (auto) — режим определения схемы. Доступные значения: auto, from_input, from_output. Подробнее можно прочитать в разделе &lt;a href=\"user-guide/storage/static-schema.html#schema_inference\"&gt;Схема данных&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;samples_per_partition&lt;/code&gt; (1000) — количество ключей для выборок из таблицы для каждой партиции (доступно только для динамических таблиц);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;data_weight_per_sorted_merge_job&lt;/code&gt; — опция, регулирующая количество данных на входе в merge джобах, имеет рекомендательный характер;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;sort_locality_timeout&lt;/code&gt; (1 min) — время, в течение которого планировщик будет ждать появления свободных ресурсов на конкретных узлах кластера, чтобы запускать сортировку всех частей каждой партиции на одном узле. Данное действие необходимо для обеспечения большей локальности чтения при последующем слиянии сортированных данных.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;По умолчанию &lt;code&gt;partition_count&lt;/code&gt; и &lt;code&gt;partition_job_count&lt;/code&gt; вычисляются автоматически, исходя из объема исходных данных, так, чтобы минимизировать время выполнения сортировки.&lt;/p&gt;\n&lt;h2 id=\"primer-specifikacii\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/sort.html#primer-specifikacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример спецификации&lt;/span&gt;&lt;/a&gt;Пример спецификации&lt;/h2&gt;\n&lt;p&gt;Пример спецификации Sort операции:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;{\n  &lt;span class=\"hljs-string\"&gt;data_weight_per_partition_job&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;1000000&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;sort_by&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"subkey\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;input_table_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/input_table1\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"//tmp/input_table2\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;output_table_path&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"//tmp/sorted_output_table\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"120\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-120\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-120\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-120.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/operations/sort.md","sourcePath":"ru/user-guide/data-processing/operations/sort.md"},"headings":[{"title":"Пример спецификации","href":"ru/user-guide/data-processing/operations/sort.html#primer-specifikacii","level":2}],"title":"Sort"},"router":{"pathname":"ru/user-guide/data-processing/operations/sort","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
