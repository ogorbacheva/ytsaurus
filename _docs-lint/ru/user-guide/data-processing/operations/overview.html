        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе описаны операции обработки данных, доступные в системе YTsaurus. Вводятся понятия пользовательского скрипта и джоба как составной части операции. Описаны возможные состояния операций и джобов.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/overview.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;В системе YTsaurus поддерживаются следующие операции обработки данных:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt;, &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt;, &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt;&lt;/strong&gt; — выполняют пользовательский код над входными данными;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;Sort&lt;/a&gt;&lt;/strong&gt; — сортирует указанную на входе таблицу;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt;&lt;/strong&gt; — выполняет слияние таблиц;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"user-guide/data-processing/operations/erase.html\"&gt;Erase&lt;/a&gt;&lt;/strong&gt; — удаляет из таблицы указанный диапазон данных;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"user-guide/data-processing/operations/remote-copy.html\"&gt;RemoteCopy&lt;/a&gt;&lt;/strong&gt; — копирует данные между кластерами;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"user-guide/data-processing/operations/vanilla.html\"&gt;Vanilla&lt;/a&gt;&lt;/strong&gt; — запускает набор &lt;strong&gt;пользовательских скриптов&lt;/strong&gt; в нужном количестве на узлах кластера и поддерживает их жизнедеятельность.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;У всех операций есть специальный параметр &lt;code&gt;spec&lt;/code&gt;, в котором передаётся описание настроек операции, так называемая &lt;strong&gt;спецификация&lt;/strong&gt;. Спецификация представляет собой иерархическую структуру, которая задана в &lt;a href=\"user-guide/storage/formats.html#yson\"&gt;формате YSON&lt;/a&gt;. У каждого типа операции своя структура спецификации, её подробное описание можно найти в подразделах, посвященных конкретным типам операций.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Пользовательский скрипт&lt;/strong&gt; — произвольная строка, которая будет выполнена посредством вызова &lt;code&gt;bash -c&lt;/code&gt;, и набор параметров, описывающих детали выполнения. Работа пользовательского скрипта происходит в окружении, которое называется &lt;code&gt;sandbox&lt;/code&gt;. Пользовательский скрипт выполняется от имени служебного пользователя, которого формально нет в системе (речь идет о пользователях системы Linux), и у которого есть права только на чтение/запись в текущую директорию и в директорию &lt;code&gt;tmp&lt;/code&gt;. Подробное описание параметров пользовательского скрипта приведено в разделе &lt;a href=\"user-guide/data-processing/operations/operations-options.html#user_script_options\"&gt;Настройки операций&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Операции запускаются в &lt;strong&gt;вычислительных пулах&lt;/strong&gt;. Пулы организованы в древовидную структуру и позволяют распределять вычислительные ресурсы кластера. Подробнее можно прочитать в разделе &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;Планировщик и пулы&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;В рамках операции выполняются &lt;strong&gt;джобы&lt;/strong&gt; (jobs). Джобы являются единицей параллелизма операции. Входные данные операции делятся на части. Каждая часть входных данных обрабатывается одним джобом.&lt;/p&gt;\n&lt;h2 id=\"parametry-zapushennoj-operacii\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/overview.html#parametry-zapushennoj-operacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Параметры запущенной операции&lt;/span&gt;&lt;/a&gt;Параметры запущенной операции&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Процесс и результат выполнения операций можно отслеживать через веб-интерфейс, экран &lt;strong&gt;Operations&lt;/strong&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Также всю необходимую информацию можно получить с помощью вызова get_operation.&lt;br /&gt;\nВызов возвращает набор атрибутов операции, особенно полезны следующие атрибуты:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;state&lt;/code&gt; — текущее состояние операции;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;progress&lt;/code&gt; — описание прогресса операции по джобам;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;spec&lt;/code&gt; — спецификация запущенной операции;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;result&lt;/code&gt; — результат выполнения (описание ошибки в случае, если операция завершилась с вердиктом &lt;code&gt;failed&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Также существует вызов list_jobs, с помощью которого можно получить список джобов операции — как выполняемых, так и завершившихся.&lt;br /&gt;\nПримеры использования &lt;code&gt;get_operation&lt;/code&gt; и &lt;code&gt;list_jobs&lt;/code&gt; на языке Python в разделе Python wrapper.&lt;/p&gt;\n&lt;h3 id=\"status\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/overview.html#status\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Возможные статусы операции&lt;/span&gt;&lt;/a&gt;Возможные статусы операции&lt;/h3&gt;\n&lt;p&gt;В процессе выполнения операция может переходить из одного статуса в другой:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;running&lt;/code&gt; — операция выполняется;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;pending&lt;/code&gt; — операция находится в очереди на запуск. В каждом &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;пуле&lt;/a&gt; есть ограничение на количество выполняющихся операций, и когда оно превышено, операции выстраиваются в очередь на запуск;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;completed&lt;/code&gt; — операция успешно завершена;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;failed&lt;/code&gt; — операция завершилась с ошибкой. Основные возможные причины: не смогла запуститься из-за некорректных параметров, либо превышен порог для джобов, завершившихся с ошибкой;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;aborted&lt;/code&gt; — операция была прервана. Основные возможные причины: была прервана пользователем, либо была прервана транзакция, в которой запускалась операция;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;reviving&lt;/code&gt; — операция восстанавливается после перезапуска &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;планировщика&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;initializing&lt;/code&gt;, &lt;code&gt;preparing&lt;/code&gt;, &lt;code&gt;materializing&lt;/code&gt;, &lt;code&gt;completing&lt;/code&gt;, &lt;code&gt;aborting&lt;/code&gt;, &lt;code&gt;failing&lt;/code&gt; — переходные состояния операции, необходимы для поэтапного изменения метаинформации в мастер-сервере YTsaurus.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"vozmozhnye-sostoyaniya-dzhobov\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/overview.html#vozmozhnye-sostoyaniya-dzhobov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Возможные состояния джобов&lt;/span&gt;&lt;/a&gt;Возможные состояния джобов&lt;/h3&gt;\n&lt;p&gt;Каждая операция состоит из множества джобов. У джобов, как и у операций, имеются различные состояния:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;running&lt;/code&gt; — джоб выполняется;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;completed&lt;/code&gt; — джоб успешно завершен;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;aborted&lt;/code&gt; — джоб был прерван. Как правило, такое состояние является следствием &lt;strong&gt;вытеснения&lt;/strong&gt; (preemption) или сетевых ошибок. Подробнее о вытеснении в разделе &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;Планировщик и пулы&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;failed&lt;/code&gt; — джоб завершился с ошибкой. Как правило, такое состояние является следствием ошибок в пользовательском скрипте. В таком случае, у данного джоба будет лог с ошибками (stderr), который можно прочитать. Также данные джобы могут появляться, если закончилось место у используемого &lt;a href=\"user-guide/storage/cypress.html\"&gt;аккаунта&lt;/a&gt;, и джоб не может записать результат своей работы;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;waiting&lt;/code&gt; — джоб был отправлен на узел кластера, но стоит в очереди в ожидании ресурсов;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;aborting&lt;/code&gt; — планировщик принял решение о прерывании джоба, но данный процесс на узле кластера еще не закончился.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;На странице операции в веб-интерфейсе можно увидеть количество &lt;code&gt;pending&lt;/code&gt; джобов. Это число не спланированных джобов, которые необходимо будет выполнить до конца операции по предположению планировщика. Количество &lt;code&gt;pending&lt;/code&gt; джобов может отличаться от количества джобов, которое будет реально выполнено: нарезка данных зависит от скорости выполнения джобов.&lt;/p&gt;\n&lt;h4 id=\"aborted_jobs\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/overview.html#aborted_jobs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Прерванные джобы&lt;/span&gt;&lt;/a&gt;Прерванные джобы&lt;/h4&gt;\n&lt;p&gt;Джобы в состоянии &lt;code&gt;aborted&lt;/code&gt; несут в себе информацию, указывающую на класс причин, по которой джоб был прерван:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;scheduler&lt;/code&gt; — джоб был прерван планировщиком, но более точная причина неизвестна;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;failed_chunks&lt;/code&gt; — джоб был прерван узлом кластера из-за невозможности прочитать входные или записать выходные данные;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;resource_overdraft&lt;/code&gt; — джоб был прерван узлом кластера из-за превышения ограничения по памяти. Планировщик по умолчанию выделяет под джоб меньше памяти, чем заказывал пользователь, и в случае, если джоб не укладывается в выделенную память и память на узле кластера заканчивается, такой джоб будет прерван и перезапущен;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;other&lt;/code&gt; — джоб был прерван узлом кластера по неклассифицированной причине;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;preemption&lt;/code&gt; — джоб был прерван планировщиком для запуска другого джоба, сработало вытеснение;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;user_request&lt;/code&gt; — джоб был прерван пользователем;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;node_offline&lt;/code&gt; — джоб был прерван, так как планировщик потерял связь с узлом кластера;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;waiting_timeout&lt;/code&gt; — джоб был прерван, так как стоял в очереди на узле кластера больше определенного времени;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;account_limit_exceeded&lt;/code&gt; — джоб был прерван, так как при записи данных был переполнен аккаунт пользователя. Такие джобы считаются &lt;code&gt;failed&lt;/code&gt;, если не включена опция &lt;code&gt;suspend_operation_if_account_limit_exceeded&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;unknown&lt;/code&gt; — причина прерывания джоба неизвестна. Такое поведение случается, если на кластере работают различные версии вычислительных узлов и планировщика, и узел кластера сообщает планировщику причину, которая неизвестна планировщику;&lt;/li&gt;\n&lt;li&gt;причины, начинающиеся с префикса &lt;code&gt;scheduling_&lt;/code&gt; относятся к случаю, когда планировщик спланировал джоб, но в силу определенных обстоятельств отменил джоб до того, как запланировать его на узле кластера. То есть джобы такого типа тратят впустую только ресурсы самого планировщика, но не ресурсы кластера:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;scheduling_timeout&lt;/code&gt; — планировщик не успел спланировать джоб за отведенное время. Может происходить при запуске крупных операций — с большим объёмом входных данных порядка нескольких петабайт, а также когда планировщик перегружен по CPU;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;scheduling_resource_overcommit&lt;/code&gt; — после планирования джоба выяснилось, что превышен &lt;code&gt;resource_limits&lt;/code&gt; операции или одного из родительских пулов;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;scheduling_operation_suspended&lt;/code&gt; — после планирования джоба контроллером выяснилось, что операция была приостановлена;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;scheduling_job_spec_throttling&lt;/code&gt; — после планирования джоба для него формируется спецификация, в которой в том числе содержится метаинформация о входных чанках для джоба. В случае, когда входных чанков слишком много, активируется логика по ограничению создания джобов для конкретной операции. Какие-то джобы операции при этом могут быть прерваны;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;scheduling_intermediate_chunk_limit_exceeded&lt;/code&gt; — джоб был прерван, так как превышено ограничение на количество промежуточных чанков, которые может создать операция при включенном автоматическом слиянии выходных чанков в режимах &lt;code&gt;economy&lt;/code&gt; и &lt;code&gt;manual&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;scheduling_other&lt;/code&gt; — джоб был прерван планировщиком по неклассифицированной причине.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"completed_jobs\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/overview.html#completed_jobs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Завершившиеся джобы&lt;/span&gt;&lt;/a&gt;Завершившиеся джобы&lt;/h4&gt;\n&lt;p&gt;Возможна ситуация когда планировщик решает прервать джоб, при этом планировщик перестает подавать новые данные на вход джоба согласованно с гарантиями операции и дает определенное время, чтобы джоб завершился. В случае, если джоб успешно завершился в рамках отведенного ему времени, он переходит в состояние &lt;code&gt;completed&lt;/code&gt;, а не &lt;code&gt;aborted&lt;/code&gt;, хоть и был прерван. У таких &lt;code&gt;completed&lt;/code&gt; джобов имеется атрибут &lt;code&gt;interrupt_reason&lt;/code&gt; не равное &lt;code&gt;none&lt;/code&gt; и обозначающее причину, по которой планировщик решил прервать джоб.&lt;br /&gt;\nВозможные значения причины прерывания джоба в таких случаях:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;none&lt;/code&gt; — джоб успешно завершился без прерывания;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;preemption&lt;/code&gt; — джоб был прерван планировщиком для запуска другого джоба, сработало вытеснение;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;user_request&lt;/code&gt; — джоб был прерван пользователем;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;job_split&lt;/code&gt; — джоб был прерван, чтобы разбить его на большее количество джобов;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;unknown&lt;/code&gt; — причина прерывания джоба неизвестна. Такое случается, если решение о прерывании джоба было отправлено на узел кластера и после этого планировщик был перезапущен.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"standartnyj-potok-oshibok\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/overview.html#standartnyj-potok-oshibok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стандартный поток ошибок&lt;/span&gt;&lt;/a&gt;Стандартный поток ошибок&lt;/h4&gt;\n&lt;p&gt;В джобе операции можно писать данные в стандартный поток ошибок (stderr), записанные данные будут сохранены и доступны для чтения. Записывать данные в stderr бывает полезно для отладки.&lt;br /&gt;\nПолучить stderr джоба можно командой &lt;code&gt;get_job_stderr&lt;/code&gt;, получить список джобов можно командой &lt;code&gt;list_jobs&lt;/code&gt;. В параметрах &lt;code&gt;list_jobs&lt;/code&gt; для удобства можно указать, что следует вывести только джобы с записанным stderr. &lt;code&gt;list_jobs&lt;/code&gt; и &lt;code&gt;get_job_stderr&lt;/code&gt; доступны, например, из Python, их описание в разделе Python wrapper.&lt;br /&gt;\nЧтобы stderr операции не занимали слишком много места, применяются следующие политики при их записи:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Сохраняется не больше &lt;code&gt;max_stderr_size&lt;/code&gt; байтов, записанных в stderr. Все, что записано после данного лимита, игнорируется.&lt;/li&gt;\n&lt;li&gt;Никогда не сохраняется более 150 stderr-ов джобов — это настройка планировщика.&lt;/li&gt;\n&lt;li&gt;По умолчанию сохраняется не более 20 stderr-ов джобов — это настройка операции. Может принимать значение до 150.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"chunk_strategy\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/overview.html#chunk_strategy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Борьба с недоступностью данных&lt;/span&gt;&lt;/a&gt;Борьба с недоступностью данных&lt;/h2&gt;\n&lt;h3 id=\"strategii-i-taktiki\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/overview.html#strategii-i-taktiki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стратегии и тактики&lt;/span&gt;&lt;/a&gt;Стратегии и тактики&lt;/h3&gt;\n&lt;p&gt;Для каждой операции в спецификации имеется две настройки: &lt;code&gt;unavailable_chunk_strategy&lt;/code&gt; и &lt;code&gt;unavailable_chunk_tactics&lt;/code&gt;. Их возможные значения: &lt;code&gt;wait&lt;/code&gt;, &lt;code&gt;fail&lt;/code&gt; и &lt;code&gt;skip&lt;/code&gt;. Данные значения определяют поведение планировщика в случае, когда необходимые входные данные для операции недоступны:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;wait&lt;/code&gt; — ждать появления данных до бесконечности;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;fail&lt;/code&gt; — немедленно прерывать операцию;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;skip&lt;/code&gt; — пропускать недоступные данные и выполнять расчет на неполном наборе.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Стратегия и тактика влияют на поведение на разных стадиях операции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;стратегия&lt;/strong&gt; используется при запуске операции и первоначальном планировании объема работ;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;тактика&lt;/strong&gt; используется при появлении недоступных данных для уже выполняемой операции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Теоретически возможно 9 комбинаций, однако не все из них имеют смысл. Полезны следующие сочетания:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;стратегия &lt;code&gt;wait&lt;/code&gt;, тактика &lt;code&gt;wait&lt;/code&gt; — используется по умолчанию, расчет обязательно выполнить по полным данным, возможно ценой ожидания;&lt;/li&gt;\n&lt;li&gt;стратегия &lt;code&gt;fail&lt;/code&gt;, тактика &lt;code&gt;wait&lt;/code&gt; — при запуске нужно убедиться в целостности данных, в случае возникновения потерь — ожидать, пока данные станут доступны;&lt;/li&gt;\n&lt;li&gt;стратегия &lt;code&gt;skip&lt;/code&gt;, тактика &lt;code&gt;skip&lt;/code&gt; — расчет нужно выполнить по любым имеющимся данным как можно скорее;&lt;/li&gt;\n&lt;li&gt;стратегия &lt;code&gt;skip&lt;/code&gt;, тактика &lt;code&gt;wait&lt;/code&gt; — расчет необходимо запустить прямо сейчас, фиксировав масштаб потерь, никакие дополнительные потери не допустимы, следует ждать доступности данных;&lt;/li&gt;\n&lt;li&gt;стратегия &lt;code&gt;skip&lt;/code&gt;, тактика &lt;code&gt;fail&lt;/code&gt; — расчет необходимо запустить прямо сейчас, фиксировав масштаб потерь, никакие дополнительные потери не допустимы, при их возникновении расчет нужно прервать;&lt;/li&gt;\n&lt;li&gt;стратегия &lt;code&gt;fail&lt;/code&gt;, тактика &lt;code&gt;fail&lt;/code&gt; — расчет нужно выполнить на полных данных, в случае недоступности сообщить об этом как можно скорее.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В процессе работы планировщик периодически запрашивает у мастера статус входных чанков у операции. В случае обнаружения планировщиком недоступных данных релевантная часть вычисления останавливается. Джобы, использующие эти данные, не запускаются, но запрос чанков у мастера продолжается. Каждый запрос &lt;code&gt;erasure&lt;/code&gt; чанка вызывает его перемещение наверх в очереди чанков, ожидающих восстановления (т.н. move to front). Соответственно, те чанки, которые нужны прямо сейчас для работы операций, будут восстановлены в первоочередном порядке.&lt;/p&gt;\n&lt;p&gt;Данные действия полностью автоматические и не требуют никаких настроек.&lt;/p&gt;\n&lt;h3 id=\"chunk_erasure_strategy\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/overview.html#chunk_erasure_strategy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Доступность erasure-чанков&lt;/span&gt;&lt;/a&gt;Доступность erasure-чанков&lt;/h3&gt;\n&lt;p&gt;Чтобы настроить поведение операции в случае недоступности erasure-кодированных чанков, можно воспользоваться опцией &lt;code&gt;chunk_availability_policy&lt;/code&gt;. Эта опция регулирует, когда чанк считается доступным:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;data_parts_available&lt;/code&gt; – чанк считается доступным, если доступны все части с данными (data parts). Контрольные части (parity parts) при этом могут быть потеряны. При такой настройке операции не потребуется ожидать восстановления данных перед чтением.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;repairable&lt;/code&gt; – чанк считается доступным, если контрольных частей достаточно, чтобы восстановить данные. Части с данными при этом могут быть потеряны. В этом случае операция будет ожидать восстановления данных из контрольных частей.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;all_parts_available&lt;/code&gt; – чанк считается доступным, если доступны все его части: части с данными и контрольные части.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"zapusk-cherez-c-i-python-wrapper\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/overview.html#zapusk-cherez-c-i-python-wrapper\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск через C++ и Python Wrapper&lt;/span&gt;&lt;/a&gt;Запуск через C++ и Python Wrapper&lt;/h2&gt;\n&lt;p&gt;При запуске операций через С~++ и Python Wrapper помимо вызова соответствующей команды драйвера происходит ряд подготовительных работ. К ним относятся:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;загрузка файлов в &lt;a href=\"user-guide/storage/file-cache.html\"&gt;Файловый кеш&lt;/a&gt;;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Примечание&lt;/strong&gt;: Автоматическая загрузка файлов в кеш всегда происходит вне пользовательской транзакции, что может приводить к конфликтам на узлах Кипариса, если каталог с файловым кешем не был создан заранее.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;создание выходных таблиц или их очистка с помощью команды &lt;code&gt;erase&lt;/code&gt;. С точки зрения системы, при запуске операции все выходные таблицы уже должны существовать;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;удаление файлов после завершения операции;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;установка параметров &lt;code&gt;jobcount&lt;/code&gt; и &lt;code&gt;memorylimit&lt;/code&gt;, если они указаны пользователем;&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;часть параметров может иметь значения по умолчанию, отличные от системных.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"ogranicheniya-na-chislo-tablic-i-dzhobov\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/overview.html#ogranicheniya-na-chislo-tablic-i-dzhobov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения на число таблиц и джобов&lt;/span&gt;&lt;/a&gt;Ограничения на число таблиц и джобов&lt;/h2&gt;\n&lt;p&gt;В системе действуют ограничения на параметры операций, которые нужно учитывать при работе.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Существует ограничение на число входных таблиц любой операции. По умолчанию на «больших» продуктовых кластерах данное ограничение равно 3 000. На тестовых кластерах, а также кластерах, где не предполагается крупных MapReduce операций, ограничение может быть меньше, но при необходимости также может быть увеличено до 3 000;&lt;/li&gt;\n&lt;li&gt;Отдельного ограничения на количество выходных таблиц не существует, но следует понимать, что каждая выходная таблица требует поддержания буферов в памяти. Поэтому, указав 1 000 выходных таблиц, вы получите операцию, у джобов которой будут невыполнимые требования по памяти, поэтому они не будут запускаться. Практически верхнее ограничение составляет около 100 выходных таблиц. Если требуется больше, необходимо разбить операцию на несколько и выполнить обработку поэтапно;&lt;/li&gt;\n&lt;li&gt;Существует ограничение на количество джобов операций. Для &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt;, &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt;, &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt;, &lt;a href=\"user-guide/data-processing/operations/remote-copy.html\"&gt;RemoteCopy&lt;/a&gt; оно составляет 100 000 джобов. В случае &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt; и сортированного &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt; сформировать столько джобов может не получиться, так как у планировщика не будет достаточного количества семплов. Для операций с shuffle-стадией (&lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;Sort&lt;/a&gt; и &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt;) существует ограничение в 5 000 партиций. Подробнее о партициях можно узнать в соответствующих разделах, посвящённых конкретным типам операций;&lt;/li&gt;\n&lt;li&gt;Существует ограничение на произведение количества джобов операции на количество выходных таблиц. Данное ограничение необходимо для того, чтобы операция не порождала большого количества чанков, которые могут сильно нагрузить мастер-серверы. На «больших» продуктовых кластерах данное ограничение равно 2 000 000.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"transactions\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/overview.html#transactions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Транзакционность обработки данных&lt;/span&gt;&lt;/a&gt;Транзакционность обработки данных&lt;/h2&gt;\n&lt;p&gt;На любую операцию можно смотреть как на черный ящик, у которого есть набор входов и набор выходов, а также набор используемых в ходе работы артефактов, то есть файлов и порто-слоев. Общая логика работы операции является достаточно простой: он берет exclusive-локи на выходные таблицы под специальной output-транзакцией и snapshot-локи на входные таблицы (и артефакты) под специальной input-транзакцией, дальше выполняются все вычисления и в случае успеха коммитится output-транзакций. В противном случае, если операция была прервана или завершилась ошибкой – output-транзакция прерывается.&lt;/p&gt;\n&lt;p&gt;Также опишем разные нюансы и особые случаи:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Если таблица есть как среди входных, так и среди выходных таблиц, то для таблицы берется только exclusive-лок в output-транзакции и данные как читаются, так и записываются из данной версии таблицы.&lt;/li&gt;\n&lt;li&gt;В случае, если выходная таблица помечена флагом &lt;code&gt;append&lt;/code&gt;, то для неё берется shared-лок. Логика из предыдущего пункта работать не будет, если таблицы есть и во входе и на выходе.&lt;/li&gt;\n&lt;li&gt;Сама операция может быть запущена в рамках пользовательской транзакции, в таком случае input- и output-транзакции создаются как подтранзакции пользовательской транзакции.&lt;/li&gt;\n&lt;li&gt;Транзакции планировщика создаются с timeout, достаточным, чтобы переживать даунтаймы кластера, которые могут занимать часы. Далее они пингуются планировщиком. При стандартном обновлении планировщика, он переиспользует уже имеющиеся транзакции у операций. В случае длинных учений или мажорного обновления мастер-сервера, транзакции прерываются, операции перезапускаются с нуля и в частности заново берутся локи на таблицы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Также у операции может быть debug-транзакция, в случае, если у операции есть core- или stderr-таблицы. Под данной транзакцией происходит запись core-файлов и stderr-ов, данная транзакция коммитится даже в случае прерывания или завершения операции ошибкой.&lt;/p&gt;\n&lt;p&gt;Указанные транзакции можно посмотреть в атрибутах операции:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;input_transaction_id&lt;/code&gt;, &lt;code&gt;nested_input_transaction_ids&lt;/code&gt; – транзакция, под которой берутся локи на входные таблицы и артефакты. Это может быть список транзакций, если используются &lt;code&gt;transaction_id&lt;/code&gt; на входных таблицах;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;output_transaction_id&lt;/code&gt; – транзакция, под которой записываются данные в выходные таблицы;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;debug_transaction_id&lt;/code&gt; – транзакция, под которой записываются core- и stderr-таблицы;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;async_scheduler_transaction_id&lt;/code&gt; – транзакция, под которой записываются временные данные в операции, которая всегда прерывается по завершении операции. Например, под ней живут intermediate-данные.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;output_completion_transaction_id&lt;/code&gt;, &lt;code&gt;debug_completion_transaction_id&lt;/code&gt; – технические транзакции, которые используются при успешном завершении операции, чтобы атомарно закоммитить результат работы операции.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"ispolzovanie-dannyh-s-drugogo-klastera\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/overview.html#ispolzovanie-dannyh-s-drugogo-klastera\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование данных с другого кластера&lt;/span&gt;&lt;/a&gt;Использование данных с другого кластера&lt;/h2&gt;\n&lt;p&gt;Для любой операции можно указать атрибут &lt;code&gt;cluster&lt;/code&gt; на одной или нескольких входных таблицах. Это приведет к тому, что данные будут прочитаны с указанного кластера.&lt;br /&gt;\nНазвание кластера нужно указывать точно такое же, как для операций RemoteCopy.&lt;br /&gt;\nНапример, чтобы читать с кластера &lt;code&gt;my-cluster&lt;/code&gt;, нужно указать &lt;code&gt;&amp;lt;cluster=my-cluster&amp;gt;//path/to/table&lt;/code&gt; или &lt;code&gt;my-cluster://path/to/table&lt;/code&gt; качестве входной таблицы (см. также &lt;a href=\"user-guide/storage/ypath.html#rich_ypath\"&gt;RichYPath&lt;/a&gt;).&lt;br /&gt;\nДля того, чтобы кластер мог быть использован в качестве входного, он должен быть добавлен администратором в &lt;code&gt;//sys/clusters&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Файлы, привозимые в каждый джоб (секция &lt;code&gt;/mapper/file_paths&lt;/code&gt; или &lt;code&gt;/reducer/file_paths&lt;/code&gt;), могут быть прочитаны только с локального кластера, поэтому, при необходимости использовать их с другого кластера, необходимо перенести их заранее с помощью операции RemoteCopy.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/operations/overview.md","sourcePath":"ru/user-guide/data-processing/operations/overview.md"},"headings":[{"title":"Обзор","href":"ru/user-guide/data-processing/operations/overview.html#obzor","level":2},{"title":"Параметры запущенной операции","href":"ru/user-guide/data-processing/operations/overview.html#parametry-zapushennoj-operacii","level":2,"items":[{"title":"Возможные статусы операции","href":"ru/user-guide/data-processing/operations/overview.html#status","level":3},{"title":"Возможные состояния джобов","href":"ru/user-guide/data-processing/operations/overview.html#vozmozhnye-sostoyaniya-dzhobov","level":3,"items":[{"title":"Прерванные джобы","href":"ru/user-guide/data-processing/operations/overview.html#aborted_jobs","level":4},{"title":"Завершившиеся джобы","href":"ru/user-guide/data-processing/operations/overview.html#completed_jobs","level":4},{"title":"Стандартный поток ошибок","href":"ru/user-guide/data-processing/operations/overview.html#standartnyj-potok-oshibok","level":4}]}]},{"title":"Борьба с недоступностью данных","href":"ru/user-guide/data-processing/operations/overview.html#chunk_strategy","level":2,"items":[{"title":"Стратегии и тактики","href":"ru/user-guide/data-processing/operations/overview.html#strategii-i-taktiki","level":3},{"title":"Доступность erasure-чанков","href":"ru/user-guide/data-processing/operations/overview.html#chunk_erasure_strategy","level":3}]},{"title":"Запуск через C++ и Python Wrapper","href":"ru/user-guide/data-processing/operations/overview.html#zapusk-cherez-c-i-python-wrapper","level":2},{"title":"Ограничения на число таблиц и джобов","href":"ru/user-guide/data-processing/operations/overview.html#ogranicheniya-na-chislo-tablic-i-dzhobov","level":2},{"title":"Транзакционность обработки данных","href":"ru/user-guide/data-processing/operations/overview.html#transactions","level":2},{"title":"Использование данных с другого кластера","href":"ru/user-guide/data-processing/operations/overview.html#ispolzovanie-dannyh-s-drugogo-klastera","level":2}],"title":"Типы операций"},"router":{"pathname":"ru/user-guide/data-processing/operations/overview","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"
