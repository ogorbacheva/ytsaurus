        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе приведено описание общих параметров для операций любых видов, параметров пользовательского скрипта, атрибутов на путях и файлах.&lt;/p&gt;\n&lt;h2 id=\"common_options\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/operations-options.html#common_options\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общие опции для всех типов операций&lt;/span&gt;&lt;/a&gt;Общие опции для всех типов операций&lt;/h2&gt;\n&lt;p&gt;Приведенные параметры могут быть указаны в корне спецификации любой операции.&lt;br /&gt;\nВ скобках указаны значения по умолчанию если заданы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;pool&lt;/code&gt; — имя &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;вычислительного пула&lt;/a&gt;, в котором будет работать операция. Если данный параметр не указан, то в качестве имени пула берется имя пользователя в YTsaurus, запустившего операцию.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;weight&lt;/code&gt;(1.0) —  вес запущенной операции, определяет, какую долю вычислительной квоты пула получит операция. Подробнее можно прочитать в разделе &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;Планировщик и пулы&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;pool_trees&lt;/code&gt; — список &lt;a href=\"user-guide/data-processing/scheduler/scheduler-and-pools.html\"&gt;деревьев пулов&lt;/a&gt;, в которых будут запускаться джобы операции. Дерево пулов, используемое по умолчанию, настраивается администратором кластера.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;DEPRECATED&lt;/strong&gt; &lt;code&gt;tentative_pool_trees&lt;/code&gt; — список пробных деревьев пулов, которые будут использоваться для запуска операции при условии отсутствия деградаций.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;DEPRECATED&lt;/strong&gt; &lt;code&gt;use_default_tentative_pool_trees&lt;/code&gt; — включить использование всех деревьев в кластере, которые считаются подходящими под определение &lt;code&gt;tentative&lt;/code&gt; по отношению к дереву пулов, используемому по умолчанию.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;DEPRECATED&lt;/strong&gt; &lt;code&gt;tentative_tree_eligibility&lt;/code&gt; — конфигурация с настройками выполнения джобов операции в &lt;code&gt;tentative&lt;/code&gt; деревьях:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;sample_job_count&lt;/code&gt; (10) — количество джобов, которое будет запущено в качестве пробы.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_tentative_job_duration_ratio&lt;/code&gt; (10) — максимальное допустимое замедление времени выполнения джобов.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;min_job_duration&lt;/code&gt; (30) — настройка, задающая границу времени работы джобов в &lt;code&gt;tentative&lt;/code&gt; деревьях. Новые джобы операции не будут запускаться в соответствующем &lt;code&gt;tentative&lt;/code&gt; дереве, если среднее время выполнения джобов в &lt;code&gt;tentative&lt;/code&gt; дереве больше данной границы.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ignore_missing_pool_trees&lt;/code&gt; (false) — включение данной опции игнорирует отсутствующие &lt;code&gt;tentative&lt;/code&gt; деревья в кластере.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;resource_limits&lt;/code&gt; — настройки fair-share, которые будут действовать суммарно на все джобы операции. Подробнее можно прочитать в разделе &lt;a href=\"user-guide/data-processing/scheduler/pool-settings.html#operations\"&gt;Характеристики пулов&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;time_limit&lt;/code&gt; — ограничение на время работы операции в целом (в миллисекундах). Если операция не успеет завершиться за указанное время, она будет принудительно завершена планировщиком.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;acl&lt;/code&gt; —  Access Control List, определяющий права доступа к операции. Право &lt;code&gt;manage&lt;/code&gt; означает мутирующие действия над операцией и ее джобами: abort, suspend, использование job shell и так далее. Право &lt;code&gt;read&lt;/code&gt; — немутирующие: get_job_stderr, get_job_input_context и так далее. К указанному &lt;code&gt;acl&lt;/code&gt; будут добавлены записи про пользователя, запустившего операцию, и администраторов YTsaurus.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;max_stderr_count&lt;/code&gt; (10) — ограничение на количество сохраняемых данных из стандартного потока ошибок (stderr) джобов, по умолчанию берется из настроек кластера, где это значение обычно равно 10. Максимальное значение параметра — 150.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;max_failed_job_count&lt;/code&gt; (10) — количество failed джобов, после которого операция считается failed. По умолчанию берется из настроек кластера, где это значение обычно равно 10.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;unavailable_chunk_strategy&lt;/code&gt; и &lt;code&gt;unavailable_chunk_tactics&lt;/code&gt; — как поступать в случае недоступности промежуточных результатов вычисления. Подробнее смотрите в разделе &lt;a href=\"user-guide/data-processing/operations/overview.html#chunk_strategy\"&gt;Типы операций&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;chunk_availability_policy&lt;/code&gt; — поведение системы в случае недоступности erasure-чанков. Подробнее читайте в разделе &lt;a href=\"user-guide/data-processing/operations/overview.html#chunk_erasure_strategy\"&gt;Типы операций&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;scheduling_tag_filter&lt;/code&gt; — фильтр для выбора узлов кластера при запуске джобов. Фильтр представляет собой &lt;a href=\"admin-guide/node-tags.html\"&gt;логическое выражение&lt;/a&gt; с операторами &lt;code&gt;&amp;amp;&lt;/code&gt; (логическое «и»), &lt;code&gt;|&lt;/code&gt; (логическое «или»), &lt;code&gt;!&lt;/code&gt; (логическое «не») и круглыми скобками. Переменными в выражении являются возможные значения тегов узлов кластера. Тег представляет собой метку, которой размечается узел кластера. Разметка осуществляется командой сервиса YTsaurus при конфигурировании кластера. Если у узла кластера имеется тег, заданный в выражении, то выражение принимает значение «истина», если нет — «ложно». Если всё выражение целиком принимает значение «ложно», то такой узел кластера не будет выбран для запуска джоба.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;max_data_weight_per_job&lt;/code&gt; (200 Gb) — максимальный разрешенный объем данных на входе у одного джоба в байтах. Данная опция задает жесткую верхнюю границу на размер джоба. Если планировщик будет не в состоянии сформировать джоб меньшего размера, операция завершится ошибкой.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;data_weight_per_job&lt;/code&gt; (256 Mb) — рекомендованный объем данных на входе одного джоба в байтах. Опция не имеет смысла для составных операций, например MapReduce. В таких операциях нужно использовать следующие опции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;data_weight_per_map_job&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;data_weight_per_sort_job&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;data_weight_per_partition_job&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;data_weight_per_sorted_merge_job&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;data_weight_per_reduce_job&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;secure_vault&lt;/code&gt; — значения из данного словаря попадут в окружения всех пользовательских джобов данной операции и при этом не будут доступны для просмотра посторонними пользователями, в отличие от секции &lt;code&gt;environment&lt;/code&gt; в спецификации пользовательского джоба. А именно, в переменную окружения &lt;code&gt;YT_SECURE_VAULT&lt;/code&gt; запишется весь переданный словарь в YSON-формате, а также для удобства использования для каждой пары &lt;code&gt;key=value&lt;/code&gt; из словаря в переменную окружения &lt;code&gt;YT_SECURE_VAULT_key&lt;/code&gt; запишется значение value. Так произойдет, только если value является примитивным типом, то есть int64, uint64, double, boolean или string.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;stderr_table_path&lt;/code&gt; — может быть указан путь к существующей таблице, таблица должна быть создана вне транзакций. Если данная настройка указана, то полные данные из стандартного потока ошибок (stderr) всех джобов (кроме aborted) будут записаны в указанную таблицу. Таблица будет иметь следующие колонки:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;job_id&lt;/code&gt; — идентификатор джоба.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;part_index&lt;/code&gt; — в случае большого сообщения об ошибке, сообщение stderr одного джоба может быть разбито на несколько частей (в разных строках), в данной колонке записан номер такой части.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;data&lt;/code&gt; — данные из стандартного потока ошибок.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;redirect_stdout_to_stderr&lt;/code&gt; - опция для перенаправления стандартного потока вывода (stdout) в стандартный поток ошибок (stderr).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;core_table_path&lt;/code&gt; — путь к существующей таблице для записи core dump. Формат таблицы аналогичен описанному в &lt;code&gt;stderr_table_path&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;input_query&lt;/code&gt; — для операций &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt;, &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt; можно выполнить предварительную фильтрацию каждой входной строки с помощью &lt;a href=\"user-guide/dynamic-tables/dyn-query-language.html\"&gt;языка запросов&lt;/a&gt;. Поскольку входная таблица и так известна и предполагается, что фильтрация будет отдельной для каждой строки, синтаксис запросов меняется и упрощается до &lt;code&gt;* | &amp;lt;select-expr-1&amp;gt; [AS &amp;lt;select-alias-1&amp;gt;]... [WHERE &amp;lt;predicate-expr&amp;gt;]&lt;/code&gt;. В частности, нельзя использовать &lt;code&gt;GROUP BY&lt;/code&gt; и &lt;code&gt;ORDER BY&lt;/code&gt;. Запросы работают со строго схематизированными данными, поэтому необходимо, чтобы исходные таблицы имели строгую схему. В операции &lt;a href=\"user-guide/data-processing/operations/merge.html\"&gt;Merge&lt;/a&gt; схема итоговых данных в запросе учитывается при выводе схемы для выходной таблицы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В случае указания параметра &lt;code&gt;input_query&lt;/code&gt;, атрибуты &lt;code&gt;enable_row_index&lt;/code&gt; и &lt;code&gt;enable_range_index&lt;/code&gt; не попадут в джоб.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;omit_inaccessible_columns&lt;/code&gt; (false) — пропускать колонки, доступ к которым отсутствует. По умолчанию операция в такой ситуации завершится с ошибкой при запуске.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;alias&lt;/code&gt; — алиас данной операции. Делает операцию доступной в поиске и с использованием команды &lt;code&gt;get-operation&lt;/code&gt; по указанной строке.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;job_node_account&lt;/code&gt; (tmp_jobs) — аккаунт, под которым будут храниться чанки файлов с логом ошибок (stderr) и input context.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;suspend_operation_if_account_limit_exceeded&lt;/code&gt; (false) — приостанавливать (ставить на паузу) операцию в случае возникновения ошибки «Account limit exceeded» в джобе.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;enable_job_splitting&lt;/code&gt; (true) — разрешать ли планировщику адаптивно доразбивать пользовательские джобы, которые долго выполняются.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;fail_on_job_restart&lt;/code&gt; (false) — принудительно прерывать операцию при любом отличном от успешного (то есть abort или fail) завершении джоба, который успел начать свою работу. Полезно для операций, для которых недопустим перезапуск джобов.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;title&lt;/code&gt; — заголовок операции. Переданный в него текст будет отображен в веб-интерфейсе.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;started_by&lt;/code&gt; — словарь, описывающий клиента, посредством которого была запущена операция. Данное поле не предполагает строгой схемы, указанная информация будет отражена в веб-интерфейсе на странице операции.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;annotations&lt;/code&gt; — словарь, в который пользователь может записать произвольную структурированную информацию, связанную с операцией. Содержимое &lt;code&gt;annotations&lt;/code&gt; в &lt;a href=\"user-guide/storage/formats.html#yson\"&gt;YSON&lt;/a&gt;-формате попадает в архив операций, так что по нему можно в дальнейшем искать и идентифицировать операции в архиве.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Не рекомендуется добавлять пользовательскую информацию в корень спецификации. Это приводит к появлению пользовательских данных в неразобранной части спецификации (Unrecognized Spec), и в будущем подобная практика будет запрещена.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;description&lt;/code&gt; — словарь, аналогичный &lt;code&gt;annotations&lt;/code&gt;, также отображается в веб-интерфейсе на странице операции. В данную секцию стоит добавлять исключительно человекочитаемую информацию небольшого размера, чтобы не перегружать информацией страницу операции.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;use_columnar_statistics&lt;/code&gt; (false) — использовать поколоночные статистики для точной оценки размеров джобов при запуске операций поверх таблиц с колоночными выборками. Данная опция улучшает автоматику разбиения на джобы, при этом из входных данных берутся колонки, образующие малую долю размера входных таблиц (ранее выбор колонок игнорировался и джобы получались очень маленькими, на что приходилось влиять с помощью опции &lt;code&gt;data_weight_per_job&lt;/code&gt;).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;sampling&lt;/code&gt; — конфигурация крупноблочного сэмплирования входных данных (недоступно в операциях Sort, RemoteCopy и Vanilla). Эта опция устарела, используйте &lt;a href=\"user-guide/storage/io-configuration.html#sampling\"&gt;сэмплирование при чтении&lt;/a&gt;. Опция &lt;code&gt;sampling&lt;/code&gt; поддерживает только поблочный вид сэмплирования – старается пропорционально уменьшить количество прочитанных с диска данных, и поэтому в идеальных обстоятельствах должен приводить к пропорциональному ускорению операции. Ценой этого является тот факт, что результат не является полноценным сэмплированием в математическом смысле этого слова, а является лишь его приближением: данные разбиваются на достаточно большие блоки идущих подряд строк, и далее происходит сэмплирование данных блоков целиком. Для прикладных расчетов на достаточно больших таблицах результат может оказаться состоятельным. Значение параметра задается словарем со следующими ключами:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;sampling_rate&lt;/code&gt; (null) — доля оставляемых строк.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;io_block_size&lt;/code&gt; (16Mb) — минимальный размер блока сэмплирования. Не рекомендуется менять значение по умолчанию.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;max_speculative_job_count_per_task&lt;/code&gt; — лимит числа спекулятивных джобов (пока поддерживаются для операций Map, Reduce, MapReduce, Sort, Merge).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;job_speculation_timeout&lt;/code&gt; — таймаут в миллисекундах, по истечении которого для исполняемого джоба необходимо запустить спекулятивный джоб.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;try_avoid_duplicating_jobs&lt;/code&gt; — (false) по возможности не запускать джобы с одинаковым входом, если это не требуется. В частности, отключает спекулятивные джобы. Но невозможно гарантировать, что джобы с одинаковым входом не будут запущены. Например, если узел, на котором был запущен первый экземпляр джоба, потерял связность с кластером, то джоб на нём будет продолжать бежать и потенциально выполнять наблюдаемые побочные действия. А кластеру придется перезапустить джоб с тем же входом на другом узле.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Для каждого типа джоба в операции можно настраивать его &lt;a href=\"user-guide/storage/io-configuration.html\"&gt;параметры ввода-вывода&lt;/a&gt;. Если у операции имеется один тип джоба, секция в спецификации называется &lt;code&gt;job_io&lt;/code&gt;. Если в операции есть разнотипные джобы (это относится к операциям MapReduce и Sort), то для каждого типа есть своя секция. Названия этих секций перечислены среди настроек соответствующих операций.&lt;/p&gt;\n&lt;h2 id=\"user_script_options\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/operations-options.html#user_script_options\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Параметры пользовательского скрипта&lt;/span&gt;&lt;/a&gt;Параметры пользовательского скрипта&lt;/h2&gt;\n&lt;p&gt;Для каждого пользовательского скрипта поддерживаются следующие параметры (в скобках указаны значения по умолчанию, если определены):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;command&lt;/code&gt; (обязательный параметр) — строка, которая будет выполнена посредством вызова &lt;code&gt;bash -c&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;file_paths&lt;/code&gt; — список путей в &lt;a href=\"user-guide/storage/cypress.html\"&gt;Кипарисе&lt;/a&gt; к файлам или таблицам. Данные файлы и таблицы будут скачаны на узел кластера, где происходит выполнение команды, и в специальном окружении &lt;code&gt;sandbox&lt;/code&gt; будут находиться символические ссылки на скачанные файлы. Ссылки доступны только на чтение. Имя файла по умолчанию будет равно basename пути в Кипарисе, но его можно изменить, указав в атрибуте &lt;code&gt;file_name&lt;/code&gt; на пути. Если путь указывает на таблицу, необходимо указать атрибут &lt;code&gt;format&lt;/code&gt; — &lt;a href=\"user-guide/storage/formats.html\"&gt;формат&lt;/a&gt;, в котором таблица должна быть сохранена в файл на диске. Размер табличных файлов ограничен некоторой константой, сконфигурированной для заданного кластера.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;docker_image&lt;/code&gt; — имя докер-образа для корневой файловой системы джоба.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;layer_paths&lt;/code&gt; — список путей к porto-слоям в Кипарисе. Слои перечисляются от верхнего к нижнему.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;cuda_toolkit_version&lt;/code&gt; – версия &lt;a href=\"https://ru.wikipedia.org/wiki/CUDA\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;CUDA&lt;/a&gt;, требуемая джобу. Если версия указана, то в джоб будет подложен стандартный delta-слой с данной CUDA.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;format&lt;/code&gt;, &lt;code&gt;input_format&lt;/code&gt;, &lt;code&gt;output_format&lt;/code&gt; (yson) — &lt;a href=\"user-guide/storage/formats.html\"&gt;формат&lt;/a&gt;, в котором на вход операции поступают табличные данные. Опции &lt;code&gt;input_format&lt;/code&gt; и &lt;code&gt;output_format&lt;/code&gt; имеют приоритет над опцией &lt;code&gt;format&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;environment&lt;/code&gt; — словарь переменных окружения, которые будут указаны при выполнении операции. Данная опция нужна, чтобы не указывать переменные окружения в параметре &lt;code&gt;command&lt;/code&gt; и не снижать его читаемость.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;cpu_limit&lt;/code&gt; (1) — число вычислительных ядер, которое будет учтено планировщиком за выполняемым джобом при его планировании.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;set_container_cpu_limit&lt;/code&gt; (false) — выставлять porto-контейнеру &lt;code&gt;cpu_limit&lt;/code&gt;, равный заказанному.  По умолчанию выставляется только вес, пропорциональный заказанному &lt;code&gt;cpu_limit&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;gpu_limit&lt;/code&gt; (0) — количество GPU-карт, которое будет выдано джобу.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;memory_limit&lt;/code&gt; (512Mb) — ограничение на потребление памяти джобом в байтах.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;user_job_memory_digest_default_value&lt;/code&gt; (0.5) — исходная догадка для выбора &lt;a href=\"user-guide/data-processing/scheduler/memory-digest.html\"&gt;резерва памяти&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;user_job_memory_digest_lower_bound&lt;/code&gt; (0.05) — нижняя граница, ниже которой не может опускаться &lt;a href=\"user-guide/data-processing/scheduler/memory-digest.html\"&gt;резерв памяти&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;enable_input_table_index&lt;/code&gt; — писать ли во входном потоке информацию о том, из какой таблицы пришла строка (индекс входящей таблицы). По умолчанию атрибуты записываются, только если входных таблиц больше одной.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;tmpfs_path&lt;/code&gt; — путь в &lt;code&gt;sandbox&lt;/code&gt;, в котором будет смонтирован tmpfs. Размер tmpfs по умолчанию равен &lt;code&gt;memory_limit&lt;/code&gt; джоба, и эффективно занятое в нем место учитывается в потреблении памяти джобом.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;tmpfs_size&lt;/code&gt; — опциональный параметр, который задает ограничение на размер tmpfs в джобе. Параметр имеет смысл, только если указан &lt;code&gt;tmpfs_path&lt;/code&gt;. Если параметр не указан, он считается равным &lt;code&gt;memory_limit&lt;/code&gt;, при этом &lt;code&gt;memory_reserve_factor&lt;/code&gt; автоматически становится равным 1.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;tmpfs_volumes&lt;/code&gt; — данный параметр позволяет указать сразу список tmpfs-разделов в джобе. Элемент списка — словарь с двумя полями &lt;code&gt;size&lt;/code&gt; и &lt;code&gt;path&lt;/code&gt;, заказываемые разделы не должны пересекаться по своим путям.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;copy_files&lt;/code&gt; (false) — по умолчанию пользовательские файлы попадают в &lt;code&gt;sandbox&lt;/code&gt; джоба по &lt;a href=\"user-guide/storage/links.html\"&gt;символической ссылке&lt;/a&gt;. Если включена данная настройка, они будут копироваться в &lt;code&gt;sandbox&lt;/code&gt;. Включение данной настройки может быть полезно при использовании &lt;code&gt;tmpfs_path=.&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;check_input_fully_consumed&lt;/code&gt; (false) — опция позволяет включить на уровне системы проверку, что джоб прочитал все данные, записанные к нему в буфер, а не вышел раньше времени.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;max_stderr_size&lt;/code&gt; (5Mb) — ограничение по объему stderr, который будет сохранен в результате работы джоба. Данные, записанные в stderr сверх данного ограничения, игнорируются.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;custom_statistics_count_limit&lt;/code&gt; (128) — ограничение на количество пользовательских статистик, которые можно записать из джоба, максимум — 1024.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;job_time_limit&lt;/code&gt; — ограничение на время работы джоба в миллисекундах. Джобы, превышающие ограничение, будут считаться failed.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;disk_request&lt;/code&gt; — список дисков, необходимых джобу. По умолчанию джобу выдается локальный диск на том же узле кластера, где запущен джоб. Потребление дискового пространства не ограничивается, но джоб может быть прерван, если место на диске закончится. Каждый диск описывается следующими параметрами:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;disk_space&lt;/code&gt; — ограничение на общий размер файлов в &lt;code&gt;sandbox&lt;/code&gt; джоба на данном диске.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;inode_count&lt;/code&gt; — ограничение на количество &lt;a href=\"https://ru.wikipedia.org/wiki/Inode\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;inode&lt;/a&gt; на данном диске.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;account&lt;/code&gt; — аккаунт, в рамках которого будет учитываться заказанное место.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;medium_name&lt;/code&gt; (default) — название &lt;a href=\"user-guide/storage/media.html\"&gt;медиума&lt;/a&gt;, на котором нужен диск.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;interruption_signal&lt;/code&gt; — номер сигнала, который будет послан пользовательскому процессу при вытеснении джоба. Между моментом времени, когда происходит посылка сигнала, и прерыванием джоба есть таймаут, зависящий от настроек кластера. За это время пользовательский процесс может попытаться дообработать данные и успешно завершить свою работу.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;restart_exit_code&lt;/code&gt; — код возврата, сигнализирующий о том, что нужно перезапустить джоб после прерывания. Данная опция важна для vanilla-джобов, которые представляют сервисы или обрабатывают внешние по отношению к YTsaurus данные.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;job_speculation_timeout&lt;/code&gt; — таймаут, после которого возможен запуск спекулятивного джоба по отношению к данному. Спекулятивный джоб — механизм, который позволяет запускать дополнительную копию джоба на тех же входных данных (параллельно с основным джобом), если есть подозрение, что основной джоб завис. «Подозрительные» джобы планировщик находит самостоятельно, используя статистики о скорости чтения входных и записи выходных данных, времени подготовки джоба, наличии попыток разделить джоб на несколько и другие эвристики.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;waiting_job_timeout&lt;/code&gt; — таймаут, в течение которого джоб может находиться в очереди на запуск на ноде. По умолчанию берется из настроек конкретного кластера.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Перечисленные выше настройки характеризуют скрипт, а не операцию в целом. В частности, они должны располагаться не в корне спецификации, а в ветках &lt;code&gt;mapper&lt;/code&gt;, &lt;code&gt;reducer&lt;/code&gt; и так далее. Пользовательский скрипт вынесен в отдельную сущность, так как в операции &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt; таких скриптов более одного (mapper, reducer, reduce_combiner).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"memory_reserve_factor\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/operations-options.html#memory_reserve_factor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резервирование памяти&lt;/span&gt;&lt;/a&gt;Резервирование памяти&lt;/h3&gt;\n&lt;p&gt;При настройках по умолчанию контроллер операции на основании статистик джобов подбирает резерв памяти для вновь запускаемых джобов. Работа механизма выполняется прозрачным для пользователей способом и не влияет на успешность операции, но может приводить к появлению прерванных джобов с причиной &lt;code&gt;resource_overdraft&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Детальное описание механизма приведено в разделе &lt;a href=\"user-guide/data-processing/scheduler/memory-digest\"&gt;Подбор памяти для джобов&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При включении tmpfs (эквивалентно указанию &lt;code&gt;tmpfs_path&lt;/code&gt;) без явной установки ограничения на его размер (параметр &lt;code&gt;tmpfs_size&lt;/code&gt;), резерв памяти автоматически становится равным единице, так как ядро операционной системы Linux не позволяет делать оверкомит по размерам tmpfs, и превышение суммарного размера над физическими возможностями может привести к зависанию узла кластера.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"many_input_tables\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/operations-options.html#many_input_tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чтение нескольких входных таблиц&lt;/span&gt;&lt;/a&gt;Чтение нескольких входных таблиц&lt;/h3&gt;\n&lt;p&gt;Данные из входных таблиц, записанные согласно указанному входному формату, будут поступать пользовательскому скрипту на стандартный вход (&lt;code&gt;stdin&lt;/code&gt;). У пользовательского скрипта будут открыты дескрипторы выходных таблиц на запись. Номера дескрипторов &lt;code&gt;1, 4, 7, ..&lt;/code&gt; согласованы с тем порядком, в котором операции переданы выходные таблицы.&lt;/p&gt;\n&lt;h3 id=\"disk_request\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/operations-options.html#disk_request\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заказ диска в джобах&lt;/span&gt;&lt;/a&gt;Заказ диска в джобах&lt;/h3&gt;\n&lt;p&gt;Если в спецификации &lt;code&gt;disk_request&lt;/code&gt; указать только &lt;code&gt;disk_space&lt;/code&gt;, то для джобов будут использоваться диски, выделенные под джобы по умолчанию. В данном случае никакого аккаунтинга используемого места не происходит, то есть считается, что свободного места на дисках в избытке и проблем не ожидается. Квотируются только данные, которые пользователь хранит на кластере, а используемое в джобе дисковое пространство не учитывается в дисковой квоте (аккаунте) пользователя. При этом планировщик следит за тем, чтобы каждый джоб не превышал своих лимитов и чтобы сумма лимитов всех джобов на узле кластера не превышала доступное дисковое пространство на узле кластера.&lt;/p&gt;\n&lt;p&gt;Кроме того, указание &lt;code&gt;disk_space&lt;/code&gt; приводит к тому, что YTsaurus начинает лимитировать используемое джобом место, но и гарантирует его при этом.&lt;/p&gt;\n&lt;p&gt;Если вы хотите использовать другие диски в джобах ваших операций, например SSD, там, где по умолчанию предполагается HDD, то необходимо указывать специальный &lt;code&gt;medium&lt;/code&gt; и ваш &lt;code&gt;account&lt;/code&gt;, в котором будет происходить квотирование заказанного под джобы места.&lt;/p&gt;\n&lt;h2 id=\"path_attributes\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/operations-options.html#path_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атрибуты на путях&lt;/span&gt;&lt;/a&gt;Атрибуты на путях&lt;/h2&gt;\n&lt;p&gt;На выходных таблицах операций поддерживаются следующие атрибуты (в скобках указаны значения по умолчанию, если заданы):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;sorted_by&lt;/code&gt; — набор колонок, по которому должна быть отсортирована таблица.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;append&lt;/code&gt; (false) — дописывать ли данные в данную выходную таблицу. Если &lt;code&gt;append&lt;/code&gt; равен &lt;code&gt;false&lt;/code&gt;, данные в таблице будут перезаписаны.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;row_count_limit&lt;/code&gt; — досрочно завершить операцию, как только в выходной таблице появится хотя бы &lt;code&gt;row_count_limit&lt;/code&gt; строк. Может быть установлен не более чем на одной таблице.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;create&lt;/code&gt; (false) - если таблица по указанному пути не существует, то планировщик создаст её автоматически с настройками по умолчанию (выполнит команду &lt;code&gt;create&lt;/code&gt; с параметрами &lt;code&gt;{ \"path\" = \"//path/from/spec\" ; \"type\" = \"table\" }&lt;/code&gt;)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;На входных таблицах операций поддерживаются атрибуты:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Стандартные &lt;a href=\"user-guide/storage/ypath.html#rich_ypath_suffix\"&gt;модификаторы выбора строки и колонок&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;transaction_id&lt;/code&gt; — позволяет указать, под какой транзакцией необходимо обращаться к входной таблице.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;timestamp&lt;/code&gt; — позволяет использовать состояние динамической таблицы &lt;a href=\"user-guide/dynamic-tables/mapreduce.html#dyntable_mr_timestamp\"&gt;на определенный момент времени&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;rename_columns&lt;/code&gt; — позволяет переименовать некоторые колонки перед началом обработки таблицы в операции. Переименовывать можно только колонки, находящиеся в схеме. После переименования должны выполняться все ограничения на схему таблицы, а также не должно быть пересечений по именам колонок в чанках для нестрогой схемы. В случае, если указан набор колонок &lt;code&gt;sorted_by&lt;/code&gt; на выходной таблице операции либо схема выходной таблицы имеет ключевые колонки, будет происходить следующее:\n&lt;ol&gt;\n&lt;li&gt;Джобы операции при формировании чанков для таблицы будут проверять сортированность записей по указанному набору колонок.&lt;/li&gt;\n&lt;li&gt;Планировщик провалидирует, что диапазоны ключей у сформированных чанков данной выходной таблицы не пересекаются, и после сформирует из этого набора чанков сортированную таблицу.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Операция завершится с ошибкой, если валидация на любом из перечисленных шагов не пройдёт.&lt;/p&gt;\n&lt;h3 id=\"fajly\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/operations-options.html#fajly\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Файлы&lt;/span&gt;&lt;/a&gt;Файлы&lt;/h3&gt;\n&lt;p&gt;На путях к файлам поддерживаются следующие атрибуты:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;file_name&lt;/code&gt; — имя файла данного файла в &lt;code&gt;sandbox&lt;/code&gt; джоба.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;executable&lt;/code&gt; — сделать ли файл исполняемым.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;format&lt;/code&gt; — формат, в котором нужно сформировать файл из таблицы, если в качестве файла передан путь к таблице.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;bypass_artifact_cache&lt;/code&gt; — флаг, указывающий на то, что файл необходимо скачать в &lt;code&gt;sandbox&lt;/code&gt; джоба, минуя кеш. Данный атрибут может быть полезен, если файлы уже лежат на SSD или в памяти и требуется доставить их в джоб без лишних задержек; имеет смысл, если количество джобов в операции невелико, и поэтому кеширование неэффективно.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/operations/operations-options.md","sourcePath":"ru/user-guide/data-processing/operations/operations-options.md"},"headings":[{"title":"Общие опции для всех типов операций","href":"ru/user-guide/data-processing/operations/operations-options.html#common_options","level":2},{"title":"Параметры пользовательского скрипта","href":"ru/user-guide/data-processing/operations/operations-options.html#user_script_options","level":2,"items":[{"title":"Резервирование памяти","href":"ru/user-guide/data-processing/operations/operations-options.html#memory_reserve_factor","level":3},{"title":"Чтение нескольких входных таблиц","href":"ru/user-guide/data-processing/operations/operations-options.html#many_input_tables","level":3},{"title":"Заказ диска в джобах","href":"ru/user-guide/data-processing/operations/operations-options.html#disk_request","level":3}]},{"title":"Атрибуты на путях","href":"ru/user-guide/data-processing/operations/operations-options.html#path_attributes","level":2,"items":[{"title":"Файлы","href":"ru/user-guide/data-processing/operations/operations-options.html#fajly","level":3}]}],"title":"Настройки операций"},"router":{"pathname":"ru/user-guide/data-processing/operations/operations-options","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
