            {"data":{"leading":false,"html":"&lt;p&gt;Операция RemoteCopy копирует таблицы и файлы с одного кластера на другой. Джобы операции RemoteCopy запускаются на кластере назначения и копируют чанки с исходного кластера (pull-схема). Данная операция копирует чанки в исходном виде, не разжимая их и не меняя &lt;code&gt;erasure&lt;/code&gt;-схему. В случае, если входная таблица является сортированной, то выходная таблица тоже будет отсортирована.&lt;/p&gt;\n&lt;p&gt;Общие параметры для всех типов операций описаны в разделе &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Настройки операций&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;У операции RemoteCopy поддерживаются следующие дополнительные параметры (в скобках указаны значения по умолчанию, если заданы):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;cluster_name&lt;/code&gt; — имя кластера, с которого необходимо скопировать данные. Описание доступных кластеров можно увидеть в узле &lt;code&gt;//sys/clusters&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;network_name&lt;/code&gt; — имя сети в терминах YTsaurus, которую необходимо использовать при копировании, например &lt;code&gt;fastbone&lt;/code&gt; или &lt;code&gt;backbone&lt;/code&gt;. На всех узлах удаленного кластера указанная сеть должна быть сконфигурирована.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;networks&lt;/code&gt; — набор сетей в порядке приоритета, которые будут использоваться для копирования данных. &lt;strong&gt;Важно:&lt;/strong&gt; не указывайте эту и предыдущую опцию без согласования с администратором системы.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;input_table_paths&lt;/code&gt; — список из одной таблицы (или одного файла), которую необходимо скопировать.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;output_table_path&lt;/code&gt; — путь до таблицы или файла, куда необходимо скопировать данные. Если по такому пути есть узел кипариса, то его тип должен совпадать с типом входного узла.&lt;br /&gt;\nНельзя cкопировать таблицу в файл и наоборот.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;schema_inference_mode&lt;/code&gt; (auto) — режим определения схемы. Доступные значения: auto, from_input, from_output. Подробности в разделе &lt;a href=\"user-guide/storage/static-schema.html#schema_inference\"&gt;Схема данных&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;cluster_connection&lt;/code&gt; — конфигурация для подключения к кластеру-источнику. Настраивается администратором системы YTsaurus при настройке кластера.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;copy_attributes&lt;/code&gt; (false) — копировать атрибуты входной таблицы. Доступно только в случае, когда входная таблица одна. Копируются только пользовательские атрибуты (не системные).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;attribute_keys&lt;/code&gt; — при указании данной опции и включении опции &lt;code&gt;copy_attributes&lt;/code&gt; будут копироваться только атрибуты из приведенного списка.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;Важно:&lt;/strong&gt; на production кластерах действует специальное ограничение и RemoteCopy-операции можно запускать только в пулах, у которых в одном из предков стоит ограничение на количество одновременно запущенных джобов (то есть указан атрибут &lt;code&gt;resource_limits&lt;/code&gt; со значением &lt;code&gt;user_slots&lt;/code&gt; не выше определенного порога).&lt;/p&gt;\n&lt;h2 id=\"primer-specifikacii\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/remote-copy.html#primer-specifikacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример спецификации&lt;/span&gt;&lt;/a&gt;Пример спецификации&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;{\n  &lt;span class=\"hljs-string\"&gt;pool&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"my_cool_pool\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;network_name&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"fastbone\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;input_table_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/input_table\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;output_table_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"//tmp/output_table\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;copy_attributes&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;%true;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;cluster_name&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"my_cool_remote_cluster\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"62\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-62\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-62\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-62.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/operations/remote-copy.md","sourcePath":"ru/user-guide/data-processing/operations/remote-copy.md"},"headings":[{"title":"Пример спецификации","href":"ru/user-guide/data-processing/operations/remote-copy.html#primer-specifikacii","level":2}],"title":"RemoteCopy"},"router":{"pathname":"ru/user-guide/data-processing/operations/remote-copy","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
