        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Операция Merge производит слияние входных таблиц в одну. На выходе получается таблица, множество строк которой равно объединению всех строк исходных таблиц. В зависимости от опции &lt;code&gt;mode&lt;/code&gt; слияние выполняется по-разному:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;mode = unordered&lt;/code&gt; — происходит только объединение списков чанков исходных таблиц. Такой режим слияния работает по умолчанию;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;mode = sorted&lt;/code&gt; — производится объединение исходных таблиц с сохранением сортированности. Колонки, по которым должна быть отсортирована выходная таблица, задаются параметром &lt;code&gt;merge_by&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;mode = ordered&lt;/code&gt; — сохраняется порядок чанков списка исходных таблиц. То есть если &lt;code&gt;T1 = (A1, A2), T2 = (B1, B2, B3)&lt;/code&gt;, то &lt;code&gt;Merge(T1, T2) = (A1, A2, B1, B2, B3)&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Общие параметры для всех типов операций описаны в разделе &lt;a href=\"user-guide/data-processing/operations/operations-options.html\"&gt;Настройки операций&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;У операции Merge поддерживаются следующие дополнительные параметры (в скобках указаны значения по умолчанию, если заданы):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;mode&lt;/code&gt; (unordered) — тип операции Merge, может принимать значения: &lt;code&gt;unordered&lt;/code&gt;, &lt;code&gt;sorted&lt;/code&gt;, &lt;code&gt;ordered&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;input_table_paths&lt;/code&gt; — список входных таблиц с указанием полных путей (не может быть пустым);&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;output_table_path&lt;/code&gt; — полный путь к выходной таблице;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;combine_chunks&lt;/code&gt; (false) — настройка, активирующая укрупнение чанков;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;force_transform&lt;/code&gt; (false) — принудительно прочесть все данные исходных таблиц;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;merge_by&lt;/code&gt; — список колонок, по которому следует производить sorted merge;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;job_count&lt;/code&gt;, &lt;code&gt;data_weight_per_job&lt;/code&gt; (256 Mb) — опции, которые указывают сколько джобов должно быть запущено, имеют рекомендательный характер. Опция &lt;code&gt;job_count&lt;/code&gt; имеет приоритет над &lt;code&gt;data_weight_per_job&lt;/code&gt;. Если указать &lt;code&gt;job_count&lt;/code&gt; меньшим, либо равным &lt;code&gt;total_input_row_count&lt;/code&gt;, то для unordered и ordered merge гарантируется, что количество джобов будет точно соблюдено, если это не противоречит ограничению на максимальное число джобов в операции. В частности, если &lt;code&gt;job_count&lt;/code&gt; равен &lt;code&gt;total_input_row_count&lt;/code&gt;, то в каждый джоб попадёт ровно одна строка, если &lt;code&gt;job_count&lt;/code&gt; равен единице, то будет запущен ровно один джоб.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;schema_inference_mode&lt;/code&gt; (auto) — режим определения схемы. Доступные значения: auto, from_input, from_output. Подробности в разделе &lt;a href=\"user-guide/storage/static-schema.html#schema_inference\"&gt;Схема данных&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В случае, когда опция &lt;code&gt;force_transform&lt;/code&gt; имеет значение &lt;code&gt;false&lt;/code&gt;, операция выполняется так, чтобы минимизировать количество запущенных джобов. В лучшем случае, объединение будет произведено на уровне метаинформации. Иначе все чанки обязательно будут прочитаны.&lt;/p&gt;\n&lt;p&gt;Помимо места на диске, данные расходуют чанковую квоту аккаунта, в котором находятся. Операцию Merge имеет смысл запускать и над одной таблицей, чтобы «укрупнить» существующие чанки. Для этого необходимо выставить опцию &lt;code&gt;combine_chunks=true&lt;/code&gt;. Подробнее про квоты аккаунтов в разделе &lt;a href=\"user-guide/storage/quotas.html\"&gt;Квоты&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"primer-specifikacii\"&gt;&lt;a href=\"ru/user-guide/data-processing/operations/merge.html#primer-specifikacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример спецификации&lt;/span&gt;&lt;/a&gt;Пример спецификации&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;{\n  &lt;span class=\"hljs-string\"&gt;pool&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"my_cool_pool\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;mode&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"sorted\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;merge_by&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"field1\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"field2\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;job_count&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;100&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;input_table_paths&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; [ &lt;span class=\"hljs-string\"&gt;\"//tmp/input_table1\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"//tmp/input_table2\"&lt;/span&gt; ]&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;output_table_path&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"//tmp/output_table\"&lt;/span&gt;&lt;span class=\"hljs-string\"&gt;;&lt;/span&gt;\n  &lt;span class=\"hljs-string\"&gt;combine_chunks&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;%true;&lt;/span&gt;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"77\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-77\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-77\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-77.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/data-processing/operations/merge.md","sourcePath":"ru/user-guide/data-processing/operations/merge.md"},"headings":[{"title":"Пример спецификации","href":"ru/user-guide/data-processing/operations/merge.html#primer-specifikacii","level":2}],"title":"Merge"},"router":{"pathname":"ru/user-guide/data-processing/operations/merge","depth":5,"base":"../../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
