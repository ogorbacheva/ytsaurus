            {"data":{"leading":false,"html":"&lt;p&gt;Для удобства отладки джобов (например, под GDB) была написана утилита &lt;code&gt;yt job-tool&lt;/code&gt;, которая скачивает окружение джоба, его входные данные, а также формирует скрипт для его запуска.&lt;/p&gt;\n&lt;p&gt;Утилита поставляется вместе с пакетом &lt;a href=\"api/python/start.html\"&gt;Python API&lt;/a&gt;. Поддерживаются все типы джобов, в которых запускается пользовательский код.&lt;/p&gt;\n&lt;p&gt;Бинарный файл поддерживает две команды: &lt;code&gt;prepare-job-environment&lt;/code&gt; и &lt;code&gt;run-job&lt;/code&gt;. Для получения подробной информации используйте команду &lt;code&gt;yt job-tool --help&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"vhodnye-dannye-dlya-dzhoba\"&gt;&lt;a href=\"ru/user-guide/problems/jobtool.html#vhodnye-dannye-dlya-dzhoba\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Входные данные для джоба&lt;/span&gt;&lt;/a&gt;Входные данные для джоба&lt;/h2&gt;\n&lt;p&gt;По умолчанию &lt;code&gt;job-tool&lt;/code&gt; получает полный вход джоба, но он доступен не для всех джобов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Спецификация, необходимая для получения полного входа, сохраняется для нескольких упавших и нескольких успешно отработавших джобов, а также доступна для всех ещё бегущих джобов.&lt;/li&gt;\n&lt;li&gt;Для получения полного входа должны быть доступны данные, которые читал джоб, т. е. входные таблицы должны быть на месте и в неизменённом виде.&lt;/li&gt;\n&lt;li&gt;Джобы стадий Reduce_combiner и Reduce операции MapReduce читают временные данные, которые доступны, только пока операция не завершилась. Если требуется отладка таких джобов, операцию можно переписать на Map + Sort + Reduce или выполнять отладку, пока операция не завершена (в том числе пока операция в состоянии suspended).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"primer\"&gt;&lt;a href=\"ru/user-guide/problems/jobtool.html#primer\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Запускаем следующую операцию:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;&lt;span class=\"hljs-keyword\"&gt;import&lt;/span&gt; yt.wrapper &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; yt\n\n&lt;span class=\"hljs-keyword\"&gt;def&lt;/span&gt; &lt;span class=\"hljs-title function_\"&gt;mapper&lt;/span&gt;(&lt;span class=\"hljs-params\"&gt;rec&lt;/span&gt;):\n    &lt;span class=\"hljs-keyword\"&gt;raise&lt;/span&gt; RuntimeError(&lt;span class=\"hljs-string\"&gt;\"fail\"&lt;/span&gt;)\n\n&lt;span class=\"hljs-keyword\"&gt;if&lt;/span&gt; __name__ == &lt;span class=\"hljs-string\"&gt;\"__main__\"&lt;/span&gt;:\n    yt.run_map(mapper, &lt;span class=\"hljs-string\"&gt;\"//home/user/tables/dsv\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"//home/user/output\"&lt;/span&gt;, &lt;span class=\"hljs-built_in\"&gt;format&lt;/span&gt;=&lt;span class=\"hljs-string\"&gt;\"dsv\"&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"40\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-40\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-40\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-40.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Когда операция упала, диагностируем:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt job-tool prepare-job-environment ffc8f462-7f68f8c3-3fe03e8-433fe11f ffe4ff5c-d2fac8c1-3fe0384-816a7fd0\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"46\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-46\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-46\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-46.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;После того как команда отработает, в папке &lt;code&gt;job_ffe4ff5c-d2fac8c1-3fe0384-816a7fd0&lt;/code&gt; будут лежать следующие файлы:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ &lt;span class=\"hljs-built_in\"&gt;ls&lt;/span&gt; job_ffe4ff5c-d2fac8c1-3fe0384-816a7fd0\n&lt;span class=\"hljs-built_in\"&gt;command&lt;/span&gt;  input  run_gdb.sh  run.sh  sandbox\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"52\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-52\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-52\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-52.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Где:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Файл &lt;code&gt;command&lt;/code&gt; содержит команду для запуска джоба. Так как операция была запущена с помощью &lt;a href=\"api/python/start.html\"&gt;Python API&lt;/a&gt;, код будет иметь вид:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; job_ffe4ff5c-d2fac8c1-3fe0384-816a7fd0/command\npython _py_runner.py mapper.lV4l9c config_dump6RRYa4 _modulesEFMotR _main_moduleJALUsC.py _main_module PY_SOURCE%\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"61\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-61\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-61\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-61.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;input&lt;/code&gt; — вход джоба, в некоторых случаях может быть полезен для анализа.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;run.sh&lt;/code&gt; — shell-скрипт, запускающий джоб в локальном режиме.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;run_gdb.sh&lt;/code&gt; — shell-скрипт, запускающий джоб под gdb, что полезно для отладки C++ программ.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Скрипты &lt;code&gt;run_gdb.sh&lt;/code&gt;, &lt;code&gt;run.sh&lt;/code&gt; можно модифицировать, например, чтобы вставить свой отладчик.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;sandbox&lt;/code&gt; — директория, в которой запускался джоб, со всеми необходимыми для его запуска файлами.&lt;br /&gt;\nФайлы в директории можно пробовать обновлять в рамках отладки.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Запускаем джоб локально с помощью скрипта &lt;code&gt;run.sh&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;./run\n2016-07-22 12:00:33,499 INFO    Started job process\nUser job exited with non-zero &lt;span class=\"hljs-built_in\"&gt;exit&lt;/span&gt; code 1 with stderr:\nTraceback (most recent call last):\n  File &lt;span class=\"hljs-string\"&gt;\"_py_runner.py\"&lt;/span&gt;, line 56, &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; &amp;lt;module&amp;gt;\n    main()\n  File &lt;span class=\"hljs-string\"&gt;\"_py_runner.py\"&lt;/span&gt;, line 53, &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; main\n    yt.wrapper.py_runner_helpers.process_rows(__operation_dump_filename, __config_dump_filename, start_time=start_time)\n  File &lt;span class=\"hljs-string\"&gt;\"/home/user/yt/python/yt/wrapper/py_runner_helpers.py\"&lt;/span&gt;, line 154, &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; process_rows\n    output_format.dump_rows(result, streams.get_original_stdout(), raw=raw)\n  File &lt;span class=\"hljs-string\"&gt;\"/home/user/yt/python/yt/wrapper/format.py\"&lt;/span&gt;, line 137, &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; dump_rows\n    self._dump_rows(rows, stream)\n  File &lt;span class=\"hljs-string\"&gt;\"/home/user/yt/python/yt/wrapper/format.py\"&lt;/span&gt;, line 251, &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; _dump_rows\n    &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; row &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; rows:\n  File &lt;span class=\"hljs-string\"&gt;\"/home/user/yt/python/yt/wrapper/py_runner_helpers.py\"&lt;/span&gt;, line 89, &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; process_frozen_dict\n    &lt;span class=\"hljs-keyword\"&gt;for&lt;/span&gt; row &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; rows:\n  File &lt;span class=\"hljs-string\"&gt;\"/home/user/yt/python/yt/wrapper/py_runner_helpers.py\"&lt;/span&gt;, line 49, &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; generator\n    result = func(*args)\n  File &lt;span class=\"hljs-string\"&gt;\"&amp;lt;stdin&amp;gt;\"&lt;/span&gt;, line 2, &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; mapper\nRuntimeError: fail\n\n    origin          hostname &lt;span class=\"hljs-keyword\"&gt;in&lt;/span&gt; 2016-07-22T12:00:35.427161Z\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"99\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-99\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-99\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-99.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/problems/jobtool.md","sourcePath":"ru/user-guide/problems/jobtool.md"},"headings":[{"title":"Входные данные для джоба","href":"ru/user-guide/problems/jobtool.html#vhodnye-dannye-dlya-dzhoba","level":2},{"title":"Пример","href":"ru/user-guide/problems/jobtool.html#primer","level":2}],"title":"Локальная отладка джобов"},"router":{"pathname":"ru/user-guide/problems/jobtool","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
