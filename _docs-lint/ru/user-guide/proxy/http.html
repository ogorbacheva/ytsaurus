        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Для понимания изложенного в разделе материала требуется знание устройства &lt;a href=\"https://ru.wikipedia.org/wiki/HTTP\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;HTTP протокола&lt;/a&gt;, принципов работы через HTTP, основ &lt;a href=\"user-guide/storage/cypress.html\"&gt;хранения данных&lt;/a&gt; в системе YTsaurus.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В данном разделе показан принцип работы с YTsaurus через HTTP-прокси — на примере запуска задачи &lt;a href=\"https://en.wikipedia.org/wiki/Word_count\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Word Count&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Word Count — это типичная задача, которую считают в любой системе &lt;a href=\"user-guide/data-processing/operations/mapreduce.html\"&gt;MapReduce&lt;/a&gt;. Общая схема следующая:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;По исходному тексту выполняется &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt; операция, выдающая для каждого слова пару &lt;code&gt;(&amp;lt;слово&amp;gt;, 1)&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Результат сортируется по первой координате.&lt;/li&gt;\n&lt;li&gt;По первой координате выполняется &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt; операция, суммирующая вторую координату. На выходе получается набор пар &lt;code&gt;(&amp;lt;слово&amp;gt;, &amp;lt;количество упоминаний слова&amp;gt;)&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Полное описание всех доступных команд YTsaurus можно найти в разделе &lt;a href=\"api/commands.html\"&gt;Команды&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"prerequisites\"&gt;&lt;a href=\"ru/user-guide/proxy/http.html#prerequisites\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Перед началом работы&lt;/span&gt;&lt;/a&gt;Перед началом работы&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Для доступа к системе YTsaurus вам понадобится токен. Как его получить — написано в разделе &lt;a href=\"user-guide/storage/auth\"&gt;Аутентификация&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Примеры рассчитаны для запуска в командной оболочке Bash. У вас должна быть установлена утилита &lt;a href=\"https://en.wikipedia.org/wiki/CURL\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;curl&lt;/a&gt; — она понадобится для работы с YTsaurus через HTTP. В некоторых примерах также будет использоваться утилита &lt;a href=\"https://jqlang.github.io/jq/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;jq&lt;/a&gt; — чтобы сделать вывод команд более читабельным.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"export-vars\"&gt;&lt;a href=\"ru/user-guide/proxy/http.html#export-vars\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка переменных окружения&lt;/span&gt;&lt;/a&gt;Установка переменных окружения&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_PROXY=&amp;lt;cluster-host&amp;gt;\n&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_HOME=//tmp/yt_examples\n&lt;span class=\"hljs-built_in\"&gt;export&lt;/span&gt; YT_TOKEN=`&lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; ~/.yt/token`\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"54\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-54\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-54\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-54.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"prepare\"&gt;&lt;a href=\"ru/user-guide/proxy/http.html#prepare\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создание исходной таблицы&lt;/span&gt;&lt;/a&gt;Создание исходной таблицы&lt;/h2&gt;\n&lt;p&gt;Прежде всего необходимо создать рабочий каталог, в котором будут размещаться данные для нашего примера. Для создания каталогов в Кипарисе используется команда &lt;a href=\"api/commands.html#create\"&gt;create&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Создание рабочего каталога&lt;/span&gt;\n$ curl -v -X POST &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/api/v4/create?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;&amp;amp;type=map_node\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Для удобства восприятия в примерах удалена&lt;/span&gt;\n&lt;span class=\"hljs-comment\"&gt;# несущественная и дублирующаяся информация&lt;/span&gt;\n&amp;lt; HTTP/1.1 200 OK\n&lt;span class=\"hljs-string\"&gt;\"0-3c35f-12f-8c397340\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"61\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-61\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-61\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-61.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Данные в системе YTsaurus хранятся в &lt;a href=\"user-guide/storage/static-tables.html\"&gt;таблицах&lt;/a&gt;, поэтому  необходимо создать таблицу:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Создание таблицы — в ней будут храниться исходные данные&lt;/span&gt;\n$ curl -v -X POST &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/api/v4/create?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/input&amp;amp;type=table\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt;\n\n&amp;lt; HTTP/1.1 200 OK\n&lt;span class=\"hljs-string\"&gt;\"0-6a7-191-8075d1f7\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"65\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-65\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-65\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-65.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В результате выполнения команд в ответ возвращаются идентификаторы (GUID) созданных объектов в Кипарисе: &lt;code&gt;0-3c35f-12f-8c397340&lt;/code&gt; и &lt;code&gt;0-6a7-191-8075d1f7&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"upload\"&gt;&lt;a href=\"ru/user-guide/proxy/http.html#upload\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Загрузка данных в таблицу&lt;/span&gt;&lt;/a&gt;Загрузка данных в таблицу&lt;/h2&gt;\n&lt;p&gt;Теперь в таблицу необходимо загрузить данные. В качестве формата загружаемых данных будет использоваться tab-separated формат:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;строки таблицы отделяются друг от друга переводом строки ( &lt;code&gt;\\n&lt;/code&gt; );&lt;/li&gt;\n&lt;li&gt;колонки отделяются друг от друга табуляцией ( &lt;code&gt;\\t&lt;/code&gt; );&lt;/li&gt;\n&lt;li&gt;имя колонки и содержимое колонки отделяются друг от друга знаком равенства.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;К примеру, строка: &lt;code&gt;lineno=1\\tsize=6\\tvalue=foobar&lt;/code&gt; описывает строку с колонками &lt;em&gt;lineno&lt;/em&gt;, &lt;em&gt;size&lt;/em&gt; и &lt;em&gt;value&lt;/em&gt; со значениями, соответственно, &lt;em&gt;1&lt;/em&gt;, &lt;em&gt;6&lt;/em&gt; и &lt;em&gt;foobar&lt;/em&gt;. Символы табуляции экранируются.&lt;/p&gt;\n&lt;p&gt;Ниже приведён пример подготовки исходных данных:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Загрузка текста&lt;/span&gt;\n$ curl http://lib.ru/BULGAKOW/whtguard.txt | iconv -f koi8-r -t utf-8 &amp;gt; source.txt\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"98\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-98\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-98\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-98.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Приведение текста к нужному формату&lt;/span&gt;\n$ &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; source.txt | perl -e &lt;span class=\"hljs-string\"&gt;'\n    $n = 0;\n    while(&amp;lt;&amp;gt;) {\n      $n++; chomp; s/\\t/\\\\t/g; print \"lineno=$n\\ttext=$_\\n\";\n    }\n  '&lt;/span&gt; &amp;gt; source.tsv\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"99\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-99\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-99\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-99.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Для записи данных в таблицу используется команда &lt;a href=\"api/commands.html#write_table\"&gt;write_table&lt;/a&gt;. Обратите внимание — запросы на загрузку данных выполняются не через обычную прокси &lt;code&gt;YT_PROXY&lt;/code&gt;, а через &lt;a href=\"ru/user-guide/proxy/http.html#get-data-proxy-list\"&gt;тяжёлую прокси&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Получение тяжёлой прокси&lt;/span&gt;\n$ HEAVY_YT_PROXY=$(curl -s -H &lt;span class=\"hljs-string\"&gt;\"Accept: text/plain\"&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/hosts\"&lt;/span&gt; | &lt;span class=\"hljs-built_in\"&gt;head&lt;/span&gt; -n1)\n\n&lt;span class=\"hljs-comment\"&gt;# Загрузка данных в таблицу&lt;/span&gt;\n$ curl -v -X PUT &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$HEAVY_YT_PROXY&lt;/span&gt;/api/v4/write_table?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/input\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Content-Type: text/tab-separated-values\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Transfer-Encoding: chunked\"&lt;/span&gt; \\\n    -T source.tsv\n\n&amp;lt; HTTP/1.1 200 OK\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"103\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-103\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-103\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-103.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Обратите внимание, что в данном запросе также явно указан формат входных данных — \"text/tab-separated-values\".&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы удостовериться в том, что данные записаны, необходимо посмотреть на атрибуты таблицы:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Получение атрибутов таблицы&lt;/span&gt;\n$ curl -v -X GET &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/api/v4/get?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/input/@\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt; | jq\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"117\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-117\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-117\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-117.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&amp;lt; HTTP/1.1 200 OK\n{\n  ...\n  &lt;span class=\"hljs-string\"&gt;\"uncompressed_data_size\"&lt;/span&gt; : 993253,\n  &lt;span class=\"hljs-string\"&gt;\"compressed_size\"&lt;/span&gt; : 542240,\n  &lt;span class=\"hljs-string\"&gt;\"compression_ratio\"&lt;/span&gt; : 0.54592334480741566693,\n  &lt;span class=\"hljs-string\"&gt;\"row_count\"&lt;/span&gt; : 8488,\n  &lt;span class=\"hljs-string\"&gt;\"sorted\"&lt;/span&gt; : &lt;span class=\"hljs-string\"&gt;\"false\"&lt;/span&gt;,\n  ...\n  &lt;span class=\"hljs-string\"&gt;\"channels\"&lt;/span&gt; : [ [&lt;span class=\"hljs-string\"&gt;\"lineno\"&lt;/span&gt;], [&lt;span class=\"hljs-string\"&gt;\"text\"&lt;/span&gt;] ]\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"118\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-118\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-118\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-118.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Не стоит пугаться &lt;code&gt;Null&lt;/code&gt;-значений. &lt;code&gt;Null&lt;/code&gt; не значит, что соответствующих данных нет. &lt;code&gt;Null&lt;/code&gt; значит, что либо по данному ключу находится узел специального типа (например, таблица или файл), либо что данные лениво вычисляемые и за ними нужно обратиться явно.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Чтобы загрузить данные в другом формате, например в JSON, необходимо добавить немного больше опций. Подробности можно прочитать в разделе &lt;a href=\"user-guide/storage/formats.html#json\"&gt;Форматы&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Пример загрузки данных в формате JSON&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; test.json\n{ &lt;span class=\"hljs-string\"&gt;\"color\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"красный\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"#f00\"&lt;/span&gt; }\n{ &lt;span class=\"hljs-string\"&gt;\"color\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"red\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;\"#f00\"&lt;/span&gt; }\n\n$ curl -X POST &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/api/v4/create?path=//tmp/test-json&amp;amp;type=table\"&lt;/span&gt; \\\n       -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; \\\n       -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt;\n\n$ curl -X PUT &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$HEAVY_YT_PROXY&lt;/span&gt;/api/v4/write_table?path=//tmp/test-json&amp;amp;encode_utf8=false\"&lt;/span&gt;\n          -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt;\n          -H &lt;span class=\"hljs-string\"&gt;\"Content-Type: application/json\"&lt;/span&gt;\n          -H &lt;span class=\"hljs-string\"&gt;\"Transfer-Encoding: chunked\"&lt;/span&gt;\n          -H &lt;span class=\"hljs-string\"&gt;\"X-YT-Header-Format: &amp;lt;format=text&amp;gt;yson\"&lt;/span&gt;\n          -H &lt;span class=\"hljs-string\"&gt;\"X-YT-Input-Format: &amp;lt;encode_utf8=%false&amp;gt;json\"&lt;/span&gt;\n          -T test.json\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"144\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-144\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-144\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-144.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h3 id=\"get-data-proxy-list\"&gt;&lt;a href=\"ru/user-guide/proxy/http.html#get-data-proxy-list\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Получение тяжёлых прокси&lt;/span&gt;&lt;/a&gt;Получение тяжёлых прокси&lt;/h3&gt;\n&lt;p&gt;При написании своего клиента пользователю необходимо эпизодически запрашивать список &lt;a href=\"user-guide/proxy/http-reference.html#hosts\"&gt;тяжёлых прокси&lt;/a&gt; через запрос &lt;code&gt;/hosts&lt;/code&gt;. В ответе возвращается упорядоченный по приоритету список тяжёлых прокси. Приоритет прокси определяется динамически и зависит от её загрузки (CPU+I/O). Хорошая стратегия — раз в минуту или раз в несколько запросов перезапрашивать список &lt;code&gt;/hosts&lt;/code&gt; и менять текущую прокси, к которой задаются запросы.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;HEAVY_YT_PROXY=$(curl -s -H &lt;span class=\"hljs-string\"&gt;\"Accept: text/plain\"&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/hosts\"&lt;/span&gt; | &lt;span class=\"hljs-built_in\"&gt;head&lt;/span&gt; -n1)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"153\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-153\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-153\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-153.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"zagruzka-fajla\"&gt;&lt;a href=\"ru/user-guide/proxy/http.html#zagruzka-fajla\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Загрузка файла&lt;/span&gt;&lt;/a&gt;Загрузка файла&lt;/h2&gt;\n&lt;p&gt;Для запуска операции &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt; или &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt; потребуется загрузить в систему скрипт, который нужно будет исполнить. Скрипт для данной задачи размещен на &lt;a href=\"https://github.com/ytsaurus/ytsaurus/tree/main/yt/docs/code-examples/python/http-proxy.py\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GitHub&lt;/a&gt;. Пусть локально он сохранён в файл &lt;code&gt;exec.py&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Для загрузки файлов в систему YTsaurus используется команда &lt;a href=\"api/commands.html#write_table\"&gt;write_file&lt;/a&gt;. Перед загрузкой необходимо создать узел типа «файл», аналогично созданию таблицы на предыдущем шаге:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Создание узла с типом «файл»&lt;/span&gt;\n$ curl -v -X POST &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/api/v4/create?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/exec.py&amp;amp;type=file\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt;\n\n&amp;lt; HTTP/1.1 200 OK\n&lt;span class=\"hljs-string\"&gt;\"0-efd-190-88fec34\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"163\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-163\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-163\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-163.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Загрузка содержимого в файл&lt;/span&gt;\n$ curl -v -X PUT &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$HEAVY_YT_PROXY&lt;/span&gt;/api/v4/write_file?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/exec.py\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Transfer-Encoding: chunked\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; \\\n    -T exec.py\n\n&amp;lt; HTTP/1.1 100 Continue\n&amp;lt; HTTP/1.1 200 OK\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"164\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-164\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-164\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-164.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Для того чтобы у файла были права на исполнение, необходимо установить для него атрибут &lt;em&gt;executable&lt;/em&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Установка атрибутов&lt;/span&gt;\n$ curl -v -X PUT &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/api/v4/set?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/exec.py/@executable\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Content-Type: application/json\"&lt;/span&gt; \\\n    --data-binary &lt;span class=\"hljs-string\"&gt;'\"true\"'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"168\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-168\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-168\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-168.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Для проверки корректности загруженного файла можно его прочитать:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Чтение загруженного файла&lt;/span&gt;\n$ curl -v -X GET &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$HEAVY_YT_PROXY&lt;/span&gt;/api/v4/read_file?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/exec.py\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt;\n\n&amp;lt; HTTP/1.1 200 OK\n&lt;span class=\"hljs-comment\"&gt;#!/usr/bin/python&lt;/span&gt;\n\nimport re\nimport sys\nimport itertools\nimport operator\n...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"172\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-172\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-172\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-172.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если необходимо прочесть диапазон байт из файла, можно использовать дополнительные параметры &lt;code&gt;offset&lt;/code&gt; и &lt;code&gt;length&lt;/code&gt; команды &lt;code&gt;read_file&lt;/code&gt;. Для разнообразия в примере ниже параметры передаются через заголовок &lt;code&gt;X-YT-Parameters&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Чтение диапазона байт из файла&lt;/span&gt;\n$ curl -v -X GET &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$HEAVY_YT_PROXY&lt;/span&gt;/api/v4/read_file\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"X-YT-Parameters: {\\\"path\\\": \\\"&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/exec.py\\\", \\\"offset\\\": 11, \\\"length\\\": 6}\"&lt;/span&gt;\n\n&amp;lt; HTTP/1.1 200 OK\npython\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"176\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-176\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-176\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-176.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"launch_map\"&gt;&lt;a href=\"ru/user-guide/proxy/http.html#launch_map\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск Map операции&lt;/span&gt;&lt;/a&gt;Запуск Map операции&lt;/h2&gt;\n&lt;p&gt;Важный момент, который стоит учитывать: требование существования выходной таблицы &lt;strong&gt;до&lt;/strong&gt; запуска операции. Создадим таблицу с помощью команды &lt;a href=\"api/commands.html#create\"&gt;create&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Создание выходной таблицы&lt;/span&gt;\n$ curl -v -X POST &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/api/v4/create?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/output_map&amp;amp;type=table\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt;\n\n&amp;lt; HTTP/1.1 200 OK\n&lt;span class=\"hljs-string\"&gt;\"0-843-191-ae506abe\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"183\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-183\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-183\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-183.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Теперь можно запустить операцию Map. Для этого следует воспользоваться командой &lt;a href=\"api/commands.html#start_operation\"&gt;start_operation&lt;/a&gt; с параметром &lt;code&gt;operation_type&lt;/code&gt;, равным &lt;code&gt;map&lt;/code&gt;. Обратите внимание на спецификацию операции: запуск операции &lt;code&gt;map&lt;/code&gt; требует задания структурированного набора аргументов. В HTTP-интерфейсе системы кодировать аргументы можно как через query string (что и происходило в примерах выше, см. аргументы &lt;em&gt;path&lt;/em&gt; и &lt;em&gt;type&lt;/em&gt;), так и в теле запроса для POST-запросов. Пример описывает спецификацию для запуска в формате JSON:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Запуск Map операции&lt;/span&gt;\n$ &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; &amp;lt;&amp;lt;&lt;span class=\"hljs-string\"&gt;END | curl -v -X POST \"http://$YT_PROXY/api/v4/start_operation\" \\\n    -H \"Accept: application/json\" -H \"Authorization: OAuth $YT_TOKEN\" \\\n    -H \"Content-Type: application/json\" \\\n    --data-binary @-\n{\n  \"operation_type\": \"map\",\n  \"spec\" : {\n    \"mapper\" : {\n      \"command\" : \"python exec.py map\",\n      \"file_paths\" : [ \"$YT_HOME/exec.py\" ],\n      \"format\" : \"dsv\"\n    },\n    \"input_table_paths\" : [ \"$YT_HOME/input\" ],\n    \"output_table_paths\" : [ \"$YT_HOME/output_map\" ]\n  }\n}\nEND&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"187\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-187\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-187\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-187.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&amp;lt; HTTP/1.1 200 OK\n&lt;span class=\"hljs-string\"&gt;\"381eb9-8eee9ec2-70a8370d-ea39f666\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"188\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-188\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-188\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-188.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В /api/v3 операции запускаются несколько &lt;a href=\"ru/user-guide/proxy/http.html#operations-v3\"&gt;иначе&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В отличие от операций &lt;code&gt;set&lt;/code&gt; и &lt;code&gt;write_file&lt;/code&gt;, возвращаемый GUID операции необходим для отслеживания состояния операции. Успешный ответ HTTP-интерфейса о запуске операции говорит только о том, что операция была запущена, но не о том, что она отработала корректно.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Посмотреть статус операции можно через веб-интерфейс или с помощью вызова &lt;code&gt;get_operation&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Просмотр статуса операции&lt;/span&gt;\n$ curl -v -X GET &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/api/v4/get_operation?operation_id=381eb9-8eee9ec2-70a8370d-ea39f666\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt;\n\n&amp;lt; HTTP/1.1 200 OK\n{\n  &lt;span class=\"hljs-string\"&gt;\"operation_type\"&lt;/span&gt; : &lt;span class=\"hljs-string\"&gt;\"map\"&lt;/span&gt;,\n  &lt;span class=\"hljs-string\"&gt;\"progress\"&lt;/span&gt; : {\n    &lt;span class=\"hljs-string\"&gt;\"jobs\"&lt;/span&gt; : { &lt;span class=\"hljs-string\"&gt;\"total\"&lt;/span&gt; : 1, &lt;span class=\"hljs-string\"&gt;\"pending\"&lt;/span&gt; : 0, &lt;span class=\"hljs-string\"&gt;\"running\"&lt;/span&gt; : 0, &lt;span class=\"hljs-string\"&gt;\"completed\"&lt;/span&gt; : 1, &lt;span class=\"hljs-string\"&gt;\"failed\"&lt;/span&gt; : 0 },\n    &lt;span class=\"hljs-string\"&gt;\"chunks\"&lt;/span&gt; : { &lt;span class=\"hljs-string\"&gt;\"total\"&lt;/span&gt; : 1,&lt;span class=\"hljs-string\"&gt;\"running\"&lt;/span&gt; : 0, &lt;span class=\"hljs-string\"&gt;\"completed\"&lt;/span&gt; : 1, &lt;span class=\"hljs-string\"&gt;\"pending\"&lt;/span&gt; : 0, &lt;span class=\"hljs-string\"&gt;\"failed\"&lt;/span&gt; : 0 },\n    ...\n  },\n  &lt;span class=\"hljs-string\"&gt;\"state\"&lt;/span&gt; : &lt;span class=\"hljs-string\"&gt;\"completed\"&lt;/span&gt;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"212\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-212\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-212\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-212.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Чтобы убедиться, что операция отработала корректно, можно прочитать результат её работы:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Чтение данных&lt;/span&gt;\n$ curl -v -X GET &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$HEAVY_YT_PROXY&lt;/span&gt;/api/v4/read_table?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/output_map\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: text/tab-separated-values\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt; \\\n  | &lt;span class=\"hljs-built_in\"&gt;head&lt;/span&gt;\n\n&amp;lt; HTTP/1.1 202 Accepted\nword=html count=1\nword=&lt;span class=\"hljs-built_in\"&gt;head&lt;/span&gt; count=1\nword=title  count=1\nword=михаил count=1\nword=булгаков count=1\nword=белая  count=1\nword=гвардия  count=1\nword=title  count=1\nword=&lt;span class=\"hljs-built_in\"&gt;head&lt;/span&gt; count=1\nword=body count=1\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"216\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-216\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-216\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-216.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"launch_sort\"&gt;&lt;a href=\"ru/user-guide/proxy/http.html#launch_sort\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск сортировки&lt;/span&gt;&lt;/a&gt;Запуск сортировки&lt;/h2&gt;\n&lt;p&gt;Сортировка запускается командой &lt;a href=\"api/commands.html#start_operation\"&gt;start_operation&lt;/a&gt; с параметром &lt;code&gt;operation_type&lt;/code&gt;, равным &lt;code&gt;sort&lt;/code&gt;. Входная спецификация для &lt;a href=\"user-guide/data-processing/operations/sort.html\"&gt;Sort&lt;/a&gt; немного похожа на спецификации для &lt;a href=\"user-guide/data-processing/operations/map.html\"&gt;Map&lt;/a&gt; и &lt;a href=\"user-guide/data-processing/operations/reduce.html\"&gt;Reduce&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Создание выходной таблицы&lt;/span&gt;\n$ curl -v -X POST &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/api/v4/create?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/output_sort&amp;amp;type=table\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt;\n\n&amp;lt; HTTP/1.1 200 OK\n&lt;span class=\"hljs-string\"&gt;\"0-95d-191-8901298a\"&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Запуск сортировки&lt;/span&gt;\n$ &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; &amp;lt;&amp;lt;&lt;span class=\"hljs-string\"&gt;END | curl -v -X POST \"http://$YT_PROXY/api/v4/start_operation\" \\\n    -H \"Accept: application/json\" -H \"Authorization: OAuth $YT_TOKEN\" \\\n    -H \"Content-Type: application/json\" \\\n    --data-binary @-\n{\n  \"operation_type\": \"sort\",\n  \"spec\" : {\n    \"input_table_paths\" : [ \"$YT_HOME/output_map\" ],\n    \"output_table_path\" : \"$YT_HOME/output_sort\",\n    \"sort_by\" : [ \"word\" ]\n  }\n}\nEND&lt;/span&gt;\n\n&amp;lt; HTTP/1.1 200 OK\n&lt;span class=\"hljs-string\"&gt;\"640310-da8d54f1-6eded631-31c91e76\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"223\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-223\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-223\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-223.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Отслеживать процесс выполнения операции можно через веб-интерфейс.&lt;/p&gt;\n&lt;h2 id=\"launch_reduce\"&gt;&lt;a href=\"ru/user-guide/proxy/http.html#launch_reduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск Reduce операции&lt;/span&gt;&lt;/a&gt;Запуск Reduce операции&lt;/h2&gt;\n&lt;p&gt;Запуск Reduce операции выполняется с помощью команды &lt;a href=\"api/commands.html#start_operation\"&gt;start_operation&lt;/a&gt; с параметром &lt;code&gt;operation_type&lt;/code&gt;, равным &lt;code&gt;reduce&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Создание выходной таблицы&lt;/span&gt;\n$ curl -v -X POST &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/api/v4/create?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/output_reduce&amp;amp;type=table\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: application/json\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt;\n\n&amp;lt; HTTP/1.1 200 OK\n&lt;span class=\"hljs-string\"&gt;\"0-95f-191-ba3a4055\"&lt;/span&gt;\n\n&lt;span class=\"hljs-comment\"&gt;# Запуск Reduce операции&lt;/span&gt;\n$ &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; &amp;lt;&amp;lt;&lt;span class=\"hljs-string\"&gt;END | curl -v -X POST \"http://$YT_PROXY/api/v4/start_operation\" \\\n    -H \"Accept: application/json\" -H \"Authorization: OAuth $YT_TOKEN\" \\\n    -H \"Content-Type: application/json\" \\\n    --data-binary @-\n{\n  \"operation_type\": \"reduce\",\n  \"spec\" : {\n    \"reducer\" : {\n      \"command\" : \"python exec.py reduce\",\n      \"file_paths\" : [ \"$YT_HOME/exec.py\" ],\n      \"format\" : \"dsv\"\n    },\n    \"input_table_paths\" : [ \"$YT_HOME/output_sort\" ],\n    \"output_table_paths\" : [ \"$YT_HOME/output_reduce\" ],\n    \"sort_by\" : [ \"word\" ],\n    \"reduce_by\" : [ \"word\" ]\n  }\n}\nEND&lt;/span&gt;\n\n&amp;lt; HTTP/1.1 200 OK\n&lt;span class=\"hljs-string\"&gt;\"658ad8-edf7650f-182e4fd0-a1a0fd03\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"233\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-233\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-233\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-233.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"read_results\"&gt;&lt;a href=\"ru/user-guide/proxy/http.html#read_results\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чтение результата&lt;/span&gt;&lt;/a&gt;Чтение результата&lt;/h2&gt;\n&lt;p&gt;После окончания операции получим подсчитанную статистику по частоте использования слов в «Белой гвардии». Посмотрим на результат её работы:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Чтение результата&lt;/span&gt;\n$ curl -v -X GET &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$HEAVY_YT_PROXY&lt;/span&gt;/api/v4/read_table?path=&lt;span class=\"hljs-variable\"&gt;$YT_HOME&lt;/span&gt;/output_reduce\"&lt;/span&gt; \\\n    -H &lt;span class=\"hljs-string\"&gt;\"Accept: text/tab-separated-values\"&lt;/span&gt; -H &lt;span class=\"hljs-string\"&gt;\"Authorization: OAuth &lt;span class=\"hljs-variable\"&gt;$YT_TOKEN&lt;/span&gt;\"&lt;/span&gt; \\\n  | &lt;span class=\"hljs-built_in\"&gt;head&lt;/span&gt;\n\n&amp;lt; HTTP/1.1 200 OK\ncount=1 word=0\ncount=1 word=04\ncount=1 word=05\ncount=4 word=1\ncount=2 word=10\ncount=4 word=11\ncount=4 word=12\ncount=4 word=13\ncount=3 word=14\ncount=2 word=15\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"240\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-240\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-240\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-240.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"operations-v3\"&gt;&lt;a href=\"ru/user-guide/proxy/http.html#operations-v3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запуск операций в /api/v3&lt;/span&gt;&lt;/a&gt;Запуск операций в /api/v3&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Версия /api/v3 является устаревшей — больше она не развивается. Используйте версию /api/v4.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В /api/v3 все операции обработки данных (Map, Reduce, Sort и так далее) запускались не командой &lt;code&gt;start_operation&lt;/code&gt;, а с помощью одноимённых команд — &lt;a href=\"api/commands.html#map\"&gt;map&lt;/a&gt;, &lt;a href=\"api/commands.html#reduce\"&gt;reduce&lt;/a&gt;, &lt;a href=\"api/commands.html#sort\"&gt;sort&lt;/a&gt;. Например, так выглядит запуск Map операции:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Запуск Map операции в /api/v3&lt;/span&gt;\n$ &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; &amp;lt;&amp;lt;&lt;span class=\"hljs-string\"&gt;END | curl -v -X POST \"http://$YT_PROXY/api/v3/map\" \\\n    -H \"Accept: application/json\" -H \"Authorization: OAuth $YT_TOKEN\" \\\n    -H \"Content-Type: application/json\" \\\n    --data-binary @-\n{\n  \"spec\" : {\n    \"mapper\" : {\n      \"command\" : \"python exec.py map\",\n      \"file_paths\" : [ \"$YT_HOME/exec.py\" ],\n      \"format\" : \"dsv\"\n    },\n    \"input_table_paths\" : [ \"$YT_HOME/input\" ],\n    \"output_table_paths\" : [ \"$YT_HOME/output_map\" ]\n  }\n}\nEND&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"257\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-257\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-257\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-257.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/proxy/http.md","sourcePath":"ru/user-guide/proxy/http.md"},"headings":[{"title":"Перед началом работы","href":"ru/user-guide/proxy/http.html#prerequisites","level":2},{"title":"Установка переменных окружения","href":"ru/user-guide/proxy/http.html#export-vars","level":2},{"title":"Создание исходной таблицы","href":"ru/user-guide/proxy/http.html#prepare","level":2},{"title":"Загрузка данных в таблицу","href":"ru/user-guide/proxy/http.html#upload","level":2,"items":[{"title":"Получение тяжёлых прокси","href":"ru/user-guide/proxy/http.html#get-data-proxy-list","level":3}]},{"title":"Загрузка файла","href":"ru/user-guide/proxy/http.html#zagruzka-fajla","level":2},{"title":"Запуск Map операции","href":"ru/user-guide/proxy/http.html#launch_map","level":2},{"title":"Запуск сортировки","href":"ru/user-guide/proxy/http.html#launch_sort","level":2},{"title":"Запуск Reduce операции","href":"ru/user-guide/proxy/http.html#launch_reduce","level":2},{"title":"Чтение результата","href":"ru/user-guide/proxy/http.html#read_results","level":2},{"title":"Запуск операций в /api/v3","href":"ru/user-guide/proxy/http.html#operations-v3","level":2}],"title":"HTTP-прокси"},"router":{"pathname":"ru/user-guide/proxy/http","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
