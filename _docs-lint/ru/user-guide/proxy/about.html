        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе содержится информация о различных интерфейсах, которые позволяют работать с системой YTsaurus: &lt;a href=\"ru/user-guide/proxy/about.html#http_proxy\"&gt;HTTP&lt;/a&gt; и &lt;a href=\"ru/user-guide/proxy/about.html#rpc_proxy\"&gt;RPC&lt;/a&gt; прокси.&lt;/p&gt;\n&lt;h2 id=\"http_proxy\"&gt;&lt;a href=\"ru/user-guide/proxy/about.html#http_proxy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HTTP-прокси&lt;/span&gt;&lt;/a&gt;HTTP-прокси&lt;/h2&gt;\n&lt;p&gt;&lt;strong&gt;HTTP-прокси&lt;/strong&gt; — это универсальный языко-независимый интерфейс для работы с системой YTsaurus.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Предупреждение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HTTP API является весьма низкоуровневым и плохо подходит для написания простого и надёжного прикладного кода. В частности, при его использовании необходимо правильно организовать логирование запросов и разметку их correlation ids, балансировать нагрузку на прокси, брать дополнительные явные блокировки на таблицы, обрабатывать ошибки и в ряде случаев повторять действия и т. д.&lt;/p&gt;\n&lt;p&gt;Мы настоятельно рекомендуем использовать поддерживаемые нами SDK для вашего языка, в которых эти задачи уже решены, например для &lt;a href=\"api/python/start.html\"&gt;Python&lt;/a&gt; или &lt;a href=\"api/cpp/description.html\"&gt;С++&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Для работы в консоли также следует использовать &lt;a href=\"api/cli/cli.html\"&gt;CLI&lt;/a&gt;, а не задавать прямые HTTP-запросы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Каждой HTTP-прокси приписана та или иная роль, которая указывает, какого рода нагрузку будет обслуживать прокси.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Запросы к Кипарису (например, &lt;code&gt;get&lt;/code&gt;, &lt;code&gt;set&lt;/code&gt;, &lt;code&gt;create&lt;/code&gt;) считаются сравнительно лёгкими и обрабатываются контрольными HTTP-прокси, роль &lt;code&gt;control&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Запросы на чтение или запись — например, &lt;code&gt;read-table&lt;/code&gt;, &lt;code&gt;write-table&lt;/code&gt; — потенциально могут передавать существенно больший объём данных и сильнее нагружать сеть узлов кластера YTsaurus. Поэтому такие запросы обрабатываются так называемыми тяжёлыми прокси (data-прокси), роль &lt;code&gt;data&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Отдельные процессы могут использовать свои роли, чтобы их нагрузка не мешала другим процессам.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Клиентские SDK обычно скрывают работу с ролями. Единственное, что может потребоваться, это указать роль в конфигурации клиента, если для тяжёлых запросов требуется использование нестандартной роли. Но при непосредственной работе с HTTP лёгкие и тяжёлые запросы должны отправляться на разные хосты.   Если отправить тяжёлый запрос через лёгкий HTTP-прокси, сервер вернёт ошибку. Подробнее читайте в разделе &lt;a href=\"user-guide/proxy/http-reference.html#hosts\"&gt;Список тяжёлых прокси&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Примеры взаимодействия с YTsaurus через HTTP-интерфейс представлены в разделе &lt;a href=\"user-guide/proxy/http.html\"&gt;HTTP-прокси&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Справочную информацию по HTTP-прокси можно посмотреть в разделе &lt;a href=\"user-guide/proxy/http-reference.html\"&gt;Справочник по HTTP-прокси&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"rpc_proxy\"&gt;&lt;a href=\"ru/user-guide/proxy/about.html#rpc_proxy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RPC-прокси&lt;/span&gt;&lt;/a&gt;RPC-прокси&lt;/h2&gt;\n&lt;p&gt;&lt;strong&gt;RPC-прокси&lt;/strong&gt; — это специальный интерфейс для взаимодействия с YTsaurus, через протокол RPC. Обращение к RPC Proxy происходит по протоколу TCP, порт 9013. Основные отличия RPC-прокси от HTTP-прокси:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;более высокая скорость обработки запросов, что достигается за счет следующих особенностей:\n&lt;ul&gt;\n&lt;li&gt;работа с RPC-прокси происходит по специальному внутреннему протоколу, который лучше подходит для работы с большим числом одновременных запросов;&lt;/li&gt;\n&lt;li&gt;в RPC-прокси запрос передаётся в нативном формате YTsaurus, поэтому не требует дополнительного времени и ресурсов на конвертацию;&lt;/li&gt;\n&lt;li&gt;возможность сохранить совместимость на уровне пользовательского кода при изменениях в протоколе взаимодействия компонентов внутри YTsaurus кластера.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Как и HTTP-прокси, все RPC-прокси разделены на роли. Роль указывается в конфигурации при подключении к кластеру и позволяет разделять пользовательскую нагрузку. Роль по умолчанию &lt;code&gt;default&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Поддерживаются следующие языки программирования:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"user-guide/proxy/rpc.html#c_plus_plus\"&gt;C++&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/proxy/rpc.html#java\"&gt;Java&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/proxy/rpc.html#python\"&gt;Python&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;По каждому языку программирования доступны примеры.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/proxy/about.md","sourcePath":"ru/user-guide/proxy/about.md"},"headings":[{"title":"HTTP-прокси","href":"ru/user-guide/proxy/about.html#http_proxy","level":2},{"title":"RPC-прокси","href":"ru/user-guide/proxy/about.html#rpc_proxy","level":2}],"title":"Прокси"},"router":{"pathname":"ru/user-guide/proxy/about","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730         </script>
