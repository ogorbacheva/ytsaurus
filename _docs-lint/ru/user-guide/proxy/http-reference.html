        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"commands_structure\"&gt;&lt;a href=\"ru/user-guide/proxy/http-reference.html#commands_structure\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Структура выполнения команды&lt;/span&gt;&lt;/a&gt;Структура выполнения команды&lt;/h2&gt;\n&lt;p&gt;При разработке библиотеки для работы с YTsaurus полезно понимать структуру выполнения команды.&lt;/p&gt;\n&lt;p&gt;Каждая исполняемая команда представляет собой структуру, содержащую:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;информацию о пользователе, позволяющую провести аутентификацию (в случае работы по HTTP это чаще всего токен);&lt;/li&gt;\n&lt;li&gt;информацию о входном и выходном &lt;a href=\"user-guide/storage/formats.html\"&gt;формате&lt;/a&gt; данных (представлена в виде YSON-строки с атрибутами);&lt;/li&gt;\n&lt;li&gt;информацию о параметрах команды (представлены в виде YSON-словаря);&lt;/li&gt;\n&lt;li&gt;входной (байтовый) поток данных;&lt;/li&gt;\n&lt;li&gt;выходной (байтовый) поток данных.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ниже приведены формальные спецификации кодирования каждого пункта в HTTP-прокси, которые включают в себя более широкую функциональность по интерпретации HTTP-запросов (отчасти для поддержки совместимости с такими HTTP-клиентами, как веб-браузер). Для корректной работы с YTsaurus требуется поддержать меньший набор функциональности, а именно:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;указывать &lt;code&gt;X-YT-Header-Format&lt;/code&gt;, определяющий формат для заголовков &lt;code&gt;X-YT-Input-Format&lt;/code&gt;, &lt;code&gt;X-YT-Output-Format&lt;/code&gt; и &lt;code&gt;X-YT-Parameters&lt;/code&gt; (значением заголовка является YSON);&lt;/li&gt;\n&lt;li&gt;указывать &lt;code&gt;X-YT-Input-Format&lt;/code&gt; и &lt;code&gt;X-YT-Output-Format&lt;/code&gt;, закодированные в соответствии с &lt;code&gt;X-YT-Header-Format&lt;/code&gt; и определяющие форматы входных и выходных потоков данных;&lt;/li&gt;\n&lt;li&gt;все параметры команды передавать в заголовке &lt;code&gt;X-YT-Parameters&lt;/code&gt;, закодированном в соответствии с &lt;code&gt;X-YT-Header-Format&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;все HTTP-ответы 5xx считать ошибкой транспортного уровня. Стоит отличать код 503, который является явным сигналом о временной недоступности, и код 500, сигнализирующий об ошибке на стороне YTsaurus. В первом случае можно повторить запрос;&lt;/li&gt;\n&lt;li&gt;во всех остальных ответах (2xx, 4xx) об успешном выполнении команды стоит судить по заголовкам/трейлерам &lt;code&gt;X-YT-Error&lt;/code&gt; (предпочтительно) или &lt;code&gt;X-YT-Response-Code&lt;/code&gt; (извлеченном из &lt;code&gt;X-YT-Error&lt;/code&gt; коде ошибки) и &lt;code&gt;X-YT-Response-Message&lt;/code&gt; (извлеченной из &lt;code&gt;X-YT-Error&lt;/code&gt; диагностике ошибки).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"http_method\"&gt;&lt;a href=\"ru/user-guide/proxy/http-reference.html#http_method\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как выбирается HTTP-метод для команды&lt;/span&gt;&lt;/a&gt;Как выбирается HTTP-метод для команды&lt;/h2&gt;\n&lt;p&gt;Для выбора HTTP-метода для команды достаточно следовать следующему алгоритму:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Если у команды есть поток входных данных, то PUT;&lt;/li&gt;\n&lt;li&gt;Если команда мутирующая, то POST;&lt;/li&gt;\n&lt;li&gt;Иначе GET.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"formats\"&gt;&lt;a href=\"ru/user-guide/proxy/http-reference.html#formats\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Форматы данных для операций&lt;/span&gt;&lt;/a&gt;Форматы данных для операций&lt;/h2&gt;\n&lt;p&gt;Интерпретация входных и выходных байтовых потоков (при типе данных, отличных от бинарного) определяется &lt;a href=\"user-guide/storage/formats.html\"&gt;форматом данных&lt;/a&gt;. Описание используемого формата представляет собой YSON-строку с, возможно, дополнительными атрибутами. Стандартным способом задания описания используемых форматов являются заголовки &lt;code&gt;X-YT-Input-Format&lt;/code&gt; и &lt;code&gt;X-YT-Output-Format&lt;/code&gt;. Для большей совместимости с HTTP-библиотеками частично поддерживаются заголовки &lt;code&gt;Accept&lt;/code&gt; и &lt;code&gt;Content-Type&lt;/code&gt;. Ниже приведено подробное описание правил определения формата.&lt;/p&gt;\n&lt;h3 id=\"set_input_format\"&gt;&lt;a href=\"ru/user-guide/proxy/http-reference.html#set_input_format\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как указывается формат входных данных&lt;/span&gt;&lt;/a&gt;Как указывается формат входных данных&lt;/h3&gt;\n&lt;p&gt;Формат входных данных определяется по следующим правилам. Каждое последующее правило перекрывает предыдущее.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Если указан заголовок &lt;code&gt;Content-Type&lt;/code&gt; и указанный MIME-тип есть в таблице соответствия, то формат выбирается из таблицы;&lt;/li&gt;\n&lt;li&gt;Если указан заголовок &lt;code&gt;X-YT-Input-Format&lt;/code&gt;, то содержимое заголовка интерпретируется как JSON-закодированная YSON-строка с атрибутами и она используется как описание входного формата;&lt;/li&gt;\n&lt;li&gt;Если ни п. 1, ни п. 2 не отработали успешно, то используется YSON.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"set_output_format\"&gt;&lt;a href=\"ru/user-guide/proxy/http-reference.html#set_output_format\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как указывается формат выходных данных&lt;/span&gt;&lt;/a&gt;Как указывается формат выходных данных&lt;/h3&gt;\n&lt;p&gt;Формат выходных данных определяется по следующим правилам. Каждое последующее правило перекрывает предыдущее.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Если указан заголовок &lt;code&gt;Accept&lt;/code&gt;, то выбирается лучший MIME-тип из таблицы, соответствующий Accept-заголовку, и далее формат берется из таблицы. Content-Type равен совпавшему MIME-типу;&lt;/li&gt;\n&lt;li&gt;Если указан заголовок &lt;code&gt;X-YT-Output-Format&lt;/code&gt;, то содержимое заголовка интерпретируется как JSON-закодированная YSON-строка с атрибутами, и она используется как описание выходного формата. Content-Type равен &lt;code&gt;application/octet-stream&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Если ни п. 1, ни п. 2 не отработали успешно, то используется Pretty YSON. Content-Type равен &lt;code&gt;text/plain&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"return_codes\"&gt;&lt;a href=\"ru/user-guide/proxy/http-reference.html#return_codes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Коды возврата HTTP&lt;/span&gt;&lt;/a&gt;Коды возврата HTTP&lt;/h2&gt;\n&lt;p&gt;Если веб-сервер понимает об ошибке до того, как клиенту отправляются какие-либо данные, то код возврата 4xx или 5xx обозначает ошибку. Если клиенту начали поставляться данные, то код возврата будет 202 (&lt;code&gt;Accepted&lt;/code&gt;), а в трейлер-хедере &lt;code&gt;X-YT-Response-Code&lt;/code&gt; будет код возврата YTsaurus. Ненулевой &lt;code&gt;X-YT-Response-Code&lt;/code&gt; свидетельствует об ошибке. В таком случае в трейлер-хедере &lt;code&gt;X-YT-Response-Message&lt;/code&gt; записано сообщение об ошибке (как JSON-строка).&lt;/p&gt;\n&lt;p&gt;&lt;small&gt;Таблица 1 — Коды возврата&lt;/small&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Код возврата&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;200&lt;/td&gt;\n&lt;td&gt;Команда успешно отработала&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;202&lt;/td&gt;\n&lt;td&gt;Команда исполняется, тело ответа будет отправлено HTTP-потоком, в трейлер-хедерах записаны внутренние коды возврата&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;307&lt;/td&gt;\n&lt;td&gt;Редирект тяжёлых запросов с лёгких на тяжёлые прокси&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;400&lt;/td&gt;\n&lt;td&gt;Команда была исполнена, но вернулась ошибка (в теле подробная JSON-закодированная ошибка)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;401&lt;/td&gt;\n&lt;td&gt;Неаутентифицированный запрос&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;404&lt;/td&gt;\n&lt;td&gt;Неизвестная команда&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;405&lt;/td&gt;\n&lt;td&gt;Неверный HTTP-метод&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;406&lt;/td&gt;\n&lt;td&gt;Неверный формат в Accept&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;415&lt;/td&gt;\n&lt;td&gt;Неверный формат в Accept-Encoding&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;429&lt;/td&gt;\n&lt;td&gt;Превышен лимит на количество запросов от пользователя&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;500&lt;/td&gt;\n&lt;td&gt;Ошибка на стороне прокси&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;503&lt;/td&gt;\n&lt;td&gt;Сервис недоступен. Запрос нужно повторить попозже&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"debugging\"&gt;&lt;a href=\"ru/user-guide/proxy/http-reference.html#debugging\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Отладка запроса&lt;/span&gt;&lt;/a&gt;Отладка запроса&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Все запросы поддерживают опциональные отладочные заголовки. Их обработка не является обязательной, но рекомендуется.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В запросе:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Сформировать guid и выставить его в заголовок &lt;code&gt;X-YT-Correlation-Id&lt;/code&gt;. Этот заголовок помогает по логу найти запрос, даже если ответ на него не пришёл клиенту.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;В ответе:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;X-YT-Request-Id&lt;/code&gt; — идентификатор запроса, сформированный прокси. Нужен, чтобы найти запрос в логе YTsaurus прокси.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;X-YT-Proxy&lt;/code&gt; — hostname прокси, с которой пришёл ответ. Важно для ситуации, когда запрос идёт через балансер.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"additional\"&gt;&lt;a href=\"ru/user-guide/proxy/http-reference.html#additional\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Расширенные возможности&lt;/span&gt;&lt;/a&gt;Расширенные возможности&lt;/h2&gt;\n&lt;h3 id=\"compression\"&gt;&lt;a href=\"ru/user-guide/proxy/http-reference.html#compression\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сжатие&lt;/span&gt;&lt;/a&gt;Сжатие&lt;/h3&gt;\n&lt;p&gt;При передаче данных через HTTP-прокси можно использовать сжатие. Прокси выбирает кодек для входящих данных исходя из заголовка &lt;code&gt;Content-Encoding&lt;/code&gt;, а для исходящих — исходя из &lt;code&gt;Accept-Encoding&lt;/code&gt;. Возможные кодеки перечислены в таблице.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Content-Encoding&lt;/strong&gt;/&lt;strong&gt;Accept-Encoding&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Кодек&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;identity&lt;/td&gt;\n&lt;td&gt;Отсутствует&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;gzip, deflate&lt;/td&gt;\n&lt;td&gt;Стандартный zlib&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"parameters\"&gt;&lt;a href=\"ru/user-guide/proxy/http-reference.html#parameters\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Параметры&lt;/span&gt;&lt;/a&gt;Параметры&lt;/h3&gt;\n&lt;p&gt;Каждая команда обладает набором дополнительных параметров, которые представляются в виде YSON-словаря. Стандартным способом передачи параметров является заголовок &lt;code&gt;X-YT-Parameters&lt;/code&gt;, который интерпретируется как JSON-закодированный YSON-словарь.&lt;/p&gt;\n&lt;h3 id=\"hosts\"&gt;&lt;a href=\"ru/user-guide/proxy/http-reference.html#hosts\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список тяжёлых прокси (/hosts)&lt;/span&gt;&lt;/a&gt;Список тяжёлых прокси (/hosts)&lt;/h3&gt;\n&lt;p&gt;Все команды в YTsaurus делятся на лёгкие и тяжёлые. Тяжёлые команды связаны с большим I/O и, как следствие, сетевой нагрузкой. Для изоляции данной нагрузки управляющие (лёгкие) команды отделяются от тяжёлых. При попытке исполнить тяжёлую команду лёгкие прокси вернут код 503. Балансировка тяжёлых команд по тяжёлым прокси производится непосредственно клиентом.&lt;/p&gt;\n&lt;p&gt;Перед исполнением тяжёлой команды необходимо обратиться к &lt;code&gt;/hosts&lt;/code&gt; и получить список прокси, упорядоченный по нагрузке. Нагрузка оценивается исходя из сиюминутной загрузки по CPU и сети, а также по некоторой запланированной в будущем нагрузки на прокси. Самая первая прокси в списке-результате — наименее загруженная, именно её вам нужно использовать в простых случаях (= в 80% случаев).&lt;/p&gt;\n&lt;h3 id=\"api\"&gt;&lt;a href=\"ru/user-guide/proxy/http-reference.html#api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Доступные версии API (/api)&lt;/span&gt;&lt;/a&gt;Доступные версии API (/api)&lt;/h3&gt;\n&lt;p&gt;HTTP API является версионированным (как можно заметить из наличия префикса &lt;code&gt;/v4&lt;/code&gt; в примерах &lt;a href=\"user-guide/proxy/http.html\"&gt;отсюда&lt;/a&gt;). Версия API изменяется при обратно-несовместимых изменениях множества поддерживаемых команд или семантики какой-либо из существующих команд. Добавление новых команд обычно не приводит к смене версии API. В HTTP-прокси осуществляется поддержка двух последних версий API.&lt;/p&gt;\n&lt;p&gt;Список поддерживаемых версий API можно получить по URL-у &lt;code&gt;/api&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Получение списка доступных API:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ curl -v -X GET &lt;span class=\"hljs-string\"&gt;\"http://&lt;span class=\"hljs-variable\"&gt;$YT_PROXY&lt;/span&gt;/api\"&lt;/span&gt;\n&amp;gt; GET /api HTTP/1.1\n&amp;lt; HTTP/1.1 200 OK\n[&lt;span class=\"hljs-string\"&gt;\"v3\"&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;\"v4\"&lt;/span&gt;]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"364\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-364\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-364\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-364.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"mime_to_yt_format\"&gt;&lt;a href=\"ru/user-guide/proxy/http-reference.html#mime_to_yt_format\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таблица соответствия MIME-типов и форматов YT&lt;/span&gt;&lt;/a&gt;Таблица соответствия MIME-типов и форматов YT&lt;/h2&gt;\n&lt;p&gt;Соответствие MIME-типа YT-формату представлено в таблице.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;MIME-тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;YT-формат&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;application/json&lt;/td&gt;\n&lt;td&gt;json&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;application/x-yt-yson-binary&lt;/td&gt;\n&lt;td&gt;&amp;lt;format=binary&amp;gt;yson&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;application/x-yt-yson-text&lt;/td&gt;\n&lt;td&gt;&amp;lt;format=text&amp;gt;yson&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;application/x-yt-yson-pretty&lt;/td&gt;\n&lt;td&gt;&amp;lt;format=pretty&amp;gt;yson&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;application/x-yamr-delimited&lt;/td&gt;\n&lt;td&gt;&amp;lt;lenval=false;has_subkey=false&amp;gt;yamr&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;application/x-yamr-lenval&lt;/td&gt;\n&lt;td&gt;&amp;lt;lenval=true;has_subkey=false&amp;gt;yamr&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;application/x-yamr-subkey-delimited&lt;/td&gt;\n&lt;td&gt;&amp;lt;lenval=false;has_subkey=true&amp;gt;yamr&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;application/x-yamr-subkey-lenval&lt;/td&gt;\n&lt;td&gt;&amp;lt;lenval=true;has_subkey=true&amp;gt;yamr&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;text/tab-separated-values&lt;/td&gt;\n&lt;td&gt;dsv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;text/x-tskv&lt;/td&gt;\n&lt;td&gt;&amp;lt;line_prefix=tskv&amp;gt;dsv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"framing\"&gt;&lt;a href=\"ru/user-guide/proxy/http-reference.html#framing\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Фрейминг&lt;/span&gt;&lt;/a&gt;Фрейминг&lt;/h2&gt;\n&lt;p&gt;Для некоторых команд может использоваться особый протокол поверх обычного HTTP.&lt;br /&gt;\nИменно, если клиент указывает заголовок &lt;code&gt;X-YT-Accept-Framing: 1&lt;/code&gt;, то прокси может ответить ответом с заголовком &lt;code&gt;X-YT-Framing: 1&lt;/code&gt;.&lt;br /&gt;\nВ таком случае тело ответа будет состоять из записей вида &lt;code&gt;&amp;lt;tag&amp;gt; &amp;lt;header&amp;gt; &amp;lt;frame&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Типы фреймов:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Название&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Tag&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Header&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Frame&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Комментарий&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Data&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0x01&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;4-байтовое little-endian число - размер фрейма&lt;/td&gt;\n&lt;td&gt;тело фрейма&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Keep-alive&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;0x02&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;отсутствует&lt;/td&gt;\n&lt;td&gt;отсутствует&lt;/td&gt;\n&lt;td&gt;\"данные готовятся, подожди\"&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/proxy/http-reference.md","sourcePath":"ru/user-guide/proxy/http-reference.md"},"headings":[{"title":"Структура выполнения команды","href":"ru/user-guide/proxy/http-reference.html#commands_structure","level":2},{"title":"Как выбирается HTTP-метод для команды","href":"ru/user-guide/proxy/http-reference.html#http_method","level":2},{"title":"Форматы данных для операций","href":"ru/user-guide/proxy/http-reference.html#formats","level":2,"items":[{"title":"Как указывается формат входных данных","href":"ru/user-guide/proxy/http-reference.html#set_input_format","level":3},{"title":"Как указывается формат выходных данных","href":"ru/user-guide/proxy/http-reference.html#set_output_format","level":3}]},{"title":"Коды возврата HTTP","href":"ru/user-guide/proxy/http-reference.html#return_codes","level":2},{"title":"Отладка запроса","href":"ru/user-guide/proxy/http-reference.html#debugging","level":2},{"title":"Расширенные возможности","href":"ru/user-guide/proxy/http-reference.html#additional","level":2,"items":[{"title":"Сжатие","href":"ru/user-guide/proxy/http-reference.html#compression","level":3},{"title":"Параметры","href":"ru/user-guide/proxy/http-reference.html#parameters","level":3},{"title":"Список тяжёлых прокси (/hosts)","href":"ru/user-guide/proxy/http-reference.html#hosts","level":3},{"title":"Доступные версии API (/api)","href":"ru/user-guide/proxy/http-reference.html#api","level":3}]},{"title":"Таблица соответствия MIME-типов и форматов YT","href":"ru/user-guide/proxy/http-reference.html#mime_to_yt_format","level":2},{"title":"Фрейминг","href":"ru/user-guide/proxy/http-reference.html#framing","level":2}],"title":"Справочник по HTTP-прокси"},"router":{"pathname":"ru/user-guide/proxy/http-reference","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
