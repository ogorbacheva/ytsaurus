        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"vstuplenie\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/hunks-guide.html#vstuplenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вступление&lt;/span&gt;&lt;/a&gt;Вступление&lt;/h2&gt;\n&lt;p&gt;Ханковые чанки (hunk chunks) — это механизм, который позволяет хранить крупные строковые значения отдельно от самих строк таблицы. Если строковое значение превышает определенный порог длины, то в чанке оно заменяется на легкую ссылку, ведущую в чанк нового типа — ханковый. В ханковых чанках, в отличие от обычных, хранятся сырые неструктурированные данные: для чтения достаточно знать только смещение относительно начала чанка и длину. Такая конструкция открывает дополнительные возможности для оптимизации использования динамических таблиц:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Позволяет держать лишь малую часть таблицы в памяти, сохраняя низкую латентность лукапов.&lt;/li&gt;\n&lt;li&gt;Уменьшает write amplification за счет того, что ханковые чанки компактифицируются реже обычных.&lt;/li&gt;\n&lt;li&gt;Для таблицы, не лежащей в памяти, уменьшает поток чтений с диска.&lt;/li&gt;\n&lt;li&gt;Позволяет использовать erasure кодирование с низкими накладными расходами на erasure repair ханковых значений на лету.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Более подробно про оптимизации см. раздел &lt;a href=\"ru/user-guide/dynamic-tables/hunks-guide.html#use-scenarios\"&gt;Сценарии использования&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"kogda-stoit-ispolzovat-hanki\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/hunks-guide.html#kogda-stoit-ispolzovat-hanki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Когда стоит использовать ханки&lt;/span&gt;&lt;/a&gt;Когда стоит использовать ханки&lt;/h2&gt;\n&lt;p&gt;Ханки могут оказаться полезны, если таблица содержит много крупных строковых значений. Тем не менее даже в этом случае существует несколько причин, почему ханки могут не подойти:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Таблица лежит на HDD — чтение ханков с диска сопровождается большим количеством параллельных мелкогранулярных обращений к носителю, HDD для такого не подходит.&lt;/li&gt;\n&lt;li&gt;У данных в таблице хорошая степень сжатия (низкое значение параметра &lt;code&gt;compression_ratio&lt;/code&gt;). Сейчас блоки в ханковых чанках не сжимаются, чтобы была возможность гранулярно читать с диска ханки, поэтому при переезде на ханки disk space таблицы может заметно вырасти. Это частично компенсируется выставлением hunk erasure codec. Также сейчас в тестовом режиме можно попробовать словарное сжатие ханковых значений, что должно помочь полностью избавиться от данной проблемы.&lt;/li&gt;\n&lt;li&gt;К таблице применяется versioned remote copy (или скрипт по добавлению реплик к реплицированной таблице). Сейчас для таблиц с ханковыми чанками не поддержана возможность делать versioned remote copy. Эта функциональность доступна начиная с версии 25.1. Тем не менее, в ручном режиме это возможно, см. &lt;a href=\"ru/user-guide/dynamic-tables/hunks-guide.html#faq\"&gt;FAQ&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Если размер строкового значения не больше, чем &lt;code&gt;max_inline_hunk_size&lt;/code&gt;, то такое значение называется &lt;code&gt;inline value&lt;/code&gt;, иначе — &lt;code&gt;ref value&lt;/code&gt;. Ханковые чанки состоят из &lt;code&gt;ref values&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Чтобы примерно оценить, какую долю таблицы составляют &lt;code&gt;ref values&lt;/code&gt; с учетом разного &lt;code&gt;max_inline_hunk_size&lt;/code&gt; , можно воспользоваться скриптом &lt;code&gt;yt/yt/tools/hunk_chunk_advisor/hunk_chunk_advisor compute_weight&lt;/code&gt;.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Пример использования&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;./hunk_chunk_advisor compute_weight --proxy zeno --table-path //home/table --sampling-rate 0.1 --result-file result_file --computation-path //home/hunk_chunk_advisor\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"65\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-65\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-65\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-65.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Скрипт запускает на кластере операции, с помощью которых сначала создается статическая таблица из динамической с возможностью семплирования строк, а затем для разных &lt;code&gt;max_inline_hunk_size&lt;/code&gt; будет посчитана доля данных, являющаяся &lt;code&gt;ref values&lt;/code&gt;.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Параметр скрипта&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;proxy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Название YTsaurus кластера&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;table-path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Путь в Кипарисе до таблицы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;sampling-rate&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Доля строк в таблице, по которой будет посчитана статистика (нужно, если таблица слишком большая, чтобы запустить по ней операцию)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;result-file&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;По этому локальному пути будет создан png файл с детализацией статистики&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;computation-path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Путь в Кипарисе до директории, в которой будут лежать таблицы с промежуточными вычислениями. Рекомендуется создать новую поддиректорию внутри директории проекта, чтобы с одной стороны не нарушить acl, а с другой стороны ничего не замусорить в рабочей директории.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"vklyuchenie-hankov\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/hunks-guide.html#vklyuchenie-hankov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Включение ханков&lt;/span&gt;&lt;/a&gt;Включение ханков&lt;/h2&gt;\n&lt;p&gt;Чтобы включить ханки, необходимо изменить схему таблицы, выставив на интересующие строковые колонки атрибут &lt;code&gt;max_inline_hunk_size&lt;/code&gt;. Изменение в схеме происходит через отмонтирование таблицы.&lt;/p&gt;\n&lt;p id=\"slim_format\"&gt;&lt;/p&gt;\n&lt;p&gt;Также рекомендуется использовать альтернативный формат чанков. Формат чанков по умолчанию &lt;code&gt;@optimize_for=lookup&lt;/code&gt; может быть неэффективен с точки зрения uncompressed data size, особенно для таблиц с ханками, потому что в них хранится множество hunk refs, которые физически представлены как короткие строчки. Стоит либо выставить slim chunk format: &lt;code&gt;@optimize_for=lookup&lt;/code&gt; и &lt;code&gt;@chunk_format=table_versioned_slim&lt;/code&gt;, либо scan формат: &lt;code&gt;@optimize_for=scan&lt;/code&gt; и &lt;code&gt;@chunk_format=table_versioned_columnar&lt;/code&gt;. При использовании scan формата также скорее всего стоит выставить на все колонки схемы одинаковую column group. Подробнее про группы колонок можно найти в &lt;a href=\"ru/user-guide/storage/chunks#columns\"&gt;документации&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Для включения ханков на таблице можно воспользоваться скриптом, который лежит в &lt;code&gt;yt/yt/experiments/public/hunkifier&lt;/code&gt;.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробнее про hunkifier&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Пример использования:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;./hunkifier --proxy zeno  --table-path //home/replica_table --max-inline-hunk-size 128`\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"148\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-148\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-148\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-148.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;При запуске скрипта таблица будет отмонтирована, к ней будет применен schema alter с добавлением нужного атрибута, выставлены дополнительные настройки, а затем она будет примонтирована обратно.&lt;/p&gt;\n&lt;p&gt;Основные параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Параметр скрипта&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;proxy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Название YTsaurus кластера&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;table-path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Пусть в Кипарисе до таблицы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;max-inline-hunk-size&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Максимальный размер строкового значения в байтах&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Дополнительные параметры:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Параметр скрипта&lt;/th&gt;\n&lt;th&gt;Описание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;primary-medium&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Медиум, на котором будут расположены чанки (обычные и ханковые)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;enable-crp&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Использовать на таблице &lt;a href=\"ru/user-guide/dynamic-tables/hunks-guide.html#consistent-replica-placement\"&gt;consistent replica placement&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;max-hunk-compaction-garbage-ratio&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Атрибут &lt;a href=\"ru/user-guide/dynamic-tables/hunks-guide.html#max_hunk_compaction_garbage_ratio\"&gt;max_hunk_compaction_garbage_ratio&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;hunk-erasure-codec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/user-guide/dynamic-tables/hunks-guide.html#hunk_erasure_codec\"&gt;Erasure codec&lt;/a&gt; для ханковых чанков&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;fragment-read-hedging-delay&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Задержка перед отправкой &lt;a href=\"ru/user-guide/dynamic-tables/hunks-guide.html#hunk_hedging\"&gt;хеджирующего запроса&lt;/a&gt; чтения фрагментов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;enable-slim-format&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Использовать на таблице &lt;a href=\"ru/user-guide/dynamic-tables/hunks-guide.html#slim_format\"&gt;slim формат&lt;/a&gt; чанков&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;enable-columnar-format&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Использовать на таблице поколоночный формат чанков&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;columns&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Список колонок, на которые будет выставлен атрибут &lt;code&gt;max_inline_hunk_size&lt;/code&gt;. Если опция не указана, то атрибут будет выставлен на все строковые колонки таблицы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;После того как ханки включены, а таблица примонтирована, флаш и компакшен наряду с обычными чанками будет генерировать ханковые, в которых будут лежать &lt;code&gt;ref values&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Чтобы быстро изменить структуру всех чанков в таблице, можно выполнить forced compaction, учитывая все предостережения, описанные в &lt;a href=\"ru/user-guide/dynamic-tables/compaction#forced_compaction\"&gt;документации&lt;/a&gt;. Также существуют опции &lt;code&gt;forced_store_compaction_revision&lt;/code&gt; и &lt;code&gt;forced_hunk_compaction_revision&lt;/code&gt; для форсированной компактификации только обычных или только ханковых чанков.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Опция &lt;code&gt;forced_hunk_compaction_revision&lt;/code&gt; не вызывает компакшн ханковых чанков самих по себе: алгоритм компакшна будет безусловно компактить лишь те ханковые чанки, на которые есть ссылка от обычных чанков, которые попали под критерии компакшена.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"use-scenarios\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/hunks-guide.html#use-scenarios\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сценарии использования&lt;/span&gt;&lt;/a&gt;Сценарии использования&lt;/h2&gt;\n&lt;p&gt;Существует несколько сценариев, при которых могут оказаться полезны различные конфигурации таблицы с ханками. Каждая конфигурация задается определенным набором опций, имеющих свои трейд-оффы.&lt;/p&gt;\n&lt;ul id=\"max_hunk_compaction_garbage_ratio\"&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;b&gt;Таблица в памяти занимает много tablet static.&lt;/b&gt;&lt;br /&gt;\nОбычно в таком случае важную роль играет низкая латентность на чтение таблицы. Если положить таблицу с включенными ханками в память, то в памяти окажутся лишь неханковые чанки. Благодаря этому можно существенно сэкономить tablet static, не сильно потеряв в latency читающих запросов.&lt;/p&gt;\n&lt;p&gt;При этом если пользователь читает строчку, в которой нет &lt;code&gt;ref values&lt;/code&gt;, то чтение по-прежнему будет из памяти. Если же в строчке есть &lt;code&gt;ref values&lt;/code&gt;, то будут дополнительные расходы на чтение таких значений (поход по сети до data node и чтение этих значений с диска). Соответственно, при уменьшении &lt;code&gt;max_inline_hunk_size&lt;/code&gt; доля чтений из памяти будет уменьшаться, как и размер требуемой tablet static памяти.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В случае высоконагруженных таблиц могут потребоваться дополнительные усилия по оптимизации, поэтому рекомендуется ознакомиться с разделом &lt;a href=\"ru/user-guide/dynamic-tables/hunks-guide.html#optimization\"&gt;Дальнейшая оптимизация&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;ul id=\"hunk_erasure_codec\"&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;b&gt;При записи таблицы возникает высокий write amplification.&lt;/b&gt;&lt;br /&gt;\nКак известно, LSM-структура динамической таблицы подразумевает, что поток записи на диск выше, чем изначальный поток пользовательской записи. Высокий поток и write amplification могут влиять на необходимое для обслуживания таблицы число дисков (с учетом DWPD разрешенный поток записи на диск оказывается сравнительно небольшим).&lt;/p&gt;\n&lt;p&gt;При компактификации обычных чанков, содержащих ссылки на ханковые, не обязательно читать и модифицировать ханковые чанки. Поэтому после компактификации ханковые чанки могут частично состоять из устаревших значений, если некоторые из &lt;code&gt;ref values&lt;/code&gt; в них остаются без ссылок. Это допущение позволяет пропускать чтение и перезапись &lt;code&gt;ref values&lt;/code&gt;, снижая поток чтения и записи при компактификации.&lt;/p&gt;\n&lt;p&gt;Опция, которая регулирует максимально допустимую долю мусора в ханковых чанках — это &lt;code&gt;max_hunk_compaction_garbage_ratio&lt;/code&gt;. Чем выше это значение, тем меньше будет write amplification, но тем выше у таблицы будет disk space (за счет того, что в ханковых чанках будет лежать больше устаревших значений).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;b&gt;При чтении таблицы возникает высокая нагрузка на диск.&lt;/b&gt;&lt;br /&gt;\nПри чтении с диска обычных чанков приходится читать целые блоки, которые как правило занимают пару сотен килобайт. В случае большого потока диски могут перегружаться, а кеш блоков может использоваться неэффективно. Чтение ханков же происходит с гранулярностью 4KB.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;b&gt;У таблицы слишком высокий disk space.&lt;/b&gt;&lt;/p&gt;\n&lt;p&gt;В случае перегрузки или недоступности некоторых партов обычных чанков, erasure-восстановление может быть неэффективным и ресурсоёмким. За счет оптимизаций в слое чтения ханковых чанков, этот процесс оказывается не настолько болезненным. Для ханковых чанков можно включить erasure кодирование, указав на таблице атрибут &lt;code&gt;@hunk_erasure_codec&lt;/code&gt;. Для включения восстановления партов на лету см. раздел &lt;a href=\"ru/user-guide/dynamic-tables/hunks-guide.html#optimization\"&gt;Дальнейшая оптимизация&lt;/a&gt;. После изменения erasure codec на таблице можно узнать для каждого из кодеков, сколько чанков записано в нем, используя атрибут &lt;code&gt;@erasure_statistics&lt;/code&gt; таблицы.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"optimization\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/hunks-guide.html#optimization\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дальнейшие оптимизации&lt;/span&gt;&lt;/a&gt;Дальнейшие оптимизации&lt;/h2&gt;\n&lt;p&gt;С точки зрения дата ноды чтения &lt;code&gt;ref values&lt;/code&gt; превращаются в чтения фрагментов, поэтому в данном разделе используется именно этот термин.&lt;/p&gt;\n&lt;p id=\"hunk_hedging\"&gt;&lt;/p&gt;\n&lt;ul id=\"consistent-replica-placement\"&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;b&gt;Хеджирование запросов чтения фрагментов или восстановление на лету в случае erasure.&lt;/b&gt;&lt;br /&gt;\nЕсли запрос чтения с дата ноды выполняется слишком долго, то его стоит хеджировать. Для этого существует опция &lt;code&gt;@hunk_chunk_reader/fragment_read_hedging_delay&lt;/code&gt; (значение в миллисекундах). Эта же опция отвечает за время, после которого запускается erasure repair парта в случае неответа от дата ноды.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;b&gt;Батчинг запросов фрагментов.&lt;/b&gt;&lt;br /&gt;\nПо умолчанию для каждого чанка таблицы выбираются три случайные дата ноды, на которых хранятся его реплики. Даже лукап одного ключа, как правило, порождает чтения из нескольких чанков, нечего говорить про ситуацию, когда совершается лукап нескольких ключей. Так как чтение каждого &lt;code&gt;ref value&lt;/code&gt; — это чтение с диска с удаленной дата ноды, то возникает высокий fan-out запросов к подсистеме хранения данных. Это может быть критично для производительности, если поток запросов к таблице достаточно высок. В этом случае можно выставить на таблицу булев атрибут &lt;code&gt;@enable_consistent_chunk_replica_placement&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Тогда реплики чанков одного таблета в best-effort режиме будут назначаться одним и тем же дата нодам. Запросы чтения фрагментов к дата нодам батчуются. А на дата нодах, в свою очередь, батчуются запросы к диску. За счет этого в некоторых случается удается кратно уменьшить fan-out.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данная опция может заметно влиять на слой хранения за счет особой нагрузки по репликации чанков. Стоит выставлять ее только после консультации с командой YTsaurus.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;b&gt;Более эффективное чтение с диска.&lt;/b&gt;&lt;br /&gt;\nЧтение фрагментов вызывает множество мелкогранулярных чтений с диска. Чтобы они оставались эффективными и низколатентными, стоит для хранения чанков таблицы использовать медиум с io_uring. Также для обхода кеша ОС можно читать с direct io, для чего на таблицу выставить булев атрибут &lt;code&gt;@hunk_chunk_reader/use_direct_io&lt;/code&gt; (на некоторых медиумах чтения с direct io глобально выключены и этот атрибут не возымеет никакого эффекта).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"diagnostika\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/hunks-guide.html#diagnostika\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Диагностика&lt;/span&gt;&lt;/a&gt;Диагностика&lt;/h2&gt;\n&lt;p&gt;Чтобы понять, какая часть чанков ханковая, и каков их размер, можно выполнить запрос:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt get &amp;lt;table_cypress_path&amp;gt;/@chunk_format_statistics\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"391\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-391\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-391\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-391.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Для получения более детальной статистики по структуре ханковых чанков можно выполнить запрос:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt get &amp;lt;table_cypress_path&amp;gt;/@hunk_statistics\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"395\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-395\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-395\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-395.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Оба эти запроса являются тяжёлыми с точки зрения мастера и подходят лишь для единоразового ручного применения.&lt;/p&gt;\n&lt;p&gt;Также есть некоторые полезные атрибуты у чанков:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;У всех чанков: &lt;code&gt;@consistent_replica_placement_hash&lt;/code&gt;, &lt;code&gt;@consistent_replica_placement&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;У обычных чанков: &lt;code&gt;@hunk_chunk_refs&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;У ханковых чанков: &lt;code&gt;@hunk_count&lt;/code&gt; и &lt;code&gt;@total_hunk_length&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Подробнее про рефы ханковых чанков можно посмотреть в орхидее ноды: &lt;code&gt;tablet_cells/&amp;lt;cell_id&amp;gt;/tablets/&amp;lt;tablet_id&amp;gt;/hunk_chunks/&amp;lt;chunk_id&amp;gt;&lt;/code&gt;&lt;/p&gt;\n&lt;h2 id=\"faq\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/hunks-guide.html#faq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FAQ&lt;/span&gt;&lt;/a&gt;FAQ&lt;/h2&gt;\n&lt;h4 id=\"chto-delat,-esli-posle-vklyucheniya-hankov-silno-vyros-disk-space\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/hunks-guide.html#chto-delat,-esli-posle-vklyucheniya-hankov-silno-vyros-disk-space\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что делать, если после включения ханков сильно вырос disk space?&lt;/span&gt;&lt;/a&gt;Что делать, если после включения ханков сильно вырос disk space?&lt;/h4&gt;\n&lt;p&gt;Может помочь тюнинг атрибута таблицы &lt;code&gt;@max_hunk_compaction_garbage_ratio&lt;/code&gt; — это допустимая доля мусора (устаревших данных) в ханковых чанках. При превышении этого порога к ханковому чанку будет применена компактификация. По умолчанию равен &lt;code&gt;0.5&lt;/code&gt;. На некоторых таблицах в зависимости от нагрузки может быть полезно выставить в &lt;code&gt;0.15&lt;/code&gt;, &lt;code&gt;0.3&lt;/code&gt;. Недостаток в том, что при уменьшении этого значения растет write amplification компактификации.&lt;/p&gt;\n&lt;h4 id=\"chto-delat,-esli-posle-vklyucheniya-hankov-silno-vyros-chunk-count\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/hunks-guide.html#chto-delat,-esli-posle-vklyucheniya-hankov-silno-vyros-chunk-count\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что делать, если после включения ханков сильно вырос chunk count?&lt;/span&gt;&lt;/a&gt;Что делать, если после включения ханков сильно вырос chunk count?&lt;/h4&gt;\n&lt;p&gt;Много маленьких чанков может порождаться при флаше dynamic store на диск. Тут может помочь тюнинг атрибута таблицы &lt;code&gt;@max_hunk_compaction_size&lt;/code&gt;. Ко всем ханковым чанкам, размер которых меньше этого значения, будет применена компактификация. По умолчанию равен &lt;code&gt;8MB&lt;/code&gt;. На некоторых таблицах в зависимости от нагрузки может быть полезно выставить в &lt;code&gt;16MB&lt;/code&gt;, &lt;code&gt;32MB&lt;/code&gt;. Недостаток в том, что при увеличении этого значения растет write amplification компактификации.&lt;/p&gt;\n&lt;h4 id=\"kak-uznat-realnuyu-dolyu-disk-space,-kotoraya-zanyata-musorom-v-hankovyh-chankah\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/hunks-guide.html#kak-uznat-realnuyu-dolyu-disk-space,-kotoraya-zanyata-musorom-v-hankovyh-chankah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как узнать реальную долю disk space, которая занята мусором в ханковых чанках?&lt;/span&gt;&lt;/a&gt;Как узнать реальную долю disk space, которая занята мусором в ханковых чанках?&lt;/h4&gt;\n&lt;p&gt;Можно прочитать атрибут таблицы &lt;code&gt;@hunk_statistics&lt;/code&gt; и сравнить значения в полях &lt;code&gt;total_hunk_length&lt;/code&gt; и &lt;code&gt;total_referenced_hunk_length&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Запрос атрибута &lt;code&gt;@hunk_statistics&lt;/code&gt; является достаточно тяжёлым для вычисления. Его можно читать нечасто и только в ручном режиме.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kak-primenit-versioned-remote-copy-k-tablice,-soderzhashej-hankovye-chanki\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/hunks-guide.html#kak-primenit-versioned-remote-copy-k-tablice,-soderzhashej-hankovye-chanki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как применить versioned remote copy к таблице, содержащей ханковые чанки?&lt;/span&gt;&lt;/a&gt;Как применить versioned remote copy к таблице, содержащей ханковые чанки?&lt;/h4&gt;\n&lt;p&gt;Применение versioned remote copy к таблицам, содержащим ханковые чанки, доступно начиная с версии 25.1. До этой версии для использования versioned remote copy необходимо сначала избавиться от ханковых чанков в таблице:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Заменяем значения &lt;code&gt;max_inline_hunk_size&lt;/code&gt; в схеме на 9223372036854775807 (I64_MAX).&lt;/li&gt;\n&lt;li&gt;Запускаем forced compaction на таблице (если таблица большая, то потаблетно).&lt;/li&gt;\n&lt;li&gt;Убеждаемся, что ханковых чанков не осталось: например, с помощью чтения атрибута таблицы &lt;code&gt;@chunk_format_statistics&lt;/code&gt; проверяем, что не осталось чанков типа &lt;code&gt;hunk_default&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/dynamic-tables/hunks-guide.md","sourcePath":"ru/user-guide/dynamic-tables/hunks-guide.md"},"headings":[{"title":"Вступление","href":"ru/user-guide/dynamic-tables/hunks-guide.html#vstuplenie","level":2},{"title":"Когда стоит использовать ханки","href":"ru/user-guide/dynamic-tables/hunks-guide.html#kogda-stoit-ispolzovat-hanki","level":2},{"title":"Включение ханков","href":"ru/user-guide/dynamic-tables/hunks-guide.html#vklyuchenie-hankov","level":2},{"title":"Сценарии использования","href":"ru/user-guide/dynamic-tables/hunks-guide.html#use-scenarios","level":2},{"title":"Дальнейшие оптимизации","href":"ru/user-guide/dynamic-tables/hunks-guide.html#optimization","level":2},{"title":"Диагностика","href":"ru/user-guide/dynamic-tables/hunks-guide.html#diagnostika","level":2},{"title":"FAQ","href":"ru/user-guide/dynamic-tables/hunks-guide.html#faq","level":2}],"title":"Ханки и их использование в динамических таблицах"},"router":{"pathname":"ru/user-guide/dynamic-tables/hunks-guide","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
