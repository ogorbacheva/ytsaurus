        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В сортированных динамических таблицах для каждого значения колонки хранится timestamp его записи. Эти временные метки могут быть полезны для реализации пользовательской логики, либо же миграций данных, когда необходимо сохранить оригинальные timestamp-ы для правильной работы очистки данных по TTL.&lt;/p&gt;\n&lt;p&gt;Версионированный формат взаимодействия не несет практически никаких накладных расходов, кроме случаев, когда сама колонка не запрошена, а её timestamp запрошен, в таком случае будут прочитаны данные самой колонки.&lt;/p&gt;\n&lt;p&gt;Для всех последующих видов взаимодействия предполагается, что timestamp колонки &lt;code&gt;value&lt;/code&gt; обозначается, как &lt;code&gt;$timestamp:value&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"versionirovannyj-lookup-i-select\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/versioned-format.html#versionirovannyj-lookup-i-select\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Версионированный lookup и select&lt;/span&gt;&lt;/a&gt;Версионированный lookup и select&lt;/h2&gt;\n&lt;p&gt;Версионированные lookup и select поддержаны в C++ и Python API. Для добавления колонок с timestamps в вывод необходимо указать &lt;code&gt;versioned_read_options = {read_mode = latest_timestamp}&lt;/code&gt;.&lt;br /&gt;\nВ select-запросах необходимо дополнительно экранировать timestamp колонки квадратными скобками &lt;code&gt;[$timestamp:value]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В Python API вместо &lt;code&gt;versioned_read_options&lt;/code&gt;, можно указать опцию &lt;code&gt;with_timestamps&lt;/code&gt;&lt;/p&gt;\n&lt;h3 id=\"primery\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/versioned-format.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h3&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;yt.lookup_rows(&lt;span class=\"hljs-string\"&gt;\"//path/to/table\"&lt;/span&gt;, [{&lt;span class=\"hljs-string\"&gt;\"key\"&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;123&lt;/span&gt;}], with_timestamps=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n\n&lt;span class=\"hljs-comment\"&gt;# Прочитать все колонки и их timestamp-ы.&lt;/span&gt;\nyt.select_rows(&lt;span class=\"hljs-string\"&gt;\"* from [//path/to/table]\"&lt;/span&gt;, with_timestamps=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n\n&lt;span class=\"hljs-comment\"&gt;# Прочитать отдельные колонки и timestamp-ы.&lt;/span&gt;\nyt.select_rows(&lt;span class=\"hljs-string\"&gt;\"col_a, [$timestamp:col_a] as ts_a, [$timestamp:col_b] as ts_b from [//path/to/table]\"&lt;/span&gt;, with_timestamps=&lt;span class=\"hljs-literal\"&gt;True&lt;/span&gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"21\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-21\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-21\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-21.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"versionirovannyj-map-reduce\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/versioned-format.html#versionirovannyj-map-reduce\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Версионированный map-reduce&lt;/span&gt;&lt;/a&gt;Версионированный map-reduce&lt;/h2&gt;\n&lt;h3 id=\"chtenie\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/versioned-format.html#chtenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чтение&lt;/span&gt;&lt;/a&gt;Чтение&lt;/h3&gt;\n&lt;p&gt;Для чтения timestamp-колонок в map-reduce операциях необходимо добавить опцию в &lt;a href=\"user-guide/storage/ypath#rich_ypath\"&gt;rich YPath&lt;/a&gt; входной таблицы: &lt;code&gt;&amp;lt;versioned_read_options = {read_mode = latest_timestamp}&amp;gt;&lt;/code&gt;&lt;/p&gt;\n&lt;h3 id=\"zapis\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/versioned-format.html#zapis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запись&lt;/span&gt;&lt;/a&gt;Запись&lt;/h3&gt;\n&lt;p&gt;Для записи данных в map-reduce операциях в версионированном формате необходимо добавить в &lt;a href=\"user-guide/storage/ypath#rich_ypath\"&gt;rich YPath&lt;/a&gt; выходной таблицы &lt;code&gt;&amp;lt;versioned_write_options = {read_mode = latest_timestamp}&amp;gt;&lt;/code&gt;. Для колонок, для которых указан timestamp будет записан он, для остальных будет взят commit timestamp транзакции bulk insert.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Версионированный формат записи имеет несколько ограничений:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Запись не поддержана в sort операции.&lt;/li&gt;\n&lt;li&gt;Во время записи не происходит проверка на возможное дублирование timestamp-ов у разных записей одной колонки по одному ключу.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/dynamic-tables/versioned-format.md","sourcePath":"ru/user-guide/dynamic-tables/versioned-format.md"},"headings":[{"title":"Версионированный lookup и select","href":"ru/user-guide/dynamic-tables/versioned-format.html#versionirovannyj-lookup-i-select","level":2,"items":[{"title":"Примеры","href":"ru/user-guide/dynamic-tables/versioned-format.html#primery","level":3}]},{"title":"Версионированный map-reduce","href":"ru/user-guide/dynamic-tables/versioned-format.html#versionirovannyj-map-reduce","level":2,"items":[{"title":"Чтение","href":"ru/user-guide/dynamic-tables/versioned-format.html#chtenie","level":3},{"title":"Запись","href":"ru/user-guide/dynamic-tables/versioned-format.html#zapis","level":3}]}],"title":"Версионированный формат взаимодействия с динамическими таблицами"},"router":{"pathname":"ru/user-guide/dynamic-tables/versioned-format","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
