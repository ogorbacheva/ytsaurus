        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"tablets\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/concepts.html#tablets\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таблеты&lt;/span&gt;&lt;/a&gt;Таблеты&lt;/h2&gt;\n&lt;p&gt;Для каждой таблицы пространство ключей делится набором граничных ключей на непересекающиеся диапазоны — таблеты. Таблеты таблицы перечислены в атрибуте &lt;code&gt;tablets&lt;/code&gt;. Каждый таблет описывается структурой &lt;code&gt;TabletInfo&lt;/code&gt;:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Имя&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Обязательный&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;tablet_id&lt;/td&gt;\n&lt;td&gt;Guid&lt;/td&gt;\n&lt;td&gt;Id таблета&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;statistics&lt;/td&gt;\n&lt;td&gt;TabletStatistics&lt;/td&gt;\n&lt;td&gt;Статистика по таблету&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;state&lt;/td&gt;\n&lt;td&gt;String&lt;/td&gt;\n&lt;td&gt;Состояние (mounted/unmounted/frozen/mounting/unmounting/freezing/unfreezing/frozen_mounting)&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;pivot_key&lt;/td&gt;\n&lt;td&gt;List&lt;/td&gt;\n&lt;td&gt;Граничный ключ, с которого начинается таблет (только для сортированных таблиц)&lt;/td&gt;\n&lt;td&gt;Да&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;cell_id&lt;/td&gt;\n&lt;td&gt;Guid&lt;/td&gt;\n&lt;td&gt;ID селла, к которому примонтирован таблет&lt;/td&gt;\n&lt;td&gt;Нет&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Пример статистики по таблету&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"chunk_count\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"compressed_data_size\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;324&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"disk_space\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;2502&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"disk_space_per_medium\"&lt;/span&gt; = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-string\"&gt;\"default\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;2502&lt;/span&gt;;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"dynamic_memory_pool_size\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"hunk_compressed_data_size\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"hunk_uncompressed_data_size\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"memory_size\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"overlapping_store_count\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"partition_count\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"preload_completed_store_count\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"preload_failed_store_count\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"preload_pending_store_count\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"store_count\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"tablet_count\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"tablet_count_per_memory_mode\"&lt;/span&gt; = &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n        &lt;span class=\"hljs-string\"&gt;\"none\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"compressed\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n        &lt;span class=\"hljs-string\"&gt;\"uncompressed\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"uncompressed_data_size\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;538&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"unmerged_row_count\"&lt;/span&gt; = &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"101\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-101\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-101\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-101.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Каждый таблет логически состоит из набора отсортированных чанков с данными и специальной области в памяти, называемой &lt;code&gt;dynamic store&lt;/code&gt;. Чанки хранятся реплицированным образом в &lt;i class=\"yfm yfm-term_title\" term-key=\":blob-storage\" role=\"button\" aria-describedby=\":blob-storage_element\" tabindex=\"0\" id=\"r0jckx1v\"&gt;blob-хранилище&lt;/i&gt; и пересекаются по диапазонам ключей.  При записи данные попадают в &lt;code&gt;dynamic store&lt;/code&gt; и накапливаются в нём. При достижении заданных в конфигурации размеров данные записываются на диск в виде чанка. Когда чанков в пределах таблетов становится достаточно много, часть из них объединяется — происходит компактификация. В этот момент может происходить удаление старых и неактуальных данных. Подробнее можно прочитать в разделе &lt;a href=\"user-guide/dynamic-tables/compaction.html\"&gt;Компактификация&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Список всех таблетов всех динамических таблиц системы доступен по пути &lt;code&gt;//sys/tablets&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"keys\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/concepts.html#keys\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Граничные ключи&lt;/span&gt;&lt;/a&gt;Граничные ключи&lt;/h2&gt;\n&lt;p&gt;Для изменения набора таблетов таблицы используется команда &lt;code&gt;reshard_table&lt;/code&gt;. При изменении числа таблетов сортированных динамических таблиц необходимо указывать граничные ключи. Граничные ключи таблетов представляют собой произвольные последовательности значений, не обязательно совпадающие по длине с ключевыми колонками.&lt;/p&gt;\n&lt;p&gt;В качестве одного из вариантов можно взять хеш некоторых последующих компонент ключа, чтобы равномерно распределить данные по пространству ключей. Тогда в качестве граничных ключей можно взять последовательности длины 1, состоящие из чисел, равномерно разбивающих весь интервал значений хеш-функции.&lt;/p&gt;\n&lt;p&gt;Граничный ключ первого таблета таблицы всегда равен пустой последовательности — эффективная минус бесконечность — и не может быть изменен.&lt;/p&gt;\n&lt;h2 id=\"partitions\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/concepts.html#partitions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Партиции&lt;/span&gt;&lt;/a&gt;Партиции&lt;/h2&gt;\n&lt;p&gt;Таблеты в динамических таблицах делятся на партиции для обеспечения параллельности обработки запросов внутри узла кластера. Типичный размер партиции составляет несколько сотен мегабайт. В том случае, если чанки становятся больше, чем размер партиции, запускается фоновый процесс, принудительно разбивающий чанки на более мелкие.&lt;/p&gt;\n&lt;h2 id=\"tablet_cells\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/concepts.html#tablet_cells\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таблет-селлы&lt;/span&gt;&lt;/a&gt;Таблет-селлы&lt;/h2&gt;\n&lt;p&gt;Обслуживание таблетов производится сущностями, называемыми таблет-селлами. Каждый селл — сложный автомат, состояние которого реплицируется с помощью подсистемы &lt;code&gt;Hydra&lt;/code&gt;. На каждом узле кластера имеются так называемые таблет-слоты — виртуальные позиции, на которые могут попадать селлы.&lt;/p&gt;\n&lt;p&gt;Селлы в кластере создаются администратором при первичной настройке. Суммарное количество селлов должно быть близко к общему числу таблет-слотов на узлах кластера, но с определённым запасом для того, чтобы учесть возможность выхода из строя некоторого числа узлов кластера.&lt;/p&gt;\n&lt;p&gt;Каждый таблет-селл принадлежит некоторому бандлу. Имя бандла, в котором создается селл, указано в атрибуте &lt;code&gt;tablet_cell_bundle&lt;/code&gt; конкретной таблицы или одной из родительских директорий. По умолчанию таблет-селлы создаются в бандле &lt;code&gt;default&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Список всех селлов доступен по пути &lt;code&gt;//sys/tablet_cells&lt;/code&gt;. Каждый селл ведет журналы изменений (мутаций), а также периодически записывает снапшоты состояния. Журналы попадают в директорию &lt;code&gt;//sys/tablet_cells/&amp;lt;cell_id&amp;gt;/changelogs&lt;/code&gt;, а снапшоты — в директорию &lt;code&gt;//sys/tablet_cells/&amp;lt;cell_id&amp;gt;/snapshots&lt;/code&gt; в виде файлов.&lt;/p&gt;\n&lt;p&gt;Выбор конкретного узла кластера и свободного таблет-слота на этом узле для обслуживания таблет-селла производится мастер-сервером автоматически. Если узел кластера, обслуживающий селл, выходит из строя, через некоторое время мастер-сервер выберет свободный слот на другом узле и запустит селл на нём.&lt;/p&gt;\n&lt;p&gt;Таблет-селлы обладают атрибутами, представленными в таблице:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Имя&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;id&lt;/td&gt;\n&lt;td&gt;Guid&lt;/td&gt;\n&lt;td&gt;Id селла.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;peers&lt;/td&gt;\n&lt;td&gt;Dict&lt;/td&gt;\n&lt;td&gt;Словарь, содержащий имя узла кластера, обслуживающего селл, а также статус селла.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tablet_cell_bundle&lt;/td&gt;\n&lt;td&gt;String&lt;/td&gt;\n&lt;td&gt;Имя таблет-селл бандла, которому принадлежит селл.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;status&lt;/td&gt;\n&lt;td&gt;Dict&lt;/td&gt;\n&lt;td&gt;Состояние селла, флаг декомиссии.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;total_statistics&lt;/td&gt;\n&lt;td&gt;Dict&lt;/td&gt;\n&lt;td&gt;Различные статистики по таблет-селлу.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Пример состояния селла&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-string\"&gt;\"health\"&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"good\"&lt;/span&gt;;\n    &lt;span class=\"hljs-string\"&gt;\"decommissioned\"&lt;/span&gt; = %&lt;span class=\"hljs-literal\"&gt;&lt;span class=\"hljs-keyword\"&gt;false&lt;/span&gt;&lt;/span&gt;;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"226\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-226\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-226\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-226.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tablet_cell_bundles\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/concepts.html#tablet_cell_bundles\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таблет-селл бандлы&lt;/span&gt;&lt;/a&gt;Таблет-селл бандлы&lt;/h2&gt;\n&lt;p&gt;Как правило, селлы создаются группами, имеющими одинаковые настройки. Бандлы необходимы, чтобы объединять селлы по общности настроек. В текущей реализации бандлы представляют собой единственный надежный способ изоляции нагрузки при условии, что бандлы правильным образом разнесены по узлам кластера.&lt;/p&gt;\n&lt;p&gt;Бандлы идентифицируются строковыми именами. Множество имеющихся в системе бандлов доступно по пути &lt;code&gt;//sys/tablet_cell_bundles&lt;/code&gt;. В системе всегда существует встроенный и неудаляемый бандл с именем &lt;code&gt;default&lt;/code&gt;. Настройки бандла указываются в атрибуте &lt;code&gt;options&lt;/code&gt; при создании, а также могут быть изменены позднее. Изменение настроек в атрибуте &lt;code&gt;options&lt;/code&gt; требует отмонтирования всех таблиц бандла и повторного создания всех селлов.&lt;/p&gt;\n&lt;p&gt;У каждой таблицы, в том числе статической, есть атрибут &lt;code&gt;tablet_cell_bundle&lt;/code&gt;, где хранится имя бандла, в селлы которого будет смонтирована данная таблица. Подробнее о монтировании можно прочитать в разделе &lt;a href=\"user-guide/dynamic-tables/operations.html#mount_table\"&gt;Монтирование&lt;/a&gt; таблиц.&lt;/p&gt;\n&lt;p&gt;У каждого бандла есть атрибут &lt;code&gt;node_tag_filter&lt;/code&gt;, который используется для выбора узлов кластера под таблет-селлы из данного бандла. Фильтр представляет собой логическое выражение с операторами &lt;code&gt;&amp;amp;&lt;/code&gt; — логическое \"и\", &lt;code&gt;|&lt;/code&gt; — логическое \"или\", &lt;code&gt;!&lt;/code&gt; — логическое \"не\" и круглыми скобками.&lt;br /&gt;\nНапример, &lt;code&gt;foo | (bar &amp;amp; !baz)&lt;/code&gt;.&lt;br /&gt;\nПеременными в выражении являются возможные значения тегов. Если у узла кластера есть указанный тег, то переменная в формуле принимает значение &lt;code&gt;истина&lt;/code&gt;, если нет — &lt;code&gt;ложь&lt;/code&gt;. Таблет-селлы будут попадать только на те узлы кластера, для которых выражение целиком принимает значение &lt;code&gt;истина&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Таблет-селл бандлы обладают атрибутами, представленными в таблице:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Имя&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;name&lt;/td&gt;\n&lt;td&gt;String&lt;/td&gt;\n&lt;td&gt;Имя бандла.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;options&lt;/td&gt;\n&lt;td&gt;TabletCellOptions&lt;/td&gt;\n&lt;td&gt;Настройки всех таблетов данного бандла.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tablet_cell_count&lt;/td&gt;\n&lt;td&gt;Int&lt;/td&gt;\n&lt;td&gt;Число селлов в бандле.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;tablet_cell_ids&lt;i class=\"yfm yfm-term_title\" term-key=\":*\" role=\"button\" aria-describedby=\":*_element\" tabindex=\"0\" id=\"b41ld5m4\"&gt;*&lt;/i&gt;&lt;/td&gt;\n&lt;td&gt;Guid&lt;/td&gt;\n&lt;td&gt;Идентификаторы селлов в бандле.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Состояние бандла, состояние таблет-селлов и список узлов кластера, входящих в бандл отображается на вкладке Tablet cells.&lt;/p&gt;\n&lt;dfn class=\"yfm yfm-term_dfn\" id=\":*_element\" role=\"dialog\"&gt;&lt;p&gt;Параметр встречается в ответе несколько раз.&lt;/p&gt;\n&lt;dfn class=\"yfm yfm-term_dfn\" id=\":blob-storage_element\" role=\"dialog\"&gt;&lt;p&gt;Хранилище больших объёмов неструктурированных данных.&lt;/p&gt;\n&lt;/dfn&gt;&lt;/dfn&gt;","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/dynamic-tables/concepts.md","sourcePath":"ru/user-guide/dynamic-tables/concepts.md"},"headings":[{"title":"Таблеты","href":"ru/user-guide/dynamic-tables/concepts.html#tablets","level":2},{"title":"Граничные ключи","href":"ru/user-guide/dynamic-tables/concepts.html#keys","level":2},{"title":"Партиции","href":"ru/user-guide/dynamic-tables/concepts.html#partitions","level":2},{"title":"Таблет-селлы","href":"ru/user-guide/dynamic-tables/concepts.html#tablet_cells","level":2},{"title":"Таблет-селл бандлы","href":"ru/user-guide/dynamic-tables/concepts.html#tablet_cell_bundles","level":2}],"title":"Основные понятия"},"router":{"pathname":"ru/user-guide/dynamic-tables/concepts","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
