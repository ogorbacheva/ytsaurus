te&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt create table &lt;span class=\"hljs-string\"&gt;'//tmp/test'&lt;/span&gt; --attributes &lt;span class=\"hljs-string\"&gt;'{dynamic=true; schema=&amp;lt;\"unique_keys\"=%true;\"strict\"=%true;&amp;gt;[{name=a;sort_order=ascending;type=int64;};{name=b;type_v3={type_name=struct;members=[{name=c;type={type_name=list;item=int64}}]}}]}'&lt;/span&gt;\n$ yt mount-table --path &lt;span class=\"hljs-string\"&gt;'//tmp/test'&lt;/span&gt;\n$ &lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'{a=0;b={c=[]}}'&lt;/span&gt; | yt insert-rows --table &lt;span class=\"hljs-string\"&gt;'//tmp/test'&lt;/span&gt; --format yson\n$ &lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'{a=1;b={c=[1;2;3]}}'&lt;/span&gt; | yt insert-rows --table &lt;span class=\"hljs-string\"&gt;'//tmp/test'&lt;/span&gt; --format yson\n$ &lt;span class=\"hljs-built_in\"&gt;echo&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'{a=2;b={c=[4]}}'&lt;/span&gt; | yt insert-rows --table &lt;span class=\"hljs-string\"&gt;'//tmp/test'&lt;/span&gt; --format yson\n\n$ yt select-rows &lt;span class=\"hljs-string\"&gt;'t.b.c from `//tmp/test` as t'&lt;/span&gt; --syntax-version 2 --format json\n{&lt;span class=\"hljs-string\"&gt;\"t.b.c\"&lt;/span&gt;:[]}\n{&lt;span class=\"hljs-string\"&gt;\"t.b.c\"&lt;/span&gt;:[1,2,3]}\n{&lt;span class=\"hljs-string\"&gt;\"t.b.c\"&lt;/span&gt;:[4]}\n\n$ yt select-rows &lt;span class=\"hljs-string\"&gt;'t.b.c[0] from `//tmp/test` as t'&lt;/span&gt; --syntax-version 2 --format json\n{&lt;span class=\"hljs-string\"&gt;\"t.b.c[0]\"&lt;/span&gt;:null}\n{&lt;span class=\"hljs-string\"&gt;\"t.b.c[0]\"&lt;/span&gt;:1}\n{&lt;span class=\"hljs-string\"&gt;\"t.b.c[0]\"&lt;/span&gt;:4}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"520\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-520\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-520\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-520.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"rabota-s-yson\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#rabota-s-yson\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с YSON&lt;/span&gt;&lt;/a&gt;Работа с &lt;a href=\"user-guide/storage/formats.html#yson\"&gt;YSON&lt;/a&gt;&lt;/h4&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Фиксированный порядок ключей в словарях не гарантируется, поэтому сравнения и группировки могут себя вести не так, как ожидается.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h5 id=\"izvlechenie-dannyh\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#izvlechenie-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Извлечение данных&lt;/span&gt;&lt;/a&gt;Извлечение данных&lt;/h5&gt;\n&lt;p&gt;Существует набор функций для извлечения данных:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;try_get_int64&lt;/code&gt;, &lt;code&gt;get_int64&lt;/code&gt;, &lt;code&gt;try_get_uint64&lt;/code&gt;, &lt;code&gt;get_uint64&lt;/code&gt;, &lt;code&gt;try_get_double&lt;/code&gt;, &lt;code&gt;get_double&lt;/code&gt;, &lt;code&gt;try_get_boolean&lt;/code&gt;, &lt;code&gt;get_boolean&lt;/code&gt;, &lt;code&gt;try_get_string&lt;/code&gt;, &lt;code&gt;get_string&lt;/code&gt;, &lt;code&gt;try_get_any&lt;/code&gt;, &lt;code&gt;get_any&lt;/code&gt;&lt;br /&gt;\nФункции принимают два аргумента: &lt;code&gt;(yson, path)&lt;/code&gt;, где:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;yson&lt;/code&gt; — значение типа &lt;code&gt;any&lt;/code&gt;, содержащее YSON;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;path&lt;/code&gt; — строка, содержащая путь до нужного поля в формате &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPATH&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Версия с префиксом &lt;code&gt;try_&lt;/code&gt; в случае отсутствия поля нужного типа по заданному пути возвращает &lt;code&gt;NULL&lt;/code&gt;. Версия без &lt;code&gt;try_&lt;/code&gt; возвращает ошибку при отсутствии поля.&lt;/p&gt;\n&lt;p&gt;Пример: для строки таблицы &lt;code&gt;{column=&amp;lt;attr=4&amp;gt;{key3=2;k={k2=&amp;lt;b=7&amp;gt;3;k3=10};lst=&amp;lt;a=[1;{a=3};{b=7u}]&amp;gt;[0;1;&amp;lt;a={b=4}&amp;gt;2]}}&lt;/code&gt; &lt;code&gt;try_get_uint64(column, \"/lst/@a/2/b\")&lt;/code&gt; вернёт значение &lt;code&gt;7u&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;list_contains(list, value) :: any -&amp;gt; (string | int64 | uint64 | boolean) -&amp;gt; boolean&lt;/code&gt;&lt;br /&gt;\nИщет &lt;code&gt;value&lt;/code&gt; в YSON-списке &lt;code&gt;list&lt;/code&gt;, имеющем тип &lt;code&gt;any&lt;/code&gt;. Значение &lt;code&gt;value&lt;/code&gt; скалярного типа. Список не обязан быть гомогенным (т. е. может содержать значения разных типов), сравнение выполняется с учётом типа.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;list_has_intersection(list, list) :: any -&amp;gt; any -&amp;gt; boolean&lt;/code&gt;&lt;br /&gt;\nПринимает на вход два YSON-списка и возвращает &lt;code&gt;true&lt;/code&gt;, если они имеют хотя бы один общий элемент.&lt;br /&gt;\nСписки обязаны быть гомогенными.&lt;br /&gt;\nФункция поддерживается на кластерах версии 24.2 или выше.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;any_to_yson_string(yson) :: any -&amp;gt; string&lt;/code&gt;&lt;br /&gt;\nПреобразует значение типа &lt;code&gt;any&lt;/code&gt; в строку, содержащую его text-&lt;a href=\"user-guide/storage/yson.html\"&gt;YSON&lt;/a&gt; представление.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;yson_length(yson) :: any -&amp;gt; int64&lt;/code&gt;&lt;br /&gt;\nВычисляет количество элементов в списке или словаре.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h5 id=\"formirovanie-yson\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#formirovanie-yson\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Формирование YSON&lt;/span&gt;&lt;/a&gt;Формирование YSON&lt;/h5&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;make_entity()&lt;/code&gt;. Пример: &lt;code&gt;make_entity() -&amp;gt; #&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;make_map(args...)&lt;/code&gt;. Пример: &lt;code&gt;make_map(\"a\", 1, \"b\", 2) -&amp;gt; {a=1;b=2}&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;make_list(args...)&lt;/code&gt;. Пример: &lt;code&gt;make_list(\"a\", 1, 2, 3) -&amp;gt; [a;1;2;3]&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"rabota-s-regulyarnymi-vyrazheniyami\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#rabota-s-regulyarnymi-vyrazheniyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с регулярными выражениями&lt;/span&gt;&lt;/a&gt;Работа с регулярными выражениями&lt;/h4&gt;\n&lt;p&gt;Для работы с регулярными выражениями используется библиотека &lt;a href=\"https://github.com/google/re2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Google RE2&lt;/a&gt;. Библиотека работает в режиме UTF-8. Синтаксис регулярных выражений описан на отдельной &lt;a href=\"https://github.com/google/re2/wiki/Syntax\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;странице&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;regex_full_match(p, s) :: string -&amp;gt; string -&amp;gt; boolean&lt;/code&gt;&lt;br /&gt;\nПроверяет, что строка &lt;code&gt;s&lt;/code&gt; целиком соответствует регулярному выражению &lt;code&gt;p&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;regex_partial_match(p, s) :: string -&amp;gt; string -&amp;gt; boolean&lt;/code&gt;&lt;br /&gt;\nПроверяет, что в строке &lt;code&gt;s&lt;/code&gt; встречается подстрока, соответствующая регулярному выражению &lt;code&gt;p&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;regex_replace_first(p, s, r) :: string -&amp;gt; string -&amp;gt; string -&amp;gt; string&lt;/code&gt;&lt;br /&gt;\nЗаменяет первое вхождение регулярного выражения &lt;code&gt;p&lt;/code&gt; в строке &lt;code&gt;s&lt;/code&gt; на строку &lt;code&gt;r&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;regex_replace_all(p, s, r) :: string -&amp;gt; string -&amp;gt; string -&amp;gt; string&lt;/code&gt;&lt;br /&gt;\nЗаменяет все вхождения регулярного выражения &lt;code&gt;p&lt;/code&gt; в строке &lt;code&gt;s&lt;/code&gt; на строку &lt;code&gt;r&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;regex_extract(p, s, r) :: string -&amp;gt; string -&amp;gt; string -&amp;gt; string&lt;/code&gt;&lt;br /&gt;\nПозволяет извлекать из строки &lt;code&gt;s&lt;/code&gt; подстроки, соответствующие регулярному выражению &lt;code&gt;s&lt;/code&gt;, проводя замену &lt;code&gt;r&lt;/code&gt;.&lt;br /&gt;\nНапример, результатом выражения &lt;code&gt;regex_extract(\"([a-z]*)@(.*)\", \"email foo@bar.com\", \"\\\\1 at \\\\2\")&lt;/code&gt; будет &lt;code&gt;foo at bar.com&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;regex_escape(p) :: string -&amp;gt; string&lt;/code&gt;&lt;br /&gt;\nЭкранирует в строке &lt;code&gt;p&lt;/code&gt; специальные символы языка регулярных выражений.&lt;/p&gt;\n&lt;h5 id=\"operator-like\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#operator-like\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оператор LIKE&lt;/span&gt;&lt;/a&gt;Оператор LIKE&lt;/h5&gt;\n&lt;p&gt;Оператор можно использовать следующим образом:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;string&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;not&lt;/span&gt;] &lt;span class=\"hljs-keyword\"&gt;like&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;pattern&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;escape&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;escape&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;symbol&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"635\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-635\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-635\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-635.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Оператор проверяет, соответствует ли строка &lt;code&gt;string&lt;/code&gt; заданному шаблону &lt;code&gt;pattern&lt;/code&gt;.&lt;br /&gt;\nПодчёркивание (&lt;code&gt;_&lt;/code&gt;) в шаблоне соответствует любому символу.&lt;br /&gt;\nЗнак процента (&lt;code&gt;%&lt;/code&gt;) соответствует любой последовательности символов (в том числе пустой последовательности).&lt;br /&gt;\nДля того, чтобы буквально использовать &lt;code&gt;_&lt;/code&gt; или &lt;code&gt;%&lt;/code&gt; в шаблоне, их необходимо экранировать при помощи символа &lt;code&gt;escape-symbol&lt;/code&gt; (по умолчанию используется &lt;code&gt;\\&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Если в запросе происходит фильтрация по префиксу строки первичного ключа, то для работы вывода диапазонов следует использовать &lt;code&gt;is_prefix&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Конструкция &lt;code&gt;ilike&lt;/code&gt; используется для case insensitive поиска: &lt;code&gt;'Abc' ilike 'abc'&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В конструкциях &lt;code&gt;rlike&lt;/code&gt; и &lt;code&gt;regex&lt;/code&gt; шаблон &lt;code&gt;pattern&lt;/code&gt; задаётся в &lt;a href=\"https://github.com/google/re2/wiki/Syntax\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;синтаксисе re2&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Пример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-string\"&gt;'abcdef'&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;like&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'a_c_%f'&lt;/span&gt;\n&lt;span class=\"hljs-string\"&gt;'q'&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;not&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;like&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'x_'&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;escape&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'x'&lt;/span&gt;\n&lt;span class=\"hljs-string\"&gt;'Abc'&lt;/span&gt; ilike &lt;span class=\"hljs-string\"&gt;'abc'&lt;/span&gt;\n&lt;span class=\"hljs-string\"&gt;'a b'&lt;/span&gt; rlike &lt;span class=\"hljs-string\"&gt;'\\\\w+ b'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"651\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-651\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-651\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-651.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"rabota-s-datami\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#rabota-s-datami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа с датами&lt;/span&gt;&lt;/a&gt;Работа с датами&lt;/h4&gt;\n&lt;p&gt;При округлении используется UTC-таймзона&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;timestamp_floor_year(t) :: int64 -&amp;gt; int64&lt;/code&gt;&lt;br /&gt;\nПолучить timestamp года (на 0:00 первого января) для указанного timestamp.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;timestamp_floor_month(t) :: int64 -&amp;gt; int64&lt;/code&gt;&lt;br /&gt;\nПолучить timestamp месяца (на 0:00 первого дня месяца) для указанного timestamp.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;timestamp_floor_week(t) :: int64 -&amp;gt; int64&lt;/code&gt;&lt;br /&gt;\nПолучить timestamp недели (на 0:00 понедельника) для указанного timestamp.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;timestamp_floor_day(t) :: int64 -&amp;gt; int64&lt;/code&gt;&lt;br /&gt;\nПолучить timestamp дня (на 0:00 начала дня) для указанного timestamp.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;timestamp_floor_hour(t) :: int64 -&amp;gt; int64&lt;/code&gt;&lt;br /&gt;\nПолучить timestamp часа (0 мин. 0 секунд начала часа) для указанного timestamp.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;format_timestamp(t, format) :: int64 -&amp;gt; string -&amp;gt; string&lt;/code&gt;&lt;br /&gt;\nФорматирует время, указанное в timestamp, согласно строке format. Использует ту же конвенцию, что и &lt;code&gt;std::strftime&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"heshirovanie\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#heshirovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Хеширование&lt;/span&gt;&lt;/a&gt;Хеширование&lt;/h4&gt;\n&lt;p&gt;&lt;code&gt;farm_hash(a1, a2, ...) :: (int64 | uint64 | boolean | string)* -&amp;gt; uint64&lt;/code&gt;&lt;br /&gt;\nВычисляет &lt;a href=\"https://code.google.com/p/farmhash/\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;FarmHash&lt;/a&gt; от заданного набора аргументов.&lt;/p&gt;\n&lt;h4 id=\"privedenie-tipov\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#privedenie-tipov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Приведение типов&lt;/span&gt;&lt;/a&gt;Приведение типов&lt;/h4&gt;\n&lt;p&gt;&lt;code&gt;int64(x) :: any | int64 | uint64 | double -&amp;gt; int64&lt;/code&gt;&lt;br /&gt;\n&lt;code&gt;uint64(x) :: any | int64 | uint64 | double -&amp;gt; uint64&lt;/code&gt;&lt;br /&gt;\n&lt;code&gt;double(x) :: any | int64 | uint64 | double -&amp;gt; double&lt;/code&gt;&lt;br /&gt;\n&lt;code&gt;boolean(x) :: any -&amp;gt; boolean&lt;/code&gt;&lt;br /&gt;\n&lt;code&gt;string(x) :: any -&amp;gt; string&lt;/code&gt;&lt;br /&gt;\nПреобразуют численный аргумент &lt;code&gt;x&lt;/code&gt; к целевому типу. Правила округления и переполнения -- стандартные, С-подобные. Начиная с версии 25.2 при попытке привести к целочисленному типу число с плавающей точкой, выходящее за пределы допустимых значений этого целочисленного типа будет выброшена ошибка.&lt;/p&gt;\n&lt;p&gt;Для преобразования численного типа в строку есть функция:&lt;br /&gt;\n&lt;code&gt;numeric_to_string :: int64 | uint64 | double -&amp;gt; string&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Для преобразования строки в число:&lt;br /&gt;\n&lt;code&gt;parse_int64 :: string -&amp;gt; int64&lt;/code&gt;&lt;br /&gt;\n&lt;code&gt;parse_uint64 :: string -&amp;gt; uint64&lt;/code&gt;&lt;br /&gt;\n&lt;code&gt;parse_double :: string -&amp;gt; double&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Любой тип может быть приведен к &lt;code&gt;any&lt;/code&gt;:&lt;br /&gt;\n&lt;code&gt;to_any :: int64 | uint64 | double | boolean | string | any -&amp;gt; any&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;yson_string_to_any :: string -&amp;gt; any&lt;/code&gt;&lt;br /&gt;\nПроизводит парсинг, валидацию и конвертацию строкового значения в значение типа &lt;code&gt;any&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"znachenie-null\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#znachenie-null\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Значение NULL&lt;/span&gt;&lt;/a&gt;Значение NULL&lt;/h4&gt;\n&lt;p&gt;В большинстве операторов использование &lt;code&gt;NULL&lt;/code&gt; значений в операндах приводит к результату со значением &lt;code&gt;NULL&lt;/code&gt;. Операторы сравнения имеют отличное поведение. В них результат всегда имеет значение типа &lt;code&gt;boolean&lt;/code&gt;. Это требуется для того, чтобы поведение операций сравнения было одинаковым как при упорядочивании данных в таблице по ключу, так и при вычислении выражений внутри запроса. Необходимость в сравнении с &lt;code&gt;NULL&lt;/code&gt; вызвана стремлением сделать отношение порядка на ключах полным. &lt;code&gt;NULL&lt;/code&gt; считается меньшим, чем другие значения.&lt;/p&gt;\n&lt;h3 id=\"aggregation_functions\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#aggregation_functions\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Агрегирующие функции&lt;/span&gt;&lt;/a&gt;Агрегирующие функции&lt;/h3&gt;\n&lt;p&gt;В языке запросов поддерживаются следующие агрегирующие функции:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;sum(expr) :: A -&amp;gt; A&lt;/code&gt; — подсчёт суммы;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;min/max(expr) :: A -&amp;gt; A&lt;/code&gt; — подсчёт минимума или максимума;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;avg(expr) :: int64 -&amp;gt; double&lt;/code&gt; — подсчёт среднего;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;cardinality(expr) :: int64 | uint64 | double | boolean | string -&amp;gt; uint64&lt;/code&gt; — подсчёт количества различных элементов с помощью алгоритма &lt;a href=\"https://en.wikipedia.org/wiki/HyperLogLog\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;HyperLogLog&lt;/a&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;argmin/argmax(arg, expr) :: A -&amp;gt; int64 | uint64 | double | string | boolean -&amp;gt; A&lt;/code&gt; — подсчёт значения аргумента, при котором выражение достигает соответствующего экстремума;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;first(expr) :: A -&amp;gt; A&lt;/code&gt; — Первое значение среди сгруппированных. При последовательном сканировании (в случае сортировки по первичному ключу) вычисляет значение первой строки в группе. Если все агрегирующие функции в запросе — &lt;code&gt;first&lt;/code&gt;, при последовательном сканировании движок остановит исполнение, как только наберет &lt;code&gt;LIMIT&lt;/code&gt; уникальных ключей группировки. В случае запроса без последовательного сканирования &lt;code&gt;first&lt;/code&gt; возвращает значение любой подходящей строки.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;xdelta(expr) :: string -&amp;gt; string&lt;/code&gt; - Вычисление целевого значения, сохранненого как последовательность патчей, полученных дельта-кодированием по алгоритму &lt;a href=\"https://github.com/xorgy/xdelta3/blob/master/README\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;xdelta3&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"query_execution\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#query_execution\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Исполнение запроса&lt;/span&gt;&lt;/a&gt;Исполнение запроса&lt;/h2&gt;\n&lt;p&gt;&lt;img src=\"images/query_execution.png\" alt=\"\" /&gt;&lt;/p&gt;\n&lt;p&gt;Запрос исполняется на кластере распределённо. Процесс исполнения запроса условно делится на две фазы: координация и исполнение. Во время координации определяется множество узлов кластера, которые будут выполнять запрос, а во время исполнения производится непосредственно обработка данных. Типичный сценарий: запрос, заданный пользователем, распадается на множество &lt;em&gt;фрагментов исполнения&lt;/em&gt;, обрабатываемых узлами кластера; финальный результат формируется на клиенте в результате слияния промежуточных результатов, полученных с узлов кластера.&lt;/p&gt;\n&lt;p&gt;Для вывода информации о плане запроса есть команда &lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#explain_query\"&gt;&lt;code&gt;explain_query&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"koordinaciya\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#koordinaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Координация&lt;/span&gt;&lt;/a&gt;Координация&lt;/h3&gt;\n&lt;p&gt;Процесс разделения запроса на множество параллельных фрагментов исполнения с целью распределения нагрузки называется &lt;em&gt;координацией&lt;/em&gt;. Координация запроса происходит и на клиенте, и на узлах кластера. Непосредственно процесс координации состоит из следующих шагов:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Определение диапазонов исходных данных.&lt;/li&gt;\n&lt;li&gt;Разбиение запроса для независимой обработки частей входных данных.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Входные данные для запроса и варианты их разбиения определяются структурой основной таблицы, указанной в запросе, и предикатом фильтрации. В настоящее время поддержано исполнение запросов поверх &lt;strong&gt;&lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;динамических&lt;/a&gt;&lt;/strong&gt; (сортированных и упорядоченных) таблиц.&lt;/p&gt;\n&lt;p&gt;При работе с динамическими сортированными таблицами разбиение данных двухуровневое: изначально таблица разбивается на &lt;em&gt;таблеты&lt;/em&gt;, и запрос отправляется на машины, обслуживающие выбранные таблеты, а затем на каждой машине таблет разбивается далее на партиции для обеспечения параллельности исполнения внутри каждой машины. Подробнее о таблетах можно узнать в разделе &lt;a href=\"user-guide/dynamic-tables/overview.html\"&gt;Динамические таблицы&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;В процессе координации выбираются узлы кластера, содержащие необходимые для выполнения запроса данные. Исходный запрос разбивается на фрагменты выполнения и отправляется на выбранные узлы. На каждом узле выполнение запроса может быть дополнительно распараллелено, если затрагивается достаточно большое количество данных. Параллельность выполнения запроса на одном узле ограничивается параметром запроса &lt;code&gt;max_subqueries&lt;/code&gt;, а также заданным в конфигурации узла кластера количеством потоков, отведенных для выполнения запроса.&lt;/p&gt;\n&lt;p&gt;При разбиении запроса на части для параллельного исполнения вычисление предикатов (&lt;code&gt;WHERE&lt;/code&gt;), группировок (&lt;code&gt;GROUP BY&lt;/code&gt;) и сортировок (&lt;code&gt;ORDER BY&lt;/code&gt;) переносится как можно ближе к чтению данных, а на координаторе остаются лишь минимально необходимые операторы. К примеру, если в результате разбиения входных данных получилась ровно одна часть, то тогда фильтрацию и группировку целиком будет производить подчиненный узел, а координатор ничего с данными делать не будет.&lt;/p&gt;\n&lt;h3 id=\"input_data_cut\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#input_data_cut\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Отсечение входных данных&lt;/span&gt;&lt;/a&gt;Отсечение входных данных&lt;/h3&gt;\n&lt;p&gt;Во время координации происходит анализ предиката фильтрации (&lt;code&gt;WHERE&lt;/code&gt;). На основе набора ключевых колонок таблицы и условий предиката происходит вывод диапазонов чтения данных.&lt;br /&gt;\nВывод диапазонов умеет учитывать логические связки (&lt;code&gt;AND&lt;/code&gt;, &lt;code&gt;OR&lt;/code&gt;, &lt;code&gt;NOT&lt;/code&gt;), операторы сравнения, оператор &lt;code&gt;IN&lt;/code&gt;, оператор &lt;code&gt;BETWEEN&lt;/code&gt;, функцию &lt;code&gt;is_prefix&lt;/code&gt;. После вывода диапазонов часть условий из предиката может быть отброшена, если условия оказываются всегда истинными на читаемых по диапазонам данных.&lt;/p&gt;\n&lt;p&gt;Выведенные диапазоны представляют собой множество нижних и верхних границ чтения. Граница чтения является префиксом ключа основной таблицы.&lt;/p&gt;\n&lt;p&gt;В случае отсутствия вычисляемых колонок в схеме таблицы, вывод диапазонов происходит следующим способом. Рассматриваются ключевые колонки в порядке их следования в схеме до тех пор пока в предикате есть условия верхнего уровня (соединенные логическими операторами &lt;code&gt;AND&lt;/code&gt;, &lt;code&gt;OR&lt;/code&gt;, &lt;code&gt;NOT&lt;/code&gt;), ограничивающие значения этих колонок. Условия на колонку бывают точечные (оператор &lt;code&gt;=&lt;/code&gt;, оператор &lt;code&gt;IN&lt;/code&gt;) и диапазонные ( &lt;code&gt;!=&lt;/code&gt;, &lt;code&gt;&amp;lt;&lt;/code&gt;, &lt;code&gt;&amp;lt;=&lt;/code&gt;, &lt;code&gt;&amp;gt;&lt;/code&gt;, &lt;code&gt;&amp;gt;=&lt;/code&gt;, &lt;code&gt;is_prefix&lt;/code&gt;). Результирующий диапазон строится пока встречаются точечные условия и завершается на первом диапазонном условии.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Примеры:&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Пусть таблица имеет ключевые колонки: &lt;code&gt;a, b, c&lt;/code&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Для предиката &lt;code&gt;a = 1 and b in (3, 4)&lt;/code&gt; будут выведены диапазоны:\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[[1, 3] .. [1, 3]], [[1, 4] .. [1, 4]]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"814\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-814\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-814\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-814.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;Для предиката &lt;code&gt;a = 1 and b between 20 and 30 and c between 40 and 60&lt;/code&gt; будет выведен диапазон:\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[[1, 20] .. [1, 30]]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"820\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-820\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-820\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-820.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;Для предиката &lt;code&gt;a = 1 and b = 2 and c between 40 and 60&lt;/code&gt; будет выведен диапазон:\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[[1, 2, 40] .. [1, 2, 60]]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"826\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-826\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-826\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-826.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;Для предиката &lt;code&gt;a in (1, 2, 3) and b in (5, 6) and c between 40 and 60&lt;/code&gt; будут выведены диапазоны:\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[[1, 5, 40] .. [1, 5, 60]], [[1, 6, 40] .. [1, 6, 60]], [[2, 5, 40] .. [2, 5, 60]], [[2, 6, 40] .. [2, 6, 60]], [[3, 5, 40] .. [3, 5, 60]], [[3, 6, 40] .. [3, 6, 60]]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"832\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-832\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-832\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-832.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;Для предиката &lt;code&gt;a = 1 and b = 2 and c between 40 and 60 or a between 10 and 20&lt;/code&gt; будет выведен диапазон:\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[[1, 2, 40] .. [1, 2, 60]], [[10] .. [20]]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"838\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-838\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-838\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-838.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Важной особенностью выводимых диапазонов является то, что нижняя и верхняя границы имеют &lt;em&gt;общий префикс&lt;/em&gt; и отличаются только последней компонентой.&lt;/p&gt;\n&lt;p&gt;В случае наличия в схеме таблицы вычисляемых колонок диапазоны выводятся сначала без учета вычисляемых колонок, а потом либо дополняются вычисляемыми колонками, либо обрезаются до первой вычисляемой колонки, которую невозможно вычислить. Для каждого диапазона вычисляемая колонка может быть вычислена при подстановке в выражение только колонок, принадлежащих общему префиксу нижней и верхней границы.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Примеры:&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Пусть таблица имеет ключевые колонки: &lt;code&gt;h = hash(a, b), a, b, c&lt;/code&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Для предиката &lt;code&gt;a = 1 and b in (3, 4)&lt;/code&gt; будут выведены диапазоны:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[[hash(1, 3), 1, 3] .. [hash(1, 3), 1, 3]], [[hash(1, 4), 1, 4] .. [hash(1, 4), 1, 4]]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"858\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-858\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-858\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-858.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Для предиката &lt;code&gt;a = in (1, 2)&lt;/code&gt; диапазон не может быть выведен, поскольку вычисляемая колонка зависит не только от колонки &lt;code&gt;a&lt;/code&gt;, но и от колонки &lt;code&gt;b&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Специально рассматривается случай, когда вычисляемая колонка представляет собой выражение, взятое по модулю: &lt;code&gt;h = hash(a, b) % 3, a, b, c&lt;/code&gt;. В этом случае нет необходимости вычислять значение колонки, поскольку множество значений и так ограничено модулем. При выводе диапазонов рассматриваются все возможные варианты значения вычисляемой колонки с выражением, взятым по модулю. Так для предиката &lt;code&gt;a = in (1, 2)&lt;/code&gt; будут выведены диапазоны&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[[0, 1] .. [0, 1]], [[0, 2] .. [0, 2]], [[1, 1] .. [1, 1]], [[1, 2] .. [1, 2]], [[2, 1] .. [2, 1]], [[2, 2] .. [2, 2]]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"869\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-869\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-869\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-869.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Для предиката &lt;code&gt;a between 10 and 20&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[[0, 10] .. [0, 20]], [[1, 10] .. [1, 20]], [[2, 10] .. [2, 20]]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"875\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-875\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-875\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-875.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Количество выводимых диапазонов ограничивается с помощью опции &lt;code&gt;range_expansion_limit&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Для эффективного исполнения запроса важно максимально возможным образом использовать информацию из первичного ключа таблицы для отсечения максимально большого объема данных при координации запроса.&lt;/p&gt;\n&lt;p&gt;В случае если диапазоны вывести не удалось, таблица читается целиком. Такое чтение называется &lt;em&gt;full scan&lt;/em&gt;. Достаточно большая таблица (больше десятков гигабайт) не может быть прочитана за ограничение по времени (&lt;code&gt;query_timeout&lt;/code&gt; по умолчанию равен одной минуте), отведенный для выполнения запроса. Для запрета &lt;em&gt;full scan&lt;/em&gt; у запроса можно выставлять опцию &lt;code&gt;allow_full_scan&lt;/code&gt; в значение &lt;code&gt;false&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"joins\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#joins\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;JOINS&lt;/span&gt;&lt;/a&gt;JOINS&lt;/h3&gt;\n&lt;p&gt;В запросе можно также указать дополнительные таблицы-справочники, необходимые для вычисления финального ответа или для дополнительной фильтрации. В настоящий момент поддерживаются &lt;strong&gt;только lookup joins&lt;/strong&gt; — то есть схема исполнения JOIN при которой обработчик основных данных явно обращается к дополнительной таблице по ключу.&lt;/p&gt;\n&lt;p&gt;В самом запросе это означает то, что условие для JOIN должно содержать такой набор ключевых колонок таблицы справочника, чтобы из ограничения на эти колонки можно было вывести диапазоны для чтения данных. В случае, если JOIN невозможно выполнить с использованием индекса таблицы справочника, вернётся ошибка \"Foreign table key is not used in the join clause\". Для отключения такого поведения есть параметр &lt;code&gt;allow_join_without_index&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В общем случае JOIN выполняется следующим образом. На каждом узле кластера данные читаются из шарда основной таблицы, накапливаются в памяти, и вычисляется множество JOIN ключей для таблицы справочника. После этого выполняется запрос к таблице справочнику с полученными на основе JOIN ключей диапазонами чтения и опциональным предикатом. Далее в памяти происходит JOIN, и выполнение продолжается в обычном режиме.&lt;/p&gt;\n&lt;p&gt;При использовании множества JOIN в запросе последовательное их выполнение занимало бы значительно время. Поэтому отдельные JOIN группируются в множества, которые можно выполнить одновременно. Так при выполнении группы JOIN во время чтения данных из основной таблицы строится набор множеств JOIN ключей для каждого справочника из группы. Далее одновременно отправляются запросы на чтение данных из справочников, и после получения данных происходит JOIN, который формирует результирующие строки. Полный результирующий набор строк не материализуется в памяти, а по мере выполнения JOIN строки передаются в следующий оператор (например группировку).&lt;/p&gt;\n&lt;p&gt;Специальным способом выполняется JOIN, когда основная таблица и таблица справочник имеют общий префикс ключа с точностью до условия JOIN. В этом случае диапазоны для чтения таблицы справочника известны ещё до чтения основной таблицы уже на стадии координации запроса. Поэтому запрос на чтение таблицы справочника отправляется сразу после координации.&lt;/p&gt;\n&lt;h2 id=\"query_debug\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#query_debug\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Отладка запроса&lt;/span&gt;&lt;/a&gt;Отладка запроса&lt;/h2&gt;\n&lt;h3 id=\"execution_stat\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#execution_stat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистики выполнения&lt;/span&gt;&lt;/a&gt;Статистики выполнения&lt;/h3&gt;\n&lt;p&gt;В CLI можно указать опцию &lt;code&gt;--print-statistics&lt;/code&gt;. Статистика будет выведена в следующем виде:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{\n  \"incomplete_output\" = %false;\n  \"async_time\" = 20458u;\n  \"memory_usage\" = 0u;\n  \"inner_statistics\" = [\n    {\n      \"incomplete_output\" = %false;\n      \"async_time\" = 12098u;\n      \"memory_usage\" = 0u;\n      \"inner_statistics\" = [\n        {\n          \"incomplete_output\" = %false;\n          \"async_time\" = 4547u;\n          \"memory_usage\" = 0u;\n          \"sync_time\" = 23u;\n          \"codegen_time\" = 8u;\n          \"rows_read\" = 2164;\n          \"execute_time\" = 0u;\n          \"read_time\" = 13u;\n          \"incomplete_input\" = %false;\n          \"write_time\" = 0u;\n          \"rows_written\" = 2164;\n          \"data_weight_read\" = 77352;\n        };\n        ...\n      ];\n      \"codegen_time\" = 5u;\n      \"sync_time\" = 13u;\n      \"rows_read\" = 26908;\n      \"execute_time\" = 5u;\n      \"read_time\" = 0u;\n      \"incomplete_input\" = %false;\n      \"write_time\" = 0u;\n      \"rows_written\" = 26908;\n      \"data_weight_read\" = 1176824;\n    };\n    ...\n  ];\n  \"codegen_time\" = 11u;\n  \"sync_time\" = 64u;\n  \"rows_read\" = 188520;\n  \"execute_time\" = 16u;\n  \"read_time\" = 27u;\n  \"incomplete_input\" = %false;\n  \"write_time\" = 8u;\n  \"rows_written\" = 188520;\n  \"data_weight_read\" = 8245048;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"914\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-914\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-914\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-914.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Статистика имеет иерархическую структуру и соответствует структуре выполнения запроса.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;первый уровень - агрегация на координаторе (http или rpc proxy).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;второй уровень - агрегация на нодах.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;третий уровень - выполнение на нодах части подзапроса в thread pool.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;rows_read&lt;/code&gt; — количество прочитанных строк.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;data_weight_read&lt;/code&gt; — объём прочитанных данных в байтах в разжатом виде.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;codegen_time&lt;/code&gt; — время кодогенерации. После первой кодогенерации шаблон запроса (запрос без литералов) попадает в кеш.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;execute_time&lt;/code&gt; — время выполнения запроса без учета времени чтения (декодирования данных из формата чанка).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;rows_read&lt;/code&gt; — количество прочитанных строк.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;read_time&lt;/code&gt; — синхронное время чтения.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;wait_on_ready_event_time&lt;/code&gt; — время ожидания данных из reader.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;code&gt;async_time&lt;/code&gt; — общее время ожидания. Если оно сильно отличается от wait_on_ready_event_time, это значит, что запрос ожидает выделения CPU времени в fair share scheduler.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"explain_query\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#explain_query\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Команда explain-query&lt;/span&gt;&lt;/a&gt;Команда explain-query&lt;/h3&gt;\n&lt;p&gt;Для отладки запроса можно использовать команду explain. Команда выдает результат в структурированном виде.&lt;br /&gt;\nПример:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{\n    \"udf_registry_path\" = \"//sys/udfs\";\n    \"query\" = {\n        \"where_expression\" = \"((((oh.ff_status = ?) AND (o.fake_order_type = ?)) AND (NOT is_null(o.external_id))) AND (NOT is_null(oh.order_update_time))) AND (oh.id &amp;gt; ?)\";\n        \"is_ordered_scan\" = %false;\n        \"joins\" = [\n            [\n                {\n                    \"lookup_type\" = \"source ranges\";\n                    \"common_key_prefix\" = 0u;\n                    \"foreign_key_prefix\" = 1u;\n                };\n            ];\n        ];\n        \"common_prefix_with_primary_key\" = ...;\n        \"key_trie\" = \"(key0, { (0#0:0#&amp;lt;Max&amp;gt;] })\";\n        \"ranges\" = ...;\n    };\n    \"subqueries\" = {\n        // Часть запроса, который будет выполняться на нодах.\n    };\n    \"top_query\" = {\n        // Часть запроса, который будет выполняться на прокси.\n    };\n}\n\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"981\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-981\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-981\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-981.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;where_expression&lt;/code&gt; — синтаксическое представление условия where, из которого выводятся диапазоны чтения (&lt;code&gt;ranges&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;is_ordered_scan&lt;/code&gt; — определяет, будет ли сохранен порядок строк таблицы при чтении данных. Такой режим может понадобиться при реализации постраничного вывода (pagination). Если же нужно прочитать всё множество строк, удовлетворяющее условию WHERE (LIMIT отсутствует), быстрее будет происходить параллельное чтение без сохранения порядка строк в таблице.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;joins&lt;/code&gt; — содержит список групп join. Join в пределах группы выполняется параллельно для нескольких таблиц.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;lookup_type&lt;/code&gt; — способ указания диапазонов чтения при выполнении join. Возможные варианты: source ranges, prefix ranges и IN clause. Режим source ranges наиболее оптимальный. В режиме prefix ranges происходит копирование ключей join. Это происходит, если в условии join есть выражения или поля таблицы, которые не являются префиксом ключа вторичной таблицы. В режиме IN clause join происходит как подзапрос выражением IN. Этот режим используется, если из условия join нельзя вывести диапазоны чтения вторичной таблицы. При наличии дополнительного условия AND в join происходит попытка вывести диапазоны чтения, используя оба условия - условие join и дополнительное условие AND.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;common_key_prefix&lt;/code&gt; — размер общего префикса ключа первичной таблицы и вторичной таблицы.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;foreign_key_prefix&lt;/code&gt; — размер префикса ключа вторичной таблицы, который выводится из условия join.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;common_prefix_with_primary_key&lt;/code&gt; — размер префикса первичного ключа таблицы, который содержится в условии группировки. Это позволяет не делать общую hash таблицу для всех ключей (ключи группировки с разными префиксами не могут совпасть). При одновременном использовании group by и order by ненулевой общий префикс с первичным ключом позволяет перенести вычисление order by + limit на ноды и сократить количество передаваемых данных на прокси (координатор).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ranges&lt;/code&gt; — список диапазонов чтения таблицы, полученных из условия where.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;key_trie&lt;/code&gt; — промежуточное представление ограничений на ключевые колонки, которое формируется из условия where. Далее из key trie выводятся диапазоны чтения (&lt;code&gt;ranges&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;top_query&lt;/code&gt;, &lt;code&gt;subqueries&lt;/code&gt; — части запроса, выполняющиеся на разных узлах кластера. Подробнее про исполнение запроса можно прочитать в разделе &lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#query_execution\"&gt;Исполнение запроса&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"rasshireniya-i-nastrojki\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#rasshireniya-i-nastrojki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Расширения и настройки&lt;/span&gt;&lt;/a&gt;Расширения и настройки&lt;/h2&gt;\n&lt;h3 id=\"ogranicheniya-na-slozhnost-zaprosa-opcii\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#ogranicheniya-na-slozhnost-zaprosa-opcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения на сложность запроса (Опции)&lt;/span&gt;&lt;/a&gt;Ограничения на сложность запроса (Опции)&lt;/h3&gt;\n&lt;p&gt;Опция в конфигурации драйвера:&lt;br /&gt;\n&lt;code&gt;query_timeout&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;Опции отдельных запросов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;input_row_limit&lt;/code&gt; — ограничение на количество строк, которое читается на одном узле кластера в одном потоке;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;output_row_limit&lt;/code&gt; — ограничение на количество строк, которое получается на выходе на одном узле кластера в одном потоке. Также это значение ограничивает количество строк в группировке на одном узле кластера;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;range_expansion_limit&lt;/code&gt; — максимальное количество диапазонов, которое будет выведено из условия WHERE;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;fail_on_incomplete_result&lt;/code&gt; — определяет поведение в случае превышения &lt;code&gt;input_row_limit&lt;/code&gt; или &lt;code&gt;output_row_limit&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;memory_limit_per_node&lt;/code&gt; — ограничение на объём памяти, доступной запросу на одном узле кластера.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"imenovannye-parametry\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#imenovannye-parametry\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Именованные параметры&lt;/span&gt;&lt;/a&gt;Именованные параметры&lt;/h3&gt;\n&lt;p&gt;В тексте запроса можно использовать parameter placeholders. Пример использования:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;a &lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;t` &lt;span class=\"hljs-keyword\"&gt;where&lt;/span&gt; b &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; {&lt;span class=\"hljs-keyword\"&gt;first&lt;/span&gt;} &lt;span class=\"hljs-keyword\"&gt;and&lt;/span&gt; (c, d) &lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; {&lt;span class=\"hljs-keyword\"&gt;second&lt;/span&gt;}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1079\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1079\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1079\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1079.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Параметры &lt;code&gt;first&lt;/code&gt; и &lt;code&gt;second&lt;/code&gt; задаются через YSON-словарь, который можно указать в параметре запроса &lt;code&gt;placeholder_values&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs python\"&gt;client.select_rows(\n  &lt;span class=\"hljs-string\"&gt;\"a from `//t` where b = {first} and (c, d) &amp;gt; {second}\"&lt;/span&gt;,\n  placeholder_values={&lt;span class=\"hljs-string\"&gt;'first'&lt;/span&gt;: &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'second'&lt;/span&gt;: [&lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;'b'&lt;/span&gt;]},\n)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1083\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1083\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1083\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1083.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"raspredelenie-resursov-mezhdu-zaprosami\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#raspredelenie-resursov-mezhdu-zaprosami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Распределение ресурсов между запросами&lt;/span&gt;&lt;/a&gt;Распределение ресурсов между запросами&lt;/h3&gt;\n&lt;p&gt;Для выполнении запросов используется fair share CPU планировщик. Планирование запросов осуществляется на каждой ноде независимо. По умолчанию каждый исполняемый запрос в пределах ноды получает равные ресурсы (CPU). Благодаря этому нода, загруженная несколькими тяжелыми запросами, сможет предсказуемо быстро выполнить легкий запрос. Однако это не спасает от ситуации, когда ноду кластера загружают очень большим количеством запросов. В таком случае запросы будут замедляться пропорционально количеству выполняемых запросов в единицу времени. Например, один из пользователей системы может задать множество запросов и получить большую часть CPU. В качестве мер противодействия такой ситуации есть поддержка двухуровнего fair share: кроме разделения ресурса (CPU) между запросами, запросы можно объединять в группы и разделять ресурс между группами запросов. Для объединения запросов в группы (например, по пользователю) предусмотрена возможность указания вычислительного пула (параметр запроса &lt;code&gt;execution_pool&lt;/code&gt;). Запросы с одинаковым параметрам &lt;code&gt;execution_pool&lt;/code&gt; попадут в одну группу. Каждая группа будет получать свою долю ресурсов. Внутри группы ресурсы будут делиться между отдельными запросами.&lt;br /&gt;\nПо умолчанию каждый пул имеет вес, равный 1. Если какому-то пулу хочется выделить отличный от 1 вес, для этого в директории &lt;code&gt;//sys/ql_pools&lt;/code&gt; нужно создать ноду c названием пула, прописать ей атрибут &lt;code&gt;@weight&lt;/code&gt; и указать в ACL разрешение &lt;code&gt;use&lt;/code&gt; для заданной группы (пользователя).&lt;br /&gt;\nПо умолчанию запросы выполняются в пуле &lt;code&gt;default&lt;/code&gt;.&lt;/p&gt;\n\n"
