            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе описан собственный диалект языка SQL, позволяющий читать и преобразовывать данные на стороне системы.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Данная функциональность поддерживается только для динамических таблиц.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Собственный диалект языка SQL не является полноценной реализацией языка SQL. Описываемый язык запросов стоит рассматривать как расширенную операцию чтения данных, позволяющую сделать часть работы по обработке данных на стороне сервера.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Описываемая функциональность не является заменой MapReduce операциям. Движок исполнения запросов не имеет планировщика и, задав тяжёлый запрос с full scan, можно вызвать деградацию кластера. Команда сервиса YTsaurus работает над тем, чтобы добавить больше надёжности при обработке крупных запросов, однако описываемый диалект языка SQL не планируется развивать с целью замены MapReduce.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"primery\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#primery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примеры&lt;/span&gt;&lt;/a&gt;Примеры&lt;/h2&gt;\n&lt;p&gt;Чтение из таблицы:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt select-rows &lt;span class=\"hljs-string\"&gt;\"* FROM [//mytable] LIMIT 10\"&lt;/span&gt; --format json\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"35\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-35\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-35\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-35.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Подсчет количества строк:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt select-rows &lt;span class=\"hljs-string\"&gt;\"SUM(1) FROM [//mytable] GROUP BY 1\"&lt;/span&gt; --format json\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"39\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-39\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-39\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-39.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Запросы с группировкой:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt select-rows &lt;span class=\"hljs-string\"&gt;\"day, MIN(price), MAX(price) FROM [//mytable] WHERE is_ok = 1 GROUP BY timestamp / 86400 AS day\"&lt;/span&gt; --format json\nyt select-rows &lt;span class=\"hljs-string\"&gt;\"item_id FROM [//mytable] WHERE (user_id, order_id) IN ((1, 1), (1, 2), (10, 10), (10, 11))\"&lt;/span&gt; --format json\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"43\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-43\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-43\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-43.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"sintaksis-zaprosa\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#sintaksis-zaprosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Синтаксис запроса&lt;/span&gt;&lt;/a&gt;Синтаксис запроса&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;|&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;select&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;select&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;alias&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;], &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;select&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-number\"&gt;-2&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;select&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;alias&lt;span class=\"hljs-number\"&gt;-2&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;], ...\n&lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; [&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;path&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;to&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;table&lt;/span&gt;] [&lt;span class=\"hljs-keyword\"&gt;WITH&lt;/span&gt; INDEX [&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;path&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;to&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;index&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;table&lt;/span&gt;] [&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt;] &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;index&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;alias&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;] [&lt;span class=\"hljs-keyword\"&gt;JOIN&lt;/span&gt; [&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;path&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;to&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;rhs1] &lt;span class=\"hljs-keyword\"&gt;USING&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;column&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;, &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;column&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;-2&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;, ...]\n[&lt;span class=\"hljs-keyword\"&gt;WHERE&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;predicate&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;]\n[&lt;span class=\"hljs-keyword\"&gt;GROUP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;group&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;group&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;alias&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;], &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;group&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-number\"&gt;-2&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;group&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;alias&lt;span class=\"hljs-number\"&gt;-2&lt;/span&gt;], ... [&lt;span class=\"hljs-keyword\"&gt;WITH&lt;/span&gt; TOTALS &lt;span class=\"hljs-keyword\"&gt;HAVING&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;having&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;|&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;HAVING&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;having&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;WITH&lt;/span&gt; TOTALS &lt;span class=\"hljs-operator\"&gt;|&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;WITH&lt;/span&gt; TOTALS &lt;span class=\"hljs-operator\"&gt;|&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;HAVING&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;having&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;]]\n[&lt;span class=\"hljs-keyword\"&gt;ORDER&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;order&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;ASC&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;|&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;DESC&lt;/span&gt;], &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;order&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-number\"&gt;-2&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;ASC&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;|&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;DESC&lt;/span&gt;], ...]\n[&lt;span class=\"hljs-keyword\"&gt;OFFSET&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;n&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;]\n[LIMIT &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;m&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"47\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-47\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-47\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-47.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В общем случае порядок строк на выходе запроса не определён, но в случаях &lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#order_by\"&gt;ORDER BY&lt;/a&gt; и &lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#limit\"&gt;LIMIT&lt;/a&gt; подобные гарантии даются.&lt;/p&gt;\n&lt;h3 id=\"select\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#select\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Секция SELECT&lt;/span&gt;&lt;/a&gt;Секция SELECT&lt;/h3&gt;\n&lt;p&gt;Синтаксис SELECT:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;|&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;select&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;select&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;alias&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;], &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;select&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-number\"&gt;-2&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;select&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;alias&lt;span class=\"hljs-number\"&gt;-2&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;], ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"57\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-57\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-57\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-57.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Определяет выходные колонки запроса. При указании звёздочки (&lt;code&gt;*&lt;/code&gt;) в качестве выходных колонок будут использованы все входные колонки основной таблицы. Альтернативно можно задать произвольные выражения для вычисления. При запросах без группировки в выражении могут встречаться все колонки исходных таблиц. При запросах с группировкой в выражении могут встречаться только ключевые колонки, используемые для группировки, или агрегаты.&lt;/p&gt;\n&lt;h3 id=\"from_join\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#from_join\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Секция FROM ... JOIN&lt;/span&gt;&lt;/a&gt;Секция FROM ... JOIN&lt;/h3&gt;\n&lt;p&gt;Синтаксис FROM ... JOIN:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; [&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;path&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;to&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;table&lt;/span&gt;] [[&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt;] &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;table&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;alias&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;] [&lt;span class=\"hljs-keyword\"&gt;WITH&lt;/span&gt; INDEX [&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;path&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;to&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;index&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;table&lt;/span&gt;] [&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt;] &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;index&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;alias&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;] [[&lt;span class=\"hljs-keyword\"&gt;LEFT&lt;/span&gt;] &lt;span class=\"hljs-keyword\"&gt;JOIN&lt;/span&gt; [&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;path&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;to&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;dict&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;] [[&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt;] &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;table&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;alias&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;] (&lt;span class=\"hljs-keyword\"&gt;ON&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expression&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;foreign&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expression&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;|&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;USING&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;column&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;, &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;column&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;-2&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;, ...) [&lt;span class=\"hljs-keyword\"&gt;AND&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;predicate&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;]] ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"67\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-67\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-67\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-67.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Определяет источники данных для запроса. Таблица, указываемая сразу после FROM, считается основной, и она используется при координации исполнения запроса (если в запросе нет ключевого слова WITH INDEX). Также допустимо указание вспомогательных таблиц-справочников в секции JOIN. Таблицы-справочники подключаются к основной таблице при точном совпадении указанного ключа. Без указания ключевого слова LEFT будет выполнен INNER JOIN. Дополнительно можно указывать выражение для фильтрации таблицы справочника, которое будет выполняться при чтении данных до выполнения join с основной таблицей.&lt;/p&gt;\n&lt;p&gt;При наличии в запросе ключевого слова WITH INDEX, индексная таблица будет использоваться для координации, а индексная таблица, указанная после FROM, будет подключена к ней по общим колонкам. См. также &lt;a href=\"user-guide/dynamic-tables/secondary-indices\"&gt;вторичные индексы&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Для объединения таблиц по нескольким колонкам в условии ON необходимо записать кортеж.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;FROM&lt;/span&gt; [&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;x] &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; x &lt;span class=\"hljs-keyword\"&gt;JOIN&lt;/span&gt; [&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;y] &lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; y &lt;span class=\"hljs-keyword\"&gt;ON&lt;/span&gt; (x.a, x.b) &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; (y.a, y.b)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"77\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-77\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-77\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-77.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Допускается написание выражений в условии JOIN:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;ON&lt;/span&gt; (if(is_null(x.a), &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;, x.a), x.b) &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; (y.a, y.b)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"81\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-81\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-81\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-81.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Подробнее про JOIN, их возможности и ограничения можно прочитать в разделе &lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#joins\"&gt;JOINS&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"where\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#where\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Секция WHERE&lt;/span&gt;&lt;/a&gt;Секция WHERE&lt;/h3&gt;\n&lt;p&gt;Синтаксис WHERE:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;WHERE&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;predicate&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"91\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-91\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-91\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-91.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Определяет первичный фильтр данных.&lt;/p&gt;\n&lt;h3 id=\"group_by\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#group_by\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Секция GROUP BY&lt;/span&gt;&lt;/a&gt;Секция GROUP BY&lt;/h3&gt;\n&lt;p&gt;Синтаксис GROUP BY:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;GROUP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;group&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;group&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;alias&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;], &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;group&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-number\"&gt;-2&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;AS&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;group&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;alias&lt;span class=\"hljs-number\"&gt;-2&lt;/span&gt;], ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"101\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-101\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-101\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-101.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Определяет группировку данных по ключу.&lt;/p&gt;\n&lt;h3 id=\"having\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#having\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Секция HAVING&lt;/span&gt;&lt;/a&gt;Секция HAVING&lt;/h3&gt;\n&lt;p&gt;Синтаксис HAVING:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;HAVING&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;predicate&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"111\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-111\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-111\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-111.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Определяет условие фильтрации после группировки.&lt;/p&gt;\n&lt;h3 id=\"with_totals\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#with_totals\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модификатор WITH TOTALS&lt;/span&gt;&lt;/a&gt;Модификатор WITH TOTALS&lt;/h3&gt;\n&lt;p&gt;Используется вместе с группировкой и добавляет к результату дополнительную строку, с которой в ключах группировки будут &lt;code&gt;NULL&lt;/code&gt; значения, а в значениях суммарные агрегаты по сгруппированным данным. Добавляемая строка итоговым агрегатом не обрабатывается в ORDER BY ... LIMIT. В случае когда используется секция HAVING, итоговые агрегаты можно считать как до, так и после фильтрации. Порядковое расположение строки с итоговыми агрегатами в результирующем наборе строк неспецифицировано. Добавляемая строка может быть как первой, так и последней. Отличать её нужно по &lt;code&gt;NULL&lt;/code&gt; ключу.&lt;/p&gt;\n&lt;p&gt;Синтаксис WITH TOTALS:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;GROUP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; ... &lt;span class=\"hljs-keyword\"&gt;WITH&lt;/span&gt; TOTALS\n&lt;span class=\"hljs-keyword\"&gt;GROUP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; ... &lt;span class=\"hljs-keyword\"&gt;WITH&lt;/span&gt; TOTALS &lt;span class=\"hljs-keyword\"&gt;HAVING&lt;/span&gt; ...\n&lt;span class=\"hljs-keyword\"&gt;GROUP&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; ... &lt;span class=\"hljs-keyword\"&gt;HAVING&lt;/span&gt; ... &lt;span class=\"hljs-keyword\"&gt;WITH&lt;/span&gt; TOTALS\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"124\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-124\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-124\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-124.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"order_by\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#order_by\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Секция ORDER BY&lt;/span&gt;&lt;/a&gt;Секция ORDER BY&lt;/h3&gt;\n&lt;p&gt;Синтаксис ORDER BY:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;ORDER&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BY&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;order&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-number\"&gt;-1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;ASC&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;|&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;DESC&lt;/span&gt;], &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;order&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt;expr&lt;span class=\"hljs-number\"&gt;-2&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; [&lt;span class=\"hljs-keyword\"&gt;ASC&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;|&lt;/span&gt;&lt;span class=\"hljs-keyword\"&gt;DESC&lt;/span&gt;], ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"131\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-131\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-131\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-131.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Определяет упорядоченность выходного набора строк по указанным выражениям. По умолчанию используется порядок сортировки по возрастанию (ASC). Для сортировки по убыванию указывается ключевое слово DESC. Сортировка применяется после группировки, поэтому в выражениях могут присутствовать только ключевые колонки группировки или посчитанные агрегаты. Сортировка является частичной, то есть в качестве результата возвращается лишь N наименьших строк (параметр N задается в секции LIMIT).&lt;/p&gt;\n&lt;h3 id=\"offset\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#offset\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Секция OFFSET&lt;/span&gt;&lt;/a&gt;Секция OFFSET&lt;/h3&gt;\n&lt;p&gt;Синтаксис OFFSET:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;OFFSET&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;n&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"141\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-141\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-141\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-141.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Определяет количество пропускаемых строк из выходного набора строк.&lt;/p&gt;\n&lt;p&gt;Эффективной реализации OFFSET в языке запросов при текущей схеме хранения данных быть не может. Для запроса OFFSET N LIMIT M будет прочитано N + M строк. Чтобы это реализовать эффективно, должен быть индекс из номера строки в ключ.&lt;br /&gt;\nПравильный способ делать постраничный вывод — делать запросы с LIMIT, но вместо использования OFFSET запоминать последние значения ключа last_key = (key_column1, key_column2, ...) у результата текущего запроса и посылать следующий запрос с условием where (key_column1, key_column2, ...) &amp;gt; last_key.&lt;/p&gt;\n&lt;h3 id=\"limit\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#limit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Секция LIMIT&lt;/span&gt;&lt;/a&gt;Секция LIMIT&lt;/h3&gt;\n&lt;p&gt;Синтаксис LIMIT&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;LIMIT &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;m&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"154\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-154\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-154\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-154.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Определяет размер выходного набора строк. При наличии секции ORDER BY задаёт ограничение на размер кучи, иначе — задаёт ограничение на порядок и объём сканируемых данных. При запросе с LIMIT данные сканируются последовательно по первичному ключу до достижения целевого размера, в этом случае порядок строк на выходе однозначно определён.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При использовании группировки с лимитом (без ORDER BY) данные будут читаться упорядоченно в порядке первичного ключа таблицы.&lt;/p&gt;\n&lt;p&gt;Если агрегатных колонок нет, после накопления необходимого набора сгруппированных строк запрос завершится. При наличии агрегатных колонок будет произведена догруппировка для накопленных в количестве, указанном в LIMIT, ключей.&lt;/p&gt;\n&lt;p&gt;При использовании LIMIT без ORDER BY следует обращать внимание на то, что LIMIT будет применяться к предыдущему оператору. Например, если используется GROUP BY ... WITH TOTALS и LIMIT, то итоговые агрегаты будут посчитаны по данным, уместившимся в лимит. Данные сверх лимита даже не будут прочитаны. Если добавить ORDER BY, то LIMIT будет влиять на него, а GROUP BY будут обработаны все прочитанные данные, соответственно TOTALS будут посчитаны по большему массиву данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zaprosy-s-paginaciej\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#zaprosy-s-paginaciej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запросы с пагинацией&lt;/span&gt;&lt;/a&gt;Запросы с пагинацией&lt;/h4&gt;\n&lt;p&gt;Если вам необходимо последовательно прочитать большую часть таблицы, воспользуйтесь пагинацией. Не используйте для пагинации запросы с возрастающим &lt;code&gt;OFFSET&lt;/code&gt; -- это приводит к квадратичному алгоритму сканирования таблицы.&lt;/p&gt;\n&lt;p&gt;Запросы с пагинацией должны выглядеть следующим образом:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-keyword\"&gt;select&lt;/span&gt; k0, k1, k2\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;t`\n&lt;span class=\"hljs-keyword\"&gt;where&lt;/span&gt; (k0, k1, k2) &lt;span class=\"hljs-operator\"&gt;&amp;gt;=&lt;/span&gt; (&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;)\n&lt;span class=\"hljs-keyword\"&gt;order&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;by&lt;/span&gt; k0, k1, k2\nlimit &lt;span class=\"hljs-number\"&gt;10000&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"183\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-183\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-183\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-183.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Здесь &lt;code&gt;k0, k1, k2&lt;/code&gt; -- первичный ключ таблицы.&lt;br /&gt;\nВ качестве курсора используется кортеж &lt;code&gt;(1, 2, 3)&lt;/code&gt; -- значение этого курсора вам необходимо обновлять.&lt;br /&gt;\nПри помощи &lt;code&gt;LIMIT&lt;/code&gt; вы можете регулировать объём читаемых данных.&lt;/p&gt;\n&lt;h2 id=\"expression_syntax\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#expression_syntax\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Синтаксис выражений&lt;/span&gt;&lt;/a&gt;Синтаксис выражений&lt;/h2&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;literal&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;identifier&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"190\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-190\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-190\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-190.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Арифметические операторы:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;+&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;*&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;%&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"194\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-194\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-194\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-194.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Битовые операторы:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;|&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;amp;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&amp;lt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"198\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-198\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-198\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-198.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Логические операторы:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;AND&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;OR&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-keyword\"&gt;NOT&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"202\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-202\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-202\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-202.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Операторы сравнения:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;=&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;!=&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;=&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;gt;=&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BETWEEN&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;literal&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;AND&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;literal&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;\n&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;BETWEEN&lt;/span&gt; (&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;literal&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;AND&lt;/span&gt; &lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;literal&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;, ...)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"206\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-206\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-206\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-206.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Оператор IN:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt; &lt;span class=\"hljs-keyword\"&gt;IN&lt;/span&gt; (&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;literal&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;, ...)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"210\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-210\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-210\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-210.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Функции:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;FN(&lt;span class=\"hljs-operator\"&gt;&amp;lt;&lt;/span&gt;expr&lt;span class=\"hljs-operator\"&gt;&amp;gt;&lt;/span&gt;, ...)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"214\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-214\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-214\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-214.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Приоритеты:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;code&gt;unary + - ~&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;binary * / %&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;binary + -&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;binary &amp;gt;&amp;gt; &amp;lt;&amp;lt;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;binary &amp;amp;&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;binary |&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;binary &amp;lt; &amp;lt;= &amp;gt; &amp;gt;= IN BETWEEN&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;binary =&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;unary NOT&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;binary AND&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;binary OR&lt;/code&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Каждое выражение имеет тип: &lt;code&gt;int64&lt;/code&gt;, &lt;code&gt;uint64&lt;/code&gt;, &lt;code&gt;boolean&lt;/code&gt;, &lt;code&gt;double&lt;/code&gt;, &lt;code&gt;string&lt;/code&gt;, &lt;code&gt;any&lt;/code&gt;. Типизация выражений строгая. При возникновении ошибки типизации исполнение запроса останавливается и пользователю возвращается ошибка.&lt;/p&gt;\n&lt;p&gt;Арифметические операторы принимают на вход численные типы (&lt;code&gt;int64&lt;/code&gt;, &lt;code&gt;uint64&lt;/code&gt;, &lt;code&gt;double&lt;/code&gt;) и возвращают значение такого же типа.&lt;/p&gt;\n&lt;p&gt;Логические операторы принимают на вход и возвращают значения типа &lt;code&gt;boolean&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Операторы сравнения, операторы IN и BETWEEN принимают на вход значения одинакового типа и возвращают значения типа &lt;code&gt;boolean&lt;/code&gt;. Также они допускают использование кортежей.&lt;/p&gt;\n&lt;p&gt;Пример использования кортежей:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;(a, b) &lt;span class=\"hljs-operator\"&gt;&amp;gt;=&lt;/span&gt; (valA, valB)\n(a, b) &lt;span class=\"hljs-keyword\"&gt;IN&lt;/span&gt; ((valA0, valB0), (valA1, valB1), ...)\n(a, b) &lt;span class=\"hljs-keyword\"&gt;BETWEEN&lt;/span&gt; ((&lt;span class=\"hljs-number\"&gt;16202224&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;AND&lt;/span&gt; (&lt;span class=\"hljs-number\"&gt;16202224&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;3&lt;/span&gt;), (&lt;span class=\"hljs-number\"&gt;2011740432&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;6&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;AND&lt;/span&gt; (&lt;span class=\"hljs-number\"&gt;2011740432&lt;/span&gt;), (&lt;span class=\"hljs-number\"&gt;591141536&lt;/span&gt;) &lt;span class=\"hljs-keyword\"&gt;AND&lt;/span&gt; (&lt;span class=\"hljs-number\"&gt;591141536&lt;/span&gt;, &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;), ...)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"290\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-290\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-290\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-290.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Функции в выражениях бывают двух типов: скалярные, применяемые к кортежу значений, и агрегирующие, применяемые к группе входных данных, соответствующих одному ключу. Скалярные функции можно использовать в любом выражении. Агрегирующие функции можно использовать только в секции SELECT при наличии секции GROUP BY.&lt;/p&gt;\n&lt;h3 id=\"identifiers\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#identifiers\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Идентификаторы&lt;/span&gt;&lt;/a&gt;Идентификаторы&lt;/h3&gt;\n&lt;p&gt;Имена колонок, содержащие специальные символы, необходимо оборачивать в квадратные скобки.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Примеры&lt;/strong&gt;: &lt;code&gt;t.[a.b], t.[c-1], t.[[d]] from [//path] as t&lt;/code&gt;, где &lt;code&gt;a.b&lt;/code&gt;, &lt;code&gt;c-1&lt;/code&gt; и &lt;code&gt;[d]&lt;/code&gt; — имена колонок.&lt;br /&gt;\nВ результирующей схеме в именах колонок квадратные скобки по возможности будут опускаться.&lt;br /&gt;\nДля запроса &lt;code&gt;[my.column-1], [my+column-2] from ...&lt;/code&gt; будет схема &lt;code&gt;\"my.column-1\", \"my+column-2\"&lt;/code&gt;.&lt;br /&gt;\nВ случае если в запросе указаны выражения без псевдонима (&lt;code&gt;AS name&lt;/code&gt;), a колонки содержат специальные символы, квадратные скобки будут добавлены.&lt;br /&gt;\nДля запроса &lt;code&gt;[my.column-1] + x, [my+column-2] from ...&lt;/code&gt; будет схема &lt;code&gt;\"[my.column-1] + x\", \"my+column-2\"&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"synonyms\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#synonyms\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Синонимы&lt;/span&gt;&lt;/a&gt;Синонимы&lt;/h3&gt;\n&lt;p&gt;Для выражений можно задавать имя с помощью ключевого слова AS. Поддержка синонимов сделана аналогично &lt;a href=\"https://clickhouse.yandex\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;ClickHouse&lt;/a&gt;. В отличие от стандартного SQL, синонимы могут объявляться не только на верхнем уровне выражений: &lt;code&gt;((1 as x) + x) as y&lt;/code&gt;. Кроме этого, синонимы можно использовать во всех секциях запроса. &lt;strong&gt;Пример&lt;/strong&gt;: &lt;code&gt;a from [...] group by x % 2 as a&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Такое поведение совместимо со стандартным SQL до тех пор, пока не используются синонимы, которые перекрывают имена колонок исходных таблиц.&lt;/p&gt;\n&lt;p&gt;В таблице приведен пример использования синонимов для таблицы с колонкой &lt;code&gt;UpdateTime&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Пример использования синонимов:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Выражение&lt;/th&gt;\n&lt;th&gt;YTsaurus&lt;/th&gt;\n&lt;th&gt;В стандартном SQL&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;UpdateTime / 1000 as UpdateTime, UpdateTime as b&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;В результате UpdateTime = b&lt;/td&gt;\n&lt;td&gt;В результате UpdateTime != b&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;UpdateTime / 3600 % 24 as Hour from ... group by Hour&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Группировка будет по &lt;code&gt;UpdateTime / 3600 % 24&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Группировка будет по &lt;code&gt;UpdateTime / 3600 % 24&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;UpdateTime / 3600 % 24 as Hour where Hour = ...&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Будет фильтрация по &lt;code&gt;UpdateTime / 3600 % 24&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Будет фильтрация по &lt;code&gt;UpdateTime / 3600 % 24&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;UpdateTime / 1000 as UpdateTime where in (...)&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Будет фильтрация по &lt;code&gt;UpdateTime / 1000&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Будет фильтрация по исходному полю &lt;code&gt;UpdateTime&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;UpdateTime / 1000 as UpdateTime from ... group by UpdateTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Группировка будет по &lt;code&gt;UpdateTime / 1000&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Группировка будет по исходному полю &lt;code&gt;UpdateTime&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;UpdateTime from ... group by UpdateTime / 1000 as UpdateTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Группировка будет по &lt;code&gt;UpdateTime / 1000&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;AS не поддерживается внутри group by&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;max(UpdateTime) as UpdateTime where UpdateTime between ...&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Будет ошибка, поскольку в where нельзя использовать агрегат&lt;/td&gt;\n&lt;td&gt;Будет фильтрация по исходному полю &lt;code&gt;UpdateTime&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"literals\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#literals\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Литералы&lt;/span&gt;&lt;/a&gt;Литералы&lt;/h3&gt;\n&lt;p&gt;В выражениях могут встречаться литералы, кодирующие типизированные значения.&lt;/p&gt;\n&lt;p&gt;Для задания чисел со знаком используется десятичная запись числа (к примеру, &lt;code&gt;100500&lt;/code&gt; или &lt;code&gt;42&lt;/code&gt;); для задания чисел без знака используется десятичная запись числа с суффиксом &lt;code&gt;u&lt;/code&gt; (к примеру, &lt;code&gt;100500u&lt;/code&gt;, &lt;code&gt;42u&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Для задания чисел с плавающей точкой используется C-подобная десятичная запись числа (к примеру, &lt;code&gt;3.1415926&lt;/code&gt;) с обязательным наличием точки-разделителя целой и дробной части.&lt;/p&gt;\n&lt;p&gt;Для задания строк используются C-подобные строковые литералы (а-ля &lt;code&gt;\"hello\"&lt;/code&gt;, &lt;code&gt;\"world\"&lt;/code&gt;).&lt;/p&gt;\n&lt;h3 id=\"skalyarnye-funkcii\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#skalyarnye-funkcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Скалярные функции&lt;/span&gt;&lt;/a&gt;Скалярные функции&lt;/h3&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Некоторые функции являются полиморфными: то есть могут принимать значения нескольких типов. Сигнатура таких функций описана или с использованием переменных для типов (type variables; обозначаются большими буквами: &lt;code&gt;A&lt;/code&gt;, &lt;code&gt;B&lt;/code&gt;, ...), или с использованием явного перечисления принимаемых типов (обозначается: &lt;code&gt;int64 | uint64&lt;/code&gt;).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"obsheprimenimye-funkcii\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#obsheprimenimye-funkcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общеприменимые функции&lt;/span&gt;&lt;/a&gt;Общеприменимые функции&lt;/h4&gt;\n&lt;p&gt;&lt;code&gt;if(cond, then, else) :: boolean -&amp;gt; A -&amp;gt; A -&amp;gt; A&lt;/code&gt;&lt;br /&gt;\nУсловный оператор; если выражение &lt;code&gt;cond&lt;/code&gt; является истинным, то результатом функции является значение &lt;code&gt;then&lt;/code&gt;, иначе &lt;code&gt;else&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;is_null(x) :: A -&amp;gt; boolean&lt;/code&gt;&lt;br /&gt;\nПроверяет, является ли указанное значение &lt;code&gt;NULL&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;is_finite(x) :: double -&amp;gt; boolean&lt;/code&gt;&lt;br /&gt;\nПроверяет, является ли указанное значение конечным числом с плавающей точкой, т.е. не является бесконечностью или &lt;code&gt;NaN&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;is_nan(x) :: double -&amp;gt; boolean&lt;/code&gt;&lt;br /&gt;\nПроверяет, является ли указанное значение &lt;code&gt;NaN&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;transform(a, (a1, a2, ...), (b1, b2, ...)) :: A -&amp;gt; List[A] -&amp;gt; List[B] -&amp;gt; B&lt;/code&gt;&lt;br /&gt;\n&lt;code&gt;transform[a2), ((a11, a12), ...), (v1, ...](a1,) :: Tuple -&amp;gt; List[Tuple] -&amp;gt; List[B] -&amp;gt; B&lt;/code&gt;&lt;br /&gt;\nПреобразовать значение(или tuple) согласно явно указанному отображению одних элементов на другие.&lt;br /&gt;\nЕсли соответствующего значения нет - возвращается &lt;code&gt;NULL&lt;/code&gt;.&lt;br /&gt;\nСложность - константная.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;greatest(a1, a2, ...) :: A* -&amp;gt; A&lt;/code&gt;&lt;br /&gt;\nВозвращает наибольшее значение из аргументов.&lt;/p&gt;\n&lt;h4 id=\"rabota-so-strokami\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#rabota-so-strokami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Работа со строками&lt;/span&gt;&lt;/a&gt;Работа со строками&lt;/h4&gt;\n&lt;p&gt;&lt;code&gt;length(s) :: string -&amp;gt; int64&lt;/code&gt;&lt;br /&gt;\nВозвращает длину строки &lt;code&gt;s&lt;/code&gt; в байтах.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;is_substr(s, t) :: string -&amp;gt; string -&amp;gt; boolean&lt;/code&gt;&lt;br /&gt;\nПроверяет, является ли строка &lt;code&gt;s&lt;/code&gt; подстрокой &lt;code&gt;t&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;is_prefix(p, t) :: string -&amp;gt; string -&amp;gt; boolean&lt;/code&gt;&lt;br /&gt;\nПроверяет, является ли строка &lt;code&gt;p&lt;/code&gt; префиксом &lt;code&gt;t&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;lower(s) :: string -&amp;gt; string&lt;/code&gt;&lt;br /&gt;\nПриводит строку &lt;code&gt;s&lt;/code&gt; к нижнему регистру.&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;concat(lhs, rhs) :: string -&amp;gt; string -&amp;gt; string&lt;/code&gt;&lt;br /&gt;\nКонкатенирует две строки.&lt;/p&gt;\n&lt;h4 id=\"obrashenie-k-kontejneram\"&gt;&lt;a href=\"ru/user-guide/dynamic-tables/dyn-query-language.html#obrashenie-k-kontejneram\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обращение к контейнерам&lt;/span&gt;&lt;/a&gt;Обращение к контейнерам&lt;/h4&gt;\n&lt;p&gt;Если столбец таблицы имеет составной тип данных &lt;code&gt;Composite&lt;/code&gt;, для обращения к полям этого столбца можно использовать следующий синтаксис:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;для доступа к полям структур (&lt;code&gt;struct&lt;/code&gt;) используется точка;&lt;/li&gt;\n&lt;li&gt;для доступа к полям кортежей (&lt;code&gt;tuple&lt;/code&gt;) используется точка, адресация начинается &lt;strong&gt;с нуля&lt;/strong&gt;;&lt;/li&gt;\n&lt;li&gt;для доступа к полям словарей (&lt;code&gt;dict&lt;/code&gt;) используются квадратные скобки;&lt;/li&gt;\n&lt;li&gt;для доступа к полям списков (&lt;code&gt;list&lt;/code&gt;) используются квадратные скобки, адресация начинается &lt;strong&gt;с нуля&lt;/strong&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Корректность обращения к полям структур и кортежей выполняется &lt;strong&gt;до начала&lt;/strong&gt; выполнения запроса. Корректность обращения к полям словарей и списков выполняется &lt;strong&gt;во время&lt;/strong&gt; выполнения запроса.&lt;/p&gt;\n&lt;p&gt;Чтобы воспользоваться этим синтаксисом, необходимо в параметрах запроса указать &lt;code&gt;syntax_version=2&lt;/code&gt;. Начиная с этой версии синтаксиса, для экранирования строк используется символ &lt;code&gt;backtick&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;При обращении к контейнерам необходимо указывать полное имя столбца, включая алиас таблицы.&lt;/p&gt;\n&lt;p&gt;Примеры работы:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs sql\"&gt;t.struct.member,\nt.tuple&lt;span class=\"hljs-number\"&gt;.0&lt;/span&gt;,\nt.dict[\"key\"],\nt.list[&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;+&lt;/span&gt;&lt;span class=\"hljs-number\"&gt;1&lt;/span&gt;]\n&lt;span class=\"hljs-keyword\"&gt;from&lt;/span&gt; `&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;tmp&lt;span class=\"hljs-operator\"&gt;/&lt;/span&gt;test` &lt;span class=\"hljs-keyword\"&gt;as&lt;/span&gt; t;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"519\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-519\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-519\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-519.end+1\" fill=\"freeze\"&gt;&lt;/anima
