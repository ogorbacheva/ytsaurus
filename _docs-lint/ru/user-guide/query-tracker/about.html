        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"vvedenie\"&gt;&lt;a href=\"ru/user-guide/query-tracker/about.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h2&gt;\n&lt;p&gt;Query Tracker — компонент YTsaurus, позволяющий работать с системой с помощью человекочитаемых запросов на SQL-подобных языках. Пользователь отправляет запросы в Query Tracker, они исполняются в движке, и пользователю возвращается результат исполнения.&lt;/p&gt;\n&lt;p&gt;Query Tracker позволяет:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Отправлять произвольные запросы на исполнение.&lt;/li&gt;\n&lt;li&gt;Отслеживать исполнение.&lt;/li&gt;\n&lt;li&gt;Сохранять результаты.&lt;/li&gt;\n&lt;li&gt;Смотреть историю запросов.&lt;/li&gt;\n&lt;li&gt;Делиться запросами с другими.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;a href=\"ru/user-guide/query-tracker/about.html#example\"&gt;Пример работы с Query Tracker&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Запросы характеризуются движком и текстом. Движок контролирует исполнение запроса. Текст запроса специфичен для движка.&lt;/p&gt;\n&lt;p&gt;Таким образом, можно работать с данными, используя разные языки и среды выполнения, достигая заданных гарантий и производительности.&lt;/p&gt;\n&lt;h2 id=\"engines\"&gt;&lt;a href=\"ru/user-guide/query-tracker/about.html#engines\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Движки&lt;/span&gt;&lt;/a&gt;Движки&lt;/h2&gt;\n&lt;p&gt;На текущий момент поддерживаются следующие движки исполнения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"user-guide/dynamic-tables/dyn-query-language.html\"&gt;YT QL&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;Встроенный в YT язык запросов. Поддерживает только динамические таблицы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"yql/index.html\"&gt;YQL&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;Запрос исполняется в YQL агентах. Они разбивают запрос в YT операции (map, reduce, ...), запускают их, собирают и возвращают результат.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/data-processing/chyt/about-chyt.html\"&gt;CHYT&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;Запрос исполняется в клике.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"user-guide/data-processing/spyt/overview.html\"&gt;SPYT&lt;/a&gt;\n&lt;ul&gt;\n&lt;li&gt;Запрос исполняется в Spark кластере.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"api\"&gt;&lt;a href=\"ru/user-guide/query-tracker/about.html#api\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;API&lt;/span&gt;&lt;/a&gt;API&lt;/h2&gt;\n&lt;p&gt;Все операции принимают опциональный параметр &lt;code&gt;query_tracker_stage&lt;/code&gt; — он позволяет выбрать инсталляцию Query Tracker, в которой будут запускаться запросы. Значение по умолчанию — &lt;code&gt;production&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"start-query\"&gt;&lt;a href=\"ru/user-guide/query-tracker/about.html#start-query\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;start_query&lt;/span&gt;&lt;/a&gt;start_query&lt;/h3&gt;\n&lt;p&gt;Отправляет запрос на исполнение. Возвращает идентификатор запроса.&lt;/p&gt;\n&lt;p&gt;Обязательные параметры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;engine&lt;/code&gt; — движок для исполнения запроса. Поддерживаются &lt;code&gt;ql&lt;/code&gt;, &lt;code&gt;yql&lt;/code&gt;, &lt;code&gt;chyt&lt;/code&gt;, &lt;code&gt;spyt&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;query&lt;/code&gt; — текст запроса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Опциональные параметры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;files&lt;/code&gt; — список файлов для запроса в формате YSON.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;settings&lt;/code&gt; — дополнительные параметры для запроса в формате YSON.\n&lt;ul&gt;\n&lt;li&gt;В &lt;a href=\"user-guide/data-processing/chyt/about-chyt.html\"&gt;CHYT&lt;/a&gt; необходимо указывать параметр &lt;code&gt;clique&lt;/code&gt; — алиас клики. По умолчанию используется публичная клика.&lt;/li&gt;\n&lt;li&gt;В &lt;a href=\"user-guide/data-processing/spyt/overview.html\"&gt;SPYT&lt;/a&gt; необходимо указывать параметр &lt;code&gt;discovery_path&lt;/code&gt; — директория для служебных данных существующего кластера Spark.&lt;/li&gt;\n&lt;li&gt;В &lt;a href=\"yql/index.html\"&gt;YQL&lt;/a&gt; можно запускать запрос в разных режимах с помощью параметра &lt;code&gt;execution_mode&lt;/code&gt;. Допустимые значения — &lt;code&gt;run&lt;/code&gt;, &lt;code&gt;validate&lt;/code&gt;, &lt;code&gt;optimize&lt;/code&gt;. Значение по умолчанию — &lt;code&gt;run&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;draft&lt;/code&gt; — является ли запрос черновиком. Такие запросы завершаются автоматически без исполнения.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;annotations&lt;/code&gt; — произвольные аннотации к запросу. Позволяют осуществлять удобный поиск по запросам. В формате YSON.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;access_control_objects&lt;/code&gt; — список объектов в &lt;code&gt;//sys/access_control_object_namespaces/queries/&lt;/code&gt;, который определяет доступ к запросу для других пользователей.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример: &lt;code&gt;start_query(engine=\"yql\", query=\"SELECT * FROM my_table\", access_control_objects=[\"my_aco\"])&lt;/code&gt;&lt;/p&gt;\n&lt;h3 id=\"abort-query\"&gt;&lt;a href=\"ru/user-guide/query-tracker/about.html#abort-query\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;abort_query&lt;/span&gt;&lt;/a&gt;abort_query&lt;/h3&gt;\n&lt;p&gt;Прерывает исполнение запроса. Ничего не возвращает.&lt;/p&gt;\n&lt;p&gt;Обязательные параметры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;query_id&lt;/code&gt; — идентификатор запроса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Опциональные параметры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;message&lt;/code&gt; — сообщение о прерывании.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример: &lt;code&gt;abort_query(query_id=\"my_query_id\")&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"get-query-result\"&gt;&lt;a href=\"ru/user-guide/query-tracker/about.html#get-query-result\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;get_query_result&lt;/span&gt;&lt;/a&gt;get_query_result&lt;/h3&gt;\n&lt;p&gt;Возвращает мета-информацию о результатах исполнения запроса.&lt;/p&gt;\n&lt;p&gt;Обязательные параметры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;query_id&lt;/code&gt; — идентификатор запроса.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;result_index&lt;/code&gt; — идентификатор результата.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример: &lt;code&gt;get_query_result(query_id=\"my_query_id\", result_index=0)&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"read-query-result\"&gt;&lt;a href=\"ru/user-guide/query-tracker/about.html#read-query-result\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;read_query_result&lt;/span&gt;&lt;/a&gt;read_query_result&lt;/h3&gt;\n&lt;p&gt;Возвращает результаты запроса.&lt;/p&gt;\n&lt;p&gt;Обязательные параметры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;query_id&lt;/code&gt; — идентификатор запроса.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;result_index&lt;/code&gt; — идентификатор результата.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Опциональные параметры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;columns&lt;/code&gt; — список колонок для прочтения.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;lower_row_index&lt;/code&gt; — с какой строки результата читать.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;upper_row_index&lt;/code&gt; — до какой строки результата читать.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример: &lt;code&gt;read_query_result(query_id=\"my_query_id\", result_index=0)&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"get-query\"&gt;&lt;a href=\"ru/user-guide/query-tracker/about.html#get-query\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;get_query&lt;/span&gt;&lt;/a&gt;get_query&lt;/h3&gt;\n&lt;p&gt;Возвращает информацию о запросе.&lt;/p&gt;\n&lt;p&gt;Обязательные параметры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;query_id&lt;/code&gt; — идентификатор запроса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Опциональные параметры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;attributes&lt;/code&gt; — фильтр атрибутов для возврата.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;timestamp&lt;/code&gt; — информация о запросе будет консистентна с системой в этот момент времени.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример: &lt;code&gt;get_query(query_id=\"my_query_id\")&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"list-queries\"&gt;&lt;a href=\"ru/user-guide/query-tracker/about.html#list-queries\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;list_queries&lt;/span&gt;&lt;/a&gt;list_queries&lt;/h3&gt;\n&lt;p&gt;Получает список запросов по заданным фильтрам.&lt;/p&gt;\n&lt;p&gt;Опциональные параметры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;from_time&lt;/code&gt; — нижний порог времени запуска запроса.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;to_time&lt;/code&gt; — верхний порог времени запуска запроса.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;cursor_direction&lt;/code&gt; — порядок сортировки запросов по времени запуска.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;cursor_time&lt;/code&gt; — время остановки курсора, действует только при указании &lt;code&gt;cursor_direction&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;user_filter&lt;/code&gt; — фильтр по автору запроса.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;state_filter&lt;/code&gt; — фильтр по состоянию запроса.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;engine_filter&lt;/code&gt; — фильтр по движку запроса.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;substr_filter&lt;/code&gt; — фильтр по идентификатору запроса, аннотациям и &lt;a href=\"ru/user-guide/query-tracker/about.html#access-control\"&gt;access control object&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;limit&lt;/code&gt; — сколько записей возвращать. Значение по умолчанию — 100.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;attributes&lt;/code&gt; — фильтр атрибутов для возврата.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример: &lt;code&gt;list_queries()&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"alter-query\"&gt;&lt;a href=\"ru/user-guide/query-tracker/about.html#alter-query\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;alter_query&lt;/span&gt;&lt;/a&gt;alter_query&lt;/h3&gt;\n&lt;p&gt;Изменяет запрос. Ничего не возвращает.&lt;/p&gt;\n&lt;p&gt;Обязательные параметры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;query_id&lt;/code&gt; — идентификатор запроса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Опциональные параметры:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;annotations&lt;/code&gt; — новые аннотации для запроса.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;access_control_objects&lt;/code&gt; — новый список access control object для запроса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример: &lt;code&gt;alter_query(query_id=\"my_query_id\", access_control_object=[\"my_new_aco\"])&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"access-control\"&gt;&lt;a href=\"ru/user-guide/query-tracker/about.html#access-control\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Access control&lt;/span&gt;&lt;/a&gt;Access control&lt;/h2&gt;\n&lt;p&gt;Для управления доступом к запросам и их результатам, в запрос сохраняется список строк &lt;code&gt;access_control_objects&lt;/code&gt;, которые указывают на &lt;code&gt;//sys/access_control_object_namespaces/queries/[access_control_object]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Access Control Object (ACO) — это объект с атрибутом &lt;code&gt;@principal_acl&lt;/code&gt;, который задаёт правила доступа тем же способом, что и &lt;code&gt;@acl&lt;/code&gt; для нод Кипариса. Подробнее можно почитать в разделе &lt;a href=\"user-guide/storage/access-control.html\"&gt;Контроль доступа&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Создание ACO возможно через пользовательский интерфейс, либо с помощью вызова команды &lt;a href=\"user-guide/storage/cypress-example.html#create\"&gt;create&lt;/a&gt;:&lt;/p&gt;\n&lt;p&gt;&lt;code&gt;yt create access_control_object --attr '{namespace=queries;name=my_aco}'&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Все API используют ACO для проверки доступа:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Use&lt;/code&gt; даёт доступ к запросу.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Read&lt;/code&gt; даёт доступ к результатам запроса.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Administer&lt;/code&gt; даёт доступ к изменению и остановке запроса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Детальная информация по каждому API:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;start_query&lt;/code&gt; проверяет, что переданный ACO существует.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;alter_query&lt;/code&gt; проверяет, что ACO запроса разрешает &lt;code&gt;Administer&lt;/code&gt; для пользователя и переданный ACO существует.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;get_query&lt;/code&gt; проверяет, что ACO запроса разрешает &lt;code&gt;Use&lt;/code&gt; для пользователя.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;list_queries&lt;/code&gt; проверяет, что ACO запроса разрешает &lt;code&gt;Use&lt;/code&gt; для пользователя.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;get_query_result&lt;/code&gt; проверяет, что ACO запроса разрешает &lt;code&gt;Read&lt;/code&gt; для пользователя.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;read_query_result&lt;/code&gt; проверяет, что ACO запроса разрешает &lt;code&gt;Read&lt;/code&gt; для пользователя.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;abort_query&lt;/code&gt; проверяет, что ACO запроса разрешает &lt;code&gt;Administer&lt;/code&gt; для пользователя.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Также есть несколько особенностей:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Создатель запроса всегда имеет доступ к своим запросам.&lt;/li&gt;\n&lt;li&gt;Если в запросе несколько ACO, то для получения доступа достаточно иметь доступ к одному из них.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Для удобства ytsaurus-k8s-operator создаёт следующие ACO:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;nobody&lt;/code&gt;. Ничего не разрешает.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;everyone&lt;/code&gt;. Разрешает всем пользователям &lt;code&gt;Use&lt;/code&gt; и &lt;code&gt;Read&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;everyone-use&lt;/code&gt;. Разрешает всем пользователям &lt;code&gt;Use&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;everyone-share&lt;/code&gt;. Такой же, как everyone, но не отображается в &lt;code&gt;list_queries&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"example\"&gt;&lt;a href=\"ru/user-guide/query-tracker/about.html#example\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пример&lt;/span&gt;&lt;/a&gt;Пример&lt;/h2&gt;\n&lt;p&gt;Типичный сценарий работы с Query Tracker выглядит следующим образом:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Отправляем запрос на исполнение.\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;start_query(engine=\"yql\", query=\"SELECT * from //home/me/my_table\", access_control_objects=[\"my_team_aco\"])&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Получаем список запросов, доступных для нас.\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;list_queries()&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Получаем информацию о нашем запросе.\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;get_query(query_id=\"my_query_id\")&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Дожидаемся завершения запроса.\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;get_query(query_id=\"my_query_id\").state == \"completed\"&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Получаем мета-информацию о результатах (размер результата, схему таблицы).\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;get_query_result(query_id=\"my_query_id\", result_index=0)&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Читаем результат.\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;read_query_result(query_id=\"my_query_id\", result_index=0)&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Меняем ACO запроса, открывая доступ для всех.\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;alter_query(query_id=\"my_query_id\", access_control_objects=[\"everyone\"])&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/query-tracker/about.md","sourcePath":"ru/user-guide/query-tracker/about.md"},"headings":[{"title":"Введение","href":"ru/user-guide/query-tracker/about.html#vvedenie","level":2},{"title":"Движки","href":"ru/user-guide/query-tracker/about.html#engines","level":2},{"title":"API","href":"ru/user-guide/query-tracker/about.html#api","level":2,"items":[{"title":"start_query","href":"ru/user-guide/query-tracker/about.html#start-query","level":3},{"title":"abort_query","href":"ru/user-guide/query-tracker/about.html#abort-query","level":3},{"title":"get_query_result","href":"ru/user-guide/query-tracker/about.html#get-query-result","level":3},{"title":"read_query_result","href":"ru/user-guide/query-tracker/about.html#read-query-result","level":3},{"title":"get_query","href":"ru/user-guide/query-tracker/about.html#get-query","level":3},{"title":"list_queries","href":"ru/user-guide/query-tracker/about.html#list-queries","level":3},{"title":"alter_query","href":"ru/user-guide/query-tracker/about.html#alter-query","level":3}]},{"title":"Access control","href":"ru/user-guide/query-tracker/about.html#access-control","level":2},{"title":"Пример","href":"ru/user-guide/query-tracker/about.html#example","level":2}],"title":"Query Tracker"},"router":{"pathname":"ru/user-guide/query-tracker/about","depth":4,"base":"../../../"},"lang":"ru","
