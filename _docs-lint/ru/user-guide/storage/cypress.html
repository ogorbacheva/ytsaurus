        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе приведено описание Кипариса — дерева метаинформации. Кипарис содержит в себе различную системную информацию, а также данные о том, где хранятся пользовательские данные. Раздел состоит из трех частей, описывающих &lt;a href=\"ru/user-guide/storage/cypress.html#description\"&gt;общее представление дерева&lt;/a&gt;, &lt;a href=\"ru/user-guide/storage/cypress.html#attributes\"&gt;атрибуты узлов Кипариса&lt;/a&gt; и &lt;a href=\"ru/user-guide/storage/cypress.html#TTL\"&gt;TTL для узлов Кипариса&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"description\"&gt;&lt;a href=\"ru/user-guide/storage/cypress.html#description\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общее представление дерева&lt;/span&gt;&lt;/a&gt;Общее представление дерева&lt;/h2&gt;\n&lt;p&gt;С пользовательской точки зрения Кипарис похож на дерево &lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A4%D0%B0%D0%B9%D0%BB%D0%BE%D0%B2%D0%B0%D1%8F_%D1%81%D0%B8%D1%81%D1%82%D0%B5%D0%BC%D0%B0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;файловой системы&lt;/a&gt; в Linux, но имеет ряд существенных отличий. Во-первых, с каждым узлом в дереве связан &lt;a href=\"user-guide/storage/attributes.html\"&gt;набор атрибутов&lt;/a&gt;, в том числе задаваемых пользователем. Во-вторых, дерево является &lt;a href=\"user-guide/storage/transactions.html\"&gt;транзакционным&lt;/a&gt;. В третьих, в качестве узла Кипариса могут быть не только файлы и директории, но и &lt;a href=\"user-guide/storage/objects.html\"&gt;другие объекты&lt;/a&gt;. По аналогии с файловой системой в Кипарисе поддерживается &lt;a href=\"user-guide/storage/access-control.html\"&gt;система контроля доступов&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Корневым элементом Кипариса является &lt;code&gt;/&lt;/code&gt;, который имеет тип &lt;strong&gt;map_node&lt;/strong&gt; (то есть является директорией). Адресация узлов в Кипарисе осуществляется с помощью &lt;a href=\"user-guide/storage/ypath.html\"&gt;YPath&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Примеры путей: &lt;code&gt;//tmp&lt;/code&gt; – временная директория, &lt;code&gt;//tmp/@&lt;/code&gt; – атрибуты этой директории, &lt;code&gt;//tmp/table/@type&lt;/code&gt; – путь до атрибута &lt;code&gt;type&lt;/code&gt; узла &lt;code&gt;//tmp/table&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;С использованием YPath Кипарис может быть изображен следующим образом:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;/\n  /home\n    /user1\n      /table\n        /@id\n        /@chunk_ids\n        /@type\n        ...\n      ...\n    /user2\n    ...\n  /tmp\n  /sys\n    /chunks\n      ...\n    ...\n  ...\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"18\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-18\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-18\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-18.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;С Кипарисом можно работать с помощью &lt;a href=\"api/cli/cli.html\"&gt;CLI&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"attributes\"&gt;&lt;a href=\"ru/user-guide/storage/cypress.html#attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атрибуты узлов Кипариса&lt;/span&gt;&lt;/a&gt;Атрибуты узлов Кипариса&lt;/h2&gt;\n&lt;p&gt;Помимо атрибутов, общих для всех объектов, узлы Кипариса имеют дополнительные атрибуты, представленные в таблице:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Атрибут&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Тип&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Значение&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;parent_id&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор узла-родителя (отсутствует в корне)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;locks&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;array&amp;lt;Lock&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"user-guide/storage/transactions.html\"&gt;Список блокировок&lt;/a&gt;, взятых на узел&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;lock_mode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;LockMode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Текущий &lt;a href=\"user-guide/storage/transactions.html\"&gt;режим блокировки&lt;/a&gt; узла (зависит от транзакции)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Полный путь к узлу&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;key&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ключ, по которому данный узел доступен в родительском каталоге (если узел лежит в таковом)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;creation_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;DateTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время &lt;a href=\"ru/user-guide/storage/cypress.html#time_attributes\"&gt;создания&lt;/a&gt; узла&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;modification_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;DateTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время &lt;a href=\"ru/user-guide/storage/cypress.html#time_attributes\"&gt;последней модификации&lt;/a&gt; узла&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;access_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;DateTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время &lt;a href=\"ru/user-guide/storage/cypress.html#time_attributes\"&gt;последнего доступа&lt;/a&gt; к узлу&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;expiration_time&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;DateTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Время, когда узел будет &lt;a href=\"ru/user-guide/storage/cypress.html#TTL\"&gt;автоматически удален&lt;/a&gt;. Опциональный атрибут&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;expiration_timeout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;DateTime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Интервал времени, после которого узел будет &lt;a href=\"ru/user-guide/storage/cypress.html#TTL\"&gt;автоматически удален&lt;/a&gt;, если к нему не было обращений. Опциональный атрибут&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;access_counter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;integer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Количество обращений к узлу с момента создания&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;revision&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;integer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/user-guide/storage/cypress.html#time_attributes\"&gt;Ревизия&lt;/a&gt; узла&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;resource_usage&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ClusterResources&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ресурсы кластера, занимаемые узлом&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;recursive_resource_usage&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;ClusterResources&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ресурсы кластера, занимаемые узлом и всем его поддеревом&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;account&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Аккаунт, используемый при учете ресурсов, занимаемых данным узлом&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;annotation&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Человекочитаемая &lt;a href=\"user-guide/storage/annotations.html\"&gt;аннотация&lt;/a&gt; объекта&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Каждый узел имеет свой дескриптор, отвечающий за управление доступом, поэтому среди его атрибутов есть &lt;code&gt;inherit_acl&lt;/code&gt;, &lt;code&gt;acl&lt;/code&gt; и &lt;code&gt;owner&lt;/code&gt;. Подробнее можно прочитать в разделе &lt;a href=\"user-guide/storage/access-control.html\"&gt;Система контроля доступов&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"time_attributes\"&gt;&lt;a href=\"ru/user-guide/storage/cypress.html#time_attributes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атрибуты времени&lt;/span&gt;&lt;/a&gt;Атрибуты времени&lt;/h3&gt;\n&lt;p&gt;Атрибут &lt;code&gt;creation_time&lt;/code&gt; хранит время, когда узел был создан. Атрибут &lt;code&gt;modification_time&lt;/code&gt; хранит время, когда узел или его атрибуты в последний раз изменялись. Атрибут &lt;code&gt;modification_time&lt;/code&gt; не учитывает изменение сыновей узла, т.е. атрибут &lt;code&gt;modification_time&lt;/code&gt; у &lt;code&gt;map_node&lt;/code&gt; не меняется, если где-то в глубине дерева происходят изменения.&lt;/p&gt;\n&lt;p&gt;При создании и при каждом изменении узла система обновляет его атрибут &lt;code&gt;revision&lt;/code&gt;. В нем хранится неотрицательное целое число. Гарантируется, что ревизия с течением времени растет строго монотонно. Ревизии можно использовать для проверки того факта, что узел не изменился. Атрибут &lt;code&gt;revision&lt;/code&gt; изменяется одновременно с &lt;code&gt;modification_time&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Атрибут &lt;code&gt;access_time&lt;/code&gt; хранит время последнего обращения к содержимому узла. Обращение к атрибутам при этом не учитывается. Также, для повышения эффективности система не изменяет данный атрибут на каждое обращение, а накапливает факты обращений и обновляет атрибут &lt;code&gt;access_time&lt;/code&gt; с периодичностью порядка секунды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В редких случаях возможна ситуация, когда к узлу было обращение, но в результате сбоя мастер-сервера атрибут &lt;code&gt;access_time&lt;/code&gt; не будет обновлен.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Атрибуты &lt;code&gt;modification_time&lt;/code&gt; и &lt;code&gt;access_time&lt;/code&gt; для динамических таблиц в настоящий момент не несут в себе никакой полезной информации. Их обновление (или необновление) никак не связано с операциями чтения и записи, выполняемыми пользователями. В будущем данное поведение может измениться.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для большинства команд, при помощи которых происходит чтение или запись, существуют опции &lt;code&gt;suppress_access_tracking&lt;/code&gt; и &lt;code&gt;suppress_modification_tracking&lt;/code&gt;, которые позволяют отключить обновления атрибутов &lt;code&gt;access_time&lt;/code&gt;, &lt;code&gt;modification_time&lt;/code&gt; и &lt;code&gt;revision&lt;/code&gt; при чтении и записи соответственно. В частности, веб-интерфейс использует &lt;code&gt;suppress_access_tracking&lt;/code&gt;, так что просмотры содержимого через web UI не приводят к обновлению &lt;code&gt;access_time&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В случае создания или модификации узла под транзакцией описанные атрибуты устанавливаются один раз: во время изменений внутри транзакции. Таким образом, узел может стать виден в родительских транзакциях существенно позже, чем его &lt;code&gt;creation_time&lt;/code&gt;, только после коммита соответствующей транзакции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"TTL\"&gt;&lt;a href=\"ru/user-guide/storage/cypress.html#TTL\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TTL для узлов Кипариса&lt;/span&gt;&lt;/a&gt;TTL для узлов Кипариса&lt;/h2&gt;\n&lt;p&gt;Кипарис может автоматически удалять узлы по наступлении указанного момента времени или в случае отсутствия обращений к узлу на протяжении указанного интервала времени. Для управления этой возможностью существуют атрибуты &lt;code&gt;expiration_time&lt;/code&gt; и &lt;code&gt;expiration_timeout&lt;/code&gt;. По умолчанию атрибуты отсутствуют, в этом случае система не будет автоматически удалять узел. Для работы TTL необходимо:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;указать в атрибуте &lt;code&gt;expiration_time&lt;/code&gt; момент времени, при наступлении которого узел будет удален. Если узел композитный, то будет также удалено все его поддерево;&lt;/li&gt;\n&lt;li&gt;указать в атрибуте &lt;code&gt;expiration_timeout&lt;/code&gt; интервал времени, в течение которого к узлу должны отсутствовать обращения, чтобы узел (и все его поддерево, если узел композитный) был удален.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данные, удаленные с помощью описанного механизма, невозможно восстановить. Используйте его с осторожностью.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Момент времени необходимо указать либо строкой в isoformat, либо целым числом миллисекунд с начала эпохи. Эти способы эквивалентны:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/project/path/table/@expiration_time &lt;span class=\"hljs-string\"&gt;'\"2020-05-16 15:12:34.591+03:00\"'&lt;/span&gt;\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/project/path/table/@expiration_time &lt;span class=\"hljs-string\"&gt;'1589631154591'&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"300\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-300\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-300\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-300.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Интервал времени указывается в миллисекундах:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-comment\"&gt;# Удалить узел, если его «не трогали» неделю.&lt;/span&gt;\nyt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/project/path/table/@expiration_timeout 604800000\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"304\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-304\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-304\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-304.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Указывать &lt;code&gt;expiration_timeout&lt;/code&gt; на директориях следует с чрезвычайной осторожностью. Время жизни директории продлевают только непосредственные обращения к ней, но не к ее поддереву. Так, например, чтение таблицы, содержащейся в директории с &lt;code&gt;expiration_timeout&lt;/code&gt;, &lt;em&gt;не продлевает&lt;/em&gt; ее время жизни.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Данные атрибуты можно менять в транзакциях, однако эффект имеют только их закоммиченные значения.&lt;/p&gt;\n&lt;p&gt;Чтобы выставлять данные атрибуты для узла, необходимо иметь &lt;a href=\"user-guide/storage/access-control.html\"&gt;право&lt;/a&gt; &lt;code&gt;write&lt;/code&gt; на сам узел, как и для многих других атрибутов, а также &lt;code&gt;remove&lt;/code&gt; для данного узла и всего его поддерева, так как фактически заказывается удаление, хоть и отложенное. Чтобы удалить данные атрибуты, достаточно права &lt;code&gt;write&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Система не дает никаких гарантий точности времени удаления. На практике удаление происходит в пределах единиц секунд после наступления указанного времени.&lt;/p&gt;\n&lt;p&gt;Автоматическое удаление узла не наступает, если в момент наступления указанного времени на узле есть блокировки, отличные от &lt;code&gt;snapshot&lt;/code&gt;. Система удалит узел, как только все блокировки будут сняты. Этим свойством можно пользоваться для искусственного продления времени жизни узла.&lt;/p&gt;\n&lt;p&gt;При копировании и перемещении узла атрибуты &lt;code&gt;expiration_time&lt;/code&gt; и &lt;code&gt;expiration_timeout&lt;/code&gt; по умолчанию сбрасываются, так что копия не будет автоматически удалена. У команд есть опции &lt;code&gt;preserve-expiration-time&lt;/code&gt; и &lt;code&gt;preserve-expiration-timeout&lt;/code&gt;, позволяющие поменять поведение.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ряд вызовов API, создающих временные таблицы, устанавливают на них &lt;code&gt;expiration_time&lt;/code&gt;/&lt;code&gt;expiration_timeout&lt;/code&gt;, чтобы таблицы самоочищались. Следует иметь это в виду и не хранить в таких таблицах важные данные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Удаление может произойти раньше, если узел находится в поддереве с меньшим значением &lt;code&gt;expiration_time&lt;/code&gt;/&lt;code&gt;expiration_timeout&lt;/code&gt; в корне. Чтобы получить фактическое время удаления узла, можно воспользоваться атрибутом &lt;code&gt;effective_expiration&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //home/project/path/table/@effective_expiration\n{\n  &lt;span class=\"hljs-string\"&gt;\"time\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;: 42, &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt;: //testator/path}\n  &lt;span class=\"hljs-string\"&gt;\"timeout\"&lt;/span&gt;: {&lt;span class=\"hljs-string\"&gt;\"value\"&lt;/span&gt;: 42, &lt;span class=\"hljs-string\"&gt;\"path\"&lt;/span&gt;: //testator/path}\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"343\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-343\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-343\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-343.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;При отсутствии, например, &lt;code&gt;expiration_time&lt;/code&gt; на пути от корня до узла, в поле &lt;code&gt;\"time\"&lt;/code&gt; будет записано YSON entity.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/storage/cypress.md","sourcePath":"ru/user-guide/storage/cypress.md"},"headings":[{"title":"Общее представление дерева","href":"ru/user-guide/storage/cypress.html#description","level":2},{"title":"Атрибуты узлов Кипариса","href":"ru/user-guide/storage/cypress.html#attributes","level":2,"items":[{"title":"Атрибуты времени","href":"ru/user-guide/storage/cypress.html#time_attributes","level":3}]},{"title":"TTL для узлов Кипариса","href":"ru/user-guide/storage/cypress.html#TTL","level":2}],"title":"Дерево метаинформации"},"router":{"pathname":"ru/user-guide/storage/cypress","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
