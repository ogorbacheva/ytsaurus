        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе приведены примеры работы с объектами Кипариса.&lt;/p&gt;\n&lt;h2 id=\"static_tables\"&gt;&lt;a href=\"ru/user-guide/storage/examples.html#static_tables\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статические таблицы&lt;/span&gt;&lt;/a&gt;Статические таблицы&lt;/h2&gt;\n&lt;h3 id=\"create_table\"&gt;&lt;a href=\"ru/user-guide/storage/examples.html#create_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создание&lt;/span&gt;&lt;/a&gt;Создание&lt;/h3&gt;\n&lt;p&gt;Для создания таблицы используется команда &lt;code&gt;create&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt create table //home/dev/test_table\n1282c-1ed72c-3fe0191-443cf2ee\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"12\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-12\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-12\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-12.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"remove_table\"&gt;&lt;a href=\"ru/user-guide/storage/examples.html#remove_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Удаление&lt;/span&gt;&lt;/a&gt;Удаление&lt;/h3&gt;\n&lt;p&gt;Для удаления таблицы используется команда &lt;code&gt;remove&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt remove //home/dev/test_table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"19\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-19\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-19\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-19.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"read_table\"&gt;&lt;a href=\"ru/user-guide/storage/examples.html#read_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чтение&lt;/span&gt;&lt;/a&gt;Чтение&lt;/h3&gt;\n&lt;p&gt;Чтобы прочитать существующую таблицу &lt;code&gt;&amp;lt;table&amp;gt;&lt;/code&gt;, используйте команду &lt;code&gt;read-table&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt read-table [--format FORMAT]\n                [--table-reader TABLE_READER]\n                &amp;lt;table&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"26\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-26\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-26\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-26.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опция &lt;code&gt;--format&lt;/code&gt; определяет формат выходных данных. Поддерживаются форматы &lt;code&gt;json&lt;/code&gt;, &lt;code&gt;yson&lt;/code&gt;, &lt;code&gt;dsv&lt;/code&gt; и &lt;code&gt;schemaful_dsv&lt;/code&gt;. Подробнее можно прочитать в разделе &lt;a href=\"user-guide/storage/formats.html\"&gt;Форматы&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt read-table --format dsv //home/dev/test_table\nday=monday\t&lt;span class=\"hljs-keyword\"&gt;time&lt;/span&gt;=10\nday=wednesday\t&lt;span class=\"hljs-keyword\"&gt;time&lt;/span&gt;=20\nday=friday\t&lt;span class=\"hljs-keyword\"&gt;time&lt;/span&gt;=30\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"30\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-30\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-30\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-30.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опция &lt;code&gt;--table-reader&lt;/code&gt; позволяет изменять параметры чтения из таблицы.&lt;/p&gt;\n&lt;h4 id=\"sampling_rate\"&gt;&lt;a href=\"ru/user-guide/storage/examples.html#sampling_rate\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Семплирование&lt;/span&gt;&lt;/a&gt;Семплирование&lt;/h4&gt;\n&lt;p&gt;Атрибут &lt;code&gt;sampling_rate&lt;/code&gt; задает процент данных, которые необходимо прочесть из входной таблицы.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt read-table --format dsv --table-reader &lt;span class=\"hljs-string\"&gt;'{\"sampling_rate\"=0.3}'&lt;/span&gt; //home/dev/test_table\nday=monday\t&lt;span class=\"hljs-keyword\"&gt;time&lt;/span&gt;=10\nday=friday\t&lt;span class=\"hljs-keyword\"&gt;time&lt;/span&gt;=30\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"40\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-40\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-40\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-40.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В данном примере команда &lt;code&gt;read-table&lt;/code&gt; вернет 30% всех строк из входной таблицы.&lt;/p&gt;\n&lt;p&gt;Атрибут &lt;code&gt;sampling_seed&lt;/code&gt; управляет генератором случайных чисел, который отбирает строки. Гарантируется, что при одинаковом &lt;code&gt;sampling_seed&lt;/code&gt; и том же наборе входных чанков будет сгенерирован одинаковый выход. Если атрибут &lt;code&gt;sampling_seed&lt;/code&gt; не был указан, то он будет случайным.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt read-table --format dsv --table-reader &lt;span class=\"hljs-string\"&gt;'{\"sampling_seed\"=42;\"sampling_rate\"=0.3}'&lt;/span&gt; //home/dev/test_table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"47\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-47\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-47\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-47.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Чтобы поместить результат семплирования в другую таблицу, запустите &lt;code&gt;map&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt map &lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; --src //home/dev/input --dst //home/dev/output --spec &lt;span class=\"hljs-string\"&gt;'{job_io = {table_reader = {sampling_rate = 0.001}}}'&lt;/span&gt; --format yson\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"51\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-51\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-51\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-51.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При использовании семплирования независимо от указанного атрибута &lt;code&gt;sampling_rate&lt;/code&gt; все данные читаются с диска.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"write_table\"&gt;&lt;a href=\"ru/user-guide/storage/examples.html#write_table\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Перезапись&lt;/span&gt;&lt;/a&gt;Перезапись&lt;/h3&gt;\n&lt;p&gt;Команда &lt;code&gt;write-table&lt;/code&gt; перезаписывает существующую таблицу &lt;code&gt;&amp;lt;table&amp;gt;&lt;/code&gt; переданными данными.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt write-table [--format FORMAT]\n                 [--table-writer TABLE_WRITER]\n                 &amp;lt;table&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"68\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-68\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-68\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-68.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опция &lt;code&gt;--format&lt;/code&gt; определяет формат входных данных. Поддерживаются форматы &lt;code&gt;json&lt;/code&gt;, &lt;code&gt;yson&lt;/code&gt;, &lt;code&gt;dsv&lt;/code&gt; и &lt;code&gt;schemaful_dsv&lt;/code&gt;. Подробнее можно прочитать в разделе &lt;a href=\"user-guide/storage/formats.html\"&gt;Форматы&lt;/a&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt write-table --format dsv //home/dev/test_table\n&lt;span class=\"hljs-keyword\"&gt;time&lt;/span&gt;=10\tday=monday\n&lt;span class=\"hljs-keyword\"&gt;time&lt;/span&gt;=20\tday=wednesday\n&lt;span class=\"hljs-keyword\"&gt;time&lt;/span&gt;=30 day=friday\n^D\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"72\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-72\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-72\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-72.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Чтобы добавить записи в таблицу, используйте опцию &lt;code&gt;&amp;lt;append=true&amp;gt;&lt;/code&gt; перед путем таблицы.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; test_table.json\n{&lt;span class=\"hljs-string\"&gt;\"time\"&lt;/span&gt;:&lt;span class=\"hljs-string\"&gt;\"10\"&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;\"day\"&lt;/span&gt;:&lt;span class=\"hljs-string\"&gt;\"monday\"&lt;/span&gt;}\n{&lt;span class=\"hljs-string\"&gt;\"time\"&lt;/span&gt;:&lt;span class=\"hljs-string\"&gt;\"20\"&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;\"day\"&lt;/span&gt;:&lt;span class=\"hljs-string\"&gt;\"wednesday\"&lt;/span&gt;}\n{&lt;span class=\"hljs-string\"&gt;\"time\"&lt;/span&gt;:&lt;span class=\"hljs-string\"&gt;\"30\"&lt;/span&gt;,&lt;span class=\"hljs-string\"&gt;\"day\"&lt;/span&gt;:&lt;span class=\"hljs-string\"&gt;\"friday\"&lt;/span&gt;}\n&lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; test_table.json | yt write-table --format json &lt;span class=\"hljs-string\"&gt;\"&amp;lt;append=true&amp;gt;\"&lt;/span&gt;//home/dev/test_table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"76\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-76\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-76\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-76.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Опция &lt;code&gt;--table-writer&lt;/code&gt; позволяет изменять параметры записи в таблицу:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/user-guide/storage/examples.html#max_row_weight\"&gt;ограничение на размер строки в таблице;&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/user-guide/storage/examples.html#desired_chunk_size\"&gt;размер чанка;&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/user-guide/storage/examples.html#replication_factor\"&gt;коэффициент репликации.&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h5 id=\"max_row_weight\"&gt;&lt;a href=\"ru/user-guide/storage/examples.html#max_row_weight\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничение на размеры строк в таблице&lt;/span&gt;&lt;/a&gt;Ограничение на размеры строк в таблице&lt;/h5&gt;\n&lt;p&gt;При записи табличных данных система YTsaurus проверяет их размер. Запись завершится ошибкой, если размер превысит максимально допустимое значение.&lt;br /&gt;\nПо умолчанию максимальный размер строки — 16 МБ. Чтобы изменить это значение, используйте опцию &lt;code&gt;--table-writer&lt;/code&gt;, параметр &lt;code&gt;max_row_weight&lt;/code&gt;. Укажите значение в байтах.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; test_table.json | yt write-table --format json --table-writer {&lt;span class=\"hljs-string\"&gt;\"max_row_weight\"&lt;/span&gt;=33554432} //home/dev/test_table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"103\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-103\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-103\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-103.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Значение параметра &lt;code&gt;max_row_weight&lt;/code&gt; не может превышать 128 МБ.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"desired_chunk_size\"&gt;&lt;a href=\"ru/user-guide/storage/examples.html#desired_chunk_size\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Размер чанка&lt;/span&gt;&lt;/a&gt;Размер чанка&lt;/h4&gt;\n&lt;p&gt;Атрибут &lt;code&gt;desired_chunk_size&lt;/code&gt; определяет размер чанка в байтах.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; test_table.json | yt write-table --format json --table-writer {&lt;span class=\"hljs-string\"&gt;\"desired_chunk_size\"&lt;/span&gt;=1024} //home/dev/test_table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"120\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-120\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-120\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-120.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"replication_factor\"&gt;&lt;a href=\"ru/user-guide/storage/examples.html#replication_factor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Коэффициент репликации&lt;/span&gt;&lt;/a&gt;Коэффициент репликации&lt;/h4&gt;\n&lt;p&gt;Количество реплик чанков таблицы задается атрибутом &lt;code&gt;replication_factor&lt;/code&gt;. По умолчанию оно равно 3.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt get //home/dev/test_table/@replication_factor\n3\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"127\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-127\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-127\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-127.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Коэффициент репликации можно менять:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/dev/test_table/@replication_factor 5\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"131\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-131\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-131\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-131.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;В этом случае преобразование произойдет через некоторое время в фоновом режиме.&lt;/p&gt;\n&lt;p&gt;Управление коэффициентом репликации &lt;em&gt;новых&lt;/em&gt; чанков таблицы осуществляется опциями &lt;code&gt;min_upload_replication_factor&lt;/code&gt; и  &lt;code&gt;upload_replication_factor&lt;/code&gt;. Опция &lt;code&gt;upload_replication_factor&lt;/code&gt; задает количество реплик, создаваемых синхронно во время записи новых данных в таблицу. Опция &lt;code&gt;min_upload_replication_factor&lt;/code&gt; задает минимальное количество реплик, которые должны быть успешно записаны, чтобы запись чанка считалась успешной. Значение по умолчанию обоих атрибутов — 2, максимальное значение — 10.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; test_table.json | yt write-table --format json --table-writer &lt;span class=\"hljs-string\"&gt;'{\"upload_replication_factor\"=5;\"min_upload_replication_factor\"=3}'&lt;/span&gt; //home/dev/test_table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"138\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-138\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-138\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-138.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Новые чанки, добавляемые в таблицу, будут получать коэффициент репликации, установленный в опции &lt;code&gt;upload_replication_factor&lt;/code&gt;; далее фоновый процесс будет асинхронно реплицировать их для достижения установленного на таблице коэффициента репликации.&lt;/p&gt;\n&lt;h3 id=\"medium\"&gt;&lt;a href=\"ru/user-guide/storage/examples.html#medium\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Медиум&lt;/span&gt;&lt;/a&gt;Медиум&lt;/h3&gt;\n&lt;p&gt;Чтобы переместить таблицу в другой медиум, измените значение атрибута &lt;code&gt;primary_medium&lt;/code&gt;.&lt;br /&gt;\nНовые данные, записываемые в таблицу, будут сразу попадать на новый медиум, старые данные будут перемещены в фоновом режиме.&lt;br /&gt;\nЧтобы форсированно переместить данные в новый медиум, запустите операцию Merge:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;yt &lt;span class=\"hljs-built_in\"&gt;set&lt;/span&gt; //home/dev/test_table/@primary_medium ssd_blobs\nyt merge --mode auto --spec &lt;span class=\"hljs-string\"&gt;'{\"force_transform\"=true;}'&lt;/span&gt; --src //home/dev/test_table --dst //home/dev/test_table\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"148\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-148\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-148\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-148.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Чтобы проверить, изменился ли медиум, в котором находится таблица, выполните команду.&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;$ yt get //home/dev/test_table/@chunk_media_statistics\n\n{\n    &lt;span class=\"hljs-string\"&gt;\"ssd_blobs\"&lt;/span&gt; = {\n        &lt;span class=\"hljs-string\"&gt;\"chunk_count\"&lt;/span&gt; = 2126;\n        &lt;span class=\"hljs-string\"&gt;\"uncompressed_data_size\"&lt;/span&gt; = 9667220402266;\n        &lt;span class=\"hljs-string\"&gt;\"compressed_data_size\"&lt;/span&gt; = 4954465956017;\n        &lt;span class=\"hljs-string\"&gt;\"data_weight\"&lt;/span&gt; = 10764306825793;\n        &lt;span class=\"hljs-string\"&gt;\"max_block_size\"&lt;/span&gt; = 6584787;\n    };\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"152\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-152\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-152\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-152.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Объем указан в байтах.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.5.3"}],"vcsPath":"ru/user-guide/storage/examples.md","sourcePath":"ru/user-guide/storage/examples.md"},"headings":[{"title":"Статические таблицы","href":"ru/user-guide/storage/examples.html#static_tables","level":2,"items":[{"title":"Создание","href":"ru/user-guide/storage/examples.html#create_table","level":3},{"title":"Удаление","href":"ru/user-guide/storage/examples.html#remove_table","level":3},{"title":"Чтение","href":"ru/user-guide/storage/examples.html#read_table","level":3,"items":[{"title":"Семплирование","href":"ru/user-guide/storage/examples.html#sampling_rate","level":4}]},{"title":"Перезапись","href":"ru/user-guide/storage/examples.html#write_table","level":3,"items":[{"title":"Размер чанка","href":"ru/user-guide/storage/examples.html#desired_chunk_size","level":4},{"title":"Коэффициент репликации","href":"ru/user-guide/storage/examples.html#replication_factor","level":4}]},{"title":"Медиум","href":"ru/user-guide/storage/examples.html#medium","level":3}]}],"title":"Примеры работы с объектами Кипариса"},"router":{"pathname":"ru/user-guide/storage/examples","depth":4,"base":"../../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc":true,"search":true,"feedback":true},"search":{"provider":"algolia","api":"_search/api.js","link":"_search/ru/index.html","appId":"WW7EWG7Y6T","indexName":"ytsaurus-docs-a29ea7877730322f2ce693378d06d02ac2b374cd-ru","searchApiKey":"f039bc42de5c29003db67eb703353c1d","querySettings":{}}}
