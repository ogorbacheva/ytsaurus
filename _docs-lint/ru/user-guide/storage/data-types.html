            {"data":{"leading":false,"html":"&lt;p&gt;В данном разделе описано, какие типы данных поддерживает YTsaurus, как они описываются в схеме и как они представляются в форматах.&lt;/p&gt;\n&lt;h2 id=\"overview\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#overview\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общая информация&lt;/span&gt;&lt;/a&gt;Общая информация&lt;/h2&gt;\n&lt;p&gt;YTsaurus поддерживает набор примитивных типов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;string&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;integer&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;boolean&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;float&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;double&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;date&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;datetime&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;timestamp&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;interval&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;А так же следующие композитные (сложные) типы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;optional&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;list&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;struct&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;tuple&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;variant&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;tagged&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Задать тип в схеме таблицы можно одним из двух способов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;с помощью ключей &lt;code&gt;type&lt;/code&gt; и (необязательно) &lt;code&gt;required&lt;/code&gt; — исторически первый способ, но так можно задать лишь примитивные или опциональные примитивные типы;&lt;/li&gt;\n&lt;li&gt;с помощью ключа &lt;code&gt;type_v3&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В ключе &lt;code&gt;type&lt;/code&gt; всегда ожидается строка.&lt;br /&gt;\nВ ключе &lt;code&gt;type_v3&lt;/code&gt; ожидается либо строка для примитивных типов, либо YSON-словарь.&lt;br /&gt;\nYSON-словарь всегда имеет ключ &lt;code&gt;type_name&lt;/code&gt;, в котором хранится имя типа.&lt;br /&gt;\nОстальные ключи зависят от конкретного типа и описаны ниже.&lt;/p&gt;\n&lt;h2 id=\"schema\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#schema\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Описание типов в схеме&lt;/span&gt;&lt;/a&gt;Описание типов в схеме&lt;/h2&gt;\n&lt;h3 id=\"schema_primitive\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#schema_primitive\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примитивные типы&lt;/span&gt;&lt;/a&gt;Примитивные типы&lt;/h3&gt;\n&lt;p&gt;Примитивные типы можно задать в схеме как с помощью ключа &lt;code&gt;type&lt;/code&gt;, так и с помощью ключа &lt;code&gt;type_v3&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Если примитивный тип &lt;code&gt;T&lt;/code&gt; задаётся с помощью &lt;code&gt;type&lt;/code&gt;, YTsaurus дополнительно проверит ключ &lt;code&gt;required&lt;/code&gt; в схеме:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;required=%true&lt;/code&gt; — колонка будет иметь строго заданный тип. Значение &lt;code&gt;Null&lt;/code&gt; или отсутствие значения не допускаются;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;required=%false&lt;/code&gt; — колонка будет иметь тип &lt;code&gt;optional&amp;lt;T&amp;gt;&lt;/code&gt; — будут допустимы все значения примитивного типа и значение &lt;code&gt;Null&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В таблице перечислены поддерживаемые типы и их представление в ключах &lt;code&gt;type&lt;/code&gt;/&lt;code&gt;type_v3&lt;/code&gt;.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Описание&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Представление в &lt;code&gt;type&lt;/code&gt;&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Представление в &lt;code&gt;type_v3&lt;/code&gt;&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;целое число в диапазоне &lt;code&gt;[-2^63, 2^63-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int64&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;целое число в диапазоне &lt;code&gt;[-2^31, 2^31-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int32&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int32&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;целое число в диапазоне &lt;code&gt;[-2^15, 2^15-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int16&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int16&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;целое число в диапазоне &lt;code&gt;[-2^7, 2^7-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;int8&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;целое число в диапазоне &lt;code&gt;[0, 2^64-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;целое число в диапазоне &lt;code&gt;[0, 2^32-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint32&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint32&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;целое число в диапазоне &lt;code&gt;[0, 2^16-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint16&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint16&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;целое число в диапазоне &lt;code&gt;[0, 2^8-1]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uint8&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;вещественное 8-байтное число&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;double&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;double&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;вещественное 4-байтное число&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;float&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;float&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;стандартный булев тип &lt;code&gt;true/false&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;boolean&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;bool&lt;/code&gt; (отличие от &lt;code&gt;type&lt;/code&gt;)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;произвольная последовательность байт&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;корректная UTF8 последовательность&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;utf8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;utf8&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;строка, содержащая валидный &lt;a href=\"https://en.wikipedia.org/wiki/JSON\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;JSON&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;json&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;json&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Universally_unique_identifier\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;UUID&lt;/a&gt;, произвольная последовательность 16 байт (хранится бинарное представление)&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uuid&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;uuid&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;целое число в диапазоне &lt;code&gt;[-53375809, 53375808 - 1]&lt;/code&gt;, &lt;br /&gt; выражает число дней, прошедших с unix-эпохи; &lt;br /&gt; выражаемый диапазон времени около 145'000 лет в прошлое и в будущее &lt;br /&gt; см. раздел про &lt;a href=\"ru/user-guide/storage/data-types.html#temporal_types\"&gt;временные типы&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;date32&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;date32&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;целое число в диапазоне &lt;code&gt;[-53375809 * 86400, 53375808 * 86400 - 1]&lt;/code&gt;, &lt;br /&gt; выражает число секунд, прошедших с unix-эпохи; &lt;br /&gt; выражаемый диапазон времени около 145'000 лет в прошлое и в будущее &lt;br /&gt; см. раздел про &lt;a href=\"ru/user-guide/storage/data-types.html#temporal_types\"&gt;временные типы&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;datetime64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;datetime64&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;целое число в диапазоне &lt;code&gt;[-53375809 * 86400 * 10^6, 53375808 * 86400 * 10^6 - 1]&lt;/code&gt;, &lt;br /&gt; выражает число микросекунд, прошедших с unix-эпохи; &lt;br /&gt; выражаемый диапазон времени около 145'000 лет в прошлое и в будущее &lt;br /&gt; см. раздел про &lt;a href=\"ru/user-guide/storage/data-types.html#temporal_types\"&gt;временные типы&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;timestamp64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;timestamp64&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;целое число в диапазоне &lt;code&gt;[-9223339708800000000, 9223339708800000000]&lt;/code&gt;, &lt;br /&gt; выражает число микросекунд между двумя таймстемпами типа &lt;code&gt;timestamp64&lt;/code&gt; &lt;br /&gt; см. раздел про &lt;a href=\"ru/user-guide/storage/data-types.html#temporal_types\"&gt;временные типы&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;interval64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;interval64&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;целое число в диапазоне &lt;code&gt;[0, 49673 - 1]&lt;/code&gt;, &lt;br /&gt; выражает число дней, прошедших с unix-эпохи; &lt;br /&gt; выражаемый диапазон дат: &lt;code&gt;[1970-01-01, 2105-12-31]&lt;/code&gt;  &lt;br /&gt; см. раздел про &lt;a href=\"ru/user-guide/storage/data-types.html#temporal_types\"&gt;временные типы&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;date&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;date&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;целое число в диапазоне &lt;code&gt;[0, 49673 * 86400 - 1]&lt;/code&gt;, &lt;br /&gt; выражает число секунд, прошедших с unix-эпохи; &lt;br /&gt; выражаемый диапазон времён: &lt;code&gt;[1970-01-01T00:00:00Z, 2105-12-31T23:59:59Z]&lt;/code&gt;  &lt;br /&gt; см. раздел про &lt;a href=\"ru/user-guide/storage/data-types.html#temporal_types\"&gt;временные типы&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;datetime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;datetime&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;целое число в диапазоне &lt;code&gt;[0, 49673 * 86400 * 10^6 - 1]&lt;/code&gt;, &lt;br /&gt; выражает число микросекунд, прошедших с unix-эпохи; &lt;br /&gt; выражаемый диапазон времён: &lt;code&gt;[1970-01-01T00:00:00Z, 2105-12-31T23:59:59.999999Z]&lt;/code&gt;  &lt;br /&gt; см. раздел про &lt;a href=\"ru/user-guide/storage/data-types.html#temporal_types\"&gt;временные типы&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;timestamp&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;timestamp&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;целое число в диапазоне &lt;code&gt;[- 49673 * 86400 * 10^6 + 1, 49673 * 86400 * 10^6 - 1]&lt;/code&gt;, &lt;br /&gt; выражает число микросекунд между двумя таймстемпами типа &lt;code&gt;timestamp&lt;/code&gt;  &lt;br /&gt; см. раздел про &lt;a href=\"ru/user-guide/storage/data-types.html#temporal_types\"&gt;временные типы&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;interval&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;interval&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;произвольная YSON-структура, &lt;br /&gt; физически представляется последовательностью байт, &lt;br /&gt; не может иметь атрибут &lt;code&gt;required=%true&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;any&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;yson&lt;/code&gt; (отличие от &lt;code&gt;type&lt;/code&gt;)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;системный сингулярный тип, возможно единственное значение &lt;code&gt;null&lt;/code&gt; &lt;br /&gt; (заведение отдельной колонки с таким типом не имеет смысла, &lt;br /&gt; мы не ожидаем встретить этот тип в пользовательских таблицах, &lt;br /&gt; но тип полезен для интеграции с YQL)&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;сингулярный тип, возможно единственное значение &lt;code&gt;null&lt;/code&gt;, это тип, отличный от &lt;code&gt;null&lt;/code&gt; &lt;br /&gt; (заведение отдельной колонки с таким типом не имеет особого смысла, &lt;br /&gt; мы не ожидаем встретить этот тип в пользовательских таблицах, &lt;br /&gt; но тип полезен для интеграции с YQL)&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;void&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;void&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Примеры в схеме:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3=utf8\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"442\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-442\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-442\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-442.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3=bool\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"443\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-443\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-443\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-443.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3=yson\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"444\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-444\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-444\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-444.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"temporal_types\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#temporal_types\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Временные типы&lt;/span&gt;&lt;/a&gt;Временные типы&lt;/h3&gt;\n&lt;p&gt;Есть два набора типов для работы со временем. Исторически, первые появившиеся в системе это &lt;code&gt;date&lt;/code&gt;, &lt;code&gt;datetime&lt;/code&gt;, &lt;code&gt;timestamp&lt;/code&gt;, &lt;code&gt;interval&lt;/code&gt;. Эти типы позволяют выражать времена от начала 1970 года до конца 2105 года. Позже появились типы &lt;code&gt;date32&lt;/code&gt;, &lt;code&gt;datetime64&lt;/code&gt;, &lt;code&gt;timestamp64&lt;/code&gt; и &lt;code&gt;interval64&lt;/code&gt;. Эти типы позволяют выражать времена в более широком диапазоне, около 145'000 лет в прошлое и столько же в будущее. Предпочтительнее использовать последние типы, у них более широкий диапазон значений.&lt;/p&gt;\n&lt;p&gt;Все времена подразумевают использование григорианского календаря. При работе с моментами времени в далёком прошлом, стоит иметь ввиду, что YT никак не учитывает &lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9F%D1%80%D0%B8%D0%BD%D1%8F%D1%82%D0%B8%D0%B5_%D0%B3%D1%80%D0%B8%D0%B3%D0%BE%D1%80%D0%B8%D0%B0%D0%BD%D1%81%D0%BA%D0%BE%D0%B3%D0%BE_%D0%BA%D0%B0%D0%BB%D0%B5%D0%BD%D0%B4%D0%B0%D1%80%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;переход на григорианский каледнарь&lt;/a&gt;, который происходил в разных государствах в разное время. YT считает, что григорианский календарь использовался всегда.&lt;/p&gt;\n&lt;h3 id=\"schema_decimal\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#schema_decimal\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Десятичное число / decimal&lt;/span&gt;&lt;/a&gt;Десятичное число / decimal&lt;/h3&gt;\n&lt;p&gt;Значения типа &lt;code&gt;decimal(p, s)&lt;/code&gt; — вещественные числа с указанной точностью.&lt;/p&gt;\n&lt;p&gt;Чтобы задать этот тип в схеме, укажите следующие ключи:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;type_name&lt;/code&gt; - значение &lt;code&gt;decimal&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;precision&lt;/code&gt; - общее число десятичных цифр в представлении числа, &lt;code&gt;precision&lt;/code&gt; должен находиться в диапазоне &lt;code&gt;[1, 35]&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;scale&lt;/code&gt; - число десятичных цифр в представлении числа, которые идут после десятичной точки, &lt;code&gt;scale&lt;/code&gt; должно находится в диапазоне &lt;code&gt;[0, precision]&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример в схеме:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3={\n    type_name=decimal;\n    precision=10;\n    scale=2;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"483\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-483\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-483\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-483.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Значения &lt;code&gt;3.14&lt;/code&gt;, &lt;code&gt;-2.71&lt;/code&gt;, &lt;code&gt;9.99&lt;/code&gt; могут иметь тип &lt;code&gt;decimal(3, 2)&lt;/code&gt; (&lt;code&gt;precision=3&lt;/code&gt;, &lt;code&gt;scale=2&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Тип поддерживает несколько специальных значений: &lt;code&gt;nan&lt;/code&gt;, &lt;code&gt;+inf&lt;/code&gt;, &lt;code&gt;-inf&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"schema_decimal_binary\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#schema_decimal_binary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Описание бинарного представления decimal&lt;/span&gt;&lt;/a&gt;Описание бинарного представления decimal&lt;/h4&gt;\n&lt;p&gt;Для &lt;code&gt;decimal&lt;/code&gt;-чисел есть специальное бинарное представление,&lt;br /&gt;\nкоторое по умолчанию используется во многих форматах, например, &lt;code&gt;yson&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В этом представлении значения типов &lt;code&gt;decimal(p, s)&lt;/code&gt; представляются бинарными строками. Длина бинарной строки&lt;br /&gt;\nзависит от &lt;code&gt;precision&lt;/code&gt;.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Precision&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Число бит в представлении&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Число байт в представлении&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1-9&lt;/td&gt;\n&lt;td&gt;32&lt;/td&gt;\n&lt;td&gt;4&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;10-18&lt;/td&gt;\n&lt;td&gt;64&lt;/td&gt;\n&lt;td&gt;8&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;19-38&lt;/td&gt;\n&lt;td&gt;128&lt;/td&gt;\n&lt;td&gt;16&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;39-76&lt;/td&gt;\n&lt;td&gt;256&lt;/td&gt;\n&lt;td&gt;32&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Чтобы получить бинарное представление &lt;code&gt;decimal&lt;/code&gt;-числа, нужно сделать следующие шаги. Шаги будут проиллюстрированы значениями &lt;code&gt;3.1415&lt;/code&gt;, &lt;code&gt;-2.7182&lt;/code&gt; типа &lt;code&gt;decimal(5, 4)&lt;/code&gt;.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Возьмите целое число, образованное десятичными цифрами значения. Число бит выбирается из &lt;code&gt;precision&lt;/code&gt; по таблице выше. В данном примере — 32-битные числа &lt;code&gt;31415&lt;/code&gt;, &lt;code&gt;-27182&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Запишите число в big-endian представлении. В данном примере — строки &lt;code&gt;\\x00\\x00\\x7A\\xB7&lt;/code&gt;, &lt;code&gt;\\xFF\\xFF\\x95\\xD2&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Инвертируйте старший бит. В данном примере — строки &lt;code&gt;\\x80\\x00\\7A\\xB7&lt;/code&gt;, &lt;code&gt;\\x7F\\xFF\\x95\\xD2&lt;/code&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Целочисленные представления специальных значений &lt;code&gt;nan&lt;/code&gt;, &lt;code&gt;+inf&lt;/code&gt;, &lt;code&gt;-inf&lt;/code&gt; для первого шага представлены в таблице ниже:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Специальное значение&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Целочисленное представление&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;nan&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;INT_MAX&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;+inf&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;INT_MAX - 1&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;-inf&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;- INT_MAX + 1&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Обратите внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;На текущий момент при работе с YQL поддерживаются только &lt;code&gt;decimal&lt;/code&gt; со значением &lt;code&gt;precision&lt;/code&gt; не более 35.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"schema_optional\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#schema_optional\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Опциональный тип / optional&lt;/span&gt;&lt;/a&gt;Опциональный тип / optional&lt;/h3&gt;\n&lt;p&gt;Тип &lt;code&gt;optional&amp;lt;T&amp;gt;&lt;/code&gt; означает, что значение может иметь тип &lt;code&gt;T&lt;/code&gt; или отсутствовать.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Обратите внимание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Каждое применение &lt;code&gt;optional&lt;/code&gt; для типа добавляет новые значения.&lt;br /&gt;\nНапример, тип &lt;code&gt;optional&amp;lt;optional&amp;lt;bool&amp;gt;&amp;gt;&lt;/code&gt; может иметь следующие значения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;внешний &lt;code&gt;optional&lt;/code&gt; не заполнен;&lt;/li&gt;\n&lt;li&gt;внешний &lt;code&gt;optional&lt;/code&gt; заполнен, внутренний не заполнен;&lt;/li&gt;\n&lt;li&gt;все &lt;code&gt;optional&lt;/code&gt; заполнены, значение &lt;code&gt;true&lt;/code&gt; или &lt;code&gt;false&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Старые колонки, в которых заданы атрибуты &lt;code&gt;type=T;required=false&lt;/code&gt;, соответствуют типу &lt;code&gt;optional&amp;lt;T&amp;gt;&lt;/code&gt;, заданному через &lt;code&gt;type_v3&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Чтобы задать тип &lt;code&gt;optional&lt;/code&gt;, укажите ключи:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;type_name&lt;/code&gt; — значение &lt;code&gt;optional&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;item&lt;/code&gt; — описание типа элемента.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Примеры в схеме:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3={\n  type_name=optional;\n  item=string;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"685\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-685\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-685\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-685.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3={\n  type_name=optional;\n  item={\n    type_name=optional;\n    item=bool;\n  }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"686\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-686\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-686\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-686.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"schema_list\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#schema_list\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Список / list&lt;/span&gt;&lt;/a&gt;Список / list&lt;/h3&gt;\n&lt;p&gt;Значения типа &lt;code&gt;list&amp;lt;T&amp;gt;&lt;/code&gt; — списки элементов типа &lt;code&gt;T&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Чтобы задать тип в схеме, укажите ключи:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;type_name&lt;/code&gt; — значение &lt;code&gt;list&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;item&lt;/code&gt; — описание типа элемента.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Примеры в схеме:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3={\n  type_name=list;\n  item=string;\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"711\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-711\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-711\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-711.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3={\n  type_name=list;\n  item={\n    type_name=list;\n    item=double;\n  }\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"712\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-712\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-712\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-712.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"schema_struct\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#schema_struct\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Структура / struct&lt;/span&gt;&lt;/a&gt;Структура / struct&lt;/h3&gt;\n&lt;p&gt;Набор именованных полей с указанными типами значений.&lt;/p&gt;\n&lt;p&gt;Чтобы задать этот тип в схеме, укажите ключи:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;type_name&lt;/code&gt; — значение &lt;code&gt;struct&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;members&lt;/code&gt; — список словарей с ключами:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;name&lt;/code&gt; — имя поля, должно быть непустой utf8-строкой;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;type&lt;/code&gt; — тип поля.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Примеры в схеме:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3={\n  type_name=struct;\n  members=[\n    {\n      name=foo;\n      type=int32;\n    };\n    {\n      name=bar;\n      type={\n        type_name=optional;\n        item=string;\n      }\n    };\n  ]\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"749\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-749\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-749\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-749.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"schema_tuple\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#schema_tuple\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кортеж / tuple&lt;/span&gt;&lt;/a&gt;Кортеж / tuple&lt;/h3&gt;\n&lt;p&gt;Набор безымянных полей с фиксированными типами.&lt;/p&gt;\n&lt;p&gt;Чтобы задать этот тип, в схеме нужно указать следующие ключи:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;type_name&lt;/code&gt; — значение &lt;code&gt;tuple&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;elements&lt;/code&gt; — список словарей с ключами:&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;type&lt;/code&gt; — тип элемента.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример в схеме:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3={\n  type_name=tuple;\n  elements=[\n     {\n       type=double;\n     };\n     {\n       type=double;\n     };\n  ]\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"779\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-779\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-779\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-779.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"schema_variant\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#schema_variant\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вариант / variant&lt;/span&gt;&lt;/a&gt;Вариант / variant&lt;/h3&gt;\n&lt;p&gt;Вариант — строго одно значение из фиксированного набора типов.&lt;br /&gt;\nВариант бывает двух типов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Вариант над структурой. Каждый тип имеет имя (как в структуре) и каждое значение варианта маркировано именем соответствующего элемента варианта;&lt;/li&gt;\n&lt;li&gt;Вариант над кортежем. тогда все элементы безымянные и каждое значение маркируется индексом.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Чтобы задать этот тип, в схеме укажите ключи:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;type_name&lt;/code&gt; — значение &lt;code&gt;variant&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;elements&lt;/code&gt; или &lt;code&gt;members&lt;/code&gt; (но не оба), ключи имеют структуру аналогичную этим ключам в &lt;code&gt;tuple&lt;/code&gt; / &lt;code&gt;struct&lt;/code&gt;:&lt;/li&gt;\n&lt;/ul&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;elements&lt;/code&gt; — для варианта с безымянными элементами, сам ключ содержит список словарей с ключами:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;type&lt;/code&gt; — тип элемента;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;members&lt;/code&gt; — для варианта с именованными элементами, сам ключ содержит список словарей с ключами:\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;name&lt;/code&gt; — имя элемента, должно быть непустой utf8-строкой;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;type&lt;/code&gt; — описание типа элемента.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример в схеме:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3={\n  type_name=variant;\n  members=[\n     {\n       name=int_field;\n       type=int64;\n     };\n     {\n       name=string_field;\n       type=string;\n     };\n  ]\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"847\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-847\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-847\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-847.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3={\n  type_name=variant;\n  elements=[\n     {\n       type=int32;\n     };\n     {\n       type=string;\n     };\n     {\n       type=double;\n     };\n  ]\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"848\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-848\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-848\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-848.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"schema_dict\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#schema_dict\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Словарь / dict&lt;/span&gt;&lt;/a&gt;Словарь / dict&lt;/h3&gt;\n&lt;p&gt;Словарь — это последовательность пар ключ-значение.&lt;br /&gt;\nYTsaurus не проверяет уникальность ключей или их порядок.&lt;br /&gt;\nОднако большая часть клиентов при обработке будет загружать данные в реальный словарь, и значения для повторяющихся ключей будут утеряны.&lt;/p&gt;\n&lt;p&gt;Чтобы задать этот тип, в схеме укажите ключи:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;type_name&lt;/code&gt; — значение &lt;code&gt;dict&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;key&lt;/code&gt; — описание типа ключа;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;value&lt;/code&gt; — описание типа значения.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример в схеме:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3={\n  type_name=dict;\n  key=int64;\n  value={\n    type_name=optional;\n    item=string;\n  };\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"878\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-878\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-878\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-878.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"schema_tagged\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#schema_tagged\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тегированное значение / tagged&lt;/span&gt;&lt;/a&gt;Тегированное значение / tagged&lt;/h3&gt;\n&lt;p&gt;Тип &lt;code&gt;tagged&lt;/code&gt; позволяет аннотировать другие типы строкой. Значением типа &lt;code&gt;tagged&amp;lt;TAG_NAME,T&amp;gt;&lt;/code&gt; может быть любое значение типа &lt;code&gt;T&lt;/code&gt;,&lt;br /&gt;\nоднако сами типы будут считаться различными в тех местах, где YTsaurus сравнивает схемы. Например, когда проверяется возможность объединить две таблицы в одну.&lt;/p&gt;\n&lt;p&gt;Чтобы задать этот тип, в схеме укажите ключи:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;type_name&lt;/code&gt; — значение &lt;code&gt;tagged&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;tag&lt;/code&gt; — имя тега, должно быть непустой utf8-строкой;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;item&lt;/code&gt; — описание типа элемента.&lt;br /&gt;\n—&lt;br /&gt;\nПример в схеме:&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;type_v3={\n  type_name=tagged;\n  tag=\"image/svg\";\n  item=\"string\";\n}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"905\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-905\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-905\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-905.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"formats\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#formats\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Представление сложных типов в форматах&lt;/span&gt;&lt;/a&gt;Представление сложных типов в форматах&lt;/h2&gt;\n&lt;p&gt;Для чтения и записи таблиц используются форматы.&lt;br /&gt;\nНе все форматы поддерживают сложные данные, некоторые из них, например, dsv / schemaful_dsv, будут возвращать ошибку при попытке прочитать сложное значение. Например, &lt;code&gt;Values of type \"any\" are not supported by the chosen format&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"yson\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#yson\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;YSON &lt;/span&gt;&lt;/a&gt;YSON &lt;/h3&gt;\n&lt;p&gt;Существует два YSON представления сложных типов. Различаются представления типов &lt;code&gt;struct&lt;/code&gt; и &lt;code&gt;variant&lt;/code&gt;:&lt;br /&gt;\nпредставление по умолчанию более удобно в использовании,&lt;br /&gt;\nальтернативное представление несколько эффективнее в хранении и обработке.&lt;/p&gt;\n&lt;p&gt;Представления переключаются флагом &lt;code&gt;complex_type_mode&lt;/code&gt;. Возможные значения: &lt;code&gt;named&lt;/code&gt; / &lt;code&gt;positional&lt;/code&gt;.&lt;br /&gt;\nНиже описаны представления типов. Если не указано иное, представление типа не зависит от настройки &lt;code&gt;complex_type_mode&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Есть два представления для типа &lt;code&gt;dict&lt;/code&gt; со строковыми ключами: по умолчанию используется &lt;code&gt;positional&lt;/code&gt; представление в виде списка (так как данные хранятся в YTsaurus). Для удобства восприятия можно включить режим &lt;code&gt;named&lt;/code&gt; с помощью флага &lt;code&gt;string_keyed_dict_mode&lt;/code&gt;.&lt;/p&gt;\n&lt;h4 id=\"yson_primitive\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#yson_primitive\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Примитивные типы&lt;/span&gt;&lt;/a&gt;Примитивные типы&lt;/h4&gt;\n&lt;p&gt;Примитивные типы представляются прямолинейно одним YSON-значением.&lt;br /&gt;\nВ таблице приведено соответствие примитивных типов и YSON-типов.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;&lt;code&gt;type&lt;/code&gt; / &lt;code&gt;type_v3&lt;/code&gt;&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Представление в yson&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;int64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;знаковое число&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;int32&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;знаковое число&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;int16&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;знаковое число&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;int8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;знаковое число&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;uint64&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;беззнаковое число&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;uint32&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;беззнаковое число&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;uint16&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;беззнаковое число&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;uint8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;беззнаковое число&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;double&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;число с плавающей точкой&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;boolean&lt;/code&gt; / &lt;code&gt;bool&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;булево значение&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;string&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;строка&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;utf8&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;строка&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;date&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;беззнаковое число, см ниже&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;datetime&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;беззнаковое число, см ниже&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;timestamp&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;беззнаковое число, см ниже&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;interval&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;знаковое число&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;uuid&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;строка с бинарными данными, см ниже&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;any&lt;/code&gt; / &lt;code&gt;yson&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;зависит от значения&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;null&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;#&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code&gt;void&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code&gt;#&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h5 id=\"yson_time_mode\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#yson_time_mode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Временные типы&lt;/span&gt;&lt;/a&gt;Временные типы&lt;/h5&gt;\n&lt;p&gt;В yson-формате есть опция &lt;code&gt;time_mode&lt;/code&gt;, которая управляет представлением типов &lt;code&gt;date&lt;/code&gt;, &lt;code&gt;datetime&lt;/code&gt;, &lt;code&gt;timestamp&lt;/code&gt;. Ее возможные значения такие:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;binary&lt;/code&gt; (по-умолчанию) — используется представление в виде беззнакового числа, обозначающего число дней / секунд / миллисекунд с начала unix эпохи.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;text&lt;/code&gt; — используется строковое представление, примеры представления &lt;code&gt;date&lt;/code&gt;, &lt;code&gt;datetime&lt;/code&gt;, &lt;code&gt;timestamp&lt;/code&gt; соответственно такие:&lt;br /&gt;\n&lt;code&gt;2022-01-02&lt;/code&gt;, &lt;code&gt;2022-01-02T03:04:05Z&lt;/code&gt;, &lt;code&gt;2022-01-02T03:04:05.123456Z&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h5 id=\"yson_uuid_mode\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#yson_uuid_mode\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;UUID&lt;/span&gt;&lt;/a&gt;UUID&lt;/h5&gt;\n&lt;p&gt;В yson-формате есть опция &lt;code&gt;uuid_mode&lt;/code&gt;, которая управляет представлением типа &lt;code&gt;uuid&lt;/code&gt;. Её возможные значения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;binary&lt;/code&gt; (по умолчанию) — используется бинарное представление из 16 байт.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;text_yt&lt;/code&gt; — используется строковое представление, в формате YTsaurus из 4 групп, например &lt;code&gt;61626364-65666768-696a6b6c-6d6e6f70&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;text_yql&lt;/code&gt; — используется строковое представление, в формате YQL из 5 групп более похожим на представление RFC, например &lt;code&gt;64636261-6665-6867-696a-6b6c6d6e6f70&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"yson_decimal\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#yson_decimal\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Decimal&lt;/span&gt;&lt;/a&gt;Decimal&lt;/h4&gt;\n&lt;p&gt;В YSON формате есть опция &lt;code&gt;decimal_mode&lt;/code&gt;, которая управляет представлением типа &lt;code&gt;decimal&lt;/code&gt;. Ее возможные значения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;binary&lt;/code&gt; (по-умолчанию) — кодируется бинарной строкой с &lt;a href=\"ru/user-guide/storage/data-types.html#schema_decimal_binary\"&gt;бинарным представлением&lt;/a&gt; &lt;code&gt;decimal&lt;/code&gt;-числа.&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;text&lt;/code&gt; — используется текстовое представление &lt;code&gt;decimal&lt;/code&gt;-числа.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h4 id=\"yson_optional\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#yson_optional\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Optional&lt;/span&gt;&lt;/a&gt;Optional&lt;/h4&gt;\n&lt;p&gt;Представление типа &lt;code&gt;optional&lt;/code&gt; зависит от его внутреннего типа.&lt;br /&gt;\nЭто необходимо для обратной совместимости с колонками, для которых проставлено &lt;code&gt;required=%false&lt;/code&gt;.&lt;br /&gt;\nЕсли &lt;code&gt;T&lt;/code&gt; — произвольный тип, который не является &lt;code&gt;optional&lt;/code&gt;, то &lt;code&gt;optional&amp;lt;T&amp;gt;&lt;/code&gt; представляется следующим образом:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Null&lt;/code&gt; значение &lt;code&gt;optional&lt;/code&gt; представляется &lt;code&gt;#&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;в противном случае используется обычное представление значения типа &lt;code&gt;T&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Если &lt;code&gt;T&lt;/code&gt; — тип, который является &lt;code&gt;optional&lt;/code&gt;, то &lt;code&gt;optional&amp;lt;T&amp;gt;&lt;/code&gt; представляется следующим образом:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Null&lt;/code&gt; значение внешнего &lt;code&gt;optional&lt;/code&gt; представляется &lt;code&gt;#&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;в противном случае используется представление &lt;code&gt;[ v ]&lt;/code&gt; (yson-список длины 1), где &lt;code&gt;v&lt;/code&gt; — YSON-представление значения типа &lt;code&gt;T&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Примеры значений, тип &lt;code&gt;optional&amp;lt;int64&amp;gt;&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;#\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1199\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1199\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1199\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1199.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;-42\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1200\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1200\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1200\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1200.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;p&gt;Примеры значений, тип &lt;code&gt;optional&amp;lt;optional&amp;lt;int64&amp;gt;&amp;gt;&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;#\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1204\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1204\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1204\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1204.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[ # ]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1205\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1205\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1205\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1205.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[ -42 ]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1206\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1206\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1206\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1206.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"yson_list\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#yson_list\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;List&lt;/span&gt;&lt;/a&gt;List&lt;/h4&gt;\n&lt;p&gt;Тип &lt;code&gt;list&amp;lt;T&amp;gt;&lt;/code&gt; кодируется YSON-списком, элементы которого представляют собой кодированное представление элементов типа &lt;code&gt;T&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Примеры значений, тип &lt;code&gt;list&amp;lt;int64&amp;gt;&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1216\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1216\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1216\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1216.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[42; -1;]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1217\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1217\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1217\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1217.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"yson_struct\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#yson_struct\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Struct&lt;/span&gt;&lt;/a&gt;Struct&lt;/h4&gt;\n&lt;p&gt;Представление структуры зависит от значения флага &lt;code&gt;complex_type_mode&lt;/code&gt;.&lt;/p&gt;\n&lt;h5 id=\"yson_struct_named\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#yson_struct_named\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Именованное представление (по умолчанию)&lt;/span&gt;&lt;/a&gt;Именованное представление (по умолчанию)&lt;/h5&gt;\n&lt;p&gt;Описываемое представление для случая,&lt;br /&gt;\nкогда опция YSON формата &lt;code&gt;complex_type_mode&lt;/code&gt; не выставлена или выставлено значение &lt;code&gt;complex_type_mode=named&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Структура представлена YSON-словарём, где ключи — имена полей, а значения — их содержимое.&lt;/p&gt;\n&lt;p&gt;Примеры значений, тип &lt;code&gt;struct&amp;lt;Foo:int64;Bar:optional&amp;lt;utf8&amp;gt;&amp;gt;&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{Foo=42;Bar=#;}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1236\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1236\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1236\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1236.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;{Foo=-5;Bar=\"minus five\";}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1237\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1237\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1237\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1237.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h5 id=\"yson_struct_positional\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#yson_struct_positional\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Позиционное представление&lt;/span&gt;&lt;/a&gt;Позиционное представление&lt;/h5&gt;\n&lt;p&gt;В случае, если для YSON-формата выставлена опция &lt;code&gt;complex_type_mode=positional&lt;/code&gt;, используется другое представление.&lt;/p&gt;\n&lt;p&gt;Структура кодируется YSON-списком, где на i-й позиции стоит YSON-представление i-го поля структуры.&lt;br /&gt;\nДлина списка может быть меньше, чем число полей в структуре, тогда оставшиеся типы должны иметь тип &lt;code&gt;optional&amp;lt;T&amp;gt;&lt;/code&gt;,&lt;br /&gt;\nи считается, что поля имеют пустое &lt;code&gt;optional&lt;/code&gt; значение.&lt;/p&gt;\n&lt;p&gt;Примеры значений, тип &lt;code&gt;struct&amp;lt;Foo:int64;Bar:optional&amp;lt;utf8&amp;gt;&amp;gt;&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[42; #;]\n[42]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1250\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1250\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1250\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1250.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[-5;\"minus five\";]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1251\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1251\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1251\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1251.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"yson_tuple\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#yson_tuple\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tuple&lt;/span&gt;&lt;/a&gt;Tuple&lt;/h4&gt;\n&lt;p&gt;Тип &lt;code&gt;tuple&lt;/code&gt; кодируется YSON-списком фиксированной длины. На i-м месте стоит кодированное значение i-го поля.&lt;/p&gt;\n&lt;p&gt;Примеры значений, тип &lt;code&gt;tuple&amp;lt;int64;optional&amp;lt;utf8&amp;gt;&amp;gt;&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[42; #;]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1261\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1261\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1261\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1261.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[-5;\"minus five\";]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1262\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1262\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1262\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1262.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h4 id=\"yson_variant\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#yson_variant\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Variant&lt;/span&gt;&lt;/a&gt;Variant&lt;/h4&gt;\n&lt;h5 id=\"yson_variant_tuple\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#yson_variant_tuple\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Неименованный variant&lt;/span&gt;&lt;/a&gt;Неименованный variant&lt;/h5&gt;\n&lt;p&gt;Неименованный вариант представлен YSON-списком длины 2 из следующих элементов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;номер альтернативы (индексация с 0);&lt;/li&gt;\n&lt;li&gt;кодированное значение соответствующей альтернативы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Примеры значений, тип &lt;code&gt;variant&amp;lt;int64;optional&amp;lt;utf8&amp;gt;&amp;gt;&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[0; 42]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1287\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1287\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1287\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1287.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[1; #]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1288\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1288\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1288\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1288.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[1; \"foo bar\";]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1289\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1289\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1289\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1289.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n&lt;h5 id=\"yson_variant_struct\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#yson_variant_struct\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Именованный вариант variant&lt;/span&gt;&lt;/a&gt;Именованный вариант variant&lt;/h5&gt;\n&lt;h6 id=\"yson_variant_struct_named\"&gt;&lt;a href=\"ru/user-guide/storage/data-types.html#yson_variant_struct_named\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Именованное представление (по умолчанию)&lt;/span&gt;&lt;/a&gt;Именованное представление (по умолчанию)&lt;/h6&gt;\n&lt;p&gt;Описываемое представление для случая, когда опция YSON-формата &lt;code&gt;complex_type_mode&lt;/code&gt; не выставлена или выставлена в значение &lt;code&gt;complex_type_mode=named&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Именованный вариант представляется YSON-списком длины 2 из следующих элементов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;имя альтернативы;&lt;/li&gt;\n&lt;li&gt;кодированное значение соответствующей альтернативы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Примеры значений, тип `variant&amp;lt;Foo:int64;Bar:optional&amp;gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[Foo; 42]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1317\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1317\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1317\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1317.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-clipboard\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;[Bar; #]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;button class=\"yfm-clipboard-button\"&gt;\n            &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-clipboard-icon\" data-animation=\"1318\"&gt;\n                &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                    &lt;animate id=\"visibileAnimation-1318\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                    &lt;animate id=\"hideAnimation-1318\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1318.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                &lt;/path&gt;\n            &lt;/svg&gt;\n        &lt;/button&gt;\n    &lt;/
